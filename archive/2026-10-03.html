eir data. Some people are now giving agents full use of their computers, including all of their messages, files, passwords, and accounts. That's a lot of trust, especially when it's not that difficult to \"hack\" one of these agents for malicious purposes with a poisoned prompt hidden on a website , which could lead your AI agent to hand hackers the keys to your bank accounts. That's no good. Apple is making it much more difficult for you to put yourself in this situation How does Apple feel about this? The company is famously behind on the software side of AI it only rolled out its AI-powered version of Siri in September but its AI hardware business is booming. When the AI agent craze first took off with projects like Moltbot , customers bought Mac minis in droves in order to run those programs. Now, Apple advertises its various Macs with AI at the forefront: It doesn't offer its own models like OpenAI or Anthropic, but it's making plenty of money selling you the hardware to run those models. Perhaps that's why Apple seems quite concerned about the AI agent trend, particularly when it comes to the data users are exposing to run these programs. Apple is all about privacy and security, and as such, I can only imagine the company watching in horror as so many users willingly hand their Macs (and all of their data) over to automated AI bots. Against that backdrop, the company posted an update on its developer forum entitled \" Updates to Full Disk Access in macOS .\" In it, the company highlights the dangers of developers asking users to grant \"Full Disk Access\" permissions to an app. Apple says this function has been traditionally reserved for backup apps that need to access the entire disk to function. (After all, if your backup app can't access your entire Mac, how can it back up your entire Mac?) But now, Apple says developers are asking users to expose everything on their Macs, ", "date_str": "2026-10-02T20:30:00+00:00", "hash": "887d9abe977e0c55", "title_fa": "اپل می خواهد اجرای هوش مصنوعی Agentic را در مک شما سخت تر کند", "summary_fa": "به نظر می‌رسد هوش مصنوعی عاملی همه‌جانبه است: عوامل جدید OpenAI، \"Dots\" در این هفته عرضه شدند، در حالی که Meta's Muse به تازگی پنج میلیون دانلود را پشت سر گذاشته است. شرکت‌های هوش مصنوعی به جای اینکه صرفاً با آنها چت کنند یا از آنها برای تولید تصاویر استفاده کنند، از کاربران می‌خواهند که از ربات‌های خود بخواهند کارهایی را از طرف آنها انجام دهند، از مدیریت صندوق ورودی‌شان گرفته تا سفارش شام. اما عامل ها تنها گام منطقی بعدی برای هوش مصنوعی به عنوان یک فناوری نیستند. وقتی ضعیف اجرا شوند، می توانند بسیار خطرناک باشند. عوامل هوش مصنوعی به گونه‌ای طراحی شده‌اند که به تنهایی کار کنند، و برای انجام این کار، اغلب نیاز به دسترسی تقریباً کامل به دستگاه‌های شما و داده‌های آن‌ها دارند. برخی از افراد در حال حاضر به نمایندگان استفاده کامل از رایانه های خود، از جمله همه پیام ها، فایل ها، رمز عبور و حساب های خود را می دهند. این اعتماد زیادی است، به خصوص زمانی که «هک کردن» یکی از این عوامل برای اهداف مخرب با یک پیام مسموم پنهان در یک وب‌سایت، که می‌تواند عامل هوش مصنوعی شما را وادار کند تا کلید حساب‌های بانکی شما را به هکرها بدهد، چندان دشوار نباشد. این خوب نیست. اپل کار را برای شما سخت‌تر می‌کند تا خودتان را در این موقعیت قرار دهید. این شرکت در بخش نرم‌افزاری هوش مصنوعی عقب مانده است و تنها در ماه سپتامبر نسخه Siri مبتنی بر هوش مصنوعی خود را عرضه کرد، اما تجارت سخت‌افزار هوش مصنوعی آن در حال رونق است. هنگامی که شوق عامل هوش مصنوعی برای اولین بار با پروژه هایی مانند Moltbot شروع شد، مشتریان برای اجرای آن برنامه ها، Mac mini را به صورت دسته جمعی خریداری کردند. اکنون، اپل مک‌های مختلف خود را با هوش مصنوعی در خط مقدم"}, {"source": "Lifehacker", "title": "Changing This Setting May Extend Your Battery Life on iOS 27", "link": "https://lifehacker.com/tech/changing-this-setting-may-save-you-battery-life-on-ios-27?utm_medium=RSS", "summary": "If you've updated your iPhone to iOS 27 , you might have already put Siri AI to the test or tried out some of Apple's AI-powered photo editing features . But you may have also noticed something else: Your iPhone's battery isn't lasting as long between charges. While I can't say this is a universal experience (I'm don't believe my iPhone is dying faster on iOS 27 than it did on iOS 26), some users are adamant the update has had a detrimental effect on their battery life. And while there are many possible factors here, some think they have found the culprit: a feature called Connectivity Assist. What is Connectivity Assist? Connectivity Assist's mission is noble. The feature is designed to tap into cellular data any time your wifi connection grows too weak. In theory, it should be particularly useful when you're leaving an area with wifi; rather than deal with the slow loading times a weak wifi connection forces you to endure before it disconnects outright, your cellular network would kick in to maintain your speed. (Once you've left wifi range, you'd be back on cellular completely either way, of course.) Technically, this feature isn't new. Before iOS 27, Apple called it \"Wi-Fi Assist,\" but it worked a bit differently. In iOS 26, Wi-Fi Assist simply switches over to cellular when your wifi signal is too weak. With iOS 27's Connectivity Assist, it seems your iPhone can tap into both networks at the same time. If so, that may play some role in why this rejiggered feature seems to be dragging down people's batteries more than it used to. There's another new addition with Connectivity Assist that could also be part of the problem: Unlike Wi-Fi Assist, Connectivity Assist sends DNS requests over cellular data , which can bypass the rules that ad blockers put in place to stop pop-ups from making their way into your iPhone. As such, even Apple recommends that you disable Connectivity Assist if you use an ad blocker. So, if your iPhone is constantly sending out DNS requests while on cellular data, bypassing your active ad blockers, that could be putting extra strain on your battery, too. How to disable Connectivity Assist in iOS 27 Reddit user ZoteTheMitey shared their experience on the r/iPhone subreddit , claiming that their iPhone 15 Pro Max, with 89% battery health, was only lasting for three to four hours following the switch to iOS 27. Once they disabled Connectivity Assistant, they claim their battery usage time jumped to seven hours. Some users in the threa", "date_str": "2026-10-02T19:30:00+00:00", "hash": "183e2969da7a367f", "title_fa": "تغییر این تنظیمات ممکن است عمر باتری شما را در iOS 27 افزایش دهد", "summary_fa": "اگر آیفون خود را به iOS 27 به‌روزرسانی کرده‌اید، ممکن است قبلاً هوش مصنوعی سیری را آزمایش کرده باشید یا برخی از ویژگی‌های ویرایش عکس مبتنی بر هوش مصنوعی اپل را امتحان کرده باشید. اما ممکن است به چیز دیگری نیز توجه کرده باشید: باتری آیفون شما بین شارژها دوام نمی آورد. در حالی که نمی توانم بگویم که این یک تجربه جهانی است (من معتقد نیستم که آیفون من در iOS 27 سریعتر از iOS 26 از بین می رود)، برخی از کاربران قاطعانه معتقدند که به روز رسانی تاثیر مخربی بر عمر باتری آنها داشته است. و در حالی که بسیاری از عوامل ممکن در اینجا وجود دارد، برخی فکر می کنند که مقصر را پیدا کرده اند: قابلیتی به نام Connectivity Assist. Connectivity Assist چیست؟ ماموریت Connectivity Assist نجیب است. این ویژگی به گونه‌ای طراحی شده است که هر زمان که اتصال وای‌فای شما خیلی ضعیف شود، از داده‌های تلفن همراه استفاده کند. در تئوری، زمانی که منطقه ای را با وای فای ترک می کنید، باید مفید باشد. به جای مقابله با زمان‌های بارگذاری کند که یک اتصال ضعیف وای‌فای شما را مجبور می‌کند قبل از قطع کامل آن را تحمل کنید، شبکه تلفن همراه شما برای حفظ سرعت شما وارد عمل می‌شود. (البته وقتی محدوده وای فای را ترک کردید، در هر صورت کاملاً به شبکه تلفن همراه باز می گردید.) از نظر فنی، این ویژگی جدید نیست. قبل از iOS 27، اپل آن را \"Wi-Fi Assist\" می نامید، اما کمی متفاوت عمل می کرد. در iOS 26، هنگامی که سیگنال وای فای شما خیلی ضعیف باشد، Wi-Fi Assist به سادگی به شبکه تلفن همراه تبدیل می شود. با کمک اتصال iOS 27، به نظر می رسد آیفون شما می تواند همزمان به هر دو شبکه دسترسی داشته باشد. اگر اینطور است، ممکن است نقشی"}, {"source": "Lifehacker", "title": "Why I Think the Apple Watch Series 12 Is Worth the Upgrade", "link": "https://lifehacker.com/tech/apple-watch-series-12-worth-the-upgrade?utm_medium=RSS", "summary": "We may earn a commission from links on this page. When Apple releases a new watch, it s not always worth upgrading. Last year s Series 11 only had a few barely noticeable features to recommend it over the 10, and we said it s probably one to skip if you re happy with your current watch. But the Series 12 is different, and this one is worth the upgrade no matter which Apple Watch you re coming from. Apple Watch Series 12 (GPS, 42mm) $389.99 at Amazon Learn More Learn More $389.99 at Amazon One of the biggest reasons to upgrade is that the Series 12's new processor (called, confusingly, the S11 chip) can support some features older Apple Watches can't. That's why only the new models are getting step counts, for example; Apple chose to implement those in a way that only the new hardware can calculate. Whenever there's a break in software compatibility, it makes sense to get the newer model. I'd expect more features are coming in future years that will be back-compatible with the 12 but not earlier models. The heart rate sensor is a big upgrade Apple upgraded the hardware on the back of the watch that optically reads your heartbeats. (This new sensor is in both the Series 12 and the Ultra 4 .) I ve tested its accuracy, and found it s substantially better than the sensors in previous Apple Watches like the Series 10 and 11. If you train by heart rate during workous , or if you use heart rate data after the fact to evaluate and plan your training, the upgrade is worth it. Apple claims it provides the most accurate heart rate of any wearable. I tested that claim and can partially agree: It s as good as Garmin s top-of-the-line sensor. I wouldn t say it s better than Garmin s, but the two are tied in my book for the best wrist-worn sensor. ( Chest straps are better than any wrist-based system , of course.) Steps on the watch face are a nice plus I wouldn t buy a new Apple Watch just for the step count, but it s a nice upgrade and one I deeply appreciate. I can add a step count complication to my watch face (I have it in a corner of the Modular face right now) and I have step count pinned to my Smart Stack. If you don t upgrade, you use use a third-party step counter to provide a complication for your watch face. But it s nice that Apple finally has this feature built in. Apple says its step counts are the most accurate; I ll be testing that claim soon. Readiness and recovery HRV are another nice extra The Apple Watch was always capable of measuring HRV, but until ", "date_str": "2026-10-02T18:00:00+00:00", "hash": "8dc58774c2ef3092", "title_fa": "چرا فکر می کنم اپل واچ سری 12 ارزش ارتقا را دارد؟", "summary_fa": "ممکن است از پیوندهای موجود در این صفحه کمیسیون دریافت کنیم. وقتی اپل یک ساعت جدید عرضه می‌کند، همیشه ارزش ارتقا ندارد. سری 11 سال گذشته تنها دارای چند ویژگی بود که به سختی قابل توجه بود که آن را به 10 توصیه می کرد، و ما گفتیم که اگر از ساعت فعلی خود راضی هستید احتمالاً از آن صرف نظر کنید. اما سری 12 متفاوت است و این یکی بدون توجه به اینکه از کدام اپل واچ می آیید ارزش ارتقا دارد. اپل واچ سری 12 (GPS، 42 میلی متر) 389.99 دلار در آمازون بیشتر بیاموزید 389.99 دلار در آمازون یکی از بزرگترین دلایل ارتقاء این است که پردازنده جدید سری 12 (به طور گیج کننده، تراشه S11 نامیده می شود) می تواند برخی از ویژگی هایی را که اپل واچ های قدیمی تر نمی توانند پشتیبانی کند. به همین دلیل است که برای مثال فقط مدل‌های جدید شمارش گام‌ها را دریافت می‌کنند. اپل تصمیم گرفت آن‌ها را به گونه‌ای پیاده‌سازی کند که فقط سخت‌افزار جدید بتواند آن را محاسبه کند. هر زمان که در سازگاری نرم‌افزار وقفه‌ای ایجاد شود، خرید مدل جدیدتر منطقی است. من انتظار دارم ویژگی های بیشتری در سال های آینده ارائه شود که با مدل های 12 و نه قبلی سازگار باشد. حسگر ضربان قلب یک ارتقاء بزرگ است که اپل سخت افزار پشت ساعت را ارتقا داد که ضربان قلب شما را به صورت نوری می خواند. (این سنسور جدید هم در سری 12 و هم در اولترا 4 است.) من دقت آن را آزمایش کردم و متوجه شدم که بسیار بهتر از سنسورهای اپل واچ های قبلی مانند سری 10 و 11 است. اگر در حین کار بر اساس ضربان قلب تمرین می‌کنید، یا اگر از داده‌های ضربان قلب بعد از این واقعیت برای ارزیابی و برنامه‌ریزی تمرین خود استفاده می‌کنید، ارتقا"}, {"source": "Lifehacker", "title": "October Prime Day 2026 Live Blog: The Best Deals on Headphones, TVs, Fitness Tech, and More", "link": "https://lifehacker.com/tech/amazon-october-early-prime-day-live-blog-10-02-2026?utm_medium=RSS", "summary": "We may earn a commission from links on this page. Deal pricing and availability subject to change after time of publication. No, you're not having d j vu: Amazon did just have a big sale in July. This time, though, it's their fall sale Prime Big Deal Days, better known as October Prime Day . The sale is officially underway from Oct. 6-7, but there have been an abundance of early sales , and we're all over it. Remember to check price tracking tools so you can trust that the sales we're talking about are actually good deals, and not just hype . Remember, you need to be a Prime Member to have access to all of Amazon's Prime Day deals and to get free shipping. Prime membership starts at $14.99 per month ($139 per year) and comes with more benefits than people think . It's easy to figure out if a yearly Prime membership is worth it for you , but remember, you can always cancel your Prime membership once the sale is over, as Amazon offers free 30-day trials . In theory, you can shop the whole event and still have time to cancel before you get charged. For a glimpse at the best deals as we find them, check out our live blog of the event below, which features the Lifehacker team's coverage of Prime Day . We'll continue highlighting new deals as we find them. Our sister brands have live blogs worth checking out too, including CNET , PCMag , ZDNET , and Mashable .", "date_str": "2026-10-02T17:30:00+00:00", "hash": "f353ee4c8217ae32", "title_fa": "وبلاگ زنده اکتبر Prime Day 2026: بهترین تخفیف‌ها در مورد هدفون، تلویزیون، فناوری تناسب اندام و موارد دیگر", "summary_fa": "ممکن است از پیوندهای موجود در این صفحه کمیسیون دریافت کنیم. قیمت معامله و در دسترس بودن ممکن است پس از زمان انتشار تغییر کند. نه، شما d j vu ندارید: آمازون در ماه جولای فروش بزرگی داشت. با این حال، این بار، این روز فروش پاییزی Prime Big Deal Days است که بیشتر به عنوان روز اول اکتبر شناخته می‌شود. فروش به طور رسمی از 6 تا 7 اکتبر در جریان است، اما فروش های اولیه فراوانی وجود داشته است، و ما در حال انجام آن هستیم. به یاد داشته باشید که ابزارهای ردیابی قیمت را بررسی کنید تا بتوانید اعتماد کنید که فروش هایی که در مورد آن صحبت می کنیم در واقع معاملات خوبی هستند و فقط تبلیغات تبلیغاتی نیستند. به یاد داشته باشید، برای دسترسی به تمام معاملات پرایم روز آمازون و دریافت ارسال رایگان، باید عضو اصلی باشید. عضویت Prime از 14.99 دلار در ماه (139 دلار در سال) شروع می شود و مزایای بیشتری نسبت به آنچه مردم فکر می کنند دارد. تشخیص اینکه آیا عضویت سالانه Prime برای شما ارزش دارد یا نه، آسان است، اما به یاد داشته باشید، همیشه می‌توانید پس از پایان فروش، عضویت Prime خود را لغو کنید، زیرا آمازون آزمایش‌های 30 روزه رایگان ارائه می‌دهد. در تئوری، می‌توانید از کل رویداد خرید کنید و هنوز زمان دارید تا قبل از دریافت هزینه، آن را لغو کنید. برای نگاهی اجمالی به بهترین معاملات در صورت یافتن آنها، وبلاگ زنده ما را در مورد رویداد زیر بررسی کنید، که شامل پوشش تیم Lifehacker از Prime Day است. به محض یافتن معاملات جدید، به برجسته کردن آنها ادامه خواهیم داد. مارک‌های خواهر ما نیز وبلاگ‌های زنده‌ای دارند که ارزش بررسی دارند، از جمله CNET، PCMag، ZDNET، و Mashable. افزودن به عنوان منبع ترجیحی در Google افزودن به عنوان منبع برگزیده در"}, {"source": "Lifehacker", "title": "Four Major Issues Are Plaguing the iPhone 18 Pro and 18 Pro Max", "link": "https://lifehacker.com/tech/major-issues-with-the-iphone-18-pros?utm_medium=RSS", "summary": "We may earn a commission from links on this page. On paper, the iPhone 18 Pro and iPhone 18 Pro Max are Apple's best smartphones yet. They run the new A20 chip, feature cameras that use a revolutionary variable aperture , and, according to Apple, have the longest battery life of any iPhone ever. And yet, the iPhone 18 Pro's launch has been a rocky one, beset by glitches and hardware issues that range in severity. Some have been fixed by simple software updates, while others remain unresolved. None of this is to encourage you to return your iPhone 18 Pro or discourage you from buying one if you have your sights set on Apple's newest Pro phones. However, it's important to note that this has hardly been a drama-free rollout. As of this article, these are the four major problems I've seen with the iPhone 18 Pro and iPhone 18 Pro Max. iPhone 18 Pros were randomly rebooting The first iPhone 18 Pro issue that I saw was random reboots . Users complained that, after a failed Face ID attempt, their iPhones would freeze up and, after a short period of time, reboot. Curiously, Apple's newest Apple Watches, the Series 12 and Ultra 4, had similar reboot issues . While annoying, this was clearly just a glitch with Apple's newest iPhones running iOS 27 and Apple Watches running watchOS 27. The company quickly released patches for all devices in iOS 27.0.1 and watchOS 27.0.1, each of which only mentioned this singular patch in the release notes. iPhone 18 Pro Max might not be able to dial 911 While Apple says iOS 27.0.1 only patches this reboot glitch, AT T says otherwise. The company sent alerts to iPhone 18 Pro Max users this week urging them to update to this latest version of iOS, warning that iPhone 18 Pro users might not be able to text, call, or connect to data at times, including when dialing 911. The full message reads: \"Hi, it's AT T. Action needed: An important Apple software update for your iPhone 18 Pro Max is available. Some phones may be unable to complete calls/text/data, including to 911. Update to iOS 27.0.1 immediately Settings General Software Update. Please contact AT T or Apple if you have questions.\" As it happens, iPhone 18 Pro users are not included in this alert. As MacRumors speculates , it might have something to do with the iPhone 18 Pro Max's modem. This is the only new iPhone this year to ship with a Qualcomm modem rather than Apple's own C2 modem. As MacRumors notes, affected iPhone 18 Pro Max users can lose service, forcing their phones to ", "date_str": "2026-10-02T16:30:00+00:00", "hash": "7c3f378f40ea53ba", "title_fa": "چهار مشکل اصلی آیفون 18 پرو و ​​18 پرو مکس را درگیر کرده است", "summary_fa": "ممکن است از پیوندهای موجود در این صفحه کمیسیون دریافت کنیم. روی کاغذ، آیفون 18 پرو و ​​آیفون 18 پرو مکس بهترین گوشی های هوشمند اپل هستند. آن‌ها تراشه جدید A20 را اجرا می‌کنند، دارای دوربین‌هایی هستند که از دیافراگم متغیر انقلابی استفاده می‌کنند و به گفته اپل، طولانی‌ترین عمر باتری را در بین آیفون‌های تاریخ دارند. و با این حال، عرضه آیفون 18 پرو با اشکالات و مشکلات سخت افزاری که از نظر شدت متفاوت است، بسیار دشوار بوده است. برخی از آنها با به روز رسانی های نرم افزاری ساده رفع شده اند، در حالی که برخی دیگر حل نشده باقی می مانند. هیچ‌کدام از این‌ها برای تشویق شما به بازگرداندن آیفون 18 پرو یا منصرف کردن شما از خرید آن نیست، اگر قصد دارید جدیدترین تلفن‌های پرو اپل را انتخاب کنید. با این حال، مهم است که توجه داشته باشید که این به ندرت یک عرضه بدون درام بوده است. در این مقاله، اینها چهار مشکل اصلی هستند که من در مورد آیفون 18 پرو و ​​آیفون 18 پرو مکس دیده‌ام. آیفون 18 پرو به صورت تصادفی راه اندازی مجدد می شد اولین مشکل آیفون 18 پرو که دیدم، راه اندازی مجدد تصادفی بود. کاربران شکایت داشتند که پس از تلاش ناموفق Face ID، آیفون‌های آن‌ها فریز می‌شود و پس از مدت کوتاهی راه‌اندازی مجدد می‌شود. عجیب است که جدیدترین اپل واچ های اپل، سری 12 و اولترا 4، مشکلات راه اندازی مجدد مشابهی داشتند. اگرچه آزاردهنده بود، اما واضح است که این فقط یک نقص در جدیدترین آیفون های اپل با سیستم عامل iOS 27 و ساعت های اپل با سیستم عامل watchOS 27 بود. این شرکت به‌سرعت وصله‌هایی را برای همه دستگاه‌ها در iOS 27.0.1 و watchOS 27.0.1 منتشر کرد که هر کدام فقط به این وصله منحصر به فرد در یادداشت‌های انتشار اشاره کردند."}, {"source": "Lifehacker", "title": "15 Hacks Every Opera Browser User Should Know", "link": "https://lifehacker.com/tech/15-hacks-every-opera-browser-user-should-know?utm_medium=RSS", "summary": "The Opera you're using today is obviously a very different browser from the one it was decades ago. Perhaps the most significant change is that it's now a Chromium-based browser, which means you can install Chrome extensions to fill any features you may be missing. That said, the browser still retains its core philosophy of shipping useful integrated features even if those options aren't always obvious. From bypassing unskippable YouTube ads to using a built-in volume booster for every tab, here are the best Opera hacks you should know about: Use \"Early Bird\" to try experimental features before release If you live on the bleeding edge of tech, you can use Opera's \"Early Bird\" to try all kinds of experimental features. To do so, click the three-line menu in Opera's toolbar, scroll to the bottom, then select Go to full browser settings . Now, enable Early Bird , go through the list of features on the page, and enable the ones you wish to try. At the time of writing, these features include Browser Connector, which connects the browser to ChatGPT or Claude, and Sharing Point, which adds a button to share an Opera download link with your contacts. Note that these features can change or be removed at any time. Use the sidebar to replace social media and chat apps on your computer Opera has a sidebar that lets you install \"apps\" within your browser. It supports ChatGPT, Gemini, Gmail, Google Calendar, Google Translate, WhatsApp, Telegram, Instagram, Bluesky, music streaming services, and a few more apps. These services are pinned to the left pane, and function as their corresponding apps do. You can think of these as pinned tabs in your browser, which are all neatly stacked in the left pane. I've used the sidebar to run Apple Music, a few messenger apps, and Gmail, which is easier to track than the same services in different apps. Of course, the sidebar versions of these services may not always have all the features that proper desktop apps do (e.g., music downloads on Spotify), but the overall implementation is quite good. Sidebar apps appear in a floating window in Opera, and you can pin that window to the screen if you wish to. You can configure the Opera sidebar by clicking the three-dots button in the bottom-left corner of the screen. Use Split Screen mode for multitasking between tabs You can open two tabs side by side in Opera for improved multitasking. To start, right-click an inactive tab in the tab bar and select Create split screen . This will place th", "date_str": "2026-10-02T15:00:00+00:00", "hash": "b104cb4dafa1eaa9", "title_fa": "15 هک که هر کاربر مرورگر اپرا باید بداند", "summary_fa": "اپرا که امروز از آن استفاده می کنید، آشکارا یک مرورگر بسیار متفاوت با مرورگر چند دهه پیش است. شاید مهم‌ترین تغییر این باشد که اکنون یک مرورگر مبتنی بر Chromium است، به این معنی که می‌توانید افزونه‌های Chrome را برای پر کردن هر ویژگی که ممکن است از دست داده‌اید نصب کنید. با این حال، مرورگر هنوز فلسفه اصلی خود را حفظ کرده است، حتی اگر این گزینه ها همیشه واضح نباشند. از دور زدن تبلیغات غیرقابل رد شدن YouTube گرفته تا استفاده از تقویت‌کننده حجم داخلی برای هر تب، در اینجا بهترین هک‌های اپرا هستند که باید در مورد آنها بدانید: از \"Early Bird\" برای آزمایش ویژگی‌های آزمایشی قبل از انتشار استفاده کنید اگر در لبه‌های پیشرفته فناوری زندگی می‌کنید، می‌توانید از \"Early Bird\" اپرا برای امتحان انواع ویژگی‌های آزمایشی استفاده کنید. برای انجام این کار، روی منوی سه خطی در نوار ابزار Opera کلیک کنید، به پایین بروید، سپس برو به تنظیمات کامل مرورگر را انتخاب کنید. اکنون، Early Bird را فعال کنید، لیست ویژگی های صفحه را مرور کنید و مواردی را که می خواهید امتحان کنید فعال کنید. در زمان نگارش این مقاله، این ویژگی ها عبارتند از Browser Connector که مرورگر را به ChatGPT یا Claude متصل می کند، و Sharing Point که دکمه ای برای اشتراک گذاری لینک دانلود Opera با مخاطبین شما اضافه می کند. توجه داشته باشید که این ویژگی ها می توانند در هر زمان تغییر یا حذف شوند. از نوار کناری برای جایگزینی برنامه های رسانه های اجتماعی و چت در رایانه خود استفاده کنید Opera یک نوار کناری دارد که به شما امکان می دهد \"برنامه ها\" را در مرورگر خود نصب کنید. این برنامه از ChatGPT، Gemini، Gmail، Google Calendar، Google Translate، WhatsApp، Telegram، Instagram، Bluesky، خدمات پخش موسیقی و چند برنامه دیگر پشتیبانی می کند. این"}],
      media: [{"source": "Billboard", "title": "Jimmy Barnes Pays Tribute to Angry Anderson With Rose Tattoo Cover", "link": "https://www.billboard.com/music/rock/jimmy-barnes-angry-anderson-tribute-rose-tattoo-cover-1236353768/", "summary": "Jimmy Barnes has paid tribute to his late friend Angry Anderson , releasing a cover of Rose Tattoo’s “ Rock ’n’ Roll Is King ” following the Australian rock icon’s death. Anderson, the longtime Rose Tattoo frontman born Gary Anderson, died on Sept. 21 at age 79, weeks after suffering a heart attack. “It is with great sadness we announce the passing of Gary ‘Angry’ Anderson on the eve of Monday 21 September 2026, surrounded by his loved ones here in Australia,” his family said in a statement. “Angry was a devoted father, and much-loved bandmate, friend, and member of the wider music and entertainment community.” Barnes had recorded his version of “Rock ’n’ Roll Is King” — originally from Rose Tattoo’s 1981 album Assault Battery — before Anderson’s death, having intended it for his most recent album. He decided to release it as a tribute after his friend’s passing, with all proceeds going to Australian music-industry charity Support Act. In a lengthy statement, Barnes reflected on a friendship that dated back to his early days in Cold Chisel, when the two bands crossed paths constantly. “We shared stages, we shared crew members, we even shared equipment at times. Rock’n’roll was king and we were all young, taking on the world together,” he wrote, calling Anderson “my friend; my brother in arms.” He described Rose Tattoo as “the ultimate rock band,” adding: “They showed those so-called hard rock bands overseas how it was REALLY done.” Barnes said he had spoken to Anderson about covering the song before his death. “I spoke to Angry about covering that song for my last album and he was excited,” he wrote. “I couldn’t wait to sit down with Angry and play it to him because the song takes on a whole new meaning for me now, looking back through all those years and all those gigs.” He closed: “I won’t keep any money it makes, I just want to tip my hat to my mate… Turn it up f ing LOUD. Angry’s gone to the Big Gig upstairs but I bet he’ll be listening.” Anderson fronted Rose Tattoo from the band’s 1976 formation in Sydney, leading them through albums including their 1978 self-titled debut and Assault Battery . Though never major chart forces in the U.S., the band left a lasting mark on American hard rock: Guns N’ Roses covered their song “Nice Boys” on the 1986 EP Live ?!*@ Like a Suicide — later reissued on 1988’s G N’ R Lies — and cited Rose Tattoo as an influence. Anderson also reached American audiences on screen, playing Ironbar, enforcer to Tina Turner ’s Aunty", "date_str": "2026-10-03T07:56:45+00:00", "hash": "43f9330173425970", "title_fa": "جیمی بارنز با جلد رز تاتو به اندرسون عصبانی ادای احترام کرد", "summary_fa": "جیمی بارنز به دوست فقید خود انگری اندرسون ادای احترام کرد و پس از مرگ این نماد راک استرالیایی، کاور آهنگ رز تاتو را به نام Rock'n' Roll Is King منتشر کرد. اندرسون، خواننده قدیمی رز تاتو که گری اندرسون نام داشت، در 21 سپتامبر در سن 79 سالگی، هفته‌ها پس از حمله قلبی درگذشت. خانواده وی در بیانیه ای اعلام کردند: «با اندوه فراوان درگذشت گری «عصبانی» اندرسون را در آستانه روز دوشنبه 21 سپتامبر 2026 در محاصره عزیزانش در استرالیا اعلام می کنیم. انگری پدری فداکار و هم گروه، دوست و عضوی از جامعه موسیقی و سرگرمی بسیار محبوب بود. بارنز نسخه خود را از «راک اند رول پادشاه است» - که در اصل از آلبوم 1981 رز تاتو به نام Assault Battery بود - قبل از مرگ اندرسون ضبط کرده بود و آن را برای آلبوم اخیر خود در نظر گرفته بود. او تصمیم گرفت آن را به عنوان ادای احترام پس از درگذشت دوستش منتشر کند و تمام عواید آن به قانون حمایت از صنعت موسیقی استرالیا اختصاص یابد. بارنز در بیانیه‌ای طولانی درباره دوستی‌ای که به روزهای اولیه او در Cold Chisel بازمی‌گردد، منعکس کرد، زمانی که این دو گروه دائماً در مسیر یکدیگر قرار داشتند. ما مراحل را به اشتراک گذاشتیم، اعضای خدمه را به اشتراک گذاشتیم، حتی گاهی اوقات تجهیزات را به اشتراک گذاشتیم. راک اندرول پادشاه بود و ما همه جوان بودیم و با هم دنیا را می گرفتیم. برادر اسلحه من.» او Rose Tattoo را \"نهایی ترین گروه راک\" توصیف کرد و افزود: \"آنها به گروه های به اصطلاح هارد راک در خارج از کشور نشان دادند که واقعاً چگونه انجام می شود.\" بارنز گفت که قبل از مرگش با اندرسون درباره کاور کردن آهنگ صحبت کرده است. او نوشت: \"من با Angry درباره کاور کردن آن آهنگ برای آخرین آلبومم"}, {"source": "Billboard", "title": "Zach Bryan Wears ‘Free Palestine’ Shirt at Robert Kraft’s Gillette Stadium", "link": "https://www.billboard.com/music/country/zach-bryan-free-palestine-shirt-gillette-stadium-robert-kraft-macklemore-1236353748/", "summary": "Grammy winner Zach Bryan took a pointed fashion stance at Gillette Stadium on Friday night (Oct. 2), wearing a black T-shirt reading “Free Palestine” during the first of two dates on his With Heaven On Tour at the Foxborough, Mass., venue. Members of Bryan’s band were also spotted in matching shirts, according to TMZ , with fan footage of the moment quickly circulating on social media. Bryan did not appear to address the shirt from the stage. The choice of wardrobe — and venue — is hard to read as a coincidence. Gillette Stadium is owned by the Kraft Group, led by New England Patriots owner Robert Kraft, who weeks earlier played a central role in removing Macklemore from the remaining U.S. dates of Ed Sheeran’s Loop Tour over the rapper’s pro-Palestinian statements onstage. During his opening sets at MetLife Stadium in East Rutherford, N.J., on Sept. 4 and 5, Macklemore declared “Free Palestine” to the crowd and performed his 2024 protest song “Hind’s Hall.” On the second night, he also spoke directly to Jewish fans in attendance, saying his criticism of the Israeli government was not directed at them. The Israeli-American Council launched a petition calling for his removal, and on Sept. 14 tour promoter Messina Touring Group confirmed Macklemore would no longer appear on the remaining U.S. dates after multiple NFL stadium owners reportedly threatened to pull shows if he stayed on the bill. Kraft confirmed his involvement in a statement that same day, saying he felt a responsibility to speak up when he believed a line had been crossed on antisemitism, while acknowledging that Palestinian suffering is real. Sheeran said in his own statement the following day that the removal was the promoter’s decision, not his, and that he had spoken directly with Kraft while trying to find a resolution. The fallout was swift. Fellow openers Finneas, Aaron Rowe and Lukas Graham exited the tour in solidarity, as did Irish folk band Beoga, who had been performing with Sheeran, while Macklemore responded with a lengthy Instagram post detailing the money, brand deals, festivals and private shows he says his advocacy has cost him. He later pledged $1 million from his touring earnings to Palestinian aid organizations and announced a Free Palestine Tour — a short European run hitting Dublin, Paris and London from Oct. 26 to 30 — which he has since said sold out immediately. Sheeran never made it to Foxborough in the end: his two Gillette Stadium dates last weekend were scrapped d", "date_str": "2026-10-03T04:04:05+00:00", "hash": "ca83b36318960cbd", "title_fa": "زک برایان در استادیوم ژیلت رابرت کرافت پیراهن «فلسطین آزاد» می‌پوشد.", "summary_fa": "زک برایان، برنده گرمی، جمعه شب (2 اکتبر) در استادیوم ژیلت موضعی مد و مد داشت و تی شرتی مشکی به تن داشت که روی آن نوشته شده بود «فلسطین آزاد». به گزارش TMZ، اعضای گروه برایان نیز با پیراهن‌های همسان دیده شدند و فیلم‌های طرفداران به سرعت در رسانه‌های اجتماعی پخش شد. به نظر نمی رسید برایان از روی صحنه پیراهن را خطاب کند. انتخاب کمد لباس - و محل برگزاری - به سختی به عنوان یک تصادف خوانده می شود. استادیوم ژیلت متعلق به گروه کرافت است که توسط مالک نیوانگلند پاتریوتز، رابرت کرافت، هدایت می‌شود، که چند هفته قبل نقش اصلی را در حذف مککلمور از تاریخ‌های باقی‌مانده در ایالات متحده از تور لوپ اد شیران در مورد اظهارات رپر طرفدار فلسطین روی صحنه داشت. در طول ست های افتتاحیه خود در استادیوم MetLife در شرق رادرفورد، نیوجرسی، در سپتامبر. در 4 و 5، مکلمور \"فلسطین آزاد\" را به جمعیت اعلام کرد و آهنگ اعتراضی خود را در سال 2024 \"Hind's Hall\" اجرا کرد. در شب دوم، او همچنین مستقیماً با هواداران یهودی حاضر صحبت کرد و گفت که انتقادش از دولت اسرائیل متوجه آنها نیست. شورای اسراییلی-آمریکایی طوماری مبنی بر برکناری او راه اندازی کرد و در 14 سپتامبر، مجری تور مسینا تورینگ گروه تأیید کرد که مککلمور دیگر در ایالات متحده باقی نخواهد ماند. تاریخ‌هایی پس از آن رخ می‌دهد که طبق گزارش‌ها، چندین مالک ورزشگاه NFL تهدید کردند که در صورت ماندن در صورت‌حساب، نمایش‌هایی را برگزار خواهند کرد. کرافت مشارکت خود را در بیانیه ای در همان روز تأیید کرد و گفت که او احساس مسئولیت می کند که وقتی معتقد است از مرز یهودی ستیزی عبور کرده است صحبت کند، در حالی که اذعان داشت که درد و رنج فلسطین واقعی است. شیران در بیانیه خود روز بعد گفت که حذف تصمیم"}, {"source": "Billboard", "title": "Ye’s Two Russian Stadium Concerts Canceled, Promoters Announce: ‘Sincere Regret’", "link": "https://www.billboard.com/music/rb-hip-hop/kanye-west-russian-stadium-concerts-canceled-1236351799/", "summary": "After months of back-and-forth, two planned stadium gigs by Ye at Gazprom Arena in St. Petersburg, Russia have reportedly been canceled. Ye (formerly Kanye West ) was slated to perform on Oct. 10 and 11 at the venue, though the reportedly sold-out shows were in question from the time they were announced. On Aug. 24, the venue posted on social media that the 80,000-capacity stadium did not sign any contracts for the stadium rent for the event. The post adamantly stated that there was no such agreement for the shows and that they would not take place at the venue. That came despite the venue hyping the shows on Instagram just a week earlier. Related Is Role Model the Most Famous Person From Maine? Here s What He Said on Chicken Shop Date How Access Opera s John Burton Kickstarted Ye s Touring Comeback: He s Like the Michael Jordan of This Thing Ye s Poland Show Canceled After Culture Minister Condemns Rapper: We Cannot Pretend This Is Just Entertainment Kanye West is at Gazprom Arena! Whaaat??? The legendary artist will be coming to Russia for the first time, performing a world-shaking show at the blue-white-and-blue stadium, read the post earlier post. This is no joke! Kanye West, the most influential music artist of our time, will perform two exclusive concerts at Gazprom Arena in St. Petersburg on October 10th and 11th as part of his record-breaking world tour. According to a Reuters report , the Moscow-based promoter Say Agency expressed its sincere regret about the cancellation in a message on Telegram, adding, The Ye concerts in St Petersburg will not be able to take place on the scheduled dates. At press time, spokespeople for promoter Say Agency and touring agency Access Opera had not returned Billboard s request for confirmation on the cancellation of the concerts. If the shows had gone on as planned, Ye would have been the first Western rap star to perform in Russia amid a global cultural boycott enacted in response to the launch in 2022 of Russian dictator Vladimir Putin s war against Ukraine. Newsweek , citing Russian media reports, said that the decision to pull the plug on the Ye shows was made by Russian authorities, with the Kommersant newspaper reportedly saying that the organizers of the gigs were being investigated for fraud. It also said that local media reported that government officials had not approved the shows and that some politicians had expressed outrage at Ye s past embrace of Nazi symbols and support for Adolf Hitler, which is a", "date_str": "2026-10-03T00:36:09+00:00", "hash": "f52cd8a59df783cc", "title_fa": "کنسرت های دو استادیوم یی روسیه لغو شد، مروجین اعلام کردند: «پشیمانی صمیمانه»", "summary_fa": "پس از ماه ها رفت و برگشت، دو کنسرت برنامه ریزی شده در استادیوم Ye در گازپروم آرنا در سن پترزبورگ روسیه لغو شده است. Ye (کانیه وست سابق) قرار بود در 10 و 11 اکتبر در محل اجرا اجرا کند، اگرچه طبق گزارش‌ها، نمایش‌های فروخته‌شده از زمان اعلام آن‌ها مورد سوال بود. در 24 اوت، محل برگزاری در رسانه های اجتماعی پست کرد که استادیوم 80000 نفری هیچ قراردادی برای اجاره ورزشگاه برای این رویداد امضا نکرده است. در این پست قاطعانه اعلام شده بود که چنین توافقی برای نمایش ها وجود ندارد و آنها در محل برگزار نمی شوند. این اتفاق علی‌رغم اینکه مکان برگزاری نمایش‌ها را در اینستاگرام فقط یک هفته قبل از آن هیاهو کرده بود، رخ داد. مطالب مرتبط آیا مدل نقش مشهورترین فرد اهل مین است؟ در اینجا چیزی است که او در تاریخ فروشگاه Chicken گفت: چگونه جان برتون اکسس اپرا شروع به بازگشت به تور است کرد: او مانند مایکل جردن از این چیزی است که نمایش لهستان پس از محکومیت وزیر فرهنگ رپ لغو شد: ما نمی توانیم وانمود کنیم که این فقط سرگرمی است کانیه وست در Gazprom Arena است! چی؟؟؟ این هنرمند افسانه ای برای اولین بار به روسیه می آید و در ورزشگاه آبی-سفید-آبی نمایشی جهانی را اجرا می کند، پست قبلی را بخوانید. این شوخی نیست! کانیه وست، تاثیرگذارترین هنرمند موسیقی زمان ما، در روزهای 10 و 11 اکتبر در گازپروم آرنا در سن پترزبورگ، به عنوان بخشی از تور جهانی رکوردشکن خود، دو کنسرت اختصاصی اجرا خواهد کرد. بر اساس گزارش رویترز، آژانس Say مستقر در مسکو، در پیامی در تلگرام، تاسف صمیمانه خود را در مورد لغو این رویداد ابراز کرد و افزود، کنسرت های Ye در سن پترزبورگ نمی توانند در تاریخ های برنامه ریزی شده برگزار شوند. در زمان انتشار، سخنگویان پروموتر Say"}, {"source": "Billboard", "title": "Drake Responds to Karol G Starring as Bruno Mars’ ‘Juliet’ in Romantic ‘Dance With Me’ Video: ‘This Guy Works Fast’", "link": "https://www.billboard.com/music/pop/drake-karol-g-bruno-mars-back-forth-dance-with-me-video-1236353602/", "summary": "There s some sort of public love triangle brewing between Drake, Karol G and Bruno Mars. It appears to be playful and not anything serious, as the trio are fans of one another, but fans are wondering: Could this all be leading up to a seismic blockbuster collaboration? Earlier this week, Bruno cast Karol G to play his love interest in the romantic Dance With Me music video, which saw the 6 God pop up with a response on Instagram. Related Bruno Mars Asks Karol G to Dance With Me in New Music Video Karol G Brings Out Bruno Mars for Surprise Live Debut of Still at L.A. Concert Drake Surprises Karol G s Houston Crowd With Ahí, Janice STFU One Dance Performances Holy this guy works fast, he quipped Thursday. The comment has amassed more than 34,000 likes, while Bruno s post itself has north of a million. View this post on Instagram This all heated up pretty quickly this week. Drake made a guest appearance at Karol G s Houston show on Sunday, which saw him passionately dancing with the Colombian superstar as he performed his 2016 Billboard Hot 100 No. 1 hit One Dance. They also teamed up for the live debut of their Ahí” collaboration, which reached No. 44 on the Billboard Hot 100 and topped the Hot Latin Songs chart in August. Bruno was left a little jealous after seeing what transpired at Reliant Stadium. The Grammy-winning artist posted a photo from his private jet looking out into the clouds, vowing to make a play to one-up Drizzy and win Karol G back. View this post on Instagram That happened to be the steamy Dance With Me video, which Bruno knew he had up his sleeve and ready to launch on Thursday. He gushed about Karol G in his heartfelt caption, championing her work ethic and called her the Juliet to his Romeo. Watching you work has been so inspiring. For those that don’t know this beautiful woman works so hard and loves her fans so much. She calls me and tells me how blessed we both are and reminds me to never forget that, Bruno wrote on IG. I’m honored to say we made music together, performed together and now starred in a high drama telenovela together. The world needs your light and your voice Carolina. Thank you for being my Juliet in this music video. There could be something in the works, or perhaps this was all a marketing ploy leading up to the Dance With Me visual and Drake just played along. A collaboration would be a first from the trio, and boast some of the most potent star power a song has seen, while taking artists from different genres. Li", "date_str": "2026-10-02T23:55:15+00:00", "hash": "379a6f9c8b78d241", "title_fa": "پاسخ دریک به کارول جی با بازی در نقش «ژولیت» برونو مارس در فیلم رمانتیک «Dance With Me»: «This Guy Fast Works Fast»", "summary_fa": "نوعی مثلث عشق عمومی بین دریک، کارول جی و برونو مارس در حال شکل گیری است. به نظر می رسد بازیگوش است و چیز جدی نیست، زیرا این سه نفر طرفدار یکدیگر هستند، اما طرفداران از خود می پرسند: آیا همه اینها می تواند منجر به یک همکاری پرفروش لرزه ای شود؟ در اوایل این هفته، برونو کارول جی را انتخاب کرد تا در موزیک ویدیوی عاشقانه Dance With Me بازی کند که مورد علاقه اش بود، که شاهد آن بود که 6 God با پاسخی در اینستاگرام ظاهر شد. برونو مارس از کارول جی می‌خواهد در موزیک ویدیو جدید با من برقصد کارول جی برونو مارس را برای سورپرایز به ارمغان می‌آورد اولین کنسرت Still در لس آنجلس کنسرت دریک هیوستون را غافلگیر می‌کند کارول جی با آهی، جانیس STFU One Dance Performances این مرد پنج‌شنبه سریع کار می‌کند. این کامنت بیش از 34000 لایک جمع کرده است، در حالی که پست برونو خود یک میلیون لایک دارد. این پست را در اینستاگرام مشاهده کنید این هفته خیلی سریع داغ شد. دریک روز یکشنبه به عنوان مهمان در نمایش کارول جی در هیوستون حضور پیدا کرد، که در آن او در حال رقصیدن پرشور با سوپراستار کلمبیایی در حین اجرای آهنگ 100 بیلبورد Hot 100 One Dance در سال 2016 بود. آنها همچنین برای اولین حضور زنده همکاری Ahí خود، که به شماره 44 در بیلبورد Hot 100 رسید و در ماه آگوست در صدر جدول آهنگ های لاتین داغ قرار گرفت، همکاری کردند. برونو بعد از دیدن آنچه در استادیوم Reliant اتفاق افتاد کمی حسادت کرد. این هنرمند برنده جایزه گرمی عکسی از جت شخصی خود منتشر کرد که به ابرها نگاه می کرد و عهد کرد که با یک دریزی بازی کند و کارول جی را برگرداند. این پست را در اینستاگرام مشاهده کنید که اتفاقاً ویدیوی"}, {"source": "Billboard", "title": "Watch Panteón Rococó Bring Pro-Immigrant Struggle to Tiny Desk Concert", "link": "https://www.billboard.com/music/latin/panteon-rococo-tiny-desk-concert-pro-immigrant-struggle-1236353681/", "summary": "The Mexican ska rock band Panteón Rococó joined the list of Latin acts performing on NPR’s iconic Tiny Desk on Thursday to celebrate Hispanic Heritage Month. The band used the emblematic platform to highlight the causes they support, such as the pro-immigrant movement and the crisis of disappeared persons in Mexico. The legendary act, led by vocalist and social activist Dr. Shenka, performed some of their most well-known songs, including “1993,” dedicated to the nearly 133,000 people reported missing in Mexico, according to official figures cited by The Associated Press . Related Las 50 mejores bandas de rock en español de todos los tiempos, clasificadas Panteón Rococó reúne a más de 120.000 personas en multitudinario concierto gratuito en México Mira a Milo J traer el folclore sudamericano y la murga uruguaya al Tiny Desk de NPR “We’re representing Mexico City, the great monster,” Dr. Shenka said in his introduction. “So this next song, ‘1993,’ is dedicated to all the disappeared in Mexico,” he added, in a mix of English and Spanish. During the session, guitarist Leonel Rosales can be seen wearing a T-shirt with the phrase “no human being is illegal” in Spanish a clear stance against U.S. immigration policies while bassist Dario Espinosa sports a shirt featuring an image of a dog urinating on an ice cube, in what could be a reference to ICE (U.S. Immigration and Customs Enforcement). Guitarist Rodrigo “Gorri” Bonilla wears a shirt with the logo of the German soccer team St. Pauli and the phrase “Make Fascists Afraid Again.” And Dr. Shenka is seen wearing a sports jersey in the colors of the Palestinian flag. Their energetic set includes classics like “Arréglame el alma,” “Cha-Cha Love,” “La dosis perfecta” and “La carencia.” Just over 24 hours after its release, Panteón Rococó’s Tiny Desk session had already surpassed 1 million views on YouTube. Their participation in NPR’s series comes ahead of their Dec. 26 show at the GNP Seguros Stadium, before taking an indefinite hiatus, as announced by the group. Vocalist Dr. Shenka suffered a mild heart attack in June 2025, which required the band to take several weeks off for his full recovery. This year, Panteón Rococó was also recognized by Billboard as one of the 50 Best Latin Rock Bands of All Time and held a historic free concert for more than 120,000 people in Ciudad Neza, one of the most densely populated municipalities in the world, to celebrate their 30-year career. Check out their Tiny Desk performance ", "date_str": "2026-10-02T22:48:44+00:00", "hash": "91c5617188bb8915", "title_fa": "تماشای کنسرت Panteón Rococó Bring Pro-Immigrant Struggle to Tiny Desk", "summary_fa": "گروه اسکای راک مکزیکی Panteón Rococó برای جشن گرفتن ماه میراث اسپانیایی به لیست اجراهای لاتینی پیوست که در میز نمادین تینی دسک NPR اجرا می‌کنند. این گروه از این پلت فرم نمادین برای برجسته کردن اهداف مورد حمایت خود مانند جنبش طرفدار مهاجران و بحران افراد ناپدید شده در مکزیک استفاده کرد. این اقدام افسانه ای به رهبری خواننده و فعال اجتماعی Dr. شنکا، برخی از معروف‌ترین آهنگ‌های خود، از جمله «1993» را اجرا کرد که به نزدیک به 133000 نفری که در مکزیک ناپدید شده بودند، بر اساس آمار رسمی که به نقل از آسوشیتدپرس گزارش شده بود. مرتبط 50 بهترین گروه موسیقی راک اسپانیایی در تمام دوران، رتبه بندی شده Panteón Rococó بیش از 120000 نفر را به کنسرت رایگان عظیم در مکزیک می آورد. او با ترکیبی از انگلیسی و اسپانیایی افزود: «بنابراین این آهنگ بعدی، «1993» به همه ناپدیدشدگان مکزیک تقدیم شده است. در طول جلسه، لئونل روزالس گیتاریست را می‌توان دید که یک تی‌شرت با عبارت «هیچ انسانی غیرقانونی نیست» به زبان اسپانیایی پوشیده است که موضعی واضح علیه سیاست‌های مهاجرتی ایالات متحده است، در حالی که داریو اسپینوزا، نوازنده باس، پیراهنی دارد که تصویری از یک سگ در حال ادرار کردن بر روی یک مکعب یخ نشان می‌دهد، که می‌تواند اشاره‌ای به ICEsmmforigment (United States) و Enerigment (Us) باشد. گیتاریست رودریگو \"گوری\" بونیلا پیراهنی با آرم تیم فوتبال آلمان St. پائولی و عبارت \"فاشیست ها را دوباره بترسان.\" و دکتر شنکا با پیراهن ورزشی به رنگ پرچم فلسطین دیده می شود. مجموعه پرانرژی آنها شامل آثار کلاسیکی مانند \"Arréglame el alma\"، \"Cha-Cha Love\"، \"La dosis perfecta\" و \"La carencia\" است. تنها بیش از 24 ساعت پس از انتشار، جلسه میز کوچک Panteón Rococó قبلاً از 1 میلیون بازدید در YouTube فراتر رفته بود. شرکت آنها در سریال NPR قبل از دسامبر آنها انجام"}, {"source": "Billboard", "title": "Michael McDonald of the Doobie Brothers Reconnects With Son He Put Up for Adoption at Age 14, Nearly 6 Decades Later", "link": "https://www.billboard.com/music/music-news/doobie-brothers-michael-mcdonald-biological-son-adopted-1236353633/", "summary": "One of the Doobie Brothers has reconnected with a long-lost Doobie son. As reported by NBC , Michael McDonald made contact a year and a half ago with biological son Michael Goessling, who recalls putting it together over a preliminary phone call that he was related to a rock star. Related The Doobie Brothers, Queen, Bee Gees and Other Groups in the Songwriters Hall of Fame 15 Musicians Who Have Collaborated With Their Kids: Beyoncé, Shakira More The Doobie Brothers On Civic Duty, Limitations in Today s Music Writing Songs With Charlie Puth Adopted as a baby, 59-year-old Goessling told the outlet that he never knew his biological parents until last year, when he received a letter informing him that they wanted to meet him. His first conversation with McDonald was over the phone. “I just said: ‘What a voice that guy has!’ Goessling said. It just sounded so familiar, but I couldn’t place it. Finally, I just said: ‘Are you Michael McDonald?’ And he chuckled and he said, ‘Yeah, I’m afraid so.’” Goessling also figured out the identity of his birth father after McDonald told him he was a musician with a gig that night at the Hollywood Casino Amphitheater. A quick Google search showed that the Doobie Brothers were booked for the venue on that date. “There are still days I wake up, and my first thought is I am coming out of the craziest dream, and it’s been a year and a half,” Goessling added. “I’m still trying to get my head around all of it.” Back when McDonald was 14, he had a child with his middle-school girlfriend. The pair put the child up for adoption, and the musician went on to replace Tom Johnston as the lead singer of the Doobie Brothers. McDonald has five Grammys to his name and helped the Doobie Brothers score Billboard Hot 100 No. 1 What A Fool Believes, as well as other top 10 hits such as Real Love and The Doctor. Goessling also told NBC that he never harbored resentment for his biological parents who he says are still good friends for putting him up for adoption. “I just wanted to thank them for the choices they made on my behalf and for giving me a shot in this world, and how grateful I was for that,” he said. “They were always heroes in my story.”", "date_str": "2026-10-02T22:09:27+00:00", "hash": "a05e43a867e6c85c", "title_fa": "مایکل مک‌دونالد از برادران دوبی با پسری که در سن 14 سالگی، نزدیک به 6 دهه بعد، برای فرزندخواندگی قرار داده بود، دوباره ارتباط برقرار کرد.", "summary_fa": "یکی از برادران دوبی با یک پسر دوبی که مدت هاست گم شده بود، دوباره ارتباط برقرار کرد. همانطور که توسط NBC گزارش شده است، مایکل مک دونالد یک سال و نیم پیش با پسر بیولوژیکی مایکل گوسلینگ تماس گرفت، که به یاد می آورد طی یک تماس تلفنی مقدماتی مبنی بر ارتباط او با یک ستاره راک. برادران دوبی، کوئین، بی جیز و سایر گروه‌ها در تالار مشاهیر ترانه‌سراها 15 موسیقی‌دانی که با بچه‌هایشان همکاری کرده‌اند: بیانسه، شکیرا بیشتر برادران دوبی در وظیفه مدنی، محدودیت‌ها در آهنگ‌نویسی موسیقی امروزی با چارلی پوث، کودکی که 59 ساله بود، به فرزندخواندگی گفت: پدر و مادر بیولوژیکی خود را تا سال گذشته می شناخت تا اینکه نامه ای دریافت کرد که به او اطلاع داده بود که می خواهند با او ملاقات کنند. اولین مکالمه او با مک دونالد تلفنی بود. گوسلینگ گفت: «فقط گفتم: «این پسر چه صدایی دارد!» خیلی آشنا به نظر می‌رسید، اما نمی‌توانستم آن را قرار دهم. در نهایت، فقط گفتم: «تو مایکل مک‌دونالد هستی؟» و او نیشخندی زد و گفت: «آره، می‌ترسم.»» گوسلینگ همچنین به هویت پدرش که در هالیوود کازینو بود، گفت که او یک موسیقیدان مک‌دونالد بود. آمفی تئاتر. یک جستجوی سریع در گوگل نشان داد که Doobie Brothers برای محل برگزاری در آن تاریخ رزرو شده بودند. گوسلینگ افزود: \"هنوز روزهایی هستند که از خواب بیدار می شوم و اولین فکر من این است که از دیوانه ترین رویا بیرون می آیم و یک سال و نیم گذشته است.\" \"من هنوز در تلاشم تا سرم را از بین ببرم.\" زمانی که مک دونالد 14 ساله بود، از دوست دختر دوران راهنمایی خود صاحب یک فرزند شد. این زوج کودک را برای فرزندخواندگی قرار دادند و نوازنده به عنوان خواننده اصلی گروه Doobie Brothers جایگزین تام جانستون شد. مک دونالد پنج جایزه گرمی به نام"}, {"source": "Billboard", "title": "Billboard’s Music Industry Events Calendar", "link": "https://www.billboard.com/pro/music-industry-events-calendar-festivals-awards-conferences/", "summary": "As part of our continuing efforts to serve the music industry and its creators, Billboard Pro now features a music industry events calendar for readers. The calendar will act as music s most complete summary major national and international industry events, from conferences to festivals to networking mixers and more. Just as Billboard is music s must-read source for news, charts and analysis, now it also is the go-to for business happenings. Related Dates Announced for SXSW London Debut Hilary Duff to Receive Outstanding Pop Tour of the Year Award at 2026 Billboard Live Music Summit Judge Rules Woman Accused of Shooting at Rihanna A$AP Rocky s Home Mentally Fit to Stand Trial October 2026 Sept. 30-Oct. 2 Making Vinyl Europe conference (Haarlem, Netherlands) Sept. 30-Oct. 4 BreakOut West conference and festival (Victoria, B.C., Canada) Oct. 1-4 Aftershock festival (Sacramento, Calif.) Oct. 2 The Living Legends Foundation Awards Gala (Atlanta) Oct. 2-3 Country Calling festival (Ocean City, Md.) Oct. 2-4 Austin City Limits Festival weekend 1 (Austin) Oct. 2-4 Hardly Strictly Bluegrass festival (San Francisco) Oct. 3 Power to the People Festival (Columbia, Md.) Oct. 3-4 ComplexCon (Los Angeles) Oct. 4-6 IEBA conference (Nashville d Latin Music Week for Exclusive Superstar Q A Among others, there’s a panel titled “Latin Music s Independent Revolution,” where executives Nat Pastor and Victor Gonzalez from Virgin Music Group will discuss how independent labels and artists are driving much of the success Latin music has achieved globally. There’s also the highly anticipated “Building the Tour With Rawayana presented by Live Nation, where the successful Venezuelan trippy pop band will share the secrets behind their international breakthrough as an independent act. As well as From Local Creativity to International Expansion: The Grupo Frontera Case Study” presented by The Orchard, featuring members of the popular Mexican group and their independent label, BorderTown Records. In its 37th edition, Latin Music Week features a star-studded lineup, including Ana Mena, Anuel AA, Bebeshito, Carlos Rivera, Clave Especial, Conep, Emmanuel Cortes, Ela Taubert, Erick Brian, Greeicy, Grupo Cañaveral, Grupo Frontera, Grupo Niche, Hermanos Espinoza, Jay Wheeler, Kidd Voodoo, Kristina, Lali, Lorna, Maluma, Mar Solís, Mau y Ricky, Pitbull, Quevedo, Rawayana, Rey Tony Helabusador, Ryan Castro, Santos Bravos, Trueno and Wow Popy, among others. The event coincides with the Billboard Latin Music Awards, which will take place on Oct. 22 in Miami and will be broadcast live on Telemundo. This year, Peso Pluma leads the list of finalists with 17 mentions, followed by Tito Double P with 15, Fuerza Regida with 12, Karol G with nine, Prince Royce with eight and Bad Bunny with seven. Below are five panels you can’t miss if you’re starting your career and plan to attend — in addition to the networking sessions! — listed in chronological order. For more information and to purchase tickets, visit BillboardLatinMusicWeek.com .", "date_str": "2026-10-02T22:01:27+00:00", "hash": "e3b49b490a2bee00", "title_fa": "آیا شما یک هنرمند مستقل هستید؟ در اینجا 6 پانل هفته موسیقی لاتین بیلبورد 2026 وجود دارد که نمی توانید آنها را از دست بدهید", "summary_fa": "هفته موسیقی لاتین بیلبورد 2026 نزدیک است، و اگر قصد دارید به عنوان یک هنرمند مستقل در آن شرکت کنید، تعداد زیادی پانل و رویداد وجود دارد که توجه شما را جلب خواهد کرد. برنامه ریزی شده از اکتبر 19 تا 22 در انجمن Faena در ساحل میامی، طولانی‌ترین، معتبرترین و تأثیرگذارترین گردهمایی در صنعت موسیقی لاتین، مجموعه‌ای انحصاری از گفتگوهای هنرمندان، پانل‌های تجاری با مدیران، نمایشگاه‌های مشهور Billboard En Vivo و فرصت‌های شبکه‌ای بی‌شماری را ارائه می‌دهد. مربوط به Becky G برای پیوستن به هفته موسیقی لاتین بیلبورد 2026 برای سوپراستار انحصاری Q A، در میان سایر موارد، پانلی با عنوان \"انقلاب مستقل موسیقی لاتین\" وجود دارد که در آن مدیران Nat Pastor و Victor Gonzalez از Virgin Music Group در مورد اینکه چگونه لیبل‌ها و هنرمندان مستقل منجر به موفقیت موسیقی لاتین در سطح جهانی شده‌اند، بحث خواهند کرد. همچنین \"ساخت تور با راویانا\" که توسط Live Nation ارائه شده است، بسیار مورد انتظار است، که در آن گروه پاپ تریپی موفق ونزوئلایی اسرار موفقیت بین المللی خود را به عنوان یک اقدام مستقل به اشتراک می گذارد. همچنین از خلاقیت محلی تا گسترش بین المللی: مطالعه موردی گروه فرانترا\" ارائه شده توسط The Orchard، با حضور اعضای گروه Rexican، و اعضای مستقل گروه Rexican و MeeTown مستقل. در سی و هفتمین نسخه خود، هفته موسیقی لاتین دارای ترکیبی پر ستاره، از جمله Ana Mena، Anuel AA، Bebeshito، Carlos Rivera، Clave Especial، Conep، Emmanuel Cortes، Ela Taubert، Erick Brian، Greeicy، Grupo Cañaveral، Grupo Frontera، Krupo Japony Epinoche وودو، کریستینا، لالی، لورنا، مالوما، مار سولیس، مائوی ریکی، پیتبول، کوودو، راویانا، ری تونی هلابوسادور، رایان کاسترو، سانتوس براووس، ترئونو و واو پوپی و دیگران."}, {"source": "Billboard", "title": "In Canada: Universal Music Canada Lays Off Staff Across Several Departments", "link": "https://www.billboard.com/pro/universal-music-canada-lays-off-employees-canada-news/", "summary": "Universal Music Canada (UMC) has laid off employees across several departments, Billboard Canada has learned. The layoffs were reportedly announced to staff in a company town hall at the major record label on Tuesday (Sept. 29). Sources say more than 12 roles were included in the announcement. According to a 2025 annual report by Universal Music Canada , the company employs approximately 205 people, so the cuts represent approximately 6-7% of the label s workforce in Canada. UMC did not respond to a request to verify the number of layoffs. Related Behind Music Companies Stock Market Stumble: They Are Caught in Crosswinds Hilary Duff to Receive Outstanding Pop Tour of the Year Award at 2026 Billboard Live Music Summit Judge Rules Woman Accused of Shooting at Rihanna A$AP Rocky s Home Mentally Fit to Stand Trial Cuts were made across divisions, including positions in communications, marketing, A R, label partnerships and admin. That includes senior roles at the label, with at least one with a vice president title and another with a senior manager title Universal Music Canada is a wholly owned subsidiary of Universal Music Group (UMG) headquartered in Toronto, with offices also in Montreal, Vancouver and Calgary. The layoffs reportedly affected multiple offices. The cuts were reportedly made for cost-cutting and restructuring reasons and not based on performance. UMC declined to comment on this story, writing that the company does not comment on employee relations. UMC continues to be Canada’s leading music company — proudly signing and supporting Canadian artists and representing UMG’s global roster of talent in the Canadian market, a representative from the company says in a message to Billboard Canada . The layoffs fit a trend of cost-cutting and consolidation throughout the global music industry as well as domestically. Globally, in 2024, Universal Music Group announced a “strategic organizational redesign meant to generate €250 million in savings within two years. UMG chairman/CEO Lucian Grainge said that it would result in “reduced headcount” and “efficiencies.” Dozens of layoffs came soon after , across the major group s labels, including Interscope, Republic, Capitol, Def Jam and Island. The layoffs at UMC are the biggest staff reduction at the Canadian wing of the major label since Julie Adam was promoted to the top role of president and CEO at the beginning of 2025 . She succeeded Jeffrey Remedios , who shifted roles to president of strategic develo", "date_str": "2026-10-02T22:00:59+00:00", "hash": "6595d5be0cd8b646", "title_fa": "در کانادا: یونیورسال موزیک کانادا کارکنان خود را در چندین بخش اخراج می کند", "summary_fa": "بیلبورد کانادا دریافته است که یونیورسال موزیک کانادا (UMC) کارمندان خود را در چندین بخش اخراج کرده است. بر اساس گزارش ها، اخراج کارکنان در تالار شهر شرکت در شرکت بزرگ ضبط در روز سه شنبه (29 سپتامبر) اعلام شد. منابع می گویند بیش از 12 نقش در این اعلامیه گنجانده شده است. طبق گزارش سالانه یونیورسال موزیک کانادا در سال 2025، این شرکت تقریباً 205 کارمند دارد، بنابراین کاهش تقریباً 6-7٪ از نیروی کار لیبل در کانادا را تشکیل می دهد. UMC به درخواستی برای تأیید تعداد اخراج ها پاسخ نداد. شرکت‌های موسیقی مرتبط در بورس اوراق بهادار سقوط کردند: هیلاری داف برای دریافت جایزه بهترین تور پاپ سال 2026 در اجلاس موسیقی زنده بیلبورد گرفتار شدند. مشارکت ها و ادمین این شامل نقش‌های ارشد در لیبل می‌شود، حداقل یکی با عنوان معاون و دیگری با عنوان مدیر ارشد Universal Music Canada یک شرکت تابعه از گروه موسیقی یونیورسال (UMG) است که دفتر مرکزی آن در تورنتو قرار دارد و دفاتری نیز در مونترال، ونکوور و کلگری دارد. بر اساس گزارش ها، اخراج چندین دفتر را تحت تأثیر قرار داد. بر اساس گزارش ها، این کاهش ها به دلایل کاهش هزینه و بازسازی و نه بر اساس عملکرد انجام شده است. UMC از اظهار نظر در مورد این داستان خودداری کرد و نوشت که این شرکت در مورد روابط کارکنان اظهار نظر نمی کند. نماینده ای از این شرکت در پیامی به بیلبورد کانادا می گوید UMC همچنان شرکت موسیقی پیشرو در کانادا است - با افتخار از هنرمندان کانادایی امضا و حمایت می کند و فهرست استعدادهای جهانی UMG را در بازار کانادا نمایندگی می کند. اخراج ها با روند کاهش هزینه ها و تثبیت در سراسر صنعت موسیقی جهانی و همچنین در داخل مطابقت دارد. در سطح جهانی، در سال 2024، گروه موسیقی یونیورسال یک \"بازطراحی سازمانی"}, {"source": "Billboard", "title": "Is Role Model the Most Famous Person From Maine? Here’s What He Said on ‘Chicken Shop Date’", "link": "https://www.billboard.com/music/pop/role-model-maine-most-famous-chicken-shop-date-video-1236353593/", "summary": "As far as current pop music goes, Role Model is probably Maine s most famous export but what about celebrities in general? While guesting on the Friday (Oct. 2) premiere episode of Amelia Dimoldenberg s final season of Chicken Shop Date, the singer born Tucker Pillsbury pondered whether he has the most star power out of everyone from his home state. Anna Kendrick s from Maine, he pointed out, while the show s host noted that famed horror author Stephen King is also from the Pine Tree State. Related Role Model s Chuck Timely The Hourglass Makes Top 10 Debut on 6 Billboard Album Charts Watch Role Model s Self-Proclaimed Botched Cover of Olivia Rodrigo s Maggots for Brains Taylor Swift s Patient Zero Video Arrives With a Haunting Plot Twist: How to Watch He s probably sold more stuff than me, Pillsbury said of King, who indeed is one of the best-selling novelists of all time. Got more money. After a bit of back-and-forth, Dimoldenberg told the singer: You re not as successful as Stephen King, no. That s just a fact. You re starting to hurt my feelings, Pillsbury replied. [He has a] whole different job. The jury s still out on who exactly is Maine s most famous celebrity, but other front-runners include actor Patrick Dempsey and sports personality Erin Andrews. And while Role Model may not quite have the sales numbers that King has, the musician recently scored his very first top 10 album on the Billboard 200 with Chuck Timely The Hourglass , which amassed 24,000 copies sold in the United States in its first week out, according to Luminate. The new album also features a collaboration with Pillsbury s then-girlfriend Dakota Johnson, who contributes a spoken-word section to Love I You ng under the working title Pawn Shop, the latest project from Ben Shapiro s Daily Wire and Dallas Sonnier s Bonfire Legend has upset locals — not just because of its alleged use of blank gunshots, pyrotechnics and a staged car wreck without properly [ ]", "date_str": "2026-10-02T22:12:22+00:00", "hash": "f36d959f5c5e4092", "title_fa": "اعتراض مردم محلی مونتانا به تولید دیلی وایر Pro-ICE زیرا فیلمبرداری با نمایش ظاهری فیلمبرداری خوب رنه، کسب و کارها را مختل می کند", "summary_fa": "تولید فیلم جدید دیلی وایر طرفدار ICE معترضان محلی را در لیوینگستون، مونتانا به خود جلب کرده است. فیلمبرداری با عنوان کاری Pawn Shop، آخرین پروژه از Ben Shapiro's Daily Wire و Dallas Sonnier's Bonfire Legend، مردم محلی را ناراحت کرده است - نه فقط به دلیل استفاده ادعایی از شلیک گلوله های سفید، مواد آتش نشانی و یک خودروی تصادفی بدون اینکه به درستی [ ] تولید جدید Daily Wire معترضان محلی در فیلم ICE ICE را به خود جلب کند. بروکلین وایلد محلی لیوینگستون، که همچنین در صنعت فیلم به عنوان تهیه کننده و کارگردان کار می کند، به ددلاین می گوید که با توجه به شهر کوچک لیوینگستون، این گروه تولید می توانست با اطلاع رسانی به همه بهتر عمل کند. Watch on Deadline Deadline برای نظر دادن با Daily Wire و Bonfire Legend تماس گرفته است. در همین حال، مرکز منابع غذایی لیوینگستون (LFRC) بیانیه‌ای منتشر کرد که در آن توضیح داد که چگونه این تولید بر مشتریان خود تأثیر گذاشته است، مشتریانی که در حال حاضر با موانع متعددی برای برآورده کردن اساسی‌ترین نیازهای خود مواجه هستند. این گروه خاطرنشان می کند که این تنها منبع در نوع خود در منطقه است که به یک نفر از هر هشت نفر از ساکنان پارک کانتی خدمات رسانی می کند، و تولید منجر به کاهش غیرقابل قبول هشت هفته ای در حضور آنها شده است. آنها گفتند که از زمانی که فیلمبرداری در آن سوی خیابان از ساختمان ما شروع شد، بسته شدن جاده ها و محافظان امنیتی مسلح موانع دسترسی به غذا را افزایش داده است. مشتریان ما سزاوار این هستند که با دسترسی به این منبع ضروری، بی چون و چرا احساس امنیت کنند. LFRC ادعا کرد که آنها از برنامه های فیلمبرداری از Pawn Shop در جلوی انباری خود مطلع نشده اند و فقط"}, {"source": "Deadline", "title": "Skydance Putting All 3 TV Studios Under George Cheeks: Warner Bros. TV, CBS Studios, PTVS – The Dish", "link": "https://deadline.com/2026/10/skydance-tv-studios-george-cheeks-wbtv-cbs-studios-ptvs-1237145674/", "summary": "More elements of the proposed post-WBD merger Skydance s executive structure are coming into focus ahead of the Paramount-Warner Bros Discovery transaction closing on Tuesday. As Josh Greenstein and Dana Goldberg are poised to oversee Skydance s movie studios, Warner Bros and Paramount, another senior executive on Paramount CEO David Ellison s team, Chair of TV Media George [ ]", "date_str": "2026-10-02T22:05:12+00:00", "hash": "b48d91964249582f", "title_fa": "Skydance قرار دادن همه 3 استودیو تلویزیونی زیر جورج گونه: Warner Bros. TV، CBS Studios، PTVS – The Dish", "summary_fa": "عناصر بیشتری از ساختار اجرایی پیشنهادی Skydance پس از ادغام WBD در آستانه بسته شدن تراکنش پارامونت-وارنر برادران دیسکاوری در روز سه شنبه مورد توجه قرار می گیرند. در حالی که جاش گرینشتاین و دانا گلدبرگ آماده نظارت بر استودیوهای فیلم Skydance هستند، برادران وارنر و پارامونت، یکی دیگر از مدیران ارشد تیم دیوید الیسون، مدیرعامل پارامونت، رئیس جرج رسانه تلویزیونی [ ] به عنوان بخشی از مجموعه فعلی خود، چیکس بر استودیو CBS نظارت دارد، کاری که از زمان پیوستن به استودیوی دیوید Stapf به او گزارش می دهد. من می‌شنوم که او اکنون نظارت بر تلویزیون برادران وارنر و استودیو تلویزیونی پارامونت را اضافه می‌کند، و چانینگ دانگی، رئیس هیئت مدیره و مدیر عامل فعلی، گروه تلویزیونی برادران وارنر و شبکه‌های ایالات متحده، و مت تونل، رئیس PTVS، هر دو در آن باقی می‌مانند و به او گزارش می‌دهند. Watch on Deadline بخشی از گسترش نقش Cheeks پس از ادغام است، که گفته می‌شود نوعی نظارت بر برندهای کابل در سمت WBD را نیز شامل می‌شود. (طبق توافق با 12 دادستان کل ایالت، پارامونت و برادران وارنر موظفند به طور جداگانه به مذاکره درباره بسته های کابلی خود ادامه دهند. ) در پست فعلی خود، Cheeks بر تمام شبکه های خطی پارامونت، از جمله CBS (سرگرمی، ورزشی و اخبار)، MTV، Comedy Central، Nickelodeon و BET نظارت دارد. ادغام منطقی است. به عنوان مثال، تونل، که الیسون از دوران تصدی خود در Skydance بسیار مورد علاقه او بود، در حال حاضر به گلدبرگ گزارش می دهد که در کنار گرینشتاین، هر دو استودیو فیلم را اداره خواهند کرد. گمانه‌زنی‌هایی وجود داشت مبنی بر اینکه دانگی، با توجه به اندازه و خروجی تلویزیون برادران وارنر و جایگاه او به عنوان یک مدیر ارشد تلویزیونی با نفوذ و ارتباطات در صنعت، ممکن است مستقیماً به مدیران اجرایی شرکت ترکیبی گزارش دهد،"}, {"source": "Netflix NL", "title": "Lindsay Lohan in nieuwe romantische film op Netflix", "link": "https://www.netflix-nederland.nl/lindsay-lohan-in-nieuwe-romantische-film-op-netflix/", "summary": "Lindsay Lohan was een tijdje weg, maar keerde na al haar problemen terug in de nodige films (óók op Netflix). Binnenkort komt er op de streamingdienst een nieuwe romantische film uit met Lohan als uithangbord. Lindsay Lohan in nieuw romantisch drama op Netflix Return to You is een romantische Netflix-film met Lohan en Henry Golding in de hoofdrollen. Het verhaal speelt zich af in 2008 en volgt een succesvolle advocate die op professioneel vlak vrijwel alles heeft bereikt. Achter dat succesvolle bestaan gaat echter eenzaamheid schuil: haar carrière heeft jarenlang voorrang gekregen en op romantisch gebied ontbreekt er iets in haar leven. Alles verandert wanneer ze door een vergissing een persoonlijke dvd ontvangt die helemaal niet voor haar bestemd is. Op de beelden staat een terminaal zieke vrouw die een emotionele boodschap heeft opgenomen voor haar echtgenoot. De advocate raakt zo geraakt door wat ze ziet dat ze besluit niet simpelweg de dvd terug te sturen, maar zelf op zoek te gaan naar de man voor wie de boodschap bedoeld is. Met slechts een beperkt aantal aanwijzingen begint ze aan een zoektocht naar deze onbekende echtgenoot. Wat aanvankelijk vooral bedoeld is om ervoor te zorgen dat een belangrijke afscheidsboodschap bij de juiste persoon terechtkomt, krijgt gaandeweg een veel persoonlijkere betekenis. De zoektocht dwingt haar namelijk ook naar haar eigen leven te kijken en na te denken over wat ze buiten haar carrière eigenlijk belangrijk vindt. Mean Girls-samenwerking Uiteindelijk brengt de dvd haar op het pad van het personage van Henry Golding, waarna zich een romantisch en emotioneel verhaal ontwikkelt over verlies, nieuwe kansen en onverwachte liefde. Ook interessant: met betrekking tot Return to You werkt Lohan opnieuw samen met regisseur Mark Waters, die haar eerder regisseerde in de klassiekers Freaky Friday en Mean Girls. Wanneer de film precies uit moet komen is vooralsnog onbekend. Wil jij nou niets missen over Netflix, films en series? Volg dan Netflix Facebookgroep! The post Lindsay Lohan in nieuwe romantische film op Netflix appeared first on Netflix Nederland - Films en Series on demand .", "date_str": "2026-10-03T14:05:39+00:00", "hash": "5dd4577507d926a7", "title_fa": "لیندسی لوهان در فیلم عاشقانه جدید در نتفلیکس", "summary_fa": "لیندسی لوهان مدتی دور بود، اما پس از تمام مشکلاتش در چندین فیلم (از جمله در نتفلیکس) بازگشت. فیلم عاشقانه جدیدی با لوهان در نقش کودک پوستر به زودی در سرویس استریم منتشر خواهد شد. لیندسی لوهان در درام عاشقانه جدید در نتفلیکس بازگشت به تو یک فیلم عاشقانه نتفلیکس با بازی لوهان و هنری گلدینگ است. داستان در سال 2008 اتفاق می افتد و یک وکیل موفق را دنبال می کند که تقریباً همه چیز را به صورت حرفه ای به دست آورده است. با این حال، پشت این وجود موفق، تنهایی نهفته است: شغل او سالهاست در اولویت قرار گرفته است و چیزی از نظر عاشقانه در زندگی او گم شده است. همه چیز وقتی تغییر می کند که بر اثر اشتباه یک دی وی دی شخصی دریافت می کند که اصلا برای او در نظر گرفته نشده است. این فیلم زنی بیمار لاعلاج را نشان می دهد که پیامی احساسی برای همسرش ضبط کرده است. وکیل به قدری از آنچه می بیند تحت تأثیر قرار می گیرد که تصمیم می گیرد به سادگی DVD را پس ندهد، بلکه به دنبال مردی بگردد که پیام برای او در نظر گرفته شده است. تنها با تعداد محدودی از سرنخ ها، او جستجو برای این شوهر ناشناس را آغاز می کند. آنچه در ابتدا در ابتدا برای اطمینان از رسیدن پیام خداحافظی مهم به شخص مناسب در نظر گرف e seizoen van Netflix populairste kostuumdrama! Dit is overigens nog wel toekomstmuziek, want eerst moet seizoen 5 van Bridgerton nog uitkomen. De verwachting is dat het vijfde seizoen eind 2027 of begin 2028 in première gaat, waarna seizoen 6 in 2028 of zelfs in 2029 uit zal komen. Zoals we al zeiden, toekomstmuziek dus! Het vijfde seizoen draait overigens om Lady Francesca Bridgerton (Hannah Dodd) en Michaela Stirling (Masali Baduza). Wil jij nou niets missen over Netflix, films en series? Volg dan Netflix Facebookgroep! The post Hoofdpersoon Bridgerton seizoen 6 uitgelekt appeared first on Netflix Nederland - Films en Series on demand .", "date_str": "2026-10-03T10:53:38+00:00", "hash": "6453db6da49864a3", "title_fa": "شخصیت اصلی بریجرتون فصل 6 لو رفت", "summary_fa": "اوه بریجرتون 6 درباره چیست؟ یا بهتر است بگوییم: فصل ششم بریجرتون درباره کیست؟ به نظر می رسد که ما اکنون این را می دانیم. یک فیلمنامه نویس از دهانش خارج شده است. اوه! شخصیت اصلی بریجرتون فصل 6 اگر اطلاعات نویسنده مورد نظر درست باشد، فصل 6 بریجرتون حول محور الویس بریجرتون (با بازی کلودیا جسی) می چرخد. دستیار نویسنده مورد نظر، به نام فیونا کیدا، در یک ویدیوی TikTok (که از آن زمان حذف شده است، می‌گوید): ما کار روی فصل بعدی Eloise را شروع کرده‌ایم و در حال بازخوانی کتاب‌ها هستیم تا آماده کنیم و ببینیم شخصیت‌های مختلف را کجا گذاشته‌ایم. امروز اولین مجموعه یادداشت ها را نوشتم. این در این مرحله اولیه و خلاقانه بسیار سرگرم کننده است، زیرا همه با انواع ایده های بزرگ روبرو می شوند. کیدا گفت، سپس دستیار نویسندگی دیگر مسئولیت من را برعهده گرفت و من نیز چند ایده را پیشنهاد دادم که فکر می کردم دیدن دوباره آنها جالب است. سپس روی سندی با دیالوگ‌ها، لحظات و صحنه‌های مورد علاقه‌ای کار کردم که نویسندگان می‌توانند از آن استفاده کنند. اگرچه خودشان هم روی این موضوع کار می کنند، اما فکر کردم عاقلانه است که خودشان این مطالب را با دقت مطالعه کنند. ما شروع کردیم! این یعنی دو چیز: 1. بنابراین به نظر می رسد که بریجرتون فصل 6 درباره الویز باشد و 2. سازندگان کار تولید فصل ششم پرطرفدارترین درام صحنه و لباس نتفلیکس را آغاز کرده اند
