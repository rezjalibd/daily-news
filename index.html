، رقیب پیشرو MS NOW شاهد افزایش 16 درصدی مخاطبان روزانه خود بود و به 588000 بیننده در ماه اکتبر رسید و بینندگان CNN در همان بازه زمانی 3 درصد افزایش یافت و به 402000 بیننده رسید. Variety برای اظهار", "image_url": "https://variety.com/wp-content/uploads/2021/08/Fox-News-Channel.png?w=888&#038;h=500&#038;crop=1", "category": "هوش مصنوعی مولد", "tags": ["رسانه", "هنر"], "datetime_fa": "۶ آبان • ۱۸:۴۰"}, {"source": "Variety", "title": "Jamie Dornan Says There’s ‘Pressure’ to Taking Over Aragorn Role in ‘Lord of the Rings: Hunt for Gollum’: I’m Not ‘Trying to Outdo’ Viggo Mortensen", "link": "https://variety.com/2026/film/news/hunt-for-gollum-jamie-dornan-aragorn-lord-of-rings-1236933354/", "summary": "Jamie Dornan is stepping into the shoes of Aragorn in The Lord of the Rings: The Hunt for Gollum, after the hero was famously played by Viggo Mortensen in the original LOTR trilogy. Dornan spoke to L Officiel (translated by Slash Film) about taking on the role and playing a younger version in the prequel. “There’s [ ]", "date_str": "2026-10-28T15:02:36+00:00", "hash": "565ba33534441f88", "title_fa": "جیمی دورنان می‌گوید «فشاری» برای تصاحب نقش آراگورن در «ارباب حلقه‌ها: شکار گولوم» وجود دارد: «سعی نمی‌کنم از ویگو مورتنسن پیشی بگیرم».", "summary_fa": "جیمی دورنان به جای آراگورن در The Lord of the Rings: The Hunt for Gollum، پس از نقش معروف این قهرمان توسط ویگو مورتنسن در سه گانه اصلی LOTR، قدم می گذارد. دورنان با L Officiel (ترجمه شده توسط اسلش فیلم) در مورد ایفای نقش و ایفای یک نسخه جوانتر در پیش درآمد صحبت کرد. وقتی می‌خواهید دنباله‌روی کنید، [ ] فشار وجود دارد. از من خواسته شده که نقشی فوق العاده نمادین بازی کنم و من تمام تلاشم را خواهم کرد. اما برای من، آراگورن همیشه فقط ویگو خواهد بود. بازی او یکی از بازی های مورد علاقه من است و من احساس افتخار می کنم که سعی کنم حداقل بخشی از انرژی را که او در ابتدا به شخصیت آورده بود دوباره به دست بیاورم. دورنان گفت هیچ بخشی از من نیست که بخواهد از او پیشی بگیرد. داستان‌های مرتبط گیلرمو دل تورو وقتی می‌گوید: «دنیایی را خراب می‌کنیم» اشک می‌ریزد: «این که سه نسل بعدی را شکست می‌دهند بسیار دردسرساز است» The Hunt for Gollum به کارگردانی و بازیگری اندی سرکیس است که صدا و ضبط حرکت هابیت CGI را در سه‌گانه اصلی ارائه کرده است. سرکیس، که همچنین کارگردانی Mowgli: Legend of the Jungle، Venom: Let There Be Carnage و غیره را بر عهده داشته است، دومین کارگردان واحد در سه گانه هابیت پیتر جکسون بود. The Hunt for Gollum که یک فیلم مستقل است، اولین باری است که او به عنوان کارگردان اصلی در یکی از فیلم‌های فرانچایز فانتزی نقش آفرینی می‌کند. علاوه بر بازگشت سرکیس به سرزمین میانه، The Hunt for Gollum ایان مک کلن را در نقش گندالف و الیجا وود را در نقش فرودو بازگرداند. تازه واردها عبارتند از کیت وینسلت، لئو وودال، لی پیس و آنیا تیلور جوی. فیلم جدید از دیدگاه گولوم روایت می شود زیرا گندالف آراگورن جوان را", "image_url": "https://variety.com/wp-content/uploads/2026/10/dior-homme-photocall-paris-fashion-week-menswear-fall-winter-1000x667-1.jpg?w=1000&#038;h=563&#038;crop=1", "category": "هوش مصنوعی مولد", "tags": ["سینما"], "datetime_fa": "۶ آبان • ۱۸:۳۲"}, {"source": "Billboard", "title": "Harry Shum Jr. and Jenna Johnson Scare Up a Wickedly Spooky Dance to a Britney Spears Classic on ‘DWTS’: Watch", "link": "https://www.billboard.com/culture/tv-film/harry-shum-johnson-spooky-dance-britney-spears-toxic-dwts-watch-1236369531/", "summary": "It was a frightfully entertaining night on Dancing With the Stars on Tuesday (Oct. 27) when the show got into the Halloween spirit a few days early on a Horror Movie Night -themed episode. And nobody nailed the combination of scares and flawless steps more than Glee alum Harry Shum Jr. and his professional dance partner Jenna Johnson. Related ADÉLA Says The Baddest Bi es Ain t in LA, But Hot Topic Thinks Otherwise: Shop Exclusive Prima Merch Online The Glee Reboot Is Officially in the Works Julia Stiles Pays Emotional Tribute to Late 10 Things I Hate About You Co-Star Heath Ledger on Dancing With the Stars : Watch Shum hit the stage in a blood-soaked white shirt and tie, his face dripping with viscera as Johnson stalked him across the floor in a look inspired by the Saw horror franchise. Dancing to 2WEI s cover of Britney Spears 2004 hit Toxic, the pair did a high-energy contemporary routine full of daring lifts, spins and one impressive move where Johnson sat on Shum s shoulder and then lay down flat to form a human T shape. The acrobatic routine rushed to a conclusion with Johnson grabbing Shum and ripping off his tie, sending the actor crashing to the ground, convulsing, as each attempt to get up was met by his partner repeatedly shoving him down with her foot. The dance ended on the creepiest of notes, with Saw s Billy the Puppet rolling onto the stage on his squeaky tricycle. The dance clearly landed with the judges, with guest adjudicator Shirley Ballas saying she d never seen anything like it and Bruno Toniolo dubbing it perfect, leading to the first 40/40 perfect score of the season so far. Because there was no elimination during last week s Dedication Night, two stars were sent packing on Tuesday, marking the last dance for The Bachelorette s Tyler Cameron and his partner Sharna Burgess — who did a Dracula-themed Viennese waltz to Annie Lennox s Love Song For a Vampire — and Savannah Bananas player Jackson Olson and professional partner Emma Slater, who did a Joker -inspired routine to Frank Sinatra s That s Life. DWTS airs live on Tuesdays at 8 p.m. ET on ABC and Disney+ and streams the next day on Hulu. Watch Shum and Johnson get Toxic below.", "date_str": "2026-10-28T15:00:31+00:00", "hash": "21ed8c1f212f39f0", "title_fa": "هری شوم جونیور و جنا جانسون در DWTS یک رقص وحشتناک وحشتناک را با یک کلاسیک بریتنی اسپیرز می ترسانند: تماشا کنید", "summary_fa": "این یک شب سرگرم‌کننده وحشتناک در Dancing With the Stars در روز سه‌شنبه (۲۷ اکتبر) بود، زمانی که نمایش چند روز زودتر در یک قسمت با مضمون شب فیلم ترسناک به روح هالووین رسید. و هیچ کس بیشتر از زاج Glee Harry Shum Jr و شریک رقص حرفه ای او Jenna Johnson، ترکیبی از ترس ها و گام های بی عیب و نقص را نمیخکوب کرد. ADÉLA می گوید بدترین چیز در لس آنجلس است، اما موضوع داغ به گونه ای دیگر فکر می کند: خرید آنلاین کالای انحصاری Prima را انجام می دهد. پیراهن و کراوات سفید آغشته به خون، در حالی که جانسون با نگاهی الهام‌گرفته از فرنچایز ترسناک Saw، او را روی زمین تعقیب می‌کرد. این زوج با رقصیدن روی جلد 2WEI از بریتنی اسپیرز 2004، یک روال معاصر پرانرژی پر از بلند کردن جسورانه، چرخش و یک حرکت چشمگیر انجام دادند که در آن جانسون روی شانه شوم نشست و سپس صاف دراز کشید تا به شکل T انسان شکل بگیرد. روال آکروباتیک با عجله به پایان رسید و جانسون شوم را گرفت و کراواتش را پاره کرد، بازیگر را به زمین خورد و تشنج کرد، زیرا هر تلاشی برای بلند شدن توسط شریک زندگی‌اش که مکرراً او را با پا به پایین هل می‌داد، مواجه می‌شد. رقص با ترسناک ترین نت ها به پایان رسید، بیلی عروسک اره که با سه چرخه جیرجیر خود روی صحنه می غلتید. رقص به وضوح با داوران روبرو شد، شرلی بالاس داور مهمان گفت که هرگز چیزی شبیه به آن ندیده است و برونو تونیولو آن را کامل دوبله کرده است، که منجر به اولین امتیاز عالی 40/40 فصل تا کنون شده است. از آنجایی که در شب تقدیم هفته گذشته حذفی وجود نداشت، دو ستاره در روز سه‌شنبه برای جمع‌آوری بسته‌بندی فرستاده شدند، که آخرین رقص تایلر کامرون،", "image_url": "https://www.billboard.com/wp-content/uploads/2026/10/harry-shum-dwts-toxic-billboard-1800.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["سینما"], "datetime_fa": "۶ آبان • ۱۸:۳۰"}, {"source": "Billboard", "title": "Westwood Recordings Enters JV With Monstercat, With Eye on Artist Development & Global Reach", "link": "https://www.billboard.com/pro/electronic-label-westwood-recordings-signs-jv-monstercat/", "summary": "Canadian independent electronic label Westwood Recordings has entered a joint venture with fellow Canadian electronic label Monstercat. The partnership will provide Westwood with access to capital, global infrastructure (including monthly royalty accounting, global digital distribution and a gaming partnerships department) and an expanded team. Westwood will continue to be based in Vancouver and run by its founder, Nick Middleton . Related Indie Electronic Label Monstercat Acquired by Create Music Group Kenny MacPherson, Veteran Music Publisher and Big Deal Music Co-Founder, Dies at 71 Diddy Moved From New Jersey Prison to Similar Facility in Pennsylvania Middleton, one half of longstanding electronic duo The Funk Hunters, founded Westwood Recordings in 2013 as a home for bass, electronic and hip-hop. The imprint s roster includes Big Gigantic, Dirtwire, Cut Chemist, Flamingosis, Maddy O Neal and Chali 2na. Beyond releases, the label has done branded events and stage takeovers at British Columbia music festivals Shambhala Music Festival and Rifflandia and Vancouver’s Malkin Bowl, an outdoor venue in the city s Stanley Park. The partnership is part of a broader expansion spurred by Monstercat s 2025 acquisition by Create Music Group, which invested $50 million in the label — funding that contributed to the new venture with Westwood. As part of the joint venture, Monstercat will support Westwood in signing new artists and recordings, expanding its release schedule, entering new genres and pursuing catalog acquisitions. The partnership will also support the launch of a publishing arm, building on Westwood’s history in synch licensing. “I’ve always respected how Monstercat has built its business, especially how transparent they are with their artists and how connected they are to their fans. Those things matter a lot to me, and we’ve built Westwood with that same care,” Middleton said in a statement. “After more than a decade of running Westwood independently, I know how much the right support can mean for an artist or a record. This partnership gives us the backing to put more behind the music we believe in, be more ambitious with the artists and projects we take on, and open more doors for the people we work with. We’ve built something special with Westwood, and there’s a lot more I want to do. After years of working together, the trust I have in Daniel and the Monstercat team is a big part of why this feels right. They understand what we’re building and wan", "date_str": "2026-10-28T15:00:00+00:00", "hash": "7e7a262e987327d7", "title_fa": "Westwood Recordings با Monstercat، با چشم به توسعه هنرمندان و دسترسی جهانی وارد JV می شود", "summary_fa": "برچسب الکترونیکی مستقل کانادایی Westwood Recordings وارد یک سرمایه گذاری مشترک با همتای خود برچسب الکترونیکی کانادایی Monstercat شده است. این مشارکت به وست‌وود دسترسی به سرمایه، زیرساخت‌های جهانی (از جمله حسابداری ماهانه حق امتیاز، توزیع دیجیتال جهانی و بخش مشارکت‌های بازی) و یک تیم گسترده را فراهم می‌کند. Westwood همچنان در ونکوور مستقر است و توسط بنیانگذار آن، نیک میدلتون اداره می شود. Label Indie Electronic Monstercat که توسط گروه موسیقی Create خریداری شد، کنی مک فرسون، ناشر کهنه کار موسیقی و یکی از بنیانگذاران Big Deal Music، در سن 71 سالگی درگذشت. باس، الکترونیک و هیپ هاپ. فهرست آثار شامل Big Gigantic، Dirtwire، Cut Chemist، Flamingosis، Maddy O Neal و Chali 2na است. علاوه بر انتشارات، این لیبل رویدادهای مارکدار و تصاحب صحنه‌ها را در جشنواره‌های موسیقی بریتیش کلمبیا جشنواره موسیقی شامبالا و Rifflandia و Malkin Bowl ونکوور، یک مکان در فضای باز در پارک استانلی شهر، انجام داده است. این مشارکت بخشی از توسعه گسترده‌تر است که توسط گروه Create Music Group در سال 2025 توسط Monstercat، که 50 میلیون دلار در این لیبل سرمایه‌گذاری کرد - سرمایه‌گذاری کرد - سرمایه‌گذاری که به سرمایه‌گذاری جدید با Westwood کمک کرد. به عنوان بخشی از سرمایه گذاری مشترک، Monstercat از Westwood در امضای قرارداد با هنرمندان و ضبط های جدید، گسترش برنامه انتشار خود، ورود به ژانرهای جدید و پیگیری خرید کاتالوگ حمایت خواهد کرد. این مشارکت همچنین از راه‌اندازی بازوی انتشاراتی که بر اساس تاریخچه وست‌وود در صدور مجوز همگام است، حمایت می‌کند. من همیشه به اینکه Monstercat چگونه کسب و کار خود را ایجاد کرده است، احترام می‌گذارم، به خصوص اینکه چقدر آنها با هنرمندان خود شفاف هستند و چقدر با طرفداران خود مرتبط هستند. میدلتون در بیانیه‌ای گفت: «پس از بیش از یک دهه مدیریت مستقل وست‌وود، می‌دانم حمایت درست چقدر می‌تواند برای یک هنرمند یا", "image_url": "", "category": "هوش مصنوعی مولد", "tags": ["موسیقی", "سرمایه‌گذاری"], "datetime_fa": "۶ آبان • ۱۸:۳۰"}, {"source": "Billboard", "title": "Brandy, Lena Waithe & More Named Members of 2026 Ebony Power 100 Honoree Court", "link": "https://www.billboard.com/music/awards/brandy-2026-ebony-power-100-honoree-1236369539/", "summary": "Grammy Award-winning artist Brandy , Emmy Award-winning writer-producer-actor Lena Waithe and Allen Media Group founder Byron Allen are three of the six special honorees who will be celebrated during the 2026 Ebony Power 100 Gala. The event will take place at the Hollywood Palladium in Los Angeles on Nov. 9. The three additional special honorees comprising the Power 100 Court are Seattle Storm WNBA player Flau jae Johnson, digital influencer and culinary tastemaker Keith Lee and NASA Astronaut Emeritus Victor Glover. Encompassing music, sports, media ownership, finance and space exploration, the court personifies the gala’s theme, “The Stories We Shape.” In accepting their award on stage, each member of the court will be honored with a dedicated tribute. “For more than 80 years, Ebony has kept the record of the people moving Black America forward, and the court is that record at its most vivid,” said Ebony CEO Eden Bridgeman in announcing the news. “They wrote it themselves, and that is exactly what this year’s Power 100 celebrates.” The ceremony will take honorees and guests inside an immersive creative world called “La Cour” — a reimagining of historical grand royal courts. Headlining the evening’s live entertainment will be Grammy winners Kirk Franklin and T.I., who will open and close the celebration, respectively. T.I. is also a member of this year’s Power 100 Music Innovators class. T.I., as well as every member of the 2026 Power 100, will be recognized during the ceremony. Additional honorees in the Music Innovators class who were previously announced include Jay-Z, Megan Thee Stallion, Durand Bernarr and Adam Blackstone. The complete list of Power 100 honorees — leaders chosen across 11 categories — is available on the Ebony website . The 2026 Ebony Power 100 Gala is produced in partnership with Jesse Collins Entertainment.", "date_str": "2026-10-28T15:00:00+00:00", "hash": "5435e903293f9249", "title_fa": "برندی، لنا ویث و سایرین اعضای نام‌گذاری شده در دادگاه Honoree Ebony Power 100 2026", "summary_fa": "برندی هنرمند برنده جایزه گرمی، لنا وایت نویسنده، تهیه کننده و بازیگر برنده جایزه امی و بایرون آلن، بنیانگذار گروه رسانه ای آلن، سه نفر از شش جایزه ویژه هستند که در مراسم جشن آبنوس پاور 100 2026 تجلیل خواهند شد. این رویداد در تاریخ 9 نوامبر در هالیوود پالادیوم در لس آنجلس برگزار خواهد شد. سه جایزه ویژه دیگر که شامل Power 100 Court هستند عبارتند از فلو جاه جانسون بازیکن WNBA سیاتل استورم، کیت لی، اینفلوئنسر دیجیتال و طعم‌دهنده آشپزی و فضانورد بازنشسته ناسا، ویکتور گلاور. این دادگاه که شامل موسیقی، ورزش، مالکیت رسانه، امور مالی و اکتشاف فضایی است، مضمون گالا، \"داستان هایی که ما شکل می دهیم\" را به تصویر می کشد. با دریافت جایزه خود بر روی صحنه، از هر یک از اعضای دادگاه با یک ادای احترام ویژه تجلیل خواهد شد. ادن بریجمن، مدیرعامل آبنوس در اعلام این خبر گفت: \"بیش از 80 سال، آبنوس سابقه افرادی را که سیاه‌پوست آمریکا را به جلو می‌برند، حفظ کرده است و دادگاه این رکورد در واضح‌ترین حالت خود است.\" آنها خودشان آن را نوشتند و این دقیقا همان چیزی است که Power 100 امسال جشن می گیرد. مراسم تجلیل‌کنندگان و مهمانان را به دنیای خلاقانه‌ای به نام «La Cour» می‌برد - تصویری دوباره از بارگاه‌های سلطنتی بزرگ. کرک فرانکلین و تی.آی برندگان جایزه گرمی، تیتر اصلی برنامه های سرگرمی زنده این شب خواهند بود که به ترتیب جشن را افتتاح و تعطیل خواهند کرد. T.I. همچنین یکی از اعضای کلاس Power 100 Music Innovators امسال است. T.I و همچنین تمامی اعضای Power 100 2026 در این مراسم مورد تقدیر قرار خواهند گرفت. برگزیدگان دیگر در کلاس نوآوران موسیقی که قبلا اعلام شده بودند عبارتند از Jay-Z، Megan Thee Stallion، Durand Bernarr و Adam Blackstone. فهرست کامل برگزیدگان Power 100 - رهبران انتخاب شده در 11 دسته", "image_url": "https://www.billboard.com/wp-content/uploads/2026/10/2258989577.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["موسیقی"], "datetime_fa": "۶ آبان • ۱۸:۳۰"}, {"source": "Billboard", "title": "Ezekiel Lewis Talks New Epic Records CEO Gig & the Art of A&R: ‘It’s Not About Genres. It’s About Artists’", "link": "https://www.billboard.com/pro/epic-records-ezekiel-lewis-ceo-role-first-time-interview/", "summary": "Ezekiel Zeke Lewis doesn t have the typical origin story of a major label CEO. He got his start as a Grammy-winning songwriter and producer in Atlanta, co-penning songs like One Less Lonely Girl by Justin Bieber and The Way I Are by Timbaland , often with his collective The Clutch, before he made his jump to the boardroom. Today, however, Lewis sees the creative journey as critical to his understanding of the music business and what artists need from their industry partners. When I got inside the building, I realized that my songwriting career and the fact that I had achieved some success was a miracle, he explains. He was fascinated by the way music moves through buildings, and he found a new calling to get inside to help creators navigate the industry with greater success. Related Molly Neuman on the Evolution of Independent Music From the 90s to Now: ‘It Was a High-Risk Business’ First, he built up his own publishing house, Bar Music Group. Then he landed an A R gig at Motown Records, where he worked his way up the ladder to become senior vp of A R by the time he left in 2018. That job was also where he first worked with legendary label executive Sylvia Rhone , who he says taught him to be diligent, never give up and never take no for an answer, as he puts it. But when Rhone left the job and took a role at Sony Music s Epic Records, where she eventually rose to become its CEO/chairman, she courted Lewis to follow her and scout the next generation of talent there. As Lewis has advanced in his career at Epic, he s played a pivotal role in shaping the careers of 21 Savage, Madison Beer, BIA, Black Eyed Peas, DDG, Future, GIVĒON, Zara Larsson, Mariah the Scientist, Travis Scott, Southside, Meghan Trainor and Tyla. When Rhone stepped away in 2025, rumors swirled that Lewis was being eyed as her successor. In March, the confirmation finally came that Lewis had been appointed CEO/chairman of Epic. Lewis joins the latest episode of Billboard On the Record in his first-ever interview as CEO and chairman to discuss what it takes to run a successful label in 2026, how he approaches A R, and how his songwriting career shaped his leadership in the boardroom. To watch this episode of Billboard On the Record , sponsored by ASCAP, check out the YouTube video below or click here for more viewing and listening options. An edited and condensed excerpt of the conversation can also be found below. You have built up your whole business career in music in A R. This historical", "date_str": "2026-10-28T14:16:06+00:00", "hash": "7dac87e2fece64c2", "title_fa": "ازکیل لوئیس درباره ژانرها صحبت می کند. درباره هنرمندان است", "summary_fa": "Ezekiel Zeke Lewis داستان منشأ معمولی یک مدیر عامل لیبل بزرگ را ندارد. او کار خود را به عنوان یک ترانه‌سرا و تهیه‌کننده برنده گرمی در آتلانتا آغاز کرد و آهنگ‌هایی مانند One Less Lonely Girl اثر جاستین بیبر و The Way I Are از تیمبالند، اغلب با گروه خود The Clutch، قبل از اینکه به اتاق هیئت مدیره بپرد، نوشت. با این حال، امروز، لوئیس سفر خلاقانه را برای درک خود از تجارت موسیقی و آنچه هنرمندان از شرکای خود در صنعت نیاز دارند، حیاتی می‌داند. او توضیح می دهد که وقتی وارد ساختمان شدم، متوجه شدم که حرفه ترانه سرایی من و این واقعیت که به موفقیت هایی دست یافته ام یک معجزه است. او مجذوب روشی بود که موسیقی در ساختمان‌ها حرکت می‌کند و فراخوان جدیدی برای ورود به داخل پیدا کرد تا به سازندگان کمک کند تا با موفقیت بیشتری در صنعت حرکت کنند. مولی نیومن در مورد تکامل موسیقی مستقل از دهه 90 تا کنون: «این یک تجارت پرخطر بود» ابتدا، او انتشارات خود را به نام گروه موسیقی بار تأسیس کرد. سپس یک کنسرت A R را در Motown Records انجام داد، جایی که از نردبان بالا رفت تا در سال 2018، معاون ارشد A R شود. این کار همچنین جایی بود که او برای اولین بار با سیلویا رون، مدیر اجرایی لیبل افسانه ای کار کرد، که به گفته او به او آموخت که سخت کوش باشد، هرگز تسلیم نشود و هرگز جواب منفی ندهد. اما زمانی که رون کار را ترک کرد و در سونی موزیک اپیک رکوردز ایفای نقش کرد، جایی که در نهایت به مدیرعاملی/رئیس آن تبدیل شد، از لوئیس خواست که او را دنبال کند و نسل بعدی استعدادها را در آنجا جستجو کند. از آنجایی که لوئیس در حرفه خود در Epic پیشرفت کرده است، او نقش اساسی", "image_url": "https://www.billboard.com/wp-content/uploads/2023/05/Ezekiel-Lewis-2023-cr-Travis-Shinn-billboard-1548.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["موسیقی"], "datetime_fa": "۶ آبان • ۱۷:۴۶"}, {"source": "Billboard", "title": "Leading U.K. Indies Distiller Records & Speedy Wunderground Launch Label Partnership With New Heartworms Material", "link": "https://www.billboard.com/pro/distiller-records-speedy-wunderground-labels-partnership/", "summary": "Leading U.K. indie record labels Distiller Records and Speedy Wunderground have launched a new partnership. The new collaboration begins with the release of Heartworms’ new single “Guess I’m Stuck in the Dark,” out Tuesday (Oct. 27). Under the new partnership, Speedy Wunderground will retain “full creative autonomy over its A R and production” and utilize Distiller’s “marketing, distribution, and operational scale to amplify its roster further,” per a joint statement. Speedy Wunderground was founded in London by producer Dan Carey and has been instrumental in shaping the sound of the capital’s indie and alternative scene for the past decade with Black Country, New Road, Squid, Black Midi and Mercury Prize winners English Teacher all releasing early material via the label. In his work as a producer, Carey has credits on studio albums by Fontaines D.C. , Wet Leg and Kneecap , among others. Distiller, led by managing director James Moodie , recently scored its first U.K. No. 1 album with Blossoms’ sixth studio album Songs From the Wedding Cake . Its roster also includes Reverend The Makers, Yonaka, Sports Team and The Ramona Flowers. Heartworms is the moniker for London-based musician Josephine Orme, who released her 2025 debut album Glutton for Punishment through Speedy Wunderground. The album charted at No. 9 on the U.K.’s Independent Albums Chart. She’ll be the lead support act for Interpol and Bloc Party ’s co-headline tour in the U.K. and Europe, beginning Nov. 20 in Birmingham. Speaking on the collaboration Moodie said, “I’ve always loved what Dan and the team at Speedy Wunderground have built, it’s a respected label brand that is the very definition of creative integrity and credibility. This partnership is about giving each artist a bigger platform, deeper resources, and the backing to push their incredible talents even further. Carey added, “It s a great partnership as the team at Distiller are really experienced and clearly understand the ethos of Speedy and the way we like to work. We re looking forward to working together on a range of different projects, from very quick turnaround punk records to big campaigns — kicking off with this week s release from Heartworms.”", "date_str": "2026-10-28T14:11:26+00:00", "hash": "9722d924b029fda0", "title_fa": "مشارکت لیبل پیشرو در هند Distiller Records & Speedy Wunderground Launch با مواد جدید Heartworms", "summary_fa": "شرکت‌های موسیقی مستقل پیشرو در بریتانیا Distiller Records و Speedy Wunderground همکاری جدیدی را راه‌اندازی کرده‌اند. همکاری جدید با انتشار تک آهنگ جدید Heartworms \"Guess I'm Stuck in the Dark\" در روز سه شنبه (27 اکتبر) آغاز می شود. طبق یک بیانیه مشترک، Speedy Wunderground بر اساس شراکت جدید، \"استقلال خلاقانه کامل در مورد A R و تولید خود\" را حفظ خواهد کرد و از \"بازاریابی، توزیع و مقیاس عملیاتی Distiller برای تقویت بیشتر فهرست خود\" استفاده خواهد کرد. Speedy Wunderground در لندن توسط تهیه کننده Dan Carey تأسیس شد و در شکل دادن به صدای صحنه مستقل و جایگزین پایتخت در دهه گذشته با برندگان Black Country، New Road، Squid، Black Midi و Mercury Prize معلم انگلیسی که همگی مطالب اولیه را از طریق این لیبل منتشر کردند، نقش اساسی داشته است. کری در کار خود به‌عنوان تهیه‌کننده، در آلبوم‌های استودیویی از فونتینز دی سی، پا خیس و کاسه زانو و غیره نام‌هایی دارد. Distiller به رهبری جیمز مودی، مدیر عامل، اخیراً اولین آلبوم شماره 1 بریتانیا را با ششمین آلبوم استودیویی Blossoms Songs From the Wedding Cake به دست آورد. فهرست آن همچنین شامل Reverend The Makers، Yonaka، Sports Team و The Ramona Flowers است. Heartworms نام ژوزفین اورمه، موسیقیدان ساکن لندن است که اولین آلبوم خود را در سال 2025 Glutton for Punishment از طریق Speedy Wunderground منتشر کرد. این آلبوم در جدول آلبوم های مستقل بریتانیا در رتبه نهم جدول قرار گرفت. او نقش اصلی پشتیبانی برای تور مشترک اینترپل و حزب بلوک در بریتانیا و اروپا خواهد بود که از 20 نوامبر در بیرمنگام آغاز می شود. مودی در مورد همکاری گفت: \"من همیشه آنچه را دن و تیم Speedy Wunderground ساخته اند دوست داشته ام، این یک برند معتبر برچسبی است که دقیقاً یکپارچگی و اعتبار خلاقانه را تعریف می کند. این مشارکت به", "image_url": "https://www.billboard.com/wp-content/uploads/2026/10/Heartworms-Oliver-Day-billboard-1800.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["موسیقی"], "datetime_fa": "۶ آبان • ۱۷:۴۱"}, {"source": "Deadline", "title": "Sundance 2027 In Boulder Unveils Legacy Lineup With ‘Better Luck Tomorrow’, ‘Memento’, ‘Y Tu Mamá También’ & More", "link": "https://deadline.com/2026/10/sundance-2027-legacy-lineup-memento-y-tu-mama-tambien-1237207060/", "summary": "Sundance Film Festival 2027 has announced its first lineup for the inaugural Boulder, Colorado edition with the The Legacy Program, formerly known as From the Collection, which includes archival and restored screenings of indie classics that launched at the fest. Cinephile social platform, Letterboxd, is a co-presenter of the Legacy program, and there will be [ ]", "date_str": "2026-10-28T15:00:00+00:00", "hash": "7954cb7fee09e55d", "title_fa": "Sundance 2027 In Boulder از ترکیب قدیمی با ory": "هوش مصنوعی مولد", "tags": ["سینما", "نتفلیکس"], "datetime_fa": "۶ آبان • ۱۷:۳۹"}, {"source": "Pitchfork", "title": "Panda Bear Unveils New Live Album", "link": "https://pitchfork.com/story/panda-bear-unveils-new-live-album/", "summary": "PB Band Live 25 at Power Station gathers 17 tracks cut last year at the famed New York recording studio", "date_str": "2026-10-28T14:10:42+00:00", "hash": "d5eb1f370b35c4f3", "title_fa": "خرس پاندا از آلبوم جدید خود رونمایی کرد", "summary_fa": "گروه PB Live 25 در Power Station 17 آهنگ را گردآوری می کند که سال گذشته در استودیوی ضبط مشهور نیویورک برش داده شد. کلیدها و طبل ها در نقاط مختلف LP. با توجه به محدودیت‌های یک پسر بودن، تور کردن به رویکرد متفاوتی نیاز داشت. لنوکس تیم کوه را برای تصاحب باس، ماریا ریس در کیبورد و سازهای کوبه ای، تومه سیلوا در درام، و Spirit of the Beehive's Rivka Ravede در سمپلرها استخدام کرد. هر چهار بک وکال. اکنون، لنوکس آلبوم زنده جدیدی را اعلام کرده است که گروه پنج نفری را در حال حرکت به تصویر می کشد. 17 آهنگ PB Band Live 25 at Power Station در 11 دسامبر در مجموعه ضبط استودیو زنده Domino Domino Domino عرضه می شود. ال‌پی قطعاتی را جمع‌آوری می‌کند که گروه در استودیوی مشهور نیویورک پاییز گذشته در پی یک تور در سراسر بریتانیا و اروپا گذاشته بودند. اولین پیش‌نمایش، نسخه زنده «قرص‌ها» اکنون منتشر شده است. زیر گوش کنید از زمان انتشار Sinister Grift در سال 2025، لنوکس در کیف مشترک خود بازگشته است. او آلبوم مشترک دیگری را با Sonic Boom به اشتراک گذاشت، A ? از When، در ماه جولای، و دوباره با Animal Collective برای اجرای اجرای زنده به آلبوم سال 2005 خود، Feels، پیوستند. پس از طرح ریزی اولیه فقط دو تاریخ - یکی در نیویورک و دیگری در لس آنجلس - گروه در پاسخ به یک نقص در تهیه بلیط تعداد نمایش ها را دو برابر کرد. درباره Sinister Grift در شماره 43 در 50 بهترین آلبوم 2025 بخوانید. Panda Bear: PB Band Live 25 at Power Station 37$ at Rough Trade PB Band Live 25 at Power Station : 01 Shepard Tone (Live at Power Station) 02 Song for Ariel (Live at Power Station) 03 Sequential Circuits (Live at Power Station) (Live Here", "i ت را رد کرده است. قبل از اتهامات عمومی، برند بیشتر به خاطر کارهای کمدی خود در هالیوود مانند فراموش کردن سارا مارشال در سال 2008 و کمدی او را به یونانی در سال 2010 می شناخت. (او همچنین شوهر مشهور سابق کیتی پری، ستاره پاپ بود. این دو پس از 14 ماه از هم جدا شدند.) در سال های اخیر، او به سمت کار کارشناسی دیجیتال متمرکز شده بود و پادکست هایی با محوریت معنویت و توطئه های ضد دولتی ایجاد می کرد. اما در یک تحقیق مستند در سال 2023، راسل برند: در یک دید ساده، چندین زن برند را به اقدامات غارتگرانه، از سوء استفاده، تجاوز، و تجاوز متهم کردند. پس از آزادی، شش زن به طور مستقل به پلیس رفتند و او را به تجاوزات گذشته متهم کردند.", "image_url": "https://www.rollingstone.com/wp-content/uploads/2026/10/russell-brand-speaks-at-trial.jpg?w=1600&#038;h=900&#038;crop=1", "category": "هوش مصنوعی مولد", "tags": ["رسانه", "هنر"], "datetime_fa": "۶ آبان • ۱۸:۲۸"}, {"source": "Rolling Stone", "title": "Bob Dylan Played ‘Not Dark Yet’ for First Time in Seven Years, and Totally Reimagined It", "link": "https://www.rollingstone.com/music/music-news/bob-dylan-not-dark-yet-first-time-seven-years-1235649184/", "summary": "He shaved two minutes off the Time Out of Mind classic, but added in a distinct reggae touch and made some of the darkest lyrics of his career feel significantly less dreary", "date_str": "2026-10-28T14:53:21+00:00", "hash": "f2cee5fb00a3f44a", "title_fa": "باب دیلن برای اولین بار بعد از هفت سال «هنوز تاریک» را بازی کرد و کاملاً آن را دوباره تصور کرد.", "summary_fa": "او دو دقیقه از کلاسیک Time Out of Mind تراشید، اما با یک لمس رگی متمایز اضافه کرد و باعث شد تا برخی از تاریک‌ترین اشعار حرفه‌ای‌اش به‌طور قابل‌توجهی کمتر ترسناک به نظر برسند. در سالن میتسوبیشی الکتریک در دوسلدورف، آلمان، در 27 اکتبر، او کلاسیک Time Out of Mind Not Dark Yet را برای اولین بار پس از هفت سال منتشر کرد. هیچ شباهتی به 191 اجرای زنده قبلی این آهنگ در سه دهه گذشته نداشت. تنها با چهار دقیقه و 30 ثانیه، دو دقیقه کوتاهتر از ضبط استودیو در سال 1997 است، حتی اگر او تمام آیات را خواند. اما او با کمی لمس رگی اضافه کرد،  مداک، کارگردان فیلم‌های The Changeling و The Krays در ۸۸ سالگی درگذشت", "summary_fa": "پیتر مداک، کارگردان و بازیگر مجارستانی الاصل که بیشتر برای فیلم‌هایی از جمله The Changeling، The Krays و The Ruling شناخته می‌شد، روز سه‌شنبه در لس‌آنجلس درگذشت. او 88 سال داشت. مداک در طول 6 دهه فعالیت حرفه ای، 27 فیلم بلند را کارگردانی کرد که بین درام های ترسناک روانی، کمدی سیاه و درام جنایی حرکت می کرد. تریلر ماوراء طبیعی او در سال 1980 The Changeling با بازی [ ] Medak همچنین به طور گسترده در تلویزیون کار کرد و قسمت‌هایی از Breaking Bad و The Wire را کارگردانی کرد. پیتر مداک، کارگردان و بازیگر مجارستانی الاصل که بیشتر برای فیلم‌هایی مانند The Changeling، The Krays و The Ruling شناخته می‌شد، روز سه‌شنبه در لس‌آنجلس درگذشت. او 88 سال داشت. مداک در سال 1937 در بوداپست به دنیا آمد و بخشی از جنگ جهانی دوم را با خانواده خود در مخفیگاه گذراند. در رژیم کمونیستی مجارستان، پدرش زندانی شد و مداک از رفتن به مدرسه منع شد. او در جریان انقلاب مجارستان در سال 1956 به انگلستان گریخت و شروع به کار در صنعت فیلم بریتانیا کرد و در نهایت پیش از نقل مکان به هالیوود به عنوان دستیار کارگردان مشغول به کار شد. او اولین کارگردانی بلند خود را با فیلم منفی در سال 1968 با بازی گلندا جکسون انجام داد. طنز او در سال 1972، طبقه حاکم، با بازی پیتر او تول، برای دریافت نخل طلایی در کن رقابت کرد و نامزدی اسکار را برای تول به دست آورد. از دیگر فیلم‌ها می‌توان به یک روز در مرگ جو تخم، اجازه دهید آن را داشته باشد و رومئو در حال خونریزی به رهبری گری اولدمن است. از او چهار فرزند، کریستوفر، جاشوا، کارن و کورنلا و پنج نوه به یادگار مانده است.", "image_url": "https://variety.com/wp-content/uploads/2026/10/peter-medak_.png?w=1000&#038;h=563&#038;crop=1", "category": "سینما و سریال", "tags": ["سینما"], "datetime_fa": "۶ آبان • ۱۷:۴۸"}]

      localStorage.setItem('read_articles_registry', JSON.stringify(Array.from(readArticles)));
      renderNews();
    }

    function renderNews() {
      const container = document.getElementById('newsContainer');
      const rawItems = data[currentTab] || [];
      
      const filtered = rawItems.filter(item => {
        if (!searchQuery) return true;
        const q = searchQuery.toLowerCase();
        const title = (item.title_fa || item.title || '').toLowerCase();
        const summary = (item.summary_fa || item.summary || '').toLowerCase();
        const source = (item.source || '').toLowerCase();
        const category = (item.category || '').toLowerCase();
        const tags = (item.tags || []).join(' ').toLowerCase();
        return title.includes(q) || summary.includes(q) || source.includes(q) || category.includes(q) || tags.includes(q);
      });

      const unreadList = [];
      const readList = [];

      filtered.forEach(item => {
        if (readArticles.has(item.hash)) {
          readList.push(item);
        } else {
          unreadList.push(item);
        }
      });

      const sortedItems = [...unreadList, ...readList];

      if (sortedItems.length === 0) {
        container.innerHTML = '<div style="text-align:center; padding: 40px; color: var(--text-muted);">هیچ خبری در این بخش در ۲۴ ساعت گذشته ثبت نشده است.</div>';
        return;
      }

      container.innerHTML = sortedItems.map((item, idx) => {
        const title = item.title_fa || item.title || '';
        const summary = item.summary_fa || item.summary || '';
        const source = item.source || 'منبع خبر';
        const link = item.link || '#';
        const isRead = readArticles.has(item.hash);
        const num = toFaDigits(idx + 1);
        const category = item.category || '';
        const tags = item.tags || [];
        const datetimeFa = item.datetime_fa || '';

        return `
          <article class="news-card ${isRead ? 'is-read' : ''}" id="card-${item.hash}">
            <div class="news-header">
              <span class="news-num">${isRead ? '✓' : num}</span>
              <h2 class="news-title">${title}</h2>
            </div>
            ${summary ? `<p class="news-summary">${summary}</p>` : ''}
            <div class="news-footer">
              <div class="footer-top-row">
                <div class="meta-group">
                  <span class="news-source">📌 ${source}</span>
                  ${datetimeFa ? `<span class="news-datetime">🕒 ${datetimeFa}</span>` : ''}
                  ${category ? `<span class="news-category-badge" onclick="filterByTag('${category}')">📂 ${category}</span>` : ''}
                </div>
              </div>
              ${tags && tags.length > 0 ? `
                <div class="footer-tags-row">
                  ${tags.map(t => `<span class="news-tag-chip" onclick="filterByTag('${t}')">#${t}</span>`).join('')}
                </div>
              ` : ''}
              <div class="footer-bottom-row">
                <div class="footer-actions-right">
                  <button class="btn-mark-read" onclick="toggleRead('${item.hash}')">
                    ${isRead ? '✓ خوانده شد' : '○ علامت خوانده‌شده'}
                  </button>
                </div>
                <div class="footer-actions-left">
                  ${link && link.startsWith('http') ? `<a href="${link}" target="_blank" rel="noopener noreferrer" class="news-link">مطالعه اصل خبر ↗</a>` : ''}
                </div>
              </div>
            </div>
          </article>
        `;
      }).join('');
    }

    function filterByTag(val) {
      const searchInput = document.getElementById('searchInput');
      if (searchInput) {
        searchInput.value = val;
        searchQuery = val;
        renderNews();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    }

    function switchTab(tab, el) {
      currentTab = tab;
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      if (el) el.classList.add('active');
      renderNews();
    }

    function toggleTheme() {
      const html = document.documentElement;
      const current = html.getAttribute('data-theme') || 'dark';
      const next = current === 'dark' ? 'light' : 'dark';
      html.setAttribute('data-theme', next);
      localStorage.setItem('theme', next);
      updateThemeButton(next);
    }

    function updateThemeButton(theme) {
      const icon = document.getElementById('themeIcon');
      const text = document.getElementById('themeText');
      if (theme === 'dark') {
        icon.textContent = '☀️';
        text.textContent = 'حالت روشن';
      } else {
        icon.textContent = '🌙';
        text.textContent = 'حالت تاریک';
      }
    }

    function toggleArchiveModal(show) {
      const modal = document.getElementById('archiveModal');
      if (show) {
        renderArchiveList();
        modal.classList.add('active');
      } else {
        modal.classList.remove('active');
      }
    }

    function renderArchiveList() {
      const listContainer = document.getElementById('archiveListContainer');
      if (!archiveManifest || archiveManifest.length === 0) {
        listContainer.innerHTML = '<div style="text-align:center; padding: 20px; color: var(--text-muted);">هنوز شماره قبلی ثبت نشده است.</div>';
        return;
      }

      listContainer.innerHTML = archiveManifest.map(item => `
        <a href="${item.url}" class="archive-item">
          <div>
            <div class="archive-date-fa">📰 شماره ${item.p_date}</div>
            <div class="archive-date-g">🌍 ${item.g_date}</div>
          </div>
          <span class="archive-arrow">←</span>
        </a>
      `).join('');
    }

    const savedTheme = localStorage.getItem('theme') || 'dark';
    document.documentElement.setAttribute('data-theme', savedTheme);
    updateThemeButton(savedTheme);

    document.getElementById('searchInput').addEventListener('input', (e) => {
      searchQuery = e.target.value.trim();
      renderNews();
    });

    renderNews();
  </script>
</body>
</html>
