hikes to fully tame. Stocks dropped sharply and bond yields rose as the Fed chair wrapped up his press conference, with losses accelerating into the end of the trading session. Here's where major indexes stood at the 4 p.m. ET closing bell: S P 500 : 7,552.34, down 0.44% Dow Jones Industrial Average : 51,462.55, down 1.19 (-630.56 points) Nasdaq 100 : 28,945.06, up 0.02% The 10-year Treasury was back above 5% at the end of the day after dipping below the threshold right after the rate decision. The Fed-sensitive 2-year bond yield spiked 6 basis points to 4.72%. The Fed's updated Summary of Economic Projections suggests that central bankers see one more rate hike coming before the end of the year. Some investors are pricing in even more rate hikes than reflected in the central bank's own projections, Brian Therien, a senior investment strategy analyst at Edward Jones, said. The odds that the Fed will raise rates by 50 basis points by the end of the year also rose to 38%, up from a 10% probability priced in last week, according to the CME FedWatch tool. \"The message from the dot plot is clear: rates may move higher and remain elevated for longer than investors previously expected,\" Brian Rehling, the co-head of global fixed income and digital asset strategy at Wells Fargo Investment Institute, wrote in a note on Wednesday. Warsh , who has been opposed to issuing forward guidance for monetary policy, said central bankers had come to the conclusion that rates needed to be more restrictive in order for the Fed to fulfill its 2% inflation commitment. He added that the decision was not influenced by recent volatility in the bond market . \"Warsh's press conference closely echoed t", "date_str": "2026-09-16T20:03:35+00:00", "hash": "8639d6397cabeac0", "title_fa": "در حالی که فدرال رزرو با تورم مبارزه می کند، چشم انداز افزایش بیشتر نرخ بهره، بازارها را نگران کرده است", "summary_fa": "اندرو هارنیک/ گتی ایماژ به نظر می‌رسید که بازار اولین افزایش نرخ در سه سال اخیر را داشته باشد، اما سرمایه‌گذاران در اواخر روز متعجب شدند. فدرال رزرو همانطور که انتظار می رفت نرخ بهره را افزایش داد، اما کوین وارش اعلام کرد که تورم همچنان یک ریسک بزرگ است. به نظر می‌رسید که بازار افزایش نرخ روز چهارشنبه را به خوبی دریافت می‌کند، تا اینکه ناگهان چنین نشد. پس از اولین افزایش نرخ بهره از سوی فدرال رزرو در سه سال گذشته، سهام عمدتاً بالاتر بود و بازده اوراق کلیدی کاهش یافت زیرا معامله گران از تمایل بانک مرکزی برای انجام آنچه برای کنترل قیمت ها لازم است تشویق شدند. با این حال، زمانی که کوین وارش اظهارات خود را ارائه کرد، همه چیز تغییر کرد، که نشان می دهد مقامات هنوز تورم را به عنوان یک خطر بزرگ می بینند که برای مهار کامل آن نیاز به افزایش بیشتر دارد. در حالی که رئیس فدرال رزرو کنفرانس مطبوعاتی خود را به پایان رساند، سهام به شدت افت کرد و بازده اوراق قرضه افزایش یافت و زیان در پایان جلسه معاملاتی شتاب گرفت. اینجا جایی است که شاخص های اصلی در ساعت 4 بعدازظهر ایستادند. زنگ پایانی ET: S P 500: 7,552.34، کاهش 0.44% میانگین صنعتی داوجونز: 51,462.55، کاهش 1.19 (-630.56 امتیاز) Nasdaq 100: 28,945.02% بالا تر Treay% 0-06. پایان روز پس از فرورفتن به زیر آستانه درست پس از تصمیم گیری نرخ. بازده اوراق قرضه 2 ساله حساس به فدرال رزرو با 6 واحد افزایش به 4.72 درصد رسید. خلاصه به روز شده پیش بینی های اقتصادی فدرال رزرو نشان می دهد که بانک های مرکزی تا قبل از پایان سال شاهد یک افزایش دیگر نرخ بهره خواهند بود. برایان ترین، تحلیلگر ارشد استراتژی سرمایه گذاری در ادوارد جونز، گفت: برخی از سرمایه گذاران حتی بیشتر از آنچه"}, {"source": "Business Insider", "title": "See Elon Musk's properties over the years, from Bel Air mansions to his secret house in Texas", "link": "https://www.businessinsider.com/elon-musk-real-estate-portfolio-over-the-years-2024-9", "summary": "Elon Musk says he s living in an Airstream trailer near Memphis. Michael M. Santiago/Robert Alexander/Getty Images Elon Musk made headlines in 2020 after announcing he was selling all of his homes. Until then, Musk lived lavishly in several properties in California and Texas. He succeeded in selling most of his known portfolio, but has purchased a few more homes since. In 2020, Elon Musk wrote on X that he was selling \"almost all physical possessions\" and would no longer own a house . The South African-born billionaire and SpaceX CEO had amassed a sizable California real estate portfolio, at one point owning multiple homes in the same neighborhood. His properties included multimillion-dollar mansions with amenities such as pools and tennis courts. Musk said the sales were not solely about money. He wrote on X that he was dedicating himself to Mars and Earth, adding that \"Possessions just weigh you down.\" Sticking to his word, Musk has had a flurry of property sales , and, at one point, claimed to be couch-surfing . Today, despite Musk's estimated net worth of $932.2 billion as of September 2026, Musk's living arrangements remain somewhat modest, relatively speaking. After moving to Texas in 2020, Musk at one point lived in a tiny home near SpaceX's launch site in Boca Chica and has since purchased several other properties in the Austin area. As his businesses expand, he is also putting down roots elsewhere in the South. In Tennessee, where his artificial intelligence startup xAI is building a data center, the billionaire is reportedly living in an Airstream trailer. Take a look at some of the properties Musk has owned over the last few years. After renting for two years, Musk bought a mansion in the Bel Air neighborhood of California. Sotheby s International Relaty Elon Musk's first venture into the swanky California neighborhood of Bel Air was in 2012 when he bought a $17 million, 16,251-square-foot mansion. Musk initially rented the seven-bedroom home in 2010 but decided to move in permanently. The house has a two-story library, a pool, and a tennis court in the backyard, and views overlooking the Bel-Air Country Club. After he pledged to sell all of his properties, he listed the mansion for $30 million in 2020. The Wall Street Journal reported that it was sold to Chinese billionaire William Ding. Musk bought a historic property on the same street as his other Bel Air mansion. Drew Meyers Just a year after his first Bel Air purchase, Musk bought his neig", "date_str": "2026-09-16T20:03:23+00:00", "hash": "670de935c9350d16", "title_fa": "املاک ایلان ماسک را در طول سال ها ببینید، از عمارت های بل ایر تا خانه مخفی او در تگزاس", "summary_fa": "ایلان ماسک می گوید که در یک تریلر Airstream در نزدیکی ممفیس زندگی می کند. مایکل ام. سانتیاگو/رابرت الکساندر/گتی ایماژز ایلان ماسک در سال 2020 پس از اعلام اینکه تمام خانه هایش را می فروشد، خبرساز شد. تا آن زمان، ماسک در چندین ملک در کالیفرنیا و تگزاس زندگی می کرد. او موفق شد بیشتر نمونه کارهای شناخته شده خود را بفروشد، اما از آن زمان تاکنون چند خانه دیگر خریداری کرده است. در سال 2020، ایلان ماسک در X نوشت که \"تقریبا تمام دارایی های فیزیکی\" را می فروشد و دیگر صاحب خانه نخواهد شد. میلیاردر متولد آفریقای جنوبی و مدیر عامل شرکت اسپیس ایکس، مجموعه املاک و مستغلات کالیفرنیای قابل توجهی را جمع آوری کرده بود، در یک مقطع زمانی صاحب چندین خانه در یک محله بود. دارایی های او شامل عمارت های چند میلیون دلاری با امکاناتی مانند استخر و زمین تنیس بود. ماسک گفت که فروش فقط به خاطر پول نبوده است. او در X نوشت که خود را وقف مریخ و زمین می کند و اضافه کرد که \"دارایی فقط شما را سنگین می کند.\" ماسک به قول خود پایبند بوده و فروش ملک زیادی داشته است و در یک مقطع مدعی شد که مبل گردی می کند. امروزه، علی‌رغم برآورد ارزش خالص ماسک تا سپتامبر 2026، 932.2 میلیارد دلار، شرایط زندگی ماسک تا حدودی نسبتاً متوسط ​​است. پس از نقل مکان به تگزاس در سال 2020، ماسک زمانی در یک خانه کوچک در نزدیکی سایت پرتاب اسپیس ایکس در بوکا چیکا زندگی کرد و از آن زمان تاکنون چندین ملک دیگر را در منطقه آستین خریداری کرده است. با گسترش کسب و کار او، او همچنین در جاهای دیگر در جنوب ریشه دارد. در تنسی، جایی که استارتاپ هوش مصنوعی xAI او در حال ساخت یک مرکز داده است، گزارش شده است که میلیاردر"}, {"source": "Business Insider", "title": "Macklemore fans are asking for refunds as Ed Sheeran's Loop Tour falls into disarray. Here's what happened.", "link": "https://www.businessinsider.com/ed-sheeran-loop-tour-macklemore-controversy-explained-2026-9", "summary": "Ed Sheeran and Macklemore in 2014. Ethan Miller/Getty Images for iHeartMedia Ed Sheeran's Loop Tour is at the center of a major controversy. Opening act Macklemore was dropped after delivering a pro-Palestinian speech, sparking backlash. Now, every other opening act has left the tour, prompting some fans to demand a refund. Ed Sheeran and Macklemore are all over the headlines this week — and no, you didn't somehow wake up in 2013, listening to \"Thrift Shop\" and \" The A Team \" on the radio. The two millennial musicians are now at odds after Macklemore was dropped from Ed Sheeran's Loop Tour on September 14, a little over a week after his performances at New Jersey's MetLife Stadium drew headlines — and both support and condemnation — due to his support for Palestinians . Here's what went down at the shows, how Sheeran and Macklemore responded, how fans of both artists reacted, and where the tour stands now. What did Macklemore say at the Ed Sheeran concert? Macklemore joined Sheeran's Loop Tour as an opening act on September 4, with his first show taking place at MetLife Stadium in New Jersey. During his set, Macklemore expressed his support for the Palestinian people. \"A big part of the reason why I wanted to do this tour in the first place is so I could stand up in stadiums like this and say two words that are very near and dear to my heart: 'Free Palestine,'\" Macklemore said before performing his song \" Hind's Hall \" about the student protests at Columbia University. The song was named for Hind Rajab , a 6-year-old Palestinian girl killed by Israeli forces in 2024. He added, \"I believe that every human being walking on this earth deserves exactly the same freedom.\" Macklemore at a concert in August 2026. ARNAUD FINISTRE/AFP/Getty Images After some backlash online, which ranged from calling the rapper antisemitic to saying that an Ed Sheeran concert wasn't the right place for his speech, Macklemore stood his ground at his show the following day, September 5, though he did make it clear he wasn't criticizing all Jewish people. \"Criticism of Israel, criticism of apartheid, being against genocide in no way is a criticism of you. My message is for peace, love, for all human beings to be treated with dignity, respect, and equality,\" he said. On September 12, Pink shared her response to Macklemore's comments on her Instagram, which garnered a lot of coverage. She felt compelled to speak out after fans noticed a repost of hers on Instagram that apparently called", "date_str": "2026-09-16T20:02:23+00:00", "hash": "4cefd244f231157e", "title_fa": "طرفداران مکلمور درخواست بازپرداخت دارند زیرا تور حلقه اد شیران به هم ریخته است. این چیزی است که اتفاق افتاده است.", "summary_fa": "اد شیران و مککلمور در سال 2014. اتان میلر/گتی ایماژ برای iHeartMedia تور حلقه اد شیران در مرکز یک جنجال بزرگ قرار دارد. افتتاحیه مکلمور پس از ایراد یک سخنرانی حامی فلسطین کنار گذاشته شد و واکنش های منفی را برانگیخت. اکنون، هر افتتاحیه دیگری تور را ترک کرده است و باعث شده که برخی از طرفداران درخواست بازپرداخت کنند. اد شیرن و مککلمور سرفصل‌های این هفته هستند - و نه، شما در سال 2013 به نوعی از خواب بیدار نشدید و آهنگ‌های Thrift Shop و The A Team را در رادیو گوش دادید. این دو نوازنده هزاره اکنون پس از کنار گذاشته شدن مکلمور از تور حلقه اد شیران در 14 سپتامبر، کمی بیش از یک هفته پس از اینکه اجرای او در استادیوم مت لایف نیوجرسی سرفصل خبرها - و هم حمایت و هم محکومیت - را به خود جلب کرد، به دلیل حمایت او از فلسطینیان، با هم اختلاف دارند. در اینجا چیزی است که در نمایش ها رخ داد، شیرن و مککلمور چگونه واکنش نشان دادند، طرفداران هر دو هنرمند چگونه واکنش نشان دادند و اکنون تور در کجا ایستاده است. مککلمور در کنسرت اد شیران چه گفت؟ مککلمور در ۴ سپتامبر به تور شیرانز لوپ پیوست و اولین نمایش او در استادیوم مت لایف نیوجرسی برگزار شد. مکلمور در طول ستایش حمایت خود را از مردم فلسطین اعلام کرد. مککلمور قبل از اجرای آهنگ هندز هال خود درباره اعتراضات دانشجویی در دانشگاه کلمبیا گفت: \"بخش بزرگی از دلیلی که من می خواستم این تور را در وهله اول انجام دهم این بود که می توانستم در استادیوم هایی مانند این بایستم و دو کلمه را بگویم که برای من بسیار نزدیک و عزیز است: \"فلسطین آزاد\". این آهنگ به نام هند رجب، دختر 6 ساله فلسطینی که توسط نیروهای اسرائیلی در سال 2024 کشته شد،"}, {"source": "Business Insider", "title": "3 takeaways for what the first Fed hike in 3 years means for your wallet", "link": "https://www.businessinsider.com/3-takeaways-from-the-september-fed-meeting-rate-hike-2026-9", "summary": "Chair Kevin Warsh took a tough-on-inflation tone at the September meeting. Bloomberg/Getty Images The Fed opted to hike rates at the September meeting, the first in three years. Warsh said inflation rates are the Fed's top priority, despite trade and geopolitical shocks. The new chair is committed to independence and declined to comment on Trump. Kevin Warsh is taking a big swing at America's inflation problem . Alongside the Federal Open Market Committee , the new central bank chair opted to hike rates by a quarter point on Wednesday. It's the first time the Fed has increased interest rates since summer 2023, and the first policy change under Warsh's tenure. Here are Business Insider's biggest takeaways, from the hawkish dot plot to Fed independence . The FOMC is feeling hawkish The FOMC voted unanimously for a quarter-point hike, a uniform decision after a series of split votes over the past year. In the committee's quarterly economic projections, the group said it expects GDP growth to remain relatively strong, unemployment to hold steady, and inflation to stay above the FOMC's 2% goal through the rest of the year . Eighteen members shared their opinions on where rates will end up, with Warsh recusing himself because he doesn't believe in forward guidance . A majority of central bank leaders expect one more hike before the year ends. In the final meetings of the year, two members expect holds, and four see two standard-sized hikes. As Warsh said during the press conference, inflation is the Fed's top priority. \"The least well off have the most to gain from stable prices,\" he said. \"The decision we made today was the right decision to deliver on the remit that Congress gave us to ensure stable prices.\" Consumers can expect a higher rate era As Warsh put it, \"The Fed has an enormous amount of power.\" A single rate change won't impact Americans' daily finances. It will take months — and sustained hikes — for people to see a change in their monthly bills. With Warsh's renewed commitment to temper inflation, however, consumers can expect a continued era of higher interest rates . It means that mortgages, auto loans, credit cards, and other forms of borrowing will be more expensive, and savers could see stronger returns in their high-yield savings accounts. All of these interest rates closely follow Fed patterns. Take homebuying: If 30-year fixed mortgages rise over time, Americans will be less likely to move and risk losing their lower, locked-in payments. F", "date_str": "2026-09-16T19:49:19+00:00", "hash": "918ce7ca11056553", "title_fa": "3 پیشنهاد برای اولین افزایش فدرال رزرو پس از 3 سال برای کیف پول شما", "summary_fa": "رئیس کوین وارش در نشست سپتامبر لحن سختگیرانه‌ای نسبت به تورم داشت. بلومبرگ/گتی ایماژ فدرال رزرو در نشست سپتامبر، اولین جلسه در سه سال اخیر، نرخ بهره را افزایش داد. وارش گفت نرخ تورم با وجود شوک های تجاری و ژئوپلیتیکی، اولویت اصلی فدرال رزرو است. رئیس جدید به استقلال متعهد است و از اظهار نظر درباره ترامپ خودداری کرد. کوین وارش نوسان بزرگی در مورد مشکل تورم آمریکا می گیرد. در کنار کمیته بازار آزاد فدرال، رئیس جدید بانک مرکزی تصمیم گرفت تا روز چهارشنبه نرخ بهره را یک چهارم افزایش دهد. این اولین بار است که فدرال رزرو از تابستان 2023 نرخ بهره را افزایش می دهد و اولین تغییر سیاست در دوران تصدی وارش است. در اینجا بزرگ‌ترین دستاوردهای Business Insider، از طرح نقطه‌های شاهین گرفته تا استقلال فدرال رزرو آورده شده است. FOMC احساس جنگ طلبی می کند FOMC به اتفاق آرا به افزایش یک چهارم امتیازی رای داد، تصمیمی یکسان پس از یک سری آرا تقسیم شده در سال گذشته. در پیش‌بینی‌های اقتصادی فصلی کمیته، این گروه گفت که انتظار دارد رشد تولید ناخالص داخلی نسبتاً قوی باقی بماند، بیکاری ثابت بماند و تورم در بقیه سال بالاتر از هدف 2 درصدی FOMC باقی بماند. هجده عضو نظرات خود را در مورد اینکه نرخ ها به کجا ختم می شود به اشتراک گذاشتند و وارش خود را کنار گذاشت زیرا به راهنمایی رو به جلو اعتقادی ندارد. اکثر رهبران بانک مرکزی پیش از پایان سال انتظار یک افزایش دیگر را دارند. در جلسات پایانی سال، دو عضو انتظار برگزاری دارند و چهار عضو شاهد دو افزایش در اندازه استاندارد هستند. همانطور که وارش در کنفرانس مطبوعاتی گفت، تورم اولویت اصلی فدرال رزرو است. او گفت: «افراد کم برخوردار بیشترین سود را از ثبات قیمت ها دارند. تصمیمی که امروز گرفتیم، تصمیم درستی برای انجام تعهداتی"}, {"source": "Business Insider", "title": "Quince can be hit-or-miss, but I swear by this $72 sweater dress", "link": "https://www.businessinsider.com/guides/style/quince-sweater-dress-review", "summary": "When you buy through our links, Business Insider may earn an affiliate commission. Learn more Gabrielle Chase/Business Insider I reject the idea that I have to stop wearing dresses once fall rolls around. This heavyweight long-sleeved midi dress from Quince started as one outfit and quickly progressed to at least four in the first month I had it. Most people are familiar with the name Quince , but if you've never actually tried Quince clothing , you should know that it can be hit-or-miss. This dress, though, is an absolute hit. It's made a difference in how I feel showing up to places — I feel put-together no matter what, and I'm not wasting time and mental energy on planning an outfit. The color of the fabric looks darker and flatter in person, and Quince raised its price from $69.90 to $72 in the two years I've owned it. That said, it does make a good blank canvas for creating some cool outfits. Below are a few of my favorite looks I've created so far, all starting with this one Quince midi sweater dress. In my natural state, at home Gabrielle Chase/Business Insider As I type this, I'm seated at my desk wearing this sweater dress and some thick Bombas socks . When I'm treading around the house, I wear it with my UGG boots (which I've had since 10th grade). The dress is made from a weighty, flexible cotton-cashmere blend, so beware if you have an allergy, but I like how it adds a bit of softness and insulation. Commuting comfortably Gabrielle Chase/Business Insider Whether I'm working remotely in a café or at the office, my job requires me to sit at a desk all day, so I like that the Quince sweater dress is stretchy around my middle. With a structured blazer, Vivaia ankle boots , knee-high socks, and my trusty work bag , I feel both presentable and comfortable. I'm 5-foot-9 and its skirt reaches my mid-calf, so it offers good coverage when I have to walk through windy streets or work in a drafty space. Restaurant hopping Gabrielle Chase/Business Insider I like to take advantage of outdoor dining weather to the fullest. On a cool, sunny Saturday afternoon in Brooklyn, my best friend and I find simple pleasure in watching the parade of outfits from our table on a busy street corner. I've tailored this sweater dress to the occasion with a long Patagonia fleece jacket , leggings, and knee-high boots from Margaux . It could even work as a winter wedding ensemble. A leisurely stroll Gabrielle Chase/Business Insider I never considered myself a dress-over-jeans k", "date_str": "2026-09-16T19:45:21+00:00", "hash": "6270ea2c208d15a3", "title_fa": "کوین را می توان از دست داد، اما من به این لباس ژاکت 72 دلاری قسم می خورم", "summary_fa": "وقتی از طریق پیوندهای ما خرید می کنید، Business Insider ممکن است کمیسیون وابسته را دریافت کند. بیشتر بیاموزید گابریل چیس/Business Insider من این ایده را رد می کنم که وقتی پاییز فرا رسید باید لباس نپوشم. این لباس میدی آستین بلند سنگین وزن از Quince به عنوان یک لباس شروع شد و در ماه اول که من آن را داشتم به سرعت به حداقل چهار رسید. اکثر مردم با نام کوینس آشنا هستند، اما اگر تا به حال لباس کوینس را امتحان نکرده‌اید، باید بدانید که می‌توان آن را از دست داد. با این حال، این لباس یک موفقیت مطلق است. این در احساس من که در مکان‌ها حضور پیدا می‌کنم تفاوت ایجاد می‌کند - من احساس می‌کنم هر چه باشد کنار هم هستم، و زمان و انرژی ذهنی را برای برنامه‌ریزی یک لباس تلف نمی‌کنم. رنگ پارچه شخصاً تیره تر و صاف تر به نظر می رسد، و Quince قیمت آن را از 69.90 دلار به 72 دلار در دو سالی که مالک آن هستم، افزایش داد. گفته می شود، این یک بوم خالی خوب برای ایجاد لباس های جالب است. در زیر تعدادی از مدل های مورد علاقه من که تا به حال ایجاد کرده ام آورده شده است، که همه با این یک لباس ژاکت میدی Quince شروع می شود. در حالت طبیعی، در خانه گابریل چیس/Business Insider همانطور که این را تایپ می کنم، پشت میزم نشسته ام و این لباس ژاکت و چند جوراب ضخیم Bombas را پوشیده ام. وقتی در خانه قدم می زنم، آن را با چکمه های UGG (که از کلاس دهم داشتم) می پوشم. این لباس از ترکیب وزنی و انعطاف پذیر پنبه-ترمه ساخته شده است، بنابراین اگر حساسیت دارید مراقب باشید، اما من دوست دارم که چگونه کمی نرمی و عایق را اضافه می کند. رفت و آمد راحت"}, {"source": "Business Insider", "title": "Reid Hoffman dismisses AI doomers: 'Look at me, I'm Cassandra'", "link": "https://www.businessinsider.com/reid-hoffman-ai-cassandra-doom-risk-steering-rsi-2026-9", "summary": "LinkedIn cofounder Reid Hoffman Bloomberg/Getty Images Reid Hoffman says the existential risks of AI are \"remote and controllable.\" Hoffman said instead of slowing down, frontier labs need to \"steer\" better. What do you think about the AI safety debate? Reid Hoffman isn't here for your take about AI is going to kill everyone. \"I actually think most of that stuff, if you actually really think about it, is so like remote and controllable that it is mostly where people are kind of like, 'Look at me, I'm Cassandra, I'm saying it's the end of time,\" Hoffman said during Politico's Decoded Summit in Washington on Wednesday. Hoffman said there are benefits to continuing frontier AI research, including how the technology can help address biosecurity and cybersecurity risks. \"I don't think that slowing down is important, because when you get to the defense against biorisk, the defense against cyber risk, and creating economic prosperity is a reason, I think, to keep going,\" he said. The LinkedIn cofounder said it's a legitimate criticism to question why the leaders of Anthropic and OpenAI are now calling for a slowdown in frontier AI research at a moment when both companies appear to be leading the world. \"You're in the lead, you can slow down anytime you like,\" Hoffman said. Instead of slowing down, Hoffman stressed that \"it's really important\" that frontier labs properly manage recursive self-improvement. Some in the AI industry are concerned that recursive self-improvement, the process by which AI can learn to build itself and eventually its successors, could unlock a path to exponential growth that model makers might not be able to fully control. Jacob Coxon, the former Anthropic researcher whose viral resignation helped catalyze the current conversation , wrote on Tuesday night that Anthropic \"largely initiated\" the race to recursive self-improvement. Over the weekend, Anthropic CEO Dario Amodei called for frontier AI labs \"to pace\" their developments and to use the time to better align AI models. SpaceX CEO Elon Musk and OpenAI CEO Sam Altman later expressed agreement with Amodei's broad aims. In an essay he published on Wednesday, Hoffman said that Amodei and Altman's calls were steps \"in the right direction.\" Not everyone is pushing for a unified response. Meta CEO Mark Zuckerberg wrote on Tuesday night that companies can slow down individually without some sort of industry-wide pact that Amodei wants. \"Every lab has the responsibility and incentive to move ", "date_str": "2026-09-16T19:36:16+00:00", "hash": "6765ad968bff6493", "title_fa": "رید هافمن محکومان هوش مصنوعی را رد کرد: به من نگاه کن، من کاساندرا هستم.", "summary_fa": "رید هافمن، بنیانگذار لینکدین، بلومبرگ/گتی ایماژز، رید هافمن می گوید که خطرات وجودی هوش مصنوعی «از راه دور و قابل کنترل هستند». هافمن گفت به جای کاهش سرعت، آزمایشگاه های مرزی باید بهتر \"هدایت\" کنند. نظر شما در مورد بحث ایمنی هوش مصنوعی چیست؟ رید هافمن برای برداشت شما از هوش مصنوعی اینجا نیست که همه را می کشد. هافمن در جریان اجلاس رمزگشایی پولیتیکو در واشنگتن در روز چهارشنبه گفت: «در واقع فکر می‌کنم بیشتر این چیزها، اگر واقعاً به آن فکر کنید، آنقدر شبیه کنترل از راه دور و قابل کنترل است که بیشتر در جایی است که مردم به نوعی می‌گویند: «به من نگاه کن، من کاساندرا هستم، می‌گویم آخر زمان است». هافمن گفت: ادامه تحقیقات هوش مصنوعی مرزی مزایایی دارد، از جمله اینکه چگونه این فناوری می تواند به مقابله با خطرات امنیت زیستی و امنیت سایبری کمک کند. او گفت: \"من فکر نمی کنم که کاهش سرعت مهم باشد، زیرا وقتی به دفاع در برابر بیوریسک می رسید، دفاع در برابر خطر سایبری و ایجاد رونق اقتصادی دلیلی برای ادامه راه است.\" یکی از بنیانگذاران لینکدین گفت: این که چرا رهبران Anthropic و OpenAI اکنون خواستار کاهش سرعت تحقیقات هوش مصنوعی مرزی در لحظه ای هستند که به نظر می رسد هر دو شرکت در جهان پیشرو هستند، انتقادی موجه است. هافمن گفت: \"شما پیشتاز هستید، می توانید هر زمان که بخواهید سرعت خود را کاهش دهید.\" هافمن به جای کاهش سرعت، تاکید کرد که \"این واقعا مهم است\" که آزمایشگاه های مرزی به درستی خودسازی بازگشتی را مدیریت کنند. برخی در صنعت هوش مصنوعی نگران این هستند که خود-بهبودی بازگشتی، فرآیندی که با آن هوش مصنوعی می‌تواند ساختن خود و در نهایت جانشینانش را بیاموزد، می‌تواند مسیری را برای رشد تصاعدی باز کند که سازندگان مدل ممکن است قادر به کنترل کامل آن نباشند."}, {"source": "Business Insider", "title": "Congress is going to war with Jeffrey Epstein patron Leon Black over NDAs", "link": "https://www.businessinsider.com/jeffrey-epstein-leon-black-comer-bill-ndas-victims-sexual-abuse-2026-9", "summary": "Leon Black sued the House Oversight Committee rather than comply with subpoenas demanding his NDAs. Kevin Dietsch/Getty Images Congress escalated its battle with billionaire Leon Black in its Jeffrey Epstein investigation. It voted to hold Black in criminal contempt after he refused to turn over all his NDAs. The chair of the committee investigating Epstein proposed a law allowing victims to break NDAs. Congress just opened a new front in its battle with billionaire Leon Black. The House of Representatives Wednesday voted to hold Black, the Jeffrey Epstein associate and former CEO of Apollo Global Management, in criminal contempt of Congress. Black had refused to comply with a subpoena requiring him to hand over all of his NDAs, and any in his possession that reference Epstein or Ghislaine Maxwell. The same day, the chair of the congressional committee trying to pry non-disclosure agreements from Black for its Epstein investigation proposed a bill that would allow victims of sexual abuse to break NDAs. James Comer, the chair of the House Oversight Committee, said the proposed bill would ensure that sexual-abuse survivors and other people with information about such abuse could speak freely about it. \"During our investigation, we've learned how powerful men weaponized nondisclosure agreements to silence survivors of sexual abuse,\" Comer, a Kentucky Republican, said in a statement Wednesday. Business Insider reported earlier this year that some of Epstein's accusers have signed confidential settlements with friends of Epstein whom they have also accused of misconduct, according to three people with direct knowledge of such settlements. The settlements include NDAs, the people said. One person told Business Insider they had direct knowledge of settlements with four of Epstein's friends who were accused of sexual misconduct by more than 20 women between them. Do you have any information about settlements between Jeffrey Epstein's friends and accusers? Contact this reporter at jshamsian@businessinsider.com or on the secure messaging app Signal at JacobShamsian.07. Here's our guide to sharing information securely . The House Oversight Committee in June issued two subpoenas to Black when he refused to answer questions about NDAs in a closed-door interview about his interactions with Epstein. Black, who gave over $150 million to Epstein for what he said were financial services, walked out of that voluntary interview. This month, Black sued the committee rather tha", "date_str": "2026-09-16T19:32:09+00:00", "hash": "4e79e92523299ccb", "title_fa": "کنگره در حال جنگ با لئون بلک حامی جفری اپستین بر سر NDA است", "summary_fa": "لئون بلک به جای انطباق با احضاریه هایی که از NDA خود خواسته بود، از کمیته نظارت مجلس شکایت کرد. کنگره Kevin Dietsch/Getty Images در تحقیقات خود در مورد جفری اپستین، نبرد خود با میلیاردر لئون بلک را تشدید کرد. پس از اینکه بلک از واگذاری تمام NDA هایش امتناع کرد، آن رای داد تا او را به عنوان تحقیر جنایتکارانه نگه دارد. رئیس کمیته تحقیق درباره اپشتین قانونی را پیشنهاد کرد که به قربانیان اجازه می دهد NDA را بشکنند. کنگره به تازگی جبهه جدیدی را در نبرد خود با میلیاردر لئون بلک باز کرده است. مجلس نمایندگان روز چهارشنبه رای داد تا بلک، همکار جفری اپستین و مدیر عامل سابق مدیریت جهانی آپولو را به عنوان توهین جنایتکارانه به کنگره محکوم کند. بلک از اجرای احضاریه ای که او را ملزم می کرد تمام NDA های خود و هر کدام که در اختیار داشت و به اپستین یا گیسلین ماکسول اشاره می کرد، تحویل دهد، خودداری کرده بود. در همان روز، رئیس کمیته کنگره که تلاش می‌کرد تا توافق‌نامه‌های عدم افشای را از بلک برای تحقیقات اپشتین خود حذف کند، لایحه‌ای را پیشنهاد کرد که به قربانیان سوء استفاده جنسی اجازه می‌دهد تا NDA را بشکنند. جیمز کامر، رئیس کمیته نظارت مجلس نمایندگان، گفت این لایحه پیشنهادی تضمین می کند که بازماندگان سوء استفاده جنسی و سایر افرادی که اطلاعاتی در مورد چنین آزاری دارند می توانند آزادانه در مورد آن صحبت کنند. کومر، یکی از جمهوری خواهان کنتاکی، روز چهارشنبه در بیانیه ای گفت: «در طول تحقیقات خود، ما متوجه شدیم که چگونه مردان قدرتمند از توافق نامه های عدم افشا برای ساکت کردن بازماندگان سوء استفاده جنسی استفاده می کنند. Business Insider در اوایل سال جاری گزارش داد که به گفته سه نفر با اطلاع مستقیم از چنین شهرک‌هایی، برخی از متهمان اپستین با دوستان اپستین"}, {"source": "Business Insider", "title": "I worked red carpets and toured with country stars. Then losing my dad made me rethink my dream career.", "link": "https://www.businessinsider.com/dad-died-career-change-travel-writing-disney-2026-9", "summary": "The author dedicated her book to her dad. Courtesy of the author I lost my dad days after Hurricane Sandy destroyed our family home. His death pushed me to leave a music career that was burning me out. I built a travel-writing career around our shared love of Disney, food, and travel. In 2012, I was working in a career that many would consider a dream. I was a publicist in the Country music industry . As a lifelong lover of music and a classically trained pianist at New York University, it was thrilling. Every day was exciting, whether I was working a red carpet in Las Vegas or escorting music legends, like Dolly Parton and Carol Channing, to a media interview. I had the opportunity to travel all over the country, including touring with some incredible artists. The author with Carol Channing. Courtesy of the author But behind the scenes, I could feel the burnout rising. My dad died unexpectedly That same year, the unthinkable happened: My family's home on the Jersey Shore was destroyed in Hurricane Sandy , and days later, my Dad would pass away from a heart attack in the aftermath. There are moments where your life is split into the before and after — and this was that. My mother, sister, and I were left to pick up the pieces. The rebuild process for our home and the town my family has resided in for decades was a long one. The author has always loved Disney. Courtesy of the author Inspired by my dad and our shared interest in travel and theme parks, I began exploring how I could follow my passions and turn them into a career. I've since completely left the music industry and have created a career as a full-time travel journalist and author, with my first book debuting this year. My Dad had always been my biggest inspiration My family has always been close. And it was my dad who instilled in me a love of all things travel, writing, food, and Disney parks. It wasn't just Walt Disney World — which we'd visit several times a year — but all theme parks, including another favorite, Hersheypark. My family vacations to theme parks are among my happiest memories, and I continue to visit them today with my now-husband, recreating many of those moments. My dad embraced that \"you only live once\" attitude I strived for, and he didn't care what others thought of him. And after he passed, something changed inside me. I was feeling burned out by the music industry and its constant behind-the-scenes struggles and politics. I knew a change was needed. The healing process w", "date_str": "2026-09-16T19:06:01+00:00", "hash": "0430bec28b100cce", "title_fa": "من فرش قرمز کار کردم و با ستاره های کشور تور رفتم. سپس از دست دادن پدرم باعث شد در حرفه رویایی ام تجدید نظر کنم.", "summary_fa": "نویسنده کتاب خود را به پدرش تقدیم کرد. به لطف نویسنده، من پدرم را چند روز پس از آنکه طوفان سندی خانه خانوادگی ما را ویران کرد، از دست دادم. مرگ او مرا وادار کرد که حرفه موسیقی را ترک کنم که مرا می سوزاند. من یک حرفه سفرنامه نویسی را حول عشق مشترکمان به دیزنی، غذا و سفر ایجاد کردم. در سال 2012، من در شغلی کار می کردم که بسیاری آن را یک رویا می دانستند. من در صنعت موسیقی کانتری تبلیغ کننده بودم. به عنوان یک عاشق مادام العمر موسیقی و یک پیانیست کلاسیک آموزش دیده در دانشگاه نیویورک، هیجان انگیز بود. هر روز هیجان انگیز بود، چه در حال کار روی فرش قرمز در لاس وگاس یا اسکورت اسطوره های موسیقی، مانند دالی پارتون و کارول چانینگ، تا یک مصاحبه رسانه ای. من این فرصت را داشتم که به سراسر کشور سفر کنم، از جمله تور با هنرمندان باورنکردنی. نویسنده با کارول چانینگ. با حسن نیت از نویسنده، اما در پشت صحنه، می‌توانستم احساس کنم که فرسودگی شغلی بالا می‌رود. پدرم به طور غیرمنتظره ای درگذشت در همان سال، اتفاق غیرقابل تصوری رخ داد: خانه خانواده من در ساحل جرسی در طوفان سندی ویران شد و چند روز بعد، پدرم در پی حمله قلبی از دنیا رفت. لحظاتی وجود دارد که زندگی شما به قبل و بعد تقسیم می شود - و این همان بود. من و مادرم و خواهرم مانده بودیم که تکه ها را برداریم. روند بازسازی خانه ما و شهری که خانواده من چندین دهه در آن زندگی می کردند، طولانی بود. نویسنده همیشه دیزنی را دوست داشته است. با حسن نیت از نویسنده با الهام از پدرم و علاقه مشترک ما به سفر و پارک های موضوعی، شروع به کشف این کردم که چگونه می توانم علایقم را دنبال کنم و آنها"}, {"source": "Business Insider", "title": "The best dog muzzles", "link": "https://www.businessinsider.com/guides/pets/best-dog-muzzle", "summary": "When you buy through our links, Business Insider may earn an affiliate commission. Learn more Our reporter landed on five muzzle recommendations after extensive testing, including our top pick from Mia s Muzzles. Elizabeth Holbrook/Business Insider Shortly after moving to the Olympic Peninsula, I saw salmon run for the first time. Shortly after I saw the salmon run, I began muzzle-conditioning my dog Roo — after watching in horror as she gobbled up the remains of a stinky fish carcass tossed ashore by seals. While Roo needs a muzzle to prevent her from scavenging vile things and making herself sick, many dogs wear muzzles for a variety of reasons. The best dog muzzles include different designs for specific needs. Muzzles can benefit dogs who are fearful, reactive, at risk of biting, injured, in pain, or easily overwhelmed, especially in environments where you can't control the distance between your dog and their triggers, says Emily Annis, certified dog trainer and founder of Compassionate Canine Care . She adds that muzzles also help keep everyone safe in high-stress situations, like going to the vet or groomer. \"At the same time, muzzles shouldn't be used as a pass to put a dog into situations that are still too hard,\" she says. Instead, it's best to gradually and methodically introduce the muzzle, using it as a management tool to reduce risk while working on a training plan to address your dog's behavior. To make my recommendations, I tested nine muzzles in various styles on Roo, my 43-pound lab terrier mix and resident fisher dog. After evaluating for fit, comfort, and durability, five muzzles made the list. A quick look at the best dog muzzles Best overall: Mia's Muzzles ( $54-$240 at Mia's Muzzles ) These durable vinyl muzzles suit a wide variety of dogs and behavioral needs. Available in standard and custom sizes, they're a solid choice for getting a great fit right from the start. Best budget: Company of Animals Baskerville Ultra Muzzle ( $15-$31 at Chewy ) When you need to find a good muzzle quickly, this one from Baskerville is readily available and affordable. Its rubber design also provides a comfortable fit. Best sleeve: Coastal Pet Products Best Fit Adjustable Comfort Dog Muzzle ( $21 at Chewy ) This muzzle offers a unique design for high-stress situations when your dog might need to wear a sleeve. It provides quick adjustments via a Velcro strap. Best for bite protection: Big Snoof Dog Gear Muzzle ( $70 at Big Snoof Dog Gear ) Dogs with a hi", "date_str": "2026-09-16T18:43:29+00:00", "hash": "e20cb75566151553", "title_fa": "بهترین پوزه سگ", "summary_fa": "وقتی از طریق پیوندهای ما خرید می کنید، Business Insider ممکن است کمیسیون وابسته را دریافت کند. بیشتر بیاموزید خبرنگار ما پس از آزمایش‌های گسترده، از جمله بهترین انتخاب ما از Mia s Muzzles، به پنج توصیه برای پوزه‌ها رسید. الیزابت هالبروک/Business Insider مدت کوتاهی پس از نقل مکان به شبه جزیره المپیک، برای اولین بار شاهد دویدن ماهی قزل آلا بودم. مدت کوتاهی پس از اینکه ماهی قزل آلا را دیدم، شروع به تهویه کردن پوزه سگم به رو کردم - پس از تماشای او با وحشت بقایای لاشه یک ماهی بدبو را که توسط فوک‌ها به ساحل پرتاب شده بود، می بلعید. در حالی که رو به یک پوزه برای جلوگیری از جمع کردن چیزهای زشت و مریض شدن او نیاز دارد، بسیاری از سگ ها به دلایل مختلف پوزه می پوشند. بهترین پوزه سگ شامل طرح های مختلف برای نیازهای خاص است. امیلی آنیس، مربی گواهی شده سگ و بنیانگذار Compassionate Canine Care می گوید: پوزه ها می توانند برای سگ هایی که ترس، واکنش پذیر، در معرض خطر گاز گرفتن، آسیب دیدگی، درد یا به راحتی تحت فشار قرار می گیرند، مفید باشد، به خصوص در محیط هایی که نمی توانید فاصله بین سگ خود و محرک های آنها را کنترل کنید. او اضافه می‌کند که پوزه‌ها همچنین به حفظ امنیت همه افراد در موقعیت‌های پر استرس، مانند رفتن به دامپزشک یا آرایشگر کمک می‌کنند. او می‌گوید: «در عین حال، پوزه‌ها نباید به‌عنوان یک پاس برای قرار دادن سگ در موقعیت‌هایی که هنوز خیلی سخت هستند، استفاده شوند. در عوض، بهتر است پوزه را به تدریج و به طور روشمند معرفی کنید و از آن به عنوان یک ابزار مدیریتی برای کاهش خطر هنگام کار بر روی یک برنامه آموزشی برای رسیدگی به رفتار سگ خود استفاده کنید. برای ارائه توصیه‌هایم، نه پوزه را در سبک‌های"}, {"source": "Business Insider", "title": "Bond-market turmoil is letting air out of the AI bubble without breaking the market", "link": "https://www.businessinsider.com/interest-rates-treasury-bond-yields-ai-bubble-stock-market-2026-9", "summary": "credit should read JOHANNES EISELE/AFP via Getty Images Rising bond yields have put pressure on stock valuations in recent weeks. But the market broadly hasn't fallen much, as earnings have helped propel growth. It's a \"rare\" scenario, says Jeff Blazek, the co-head of multi-asset strategies at Neuberger. If there is indeed an AI bubble , it may be quietly deflating before our eyes thanks to rising bond yields. Rates on 10-year Treasurys have climbed recently as investors sweat higher oil prices, sticky inflation, and snowballing government debt. Those higher yields have helped to put downward pressure on stock valuations. Usually, such a derating results in a more dramatic decline in stock prices, but valuations have seen a more orderly pullback, with some individual names struggling but the indexes still not far from highs reached this summer. It's a \"rare\" scenario, according to Jeff Blazek, the co-head of multi-asset strategies at Neuberger, which manages $613 billion in assets. In a note on Tuesday, he said that the S P 500's forward price-to-earnings ratio has dropped from 22.9 last October — which had been the highest level since 2000 — to 19.09 currently. That's fairly middle-of-the-road for the valuation gauge over the last six years, and almost as low as valuations got around the bottom of the sell-off that followed the \"Liberation Day\" announcement in April 2025. The Magnificent Seven stocks have seen their collective forward PE ratio drop from about 33 to 23, he pointed out. Meanwhile, the S P 500 is still up 12.8% since its forward PE peak last October. A chart from Morgan Stanley in a September 8 client note illustrates this dynamic: Morgan Stanley The forward PE ratio accounts for two components: today's stock price and expected earnings over the next 12 months. It essentially allows investors to measure how expensive the market is — what the dollar price is you're paying for the profits you expect to generate over the next year. Recent stellar earnings have bolstered the \"E\" portion of the ratio and essentially forced stock prices to rise. But macro pressures have also created some headwinds for stocks, allowing earnings growth to outpace stock price growth. This has brought down valuations in a way that's more palatable to investors, as opposed to stock prices falling while earnings stagnate. Government bond yields have been a major pressure point recently. Investors measure risk-free Treasury rates against the future return potential they ", "date_str": "2026-09-16T18:31:17+00:00", "hash": "d804aec7fb11daa2", "title_fa": "آشفتگی بازار اوراق قرضه باعث می شود هوا از حباب هوش مصنوعی بدون شکستن بازار خارج شود", "summary_fa": "اعتبار باید JOHANNES EISELE/AFP از طریق Getty Images خوانده شود افزایش بازده اوراق قرضه در هفته های اخیر بر ارزش سهام فشار وارد کرده است. اما بازار به طور کلی کاهش چندانی نداشته است، زیرا درآمدها به رشد کمک کرده است. جف بلاژک، رئیس استراتژی های چند دارایی در Neuberger می گوید: این یک سناریوی \"نادر\" است. اگر واقعاً یک حباب هوش مصنوعی وجود داشته باشد، ممکن است به لطف افزایش بازده اوراق قرضه، به آرامی جلوی چشمان ما تخلیه شود. نرخ‌های اوراق خزانه‌داری 10 ساله اخیراً افزایش یافته است زیرا سرمایه‌گذاران از قیمت‌های بالاتر نفت، تورم چسبنده و بدهی‌های دولت گلوله برفی رنج می‌برند. این بازدهی بالاتر به فشار نزولی بر ارزش سهام کمک کرده است. معمولاً چنین کاهشی منجر به کاهش چشمگیر قیمت سهام می‌شود، اما ارزش‌گذاری‌ها شاهد عقب نشینی منظم‌تری بوده‌اند، به طوری که برخی از نام‌ها با مشکل مواجه هستند، اما شاخص‌ها هنوز از اوج‌های تابستان امسال دور نیستند. به گفته جف بلاژک، رئیس استراتژی های چند دارایی در Neuberger، که دارایی های 613 میلیارد دلاری را مدیریت می کند، این یک سناریوی \"نادر\" است. او در یادداشتی در روز سه‌شنبه گفت که نسبت قیمت پیش‌روی S P 500 به درآمد از 22.9 در اکتبر گذشته - که بالاترین سطح از سال 2000 بود - به 19.09 در حال حاضر کاهش یافته است. این نسبت برای سنج ارزش گذاری در شش سال گذشته تقریباً میانه راه است، و تقریباً به اندازه پایین آمدن ارزش گذاری ها در پایین ترین سطح فروش پس از اعلام \"روز آزادی\" در آوریل 2025 بود. او خاطرنشان کرد که سهام مگنفیسنت هفت شاهد کاهش نسبت PE جمعی خود از حدود 33 به 23 بوده اند. در همین حال، S P 500 هنوز 12.8 درصد از زمان اوج PE رو به جلو خود در اکتبر گذشته، افزایش یافته است. نموداری از مورگان"}, {"source": "Business Insider", "title": "Why Siri AI isn't automatic after your iOS 27 update", "link": "https://www.businessinsider.com/iphone-ios-27-siri-ai-missing-2026-9", "summary": "Siri AI is the headline improvement on the iPhone s latest update. Users must join a waitlist. Artur Widak/NurPhoto via Getty Images The iOS 27 update rolled out to iPhones starting on Monday. The biggest change is Siri AI. Siri AI has a waitlist. iPhone users are reporting wait times ranging from four hours to two days. A colleague got the full update. His review: It's a huge improvement, featuring a wonky voice. Apple released iOS 27 on Monday . Many iPhone users will have to wait a little longer for its most anticipated feature. Siri AI , Apple's ambitious overhaul of its virtual assistant, does not automatically arrive with the software update. Eligible users must join a waitlist before they can try it. Once enabled, Siri AI is supposed to do much more for iPhone users. Apple says it can pull together information from across apps and act on it — for instance, finding a hotel confirmation in a screenshot or suggesting a restaurant after scanning a group chat for different dietary preferences. To get the AI-powered virtual assistant, users need to update their device to iOS 27, open Settings, tap Siri, and select Try Siri AI (Beta). They will then choose a voice, complete voice enrollment, review privacy settings, and join the queue. Apple says the wait time varies — and online, and in conversations with Business Insider, customers are reporting wait times between four and 48 hours. Once a user is approved, Siri AI downloads automatically. Not every iPhone can run the AI-powered Siri. While iOS 27 works on iPhones going back to the iPhone 11 , Siri AI requires an iPhone 15 Pro or 15 Pro Max, an iPhone 16 model or later. It is also unavailable on iPhones in the European Union and mainland China. A Business Insider colleague who joined the waitlist on Monday received access on Wednesday morning. He said Siri AI has been useful for finding information across his apps, though its voice still sounds \"very robotic.\" Apple did not immediately respond to a request for comment. Read the original article on Business Insider", "date_str": "2026-09-16T18:17:42+00:00", "hash": "91dbf4413707f1ab", "title_fa": "چرا هوش مصنوعی سیری بعد از آپدیت iOS 27 شما خودکار نمی شود؟", "summary_fa": "هوش مصنوعی سیری عنوان پیشرفت در آخرین به روز رسانی آیفون است. کاربران باید به لیست انتظار بپیوندند. Artur Widak/NurPhoto از طریق Getty Images به‌روزرسانی iOS 27 از روز دوشنبه برای آیفون‌ها عرضه شد. بزرگترین تغییر هوش مصنوعی سیری است. Siri AI لیست انتظار دارد. کاربران آیفون زمان انتظار را از چهار ساعت تا دو روز گزارش می دهند. یکی از همکاران به روز رسانی کامل را دریافت کرد. نقد او: این یک پیشرفت بزرگ است، که دارای صدایی بد است. اپل iOS 27 را روز دوشنبه منتشر کرد. بسیاری از کاربران آیفون باید کمی بیشتر برای مورد انتظارترین ویژگی آن صبر کنند. Siri AI، بازسازی جاه طلبانه اپل در دستیار مجازی خود، به طور خودکار با به روز رسانی نرم افزار وارد نمی شود. کاربران واجد شرایط قبل از اینکه بتوانند آن را امتحان کنند باید به لیست انتظار بپیوندند. پس از فعال شدن، هوش مصنوعی Siri قرار است کارهای بیشتری را برای کاربران آیفون انجام دهد. اپل می‌گوید که می‌تواند اطلاعات را از همه برنامه‌ها جمع‌آوری کند و بر اساس آن عمل کند – به عنوان مثال، یافتن تأییدیه هتل در یک اسکرین شات یا پیشنهاد یک رستوران پس از اسکن یک چت گروهی برای اولویت‌های غذایی مختلف. برای دریافت دستیار مجازی مجهز به هوش مصنوعی، کاربران باید دستگاه خود را به iOS 27 به روز کنند، تنظیمات را باز کرده، روی Siri ضربه بزنید و Try Siri AI (بتا) را انتخاب کنید. سپس یک صدا را انتخاب می کنند، ثبت نام صوتی را کامل می کنند، تنظیمات حریم خصوصی را بررسی می کنند و به صف می پیوندند. اپل می گوید زمان انتظار متفاوت است – و به صورت آنلاین، و در مکالمات با Business Insider، مشتریان زمان انتظار را بین 4 تا 48 ساعت گزارش می دهند. هنگامی که کاربر تأیید شد، Siri AI به طور"}, {"source": "Business Insider", "title": "Airplane parts need thorough inspections, and AI can help — but only if data is up to snuff", "link": "https://www.businessinsider.com/benefits-of-synthetic-data-ai-training-aviation-manufacturing-2026-9", "summary": "Getty Images Safran partners with Loopr AI to enhance defect detection in aviation manufacturing processes. Loopr AI uses synthetic data to improve inspection accuracy and efficiency for Safran's parts. Safran's new AI system reduces inspection time and costly defect recalls. When parts inspectors at the aviation manufacturer Safran received a toilet lid that the company just manufactured, they used to spend 20 to 30 minutes examining it. On airplanes, lavatories need to be perfect, so the inspectors search for consistent colors and smooth surfaces free of paint bubbles and scratches, among other defects. Some inspection professionals have been performing these quality-assurance roles at Safran for more than 10 years and can detect up to 90% of the production defects in cabin galleys, passenger seats, and other parts, said Bindioa Ouali, the senior director and head of digital production, robotics, and automation at Safran. Still, fatigue can set in after hours of inspections, causing detection rates to vary. AI can help streamline these intensive quality assurance processes — but only if companies have enough data to train the technology, said Zheng Yao, a principal research scientist at Lehigh University's Energy Research Center, in an interview with Business Insider. When there's not enough, they can use synthetic data , or artificial information that mimics real data points, he said. Enter software companies like Loopr AI, Spectron, and Akridata that are creating synthetic data from computer-generated images, 3D models, and other simulation tools to address data scarcity and help prevent the costly scrapping and reworking of faulty parts. Solving for data scarcity Safran began pilot projects two years ago with Loopr AI to see whether artificial intelligence could improve defect identification while reducing inspection and documentation time, Ouali said. In situations like Safran's, where the company produces a wide variety of parts but not a high volume of each, \"it's extremely hard to have thousands of data sets very early on,\" Priyansha Bagaria, Loopr's founder and CEO, told Business Insider. In cases like this, Loopr synthetically generates data by creating new training samples from existing images, altering them to increase the number of samples from which algorithms can learn. This allows Safran to simulate various production scenarios while still using real-world data to validate the results, said Bagaria. The analysis software works well at dete", "date_str": "2026-09-16T18:06:29+00:00", "hash": "e9a888e07f0647dc", "title_fa": "قطعات هواپیما به بازرسی کامل نیاز دارند و هوش مصنوعی می تواند کمک کند - اما فقط در صورتی که داده ها به اندازه کافی خوب باشد.", "summary_fa": "Getty Images Safran با Loopr AI شریک می شود تا تشخیص عیب در فرآیندهای تولید هوانوردی را افزایش دهد. هوش مصنوعی Loopr از داده های مصنوعی برای بهبود دقت و کارایی بازرسی برای قطعات Safran استفاده می کند. سیستم هوش مصنوعی جدید Safran زمان بازرسی و فراخوان پرهزینه نقص را کاهش می دهد. هنگامی که بازرسان قطعات در سازنده هواپیما Safran یک درب توالتی را که این شرکت به تازگی تولید کرده بود دریافت کردند، 20 تا 30 دقیقه را صرف بررسی آن کردند. در هواپیما، دستشویی ها باید بی نقص باشند، بنابراین بازرسان به دنبال رنگ های ثابت و سطوح صاف و بدون حباب های رنگ و خط و خش و سایر عیوب هستند. Bindioa Ouali، مدیر ارشد و رئیس بخش تولید دیجیتال، رباتیک و اتوماسیون در Safran گفت: برخی از متخصصان بازرسی بیش از 10 سال است که این نقش های تضمین کیفیت را در Safran انجام می دهند و می توانند تا 90٪ از نقص های تولید را در گالی کابین، صندلی های سرنشین و سایر قطعات تشخیص دهند. با این حال، خستگی می تواند پس از ساعت ها بازرسی ایجاد شود و باعث شود نرخ تشخیص متفاوت باشد. ژنگ یائو، دانشمند پژوهشی اصلی در مرکز تحقیقات انرژی دانشگاه لیهای، در مصاحبه ای با Business Insider گفت که هوش مصنوعی می تواند به ساده سازی این فرآیندهای تضمین کیفیت فشرده کمک کند - اما تنها در صورتی که شرکت ها داده های کافی برای آموزش این فناوری را داشته باشند. او گفت که وقتی به اندازه کافی نباشد، آنها می توانند از داده های مصنوعی یا اطلاعات مصنوعی که نقاط داده واقعی را تقلید می کند استفاده کنند. شرکت‌های نرم‌افزاری مانند Loopr AI، Spectron، و Akridata را وارد کنید که داده‌های مصنوعی را از تصاویر تولید شده توسط رایانه، مدل‌های سه بعدی، و سایر ابزارهای شبیه‌سازی برای"}, {"source": "Business Insider", "title": "'Goldilocks is breaking down': Why one bank says potential for the market's best-case scenario is fading", "link": "https://www.businessinsider.com/stock-market-outlook-rate-hike-us-economy-goldilocks-inflation-oil-2026-9", "summary": "Michael M. Santiago/Getty Images A best-case scenario for stocks might be off the table, BMO says. Not long ago, market watchers saw a \"Goldilocks\" scenario of steady growth and moderating inflation. Markets should now brace for a worldwide policy-led slowdown, the bank says. A best-case scenario for stocks is quickly fading, BMO says. The bank said that a Goldilocks scenario — an ideal economic setup for stocks where the US economy continues to grow while inflation is subdued — looks less likely due to a confluence of factors that could spark a global slowdown and impact equities. In particular, the problems for markets are sticky inflation and higher interest rates , Mark McCormick, chief FX strategist at the bank, wrote in a recent note. \"Goldilocks is breaking down,\" McCormick said, pointing to overlapping headwinds, such as China's economy slowing alongside the US, and AI and energy creating distinct groups of \" winners and losers \" in the market. Economic growth also looks like it's \"rolling over\" around the world, having fallen below trend and on track to drift lower, McCormick added. The International Monetary Fund estimates that the world economy will grow 3% this year, down from the average growth rate of 3.5% over the last two years. \"Still not a recession signal ; markets pricing a policy-led slowdown,\" McCormick said. Worries about hot inflation and higher interest rates have entered the spotlight over the last several months as the US-Iran war continues to put upward pressure on energy prices. With oil back over $100 a barrel, the big fear is that higher energy costs will translate into higher inflation, prompting the Fed to act more aggressively to raise rates. Bond yields have already climbed amid to a sell-off in global and US bond markets, which recently pushed yields past the critical 5% level . The increase has been driven by investors recalibrating rate expectations, as well as weaker demand for US Treasurys amid concerns about the country's fiscal health. 5% has long functioned as a key psychological threshold in the bond market and represents when yields are in the \"danger zone\" for stocks. \"Equities may wobble as US real rates hit cyclical highs,\" he added. The outlook for stocks has been challenged in recent weeks as investors digest the spike in oil and a jump in bond yields to the highest level in nearly two decades. The S P 500 and Dow Jones Industrial Average are down 2% for the month, while the Nasdaq 100 is down 3%. Read the ", "date_str": "2026-09-16T17:29:05+00:00", "hash": "6fa11acb96032afd", "title_fa": "\"Goldilocks در حال خراب شدن است\": چرا یک بانک می گوید پتانسیل برای بهترین سناریوی بازار در حال محو شدن است", "summary_fa": "مایکل ام. سانتیاگو/ گتی ایماژز، BMO می‌گوید بهترین سناریو برای سهام ممکن است دور از انتظار باشد. چندی پیش، ناظران بازار شاهد یک سناریوی \"گلدیلاک\" از رشد ثابت و تعدیل تورم بودند. این بانک می‌گوید که بازارها اکنون باید برای کاهش نرخ رشد جهانی که بر اساس سیاست‌های جهانی انجام می‌شود، آماده شوند. BMO می گوید که بهترین سناریو برای سهام به سرعت در حال محو شدن است. این بانک گفت که سناریوی Goldilocks - یک ساختار اقتصادی ایده‌آل برای سهام که در آن اقتصاد ایالات متحده به رشد خود ادامه می‌دهد در حالی که تورم پایین است - به دلیل تلاقی عواملی که می‌تواند جرقه‌ای کاهش رشد جهانی و تاثیرگذاری بر سهام را ایجاد کند، کمتر محتمل به نظر می‌رسد. مارک مک کورمیک، استراتژیست ارشد FX در بانک، در یادداشت اخیر خود نوشت، به ویژه، مشکلات بازارها تورم چسبنده و نرخ بهره بالاتر است. مک کورمیک گفت: «گلدی‌لاک‌ها در حال شکستن هستند»، و به بادهای مخالف هم‌پوشانی اشاره کرد، مانند کند شدن اقتصاد چین در کنار ایالات متحده، و هوش مصنوعی و انرژی گروه‌های متمایز «برندگان و بازندگان» را در بازار ایجاد می‌کنند. مک کورمیک افزود: رشد اقتصادی همچنین به نظر می رسد که در سرتاسر جهان در حال \"غلت زدن\" است، به طوری که به زیر روند کاهش یافته و در مسیر کاهش قرار دارد. صندوق بین المللی پول تخمین می زند که اقتصاد جهان در سال جاری 3 درصد رشد خواهد کرد که از متوسط ​​نرخ رشد 3.5 درصدی در دو سال گذشته کمتر است. مک کورمیک گفت: «هنوز یک سیگنال رکود نیست؛ بازارها کاهش قیمتی را به‌خاطر سیاست‌گذاری نشان می‌دهند. نگرانی‌ها در مورد تورم داغ و نرخ‌های بهره بالاتر در چند ر شد، بیش از 875 میلیون دلار فروخت و پس از تورهای تیلور سویفت، التون جان و کلدپلی، پس از پایان تور، چهارمین تور پردرآمد تمام دوران را به خود اختصاص داد. برگه قیمت بلیت فروش مجدد شیران آیا بلیطی برای نمایش شنبه شیران در فیلادلفیا می خواهید؟ براساس Ticketdata، قیمت بلیت فروش مجدد 17 درصد در سه روز گذشته کاهش یافته است. این سایت دریافت که کاهش بلیط فیلادلفیا در یک دوره هفت روزه به 25 درصد افزایش می یابد. این سایت دریافت که قیمت‌های فروش مجدد دو اجرای شیران در استادیوم ژیلت ماساچوست و همچنین بلیت‌های اجراهای آتی در آتلانتا، شارلوت، آرلینگتون و شهرهای فلوریدا در هالیوود و تامپا، طی"}, {"source": "Lifehacker", "title": "The Best Home Entertainment Gear of 2026", "link": "https://lifehacker.com/tech/best-home-entertainment-gear-2026?utm_medium=RSS", "summary": "We may earn a commission from links on this page. I don't want to be mean but your streams are too compressed, your pixel count is too low, and your surround sound is not surrounding. It's cool, though, because you can upgrade your outdated TV with a new one, feel actual bass with a new stereo, and otherwise entertain yourself with all manner of home entertainment appliances. The gear listed below is the best of 2026 in different categories. The best overall home entertainment product of 2026: Samsung S95H OLED TV Samsung's flagship TV is about as good as it's possible for a TV to be. It uses \"quantum dot enhanced\" OLED technology to deliver the brightest 4K picture of any TV on the market. The colors are HDR10+ certified. The blacks are as black as my soul. The 165Hz refresh rate destroys lag. The S95H offers built-in spatial audio, with room-filling, directional sound, and the design is as excellent as the specs: The screen is matte, and the frame is metallic silver, so it looks like a piece of art, and it's thin enough that you can hang it on the wall like one. It's not cheap, but it's the kind of television that will impress your neighbors. Samsung 77-Inch Class S90H Series Smart TV $2,597.99 at Amazon $2,797.
