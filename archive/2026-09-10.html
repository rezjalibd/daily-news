He then shared a clip of the footage on his Nappy Boy Gaming social accounts last week. \"There are two things I do, and I learned them from literal billionaires,\" T-Pain said. He said people can either work for him to earn money or receive a one-time payment on the condition that they never ask for another. T-Pain said he didn't initially have that rule, but adopted it after realizing that his decision to gift money to friends and family wasn't always reciprocated. \"If you want to not be an asshole to everybody, make it their choice,\" T-Pain said. \"That's really what's happening.\" Setting financial boundaries with loved ones is a tricky task that folks at all levels, including billionaires, struggle with. In 2025, \"Shark Tank\" investor Kevin O'Leary said during an interview on \"The Fifth Column\" podcast that the worst part about being rich is family members asking for money. \"In the beginning, you will feel the guilt of success, and you will give them money, and you will slowly destroy your relationship with those people,\" O'Leary said. \"You'll have horrible Thanksgivings.\" O'Leary said he gives people the money they requested only if they agree to never ask him again. \"I don't want to be paid back. I don't want to talk about money. I want to have Thanksgiving dinner and talk about family. Not money,\" he said at the time. Read the original article on Business Insider", "date_str": "2026-09-10T09:31:01+00:00", "hash": "b8ad35d1d6b5d03c", "title_fa": "تی پین می‌گوید این دو قانونی است که میلیاردرها برای تقسیم پول با دوستان و خانواده به او آموختند", "summary_fa": "T-Pain در جریان یک جریان توییچ در این ماه توصیه های مالی را به اشتراک گذاشت. کوین وینتر/ گتی ایماژ تی پین زمانی که دوستان و خانواده از او پول می خواهند، اولتیماتوم می دهد. او گفت که یا می‌توانند برای به دست آوردن پول برای او کار کنند یا یک بار پرداخت کنند. میلیاردرهایی مانند کوین اولری استراتژی های مشابهی دارند. تی پین هیچ ابایی از صدور اولتیماتوم در مورد پولش ندارد. رپر \"Buy U a Drank\" در 29 آگوست در جریان پخش زنده توییچ، نحوه تعیین حد و مرزها را با دوستان و خانواده و درخواست پول به اشتراک گذاشت. سپس او هفته گذشته یک کلیپ از این فیلم را در حساب های اجتماعی Nappy Boy Gaming خود به اشتراک گذاشت. تی پین گفت: «دو کار وجود دارد که من انجام می دهم و آنها را از میلیاردرهای واقعی یاد گرفتم. او گفت که مردم می توانند برای کسب درآمد برای او کار کنند یا به شرطی که هرگز پول دیگری نخواهند، یک بار پول دریافت کنند. تی پین گفت که در ابتدا این قانون را نداشت، اما پس از فهمیدن اینکه تصمیم او برای هدیه دادن پول به دوستان و خانواده همیشه متقابل نبود، آن را پذیرفت. تی پین می گوید: «اگر می خواهید برای همه احمق نباشید، آن را انتخاب کنید. \"این واقعاً چیزی است که اتفاق می افتد.\" تعیین مرزهای مالی با عزیزان کار دشواری است که افراد در همه سطوح، از جمله میلیاردرها، با آن دست و پنجه نرم می کنند. در سال 2025، کوین اولری، سرمایه‌گذار «Shark Tank» طی مصاحبه‌ای در پادکست «ستون پنجم» گفت که بدترین بخش در مورد ثروتمند بودن این است که اعضای خانواده پول بخواهند. اولری گفت: در ابتدا احساس گناه از موفقیت خواهید کرد و به آنها پول خواهید داد و به آرامی رابطه خود را با آن"}, {"source": "Business Insider", "title": "Investors share their top investment advice with AI-apocalypse fears on the rise", "link": "https://www.businessinsider.com/where-to-invest-ai-doomsday-scenario-cybersecurity-gold-land-2026-9", "summary": "OpenAI s latest GPT-6 Astra model has drawn more attention on the risks associated with the technology. Samuel Boivin/NurPhoto via Getty Images AI doomsday fears were percolating this week after a high-profile warning from an Anthropic researcher. Some market commentators have warned since the early days of AI that the technology poses a threat. Here's how two longtime market pros are thinking about the existential risks of AI. A small but increasingly vocal group of AI critics thinks the technology could be a disaster for on humanity. Fears of a doomsday scenario stemming from AI were in the air this week after the latest high-profile warning about the dangers of AI . Jacob Coxon, an Anthropic researcher, posted on X that he had resigned because of the industry's unwillingness to take seriously the potential for AI to wipe out humanity. \"They are racing straight to self-improving superintelligence and gambling with our lives,\" Coxon wrote. \"The people building AI earnestly believe that it could kill us all by the end of the decade. This is not a marketing stunt,\" he later added. The idea that AI could end the world as we know it veers on science fiction, but some feels there's indeed a real risk that the technology could spark a chain of events that ends up causing chaos, with markets potentially ground zero for a major rogue AI event. Peter Berezin, the chief economist at BCA Research, was an early voice in markets to warn of disastrous consequences stemming from AI. In client notes as early as 2023, he flagged a number of grim scenarios stemming from the development of artificial intelligence, such as the tech being used by malicious cyber actors, or AI models evolving themselves to pursue goals that \"are harmful to humans.\" Speaking with Business Insider on Wednesday, he pointed to tail-risk scenarios such as a rogue AI model hacking into US military systems, or AI bots infiltrating financial infrastructure, draining bank accounts and crypto wallets, and wreaking havoc on the global economy. Mark Malek, the chief investment officer at Siebert Financial, said he mostly wrote off most people's fears about AI a Black Swan risk, but speculated there was still a small probability AI could cause an unprecedented event that could spark a huge market swing, similar to the tech sell-off caused by CrowdStrike's outage in 2024 . \"Can that happen with AI? Absolutely. And it's not a 0% probability,\" Malek said. \"It's something that's worth contemplating and worth h", "date_str": "2026-09-10T09:30:01+00:00", "hash": "c9f3577f58537e09", "title_fa": "سرمایه‌گذاران بهترین توصیه‌های سرمایه‌گذاری خود را با ترس از آخرالزمان هوش مصنوعی در حال افزایش به اشتراک می‌گذارند", "summary_fa": "آخرین مدل GPT-6 Astra OpenAI توجه بیشتری را به خطرات مرتبط با این فناوری جلب کرده است. ساموئل بویوین/نور عکس از طریق گتی ایماژ هوش مصنوعی، ترس از روز رستاخیز این هفته پس از هشدار بلندپایه‌ای از سوی یک محقق آنتروپیک فراگیر شد. برخی از مفسران بازار از همان روزهای اولیه هوش مصنوعی هشدار داده اند که این فناوری یک تهدید است. در اینجا آمده است که چگونه دو متخصص قدیمی بازار در مورد خطرات وجودی هوش مصنوعی فکر می کنند. گروه کوچکی از منتقدان هوش مصنوعی فکر می‌کنند که این فناوری می‌تواند یک فاجعه برای بشریت باشد. ترس از سناریوی روز رستاخیز ناشی از هوش مصنوعی این هفته پس از آخرین هشدار بلندپایه در مورد خطرات هوش مصنوعی به گوش رسید. Jacob Coxon، یک محقق Anthropic، در X پست کرد که به دلیل عدم تمایل صنعت به جدی گرفتن پتانسیل هوش مصنوعی برای از بین بردن بشریت استعفا داده است. کاکسون نوشت: «آنها مستقیماً به سمت سوپرهوش خودسازی و قمار با زندگی ما مسابقه می دهند. او بعداً افزود: \"افرادی که هوش مصنوعی می‌سازند، عمیقاً معتقدند که می‌تواند تا پایان دهه همه ما را بکشد. این یک شیرین کاری بازاریابی نیست.\" این ایده که هوش مصنوعی می‌تواند به جهان آن‌طور که می‌شناسیم پایان دهد، به داستان‌های علمی تخیلی منحرف می‌شود، اما برخی احساس می‌کنند که واقعاً این خطر وجود دارد که این فناوری بتواند زنجیره‌ای از رویدادها را جرقه بزند که در نهایت باعث هرج و مرج می‌شود و بازارها به طور بالقوه برای یک رویداد بزرگ هوش مصنوعی سرکش به صفر می‌رسند. پیتر برزین، اقتصاددان ارشد BCA Research، اولین صدایی بود که در بازارها نسبت به پیامدهای فاجعه بار ناشی از هوش مصنوعی هشدار داد. در یادداشت‌های مشتری در اوایل سال 2023، او تعدادی سناریوهای شوم ناشی از توسعه هوش مصنوعی، مانند فناوری استفاده شده توسط بازیگران مخرب"}, {"source": "Business Insider", "title": "The billionaire bankrolling San Francisco's surveillance push is getting pushback over Flock — from his Gen Z son", "link": "https://www.businessinsider.com/billionaire-chris-larsen-san-francisco-flock-pushback-gen-z-son-2026-9", "summary": "Chris Larsen, billionaire founder of Ripple, said he and his son don t agree on surveillance tech like Flock. David Paul Morris/Bloomberg/Getty Images Billionaire Chris Larsen said he gets pushback from his Gen Z son on funding surveillance tech. Larsen has donated millions to fund tech used by San Francisco police, including Flock cameras. \"I'd rather have the crime than the surveillance,\" Larsen quoted his son saying. Not even a billionaire can escape the brewing backlash against Flock Safety . Chris Larsen, the crypto billionaire and Ripple cofounder who helped fund the expansion of surveillance tools in San Francisco to help address crime, said he's getting flak at home over his backing of the tech. On an episode of the podcast \"On with Kara Swisher\" published Monday, Larsen said his 19-year-old son has called him out. \"He always gives me a hard time — 'I can't believe you're doing this surveillance thing? What are you doing?'\" Larsen said his son has asked him. When Larsen responds that surveillance has helped cut down on crime in San Francisco, he said his son doesn't budge. \"I'd rather have the crime than the surveillance,\" his son said, according to Larsen. The pushback comes as backlash against surveillance cameras — particularly automated license-plate readers that are used by law enforcement — continues to grow, with much of it aimed at Flock, at Atlanta-based company whose products are used in thousands of communities across the US. On top of privacy concerns, critics point to cases where Flock's technology misidentified plates or was used by police officers for nefarious means, like tracking an ex. A Business Insider investigation found a dozen cases where a person who had not committed a crime was wrongfully targeted by police using Flock . Flock has said its technology is a critical public safety tool that has helped law enforcement agencies across the US. The company also announced last month that it was tightening privacy and accountability safeguards in response to the backlash. A growing 'DeFlock movement' Larsen donated $9.4 million to the San Francisco Police Department in 2025 to support its Real‑Time Investigations Center, a tech and surveillance hub that utilizes automated license-plate readers, drones, cameras, and real-time video feeds to assist in responding to crimes. When announcing the donation, Larsen said it would help police get additional technology tools to reduce crime, specifically naming Flock. The city of San Francisc", "date_str": "2026-09-10T09:19:01+00:00", "hash": "330503d91d5d4e63", "title_fa": "میلیاردری که از سانفرانسیسکو حمایت مالی می‌کند، از طرف پسر ژنرال Z او به Flock واکنش نشان می‌دهد.", "summary_fa": "کریس لارسن، موسس میلیاردر ریپل، گفت که او و پسرش در مورد فناوری های نظارتی مانند Flock توافق ندارند. کریس لارسن، میلیاردر دیوید پل موریس/ بلومبرگ/ گتی ایماژ، گفت که از پسر ژنرال Z خود در زمینه تامین مالی فناوری های نظارتی بازخورد می گیرد. لارسن میلیون‌ها دلار به فناوری مورد استفاده پلیس سانفرانسیسکو از جمله دوربین‌های Flock کمک کرده است. لارسن به نقل از پسرش گفت: «ترجیح می‌دهم جنایت را انجام دهم تا نظارت. حتی یک میلیاردر هم نمی تواند از واکنش شدید علیه Flock Safety فرار کند. کریس لارسن، میلیاردر کریپتو و یکی از بنیانگذاران ریپل که به گسترش ابزارهای نظارتی در سانفرانسیسکو برای کمک به رسیدگی به جرایم کمک کرد، گفت که در خانه به خاطر حمایتش از این فناوری بداخلاق شده است. در قسمتی از پادکست \"On with Kara Swisher\" که دوشنبه منتشر شد، لارسن گفت که پسر 19 ساله اش او را صدا کرده است. او همیشه به من سخت می‌گیرد - باورم نمی‌شود که داری این کار نظارتی را انجام می‌دهی؟ لارسن گفت که پسرش از او پرسیده است. وقتی لارسن پاسخ داد که نظارت به کاهش جرم و جنایت در سانفرانسیسکو کمک کرده است، او گفت که پسرش تکان نمی خورد. این واکنش در حالی صورت می‌گیرد که واکنش‌های منفی علیه دوربین‌های نظارتی - به‌ویژه پلاک‌خوان‌های خودکاری که توسط مجریان قانون استفاده می‌شود- رو به افزایش است و بیشتر آن متوجه شرکت مستقر در آتلانتا Flock است که محصولات آن در هزاران جامعه در سراسر ایالات متحده استفاده می‌شود. علاوه بر نگرانی‌های مربوط به حفظ حریم خصوصی، منتقدان به مواردی اشاره می‌کنند که فناوری Flock به اشتباه پلاک‌ها را شناسایی کرده یا توسط افسران پلیس برای اقدامات شرورانه مانند ردیابی یک سابق استفاده می‌شود. تحقیقات Business Insider ده ها مورد را پیدا کرد که در آن فردی که مرتکب جرمی نشده بود به"}, {"source": "Business Insider", "title": "Student-loan borrowers risk being forced into the most expensive repayment plan if they don't take action this month", "link": "https://www.businessinsider.com/student-loan-borrowers-forced-most-expensive-repayment-plan-save-transition-2026-9", "summary": "President Donald Trump s administration is requiring student-loan borrowers to transition off the SAVE repayment plan this year. Kevin Dietsch/Getty Images The deadline for the first batch of student-loan borrowers to transition off SAVE is September 29. Borrowers are being notified in waves of their 90-day timeframe to pick a new plan. If they do not transition, they'll automatically be placed in the most expensive repayment plan. The clock is ticking for some student-loan borrowers to find a new repayment plan . September 29 is the first deadline for certain borrowers to transition off the SAVE plan, a Biden-era income-driven plan that gave borrowers cheaper monthly payments and a shorter timeline to debt relief. If borrowers do not select a new plan themselves, they'll automatically be transferred to a standard repayment plan and face the most expensive monthly payments. President Donald Trump's administration eliminated SAVE, and beginning July 1, student-loan servicers started notifying borrowers of their 90-day timeframe to transition to a new plan. The borrowers who received those first notices at the beginning of July have until the end of September to transition. The notices have occurred in waves, and some borrowers are still waiting to receive their timeframe. Servicers expect to send out notices to all SAVE borrowers by the end of 2026. Ayelet Sheffey covers all things student debt, from the latest Education Department news to stories of borrowers navigating their loans. To stay up to date on her coverage, sign up to get email alerts for her new stories here . Since Trump's student-loan repayment overhaul took effect on July 1, which included the elimination of SAVE and the introduction of new repayment plans, borrowers have reported higher monthly bills, errors in their payment calculations, and challenges in receiving assistance from their servicers. Some borrowers who transitioned off SAVE are facing payments that are hundreds of dollars higher . An ongoing lawsuit is seeking to halt the forced transfer of borrowers off the SAVE plan if they do not transition voluntarily within their given timeframe. Democratic lawmakers have also pushed for this: in April, Sen. Elizabeth Warren led some of her colleagues in calling on the Education Department to extend the timeframe borrowers have to move off SAVE. \"These borrowers deserve to have the time, critical information, and support necessary to successfully enroll in another affordable repayment pl", "date_str": "2026-09-10T09:15:01+00:00", "hash": "1154ab630a443343", "title_fa": "وام گیرندگان وام دانشجویی در صورتی که در این ماه اقدامی انجام ندهند در خطر اجبار به گران ترین طرح بازپرداخت قرار خواهند گرفت.", "summary_fa": "دولت دونالد ترامپ، رئیس جمهور آمریکا، وام گیرندگان وام های دانشجویی را ملزم می کند تا امسال از طرح بازپرداخت SAVE خارج شوند. کوین دیچ/ گتی ایماژ آخرین مهلت اولین دسته از وام گیرندگان وام دانشجویی برای انتقال از SAVE 29 سپتامبر است. وام گیرندگان در امواجی از بازه زمانی 90 روزه خود برای انتخاب یک طرح جدید مطلع می شوند. در صورت عدم انتقال، به طور خودکار در گران ترین طرح بازپرداخت قرار می گیرند. ساعت برای برخی از وام گیرندگان وام دانشجویی برای یافتن طرح بازپرداخت جدید در حال تیک تیک است. 29 سپتامبر اولین مهلت برای وام گیرندگان خاص است تا از طرح SAVE خارج شوند، طرحی مبتنی بر درآمد دوره بایدن که به وام گیرندگان پرداخت ماهانه ارزان‌تر و زمان کوتاه‌تری برای کاهش بدهی ارائه می‌کرد. اگر وام گیرندگان خودشان طرح جدیدی را انتخاب نکنند، به طور خودکار به یک طرح بازپرداخت استاندارد منتقل می شوند و با گران ترین پرداخت های ماهانه مواجه می شوند. دولت پرزیدنت دونالد ترامپ SAVE را حذف کرد و از اول جولای، سرویس دهندگان وام دانشجویی شروع به اطلاع رسانی به وام گیرندگان از بازه زمانی 90 روزه خود برای انتقال به یک طرح جدید کردند. وام گیرندگانی که اولین اخطارها را در ابتدای ژوئیه دریافت کردند تا پایان سپتامبر فرصت دارند تا انتقال را انجام دهند. این اطلاعیه ها به صورت موجی رخ داده است و برخی از وام گیرندگان همچنان منتظر دریافت بازه زمانی خود هستند. سرویس دهندگان انتظار دارند تا پایان سال 2026 اخطاریه هایی را برای همه وام گیرندگان SAVE ارسال کنند. آیلت شفی همه بدهی های دانشجویی را پوشش می دهد، از آخرین اخبار وزارت آموزش و پرورش تا داستان های وام گیرندگانی که وام های خود را جستجو می کنند. برای به روز ماندن در مورد پوشش او، ثبت نام کنید تا هشدارهای ایمیلی"}, {"source": "Business Insider", "title": "I was a working mom at Amazon who struggled to relax. After I was laid off, I went all in on wellness.", "link": "https://www.businessinsider.com/laid-off-amazon-worker-relax-wellness-travel-business-side-hustle-2026-9", "summary": "Rania Zheng went all in on her wellness-travel business after being laid off by Amazon. Rania Zheng Rania Zheng struggled to relax while working at Amazon, so she sought out holistic wellness practices. She was laid off in October 2025 and turned her wellness interest into a full-time business. Rania's business offers curated trips in China focusing on different wellness themes. This as-told-to essay is based on a conversation with Rania Zheng, a 34-year-old former senior technical product manager at Amazon living in Bellevue, Washington. Zheng was laid off from Amazon in October 2025 and now runs her own wellness-travel business. The following has been edited for length and clarity. When I learned last October that I was being laid off from Amazon after nearly six years, I was surprised. However, it didn't feel like the end of the world. Layoffs had become common across the tech industry . I'd heard stories from friends who had been impacted at other companies. I also didn't feel like I was being targeted or that the decision was about my performance. My official separation from the company only took effect in January, so I had time to pause and think about what I wanted at this stage of my life. I could look for another job. Or, instead, I could spend more time on the side project I'd already started while working at Amazon . Losing my job gave me a push to see whether I could focus full-time on turning that early idea into an actual business. I enjoyed my work at Amazon, but struggled to relax I joined Amazon in 2020 as a business intelligence engineer, shortly before the pandemic began. About a year later, I was promoted to a senior engineer. I'd taken product management classes at the University of Washington and let my managers know I wanted to explore more work in that area. They were supportive, and in 2022, I transitioned into a senior product manager role. Overall, my experience at Amazon was very positive. I felt like I could continue challenging myself and exploring what I wanted to do. However, as a woman in a competitive workplace , it could be hard to balance work, my husband, my children, and the invisible mental load. People would tell me that I should relax more, but I didn't really know how. Jacob Zinkula writes about how workers in tech and other industries are navigating their careers. Share your story with him by filling out this form , emailing him , or reaching out via Signal at jzinkula.29. Follow his work by clicking here . My int", "date_str": "2026-09-10T09:11:01+00:00", "hash": "a5cfca167bf0ebc4", "title_fa": "من یک مادر شاغل در آمازون بودم که در تلاش برای آرامش بودم. بعد از اینکه از کار اخراج شدم، همه چیز را برای سلامتی به کار گرفتم.", "summary_fa": "رانیا ژنگ پس از اخراج شدن توسط آمازون، به طور کامل وارد تجارت سلامتی خود شد. رانیا ژنگ رانیا ژنگ در حین کار در آمازون تلاش می‌کرد تا آرام شود، بنابراین به دنبال روش‌های سلامتی جامع بود. او در اکتبر 2025 اخراج شد و علایق سلامتی خود را به یک تجارت تمام وقت تبدیل کرد. کسب و کار رانیا سفرهای انتخاب شده در چین را با تمرکز بر موضوعات مختلف سلامتی ارائه می دهد. این مقاله گفته شده بر اساس گفتگو با رانیا ژنگ، 34 ساله، مدیر ارشد فنی محصولات فنی در آمازون است که در Bellevue، واشنگتن زندگی می کند. ژنگ در اکتبر 2025 از آمازون اخراج شد و اکنون تجارت مسافرتی سلامتی خود را اداره می کند. موارد زیر برای طول و وضوح ویرایش شده است. وقتی اکتبر گذشته فهمیدم که بعد از نزدیک به شش سال از آمازون اخراج شده ام، شگفت زده شدم. با این حال، آن را مانند پایان جهان نیست. اخراج کارکنان در سراسر صنعت فناوری رایج شده بود. من داستان هایی از دوستانی شنیده بودم که در شرکت های دیگر تحت تاثیر قرار گرفته بودند. همچنین احساس نمی‌کردم که هدف قرار گرفته‌ام یا تصمیم به عملکرد من است. جدایی رسمی من از شرکت تنها در ژانویه اجرایی شد، بنابراین فرصت داشتم مکث کنم و به آنچه در این مرحله از زندگی ام می خواهم فکر کنم. می توانستم دنبال کار دیگری بگردم. یا در عوض، می‌توانم زمان بیشتری را در پروژه جانبی که قبلاً در حین کار در آمازون شروع کرده بودم، صرف کنم. از دست دادن شغلم به من فشار داد تا ببینم آیا می توانم تمام وقت روی تبدیل آن ایده اولیه به یک تجارت واقعی تمرکز کنم یا خیر. من از کارم در آمازون لذت بردم، اما در تلاش برای آرامش بودم، در سال 2020 به عنوان مهندس هوش تجاری،"}, {"source": "Business Insider", "title": "I'm an American who moved to the Netherlands 9 years ago. I love the bike culture, but I miss Trader Joe's and speaking English.", "link": "https://www.businessinsider.com/american-moved-netherlands-miss-trader-joes-english-2026-9", "summary": "Jaime Bancroft-Gennaro. Courtesy of Jaime Bancroft-Gennaro Jaime Bancroft-Gennaro moved from the US to the Netherlands in 2017 for a better family life. Her family's transition included embracing Dutch culture and challenges like language barriers. She appreciates the Netherlands' bike culture and community, despite missing American conveniences. This as-told-to essay is based on a conversation with Jaime Bancroft-Gennaro, a 50-year-old consultant and coach, who moved from the US to the Netherlands. It's been edited for length and clarity. I was born in Pennsylvania, grew up in San Diego, and went to college in Santa Cruz. After graduating, I moved to Oregon. At first, I lived in Bend, and then I spent 15 years in Portland. When my son was born in 2009, my husband and I moved to Italy , where my husband is from. He was homesick, and it felt like the right move at the time. When the economy crashed during the global financial crisis, we moved back to the US. We were always pining to get back to Europe — we just didn't know where or when the right time would be. Before we moved to Europe for the second time, my husband sent me to Amsterdam by myself to see what I thought. I loved it, and we decided to move there. In 2017, my kids started elementary school Trump had been elected for the first time. My kids were coming home talking about immigration, lockdown drills, and other things that made me realize this wasn't how I wanted them to grow up. Around the same time, my husband received a small inheritance , which really sparked the move. I thought, \"We have the money to do it now. The timing seems right. When else are we going to do it?\" Amsterdam reminded me of Portland in a lot of ways. It felt like the right place for us. We were nearing the end of our lease, gave our landlord a couple of months' notice, and then moved right outside Amsterdam in 2017. We didn't know anyone in the Netherlands We didn't speak Dutch and didn't know the culture, but we felt that if we were ever going to do it, with our kids ages 4 and 6, it was the right time. I was working in advertising, and there were a lot of advertising companies in Amsterdam. My husband had a job in software, and he moved with that job. I found a new job after I arrived. I worked under a work permit through my company, and that was my sponsorship to live in Europe. When I later lost that job during COVID-19, I was able to stay in the Netherlands through my husband. I eventually became a citizen myself. S", "date_str": "2026-09-10T09:05:01+00:00", "hash": "20ff77ad8a4688e1", "title_fa": "من یک آمریکایی هستم که 9 سال پیش به هلند نقل مکان کردم. من عاشق فرهنگ دوچرخه هستم، اما دلم برای Trader Joe و انگلیسی صحبت کردن تنگ شده است.", "summary_fa": "جیمی بنکرافت-جنارو. با حسن نیت از Jaime Bancroft-Gennaro Jaime Bancroft-Gennaro در سال 2017 برای داشتن یک زندگی خانوادگی بهتر از ایالات متحده به هلند نقل مکان کرد. انتقال خانواده او شامل پذیرش فرهنگ هلندی و چالش هایی مانند موانع زبانی بود. او با وجود از دست دادن امکانات آمریکایی، از فرهنگ دوچرخه و جامعه هلندی قدردانی می کند. این مقاله گفته شده بر اساس گفتگو با Jaime Bancroft-Gennaro، مشاور و مربی 50 ساله است که از ایالات متحده به هلند نقل مکان کرده است. برای طول و وضوح ویرایش شده است. من در پنسیلوانیا متولد شدم، در سن دیگو بزرگ شدم و به کالج در سانتا کروز رفتم. پس از فارغ التحصیلی به اورگان نقل مکان کردم. ابتدا در Bend زندگی می کردم و سپس 15 سال را در پورتلند گذراندم. وقتی پسرم در سال 2009 به دنیا آمد، من و شوهرم به ایتالیا نقل مکان کردیم، جایی که شوهرم اهل آنجاست. او دلتنگ بود و در آن زمان احساس می کرد حرکت درستی بود. هنگامی که اقتصاد در طول بحران مالی جهانی سقوط کرد، ما به ایالات متحده بازگشتیم. ما همیشه می خواستیم به اروپا برگردیم - فقط نمی دانستیم زمان مناسب کجا و چه زمانی خواهد بود. قبل از اینکه برای بار دوم به اروپا نقل مکان کنیم، شوهرم من را به تنهایی به آمستردام فرستاد تا ببیند نظرم چیست. من آن را دوست داشتم و تصمیم گرفتیم به آنجا نقل مکان کنیم. در سال 2017، بچه های من مدرسه ابتدایی را شروع کردند که ترامپ برای اولین بار انتخاب شده بود. بچه‌هایم به خانه می‌آمدند و درباره مهاجرت، تمرین‌های قرنطینه و چیزهای دیگری صحبت می‌کردند که باعث شد بفهمم این طوری نیست که می‌خواستم آنها بزرگ شوند. تقریباً در همان زمان، شوهرم ارث کوچکی دریافت کرد که واقعاً جرقه این حرکت را زد. فکر کردم، \"ما اکنون"}, {"source": "Business Insider", "title": "This developer created an app to detect nearby Meta glasses. It already has thousands of users.", "link": "https://www.businessinsider.com/zuckoff-app-detects-meta-ai-smart-glasses-recording-privacy-2026-9", "summary": "Pawel Szydlowski recently developed an app he says can detect recording smart glasses. Pawel Szydlowski The Zuckoff app is exactly as it sounds. Its creator says it can detect nearby smart glasses. Pawel Szydlowski built the app after seeing Meta smart glasses used to record strangers. Pawel Szydlowski was spooked after he saw videos of people using smart glasses to record and identify unsuspecting strangers. So the 30-year-old Polish software developer created an app that he says can detect nearby smart glasses and estimate their distance. \"There's a need for such an application,\" he told Business Insider. The app, which Szydlowski calls \"Zuckoff,\" a tawdry portmanteau, has garnered 5,000 users since its launch on Apple's App Store last month. On the app, the main scanning screen gives users the likely proximity of nearby smart glasses. A \"Zuckoff Pro\" version allows users to run the app and get notifications for nearby recording smart glasses when the app isn't open. It comes at a time many regard as an inflection point for Meta's AI smart glasses , as antipathy toward the surreptitious use of the tech grows, and the company embarks on a PR blitz to assuage those who fear for their privacy. This month, Meta bricked thousands of glasses after discovering that the built-in LED lights, which should turn on automatically when the glasses are recording, had been tampered with. Higher-ups at Meta, meanwhile, have tried to make the case that the glasses are safe. Meta Chief Technology Officer Andrew Bosworth said in a recent Instagram video that \"we designed this camera to be noticed by the people around you.\" However, those efforts haven't prevented misuse of the smart glasses altogether — or convinced every skeptic. Szydlowski's app, which detects Bluetooth signatures broadcast by smart glasses, is a potential alternative solution. Unwelcome pickup artists Szydlowski came from an \"earlier era of YouTube,\" he said, where on-camera pranks occurred in a paradigm of at least minimal privacy. If someone clearly didn't want to be recorded, many creators blurred their faces. And the unlucky subjects of spontaneous pranks were, of course, aware of the camera that was thrust in their face. Something shifted, though, with the advent of smart glasses . Pickup artists still filmed themselves practicing their skills on women, but now the women could not always discern that they were being recorded. What's more, Szydlowski noticed how obviously uncomfortable subjects rarel", "date_str": "2026-09-10T08:34:01+00:00", "hash": "d9a3ecf4d360f706", "title_fa": "این توسعه دهنده اپلیکیشنی برای شناسایی عینک های متا در نزدیکی خود ایجاد کرد. در حال حاضر هزاران کاربر دارد.", "summary_fa": "Pawel Szydlowski اخیرا اپلیکیشنی را توسعه داده است که به گفته او می تواند ضبط عینک های هوشمند را تشخیص دهد. Pawel Szydlowski برنامه Zuckoff دقیقاً همانطور که به نظر می رسد است. سازنده آن می گوید می تواند عینک های هوشمند نزدیک را تشخیص دهد. Pawel Szydlowski پس از دیدن عینک هوشمند متا که برای ضبط افراد غریبه استفاده می شود، این اپلیکیشن را ساخت. پاول شیدلوفسکی پس از دیدن ویدئوهایی از افرادی که از عینک هوشمند برای ضبط و شناسایی غریبه‌های ناآگاه استفاده می‌کنند، وحشت زده شد. بنابراین توسعه‌دهنده نرم‌افزار 30 ساله لهستانی برنامه‌ای ایجاد کرد که به گفته او می‌تواند عینک‌های هوشمند نزدیک را تشخیص دهد و فاصله آنها را تخمین بزند. او به Business Insider گفت: «نیاز به چنین برنامه ای وجود دارد. این اپلیکیشن که Szydlowski آن را \"Zuckoff\" می نامد، یک پورت مانتوی ساده است، از ماه گذشته که در اپ استور اپل راه اندازی شد، 5000 کاربر جذب کرده است. در برنامه، صفحه اسکن اصلی به کاربران امکان نزدیکی عینک هوشمند نزدیک را می دهد. نسخه «Zuckoff Pro» به کاربران اجازه می‌دهد تا برنامه را اجرا کنند و زمانی که برنامه باز نیست، اعلان‌هایی را برای ضبط عینک‌های هوشمند نزدیک دریافت کنند. این در زمانی اتفاق می‌افتد که بسیاری آن را نقطه عطفی برای عینک‌های هوشمند هوش مصنوعی متا می‌دانند، زیرا ضدیت نسبت به استفاده پنهانی از این فناوری افزایش می‌یابد و این شرکت برای تسکین افرادی که از حریم خصوصی خود می‌ترسند، دست به حمله‌ای روابط عمومی می‌زند. در این ماه، متا هزاران لیوان را پس از کشف این که چراغ‌های LED داخلی که باید هنگام ضبط عینک به طور خودکار روشن شوند، دستکاری شده‌اند، آجر زد. در همین حال، مقامات بالاتر در متا، سعی کرده‌اند که این عینک را ایمن کنند. اندرو باسورث، مدیر ارشد فناوری متا، در ویدیوی اخیر خود"}, {"source": "Business Insider", "title": "Red, White, and Sacre Bleu: Americans are buying up homes in Paris", "link": "https://www.businessinsider.com/americans-buying-real-estate-paris-france-overpaying-home-prices-2026-9", "summary": "Marty and Angie Yabrow walking around the 9th near avenue Trudaine. Camille McOuat for BI Getting fired after a reorganization at his firm wasn't ideal, but Marty Yabrow and his wife, Angie, wanted to make the best of it, so in 2024 they booked a three-city trip to Europe. Then, one morning while Marty was filling out a planning spreadsheet with hotels and restaurants, Angie asked out of the blue, \"Why don't we just move there instead?\" Marty was quick to react. \"I deleted that spreadsheet, and I started a new one,\" he says. Despite some initial misgivings from their financial advisor, Marty, 68, crunched the numbers and found that it was not only financially possible but also preferable to retire in France , since he and Angie, 73, would benefit from free healthcare. After selling their home in Atlanta, they moved to Paris in January 2025. Marty and Angie Yabrow in their new Paris home next to Gare du Nord. Camille McOuat for BI A growing number of Americans have been flocking to the French capital, seeking a better work-life balance, a slightly cheaper cost of living, or some distance from politics back home. And unlike previous generations of uber-wealthy Americans investing in pied-à-terre properties, more people are making a permanent move . In 2025, 15,388 Americans applied for a French residency permit, a 17.3% increase from the previous year. Parisians, meanwhile, are ambivalent about welcoming the Yanks. On the downside, the new wave of Américains is driving up housing prices for locals investing in their own high-end properties. On the upside, the rush of real estate cash is creating new financial opportunities and greasing the wheels of the housing market as many French people look to downsize. \"Americans are among the biggest foreign buyers in France,\" says Maître Angélique Devaux, a notary in Paris. They also tend to spend more: In Paris, one in four foreign buyers is American, and their average budget of 825,000 euros (roughly $950,000) exceeds the average value of both foreign and French purchases. Marty and Angie Yabrow walking around the 9th near avenue Trudaine. Camille McOuat for BI These new expats are seduced by the historic neighborhoods: Odéon and Saint-Germain-des-Prés on one side of the river, Le Marais and the Triangle d'Or on the other. They're interested in postcard Paris, says Guillaume de Blaÿ, managing partner at Barnes Bac-Varenne, a brokerage that has long served those looking for luxurious properties. \"Have you heard of '", "date_str": "2026-09-10T08:12:01+00:00", "hash": "36dcb475ca3f284c", "title_fa": "قرمز، سفید و آبی مقدس: آمریکایی ها در حال خرید خانه در پاریس هستند", "summary_fa": "مارتی و انجی یابرو در اطراف خیابان نهم در نزدیکی خیابان ترودین قدم می زنند. Camille McOuat برای BI اخراج شدن پس از سازماندهی مجدد در شرکتش ایده آل نبود، اما مارتی یابرو و همسرش، Angie، می خواستند بهترین استفاده را از آن ببرند، بنابراین در سال 2024 یک سفر سه شهر به اروپا رزرو کردند. سپس، یک روز صبح، در حالی که مارتی در حال پر کردن یک صفحه گسترده برنامه ریزی با هتل ها و رستوران ها بود، انجی به طور ناگهانی پرسید: \"چرا به جای آن به آنجا نقل مکان نکنیم؟\" مارتی به سرعت واکنش نشان داد. او می‌گوید: «من آن صفحه‌گسترده را حذف کردم و صفحه‌گسترده جدیدی را شروع کردم. علیرغم برخی تردیدهای اولیه مشاور مالی آنها، مارتی، 68 ساله، اعداد را زیر سوال برد و دریافت که بازنشستگی در فرانسه نه تنها از نظر مالی امکان پذیر است، بلکه ترجیح داده می شود، زیرا او و آنجی، 73 ساله، از مراقبت های بهداشتی رایگان بهره مند می شوند. پس از فروش خانه خود در آتلانتا، آنها در ژانویه 2025 به پاریس نقل مکان کردند. مارتی و آنجی یابرو در خانه جدید خود در پاریس در کنار Gare du Nord. Camille McOuat برای BI تعداد فزاینده‌ای از آمریکایی‌ها به پایتخت فرانسه هجوم می‌آورند و به دنبال تعادل بهتر بین کار و زندگی، هزینه کمی ارزان‌تر زندگی، یا دوری از سیاست در خانه هستند. و برخلاف نسل‌های قبلی آمریکایی‌های ثروتمند که در املاک و مستغلات سرمایه‌گذاری می‌کردند، افراد بیشتری در حال حرکت دائمی هستند. در سال 2025، 15388 آمریکایی برای اجازه اقامت فرانسه درخواست دادند که 17.3 درصد نسبت به سال قبل افزایش داشت. در همین حال، پاریسی‌ها در مورد استقبال از یانکس تردید دارند. از جنبه منفی، موج جدید آمریکایی ها باعث افزایش قیمت مسکن برای افراد محلی می شود که در املاک گران قیمت خود"}, {"source": "Business Insider", "title": "Trump's pitch to every American adult: Help the GOP win the midterms and you'll get a $5,000 'dividend'", "link": "https://www.businessinsider.com/donald-trump-midterm-elections-5000-dividend-promise-republicans-win-2026-9", "summary": "President Donald Trump gestures at the 2026 Republican National Convention at the American Airlines Center in Dallas, Texas. Kevin Dietsch/Getty Images Trump promised every adult US citizen a $5,000 \"Trump dividend\" if Republicans win Congress. He unveiled the proposal at the GOP's midterm convention as he urged supporters to back Republicans. Trump offered no details on how the payments would work or be funded. President Donald Trump promised every adult US citizen a $5,000 payment if Republicans win both chambers of Congress in November, dangling a cash incentive as he urged supporters to treat the midterm elections like another presidential race. Speaking at the Republican Party's midterm convention in Dallas on Wednesday, Trump unveiled what he called the \"Trump dividend.\" \"If the Republicans win, you win with us, and you get $5,000. It will be called the Trump dividend,\" he said. He said the proposed payments would be \"very much like a successful company will do a cash distribution to its shareholders.\" The dividend \"must be spent in the United States of America,\" he said. Trump did not explain how the payments would be funded. The proposal would cost about $1.35 trillion if every adult received the payment, Kent Smetters, a professor of business economics and public policy at the Wharton School and faculty director of the Penn Wharton Budget Model, told Business Insider. Vice President JD Vance later said the payments would not go to the wealthy. If the checks excluded wealthy Americans, the cost would fall to about $1.15 trillion, assuming a household income cap of $400,000, Smetters said. Trump has floated similar ideas before. Last year, he proposed $2,000 \"tariff dividend\" checks for low- and middle-income Americans, funded by tariff revenue. The proposal failed to gain traction in Congress, with several Republicans arguing the money should instead go toward reducing the national debt, and no payments were ever made. Read the original article on Business Insider", "date_str": "2026-09-10T06:18:20+00:00", "hash": "2f9e4bce9f4af4cf", "title_fa": "پیشنهاد ترامپ به همه بزرگسالان آمریکایی: به حزب جمهوری خواه کمک کنید در میان دوره ای پیروز شود و 5000 دلار \"سود سهام\" دریافت خواهید کرد.", "summary_fa": "پرزیدنت دونالد ترامپ در کنوانسیون ملی جمهوری خواهان در سال 2026 در مرکز خطوط هوایی آمریکا در دالاس، تگزاس ژست می گیرد. کوین دیچ/ گتی ایماژ ترامپ به هر شهروند بزرگسال آمریکایی وعده داد که در صورت پیروزی جمهوری خواهان در کنگره، 5000 دلار \"سود سهام ترامپ\" دریافت کند. او این پیشنهاد را در کنوانسیون میان‌دوره‌ای حزب جمهوری‌خواه در حالی که از حامیانش خواست از جمهوری‌خواهان حمایت کنند، رونمایی کرد. ترامپ هیچ جزئیاتی در مورد نحوه عملکرد یا تامین مالی این پرداخت ها ارائه نکرد. رئیس‌جمهور دونالد ترامپ به هر شهروند بزرگسال آمریکایی وعده پرداخت 5000 دلار در صورت پیروزی جمهوری‌خواهان در هر دو مجلس کنگره در ماه نوامبر را داد و از حامیانش خواست که با انتخابات میان‌دوره‌ای مانند رقابت‌های ریاست‌جمهوری دیگر رفتار کنند. ترامپ روز چهارشنبه در کنفرانس میان دوره ای حزب جمهوری خواه در دالاس، از آنچه که «سود سهام ترامپ» نامید، رونمایی کرد. او گفت: \"اگر جمهوری خواهان پیروز شوند، شما با ما برنده می شوید و 5000 دلار دریافت می کنید. این سود سهام ترامپ نامیده می شود.\" او گفت که پرداخت‌های پیشنهادی «بسیار شبیه به این است که یک شرکت موفق توزیع نقدی را بین سهامدارانش انجام دهد». او گفت که سود سهام «باید در ایالات متحده آمریکا خرج شود». ترامپ توضیح نداد که این پرداخت ها چگونه تامین می شود. کنت اسمترز، استاد اقتصاد بازرگانی و سیاست عمومی در مدرسه وارتون و مدیر دانشکده مدل بودجه پن وارتون، به Business Insider گفت که این پیشنهاد در صورتی که هر بزرگسال این مبلغ را دریافت کند، حدود 1.35 تریلیون دلار هزینه خواهد داشت. معاون رئیس جمهور جی دی ونس بعداً گفت که این پرداخت ها به ثروتمندان تعلق نمی گیرد. اسمترز گفت که اگر چک ها آمریکایی های ثروتمند را حذف کنند، هزینه آن به حدود 1.15 تریلیون دلار کاهش می یابد، با فرض"}, {"source": "Business Insider", "title": "Zelenskyy's plane was 'almost hit' by a Russian drone over Moldovan airspace, NATO member says", "link": "https://www.businessinsider.com/russian-drone-near-hit-zelenskyy-plane-over-moldova-2026-9", "summary": "Zelenskyy s official state aircraft is an Airbus A319-115X C. ADEM ALTAN/AFP via Getty Images NATO member Norway's prime minister said Zelenskyy's plane was \"almost hit\" by a drone in Moldova. Moldova, which is to Ukraine's southwest, said a Shahed had entered its airspace on that day. The drone later crashed in northwestern Moldova, and there are no details yet of how close it got. Ukrainian President Volodymyr Zelenskyy's corporate jet was threatened by a drone as he prepared to fly from Moldova to Oslo, according to Norway's prime minister. \"His plane was almost hit by a drone as it took off in Moldova. That's his reality,\" Jonas Gahr Støre told local broadcaster NRK on Wednesday. Støre did not provide further details on the incident. Nor did he mention the distance between the drone and Zelenskyy's plane. The Ukrainian president flew from Moldova on Tuesday evening to attend King Harald of Norway's funeral, before flying to Ottawa to meet with Canadian leaders. Moldovan authorities said that a drone had entered their country's airspace on Tuesday via the Ukrainian border, adding that preliminary data showed the uncrewed aerial vehicle was a Shahed — Russia's main attack drone . This Shahed entered Moldova twice in the late afternoon, said officials who temporarily closed the country's airspace. The time of the Shahed's entry, at about 4.20 p.m., matches when Zelenskyy would have been preparing to fly to Oslo. The Kremlin can launch hundreds of Shaheds and decoy drones at Ukraine in a single day, some of which have been documented wandering into nearby countries, such as Poland and Romania. NATO has accused Russia of intentionally sending the drones to Eastern Europe to test its reaction to such potential threats. Moscow denies having any such plans. Moldova's government told Reuters on Wednesday that Zelenskyy's plane was cleared for take-off after the drones exited its airspace. The Ukrainian president's office did not immediately respond to a request for comment sent outside regular business hours by Business Insider. A separate public statement by officials said the Shahed drone had also initially flown into Romania before returning to Moldovan airspace. It eventually crashed in the northwestern district of Glodeni. No casualties were reported, though the crash started a fire, officials said. Read the original article on Business Insider", "date_str": "2026-09-10T05:22:24+00:00", "hash": "72285e579f5c6c5c", "title_fa": "عضو ناتو می گوید هواپیمای زلنسکی توسط پهپاد روسیه بر فراز حریم هوایی مولداوی \"تقریبا مورد اصابت\" قرار گرفت.", "summary_fa": "هواپیمای رسمی دولتی زلنسکی یک ایرباس A319-115X C است. ADEM ALTAN/AFP از طریق Getty Images نخست وزیر نروژ، عضو ناتو، گفت که هواپیمای زلنسکی در مولداوی «تقریباً مورد اصابت یک پهپاد قرار گرفت». مولداوی که در جنوب غربی اوکراین قرار دارد، گفت که یک شاهد در آن روز وارد حریم هوایی این کشور شده است. این پهپاد بعداً در شمال غربی مولداوی سقوط کرد و هنوز جزئیاتی از نزدیک شدن آن وجود ندارد. به گفته نخست وزیر نروژ، جت شرکتی ولودیمیر زلنسکی، رئیس جمهور اوکراین در حالی که آماده پرواز از مولداوی به اسلو می شد، مورد تهدید یک پهپاد قرار گرفت. یوناس گار استور روز چهارشنبه به شبکه محلی NRK گفت: \"هواپیمای او هنگام بلند شدن در مولداوی تقریباً مورد اصابت یک پهپاد قرار گرفت. این واقعیت اوست.\" استور جزئیات بیشتری در مورد این حادثه ارائه نکرد. او همچنین به فاصله پهپاد و هواپیمای زلنسکی اشاره نکرد. رئیس جمهور اوکراین عصر سه شنبه از مولداوی برای شرکت در مراسم تشییع جنازه هارالد پادشاه نروژ به پرواز درآمد و سپس برای دیدار با رهبران کانادا به اتاوا پرواز کرد. مقامات مولداوی اعلام کردند که یک پهپاد روز سه‌شنبه از طریق مرز اوکراین وارد حریم هوایی کشورشان شده است و افزودند که داده‌های اولیه نشان می‌دهد این هواپیمای بدون سرنشین یک پهپاد تهاجمی شاهد - اصلی روسیه است. مقاماتی که به طور موقت حریم هوایی کشور را بسته اند، گفتند که این شاهد در اواخر بعد از ظهر دو بار وارد مولداوی شد. زمان ورود شاهد، حدود ساعت 16:20، مطابق با زمانی است که زلنسکی برای پرواز به اسلو آماده می شد. کرملین می‌تواند صدها پهپاد شاهد و فریبنده را در یک روز به اوکراین پرتاب کند، که برخی از آنها در کشورهای مجاور مانند لهستان و رومانی سرگردان هستند. ناتو روسیه را به ارسال عمدی هواپیماهای بدون سرنشین به اروپای"}, {"source": "Business Insider", "title": "Goldman Sachs says Treasury buybacks won't be enough to tame bond yields", "link": "https://www.businessinsider.com/goldman-says-treasury-buybacks-wont-be-enough-to-tame-bond-yields-2026-9", "summary": "Investors are weighing persistent fiscal deficits, AI-related borrowing, and resilient economic data as bond yields climb. Spencer Platt/Getty Images The Treasury's bond buyback is failing to reassure investors as long-term yields remain elevated. Goldman Sachs says changing how the Treasury borrows won't solve what's driving yields higher. Persistent deficits, AI spending, and strong growth are keeping bond yields elevated, Goldman says. The Treasury's plan to buy back more long-dated government bonds has done little to calm the bond market. Treasury yields remained elevated after Treasury Secretary Scott Bessent said the department would repurchase up to $6 billion of 10- to 20-year debt, despite hopes the move would ease pressure on long-term borrowing costs following a broad bond selloff. On Wednesday, the benchmark 10-year Treasury yield was around 4.85%, near its highest level since October 2023. The 20-year and 30-year yields traded at about 5.3%. The issue extends beyond the US. Changing how governments issue debt is unlikely to materially lower long-term yields, according to Goldman Sachs in a Wednesday post. According to Goldman, changing what kind of debt the Treasury sells doesn't change how much money the government needs to borrow. According to the bank, changing what kind of debt governments sell doesn't change how much they need to borrow. \"What's really interesting about this move higher in yields is how orderly it's been,\" George Cole, head of European rates strategy in the global macro and markets research group, said in a webinar. He added that subdued volatility makes it difficult to argue the bond market is \"fundamentally mispriced.\" Goldman argues investors are repricing bonds based on fundamentals rather than market dysfunction. Those fundamentals include widening fiscal deficits across developed economies, resilient economic data, and a surge in borrowing to finance AI investment, which Goldman estimates could amount to about 1% of global GDP. Some of those pressures may ease. Goldman expects energy-driven inflation concerns to fade over the next six months, while greater clarity on returns from AI investment could ease some of the pressure on bond markets from AI-related borrowing. \"But what won't go away is the fiscal concerns,\" Cole said. The US is not alone. Governments in the UK and Japan have similarly reduced issuance of longer-dated debt as demand for duration has weakened, but the bank sees little evidence that such issuan", "date_str": "2026-09-10T05:14:33+00:00", "hash": "bfcc8467c7a7285b", "title_fa": "گلدمن ساکس می‌گوید بازخرید خزانه‌داری برای کاهش بازده اوراق کافی نخواهد بود", "summary_fa": "سرمایه گذاران کسری های مالی مداوم، استقراض مرتبط با هوش مصنوعی و داده های اقتصادی انعطاف پذیر را با افزایش بازده اوراق سنجیده اند. Spencer Platt/Getty Images بازخرید اوراق قرضه وزارت خزانه داری نتوانست به سرمایه گذاران اطمینان دهد زیرا بازدهی بلندمدت بالاست. گلدمن ساکس می‌گوید تغییر نحوه استقراض خزانه‌داری نمی‌تواند عامل افزایش بازدهی باشد. گلدمن می‌گوید کسری‌های مداوم، مخارج هوش مصنوعی و رشد قوی، بازده اوراق قرضه را بالا نگه می‌دارد. طرح خزانه داری برای بازخرید بیشتر اوراق قرضه دولتی با تاریخ طولانی تر، کمک چندانی به آرامش بازار اوراق قرضه نکرده است. بازدهی خزانه داری پس از اینکه اسکات بسنت، وزیر خزانه داری گفت که وزارت خزانه داری تا 6 میلیارد دلار از بدهی های 10 تا 20 ساله را بازخرید خواهد کرد، با وجود اینکه امیدوار بود این اقدام فشار بر هزینه های استقراض بلندمدت پس از فروش گسترده اوراق قرضه را کاهش دهد، همچنان بالا ماند. در روز چهارشنبه، بازدهی شاخص 10 ساله خزانه داری حدود 4.85 درصد بود که نزدیک به بالاترین سطح از اکتبر 2023 بود. بازدهی 20 و 30 ساله حدود 5.3 درصد معامله شد. موضوع فراتر از ایالات متحده است. به گفته گلدمن ساکس در پست چهارشنبه، تغییر نحوه صدور بدهی دولت ها بعید است که بازدهی بلندمدت را کاهش دهد. به گفته گلدمن، تغییر نوع بدهی که خزانه داری می فروشد، میزان پولی که دولت برای استقراض نیاز دارد را تغییر نمی دهد. به گفته این بانک، تغییر نوع بدهی هایی که دولت ها می فروشند، میزان نیاز آنها برای استقراض را تغییر نمی دهد. جورج کول، رئیس استراتژی نرخ‌های اروپایی در گروه جهانی کلان و تحقیقات بازار، در یک وبینار گفت: «چیزی که واقعاً در مورد این حرکت بالاتر در بازدهی جالب است، نظم و ترتیب آن است. او افزود که نوسانات کم، بحث در مورد اینکه بازار اوراق قرضه"}, {"source": "Business Insider", "title": "Anthropic has a cute graphic showing how its AI spread 'malicious' code", "link": "https://www.businessinsider.com/anthropic-claude-ai-cybersecurity-incident-malicious-package-pypi-cute-graphic-2026-9", "summary": "Anthropic released a report that explained how Claude uploaded malicious code during a closed cybersecurity exercise. Bloomberg/Getty Images Anthropic said its AI went outside its closed testing environment during cybersecurity exercises. The incidents had real-world impact, including \"malicious\" code uploaded to a public Python library. Anthropic has a cute, tiny figurine to help normies make sense of the AI's 'reckless' behavior. Anthropic has a new blog post that shows yet another way its AI model, Claude , misbehaved in ways that the company didn't anticipate. And to help condense its nearly 16,000-word report, the company created a cute little robot figurine to help visualize Claude's so-called \"recklessness.\" In the blog post published Wednesday, Anthropic recounted four incidents — one previously unreported — in which Claude models gained access to the open internet during cybersecurity exercises that were supposed to be closed simulations. The company said the models then acted beyond the tests' scope, including by uploading \"malicious packages\" to PyPI, a public library for Python code, and accessing credentials tied to real outside organizations. \"Our investigation identified two recurring alignment issues, present at varying levels of severity across the incidents: biased reasoning, in which Claude tended to disregard or misinterpret evidence that it was operating on the real internet, and recklessness, or a willingness to take harmful actions in the narrow pursuit of a task,\" Anthropic said. The post used a laundry list of technical terms to describe the cybersecurity incidents — \"misconfiguration,\" \"reward hacking,\" and \"sandbox escape\" — but there's an animated graphic that helps boil down one of the most serious episodes so we normies can follow what happened. Claude is represented as a small cartoon robot gaining access to the real internet during a closed cybersecurity exercise. Anthropic A Claude model, depicted as a boxy cartoon robot, was conducting a closed cybersecurity exercise known as a \"capture the flag\" task. The task is shown as a tiny flag inside a clear bubble that Claude is supposed to find. Anthropic said the model was told \"it has no internet access\" for the exercise, but a \"misconfiguration in the environment\" — represented by a loose screw rolling away from the bubble — gave Claude a path to the \"real internet.\" The cartoon Claude then holds a red box representing the \"malicious package\" that was uploaded to PyPI, a publi", "date_str": "2026-09-10T01:05:12+00:00", "hash": "d39642028535f5d9", "title_fa": "Anthropic یک گرافیک زیبا دارد که نشان می دهد چگونه هوش مصنوعی آن کدهای مخرب را پخش می کند", "summary_fa": "Anthropic گزارشی منتشر کرد که توضیح می‌داد چگونه کلود کدهای مخرب را طی یک تمرین امنیتی سایبری بسته آپلود می‌کرد. بلومبرگ/گتی ایماژ آنتروپیک گفت هوش مصنوعی آن در طول تمرینات امنیت سایبری به خارج از محیط آزمایش بسته خود رفت. این رویدادها تأثیرات دنیای واقعی داشتند، از جمله کد «مخفی» آپلود شده در کتابخانه عمومی پایتون. آنتروپیک یک مجسمه زیبا و کوچک دارد که به هنجارها کمک می کند تا رفتار \"بی پروا\" هوش مصنوعی را درک کنند. Anthropic یک پست وبلاگ جدید دارد که نشان می دهد مدل هوش مصنوعی آن، کلود، به شیوه ای بد رفتار کرده است که شرکت پیش بینی نکرده بود. و برای کمک به فشرده‌سازی گزارش تقریباً 16000 کلمه‌ای خود، این شرکت یک مجسمه ربات کوچک زیبا ساخت تا به تجسم به اصطلاح «بی‌احتیاطی» کلود کمک کند. در پست وبلاگ منتشر شده در روز چهارشنبه، آنتروپیک چهار حادثه را بازگو کرد - یکی از آنها قبلا گزارش نشده بود - که در آن مدل‌های کلود در طول تمرین‌های امنیت سایبری که قرار بود شبیه‌سازی‌های بسته باشد، به اینترنت باز دسترسی پیدا کردند. این شرکت گفت که مدل‌ها سپس فراتر از محدوده آزمایش عمل کردند، از جمله با آپلود «بسته‌های مخرب» در PyPI، یک کتابخانه عمومی برای کد پایتون، و دسترسی به اعتبارنامه‌های مرتبط با سازمان‌های خارجی واقعی. آنتروپیک گفت: «تحقیقات ما دو مشکل همسویی مکرر را شناسایی کرد که در سطوح مختلف شدت در بین حوادث وجود داشت: استدلال مغرضانه، که در آن کلود تمایل داشت شواهدی را که نشان می‌داد در اینترنت واقعی کار می‌کرد را نادیده بگیرد یا به اشتباه تفسیر کند، و بی‌احتیاطی، یا تمایل به انجام اقدامات مضر در پیگیری محدود یک کار.»"}, {"source": "Business Insider", "title": "Anthropic posted, then swiftly deleted, a $450,000 sales job aimed at its 'mega' customer Meta", "link": "https://www.businessinsider.com/anthropic-job-posting-450000-for-a-sales-job-meta-2026-9", "summary": "Anthropic CEO Dario Amodei. Bloomberg/Getty Images Anthropic posted a sales job directly targeting one of its biggest customers, Meta. The AI lab took down the job posting after Business Insider asked about it. Meta and Anthropic have a complicated relationship, as both pushing to develop frontier AI. Anthropic posted — and then deleted — a job listing for a salesperson tasked with selling to Meta, its AI rival and one of its largest customers. The listing, titled \"Mega Account Executive, Meta,\" appeared on Anthropic's job board at a delicate moment for the companies' relationship. Meta still spends hundreds of millions of dollars a month as Anthropic's customer, according to a recent New York Times report . But it's also trying to reduce its reliance on Anthropic's AI tools as Anthropic is shoring up its finances ahead of a massive initial public offering. The post suggests Anthropic is betting Meta will remain a major customer even as Meta builds more capable AI models of its own. After Business Insider asked Anthropic about the listing on Wednesday, the company pulled it down. Anthropic and Meta declined to comment. Anthropic's job posting offered an annual salary of $380,000 to $450,000, and didn't mention Meta outside the title. It said the salesperson would \"win new business and drive revenue within a book of strategic digital native accounts.\" The listing stands out for its specificity. Other Anthropic account executive openings target broad regions or sectors, including startups in Europe, the Middle East, and North Africa, or the public sector in Southeast Asia. Anthropic's AI coding tool, Claude Code , became popular across Silicon Valley, including at Meta, this year. One internal projection said Meta could spend $10 billion annually on Anthropic, the Times reported. Meta's head of AI product, Nat Friedman, told employees that if Meta decreased its reliance on Anthropic's tools, it could hit Anthropic's revenue as it approaches its IPO, the report said. Have a tip? Contact this reporter via email at scouncil@insider.com , or over text, Signal, Telegram, or WhatsApp at 415-757-8198. Use a personal email address, a nonwork WiFi network, and a nonwork device; here's our guide to sharing information securely. Read the original article on Business Insider", "date_str": "2026-09-09T23:22:44+00:00", "hash": "3ba8c4f8d3e85d87", "title_fa": "Anthropic یک کار فروش 450000 دلاری را با هدف مشتری \"مگا\" خود Meta پست کرد، سپس به سرعت حذف کرد.", "summary_fa": "داریو آمودی، مدیر عامل آنتروپیک. بلومبرگ/گتی ایماژ آنتروپیک یک شغل فروش را منتشر کرد که مستقیماً یکی از بزرگترین مشتریان خود، متا را هدف قرار داد. بعد از اینکه Business Insider در مورد آن سوال کرد، آزمایشگاه هوش مصنوعی این آگهی استخدام را حذف کرد. متا و آنتروپیک رابطه پیچیده ای دارند، زیرا هر دو در تلاش برای توسعه هوش مصنوعی مرزی هستند. آنتروپیک لیست شغلی را برای فروشنده ای که وظیفه فروش آن به متا، رقیب هوش مصنوعی و یکی از بزرگترین مشتریانش را دارد، پست کرد – و سپس حذف کرد. این فهرست با عنوان \"مگا حساب اجرایی، متا\" در یک لحظه حساس برای روابط این شرکت ها در تابلوی شغلی آنتروپیک ظاهر شد. بر اساس گزارش اخیر نیویورک تایمز، متا همچنان ماهانه صدها میلیون دلار به عنوان مشتری آنتروپیک خرج می کند. اما همچنین در تلاش است تا اتکای خود به ابزارهای هوش مصنوعی آنتروپیک را کاهش دهد، زیرا آنتروپیک در حال تقویت منابع مالی خود قبل از عرضه اولیه عمومی گسترده است. این پست نشان می‌دهد که آنتروپیک شرط می‌بندد که متا یک مشتری اصلی باقی بماند، حتی اگر متا مدل‌های هوش مصنوعی توانمندتری را خودش بسازد. پس از اینکه Business Insider در روز چهارشنبه از Anthropic در مورد این فهرست پرسید، شرکت آن را حذف کرد. آنتروپیک و متا از اظهار نظر خودداری کردند. آگهی شغلی Anthropic حقوق سالانه 380000 تا 450000 دلار را ارائه می کرد و متا را خارج از عنوان ذکر نمی کرد. گفته می‌شود که فروشنده «کسب‌وکار جدیدی را به دست خواهد آورد و در کتابی از حساب‌های بومی دیجیتال استراتژیک درآمد کسب خواهد کرد». این فهرست به دلیل ویژگی آن متمایز است. سایر افتتاحیه‌های اجرایی حساب Anthropic مناطق یا بخش‌های وسیعی را هدف قرار می‌دهند، از جمله استارت‌آپ‌ها در اروپا، خاورمیانه، و شمال آفریقا، یا بخش عمومی در آسیای جنوب"}, {"source": "Business Insider", "title": "Silicon Valley is getting the Hollywood treatment this fall. Find out which tech-founder movie is right for you.", "link": "https://www.businessinsider.com/movies-documentaries-shows-about-tech-founders-silicon-valley-coming-2026", "summary": "This fall, there s a tech-founder movie out there for every taste. Sony / A24 / Neon Silicon Valley is having a moment in Hollywood this fall. Elizabeth Holmes and Elon Musk are getting the documentary treatment, with two very different tones. Meta and OpenAI are the subjects of two movies that could be major players this awards season. This fall, Hollywood is taking on another California industry: Silicon Valley. A fresh crop of movies and documentaries about some of the biggest figures in tech is slated to hit screens starting in October, with many of them already being teed up as serious contenders for Oscar season. Get ready for movies that delve into the dark sides of Facebook and OpenAI, a hard-hitting exposé on Elon Musk, and a genre-bending documentary in which Nathan Fielder faces off with Theranos founder Elizabeth Holmes. But which tech-founder movie is right for you? Let's help you decide. The Social Reckoning (October 9) What it's about: Sixteen years after the release of \"The Social Network,\" David Fincher and Aaron Sorkin's classic gets a spiritual sequel. This time, Sorkin, who wrote \"The Social Network,\" takes the directing reins and Jeremy Strong steps in as Mark Zuckerberg to tell the story of a Facebook engineer who decides to blow the whistle and reveal some of the company's darkest secrets. Jeremy Allen White and Mikey Madison also star. Watch this if: You want to see Strong go full Method as Zuckerberg . Musk (October 16) What it's about: Oscar-winning documentary filmmaker Alex Gibney leaves no stone unturned in his nearly four-hour film chronicling Elon Musk's life and career . The doc tracks the moves he made to become the richest person in the world, along with his troubled personal life and his time in Trump's White House. Watch this if: You want to see the doc Musk calls a \"hit piece\" and judge for yourself. You Can See Everything (October 16) What it's about: Before Theranos founder Elizabeth Holmes reported to prison for defrauding investors in 2023, she invited a film crew to her California home. But not just any film crew — one led by comedian Nathan Fielder . Watch this if: You're itching to hear what Holmes thinks when Fielder shows her Amanda Seyfried's portrayal of her in \"The Dropout.\" Artificial (December 25) What it's about: Luca Guadagnino's latest movie stars Andrew Garfield as OpenAI cofounder Sam Altman . The movie focuses on his dramatic firing and rehiring as its CEO in 2023. Watch this if: You want to get a pe", "date_str": "2026-09-09T22:12:28+00:00", "hash": "7895a42d3121ed80", "title_fa": "سیلیکون ولی در پاییز امسال تحت درمان هالیوود قرار می گیرد. ببینید کدام فیلم موسس فناوری برای شما مناسب است.", "summary_fa": "پاییز امسال، یک فیلم بنیانگذار فناوری برای هر سلیقه ای وجود دارد. Sony / A24 / Neon Silicon Valley در پاییز امسال لحظاتی را در هالیوود می گذراند. الیزابت هولمز و ایلان ماسک با دو لحن بسیار متفاوت در حال دریافت فیلم مستند هستند. متا و OpenAI سوژه های دو فیلمی هستند که می توانند بازیگران اصلی این فصل جوایز باشند. پاییز امسال، هالیوود در حال ورود به صنعت دیگری در کالیفرنیا است: دره سیلیکون. مجموعه جدیدی از فیلم‌ها و مستندها درباره برخی از بزرگ‌ترین چهره‌های فناوری قرار است از ماه اکتبر به روی پرده بروند، و بسیاری از آنها در حال حاضر به عنوان رقبای جدی برای فصل اسکار شناخته می‌شوند. برای فیلم‌هایی آماده شوید که به جنبه‌های تاریک فیس‌بوک و OpenAI می‌پردازند، نمایشی سخت در مورد ایلان ماسک، و یک مستند ژانرخم که در آن ناتان فیلدر با الیزابت هولمز، بنیانگذار ترانوس روبرو می‌شود. اما کدام فیلم موسس فناوری برای شما مناسب است؟ بیایید به شما کمک کنیم تصمیم بگیرید. The Social Reckoning (9 اکتبر) درباره چیست: شانزده سال پس از اکران «شبکه اجتماعی»، فیلم کلاسیک دیوید فینچر و آرون سورکین دنباله ای معنوی می یابد. این بار، سورکین، نویسنده «شبکه اجتماعی»، کارگردانی را بر عهده می گیرد و جرمی استرانگ در نقش مارک زاکربرگ وارد صحنه می شود تا داستان یک مهندس فیس بوک را تعریف کند که تصمیم می گیرد سوت بزند و برخی از تاریک ترین اسرار شرکت را فاش کند. جرمی آلن وایت و مایکی مدیسون نیز بازیگران این فیلم هستند. اگر می خواهید Strong go full Method را در نقش زاکربرگ ببینید. ماسک (16 اکتبر) درباره چیست: الکس گیبنی، مستندساز برنده اسکار، در فیلم تقریباً 4 ساعته خود که زندگی و حرفه ایلان ماسک را روایت می کند، سنگ تمام نمی گذارد. این مستند حرکت‌هایی را که او برای تبدیل شدن به ثروتمندترین"}, {"source": "Business Insider", "title": "The new Apple Watch can listen in on your conversations and take notes. That makes me feel weird.", "link": "https://www.businessinsider.com/apple-watch-siri-recap-live-rewind-audio-intelligence-features-2026-9", "summary": "The Apple Watch Series 12 introduces new Audio Intelligence features that listening features. Bloomberg/Getty Images The Apple Watch Series 12 and Ultra 4 models have new Audio Intelligence features that feel a little weird for privacy reasons. \"Live Rewind\" transcribes the last 15 seconds of what someone said. Apple says no audio is recorded or stored. \"Siri Recap\" listens to your day and recaps your meetings and conversations. Apple Watch users, get ready for some odd looks! So you got an Apple Watch to track your steps and heart rate. Now all your friends are afraid you're taking notes on their conversations. The latest Series 12 Apple Watch model, announced at the company's big September event, includes new AI listening features. Apple is calling them \"Audio Intelligence.\" They're convenient and cool, but also a little … weird. They also strike me as very un-Appley. The two features that caught my eye are called Siri Recap and Live Rewind. Siri Recap can be set to always listen, or just for certain hours of the day (or not at all). The AI recaps are available upon request in Siri, and will be a recap of what the mic on your Apple Watch heard — not the full audio clip or transcript. Apple s example of Siri Recap is it listening and taking notes during your morning personal trainer session. Apple The examples Apple gives for what you could use this for include remembering high-level moments from a team meeting or a parent-teacher conference. Live Rewind gives you a transcription of what was just said in the last 15 seconds. You can then send the transcription to Siri to save for later. In the example they give, a server speeds through the daily menu specials — relatable! That's always a challenge to remember. A quick double-tap to the watch's crown, and you can see the list of menu items she just rattled off. Apple s Live Rewind Audio Intelligence feature on the new Apple Watch Apple The other examples they give for using this are remembering book recommendations from a friend or a great idea your colleague just had. You can send the transcript to Siri to look at later when you want to remember that book or great idea. Convenient! A world where our watches are listening feels weird But in both cases, I'm not sure the convenience fully offsets how strange I would feel knowing I'm walking around with an always-on listening device. Technically, it's ambiently on, and there are some general privacy functions. Apple emphasizes that audio is not recorded or st", "date_str": "2026-09-09T22:01:56+00:00", "hash": "3aebccab543ed42c", "title_fa": "اپل واچ جدید می تواند به مکالمات شما گوش دهد و یادداشت برداری کند. این به من احساس عجیبی می دهد.", "summary_fa": "اپل واچ سری 12 ویژگی‌های هوش صوتی جدیدی را معرفی می‌کند که ویژگی‌های گوش دادن را دارد. بلومبرگ/گتی ایماژ اپل واچ سری 12 و اولترا 4 دارای ویژگی های جدید هوش صوتی هستند که به دلایل حفظ حریم خصوصی کمی عجیب به نظر می رسد. \"Live Rewind\" 15 ثانیه آخر صحبت های شخصی را رونویسی می کند. اپل می گوید هیچ صوتی ضبط یا ذخیره نمی شود. \"Siri Recap\" به روز شما گوش می دهد و جلسات و گفتگوهای شما را خلاصه می کند. کاربران اپل واچ، برای ظاهر عجیب و غریب آماده شوید! بنابراین شما یک اپل واچ برای ردیابی گام ها و ضربان قلب خود دارید. اکنون همه دوستان شما می ترسند که از مکالمات آنها یادداشت برداری کنید. آخرین مدل سری 12 اپل واچ که در رویداد بزرگ سپتامبر این شرکت معرفی شد، شامل ویژگی‌های جدید گوش دادن به هوش مصنوعی است. اپل آنها را \"هوش صوتی\" می نامد. آنها راحت و جالب هستند، اما همچنین کمی ... عجیب و غریب. آنها همچنین من را بسیار غیر اپلی می دانند. دو ویژگی که توجه من را جلب کرد Siri Recap و Live Rewind نام دارند. Siri Recap را می توان طوری تنظیم کرد که همیشه گوش کند، یا فقط برای ساعات خاصی از روز (یا اصلاً) گوش ندهد. خلاصه‌های هوش مصنوعی در صورت درخواست در سیری در دسترس هستند و خلاصه‌ای از آنچه میکروفون اپل واچ شما شنیده است – نه کلیپ صوتی یا متن کامل. مثال اپل Siri Recap گوش دادن و یادداشت برداری در جلسه مربی شخصی صبحگاهی شما است. Apple مثال‌هایی که اپل برای مواردی که می‌توانید از آن استفاده کنید می‌آورد، شامل یادآوری لحظات سطح بالا از یک جلسه تیمی یا یک کنفرانس والدین-معلم است. Live Rewind رونویسی از آنچه در 15 ثانیه گذشته گفته شد را به شما ارائه می دهد. سپس"}, {"source": "Business Insider", "title": "Where to watch the Patriots vs. Seahawks: Free live streams, odds, and venue for the NFL regular season kickoff", "link": "https://www.businessinsider.com/guides/streaming/where-to-watch-patriots-vs-seahawks-nfl-2026-9", "summary": "When you buy through our links, Business Insider may e launch that other foldables feel too much \"like two phones awkwardly stuck together.\" The company instead wanted a larger display, one that Ternus said feels \"as natural and intuitive as an iPad.\" Samsung, which first launched a foldable phone in 2019, shared its thoughts on Apple's shiny new product in a post on X. \"Let us know when you're done reheating our leftovers,\" it wrote. iPhone 18 An iPhone 18 Pro in Burgundy. Apple Apple's new iPhone 18 model offers better battery life, camera capabilities, and performance than its predecessor, the company said. It comes in four colors: black, silver, glacier, and burgundy. Available in two models, the Pro and Pro Max, the devices can be preordered on September 12, with availability beginning September 18. In addition to camera upgrades, the new phone has improved graphics rendering and a more robust \"dynamic island,\" the small, black, cylindrical segment near the top of the phone's display. The Pro version starts at $1,199, or buyers can pa", "date_str": "2026-09-09T21:38:53+00:00", "hash": "98a738ae2366e471", "title_fa": "8 اعلامیه بزرگ اپل از رویداد راه اندازی آن", "summary_fa": "مدیر عامل جدید اپل، جان ترنوس، میزبان اولین رویداد سالانه معرفی محصول خود بود. بنجامین فانجوی/گتی ایماژ اپل در رویداد «سورپرایز و درخشش» خود در روز چهارشنبه مجموعه جدیدی از گجت ها را به نمایش گذاشت. این راه‌اندازی‌ها شامل اولین آیفون و ساعت‌های تاشو اپل با ویژگی‌های جدید نظارت بر سلامت بود. در اینجا بزرگترین به روز رسانی ها از اولین رویداد اپل، مدیر عامل جدید جان ترنوس است. همه در مورد گوشی تاشو جدید اپل صحبت می کنند، اما این تنها یکی از گجت های جدیدی است که سازنده آیفون روز چهارشنبه از آن رونمایی کرد. اپل در عرضه سالانه محصول خود، مجموعه‌ای از محصولات و ویژگی‌های جدید را معرفی کرد، از فناوری ساعت که به کاربران می‌گوید واقعاً چند سال سن دارند تا نسخه‌ای از سیری که به تمام مکالمات شما گوش می‌دهد. علیرغم عرضه های جدید، قیمت سهام اپل در نزدیکی پایان معرفی، قبل از بهبودی اواخر بعد از ظهر چهارشنبه حدود 2 درصد کاهش یافت. این شرکت همچنین فا  . For sustained support, Dansko's Platform Pros have the most stabilizing footbeds out there. Our team has also tested the best clogs for plantar fasciitis that'll slip on and stay on. The 5 best clogs we tested A garden classic: SeaVees Bodega Clogs Seavees \"Perfect for walks in the park, bodega runs, gardening, and outdoor chores, these rubber clogs from SeaVees are a must. They're unbelievably comfy with great support and cushion, plus the rubber exterior makes them easy to rinse off and keep clean. The shoes come in a ton of fun colors to brighten up your look (we love the Fern Green and Tomato Red pairs), but there are also plenty of neutrals to choose from. Though SeaVees says to size up in the Bodega Clogs if you plan to wear socks, we disagree — after testing their advice and ending up with a too-big pair, our recommendation is to go with your usual whole size. The exception is if you have a wide foot, in which case you should be able to size up and be fine with a pair of socks.\" — Sally Kaplan, executive editor This comfortable loafer hybrid: Rothy s The Penny Clog Sally Kaplan, Gabrielle Chase/Business Insider Rothy's reports that it has sold out of its Casual Clogs seven times. Since trying them ourselves, we can confirm the hype is warranted. After the success of the original, Rothy's has also released a ReVelvet Clog , a Teddy Buckle Clog , and our latest favo", "date_str": "2026-09-09T21:16:18+00:00", "hash": "840978267469b5ec", "title_fa": "ما بهترین پاپوش ها را برای پوشیدن بین فصول آزمایش کردیم. در اینجا 14 جفت وجود دارد که ما را در تمام طول روز راحت نگه داشته اند.", "summary_fa": "وقتی از طریق پیوندهای ما خرید می کنید، Business Insider ممکن است کمیسیون وابسته را دریافت کند. بیشتر بیاموزید گابریل چیس، راشل شولتز/کلگ های داخلی به راحتی اشتباه می شوند. برخی از جفت‌ها باعث شده‌اند که احساس کنم روی یک تخته چوبی می‌چرخم، یا در خطر راه رفتن مستقیم از آنها به خیابان هستم. بهترین پاپوش‌ها علیرغم طراحی بدون پشتی که دارند، به طور ایمن روی من قرار می‌گیرند، out more robust alignment I expect we will permanently lose control of it. If that happens then most people could die,\" Paul Christiano, an AI safety researcher, said on Wednesday after OpenAI announced he was joining its board and Safety and Security Committee. In a lengthy statement about his new role, Christiano addressed the threat AI poses and warned that humans are at imminent risk of losing control of AI systems. \"Based on the recent trajectory of capabilities and the continued difficulty of alignment, I now believe there is a meaningful risk that rapid acceleration in AI capabilities leads to catastrophic and irreversible loss of control in the very near term,\" Christiano wrote. \"I do not think that the AI industry in general, including OpenAI, is currently on track to reduce this risk to an acceptable level.\" Christiano previously led alignment research at OpenAI and worked for the federal government as the head of safety at the Center for AI Standards and Innovation within the National Institute of Standards and Technology. On Wednesday, he said his joining of OpenAI was \"not an endorsement or criticism of OpenAI's safety practices in particular\" but that he hopes all frontier labs improve their safety oversight. He also said reducing the risks posed by AI would require coordination worldwide. AI researchers have consistently warned about the risks posed by superintelligence and the singularity, a term used to refer to the point at which AI systems surpass human intelligence, improve themselves, and advance at a rate that humans can no longer predict or control. OpenAI CEO Sam Altman said in July that the singularity had already arrived. The risk of losing control of AI Christiano said he thinks the risk of losing control of AI is so great right now due to AI's increasing abilities in AI research, which he said could lead to a \"rapid intelligence explosion.\" He also said the way AI is trained with reinforcement learning means the models are being  ago, is now more expensive ($1,099) than it was when it debuted at $999. This is also true for the iPhone 17e and iPhone 17, which are now $699 and $899, respectively. The iPhone 16 is $799, restoring it back to its debut price when Apple launched it in September 2024. The iPhone 18 Pro and Pro Max models will be available with 256GB, 512GB, 1TB, and 2TB storage capacities. The 2TB version of the Pro model costs $2399, and the Pro Max 2TB phone will run you $2499. Both prices are above those of the 2TB iPhone 17 Pro Max, the previous most expensive iPhone on the market. Both of the top-of-the-line iPhone 18s still pale in comparison to the highest-tier iPhone Duo. The 2TB iPhone Duo will cost $3199. The higher prices illustrate how the global memory shortage has stretched a company as dominant as Apple. In his final earnings call as CEO, Tim Cook said that Apple had \"reluctantly raised prices\" of iPads and MacBooks due to the memory shortage. \"We did it because we're in what I would characterize as a 100-year flood on the memory pricing with exponential increases in memory prices,\" Cook said. The memory shortage is largely driven by the AI revolution as chipmakers shift production away from chips designed for consumer products to the more specialized chips required for the data centers that power AI models. In June, Apple increased the prices of iPads by up to 25% and Mac computers by as much as 20%. At the time, the cost of existing iPhone models remained unchanged. Other companies, including some of Apple's competitors, have also hiked device prices. Officials at Samsung and Google have said they raised prices on some of their smartphone mode", "date_str": "2026-09-09T18:29:41+00:00", "hash": "b7786790dbe7772e", "title_fa": "اپل به تازگی قیمت آیفون را به طور کلی افزایش داده است - حتی مدل های قدیمی", "summary_fa": "آیفون 18 پرو جدید اپل. اپل از آیفون 18 پرو و ​​پرو مکس رونمایی کرد. قیمت این گوشی ها 100 دلار بیشتر از مدل های قبلی آیفون 17 پرو خواهد بود. اپل همچ
