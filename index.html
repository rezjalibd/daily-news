ز پوشش خود را از کل تیم دریافت کنیم. همه معاملات را در آمازون مشاهده کنید. من از زمان شروع آنها در سال 2015، همه رویدادهای فروش پرایم روز را پوشش داده‌ام و با همکاران شکارچی معاملات و آزمایش‌کنندگان محصولات متخصص در اینجا در Business Insider به نیروها می‌پیوندم تا بهترین تخفیف‌ها را در زمینه فناوری، خانه، آشپزخانه، سبک و موارد دیگر کشف کنم. بیایید تا اینجا به نکات برجسته گیر کنیم. در آمازون بگردید: معاملات لایتنینگ | فنی | آشپزخانه | صفحه اصلی | مد | اسباب بازی | هالووین بهترین معاملات فناوری روز نخست در آمازون مرور کنید: معاملات لایتنینگ | فنی | آشپزخانه | صفحه اصلی | مد | اسباب بازی | معاملات آشپزخانه خانه هالووین پرایم روز در آمازون مرور کنید: معاملات لایتنینگ | فنی | آشپزخانه | صفحه اصلی | مد | اسباب بازی | زیبایی سبک هالووین پرایم روز در آمازون بیشتر ببینید: معاملات لایتنینگ | فنی | آشپزخانه | صفحه اصلی | مد | اسباب بازی | خرید هالووین برای تخفیف های بیشتر امروز؟ خلاصه ما از همه مقالات Prime Day را از بهترین معاملات"}, {"source": "Business Insider", "title": "The AI boom could change where interest rates end up, a top central banker says", "link": "https://www.businessinsider.com/japan-central-bank-ai-interest-rates-bond-yields-boj-chida-2026-10", "summary": "Bank of Japan deputy governor Shinichi Uchida said AI is now a key topic of discussion for policymakers. Kiyoshi Ota/Bloomberg/Getty Images AI is becoming a bigger focus for central bankers, BOJ's Uchida says. He says the technology could change where interest rates ultimately settle. Investors are debating whether higher bond yields are here to stay. The artificial intelligence boom may be changing more than just stock prices. AI could alter where interest rates ultimately settle by boosting demand, lifting productivity, and increasing capital investment, Bank of Japan Deputy Governor Shinichi Uchida said Monday. \"First, it is a big positive demand shock, which has put upward pressure on the economy and prices. Second, it could affect the supply side, perhaps positively by raising productivity and enhancing capital stock accumulations , \" Uchida said in a speech in Tokyo. He added that the developments could affect r-star, or the neutral rate of interest, which is the level that neither stimulates nor restrains the economy. If AI raises that underlying rate, it could mean central banks ultimately need to keep policy rates higher than investors previously expected to keep inflation in check without unnecessarily slowing economic activity. AI has been a \"favorite topic\" among central bankers in recent years, Uchida said, but what was once largely a conceptual discussion about the future has become an immediate issue for monetary policy. His remarks come as investors debate whether the recent surge in long-term bond yields reflects a temporary repricing or a more lasting shift in the level where interest rates eventually settle. Uchida suggested AI may be another reason investors and policymakers need to rethink that destination. That question carries particular weight in Japan, which spent much of the past three decades battling deflation and ultra-low interest rates before the BOJ began tightening policy. On Monday, the benchmark 10-year JGB yield stood at 3.09% around midday in Japan, hovering near a three-decade high. The 30-year yield touched a record 4.235%. If the neutral rate is rising, higher borrowing costs may not just be part of the BOJ's exit from ultra-loose policy — they may be here to stay. Uchida's speech adds to a growing debate over how AI could reshape global capital flows. Rising Japanese government bond yields are narrowing the yield advantage that encouraged domestic investors to buy overseas bonds for years, potentially reducing deman", "date_str": "2026-10-05T05:11:11+00:00", "hash": "7cc567340a58d547", "title_fa": "یکی از بانک‌های مرکزی ارشد می‌گوید رونق هوش مصنوعی می‌تواند نقطه پایان نرخ بهره را تغییر دهد", "summary_fa": "شینیچی اوچیدا، معاون بانک ژاپن گفت که هوش مصنوعی اکنون موضوعی کلیدی برای بحث سیاستگذاران است. اوچیدا از BOJ می‌گوید هوش مصنوعی کیوشی اوتا/ بلومبرگ/ گتی ایماژ در حال تبدیل شدن به تمرکز بیشتری برای بانک‌های مرکزی است. او می‌گوید این فناوری می‌تواند در جایی که نرخ‌های بهره در نهایت ثابت می‌شود، تغییر کند. سرمایه گذاران در حال بحث هستند که آیا بازدهی اوراق قرضه بالاتر باقی می ماند یا خیر. رونق هوش مصنوعی ممکن است بیش از قیمت سهام در حال تغییر باشد. شینیچی اوچیدا، معاون بانک ژاپن، روز دوشنبه گفت که هوش مصنوعی می‌تواند با افزایش تقاضا، افزایش بهره‌وری و افزایش سرمایه‌گذاری، جایی که نرخ بهره در نهایت به پایان می‌رسد را تغییر دهد. اوچیدا در سخنرانی خود در توکیو گفت: \"اول، این یک شوک تقاضای مثبت بزرگ است که فشار صعودی بر اقتصاد و قیمت‌ها وارد کرده است. دوم، می‌تواند بر طرف عرضه تاثیر بگذارد، شاید با افزایش بهره‌وری و افزایش انباشت سرمایه. وی افزود: این تحولات می‌تواند روی r-star یا نرخ بهره خنثی تأثیر بگذارد، که سطحی است که نه اقتصاد را تحریک می‌کند و نه آن را مهار می‌کند. اگر هوش مصنوعی این نرخ پایه را افزایش دهد، می‌تواند به این معنا باشد که بانک‌های مرکزی در نهایت باید نرخ‌های سیاستی را بالاتر از آنچه سرمایه‌گذاران قبلاً انتظار داشتند تورم را بدون کاهش غیرضروری فعالیت اقتصادی کنترل کنند، نگه دارند. اوچیدا گفت که هوش مصنوعی در سال‌های اخیر «موضوع مورد علاقه» بانک‌های مرکزی بوده است، اما آنچه زمانی عمدتاً یک بحث مفهومی در مورد آینده بود، به موضوعی فوری برای سیاست‌های پولی تبدیل شده است. اظهارات وی در حالی بیان می شود که سرمایه گذاران در مورد اینکه آیا افزایش اخیر بازده اوراق قرضه بلندمدت منعکس کننده قیمت گذاری مجدد موقت یا تغییر پایدارتر در سطحی است که در نهایت نرخ های بهره در آن"}, {"source": "Business Insider", "title": "Ben Affleck says he had a ‘heart attack’ when he first saw what AI could do — then he used it in his movie", "link": "https://www.businessinsider.com/ben-affleck-used-ai-latest-film-movie-netflix-interpositive-2026-10", "summary": "Ben Affleck said his company s AI tools are designed to support, not replace, people working in film. Matt Winkelmeyer/Getty Images Ben Affleck said his first close look at AI gave him a \"heart attack.\" He then built a company that spent eight months shooting footage to train AI tools for film crews. Affleck said he used AI on his upcoming film, \"Animals,\" but won't say exactly how. Ben Affleck said he wants AI to support filmmakers and artists in the creative process. Speaking at the Bloomberg Screentime event in Los Angeles over the weekend, Affleck said his company's AI tools are meant to help creatives work more efficiently, not make them obsolete. Affleck said his interest in AI grew after he started a visual-effects company, and he was able to use his celebrity status to get a closer look at the early work coming out of Google and OpenAI. \"At first, I kind of had a heart attack. I called Matt Damon , and I was like, dude, we have to do as many movies in the next few years because we're finished,\" Affleck said. He said he began wondering how AI could be used \"in an ethical way\" to help people make movies without shutting others out. His solution, he said, was to create his own dataset so the technology could work \"hand in glove\" with artists. So, Affleck said he \"raised the money\" and spent eight months shooting a large collection of footage, which he used to further train existing AI models for specific filmmaking tasks. He said AI models first learn basic concepts, such as colors, from huge amounts of footage. But to understand the finer points of filmmaking, the models need more professionally shot material. \"In order to obtain that information, I was concerned that most of the models being used had been trained on my peers' — people I know — work and I was uncomfortable with that,\" Affleck said. \"I thought, that's not really a viable business.\" Instead, Affleck said, his company takes open models built on publicly available footage and trains them for cinematic work. Filmmakers can then further train the tools on their own productions as they work, retaining the proprietary nature of their footage and the learning that comes from it, he said. Affleck added that the AI is not meant to \"replace people\" nor \"eliminate\" them. \"I don't believe that there will ever be 'Just type it in and make a movie that people want to see,'\" Affleck said. \"But the whole effort behind it was to do something ethical, to do something that did not displace people, but th", "date_str": "2026-10-05T05:06:05+00:00", "hash": "28347245da275463", "title_fa": "بن افلک می گوید وقتی برای اولین بار دید که هوش مصنوعی چه کاری می تواند انجام دهد، دچار حمله قلبی شد - سپس از آن در فیلم خود استفاده کرد.", "summary_fa": "بن افلک گفت که ابزارهای هوش مصنوعی شرکت او برای پشتیبانی و نه جایگزین کردن افرادی که در فیلم کار می کنند طراحی شده اند. مت وینکل مایر/ گتی ایماژ بن افلک گفت که اولین نگاه دقیق او به هوش مصنوعی باعث \"سکته قلبی\" شد. او سپس شرکتی را ساخت که هشت ماه را صرف فیلمبرداری برای آموزش ابزارهای هوش مصنوعی برای خدمه فیلمبرداری کرد. افلک گفت که از هوش مصنوعی در فیلم آینده‌اش «حیوانات» استفاده کرده است، اما دقیقاً نمی‌گوید چگونه. بن افلک گفت که او می خواهد هوش مصنوعی از فیلمسازان و هنرمندان در فرآیند خلاقیت حمایت کند. افلک در سخنرانی در رویداد Bloomberg Screentime در لس آنجلس در آخر هفته، گفت که ابزارهای هوش مصنوعی شرکت او برای کمک به خلاقان برای کار موثرتر است، نه منسوخ کردن آنها. افلک گفت علاقه او به هوش مصنوعی پس از راه‌اندازی یک شرکت جلوه‌های بصری افزایش یافت و او توانست از موقعیت مشهور خود برای مشاهده دقیق‌تر کارهای اولیه گوگل و OpenAI استفاده کند. «در ابتدا به نوعی دچار حمله قلبی شدم. من با مت دیمون تماس گرفتم و فکر کردم، رفیق، ما باید در چند سال آینده تعداد زیادی فیلم بسازیم زیرا کارمان تمام شده است. بنابراین، افلک گفت که \"پول را جمع آوری کرد\" و هشت ماه را صرف فیلمبرداری مجموعه بزرگی از فیلم کرد که از آنها برای آموزش بیشتر مدل های هوش مصنوعی موجود برای کارهای خاص فیلمسازی استفاده کرد. او گفت که مدل‌های هوش مصنوعی ابتدا مفاهیم اساسی مانند رنگ‌ها را از حجم عظیم فیلم یاد می‌گیرند. اما برای درک نکات ظریف فیلمسازی، مدل ها به مواد حرفه ای تری نیاز دارند. افلک گفت: «برای به دست آوردن این اطلاعات، نگران این بودم که بیشتر مدل‌های مورد استفاده بر روی کار همتایان من - افرادی که می‌شناسم - آموزش دیده‌اند و من از این"}, {"source": "Business Insider", "title": "After 11 years on an H-1B visa, I still miss my family back home. Here’s why I stay in the US.", "link": "https://www.businessinsider.com/h-1b-visa-raising-family-america-far-from-parents-india-2026-10", "summary": "Abhradeep Chatterjee and his wife moved to the US together 11 years ago; he s been on an H-1B since. Tim Evans for BI Abhradeep Chatterjee has lived in the US on an H-1B visa for 11 years — the uncertainty's been hard. He hasn't visited India to see family in over a decade. Despite it all, Chatterjee is choosing the US because of the opportunities for him and his family. This as-told-to essay is based on a conversation with Abhradeep Chatterjee, 37, an Indian national who lives in Minnesota. The following has been edited for length and clarity. I was young and newly married when I came to the US from India in 2015. I didn't imagine I'd still be here 11 years later. I came for the opportunity to grow. The Indian multinational company I'd been working for, Tata Consultancy Services, sent me to New Jersey on an assignment. I continued building a career in the US on the H-1B visa, and the country has challenged me professionally in ways I couldn't have imagined when I arrived. But it's all been on a temporary visa . The uncertainty has been difficult. This story is part of Business Insider's \" H-1B Fallout: 1 year later \" series. Read more of our coverage of how the Trump administration's H-1B visa changes are affecting workers: The hidden sacrifices of chasing the H-1B dream in America The new lands of opportunity I moved to the US on a tennis scholarship. 8 years later, an H-1B layoff sent me home. Watch: I gave up on getting an H-1B visa because of the $100k fee. If you have a story to share, please fill out this short form for the reporter. My wife made sacrifices; our daughter gained opportunities My wife and I both wanted to come to the US. She moved on a dependent H-4 visa , which doesn't automatically come with work authorization. She had to wait until my employer filed my green card paperwork, which meant she couldn't work for nearly four years. Money wasn't our biggest issue — I felt guilty that she'd studied for a master's and wanted to work, but sacrificed her life to come to the US with me. Meanwhile, my career progressed from relocating with TCS to joining another company as a technical lead. In 2023, I joined the Japanese IT company, NTT Data, where I'm now an associate director. While I was able to transfer my H-1B visa between companies, it wasn't always a stress-free process. Because approvals aren't in your control, there's always a degree of uncertainty, which made it hard to fully relax. Chatterjee said the US has challenged him profession", "date_str": "2026-10-05T04:09:28+00:00", "hash": "3af8f9cda72e2e02", "title_fa": "بعد از 11 سال ویزای H-1B، هنوز دلم برای خانواده ام در خانه تنگ می شود. در اینجا دلیل ماندن من در ایالات متحده است.", "summary_fa": "آبرادیپ چاترجی و همسرش 11 سال پیش با هم به ایالات متحده نقل مکان کردند. او از آن زمان در یک H-1B بوده است. تیم ایوانز برای BI Abhradeep Chatterjee به مدت 11 سال با ویزای H-1B در ایالات متحده زندگی کرده است - عدم اطمینان بسیار سخت است. او بیش از یک دهه است که برای دیدن خانواده به هند نرفته است. با وجود همه اینها، چاترجی به دلیل فرصت هایی که برای او و خانواده اش دارد، ایالات متحده را انتخاب می کند. این مقاله گفته شده بر اساس گفتگو با آبرادیپ چاترجی، 37 ساله، یک تبعه هندی است که در مینه سوتا زندگی می کند. موارد زیر برای طول و وضوح ویرایش شده است. زمانی که در سال 2015 از هند به ایالات متحده آمدم، جوان و تازه ازدواج کرده بودم. فکر نمی کردم 11 سال بعد هنوز اینجا باشم. من آمدم تا فرصت رشد کنم. شرکت چندملیتی هندی که من در آن کار می‌کردم، خدمات مشاوره تاتا، مرا برای یک مأموریت به نیوجرسی فرستاد. من با ویزای H-1B به ساختن حرفه ای در ایالات متحده ادامه دادم، و این کشور مرا از نظر حرفه ای به گونه ای به چالش کشیده است که در هنگام ورود نمی توانستم تصورش را هم بکنم. اما همه اینها با ویزای موقت بوده است. عدم قطعیت دشوار بوده است. این داستان بخشی از مجموعه \"H-1B Fallout: 1 year later\" Business Insider است. بیشتر بخوانید پوشش ما در مورد اینکه چگونه تغییرات ویزای H-1B دولت ترامپ بر کارگران تأثیر می گذارد: فداکاری های پنهان تعقیب رویای H-1B در آمریکا سرزمین های جدید فرصت که من با بورسیه تحصیلی تنیس به ایالات متحده نقل مکان کردم. 8 سال بعد، اخراج H-1B مرا به خانه فرستاد. تماشا کنید: به دلیل هزینه 100 هزار دلاری از گرفتن ویزای H-1B منصرف شدم. اگر مطلبی برای"}, {"source": "Business Insider", "title": "Sam Altman said 'the world should accept some bad things happening' for the benefits of AI", "link": "https://www.businessinsider.com/sam-altman-says-ai-benefits-outweigh-some-bad-things-happening-2026-10", "summary": "OpenAI CEO Sam Altman told Decoded by POLITICO that he does not accept the really catastrophic risks of AI. Heather Diehl/Getty Images OpenAI's Sam Altman diverged from Anthropic's views, saying that we should embrace AI despite risks. Altman agrees with tougher AI regulations, but advocates for a \"lighter touch.\" He believes people will do \"orders of magnitude more good stuff than bad stuff\" with AI. OpenAI CEO Sam Altman said there was a fundamental difference in worldview between his company and rival Anthropic on artificial intelligence regulation, arguing in an exclusive interview with Decoded by POLITICO that the technology's benefits justify accepting some risks — and that AI should remain broadly accessible to the public. \"I think there's a lot of daylight,\" Altman told Decoded co-author and POLITICO senior tech reporter Brendan Bordelon. Asked specifically where he diverges from Anthropic and its CEO Dario Amodei, Altman said, \"we believe that the world should accept some bad things happening for the benefits of this technology and people having the agency.\" Anthropic has long been viewed as the strongest proponent of AI regulations within the industry, a stance that until recently was at odds with the lighter touch approach favored by OpenAI. But the policy differences between the two leading AI firms have narrowed in recent months, with OpenAI coming out in favor of tougher rules as it grapples with high-profile hacking incidents and rogue behavior by its models. Altman agreed with Amodei's call last month to slow the development of the most advanced AI models. His company has followed Anthropic in endorsing new state laws that impose stricter safety requirements than what the ChatGPT maker had previously supported — a shift from its prior state strategy . And OpenAI lobbyists recently endorsed a bipartisan House proposal that would require top AI companies to embed outside safety evaluators. Despite the convergence, Altman tried to distinguish his firm's regulatory stance from Anthropic's. \"I disagree, but I understand the perspective of people who are like, 'This technology is going to get so powerful, and it's so dangerous, that a single lab in San Francisco should have it and make sure nothing bad happens, and kind of figure out how to dole out the benefits,'\" said Altman. But he called it \"a completely unacceptable tradeoff\" that runs counter to the \"lighter touch regulatory stance\" backed by OpenAI. \"I wouldn't take a trade of saying like,", "date_str": "2026-10-04T21:01:01+00:00", "hash": "fc4ce5f5822da98b", "title_fa": "سام آلتمن می‌گوید «جهان باید اتفاقات بدی را بپذیرد» تا به نفع هوش مصنوعی باشد", "summary_fa": "سام آلتمن، مدیر عامل OpenAI به Decoded by POLITICO گفت که خطرات واقعا فاجعه آمیز هوش مصنوعی را نمی پذیرد. سام آلتمن از هدر دیهل/گتی ایماژز OpenAI از دیدگاه آنتروپیک جدا شد و گفت که ما باید هوش مصنوعی را با وجود خطرات در آغوش بگیریم. آلتمن با مقررات سخت‌تر هوش مصنوعی موافق است، اما از \"لمس سبک‌تر\" دفاع می‌کند. او بر این باور است که مردم با هوش مصنوعی « کارهای خوب را بیشتر از کارهای بد انجام می دهند». سام آلتمن، مدیر عامل OpenAI، گفت که بین شرکت او و رقیب Anthropic در مورد مقررات هوش مصنوعی تفاوت اساسی در جهان بینی وجود دارد و در مصاحبه ای اختصاصی با Decoded by POLITICO استدلال کرد که مزایای این فناوری پذیرش برخی از خطرات را توجیه می کند – و هوش مصنوعی باید به طور گسترده در دسترس عموم باشد. آلتمن به برندان بوردلون، یکی از نویسندگان Decoded و گزارشگر ارشد فناوری POLITICO گفت: «من فکر می‌کنم نور روز زیاد است. آلتمن در پاسخ به این سوال که به طور خاص با آنتروپیک و مدیر عامل آن داریو آمودی فاصله دارد، آلتمن گفت: \"ما معتقدیم که جهان باید اتفاقات بدی را بپذیرد که به نفع این فناوری و افرادی که آژانس دارند.\" مدت‌هاست که Anthropic به عنوان قوی‌ترین حامی مقررات هوش مصنوعی در صنعت تلقی می‌شود، موضعی که تا همین اواخر با رویکرد لمسی سبک‌تر مورد علاقه OpenAI در تضاد بود. اما تفاوت‌های سیاستی بین دو شرکت پیشرو هوش مصنوعی در ماه‌های اخیر کاهش یافته است و OpenAI از قوانین سخت‌تر حمایت می‌کند زیرا با حوادث هک پرمخاطب و رفتارهای سرکش مدل‌هایش دست و پنجه نرم می‌کند. آلتمن با فراخوان ماه گذشته آمودی برای کاهش سرعت توسعه پیشرفته ترین مدل های هوش مصنوعی موافقت کرد. شرکت او Anthropic را در تأیید قوانین ایالتی جدید که الزامات ایمنی سخت‌گیرانه‌تری را"}, {"source": "Business Insider", "title": "Meet David Robinson, the OpenAI safety leader who quit and warned that the company isn’t careful enough", "link": "https://www.businessinsider.com/david-robinson-the-openai-safety-leader-who-quit-the-company-2026-10", "summary": "David Robinson led safety transparency at OpenAI. Now he s speaking out against the company. Reuters David Robinson, formerly OpenAI's safety lead, has long been interested in rules around technology. Robinson quit OpenAI this week and said the AI giant is moving too fast without regard for safety. Robinson said he would now work from outside the company to strengthen safety incentives. David Robinson, a leader on OpenAI's Safety Systems team who quit the company this week, once had ambitions to bring philosophy to journalism. A Rhodes Scholar, Robinson graduated from Princeton in 2004 with a degree in philosophy. At Princeton, he led the school newspaper's opinion section. In a 2003 interview with the Daily Princetonian, Robinson said he wanted to be the kind of reporter who \"tells you what the facts are and then gets to the philosophical differences that explain the situation.\" Now, Robinson's name is in the headlines — and a notable byline. He left OpenAI, the same week three other safety researchers were fired , and issued a blistering essay for The Atlantic about what he said is OpenAI's inadequate approach to safety. \"I agree with other recently departed staff that the companies building this technology aren't being nearly careful enough,\" Robinson wrote in the essay. Neither Robinson nor the PR firm he said he hired responded to Business Insider's requests for comment. A review of his published essays, interviews, and books dating back to his days as an undergraduate paints a picture of a man deeply concerned with the impact of technology on humanity. \"All through my life, I've been fascinated by the rules that surround technology and how we decide when and how we're going to use it,\" he said in a 2022 interview on the Princeton Alumni Weekly podcast. From journalism to tech policy Robinson grew up in Potomac, M.D., an affluent suburb of Washington, D.C. As a child in the 1990s with a mild case of cerebral palsy, Robinson said his teachers created a new rule that allowed him to use a word processor in lieu of pen and paper. \"Ever since then, I've been interested in the social impacts of new digital technologies,\" he said in a UC Berkeley interview in 2021. During summers as an undergrad at Princeton, he interned at Time Magazine and The Wall Street Journal, according to his LinkedIn page. He told the Daily Princetonian in 2003 that after gaining experience as a reporter, he hoped to write for a literary magazine like The New Yorker or Harper's. Afte", "date_str": "2026-10-04T19:36:56+00:00", "hash": "e59e91e590b82a5f", "title_fa": "با دیوید رابینسون، رهبر ایمنی OpenAI که استعفا داد و هشدار داد که شرکت به اندازه کافی مراقب نیست آشنا شوید.", "summary_fa": "دیوید رابینسون شفافیت ایمنی را در OpenAI رهبری کرد. حالا او علیه شرکت صحبت می کند. رویترز دیوید رابینسون، رهبر سابق ایمنی OpenAI، مدتهاست به قوانین پیرامون فناوری علاقه مند بوده است. رابینسون این هفته از OpenAI خارج شد و گفت که غول هوش مصنوعی بدون توجه به ایمنی بسیار سریع حرکت می کند. رابینسون گفت که اکنون از خارج از شرکت برای تقویت انگیزه های ایمنی کار خواهد کرد. دیوید رابینسون، رهبر تیم سیستم‌های ایمنی OpenAI که این هفته شرکت را ترک کرد، زمانی آرزو داشت که فلسفه را به روزنامه‌نگاری بیاورد. رابینسون که یک محقق رودز بود، در سال 2004 با مدرک فلسفه از پرینستون فارغ التحصیل شد. در پرینستون، او بخش نظرات روزنامه مدرسه را رهبری کرد. رابینسون در مصاحبه‌ای در سال 2003 با روزنامه دیلی پرینستونین گفت که می‌خواست خبرنگاری باشد که به شما بگوید حقایق چیست و سپس به تفاوت‌های فلسفی که وضعیت را توضیح می‌دهد، بپردازد. در حال حاضر، نام رابینسون در سرفصل ها - و یک خط فرعی قابل توجه است. او OpenAI را ترک کرد، در همان هفته ای که سه محقق ایمنی دیگر اخراج شدند، و مقاله ای تاول برانگیز برای The Atlantic درباره آنچه به گفته او رویکرد ناکافی OpenAI به ایمنی است، منتشر کرد. رابینسون در این مقاله نوشت: \"من با سایر کارکنان اخیراً جدا شده موافقم که شرکت های سازنده این فناوری تقریباً به اندازه کافی مراقب نیستند.\" نه رابینسون و نه شرکت روابط عمومی که او گفته است به درخواست‌های Business Insider برای اظهار نظر پاسخ ندادند. مروری بر مقالات، مصاحبه‌ها و کتاب‌های منتشر شده او که به دوران کارشناسی‌اش بازمی‌گردد، تصویری از مردی به تصویر می‌کشد که عمیقاً نگران تأثیر فناوری بر بشریت است. او در مصاحبه ای در سال 2022 در پادکست هفتگی فارغ التحصیلان پرینستون گفت: «در تمام طول زندگی، من مجذوب قوانینی بودم"}, {"source": "Business Insider", "title": "In Connecticut, my husband and I mostly talked logistics. In Spain, we started dating each other again.", "link": "https://www.businessinsider.com/moved-family-spain-marriage-closer-couple-2026-10", "summary": "The author and her family moved from the US to Spain. Courtesy of the author We sold our house in Connecticut and got rid of most of our belongings before moving abroad. Starting over in Spain brought plenty of stress and uncertainty. Depending on each other through it has ultimately strengthened our relationship. One year ago, my husband left his 18-year teaching career behind, we sold our house, got rid of 95% of our belongings, and moved our family from Connecticut to Madrid. These days, we live in a small flat with our 7 and 10-year-old boys. We don't own a car. We're learning Spanish one day at a time. On paper, that much upheaval could've broken us. Instead, it's brought us closer than ever. We were coexisting, not connecting Back in the US, my husband Jeff and I were coexisting more than connecting. Most conversations revolved around logistics : who was taking which kid to which activity, what meeting we needed to attend, and what to make for dinner. By the time the boys were in bed, we were too spent to connect meaningfully. We'd sit beside one another, exhausted, on our phones or trying to watch a movie we never finished because one of us always fell asleep. The author says in the US, she and her spouse weren t connecting. Courtesy of the author I never imagined that would be our marriage. Yet, there we were. Moving to Spain made us reevaluate things Here in Spain, we're still busy. Arguably busier. We spend about three hours a day getting the kids to and from school via train and bus. But we're also spending far more time together than before — and it's given us more opportunities to connect beyond logistics. Part of what's driven this connection, too, is watching the locals go about their day around us. \"Busy\" doesn't mean the same thing here as it does in the US. It's not a reason to delay the connection. People stop for each other mid-errand, midday, without apologizing. They make the time. We started doing the same. Stopping for an unplanned coffee or a caña. Exploring a new neighborhood hand-in-hand just because. Taking a few extra minutes for us instead of rushing on to the to-do. It's made more of a difference than I expected. You don't have to move abroad to do this, of course. You just have to decide that the list can wait. Going through the unknown together It's just the four of us now. We need each other in a way we didn't before (and that's not automatically a good thing). Being each other's only support can bring out the best in a ma", "date_str": "2026-10-04T18:38:01+00:00", "hash": "83deb384152a1253", "title_fa": "در کانکتیکات، من و شوهرم بیشتر در مورد تدارکات صحبت می کردیم. در اسپانیا دوباره با هم قرار گذاشتیم.", "summary_fa": "نویسنده و خانواده اش از ایالات متحده به اسپانیا نقل مکان کردند. با حسن نیت از نویسنده ما خانه خود را در کانکتیکات فروختیم و قبل از نقل مکان به خارج از کشور از شر بسیاری از وسایل خود خلاص شدیم. شروع دوباره در اسپانیا استرس و عدم اطمینان زیادی را به همراه داشت. وابستگی به یکدیگر از طریق آن در نهایت باعث تقویت روابط ما شده است. یک سال پیش، شوهرم 18 سال سابقه تدریس را پشت سر گذاشت، خانه‌مان را فروختیم، 95 درصد از وسایلمان را خلاص کردیم و خانواده‌مان را از کانکتیکات به مادرید نقل مکان کردیم. این روزها با پسرهای 7 و 10 ساله خود در یک آپارتمان کوچک زندگی می کنیم. ما ماشین نداریم ما یک روز در حال یادگیری اسپانیایی هستیم. روی کاغذ، این همه آشوب می توانست ما را در هم بکوبد. در عوض، ما را بیشتر از همیشه به هم نزدیک کرده است. ما در حال همزیستی بودیم، نه با هم در ایالات متحده ارتباط برقرار می‌کردیم، من و شوهرم جف بیشتر از ارتباط با هم همزیستی داشتیم. بیشتر گفتگوها حول محور تدارکات بود: چه کسی کدام بچه را به کدام فعالیت می برد، در چه جلسه ای باید شرکت کنیم، و چه چیزی برای شام درست کنیم. تا زمانی که پسرها در رختخواب بودند، ما آنقدر خرج شده بودیم که نمی‌توانستیم ارتباط معناداری برقرار کنیم. ما خسته کنار هم می‌نشستیم، پشت تلفن‌مان می‌نشینیم یا سعی می‌کردیم فیلمی را تماشا کنیم که هیچ‌وقت تمامش نکردیم، زیرا یکی از ما همیشه می‌خوابید. نویسنده می گوید در ایالات متحده، او و همسرش با هم ارتباط نداشتند. با احترام نویسنده هرگز تصور نمی کردم که این ازدواج ما باشد. با این حال، ما آنجا بودیم. نقل مکان به اسپانیا باعث شد که همه چیز را دوباره ارزیابی کنیم اینجا در اسپانیا، ما هنوز مشغول هستیم."}, {"source": "Business Insider", "title": "Lina Khan says AI companies are following the same playbook that got Big Tech into trouble", "link": "https://www.businessinsider.com/lina-khan-says-ai-companies-shouldnt-follow-big-tech-playbook-2026-10", "summary": "Former Federal Trade Commission Chair Lina Khan said the AI industry shouldn t self-regulate. Alexi J. Rosenfeld/Getty Images Former FTC chair Lina Khan doesn't believe AI companies can effectively self-regulate. She referenced Big Tech's attempt with social media, calling it \"a proven failure.\" The Trump administration isn't keen on implementing federal-level guardrails. Lina Khan has some advice for AI companies attempting to self-regulate the advancing tech. The former Federal Trade Commission chair said doing so would be a fool's errand during an interview on ABC's \"This Week.\" \"We've seen that self-regulation efforts by Big Tech have been a proven failure,\" Khan said on Sunday. \"We need to remember what happened a decade ago.\" She referenced Big Tech companies that tried to self-regulate in the early days of social media. \"We've seen just innumerable harms come from the unchecked nomination of these Big Tech companies, and so now, as we face new horizons with these advanced AI systems, it would be an enormous mistake to repeat that playbook,\" Khan said. Since OpenAI launched ChatGPT in 2022, major players in the tech industry have become caught in a global race to develop their own systems. Companies like Microsoft, Google, and Meta have invested heavily in their products in hopes of dominating the global market. However, the speed of AI advancement has prompted calls from politicians, advocates, and even some tech leaders for guardrails. Anthropic CEO Dario Amodei called on his industry peers to pace the development of frontier AI systems last month. In a blog post, he said the \"most effective\" method would involve regulation that targets US frontier AI companies. 00 feet (just over a mile high), Idyllwild feels like a real escape from the big city while still being close enough for a quick overnight or an extended stay. The town feels wonderfully old-school Cute mom-and-pop shops line the streets of Idyllwild. Mar Yvette Downtown Idyllwild is small enough to explore on foot, with woodsy architecture, independent shops and restaurants, and easy parking all around. At night, the town cab get very quiet except for the sounds of wildlife that add to the feeling of being close to nature. Over the years, we've stayed in little local lodges, inns, B Bs, family-owned cabins, and whole-home rentals. Most of them have been within walking distance of downtown. It s easy to find parking downtown, and many lodgings are within walking distance. Mar Yvette Even though some spots have come and gone, it still feels like the same charming village , especially since you won't find major chain businesses, fast-food joints, or strip malls. The town's local grocery stores are also independent, so if you need a big-box store, you'll have to drive back down the mountain. There's enough to do without feeling like you need an itinerary We ve caught live performances from musicians like Keith McCabe at Taryn s Place. Mar Yvette Idyllwild is isolated, but it isn't boring. I've enjoyed arts and crafts, gardening lectures, wine tastings , holiday festiv", "date_str": "2026-10-04T17:34:01+00:00", "hash": "a3e3b80d03b32519", "title_fa": "مکان مورد علاقه من در کالیفرنیا یک شهر کوهستانی کوچک است که در هر فصل ارزش دیدن دارد - همچنین شهردار آن یک سگ است.", "summary_fa": "من سعی می کنم هر زمان که از شهر کوهستانی Idyllwild بازدید می کنم، شهردار مکس را ببینم. Mar Yvette یکی از فرارهای مورد علاقه من از لس آنجلس، شهر کوهستانی روستایی و بدون شلوغی Idyllwild است. جامعه کوچک منزوی است اما در طول سال چیزهای زیادی برای دیدن و انجام دادن ارائه می دهد. این مکان یک استراحت آرام را ارائه می دهد که در آن می توانید در طبیعت غوطه ور شوید و با یک سگ مشهور محلی ملاقات کنید. یکی n I turned 40, I started to think more and more about the distance between me and my dads. Soon after, I moved home and a year later, I'm still happy with that decision. When I think back to how my life looked this time last year, I can't help but laugh out loud. Last August, I was sipping cocktails by the pool at White City House with London illuminated in the background, wondering if I was ready to let this life go. I was chatting to a friend-of-a-friend, a woman around my age, who was aghast at the idea that I was abandoning my life in the British capital to move halfway across the world to live with my two dads in Denver. So much so that her perfectly manicured hand almost dropped her spicy margarita when I told her the news. She wasn't alone. Most people were flummoxed as to why I would swap a charming flat in the heart of Marylebone and a thriving social calendar to live in our family house smack dab in the middle of America. The author (left) pictured with her dad and step-dad after returning home to Colorado to be closer to them. Courtesy of Jen Kaarlo, By many definitions, you could say I had made it I left the Mile High City over two decades ago and called Miami, NYC, and London home for varying lengths of time. I had a stacked résumé and traveled to over 50 countries, many of them solo. Though none of that seemed to matter as much after I turned 40. What mattered most to me was that I didn't want to take time with my family for granted. As an expat , I always find myself coming back to a cost-to-closeness ratio. Many moons ago, I was having dinner with a new friend I'd been introduced to through mutual friends in Paris. Over escargots and red wine, he told me all about the glamorous adventures he had embarked upon, seemingly plucked right from the scenes of \"The Devil Wears Prada.\" What stuck out to me all these years later is not how he knew every designer under the sun, but how he spoke about the calculations behind his trips back to the States. He su       media: [{"source": "Billboard", "title": "Natanael Cano Talks His ‘Tupac, DMX, Chalino Sánchez Flow’ and Says ‘Mexico Never Lets Me Down’", "link": "https://www.billboard.com/music/latin/natanael-cano-vol-1-album-mexico-tour-video-interview-1236354054/", "summary": "Minutes before taking the stage at Mexico City’s Estadio GNP Seguros on Sept. 18, Natanael Cano was already in full corridos tumbados rockstar mode: cowboy hat, snakeskin jacket, chest on full display and the attitude of someone who knows exactly what he represents. “I’m looking fresh as hell — I’ve got that Tupac, DMX, Chalino Sánchez, Natanael Cano kind of flow,” he told Billboard Español , explaining with his charm the inspiration behind his look. Related Natanael Cano Brings Corridos Tumbados to the Big Leagues: 5 Best Moments From His Mexico Stadium Vol. 1 Tour Kickoff Fans Choose Victoria Monét s Frequency of Love as This Week s Favorite New Music Shakira s Madrid Concert Sets an Amazon Music Livestreaming Record The image — a mix of norteño tradition, hip-hop bravado and irreverence — also captures Cano’s identity as one of the central figures in the movement that helped take corridos tumbados from regional circuits to Mexico’s and the U.S.’ biggest stages. The interview took place shortly before Cano launched his first stadium tour across Mexico with two consecutive sold-out shows at the capital s Estadio GNP Seguros. When asked how his U.S. visa situation had influenced — or affected — this new chapter of his career, the singer made clear that he did not feel limited by it. “Mexico never lets me down. Mexico always supports me and is always behind me,” he said. “And that’s something I can never thank the fans enough for.” Cano also spoke about “Olivia La Flaca,” his latest collaboration with Tito Double P, Ovi and Víctor Mendívil. The trap-leaning single arrived Sept. 24. “All the homies on that song killed it, for real,” said the Rancho Humilde star. “It’s really dope, a song for all the fans — it goes hard. Pure happiness, pure peace.” One of the most personal songs on his new album, Natanael Cano, Vol. 1 , is “Mar Azul,” which the artist called his favorite. The song has been rumored to be about his ex. When asked what it means to him, Cano replied knowingly: “You know what it means.” He added, “I think everybody knows too.” “Mar Azul” peaked at No. 7 on Billboard ’s Mexico Songs chart, No. 26 on Hot Latin Songs and No. 22 on Regional Mexican Airplay. The album debuted at No. 4 on Top Regional Mexican Albums and No. 10 on Top Latin Albums. Its 15 tracks represent a new chapter for Cano after he experimented with trap, reggaetón and afrobeat on 2025’s Porque La Demora . Beyond the hits, Cano said he wants his fans to take away a message of perse", "date_str": "2026-10-05T14:08:53+00:00", "hash": "ef8bb57abed77270", "title_fa": "ناتانائل کانو با «Tupac، DMX، Chalino Sánchez Flow» خود صحبت می‌کند و می‌گوید «مکزیک هرگز مرا ناامید نمی‌کند»", "summary_fa": "دقایقی قبل از روی صحنه رفتن در Estadio GNP Seguros مکزیکو سیتی در 18 سپتامبر، ناتانائل کانو قبلاً در حالت استار کامل کوریدوس تومبادو بود: کلاه گاوچران، ژاکت پوست مار، سینه به نمایش درآمده و نگرش شخصی که دقیقاً می داند او چه چیزی را نمایندگی می کند. او به Billboard Español گفت: «من مثل جهنم سرحال به نظر می‌رسم - من توپاک، DMX، چالینو سانچز، ناتانائل کانو را دارم. مرتبط Natanael Cano Brings Corridos Tumbados to Big Leagues: 5 Best Moments From His Mexico Stadium Vol. 1. طرفداران شروع تور، فرکانس عشق ویکتوریا مونه را به عنوان موسیقی جدید مورد علاقه این هفته انتخاب می کنند کنسرت شکیرا در مادرید یک رکورد پخش زنده موسیقی آمازون را تنظیم می کند این تصویر - ترکیبی از سنت نورتنیو، جسارت هیپ هاپ و بی حرمتی - همچنین هویت کانو را به عنوان یکی از جنبش های مرکزی به حرکت در می آورد که به کمک آن می توان به حرکت های محوری تومبا کمک کرد. بزرگترین مراحل مکزیک و ایالات متحده این مصاحبه اندکی قبل از اینکه کانو اولین تور استادیوم خود را در سراسر مکزیک با دو نمایش متوالی فروخته شده در استادیوم GNP Seguros در پایتخت برگزار کند، انجام شد. وقتی از او پرسیده شد که وضعیت ویزای ایالات متحده او چگونه بر این فصل جدید از حرفه او تأثیر گذاشته یا تأثیر گذاشته است، خواننده روشن کرد که احساس نمی کند تحت این شرایط محدودیت دارد. او گفت: \"مکزیک هرگز من را ناامید نمی کند. مکزیک همیشه از من حمایت می کند و همیشه پشت من است.\" و این چیزی است که من هرگز نمی توانم به اندازه کافی برای آن از هواداران تشکر کنم. کانو همچنین درباره «اولیویا لا فلکا»، آخرین همکاری خود با تیتو دابل پی، اوی و ویکتور مندیویل صحبت کرد. تک‌آهنگ متمایل به تله"}, {"source": "Billboard", "title": "Phoebe Bridgers (and Nine of Her Collaborators) Talk Injecting ‘Fresh Blood’ Into Her ‘Lost Weekend’ Album’s Sound", "link": "https://www.billboard.com/music/rock/phoebe-bridgers-lost-weekend-collaborators-oral-history-1236352042/", "summary": "Six years passed between Phoebe Bridgers ’ second and third solo albums, but it was hardly time off. Between 2020’s Punisher — her major breakthrough, which yielded her a best new artist Grammy nomination — and 2026’s Lost Weekend , the singer-songwriter, with Lucy Dacus and Julien Baker, dropped The Record , their Grammy-nominated debut album as boygenius; toured as a solo artist, with boygenius and as an opener on nearly a dozen Eras Tour dates with Taylor Swift; launched Saddest Factory Records as an imprint of her label, Dead Oceans (which ultimately absorbed Saddest Factory in June); and filmed her acting debut in Lance Oppenheim’s recently released Primetime . Amid all those professional milestones, Bridgers also ended a high-profile relationship with actor Paul Mescal; lost her father, Tony Bridgers; and started dating comedian Bo Burnham. That deep well of experiences informed the songs that would become Lost Weekend . While some ideas on the album date back as far as 2022, Bridgers began writing and recording for the project in earnest in 2024. Though her first two albums were mostly made with producers Tony Berg and Ethan Gruska at Sound City Studios in Van Nuys, Calif., Bridgers added to her recording locations this time around — visiting Electric Lady Studios in New York and Tamarind in Los Angeles — and her production team, bringing on perennial Grammy favorite Jack Antonoff for the first time, with additional work from Alex G. With more musicians in tow as well, Bridgers stretched her predominantly rock sound to new melodic territory, from ambient electronic to driving country. Related Every Moment Is Massive and Magnificent : Noah Kahan Reflects on a Monumental Year — And Eyes a Grammys Breakthrough What Does the Big Change to the Best New Artist Grammy Mean for Nominees? Fans Choose Victoria Monét s Frequency of Love as This Week s Favorite New Music Bridgers first shared the new material in May at a club in New Mexico, kicking off a series of phone-free, secret pop-up shows at smaller venues across the country that culminated with Madison Square Garden in New York on June 4. Upon announcing Lost Weekend ’s August arrival later that month, she logged back-to-back appearances on The Tonight Show Starring Jimmy Fallon in July, playing new single “Lost Boys” each time, first with a rock band of children and the next night an acoustic rendition with veteran musicians. Bridgers capped off the unorthodox rollout by hosting worldwide release-week ", "date_str": "2026-10-05T14:00:00+00:00", "hash": "55dfd4bf2ecc0c8e", "title_fa": "فیبی بریجرز (و نه نفر از همکارانش) صحبت می کنند و \"خون تازه\" را به صدای آلبوم \"آخر هفته گمشده\" خود تزریق می کنند.", "summary_fa": "شش سال بین دومین و سومین آلبوم انفرادی فیبی بریجرز گذشت، اما به سختی زمان استراحت بود. بین Punisher 2020 - موفقیت بزرگ او، که برای او نامزدی جایزه گرمی بهترین هنرمند جدید را به همراه داشت - و Lost Weekend در سال 2026، خواننده و ترانه سرا، به همراه لوسی داکوس و جولین بیکر، The Record، اولین آلبوم نامزد گرمی خود را به عنوان پسر بچه منتشر کردند. تور به عنوان یک هنرمند انفرادی، با پسر بچه و به عنوان بازکننده در نزدیک به دوازده تاریخ تور Eras با تیلور سویفت. Saddest Factory Records را به عنوان اثری از برچسب خود، Dead Oceans (که در نهایت Saddest Factory را در ژوئن جذب کرد) راه اندازی کرد. و اولین بازیگری خود را در پرایم تایم اخیراً منتشر شده توسط لنس اوپنهایم فیلمبرداری کرد. در میان تمام آن نقاط عطف حرفه ای، بریجرز همچنین به یک رابطه با مشخصات بالا با بازیگر پل مسکال پایان داد. پدرش تونی بریجرز را از دست داد. و با کمدین بو برنهام آشنا شد. آن چاه عمیق تجربیات آهنگ هایی را که به آخر هفته گمشده تبدیل می شدند، خبر داد. در حالی که برخی از ایده های این آلبوم به سال 2022 بازمی گردد، بریجرز شروع به نوشتن و ضبط برای این پروژه به طور جدی در سال 2024 کرد. اگرچه دو آلبوم اول او بیشتر با تهیه‌کنندگان تونی برگ و اتان گروسکا در استودیوی ساوند سیتی در ون نایز، کالیفرنیا ساخته شد، بریجرز این بار به مکان‌های ضبط خود اضافه کرد - بازدید از استودیوی Electric Lady در نیویورک و Tamarind در لس آنجلس - و تیم سازنده‌اش، و برای اولین بار گرمی بیشتر از زمان مورد علاقه الکس آنتون با جک آنتون، بار دیگر گرمی را به همراه آورد. با تعداد بیشتری از نوازندگان، بریجرز صدای راک خود را به قلمرو ملودیک"}, {"source": "Billboard", "title": "Wisin Signs With WME in All Areas: ‘I’m Ready to Expand Beyond Music’", "link": "https://www.billboard.com/pro/wisin-signs-wme-all-areas/", "summary": "WME has signed Wisin for representation in all areas, Billboard can exclusively announce Monday (Oct. 5). “I’m joining WME at an exciting new chapter in my career,” the Puerto Rican artist tells Billboard . “I’m thrilled that the team understands my evolving vision and is fully on board. After helping shape the global sound and impact of reggaeton, I’m ready to expand beyond music and connect with new audiences, markets, and opportunities around the world.” Related Wisin Launches Universidad del Perreo Signs New Management: The Music Speaks Hilary Duff to Receive Outstanding Pop Tour of the Year Award at 2026 Billboard Live Music Summit Judge Rules Woman Accused of Shooting at Rihanna A$AP Rocky s Home Mentally Fit to Stand Trial The news comes on the heels of Wisin (real name: Juan Luis Morera Luna) announcing his new management deal with Chris Duque of D27 Entertainment last month, following almost a decade under the direction of his former manager Walter Kolm . With a career that kicked off almost three decades ago as part of reggaetón duo Wisin y Yandel , Wisin, under his solo trajectory, has achieved multiple Billboard chart entries, including 24 No. 1s on Latin Airplay. In 2016, “Duele El Corazón,” his collaboration with Enrique Iglesias , topped Latin Airplay for 11 weeks and Hot Latin Songs for 14 weeks. As one of the urban genre’s biggest exponents and hitmakers, Wisin recently released his album La Universidad del Perreo , bringing together pioneers like Ivy Queen, Don Chezina, Jory Boy, Jowell Randy, Trébol Clan, Franco El Gorilla and Juanka El Problematik, as well as breakout stars like Mexican artist El Bogueto and Colombian artist Kapo. “Wisin helped build the sound of reggaetón, and he’s still pushing it forward, Rob Markus , Senior Partner Head of International at WME, adds. With La Universidad del Perreo, he’s not only delivering new music but also bringing the culture to a new generation. We couldn’t be more excited to partner with him and Chris Duque for this next chapter.” “If people out there are talking about salsa, the history of merengue, tropical music, the history of bolero, I think they also have to talk about the history of an established movement. A movement that continues to be talked about and where new stars keep being born,” Wisin previously told Billboard . “It’s a project where we return to the original sound, the sound that started it all and opened so many doors.”", "date_str": "2026-10-05T14:00:00+00:00", "hash": "70f11d30c112de73", "title_fa": "Wisin با WME در همه زمینه ها امضا می کند: \"من آماده هستم تا فراتر از موسیقی گسترش پیدا کنم\"", "summary_fa": "WME Wisin را برای نمایندگی در همه زمینه ها امضا کرده است، بیلبورد می تواند به طور انحصاری روز دوشنبه (5 اکتبر) اعلام کند. این هنرمند پورتوریکویی به بیلبورد می‌گوید: «من در یک فصل جدید هیجان‌انگیز در حرفه‌ام به WME می‌پیوندم. \"من هیجان زده هستم که تیم دیدگاه در حال تحول من را درک می کند و کاملاً در جریان است. پس از کمک به شکل دادن به صدای جهانی و تأثیر رگیتون، من آماده هستم تا فراتر از موسیقی گسترش پیدا کنم و با مخاطبان، بازارها و فرصت های جدید در سراسر جهان ارتباط برقرار کنم.\" Wisin مرتبط راه اندازی دانشگاه دل پریو امضا مدیریت جدید: موسیقی صحبت می کند هیلاری داف جایزه بهترین تور پاپ سال را در سال 2026 در اجلاس موسیقی زنده بیلبورد دریافت می کند قاضی حکم می دهد زن متهم به تیراندازی به ریانا A$AP راکی در خانه است. Morera Luna) قرارداد مدیریتی جدید خود را با کریس دوک از D27 Entertainment ماه گذشته، پس از تقریباً یک دهه تحت هدایت مدیر سابق خود، والتر کلم، اعلام کرد. ویسین با فعالیتی که تقریباً سه دهه پیش به عنوان بخشی از گروه دوتایی رگیتون Wisin y Yandel آغاز شد، تحت خط سیر انفرادی خود، به چندین ورودی نمودار بیلبورد، از جمله 24 شماره 1 در لاتین ایرپلی، دست یافت. در سال 2016، \"Duele El Corazón\"، همکاری او با انریکه ایگلسیاس، به مدت 11 هفته در صدر پخش لاتین و برای 14 هفته در آهنگ های لاتین داغ قرار گرفت. ویسین به‌عنوان یکی از بزرگ‌ترین بازیگران و سازنده‌های ژانر شهری، اخیراً آلبوم خود را به نام La Universidad del Perreo منتشر کرد که پیشگامانی مانند آیوی کویین، دون چزینا، جوری بوی، جوول رندی، تربول کلن، فرانکو ال گوریلا و خوانکا ال مشکل‌تیک، و همچنین ستارگان برجسته‌ای مانند بوگ کاتوپو و هنرمند مکزیکی الومب را گرد هم"}, {"source": "Billboard", "title": "Music Business Headlines You Need to Know: Warner, ADA, Estates & AI | Billboard On the Record News", "link": "https://www.billboard.com/video/music-business-headlines-you-need-to-know-on-the-record/", "summary": "From Warner Music executive shakeups to Dolly Parton’s inheritance, streaming fraud and big AI news from Suno Music and Eleven Labs, September shaped up to be a busy month in the music industry. On this special bonus episode of Billboard On The Record, host Kristin Robinson sits down with Billboard executive editor of business Dan Rys to break down some of the month’s biggest headlines. Love what you hear? Don’t forget to rate, review and subscribe so you never miss an episode of Billboard On The Record. Follow Billboard On The Record on Instagram, TikTok, Apple Podcasts, Spotify and Youtube @billboard so you never miss an episode. Billboard On The Record is a podcast in partnership with SickBird Productions. Host: Kristin Robinson Executive Producers: Diona DaCosta Jade Watson Produced By: Kayla Forman Mateo Vergara Edited By: Rachel Derbyshire Kristin Robinson: Hello, and welcome to On the Record, a music business podcast from Billboard and SickBird Productions. As always, I m your host, Kristin Robinson, and today we are doing our first ever monthly news update episode. While we love doing our episodes every single week where we basically invite in a top executive or artist or other creative to come in and talk to us about a specific topic in the music industry, I really wanted to make sure that we were doing more to let you guy know about the headlines that are coming in Billboard.com every single week. So I am now going to be doing this at the top of every month. We re going to invite on one of my colleagues to come and talk shop with me. And for this first edition, we are joined by the lovely executive editor of business, Dan Rys. Hey, Dan. How are you? Dan Rys: I m all right. How are you? Kristin Robinson: I m good. I m good. All right. Are you ready to get started? Dan Rys: Let s do it. Kristin Robinson: OK. So I m going to read off a headline, and then we re going to talk through it, um, and all the stuff that you guys need to know about it. So our first headline is, Val Blavatnik named to Warner Music Group executive team. Elliot Grainge named chair of ADA. OK, Dan, you were the one who reported on this one. Can you tell us a little bit more about why this headline matters? Watch the full video above!", "date_str": "2026-10-05T13:47:12+00:00", "hash": "944833dac3ffa815", "title_fa": "سرفصل های کسب و کار موسیقی که باید بدانید: Warner، ADA، Estates و AI | بیلبورد در رکورد اخبار", "summary_fa": "از تغییرات اجرایی Warner Music گرفته تا میراث دالی پارتون، جریان کلاهبرداری و اخبار بزرگ هوش مصنوعی از Suno Music و Eleven Labs، سپتامبر به ماه شلوغی در صنعت موسیقی تبدیل شد. در این قسمت جایزه ویژه Billboard On The Record، کریستین رابینسون مجری برنامه با دن رایس سردبیر اجرایی بیلبورد می نشیند تا برخی از بزرگترین عناوین ماه را بشکند. عاشق آنچه می شنوید؟ فراموش نکنید که امتیاز دهید، مرور کنید و مشترک شوید تا هرگز قسمتی از Billboard On The Record را از دست ندهید. Billboard On The Record را در اینستاگرام، TikTok، Apple Podcasts، Spotify و Youtube @billboard دنبال کنید تا هرگز قسمتی را از دست ندهید. Billboard On The Record یک پادکست با همکاری SickBird Productions است. مجری: کریستین رابینسون تهیه کنندگان اجرایی: دیونا داکوستا جید واتسون تهیه کننده: کایلا فورمن متئو ورگارا ویرایش: ریچل دربی شایر کریستین رابینسون: سلام، و به On the Record، یک پادکست تجاری موسیقی از Billboard و SickBird Productions خوش آمدید. مثل همیشه، من میزبان شما، کریستین رابینسون هستم، و امروز اولین قسمت به روز رسانی اخبار ماهانه خود را انجام می دهیم. در حالی که ما دوست داریم هر هفته اپیزودهایمان را انجام دهیم، جایی که اساساً از یک مدیر ارشد یا هنرمند یا خلاق دیگر دعوت می‌کنیم تا در مورد موضوع خاصی در صنعت موسیقی با ما صحبت کنند، من واقعاً می‌خواستم مطمئن شوم که کارهای بیشتری انجام می‌دهیم تا شما را از سرفصل‌هایی که هر هفته در Billboard.com می‌آیند مطلع کنیم. بنابراین من اکنون این کار را در بالای هر ماه انجام خواهم داد. قرار است از یکی از همکارانم دعوت کنیم که بیاید و با من صحبت کند. و برای این نسخه اول، ویرایشگر اجرایی دوست داشتنی تجارت، دن ریس، به ما ملحق شده است. هی، دن چطوری؟ دن رایس: من خوبم. چطوری؟ کریستین رابینسون: من خوبم."}, {"source": "Billboard", "title": "Fuerza Regida to Receive the Billboard Vanguard Award at the 2026 Billboard Latin Music Awards", "link": "https://www.billboard.com/music/latin/fuerza-regida-billboard-vanguard-award-2026-latin-awards-1236353935/", "summary": "Fuerza Regida will be honored with the Billboard Vanguard Award at the 2026 Billboard Latin Music Awards, Billboard and Telemundo can announce today (Oct. 5). The group from San Bernardino, California, will receive the award in recognition of a career defined by innovation and an unconventional creative vision that has pushed the boundaries of música mexicana and expanded the genre’s reach around the world. Related Rosalía to Receive Billboard Hall of Fame Award at the 2026 Billboard Latin Music Awards Rubén Blades to Receive Icon Award at 2026 Billboard Latin Music Awards: No One Succeeds Without Help Tito Double P, Ozuna, Pablo Alborán, Kapo More to Perform at 2026 Billboard Latin Music Awards The band, a finalist for 12 awards this year, will also take the stage for a special performance during the ceremony, which will be broadcast live on Thursday, Oct. 22 at 8 p.m. ET on Telemundo and Peacock from the James L. Knight Center in Miami. “We’ve always done things our own way. We come from San Bernardino, we know who we are and where we come from, and we’ve never been afraid to take our music somewhere people might not expect it to go, Jesús Ortiz Paz (JOP), vocalist and leader of Fuerza Regida, said in a statement. Receiving the Billboard Vanguard Award means a lot because it recognizes that vision and everything we’ve built together. We want to keep pushing the genre forward, breaking barriers and showing the next generation that there are no limits to where our music can go.” The Billboard Vanguard Award honors artists who dare to go beyond the conventional. It recognizes those who, through their talent, inspire, innovate and open new possibilities in the world of music. The award celebrates true visionaries, artists who break barriers, redefine standards and leave an indelible mark on the music industry. Formed in 2015, Fuerza Regida has become one of the most influential acts in Mexican music, honoring its roots while continuing to take the genre into new territories. The group — which also includes José “Pelón” García, Moisés López, Khrystian Ramos and Samuel Jaimez — has developed a unique sound and identity rooted in their bicultural experience, resonating with audiences far beyond the traditional boundaries of the genre and geography. With over 46 million monthly listeners on Spotify, 35 billion career streams and 16 entries on the Billboard Hot 100 , Fuerza Regida has transformed that vision into a global impact. Their hits include Marlboro Rojo,", "date_str": "2026-10-05T13:45:00+00:00", "hash": "b95383a23f791583", "title_fa": "Fuerza Regida جایزه بیلبورد پیشتاز را در جوایز موسیقی لاتین بیلبورد 2026 دریافت می کند", "summary_fa": "Fuerza Regida در جوایز موسیقی لاتین Billboard 2026 با جایزه Billboard Vanguard Award مفتخر خواهد شد، Billboard و Telemundo می توانند امروز (5 اکتبر) اعلام کنند. این گروه از سن برناردینو، کالیفرنیا، این جایزه را به‌عنوان قدردانی از حرفه‌ای که با نوآوری و دیدگاه خلاقانه غیرمتعارف تعریف شده است، دریافت می‌کند که مرزهای موسیقی مکزیکا را جابجا کرده و دامنه این ژانر را در سراسر جهان گسترش داده است. روزالیا مرتبط برای دریافت جایزه تالار مشاهیر بیلبورد در جوایز موسیقی لاتین بیلبورد 2026 روبن بلیدز برای دریافت جایزه آیکون در جوایز موسیقی لاتین بیلبورد در سال 2026: هیچ کس بدون کمک Tito Double P، Ozuna، Pablo Alborán، Kapo More برای اجرا در جشنواره موسیقی لاتین 20 جایزه 6 را دریافت کرد. امسال نیز برای اجرای ویژه در این مراسم روی صحنه می رود که پنجشنبه 22 مهر ساعت 20 به صورت زنده پخش می شود. ET در Telemundo و Peacock از مرکز James L. Knight در میامی. خسوس اورتیز پاز (JOP)، خواننده و رهبر Fuerza Regida، در بیانیه‌ای گفت: \"ما از سن برناردینو می‌آییم، می‌دانیم کی هستیم و از کجا آمده‌ایم، و هرگز ترسی نداشتیم که موسیقی‌مان را به جایی ببریم که مردم انتظار رفتن آن را نداشته باشند. ما می‌خواهیم به جلو بردن ژانر ادامه دهیم، موانع را بشکنیم و به نسل بعدی نشان دهیم که هیچ محدودیتی برای رسیدن به موسیقی ما وجود ندارد.» جایزه پیشتاز بیلبورد به هنرمندانی تجلیل می‌کند که جرات فراتر رفتن از حد معمول را دارند. کسانی که از طریق استعداد خود، الهام بخش، نوآوری و گشودن امکانات جدید در دنیای موسیقی هستند را می شناسد. این جایزه از بینندگان واقعی تجلیل می کند، هنرمندانی که موانع را می شکنند، استانداردها را دوباره تعریف می کنند و اثری پاک نشدنی در صنعت موسیقی بر جای می گذارند. Fuerza Regida که در سال 2015 شکل"}, {"source": "Billboard", "title": "Chance the Rapper Says He’s Thinking About Chopping His Stage Name In Half: ‘I Just Really Love the Art Form’", "link": "https://www.billboard.com/music/rb-hip-hop/chance-the-rapper-thinking-about-changing-stage-name-1236354059/", "summary": "Chance the Rapper has been using his chosen stage for more than 15 years. But in a chat with Raven-Symoné and Miranda Maday on the latest episode of their Tea Time podcast, Maday wondered what his intention was in choosing that nom de rap and whether he considered early on if he would stretch the idea or the limitations around the title of MC with his alter ego. I think when I first got it, it was just a name that a girl I went to high school with came up with, Chance (born Chancelor Jonathan Bennett), 33, told the duo. I think over time, yes, people would tell me, Yo, you should drop the rapper part out of your name because you re more than rap.' He said he s hesitated to foreshorten the name in the years since because he always wanted whatever he did to be attributed to hip-hop and to be under the influence of hip-hop. I want to carry rap the same way that rap has carried me through life, he added. But recently, including while thinking in the shower the day of his podcast interview — as well as on his current Coloring Book 10th anniversary tour, which wraps up in Pittsburgh on Oct. 11 — he s been thinking about changing my name. His thoughts have revolved around losing the Chance and just going by The Rapper, he said. It s something I ve been thinking about a lot. I just really love the art form. I really love words. I think the greatest rappers, like myself, are etymologists and linguists at heart, people that really just love language. So, the writing part of it, the performance part of it is so much of my identity and I think the Chance part I give a lot of vulnerability and looks into my life and what s going on in my life, relationships, just my whole self sometimes and I don t love that as much now as I love just working within the genre. As examples of the way he s opened up in his music from day one, Chance listed songs about his grandmother having surgery ( Sunday Candy ), being a first-time dad ( I Love You So Much ) and traumas he s experienced, taking up the mantle of his favorite vulnerable MCs, including Outkast s André 3000, Kanye West, Eminem and Mos Def. But, Chance said rather than stepping away from hip-hop, he wants to dig deeper into it and have his stage name demonstrate his commitment to the genre. Sometimes it s good to make a song that s not about what I did that day, he explained. To date, Chance has released three official mixtapes ( 10 Day in 2012, Acid Rap in 2013 and Coloring Book in 2016) as well as two full-length studio ", "date_str": "2026-10-05T13:27:19+00:00", "hash": "5768d4aeb9f3044c", "title_fa": "شانس خواننده رپ می‌گوید که به این فکر می‌کند که نام استیج خود را نصف کند: \"من واقعاً هنر را دوست دارم\"", "summary_fa": "Chance the Rapper بیش از 15 سال است که از مرحله انتخابی خود استفاده می کند. اما در گفتگو با ریون سیمونه و میراندا مدی در آخرین قسمت پادکست آن‌ها در زمان چای، مدی به این فکر کرد که قصد او از انتخاب نام رپ چیست و آیا از همان ابتدا به این فکر می‌کرد که آیا ایده یا محدودیت‌های پیرامون عنوان MC را با آلتر ایگوی خود گسترش می‌دهد یا خیر. فکر می‌کنم وقتی برای اولین بار آن را گرفتم، این فقط اسمی بود که دختری که با آن به دبیرستان رفتم، چنس (متولد جاناتان بنت)، 33 ساله، به این دو نفر گفت. فکر می‌کنم با گذشت زمان، بله، مردم به من می‌گفتند، یو، باید بخش رپر را از نام خود حذف کنید، زیرا بیشتر از رپ هستید. او می‌گوید که در سال‌های بعد از کوتاه‌تر کردن نامش مردد است، زیرا همیشه می‌خواست هر کاری انجام می‌دهد به هیپ هاپ نسبت داده شود و تحت تأثیر هیپ هاپ باشد. او افزود، من می خواهم رپ را به همان شیوه ای که رپ من را در زندگی طی کرده است، حمل کنم. اما اخیراً، از جمله زمانی که در حمام در روز مصاحبه پادکست خود فکر می‌کرد - و همچنین در تور کنونی خود به مناسبت دهمین سالگرد کتاب رنگ‌آمیزی، که در 11 اکتبر در پیتسبورگ به پایان می‌رسد - او به تغییر نام من فکر می‌کرد. او گفت که افکار او حول محور از دست دادن شانس و رفتن به سمت رپر می چرخید. این چیزی است که من خیلی به آن فکر کرده ام. من فقط شکل هنری را خیلی دوست دارم. من واقعا کلمات را دوست دارم. فکر می‌کنم بزرگ‌ترین خواننده‌های رپ، مانند من، ریشه‌شناسان و زبان‌شناسان هستند، افرادی که واقعاً زبان را دوست دارند. بنابراین، بخش نویسندگی، بخش اجرایی آن تا حد زیادی هویت من است"}, {"source": "Billboard", "title": "Performers Announced for CMA’s Dolly Parton Tribute Special", "link": "https://www.billboard.com/music/country/dolly-parton-salute-live-2-hour-tv-special-cma-producing-1236341363/", "summary": "UPDATE (Oct. 5): The Country Music Association (CMA) and ABC revealed today the star-studded lineup of performers set for CMA Presents I Will Always Love You: A Celebration of Dolly Parton , the two-hour live television tribute to the country icon that was announced last month. Revealed today on ABC’s Good Morning America , the line-up spans multiple generations and genres—from fellow Country Music Hall of Fame members Reba McEntire, Vince Gill and Ricky Skaggs to acclaimed artists from bluegrass (Béla Fleck, Sierra Hull and Molly Tuttle), Broadway (Kristin Chenoweth and Kristen Bell) and beyond. Other artists set to perform on the special include Ashley McBryde, Brad Paisley, Carly Pearce, Carrie Underwood, Darius Rucker, Ella Langley, Kelsea Ballerini, Lady A, Lainey Wilson, Little Big Town, Lukas Nelson and Zac Brown. Amy Grant and Kimberly Williams-Paisley will appear as special guests. Additional surprise tributes from friends across the entertainment world will also be featured throughout the special. A Belmont University student ensemble will also participate in a performance, reflecting the university’s ongoing “Dolly U” programming that seeks to engage students in learning from Parton’s career, artistry and entrepreneurial legacy. The special airs Wednesday, Oct. 21 (9:00-11:00 p.m./ET) on ABC and Disney+ in the U.S. and internationally, available next day on Hulu, and will be filmed before a live audience at Belmont University s Fisher Center for the Performing Arts in Nashville. PREVIOUSLY (Sept. 16): The Country Music Association (CMA) announced today that it is producing CMA Presents I Will Always Love You: A Celebration of Dolly Parton , a two-hour television event in tribute to Dolly Parton , who died on Aug. 25 at age 80. The special will air live on Wednesday, Oct. 21 (9:00-11:00 p.m. ET) on ABC and Disney+ internationally, available next day on Hulu. That is a nearly a month before the 60th annual CMA Awards, which are set to air on Nov. 18. Related Radio Rallies Around Dolly Parton After Her Death, Led by ‘9 to 5’ See the Best Dolly Parton Musical Tributes, From Harry Styles, Katy Perry, John Mayer, Jack White More Dolly Parton Celebrates Her No. 1 Spot on Billboard s Greatest Country Artists of All Time List | Billboard The CMA promises that “the special will be a joyful, emotional celebration of the artist, songwriter, entertainer, humanitarian and entrepreneur whose music and generosity carried her from the mountains of east Tennessee", "date_str": "2026-10-05T13:16:00+00:00", "hash": "7ef43b7ce9fecd4b", "title_fa": "بازیگران برای ویژه ادای احترام دالی پارتون CMA معرفی شدند", "summary_fa": "به روز رسانی (5 اکتبر): انجمن موسیقی کانتری (CMA) و ABC امروز لیست ستاره‌ای از نوازندگان را برای CMA Presents I Will Always Love You: A Celebration of Dolly Parton، ادای احترام دو ساعته زنده تلویزیونی به نماد کانتری که ماه گذشته اعلام شد، فاش کردند. این مجموعه که امروز در صبح بخیر آمریکا از شبکه ABC رونمایی شد، چندین نسل و ژانر را در بر می گیرد - از اعضای دیگر تالار مشاهیر کانتری، ربا مک انتایر، وینس گیل و ریکی اسکاگز گرفته تا هنرمندان تحسین شده از موسیقی بلوگرس (بلا فلک، سیرا هال و مولی تاتل و ماورای کریستین برود)، چیتنووی. سایر هنرمندانی که قرار است در این ویژه اجرا کنند عبارتند از اشلی مک براید، برد پیزلی، کارلی پیرس، کری آندروود، داریوس راکر، الا لنگلی، کلسی بالرینی، لیدی ای، لینی ویلسون، شهر کوچک کوچک، لوکاس نلسون و زک براون. امی گرانت و کیمبرلی ویلیامز پیزلی به عنوان مهمانان ویژه حضور خواهند داشت. ادای احترام اضافی از دوستان در سراسر جهان سرگرمی نیز در سراسر ویژه نمایش داده می شود. یک گروه دانشجویی از دانشگاه بلمونت نیز در یک اجرا شرکت خواهد کرد که منعکس کننده برنامه‌های جاری دانشگاه «دالی یو» است که به دنبال جذب دانشجویان در یادگیری از حرفه، هنر و میراث کارآفرینی پارتون است. پخش ویژه چهارشنبه، 21 اکتبر (9:00 تا 11:00 بعد از ظهر/ET) در ABC و Disney+ در ایالات متحده و در سطح بین‌المللی، روز بعد در Hulu در دسترس است، و برای تماشاگران زنده در مرکز هنرهای نمایشی فیشر دانشگاه بلمونت در نشویل فیلم‌برداری می‌شود. پیش از این (16 سپتامبر): انجمن موسیقی کانتری (CMA) امروز اعلام کرد که در حال تولید CMA Presents I Will Always Love You: A Celebration of Dolly Parton است، یک رویداد تلویزیونی دو ساعته برای ادای احترام به دالی پارتون، که در 25 اوت در 80 سالگی"}, {"source": "Billboard", "title": "Natanael Cano Talks Inspiration, Music & Mexico’s Support | Billboard News", "link": "https://www.billboard.com/video/natanael-cano-inspiration-music-mexico-support-interview/", "summary": "Natanael Cano opens pu about what inspires him most: music, the studio energy and chasing songs that last. In this Billboard News interview, the musician also shouts out Mexico’s support and shares his pre-show mindset. Natanael Cano reflects on recording and composing, explains why great songs don’t go out of style and reacts to a fan-favorite track. Plus, he shares a quick list of influences, name-checking Tupac, DMX and Chalino Sánchez. Natanael Cano: Thanks. I m doing really badass. I m flowing Tupac, DMX, Chalino Sánchez, Natanael Cano, around there but everything was improvised, just so you know. This was what I had to wear today and I put it on real badass. Walking with swagger. Olivia, the skinny girl, she s coming around so people can wait for her and people are gonna enjoy her a lot like me. Arm tattooed full black, on the skull they bring me molichán. Like all the players who sing there, which is Víctor, it s Ovi, it s Tito, me. We killed it, honestly it s really cool, a song for all the crew, really tight. Pure happiness, pure peace. Right now here, well moments before the tragedy, honestly. We re already hyped up, people are waiting for me. I m ready, we re gonna give them everything we got. I have one little thing, it s this life and the next one. Mexico never lets me down, Mexico always supports, always has my back. And it s something I don t know how to thank the crew for, honestly. And well we re gonna keep making music around here and giving what we got. What inspires me? Music, music is what inspires me, the energy that music transmits, the moment when we record, when we compose, when we re in the studio, when we re making a track. Music when it enters, it enters and I can t get it out anymore, so music is always the music and I m happy making music, listening to it and enjoying it, which is what we like. Watch the full video above!", "date_str": "2026-10-05T13:00:00+00:00", "hash": "d62266c4e9b70e04", "title_fa": "Natanael Cano Talks Inspiration، Music & Mexico's Support | اخبار بیلبورد", "summary_fa": "ناتانائل کانو در مورد چیزی که او را بیشتر الهام می‌بخشد، کار خود را باز می‌کند: موسیقی، انرژی استودیو و آهنگ‌هایی که ماندگار هستند. در این مصاحبه بیلبورد نیوز، این نوازنده همچنین حمایت مکزیک را فریاد می زند و طرز فکر قبل از نمایش خود را به اشتراک می گذارد. ناتانائل کانو در مورد ضبط و آهنگسازی تأمل می کند، توضیح می دهد که چرا آهنگ های عالی از مد نمی افتند و به آهنگ مورد علاقه طرفداران واکنش نشان می دهد. به‌علاوه، او فهرستی سریع از تأثیرات، بررسی نام‌های Tupac، DMX و Chalino Sánchez را به اشتراک می‌گذارد. ناتانائل کانو: متشکرم. من واقعاً کار بدی دارم من توپاک، دی‌ام‌ای‌کس، چالینو سانچز، ناتانائل کانو، آنجا را می‌چرخانم، اما همه چیز بداهه بود، فقط برای اینکه بدانید. این همان چیزی بود که امروز باید می پوشیدم و آن را روی لباس بد واقعی پوشیدم. راه رفتن با تکبر. اولیویا، دختر لاغر، او می آید تا مردم منتظر او باشند و مردم مانند من از او لذت زیادی ببرند. بازو خالکوبی کامل سیاه و سفید، بر روی جمجمه آنها را برای من molichán. مثل همه بازیکنانی که آنجا می خوانند، که ویکتور است، اوی، تیتو، من. ما آن را کشتیم، راستش واقعاً عالی است، آهنگی برای همه خدمه، واقعاً فشرده. شادی ناب، آرامش خالص. همین الان اینجا، درست لحظاتی قبل از فاجعه. ما قبلا هیپ شده ایم، مردم منتظر من هستند. من آماده ام، همه چیز را به آنها می دهیم. من یک چیز کوچک دارم، این زندگی و زندگی بعدی است. مکزیک هرگز من را ناامید نمی کند، مکزیک همیشه حمایت می کند، همیشه پشت من است. و این چیزی است که من نمی دانم چگونه از خدمه تشکر کنم، صادقانه. و خوب ما به ساختن موسیقی در اینجا ادامه می دهیم و آنچه را که به دست آورده ایم ارائه"}, {"source": "Billboard", "title": "Elle King Marries Longtime Love Tattoo Artist Dan Tooker in Woodsy Outdoor Wedding: ‘Best Day of My Life’", "link": "https://www.billboard.com/music/country/elle-king-marries-tattoo-artist-dan-tooker-outdoor-wedding-1236354045/", "summary": "Elle King tied the knot with longtime love tattoo artist Dan Tooker over the weekend. The Ex s Oh s singer posted pics and videos from the rustic, woodsy outdoor wedding in Tennessee, captioning the set Husband and wife. Best day of my life. In the first snap, King, 37, wearing a fitted ivory satin gown with a long train and plunging neckline stands next to Tooker, who wore a black double-breasted suit with a black shirt with a large, dangling silver brooch pinned to his lapel. The second slide was a video (without sound) of the couple s first kiss, which King prefaced with what looked like a howl of joy, followed by a series of passionate kisses and an arms-in-the-air yelp from the groom. The other pics showed King walking down the aisle and sharing a quiet moment with Tooker. Tooker shared some scenes from the wedding on his Instagram Story , including the moment when King slipped a ring on his finger, as well as a glimpse at their wedding cake with two oversized, lifelike bobblehead-like fondant cake toppers depicting the couple. The Story also included video of the newlyweds singing a karaoke version of Paul Simon s 50 Ways to Leave Your Lover, footage of what appeared to be their first dance and a glimpse of the pair walking with their two young sons, Lucky Levi, 5, and Royal, 19 months. In a testament to King s rocking nature, Tooker s reel also featured video of the house band playing a mariachi cover of Guns N Roses Sweet Child O Mine and ended with the traditional bride smashing cake into the groom s face accompanied by Al Green s Love and Happiness. King and Tooker met in 2019 and got engaged in 2020, welcoming Lucky Levi a year later. According to People , the pair briefly broke up in 2023 and then got back together in 2024. Son Royal was born in February 2025.", "date_str": "2026-10-05T12:39:35+00:00", "hash": "5703e5b5bc0fb9df", "title_fa": "ازدواج ال کینگ با هنرمند خالکوبی عشق دیرینه دن توکر در عروسی در فضای باز وودسی: \"بهترین روز زندگی من\"", "summary_fa": "ال کینگ در آخر هفته با هنرمند خالکوبی عشق قدیمی دن توکر ازدواج کرد. خواننده Ex s Oh عکس‌ها و ویدیوهایی از عروسی روستایی و جنگلی در تنسی در فضای باز منتشر کرد و زیرنویس مجموعه زن و شوهر را نوشت. بهترین روز زندگیم در اولین عکس، کینگ، 37 ساله، با لباسی از جنس اطلس عاج با قطار بلند و یقه‌ای بلند، در کنار توکر قرار می‌گیرد که یک کت و شلوار دو سینه مشکی با پیراهنی مشکی پوشیده بود و یک سنجاق نقره‌ای آویزان و بزرگ به یقه‌اش چسبانده بود. اسلاید دوم ویدئویی (بدون صدا) از اولین بوسه زوج بود، که کینگ با چیزی شبیه زوزه شادی و به دنبال آن یک سری بوسه های پرشور و فریادهای آغشته به هوا از طرف داماد صحبت کرد. عکس‌های دیگر کینگ را نشان می‌دهد که در راهرو قدم می‌زند و لحظاتی آرام را با توکر به اشتراک می‌گذارد. توکر صحنه‌هایی از عروسی را در استوری اینستاگرام خود به اشتراک گذاشت، از جمله لحظه‌ای که کینگ حلقه‌ای را روی انگشتش انداخت، و همچنین نگاهی اجمالی به کیک عروسی آن‌ها با دو رویه کیک فوندانت بسیار بزرگ و واقعی که این زوج را به تصویر می‌کشند. داستان همچنین شامل ویدیویی بود از این که تازه ازدواج کرده یک نسخه کارائوکه از پل سیمون 50 راه برای ترک معشوق را می خوانند، فیلمی از آنچه به نظر می رسد اولین رقص آنها باشد و نگاهی اجمالی از راه رفتن این زوج با دو پسر خردسالشان، لاکی لوی، 5 ساله، و رویال، 19 ماهه. در گواهی بر طبیعت تکان‌دهنده کینگ، حلقه توکر همچنین ویدیویی از گروه موسیقی در حال نواختن یک جلد ماریاچی از Guns N Roses Sweet Child O Mine را به نمایش گذاشت و با کوبیدن کیک عروس سنتی به صورت داماد همراه با عشق و شادی آل گرین به پایان رسید. کینگ"}, {"source": "Billboard", "title": "Turnstile, Doechii, Phoebe Bridgers, Fontaines D.C., Robyn, Adéla & More Top 2027 Primavera Sound Barcelona Lineup", "link": "https://www.billboard.com/music/concerts/2027-primavera-sound-barcelona-lineup-turnstile-doechii-adela-1236354037/", "summary": "Turnstile, Doechii, Phoebe Bridgers, Fontaines D.C., Hayley Williams, FKA Twigs, The Chemical Brothers and Robyn are among the acts topping the roster for the 2027 Primavera Sound Barcelona festival. The lineup for next year s 25th anniversary event at Parc Del Fòrum in Barcelona from June 2-6 was revealed on Monday morning (Oct. 5) in a dramatic video directed by Guillem Cruells celebrating the event s history. The 2027 festival will also feature sets from Bad Gyal, Lola Young, Adéla, Caroline Polacheck, Prospa, Massive Attack and back-to-back sets from Skrillex and Ninajirachi. The main event will take place between June 3-5 at Parc del Fòrum, with the party getting started a day earlier with a free opening day and the traditional closing electronic dance party, Primavera Bits, featuring headliners Richie Hawtin, Four Tet and Dixon. Among the other acts slated to perform are: Pavement, King Gizzard the Lizard Wizard, Bleachers, Underworld, EsDeeKid, Anohni, Tinashe, Kim Petras, Angine De Potrine, Metronomy, Arca, Wallows, Snow Strippers, DIIV, Dinosaur Jr., Chvrches, Muna, Weyes Blood, Julien Baker, Atlas Sound and many more. Residents of Barcelona are eligible for a 10% discount on tickets. Fans have until Wednesday (Oct. 7) to register for a fan sale on the Primavera website ; a general onsale will open on Oct. 9on the Fever ticketing platform. This year s lineup featured sets from Addison Rae, the Cure, the XX, My Bloody Valentine, Skrillex, PinkPantheress, Gorillaz, Blood Orange, Peggy Gou, Little Simz, Big Thief and a surprise set from Olivia Rodrigo. Check out the full lineup for Primavera Sound Barcelona 2027 below. View this post on Instagram", "date_str": "2026-10-05T11:55:46+00:00", "hash": "7aad01a9e2809c6f", "title_fa": "Turnstile، Doechii، Phoebe Bridgers، Fontaines D.C.، Robyn، Adela و موارد دیگر ترکیب برتر 2027 Primavera Sound بارسلونا", "summary_fa": "Turnstile، Doechii، Phoebe Bridgers، Fontaines D.C.، Hayley Williams، FKA Twigs، The Chemical Brothers و Robyn از جمله بازیگرانی هستند که در صدر فهرست جشنواره Primavera Sound 2027 بارسلون قرار دارند. ترکیب رویداد بیست و پنجمین سالگرد سال آینده در پارک دل فروم در بارسلونا از 2 تا 6 ژوئن صبح روز دوشنبه (5 اکتبر) در یک ویدیوی دراماتیک به کارگردانی Guillem Cruells در جشن تاریخ این رویداد فاش شد. در جشنواره 2027 نیز مجموعه هایی از Bad Gyal، Lola Young، Adela، Caroline Polacheck، Prospa، Massive Attack و ست های پشت سر هم از Skrillex و Ninajirachi نمایش داده می شود. رویداد اصلی بین 3 تا 5 ژوئن در پارک دل فروم برگزار می‌شود و مهمانی یک روز زودتر با یک روز افتتاحیه رایگان و جشن سنتی رقص الکترونیکی پایانی، Primavera Bits، با حضور ریچی هاوتین، فور تت و دیکسون آغاز می‌شود. از جمله کارهای دیگری که قرار است اجرا شوند عبارتند از: Pavement، King Gizzard the Lizard Wizard، Bleachers، Underworld، EsDeeKid، Anohni، Tinashe، Kim Petras، Angine De Potrine، Metronomy، Arca، Wallows، Snow Strippers، DIIV، Chronavryes, Dinosaur Juliens. Baker، Atlas Sound و بسیاری دیگر. ساکنان بارسلون واجد شرایط تخفیف 10 درصدی برای بلیط هستند. طرفداران تا چهارشنبه (7 اکتبر) فرصت دارند برای فروش هواداران در وب سایت Primavera ثبت نام کنند. فروش عمومی در اکتبر باز خواهد شد. 9 در پلت فرم بلیط Fever. مجموعه‌های امسال شامل مجموعه‌هایی از Addison Rae، The Cure، XX، My Bloody Valentine، Skrillex، PinkPantheress، Gorillaz، Blood Orange، Peggy Gou، Little Simz، Big Thief و مجموعه‌ای شگفت‌انگیز از Olivia Rodrigo بود. ترکیب کامل Primavera Sound Barcelona 2027 را در زیر مشاهده کنید. این پست را در اینستاگرام مشاهده کنید"}, {"source": "Deadline", "title": "‘The Complete Kubrick’: How Michael Chaiken & Criterion Created The First Full Collection Of Stanley Kubrick’s Filmworks", "link": "https://deadline.com/2026/10/the-complete-kubrick-criterion-michael-chaiken-2026-1237146577/", "summary": "This month, Criterion will release The Complete Kubrick, a thirty-disc collector’s edition that will present, for the first time, all 13 films directed by Stanley Kubrick, alongside his three early short films. All the titles have been given new 4K restorations. The process was overseen by veteran archivist Michael Chaiken, who produced last year’s 4K [ ]", "date_str": "2026-10-05T14:21:22+00:00", "hash": "6d6234235c53eccc", "title_fa": "کوبریک کامل: چگونه مایکل چایکن و کریتریون اولین مجموعه کامل آثار فیلم استنلی کوبریک را ایجاد کردند", "summary_fa": "این ماه، Criterion The Complete Kubrick را منتشر می‌کند، نسخه‌ای از سی دیسک که برای اولین بار تمام 13 فیلم کارگردانی استنلی کوبریک را در کنار سه فیلم کوتاه اولیه او ارائه می‌کند. به همه عناوین بازسازی های جدید 4K داده شده است. این فرآیند توسط آرشیویست کهنه کار، مایکل چایکن، که سال گذشته 4K را تولید کرد، نظارت داشت. نکات برجسته مجموعه شامل نسخه بین المللی کمیاب کوبریک از The Shining، بازسازی 4K جدید مستند پشت صحنه ویویان کوبریک Making The Shining، تست های لولیتای که قبلا دیده نشده بود، لولیتا جیمزون و جیمز با بازیگران. تصاویر پشت صحنه Criterion همچنین یک لیست پخش اختصاصی کوبریک را در کانال یوتیوب خود راه اندازی خواهد کرد، با ویدیوهایی که فیلم های کوبریک، فرآیند خلاقانه، همکاران و میراث کوبریک را بررسی می کند. Chaiken درباره The Complete Kubrick گفت: امیدوارم مردم این مجموعه را پایان کار نبینند. فکر می‌کنم این آغاز یک مسیر طولانی‌تر است که در آن فیلم‌های کوبریک در نسخه‌های جدید بازمی‌گردند. در زیر، چایکن با ددلاین به طور عمیق در مورد چگونگی طراحی این مجموعه جدید، نحوه همکاری او با املاک کوبریک برای ردیابی چاپ های کمیاب از فیلم های اولیه این فیلمساز، و آنچه در مورد این فیلمساز بزرگ آمریکایی پس از مطالعه زندگی و حرفه اش آموخت، صحبت می کند. چایکن می‌گوید که او در هسته‌اش یک بدبین سرد و سخت نبود. کوبریک کامل از 20 اکتبر در دسترس خواهد بود. مهلت: پروژه چگونه آغاز شد؟ بحث ها از چه زمانی شروع شد؟ مایکل چایکن: حرفه اصلی من بایگانی است. من با فیلمسازان، ترانه سراها و دیگران در آرشیو آنها کار می کنم. داشتم آرشیو یکی دیگر از فیلمسازان متولد برانکس به نام پل موریسی را جمع می کردم که با اندی وارهول فیلم می ساخت. این تقریباً اواخر سال 2024 بود. من از کیم هندریکسون،"}, {"source": "Deadline", "title": "Tubi Strikes 800-Title Just For Laughs Deal In Canada", "link": "https://deadline.com/2026/10/tubi-just-for-laughs-canada-comedy-deal-1237145289/", "summary": "EXCLUSIVE: Fox free streamer Tubi just added a massive stack of Just For Laughs programs in Canada. The deal will see 800 comedy specials and episodes joining Tubi s Canadian feed, including the likes of Dave Merheje: I Love You Habibi, Hasan Minhaj: Adult Boy amd Howie Mandell: Don’t Sneeze On Me. Also part of the [ ]", "date_str": "2026-10-05T14:00:00+00:00", "hash": "7ad6016d6b934e3d", "title_fa": "Tubi Strikes 800-Title Just for Laughs Deal در کانادا", "summary_fa": "انحصاری: پخش کننده رایگان فاکس Tubi به تازگی مجموعه عظیمی از برنامه های Just For Laughs را در کانادا اضافه کرده است. در این قرارداد 800 قسمت کمدی ویژه و اپیزود به فید کانادایی Tubi خواهد پیوست، از جمله دیو مرهجه: من تو را دوست دارم حبیبی، حسن منهاج: پسر بزرگسال و هاوی ماندل: روی من عطسه نکن. همچنین بخشی از [ ] همچنین بخشی از بسته شامل جف دانهام @ JFL: جلد اول و دوم، ریک مرسر: جهنم کوچک بلند کنید، تیفانی هدیش تاپ جهان، ترور نوآ @ JFL: جلد اول و دوم، ویل فورت تایم از زمان من و مجموعه‌هایی مانند Just for Laughs Gags، Lughskell و Lug
