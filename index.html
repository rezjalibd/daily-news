eb ادامه دارد. او خطاب به نمایندگان پارلمان اروپا گفت: «مدیرعامل پیشرفته‌ترین شرکت‌ها به ما گفته‌اند که زمان آن رسیده است که سرعت خود را با توجه به مدل‌های بازگشتی کاهش دهیم.» و سپس ادامه داد که «اگر افرادی که در حال توسعه فناوری هستند بر این عقیده هستند که اینطور است، پس ما نیز باید چنین باشیم.» اورسولا فون در لاین تاریخ برگزاری این نشست را مشخص نکرد و به هیچ یک از شرکت هایی که دعوت می شوند اشاره نکرد. اصطلاح \"سرعت در مرز\" توسط داریو آمودی از آنتروپیک ایجاد شد که در مقاله خود در 12 سپتامبر از آزمایشگاه‌های رقیب خواست تا سرعت بهبود قابلیت‌های خود را کاهش دهند، موافقت کنند که اشخاص ثالث مستقر در آنها ارزیابی‌ها را انجام دهند و برای ایجاد هماهنگی برای معافیت ضد تراست در واشنگتن درخواست دهند. سم آلتمن و ایلان ماسک نیز در همان روز از این موضع حمایت کردند. با این حال، روز سه‌شنبه، مارک زاکربرگ از متا موضع مخالفی گرفت و در X گفت که رقابت در حال حاضر به آزمایشگاه‌ها انگیزه می‌دهد تا ایمن بسازند. از سوی دیگر، اورسولا فون لاین موضوع را به عنوان یک سوال امنیتی مطرح کرد. او اظهار داشت که \"هک کردن در مقیاسی که ما هرگز فکرش را نمی‌کردیم\" توسط مدل‌های مرزی امکان‌پذیر خواهد شد و این مدل‌ها به زودی به دست دشمنان ما خواهند افتاد."}, {"source": "The Next Web", "title": "ByteDance’s AI drug unit Anew Labs raises $290M at $1.5B valuation, Reuters reports", "link": "https://thenextweb.com/news/bytedance-anew-labs-290m-ai-drug-discovery", "summary": "ByteDance closed a $290M funding round for Anew Labs, its newly spun-off AI drug discovery unit, at a $1.5B valuation, Reuters reports, citing two sources familiar with the matter. Moreover, the company that owns TikTok will retain 56% of the business after this round, according to the same sources. According to the same reporting, HSG, [ ] This story continues at The Next Web", "date_str": "2026-09-16T08:10:25+00:00", "hash": "d12c85ef372986c8", "title_fa": "رویترز گزارش می دهد که واحد داروی هوش مصنوعی ByteDance Anew Labs 290 میلیون دلار به ارزش 1.5 میلیارد دلار افزایش می دهد.", "summary_fa": "رویترز به نقل از دو منبع آگاه گزارش می دهد که ByteDance دور بودجه 290 میلیون دلاری Anew Labs، واحد کشف داروی هوش مصنوعی تازه منحل شده خود را با ارزش 1.5 میلیارد دلار بسته است. علاوه بر این، بر اساس همین منابع، شرکت مالک TikTok پس از این دور 56 درصد از تجارت را حفظ خواهد کرد. بر اساس همین گزارش، HSG، [ ] این داستان در The Next Web ادامه دارد. این اسپین آف اولین بار چند روز قبل توسط Intelligent Emergence، یک نشریه 36Kr ذکر شد، که بیان کرد که تقریباً 50 نفر از کارکنان اصلی به همراه الگوریتم ها، پلت فرم فناوری و دارایی های خط لوله به شرکت جدید نقل مکان خواهند کرد. Volcano Engine، بخش ابری ByteDance، به ارائه قدرت محاسباتی ادامه خواهد داد. رهبری این تیم بر عهده لیو کای است، که همانطور که گزارش فاینانس سینا اشاره می کند، قبل از پیوستن به ByteDance در سال 2021، به مدت هفت سال در سرمایه گذاری خطرپذیر در IDG Capital و Fire Stone Investment مشغول بود. شرکت قبلی او اکنون یکی از سرمایه گذاران پیشرو در این دور است. به گفته منابع رویترز، این تقسیم به منظور ارتقای توسعه بلندمدت واحد بوده است، زیرا کشف دارو مبتنی بر هوش مصنوعی از منطق صنعتی و رویکرد مدیریتی متفاوت از سایر مشاغل ByteDance پیروی می کند. Intelligent Emergence این حرکت را اولین گام این شرکت به سمت تجاری سازی تلاش های هوش مصنوعی برای علم توصیف کرد. این شرکت توسعه مدل‌های پیش‌بینی ساختار و طراحی پروتئین، مانند Protenix و PXDesign، و همچنین تعداد کمی از داروها را هدایت کرده است. در ماه آوریل، کریس لی، رئیس بخش زیست شناسی، یک مهارکننده IL-17 طراحی شده با هوش مصنوعی، یکی از چهار نامزد آزمایشگاه Anew را در نشست انجمن ایمونولوژیست های آمریکا در بوستون به نمایش گذاشت."}, {"source": "The Next Web", "title": "Mark Zuckerberg says every AI lab has the incentive to build safely", "link": "https://thenextweb.com/news/zuckerberg-ai-labs-incentive-build-safely", "summary": "“Every lab has the responsibility and incentive to move at the pace required to train its models safely, and the ability to take its own actions to ensure that happens,” said Mark Zuckerberg in a post on X on Tuesday. In the context of these days, when everyone is talking about “responsibility”, “the danger of [ ] This story continues at The Next Web", "date_str": "2026-09-16T07:49:50+00:00", "hash": "050d85574d488bbb", "title_fa": "مارک زاکربرگ می گوید هر آزمایشگاه هوش مصنوعی انگیزه ای برای ساخت ایمن دارد", "summary_fa": "مارک زاکربرگ در پستی در روز سه شنبه در ایکس گفت: \"هر آزمایشگاهی مسئولیت و انگیزه ای برای حرکت با سرعت لازم برای آموزش ایمن مدل های خود دارد و توانایی انجام اقدامات خود را برای اطمینان از این اتفاق دارد.\" در شرایط این روزها، زمانی که همه از \"مسئولیت\" صحبت می کنند، \"خطر [ ] این داستان در The Next Web ادامه دارد، علاوه بر این، سم آلتمن و ایلان ماسک اولین کسانی بودند که علناً این طرح را تایید کردند، در حالی که الکس کارپ از Palantir کمتر تحت تاثیر قرار گرفت و گفت که زمانی که چین بعید است که Must چند ماه به امنیت من بپیوندد، مکث غیرواقعی است. ما قبل از ما از دیگران دعوت نکردیم که این کار را انجام دهند. ما فقط این کار را به عنوان بخشی از کار روزمره خود انجام دادیم زیرا به وضوح برای مردم و برای ما کار درستی بود. من به پایه‌های امنیتی که ساخته‌ایم افتخار می‌کنم.\" مارک زاکربرگ در همان پست ادامه داد. Muse سرانجام در 8 سپتامبر پس از به تعویق افتادن از آوریل در ایالات متحده راه اندازی شد. بر اساس همین گزارش، متا اعتراف کرده است که در طول آزمایش داخلی با مشکلات قابلیت اطمینان مواجه شده است، از جمله مواردی که نماینده عکس‌های شخصی را بازیابی کرده است که از آنها خواسته نشده است. به نظر می رسد کاخ سفید نیز چندان مایل به پذیرش کاهش سرعت نیست. دونالد ترامپ، رئیس‌جمهور آمریکا روز دوشنبه در اقامتگاه خود در ایرلند، حامیان کاهش سرعت را «نیروهای منفی» توصیف کرد و گفت که نگرانی اصلی این است که از چین جلوتر بمانند. OpenAI اعلام کرده است که دسترسی ارزیاب های مستقل به سیستم های خود را در سطح یک کارمند فراهم می کند، در حالی که زاکربرگ در پست خود ترتیبات فعلی متا را حفظ"}, {"source": "MIT Tech Review", "title": "Building the materials foundation for AI", "link": "https://www.technologyreview.com/2026/09/16/1144014/building-the-materials-foundation-for-ai/", "summary": "The AI boom is becoming a materials challenge. As AI pushes computing into new territory, the materials behind that infrastructure are becoming just as crucial as the algorithms running on it. Semiconductors and data centers are approaching physical limits around performance, thermal management, electrical efficiency, and reliability, creating new demands for materials that can do more at once. At the same time, AI is giving materials scientists new ways to search the enormous universe of possible molecules and accelerate the development of solutions. For Mike Finelli, chief technology and innovation officer and chief North America officer at Syensqo, that convergence is transforming what advanced materials can enable. “AI is now, from a material standpoint, really pushing semiconductors and the data centers to their physical limits,” he says. As requirements accumulate, including high temperature, purity, electrical performance, chemical resistance, plasma resistance, and long-term stability, materials move toward what Finelli calls the “top of the pyramid.” Beyond supporting AI innovation, he contends that advanced materials are “actually increasingly defining what s going to be possible.” That challenge is playing out across the infrastructure powering the AI surge. Syensqo is developing materials for high-voltage data center architectures, advanced sealing materials for semiconductor manufacturing, and thermal-management solutions including fluids for direct immersion cooling. Some of those innovations can also cross industry boundaries. Materials developed for electric vehicles, for example, can help address the higher voltage and energy-density demands that are emerging in data centers. The definition of performance is also changing. More customers are expecting materials to meet technical requirements while reducing environmental impact. “Our goal is to remove the trade-off between performance and sustainability,” Finelli says. That means considering sustainability at the beginning of the research process instead of treating it as an additional requirement once a material has been developed. AI is changing how those materials are discovered, too. Syensqo is using AI agents to digitally synthesize millions of potential molecular combinations, predict their performance and sustainability characteristics, and narrow them to a much smaller group for laboratory testing. The result, Finelli says, is the ability to go “broader, deeper, and faster” while gi", "date_str": "2026-09-16T12:47:34+00:00", "hash": "e4c61c9dffde9ba4", "title_fa": "ساخت پایه مواد برای هوش مصنوعی", "summary_fa": "رونق هوش مصنوعی در حال تبدیل شدن به یک چالش مواد است. همانطور که هوش مصنوعی محاسبات را به قلمرو جدیدی سوق می دهد، مواد پشت آن زیرساخت به اندازه الگوریتم های اجرا شده روی آن حیاتی می شوند. نیمه هادی ها و مراکز داده به محدودیت های فیزیکی در مورد عملکرد، مدیریت حرارتی، راندمان الکتریکی و قابلیت اطمینان نزدیک می شوند و تقاضاهای جدیدی را برای موادی ایجاد می کنند که می توانند کارهای بیشتری را در یک زمان انجام دهند. در عین حال، هوش مصنوعی به دانشمندان مواد راه‌های جدیدی برای جستجوی جهان عظیم مولکول‌های ممکن و تسریع در توسعه راه‌حل‌ها می‌دهد. برای Mike Finelli، افسر ارشد فناوری و نوآوری و افسر ارشد آمریکای شمالی در Syensqo، این همگرایی آنچه را که مواد پیشرفته می‌توانند امکان‌پذیر کنند، تغییر می‌دهد. او می‌گوید: «هوش مصنوعی اکنون، از نقطه نظر مادی، نیمه‌رساناها و مراکز داده را واقعاً به محدودیت‌های فیزیکی خود سوق می‌دهد. با انباشته شدن الزامات، از جمله دمای بالا، خلوص، عملکرد الکتریکی، مقاومت شیمیایی، مقاومت در برابر پلاسما، و پایداری طولانی مدت، مواد به سمت چیزی حرکت می‌کنند که فینلی آن را «راس هرم» می‌نامد. فراتر از حمایت از نوآوری هوش مصنوعی، او معتقد است که مواد پیشرفته \"در واقع به طور فزاینده ای آنچه را که ممکن است مشخص می کند.\" این چالش در سرتاسر زیرساختی است که به افزایش هوش مصنوعی کمک می کند. Syensqo در حال توسعه مواد برای معماری‌های مرکز داده با ولتاژ بالا، مواد آب‌بندی پیشرفته برای تولید نیمه‌رساناها، و راه‌حل‌های مدیریت حرارتی از جمله سیالات برای خنک‌سازی مستقیم غوطه‌وری است. برخی از این نوآوری ها می توانند از مرزهای صنعت نیز عبور کنند. به عنوان مثال، موادی که برای وسایل نقلیه الکتریکی تولید شده اند، می توانند به رفع نیازهای ولتاژ و چگالی انرژی بالاتری که در مراکز داده در حال ظهور هستند"}, {"source": "MIT Tech Review", "title": "The Download: AI’s trillion-dollar gamble and OpenAI’s biology data bid", "link": "https://www.technologyreview.com/2026/09/16/1144205/the-download-ai-trillion-dollar-build-openai-biological-data/", "summary": "This is today s edition of The Download , our weekday newsletter that provides a daily dose of what s going on in the world of technology. What’s at stake in AI’s trillion-dollar gamble When Jessica Wachter, a finance professor at the University of Pennsylvania, wanted to assess AI’s impact on the economy over the next few years, she faced a long list of uncertainties. So she started with a “remarkable fact” that is not in question: a handful of so-called hyperscalers are investing huge amounts of money to build AI data centers. Instead of trying to predict how widely deployed AI models will be, Wachter asked how fast the hyperscalers’ earnings will need to grow to justify their spending through 2027, when expenditures are expected to reach nearly $1.1 trillion. The results are eye-opening. AI companies will need to achieve an extraordinary increase in productivity just to break even by 2030. Take a closer look at what it will take for the AI buildout to pay off. —David Rotman AI models need more data about biology, and OpenAI is paying to create it AI needs much more information to make important breakthroughs in curing disease. So last year Ruxandra Teslo, a policy analyst, posted an idea for supercharging medical AI systems: use data from failed biotech companies. By bidding at bankruptcy proceedings, she argued, it might be possible to obtain detailed regulatory filings, manufacturing strategies and safety data, creating what she called “biotech’s lost archive.” The OpenAI Foundation, the nonprofit parent of OpenAI, announced this week that it will fund her idea, paying ر، Opus 5.2 جزئیات درخواست را با دقت دنبال می‌کند، اما برخلاف برخی مدل‌های استدلالی، درگیر کارهای جانبی و غیرضروری نمی‌شود و بهتر می‌تواند روی هدف اصلی باقی بماند. یکی دیگر از تغییرات قابل توجه به استقامت مدل در انجام پروژه‌های طولانی مربوط می‌شود. یکی از تسترها می‌گوید مجموعه‌ای شامل هشت وظیفه بزرگ را به مدل سپرده و Opus 5.2 بدون توقف‌های مکرر"}, {"source": "Zoomit", "title": "دوربین سبک با سیستم لرزش‌گیر حرفه‌ای؛ کانن از EOS R8 Mark II رونمایی کرد", "link": "https://www.zoomit.ir/camera/467310-canon-eos-r8-mark-ii-launch/", "summary": "کانن نسل دوم دوربین EOS R8 را با طراحی کلاسیک و سیستم لرزشگیر پنج‌محوره معرفی کرد.", "date_str": "2026-09-16T12:55:00+00:00", "hash": "6bf8c70899b9c661", "title_fa": "دوربین سبک با سیستم لرزش‌گیر حرفه‌ای؛ کانن از EOS R8 Mark II رونمایی کرد", "summary_fa": "کانن نسل دوم دوربین EOS R8 را با طراحی کلاسیک و سیستم لرزشگیر پنج‌محوره معرفی کرد. تبلیغات کانن دوربین عکاسی فول‌فریم EOS R8 Mark II را رونمایی کرد . دوربین جدید به سیستم لرزشگیر داخلی مجهز شده است و از طراحی کلاسیک و زاویه‌دار شبیه دوربین‌های فیلمی قدیمی بهره می‌برد. وزن بدنه به حدود ۵۴۴ گرم می‌رسد تا به سبک‌ترین دوربین فول‌فریم مجهز به لرزشگیر کانن تبدیل شود. عرضه‌ی رسمی از اواخر مهر آغاز می‌شود. قیمت دوربین از ۱۸۹۹ دلار برای بدنه و ۲۰۹۹ دلار به همراه لنز کیت ۵۰-۲۴ میلی‌متری آغاز می‌شود. حسگر ۲۴٫۲ مگاپیکسلی CMOS به همراه شاتر الکترونیکی با سرعت عکاسی پیاپی ۴۰ فریم‌برثانیه در قلب دستگاه قرار دارد. قابلیت ثبت پیش‌دستانه تا ۲۰ شات قبل از فشردن دکمه‌ی شاتر و لرزشگیر پنج‌محوره با توانایی کاهش لرزش تا ۷٫۵ استاپ، امکانات تصویربرداری را ارتقا می‌دهند. سیستم فوکوس خودکار Dual Pixel CMOS AF II با قابلیت شناسایی حیوانات، وسایل نقلیه و چهره افراد تعبیه شده است. فیلم‌برداری با وضوح 4K و نرخ ۶۰ فریم‌برثانیه انجام می‌شود و امکان ارتقای سرعت به ۱۸۰ فریم‌برثانیه در وضوح 1080p وجود دارد."}, {"source": "Zoomit", "title": "بازگشت فوجی‌فیلم به دنیای نوستالژیک دوربین‌های آنالوگ", "link": "https://www.zoomit.ir/camera/467246-fujifilm-instax-pal-2-announced/", "summary": "فوجی‌فیلم از دوربین دیجیتال ای ‌ی ID.3 GTI را رونمایی کرد . محصول جدید پس از مدل کوچک‌تر فولکس‌واگن ID. Polo GTI، دومین خودرو تمام‌الکتریکی حامل نشان GTI به‌شمار می‌رود و عنوان قدرتمندترین مدل تاریخ این سری را به خود اختصاص داده است. پیشرانه‌ی برقی نصب‌شده روی محور عقب ۳۲۲ اسب بخار قدرت و ۵۴۵ نیوتن‌متر گشتاور تولید می‌کند. شتاب صفر تا ۱۰۰ خودرو ۵٫۶ ثانیه ثبت شده و حداکثر سرعتش به ۲۰۰ کیلومتربرساعت می‌رسد که به‌صورت الکترونیکی محدود شده است. بهره‌گیری از پلتفرم +MEB سبب شده تا نخستین‌بار نشان GTI روی خودرویی با انتقال قدرت دیفرانسیل عقب قرار بگیرد. تامین انرژی بر عهده‌ی یک باتری لیتیوم-یونی با ظرفیت خالص ۷۹ کیلووات‌ساعت است که پیمایش تخمینی ۶۰۱ کیلومتر را بر اساس چرخه‌ی WLTP فراهم می‌کند. شارژ سریع جریان مستقیم (DC) با توان ۱۸۳ کیلووات می‌تواند ظرفیت باتری را ظرف ۲۹ دقیقه از ۱۰ به ۸۰ درصد برساند که نشان‌دهنده‌ی بهبود ۱۰ کیلومتری شعاع حرکتی نسبت‌به نسخه‌ی پیشین است. طراحی خودرو با به‌روزرسانی‌هایی شامل خطوط قرمز شاخص، جزئیات مشکی براق، دی‌لایت‌های عمودی LED و رینگ‌های ۲۰ اینچی همراه است. داخل کابین نمایشگر کلاستر ۱۰٫۲۵ اینچی پشت فرمان، صفحه‌نمایش ۱۲٫۹ اینچی سیستم اطلاعات‌سرگرمی، صندلی‌های اسپرت، دکمه‌های فیزیکی روی غربیلک فرمان و حالت رانندگی اختصاصی GTI با قابلیت شبیه‌سازی صدای پیشرانه تعبیه شده‌اند. عرضه‌ی رسمی این هاچ‌بک در بازار اروپا برای بهار ۲۰۲۷ برنامه‌ریزی شده است."}, {"source": "Zoomit", "title": "ارتباط بین مصرف گوشت فرآوری‌شده و سرطان معده دیگر انکارشدنی نیست", "link": "https://www.zoomit.ir/health-medical/466928-processed-meat-stomach-cancer-risk/", "summary": "مطالعه‌ای روی بیش از ۴۵۰ هزار نفر نشان می‌دهد که مصرف گوشت فرآوری‌شده، خطر ابتلا به سرطان معده و مری را به طور قابل توجهی افزایش می‌دهد.", "date_str": "2026-09-16T10:25:00+00:00", "hash": "e9577579c26bb220", "title_fa": "ارتباط بین مصرف گوشت فرآوری‌شده و سرطان معده دیگر انکارشدنی نیست", "summary_fa": "مطالعه‌ای روی بیش از ۴۵۰ هزار نفر نشان می‌دهد که مصرف گوشت فرآوری‌شده، خطر ابتلا به سرطان معده و مری را به طور قابل توجهی افزایش می‌دهد. تبلیغات سال‌هاست که شواهد علمی، مصرف بیش از حد گوشت، به ویژه گوشت قرمز و فرآوری‌شده را با افزا اری شده‌اند. به‌ گزارش ایسنا، با تکمیل این طرح، امکان تحلیل برخط داده‌های مربوط به آلودگی هوا، تصادفات شهری و وضعیت معاینه فنی خودروها فراهم خواهد شد. مسعود حق‌لطفی، مدیرعامل اتحادیه سازمان‌های مدیریت حمل‌ونقل شهرداری‌های کشور، گفت: در کنار این موضوع تجهیزات سخت افزاری آن خریداری شده و امیدواریم که با فراهم شدن زیر ساخت های آن و تجمیع سامانه ها تا پایان امسال این موضوع جمع بندی و عملیاتی شود. - مسعود حق‌لطفی ، مدیرعامل اتحادیه سازمان‌های مدیریت حمل‌ونقل شهرداری‌های کشور او هم‌چنین ادامه داد: «فرایند حذف افرادی که بازنشسته شده یا از شغل تاکسی‌رانی خارج شده‌اند، بر اساس داده‌های دریافتی از استان‌ها به پایان رسیده است. فهرست افراد جدید به سازمان تامین اجتماعی ارسال شده و نیمی از حق بیمه پایه رانندگان توسط دولت پرداخت خواهد شد.» تغییرات ساختاری در نگارش سوم سیمفا بیشتر بر بهبود ارتباطات سیستمی، به‌روزرسانی رابط‌های تحت وب و اتصال پایدار با پلیس راهور متمرکز است. مبالغ دریافتی از مالکان خودرو بابت دریافت برگه‌ی معاینه فنی در نسخه جدید تغییر چندانی نخواهد داشت. مسعود حق‌لطفی، مدیر امور اجرایی معاینه فنی و عوارض خودرویی کشور، گفت: «ویژگی‌های پایه آن مانند پایه قبلی است ولی یک سری ایرادات داشت که طبق شرایط روز نسخه ها اصلاحاتی رو نیاز داشتند که به روزتر و تحت شد و امکانات اتصال آن به همدیگر و اتصال آن به پلیس راحت‌تر شد.»"}, {"source": "Zoomit", "title": "ساعت جدید سیتیزن با صفحه سبز و بدنه استیل معرفی شد", "link": "https://www.zoomit.ir/wearables/467241-citizen-at8260-85x-watch-launched/", "summary": "سیتیزن ساعت کرونوگراف جدید AT8260-85X را با صفحه‌ی سبز زمردی، فناوری اکودرایو و قابلیت تنظیم زمان اتمی روانه‌ی بازار آمریکا کرد.", "date_str": "2026-09-16T09:40:00+00:00", "hash": "76dbfaccd30d3dc3", "title_fa": "ساعت جدید سیتیزن با صفحه سبز و بدنه استیل معرفی شد", "summary_fa": "سیتیزن ساعت کرونوگراف جدید AT8260-85X را با صفحه‌ی سبز زمردی، فناوری اکودرایو و قابلیت تنظیم زمان اتمی روانه‌ی بازار آمریکا کرد. تبلیغات سیتیزن ساعت کرونوگراف سری Sport Luxury را با نام AT8260-85X در بازار ایالات متحده عرضه کرد. قیمت ساعت مچی مردانه جدید سیتیزن ۶۷۵ دلار است. ساختار این ساعت بر پایه‌ی eler-2026-9", "summary": "I think the Midwest is the best part of the US to visit in the fall. Emily Hart I've traveled to all 50 states and think the Midwest is the best part of the US to visit in autumn. The foliage is incredible, and there are lots of opportunities to take a scenic drive. Plus, the outdoor activities don't stop in the fall months. In my opinion, they only get better. After traveling solo through all 50 states, I've found that fall has a unique magic in every part of the country. From the golden aspens of my current home in Colorado to New England's bucket-list-worthy fiery maples, each region has its own seasonal beauty and charm. However, one part of the country that has surprised me most is the Midwest. Despite being born and raised in Illinois , I didn't appreciate the beauty and charm of this area in the fall until I moved away. Often overlooked as \"flyover country,\" the Midwest transforms each autumn into a sight that, to me, rivals the more popular leaf peeping areas of the country. Midwestern small towns feel like they're built for fall Petoskey, Michigan, has a walkable downtown area. Wirestock Creators/Shutterstock The Midwest is known for its small, rural towns, filled with farmland and a very distinct charm — which, in my opinion, is most evident in the fall months. I especially love towns like Bayfield, Wisconsin, and Petoskey, Michigan, which have walkable downtown areas with unique shops and local restaurants, all surrounded by beautiful foliage. Speaking of foliage, it doesn't get better than the Midwest The fall foliage in the Midwest is gorgeous. Emily Hart When most people think of fall foliage, they think of New England . And I get it — I've visited the region during peak fall foliage several times, and always recommend others do so. However, I've found that many people don't realize the fall colors in many parts of the Midwest are just as brilliant. I've been especially impressed by how beautiful the leaves in the Great Lake هود است. من به ویژه شهرهایی مانند بای‌فیلد، ویسکانسین، و پتوسکی، میشیگان را دوست دارم، که دارای مناطق قابل پیاده‌روی در مرکز شهر با فروشگاه‌های منحصربه‌فرد و رستوران‌های محلی هستند که همگی با شاخ و برگ‌های زیبا احاطه شده‌اند. وقتی صحبت از شاخ و برگ شد، بهتر از غرب میانه نیست شاخ و"}, {"source": "Business Insider", "title": "Kevin Warsh is getting a big test to prove the Fed's independence", "link": "https://www.businessinsider.com/fed-chair-kevin-warsh-faces-independence-test-trump-2026-9", "summary": "Brendan SMIALOWSKI / AFP via Getty Images This post originally appeared in the Business Insider Today newsletter. You can sign up for Business Insider's daily newsletter here . A funny thing is probably going to happen this afternoon: The Fed will raise rates, and investors will cheer it on. Normally, when the central bank raises interest rates, the market reacts the opposite way . Higher borrowing costs are basically kryptonite for businesses' growth plans. Unfortunately for them, months of data have shown inflation isn't getting closer to the Fed's 2% target, and investors appear ready to take their medicine. The market has essentially priced in a rate hike — the CME FedWatch tool has the probability of one at almost 95%. And if investors really hate one thing, it's a surprise. For more on all that, follow our live blog . But there's another reason the market is hoping for a rate hike. It would go a long way toward signaling Fed Chair Kevin Warsh is committed to maintaining the central bank's independence and is willing to go against President Donald Trump's wishes. The president has made it clear he wants lower rates, reiterating that point after last week's blowout jobs report . A booming job market would actually disincentivize the Fed from lowering rates, as it risks further fueling inflation, but I digress. Most market experts believe the White House shouldn't influence the Fed. The focus should be on monetary policy, not politics. And concerns about whether that would remain the case under Warsh's leadership followed him throughout the nomination process . This afternoon's decision will show whether those worries were warranted. Things won't get easier for Warsh following today's decision. The next time the Fed will make a call on rates is October 28. That's less than a week before the all-important midterm elections. There will be a lot of sensitivities around any monetary decisions made right before Americans head to the polls. As it stands, the market is divided, with nearly 43% expecting a second rate hike in late October. It's worth noting that hikes or cuts commonly come in multiples as the central bank needs more than a one-off to address broader trends. Traders will have plenty to chew on in the meantime, though. There's Treasury yield volatility , the gloom-or-boom of the AI trade, and the ongoing war in Iran. We'll also be in the thick of earnings season right when the Fed is ready to make its decision. But let's not get ahead of ourselve", "date_str": "2026-09-16T14:17:48+00:00", "hash": "3e167e1c6e2ceafc", "title_fa": "کوین وارش در حال انجام یک آزمون بزرگ برای اثبات استقلال فدرال رزرو است", "summary_fa": "برندان اسمیالووسکی / خبرگزاری فرانسه از طریق گتی ایماژ این پست در اصل در خبرنامه Business Insider Today منتشر شد. از اینجا می توانید برای خبرنامه روزانه Business Insider ثبت نام کنید. یک اتفاق خنده دار احتمالاً امروز بعدازظهر رخ خواهد داد: فدرال رزرو نرخ بهره را افزایش خواهد داد و سرمایه گذاران آن را تشویق خواهند کرد. به طور معمول، زمانی که بانک مرکزی نرخ بهره را افزایش می دهد، بازار عکس العمل نشان می دهد. هزینه های وام بالاتر اساساً کریپتونیت برای برنامه های رشد مشاغل است. متأسفانه برای آنها، ماه ها داده ها نشان می دهد که تورم به هدف 2 درصدی فدرال رزرو نزدیک نمی شود و به نظر می رسد سرمایه گذاران آماده مصرف داروهای خود هستند. بازار اساساً با افزایش نرخ قیمت گذاری شده است - ابزار CME FedWatch تقریباً 95٪ احتمال یک را دارد. و اگر سرمایه گذاران واقعا از یک چیز متنفرند، جای تعجب دارد. برای اطلاعات بیشتر در مورد همه این موارد، وبلاگ زنده ما را دنبال کنید. اما دلیل دیگری وجود دارد که بازار به افزایش نرخ امیدوار است. این امر تا حد زیادی نشان می دهد که کوین وارش، رئیس فدرال رزرو، متعهد به حفظ استقلال بانک مرکزی است و مایل است برخلاف خواسته های رئیس جمهور دونالد ترامپ حرکت کند. رئیس‌جمهور به وضوح اعلام کرده است که خواهان نرخ‌های پایین‌تر است و این نکته را پس از گزارش انفجار هفته گذشته تکرار کرد. یک بازار کار پررونق در واقع باعث می شود که فدرال رزرو از کاهش نرخ بهره منصرف شود، زیرا خطر افزایش بیشتر تورم را در پی دارد، اما من از آن دور می شوم. اکثر کارشناسان بازار معتقدند کاخ سفید نباید بر فدرال رزرو تأثیر بگذارد. تمرکز باید روی سیاست پولی باشد نه سیاست. و نگرانی در مورد اینکه آیا این موضوع تحت رهبری وارش"}, {"source": "Business Insider", "title": "I grew up in New England. Fall is the best time to visit — but first-time tourists often make 4 avoidable mistakes.", "link": "https://www.businessinsider.com/mistakes-tourists-make-new-england-fall-trip-planning-hiking-directions-2026-9", "summary": "I grew up in New England, and regularly come back to visit in the fall. Jordan Charbonneau I grew up in New Hampshire , attended college in Vermont, and return to New England regularly. Fall is the best time to visit this region, but tourists often make preventable mistakes. I suggest staying careful and stocked with supplies on hikes, and double-checking GPS instructions. As a child in New Hampshire, my favorite season was always fall. Autumn meant mountains alight with fiery foliage, crisp air, and no mosquitoes. It was always the perfect time to squeeze in one last camping trip, visit my grandparents at their cabin in Vermont, and watch the changing leaves from scenic hikes and drives. I no longer live in New England, but I still visit regularly — and every year, I watch other tourists make the same mistakes on their trips. Don't just stick to social media for destination inspiration I think Rangeley, Maine, is an underrated place to visit in the fall. DenisTangneyJr/Getty Images Several popular spots — including Bar Harbor, Maine; Woodstock, Vermont; and Salem, Massachusetts — get a lot of love on social media. Although they are beautiful towns , there are many others to explore off the beaten path. Attending college in Vermont's Northeast Kingdom, I'd watch the leaves change on virtually tourist-free dirt roads that snaked their way over rolling hillsides with views of colorful forests patch-worked with ponds, lakes, and pastures. Wander around any rural part of New England, and you'll find some spectacular places with fewer crowds. A few of my top recommendations are Newport, Vermont; Rangeley, Maine; Sturbridge, Massachusetts; and Colebrook, New Hampshire. Many first-time visitors underestimate how dangerous the mountains can be The mountains here are beautiful, but hiking can get dangerous if you re unprepared. Jordan Charbonneau A hike is a quintessential part of any New England foliage itinerary , but it won't be a fun experience if you're not prepared for it. I once shared a few laughs with a family who tried hiking in Crocs — and had to turn around a quarter of the way through their route. Unfortunately, not every misadventure is that humorous. New England weather can be deceptive in autumn, especially in the higher elevations. One evening on the Appalachian Trail in late August, my friends and I ran into a woman huddled in the dark on a log beside the trail. The day had started sunny and warm, but high wind and rain had moved in, and night had", "date_str": "2026-09-16T13:50:01+00:00", "hash": "e45db4b1306ca02b", "title_fa": "من در نیوانگلند بزرگ شدم. پاییز بهترین زمان برای بازدید است - اما گردشگرانی که برای اولین بار بار می‌آیند معمولاً 4 اشتباه قابل اجتناب مرتکب می‌شوند.", "summary_fa": "من در نیوانگلند بزرگ شدم و مرتباً در پاییز برای بازدید از این کشور برمی‌گردم. جردن شاربونو من در نیوهمپشایر بزرگ شدم، در کالج در ورمونت شرکت کردم و مرتباً به نیوانگلند بازمی گشتم. پاییز بهترین زمان برای بازدید از این منطقه است، اما گردشگران اغلب مرتکب اشتباهات قابل پیشگیری می شوند. من پیشنهاد می‌کنم مراقب باشید و در مسیرهای پیاده‌روی با لوازم همراه باشید و دستورالعمل‌های GPS را دوباره بررسی کنید. به عنوان یک کودک در نیوهمپشایر، فصل مورد علاقه من همیشه پاییز بود. پاییز به معنای روشن شدن کوه ها با شاخ و برگ های آتشین، هوای صاف و بدون پشه بود. همیشه زمان مناسبی بود تا در آخرین سفر کمپینگی، از پدربزرگ و مادربزرگم در کلبه‌شان در ورمونت دیدن کنم و تغییر برگ‌ها را از پیاده‌گردی‌ها و رانندگی‌های دیدنی تماشا کنم. من دیگر در نیوانگلند زندگی نمی‌کنم، اما هنوز به طور منظم از آن بازدید می‌کنم - و هر سال، گردشگران دیگر را در سفرهای خود اشتباهات مشابهی را مشاهده می‌کنم. برای الهام گرفتن از مقصد، فقط به رسانه های اجتماعی نچسبید، من فکر می کنم Rangeley، مین، مکانی دست کم گرفته شده برای بازدید در پاییز است. DenisTangneyJr/Getty Images چندین نقطه محبوب - از جمله بار هاربر، مین. ووداستاک، ورمونت؛ و سالم، ماساچوست - عشق زیادی در رسانه های اجتماعی دریافت کنید. اگرچه آنها شهرهای زیبایی هستند، اما بسیاری دیگر برای کاوش در این مسیر وجود دارند. با حضور در کالج در پادشاهی شمال شرقی ورمونت، تغییر برگ‌ها را در جاده‌های خاکی تقریباً عاری از توریست مشاهده می‌کردم که راه خود را بر فراز دامنه‌های تپه‌ای با چشم‌اندازی از جنگل‌های رنگارنگ با حوض‌ها، دریاچه‌ها، و مراتع تغییر می‌دادند. در هر بخش روستایی نیوانگلند پرسه بزنید و مکان های دیدنی با جمعیت کمتر پیدا کنید. چند توصیه برتر من نیوپورت، ورمونت است. رنجلی، مین؛ استوربریج، ماساچوست؛ و"}, {"source": "Business Insider", "title": "Live Q&A: Apple Store pioneer Ron Johnson talks retail strategy, careers, and lessons from Steve Jobs", "link": "https://www.businessinsider.com/apple-retail-strategy-ron-johnson-live-event-2026-9", "summary": "Retail veteran Ron Johnson joins BI Live. Bloomberg / Getty Apple Stores have been a huge win for the brand. What's the secret of their success? Former Apple exec Ron Johnson explains, and shares what's working — and what's not — in retail today. Scroll down to join our live Q A on Thursday at 1:30 p.m. ET. When Ron Johnson joined Apple in 2000, conventional wisdom said the internet would soon make physical stores obsolete. Johnson thought otherwise. In partnership with Apple CEO Steve Jobs , he opened hundreds of Apple Stores, generating millions for the company and introducing Apple products to a new swath of consumers. Johnson's new book, \"Shop Different,\" details the strategy behind the stores and offers a broad look at Johnson's retail career, including his time as CEO of JCPenney and 15 years at Target. Business Insider's Ana Altchek sits down with Johnson in the Business Insider newsroom for a live Q A on Thursday at 1:30 p.m. ET. In addition to discussing Johnson's time at Apple, Altchek will get the retail veteran's take on what's working — and what's not — in retail today. And, as a career and leadership reporter, she'll ask his advice on topics like handling a difficult boss and making a good impression during an interview. Tune in live to ask questions of your own! Read the original article on Business Insider", "date_str": "2026-09-16T13:47:43+00:00", "hash": "45e3fc3ebb4d6fbb", "title_fa": "پرسش و پاسخ زنده: ران جانسون، پیشگام فروشگاه اپل، درباره استراتژی خرده‌فروشی، مشاغل و درس‌هایی از استیو جابز صحبت می‌کند.", "summary_fa": "ران جانسون کهنه کار خرده فروشی به BI Live می پیوندد. بلومبرگ/ فروشگاه های اپل گتی یک پیروزی بزرگ برای این برند بوده است. راز موفقیت آنها چیست؟ ران جانسون، مدیر سابق اپل توضیح می‌دهد و آنچه را که امروز در خرده‌فروشی کار می‌کند – و چه چیزی که نیست – به اشتراک می‌گذارد. برای پیوستن به Q A زنده ما در روز پنجشنبه ساعت 13:30 به پایین بروید. ET. زمانی که ران جانسون در سال 2000 به اپل پیوست، عقل متعارف می‌گفت که اینترنت به زودی فروشگاه‌های فیزیکی را منسوخ خواهد کرد. جانسون طور دیگری فکر می کرد. او با مشارکت مدیر عامل اپل، استیو جابز، صدها فروشگاه اپل را افتتاح کرد و میلیون‌ها دلار برای این شرکت تولید کرد و محصولات اپل را به طیف جدیدی از مصرف‌کنندگان معرفی کرد. کتاب جدید جانسون، \"خرید متفاوت\"، جزئیات استراتژی پشت فروشگاه ها را ارائه می دهد و نگاهی گسترده به حرفه خرده فروشی جانسون، از جمله زمان او به عنوان مدیر عامل JCPenney و 15 سال در Target را ارائه می دهد. آنا آلچک از بیزینس اینسایدر با جانسون در اتاق خبر Business Insider برای یک QA زنده در روز پنجشنبه ساعت 1:30 بعد از ظهر می نشیند. ET. علاوه بر بحث در مورد دوران جانسون در اپل، Altchek نظر پیشکسوت خرده‌فروشی را در مورد آنچه امروز در خرده‌فروشی کار می‌کند – و چه چیزی نیست – خواهد گرفت. و به‌عنوان یک خبرنگار حرفه‌ای و رهبری، او در مورد موضوعاتی مانند رسیدگی به یک رئیس دشوار و ایجاد تأثیر خوب در طول مصاحبه از او راهنمایی خواهد کرد. برای پرسیدن سؤالات خود در لایو هماهنگ شوید! مقاله اصلی را در Business Insider بخوانید"}, {"source": "Business Insider", "title": "I commute from NYC to Washington, DC, every week. It's not so bad — and even my long Amtrak rides have surprising perks.", "link": "https://www.businessinsider.com/commute-new-york-city-to-washington-dc-weekly-amtrak-train-2026-9", "summary": "My commute from New York City to Washington, DC, requires long Amtrak rides each week, and this arrangement has helped my career. Sienna Sullivan I live in New York City but work full-time in Washington, DC, in a hybrid role I enjoy. My job requires me to be in the office twice a week, so I take Amtrak trains and stay with family. I enjoy perks of living in NYC while growing my career in DC and doing freelance work on my commute. It's 5:52 a.m. in Moynihan Train Hall . I'm balancing a container of fruit and my water bottle in one hand while tightening the straps of a backpack that's weighed down by two laptops with the other. It's the start of my twice-weekly commute between New York City and Washington, DC. I'm five months into this supercommute, and I can practically traverse the Northeast Corridor in my sleep. More importantly, I've learned how to turn eight hours on Amtrak trains into one of the most productive parts of my workweek. This arrangement lets me refine my career in DC without leaving NYC I try to catch the high-speed train when I can so I can get some extra sleep. Sienna Sullivan At 26, I'm still early in my career and figuring out which corner of my industry feels most like home. I moved to New York four years ago to broadly pursue publishing and was working in lifestyle journalism when a welcome opportunity to pivot into academic publishing came along. As someone whose soft science degree has been collecting dust in my childhood bedroom closet, I was excited by the chance to do something new, something that would satisfy the research-loving part of my brain. The only catch, as you might have guessed, was that this career pivot seemed to involve a move to Washington, DC . The full-time, hybrid role required me to be in the office on Mondays and Wednesdays. I take Amtrak trains for my commute. Sienna Sullivan If the only thing standing between me and what I hoped would be a career-refining opportunity was a twice-weekly office requirement, and the fact that I wasn't ready to leave the life I'd built in New York, who's to say I couldn't, in the spirit of early-2000s icon Hannah Montana, get the best of both worlds? Before accepting the role, I weighed everything from ticket costs to the risk of commuting burnout. I knew I'd have to be vigilant about monitoring Amtrak flash sales and planning my trips well in advance, but by booking tickets five to six weeks ahead, I could keep my train costs to around $100 round trip. Just as importantly, ha", "date_str": "2026-09-16T12:45:01+00:00", "hash": "7a939b753385573c", "title_fa": "من هر هفته از نیویورک به واشنگتن دی سی می روم. آنقدرها هم بد نیست - و حتی سواری های طولانی امتراک من مزایای شگفت انگیزی دارد.", "summary_fa": "رفت و آمد من از شهر نیویورک به واشنگتن دی سی، به سفرهای طولانی آمتراک در هر هفته نیاز دارد، و این ترتیب به حرفه من کمک کرده است. سینا سالیوان من در شهر نیویورک زندگی می کنم اما به طور تمام وقت در واشنگتن دی سی کار می کنم، در یک نقش ترکیبی که از آن لذت می برم. شغل من مستلزم این است که هفته ای دو بار در دفتر باشم، بنابراین با قطارهای آمتراک می روم و در کنار خانواده می مانم. من از مزایای زندگی در نیویورک لذت می برم، در حالی که شغلم را در دی سی رشد می کنم و در رفت و آمدم کار آزاد انجام می دهم. ساعت 5:52 صبح در سالن قطار موینیهان است. یک ظرف میوه و بطری آب را در یک دستم متعادل می کنم در حالی که با دست دیگر بند یک کوله پشتی را که دو لپ تاپ آن را سنگین می کند، محکم می کنم. این آغاز رفت و آمد دو بار در هفته من بین شهر نیویورک و واشنگتن دی سی است. من پنج ماه در این سوپر رفت و آمد هستم و عملاً می توانم کریدور شمال شرق را در خواب طی کنم. مهمتر از آن، من یاد گرفته ام که چگونه هشت ساعت در قطارهای آمتراک را به یکی از پربازده ترین بخش های هفته کاری خود تبدیل کنم. این ترتیب به من امکان می‌دهد بدون ترک نیویورک، حرفه‌ام را در دی سی اصلاح کنم. سعی می‌کنم تا زمانی که بتوانم قطار پرسرعت را بگیرم تا بتوانم بیشتر بخوابم. سینا سالیوان در سن 26 سالگی، من هنوز در ابتدای کارم هستم و می‌دانم کدام گوشه از صنعت من بیشتر شبیه خانه‌ام است. چهار سال پیش به نیویورک نقل مکان کردم تا به طور گسترده کار نشر را دنبال کنم و در روزنامه نگاری"}, {"source": "Business Insider", "title": "Sam Altman says some AI accidents are 'unavoidable'", "link": "https://www.businessinsider.com/sam-altman-ai-accidents-unavoidable-safety-openai-apocalypse-2026-9", "summary": "OpenAI CEO Sam Altman says AI accidents will happen, so companies must report and learn from them. Carlos Barria/Reuters OpenAI CEO Sam Altman said some AI accidents are unavoidable as models grow more capable. He said AI should adopt the FAA and NTSB's culture of reporting and learning from accidents. His remarks come as AI safety researchers warn that frontier labs are \"gambling with our lives.\" Sam Altman says some AI accidents are unavoidable, but it's how you learn from them. Speaking at Salesforce's Dreamforce conference on Tuesday, the OpenAI CEO said tech companies should embrace a culture of transparent accident reporting , similar to that of the aviation industry. \"I do think that some degree of accidents are unavoidable with new technology,\" Altman said. \"What I really care about is that we have got a great culture of accident reporting and learning.\" He cited the Federal Aviation Administration and the National Transportation Safety Board as examples the AI industry should follow, saying the agencies' emphasis on investigating incidents has helped make flying safer. \"You know, accidents are going to happen,\" he said of the FAA's and NTSB's approach. \"We're going to learn as much as we can and react from each one.\" Altman's comments come as the AI industry faces renewed questions about whether its biggest labs are moving too quickly toward powerful autonomous systems. Jacob Coxon, a researcher who quit Anthropic last week and previously worked at OpenAI, kickstarted a debate by saying that the companies were \"racing straight to self-improving superintelligence and gambling with our lives .\" 'The world is right to be afraid of this' Other AI safety researchers have since told Business Insider that advanced systems could one day evade human control or make cyber, biological, and other catastrophic threats easier to carry out — although they would face hurdles in accessing the physical world . Altman acknowledged that AI doomsday fears are legitimate. \"The world is right to be afraid of this,\" he said at Dreamforce, pointing to the possibility of a loss-of-control accident and the risk that a small number of AI developers could concentrate too much power. He said that the answer is not to abandon the technology, and that AI companies must instead ensure that \"alignment and safety and monitoring\" remain \"way ahead of capabilities.\" He added that they should also be prepared \"to slow down or stop\" if they cannot do so. His comments may also sharpen a", "date_str": "2026-09-16T12:18:40+00:00", "hash": "34ad7e69132986c0", "title_fa": "سام آلتمن می گوید برخی از تصادفات هوش مصنوعی «غیرقابل اجتناب» هستند", "summary_fa": "سام آلتمن، مدیر عامل OpenAI می گوید حوادث هوش مصنوعی اتفاق خواهند افتاد، بنابراین شرکت ها باید گزارش دهند و از آنها درس بگیرند. کارلوس باریا/ مدیر عامل رویترز اوپن‌آی
