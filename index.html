      --text: #f1f5f9;

      --primary-hover: #0284c7;
      --badge-bg: rgba(56, 189, 248, 0.15);
      --tab-bg: #151d30;
      --tab-border: #232f48;
      --tab-text: #94a3b8;
      --tab-active-bg: #38bdf8;
      --tab-active-text: #0f172a;
      --search-bg: #151d30;
      --search-border: #232f48;
      --toggle-bg: #1e293b;
      --toggle-border: #334155;
      --modal-bg: #151d30;
      --modal-border: #334155;
      --read-bg: #0d1322;
      --read-border: #1e293b;
      --success: #10b981;
    }
    :root[data-theme="light"] {
      --bg: #f8fafc;
      --header-bg: linear-gradient(135deg, #ffffff, #f1f5f9);
      --card-bg: #ffffff;
      --card-border: #e2e8f0;
      --text: #0f172a;
      --text-muted: #64748b;
      --primary: #0284c7;
      --primary-hover: #0369a1;
      --badge-bg: rgba(2, 132, 199, 0.1);
      --tab-bg: #ffffff;
      --tab-border: #e2e8f0;
      --tab-text: #64748b;
      --tab-active-bg: #0284c7;
      --tab-active-text: #ffffff;
      --search-bg: #ffffff;
      --search-border: #cbd5e1;
      --toggle-bg: #f1f5f9;
      --toggle-border: #cbd5e1;
      --modal-bg: #ffffff;
      --modal-border: #cbd5e1;
      --read-bg: #f1f5f9;
      --read-border: #e2e8f0;
      --success: #059669;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Dastkhat', -apple-system, BlinkMacSystemFont, Tahoma, sans-serif;
    }
    body {
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.8;
      padding: 20px 12px;
      direction: rtl;
      transition: background-color 0.3s ease, color 0.3s ease;
    }
    .container {
      max-width: 880px;
      margin: 0 auto;
    }
    header {
      background: var(--header-bg);
      border: 1px solid var(--card-border);
      border-radius: 18px;
      padding: 22px 20px;
      margin-bottom: 20px;
      position: relative;
      text-align: center;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
      transition: all 0.3s ease;
    }
    .header-actions {
      position: absolute;
      top: 18px;
      left: 18px;
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .btn-action {
      background: var(--toggle-bg);
      border: 1px solid var(--toggle-border);
      color: var(--text);
      padding: 7px 12px;
      border-radius: 12px;
      cursor: pointer;
      font-size: 0.85rem;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-weight: 600;
      transition: all 0.2s ease;
    }
    .btn-action:hover {
      border-color: var(--primary);
    }
    h1 {
      font-size: 1.7rem;
      font-weight: 800;
      margin-bottom: 6px;
    }
    .meta-bar {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin-top: 12px;
      font-size: 0.85rem;
      color: var(--text-muted);
    }
    .meta-tag {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      padding: 4px 12px;
      border-radius: 9999px;
    }
    .search-box {
      margin-bottom: 18px;
    }
    .search-input {
      width: 100%;
      padding: 13px 18px;
      border-radius: 12px;
      background: var(--search-bg);
      border: 1px solid var(--search-border);
      color: var(--text);
      font-size: 0.95rem;
      outline: none;
      transition: all 0.2s ease;
    }
    .search-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2);
    }
    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      padding-bottom: 4px;
    }
    .tabs::-webkit-scrollbar {
      display: none;
    }
    .tab-btn {
      flex: 1;
      white-space: nowrap;
      padding: 12px 14px;
      border-radius: 12px;
      background: var(--tab-bg);
      border: 1px solid var(--tab-border);
      color: var(--tab-text);
      font-size: 0.92rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s ease;
      flex-shrink: 0;
    }
    .tab-btn.active {
      background: var(--tab-active-bg);
      color: var(--tab-active-text);
      border-color: var(--tab-active-bg);
    }
    .badge {
      background: rgba(0, 0, 0, 0.15);
      padding: 2px 7px;
      border-radius: 9999px;
      font-size: 0.8rem;
    }
    .news-grid {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .news-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 20px;
      transition: all 0.25s ease;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.03);
      position: relative;
    }
    .news-card:hover {
      border-color: var(--primary);
      transform: translateY(-2px);
    }
    .news-card.is-read {
      background: var(--read-bg);
      border-color: var(--read-border);
      opacity: 0.7;
    }
    .news-card.is-read:hover {
      opacity: 0.95;
    }
    .news-header {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 12px;
    }
    .news-num {
      background: var(--badge-bg);
      color: var(--primary);
      font-weight: 700;
      font-size: 0.85rem;
      min-width: 30px;
      height: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      margin-top: 2px;
      flex-shrink: 0;
    }
    .news-card.is-read .news-num {
      background: rgba(16, 185, 129, 0.15);
      color: var(--success);
    }
    .news-title {
      font-size: 1.1rem;
      font-weight: 700;
      line-height: 1.6;
      flex: 1;
    }
    .news-summary {
      font-size: 0.94rem;
      color: var(--text-muted);
      margin-bottom: 14px;
      text-align: justify;
      line-height: 1.75;
    }
    .news-footer {
      display: flex;
      flex-direction: column;
      gap: 10px;
      border-top: 1px solid rgba(128, 128, 128, 0.12);
      padding-top: 12px;
      font-size: 0.85rem;
    }
    .footer-top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
    }
    .meta-group {
      display: inline-flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      font-size: 0.82rem;
    }
    .news-source {
      color: var(--text-muted);
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .news-datetime {
      color: var(--text-muted);
      font-size: 0.78rem;
      background: rgba(148, 163, 184, 0.08);
      padding: 2px 7px;
      border-radius: 6px;
      border: 1px solid rgba(148, 163, 184, 0.15);
    }
    .news-category-badge {
      display: inline-flex;
      align-items: center;
      background: var(--badge-bg);
      color: var(--primary);
      border: 1px solid rgba(56, 189, 248, 0.25);
      border-radius: 6px;
      padding: 2px 8px;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .news-category-badge:hover {
      background: var(--primary);
      color: #0f172a;
      transform: translateY(-1px);
    }
    .footer-tags-row {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
    }
    .news-tag-chip {
      display: inline-flex;
      align-items: center;
      font-size: 0.75rem;
      color: var(--text-muted);
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--card-border);
      padding: 1px 7px;
      border-radius: 5px;
      cursor: pointer;
      transition: all 0.2s ease;
      font-weight: 500;
    }
    .news-tag-chip:hover {
      color: var(--primary);
      border-color: var(--primary);
      background: var(--badge-bg);
      transform: translateY(-1px);
    }
    .footer-bottom-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      border-top: 1px dashed rgba(128, 128, 128, 0.12);
      padding-top: 10px;
      margin-top: 4px;
    }
    .footer-actions-right {
      display: flex;
      align-items: center;
    }
    .footer-actions-left {
      display: flex;
      align-items: center;
      margin-right: auto;
    }
    .btn-mark-read {
      background: transparent;
      border: 1px solid var(--toggle-border);
      color: var(--text-muted);
      padding: 4px 10px;
      border-radius: 8px;
      font-size: 0.8rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-weight: 600;
      transition: all 0.2s ease;
    }
    .btn-mark-read:hover {
      border-color: var(--success);
      color: var(--success);
    }
    .news-card.is-read .btn-mark-read {
      background: rgba(16, 185, 129, 0.15);
      border-color: var(--success);
      color: var(--success);
    }
    .news-link {
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
      transition: color 0.2s ease;
    }
    .news-link:hover {
      text-decoration: underline;
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 16px;
    }
    .modal-overlay.active {
      display: flex;
    }
    .modal-card {
      background: var(--modal-bg);
      border: 1px solid var(--modal-border);
      border-radius: 18px;
      width: 100%;
      max-width: 520px;
      max-height: 80vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
      animation: modalFadeIn 0.2s ease;
    }
    @keyframes modalFadeIn {
      from { transform: scale(0.95); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
    .modal-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--card-border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .modal-title {
      font-size: 1.15rem;
      font-weight: 700;
    }
    .btn-close {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 1.4rem;
      cursor: pointer;
      line-height: 1;
      padding: 4px;
    }
    .btn-close:hover {
      color: var(--text);
    }
    .modal-body {
      padding: 16px 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .archive-item {
      background: var(--bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      text-decoration: none;
      color: var(--text);
      transition: all 0.2s ease;
    }
    .archive-item:hover {
      border-color: var(--primary);
      transform: translateX(-4px);
    }
    .archive-date-fa {
      font-weight: 700;
      font-size: 0.95rem;
    }
    .archive-date-g {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 2px;
    }
    .archive-arrow {
      color: var(--primary);
      font-size: 1.1rem;
    }

    @media (max-width: 640px) {
      header { padding: 18px 14px; padding-top: 56px; }
      .header-actions { top: 12px; left: 12px; width: calc(100% - 24px); justify-content: space-between; }
      .btn-action { font-size: 0.78rem; padding: 6px 9px; }
      h1 { font-size: 1.35rem; }

      .tab-btn { padding: 10px 10px; font-size: 0.84rem; gap: 6px; }
      .badge { padding: 1px 5px; font-size: 0.75rem; }
      .news-card { padding: 16px; }
      .news-title { font-size: 0.98rem; }
      .news-summary { font-size: 0.88rem; }
      .news-footer { flex-direction: column; align-items: stretch; gap: 10px; }
      .footer-bottom-row { width: 100%; display: flex; justify-content: space-between; align-items: center; }
    }
  </style>
</head>

لار آغاز می کند", "summary_fa": "انتظار می رود که استارتاپ هوش مصنوعی و سازنده ربات چت کلود تبدیل به یکی از با ارزش ترین مشاغل عمومی شود. قطع، جاسوس و عرضه اولیه عمومی تریلیون دلاری: آیا این آینده هوش مصنوعی ماست؟ – استاتید با کای و کارتر آنتروپیک روز پنجشنبه پس از افزایش بیشترین میزان سرمایه گذاری در تاریخ برای عرضه اولیه عمومی، در بازار سهام ایالات متحده عرضه شد. داریو آمودی، مدیر اجرایی آنتروپیک، زنگ افتتاح نزدک را به صدا درآورد. آمودی گفت: «امروز شرکت را در موقعیت مالی قوی‌تری قرار می‌دهد و با انجام این کار، تنها عزم ما را برای انجام کار درست تقویت می‌کند.» به خواندن ادامه دهید... معاملات عمومی با قیمت 83 دلار به ازای هر سهم آغاز می شود که بالاتر از محدوده مورد انتظار تعیین شده در هفته گذشته است و ارزش بازار کاملاً کاهش یافته شرکت را به 1.5 تریلیون دلار می رساند. بلومبرگ و رویترز گزارش دادند، با این حال، انتظار می رود پس از شروع معاملات، سهام با 20 درصد افزایش به حدود 100 دلار در هر سهم برسد. آنتروپیک روز چهارشنبه اعلام کرد که 980 میلیون سهام را به پذیره‌نویس‌ها فروخته است، پیشنهادی بزرگ که 81.3 میلیارد دلار جمع‌آوری کرد و از رکورد قبلی جمع‌آوری سرمایه اولیه 75 میلیارد دلاری اسپیس ایکس در ژوئن فراتر رفت. انتظار می رود این استارت آپ هوش مصنوعی که ربات چت کلود را می سازد، به یکی از با ارزش ترین تجارت های عمومی در جهان تبدیل شود، اگرچه تنها در سال 2021 تأسیس شد. فهرست این شرکت به عنوان اولین آزمایشگاه مرزی که به صورت عمومی معامله می شود، به عنوان زنگ خطری برای رشد هوش مصنوعی چند تریلیون دلاری عمل خواهد کرد. سرمایه گذاران وال استریت و کل صنعت فناوری جهانی از نزدیک نحوه عملکرد آن در بازار عمومی را دنبال می کنند. طبق دفترچه سرمایه", "image_url": "https://i.guim.co.uk/img/media/6998f4e0d8ab24e4c35516c1ab618511a39fcd71/545_0_4583_3667/master/4583.jpg?width=1200&height=630&quality=85&auto=format&fit=crop&precrop=40:21,offset-x50,offset-y0&overlay-align=bottom%2Cleft&overlay-width=100p&overlay-base64=L2ltZy9zdGF0aWMvb3ZlcmxheXMvdGctZGVmYXVsdC5wbmc&enable=upscale&s=67f920609d7fe7e802fb6fb7367b042b", "category": "هوش مصنوعی مولد", "tags": ["هوش مصنوعی", "Anthropic", "بورس و ut $45,000. It helped me become a homeowner and dodge a mortgage, but there are still some pricey expenses. I don't plan on living here forever, but I still think it was a smart financial investment. As someone in their 20s, becoming a homeowner has always felt a bit out of reach for me. For the past few years, I've wanted to own something, live a simpler life, and make a smart financial decision. There was just one problem: beyond feeling like I couldn't afford to buy a traditional house or condo, I didn't want to have a mortgage or be responsible for a big space. I also didn't want to live in an apartment, since I'd be paying rent on something I didn't even own. So, to make this dream a reality, I started thinking about building my own place in my home state of Washington. I'd seen a lot of people my age online making the jump to live in a tiny home , and I decided this was going to be my next move. After looking at prices online, I thought it might be cheaper to build one from scratch than to buy a preassembled one. I proposed the idea to my dad, knowing I would need his help with physical labor to make this goal possible. He said yes, and from there I made the biggest purchase — the trailer bed that the home would sit on. With the money in my savings and labor assistance from some family members, I built the 224-square-foot home — with an extra 149 square feet of loft space . I also took on multiple jobs to help pay for the materials as the project continued. After nearly two years of building and roughly $45,000 spent, my home was complete. Unfortunately, this price tag was just the beginning, and now, nearly five years into living in my tiny home, I still haven't fully escaped the ongoing costs of homeownership. I avoided a traditional mortgage, but not all housing expenses The rent for the plot of land my home sits on is $650 a month. Amanda Bloomquist My tiny home is about the size of a standard studio apartment , but my friends have said it feels a lot bigger. Despite it being small, I've been able to make the most out of the space. I have a full-size kitchen, a bathroom with a washer and dryer, a full-size bed in my loft, an L-shaped couch, a large projector screen, and a garden outside. But even with a comfortable setup, owning a tiny h", "date_str": "2026-11-19T15:17:01+00:00", "hash": "ab20184b2ce1fd1c", "title_fa": "خانه‌داری سنتی در دهه 20م دور از دسترس احساس می‌شد، بنابراین خانه‌ای کوچک 45000 دلاری از ابتدا ساختم.", "summary_fa": "من فکر نمی کردم بتوانم در دهه 20 سالگی خانه ای بخرم، بنابراین خانه کوچک خودم را از ابتدا با قیمت 45000 دلار ساختم. آلخاندرو سانچز اوچوا وقتی در اوایل 20 سالگی بودم، خانه کوچک 224 فوت مربعی خود را با قیمت حدود 45000 دلار از ابتدا ساختم. این به من کمک کرد تا صاحب خانه شوم و از وام مسکن طفره بروم، اما هنوز هم هزینه های گرانی وجود دارد. من قصد ندارم برای همیشه در اینجا زندگی کنم، اما هنوز فکر می کنم این یک سرمایه گذاری مالی هوشمندانه بود. به عنوان فردی در 20 سالگی، خانه دار شدن همیشه برای من دور از دسترس بوده است. در چند سال گذشته، می‌خواستم مالک چیزی باشم، زندگی ساده‌تری داشته باشم و تصمیم مالی هوشمندانه‌ای بگیرم. فقط یک مشکل وجود داشت: فراتر از اینکه احساس می کردم نمی توانم یک خانه سنتی یا کاندو بخرم، نمی خواستم وام مسکن داشته باشم یا مسئولیت یک فضای بزرگ را بر عهده بگیرم. من همچنین نمی‌خواستم در آپارتمان زندگی کنم، زیرا می‌توانستم برای چیزی که حتی مالک آن نبودم، اجاره بپردازم. بنابراین، برای تحقق بخشیدن به این رویا، به فکر ساختن مکان خود در ایالت زادگاهم واشنگتن افتادم. بسیاری از افراد هم سن و سال خود را به صورت آنلاین دیده بودم که برای زندگی در یک خانه کوچک جهش می کردند، و تصمیم گرفتم این حرکت بعدی من باشد. پس از بررسی قیمت‌های آنلاین، فکر کردم ساختن یکی از ابتدا ارزان‌تر از خرید یک نمونه از پیش مونتاژ شده است. من این ایده را به پدرم پیشنهاد دادم، زیرا می‌دانستم برای انجام این هدف به کمک او برای انجام کار فیزیکی نیاز دارم. او گفت بله، و از آنجا من بزرگترین خرید را انجام دادم - تخت تریلر که خانه روی آن می نشست. با پول پس انداز و کمک های کارگری", "image_url": "https://i.insider.com/6af7 ditions that favor the formation of fine particulate matter, a pollutant that can cause heart attacks, stroke, and lung disease. The researchers say these results underscore the importance of considering unintended regional health impacts of data centers, and how the location and operations of these facilities affect public health on a broader scale. “When people think about the negative impacts of data centers, they usually focus on the neighbors. But our study indicates that the air quality impacts of data centers are very widespread across a large region. Even if you don’t think you are affected because there is not a data center near you, think again,” says Noelle Selin, a professor in the MIT Institute for Data, Systems, and Society (IDSS) and the Department of Earth, Atmospheric and Planetary Sciences (EAPS); director of the Center for Sustainability Science and Strategy; and senior author of the study. Selin is joined on the paper by Yuang (Albert) Chen, an MIT graduate student; as well as others at MIT, the University of California at Irvine, and Yale University. The research appears today in Environmental Research Letters . Capturing regional impacts The Lawrence Berkeley National Laboratory estimated that electricity demands of data centers represented about 4 percent of total U.S. energy demand in 2023 and resulted in about 4.4 percent of the nation’s overall emissions. That proportio", "date_str": "2026-11-19T14:00:00+00:00", "hash": "890219adbd50fdad", "title_fa": "مطالعه آسیب‌های طولانی مدت مراکز داده به کیفیت هوا را نشان می‌دهد", "summary_fa": "بر اساس مطالعه جدیدی که توسط محققان MIT انجام شده است، گسترش سریع مراکز داده برای هوش مصنوعی باعث اثرات منفی بر سلامت و کیفیت هوا در مناطق دور از محل استقرار تاسیسات آجر و ملات می شود. این تیم تخمین می‌زند که آلودگی هوای اضافی ناشی از نیاز برق مراکز داده در سال 2023 منجر به مرگ 650 مرگ زودرس در سراسر ایالات متحده شد. برخی از ایالت های غرب میانه در میان بالاترین نرخ های تخمین زده شده مرگ و میرهای زودرس ناشی از م , and how you balance running a media business that has to make money with a newsroom that, ultimately, has a political mission and a strong point of view. Of course, AI. Jon has turned his own podcast Offline into something close to an AI policy show this year. He has a lot of thoughts on how Congress ", "date_str": "2026-11-19T15:00:00+00:00", "hash": "e7251aae17e03ca3", "title_fa": "چگونه سیلیکون ولی با جان فاورو از Crooked Media عموم مردم را از دست داد", "summary_fa": "امروز، من با جان فاورو، مفسر سیاسی و یکی از بنیانگذاران Crooked Media صحبت می کنم. احتمالاً جان را بهتر از یک برنامه کوچک به نام Pod Save America می‌شناسید، که جان با گروهی از همکاران اوباما در پی انتخاب دونالد ترامپ در سال 2016 شروع کرد. این پادکست اکنون یکی از محبوب‌ترین پادکست‌ها در کشور است. از آن زمان، Pod Save America و شرکتی که پیرامون آن ایجاد شد، Crooked، به یکی از موفقیت‌های اصلی رسانه‌های لیبرال مستقل تبدیل شده‌اند. بنابراین یکی از سؤالات اصلی من برای جان این بود که چرا او فکر می‌کرد که دموکرات‌ها در اوایل این ماه در میان دوره‌ای قرار گرفتند و مهم‌تر از آن، چرا این اتفاق در حال حاضر رخ داد - به‌ویژه پس از اینکه موجی از میلیاردرهای فناوری نوسانات بزرگی را به سمت راست انجام دادند و ستون‌های عظیمی از اکوسیستم اطلاعاتی را خریداری کردند. این یعنی ایلان ماسک که توییتر را می‌خرد و آن را به X تبدیل می‌کند، مارک زاکربرگ در حالی که زیرساخت تعدیل محتوای متا را از بین می‌برد، خانواده الیسون سهام TikTok را می‌خرد، رهبری CBS News و اکنون بالقوه CNN را واگذار می‌کند در حالی که وارنر را در Skydance ادغام می‌کند... این لیست ادامه دارد. چگونه همه آنها نوسان عظیم خلق و خوی مردم را از دست دادند - یا به شکل آخرالزمانی تر، در تلاش برای کنترل رسانه ها و در نتیجه تأثیرگذاری بر مردم شکست خوردند؟ مشترکین همیشگی، فراموش نکنید که از هر جا که پادکست های خود را دریافت می کنید، به Decoder بدون آگهی دسترسی انحصاری دارید. به اینجا سر بزن مشترک نیستید؟ می توانید در اینجا ثبت نام کنید. Crooked نیز مانند همه مشاغل سازنده، فقط یک تجارت جذاب است. وقتی به آنچه شما ممکن است خالقان خبر بنامید فکر می‌کنیم، تمایل داریم به سمت را ": "6bce2445f12f71a3", "title_fa": "با بزرگترین IPO در تمام دوران، شهرت «مرد خوب» آنتروپیک در خط است", "summary_fa": "امروز شروع جدیدی برای آنتروپیک است: یک IPO سال‌های بعد که اسپیس ایکس را برای باارزش‌ترین زمان‌ها شکست داد و ۸۱.۳ میلیارد دلار جمع‌آوری کرد و سابقه مهمی را برای دیگر آزمایشگاه‌های عمومی هوش مصنوعی در آینده ایجاد کرد. اما این فقط یک نقطه عطف مالی نیست. Anthropic بر این ایده بنا شد که ایمنی را بیش از سایر آزمایشگاه ها در اولویت قرار می دهد. بنیانگذاران آن سمت های تحقیقاتی اجرایی در OpenAI را ترک کرده بودند. با افزایش سرعت مسابقه هوش مصنوعی، مدیران آن تاکید کرده اند که آنتروپیک تنها با قرار گرفتن در رتبه اول می تواند این ماموریت را انجام دهد، که نیاز به پول و محاسبات زیادی دارد. به طور شگفت‌انگیزی، هوش مصنوعی متفکرانه، ایمن و عمدی توسعه می‌یابد… داستان کامل را در The Verge بخوانید. گزارش خط مشی هوش مصنوعی با بزرگترین IPO در تمام دوران ها، شهرت «مرد خوب» آنتروپیک در خط است ساختار قدرت غیرمعمول Anthropic به آن اجازه می دهد آینده هوش مصنوعی را شکل دهد. Hayden Field ۱۹ نوامبر ۲۰۲۶، ساعت ۲:۲۵ بعد از ظهر UTC Link Share Gift Image: The Verge AIPO Guod Policys, The Verge AIPO Guod of All time شهرت در خط است ساختار قدرت غیرمعمول آنتروپیک به آن اجازه می دهد تا آینده هوش مصنوعی را شکل دهد. یکی از کارمندان سابق آنتروپیک، که پیش از عرضه اولیه اولیه سهام شرکت را ترک کرد، گفت که او و سایرین در آنتروپیک به طور فزاینده ای احساس می کنند که سرعت فعلی توسعه هوش مصنوعی «در ساختارهای عادی بازار غیرقابل دفاع است»، به ویژه با وجود انگیزه های ناهماهنگ صنعت قدرتمند که در بازی وجود ندارد. آنتروپیک سال‌ها هزینه خود را به عنوان متفاوت و محتاط‌تر از سایر شرکت‌های هوش مصنوعی اعلام کرده است. از نظر تئوری، این به برنامه آن برای عمومی شدن گسترش می یابد.", "image_url": "https://platform.theverge.com/wp-content/uploads/sites/2/2026/03/STK202_DARIO_AMODEI_CVIRGINIA_D.jpg?quality=90&strip=all&crop=0%2C10.732984293194%2C100%2C78.534031413613&w=1200", "category": "هوش مصنوعی مولد", "tags": ["هوش مصنوعی", "OpenAI", "Anthropic", "بورس و طلا"], "datetime_fa": "۲۸ آبان • ۱۷:۵۵"}, {"source": "Ars Technica", "title": "Mouse fight club might explain why we like to watch violent things", "link": "https://arstechnica.com/science/2026/11/watching-mouse-fight-club-teaches-the-critters-how-to-fight/", "summary": "Credit: J.M. Iravedra-Garcia et al., 2026 Credit: J.M. Iravedra-Garcia et al., 2026 There's something about watching violent events that broadly appeals to us, whether it's the latest John Wick movie, a video game, or a live UFC bout. Scientists have debated whether watching violent things could make us more aggressive, but it could also be an adaptive survival strategy. Male mice, for instance, who watch other mice fighting learned enough about how to fight to better protect themselves (compared to mice who didn't watch fights) when pitted against stronger, more aggressive opponents, according to a paper published in the journal Nature. The team assigned male mice randomly to three different groups—fighters, spectators, or novices—and then subjected each group to eight days of training involving three 10-minute sessions per day. The novices played with stuffed mice in isolation, while the spectators watched various pairs of fighter mice battle it out from a raised platform behind a transparent barrier—a set-up chosen to let them smell and listen to the fights as well as observe them. The ninth day was \"fight night,\" when all the mice had to face a daunting opponent in three 4-minute rounds. Each fight was filmed from above so that the mouse behavior could be analyzed. To monitor corresponding changes in brain activity, the team engineered the rodents' excitatory brain cells to glow green whenever they were activated, while inhibitory brain cells glowed red. They also implanted tiny optical fibers into 12 interconnected brain regions so they could track changing activity in every brain region simultaneously. Read full article Comments", "date_str": "2026-11-19T14:04:38+00:00", "hash": "97b39d71a1ec750e", "title_fa": "باشگاه مبارزه موش ممکن است توضیح دهد ک ategory": "موبایل و گجت‌ها", "tags": ["Apple"], "datetime_fa": "۲۸ آبان • ۱۷:۳۰"}, {"source": "Business Insider", "title": "I made Ina Garten's easy sheet-pan fish. With only 6 ingredients, this dish is my new favorite easy dinner.", "link": "https://www.businessinsider.com/ina-garten-easy-dinner-recipe-sheet-pan-fish-2026-11", "summary": "This fish recipe was easy to make, but tasted elevated. Lizzy Briskin I tried Ina Garten's sheet-pan, mustard-roasted fish recipe, which calls for just six ingredients. The dish came together quickly, and the sauce was tangy and rich. I'll definitely make this dish again, both for easy meals and dinner parties with friends. Whenever I'm looking for a simple dinner recipe , I pick up an Ina Garten cookbook. The Barefoot Contessa is known for her no-fuss recipes that deliver big on flavor, and she's rarely led me astray. So, when I came across a 2008 recipe for mustard-roasted fish , cooked on a sheet pan and ready in under 30 minutes, I had to give it a try. Now, this elegant fish dish has become my go-to for easy meals and dinner parties alike. It's just fancy enough without being complicated. The ingredients are simple but flavorful. captiontk Lizzy Briskin You don't need a long list of ingredients for this fish recipe. The first, of course, is the fish, and though Garten suggests red snapper, you can use the sauce in this recipe on most varieties of fish, from salmon to tilapia. I recommend something flaky and flat — think cod, rather than swordfish or tuna — because the flavor-packed sauce livens up milder seafood. I used Wild Alaska Sole , which is also sometimes labeled flounder. Speaking of sauce, the fish is absolutely drenched in a rich, tangy combination of crème fraîche, two mustards (Dijon and whole-grain), shallots, and capers. The mustard duo brings acidity and a bit of a back-of-the-throat heat to the dish, while capers add lovely brininess and shallots add some bite and texture. Finally, crème fraîche, a high-fat cultured dairy product, is less tangy than sour cream but wonderfully rich — exactly what a lean fish fillet needs. The dish takes under 10 minutes to prep. captiontk Lizzy Briskin If your fish is frozen, be sure to defrost it first. Then, the recipe comes together in a snap. First, arrange the fillets on a baking sheet or in a baking dish. I used five fillets instead of four, as mine were thinner and smaller than the 8-ounce fillets Garten recommends. Don't worry if they overlap; you're not looking for crispiness in this recipe, so there's little risk of overcrowding the pan. Then, it's time to whip up the sauce. Simply stir everything together in a bowl, then cover the fish evenly. The goal is to cover the fish in sauce, but they don't need to be swimming in it (no pun intended). I cooked the fish in under 20 minutes, then topped ", "date_str": "2026-11-19T14:47:03+00:00", "hash": "853b938e1d89e6b3", "title_fa": "ماهی ورقه ای آسان اینا گارتن درست کردم. این غذا تنها با 6 ماده، شام جدید مورد علاقه من است.", "summary_fa": "این دستور پخت ماهی آسان بود، اما طعم آن بالا بود. Lizzy Briskin من دستور پخت ماهی برشته شده با خردل اینا گارتن را امتحان کردم که فقط 6 ماده لازم دارد. ظرف به سرعت جمع شد، و سس تند و غنی بود. حتما دوباره این غذا را درست می کنم، هم برای غذای آسان و هم برای مهمانی های شام با دوستان. هر زمان که به دنبال یک دستور غذای ساده برای شام هستم، کتاب آشپزی Ina Garten را برمی دارم. کونتسا پابرهنه به خاطر دستور العمل های بی سر و صداش که طعم و مزه خوبی ارائه می دهد، شناخته شده است و به ندرت مرا به بیراهه می کشاند. بنابراین، هنگامی که در سال 2008 با دستور پخت ماهی برشته شده خردل مواجه شدم که در یک تابه پخته شده بود و در کمتر از 30 دقیقه آماده شد، مجبور شدم آن را امتحان کنم. اکنون، این غذای ماهی شیک برای من برای وعده های غذایی آسان و مهمانی های شام به طور یکسان تبدیل شده است. این فقط به اندازه کافی فانتزی است بدون اینکه پیچیده باشد. مواد اولیه ساده اما خوش طعم هستند. captiontk Lizzy Briskin برای این دستور ماهی نیازی به لیست طولانی مواد ندارید. البته اولین مورد، ماهی است، و اگرچه گارتن اسنپ قرمز را پیشنهاد می کند، می توانید از سس در این دستور غذا بر روی اکثر انواع ماهی، از ماهی آزاد گرفته تا تیلاپیا استفاده کنید. من چیزی پوسته پوسته و مسطح را توصیه می کنم - به جای شمشیر ماهی یا ماهی تن به ماهی کاد فکر کنید - زیرا سس پر طعم غذای دریایی ملایم تری را زنده می کند. من از Wild Alaska Sole استفاده کردم که گاهی اوقات به آن برچسب flounder نیز می گویند. وقتی صحبت از سس شد، ماهی کاملاً از ترکیبی غنی و", "image_url": "https://i.insider.com/6afcae6cbcc92b799fa7ed7e?width=1200&format=jpeg", "category": "هوش مصنوعی مولد", "tags": ["فناوری", "نوآوری"], "datetime_fa": "۲۸ آبان • ۱۸:۱۷"}, {"source": "Business Insider", "title": "15 Thanksgiving sides you can make in a slow cooker or Crock-Pot", "link": "https://www.businessinsider.com/thanksgiving-sides-slow-cooker-crock-pot", "summary": "From stuffing and mac and cheese to crowd-pleasing dips, these Thanksgiving sides can all be prepared in a slow cooker. DronG/Getty Images A slow cooker or Crock-Pot can make cooking easier on Thanksgiving Day . You can make classic side dishes in a slow cooker, from stuffing to cranberry sauce. You can even make dinner rolls and mashed potatoes in a slow cooker . Everyone knows that when it comes to Thanksgiving food , the sides are the best dishes. With the oven tied up for hours roasting the turkey, finding space for every side dish can be a challenge. That's where a Crock-Pot or slow cooker comes in. A slow cooker can free up valuable oven and stovetop space while keeping sides warm until it's time to eat. From stuffing and cranberry sauce to creamy mashed potatoes, green beans, and crowd-pleasing dips, there are plenty of Thanksgiving favorites you can make ahead with minimal hands-on work. Here are 15 Thanksgiving sides you can make in a slow cooker. Sweet-potato casserole with marshmallows can easily be made in a slow cooker. Sweet potatoes with cinnamon and marshmallows. Sara Seaberry/Getty Images Sweet-potato casserole topped with marshmallows is a Thanksgiving favorite, and numerous recipes show how to make it in a slow cooker. A recipe from Damn Delicious explains that the residual heat from the slow cooker is the perfect way to achieve gooey, melted marshmallows on top of your casserole. You might be surprised to learn you can make mashed potatoes in a slow cooker. The mashed potatoes after adding the cheese. Erin McDowell/Business Insider Mashed potatoes are a Thanksgiving staple — the meal simply wouldn't be complete without them. However, mashed potatoes can be a hassle, from parboiling them to mashing and finding a space on the stove for them. Don't fret: Mashed potatoes can easily be made in a slow cooker . Just make sure to add water to your pot, or you won't get the desired consistency for mashing. \"Mashed potatoes are great in the slow cooker, though it does take a bit of time for the potatoes to soften, so plan ahead,\" Sarah Olson, chef behind The Magical Slow Cooker, said. The potatoes can take about four hours to soften, so give yourself plenty of time. Try making your stuffing in a slow cooker, rather than in the oven or inside the turkey. bhofack2/Getty Images/iStockphoto Everyone has their preferred method of making stuffing for Thanksgiving. While some might opt for oven-baked stuffing or stuffing cooked inside the turkey, it's a", "date_str": "2026-11-19T14:47:02+00:00", "hash": "d6d0d4d79cd8839e", "title_fa": "15 غذای شکرگزاری که می توانید در اجاق گاز آهسته یا قابلمه درست کنید", "summary_fa": "از چاشنی و ماک و پنیر گرفته تا غذای دلپذیر، این غذای شکرگزاری را می توان در یک اجاق آهسته آماده کرد. DronG/Getty Images یک اجاق گاز آهسته یا قابلمه می تواند آشپزی را در روز شکرگزاری آسان کند. می توانید مخلفات کلاسیک را در آرام پز درست کنید، از قیمه گرفته تا سس کرن بری. حتی می توانید رولت شام و پوره سیب زمینی را در آرام پز درست کنید. همه می دانند که وقتی صحبت از غذای شکرگزاری می شود، کناره ها بهترین غذاها هستند. با ساعت‌ها بسته بودن فر بوقلمون، پیدا کردن فضایی برای هر ظرف جانبی می‌تواند چالش برانگیز باشد. ng his number only to people he knows and not answering any messages from anyone he doesn't. I liked being able to monitor the contacts he was adding on his own and asking him about names I didn't recognize. But monitoring all his messages felt invasive from the start. I thought a lot about when I was his age and what my friends and I talked about on the phone . Not everything was entirely innocent; there were incidents that had happened at school we'd prefer our parents not know about, but it was still important for us to talk about them with our peers. I put myself in his shoes at that age I wanted to give him some autonomy with his social life , so I laid off checking every message. Then one day, I got a flagged message that caught him in a lie. Since lying is my parenting pet peeve, I got upset and decided to go through the rest of his messages. Unfortunately for both of us, I caught him in more lies. The more I confronted him about each detail I had discovered, the more he shut down on me. At first, this just made me angrier about the situation. My son was so upset with me that he asked me if he could go stay with a relative for a week. It reminded me of when I would get so upset with my dad at his age that I would want to run away. I allowed him to get some time away from me, but I could tell he regretted his request almost immediately. I realized I had embarrassed him by digging around in his private life My son and I have always been close, but the week he was away, I started to see that he has the right to begin developing his own life, one separate from mine. I also reflected on the actual text messages I read, and nothing was out of the ordinary for his age. There were some crushes, break-ups, and friends I had no idea about. He wasn't really doing anything wrong; he was just becoming more independent . At his ag", "date_str": "2026-11-19T14:08:01+00:00", "hash": "159d779fabdd3b13", "title_fa": "من برای پسرم یک تلفن همراه گرفتم و هرگز از نظارت بر پیام هایش احساس خوبی نداشتم. تصمیم گرفتم توقف کنم.", "summary_fa": "نویسنده وقتی پسرش کلاس پنجم بود تلفنی گرفت. با حسن نیت از اشلی آرچمبل من دو سال پیش برای پسرم یک تلفن همراه گرفتم. در ابتدا پیامک های او را زیر نظر داشتم، اما هیچ وقت احساس خوبی نسبت به آن نداشتم. دیدگاه من در مورد حق او برای حفظ حریم خصوصی تغییر کرده است. در اواخر کلاس پنجم، اولین تلفن همراه پسرم را گرفتم. با این حال، این گوشی هوشمند نبود و دارای چندین ویژگی ایمنی والدین بود. به عنوان مثال، من به پیام‌های متنی او در تلفنم دسترسی دارم و هشدارهای ایمنی را در صورت علامت‌گذاری موارد، مانند قلدری احتمالی، دریافت می‌کنم. در ابتدا، گاهی اوقات پیام های او را مرور می کردم. ما صحبت های زیادی در مورد ایمن بودن داشتیم، مثلاً شماره او را فقط به افرادی که می شناسد می داد و به هیچ پیامی از کسی که نمی شناسد پاسخ نمی داد. دوست داشتم بتوانم مخاطبینی را که خودش اضافه می‌کرد نظارت کنم و از او درباره نام‌هایی که نمی‌شناختم بپرسم. اما نظارت بر همه پیام های او از همان ابتدا تهاجمی بود. خیلی به این فکر کردم که در سن او بودم و من و دوستانم در مورد چه تلفنی صحبت می کردیم. همه چیز کاملاً بی گناه نبود. حوادثی در مدرسه اتفاق افتاده بود که ترجیح می‌دهیم والدین‌مان از آن‌ها اطلاعی نداشته باشند، اما همچنان برای ما مهم بود که در مورد آنها با همسالان خود صحبت کنیم. در آن سنی که می‌خواستم خودم را به جای او بگذارم، می‌خواستم در زندگی اجتماعی‌اش به او استقلال بدهم، بنابراین بررسی هر پیامی را کنار گذاشتم. سپس یک روز، من یک پیام پرچمدار دریافت کردم که او را در یک دروغ گرفتار کرد. از آنجایی که دروغگویی حیوان خانگی من است، ناراحت شدم و تصمیم گرفتم بقیه پیام های او را مرور کنم. متاسفانه", "image_url": "https://i.insider.com/6adb929dc8572251b197f74e?width=1200&format=jpeg", "category": "هوش مصنوعی مولد", "tags": ["فناوری", "نوآوری"], "datetime_fa": "۲۸ آبان • ۱۷:۳۸"}, {"source": "Business Insider", "title": "I made an entire Thanksgiving dinner using only Ina Garten recipes. Most dishes were delicious and cheap to make.", "link": "https://www.businessinsider.com/ina-garten-thanksgiving-menu-best-recipes-review-2026-11", "summary": "I created an easy Ina Garten Thanksgiving menu, using only her recipes to create an epic holiday feast. Terri Peters I made a Thanksgiving feast using only Ina Garten's recipes. Most were easy and affordable. I made turkey, green beans, stuffing, mac and cheese, mashed potatoes, pie, and cranberry sauce. After 10 hours of cooking, the meal for 12 was beautiful and filled with delicious highlights. When I first became interested in cooking, I spent a lot of time watching Ina Garten on Food Network and diving into her cookbooks and recipes. To me, Garten is one of the greats — so when I decided to cook an early Thanksgiving dinner for friends, it was a no-brainer that I'd put together a menu full of \"Barefoot Contessa\" recipes. Like Garten, I kept things simple and elegant, choosing classics like roasted turkey, mashed potatoes, and green beans. Although I've been cooking Thanksgiving dinner for my family for over 15 years, I learned new tricks and found recipes I would definitely make again. Here's what it was like to cook a full-on Garten-giving. All the ingredients were surprisingly easy to find. Terri Peters Still, since I was following recipes from a pro, I thought I'd probably have to go to four or five different grocery stores or specialty shops to gather all of the ingredients. However, my grocery list was actually simple, with lots of easy-for-me-to-acquire items like fresh green beans, tomatoes, elbow macaroni, tomatoes, butter, and goat cheese. To my surprise, I found everything I needed at Walmart on a single trip. I started cooking the day before and knocked out the apple pie first. Terri Peters Garten's deep-dish apple pie was to be our dessert, so I made it a day in advance to save time later. The recipe called for a lot of citrus zest, but it was simple to get the amount I needed from oranges and lemons using my microplane grater. It also required me to peel, quarter, and core several pounds of Granny Smith apples, which was time-consuming but not difficult. I'm pretty die-hard about following recipes, but I cheated a little on this one by using a store-bought pie crust rather than making my own. I was glad I did, as making the pie was still a lot of work. Next up was the cranberry sauce. Terri Peters I prepped Garten's make-ahead cranberry sauce the day before, too. I've made cranberry sauce from scratch before, but I prefer the canned variety, so I was curious how Garten's would stack up. The recipe called for tart Granny Smith apples, fres", "date_str": "2026-11-19T13:59:48+00:00", "hash": "d7c4a1415a0187ab", "title_fa": "من یک شام کامل شکرگزاری را فقط با استفاده از دستور العمل های Ina Garten درست کردم. اکثر غذاها خوشمزه و ارزان بودند.", "summary_fa": "من یک منوی آسان اینا گارتن برای شکرگزاری ایجاد کردم و فقط از دستور العمل های او برای ایجاد یک جشن حماسی تعطیلات استفاده کردم. تری پیترز من فقط با استفاده از دستور العمل های اینا گارتن یک جشن شکرگزاری درست کردم. اکثر آنها آسان و مقرون به صرفه بودند. بوقلمون، لوبیا سبز، قیمه، ماک و پنیر، پوره سیب زمینی، پای و سس کرن بری درست کردم. بعد از 10 ساعت آشپزی، غذای 12 نفره زیبا و پر از نکات خوشمزه بود. وقتی برای اولین بار به آشپزی علاقه مند شدم، زمان زیادی را صرف تماشای Ina Garten در شبکه غذا کردم و در کتاب های آشپزی و دستور پخت های او غواصی کردم. برای من، گارتن یکی از بزرگ‌هاست – بنابراین وقتی تصمیم گرفتم یک شام زودهنگام شکرگزاری را برای دوستان بپزم، بی‌معنی بود که منویی پر از دستور العمل‌های «کونتسا پابرهنه» تهیه کنم. مانند گارتن، من همه چیز را ساده و ظریف نگه داشتم و کلاسیک‌هایی مانند بوقلمون سوخاری، پوره سیب‌زمینی و لوبیا سبز را انتخاب کردم. اگرچه من بیش از 15 سال است که برای خانواده ام شام شکرگزاری درست می کنم، ترفندهای جدیدی یاد گرفتم و دستور العمل هایی را پیدا کردم که قطعاً دوباره درست خواهم کرد. در اینجا نحوه پختن غذای کامل در باغچه چگونه بود. پیدا کردن همه مواد به طرز شگفت آوری آسان بود. Terri Peters با این حال، از آنجایی که من دستور العمل های یک حرفه ای را دنبال می کردم، فکر کردم احتمالاً باید به چهار یا پنج فروشگاه مواد غذایی مختلف یا فروشگاه های تخصصی بروم تا همه مواد را جم dry day) into a checked-bag-sized suitcase, stuff another Ikea Frakta bag full of a different color load, then carry that all down four flights of stairs and about four blocks to my laundromat. My worst laundry day ever was when I did this whole routine in the snow — I was desperate — and realized on the way there I'd forgotten my detergent pods . One time when my mom was visiting me in the city, she accompanied me on one of my laundry journeys. After that, for Christmas, she gave me the gift of simplicity: covering a year (!!!) of pickup-and-delivery laundry service at my local laundromat. It was incredibly generous, and it taught me that some things are worth spending extra for, especially if they'll save you time and energy. And I write this as someone who does not have a dishwasher — I will happily handwash — and writes about home DIY projects professionally. I've been having my laundry picked up and delivered for about two years now, and I believe it's a life-changing investment. The process is fairly simple and very time-saving I usually put my laundry in the same few reusable bags. Sarah Everett When I use this service, I first schedule a pickup time with my laundromat. Then, I sort my laundry, separating anything I want hang-dried into a labeled packing cube, and apply a stain-stick treatment to any coffee spills or stubborn stains. From there, I leave my laundry in a zip-top tote bag or an Ikea Frakta bag outside my door. Next, an employee from the laundromat picks it up and sends me a photo text confirmation that they have it. Once it's picked up, I've gotten about two to two and a half hours of my life back. My laundry will get done while I'm working, hanging in the park, doing other household chores, or watching TV — whatever I want to do with my time. When it's ready, the laundry is dropped off at my door in the same bags, just a little more consolidated: The clothes are flat, wrinkle-free, and folded. My hang-dry items are on ", "date_str": "2026-11-19 t took quite a bit of effort to hand-grate the cheeses. It was also difficult to measure out each cheese exactly, so I ended up estimating somewhat. However, in the end, I had the right amount of each cheese to make the sauce, plus some cheese left over to sprinkle on the mac and cheese before putting it in the oven. Next, I cooked the macaroni noodles. Erin McDowell/Business Insider The noodles took about five minutes to cook, as they're supposed to be slightly undercooked before going in the o", "date_str": "2026-11-19T13:17:02+00:00", "hash": "a2db1d6bba60ef78", "title_fa": "من دستور پخت مک و پنیر را از 3 سرآشپز مشهور امتحان کردم. یکی برای روز شکرگزاری عالی بود.", "summary_fa": "من دستور پخت مک و پنیر توسط اینا گارتن، ری دراموند و مارتا استوارت را امتحان کردم. Getty Images Ina Garten، Martha Stewart و Ree Drummond همگی دستور العمل هایی برای مک و پنیر پخته دارند. دستور غذای استوارت از چهار نوع پنیر و پیاز زرد استفاده می‌کند، در حالی که گارتن خواستار گوجه‌فرنگی است. دستور غذای Pioneer Woman که از کدو حلوایی بو داده استفاده می کرد، برای روز شکرگزاری عالی بود. هیچ چیز مانند یک ماکارونی و پنیر خوش طعم و پخته شده در فر، غذای راحتی شکرگزاری را نمی گوید. سرآشپزهای مشهور اینا گارتن، مارتا استوارت و ری دراموند همگی دستور العمل های مخصوص به خود را برای مک و پنیر پخته دارند، بنابراین تصمیم گرفتم آنها را آزمایش کنم. دستور العمل ها رویکردهای مختلفی داشتند. مارتا استوارت با تکیه بر چهار نوع پنیر و پیاز زرد تفت داده شده برای طعمی غنی، سنتی خود را حفظ کرد، اما بسیار لذت بخش بود. اینا گارتن گوجه‌فرنگی را اضافه کرد که به مک و پنیر او رنگ روشن‌تر و کمی تلخ‌تر داد که آن را از نسخه‌های ساده‌تر متمایز کرد. دستور پخت ماکارونی ری دراموند با کدو حلوایی بو داده، پیاز کاراملی و طعم‌های کره‌ای و طعم‌دار که به‌ویژه دنج به نظر می‌رسد، آماده‌ترین غذای پاییزی است. در اینجا نحوه تهیه هر دستور پخت مک و پنیری که توسط سرآشپزان مشهور تأیید شده است، آورده شده است. اولین بار ماک و پنیر خامه ای مارتا استوارت بود. دستور ارین مک داول/Business Insider استوارت شامل چهار نوع پنیر مختلف و شامل پیاز سرخ شده اس e point off its comparable sales performance. US e-commerce grew 23% for the quarter, with more than four out of every five online orders fulfilled from stores, including some third-party marketplace items. Delivery is getting faster, too, as a larger share of orders were fulfilled in less than three hours. \"Speed's becoming increasingly important for our business, and it's a competitive advantage for us,\" US CEO David Guggina said on the call. Deliveries made in 30 minutes or less nearly tripled last quarter, he added. Strong growth in e-commerce is more than offsetting the decline of in-store shopping in the US, CFO John David Rainey said. \"Between in-store shopping and digital fulfillment, we have more volume going through our US stores than ever before,\" he said. On the call, Furner said adoption of Walmart's Sparky AI shopping assistant more than doubled since last year. It also added language support for Spanish and French and expanded access to Canada, Mexico, and Sam's Club. And at the company's warehouse chain, Sam's Club, fuel accounted for nearly half of the quarter's 9.7% sales growth as high gas prices during the quarter stretched ", "date_str": "2026-11-19T12:15:13+00:00", "hash": "7f06e8844f15e5c8", "title_fa": "فروشگاه‌های Walmart شلوغ‌تر از همیشه هستند، حتی با کاهش خرید در فروشگاه‌ها", "summary_fa": "قیمت بالای سوخت در سه ماهه گذشته به رشد فروش در Walmart و Sam s Club کمک کرد. Charles-McClintock Wilson/NurPhoto از طریق Getty Images والمارت با آمدن خریداران به دنبال بنزین و خواربارفروشی، سه ماهه دیگر رشد فروش را به ارمغان آورد. این غول خرده فروشی در این ماه یک میلیون بوقلمون بیشتر از نوامبر گذشته فروخت. در Sam's Club، سوخت تقریباً نیمی از رشد فروش بالای سه ماهه را به خود اختصاص داده است. به نظر می رسد که چرخ فلای والمارت در حال جمع آوری بخار است زیرا خریداران به دنبال ارزش و راحتی هستند. این غول خرده فروشی سه ماهه دیگر رشد فروش را در روز پنج شنبه ثبت کرد و مجموع درآمد آن 188.8 میلیارد دلار در سه ماهه بود که 5.2 درصد نسبت به سال گذشته و بالاتر از       media: [{"source": "Billboard", "title": "‘They Had Never Seen Anything Like Us’: The-B2s Take Manhattan in Preview of ‘New Wave’ Docuseries", "link": "https://www.billboard.com/music/music-news/new-wave-tv-documentary-mgm-1236385292/", "summary": "If you’re not a football family – or if you need a respite from the NFL’s Turkey Day takeover – MGM+ has just the counterprogramming for you. Come Monday (Nov. 23), the streaming service debuts New Wave, a four-part music series about (you guessed it) new wave music. Beginning in the late ’70s, the alternative music genre – which sprung up everywhere from New York City to Akron, Ohio melded punk energy, pop hooks and then-novel digital technologies to create a sonic and visual landscape that was as weird as it was wonderful. Ahead of its premiere, Billboard is sharing an exclusive clip from the first episode, which features Fred Schneider and Kate Pierson of The-B2s. “We were not living in New York City. We still were in Athens (Georgia) in our little bubble. We were just a larger group of friends hanging out being bohemian,” Pierson says in this new interview filmed for the series. “It just happened spontaneously, started picking up instruments.” “It became a hobby, but then our friends started saying, ‘Play our house, play our party,’” Schneider recalls in the clip, which features plenty of vintage footage of the kitsch-loving rock band. “Someone said we should go play Max’s Kansas City, the club in New York City. We saved all our money, packed a station wagon somehow we got everything in it, I don’t know how, don’t ask me so we drove up. They had never seen anything like us.” Like many of the other musicians interviewed for New Wave – Billy Idol, Mark Mothersbaugh of Devo, Stewart Copeland of The Police, Chris Frantz of Talking Heads, Kathy Valentine of the Go-Go’s – The B-52s had a scrappy, DIY start but eventually found their way to the Billboard charts. From the period covered in this docu-series, 1977-1987, new wave music went from an arty counterculture movement (it’s often seen as a reaction to the pretentious stadium rock of the ‘70s) to a critically respected and commercially viable force in its own right, elevating women and queer voices along the way. New Wave premieres Nov. 23 on MGM+.", "date_str": "2026-11-19T16:00:00+00:00", "hash": "58d45ae2f50efbf8", "title_fa": "«آنها هرگز چیزی شبیه ما ندیده بودند»: The-B2s منهتن را در پیش نمایش مستند «موج جدید» می گیرند", "summary_fa": "اگر شما یک خانواده فوتبال نیستید - یا اگر به یک مهلت از تصاحب NFL در روز ترکیه نیاز دارید - MGM+ فقط برنامه‌ریزی مخالف را برای شما دارد. دوشنبه (23 نوامبر)، سرویس پخش جریانی، New Wave، یک مجموعه موسیقی چهار قسمتی در مورد (حدس زدید) موسیقی موج نو را آغاز کرد. با شروع در اواخر دهه 70، ژانر موسیقی جایگزین - که در همه جا از نیویورک گرفته تا آکرون، اوهایو ظهور کرد، انرژی پانک، هوک های پاپ و فناوری های دیجیتال جدید را در هم آمیخت تا منظره ای صوتی و بصری را ایجاد کند که به همان اندازه عجیب و غریب بود. بیلبورد قبل از اولین نمایش خود، یک کلیپ اختصاصی از قسمت اول را به اشتراک می گذارد که در آن فرد اشنایدر و کیت پیرسون از The-B2s حضور دارند. ما در شهر نیویورک زندگی نمی کردیم. ما هنوز در آتن (گرجستان) در حباب کوچکمان بودیم. پیرسون در این مصاحبه جدید که برای سریال فیلم‌برداری شده است، می‌گوید: «ما فقط یک گروه بزرگ‌تر از دوستان بودیم که در حال معاشرت بودیم. اشنایدر در این کلیپ به یاد می‌آورد: «این تبدیل به یک سرگرمی شد، اما پس از آن دوستان ما شروع به گفتن کردند، «خانه ما را بازی کن، مهمانی ما را بازی کن»، که شامل تعداد زیادی فیلم قدیمی از گروه راک دوستدار کیچ است. \"یکی گفت باید برویم مکس کانزاس سیتی، باشگاه نیویورک سیتی بازی کنیم. ما همه پولمان را پس انداز کردیم، یک استیشن واگن را بسته بندی کردیم، به نحوی همه چیز را در آن جمع کردیم، نمی دانم چگونه، از من نپرسید، بنابراین با ماشین رفتیم. آنها هرگز چیزی شبیه ما ندیده بودند.» مانند بسیاری از نوازندگان دیگری که برای New Wave مصاحبه شده اند - بیلی آیدل، مارک مادرزباگ از دیو، استوارت کوپلند از پلیس، کریس فرانتز از Talking Heads،", "image_url": "https://www.billboard.com/wp-content/uploads/2026/11/P108SPE5-e1795053496298.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["سینما", "موسیقی"], "datetime_fa": "۲۸ آبان • ۱۹:۳۰"}, {"source": "Billboard", "title": "From Taylor Swift to Miranda Lambert, Ella Langley, Zach Top & More, Which 2026 CMA Awards Performance Was Your Favorite? Vote!", "link": "https://www.billboard.com/music/awards/best-2026-cma-awards-performance-vote-poll-1236385621/", "summary": "Wednesday night s (Nov. 18) 2026 CMA Awards was a crowning moment for Choosin Texas singer Ella Langley , who won her first entertainer of the year prize, as well as female vocalist of the year and single, song and music video of the year for her historic Billboard Hot 100-topping single. Related Underscores Is First Transgender Woman Nominated for Best Dance/Electronic Recording Grammy The Biggest Snubs Surprises at the 2026 CMA Awards Ella Langley Becomes First Act to Earn Top Two of TouchTunes Frontline Chart Langley also lit up the stage with a performance of Loving Life Again , as well as a collab with Miranda Lambert on Snakeskin Boots on a smoke-shrouded stage backed by a string section and full band. But she was not alone in firing up the crowd inside Bridgestone Arena in Nashville. The other biggest headline of the night was Taylor Swift performing at the CMAs for the first time in 13 years (naturally), firing up the crowd with her Toy Story 5 hit I Knew It, I Knew You , with an intro featuring cameos from Brooks Dunn, Brad Paisley, host Lainey Wilson, Eric Church and Little Big Town. There was also an all-star tribute to country duo Brooks Dunn featuring rockers Halestorm, HARDY, Brothers Osborne, Marcus King, Brad Paisley and Luke Bryan. Elsewhere, Mumford Sons teamed up with Chris Stapleton for an intense run through their Here collaboration augmented by a horn section, Tim McGraw pulled up a stool for the first-ever CMA Awards performance of his career-defining 1994 ballad Don t Take the Girl, Megan Moroney took things down a notch with her tender ballad Beautiful Things and Kacey Musgraves and Miranda Lambert set up shop in a country hair salon for their mending fences duet Horses Divorces . Fans were also treated to Luke Combs performing his country rocking Miss You Here from his album of the year-nominated The Way I Am , host Wilson debuting her new song, Just a Woman , as well as performances by the Red Clay Strays, Tucker Wetmore, Stapleton and Stephen Wilson Jr. and Zach Top with Dierks Bentley. Billboard already made a ranked listing of the performances, but which one was your favorite? Tell us which acts you think gave the best performance at the 2026 CMA Awards by voting in the poll below. Take Our Poll", "date_str": "2026-11-19T15:53:05+00:00", "hash": "e6f0a5f07bff759d", "title_fa": "از تیلور سویفت گرفته تا میراندا لمبرت، الا لنگلی، زک تاپ و بیشتر، کدام اجرای جوایز CMA 2026 مورد علاقه شما بود؟ رای بده", "summary_fa": "جوایز CMA 2026 چهارشنبه شب (18 نوامبر) برای الا لنگلی، خواننده Choosin Texas، که جایزه اولین هنرمند سال، و همچنین خواننده زن سال و تک‌آهنگ، آهنگ و موزیک ویدیوی سال را برای تک‌آهنگ تاریخی بیلبورد Hot 100، برنده شد، بهترین لحظه بود. Underscores مرتبط اولین زن تراجنسیتی است که نامزد بهترین رقص/ضبط الکترونیکی گرمی شده است. چکمه‌های پوست مار روی یک صحنه دودی پوشیده شده توسط بخش زهی و باند کامل. اما او تنها نبود که جمعیت را در ورزشگاه بریجستون در نشویل شلیک کرد. بزرگ‌ترین تیتر شب این بود که تیلور سویفت برای اولین بار پس از 13 سال (به طور طبیعی) در CMA اجرا کرد و با آهنگ داستان اسباب‌بازی 5 خود با آهنگ I Knew It, I Knew You، با مقدمه‌ای از بروکز دان، برد پیزلی، مجری لینی چرچ بیتل، و لینی چرچ بیتل، مجری برنامه، جمعیت را برانگیخت. همچنین یک ادای احترام به دو کانتری بروکس دان با حضور راک‌های هالستورم، هاردی، برادران آزبورن، مارکوس کینگ، برد پیزلی و لوک برایان برگزار شد. در جای دیگر، پسران مامفورد با کریس استپلتون همکاری کردند تا در همکاری‌هایشان در اینجا که با یک بخش شاخ تقویت شده بود، با کریس استپلتون همکاری کنند، تیم مک‌گرو برای اولین اجرای جوایز CMA در تصنیف تعیین‌کننده‌ی حرفه‌ای خود در سال 1994، Don t Take the Girl، مگان مورونی چیزهای هیجان‌انگیز Thunder Musravey و Kaya را برداشت. میراندا لمبرت در یک آرایشگاه روستایی مغازه‌ای را برای نرده‌های دوتایی خود به نام Horses Divorces راه‌اندازی کرد.", "image_url": "https://www.billboard.com/wp-content/uploads/2026/11/2305799265-e1795100889664.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["موسیقی"], "datetime_fa": "۲۸ آبان • ۱۹:۲۳"}, {"source": "Billboard", "title": "How Did the Greatest Pop Stars Fare in the 2026 Grammy Nominations?", "link": "https://www.billboard.com/music/pop/grammy-nominations-2026-greatest-pop-stars-podcast-1236385551/", "summary": "The nominations for the 69th Annual Grammy Awards were announced earlier this week, and not only were many of the biggest names of 2026 involved in the biggest categories, they were nominated all the way across those categories: Taylor Swift, Ella Langley, Rosalía, RAYE, Bruno Mars and Olivias Dean and Rodrigo were all nominated for each of album, song and record of the year. While those long-established titans and rising world-beaters found their names called early and often on Monday, other A-listers like Noah Kahan and Harry Styles weren t as fortunate, while stars like Charli xcx and Madonna did get their share of nominations, but were arguably still left wanting for more. On this episode of the Greatest Pop Stars podcast, host Andrew Unterberger is joined by Billboard senior charts/data analyst Eric Frankenberg to break down how things shook out among the contemporary pop greats during this year s Grammy nominations. We talk about the big-picture takeaways from the artists who were and weren t recognized in the biggest categories, and what early leans we have about who will actually emerge triumphant on Music s Biggest Night. Along the way, we answer all the biggest questions about pop stars at this year s Grammys: Is Olivia Rodrigo the most likely frontrunner in album of the year? Could RAYE or Rosalía end up playing spoiler there? Did Confessions II deserve a crack at the top prize? Is Taylor Swift s energy mostly going behind a different category this year? How did Harry Styles go from AOTY winner to not mentioned at all? Why is Noah Kahan having such difficulty being taken seriously? How is Bruno Mars still always the pop exception that proves every rule? And perhaps most importantly: What the hell is the best new artist medley performance gonna end up looking like this year? Check it out above, and subscribe to the Greatest Pop Stars podcast on Apple Music or Spotify (or wherever you get your podcasts ) for weekly discussions every Thursday about all things related to pop stardom! And as we say in every one of these GPS podcast posts — if you have the time and money to spare, please consider donating to any of these causes in the fight for trans rights: Transgender Law Center Trans Lifeline Destination Tomorrow Gender-Affirming Care Fundraising on GoFundMe Human Rights Campaign – In Your Area Also, please consider giving your local congresspeople a call in support of trans rights, with contact information you can find on 5Calls.org .", "date_str": "2026-11-19T15:31:28+00:00", "hash": "04331b219593f9e6", "title_fa": "بهترین ستاره های پاپ در نامزدهای گرمی 2026 چگونه بودند؟", "summary_fa": "نامزدهای شصت و نهمین جوایز سالانه گرمی اوایل این هفته اعلام شد، و نه تنها بسیاری از بزرگ‌ترین نام‌های سال 2026 در بزرگ‌ترین دسته‌ها حضور داشتند، بلکه در تمام این دسته‌ها نامزد شدند: تیلور سویفت، الا لنگلی، روزالیا، RAYE، برونو مارس و اولیویا دین و رودریگو برای هر آلبوم نامزد شدند. در حالی که آن تایتان‌های با سابقه و رقیب‌های جهان در اوایل روز دوشنبه نام خود را پیدا کردند، سایر A-listers مانند نوآ کاهان و هری استایلز چندان خوش شانس نبودند، در حالی که ستارگانی مانند Charli xcx و مدونا سهم خود را از نامزدی به دست آوردند، اما مسلماً همچنان خواهان دریافت بیشتر بودند. Underscores مرتبط اولین زن تراجنسیتی است که نامزد بهترین رقص/ضبط الکترونیکی گرمی شد الا لنگلی اولین بازیگری شد که دو تا از جدول خط مقدم TouchTunes را به دست آورد. 1 با Ranchero Enamorado، اولیویا رودریگو را کاوش کنید، آخرین ویدیوها، نمودارها و اخبار را مشاهده کنید در این قسمت از پادکست بزرگترین ستاره های پاپ، اندرو آنتربرگر مجری برنامه با اریک فرانکنبرگ، تحلیلگر ارشد نمودارها/داده های بیلبورد همراهی می کند تا چگونگی تغییر اوضاع را در بین بزرگان پاپ معاصر در طول گرام امسال توضیح دهد. ما در مورد عکس‌های بزرگ هنرمندانی صحبت می‌کنیم که در بزرگ‌ترین دسته‌بندی‌ها شناخته نشده‌اند و شناخته نشده‌اند، و اینکه چه کسانی واقعاً در بزرگترین شب موسیقی پیروز خواهند شد. در طول راه، ما به بزرگترین سوالات در مورد ستاره های پاپ در گرمی امسال پاسخ می دهیم: آیا اولیویا رودریگو محتمل ترین نامزد آلبوم سال است؟ آیا RAYE یا Rosalía می توانند در آنجا اسپویلر بازی کنند؟ آیا Confessions II مستحق دریافت جایزه برتر بود؟", "image_url": "https://www.billboard.com/wp-content/uploads/2026/10/olivia-rodrigo-daisy-chain-fields-2026-billboard-1800.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["موسیقی"], "datetime_fa": "۲۸ آبان • ۱۹:۰۱"}, {"source": "Billboard", "title": "Belfast Duo CHALK Is Killing It on Fontaines D.C.’s European Tour: ‘Performing Live Is the Core of Our Band’", "link": "https://www.billboard.com/music/rock/belfast-chalk-fontaines-dc-tour-1236385553/", "summary": "You can read CHALK’s “Get Fucked,” their monstrous 2026 single, in two ways. The first is as a hedonistic anthem about chasing a dopamine rush amidst the crushing existence of late-stage capitalism: Get a job, go to work, feels right,” lead singer Ross Cullen barks, adding, “Get yourself a new apartment, seems nice.” The second is as a confrontational challenge — with the song’s incendiary title being repeated like a mantra in the song’s final stretch. Cullen has sown the seeds of this distrust of the song’s subject: “You walk in the door, I see a lie.” His salvation – a new life and a “new God” – might not quite live up to expectations after all. When the duo performed it at Amsterdam’s 17,000-capacity Ziggo Dome in mid-November, it fel 7/", "summary": "Stephen A. Smith and Kevin Frazier have long appeared on camera to reported on sports and entertainment. Now the duo gets to manage such programming from behind the scenes. Smith and Fraizer, longtime friends who last year came together to expand Smith’s production outlet Straight Shooter Media, are teaming up with Skydance’s BET to telecast [ ]", "date_str": "2026-11-19T15:00:00+00:00", "hash": "713319c7d487ee2e", "title_fa": "رسانه تیرانداز مستقیم استفن آ. اسمیت، بسکتبال HBCU را به BET می آورد", "summary_fa": "استفن آ. اسمیت و کوین فریزر مدت‌هاست که برای گزارش‌های ورزشی و سرگرمی مقابل دوربین ظاهر می‌شوند. حالا این دو نفر می‌توانند چنین برنامه‌هایی را از پشت صحنه مدیریت کنند. اسمیت و فریزر، دوستان دیرینه ای که سال گذشته گرد هم آمدند تا رسانه تولیدی Streight Shooter Media را گسترش دهند، با Skydance's BET برای پخش تلویزیونی همکاری می کنند [ ]، به گفته فریزر، هدف این است که «بازنمایی بسکتبال کالج سیاهان در نوری متفاوت»، با تأکید بر بسیاری از عناصری که اغلب اوقات نمایش داده نمی شوند. این دو می‌خواهند توجه را به فرهنگ پیرامون رویدادها، گروه‌های موسیقی، تیم‌های رقص، تشویق‌کنندگان و روحیه مدرسه جلب کنند. زمانی که HBCU ها یک بازی را انجام می دهند، Frazier قول می دهد: \"شما خواهید دید که بودن در داخل میدان چگونه است.\" هر دو مرد بیش از تولید یک بازی در خطر هستند. اسمیت در دانشگاه ایالتی وینستون-سالم تحصیل کرد و در آنجا بسکتبال بازی کرد، در حالی که فریزر با تماشای مربیگری پدرش در دانشگاه ایالتی مورگان بزرگ شد. فریزر که مدت‌ها به عنوان مجری در \"Entertainment Tonight\" کار کرده است، می‌گوید: \"همه چیزهایی که من دارم تا حدی به خاطر بسکتبال کالج سیاه‌پوست است.\" اسمیت بیشتر به خاطر سخنرانی ورزشی متفکرانه‌ای که بیشتر روزها در ESPN ارائه می‌کند، شناخته شده است، اما طبق قراردادی که سال گذشته با مالک شرکت ESPN، شرکت والت دیزنی منعقد کرد، او آزاد است تا پروژه‌های بیرونی را دنبال کند، و مفاهیم بالقوه و ایده‌های محتوایی را شناسایی کند، و دیزنی یک پنجره نگاه اول را حدود 30 روز دریافت می‌کند. او و فریزر از زمان حضور قبلی در فاکس اسپورت، یکدیگر را می شناختند. اسمیت معتقد     let currentTab = 'persian';
    let searchQuery = '';
    let readArticles = new Set(JSON.parse(localStorage.getItem('read_articles_registry') || '[]'));

    function toFaDigits(n) {
      const f = ['۰','۱','۲','۳','۴','۵','۶','۷','۸','۹'];
      return n.toString().replace(/\d/g, d => f[d]);
    }

    function toggleRead(hash) {
      if (readArticles.has(hash)) {
        readArticles.delete(hash);
      } else {
        readArticles.add(hash);
      }
      localStorage.setItem('read_articles_registry', JSON.stringify(Array.from(readArticles)));
      renderNews();
    }

    function renderNews() {
      const container = document.getElementById('newsContainer');
      const rawItems = data[currentTab] || [];
      
      const filtered = rawItems.filter(item => {
        if (!searchQuery) return true;
        const q = searchQuery.toLowerCase();
        const title = (item.title_fa || item.title || '').toLowerCase();
        const summary = (item.summary_fa || item.summary || '').toLowerCase();
        const source = (item.source || '').toLowerCase();
        const category = (item.category || '').toLowerCase();
        const tags = (item.tags || []).join(' ').toLowerCase();
        return title.includes(q) || summary.includes(q) || source.includes(q) || category.includes(q) || tags.includes(q);
      });

      const unreadList = [];
      const readList = [];

      filtered.forEach(item => {
        if (readArticles.has(item.hash)) {
          readList.push(item);
        } else {
          unreadList.push(item);
        }
      });

      const sortedItems = [...unreadList, ...readList];

      if (sortedItems.length === 0) {
        container.innerHTML = '<div style="text-align:center; padding: 40px; color: var(--text-muted);">هیچ خبری در این بخش در ۲۴ ساعت گذشته ثبت نشده است.</div>';
        return;
      }

      container.innerHTML = sortedItems.map((item, idx) => {
        const title = item.title_fa || item.title || '';
        const summary = item.summary_fa || item.summary || '';
        const source = item.source || 'منبع خبر';
        const link = item.link || '#';
        const isRead = readArticles.has(item.hash);
        const num = toFaDigits(idx + 1);
        const category = item.category || '';
        const tags = item.tags || [];
        const datetimeFa = item.datetime_fa || '';

        return `
          <article class="news-card ${isRead ? 'is-read' : ''}" id="card-${item.hash}">
            <div class="news-header">
              <span class="news-num">${isRead ? '✓' : num}</span>
              <h2 class="news-title">${title}</h2>
            </div>
            ${summary ? `<p class="news-summary">${summary}</p>` : ''}
            <div class="news-footer">
              <div class="footer-top-row">
                <div class="meta-group">
                  <span class="news-source">📌 ${source}</span>
                  ${datetimeFa ? `<span class="news-datetime">🕒 ${datetimeFa}</span>` : ''}
                  ${category ? `<span class="news-category-badge" onclick="filterByTag('${category}')">📂 ${category}</span>` : ''}
                </div>
              </div>
              ${tags && tags.length > 0 ? `
                <div class="footer-tags-row">
                  ${tags.map(t => `<span class="news-tag-chip" onclick="filterByTag('${t}')">#${t}</span>`).join('')}
                </div>
              ` : ''}
              <div class="footer-bottom-row">
                <div class="footer-actions-right">
                  <button class="btn-mark-read" onclick="toggleRead('${item.hash}')">
                    ${isRead ? '✓ خوانده شد' : '○ علامت خوانده‌شده'}
                  </button>
                </div>
                <div class="footer-actions-left">
                  ${link && link.startsWith('http') ? `<a href="${link}" target="_blank" rel="noopener noreferrer" class="news-link">مطالعه اصل خبر ↗</a>` : ''}
                </div>
              </div>
            </div>
          </article>
        `;
      }).join('');
    }

    function filterByTag(val) {
      const searchInput = document.getElementById('searchInput');
      if (searchInput) {
        searchInput.value = val;
        searchQuery = val;
        renderNews();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    }

    function switchTab(tab, el) {
      currentTab = tab;
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      if (el) el.classList.add('active');
      renderNews();
    }

    function toggleTheme() {
      const html = document.documentElement;
      const current = html.getAttribute('data-theme') || 'dark';
      const next = current === 'dark' ? 'light' : 'dark';
      html.setAttribute('data-theme', next);
      localStorage.setItem('theme', next);
      updateThemeButton(next);
    }

    function updateThemeButton(theme) {
      const icon = document.getElementById('themeIcon');
      const text = document.getElementById('themeText');
      if (theme === 'dark') {
        icon.textContent = '☀️';
        text.textContent = 'حالت روشن';
      } else {
        icon.textContent = '🌙';
        text.textContent = 'حالت تاریک';
      }
    }

    function toggleArchiveModal(show) {
      const modal = document.getElementById('archiveModal');
      if (show) {
        renderArchiveList();
        modal.classList.add('active');
      } else {
        modal.classList.remove('active');
      }
    }

    function renderArchiveList() {
      const listContainer = document.getElementById('archiveListContainer');
      if (!archiveManifest || archiveManifest.length === 0) {
        listContainer.innerHTML = '<div style="text-align:center; padding: 20px; color: var(--text-muted);">هنوز شماره قبلی ثبت نشده است.</div>';
        return;
      }

      listContainer.innerHTML = archiveManifest.map(item => `
        <a href="${item.url}" class="archive-item">
          <div>
            <div class="archive-date-fa">📰 شماره ${item.p_date}</div>
            <div class="archive-date-g">🌍 ${item.g_date}</div>
          </div>
          <span class="archive-arrow">←</span>
        </a>
      `).join('');
    }

    const savedTheme = localStorage.getItem('theme') || 'dark';
    document.documentElement.setAttribute('data-theme', savedTheme);
    updateThemeButton(savedTheme);

    document.getElementById('searchInput').addEventListener('input', (e) => {
      searchQuery = e.target.value.trim();
      renderNews();
    });

    renderNews();
  </script>
</body>
</html>
