  </style>

  <script>

وبه‌رو خواهد شد. هم‌زمان، رسانه‌های جمهوری اسلامی روز چهارشنبه پیامی منسوب به مجتبی خامنه‌ای، رهبر جمهوری اسلامی، منتشر کردند که در آن نسبت به امید بستن به تغییر سیاست‌های آمریکا در پی جابه‌جایی احزاب سیاسی یا کاهش خصومت واشینگتن از طریق امتیازدهی هشدار داده شده است. در این پیام آمده است: «اگر هنوز کسانی هستند که اندک امیدی به تغییر رفتار یا جابه‌جایی‌های حزبی و جناحی در نظام سلطه دارند و یا تصور می‌کنند با امتیاز دادن به آمریکا می‌توانند او را از دشمنی با ملت ایران منصرف کنند، سخت در اشتباه‌اند.» در این بخش ایران وایر می‌توانید با مسوولان تماس بگیرید و کارزار خود را برای مشکلات مختلف راه‌اندازی کنید با ایران‌وایر همکاری کنید ویدیوها و مطالب خود را برای ما بفرستید", "image_url": "https://static.prod.iranwire.com/_versions_jpeg/articleslide/k8pXh_wVYi__v1024x512__box_0%2C118%2C912%2C597.jpeg", "category": "امنیت سایبری و شبکه", "tags": ["امنیت سایبری"], "datetime_fa": "۱۳ آبان • ۲۱:۲۲"}, {"source": "Euronews Persian", "title": "تهدید بیماری‌های گرمسیری اروپا به شمال سرایت کرده؛ آیا می‌توان جلوی پیشروی پشه‌ها را گرفت؟", "link": "https://parsi.euronews.com/2026/11/04/europes-tropical-disease-threat-is-moving-north-can-it-stop-mosquitoes-in-their-tracks", "summary": "پرتغال برای مهار گسترش یک گونه مهاجم، پشه‌های نابارور رها می‌کند. اما افزایش موارد دنگی و گرم‌تر شدن هوا، مقام‌های اروپایی را وادار کرده شیوه آمادگی برای بیماری‌های گرمسیری را بازنگری کنند.", "date_str": "2026-11-04T17:38:56+00:00", "hash": "906fd30056029d31", "title_fa": "تهدید بیماری‌های گرمسیری اروپا به شمال سرایت کرده؛ آیا می‌توان جلوی پیشروی پشه‌ها را گرفت؟", "summary_fa": "پرتغال برای مهار گسترش یک گونه مهاجم، پشه‌های نابارور رها می‌کند. اما افزایش موارد دنگی و گرم‌تر شدن هوا، مقام‌های اروپایی را وادار کرده شیوه آمادگی برای بیماری‌های گرمسیری را بازنگری کنند.", "image_url": "https://images.euronews.com/articles/stories/09/97/96/67/1200x675_cmsv2_fc710f23-c9af-5439-bc21-00dec657eccf-9979667.jpg", "category": "جامعه و رویدادها", "tags": ["رویداد", "گزارش"], "datetime_fa": "۱۳ آبان • ۲۱:۰۸"}, {"source": در واشنگتن بود. صریح‌ترین واکنش به شکست جمهوری‌خواهان از درون دولت ترامپ آمد. جی‌دی ونس، معاون رئیس‌جمهور آمریکا، در ایکس نوشت: «دلیل شکست ما جنگ است.» او گفت شماری از رای‌دهندگان ترامپ در سال ۲۰۲۴، این بار به دموکرات‌ها رأی داده‌اند و خواهان پایان جنگ ایران، مهار گرانی و بازگشت به شعار «اول آمریکا» هستند. مارجوری تیلور گرین، نماینده پیشین کنگره و از حامیان سابق دونالد ترامپ که اکنون منتقد اوست، شکست جمهوری‌خواهان را «همه‌پرسی درباره ترامپ» خواند و رئیس‌جمهور را به آغاز جنگی متهم", "image_url": "https://ichef.bbci.co.uk/news/1200/branded_persian/a172/live/df0225c0-d871-11f1-85ab-b3cc3b5498c6.jpg", "category": "سیاست و دیپلماسی", "tags": ["عامل‌های هوشمند"], "datetime_fa": "۱۳ آبان • ۲۰:۳۵"}, {"source": "Iran International", "title": "با تعویق جام ملت‌های آسیا، هاجیمه موریاسو از تیم ملی ژاپن جدا می‌شود", "link": "https://www.iranintl.com/202611041894", "summary": "خبرگزاری فرانسه گزارش داد که تعویق جام ملت‌های آسیا ۲۰۲۷ از ژانویه به دسامبر، آینده هاجیمه موریاسو در تیم ملی ژاپن را مبهم کرده است. قرار بود او پس از این رقابت‌ها کنار برود، اما اکنون ممکن است در پایان سال ۲۰۲۶ جای خود را به گو اویوا بدهد.", "date_str": "2026-11-04T17:23:31+00:00", "hash": "d7b8a3ce8a9f6430", "title_fa": "با تعویق جام ملت‌های آسیا، هاجیمه موریاسو از تیم ملی ژاپن جدا می‌شود", "summary_fa": "خبرگزاری فرانسه گزارش داد که تعویق جام ملت‌های آسیا ۲۰۲۷ از ژانویه به دسامبر، آینده هاجیمه موریاسو در تیم ملی ژاپن را مبهم کرده است. قرار بود او پس از این رقابت‌ها کنار برود، اما اکنون ممکن است در پایان سال ۲۰۲۶ جای خود را به گو اویوا بدهد.", "image_url": "https://i.iranintl.com/images/rdk9umy0/production/00708d6244fc8a74cb9c316190a2d6a3b73e3819-1200x855.jpg?rect=0,174,1200,630&w=1200&h=630&q=66&fit=max&auto=format", "category": "جامعه و رویدادها", "tags": ["رویداد", "گزارش"], "datetime_fa": "۱۳ آبان • ۲۰:۵۳"}, {"source": "Radio Farda", "title": "ونس: جنگ ایران دلیل شکست ما در انتخابات بود؛ وعده رهبر دموکرات‌های سنا درباره پایان دادن به جنگ", "link": "https://www.radiofarda.com/a/vance-says-iran-war-is-t ل‌های هوشمند"], "datetime_fa": "۱۳ آبان • ۲۱:۰۹"}, {"source": "IranWire", "title": "جی‌دی ونس: جنگ با ایران از دلایل اصلی شکست جمهوری‌خواهان بود", "link": "https://iranwire.com/fa/news-1/159804-%D8%AC%DB%8C%D8%AF%DB%8C-%D9%88%D9%86%D8%B3-%D8%AC%D9%86%DA%AF-%D8%A8%D8%A7-%D8%A7%DB%8C%D8%B1%D8%A7%D9%86-%D8%A7%D8%B2-%D8%AF%D9%84%D8%A7%DB%8C%D9%84-%D8%A7%D8%B5%D9%84%DB%8C-%D8%B4%DA%A9%D8%B3%D8%AA-%D8%AC%D9%85%D9%87%D9%88%D8%B1%DB%8C%D8%AE%D9%88%D8%A7%D9%87%D8%A7%D9%86-%D8%A8%D9%88%D8%AF/", "summary": "جی‌دی ونس، معاون رییس‌جمهور آمریکا، جنگ با ایران را از دلایل اصلی شکست جمهوری‌خواهان در انتخابات میان‌دوره‌ای کنگره دانست و گفت بسیاری ا ...", "date_str": "2026-11-04T16:42:23+00:00", "hash": "7680589a10253479", "title_fa": "جی‌دی ونس: جنگ با ایران از دلایل اصلی شکست جمهوری‌خواهان بود", "summary_fa": "جی‌دی ونس، معاون رییس‌جمهور آمریکا، جنگ با ایران را از دلایل اصلی شکست جمهوری‌خواهان در انتخابات میان‌دوره‌ای کنگره دانست و گفت بسیاری ا ... ونس روز چهارشنبه ۱۳ آبان در پیامی در شبکه اجتماعی ایکس، با اشاره به نتایج انتخابات مجلس نمایندگان و سنا، نوشت مشکل اصلی جمهوری‌خواهان نه میزان مشارکت هوادارانشان، بلکه تغییر گرایش بخشی از رای‌دهندگان این حزب به دموکرات‌ها بوده است. او با استناد به نظرسنجی یکی از تحلیل‌گران سیاسی که به گفته او نتایج انتخابات را به‌درستی پیش‌بینی کرده بود، نوشت از رای‌دهندگانی که در انتخابات ۲۰۲۴ به ترامپ رای داده بودند اما در انتخابات امسال به دموکرات‌ها روی آوردند، درباره دلایل این تغییر و عواملی که ممکن است آن‌ها را دوباره به جمهوری‌خواهان بازگرداند، پرسیده شده است. به گفته ونس، چهار پاسخ اصلی این افراد عبارت بوده است از پایان‌دادن به جنگ، تمرکز بر هزینه‌های زندگی و تورم، اولویت‌دادن به منافع آمریکا و تغییر رابطه واشینگتن با اسراییل. معاون رییس‌جمهور آمریکا همچنین از کسانی که در حزب جمهوری‌خواه خواستار حل‌وفصل دیپلماتیک درگیری با ایران شده بودند، دفاع کرد و گفت انتقادهایی که روز دوشنبه از ریچل کامپوس دافی به دلیل حمایت از راه‌حل دیپلماتیک مطرح شد، نادرست بود و توصیه سیاسی او درست از آب درآمد. ونس با تاکید بر این‌که دلیل اصلی شکست جمهوری‌خواهان جنگ بوده است، نوشت خود دونالد ترامپ نیز شامگاه سه‌شنبه به این موضوع اشاره کرده است. او از کسانی که معتقدند هزینه سیاسی جنگ و از دست‌دادن کنترل سنا برای شش سال آینده ارزش آن را داشته است، خواست صریحا از این موضع دفاع کنند. او همچنین پیش‌بینی کرد در ماه‌های آینده اختلاف‌نظرها و تلاش‌هایی برای منحرف‌کردن بحث از دلایل واقعی شکست جمهوری‌خواهان شکل بگیرد. ونس در عین حال گفت همچنان به آینده آمریکا امیدوار است و از جمهوری‌خواهان خواست نارضایتی خود از نتایج انتخابات را به تلاشی برای بازگرداندن", "image_url": "https://static.prod.iranwire.com/_versions_jpeg/articleslide/SnapInsta.to_670132386_18582540337016561_821089336123643940_n_wWFc__v1024x512__box_0%2C190%2C1080%2C757.jpeg", "category": "اقتصاد و بازرگانی", "tags": ["عامل‌های هوشمند"], "datetime_fa": "۱۳ آبان • ۲۰:۱۲"}, {"source": "Euronews Persian", "title": "بریتانیا؛ پلیس حامیان «پالیستین اکشن» را مقابل دیوان عالی بازداشت کرد", "link": "https://parsi.euronews.com/video/2026/11/04/uk-police-arrest-palestine-action-supporters-outside-supreme-court", "summary": "پلیس روز چهارشنبه ۴ نوامبر، هم‌زمان با ازسرگیری نبرد حقوقی بر سر ممنوعیت این گروه از سوی دولت بریتانیا، حامیان «اکشن برای فلسطین» را بیرون دیوان عالی در لندن، بریتانیا بازداشت کرد.", "date_str": "2026-11-04T16:50:05+00:00", "hash": "f5407e2f79c12c94", "title_fa": "بریتانیا؛ پلیس حامیان «پالیستین اکشن» را مقابل دیوان عالی بازداشت کرد", "summary_fa": "پلیس روز چهارشنبه ۴ نوامبر، هم‌زمان با ازسرگیری نبرد حقوقی بر سر ممنوعیت این گروه از سوی دولت بریتانیا، حامیان «اکشن برای فلسطین» را بیرون دیوان عالی در لندن، بریتانیا بازداشت کرد.", "image_url": "https://images.euronews.com/articles/stories/09/98/01/99/1200x675_cmsv2_de01f1a2-f291-5549-b5b8-523e57c87739-9980199.jpg", "category": "سیاست و دیپلماسی", "tags": ["رویداد", "گزارش"], "datetime_fa": "۱۳ آبان • ۲۰:۲۰"}, {"source": "Euronews Persian", "title": "اوکراین؛ فیلم پلیس حمله موشکی روسیه به پناهگاه کامی‌شوواخا را ثبت کرد", "link": "https://parsi.euronews.com/video/2026/11/04/ukraine-police-footage-captures-russian-strike-on-komy  گوشی‌های کوچک مجهز به صفحه‌کلید، برای پر کردن این خلاء وارد عمل شده‌اند. Clicks - یک شرکت نسبتاً جدید که لوازم جانبی صفحه کلید برای تلفن های هوشمند تولید می کند - Communicator را در ماه دسامبر عرضه می کند، یک تلفن اندرویدی 4 اینچی با صفحه کلید. سایر دستگاه‌ها بیشتر بر رفاه دیجیتال تمرکز می‌کنند و تجربه سنتی تلفن همراه را که شبیه «تلفن‌های گنگ» هستند، ارائه نمی‌کنند، از جمله", "image_url": "https://media.wired.com/photos/6aea29a12d2498ce2ece47a8/191:100/w_1280,c_limit/Enough%20Phone%20Red%20Background.jpg", "category": "هوش مصنوعی مولد", "tags": ["هوش مصنوعی", "Apple"], "datetime_fa": "۱۳ آبان • ۲۱:۳۰"}, {"source": "MIT Tech Review", "title": "Texas was the new epicenter of the AI data center buildout. That might be kaput.", "link": "https://www.technologyreview.com/2026/11/04/1148043/texas-was-the-new-epicenter-of-the-ai-data-center-buildout-that-might-be-kaput/", "summary": "Texas is the fastest-growing data center market in the US and ground zero for Big Tech s largest AI buildouts. But the blue wave that swept the Lone Star State may jeopardize that position. Democrat James Talarico won the US Senate seat against Ken Paxton. Gina Hinojosa won the race for governor against the Republican incumbent, Greg Abbott. At the state level, Democrats will take control of the Texas House for the first time in 24 years. Talarico and Hinojosa made data centers a central issue, discussing them constantly on the campaign trail. Even before the polls closed, insiders in the data center industry noticed that the times were changing. At the industry s DCD conference in Ashburn, Virginia, on Tuesday, panelists lamented that Texas had been the easiest place to build for years—until September. That s when Abbott, perhaps seeing the increasingly bipartisan distaste for these facilities , began changing course himself. Developers said the governor’s office had stopped responding to their emails. On September 21, Abbott directed a key state regulator to halt data center permits. Many panelists at the conference were expecting this to mean that existing projects might be slowed and new ones could be halted altogether. The governor-elect indeed seems eager to do that. Hinojosa supported tax breaks for data centers in 2023 as a way to boost construction jobs, but during her campaign she began pushing for a full-fledged moratorium. That would be a problem for the hyperscalers of Big Tech, which have ambitious plans for AI training facilities in the state. The scale of projects already underway in Texas is massive. The Stargate Frontier data center in Shackelford County is projected to serve 1,820 megawatts—about as much as the nation’s largest data center, SpaceX’s Colossus 2 in Tennessee, and more than twice as much as the largest data center currently operating in Texas. Nexus Hubbard, also under construction and intended mostly to serve Anthropic, has a planned size of 6,400 megawatts and is the second-largest data center being built in the US, behind only Meta’s Hyperion project in Louisiana. The potential for Democrats to order delays to these projects or moratoriums on new ones adds to growing anxiety that the AI buildout could stall. Banks and lenders are already getting pickier about the projects they back. And given the extent to which the data center buildout is underpinning growth in the economy right now, those forces combined could have rip", "date_str": "2026-11-04T18:50:55+00:00", "hash": "b6e2d388ab37d010", "title_fa": "تگزاس مرکز جدید ساخت مرکز داده هوش مصنوعی بود. این ممکن است کاپوت باشد.", "summary_fa": "تگزاس سریعترین بازار مرکز داده در ایالات متحده در حال رشد است و برای بزرگترین ساختمان های هوش مصنوعی بیگ تک. اما موج آبی که ایالت Lone Star را در نوردید ممکن است این موقعیت را به خطر بیندازد. جیمز تالاریکو، دموکرات، کرسی سنای آمریکا را در برابر کن پکستون به دست آورد. جینا هینوجوسا در رقابت برای فرمانداری در برابر گرگ ابوت، رئیس جمهوری خواه، پیروز شد. در سطح ایالتی، دموکرات ها برای اولین بار در 24 سال گذشته کنترل مجلس تگزاس را در دست خواهند گرفت. Talarico و Hinojosa مراکز داده را به یک موضوع اصلی تبدیل کردند و دائماً در مسیر مبارزات انتخاباتی در مورد آنها بحث می کردند. حتی قبل از بسته شدن نظرسنجی ها، خودی ها در صنعت مرکز داده متوجه شدند که زمان در حال تغییر است. در کنفرانس DCD صنعت در Ashburn، ویرجینیا، در روز سه‌شنبه، اعضای پانل از این که تگزاس برای سال‌ها آسان‌ترین مکان برای ساختن بود - تا سپتامبر - ابراز تاسف کردند. آن زمان بود که ابوت، شاید با مشاهده بیزاری فزاینده دو حزبی نسبت به این امکانات، شروع به تغییر مسیر خود کرد. توسعه دهندگان گفتند که دفتر فرمانداری پاسخ به ایمیل های آنها را متوقف کرده است. در 21 سپتامبر، ابوت به یک تنظیم کننده کلیدی ایالت دستور داد تا مجوزهای مراکز داده را متوقف کند. بسیاری از شرکت کنندگان در کنفرانس انتظار داشتند که این بدان معنا باشد که پروژه های موجود ممکن است کند شده و پروژه های جدید به طور کلی متوقف شوند. فرماندار منتخب واقعاً مشتاق به انجام این کار است. هینوجوسا از معافیت های مالیاتی برای مراکز داده در سال 2023 به عنوان راهی برای افزایش مشاغل ساخت و ساز حمایت کرد، اما در طول مبارزات انتخاباتی خود شروع به اصرار برای مهلت قانونی تمام عیار کرد. این مشکلی برای فرامقیاس کننده", "image_url": "https://wp.technologyreview.com/wp-content/uploads/2026/11/GettyImages-2303431102.jpg?resize=1200,600", "category": "هوش مصنوعی مولد", "tags": ["هوش مصنوعی", "Anthropic", "Meta"], "datetime_fa": "۱۳ آبان • ۲۲:۲۰"}, {"source": "MIT Tech Review", "title": "Roundtables: Inside the Quest for Cognitive Immortality", "link": "https://www.technologyreview.com/2026/11/04/1148049/roundtables-inside-the-quest-for-cognitive-immortality/", "summary": "Tuesday, November 17, 2026 In an effort to reach an elusive continuity of the self, some far-thinking technologists are working on ways to keep your brain going—even beyond death. Join science editor Mary Beth Griggs and senior editor for biomedicine Antonio Regalado for a conversation exploring possible paths to keep your mind going, including gradual brain replacement and uploading our memories to the cloud. Going live at 17:00 GMT / 12pm  this out as soon as possible, first install Firefox Nightly on your Mac or PC. Once up and running, you can launch Mini Window by right-clicking on a tab header and choosing Move Tab Move to Mini Window . The tab shrinks and drops down to the lower right corner by default, staying on top of all other windows (not just Firefox). You can then scroll through the page and follow links as normal in the Mini Window any links set to open in a new tab (manually or automatically) will launch in the main Firefox view, not the window overlay. By dragging the title bar around, you can put your Mini Window anywhere you want on screen, and you can change its size by dragging the edges of the window too so it doesn't necessarily have to be all that \"mini.\" Firefox hides all buttons by default including forward, backward, and refresh buttons, together with the address bar and buttons for closing the window or putting it back as a normal tab though they appear when you hover over the Mini Window. I'm finding the feature most useful when writing up articles where I need to refer to something else already on the web (so almost all of them), but there are a host of ways this can be used. It's particul", "date_str": "2026-11-04T18:30:00+00:00", "hash": "31935b3ee26161aa", "title_fa": "ویژگی جدید \"Mini Window\" فایرفاکس یک تغییر دهنده بازی برای بهره وری است", "summary_fa": "برای بسیاری از ما، مرور وب شامل دستکاری ده ها تب به طور همزمان است، و گم شدن صفحات مهم در هرج و مرج آسان است. اکنون، فایرفاکس چیزی را معرفی کرده است که فکر می کنم می تواند به ما چند وظیفه ای کمک کند: یک \"پنجره کوچک\". همانطور که توسط جک والن ZDNET مشخص شده است، این ویژگی جدید فایرفاکس مانند پوشش تصویر در تصویر فقط برای ویدیوها در اینجا کار می کند، که PiP یک وب سایت را نمایش می دهد. «[Mini Window] به شما امکان می‌دهد یک برگه یا یک بخش انتخاب شده از یک صفحه را به یک پنجره جمع‌وجور منتقل کنید که در هنگام مرور در بالای پنجره‌های دیگر شما باقی می‌ماند. زمانی که چندوظیفه‌ای را انجام می‌دهید مفید است و باید چند منبع اطلاعاتی را هم‌زمان در معرض دید قرار دهید: اسناد مرجع، چت، تماس ویدیویی، فرمی که در حال پر کردن آن هستید.» به این ترتیب، پنجره کوچک لزوما جایگزین زبانه های در حال اجرا در کنار هم نیست. در عوض، می توانید یک برگه را در یک پنجره با اندازه کامل اولویت بندی کنید، در حالی که صفحه دیگری را همیشه در معرض دید نگه دارید. این قابلیتی است که هنوز در مراحل اولیه است و در حال حاضر فقط می‌توانید آن را در نسخه «شبانه» فایرفاکس، یک نسخه بتا اولیه مرورگر، دریافت کنید. موزیلا می گوید که این ویژگی را در اواخر این ماه به نسخه کامل مرورگر منتقل می کند. نحوه امتحان Mini Window در فایرفاکس در حال حاضر این ویژگی از طریق منوی کلیک راست در دسترس است. اعتبار: Lifehacker اگر می‌خواهید در اسرع وقت این کار را امتحان کنید، ابتدا Firefox Nightly را روی مک یا رایانه شخصی خود نصب کنید. پس از راه‌اندازی، می‌توانید پنجره کوچک را با کلیک راست روی سربرگ برگه و انتخاب Move", "image_url": "https://lifehacker.com/imagery/articles/01M6KV55KG319MNBV47A9QNZ6Z/hero-image.fill.size_1200x675.jpg", "category": "هوش مصنوعی مولد", "tags": ["فناوری", "نوآوری"], "datetime_fa": "۱۳ آبان • ۲۲:۰۰"}, {"source": "Lifehacker", "title": "10 Shows Like 'Phony' You Should Watch Next", "link": "https://lifehacker.com/entertainment/best-shows-like-phony?utm_medium=RSS", "summary": "We may earn a commission from links on this page. What if you knew your mom wasn't really your mom, but no one believed you? That's the improbable but entertaining premise of Hulu's Phony , which stars Sam Nivola as a teenager who wakes up from a car accident and quickly comes to believe that his mother ( Friday Night Lights ' Connie Britton) is an imposter. Of course, no one believes him. I'm not sure I believe him, but it'll be pretty boring if it turns out that he just had a really bad concussion the whole time. It's a coming-of-age drama and a surreal mystery with hints of comedy, and though it borrows elements from other shows, it stands apart for the skill with which it blends everything together. While you wait to see how the story plays out, here are 10 more twisted mysteries to stream now. Apple Cider Vinegar (2025) A twisty-turny (and well-reviewed) bit of fake identity folderol, Apple Cider Vinegar stars Kaitlyn Dever as Belle Gibson, a real-life Australian cancer survivor (except not really!) With a cheeky sense of humor and a willingness to distort reality, the show follows the wellness influencer as she fakes multiple cancer diagnoses in order to better market her alternative, MAHA-esque app and remedies to the unwitting. As her livelihood comes under threat, her lies grow more elaborate. Stream Apple Cider Vinegar on Netflix . Apple Cider Vinegar (2025) at Netflix Learn More Learn More at Netflix Search Party (2016 2022) Alia Shawkat stars here as Dory Sief, an aimless millennial who decides, after seeing a missing-person poster for a college acquaintance, that she's going to make it her purpose to track her down with the extremely begrudging support of her friends. But neither Chantal nor her disappearance are anything like what Dory expects. The show shifts focus from season to season. Initially a darkly comic take on a Nancy Drew-style mystery, it later finds the gang desperate to cover up a mostly unintentional murder, and getting in deeper each season. It's a funny, smart, and weird and shares talent with Phony in the form of writer/producer Anthony King, who serves as co-showrunner on the new series. Stream Search Party on Netflix. Search Party (2016 2022) at Netflix Learn More Learn More at Netflix The 'Burbs (2026 ) This one's largely about adults, so it skips the coming-of-age angle central to Phony, but it has a quirky mystery, gaslighting, and a protagonist whose sanity is questioned by just about everyone all the same. This fun a", "date_str": "2026-11-04T18:00:00+00:00", "hash": "9cc408505b7e014b", "title_fa": "10 نمایش مانند \"فنی\" که باید در ادامه تماشا کنید", "summary_fa": "ممکن است از پیوندهای موجود در این صفحه کمیسیون دریافت کنیم. اگر می دانستی مادرت واقعاً مادرت نیست، اما هیچکس حر tegory": "هوش مصنوعی مولد", "tags": ["هوش مصنوعی", "Google"], "datetime_fa": "۱۳ آبان • ۲۰:۴۴"}, {"source": "Engadget", "title": "Elon Musk spent nearly $500 million on the midterms and lost big-time", "link": "https://www.engadget.com/2306698/elon-musk-spent-nearly-500-million-on-the-midterms-and-lost-bigtime/", "summary": "This was the Cybertruck of elections.", "date_str": "2026-11-04T17:01:10+00:00", "hash": "391988bfdcea4916", "title_fa": "ایلان ماسک نزدیک به 500 میلیون دلار برای انتخابات میان دوره ای هزینه کرد و باخت", "summary_fa": "Scott Olson/Getty Images افزودن Engadget به Google: منبع ترجیحی Google Discover میان‌ترم‌ها (بیشتر) پشت سر ما هستند. ما هنوز منتظر نتایج یک دسته از مسابقات، از جمله مسابقات سنا در می سی سی پی و آلاسکا هستیم. با وجود این، دو واقعیت غیرقابل انکار وجود دارد. این یک انتخابات جهنمی عالی برای دموکرات ها و یک انتخابات واقعا بد برای ایلان ماسک، یکی از شرکای \"MAGA تاریک\" بود. بر اساس پرونده های FEC گزارش شده توسط فوربس، مدیرعامل تسلا نزدیک به 500 میلیون دلار برای انتخاب نامزدهای جمهوری خواه هزینه کرده است. ماسک با اختلاف زیادی بزرگترین اهداکننده انفرادی انتخابات بود و از زوج میلیاردر رتبه دوم یعنی دیک و لیز اویهلاین بیش از سه برابر فاصله گرفت. به نظر نمی‌رسید که او در ازای سرمایه‌گذاری‌اش چیز زیادی دریافت کند، که احتمالاً در روزها، هفته‌ها، ماه‌ها و سال‌های آینده پست‌های خشمگین و عجیبی را در X منتشر می‌کند. حدس بزنید لیزرهای فضایی مداخله گر انتخابات من این بار کار نکرد 🤷‍♂️ بیشتر پول او در خانه فرزندخوانده اش در تگزاس خرج شد. طبق گزارش CNBC، ماسک در مجموع حدود 225 میلیون دلار به منطقه انتقال داده است. Lone Star State توبیخ خیره کننده ای از ماسک و نامزدهای منتخب او صادر کرد. یک صندلی مجلس سنا و فرمانداری هر دو به رنگ آبی درآمدند، با حاشیه های بسیار. همین را می توان در مورد کرسی های متعدد مجلس و تعدادی از کرسی های کنگره ایالتی گفت. ماسک احتمالاً بهتر بود این پول را برای ماشین دیگری خرج می کرد که مانند کریکت می پرد. ماسک همچنین پول نقد زیادی را برای تعدادی از Super PAC ها و نامزدهای خاص در سراسر کشور ارسال کرد. او در 106 انتخابات مجلس نماین  all controlled by the same party—the Democrats in the first case and the Republicans in the second Now Democrats have captured a majority in both the Senate and the House. But Donald Trump is still in the White House. And crucially, neither chamber is anywhere close to a two-thirds Democratic majority. That’s the ratio that would be needed to override a presidential veto. So even if Congress puts together new legislation to boost climate measures and clean energy, Trump will need to sign it—and that dramatically narrows the scope of what might happen legislatively between now and the next election. There could be some bipartisan compromises. One interesting bit of legislation to watch immediately after the election is what happens with permitting reform. In late September, a bipartisan group of senators put forward a bill that would overhaul how new energy projects are reviewed and approved in the US. The law aims to cut red tape and speed up the permitting process. The Senate is set to vote on that package, called the Bipartisan American Afforda", "date_str": "2026-11-04T17:08:00+00:00", "hash": "8934d263182546f7", "title_fa": "آینده سیاست انرژی ایالات متحده پس از انتخابات میان دوره ای چیست؟", "summary_fa": "از زمانی که نتایج انتخابات میان‌دوره‌ای از شب گذشته منتشر شد، در صفحه‌های مختلف خود قفل شده‌ام. و دیری نپایید که آغاز موج آبی را دیدیم: دموکرات‌ها کنترل مجلس نمایندگان و سنا را به دست گرفتند، یک نوسان چشمگیر نسبت به پیروزی دونالد ترامپ در دو سال پیش. در حالی که نتایج قابل توجه است، احتمالاً شاهد برخی از تغییرات بزرگ سیاست آب و هوا و انرژی که در سال های اخیر با تغییر دست کنگره و ریاست جمهوری رخ داده است، نخواهیم بود. در عوض، ما در حال ورود به دوره ای از یک دولت تقسیم شده، با کنگره ای هستیم که احتمالا در دو سال آینده با کاخ سفید ترامپ مبارزه خواهد کرد. اما حتی اگر دولت فدرال به احتمال زیاد قوانینی را برای اصلاح سیاست های انرژی و آب و هوا تصویب نکند، نتایج میان مدت می تواند برای انرژی، به ویژه در سطح ایالتی و محلی، بسیار مهم باشد. بیایید یک لحظه به عقب برگردیم تا www.theguardian.com/books/2026/nov/04/jeanette-winterson-point-about-ai-brings-to-mind-an-isaac-asimov-story", "summary": "Ed Kelsey and Arthur Gould respond to an interview with the author in which she discussed AI and the future of humanity I thoroughly enjoyed the interview with Jeanette Winterson ( ‘There is no inevitable dystopia’: Jeanette Winterson on AI and the future of humanity, 28 October ), particularly her quote from Jill Lepore that we are living out the sci-fi books that tech leaders read when they were 13. I was one of those 13-year-olds, and my favourite author was Isaac Asimov. Many of his stories accurately predicted our modern world, from mobile technology to AI (through his fictional supercomputer Multivac). However, it was Winterson’s closing point – that “of course we will specialise. We need doctors and chemists, but we also need what used to be called well-rounded people” – that really made me smile. Continue reading...", "date_str": "2026-11-04T17:00:30+00:00", "hash": "02501530e16c2246", "title_fa": "نکته ژانت وینترسون در مورد هوش مصنوعی داستان ایزاک آسیموف را به ذهن می آورد | نامه ها", "summary_fa": "اد کلسی و آرتور گولد به مصاحبه‌ای با نویسنده که در آن درباره هوش مصنوعی و آینده بشریت صحبت کرده بود، پاسخ دادند. 13. من یکی از آن نوجوانان 13 ساله بودم و نویسنده مورد علاقه من اسحاق آسیموف بود. بسیاری از داستان‌های او دنیای مدرن ما را به دقت پیش‌بینی می‌کردند، از فناوری تلفن همراه گرفته تا هوش مصنوعی (از طریق ابررایانه خیالی او Multivac). با این حال، این نقطه پایانی وینترسون بود - که \"البته ما متخصص خواهیم شد. ما به پزشکان و شیمیدان ها نیاز داریم، اما همچنین به افرادی نیاز داریم که قبلاً به آنها افراد خوب گفته می شد\" - واقعاً باعث لبخند من شد. به خواندن ادامه دهید... بلافاصله داستان آسیموف را به ذهنم آورد که 50 سال در ذهنم مانده است: حرفه (منتشر شده در نه فردا در سال 1959). این نیازهای متخصص آینده جهان های بسیار تخصصی و خودکار و نیاز مطلق برخی از آن متخصصان را به \"خوبی\" نشان می دهد، که منعکس کننده دیدگاه وینترسون است، بنابراین دقیقاً عجیب riving the Slate electric truck prototype", "link": "https://arstechnica.com/cars/2026/11/what-i-learned-driving-the-slate-electric-truck-prototype/", "summary": "If my 45-minute drive yesterday morning is anything to go by, I think Slate Auto will have quite the hit on its hands. The startup had one of its prototype trucks in town and asked if I wanted to check it out—no jumping on a plane or having to spend yet another night in an interchangeable hotel room, just a drive from southwest DC to Rockville, Maryland. Easy-peasy. The prototype truck had been well-used, with almost 6,000 miles (9,656 km) showing on the small and minimalist but very legible digital display that also shows your speed and, if you engage reverse, the backup camera. And while the cabin layout was representative of the production version, the surfaces most certainly weren’t—the prototype instead uses a lot of hard and shiny black plastic, with strips of Velcro here and there left over from when the interior had to be camouflaged when the vehicle was out in public. Getting acquainted with the Slate was refreshingly easy. The Morris Marina-like door handles open with a pleasing mechanical action. The seat and steering column adjust manually but with plenty of reach, something many budget models used to leave out to save on cost. Read full article Comments", "date_str": "2026-11-04T15:42:18+00:00", "hash": "7d5e5977a2f68a5e", "title_fa": "آنچه در رانندگی نمونه اولیه کامیون الکتریکی Slate آموختم", "summary_fa": "اگر دیروز صبح رانندگی 45 دقیقه ای من قابل قبول باشد، فکر می کنم Slate Auto در دستان خود بسیار موفق خواهد بود. استارت‌آپ یکی از نمونه‌های اولیه کامیون‌های خود را در شهر داشت و از من پرسید که آیا می‌خواهم آن را بررسی کنم - نه پریدن در هواپیما یا مجبور به گذراندن یک شب دیگر در یک اتاق هتل قابل تعویض، فقط یک رانندگی از جنوب غربی دی سی تا راکویل، مریلند. آسان-پیزی. نمونه اولیه کامیون به خوبی مورد استفاده قرار گرفته بود و تقریباً 6000 مایل (9656 کیلومتر) روی صفحه نمایش دیجیتال کوچک و مینیمالیستی اما بسیار خوانا نشان داده می شد که سرعت شما را نیز نشان می دهد و در صورت گرفتن معکوس، دوربین پشتیبان را نیز نشان می دهد. و در حالی که چیدمان کابین نمایانگر نسخه تولیدی بود، سطوح بدون شک چنین نبودند – نمونه اولیه در عوض از پلاستیک سخت و براق مشکی استفاده می‌کند، با نوارهایی از Velcro در اینجا و آنجا باقیمانده از زمانی که داخل خودرو زمانی که خودرو در معرض دید عموم قرار می‌گرفت استتار می‌شد. آشنایی با اسلیت بسیار آسان بود. دستگیره های درب مانند مارینا موریس با عملکرد مکانیکی دلپذیری باز می شوند. صندلی و ستون فرمان به صورت دستی تنظیم می شوند اما با دسترسی زیاد، چیزی که بسیاری از مدل های مقرون به صرفه برای صرفه جویی در هزینه آن را کنار گذاشته بودند. مقاله کامل را بخوانید نظرات تنظیمات متن متن داستان اندازه کوچک استاندارد پهنای بزرگ * پیوندهای عریض استاندارد استاندارد نارنجی * فقط مشترکین بیشتر بیاموزید به حداقل رساندن برای پیمایش اگر 45 دقیقه رانندگی من دیروز صبح چیز خوبی باشد، من فکر می کنم Slate Auto بسیار موفق خواهد بود. استارت‌آپ یکی از نمونه‌های اولیه کامیون‌های خود را در شهر داشت و از من پرسید که آیا می‌خواهم آن را", "image_url": "https://cdn.arstechnica.net/wp-content/uploads/2026/11/slate-in-car-1152x648.jpg", "category": "هوش مصنوعی مولد", "tags": ["فناوری", "نوآوری"], "datetime_fa": "۱۳ آبان • ۱۹:۱۲"}, {"source": "Ars Technica", "title": "The DEA banned a drug some opioid users called a miracle", "link": "https://arstechnica.com/health/2026/11/the-dea-banned-a-drug-some-opioid-users-called-a-miracle/", "summary": "In 2012, as the driver of deaths in the opioid crisis began moving from prescription pills to heroin, Laura Bohn was tasked with finding safer drugs to manage pain. Funded by the National Institute on Drug Abuse, in 2017 she and other scientists revealed in the science journal Cell that several compounds—including a particularly promising one called SR-17018—could relieve pain in mice without causing respiratory depression. That’s a big deal, because respiratory depression is typically what causes people using opioids to stop breathing and die. Bohn, t for dinner every week.", "link": "https://www.businessinsider.com/gordon-ramsay-easy-pasta-bolognese-recipe-2026-11", "summary": "Gordon Ramsay s 15-minute pasta has been on regular rotation in my family s kitchen. Michael Yarish/WBTV via Getty Images One of my favorite pasta recipes is Gordon Ramsay's tagliatelle with sausage Bolognese. The recipe requires just a few ingredients and only takes 15 minutes. My family loves Ramsay's pasta so much that they make it every week. When my family and I stumbled upon \"Gordon Ramsay's Ultimate Cookery Course,\" we had no idea we were about to discover one of our favorite weekly pasta recipes . The series — which first aired in the UK in 2012 — follows Ramsay as he demonstrates 100 essential recipes for the home chef . It was one of our comfort watches in those early days of the pandemic. And the 15-minute tagliatelle with sausage Bolognese, one of Ramsay's recipes from the show, became our comfort dinner. Six years later, it's still a family favorite. Here's how to make it. Gordon Ramsay s 15-minute tagliatelle with sausage Bolognese requires five main ingredients. Anneta Konstantinides/Business Insider To whip up this delicious dish, you'll need: Dried tagliatelle pasta Sausages (Ramsay recommends fennel or Sicilian) Tomatoes Half an onion A few cloves of garlic If you can't find tagliatelle at your local supermarket, pappardelle always makes for a great substitute. I always start this dish by chopping onions, garlic, and parsley. Anneta Konstantinides/Business Insider One of the best parts about this dish is that there's barely any prep. It takes me about five minutes or less to prepare everything before I start cooking. While Italian parsley isn't part of Ramsay's recipe, I love adding it if I have any lying around. The herb brightens all the flavors and brings a bit of freshness and color to the dish. I also dice some tomatoes. Anneta Konstantinides/Business Insider This dish can easily be adapted to your preferences and what you already have in your kitchen. On this night, I used cocktail tomatoes, which have a juiciness that works great in the Bolognese sauce . Before cooking, I also prep the sausage. Anneta Konstantinides/Business Insider You need to peel the casings from the sausages before crumbling the meat. Ramsay recommends slicing each sausage down the middle to help remove the skin. After putting my pasta into a pot of salted boiling water, I throw my onions into a pan. Anneta Konstantinides/Business Insider I let the onions cook for a few minutes before adding the rest of the ingredients. Then it s time to throw in the garlic and", "date_str": "2026-11-04T16:07:14+00:00", "hash": "b536b5f816506efc", "title_fa": "من پاستا بولونی 15 دقیقه ای گوردون رمزی را امتحان کردم. الان خانواده من هر هفته برای شام درست می کنند.", "summary_fa": "پاستا 15 دقیقه ای گوردون رمزی در آشپزخانه خانواده من به طور منظم در حال چرخش است. مایکل یاریش/WBTV از طریق گتی ایماژ یکی از دستور العمل های ماکارونی مورد علاقه من، تالیاتل گوردون رمزی با سوسیس بولونیزی است. دستور پخت فقط به چند ماده نیاز دارد و فقط 15 دقیقه طول می کشد. خانواده من آنقدر ماکارونی رمزی را دوست دارند که هر هفته آن را درست می کنند. هنگامی که من و خانواده ام به طور تصادفی با \"کورس آشپزی نهایی گوردون رمزی\" مواجه شدیم، نمی دانستیم که قرار است یکی از دستور العمل های هفتگی ماکارونی مورد علاقه خود را کشف کنیم. این سریال - که اولین بار در سال 2012 در بریتانیا پخش شد - رمزی را دنبال می کند که 100 دستور غذای ضروری را برای سرآشپز خانه نشان می دهد. این یکی از ساعت های راحتی ما در آن روزهای اولیه همه گیری بود. و تالیاتل 15 دقیقه ای با سوسیس بولونیز، یکی از دستور العمل های رمزی در این برنامه، شام راحتی ما شد. شش سال بعد، هنوز هم محبوب خانواده است. در اینجا نحوه ساخت آن آمده است. تالیاتل 15 دقیقه ای گوردون رمزی با سوسیس بولونی به پنج ماده اصلی نیاز دارد. Anneta Konstantinides/Business Insider برای درست کردن این غذای خوشمزه، به این موارد نیاز دارید: سوسیس پاستا تالیاتل خشک (رامسی رازیانه یا سیسیلی را توصیه می کند) گوجه فرنگی نصف پیاز چند حبه سی  ad, and the company lost a string of partners. The Good Good ad, since pulled, was meant to be a riff on horror movie Obsession. Good Good Good Good took down the ad and apologized, as did Callaway. Callaway said that while the company was not involved in its production, its review process was inadequate. Both said the ad was inconsistent with their values. In a civil suit filed in Texas, former brand and marketing VP Jeff Lefkovits says that the scene was \"conceived of and approved on set,\" not in the original \"lighthearted parody script\" he approved. He alleges that the finished ad was \"embraced by Good Good's own performers and owners and approved in writing by Callaway.\" The suit says Lefkovits was falsely blamed for the ad, and alleges defamation by Good Good and Kendrick, the former CEO. It seeks more than $1 million in relief. Neither Good Good nor Kendrick have filed a legal response to the suit. Kendrick and reps for Good Good didn't immediately respond to requests for comment. The ad debacle was a striking turn of events for Good Good, which had been widely regarded as a creator-economy success story. The YouTube group, known for its high-energy golf videos, had built a string of retail partnerships and raised $45 million last year. In the aftermath of the ad,", "date_str": "2026-11-04T16:01:58+00:00", "hash": "6052e96a010720e1", "title_fa": "بازاریاب اخراج شده خوب خوب از شرکت شکایت کرد و مدعی شد که در جریان تبلیغات Callaway بدنام شده است.", "summary_fa": "گرت کلارک، یکی از بنیانگذاران Good Good، در تبلیغی به نمایش درآمد که با واکنش های منفی روبرو شد. جارد سی. تیلتون/ گتی ایماژ معاون سابق بازاریابی Good Good از این شرکت شکایت کرد و ادعای افترا کرد. کت و شلوار جف لفکوویتس می گوید که یک صحنه جنجالی در یک تبلیغ ساخته شده برای کالاوی بدون اطلاع او اضافه شده است. Lefkovits یکی از کسانی بود که پس از واکنش شدید به این تبلیغ از سمت خود برکنار شد. مدیر بازاریابی سابق Good Good از این شرکت و مدیر عامل سابق آن شکایت کرده است و مدعی است که او به دلیل تبلیغ جنجالی که برای کالاوی ساخته شده بود، قربانی شده است. هدف از این تبلیغ، تبلیغ یک راننده Callaway بود که با همکاری Good Good، گروه سازنده‌ای که ویدیوهای گلف آن در YouTube پرطرفدار است، نامگذاری شده بود. در آگهی، یکی از بنیانگذاران Good Good، گرت کلارک، به سمت یکی از اعضای زن گروه به نام الکسیس میستوفسکی می دود و او را روی زمین هل می دهد و می گوید: \"به راننده جدید من دست نزنید.\" مت کندریک و کلارک، مدیر اجرایی آن زمان، در آن زمان گفتند که این تبلیغ به عنوان یک ریف بر روی فیلم ترسناک محبوب «وسواس» است. ایده این بود که کلارک تا سر حد جنون وسواس زیادی با چوب گلف پیدا کرده بود. این تبلیغ با صدای بلندی فرود آمد زیرا منتقدان گفتند که خشونت خانگی را نادیده می گیرد. دو مدیر ارشد گود گود، کندریک و جو فلانری، رئیس جمهور وقت، در پی این تبلیغ رفتند و شرکت تعدادی از شرکا را از دست داد. تبلیغ خوب خوب، از زمان انتشار، قرار بود یک ریف بر روی فیلم ترسناک Obsession باشد. خوب خوب خوب خوب آگهی را حذف کرد و عذرخواهی کرد، همانطور که Callaway هم انجام داد. Callaway", "image_url": "https://i.insider.com/6aeb3eec308912814ed70be7?width=1200&format=jpeg", "category": "هوش مصنوعی مولد", "tags": ["سینما"], "datetime_fa": "۱۳ آبان • ۱۹:۳۱"}, {"source": "Business Insider", "title": "The best large dog beds", "link": "https://www.businessinsider.com/guides/pets/best-large-dog-beds", "summary": "When you buy through our links, Business Insider may earn an affiliate commission. Learn more We tested the best big dog beds with a pack of large and giant breed dogs. Rachael Schultz; Amy Graves/Business Insider Large breed dogs have specific requirements when it comes to choosing a suitable bed. The best large dog beds offer superior cushioning, strong support, and durability. Large dogs typically weigh between 50 and 90 pounds, while giant breeds can tip the scales at 90 to 180 pounds. Because of their greater size and weight, they benefit from high-quality foam that helps reduce joint pain and pressure sores, issues that are more common in larger breeds. To identify the top options, we tested 17 beds with a  released details about Russian missile capabilities. The assessment said Russia is increasing the range of some ballistic and anti-ship missiles. It also said Moscow has stockpiled thousands of ballistic and cruise missiles. Russia is working to increase the range of some ballistic and anti-ship missiles, giving the latter a more powerful warhead, according to a new assessment from Ukraine's military intelligence agency. The assessment comes as Ukraine endures worsening Russian missile and drone attacks, while facing a shortage of interceptors and other air defense equipment to stop the deadly bombardments. The agency, also known as the GUR, said on Wednesday that Russia is developing a modernized variant of its 9M723 \"Iskander-M,\" a tactical ballistic missile, with a projected range of 340 to 440 miles — roughly 100 farther than its predecessor. The GUR said in August that Russia had used an upgraded \"Iskander-1000\" missile for the first time over the summer. It was modified with a larger engine and launcher to increase its range. Russia has also armed its 3M55 \"Oniks\" anti-ship missiles with larger warheads and increased their range \"to enhance their effectiveness against ground targets,\" the GUR said. It did not disclose specifics, but said Moscow has produced dozens over the past seven months. Russia's defense ministry and its US embassy did not immediately respond to a request for comment on the GUR's assessment. The assessment comes as Russia has ramped up its missile and drone attacks in recent months. As winter draws near, strikes on Ukraine's critical energy infrastructure in particular have civilians bracing for yet another brutal stretch. Russia has stockpiled hundreds of ballistic missiles and thousands of cruise missiles, the GUR said. REUTERS Complicating matters is Ukraine's perpetual shortage of interceptors needed to defend against the Russian attacks. Kyiv has repeatedly lobbied for its allies to transfer more air defense missiles to shield cities from the bombardments. On Monday, Russian strikes against Ukraine's southern Zaporizhzhia region killed at least 33 people, according to Ukrainian officials. Meanwhile, the GUR said Russia \"maintains significant stockpiles of long-range missile weapons and continues to increase its production rate, despite international sanctions.\" Russian reserv", "date_str": "2026-11-04T15:46:30+00:00", "hash": "9bd3bc253b6c4b1e", "title_fa": "اوکراین می‌گوید روسیه به برخی از موشک‌های خود برد بیشتر و کلاهک‌های بزرگ‌تر می‌دهد", "summary_fa": "آژانس اطلاعات نظامی اوکراین اعلام کرد روسیه در حال افزایش برد برخی از موشک های خود است. رویترز آژانس اطلاعات نظامی اوکراین جزئیاتی در مورد توانایی های موشکی روسیه منتشر کرده است. در این ارزیابی آمده است که روسیه در حال افزایش برد برخی از موشک های بالستیک و ضد کشتی است. همچنین گفت که مسکو هزاران موشک بالستیک و کروز ذخیره کرده است. بر اساس ارزیابی جدید آژانس اطلاعات نظامی اوکراین، روسیه در حال تلاش برای افزایش برد برخی موشک‌های بالستیک و ضد کشتی است و به این موشک‌ها کلاهک قدرتمندتری می‌دهد. این ارزیابی در حالی انجام می شود که اوکراین حملات موشکی و پهپادی روسیه را تشدید می کند، در حالی که با کمبود رهگیرها و سایر تجهیزات دفاع هوایی برای توقف بمباران های مرگبار مواجه است. این آژانس که با نام GUR نیز شناخته می‌شود، روز چهارشنبه اعلام کرد که روسیه در حال توسعه یک نوع مدرن‌شده از موشک بالستیک تاکتیکی 9M723 خود است که برد آن بین 340 تا 440 مایل است که تقریباً 100 دورتر از نسل قبلی خود است. GUR در ماه اوت اعلام کرد که روسیه برای اولین بار در تابستان از موشک ارتقا یافته \"اسکندر-1000\" استفاده کرده است. برای افزایش برد آن با موتور و پرتابگر بزرگتر اصلاح شد. GUR گفت: روسیه همچنین موشک های ضد کشتی 3M55 \"Oniks\" خود را با کلاهک های بزرگتر مسلح کرده و برد آنها را \"برای افزایش کارایی آنها در برابر اهداف زمینی\" افزایش داده است. این شرکت جزئیاتی را فاش نکرد، اما گفت که مسکو در طول هفت ماه گذشته ده ها محصول تولید کرده است. وزارت دفاع روسیه و سفارت ایالات متحده آن بلافاصله به درخواست اظهار نظر درباره ارزیابی GUR پاسخ ندادند. این ارزیابی در حالی صورت می گیرد که روسیه در ماه های اخیر حملات موشکی و پهپادی خود را افزایش داده", "image_url": "https://i.insider.com/6aeb3eee9270da3cc6667f12?width=1200&format=jpeg", "category": "هوش مصنوعی مولد", "tags": ["فناوری", "نوآوری"], "datetime_fa": "۱۳ آبان • ۱۹:۱۶"}, {"source": "Business Insider", "title": "My husband moved to Barcelona for our relationship. Now, I'm the one who wants to leave.", "link": "https://www.businessinsider.com/husband-moved-for-love-and-my-career-want-to-leave-2026-11", "summary": "My husband s decision to leave his hometown was one of the most generous things anyone has ever done for me. Natalia Costa My husband loved his hometown, but he moved a few hours away so we could live in the same place. Over the years, we've built a beautiful life in Barcelona , but I know he misses his home. Now, I'm ready to move even farther away — and at first, I worried about asking that of my husband. When my husband and I first met, we were both 23, full of energy and big dreams. I had just graduated and was living in Barcelona, where I was born and raised. He lived in Peñíscola, the seaside town in Spain where I spent my vacations, a couple of hours away. He had built a world there full of friends, family, and joy, and ran his own local business. As he later told me, he never imagined that anything — or anyone — would change his lifestyle. It was mid-August when we first kissed. What followed was an intense roller coaster of love. A little like Sandy in \"Grease,\" though, I felt our story wasn't going to end just because summer did. After dating long-distance, we built a life together in Barcelona I could tell that my husband missed his hometown, but he also appreciated the life we built in Barcelona. Natalia Costa For the next nine months, we experienced all the misunderstandings that come with a long-distance relationship , but we also missed each other deeply and visited each other whenever we could. There were tough times — especially when I left the country altogether for a short-term job in California — but finally, in 2007, he got a place in Barcelona so that we could be together. I was building my journalism career in Barcelona, and creating a home base in the city felt essential. I wanted us to be together, but I wasn't ready to leave the work and opportunities I had there. My husband's choice to leave his small Mediterranean hometown and laid-back lifestyle for Barcelona — and get a new job here — was one of the most generous things anyone's ever done for me. Every time we visited his family in Peñíscola, I could see how much he missed it. He would take in the salty air, listen to the waves, and admire the imposing, restored castle that overlooks the town. We continued to build a life together in Barcelona, and got married in 2015. I knew that living here was bittersweet for him: As much as he loved our life, part of him still belonged to that little town by the sea. Last year, we finally managed to buy a small place of our own in Peñíscol", "date_str": "2026-11-04T15:44:01+00:00", "hash": "bf51d20a2fa4727a", "title_fa": "شوهرم برای رابطه ما به بارسلونا نقل مکان کرد. حالا من کسی هستم که می خواهد برود.", "summary_fa": "تصمیم شوهرم برای ترک زادگاهش یکی از سخاوتمندانه ترین کارهایی بود که کسی تا به حال برای من انجام داده است. ناتالیا کاستا شوهرم زادگاهش را دوست داشت، اما چند ساعتی به آنجا رفت تا بتوانیم در همان مکان زندگی کنیم. در طول سال ها، ما زندگی زیبایی را در بارسلونا ساخته ایم، اما می دانم که او دلتنگ خانه اش شده است. اکنون، من حاضرم حتی دورتر شوم - و در ابتدا نگران این بودم که از شوهرم بپرسم. وقتی من و شوهرم برای اولین بار با هم آشنا شدیم، هر دو 23 ساله بودیم، پر از انرژی و رویاهای بزرگ. من تازه فارغ التحصیل شده بودم و در بارسلونا زندگی می کردم، جایی که به دنیا آمدم و بزرگ شدم. او در پنیسکولا، شهر ساحلی اسپانیا زندگی می‌کرد که من تعطیلاتم را در آن گذراندم، چند ساعت دورتر. او در آنجا دنیایی پر از دوستان، خانواده و شادی ساخته بود و تجارت محلی خود را اداره می کرد. همانطور که بعداً به من گفت، هرگز تصور نمی کرد که چ s twofold: 1), investors are relieved that a major overhang has been removed for the market, and 2), they're looking ahead to a post-midterm rally, with stocks historically muddling through as they near the election before rallying in the months after. A 2% surge in the Nasdaq 100 also may also signal that investors don't see the AI trade suffering a major setback as Democrats get ready to wield power in Congress next year. Without a veto-proof majority to reshape the rules around things like data-center development, it's likely that debates around the AI buildout will continue to take place at the state and local level. Since 1970, the S P 500 has gained an average 14% in the six months following a midterm election, compared to the average 6% gain in non-midterm years, according to an analysis from BlackRock. \"The midterm elections come at the perfect time to rescue the stock market from its bout of AI-driven volatility. Stocks have historically tended to rally after the midterms regardless of the outcome,\" Justin Buell, the chief investment officer of Continuity Group, wrote in a note. \"There's that sigh of relief that comes with knowing what the results are and being able to move forward and contemplating a world where some of the more drastic of the rules and regulations that have been put in place over the last couple of years may be moderated,\" Art Hogan, the chief market strategist at B. Riley Wealth Management, told Business Insider. Here's the rundown of the market's biggest winners and losers: The winners 1. Healthcare stocks Mult", "date_str": "2026-11-04T15:32:59+00:00", "hash": "1864151a5f42591c", "title_fa": "در اینجا بزرگترین برندگان و بازندگان بازار از انتخابات میان دوره ای \"بلونامی\" هستند", "summary_fa": "در حالی که سرمایه گذاران موج آبی پیروزی های دموکرات ها را هضم کردند، بازارها روز چهارشنبه افزایش یافتند. در حالی که سرمایه‌گذاران در میان دوره‌ای سه‌شنبه، دموکرات‌ها را درگیر کردند، سهام UNGA ایالات متحده افزایش یافت. مراکز داده نقطه عطفی برا  to a national park. Its breathtaking landscapes and remote location made it a unique and memorable trip. In 2024, after a decade of striving, I achieved my goal of visiting all 63 major US national parks solo. Then — plot twist — on October 20, 2026, another National Park Service site was redesignated from \"national monument\" to \"national park\". Naturally, I immediately booked a trip to Arizona to visit Chiricahua National Park, the 64th major one in the US, to see what makes it special. Here's what it was like. The park is located in southeastern Arizona. Emily Hart Located in the remote southeastern corner of Arizona, Chiricahua National Park is about 120 miles southeast of Tucson. Because of its remote location, travelers need to arrive by car, either on a road trip or in a rental car after flying into Tucson, Arizona . I chose the latter. Chiricahua National Park has a rich history. Emily Hart Long before it became a national monument, the area was home to the Chiricahua Apache, who called its striking formations \"The Land of Standing-Up Rocks.\" In the late 1800s, Swedish immigrants Neil and Emma Erickson settled in Bonita Canyon. Their daughter, Lillian, helped turn the family property, Faraway Ranch, into a guest ranch before expanding the operation with her husband, Ed Riggs. They welcomed visitors who wanted to explore the unusual rock formations, helping introduce more people to the area and subsequently advocating to protect the landscape, which eventually became Chiricahua National Monument in 1924. And now? It's the newest major US national park. During my visit, there was no line at the entrance station and the park was free to enter. Emily Hart One of the first things that stood out to me about Chiricahua was how different the experience of visiting felt. Unlike some of the country's most popular national parks , there were no entrance lines, traffic backups, or crowds competing for parking. The park is free to enter and relatively small — the fourth-smallest national park by land area at 12,025 acres — making it possible to see quite a bit in a single day. Of course, that could change as the new designation brings more attention to this corner of Arizona. The landscape was unlike that of any other national park I ve visited. Emily Hart I did", "date_str": "2026-11-04T15:32:18+00:00", "hash": "c69d7fd237747cea", "title_fa": "من از جدیدترین پارک ملی ایالات متحده بازدید کردم. در اینجا به عنوان کسی که اکنون از همه 64 آنها بازدید کرده است، چگونه بود.", "summary_fa": "من از جدیدترین پارک ملی ایالات متحده، Chiricahua بازدید کردم. امیلی هارت من از تمام 64 پارک ملی بزرگ ایالات متحده، از جمله جدیدترین پارک، Chiricahua بازدید کرده ام. Chiricahua اخیرا از یک بنای تاریخی ملی به یک پارک ملی ارتقا یافته است. مناظر خیره کننده و موقعیت مکانی دورافتاده آن را به سفری بی نظیر و خاطره انگیز تبدیل کرده است. در سال 2024، پس از یک دهه تلاش، به هدفم رسیدم که به تنهایی از تمام 63 پارک ملی بزرگ ایالات متحده بازدید کنم. سپس - پیچ و تاب داستان - در 20 اکتبر 2026، یکی دیگر از سایت های خدمات پارک ملی از \"آثار ملی\" به \"پارک ملی\" تغییر نام داد. طبیعتاً، بلافاصله سفری به آریزونا رزرو کردم تا از پارک ملی Chiricahua، شصت و چهارمین پارک بزرگ ایالات متحده بازدید کنم تا ببینم چه چیزی آن را خاص می کند. اینطوری بود این پارک در جنوب شرقی آریزونا واقع شده است. Emily Hart واقع در گوشه دورافتاده جنوب شرقی آریزونا، پارک ملی Chiricahua در حدود 120 مایلی جنوب شرقی توسان است. به دلیل موقعیت دوردست، مسافران باید با ماشین خود به آنجا برسند، چه در یک سفر جاده ای یا با ماشین کرایه ای پس از پرواز به توسان، آریزونا. من دومی را انتخاب کردم. پارک ملی چیریکاهوا دارای تاریخ غنی است. امیلی هارت مدت‌ها قبل از تبدیل شدن به یک اثر تاریخی ملی، این منطقه محل زندگی آپاچی چیریکهوا بود که تشکیلات خیره‌کننده آن را «سرزمین صخره‌های ایستاده» نامیدند. در اواخر دهه 1800، نیل و اما اریکسون مهاجران سوئدی در بونیتا کنیون مستقر شدند. دختر آنها، لیلیان، قبل از گسترش عملیات با همسرش، اد ریگز، کمک کرد تا ملک خانوادگی، فاراوی رنچ، به مزرعه مهمان تبدیل شود. آن‌ها از بازدیدکنندگانی که می‌خواستند صخره‌های غیرمعمول را کاوش کنند، کمک کردند تا افراد بیشتری را با این", "image_url": "https://i.insider.com/6aeb4ffbc54bfafa65abeddf?width=1200&format=jpeg", "category": "فناوری و نوآوری", "tags": ["فناوری", "نوآوری"], "datetime_fa": "۱۳ آبان • ۱۹:۰۲"}, {"source": "Business Insider", "title": "I grew up in a trailer and was embarrassed to use food stamps. Now I own a $13 million company.", "link": "https://www.businessinsider.com/grew-up-poor-trailer-built-million-dollar-business-2026-11", "summary": "Erika Sinner grew up poor and started her own business. Courtesy of Erika Sinner Erika Sinner said she grew up poor in Missouri. She took a receptionist job for a pharmaceutical company while doing college at night. Eight years ago, she started her own pharmaceutical marketing company. This as-told-to essay is based on a conversation with Erika Sinner , founder of Directorie . It has been edited for length and clarity. My childhood was difficult. We lived in a trailer , where my mom struggled. I remember going to Walmart late at night to avoid the embarrassment of people seeing us use food stamps. My childhood left me feeling unworthy. To cope, I became a people pleaser . It wasn't until later that I turned that coping mechanism on its head. Bringing value to other people actually helped me succeed. I started my career as a receptionist At 18, I took a job as a hotel receptionist in St. Louis, which was a big city to me. I was exposed to other walks of life, like businesspeople and celebrities. I would ask how they made money, and they'd tell me. It changed how I thought about the possibilities for my future. The downside to the job was that it was 24/7. If the driver was sick, I'd be picking people up from the airport at 2 a.m. I wouldn't be able to get a degree with that sort of schedule. Because of that, I got a job as a receptionist at a pharmaceutical company . It was set hours, and I could do my homework at the desk while going to school at night. While I was there, I did everything to network. I even joined the company bowling team. As I learned about the different parts of the company, the marketing department stood out to me. I knew I wanted to join the team, but I needed a way to show them I was smart and capable. I faked a school project to showcase my skills That's when I told the lie that changed my life. I asked the VP of marketing to review a school project, telling him the grade was very important. In truth, there wasn't a project — I'd put the mock portfolio together just to showcase my skills. He complimented and critiqued my work, and I made all the changes he suggested before showing him the completed project. A few months later, a position opened on the marketing team, and he asked me to apply because I was talented and coachable. I didn't yet have the degree that the job required, but he knew I could do the work. I'd always known that luck happens when preparation meets opportunity. Sometimes, you have to make those opportunities for ", "date_str": "2026-11-04T15:26:01+00:00", "hash": "c53068c2653a7041", "title_fa": "من در یک تریلر بزرگ شدم و خجالت می کشیدم از کوپن غذا استفاده کنم. الان یک شرکت 13 میلیون دلاری دارم.", "summary_fa": "اریکا سینر فقیر بزرگ شد و کسب و کار خود را راه اندازی کرد. با حسن نیت از اریکا سینر اریکا سینر گفت که در میسوری فقیر بزرگ شده است. او در حالی که شبانه در دانشگاه مشغول به تحصیل بود، در یک شرکت داروسازی مشغول به کار شد. هشت سال پیش، او شرکت بازاریابی دارویی خود را راه اندازی کرد. این مقاله همانطور که گفته شد بر اساس گفتگو با اریکا سینر، بنیانگذار Directorie است. برای طول و وضوح ویرایش شده است. دوران کودکی من سخت گذشت. ما در یک تریلر زندگی می‌کردیم، جایی که مادرم تلاش می‌کرد. به یاد دارم که اواخر شب به والمارت رفتم تا از شرمندگی مردم که ما را از کوپن های غذا می بینند جلوگیری کنم. کودکی ام باعث شد احساس بی لیاقتی کنم. برای کنار آمدن، تبدیل به یک خشنود کننده مردم شدم. بعداً آن مکانیسم مقابله را روی سرش چرخاندم. ارزش بخشیدن به دیگران در واقع به من کمک کرد تا موفق شوم. من کار خود را به عنوان یک پذیرش شروع کردم در 18 سالگی، به عنوان پذیرش در هتل در سنت لوئیس، که برای من شهری بزرگ بود، کار کردم. من در معرض سایر اقشار زندگی بودم، مانند تاجرها و افراد مشهور. می پرسیدم چطور پول در می آورند و به من می گفتند. طرز فکر من در مورد احتمالات آینده ام را تغییر داد. نقطه ضعف کار این بود که 24/7 بود. اگر راننده مریض بود، ساعت 2 صبح مردم را از فرودگاه می‌بردم، نمی‌توانستم با این برنامه مدرک بگیرم. به همین دلیل، به عنوان مسئول پذیرش در یک شرکت داروسازی مشغول به کار شدم. ساعت تعیین شده بود و من می‌توانستم تکالیفم را پشت میز انجام دهم و شب‌ها به مدرسه می‌رفتم. زمانی که آنجا بودم، همه کارها را برای شبکه کردن انجام دادم. من حتی به", "image_url": "https://i.insider.com/6ae0af743ae265b597b027a4?width=1200&format=jpeg", "category": "هوش مصنوعی مولد", "tags": ["فناوری", "نوآوری"], "datetime_fa": "۱۳ آبان • ۱۸:۵۶"}, {"source": "Lifehacker", "title": "Your Android Can Get Hacked Without You Doing Anything at All", "link": "https://lifehacker.com/tech/your-android-can-get-hacked-without-you-doing-anything-at-all?utm_medium=RSS", "summary": "You probably know that clicking suspicious links online or opening attachments from strangers in an email or text is a recipe for hacking. It's a dangerous world out there online, so it's always important to be vigilant. However, the danger doesn't always involve something you do. There are ways to hack your devices without requiring any intervention on your part whatsoever and one such example is likely plaguing your Android device right now. This Android flaw doesn't require any interaction on your part As reported by The Hacker News , there is a critical Android security flaw that could enable remote code execution on your device. In other words, bad actors could use the flaw to run their own code on your phone, effectively taking over the device for their own gain. The flaw, identified as CVE-2026-58868, isn't universal, but it is widespread: It currently affects Android 14 through Android 17, the latest version of Google's OS. If your phone runs Android 12 or Android 13, it may be unaffected, as Google doesn't identify these versions in its security bulletin , but it doesn't explicitly rule them out, either. There are two silver linings here, however. One, Google hasn't confirmed any active exploits for this security flaw. While that isn't a guarantee that bad actors have missed this exploit so far, it at least opens that possibility. As such, there may be time for users to patch their devices before hackers truly take advantage of the flaw. Second, Google does have a patch for the flaw. The patch may not be available to you right away, however, as it's up to both the manufacturer of your phone and your carrier to issue these updates. Still, a patch is, at the very least, on its way. This flaw is perhaps the most important to fix, but it's not the only serious issue. In all, Google's latest bulletin highlights 216 vulnerabilities, and, of those, 23 are \"critical.\" As The Hacker News explains, two other of those critical flaws could also allow remote code execution when exploited. How to patch your Android phone against this security vulnerability To see whether the patch is installed on your end, open the Settings app on your phone, tap \"About phone\" or \"About tablet,\" then choose the Android version on-screen. Look for a date of \"2026-11-01\" or later. All security patches from Nov. 1 and on will fix this issue. If not, you'll ned to wait for the patch.", "date_str": "2026-11-04T16:00:28+00:00", "hash": "fd3e868c187beec9", "title_fa": "اندروید شما می تواند بدون انجام کاری هک شود", "summary_fa": "احتمالاً می‌دانید که کلیک کردن روی لینک‌های مشکوک آنلاین یا باز کردن پیوست‌های افراد غریبه در ایمیل یا متن، دستوری برای هک کردن است. دنیای آنلاین خطرناکی است، بنابراین همیشه مهم است که مراقب باشید. با این حال، خطر همیشه شامل کاری نیست که شما انجام می دهید. راه‌هایی برای هک کردن دستگاه‌های شما بدون نیاز به هیچ گونه مداخله‌ای از جانب شما وجود دارد و یکی از این نمونه‌ها احتمالاً در حال ng goodbye Farewell Yellow Brick Road tour. The singer s 49th and final tour kicked off in Allentown, Pa. on Sept. 8, 2018 and circled the world for more than five years and 330 shows, officially winding down on July 8, 2023 in Stockholm, Sweden before the final, final gigs in Mexico City. Watch John s Sacrifice video below.", "date_str": "2026-11-04T18:40:02+00:00", "hash": "2efb810716f76eb6", "title_fa": "اولین آهنگ التون جان که وارد کلوب میلیاردها یوتیوب شد ممکن است شما را شگفت زده کند", "summary_fa": "ویدیوی سر التون جان برای تک آهنگ Maudlin 1989 Sacrifice به کلوپ میلیارد بازدید کننده یوتیوب پیوست. تک‌آهنگی از بیست و دومین آلبوم استودیویی جان، خواب با گذشته در سال 1989، چالش وفادار ماندن در ازدواج را با ویدیویی با بازی کریس آیزاک، خواننده/ترانه‌سرا و یاسمین غوری، سوپرمدل، شرح می‌دهد. مرتبط با The Lettermen تونی بوتالا در 87 سالگی درگذشت برنی تاوپین با آلبوم انفرادی جدید خود صحبت می کند، با التون جان کار می کند و چرا نمی تواند نام تیلور سوئیفت را بگذارد. حقیقت یا جرات، سلنا گومز: من ذهن من) ایزاک را دنبال می کند که او و غوری در تلاشند تا ارتباط خود را به عنوان یک زوج متاهل حفظ کنند و در حین بزرگ کردن دختر خردسال خود، به نظر می رسد که ایزاک در اواخر ویدیو تک فرزندی را به عهده می گیرد. تصاویر این زوج در حال مبارزه با عکس‌هایی از جان، با عینک‌های گرد، کلاه پادگانی خیره‌شده و ژاکت مشابه در هم آمیخته شده‌اند که او شعر احساسی این آهنگ را می‌خواند: فقط یک کلمه ساده / دو قلب زندگی می‌کنند / در دو دنیای جداگانه / اما، فداکاری نیست / فداکاری نیست. به‌طور تکان‌دهنده، تصویر بصری این آهنگ که از آلبومی که در رتبه 100 در بیلبورد Hot 100 به اوج خود رسید. رتبه 23 در جدول آلبوم بیلبورد 200 اولین ویدیوی جان است که در یوتیوب به رکورد میلیاردی رسیده است و با اختلاف زیادی از دیگر کلیپ های پربازدید او بهتر است. جان 79 ساله ماه گذشته در استادیوم بانورته در مکزیکوسیتی اجرا کرد و دو کنسرت اجرا کرد که پایان تور خداحافظی طولانی او در جاده آجر زرد را رقم زد. چهل و نهمین و آخرین تور این خواننده در شهر آلنتاون، پانزدهم سپتامبر آغاز شد. 8 ژوئیه 2018 و بیش از پنج سال و 330 نمایش در", "image_url": "https://www.billboard.com/wp-content/uploads/2026/11/Elton-john-sacrifice-video-billboard-1800.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["موسیقی"], "datetime_fa": "۱۳ آبان • ۲۲:۱۰"}, {"source": "Billboard", "title": "Sombr Jokes He’s ‘Really Tough’ After Chipping His Tooth in a Not-So-Hardcore Way on Stage", "link": "https://www.billboard.com/music/music-news/sombr-chips-tooth-on-stage-again-jokes-really-tough-1236373972/", "summary": "Sombr might be singing with a lisp for a little while. While playing a concert at the Fiserv Forum in Milwaukee on Tuesday (Nov. 3), the musician chipped his tooth in an unexpected way. Related Watch ’The Voice’ Singers Connor Closs Cal Cook Have a Fierce Falsetto-Off to Sombr’s ‘Homewrecker’ Sombr Joined by Fleetwood Mac Legend For Go Your Own Way At L.A. Show Sombr Shares How He Deals With Hate After Getting Advice From Taylor Swift, the Person I Look Up to Most In the middle of his set, the musician born Shane Boose took a moment to request a fan s phone so that he could quickly check his appearance in the selfie camera, as captured in videos from the show. Oh, s t! I chipped my tooth again! sombr exclaimed after examining his mouth. I’m so happy to inform all of you that Thombr has returned. At this point, the pop star is a pro at handling this exact snafu. He s chipped his tooth multiple times in the past — including when he lost a chunk of enamel while singing Billboard Hot 100 No. 7 hit Back to Friends in March 2025, which he posted a video of on TikTok — so much so that his fans have continued to embrace his Thombr alter ego . In previous instances, though, such dental injuries have been due to him rocking out too hard or jumping too forcefully while wrapped up in the music. But this time, it was a slightly less hardcore circumstance that did him in. I was just going over to take a sip of my water bottle, he explained Tuesday , smiling. I bang it on my tooth, and I chip my tooth. Make some noise for me. I’m really tough. Rock star. The pop star flashed his newly asymmetrical smile to the big-screen cameras, showing that his top left incisor was visibly much shorter and uneven compared to his right. Sombr is currently on his You Are the Reason Tour, with dates scheduled through summer 2027. His debut album, I Barely Know Her , reached No. 10 on the Billboard 2 00 .", "date_str": "2026-11-04T18:38:47+00:00", "hash": "a98c8aacb2756081", "title_fa": "شوخی می کند که او پس از کندن دندانش به شیوه ای نه چندان سخت روی صحنه \"واقعاً سخت\" است.", "summary_fa": "سامبر ممکن است برای مدتی با صدای بلند آواز بخواند. در حالی که روز سه شنبه (3 نوامبر) در حال اجرای کنسرتی در انجمن Fiserv در میلواکی بود، این نوازنده دندان خود را به شکلی غیرمنتظره تراشید. تماشای مرتبط «The Voice» خوانندگان Connor Closs Cal Cook یک فالستتوی شدید به Sombr «Homewrecker» Sombr دارند که توسط Fleetwood Mac Legend For Go Your Own Way at L.A. نمایش Sombr نحوه برخورد با نفرت را پس از دریافت مشاوره از تیلور سوئیفت، شخصی که بیشتر از همه به او نگاه می‌کنم، به اشتراک می‌گذارد. اوه، اس تی! دوباره دندانم را تراشیدم! سامبر بعد از معاینه دهانش فریاد زد. من بسیار خوشحالم که به همه شما اطلاع دهم که تامبر بازگشته است. در این مرحله، ستاره پاپ در مدیریت دقیق این اسنافو حرفه ای است. او در گذشته چندین بار دندان خود را تراشید - از جمله وقتی که در مارس 2025 آهنگ 100 شماره 7 داغ بیلبورد را از دست داد، که ویدیویی از آن را در TikTok منتشر کرد - به طوری که طرفدارانش همچنان به استقبال Thombr alter ego او ادامه دادند. با این حال، در موارد قبلی، چنین صدمات دندانی به دلیل تکان دادن بیش از حد او یا پریدن بیش از حد قوی در حین غرق شدن در موسیقی بوده است. اما این بار، این شرایط کمی سخت‌تر بود که او را درگیر کرد. او سه‌شنبه با لبخند توضیح داد که من فقط می‌رفتم تا جرعه‌ای از بطری آب خود را بنوشم. من آن را به دندانم می کوبیم و دندانم را خرد می کنم. برای من سروصدا کن من واقعا سخت هستم ستاره راک. ستاره پاپ لبخند نامتقارن تازه خود را به دوربین های صفحه بزرگ نشان داد و نشان داد که دندان ثنایای سمت چپ بالای او در مقایسه با سمت راستش بسیار کوتاه تر و", "ima hters Kulture and Blossom and son Wave with estranged husband Offset. The Grammy winner first started dating the football player in spring 2025, going Instagram official that June. A few months later, she revealed that she was pregnant, announcing Grey s birth on Nov. 13 last year. Things got rocky between Cardi and Diggs in February, with the former telling fans at a concert that month, Just because I ain’t f–king with my baby daddy doesn’t mean you get to talk about my baby daddy. They would seemingly be on again, off again over the next few months, but currently, it seems that their relationship is strictly as coparents to Grey. Cardi s latest post comes a couple of months after she and Diggs made fans correctly guess the little one s name by both wearing jewelry spelling out Grey.", "date_str": "2026-11-04T18:32:12+00:00", "hash": "9b6a5f26dd40e5c0", "title_fa": "کاردی بی اولین عکس پسرش با استفون دیگز - و نام غیرمعمول او - را در حالی که پسر بچه 1 ساله می شود فاش کرد.", "summary_fa": "کاردی بی اولین سالگرد تولد کوچکترین پسرش را جشن گرفت و اولین حضور بزرگ پسرش را در اینستاگرام به نمایش گذاشت و نام و چهره نوزاد پسر را برای اولین بار از زمان استقبال از او با استفون دیگز یک سال پیش فاش کرد. کاردی بی مرتبط از موفقیت خود دفاع می‌کند، به امتیاز پوست روشن می‌پردازد: رنگ‌گرایی واقعی است کاردی بی می‌گوید که با رپ B کارش را تمام کرده است: بسیار خسته‌کننده است. 4) در پست اینستاگرامی، خواننده رپ تعدادی عکس از پسرش به اشتراک گذاشت که در چند لباس به مگس نگاه می‌کند، از جمله یکی از آن‌ها با یک پشتی سبز و زنجیر الماسی گران‌قیمت، و همچنین عکس دیگری که او را با لباس‌های راه راه زیبا و زیبا می‌بیند. تولد 1 سالگی Gray M.D🩶🩶🩶 مبارک! کاردی در کپشن نوشت. او ادامه داد: تنها 1 سال از آشنایی با شما می گذرد، اما به نظر می رسد که شما را برای همیشه در کنار خود داشته ام. من تو را در یکی از نامطمئن ترین دوران پرفشار زندگیم گذراندم، اما وجود تو در درون من در تمام این شرایط به من قدرت بیشتری داد. تو را در درونم بزرگ می کردم و در عین حال به من زندگی می دادی! او اضافه کرد که شما معنای جدیدی به احسا comed me into those same celebrations on the campaign trail. Tonight, you trusted me with something even bigger than a song, you trusted me with your future and I will work hard everyday to honor it. According to the publication, the 53-year-old singer-turned-politician won the Rio Grande Valley district, east of San Antonio, after campaigning on affordability, health care, getting corporate money out of elections and the negative impacts of President Donald Trump s mass deportation raids. He campaigned at concerts, weddings and graduation parties, going viral after De La Cruz said the race wasn t about who you want performing at your niece s quinceañeras, USA Today reported. Pulido was born in Edinburg, Texas, the son of Tex-Mex singer Roberto Pulido. In 1995, he released his album debut, Desvelado , gaining his first Billboard chart entry with the track “No Sé Por Qué,” which debuted at No. 39 on Hot Latin Songs and later peaked at No. 32. Meanwhile, Desvelado entered the Top Latin Albums and Top Regional Mexican Albums in early 1996, peaking at No. 9 and No. 3, respectively. Since then, he has released 15 more albums and has had many more entries on the Billboard charts, with hits including Te Voy a Amar, Se Murió de Amor and Enséñame. Meanwhile, Desvelado, the title track from his debut album, reached No. 21 on Latin Streaming Songs this past July during his campaign. South T", "date_str": "2026-11-04T18:18:30+00:00", "hash": "1a5fdd2addd6df40", "title_fa": "از نمودارهای بیلبورد تا کنگره: موسیقیدان بابی پولیدو برنده رقابت تاریخی تگزاس جنوبی برای دموکرات ها شد", "summary_fa": "در اواخر سال 2024، بابی پولیدو، با نام خوزه روبرتو پولیدو جونیور، بازنشستگی خود را از موسیقی اعلام کرد تا از سال 2026 در سیاست فعالیت کند. نماد موسیقی norteño-tejano روز سه‌شنبه (3 نوامبر) در طول انتخابات میان‌دوره‌ای ایالات متحده با تغییر یک کرسی مجلس نمایندگان در تگزاس، تاریخ ساز شد. برنده دو بار گرمی لاتین امسال دوباره نامزد بهترین آلبوم تجانو برای آخرین مجموعه خود شد، بابی پولیدو دوستان ress Oscar for her role in the 1987 rom-com Moonstruck . A representative for Cher reportedly responded to the diss in an email to Entertainment Weekly , in which they said, Cher adores Michael Douglas. The polite response came after Douglas questioned Cher s fitness for the prize on the Oct. 30 Norton show, where he appeared with his Fatal Attraction co-star, Glenn Close. She should have won with Fatal Attraction ,” Douglas, told Norton just weeks before Close is slated to receive an Academy Honorary Award at the Nov. 15 Governors Awards after eight Oscar nominations and no wins to date. Douglas noted that Close, 79, earned her fourth nomination for her legendarily unhinged role as obsessed lover Alex Forrest in director Adrian Lyne s erotic thriller; prior to Fatal Attraction , Close had been nominated for Oscars three years in a row for her work in The World According to Garp (1983), The Big Chill (1984) and The Natural (1985). Cher won that year, Douglas noted as Norton said Oh, wow. Douglas, who took home best actor that year for his work in the finance drama Wall Street , seconded Norton s surprise, responding, I know, that s what we all said. Michael, be kind! Close playfully chided her co-star, who dubbed the actress intense work in the film one of the greatest performances of all time. In addition to her 1988 Oscar win, Cher was nominated for best actress in a supporting role for the 1983 nuclear whistleblower drama Silkwood and nabbed Golden Globe best actress wins for Moonstruck and Silkwood .", "date_str": "2026-11-04T17:34:57+00:00", "hash": "75d782c1156cd0ac", "title_fa": "شر پس از اسکار دیس اسکار «ماه زده» بازیگر با مایکل داگلاس با مهربانی برخورد کرد", "summary_fa": "به نظر می رسد که چر از ضربه زدن اخیر مایکل داگلاس در برنده جایزه اسکار در سال 1988 ناراحت نشده است. اسطوره بازیگری 82 ساله هفته گذشته در جریان حضور در نمایش گراهام نورتون از خواننده/بازیگر ابراز ناراحتی کرد، جایی که او گفت باور نمی کرد که شر 80 ساله برای بازی در فیلم رام کام Moonstruck در سال 1987 شایسته دریافت اسکار بهترین بازیگر زن باشد. گزارش شده است که یکی از نمایندگان چر در ایمیلی به Entertainment Weekly به این دیس پاسخ داده است که در آن آنها گفته اند، چر مایکل داگلاس را دوست دارد. این پاسخ مودبانه پس از آن بود که داگلاس در نمایش 30 اکتبر نورتون، جایی که او با گلن کلوز، گلن کلوز، همبازی اش در «جاذبه مهلک» ظاهر شد، از آمادگی شِر برای دریافت جایزه سؤال کرد. او باید با Fatal Attraction برنده می شد. داگلاس خاطرنشان کرد که کلوز، 79 ساله، چهارمین نامزدی خود را برای ایفای نقش افسانه‌ای در نقش معشوق وسواس آلکس فارست در فیلم هیجان‌انگیز آدریان لین کارگردان به دست آورد. قبل از فیلم جاذبه مهلک، کلوز سه سال متوالی برای کارش در فیلم های جهان به گفته گارپ (1983)، لرز بزرگ (1984) و طبیعی (1985) نامزد اسکار شده بود. داگلاس متوجه شد که چر در آن سال برنده شد، همانطور که نورتون گفت اوه، وای. داگلاس که در آن سال بهترین بازیگر مرد را برای کارش در درام مالی وال استریت به خانه برد، غافلگیری نورتون را تحت تأثیر قرار داد و می‌دانم که همه ما همین را گفتیم. مایکل، مهربان باش! کلوز با بازیگوشی همبازی خود را مورد سرزنش قرار داد، که این بازیگر را در این فیلم یکی از بهترین بازی های تمام دوران نامید. علاوه بر برنده اسکار 1988، چر نامزد بهترین بازیگر نقش مکمل زن برای درام افشاگر هسته ای سیلک وود", "image_url": "https://www.billboard.com/wp-content/uploads/2026/11/P102L3PT-e1793810514272.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["عامل‌های هوشمند", "سینما"], "datetime_fa": "۱۳ آبان • ۲۱:۰۴"}, {"source": "Billboard", "title": "Renee Spearman, Montell Jordan & Kim Burrell Top Gospel Airplay With ‘You Chose Me’", "link": "https://www.billboard.com/music/chart-beat/renee-spearman-montell-jordan-kim-burrell-song-tops-gospel-1236373892/", "summary": "Renee Spearman earns her second No. 1 on Billboard ’s Gospel Airplay chart as “You Chose Me,” featuring Montell Jordan and Kim Burrell, rises three spots on the ranking dated Nov. 7. The song is Jordan’s first No. 1 on the chart and Burrell’s third. Related Montell Jordan Opens Up Like Never Before Renee Spearman Kim Burrell s Tap Into It (The Source) Tops Gospel Airplay Chart Montell Jordan to Perform This Is How We Do It at the 2018 Streamy Awards Jordan is widely known for his 1995 smash “This Is How We Do It,” which spent seven weeks atop the Billboard Hot 100. The song earned a Grammy nomination for best male R B vocal performance and two MTV Video Music Awards nods. He followed with seven more top 40 hits, including two top 10s: “Let’s Ride,” featuring Master P and Silkk the Shocker (No. 2 in 1998), and “Get It On Tonite” (No. 4, 2000). Jordan shifted his focus from secular music to ministry in 2010, becoming a worship leader at Victory World Church in Norcross, Ga. He has since recorded faith-based music, bringing his R B background to gospel. Spearman and Jordan cowrote “You Chose Me,” which reflects on their faith and its role in their musical careers. Jason White, known for his work with Ye s (formerly Kanye West) Sunday Service Choir, and Asaph Ward coproduced. Spearman recruited Jordan and Burrell for the collaboration, which reunites her and Burrell. The pair previously topped Gospel Airplay in 2023-24 with “Tap Into It (The Source),” the first No. 1 on the chart for both artists. Spearman s earlier hits at the format include “I Got God,” which reached No. 7 in March 2022, and “I Love Him,” featuring Hezekiah Walker and Dr. Holly Carter, a No. 6 hit in February 2020.", "date_str": "2026-11-04T17:11:37+00:00", "hash": "0541631236aa1273", "title_fa": "رنه اسپیرمن، مونتل جردن و کیم بورل برترین پخش انجیل با «تو من را انتخاب کردی»", "summary_fa": "رنه اسپیرمن دومین شماره 1 خود را در جدول ایرپلی انجیل بیلبورد به عنوان \"تو من را انتخاب کردی\" با حضور مونتل جردن و کیم بورل به دست آورد، در رتبه بندی تاریخ 7 نوامبر سه پله صعود کرد. این آهنگ اولین شماره 1 جردن در جدول و سومین آهنگ بورل است. مونتل جردن مثل همیشه باز می شود. نامزد گرمی برای بهترین اجرای آواز مرد RB و دو جایزه MTV Video Music Awards. او با هفت 40 بازدید برتر دیگر، از جمله دو 10 برتر، دنبال کرد: \"Let's Ride\" با بازی Master P و Silkk the Shocker (شماره 2 در سال 1998)، و \"Get It On Tonite\" (شماره 4، 2000). جردن در سال 2010 تمرکز خود را از موسیقی سکولار به خدمت تغییر داد و به رهبر عبادت کلیسای جهانی ویکتوری در نورکراس، گالن تبدیل شد. او از آن زمان موسیقی مبتنی بر ایمان را ضبط کرده است و پیشینه R B خود را به انجیل آورده است. اسپیرمن و جردن با همکاری یکدیگر «تو من را انتخاب کردی» نوشتند که نشان دهنده ایمان و نقش آن در حرفه موسیقی آنهاست. جیسون وایت، که برای همکاری با Ye s (قبلاً کانیه وست) گروه کر خدمات یکشنبه شناخته می شود، و آساف وارد تولید مشترک بودند. اسپیرمن جردن و بورل را برای این همکاری استخدام کرد، که او و بورل را دوباره به هم می پیوندد. این جفت قبلاً در سال 2023-242023 با «Tap Into It (The Source»)، اولین شماره 1 جدول برای هر دو هنرمند، در صدر قرار گرفتند. آهنگ های قبلی اسپیرمن در این قالب عبارتند از: \"I Got God\" که در مارس 2022 به رتبه 7 رسید و \"I Love Him\" ​​با حضور هزکیا واکر و دکتر. هالی کارتر، موفقیت شماره 6 در فوریه 2020.", "image_url": "https://www.billboard.com/wp-content/uploads/2026/11/Montell-Jordan-Renee-Spearman-billboard-1800.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["موسیقی"], "datetime_fa": "۱۳ آبان • ۲۰:۴۱"}, {"source": "Billboard", "title": "25 Biggest Concert Residencies of All Time", "link": "https://www.billboard.com/lists/top-grossing-concert-residencies-all-time/", "summary": "Each year, an uncountable number of recording artists transform their discographies into live shows, going on tour to super-serve their biggest fans around the world. But a select few have the power to bring their fans to them, staging extravagant productions in one city as the masses travel to see a once-in-a-career performance. Here, we’re looking at the biggest residencies in Boxscore history. Most often, these residencies occur at theaters in Las Vegas. Among the most popular international tourist destinations, Sin City has become a second home for many of the biggest acts in music. The biggest disruption to this list over the last handful of years has been aren
