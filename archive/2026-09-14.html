": "Rolling Stone", "title": "‘Pretenders’ Doc Is Anything but Precious", "link": "https://www.rollingstone.com/tv-movies/tv-movie-reviews/pretenders-documentary-review-chrissie-hynde-tiff-1235618813/", "summary": "This surprisingly candid portrait of Chrissie Hynde and her band’s formation, rise, near flame-out, and rise again was worth the wait", "date_str": "2026-09-14T14:00:00+00:00", "hash": "5b6175b6004f96e9", "title_fa": "Doc «Pretenders» چیزی جز ارزشمند است", "summary_fa": "حتی اگر یک طرفدار سرسخت نباشید، این وسوسه وجود دارد که بپرسید: چرا ساختن یک مستند معتبر و مناسب درباره کریسی هایند و گروه 50 ساله اش اینقدر طول کشید؟ تظاهرکنندگان، پرتره لباس پانک ارجمند این زن پیشتاز رای اول که به تازگی در جشنواره بین المللی فیلم تورنتو به نمایش درآمد، پاسخ احتمالی را خیلی سریع به شما می دهد. هایند علاقه ای به صحبت در مورد خودش ندارد. در حال عکس گرفتن؟ او حتی کمتر از مصاحبه آن را دوست دارد. هایند در یک دوره سه ساله با فیلمساز جس کراولی برای گفت و گو نشسته بود و تنها برای آخرین بار حاضر شد جلوی دوربین برود. شما احساس می کنید که او بسیار خوش شانس بود که او تا این حد امضا کرد. نگاه متضاد او اغلب به جای او صحبت می کند: کار؟ اینجا هست، برو گوش کن زندگی من؟ چرا می خواهید در مورد آن بدانید؟ تراژدی ها؟ من نمی خواهم در مورد آن صحبت کنم. همه چیز دیگه؟ راستش من هم واقعاً نمی خواهم در مورد آن صحبت کنم. او در یک نقطه می گوید من دوست داشتم در یک گروه باشم. من فقط دوست ندارم تحت نظر باشم یا، تصور می‌شود، وانمود می‌کند که در یک اتاق اعتراف یا روی کاناپه یک روانکاو است. و با این حال! کریسی هایند صحبت می کند، و شما تعجب می کنید که کراولی نه تنها او را مجبور به نشستن در آن جلسات طولانی کرد، بلکه از این که او تا این حد حرفش را باز کرد. در اواخر فیلم، هایند فاش می‌کند که مایل بود در پنج سال اول گروه کار کند، عمدتاً به این دلیل که احساس می‌کند اولین گیتاریست Pretenders، جیمز هانیمن-اسکات، هرگز اعتبار کافی به عنوان یک نوازنده دریافت نمی‌کند. همچنین این حس وجود دارد که پیت فارندون، نوازنده باس و یکی"}, {"source": "Rolling Stone", "title": "Watch Carrie Underwood Open the 2026 Season of ‘Sunday Night Football’", "link": "https://www.rollingstone.com/music/music-country/carrie-underwood-2026-sunday-night-football-opening-nfl-1235623922/", "summary": "The country star amplified the rock vibes of “Waiting All Day for Sunday Night” for the 14th season of the NFL on NBC", "date_str": "2026-09-14T00:24:22+00:00", "hash": "0d0beda9219aeaed", "title_fa": "تماشای کری آندروود در فصل 2026 \"یکشنبه شب فوتبال\"", "summary_fa": "چهارده فصل، و کری آندروود هنوز منتظر است. ستاره موسیقی کانتری چهاردهمین فصل NFL را در شبکه NBC یکشنبه شب با آخرین رندر خود از آهنگ موضوع یکشنبه شب فوتبال، Waiting All Day for Sunday Night آغاز کرد. این پست را در اینستاگرام مشاهده کنید امسال، آندروود صدای راک سرود را پخش کرد که بر اساس جوآن جت و آهنگ رادیویی Blackhearts در سال 1988 من از خودم متنفرم برای دوست داشتن تو است. این نباید برای طرفداران آندروود تعجب آور باشد: این خواننده همیشه در قلب یک راک بوده است. او در کنسرت‌هایش آهنگ‌های هارد راک توسط Mot rhead و Skid Row را کاور کرد، برای Guns N Roses افتتاح شد، بیش از یک بار استیج را با اکسل رز به اشتراک گذاشت، و همین ماه در طول ست خود در فستیوال Velocity Fest در آیووا، آهنگ‌های نو متال را از Limp Bizkit، Linkin Park و Papa Roach انجام داد. داستان های پرطرفدار اولیویا وایلد وارد فقدان F-cks خود شده است با توجه به دوران لیدی گاگا از اولین بچه با نامزدش استقبال می کند مایکل پولانسکی: گزارش ها سلین دیون با ظرافت و احساسات به صحنه در پاریس بازگشت. باشگاه، یک استادیوم وسیع، و یک استودیوی ضبط. تریپ دیکسون، مدیر خلاق SNF گفت که تم امسال از عشق عمیق و مستند کری به موسیقی راک الهام گرفته شده است. این نکته ای است که خود آندروود آن را تقویت کرده است. او در بیانیه‌ای گفت که نمایش باز امسال از یکشنبه شب فوتبال به رویای من در مورد تب ستاره راک استقبال می‌کند. اولین بازی یکشنبه شب فوتبال و اولین تیم هایی که آندروود در اشعار تغییر هفتگی خود فریاد زد، بین رقبای NFC East Dallas Cowboys و New York Giants بود. هر دو تیم در پیش‌نمایش NFL 2026 رولینگ استون حضور داشتند، که از هنرمندانی از مایکل"}, {"source": "Rolling Stone", "title": "‘BbY WoW’ Is the Number One Song on the Planet. Judeline Can’t Believe It", "link": "https://www.rollingstone.com/music/music-latin/bby-wow-karol-g-judeline-collaboration-1235625831/", "summary": "The Spanish singer, who collaborated with Karol G to make the hit, has been shocked to see ‘BbY WoW’ top Spotify and Billboard’s global charts", "date_str": "2026-09-13T19:23:13+00:00", "hash": "995c03877f18e970", "title_fa": "\"BbY WoW\" آهنگ شماره یک روی این سیاره است. جودلین نمی تواند آن را باور کند", "summary_fa": "در چند هفته گذشته، آهنگ کلوپ روان کارول جی BbY WOW در چارت های جهانی صعود کرده است و رتبه اول Spotify و Billboard Global 200 را به خود اختصاص داده است. این آهنگ در جریان است و 78 میلیون بار از Spotify گوش داده و 37 میلیون بازدید در یوتیوب دارد و همچنان بزرگتر می شود. اما کارول این کار را به تنهایی انجام نداد. هنگامی که او در حال ساخت این آهنگ بود، از روسوفسکی تهیه کننده و هنرمند اسپانیایی با چشم رویایی و جودلین خواننده و ترانه سرای اسپانیایی خواست تا با او آواز بخوانند. جودلین یکی از مورد اعتمادترین همکاران کارول بود. جودلین به نوشتن این آهنگ کمک کرد و در سه آهنگ دیگر، از جمله Matadora، Te Llevas To، و Final Feliz، آهنگ دارد، اما او اعتراف می کند که ندیده است BbY WOW به چه موفقیت بزرگی تبدیل شود. او در تماس اخیر از اسپانیا به رولینگ استون می گوید: اصلاً انتظارش را نداشتم. من می دانستم که قرار است به خوبی پیش برود زیرا بدیهی است که قرار گرفتن در معرض کارول بسیار زیاد است. اما من فکر می کنم آنچه واقعاً دوست داشتنی است این است که هیچ کس نمی داند چه آهنگی قرار است بیشتر با مردم ارتباط برقرار کند، بنابراین ما جشن گرفتیم. در زیر، جودلین در مورد همکاری با کارول، رویکرد او به ترانه سرایی، و اینکه چگونه BbY WoW را ندید صحبت می کند. داستان های پرطرفدار اولیویا وایلد وارد فقدان F-cks خود شده است با توجه به دوران لیدی گاگا از اولین کودک با نامزد مایکل پولانسکی استقبال می کند: گزارش ها سلین دیون با ظرافت و احساسات به صحنه در پاریس بازگشت. همکار روسووسکی حضور هر سه شما در پیست چگونه است؟ حضور در این آهنگ با روسوفسکی من را هزاران بار خوشحال می کند تا"}, {"source": "Rolling Stone", "title": "Critics Are Slamming ‘Practical Magic 2.’ Fans Don’t Care", "link": "https://www.rollingstone.com/tv-movies/tv-movie-features/practical-magic-2-love-letter-1235619413/", "summary": "The new sequel has been even more harshly panned than the 1998 original. But it wasn’t made to be high art — it was made to celebrate sisterhood", "date_str": "2026-09-13T16:19:49+00:00", "hash": "1372330c1ce6b2a7", "title_fa": "منتقدان «جادوی عملی 2» را سرکوب می‌کنند. طرفداران اهمیتی نمی‌دهند", "summary_fa": "نکته در مورد دنباله ها اینجاست: آنها اغلب خیلی خوب نیستند. اغلب اوقات، آنها نمی توانند روح فیلم اصلی را به طور کامل به تصویر بکشند، و نقدها می توانند خشن باشند. بنابراین وقتی بازی Practical Magic 2 در Rotten Tomatoes این هفته با محبوبیت ضعیف 34 درصد عرضه شد، به سختی تعجب آور بود. این فیلم به کارگردانی سوزان بیر و با بازی ساندرا بولاک و نیکول کیدمن که در نقش خواهر جادوگر سالی و جیلیان اونز نقش آفرینی می کند، 28 سال پس از فیلم اصلی می آید. و برخی از منتقدان ای کاش اصلا ساخته نمی شد. این فیلم به دنبال تلاش خواهران برای از بین بردن نفرین خانوادگی چند صد ساله است که هر مردی را که دوستش دارند می‌میرد، به ویژه به این دلیل که دختران سالی، کایلی (جوی کینگ) و آنتونیا (میسی ویلیامز) تازه متوجه شده‌اند که جادوگر هستند، و این نفرین واقعی است و نه فقط شایعات خانوادگی قدیمی. بنابراین، وقتی دوست پسر کایلی (Xolo Maridue a) با ماشینی برخورد می‌کند و به کما می‌رود، او برای پایان دادن به نفرین به لندن می‌رود. سالی و جیلیان او را دنبال می کنند و از یک مورخ جادویی (لی پیس) برای کمک به آنها دعوت می کنند. داوران فهرست بلندبالایی از شکایات را ارائه کرده‌اند: نورپردازی خشن و روشن است، در تضاد کامل با درخشش خشن و پاییزی نسخه اصلی 1998. شخصیت‌های کلیدی کنار گذاشته می‌شوند، در حالی که دیگران فقط برای مردن وجود دارند. CGI جادوی مینیمالیستی را که باعث جذابیت فیلم اول شد، از بین می برد. حتی خانه دلربای خانواده اوونز در نیوانگلند، که اینترنت نزدیک به سه دهه در آن کف کرده است، به سختی دیده می شود، زیرا بیشتر فیلم در خارج از کشور می گذرد. (به هر حال چرا ما در لندن هستیم؟) و زمان اجرا 130 دقیقه"}, {"source": "Rolling Stone", "title": "Gerard Way Hints at New My Chemical Romance Album: ‘You Guys Deserve Another Record’", "link": "https://www.rollingstone.com/music/music-news/gerard-way-hints-new-my-chemical-romance-album-1235625884/", "summary": "“We kind of always wanted to make another record, so we hope to,” singer told Alamodome fans of band’s long-awaited follow-up to 2010’s Danger Days: The True Lives of the Fabulous Killjoys", "date_str": "2026-09-13T16:12:51+00:00", "hash": "848f4d1bf59da9e9", "title_fa": "جرارد وی به آلبوم New My Chemical Romance اشاره می کند: \"شما لیاقت یک رکورد دیگر را دارید\"", "summary_fa": "جرارد وی در کنسرت My Chemical Romance روز شنبه در سن آنتونیو فاش کرد که گروه قصد دارد آلبوم جدیدی را ضبط کند که اولین LP آنها در بیش از 16 سال است. My Chemical Romance سال گذشته را در تور جشن بیستمین سالگرد رژه سیاه در سال 2006 صرف کرده است. این گروه قبل از انحلال برای نیم دهه در اواسط دهه 2010، یک LP 2010's Danger Days: The True Lives of the Fabulous Killjoys را منتشر کرد. این گروه در سال 2019 برای یک سری تور گرد هم آمدند اما فقط یک آهنگ جدید به نام The Foundations of Decay 2022. با این حال، در نمایش شنبه، Way به طرفداران فاش کرد که MCR امیدوار است کار بر روی آلبوم بعدی خود را که مدت ها انتظارش را می کشید، آغاز کند. احتمالا باید آهنگ های بیشتری بسازیم. وی به طرفدارانش در Alamodome گفت که [The Foundations of Decay] زمانی که ما به این کار ادامه دادیم واقعا عالی بود. و سپس می دانید، چیزهایی اتفاق می افتد، زندگی اتفاق می افتد. اما، فقط این را بدانید که ما همیشه می خواستیم یک رکورد دیگر بسازیم، بنابراین امیدواریم. چون شما بچه ها، راستش، ما را برای مدت طولانی زنده نگه داشتید که شما بچه ها شایسته یک رکورد دیگر هستید. داستان‌های پرطرفدار اولیویا وایلد وارد فقدان F-cks خود شده است با توجه به دوران لیدی گاگا از اولین نوزاد با نامزد مایکل پولانسکی استقبال می‌کند: گزارش‌ها سلین دیون با ظرافت و احساسات به صحنه در پاریس بازگشت. بچه ها سزاوار رکورد دیگری هستند [ ] pic.twitter.com/yiihRaI8cX کنسرت شنبه پایان رسمی قسمت آمریکای شمالی تور زنده باد رژه سیاه را رقم زد، هرچند که گروه برای حضور در جشنواره های لوئیزویل Louder Than Life و Sacramento s Aftershock را قبل از My Chem-Book در جشنواره می ماند. در هالووین،"}, {"source": "Rolling Stone", "title": "Did ‘Misty Green’ Just Give Us Our Next Best Actress Winner?", "link": "https://www.rollingstone.com/tv-movies/tv-movie-reviews/misty-green-review-chris-rock-1235623033/", "summary": "Chris Rock’s pitiless take on Hollywood’s ability to crush souls works best as a showcase for its lead — a British actor who absolutely kills it", "date_str": "2026-09-13T15:30:00+00:00", "hash": "83a365d71c266329", "title_fa": "آیا «میستی گرین» فقط برنده بهترین بازیگر زن بعدی ما را به ما داد؟", "summary_fa": "طبیعت انواع خاصی از گیاهان گوشتخوار را با رنگ های زیبا، رایحه های دلپذیر، و انتشارات چسبناک و قندی به ارمغان آورده است که برای جذب و به دام انداختن طعمه خود بهتر است. شما می توانید همین را در مورد لس آنجلس بگویید، یک شهر صنعتی پر از آفتاب که لشکرهای امیدوار را قبل از جویدن و بیرون انداختن آنها جذب می کند. کریس راک بخش مناسبی از زمان خود را در هالیوود گذرانده است، و متوجه یکی دو چیز در مورد بالا و پایین ها، مزیت ها و مشکلات این مکان شده است. فیلم جدید او Mysty Green که دیشب در جشنواره بین‌المللی فیلم تورنتو به نمایش درآمد، با یک مونتاژ عکس شروع می‌شود که بین نمایش‌های پر زرق و برق و زندگی خشن خیابانی، غروب‌های زیبای سانتا مونیکا و شهرهای چادری در مرکز شهر قرار دارد. یک نفر، که همه برای یک جشن عروسی عروسک شده است، روی فرش قرمز ژست می گیرد. دیگری به سطل زباله نگاه می کند. این خوب، بد و کاملاً زشت شهری است که به نوعی کارخانه رویایی را در میان منظره ای از واقعیت های خشن حفظ کرده است. به Hell Ay خوش آمدید. هرکسی که انتظار طنز کسب و کاری را که ما آن را نمایش می‌دهیم، از فیلمسازی که مهتابی به عنوان یک بز رای‌دهی اول را به نمایش می‌گذارد، مطمئناً بیدار خواهد شد. روزنامه نگاران تمام تلاش خود را کرده اند تا توجه داشته باشند که آخرین کار راک به عنوان یک نویسنده و کارگردان باید به عنوان یک درام و نه کمدی یاد شود. با توجه به اینکه چه کسی پشت دوربین است، ضرورت خط‌کشی به این نکته را درک می‌کنیم، اما وقتی به شما می‌گوییم که با شروع وحشیانه تور افتتاحیه، هیچ‌کس این را با یک کمدی اشتباه نمی‌گیرد، به ما اعتماد کنید. این یک مطالعه"}, {"source": "Rolling Stone", "title": "Tigres Del Norte, Mon Laferte, More to Perform on NPR’s El Tiny", "link": "https://www.rollingstone.com/music/music-latin/npr-tiny-desk-el-tiny-lineup-tigres-del-norte-mon-laferte-1235625863/", "summary": "The Tiny Desk series celebrates Hispanic Heritage each September and will include Draco Rosa, Yendry, and much more", "date_str": "2026-09-13T14:42:35+00:00", "hash": "ea40e18fa67f38b0", "title_fa": "Tigres Del Norte، Mon Laferte، کارهای بیشتری برای اجرا در El Tiny از NPR", "summary_fa": "هر سال برای ماه میراث اسپانیایی، مجموعه مشهور تینی دسک NPR به El Tiny تبدیل می‌شود، جشنی یک ماهه از کنسرت‌هایی که از هنرمندان آمریکای لاتین و لاتین تجلیل می‌کند از 15 سپتامبر تا 15 اکتبر. ترکیب برای سال 2026 به‌تازگی اعلام شده است و مملو از استعدادهایی از سراسر جهان بازیگران اسپانیایی‌زبان مانند مونفر، La Lote و نوازندگان اسپانیایی زبان است. دراکو روزا، یندری، و خیلی بیشتر پشت میز. از سال 2021، مجموعه کنسرت های El Tiny از NPR بهترین موسیقی لاتین را برای مخاطبان جدید به ارمغان آورده است، و ما را به یاد توانایی قابل توجه موسیقی در برقراری ارتباط بین مرزها، نسل ها و فرهنگ ها می اندازد. فلیکس کنترراس، مجری مشترک Alt.Latino و یکی از تهیه کنندگان El Tiny، در بیانیه ای گفت که مجموعه امسال همچنان به تأیید مجدد این موضوع ادامه می دهد که موسیقی لاتین موسیقی جهان است و چیزی است که ارزش جشن گرفتن دارد. Tiny Desk و Alt.Latino پلتفرم هایی هستند که اصیل ترین و تاثیرگذارترین بیان هنری را در اولویت قرار می دهند. هر سال با تصاحب El Tiny برای ماه موسیقی لاتین، موسیقی را ارائه می‌دهیم که به همان اندازه منحصر به جوامعی است که نماینده آن هستند و در نحوه حرکت همه ما را متحد می‌کنند. Anamaria Sayre، مجری مشترک Alt.Latino و یکی از تهیه کنندگان El Tiny، افزود: این سریال بر اساس هنر صادقانه و قدردانی عمیق از زیباترین صداها در میان ما است. سال گذشته، ال تینی دید که کارلوس ویوز، سیلوانا استرادا و سایرین در کنار میز حضور داشتند. سریال Tiny Desk همیشه استعدادهای لاتین را با ستاره‌هایی مانند Bad Bunny، Karol G و Grupo Frontera که بازی‌های به یاد ماندنی را پشت سر گذاشته‌اند، مورد توجه قرار داده است. مجموعه میز کوچک Ca7riel و Paco Amoroso از سال 2024 در یوتیوب 55 میلیون"}, {"source": "Hollywood Reporter", "title": "‘The Last Photograph’ Review: Zack Snyder Tries Indie Filmmaking on for Size, With Painfully Ponderous Results", "link": "https://www.hollywoodreporter.com/movies/movie-reviews/the-last-photograph-review-zack-snyder-1236699771/", "summary": "The DC filmmaker's passion project stars Stuart Martin as an ex-DEA operative who ventures into the mountains of South America to track down the abducted children of his murdered brother and sister-in-law.", "date_str": "2026-09-14T14:22:39+00:00", "hash": "1780950d9f0f0012", "title_fa": "نقد و بررسی «آخرین عکس»: زک اسنایدر فیلمسازی مستقل را برای اندازه، با نتایج دردناکی تلاش می کند", "summary_fa": "زک اسنایدر، فیلمساز موفق، پس از یک اقامت طولانی مدت در دنیای توسعه یافته دی سی، این قید و بندهای استودیویی را کنار می‌گذارد و با The Last Photograph، یک وسترن بسیار شخصی، طولانی مدت و خودپسند که مجموعه‌های استودیویی مجلل را با فضاهای باز فیلم‌برداری لوکیشن کلمبیایی مبادله می‌کند، به طور کامل مستقل می‌شود. اما در حالی که تغییر سرعت بدون شک احساس رهایی بخش بود، نتیجه نهایی به عنوان یک اشتباه سربی ظاهر می شود. مملو از نمادهای پرمدعا و دیالوگ های بیهوده و بیهوده ای است که دائماً چیزهای بدیهی را بیش از حد بیان می کند، فیلم ماوراء خشونت آمیز درباره یک مامور دولتی سرکش که از یک شاتر معتاد به هروئین کمک می گیرد تا از قتل برادر و خواهر شوهرش انتقام بگیرد و بچه های ربوده شده آنها را نجات دهد. پایه داستان‌های مرتبط فیلم‌ها شش سال پس از مرگ پدر که بازیگر نقش اول آن بود، بلافاصله پس از اولین نمایش کوتاه TIFF، کارگردان پسر قوی با غم بازگشت. محل برگزاری: جشنواره بین المللی فیلم تورنتو (رویدادهای ویژه) بازیگران: استوارت مارتین، فرا فی، کنستانزا آندراده، مارلون مورنو، کوئیک مندوزا، گوستاوو آنگاریتا، اد هیوز، پدرو کالو-آنکا، میا کالوو، جکی کی، خوزه رسترپو کارگردان: زک اسنایدر فیلمنامه نویس 15 دقیقه به عنوان کرت. مرکز ممتاز بازار افتتاحیه TIFF، جایی که امیدوار است قرارداد توزیع را تضمین کند، این فیلم 135 دقیقه‌ای وضعیت رویداد ویژه را دریافت کرد، به این معنی که دیگر نمایش‌های تکراری فراتر از اولین نمایش جهانی آن در عصر یکشنبه وجود نخواهد داشت. بسیاری از کسانی که از تئاتر خارج شدند، نسبت به آنچه که اخیراً تجربه کرده بودند، ابراز ناباوری مشابهی داشتند. ما نمی دانیم چه زمانی برای اولین بار به او معرفی شدیم، اما اتان بلک (استوارت مارتین) که به نظر می رسد یک گله گوسفند تنها باشد، در واقع"}, {"source": "Hollywood Reporter", "title": "SkyShowtime May Be Sold or Shut Down, Board Warns In Memo Shared With Staff (Exclusive)", "link": "https://www.hollywoodreporter.com/business/business-news/comcast-paramount-review-strategic-options-skyshowtime-1236698105/", "summary": "Joint owners Comcast and Paramount have launched a \"review of strategic options,\" according to a letter sent to the streaming service's CEO Monty Sarhan Monday.", "date_str": "2026-09-14T14:15:07+00:00", "hash": "67a11d1b6d590435", "title_fa": "SkyShowtime ممکن است فروخته شود یا تعطیل شود، هیئت مدیره در یادداشت به اشتراک گذاشته شده با کارکنان (انحصاری)", "summary_fa": "هالیوود ریپورتر دریافته است که Comcast و Paramount Skydance در حال بررسی گزینه های استراتژیک برای سرویس استریم سرمایه گذاری مشترک اروپایی خود SkyShowtime هستند. در حالی که هنوز هیچ تصمیمی گرفته نشده است، تعطیلی کسب و کار یکی از گزینه های روی میز است. هیئت مدیره JV، مونتی سرهان، مدیرعامل SkyShowtime را از بررسی استراتژیک روز دوشنبه در نامه‌ای که توسط THR مشاهده شد، مطلع کرد. سرهان متعاقباً آن را با کارکنان شرکت به اشتراک گذاشت. SkyShowtime در یکی از رقابتی ترین بازارهای صنعت ما فعالیت می کند. در نامه هیئت مدیره آمده است، علیرغم کار عالی تیم و قدرت آنچه شما و تیم ساخته اید، چشم انداز به سرعت در حال تکامل است و همچنان بسیار چالش برانگیز است. در مقابل آن پس‌زمینه، سهامداران SkyShowtime در حال بررسی گزینه‌های استراتژیک برای کسب‌وکار هستند، که شامل احتمال سقوط است. هیچ تصمیمی گرفته نشده است و همه گزینه ها در حال بررسی هستند. SkyShowtime محتوای NBCUniversal و Sky Studios و همچنین Paramount را ترکیب می کند و به طور موثر سرویسی را با قدرت برنامه نویسی ترکیبی Peacock و Paramount+ در ایالات متحده ارائه می دهد. این سرویس برای اولین بار پنج سال پیش معرفی شد و به بیش از 20 کشور مختلف در اروپا خدمات ارائه می دهد. سرهان در یادداشت خود خاطرنشان کرد که SkyShowtime در حال حاضر چندین میلیون مشترک دارد و در مقیاس بزرگ در کنار معتبرترین بازیگران بازار ایستاده است."}, {"source": "Hollywood Reporter", "title": "Ridley Scott Reveals Directing Secrets to Fellow Helmer Jimmy Chin: “Don’t Listen to Anybody”", "link": "https://www.hollywoodreporter.com/movies/movie-news/ridley-scott-reveals-directing-secrets-jimmy-chin-1236698017/", "summary": "In an unusually unguarded interview from Chin's new book of conversations, the 'Dog Stars' director looks back on what he's learned after half a century at the top of his craft.", "date_str": "2026-09-14T14:15:00+00:00", "hash": "bdbb31511209e596", "title_fa": "ریدلی اسکات اسرار کارگردانی را برای همکار هلمر جیمی چین فاش می‌کند: «به هیچ‌کس گوش نکن»", "summary_fa": "در کوهنوردی، ما یک کلمه برای صحبت کردن دستاوردهای خود را اسپری کردن داریم. تو قرار نیست این کار را بکنی این قانون کار را برای کسی که مستندی درباره کوهنوردی را تبلیغ می‌کند، ناخوشایند می‌کند، کاری که من در اوایل سال 2016 انجام می‌دادم. اما اینگونه بود که در یک ناهار جوایز در شهر نیویورک که کنار ریدلی اسکات و روبروی مت دیمون نشسته بودم، پایان یافتم. تمام هدف چنین ناهارهایی این است که اعضای آکادمی علوم و هنرهای تصاویر متحرک را متقاعد کنید که به فیلم شما اسکار بدهند. همه چیز خیلی ناراحت کننده است تبلیغات نویسان رقص را اداره می کنند و مطمئن می شوند که افراد مناسب را ملاقات می کنید و در کنار افراد مناسب می نشینید. من آنجا برای Meru بودم که تابستان قبل از آن منتشر شده بود. ریدلی و مت در مسیر مبارزات انتخاباتی The Martian بودند. من قبلاً مت را می شناختم زیرا یکی از مربیان او دوست صمیمی من است. زمانی که مت برای فیلم Elysium تمرین می کرد، با او تمرین کردم. من هرگز ریدلی اسکات را ندیدم. داستان‌های مرتبط فیلم‌های Everest: The Other Side نقد: پرتره‌ی ناامیدکننده و مجرمانه از پیروزی و تراژدی فیلم‌های کوهنوردی افراطی Coyote vs. Acme Snags شماره 2 با 15.4 میلیون دلار در نقش مرد عنکبوتی به آواتار 2 نزدیک می‌شود. ستارگان سگ را به خواب می‌برند من ترسیده بودم. یکی از اولین فیلم هایی که دیدم فیلم بیگانه در اوایل دهه هشتاد بود، زمانی که حدوداً 10 ساله بودم و در خانه دوستم کریس در مانکاتو بودم. ما با هم Alien را تماشا کردیم و این ذهن من را به هم ریخت. من به این فکر نمی کردم که چه کسی فیلم را کارگردانی می کند و مطمئناً نمی دانستم ریدلی اسکات کیست. تنها چیزی که می توانستم به آن فکر کنم انفجار"}, {"source": "Hollywood Reporter", "title": "Netflix, YouTube and Amazon Launch a Streaming Public Policy Group", "link": "https://www.hollywoodreporter.com/business/digital/netflix-youtube-amazon-launch-streaming-public-policy-saca-1236700459/", "summary": "The Streaming Access and Choice Alliance (SACA) will represent the interests of streaming platforms in Washington.", "date_str": "2026-09-14T14:01:22+00:00", "hash": "f88fe124ce12f16e", "title_fa": "نتفلیکس، یوتیوب و آمازون یک گروه سیاست عمومی جریانی راه اندازی می کنند", "summary_fa": "یک گروه سیاست عمومی جدید در واشنگتن دی سی تشکیل شده است، گروهی که منافع پلتفرم های استریم را نمایندگی می کند. اتحاد دسترسی و انتخاب جریان (SACA) با نتفلیکس، یوتیوب و آمازون به عنوان اعضای موسس آن روز دوشنبه راه اندازی شد. TechNet، گروه سیاست عمومی فناوری، سرمایه گذاری جدید را رهبری می کند و مایک وارد، معاون ارشد سیاست فدرال و روابط دولتی TechNet نیز رهبری SACA را بر عهده دارد. وارد در بیانیه ای گفت که آمریکایی ها خواهان انتخاب محتوا و انعطاف بیشتر در نحوه و مکان تماشای برنامه های مورد علاقه خود از جمله ورزش و سایر رویدادهای زنده هستند. شرکت‌های پخش جریانی و سرگرمی‌های دیجیتال ویژگی‌های بهتری را به مخاطبان ارائه می‌دهند و ارزش پولشان را بهتر می‌کنند. این صنعت و مشتریان آن سزاوار یک صدای اختصاصی در واشنگتن دی سی هستند که از سیاست هایی حمایت می کند که نوآوری را ممکن می کند و نیازهای مصرف کنندگان امروزی را برطرف می کند. در حالی که فناوری بزرگ و هالیوود بزرگ در D.C به خوبی ارائه شده‌اند، خدمات استریم در حال حاضر در D.C به خوبی ارائه نشده‌اند. انجمن تصاویر متحرک به نمایندگی از شرکت‌ها و استودیوهای سرگرمی نگاه می‌کند، در حالی که TechNet و سایر گروه‌ها به نمایندگی از غول‌های فناوری کار می‌کنند. یک گروه لابی گری قبلی، انجمن اینترنت، چند سال پیش تعطیل شد. SACA در عین حال از سیاست‌هایی دفاع می‌کند که دسترسی مصرف‌کننده به محتوای باکیفیت را افزایش می‌دهد، انتخاب را حفظ می‌کند و از تجربیات مشاهده نوآورانه‌ای که مصرف‌کنندگان ارزش قائل هستند، حمایت می‌کند. استریم‌کنندگان، پس از سال‌ها رشد، با فشار جدیدی از سوی مردم و مقامات دولتی مواجه هستند، زیرا قیمت‌ها همچنان در حال افزایش هستند و برنامه‌نویسی در بسیاری از پلتفرم‌ها تقسیم شده است. ورزش‌ها به‌طور خاص تبدیل به یک بوگوی بزرگ شده‌اند، زیرا Prime Video"}, {"source": "Hollywood Reporter", "title": "The 37 Top L.A. Real Estate Brokers of 2026", "link": "https://www.hollywoodreporter.com/lifestyle/real-estate/top-los-angeles-real-estate-brokers-2026-1236694146/", "summary": "Braving wildfire recovery and market malaise, these superagents have made the most of a punishing year — and most say there’s nowhere to go but up.", "date_str": "2026-09-14T14:00:00+00:00", "hash": "e3b45325d49c1d57", "title_fa": "37 کارگزار برتر املاک و مستغلات لس آنجلس در سال 2026", "summary_fa": "در میان آتش‌سوزی‌های جنگلی و بلاتکلیفی جهانی، برترین بنگاه‌های املاک لس‌آنجلس که در فهرست سالانه Power Brokers THR مورد تقدیر قرار گرفته‌اند، با بادهای مخالف شدیدی مواجه شده‌اند. جک هریس و مایکل فهیمیان می گویند که در حال حاضر قطعاً بازار خریدار است. ما معتقدیم این پایین بازار است و فقط از اینجا به بالا است. دیگران چندان مطمئن نیستند ژولیت هونن، مشاور املاک می‌گوید، فروشندگانی که فکر می‌کنند خانه‌هایشان ارزش چیزی را دارد که به آنها پیشنهاد شد (اما نگرفتند) در طول همه‌گیری یا سال گذشته، زمانی که ما هجوم زیادی از قربانیان آتش‌سوزی داشتیم که به دنبال جابه‌جایی بودند، باید دوباره با بازار فعلی سازگار شوند. اخبار مرتبط اخبار عمارت مالیبو نیکلاس کیج توسط گودال عظیم در میان فرسایش ساحلی آسیب دیده است آیا جف بزوس فقط یک آپارتمان 200 میلیون دلاری در بورلی هیلز خرید؟ این عوامل به لطف n the best international feature film category. Enyedi’s On Body and Soul, which won Berlin s Golden Bear, was Oscar nominated in the same category in 2018. Silent Friend, which stars Tony Leung Chiu-Wai, Luna Wedler, Enzo Brumm and Léa Seydoux, is a poetic exploration [ ]", "date_str": "2026-09-14T13:38:12+00:00", "hash": "f7b4a92a7f10ef8f", "title_fa": "اسکار: مجارستان «دوست خاموش» ایلدیکو انیدی را برای مسابقه بین‌المللی انتخاب کرد (اختصاصی)", "summary_fa": "دوست خاموش ایلدیک انیدی نامزد مجارستان برای اسکار 2027 در بخش بهترین فیلم بین‌المللی است. Enyedi s On Body and Soul که برنده خرس طلایی برلین شد، در سال 2018 در همین بخش نامزد اسکار شد. دوست خاموش، با بازی تونی لیونگ چیو-وای، لونا ودلر، انزو بروم و L a Seydoux، کاوشی شاعرانه در رابطه بین انسان ها، گیاهان و زمان است. این فیلم شش جایزه در هشتاد و دومین جشنواره فیلم ونیز دریافت کرد و اخیراً به عنوان یکی از پنج نامزد جایزه بزرگ FIPRESCI انتخاب شد و بهترین فیلم‌های سال را شناسایی کرد. داستان های مرتبط تام هاردی با هلن میرن در اولین نمایش موبلند به عنوان گای ریچی می گوید: کار با این هیولاهای خلاقیت هیچ چیز دیگری جز لذت نبود تام هاردی رسماً برای فصل 3 «MobLand» پس از اسپات پشت صحنه بازمی گردد، گای لاج پس از تماشای این مطلب را بسیار سرگرم کننده نوشت. فیلمی بسیار بارور، بغل کردن نزدیکترین درخت کافی به نظر نمی رسد که سزاوار گرمترین آغوش شما باشد. در اوایل سال جاری، دوست خاموش در چهل و پنجمین هفته فیلم مجارستان در بوداپست به عنوان بهترین فیلم شناخته شد. اعضای کلیدی تیم خلاق آن نیز مورد تجلیل قرار گرفتند: Gergely P los جایزه بهترین فیلمبرداری را دریافت کرد، K roly Szalai برنده بهترین تدوین شد و M nika Mcs جایزه بهترین تهیه کننده را دریافت کرد. دوست خاموش محصول مشترک پاندورا فیلم آلمان، مجارستان Inforg-M M Film و Galat e Films فرانسه با همکاری Rediance Films چین است. این فیلم توسط راینهارد بروندیگ و ام سی اس تهیه شده است. این فیلم توسط موسسه ملی فیلم مجارستان حمایت شد. Silent Friend در مناطق متعددی در سراسر جهان توزیع شده است، با 1-2 Special handling انتشار آن در ایالات متحده فروش جهانی توسط Films Boutique انجام می شود."}, {"source": "Variety", "title": "Andrew Scott to Reprise Starring Role in ‘Sea Wall’ Play for Limited Run and Filmed Adaptation (EXCLUSIVE)", "link": "https://variety.com/2026/film/columns/andrew-scott-starring-role-sea-wall-play-filmed-adaptation-1236856405/", "summary": "Andrew Scott is set to reprise his starring role in the one-man play “Sea Wall.” The production of the limited run — it will play 19 performances at Studio Seaview in New York from Oct. 16 to Oct. 30 — will be filmed for a feature adaptation. The 50-minute monologue play was written for Scott [ ]", "date_str": "2026-09-14T13:15:00+00:00", "hash": "bd74a905f46f7690", "title_fa": "اندرو اسکات نقش اصلی را در نمایش «دیوار دریا» برای فیلم‌برداری محدود و اقتباس (اختصاصی) بازی می‌کند", "summary_fa": "اندرو اسکات قرار است نقش اصلی خود را در نمایش یک نفره Sea Wall بازی کند. این تولید محدود 19 اجرا در استودیو سی ویو در نیویورک از 16 تا 30 اکتبر برای یک اقتباس بلند فیلمبرداری می شود. این نمایشنامه مونولوگ 50 دقیقه ای توسط سایمون استفنز نمایشنامه نویس برنده تونی برای اسکات نوشته شده است، زمانی که در سال 2008 توسط تئاتر بوش در لندن مأموریت یافت نمایشنامه ای بنویسد که می تواند در نور طبیعی روز پس از آسیب دیدن نور سالن در طی سیل اجرا شود. اسکات نقش الکس را بازی می کند، عکاسی که زندگی با همسر و دختر خردسالش ناگهان به هم می ریزد. داستان های مرتبط تام هاردی در مورد کتی بیتس رتبه ایکس دریافت می کند، درباره گرین گابلین ویلم دافو رپ می زند و در آلبوم جدیدش شکسپیر را می خواند تام هاردی در اولین نمایش موبلند با هلن میرن متحد می شود همانطور که گای ریچی می گوید: هیچ چیز دیگری جز لذت بردن از کار با این هاردی نبود. هم احیا و هم فیلم. محبوب در Variety در یک صنعت ابتدا، Sea Wall برای یک فیلم سینمایی جدید و منحصر به فرد فیلمبرداری می شود، در بیانیه مطبوعاتی، بخشی از آن، درباره احیای و فیلم آمده است. این پروژه که به‌عنوان فیلمی درباره خلق تئاتر تصور می‌شود، نه تنها اجرای اسکات، بلکه زندگی کامل رویداد پیرامون آن را در پشت صحنه، روی صحنه و در خانه به نمایش می‌گذارد، با تماشاگران در هر اجرا به عنوان یک شخصیت اساسی در فیلم. اسکات همچنین در سال 2018 در فیلم The Old Vic در لندن در بازسازی دیوار دریایی بازی کرد."}, {"source": "Variety", "title": "Sydney Sweeney’s Naked Sports Betting Ad Ignites Backlash From Olympic Athletes: ‘Stop Sexualizing Women in Sport’", "link": "https://variety.com/2026/digital/news/sydney-sweeney-naked-sports-betting-ad-backlash-olympians-novig-1236861057/", "summary": "Sydney Sweeney appears to be at the center of another controversy involving a commercial. The Euphoria actress recently stripped down for a steamy new ad for sports trading app Novig, going nude and covering parts of her with a variety of sports equipment. But not everybody is overjoyed by sports new naked cheerleader. Over the [ ]", "date_str": "2026-09-14T12:39:10+00:00", "hash": "61bd2c0e7920ea69", "title_fa": "آگهی شرط بندی ورزشی برهنه سیدنی سوینی واکنش ورزشکاران المپیک را برانگیخت: «جنسی کردن زنان در ورزش را متوقف کنید»", "summary_fa": "سیدنی سوینی به نظر می رسد در مرکز جنجال دیگری که مربوط به یک آگهی تبلیغاتی است قرار دارد. بازیگر Euphoria اخیراً برای یک تبلیغ جدید برای برنامه تجارت ورزشی Novig از لباس خارج شد و برهنه شد و قسمت هایی از بدن خود را با انواع تجهیزات ورزشی پوشاند. اما همه از تشویق کننده برهنه جدید ورزشی خوشحال نیستند. در آخر هفته، تنها چند روز پس از انتشار آگهی، چندین ورزشکار در شبکه های اجتماعی علیه این کمپین که آنها را به جنسیت بخشیدن به ورزش زنان متهم کردند، صحبت کردند. محبوب در داستان های مرتبط تام هاردی با هلن میرن در اولین نمایش موبلند به عنوان گای ریچی می گوید: کار با این هیولاهای خلاقیت هیچ چیز دیگری جز لذت نبود تام هاردی در مورد کتی بیتس رتبه ایکس دریافت می کند، رپ درباره ویلم دافو در مورد گرین گابلین و ریچی می دانم. لوسی دیویس، ورزشکار بریتانیایی نوشت: سیدنی سوینی کار می کرد، اما سال 2026 است. دست از جنسیت زدن زنان در ورزش بردارید. در همین حال، آریارنه تیتموس، قهرمان سابق شنا استرالیا و برنده چهار مدال طلای المپیک، نوشت: نمی توانم توصیف کنم که وقتی این را تماشا می کنم چقدر عصبانی می شوم. تیتموس اضافه کرد: این نه تنها ضربه ای به چهره هر زنی است که زندگی خود را وقف تکمیل هنر خود     let currentTab = 'persian';
    let searchQuery = '';
    let readArticles = new Set(JSON.parse(localStorage.getItem('read_articles_registry') || '[]'));

    function toFaDigits(n) {
      const f = ['۰','۱','۲','۳','۴','۵','۶','۷','۸','۹'];
      return n.toString().replace(/\d/g, d => f[d]);
    }

    function toggleRead(hash) {
      if (readArticles.has(hash)) {
        readArticles.delete(hash);
      } else {
        readArticles.add(hash);
      }
      localStorage.setItem('read_articles_registry', JSON.stringify(Array.from(readArticles)));
      renderNews();
    }

    function renderNews() {
      const container = document.getElementById('newsContainer');
      const rawItems = data[currentTab] || [];
      
      const filtered = rawItems.filter(item => {
        if (!searchQuery) return true;
        const q = searchQuery.toLowerCase();
        const title = (item.title_fa || item.title || '').toLowerCase();
        const summary = (item.summary_fa || item.summary || '').toLowerCase();
        const source = (item.source || '').toLowerCase();
        return title.includes(q) || summary.includes(q) || source.includes(q);
      });

      const unreadList = [];
      const readList = [];

      filtered.forEach(item => {
        if (readArticles.has(item.hash)) {
          readList.push(item);
        } else {
          unreadList.push(item);
        }
      });

      const sortedItems = [...unreadList, ...readList];

      if (sortedItems.length === 0) {
        container.innerHTML = '<div style="text-align:center; padding: 40px; color: var(--text-muted);">هیچ خبری در این بخش در ۲۴ ساعت گذشته ثبت نشده است.</div>';
        return;
      }

      container.innerHTML = sortedItems.map((item, idx) => {
        const title = item.title_fa || item.title || '';
        const summary = item.summary_fa || item.summary || '';
        const source = item.source || 'منبع خبر';
        const link = item.link || '#';
        const isRead = readArticles.has(item.hash);
        const num = toFaDigits(idx + 1);

        return `
          <article class="news-card ${isRead ? 'is-read' : ''}" id="card-${item.hash}">
            <div class="news-header">
              <span class="news-num">${isRead ? '✓' : num}</span>
              <h2 class="news-title">${title}</h2>
            </div>
            ${summary ? `<p class="news-summary">${summary}</p>` : ''}
            <div class="news-footer">
              <span class="news-source">📌 منبع: ${source}</span>
              <div class="footer-right">
                <button class="btn-mark-read" onclick="toggleRead('${item.hash}')">
                  ${isRead ? '✓ خوانده شد' : '○ علامت خوانده‌شده'}
                </button>
                ${link && link.startsWith('http') ? `<a href="${link}" target="_blank" rel="noopener noreferrer" class="news-link">مطالعه اصل خبر ↗</a>` : ''}
              </div>
            </div>
          </article>
        `;
      }).join('');
    }

    function switchTab(tab, el) {
      currentTab = tab;

      if (el) el.classList.add('active');
      renderNews();
    }

      const current = html.getAttribute('data-theme') || 'dark';

      html.setAttribute('data-theme', next);
      localStorage.setItem('theme', next);
      updateThemeButton(next);
