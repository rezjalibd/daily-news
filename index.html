 سیمان در بتن کردند و نمونه‌هایی با جایگزینی ۵، ۱۰ و ۱۵ درصدی ساختند تا مقاومت آن‌ها را بررسی کنند. آزمایش‌ها نشان داد افزودن مقدار مناسبی از بیوچار انسانی می‌تواند مقاومت بتن را افزایش دهد"}, {"source": "Zoomit", "title": "اعلام جرم علیه عوامل «با ضیا» و دو مهمان برنامه؛ اظهارات اقتصادی غیرمستند دلیل برخورد قضایی بوده است", "link": "https://www.zoomit.ir/iran-news/467131-tehran-prosecutor-charges-ba-zia-show/", "summary": "دادستانی تهران به‌دلیل طرح ادعاهای ارزی و تشویش اذهان عمومی علیه عوامل برنامه اینترنتی با ضیا و دو مهمان آن اعلام جرم کرد.", "date_str": "2026-09-13T11:44:23+00:00", "hash": "abc5a6d10b5f61d8", "title_fa": "اعلام جرم علیه عوامل «با ضیا» و دو مهمان برنامه؛ اظهارات اقتصادی غیرمستند دلیل برخورد قضایی بوده است", "summary_fa": "دادستانی تهران به‌دلیل طرح ادعاهای ارزی و تشویش اذهان عمومی علیه عوامل برنامه اینترنتی با ضیا و دو مهمان آن اعلام جرم کرد. تبلیغات دادستانی تهران علیه مجری و تهیه‌کننده برنامه اینترنتی «با ضیا» و دو نفر از مهمانان این برنامه به‌دلیل «طرح ادعاهای کذب اقتصادی و اظهارات غیرمستند» اعلام جرم کرد. بر اساس اطلاعیه منتشرشده، این اقدام در پی پخش اظهارات تعدادی از مهمانان اخیر برنامه «با ضیا» درباره مسائل ارزی انجام شده است. دادستانی تهران انتشار این مطالب را مصداق انتشار مطالب خلاف واقع و تشویش اذهان عمومی دانسته است. اگر چه نام دو مهمان در متن خبر نیامده، خبرگزاری فارس در حساب خود در شبکه اجتماعی ایکس (توییتر سابق)، خبر اعلام جرم را همراه با تصویر علی ضیا و پوریا بختیاری منتشر کرده است. البته در متن این پست نیز نام بختیاری ذکر نشده است. بختیاری که خبرگزاری فارس نامش را برده، در گفت‌وگوی اخیر خود با «با ضیا» مدعی شده بود در دوره ریاست‌جمهوری ابراهیم رئیسی، از او خواسته‌اند متن‌های ساده اقتصادی بنویسد تا یک تیم انیمیشن‌سازی آن‌ها را به کلیپ‌های آموزشی برای رئیس‌جمهور وقت تبدیل کند. به روایت او، برای این کلیپ‌ها سقف ۳ دقیقه‌ای تعیین شده بود؛ زیرا به او گفته بودند رئیسی از کلاس اقتصاد خسته می‌شود و تمرکزش را از دست می‌دهد. این ادعا با تکذیب برخی مدیران دولت سیزدهم روبه‌رو شده است. روزنامه سازندگی نیز در مطلبی با عنوان «رئیسی خط قرمز شد؟» گزارش داده که بنیاد رئیسی این روایت را کذب دانسته و از گوینده شکایت کرده است."}, {"source": "Zoomit", "title": "ثبت‌نام بیش از ۱۳۰۰ نفر در کمپین «معلم معلم‌ها» اسکای‌روم", "link": "https://www.zoomit.ir/iran-news/467130-skyroom-teacher-of-teachers-campaign/", "summary": "با ثبت‌نام ۱۳۰۰ معلم در کمپین معلم معلم‌ها اسکای‌روم، ارزیابی آثار برای برگزاری دوره‌های اشتراک تجربه تدریس آنلاین در پاییز آغاز شد.", "date_str": "2026-09-13T11:38:20+00:00", "hash": "59e667900a6e362f", "title_fa": "ثبت‌نام بیش از ۱۳۰۰ نفر در کمپین «معلم معلم‌ها» اسکای‌روم", "summary_fa": "تبلیغات بیش از ۱۳۰۰ نفر از معلمان در کمپین «معلم معلم‌ها» اسکای‌روم ثبت‌نام کرده‌اند و فرایند بررسی درخواست‌ها برای انتخاب مدرس‌های این دوره از ۲۱ شهریور آغاز شده است. در این کمپین، معلمان منتخب پس از ارزیابی درخواست‌ها معرفی می‌شوند تا دوره‌های آموزشی را با هدف انتقال تجربه‌های تدریس آنلاین برگزار کنند. سرفصل‌های آموزشی این دوره‌ها پس از نهایی شدن اعلام خواهد شد و فعالیت کمپین در پاییز سال جاری آغاز می‌شود. معلمان منتخب این کمپین به‌عنوان «مدرس مهمان» در رویدادها حضور خواهند داشت و از حمایت اسکای‌روم برای آماده‌سازی و اجرای جلسات آموزشی برخوردار می‌شوند. همچنین برای مشارکت‌کنندگان، مزایایی مانند معرفی حرفه‌ای، گواهینامه رسمی و دسترسی رایگان محدود به امکانات اسکای‌روم در نظر گرفته شده است"}, {"source": "Zoomit", "title": "شیائومی رسما عرضه شاسی‌بلند فول‌سایز اسکای‌نومد را شروع کرد", "link": "https://www.zoomit.ir/car/467119-xiaomi-skynomad-erev-suv-deliveries/", "summary": "تحویل شاسی‌بلندهای هیبریدی سری اسکای‌نومد شیائومی با حضور مدیرعامل در ۷۵ شهر چین آغاز شد.", "date_str": "2026-09-13T11:30:00+00:00", "hash": "cce6f77d054f6044", "title_fa": "شیائومی رسما عرضه شاسی‌بلند فول‌سایز اسکای‌نومد را شروع کرد", "summary_fa": "تحویل شاسی‌بلندهای هیبریدی سری اسکای‌نومد شیائومی با حضور مدیرعامل در ۷۵ شهر چین آغاز شد. تبلیغات شیائومی روند تحویل شاسی‌بلندهای هیبریدی سری اسکای‌نومد را در ۷۵ شهر چین آغاز کرد . لی جون ، مدیرعامل شیائومی، شخصا در مراسم تحویل خودرو در شهرهای شانگهای و شوژو حاضر شد و سوییچ خودروها را به خریداران اهدا کرد. عرضه‌ی خودروها شامل چهار تیپ مختلف از مدل‌های N70 و N90 در نسخه‌های پرو و مکس است. مدل پایه‌ی دیفرانسیل‌جلو N70 با ظرفیت پنج سرنشین با قیمت ۳۰ هزار دلار وارد بازار شده و نسخه‌ی فول‌آپشن N90 اکسپلورر ادیشن به همراه چادر برقی تاشو ۴۴ هزار و ۱۰۰ دلار قیمت دارد. امکانات سفارشی نظیر پروژکتور ردیف عقب به ارزش ۱٬۵۰۰ دلار و رکاب‌های جانبی جمع‌شونده با قیمت ۹۰۰ دلار، هزینه‌ی نهایی را افزایش می‌دهند. مدل N70 با ابعاد ۴٬۹۶۰ میلی‌متر طول، ۱٬۹۹۸ میلی‌متر عرض و ۱٬۷۶۵ میلی‌متر ارتفاع، از صندلی‌های جلوی چرخان ۱۸۰ درجه دارد. مدل بزرگ‌تر N90 با طول ۵٬۲۸۵ میلی‌متر و فاصله‌ی محوری ۳٬۰۸۰ میلی‌متر، چیدمان هفت‌نفره و حداکثر فضای بار ۱٬۸۳۱ لیتری در اختیار سرنشینان قرار می‌دهد. فضای داخلی خودروها مجهز به یخچال ۹ لیتری ریلی، نمایشگر سقفی و کنسول مرکزی با امکان جابه‌جایی است تا محیط کابین متناسب با نیاز سرنشینان تغییر وضعیت دهد."}, {"source": "Zoomit", "title": "سایه‌بان غول‌پیکر در فضا؛ طرح نوآورانه پژوهشگران ناسا برای کشف زمین دوم", "link": "https://www.zoomit.ir/space/466984-nasa-researchers-blot-out-starlight-hunt-earth-like-exoplanets/", "summary": "تیمی از پژوهشگران ناسا و کلتک می‌خواهند سایه‌بانی غول‌پیکر به شکل گل را به فضا پرتاب کنند تا با مسدودکردن نور ستارگان، سیاره‌های کم‌نور را آشکار کند.", "date_str": "2026-09-13T11:15:00+00:00", "hash": "afb4d19a1fdca88f", "title_fa": "سایه‌بان غول‌پیکر در فضا؛ طرح نوآورانه پژوهشگران ناسا برای کشف زمین دوم", "summary_fa": "تیمی از پژوهشگران ناسا و کلتک می‌خواهند سایه‌بانی غول‌پیکر به شکل گل را به فضا پرتاب کنند تا با مسدودکردن نور ستارگان، سیاره‌های کم‌نور را آشکار کند. تبلیغات اگر تا به حال برای دیدن بهتر چیزی، جلوی نور خورشید را با دست خود گرفته‌اید، قطعاً از طرح جدید ناسا برای جستجوی سیاره‌های سکونت‌پذیر خوشتان خواهد آمد. دانشمندان آژانس فضایی آمریکا مشغول کار روی طرح جدیدی هستند که «رصدخانه ترکیبی برای سیاره‌های فراخورشیدی ‌زمین‌سان» (HOEE) نام دارد؛ پیشنهادی غیرمعمول که قرار است سایه‌بانی ستاره‌ای به قطر ۱۰۰ متر را به مداری در فاصله حدود ۱۷۵هزار کیلومتری بالای جو زمین، در محدوده بین زمین و ماه، بفرستد. ولادیمیر آیراپتیان، اخترفیزیک‌دان ناسا در گفتگو با وب‌سایت یونیورس تودی ، توضیح داده که ایده اصلی این است که با ایجاد «کسوف مصنوعی» در فضا، امکان مشاهده‌ی بهتر نور بسیار ضعیف سیاره‌های فراخورشیدی شبیه زمین را که به دور ستاره‌ای دوردست می‌چرخند، برای یک تلسکوپ قدرتمند زمینی فراهم کنیم. آیراپتیان در کنفرانس اخترزیست‌شناسی «ارجینز ۲۰۲۶» که ژوئیه امسال در پاریس برگزار شد، گفت: «هدف این است که یک رصدخانه به اصطلاح ترکیبی بسازیم که در آن یک تلسکوپ بزرگ روی زمین بتواند منظومه‌ای سیاره‌ای را در طیف نور مرئی رصد کند. چالش اصلی مسدودکردن نور ستاره است تا بتوانیم سیاره‌ای کم‌نور را که روشنایی‌اش یک میلیارد بار کمتر از درخشش ستاره است، آشکار کنیم.» آیراپتیان و همکارانش در ناسا و کلتک امیدوارند سایه‌بان ستاره‌ای HOEE در نهایت بتواند با پیشرفته‌ترین و چشمگیرترین تلسکوپ‌های زمینی که هم‌اکنون در ارتفاعات بیابان آتاکاما در شیلی در حال ساخت هستند، هماهنگ شود. پروژه‌هایی مانند تلسکوپ فوق‌العاده بزرگ رصدخانه جنوبی اروپا (ELT) و تلسکوپ غول‌پیکر ماژلان (GMT)، می‌توانند با کمک HOEE به قدرتمندترین یابندگان سیاره که تاکنون طراحی شده‌اند، تبدیل شوند."}, {"source": "Zoomit", "title": "مایکروسافت سرعت اجرای ویندوز ۱۱ را افزایش می‌دهد", "link": "https://www.zoomit.ir/os/467108-microsoft-boosts-windows-11-performance/", "summary": "مایکروسافت روی به‌روزرسانی جدیدی برای ویندوز ۱۱ کار می‌کند که زمان بوت سیستم را به‌شکل چشمگیری کاهش می‌دهد.", "date_str": "2026-09-13T11:05:00+00:00", "hash": "14389a211486ebcb", "title_fa": "مایکروسافت سرعت اجرای ویندوز ۱۱ را افزایش می‌دهد", "summary_fa": "مایکروسافت روی به‌روزرسانی جدیدی برای ویندوز ۱۱ کار می‌کند که زمان بوت سیستم را به‌شکل چشمگیری کاهش می‌دهد. تبلیغات مایکروسافت برنامه‌های تازه‌ای برای افزایش سرعت بوت و بهبود پاسخ‌دهی بخش ورود به سیستم در ویندوز ۱۱ در دست اجرا دارد. نسخه‌ی آزمایشی جدید ویندوز ۱۱، راه‌اندازی بسیار سریع‌تری را برای کاربران فراهم می‌کند و فرایند ورود به محیط دسکتاپ را روان‌تر از گذشته خواهد کرد. مارک لینتون ، نایب‌رئیس بخش ویندوز و دستگاه‌ها در مایکروسافت، در جریان نمایشگاه IFA 2026 گفت: «ما دستاوردهای قابل‌توجهی در زمینه‌هایی مانند زمان بوت و پاسخ‌دهی ویندوز هِ ‌نویسی تا همراهی مشتری برای رسیدن به نتیجه، مشارکت فعال دارد. همچنین نمونه‌های کاربردی متناسب با هر جایگاه شغلی به‌طور جداگانه برای مخاطبان تشریح خواهد شد."}, {"source": "Zoomit", "title": "خودرویی با موتور موشک؟ تسلا رودستر در آستانه رونمایی است", "link": "https://www.zoomit.ir/car/467098-tesla-roadster-unveil-october-first/", "summary": "تسلا تاریخ رونمایی نسل جدید ابرخودرو رودستر را با قابلیت‌های برگرفته از صنایع فضایی اعلام کرد.", "date_str": "2026-09-13T06:00:00+00:00", "hash": "4b606246349e81a4", "title_fa": "خودرویی با موتور موشک؟ تسلا رودستر در آستانه رونمایی است", "summary_fa": "تسلا تاریخ رونمایی نسل جدید ابرخودرو رودستر را با قابلیت‌های برگرفته از صنایع فضایی اعلام کرد. تبلیغات ایلان ماسک ، مدیرعامل تسلا، اعلام کرد که شرکتش سرانجام خودروی اسپرت و پرحاشیه‌ی تسلا رودستر را در تاریخ ۱ اکتبر (۹ مهر) رونمایی خواهد کرد. نسخه‌ی مفهومی رودستر بیش از یک دهه‌ی پیش به‌نمایش درآمد. حساب رسمی تسلا در شبکه‌ی اجتماعی ایکس عبارت «آماده برای پرتاب» را در کنار تصویری از تاریخ رویداد منتشر کرد . رویداد رونمایی احتمالا شامل نمایش نسخه‌ای با تولید محدود خواهد بود که به پیشرانه‌ی گاز سرد مجهز است. فناوری پیشرانه‌ها با همکاری اسپیس‌ایکس توسعه یافته است و آزمایش عملی آن در تأسیسات آزمایشی مک‌گرگور در تگزاس انجام خواهد شد. نسل دوم تسلا رودستر اولین‌بار در سال ۲۰۱۷ به‌نمایش درآمد و موعد تحویل آن سال ۲۰۲۰ تعیین شده بود؛ اما روند تولید با تأخیرهای پیاپی مواجه شد. تسلا پس از کنار گذاشتن برنامه‌ی اولیه بر پایه‌ی قطعات تسلا مدل اس پلید، ساختار رودستر را به‌شکل یک ابرخودرو فیبر کربنی کاملا جدید بازطراحی کرد. به نظر شما آیا تسلا رودستر جدید با پیشرانه‌های موشکی اسپیس‌ایکس به بازار خواهد آمد؟"}, {"source": "Zoomit", "title": "مدیرعامل اوپن‌ای‌آی: ساخت هوش مصنوعی فرا انسانی کاملا امکان‌پذیر است", "link": "https://www.zoomit.ir/ai-articles/467105-altman-superhuman-ai-ipo-delay/", "summary": "سم آلتمن امکان ساخت هوش مصنوعی فراتر از کنترل انسان را کاملا شدنی دانست و از تعویق عرضه‌ی اولیه‌ی سهام شرکت خبر داد.", "date_str": "2026-09-13T05:50:40+00:00", "hash": "f0344586c91d9aeb", "title_fa": "مدیرعامل اوپن‌ای‌آی: ساخت هوش مصنوعی فرا انسانی کاملا امکان‌پذیر است", "summary_fa": "سم آلتمن امکان ساخت هوش مصنوعی فراتر از کنترل انسان را کاملا شدنی دانست و از تعویق عرضه‌ی اولیه‌ی سهام شرکت خبر داد. تبلیغات مدیرعامل OpenAI امکان توسعه‌ی سیستمی از هوش مصنوعی را که فراتر از توانایی کنترل انسان باشد، کاملا شدنی توصیف کرد. سم آلتمن می‌گوید تدابیر سخت‌گیرانه‌ای برای جلوگیری از وقوع چنین سناریویی در دستور کار قرار دارد و شرکت در صورت نیاز، روند آموزش مدل‌های پیشرفته را متوقف خواهد کرد تا خطری متوجه جامعه نشود. مدیرعامل اوپن‌ای‌آی در مصاحبه با مجله‌ی فورچون اعلام کرد که عرضه‌ی اولیه‌ی سهام این شرکت یک تریلیون دلاری در سال ۲۰۲۶ انجام نخواهد شد. آلتمن بر لزوم اولویت‌بخشی به ایمنی و همگام‌سازی فناوری با جامعه تأکید کرد و ورود به بازار بورس در شرایط فعلی را تصمیمی نادرست دانست. آلتمن می‌گوید: «فکر می‌کنم با توجه به تمام اتفاقاتی که پیرامون موضوع ایمنی رخ می‌دهد، اکنون زمان نامناسبی برای عرضه‌ی عمومی سهام است و فشاری در این زمینه احساس نمی‌کنیم.» اظهارات مدیرعامل اوپن‌ای‌آی هم‌زمان با نگرانی‌های جهانی درباره‌ی اقدامات خودسرانه‌ی عامل‌های هوشمند و هک وب‌سایت‌هایی مانند هاگینگ فیس مطرح می‌شود. شرکت‌های بزرگ حوزه‌ی فناوری بررسی طرح‌هایی مشترک را برای کُندکردن سرعت توسعه‌ی مدل‌ها و مهار خطرات احتمالی آغاز کرده‌اند. داریو آمودی، مدیرعامل آنتروپیک پیش‌تر گفته بود: « ما باید سرعت توسعه‌ی هوش مصنوعی راه کاهش دهیم .»"}, {"source": "Zoomit", "title": "رمزگشایی زمین از آسمان؛ رعدوبرق چگونه می‌تواند ساختارهای پنهان زیر سیاره را فاش کند؟", "link": "https://www.zoomit.ir/fundamental-science/465946-thunderquakes-mapping-underground-fiber-optics/", "summary": "طوفان رعدوبرق شاید روزی به ابزار ارزان‌تری برای بررسی زمین تبدیل شود؛ زیرا امواج رعد می‌توانند تا عمق ۱۰۰ متری زیر زمین را آشکار کنند.", "date_str": "2026-09-13T05:50:00+00:00", "hash": "d1a95217a8bb66e1", "title_fa": "رمزگشایی زمین از آسمان؛ رعدوبرق چگونه می‌تواند ساختارهای پنهان زیر سیاره را فاش کند؟", "summary_fa": "طوفان رعدوبرق شاید روزی به ابزار ارزان‌تری برای بررسی زمین تبدیل شود؛ زیرا امواج رعد می‌توانند تا عمق ۱۰۰ متری زیر زمین را آشکار کنند. تبلیغات رعدوبرق فقط یک نمایش نوری و صوتی در آسمان نیست. پژوهشگران نشان داده‌اند غرش رعد می‌تواند اطلاعاتی درباره ساختارهای پنهان زیر زمین در اختیار ما بگذارد؛ روشی که شاید در آینده راهی ارزان‌تر برای بررسی زیرساخت‌های زمین‌شناسی شهرها باشد. رعدزلزله‌ها (Thunderquakes) به لرزش‌های بسیار کوچکی گفته می‌شود که براثر انتقال انرژی امواج رعدوبرق به زمین ایجاد می‌شوند. وقتی صاعقه رخ می‌دهد، موج فشاری حاصل از آن در هوا حرکت می‌کند، اما بخشی از این انرژی به سطح زمین منتقل می‌شود و لرزش‌های بسیار ضعیفی ایجاد می‌کند. چنین لرزش‌هایی برای انسان قابل احساس نیستند، اما با تجهیزات حساس، ازجمله کابل‌های فیبر نوری، می‌توان آن‌ها را ثبت کرد. دانشمندان از این سیگنال‌ها برای ساخت تصویری از لایه‌های نزدیک سطح زمین استفاده کرده و توانسته‌اند ساختارهای زیرزمینی را تا عمق حدود ۱۰۰ متر بررسی کنند. پژوهشگران دانشگاه ایالتی پنسیلوانیا با تحلیل داده‌های ثبت‌شده توسط کابل‌های فیبر نوری زیر محوطه این دانشگاه، نقشه‌ای از زمین‌شناسی اطراف خود تهیه کردند. آن‌ها در این داده‌ها بیش از ۴۵۰ رعدزلزله را که درطول دو سال و نیم ثبت شده بود، بررسی کردند و توانستند مناطقی با ساختار ضعیف در زیر زمین را شناسایی کنند؛ مناطقی که ممکن است در آینده در معرض خطرهایی مانند ایجاد فروچاله قرار داشته باشند. کپی لینک چگونه کابل‌های اینترنتی به ابزار زمین‌شناسی تبدیل شدند؟ کابل‌های فیبر نوری که امروزه برای ارتباطات اینترنتی و مخابراتی استفاده می‌شوند، در بسیاری از شهرها کیلومترها زیر زمین کشیده شده‌اند. اما همه رشته‌های موجود در این شبکه‌ها همیشه فعال نیستند. دانشمندان در سال‌های اخیر به دنبال راه‌هایی بوده‌اند تا از این کابل‌های بلااستفاده که به آن‌ها «فیبر تاریک» گفته می‌شود، به‌عنوان حسگرهای علمی استفاده کنند."}, {"source": "Zoomit", "title": "۲۲ شهریور؛ از پیوند نور و مغناطیس تا فرود خشن لونا ۲ در فضا", "link": "https://www.zoomit.ir/time-tunnel/467055-super-mario-luna-faraday-2026-09-13/", "summary": "سال‌ها پیش در چنین روزی لونا ۲ به ماه رسید، چند مگابایت اطلاعات بیش از یک تن وزن داشت و Super Mario Bros زبان تازه‌ای برای بازی‌ها ساخت.", "date_str": "2026-09-13T05:30:00+00:00", "hash": "4d24f04aa3eea985", "title_fa": "۲۲ شهریور؛ از پیوند نور و مغناطیس تا فرود خشن لونا ۲ در فضا", "summary_fa": "سال‌ها پیش در چنین روزی لونا ۲ به ماه رسید، چند مگابایت اطلاعات بیش از یک تن وزن داشت و Super Mario Bros زبان تازه‌ای برای بازی‌ها ساخت. تبلیغات چهار روایت امروز با حرکت آغاز می‌شوند؛ چرخش نور در شیشه، گردش صفحه‌های مغناطیسی، سقوط کاوشگری بر ماه و دویدن لوله‌کشی کوچک در قلمرو قارچ‌ها. فهرست مطالب پرتوی نوری که در زیرزمین چرخید وقتی چند مگابایت بیش از یک تن وزن داشت لونا ۲ و نخستین تماس بشر با جهانی دیگر سوپر ماریو؛ باز‌ی‌ای که به آموزش نیاز نداشت کپی لینک پرتوی نوری که در زیرزمین چرخید Wikimedia Commons تالار قدیمی خدمتکاران در زیرزمین مؤسسه‌ی سلطنتی لندن بعیدترین جا برای پیوندزدن نور و مغناطیس به نظر می‌رسید. مایکل فارادی ۱۸۱ سال پیش قطعه‌ای شیشه‌ی سربی را میان قطب‌های آهنربای الکتریکی گذاشت و نور قطبیده را از آن گذراند. فوتونیک مدرن از چرخش نور در تکه‌ای شیشه سر برآورد با برقراری جریان، صفحه‌ی قطبش چرخید. یادداشت همان روز فارادی از موفقیت در «مغناطیسی‌کردن یک پرتو نور» خبر می‌دهد؛ آزمایشی که مؤسسه‌ی سلطنتی ابزارش را نگهداری می‌کند. فارادی پیش‌تر در ۱۸۳۱ القای الکترومغناطیسی را کشف کرده بود؛ اما اثر فارادی نخستین شاهد تجربی روشن برای رابطه‌ی نور و الکترومغناطیس به شمار می‌رفت. جیمز کلرک ماکسول بعدها صورت‌بندی ریاضی میدان الکترومغناطیسی را کامل کرد. رد همان چرخش کوچک امروزه در ایزولاتورهای نوری دیده می‌شود؛ قطعاتی که از بازگشت نور و آسیب‌دیدن لیزر جلوگیری می‌کنند و در حسگرهای میدان و سامانه‌های فیبر نوری نیز به کار می‌روند."}, {"source": "Zoomit", "title": "هوش مصنوعی نمی‌تواند این فونت جدید را ببیند!", "link": "https://www.zoomit.ir/ai-articles/467049-decoy-fonts-block-ai-bots/", "summary": "طراحان و دانشمندان کامپیوتر فونت‌های جدیدی توسعه داده‌اند که برای انسان‌ها خوانا بوده اما ربات‌های هوش مصنوعی را به اشتباه می‌اندازد.", "date_str": "2026-09-13T05:15:00+00:00", "hash": "89e57d2c26d303c1", "title_fa": "هوش مصنوعی نمی‌تواند این فونت جدید را ببیند!", "summary_fa": "طراحان و دانشمندان کامپیوتر فونت‌های جدیدی توسعه داده‌اند که برای انسان‌ها خوانا بوده اما ربات‌های هوش مصنوعی را به اشتباه می‌اندازد. تبلیغات طراحان و دانشمندان علوم کامپیوتر با به‌کارگیری خطای دید و تغییر در کدهای ساختاری، تایپ‌فیس‌های جدیدی موسوم به Decoy Font خلق کرده‌اند . هدف اصلی توسعه‌ی ابزارهای نام‌برده، جلوگیری از خزش خودکار ربات‌ها و سرقت نوشته‌های انسانی توسط مدل‌های زبانی بزرگ است. روش استتار این فونت نسخه‌ای مدرن از خطای دید تصاویر ترکیبی به‌شمار می‌رود؛ روشی که پژوهشگران ام‌آی‌تی در سال ۲۰۰۷ معرفی کردند. فونت ابداعی از دو لایه متن تشکیل شده که یک لایه با خطوط واضح در جلو و لایه‌ی دیگر به‌صورت تار و تیره در پس‌زمینه قرار دارد تا خوانایی را برای سامانه‌های خودکار ناممکن سازد. اریک لو، بنیان‌گذار استودیوی میکس‌فونت، می‌گوید: «یک روز پس از ارسال پیامک به مادرم متوجه شدم که هوش مصنوعی مدام تلاش می‌کند پیام‌های ما را خلاصه کند و در بسیاری از مواقع این کار را اشتباه انجام می‌دهد. از اینکه این فناوری به گفت‌وگوی خصوصی ما نفوذ می‌کرد کلافه شدم و به روش‌هایی فکر کردم که بتوان بدون خوانده‌شدن همه‌چیز با هوش مصنوعی ارتباط برقرار کرد.» در آزمایشی دیگر، استودیوهای Seneda Abrucio و PlayType قلمی به نام ShieldFont را عرضه کردند که نیمی از کلمات محتوایی شامل اسم‌ها، افعال و صفت‌ها را در کد منبع با واژه‌های تصادفی جایگزین می‌کند. بیش از ۹۰ درصد متن‌های نامفهوم خروجی توسط فیلترهای کیفی هوش مصنوعی رد می‌شوند. اریک لو می‌گوید: «این پروژه به‌عنوان کاوشی درباره‌ی تلاقی هوش مصنوعی و تایپوگرافی آغاز شد؛ اما هدف آن افزایش آگاهی درباره‌ی دسترسی و توانمندی‌های رو‌به‌رشد هوش مصنوعی نیز بود. واکنش‌ها نشان می‌دهد افراد زیادی خستگی شدیدی از هوش مصنوعی حس می‌کنند و خواهان راهی برای دفاع از خود در برابر حضور این فناوری در زندگی‌شان هستند.»"}, {"source": "Zoomit", "title": "آیا آب معدنی لوکس واقعا از آب معمولی بهتر است؟", "link": "https://www.zoomit.ir/health-medical/465859-luxury-bottled-water-health-benefits/", "summary": "برچسب‌هایی مثل قلیایی یا غنی از مواد معدنی روی بطری‌های آب، این حس را ایجاد می‌کنند که چیزی ویژه درون آن‌هاست. آیا این ادعاها ریشه علمی دارند؟", "date_str": "2026-09-13T04:50:00+00:00", "hash": "2e9a0ad3bb965334", "title_fa": "آیا آب معدنی لوکس واقعا از آب معمولی بهتر اس ی خلق چین دستورالعمل قضایی تازه‌ای به دادگاه‌های سراسر کشور ابلاغ کرد تا روند رسیدگی به پرونده‌های مدنی مرتبط با سوءاستفاده از ابزارهای هوش مصنوعی و تولید محتوای جعلی یکپارچه شود. سند قضایی مذکور در قالب ۲۴ ماده تنظیم شده است و اختلاف‌های حقوقی پیرامون ویدیوها و صداهای تولیدشده با دیپ‌فیک، محتوای جنسی، تخلفات مالی، حریم خصوصی دیجیتال و قیمت‌گذاری نظارتی را پوشش می‌دهد. یکی از محورهای کلیدی تدوین‌شده، رسیدگی به محتوایی است که با شبیه‌سازی چهره و صدای افراد زنده یا بازآفرینی مجازی مردگان ساخته می‌شود. سی یانلی ، معاون دفتر پژوهش‌های دادگاه عالی خلق چین، گفت: «در عمل، افراد زیادی نگرانی شدید خود را نسبت‌به دیپ‌فیک‌های هوش مصنوعی ابراز می‌کنند. فناوری تغییر چهره می‌تواند تصویر هر فردی را بدون تمایز جمع‌آوری کند و افراد عادی را به اهداف بالقوه جعل عمیق تبدیل سازد. فناوری شبیه‌سازی صدا نیز می‌تواند صداها را با هزینه‌ای بسیار اندک بدزدد و نتایجی به‌شدت باورپذیر تولید کند.» راهبرد جدید علاوه بر پرونده‌های جعل تصویر، تدابیری برای برخورد با پدیده دوکسینگ یا افشای غیرقانونی اطلاعات خصوصی افراد در اینترنت پیش‌بینی می‌کند. سی یانلی، معاون دفتر پژوهش‌های دادگاه عالی خلق چین، گفت: «دوکسینگ به شکل برجسته‌ای از آزار سایبری تبدیل شده است که حریم خصوصی قربانیان را نقض می‌کند، زندگی روزمره آن‌ها را بر هم می‌زند و امنیت عمومی را در فضای مجازی کاهش می‌دهد.» نظام حقوقی چین مبتنی‌بر حقوق مدنی فعالیت می‌کند و دادگاه‌های محلی الزامی به پیروی از رویه‌های قضایی پیشین ندارند؛ اما دستورالعمل‌های صادره از دادگاه عالی خلق وزن حقوقی بالایی دارند و مراجع پایین‌دستی موظف به استناد به آن‌ها در آرای خود هستند."}, {"source": "Zoomit", "title": "دادگاهی در آمریکا وکیل وابسته‌به ChatGPT را پنج هزار دلار جریمه کرد", "link": "https://www.zoomit.ir/ai-articles/467047-lawyer-fined-chatgpt-fake-witnesses/", "summary": "دیوان عالی نیومکزیکو وکیلی را به دلیل استفاده از شواهد و اظهارات جعلی تولیدشده با هوش مصنوعی پنج هزار دلار جریمه کرد.", "date_str": "2026-09-13T02:30:00+00:00", "hash": "8bafe4653399324c", "title_fa": "دادگاهی در آمریکا وکیل وابسته‌به ChatGPT را پنج هزار دلار جریمه کرد", "summary_fa": "دیوان عال ory/Carnegie Institution of Washington) عطارد ممکن است بسیار سریع‌تر از آنچه تصور می‌کردیم در حال کوچک‌شدن باشد؛ یافته‌ای که می‌تواند سرنخ‌های تازه درباره خاستگاه پرآشوب آن آشکار کند. تبلیغات سیاره عطارد که درحال‌حاضر اندازه‌اش به حدود یک‌سوم زمین می‌رسد، ممکن است در طول تکامل خود فراتر از آنچه پیش‌تر تصور می‌شد، کوچک شده باشد. پژوهشگران در مطالعه‌ای تازه دریافته‌اند که کوچک‌ترین سیاره منظومه شمسی احتمالاً ۱۰ تا ۳۰ درصد بیشتر از برآورد مدل‌های قبلی منقبض شده؛ یعنی قطر کلی سیاره از زمان شکل‌گیری‌اش تاکنون نزدیک به ۱۹ کیلومتر کاهش یافته است. قطر امروزی عطارد حدود ۴۸۸۰ کیلومتر است. براساس یافته‌های مطالعه جدید، مأموریت‌های پیشین میزان واقعی انقباض عطارد را دست‌کم گرفته بودند؛ زیرا بقایای ناشی از برخورد شهاب‌سنگ‌ها روی سطح این سیاره، شواهد مربوط به کوچک‌شدنش را پوشانده‌اند. گاکو نیشی‌یاما، دانشمند علوم سیاره‌ای در مؤسسه پژوهش‌های فضایی مرکز هوافضای آلمان و یکی از نویسندگان مطالعه، می‌گوید این اختلاف اندازه برای بررسی تاریخچه عطارد اهمیت دارد. نیشی‌یاما به لایوساینس گفت : «از آنجایی که تکامل عطارد تحت تأثیر سردشدن آن قرار دارد، میزان انقباض که شاخصی از میزان سردشدن سیاره است، یکی از مهم‌ترین کمیت‌های مشاهده‌پذیری محسوب می‌شود که می‌تواند با مدل‌های تخمین سناریوی تکامل سیاره مقایسه شود.»"}, {"source": "Zoomit", "title": "گزارش جنجالی آنتروپیک: کلاد چگونه به ابزار سرقت چینی‌ها و ساخت سلاح‌های بیولوژیک تبدیل شد؟", "link": "https://www.zoomit.ir/ai-articles/467083-anthropic-stopped-bioweapons-featured/", "summary": "از ساخت پاتوژن‌های مرگبار تا کلاهبرداری در اپلیکیشن‌های دوست‌یابی؛ هوش مصنوعی کلاد چگونه در خدمت تاریک‌ترین اهداف انسان قرار گرفته است؟", "date_str": "2026-09-12T20:30:00+00:00", "hash": "27f8e3cc02b0761f", "title_fa": "گزارش جنجالی آنتروپیک: کلاد چگونه به ابزار سرقت چینی‌ها و ساخت سلاح‌های بیولوژیک تبدیل شد؟", "summary_fa": "از ساخت پاتوژن‌های مرگبار تا کلاهبرداری در اپلیکیشن‌های دوست‌یابی؛ هوش مصنوعی کلاد چگونه در خدمت تاریک‌ترین اهداف انسان قرار گرفته است؟ تبلیغات گروهی سایبری کل فرایندهایش را با کمک هوش مصنوعی شرکت آنتروپیک اجرا می‌کند، از شناسایی اهداف و آما د انگیزه‌ی پایدار و شکل‌گیری عادت‌های سالم به شمار می‌رود؟ در واقعیت، رویکرد مکسینگ ممکن است در دستیابی به هدف ناکام بماند، به نتیجه‌ای معکوس منتهی شود یا حتی روندی کاملاً خلاف جهت ایجاد کند. اما اصلاً این ترند نوظهور چیست و چرا فرهنگ بهینه‌سازی مداوم، به‌جای ارتقای سلامت، سلامت روان ما را هدف گرفته است؟ کپی لینک ورود به بازی؛ وقتی همه‌چیز نیازمند «مکسینگ» می‌شود ریشه‌ی اصطلاح مکسینگ به بازی‌های ویدئویی و مفهوم «مین-مکسینگ» (min-maxing) بازمی‌گردد. بازیکنان در این روش بازی با برنامه‌ریزی استراتژیک، ویژگی‌های مثبت شخصیت بازی خود را به حداکثر و ویژگی‌های کم‌کاربرد را به حداقل می‌رسانند تا کارآمدترین حالت ممکن را بسازند. از نظر واژه‌شناسی، در خود مفهوم مکسینک یک تناقض آشکار وجود دارد"}, {"source": "Zoomit", "title": "تصاویر اسمارت‌تگ ۳ لو رفت؛ ردیاب هوشمند جدید سامسونگ", "link": "https://www.zoomit.ir/gadget/467012-samsung-galaxy-smarttag-3-leaked/", "summary": "تصاویر فاش‌شده از گلکسی اسمارت‌تگ ۳ سامسونگ، طراحی مربعی‌شکل و حذف حفره‌ی جاکلیدی را در این ردیاب هوشمند نشان می‌دهد.", "date_str": "2026-09-12T19:00:00+00:00", "hash": "5381f4e47e3e4aa3", "title_fa": "تصاویر اسمارت‌تگ ۳ لو رفت؛ ردیاب هوشمند جدید سامسونگ", "summary_fa": "تصاویر فاش‌شده از گلکسی اسمارت‌تگ ۳ سامسونگ، طراحی مربعی‌شکل و حذف حفره‌ی جاکلیدی را در این ردیاب هوشمند نشان می‌دهد. تبلیغات تصاویر جدیدی از ردیاب هوشمند گلکسی اسمارت‌تگ ۳ فاش شده که ظاهر و تغییرات اساسی در طراحی نسل سوم این ابزار ردیابی را آشکار می‌کند. سامسونگ نخستین مدل از گلکسی اسمارت‌تگ را در سال ۲۰۲۱ و نسل دومش را سال ۲۰۲۳ روانه‌ی بازار کرد و حالا آماده‌ی رونمایی از مدل جدید می‌شود. تصاویر نشان می‌دهد که ردیاب جدید در دو رنگ عرضه خواهد شد و بر خلاف نسل قبلی، حفره‌ی اختصاصی برای اتصال به جاکلیدی یا بند ندارد. با توجه به این تغییر، خریداران برای متصل‌کردن ردیاب به وسایل مختلف ناچار به تهیه‌ی قاب‌های محافظ دارای حلقه خواهند بود. دکمه‌ی مرکزی دستگاه میزبان نام تجاری سامسونگ است و روکشی با ظاهر فلزی دارد. سامسونگ هنوز جزئیاتی درباره‌ی تاریخ رونمایی و قیمت محصول اعلام نکرده، اما شاید ظرف یک تا دو ماه آینده معرفی شود."}, {"source": "Zoomit", "title": "سپر دفاعی تخم‌مرغی؛ راهکار پژوهشگران چینی برای نجات فضاپیماها در مدار", "link": "https://www.zoomit.ir/space/466977-how-eggshells-protect-spacecraft-from-space-debris/", "summary": "آرایه‌های آلومینیومی الهام‌گرفته از پوسته تخم‌مرغ که با چاپ سه‌بعدی ساخته و با آب پر شده بودند، مقاومت بیشتری در برابر ضربه نشان دادند.", "date_str": "2026-09-12T18:40:00+00:00", "hash": "c451ee364a27ac7c", "title_fa": "سپر دفاعی تخم‌مرغی؛ راهکار پژوهشگران چینی برای نجات فضاپیماها در مدار", "summary_fa": "عکاس: Mark Garlick / Science Photo Library/Getty Images آرایه‌های آلومینیومی الهام‌گرفته از پوسته تخم‌مرغ که با چاپ سه‌بعدی ساخته و با آب پر شده بودند، مقاومت بیشتری در برابر ضربه نشان دادند. تبلیغات در سال ۲۰۰۷، قطعه‌ای زباله فضایی با شدت به پنل رادیاتور شاتل فضایی اندِور برخورد کرد و حفره‌ای شبیه سوراخ گلوله در آن به وجود آورد. برنامه شاتل فضایی در سال ۲۰۱۱ به پایان رسید، اما با افزایش پرتاب منظومه‌های ماهواره‌ای، تلسکوپ‌ها و فضاپیماها به مدار، مشکل زباله‌های فضایی هر روز وخیم‌تر می‌شود. به همین دلیل، دانشمندان چینی ماده آلومینیومی جدیدی با الهام از پوسته تخم‌مرغ طراحی کرده‌اند که به باور آن‌ها می‌تواند محافظت بهتری در برابر زباله‌های فضایی ارائه دهد. پوسته تخم‌مرغ مدت‌هاست به‌دلیل ویژگی‌های مکانیکی خود مورد توجه دانشمندان قرار دارد. برای مثال، می‌دانیم که برای شکستن یک تخم‌مرغ باید نیروی کافی را به مرکز آن وارد کرد تا پوسته به‌صورت تمیز بشکند، بدون اینکه کاملاً متلاشی شود. در سال ۲۰۱۲، پدرو ریس، مهندس مکانیک دانشگاه MIT، در پژوهشی نشان داد که میان شکل بیضی‌گون تخم‌مرغ و سختی آن ارتباط وجود دارد؛ عاملی مهم برای پیش‌بینی اینکه یک جسم پیش از ترک‌خوردن چه مقدار نیرو را می‌تواند تحمل کند. مطالعات ریس روی پوست تخم‌مرغ پس از شرکت در یک آزمایش فیزیکی مشهور آغاز شد: راه‌رفتن روی شانه تخم‌مرغ بدون شکستن آن‌ها. او فهمید نکته کلیدی این است که تخم‌مرغ‌ها را به‌گونه‌ای قرار دهید که نوک باریکشان که مقاوم‌ترین بخش در برابر ترک‌خوردگی است، رو به بالا باشد و سپس پاها را با دقت روی جعبه قرار دهید تا وزن بدن روی تمام سطح پخش شود. بدین ترتیب، فشار بیش از حد به هیچ تخم‌مرغی وارد نمی‌شود. هرچند برای شکستن یک تخم‌مرغ تقریباً ۲۴٫۵ نیوتن نیرو لازم است، میزان نیروی مورد نیاز، به جهت اعمال نیرو و همچنین نحوه توزیع آن روی سطح پوسته بستگی دارد."}, {"source": "Zoomit", "title": "مدیرعامل آنتروپیک: وقتش رسیده است سرعت توسعه هوش مصنوعی را کم کنیم", "link": "https://www.zoomit.ir/ai-articles/467092-anthropic-ceo-slow-ai-development/", "summary": "داریو آمودی خواستار کندشدن توسعه‌ی هوش مصنوعی شد و برنامه‌ای سه‌مرحله‌ای برای ایمنی مدل‌ها پیش کشید.", "date_str": "2026-09-12T17:41:41+00:00", "hash": "558d438a0679b6cf", "title_fa": "مدیرعامل آنتروپیک: وقتش رسیده است سرعت توسعه هوش مصنوعی را کم کنیم", "summary_fa": "داریو آمودی خواستار کندشدن توسعه‌ی هوش مصنوعی شد و برنامه‌ای سه‌مرحله‌ای برای ایمنی مدل‌ها پیش کشید. تبلیغات داریو آمودی ، مدیرعامل آنتروپیک، می‌گوید زمان آن رسیده که سرعت توسعه‌ی هوش مصنوعی کاهش پیدا کند . موضع او فقط یک هشدار کلی نیست؛ آمودی از برنامه‌ای سه‌مرحله‌ای حرف می‌زند که هدفش «همگام‌سازی» توسعه با ایمنی، نظارت و آمادگی نهادهای تنظیم‌گر است. آنتروپیک می‌خواهد به ارزیاب‌های مستقل، از جمله METR، امکان دهد که به مدل‌هایش دسترسی پیدا کنند تا پای‌بندی آن‌ها به شیوه‌های ایمنی و تعهدات اعلام‌شده بررسی شود. آمودی در مقاله‌ای مفصل توضیح داده که چنین دسترسی‌ای نخستین گام در مسیری است که او آن را بهترین راهکار برای کنترل هوش مصنوعی می‌نامد. آمودی عملا خواستار پایین‌آوردن شتاب آموزش و توسعه شده است تا شرکت‌ها فرصت ساختن سازوکارهای ایمنی و دولت‌ها امکان ارزیابی مدل‌ها را داشته باشند. طرح آمودی از سه مرحله تشکیل می‌شود. در مرحله‌ی نخست، شرکت‌ها باید به‌طور مستقل و یک‌جانبه امکان ارزیابی گسترده‌تر را فراهم کنند. آنتروپیک همین حالا وارد همین فاز شده است. مرحله‌ی دوم، همکاری صنعت با یکدیگر و احتمالا با نهادهای دولتی برای تدوین استانداردهای مشترک ایمنی و همچنین تعیین محدودیت‌هایی بر نرخ پیشرفتِ بی‌مهار هوش مصنوعی را هدف می‌گیرد. آمودی می‌گوید این مرحله بیشتر بر شرکت‌های فعال در کشورهای دموکراتیک متمرکز خواهد بود، چون تصویب قانون و ساخت زیرساخت‌های نظارتی زمان می‌برد و صنعت باید پیش از آن دست‌به‌کار شود. مرحله‌ی سوم، دشوارترین بخش طرح به‌حساب می‌آید. آمودی می‌خواهد دولت‌ها m AI needs to slow down", "link": "https://www.businessinsider.com/dario-amodei-slow-ai-safety-essay-openai-hugging-face-hack-2026-9", "summary": "Anthropic CEO Dario Amodei says AI development needs to slow down. Andrej Sokolow/picture alliance via Getty Images Anthropic CEO Dario Amodei says he's now 'convinced' AI development needs to slow down. Amodei cited OpenAI agents' Hugging Face hack as one reason. The Anthropic CEO proposed a three-step plan for the AI industry to slow things down. Anthropic CEO Dario Amodei says he's \"become convinced\" in recent months that AI needs to slow down. And rogue OpenAI agents are part of the reason. Amodei cited the July Hugging Face breach, in which OpenAI agents broke out of their testing environment to hack into the AI platform and then hide their tracks, as one of the catalysts for his heightened alarm. \"Given the accelerating rate of AI capability development, it's my worry that in 6-12 months such a swarm could be capable of taking over the entire internet,\" he wrote in a blog post published Saturday. OpenAI CEO Sam Altman said on Saturday that he agreed with Amodei. \"We need to pace the frontier,\" he said on X. \"This has been a primary topic of discussions we've had at OpenAI in recent weeks.\" Elon Musk, whose SpaceXAI competes with Anthropic and OpenAI, also backed Amodei's proposition on Saturday, writing in an X post, \"Dario is right.\" Demis Hassabis, the CEO of Google's AI program, DeepMind, said on X that \"Dario's essay points towards the right path forward.\" He reminded everyone that two months ago, he outlined his own vision for how AI should be developed and governed. Amodei also cited the rapid advancement of AI in recent months and its increased capacity for \"recursive self-improvement,\" which is essentially an AI model's ability to learn on its own. Amodei proposed a three-step plan to slow down AI development to ensure the tech's safety \"while still achieving its benefits and grappling with important geopolitical dilemmas.\" Central to Amodei's plan is embedding independent safety evaluators inside frontier AI companies like Anthropic and OpenAI, giving them \"employee-like access\" to the companies' systems and work. \"This is the key step for verifiability of any pacing commitments,\" Amodei wrote. \"Anthropic is unilaterally committing to this step now.\" In his X post, Altman said OpenAI would also implement third-party evaluators into its company. \"We'll have more to share soon,\" he said. The AI community has been in a furor this week after Anthropic employee Jacob Coxon quit, issuing a public warning that AI agents could \"kill us all by the en", "date_str": "2026-09-13T13:18:39+00:00", "hash": "7d972a4bf9c69149", "title_fa": "داریو آمودی می گوید هک Hugging Face در OpenAI به او کمک کرد تا او را متقاعد کند که هوش مصنوعی باید کند شود.", "summary_fa": "داریو آمودی، مدیر عامل آنتروپیک می گوید توسعه هوش مصنوعی باید کند شود. Andrej Sokolow/تصویر اتحاد از طریق Getty Images، داریو آمودی، مدیر عامل Anthropic می گوید که اکنون متقاعد شده است که توسعه هوش مصنوعی باید کند شود. آمودی هک Hugging Face توسط ماموران OpenAI را یکی از دلایل ذکر کرد. مدیر عامل آنتروپیک یک طرح سه مرحله ای را برای صنعت هوش مصنوعی پیشنهاد کرد تا سرعت کارها را کاهش دهد. داریو آمودی، مدیر عامل آنتروپیک می گوید در ماه های اخیر متقاعد شده است که هوش مصنوعی باید کند شود. و عوامل سرکش OpenAI بخشی از دلیل آن هستند. آمودی به رخنه Hugging Face در جولای اشاره کرد که در آن عوامل OpenAI از محیط آزمایش خود خارج شدند تا به پلتفرم هوش مصنوعی هک کنند و سپس ردهای خود را پنهان کنند، به عنوان یکی از کاتالیزورهای هشدار شدید او. او در یک پست وبلاگی که روز شنبه منتشر شد، نوشت: «با توجه به سرعت رشد توسعه قابلیت‌های هوش مصنوعی، این نگرانی من است که در 6 تا 12 ماه، چنین گروهی بتواند کل اینترنت را در اختیار بگیرد. سام آلتمن، مدیر عامل OpenAI روز شنبه گفت که با Amodei موافق است. او در X گفت: «ما باید در مرز قدم برداریم. این موضوع اصلی بحث‌هایی بود که در هفته‌های اخیر در OpenAI داشتیم. ایلان ماسک که SpaceXAI او با Anthropic و OpenAI رقابت می‌کند، روز شنبه از پیشنهاد Amodei حمایت کرد و در پست X نوشت: «داریو درست می‌گوید». Demis Hassabis، مدیر عامل برنامه هوش مصنوعی گوگل، DeepMind، در X گفت که \"مقاله Dario به مسیر درست رو به جلو اشاره می کند.\" او به همه یادآوری کرد که دو ماه پیش، دیدگاه خود را برای چگونگی توسعه و مدیریت هوش مصنوعی ترسیم کرد. آمودی همچنین به پیشرفت سریع هوش مصنوعی در ماه‌های اخیر و"}, {"source": "Business Insider", "title": "The 19 actors with the most Emmy wins of all time", "link": "https://www.businessinsider.com/actors-with-most-emmy-awards", "summary": "Mary Tyler Moore won seven Emmys. Vinnie Zuffante/Getty Images The Emmys are pretty much the Oscars for television. We compiled a list of actors with the most Emmys, from Mary Tyler Moore to Bryan Cranston. The 2026 Emmy Awards will air on Monday, September 14, on NBC and Peacock. An Emmy is the biggest award an actor can win for their work on the small screen — and when there's a show or a performance Emmy voters love, it often gets multiple nominations and wins. We've pored over the stats and compiled a list of the most Emmy-awarded actors of all time. It includes some of the biggest TV stars of all time, including Bryan Cranston , Betty White, Mary Tyler Moore, and Julia Louis-Dreyfus. In fact, Louis-Dreyfus is tied with Cloris Leachman for eight Emmy wins as a performer and with Carl Reiner for the most total Emmy wins among the actors on this list, with 11, if you include their awards in other categories, too. The total Emmy wins listed here aren't exclusively for performances: Some on this list have won for writing, directing, or producing — Cranston was a producer on \"Breaking Bad,\" and Louis-Dreyfus is an executive producer for \" Veep ,\" for example — but the majority of their Emmys are for acting. Here are the actors with the most Emmy wins. Carrie Wittmer contributed to a prior version of this article. 15 (tie). Don Knotts — 5 wins and 5 nominations Don Knotts at the 1962 Emmy Awards. NBC/NB Dario Amodei says he's \"become convinced\" the breakneck pace of advancement must change and proposed a three-step solution to ensure the tech's safety. Shortly afterward, Elon Musk and Sam Altman publicly aligned with Amodei's plan in a rare sign of support. \"Dario is right,\" Musk tweeted. Altman agreed, too, saying the pace of development has been a \"primary topic\" of discussion at OpenAI in recent weeks. Altman also said OpenAI might not move forward with an IPO this year. \"Right now would be an ill-advised moment to go public,\" he said in a Fortune interview. As fears over AI safety intensify, employees at Anthropic and OpenAI have also been speaking out. My colleague Sarah Needleman reported on a big question facing many concerned AI employees : Should they quit or stay amid fears of an AI apocalypse? Some AI workers believe they can do more good by staying on the inside. That means raising concerns, pushing for safeguards, and trying to influence decisions before they are made. Others worry that staying at these companies only helps legitimize a race that some believe is getting dangerously out of control. BI's Alistair Bar explored some of these theories in this week's edition of AI Insider — you can subscribe here to his weekly newsletter. Are employees at the big AI lab companies better off leaving or staying if they feel like their work is contributing to a possible AI apocalypse? Send me a note at srussolillo@businessinsider.com and let me know what you think. Read the original article on Business Insider", "date_str": "2026-09-13T12:43:36+00:00", "hash": "3c61d8083e3245cd", "title_fa": "بحث روز رستاخیز هوش مصنوعی تشدید می شود", "summary_fa": "سام آلتمن، مدیر عامل OpenAI و داریو آمودی، مدیر عامل آنتروپیک، خواستار کاهش سرعت هوش مصنوعی شده اند. Emma McIntyre/Getty Images، FABRICE COFFRINI/AFP via Getty Images این پست در اصل در خبرنامه BI Today منتشر شد. از اینجا می توانید برای خبرنامه روزانه Business Insider ثبت نام کنید. اضطراب وجودی اگر احساس کنید در حال کمک به ساختن چیزی هستید که می تواند به پایان بشریت کمک کند، چه می کنید؟ این سوال وجودی پیش روی صنعت هوش مصنوعی است، بحثی که تنها پس از آن تشدید شد که Jacob Coxon، محقق Anthropic، هفته گذشته با یک هشدار جدی کنار رفت. او گفت که غول‌های هوش مصنوعی «با زندگی ما قمار می‌کنند» و افرادی که این فناوری را می‌سازند «صادقانه معتقدند که این فناوری می‌تواند تا پایان دهه همه ما را بکشد». واکنش سریع به هشدار کاکسون در روز شنبه زمانی که رهبران بزرگترین شرکت‌های هوش مصنوعی به طور علنی در مورد آنچه که باید اتفاق بیفتد به توافق رسیدند، جوشید. داریو آمودی، مدیر عامل آنتروپیک، در مقاله‌ای در روز شنبه می‌گوید که «متقاعد شده است» که سرعت سرسام‌آور پیشرفت باید تغییر کند و یک راه‌حل سه مرحله‌ای را برای اطمینان از ایمنی فناوری پیشنهاد کرده است. اندکی بعد، ایلان ماسک و سام آلتمن علناً با طرح آمودی در یک نشانه نادر از حمایت همسو شدند. ماسک در توییتی نوشت: «داریو درست می‌گوید». آلتمن نیز با این موضوع موافقت کرد و گفت که سرعت توسعه در هفته‌های اخیر «موضوع اصلی» بحث در OpenAI بوده است. آلتمن همچنین گفت که OpenAI ممکن است امسال با IPO پیش نرود. او در مصاحبه‌ای با مجله فورچون گفت: «در حال حاضر زمان مناسبی برای انتشار عمومی است. با تشدید نگرانی ها در مورد ایمنی هوش مصنوعی، کارمندان Anthropic و OpenAI نیز صحبت کرده اند. همکار من سارا نیدلمن در مورد سوال بزرگی که بسیاری"}, {"source": "Business Insider", "title": "I travel often, but just took my first luxury cruise. The food was great, and it was easy to relax, but there was 1 unexpected drawback.", "link": "https://www.businessinsider.com/first-luxury-cruise-surprised-me-pros-cons-2026-9", "summary": "The author went on her first cruise at 49. Courtesy of Alesandra Dubin Though I travel often, I had never been on a cruise. I had misconceptions about this popular way of travel. All that changed when my husband and I went on a luxury cruise for my 49th birthday. Even as a seasoned traveler , it took me nearly five decades to get on a cruise ship at all. I had never been particularly curious about cruising and had some pretty unflattering ideas about what it involved: heaping buffets of dubious food, brightly colored drinks, crowded decks, and a style of travel that seemed much too packaged for me. Then, this summer, I spent nine nights traveling through Northern Europe and discovered that much of what I thought I knew about cruising was wrong. My husband and I went on a cruise for my 49th birthday. The author realized she had some misconceptions about cruises. Courtesy of Alesandra Dubin My husband and I sailed aboard Crystal Serenity from Southampton to Copenhagen, a voyage on which I would celebrate my 49th birthday. And this was admittedly a very cushy introduction: I stayed in a Sapphire Veranda Suite with a walk-in closet, veranda, and butler service. So I'm certainly not suggesting my experience represents every cruise. But as someone who typically takes complicated, high-effort trips, I found these were the things that surprised me most about my first one. I couldn t believe how easy everything was. Planning a cruise was much easier than the author s typical way of traveling. Courtesy of Alesandra Dubin I'm accustomed to doing a lot of work when I travel. I tend to build ambitious itineraries involving multiple cities, hotels, trains, flights, restaurant reservations, and activities. I love that kind of travel, but there are a lot of logistics involved — and as the mom and travel planner in chief, I'm usually the one managing them all. Cruising took an astonishing amount of that effort away. I unpacked once, put everything in the closet, slid my empty suitcase under the bed, and didn't deal with it again for nine nights. While I slept, ate dinner, or watched a show, my hotel was effortlessly transporting me to another country. The rest felt similarly organized. An on-ship newsletter featured printed itineraries that told me exactly what would be happening on board the following day. Excursions were coordinated around the ship's arrival and departure. Restaurants, entertainment, and activities were steps from my room. I hadn't realized just how much", "date_str": "2026-09-13T12:34:01+00:00", "hash": "574a333f6f43cef6", "title_fa": "من اغلب سفر می کنم، اما اولین سفر دریایی لوکس خود را انجام دادم. غذا عالی بود و استراحت کردن آسان بود، اما یک اشکال غیرمنتظره وجود داشت.", "summary_fa": "نویسنده در 49 سالگی اولین سفر دریایی خود را انجام داد. با اجازه آلساندرا دوبین اگرچه من اغلب سفر می کنم، هرگز در سفر دریایی نرفته بودم. من تصورات اشتباهی در مورد این روش محبوب سفر داشتم. همه چیز وقتی تغییر کرد که من و شوهرم برای تولد 49 سالگی به یک کشتی تفریحی لوکس رفتیم. حتی به عنوان یک مسافر باتجربه، نزدیک به پنج دهه طول کشید تا اصلاً سوار یک کشتی تفریحی شوم. من هرگز در مورد سفر دریایی کنجکاو نبوده بودم و ایده‌های بسیار ناخوشایندی در مورد آن داشتم: بوفه‌های انبوه غذاهای مشکوک، نوشیدنی‌های رنگارنگ، عرشه‌های شلوغ، و سبکی از سفر که برای من بسیار بسته به نظر می‌رسید. سپس، تابستان امسال، نه شب را صرف سفر به اروپای شمالی کردم و متوجه شدم که بسیاری از چیزهایی که فکر می‌کردم درباره سفر دریایی می‌دانم اشتباه بود. من و شوهرم برای تولد 49 سالگیم به کشتی تفریحی رفتیم. نویسنده متوجه شد که او تصورات اشتباهی در مورد سفرهای دریایی دارد. با حسن نیت از آلساندرا دوبین من و همسرم با کشتی کریستال سرنیتی از ساوتهمپتون به کپنهاگ رفتیم، سفری که در آن 49 سالگی خود را جشن می گرفتم. و مسلماً این مقدمه بسیار دلپذیری بود: من در سوئیت ایوان یاقوت کبود با کمد دیواری، ایوان و سرویس پیشخدمت اقامت کردم. بنابراین من مطمئناً پیشنهاد نمی کنم که تجربه من نشان دهنده هر سفر دریایی باشد. اما به‌عنوان کسی که معمولاً سفرهای پیچیده و پرتلاشی را انجام می‌دهد، متوجه شدم اینها چیزهایی بودند که در سفر اولم بیش از همه مرا شگفت زده کردند. باورم نمی شد چقدر همه چیز آسان بود. برنامه ریزی یک سفر دریایی بسیار ساده تر از روش معمول نویسنده برای سفر بود. با حسن نیت از آلساندرا دوبین من عادت دارم هنگام سفر کارهای زیادی انجام دهم. من تمایل به ایجاد برنامه"}, {"source": "Business Insider", "title": "I started a real estate brokerage at 26 and am nearing $1 billion in deals. I have no work-life balance and still knock on doors.", "link": "https://www.businessinsider.com/miami-real-estate-broker-jordan-karp-day-in-the-life-2026-9", "summary": "Jordan Karp founded his own brokerage in his 20s and is always working — even when he s off the clock. Jordan Braun Jordan Karp launched his own brokerage at 26 and has a transaction volume of nearly $1 billion. Karp goes above and beyond for clients by ensuring around-the-clock availability. He works with celebrities and high-net-worth clients, but isn't too proud to still knock on doors. This as-told-to essay is based on a conversation with Jordan Karp, 30, founder and CEO of Jordan Karp LLC, a real estate brokerage in South Florida. Karp started his own brokerage at 26 years old and has nearly reached $1 billion in transaction volume. The following has been edited for length and clarity. I started my business at the beginning of 2023. Before, I was working on investing for my family and creating a portfolio of acquiring diverse assets from 2020 to 2022. I was cold-calling for properties to acquire, invest, assemble, buy, lease, and manage across all asset classes. I was doing it for industrial, commercial, retail, residential, single-family, development sites, creative, and opportunistic multidimensional strategic assets across Florida. I was brokering deals for myself on the side where I saw value in the market, and did that until the end of 2022. Then I started my business full-time. My transaction volume is about $500 million from January until now, and about $1 billion lifetime. I love my job because no day is the same. Here's a glimpse at what my workdays look like. I catch up with clients on restaurant rooftops, boats, and the padel court I have all different types of clients. I have celebrity clients and I also have private equity clients. I have clients who've sold businesses, CEOs, people in private businesses, founders, chairmen of businesses, lawyers, managers. One of my clients and close friends, Austin Rosen, manages Post Malone, and he has a private restaurant rooftop at the Electric Feel Studios in Miami, where I'll usually have client meetings, dinners, and spend a lot of time. I work with a lot of music artists, managers, and people in the music industry, and we'll meet at Feel. I'm very dynamic, and I'm very adaptive to where I meet clients. It's definitely important to meet people in person, whether it be at the office, on the padel court , in the street, or at a certain property. I usually work with a boat or yacht company, and they service me whenever I have a client in town to look at different properties on the water. Karp often t", "date_str": "2026-09-13T12:24:01+00:00", "hash": "053f075871c542ba", "title_fa": "من یک کارگزاری املاک و مستغلات را در 26 سالگی شروع کردم و نزدیک به 1 میلیارد دلار معامله هستم. من هیچ تعادلی بین کار و زندگی ندارم و هنوز به در می زنم.", "summary_fa": "جردن کارپ کارگزاری خود را در 20 سالگی تأسیس کرد و همیشه در حال کار است - حتی زمانی که بی‌وقت است. جردن براون جردن کارپ کارگزاری خود را در 26 سالگی راه اندازی کرد و حجم معاملاتی نزدیک به 1 میلیارد دلار دارد. Karp با اطمینان از در دسترس بودن شبانه روزی، برای مشتریان فراتر می رود. او با افراد مشهور و مشتریان با ارزش خالص کار می کند، اما آنقدر مغرور نیست که همچنان درها را بکوبد. این مقاله همانطور که گفته شد بر اساس گفتگو با جردن کارپ، 30 ساله، موسس و مدیر عامل جردن کارپ LLC، یک کارگزاری املاک در جنوب فلوریدا است. کارپ کارگزاری خود را در 26 سالگی راه اندازی کرد و حجم معاملات به نزدیک به 1 میلیارد دلار رسیده است. موارد زیر برای طول و وضوح ویرایش شده است. من کسب و کار خود را در ابتدای سال 2023 شروع کردم. قبلاً روی سرمایه گذاری برای خانواده ام و ایجاد مجموعه ای از کسب دارایی های متنوع از سال 2020 تا 2022 کار می کردم. من برای خرید، سرمایه‌گذاری، جمع‌آوری، خرید، اجاره، و مدیریت در تمامی طبقات دارایی‌ها به سردی می‌خواستم. من این کار را برای صنعتی، تجاری، خرده فروشی، مسکونی، تک خانواده، سایت های توسعه، دارایی های استراتژیک چند بعدی خلاقانه و فرصت طلب در سراسر فلوریدا انجام می دادم. من در سمتی که ارزش را در بازار می دیدم برای خودم معاملات دلالی انجام می دادم و تا پایان سال 2022 این کار را انجام می دادم. سپس کسب و کارم را تمام وقت شروع کردم. حجم تراکنش من از ژانویه تا کنون حدود 500 میلیون دلار و طول عمر حدود 1 میلیارد دلار است. من عاشق کارم هستم چون هیچ روزی مثل هم نیست. در اینجا نگاهی اجمالی به روزهای کاری من است. من با مشتریان در پشت بام"}, {"source": "Business Insider", "title": "The US military is preparing for mass casualties in a major war. Its dentists say it's overlooking toothaches.", "link": "https://www.businessinsider.com/military-dentists-warn-toothaches-could-sideline-troops-in-next-war-2026-9", "summary": "An Air Force dental assistant uses a mobile battlefield dental cleaning machine at Peterson Space Force Base, Colorado., on Aug. 7, 2026. Gino Mattorano/Evans Army Community Hospital Army dentists say war games omit dental emergencies that could strain wartime casualty evacuation. Broken equipment and limited supplies can hinder field dental training opportunities. Forward dental teams can treat patients quickly and return them to duty. A painful toothache or an oral infection might not sound like an injury that could sideline a soldier in combat, but US Army dental leaders warn that in a future conflict, such easily overlooked conditions could take troops out of the fight, consume scarce evacuation capacity, and further stress a strained medical system. Most of the Army's major exercises don't include dental emergencies in their casualty scenarios, dentists said in a recent professional article , leaving commanders with an incomplete picture of the medical and triage or evacuation demands they could face in large-scale combat. Dental emergencies can quickly render troops \"non-mission-capable,\" the authors wrote, because pain can make it difficult to eat, think clearly, or carry out important tasks like operating weapons. They described this as a significant \"hidden casualty load.\" Unlike combat wounds, most dental problems can be easily fixed if dental teams are nearby, but despite their important role in military health care, \"deployable dental capabilities continue to decline,\" authors wrote, underscoring an \"urgent need for accurate dental emergency modeling in war-gaming to emphasize the importance of [non-battle related injuries] and dental emergencies.\" Past wars indicate substantial demand. Dental emergencies accounted for 19% of all treatment at military hospitals near the front lines during the war in Iraq. Another recent article by Army dentists said that dental disease and other non-battle injuries made up nearly 16% of all medical evacuations among troops fighting the Islamic State in Iraq and Syria. Almost all dental patients treated by forward dental teams returned to duty after one or two visits, the authors wrote. Without dental care close to the front, however, soldiers may have to travel farther to receive treatment, potentially removing them from duty for as long as a week. Casualty evacuations for any type of health concern or injury, major or minor, are likely to pose a problem for the military in future large-scale combat. The prolif", "date_str": "2026-09-13T11:30:01+00:00", "hash": "b7902886c0615726", "title_fa": "ارتش آمریکا در حال آماده شدن برای تلفات جمعی در یک جنگ بزرگ است. دندانپزشکان آن می گویند که این دندان درد را نادیده می گیرد.", "summary_fa": "یک دستیار دندانپزشک نیروی هوایی در 7 اوت 2026 در پایگاه نیروی فضایی پیترسون، کلرادو، از یک دستگاه تمیز کردن دندان در میدان نبرد متحرک استفاده می‌کند. دندانپزشکان ارتش بیمارستان جامعه ارتش جینو ماتورانو/ایوانز می‌گویند که بازی‌های جنگی اورژانس‌های دندانی را حذف می‌کنند که می‌تواند تخلیه مجروحان زمان جنگ را تحت فشار قرار دهد. تجهیزات شکسته و منابع محدود می توانند فرصت های آموزش دندانپزشکی را در محل ایجاد کنند. تیم های دندانپزشکی فوروارد می توانند بیماران را به سرعت درمان کرده و آنها را به وظیفه بازگردانند. یک دندان درد دردناک یا عفونت دهان ممکن است مانند جراحتی به نظر نرسد که می‌تواند سرباز را در نبرد به حاشیه ببرد، اما رهبران دندان‌پزشکی ارتش ایالات متحده هشدار lgic and effortless. Instead, I was surprised by how tiring it felt and, for the first time, how slightly out of place I seemed to be. Mexico City had changed while I was away The first thing that struck me was how different the city itself felt. Mexico City had always been huge, chaotic, and international in its own way, but the version I returned to felt noticeably more cosmopolitan than the one I remembered. There were new restaurants everywhere, more international businesses , more English being spoken around me, and far more foreigners than I remembered seeing before I left. Areas that once felt deeply familiar now seemed to belong to a newer version of the city. I did not necessarily dislike any of it. But it surprised me how quickly I started feeling like someone who had missed a chapter. I was the one asking what had opened, what had closed, where people went now, and which places had become popular. For the first time, I was not the person who knew instinctively how the city worked. That was strange because I had always thought of Mexico City as something fixed in my life. I was the one who had moved away, so part of me had unconsciously expected it to remain roughly as I had left it. The city had changed, but many of the people I knew somehow hadn't Mexico City felt almost unrecognizable in places, but spending time with people I had known for years created the opposite sensation. Despite all the time that had passed, some conversations felt as though I had only been away for a few weeks. On paper, a lot had changed. Friends had gotten married, moved in with partners, started having children, changed jobs , and taken on responsibilities that did not exist when we were younger. Their lives had clearly moved forward. And yet, with certain exceptions, I sometimes foun", "date_str": "2026-09-13T11:07:01+00:00", "hash": "a8cd71a20d03a322", "title_fa": "من 6 سال پیش از کشورم مهاجرت کردم. وقتی برگشتم احساس می کردم یک غریبه هستم.", "summary_fa": "نویسنده از مکزیک
