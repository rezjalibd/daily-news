<head>

  <title>مجله خبری روزانه — ۳ آبان ۱۴۰۵</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root[data-theme="dark"] {
      --bg: #0b0f19;
      --header-bg: linear-gradient(135deg, #1e293b, #0f172a);
      --card-bg: #151d30;
      --card-border: #232f48;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --primary: #38bdf8;
      --primary-hover: #0284c7;
      --badge-bg: rgba(56, 189, 248, 0.15);
      --tab-bg: #151d30;
      --tab-border: #232f48;
      --tab-text: #94a3b8;
      --tab-active-bg: #38bdf8;
      --tab-active-text: #0f172a;
      --search-bg: #151d30;
      --search-border: #232f48;
      --toggle-bg: #1e293b;
      --toggle-border: #334155;
      --modal-bg: #151d30;
      --modal-border: #334155;
      --read-bg: #0d1322;
      --read-border: #1e293b;
      --success: #10b981;
    }
    :root[data-theme="light"] {
      --bg: #f8fafc;
      --header-bg: linear-gradient(135deg, #ffffff, #f1f5f9);
      --card-bg: #ffffff;
      --card-border: #e2e8f0;
      --text: #0f172a;
      --text-muted: #64748b;
      --primary: #0284c7;
      --primary-hover: #0369a1;
      --badge-bg: rgba(2, 132, 199, 0.1);
      --tab-bg: #ffffff;
      --tab-border: #e2e8f0;
      --tab-text: #64748b;
      --tab-active-bg: #0284c7;
      --tab-active-text: #ffffff;
      --search-bg: #ffffff;
      --search-border: #cbd5e1;
      --toggle-bg: #f1f5f9;
      --toggle-border: #cbd5e1;
      --modal-bg: #ffffff;
      --modal-border: #cbd5e1;
      --read-bg: #f1f5f9;
      --read-border: #e2e8f0;
      --success: #059669;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Vazirmatn', -apple-system, BlinkMacSystemFont, Tahoma, sans-serif;
    }
    body {
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.8;
      padding: 20px 12px;
      direction: rtl;
      transition: background-color 0.3s ease, color 0.3s ease;
    }
    .container {
      max-width: 880px;
      margin: 0 auto;
    }
    header {
      background: var(--header-bg);
      border: 1px solid var(--card-border);
      border-radius: 18px;
      padding: 22px 20px;
      margin-bottom: 20px;
      position: relative;
      text-align: center;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
      transition: all 0.3s ease;
    }
    .header-actions {
      position: absolute;
      top: 18px;
      left: 18px;
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .btn-action {
      background: var(--toggle-bg);
      border: 1px solid var(--toggle-border);
      color: var(--text);
      padding: 7px 12px;
      border-radius: 12px;
      cursor: pointer;
      font-size: 0.85rem;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-weight: 600;
      transition: all 0.2s ease;
    }
    .btn-action:hover {
      border-color: var(--primary);
    }
    h1 {
      font-size: 1.7rem;
      font-weight: 800;
      margin-bottom: 6px;
    }
    .meta-bar {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin-top: 12px;
      font-size: 0.85rem;
      color: var(--text-muted);
    }
    .meta-tag {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      padding: 4px 12px;
      border-radius: 9999px;
    }
    .search-box {
      margin-bottom: 18px;
    }
    .search-input {
      width: 100%;
      padding: 13px 18px;
      border-radius: 12px;
      background: var(--search-bg);
      border: 1px solid var(--search-border);
      color: var(--text);
      font-size: 0.95rem;
      outline: none;
      transition: all 0.2s ease;
    }
    .search-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2);
    }
    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      padding-bottom: 4px;
    }
    .tabs::-webkit-scrollbar {
      display: none;
    }
    .tab-btn {
      flex: 1;
      white-space: nowrap;
      padding: 12px 14px;
      border-radius: 12px;
      background: var(--tab-bg);
      border: 1px solid var(--tab-border);
      color: var(--tab-text);
      font-size: 0.92rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s ease;
      flex-shrink: 0;
    }
    .tab-btn.active {
      background: var(--tab-active-bg);
      color: var(--tab-active-text);
      border-color: var(--tab-active-bg);
    }
    .badge {
      background: rgba(0, 0, 0, 0.15);
      padding: 2px 7px;
      border-radius: 9999px;
      font-size: 0.8rem;
    }
    .news-grid {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .news-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 20px;
      transition: all 0.25s ease;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.03);
      position: relative;
    }
    .news-card:hover {
      border-color: var(--primary);
      transform: translateY(-2px);
    }
    .news-card.is-read {
      background: var(--read-bg);
      border-color: var(--read-border);
      opacity: 0.7;
    }
    .news-card.is-read:hover {
      opacity: 0.95;
    }
    .news-header {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 12px;
    }
    .news-num {
      background: var(--badge-bg);
      color: var(--primary);
      font-weight: 700;
      font-size: 0.85rem;
      min-width: 30px;
      height: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      margin-top: 2px;
      flex-shrink: 0;
    }
    .news-card.is-read .news-num {
      background: rgba(16, 185, 129, 0.15);
      color: var(--success);
    }
    .news-title {
      font-size: 1.1rem;
      font-weight: 700;
      line-height: 1.6;
      flex: 1;
    }
    .news-summary {
      font-size: 0.94rem;
      color: var(--text-muted);
      margin-bottom: 14px;
      text-align: justify;
      line-height: 1.75;
    }
    .news-footer {
      display: flex;
      flex-direction: column;
      gap: 10px;
      border-top: 1px solid rgba(128, 128, 128, 0.12);
      padding-top: 12px;
      font-size: 0.85rem;
    }
    .footer-top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
    }
    .meta-group {
      display: inline-flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      font-size: 0.82rem;
    }
    .news-source {
      color: var(--text-muted);
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .news-datetime {
      color: var(--text-muted);
      font-size: 0.78rem;
      background: rgba(148, 163, 184, 0.08);
      padding: 2px 7px;
      border-radius: 6px;
      border: 1px solid rgba(148, 163, 184, 0.15);
    }
    .news-category-badge {
      display: inline-flex;
      align-items: center;
      background: var(--badge-bg);
      color: var(--primary);
      border: 1px solid rgba(56, 189, 248, 0.25);
      border-radius: 6px;
      padding: 2px 8px;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .news-category-badge:hover {
      background: var(--primary);
      color: #0f172a;
      transform: translateY(-1px);
    }
    .footer-tags-row {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
    }
    .news-tag-chip {
      display: inline-flex;
      align-items: center;
      font-size: 0.75rem;
      color: var(--text-muted);
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--card-border);
      padding: 1px 7px;
      border-radius: 5px;
      cursor: pointer;
      transition: all 0.2s ease;
      font-weight: 500;
    }
    .news-tag-chip:hover {
      color: var(--primary);
      border-color: var(--primary);
      background: var(--badge-bg);
      transform: translateY(-1px);
    }
    .footer-bottom-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      border-top: 1px dashed rgba(128, 128, 128, 0.12);
      padding-top: 10px;
      margin-top: 4px;
    }
    .footer-actions-right {
      display: flex;
      align-items: center;
    }
    .footer-actions-left {
      display: flex;
      align-items: center;
      margin-right: auto;
    }
    .btn-mark-read {
      background: transparent;
      border: 1px solid var(--toggle-border);
      color: var(--text-muted);
      padding: 4px 10px;
      border-radius: 8px;
      font-size: 0.8rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-weight: 600;
      transition: all 0.2s ease;
    }
    .btn-mark-read:hover {
      border-color: var(--success);
      color: var(--success);
    }
    .news-card.is-read .btn-mark-read {
      background: rgba(16, 185, 129, 0.15);
      border-color: var(--success);
      color: var(--success);
    }
    .news-link {
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
      transition: color 0.2s ease;
    }
    .news-link:hover {
      text-decoration: underline;
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 16px;
    }
    .modal-overlay.active {
      display: flex;
    }
    .modal-card {
      background: var(--modal-bg);
      border: 1px solid var(--modal-border);
      border-radius: 18px;
      width: 100%;
      max-width: 520px;
      max-height: 80vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
      animation: modalFadeIn 0.2s ease;
    }
    @keyframes modalFadeIn {
      from { transform: scale(0.95); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
    .modal-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--card-border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .modal-title {
      font-size: 1.15rem;
      font-weight: 700;
    }
    .btn-close {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 1.4rem;
      cursor: pointer;
      line-height: 1;
      padding: 4px;
    }
    .btn-close:hover {
      color: var(--text);
    }
    .modal-body {
      padding: 16px 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .archive-item {
      background: var(--bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      text-decoration: none;
      color: var(--text);
      transition: all 0.2s ease;
    }
    .archive-item:hover {
      border-color: var(--primary);
      transform: translateX(-4px);
    }
    .archive-date-fa {
      font-weight: 700;
      font-size: 0.95rem;
    }
    .archive-date-g {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 2px;
    }
    .archive-arrow {
      color: var(--primary);
      font-size: 1.1rem;
    }

    @media (max-width: 640px) {
      header { padding: 18px 14px; padding-top: 56px; }
      .header-actions { top: 12px; left: 12px; width: calc(100% - 24px); justify-content: space-between; }
      .btn-action { font-size: 0.78rem; padding: 6px 9px; }
      h1 { font-size: 1.35rem; }
      .tabs { gap: 6px; }
      .tab-btn { padding: 10px 10px; font-size: 0.84rem; gap: 6px; }
      .badge { padding: 1px 5px; font-size: 0.75rem; }
      .news-card { padding: 16px; }
      .news-title { font-size: 0.98rem; }
      .news-summary { font-size: 0.88rem; }
      .news-footer { flex-direction: column; align-items: stretch; gap: 10px; }
      .footer-bottom-row { width: 100%; display: flex; justify-content: space-between; align-items: center; }
    }
  </style>
</head>

-%D8%B4%D8%A8-%D9%87%D8%B3%D8%AA%D9%86%D8%AF/", "summary": "مسعود پزشکیان، رییس‌ دولت جمهوری اسلامی، روز شنبه دوم آبان با اشاره به فشارهای اقتصادی و مشکلات معیشتی مردم، خواستار پایان دادن به وضعیت ...", "date_str": "2026-10-24T15:37:04+00:00", "hash": "cce2d8fe705e5954", "title_fa": "پزشکیان: مردم در وضعیت «نه جنگ، نه صلح» گرفتار نان شب هستند", "summary_fa": "مسعود پزشکیان، رییس‌ دولت جمهوری اسلامی، روز شنبه دوم آبان با اشاره به فشارهای اقتصادی و مشکلات معیشتی مردم، خواستار پایان دادن به وضعیت ... پزشکیان در مراسم آغاز سرشماری نفوس و مسکن سال ۱۴۰۵، با اشاره به دشواری‌های معیشتی مردم گفت: «الان در این جامعه هستند خیلی‌ها که گرفتار نان شب‌شان هستند، به خاطر جنگی که در آن قرار گرفتیم، به خاطر شرایط نه صلح نه جنگی که در آن قرار گرفتیم.» او با تاکید بر ضرورت خروج از وضعیت کنونی افزود: «من معتقدم باید از این وضعیت هم دربیاییم.» رییس‌جمهور ایران در بخش دیگری از سخنانش گفت خامنه‌ای پیش از کشته‌شدن در جنگ اخیر، خواستار پایان دادن به وضعیت «نه جنگ، نه صلح» شده و «دستور داد که بروید تمامش بکنید». پزشکیان مشخص نکرد که منظور خامنه‌ای از این دستور، ازسرگیری مذاکرات با آمریکا یا دستیابی به توافقی تازه بوده است، اما تاکید کرد که ادامه بلاتکلیفی، امکان برنامه‌ریزی برای آینده کشور را از بین می‌برد. او گفت: «در بلاتکلیفی نمی‌شود برنامه‌ریزی کرد. باید تکلیف‌مان را بدانیم. بالاخره می‌خواهیم چه کار کنیم؟» این اظهارات در شرایطی مطرح می‌شود که با وجود وقوع دو جنگ در ایران طی یک سال و نیم گذشته، تنش‌های نظامی میان جمهوری اسلامی و آمریکا همچنان ادامه دارد و چشم‌انداز روشنی برای پایان وضعیت کنونی دیده نمی‌شود. در این بخش ایران وایر می‌توانید با مسوولان تماس بگیرید و کارزار خود را برای مشکلات مختلف راه‌اندازی کنید با ایران‌وایر همکاری کنید ویدیوها و مطالب خود را برای ما بفرستید", "image_url": "https://static.prod.iranwire.com/_versions_jpeg/articleslide/image_4_HTON__v1024x512__box_0%2C0%2C678%2C356.jpeg", "category": "اقتصاد و بازرگانی", "tags": ["روابط بین‌الملل"], "datetime_fa": "۲ آبان • ۱۹:۰۷"}, {"source": "Euronews Persian", "title": "نماینده چین: با پایان اعتبار قطعنامه ۲۲۳۱، آژانس باید رار داده که دو مهاجم مسلح فلسطینی از آنجا آمده بودند و ممکن است چندین روز به طول انجامد. منابع محلی می‌گویند از روز گذشته دست‌کم ۲۵۰ خانواده به‌اجبار از خانه‌های خود در این شهر بیرون رانده شده‌اند. خبرگزاری فرانسه گزارش داد که در محله «عین دیر بها» که میان دو تپه واقع شده است، روی ساختمان‌های تخلیه شده علامت ضربدر دیده می‌شود. در این گزارش آمده که خیابان‌های این منطقه از مردم و خودروها تخلیه شده و تنها چند خودروی نظامی اسرائیلی در آنجا به چشم می‌خورد. به برخی ساکنان و فروشندگان محلی دو ساعت فرصت داده شد تا محل زندگی و کسب خود را ترک کنند. خالد دودین، فرماندار الخلیل، به خبرگزاری فرانسه گفت که حدود یک‌سوم این شهر هدف عملیات ارتش اسرائيل قرار گرفته است. او گفت: «آن‌ها کار را از محله‌ای آغاز کردند که عاملان حمله از آنجا آمده بودند، اما هیچ تضمینی وجود ندارد که دامنه این عملیات گسترش نیابد.» آقای دودین افزود: «این اقدام در حکم مجازات دسته‌جمعی غیرنظامیانی است که هیچ‌گونه ارتباطی با این ماجرا ندارند.» خبرنامه بی‌بی‌سی فارسی گزیده‌ای از مهم‌ترین خبرها، گزارش‌های میدانی و گفت‌وگوهای اختصاصی را هر هفته در ایمیل خود دریافت کنید. بنیامین نتانیاهو اما می‌گوید که «اقدامات بزرگ‌تری» در راه است. او در مصاحبه‌ای با شبکه آی۲۴ نیوز که شامگاه جمعه انجام شد، درباره", "image_url": "https://ichef.bbci.co.uk/news/1200/branded_persian/9f2c/live/1e3e9090-cfab-11f1-93e1-3b657b665bcf.jpg", "category": "هوش مصنوعی مولد", "tags": ["رویداد", "گزارش"], "datetime_fa": "۲ آبان • ۱۸:۴۷"}, {"source": "BBC Persian", "title": "دور تازه اعتراضات فرانسه؛ ۱۳۵ نفر بازداشت شدند", "link": "https://www.bbc.com/persian/articles/c50mep7kxr2zo?at_medium=RSS&at_campaign=rss", "summary": "در فرانسه بار دیگر ده‌ها هزار نفر برای تظاهرات اعتراض‌آمیز به خیابان‌ها آمدند. معترضان در برخی شهرها از جمله پاریس با پلیس درگیر شدند. در جریان این درگیری‌ها ۱۳۵ نفر بازداشت شده‌اند.", "date_str": "2026-10-24T15:45:47+00:00", "hash": "c9e60eb088c0c980", "title_fa": "دور تازه اعتراضات فرانسه؛ ۱۳۵ نفر بازداشت شدند", "summary_fa": "در فرانسه بار دیگر ده‌ها هزار نفر برای تظاهرات اعتراض‌آمیز به خیابان‌ها آمدند. معترضان در برخی شهرها s that require more patience and care. And I'm in the middle, adjusting the trip so everyone can still participate. I used to plan for adventure. Now I'm thinking about walking distances, downtime, unpacking, and what my parents can comfortably do, while still making it fun for the 21-year-olds. The author says she now needs to take into consideration what her parents can do, and what will keep her son entertained. Courtesy of the author But what I learned on this trip was that sometimes, when choosing something for the youngest generation, a magical memory is created for the oldest, like when we went to Nikki Beach in St. Tropez at my son's request. We had been there for lunch a few years prior, and we wanted to return, this time when we could see the true Euro summer beach club vibe in action, complete with waving white napkins and ABBA blasting from the DJ booth . I never would have guessed it, but both of my parents were up and dancing that day. My mom has since declared the whole day one of her favorites. Who knew? Maybe all they need is a \"darty\" ( day party, as my college kid tells me!). These are not just vacations for my parents After what my dad had said earlier in the trip, I watched him differently that day. Seeing him dancing with my mom, laughing and completely in the moment,", "date_str": "2026-10-24T17:58:01+00:00", "hash": "599a4d2ab45a5ee7", "title_fa": "پدرم 75 سال دارد. او به من گفت که سفرهای خانوادگی سالانه ما باعث می شود احساس کند هنوز آینده ای دارد.", "summary_fa": "نویسنده با پدر و مادر و خانواده اش سفر می کند. با حسن نیت از نویسنده پسر 21 ساله من می خواست در طول تعطیلات خانوادگی ما از یک کلوپ ساحلی پر جنب و جوش دیدن کند. هرگز انتظار نداشتم والدینم، هر دو دهه 70، بلند شوند و با ABBA برقصند. دیدن شادی آنها به من یادآوری کرد که پیر شدن به معنای دست کشیدن از تجربیات جدید نیست. پدر 75 ساله ام به من گفت که اگر تعطیلات سالانه خانوادگی ما متوقف شود، احساس می کند که به مرگ نزدیک تر است. او برای آن آماده نیست. من هم نیستم. من را در مسیر من متوقف کرد  now become obsessed with the $39 Cheirosa perfume mists, the first of which debuted in 2020. The sprays have become a staple of young people's shopping hauls, holiday wish lists, and what's-in-my-bag videos. The brand confirmed to Business Insider that its three most popular scents are Cheirosa 62 , 40 , and 68 . I'm a big fragrance fan myself, but I had yet to try the perfume mists. So I went to Ulta Beauty, purchased a $49 sample set of six Sol de Janeiro scents, and tested them on my skin. Considering each mist's scent, staying power, wearability, and personal preference, here's how I'd rank them from worst to best. I wish the Cheirosa 71 mist had more depth. The Cheirosa 71 perfume mist from Sol de Janeiro. Sol de Janeiro If there's one thing I love more than fragrances, it's sweet treats — so Cheirosa 71 should have worked for me. Sol de Janeiro says the scent is inspired by the iconic Confeitaria Colombo bakery in Brazil , with notes of caramelized vanilla, toasted macadamia nut, sea salt, white chocolate, and tonka bean. When I tried it, the mist smelled more like a gingerbread cookie to me. Then, as it settled, it transformed into something more reminiscent of a graham cracker drizzled with caramel. Some critics of this scent say it smells like buttered popcorn . I didn't notice that on my skin. Instead, it reminded me of a holiday hand sanitizer from Bath Body Works. I can appreciate the scent for a moment, but I don't want it to linger all day. It's too strong and sickly sweet for me. Cheirosa 62 is Sol de Janeiro", "date_str": "2026-10-24T16:36:01+00:00", "hash": "ddb6fb2c68552fd2", "title_fa": "Gen Z عاشق Sol de Janeiro است - بنابراین من 6 مورد از محبوب ترین عطرهای این برند را امتحان کردم و آنها را از بدترین تا بهترین رتبه بندی کردم.", "summary_fa": "عطر میست Cheirosa 62 از Sol de Janeiro. Sol de Janeiro وقتی یکی از اعضای Gen Z بوی خوبی می دهد، احتمالاً می توانید از Sol de Janeiro تشکر کنید. من یک هزاره هستم و تازه وارد این برند هستم، بنابراین شش تا از عطرهای محبوب آن را امتحان کردم. بهترین رایحه، به نظر من، یکی از کم ارزش ترین رایحه های این برند است. Millennials دارای ویکتوریا سیکرت و Bath Body Works بودند. ژنرال Z دارای سول دژانیرو است. این برند بدن، مو و عطر که در سال 2015 تأسیس شد، به یک بازیگر اصلی در صنعت تبدیل شده است. گزارش سال مالی 2025 از گروه L'Occitane، شرکت مادر سول دو ژانیرو، نشان می دهد که این برند 31.6 درصد از فروش گروه را به خود اختصاص داده است. این گزارش همچنین Sol de Janeiro را به عنوان برند زیبایی شماره 1 سفورا آمریکای شمالی و برند شماره 1 عطر در آمازون ایالات متحده در آن زمان معرفی کرد. دو محصول Sol de Janeiro منجر به این اتهام شده است. ابتدا، هزاره‌ها کرم برزیلی Bum Bum 48 دلاری را پس از عرضه در سال 2015 پذیرفتند و آن را به یک محصول اصلی مراقبت از پوست تبدیل کردند. جوانان و نوجوانان اکنون شیفته عطرهای 39 دلاری Cheirosa شده‌اند که اولین آن در سال 2020 عرضه شد. این اسپری‌ها به یکی از اصلی‌ترین لوازم خرید جوانان، فهرست‌های آرزوهای تعطیلات، و ویدیوهای آنچه در کیف من است تبدیل شده‌اند. این برند به Business Insider تایید کرد که سه رایحه محبوب آن Cheirosa 62، 40 و 68 هستند. من خودم از طرفداران عطر هستم، اما هنوز عطرهای عطر را امتحان نکرده بودم. بنابراین من به Ulta Beauty رفتم، یک مجموعه نمونه 49 دلاری از شش عطر Sol de Janeiro خریدم و آنها را روی پوستم آزمایش کردم. با توجه به رایحه هر", "image_url": "https://i.insider.com/6ad275b92428f6b45581342e?width=1200&format=jpeg", "category": "هوش مصنوعی مولد", "tags": ["فناوری", "نوآوری"], "datetime_fa": "۲ آبان • ۲۰:۰۶"}, {"source": "Business Insider", "title": "Zelenskyy says Starlink is working again in Ukraine and thanks Americans who 'took this seriously'", "link": "https://www.businessinsider.com/starlink-ukraine-zelenskyy-elon-musk-trump-2026-10", "summary": "Ukrainian President Volodymyr Zelenskyy said Starlink s speed had returned to normal. Genya SAVILOV / AFP via Getty Images Volodymyr Zelenskyy said that speed restrictions on Ukraine's Starlink connection have been lifted. His comments marked the end of a chaotic 10-day period where connection speeds were throttled. Ukraine uses Starlink to fly its drones and interceptors. Ukraine President Volodymyr Zelenskyy said on Saturday that his military's access to a network of Elon Musk's satellites, which it relies on for targeting and defense, had been restored. Zelenskyy's comment, made in an X post, came after a chaotic 10 days that began when an advisor to the Ukrainian president said that drones and other projectiles were losing access to the Starshield network. Starshield is the military application of Musk's Starlink satellite network. In the no-man's-land of war-torn eastern Ukraine, the Ukrainian military relies on Starshield satellites to give it control of fast-flying, exploding drones and interceptors. \"I thank all Americans and all our partners who took this seriously and truly helped — members of Congress, senators, all the media, the State Department, and the President,\" Zelenskyy said in a video he posted to X on Saturday. Though Musk, as the CEO of SpaceX, to some degree owns the network of satellites, he said in an X post that \"any limits on speed or usage are decided by the US military and ultimately POTUS.\" The Wall Street Journal reported that Musk himself had ordered the slowdown. Earlier this month, after Ukraine targeted Russian oil facilities, both Musk and President Donald Trump made statements disparaging Zelenskyy. Trump has tried to ease high gas prices — which spiked after the US attacked Iran in February — by loosening sanctions on Russian energy. \"Zelensky has gone too far,\" Musk said in an X post on October 10. For his part, Trump told reporters that he didn't know who ordered the slowdown. \"I don't know who it was, but I'd like to find out,\" he said on October 19. As Russia attempts to bombard Kyiv into submission ahead of what is widely expected to be one of the most brutal winters of the nearly seven-year-long war, a Starlink connection allows Ukraine to intercept some of Russia's slower-paced drones. The throttling of St زرگ‌ترین فروشنده‌ی خودروهای برقی در جهان تبدیل شد، واکنشی به این موضوع نشان نداده است. بی‌وای‌دی هم‌اکنون در حال گسترش حضور در بازارهای جهانی از جمله ژاپن است و پیش‌تر خودرو جمع‌وجور «راکو» را برای رقابت با برندهای بومی وارد بازار این کشور کرد. پنتاگون پیش‌تر، بی‌وای‌دی را در کنار شرکت‌هایی چون علی‌بابا، بایدو و نیو در فهرست مجموعه‌های حامی ارتش چین قرار داده بود؛ تصمیمی که با مخالفت بی‌وای‌دی و وعده‌ی پیگیری حقوقی مواجه شد. چین نیز پیش‌تر محدودیت‌های مشابهی را علیه خودروهای تسلا اعمال کرده بود. دولت پکن در سال ۲۰۲۱ ورود تسلا را به‌دلیل نگرانی از دوربین‌های نصب‌شده روی خودروها به برخی محوطه‌های دولتی ممنوع کرد؛ اما پس از اخذ تاییدیه‌های لازم از سوی انجمن خودروسازان چین، محدودیت‌ها را در سال ۲۰۲۴ لغو کرد. لایک نظرت چیه؟ ارسال نظر بوکمارک اشتراک‌گذاری امیر عبدالملکی دنبال کردن به محتوای این مطلب چه امتیازی میدی؟", "image_url": "https://api2.zoomit.ir/media/6746ed5a073eb22d13b384fc?w=128&q=75", "category": "امنیت سایبری و شبکه", "tags": ["فناوری", "نوآوری"], "datetime_fa": "۲ آبان • ۱۷:۳۰"}, {"source": "Business Insider", "title": "I'm 38 and feel like my life is speeding up. My 61-year-old husband wants to slow down.", "link": "https://www.businessinsider.com/older-husband-young-kids-age-gap-marriage-2026-10", "summary": "The author and her husband have a 23-year age gap. Courtesy of Caroline Chirichella My husband is 23 years older than I am, but our age difference never bothered me before. Now that he's 61 and we're raising two young kids, I'm noticing our different energy levels. I love our life together, but I'm struggling with the realities of our age gap. When my husband and I first met back in 2014, we had what many would consider a whirlwind romance. We met, fell in love almost instantly, moved in together after a year, got engaged six months later, married a month after that, and a little over a year later, welcomed our first child. It was all very exciting, rushed, and filled with emotion and love. I'm also a very rational person who doesn't get easily swept up in the moment. So we talked about a lot of the \"hard\" decisions that couples so often neglect to discuss at the beginning of a relationship. We talked about children, our future, and what we wanted our lives to look like. That's why, now, more than 12 years later , it's surprising to find myself struggling with something I thought I had already made peace with: our age gap. He is 23 years older than me My husband and I have a 23-year age difference. Yes, I was always aware of it. And, to be honest, it never really made a difference to me. The author s husband is now in his 60s and the couple has two young kids. Courtesy of the author Especially when it came to the big life decisions , including having children, we had those conversations before we even got engaged. I knew exactly how old he was. I knew there would be things about growing older together that would be different for us. But I guess there's a big difference between being aware of something that could eventually happen and actually living it. Our age difference has been showing up in more ways than one lately, and there's a part of me that's angry with myself for being surprised by it. It's not like my husband was always going to be the 48-year-old I met when I was 25. I knew he would age. I knew things would change as he got older. I knew there would eventually be a point when the difference between us became more noticeable. I just don't think I ever wanted to admit to myself exactly how much. He's in his 60s now I knew he was going to be an older father. I knew all of this. But knowing something and seeing it firsthand are two very different things. Lately, I've seen just how much his 61 years are catching up to him, and it's been putting me ", "date_str": "2026-10-24T14:36:01+00:00", "hash": "e546110d96bcce94", "title_fa": "من 38 ساله هستم و احساس می کنم زندگی ام در حال افزایش است. شوهر 61 ساله من می خواهد سرعتش را کم کند.", "summary_fa": "نویسنده و همسرش 23 سال فاصله سنی دارند. با حسن نیت از ک ip together every year. It's been a great way to stay connected and make new memories , even as our lives change. Our trips are more relaxed in our 30s than they were in our 20s, but they've all been wonderful. I'm a firm believer that there are some people in this world you're simply destined to meet and have in your life forever. For me, one of those people is my sorority-Little-turned-soul-sister, Lisa. After bonding over many things during recruitment sophomore year — including our shared love for Blink-182 and punk rock — we both unknowingly wrote down on the get-to-know-you quizzes for the committee that we hoped to be paired as Big and Little sisters. We were, and the rest is history. Our college days were constantly filled with plans together, and by graduation, we couldn't imagine embarking on this next phase of adulthood with over 180 miles between us. She's from the Boston area, while I'm from Connecticut and moved to New York City right after college. So, we agreed to prioritize our friendship and made a pact to spend time together in person every year. Since graduating in 2015, we've planned a getaway together every summer. Our trips haven't always looked the same, but they have some constants Distance has never kept us apart because we didn t let it. Alexa Mellardo Right out of college, Lisa and I looked forward to a few sun-drenched days spent catching up on Long Beach Island, New Jersey. From the Victoria Guest House to the Engleside Inn, we'd book a charming yet affordable place steps away from the beach to spend long days working on our tans, cranking up the tunes, and sipping spiked seltzers. At night, we'd head out for bar hopping and dancing to live music until the wee hours of the morning. The next day, we would rinse and repeat. We initially chose the Jersey Shore because it's an easy ride to perfect summer weather and beautiful beaches. It became our go-to place, though we now switch up locations every now and then. No matter where we go, I k Sued For Stealing Elvis Presley Music to Train AI: ‘Deeply Protective of These Iconic Songs’", "link": "https://www.billboard.com/pro/elvis-presley-estate-sues-suno-anthropic/", "summary": "The owners of Elvis Presley s music have launched a legal war over artificial intelligence, suing AI giant Anthropic over accusations that it trained its models on hundreds of the legendary artist’s song without permission. The new lawsuit, filed Friday (Oct. 23) and first reported by Billboard , claims that Anthropic, the tech behemoth behind Claude, infringed 274 of the rock legend s copyrighted songs, including famed hits like “Can’t Help Falling in Love, “A Little Less Conversation” and “Don’t Be Cruel.” Related Taylor Swift Files to Trademark Her Voice and Image as AI Deepfakes Grow Diddy Moved From New Jersey Prison to Similar Facility in Pennsylvania Weezer to Receive Legend of Live Award at 2026 Billboard Live Music Summit The Elvis Plaintiffs bring this action to enforce these exclusive rights against the defendant that has built its entire business model based on copyright infringement at a scale never seen before, writes Richard Busch , the lead attorney behind the lawsuit. The Elvis Plaintiffs are deeply protective of these iconic songs. Though music companies like Universal Music Group have already repeatedly sued AI companies for stealing their IP, the new lawsuits represents by far the most high-profile legal action filed on behalf of an individual musician — in this case, arguably the most famous recording artist of all time. The case was filed by a unit of Authentic Brands Group, the licensing giant that largely controls the intellectual property rights to Elvis, including much of his song catalog, his brand trademarks and the rights to his name, image and likeness. It was co-filed by various other entities that own Elvis rights. Like other AI firms, Anthropic is already facing numerous lawsuits over the process of “training” their models to create new ones, which involves ingesting millions of existing works without permission. AI companies say that process is protected by copyright s fair use defense, but that issue remains pending across dozens of lawsuits with billions of dollars in potential damages at stake. Litigation over AI music has centered more on Suno, the leading AI song generator, which was sued in 2024 by all three major music companies over such training accusations. It eventually settled with Warner Music Group last year and has vowed to partner with the music industry, but is still facing contentious litigation from UMG and Sony Music. Anthropic, a far larger AI firm, has faced similar cases across creative industries, i", "date_str": "2026-10-24T14:34:54+00:00", "hash": "780f0c6501d30dba", "title_fa": "شکایت از آنتروپیک برای دزدیدن موسیقی الویس پریسلی برای آموزش هوش مصنوعی: «از این آهنگ‌های نمادین محافظت عمیق»", "summary_fa": "صاحبان موسیقی الویس پریسلی یک جنگ حقوقی را بر سر هوش مصنوعی به راه انداخته‌اند و از غول هوش مصنوعی Anthropic شکایت کرده‌اند که مدل‌هایش را بدون اجازه صدها آهنگ این هنرمند افسانه‌ای را آموزش داده است. شکایت جدید، که روز جمعه (اکتبر. 23) و اولین بار توسط بیلبورد گزارش شد، ادعا می‌کند که آنتروپیک، غول تکنولوژی پشت کلود، 274 آهنگ دارای حق چاپ این افسانه راک، از جمله آهنگ‌های معروفی مانند «Can’t Help Falling in Love»، «A Little Less Conversation» و «Don’t Be Cruel» را نقض کرده است. فایل‌های مربوط به تیلور سویفت برای علامت تجاری صدا و تصویرش در حالی که AI Deepfakes رشد می‌کند دیدی از زندان نیوجرسی به مرکز مشابهی در پنسیلوانیا ویزر منتقل شد تا جایزه Legend of Live را در اجلاس موسیقی زنده بیلبورد 2026 دریافت کند. شاکیان الویس این حقوق انحصاری را بر اساس تمام کپی‌رایت خود ساخته است که این حقوق انحصاری را در برابر تمام کپی رایت خود ارائه کرده است. ریچارد بوش، وکیل اصلی این شکایت، می نویسد: نقض در مقیاسی که قبلاً دیده نشده بود. شاکیان الویس عمیقاً از این آهنگ های نمادین محافظت می کنند. اگرچه شرکت‌های موسیقی مانند گروه موسیقی یونیورسال قبلاً بارها از شرکت‌های هوش مصنوعی به دلیل سرقت IP آنها شکایت کرده‌اند، شکایت‌های جدید تا حد زیادی نمایانگر برجسته‌ترین اقدام حقوقی است که از طرف یک نوازنده - در این مورد، مسلماً مشهورترین هنرمند ضبط تمام دوران است. این پرونده توسط واحدی از Authentic Brands Group، غول صدور مجوز که تا حد زیادی حقوق مالکیت معنوی الویس، از جمله بسیاری از کاتالوگ آهنگ های او، علائم تجاری برند و حقوق نام، تصویر و شباهت او را کنترل می کند، تشکیل شده است. این توسط نهادهای مختلف دیگری که حقوق الویس را در اختیار دارند، بایگانی شده است. مانند سایر شرکت‌های هوش مصنوعی، آنتروپیک در حال", "image_url": "https://www.billboard.com/wp-content/uploads/2024/05/elvis-presley-tour-1972-billboard-1548.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["هوش مصنوعی", "Anthropic", "موسیقی"], "datetime_fa": "۲ آبان • ۱۸:۰۴"}, {"source": "Billboard", "title": "Maluma Opens Up About Therapy and Finding Balance at Billboard Latin Music Week & More Uplifting Moments", "link": "https://www.billboard.com/music/latin/maluma-betterhelp-latin-music-week-2026-uplifting-moments-1236367482/", "summary": "From career milestones to new music releases to major announcements and those little important moments, Billboard editors highlight uplifting moments in Latin music. Here’s what happened in the Latin music world this week. Maluma on Mental Health, Fatherhood and Learning to Love Discomfort Maluma spoke candidly about therapy, anxiety, fatherhood and the challenge of balancing family life with a demanding career during the “Like Minded” conversation at Billboard Latin Music Week on Wednesday (Oct. 21). Moderated by Billboard ’s co-chief content officer Leila Cobo, the BetterHelp-presented session also featured bilingual therapist Patricia Arrieta. The conversation came shortly after the birth of Maluma’s second child, Orion, whom he said has brought him a new sense of calm and clarity. “I’ve finally been able to find that balance between my personal life and my artistic career,” he said. The Colombian star described therapy as an ongoing practice rather than a quick fix. “For     let currentTab = 'persian';
    let searchQuery = '';
    let readArticles = new Set(JSON.parse(localStorage.getItem('read_articles_registry') || '[]'));

    function toFaDigits(n) {
      const f = ['۰','۱','۲','۳','۴','۵','۶','۷','۸','۹'];
      return n.toString().replace(/\d/g, d => f[d]);
    }

    function toggleRead(hash) {
      if (readArticles.has(hash)) {
        readArticles.delete(hash);
      } else {
        readArticles.add(hash);
      }
      localStorage.setItem('read_articles_registry', JSON.stringify(Array.from(readArticles)));
      renderNews();
    }

    function renderNews() {
      const container = document.getElementById('newsContainer');
      const rawItems = data[currentTab] || [];
      
      const filtered = rawItems.filter(item => {
        if (!searchQuery) return true;
        const q = searchQuery.toLowerCase();
        const title = (item.title_fa || item.title || '').toLowerCase();
        const summary = (item.summary_fa || item.summary || '').toLowerCase();
        const source = (item.source || '').toLowerCase();
        const category = (item.category || '').toLowerCase();
        const tags = (item.tags || []).join(' ').toLowerCase();
        return title.includes(q) || summary.includes(q) || source.includes(q) || category.includes(q) || tags.includes(q);
      });

      const unreadList = [];
      const readList = [];

      filtered.forEach(item => {
        if (readArticles.has(item.hash)) {
          readList.push(item);
        } else {
          unreadList.push(item);
        }
      });

      const sortedItems = [...unreadList, ...readList];

      if (sortedItems.length === 0) {
        container.innerHTML = '<div style="text-align:center; padding: 40px; color: var(--text-muted);">هیچ خبری در این بخش در ۲۴ ساعت گذشته ثبت نشده است.</div>';
        return;
      }

      container.innerHTML = sortedItems.map((item, idx) => {
        const title = item.title_fa || item.title || '';
        const summary = item.summary_fa || item.summary || '';
        const source = item.source || 'منبع خبر';
        const link = item.link || '#';
        const isRead = readArticles.has(item.hash);
        const num = toFaDigits(idx + 1);
        const category = item.category || '';
        const tags = item.tags || [];
        const datetimeFa = item.datetime_fa || '';

        return `
          <article class="news-card ${isRead ? 'is-read' : ''}" id="card-${item.hash}">
            <div class="news-header">
              <span class="news-num">${isRead ? '✓' : num}</span>
              <h2 class="news-title">${title}</h2>
            </div>
            ${summary ? `<p class="news-summary">${summary}</p>` : ''}
            <div class="news-footer">
              <div class="footer-top-row">
                <div class="meta-group">
                  <span class="news-source">📌 ${source}</span>
                  ${datetimeFa ? `<span class="news-datetime">🕒 ${datetimeFa}</span>` : ''}
                  ${category ? `<span class="news-category-badge" onclick="filterByTag('${category}')">📂 ${category}</span>` : ''}
                </div>
              </div>
              ${tags && tags.length > 0 ? `
                <div class="footer-tags-row">
                  ${tags.map(t => `<span class="news-tag-chip" onclick="filterByTag('${t}')">#${t}</span>`).join('')}
                </div>
              ` : ''}
              <div class="footer-bottom-row">
                <div class="footer-actions-right">
                  <button class="btn-mark-read" onclick="toggleRead('${item.hash}')">
                    ${isRead ? '✓ خوانده شد' : '○ علامت خوانده‌شده'}
                  </button>
                </div>
                <div class="footer-actions-left">
                  ${link && link.startsWith('http') ? `<a href="${link}" target="_blank" rel="noopener noreferrer" class="news-link">مطالعه اصل خبر ↗</a>` : ''}
                </div>
              </div>
            </div>
          </article>
        `;
      }).join('');
    }

    function filterByTag(val) {
      const searchInput = document.getElementById('searchInput');
      if (searchInput) {
        searchInput.value = val;
        searchQuery = val;
        renderNews();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    }

    function switchTab(tab, el) {
      currentTab = tab;
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      if (el) el.classList.add('active');
      renderNews();
    }

    function toggleTheme() {
      const html = document.documentElement;
      const current = html.getAttribute('data-theme') || 'dark';
      const next = current === 'dark' ? 'light' : 'dark';
      html.setAttribute('data-theme', next);
      localStorage.setItem('theme', next);
      updateThemeButton(next);
    }

    function updateThemeButton(theme) {
      const icon = document.getElementById('themeIcon');
      const text = document.getElementById('themeText');
      if (theme === 'dark') {
        icon.textContent = '☀️';
        text.textContent = 'حالت روشن';
      } else {
        icon.textContent = '🌙';
        text.textContent = 'حالت تاریک';
      }
    }

    function toggleArchiveModal(show) {
      const modal = document.getElementById('archiveModal');
      if (show) {
        renderArchiveList();
        modal.classList.add('active');
      } else {
        modal.classList.remove('active');
      }
    }

    function renderArchiveList() {
      const listContainer = document.getElementById('archiveListContainer');
      if (!archiveManifest || archiveManifest.length === 0) {
        listContainer.innerHTML = '<div style="text-align:center; padding: 20px; color: var(--text-muted);">هنوز شماره قبلی ثبت نشده است.</div>';
        return;
      }

      listContainer.innerHTML = archiveManifest.map(item => `
        <a href="${item.url}" class="archive-item">
          <div>
            <div class="archive-date-fa">📰 شماره ${item.p_date}</div>
            <div class="archive-date-g">🌍 ${item.g_date}</div>
          </div>
          <span class="archive-arrow">←</span>
        </a>
      `).join('');
    }

    const savedTheme = localStorage.getItem('theme') || 'dark';
    document.documentElement.setAttribute('data-theme', savedTheme);
    updateThemeButton(savedTheme);

    document.getElementById('searchInput').addEventListener('input', (e) => {
      searchQuery = e.target.value.trim();
      renderNews();
    });

    renderNews();
  </script>
