e_fa": "بازداشت یک کودک ۱۳ساله توسط نیروهای سازمان اطلاعات سپاه در اهواز", "summary_fa": "سازمان حقوق بشر کارون، گزارش داد نیروهای سازمان اطلاعات سپاه پاسداران روز پنجشنبه ۱۹ شهریور با یورش به روستای «عبوده» در اهواز، علی چلداوی، کودک ۱۳ ساله و دانش‌آموز پایه ششم ابتدایی، و پدرش مصطفی چلداوی را بازداشت کردند. بر اساس گزارش کارون، در این عملیات دست‌کم ۱۲ شهروند عرب سنی‌مذهب به دلایل عقیدتی بازداشت و به مکان نامعلوم منتقل شده‌اند. سازمان حقوق بشر کارون نوشته است این بازداشت‌ها در چارچوب مجموعه‌ای از بازداشت‌های گروهی در مسیر حمیدیه به اهواز انجام شده و بیشتر بازداشت‌شدگان هنگام ورود نیروهای امنیتی به خانه مصطفی چلداوی به عنوان مهمان در آنجا حضور داشتند. هویت ۱۲ بازداشت‌شده که توسط سازمان حقوق بشر کارون احراز شده، علی چلداوی، مصطفی چلداوی، کمال بترانی، لقمان بترانی، هادی بیت‌شیخ‌احمد معروف به ابوکمال، رضا سواری، خالد غُرباوی، جعفر چلداوی، ابراهیم حمدانی، عباس حیدری، امیر جادری و یک شهروند دیگر به نام علی چلداوی اعلام شده است. بر اساس اطلاعات جدید، برخی از بازداشت‌شدگان به زندان شیبان اهواز منتقل شده‌اند، اما از محل نگهداری و وضعیت سایر افراد اطلاعی در دست نیست. کارون همچنین از ادامه بررسی برای شناسایی سایر افراد احتمالی بازداشت‌شده خبر داده است. با گذشت چند روز از این بازداشت‌ها، خانواده‌های بازداشت‌شدگان همچنان از وضعیت و محل نگهداری آنان بی‌اطلاع هستند. سازمان حقوق بشر کارون با اشاره ویژه به بازداشت علی چلداوی، خواستار اعلام فوری محل نگهداری بازداشت‌شدگان، تضمین سلامت آنان، دسترسی به خانواده و وکیل مستقل و آزادی این کودک ۱۳ ساله شده است. در این بخش ایران وایر می‌توانید با مسوولان تماس بگیرید و کارزار خود را برای مشکلات مختلف راه‌اندازی کنید"}, {"source": "IranWire", "title": "لاله مرزبان، جایزه بهترین بازیگر بخش افق‌های جشنواره ونیز را دریافت کرد", "link": "https://iranwire.com/fa/news-1/157517-%D9%84%D8%A7%D9%84%D9%87-%D9%85%D8%B1%D8%B2%D8%A8%D8%A7%D9%86-%D8%AC%D8%A7%DB%8C%D8%B2%D9%87-%D8%A8%D9%87%D8%AA%D8%B1%DB%8C%D9%86-%D8%A8%D8%A7%D8%B2%DB%8C%DA%AF%D8%B1-%D8%A8%D8%AE%D8%B4-%D8%A7%D9%81%D9%82%D9%87%D8%A7%DB%8C-%D8%AC%D8%B4%D9%86%D9%88%D8%A7%D8%B1%D9%87-%D9%88%D9%8 ومانیوک، فرماندار این منطقه، گفت نیروهای روسیه حمله‌ای گسترده را آغاز کردند که بیش از چهار ساعت ادامه داشت و بیش از ۱۰ پهپاد وارد حریم هوایی منطقه شدند. در شهر لوتسک نیز بقایای یکی از پهپادها به قطاری که پیشتر تخلیه شده بود برخورد کرد و باعث آتش‌سوزی شد. فرماندار منطقه گفت در این حادثه کسی زخمی نشده است. در همین حال، مقام‌های روسیه اعلام کردند حمله پهپادی اوکراین به یک تاسیسات صنعتی در شهر نیژنکامسک در جمهوری تاتارستان روسیه باعث آتش‌سوزی شد و دو کشته و ۱۲ زخمی بر جا گذاشت."}, {"source": "Euronews Persian", "title": "پرچم‌های اتحادیه اروپا در شب پایانی پرامز از پرچم بریتانیا بیشتر شد", "link": "https://parsi.euronews.com/my-europe/2026/09/13/brexit-10-years-eu-flags-last-night-proms-uk-eu-relations", "summary": "ده سال پس از همه‌پرسی تاریخی برگسیت، تصمیم بریتانیا برای خروج از اتحادیه اروپا همچنان یکی از موضوعات بحث‌برانگیز این کشور است.", "date_str": "2026-09-13T10:59:06+00:00", "hash": "f1e9808ac33ebb95", "title_fa": "پرچم‌های اتحادیه اروپا در شب پایانی پرامز از پرچم بریتانیا بیشتر شد", "summary_fa": "همرسانی نظرها یورونیوز را در گوگل دنبال کنید همرسانی Facebook Twitter Flipboard Send Balatarin Messenger Bluesky Telegram Threads Whatsapp ده سال پس از همه‌پرسی تاریخی برگسیت، تصمیم بریتانیا برای خروج از اتحادیه اروپا همچنان یکی از موضوعات بحث‌برانگیز این کشور است. در بخش‌هایی از مراسم «شب پایانی پرامز» شبکه بی‌بی‌سی در شامگاه شنبه، به نظر می‌رسید شمار پرچم‌های اتحادیه اروپا از پرچم‌های بریتانیا بیشتر شده است؛ موضوعی که بار دیگر رابطه لندن و بروکسل را به مرکز توجه آورد. تصاویر منتشرشده از این مراسم، که بخشی از جشنواره موسیقی کلاسیک تابستانی لندن است، جمعیت حاضر در رویال آلبرت هال را در میان انبوهی از پرچم‌های آبی و طلایی اتحادیه اروپا نشان می‌دهد. ستاره‌های طلایی پرچم اتحادیه اروپا در جریان اجرای قطعاتی مانند «سرزمین امید و افتخار» (Land of Hope and Glory) به‌ویژه به چشم می‌آمد. تصاویر داخل سالن همچنین نشان می‌دهد که پرچم اتحادیه اروپا از برخی بالکن‌های ساختمان آویخته شده بود. انتشار این تصاویر با واکنش منفی شماری از چهره‌های جناح راست بریتانیا روبه‌رو شد. اندرو روزین  در سال‌های اخیر به دلیل فعالیت گروه‌های مسلح باج‌گیر با موجی از آدم‌ربایی‌ها مواجه بوده است.", "date_str": "2026-09-13T08:47:39+00:00", "hash": "cba285d34bc3c34e", "title_fa": "افراد مسلح شش امام جماعت را از یک گردهمایی مذهبی در شمال نیجریه ربودند", "summary_fa": "همرسانی نظرها یورونیوز را در گوگل دنبال کنید همرسانی Facebook Twitter Flipboard Send Balatarin Messenger Bluesky Telegram Threads Whatsapp پلیس نیجریه روز یکشنبه اعلام کرد افراد مسلح شش امام جماعت را در یکی از ایالت‌های شمالی این کشور ربوده‌اند؛ منطقه‌ای که در سال‌های اخیر به دلیل فعالیت گروه‌های مسلح باج‌گیر با موجی از آدم‌ربایی‌ها مواجه بوده است. آدم‌ربایی به یکی از منابع مهم درآمد برای بسیاری از گروه‌های مسلح در نیجریه تبدیل شده است؛ از گروه‌های جهادی گرفته تا باندهای تبهکار فاقد گرایش ایدئولوژیک که در این کشور به‌طور محلی «راهزن» نامیده می‌شوند. پلیس ایالت زامفارا در شمال‌شرق نیجریه اعلام کرد روز شنبه «گروهی از راهزنان مسلح که گفته می‌شود سلاح‌های پیشرفته در اختیار داشتند، در مسیر فرعی داکو–دامری کمین کرده و خودروی حامل قربانیان را متوقف کردند.» در بیانیه پلیس آمده است: «هر شش قربانی که همگی امام جماعت بودند، ظاهراً در حال سفر به تالاطا مافارا بودند که توسط مهاجمان مسلح متوقف و ربوده شدند.» رسانه‌های نیجریه گزارش دادند این امامان قرار بود مهمان عبدالعزیز ابوبکر یاری، سناتور نیجریه‌ای، باشند. یاری، فرماندار پیشین ایالت زامفارا، در حال برگزاری یک گردهمایی مذهبی در خانه خود در تالاطا مافارا بود و گفته می‌شود قصد دارد از این طریق برای به چالش کشیدن تلاش بولa تینوبو، رئیس‌جمهوری نیجریه، برای انتخاب مجدد در ماه ژانویه آماده شود. پلیس زامفارا اعلام کرد: «تیم‌های امنیتی عملیات جست‌وجوی گسترده‌ای را آغاز کرده‌اند و بوته‌زارهای اطراف به‌طور کامل مورد جست‌وجو قرار گرفته‌اند تا قربانیان شناسایی و نجات داده شوند و عاملان این حادثه نیز دستگیر شوند.» بر اساس گزارشی که شرکت مشاوره نیجریه‌ای SBM Intelligence در ماه اوت منتشر کرد، طی یک سال گذشته نزدیک به ۶ میلیون دلار باج در نیجریه پرداخت شده است."}, {"source": "Euronews Persian", "title": "حمله به کشتی تجاری ایرانی در نزدیکی قشم «یک کشته و سه زخمی» برجای گذاشت", "link": "https://parsi.euronews.com/2026/09/13/tensions-in-the-strait-of-hormuz-attack-on-an-iranian-vessel-qeshm", "summary": "یک کشتی تجاری ایرانی بامداد یکشنبه در آب‌های نزدیک جزیره قشم هدف قرار گرفت؛ حمله‌ای که به گفته مقام‌های محلی یک کشته و سه زخمی بر جا گذاشته است.", "date_str": "2026-09-13T07:48:37+00:00", "hash": "46e2c6ff9927080a", "title_fa": "حمله به کشتی تجاری ایرانی در نزدیکی قشم «یک کشته و سه زخمی» برجای گذاشت", "summary_fa": "همرسانی نظرها یورونیوز را در گوگل دنبال کنید همرسانی Facebook Twitter Flipboard Send Balatarin Messenger Bluesky Telegram Threads Whatsapp یک کشتی تجاری ایرانی بامداد یکشنبه در آب‌های نزدیک جزیره قشم هدف قرار گرفت؛ حمله‌ای که به گفته مقام‌های محلی یک کشته و سه زخمی بر جا گذاشته است. حسین امیرتیموری، فرماندار قشم، به خبرگزاری مهر گفت که این کشتی حدود ساعت پنج صبح یکشنبه در محدوده جزیره هنگام و ساحل شیب‌دراز مورد اصابت قرار گرفته است. هنوز درباره نوع پرتابه، میزان خسارت واردشده به کشتی یا عامل حمله اطلاعاتی منتشر نشده است. رسانه‌های دولتی ایران نیز خبر حمله و آمار تلفات را تایید کرده‌اند. همزمان، مرکز عملیات تجارت دریایی بریتانیا، UKMTO، اعلام کرد گزارشی درباره اصابت یک پرتابه به یک شناور در حال عبور از تنگه هرمز دریافت کرده است. هنوز روشن نیست این گزارش به همان کشتی ایرانی مربوط می‌شود یا حادثه‌ای جداگانه بوده است. این حمله در ادامه افزایش درگیری‌های دریایی در اطراف تنگه هرمز رخ داده است. چند روز پیش ایران اعلام کرد در واکنش به حملات آمریکا به پنج نفتکش ایرانی، ۱۰ کشتی را در نزدیکی هرمز هدف قرار داده است؛ گسترده‌ترین دور حملات متقابل به کشتیرانی از زمان آغاز جنگ شش‌ماهه ایران و آمریکا. تردد تجاری از تنگه هرمز همچنان بسیار پایین‌تر از دوران پیش از جنگ است و حملات اخیر بار دیگر نگرانی درباره امنیت یکی از مهم‌ترین مسیرهای انتقال نفت و گاز جهان را افزایش داده است. از زمان توافق ماه ژوئن که تنها چند هفته دوام آورد، هیچ مذاکره‌ای میان آمریکا و ایران برای پایان دادن به جنگ انجام نشده است. ابراهیم عزیزی، رئیس کمیسیون امنیت ملی مجلس ایران، روز شنبه در شبکه اجتماعی ایکس نوشت: «تا زمانی که طرف آمریکایی همه شروط ایران را نپذیرد، گفتگو و مذاکره فایده‌ای ندارد.»"}, {"source": "Euronews Persian", "title": "سلین دیون با کنسرتی احساسی در پاریس به صحنه‌ها بازمی‌گردد", "link": "https://parsi.euronews.com/culture/2026/09/13/celine-dion-returns-to-the-stage-with-emotional-paris-comeback-show", "summary": "دیون در برابر تماشاگران فرانسوی اشک ریخت و کنسرتی خاطره‌انگیز اجرا کرد که در آن برخی از بزرگ‌ترین ترانه‌هایش را به انگلیسی و فرانسوی خواند.", "date_str": "2026-09-13T07:46:00+00:00", "hash": "808ad549ce29b67c", "title_fa": "سلین دیون با کنسرتی احساسی در پاریس به صحنه‌ها بازمی‌گردد", "summary_fa": "همرسانی نظرها یورونیوز را در گوگل دنبال کنید همرسانی Facebook Twitter Flipboard Send Balatarin Messenger Bluesky Telegram Threads Whatsapp دیون در برابر تماشاگران فرانسوی اشک ریخت و کنسرتی خاطره‌انگیز اجرا کرد که در آن برخی از بزرگ‌ترین ترانه‌هایش را به انگلیسی و فرانسوی خواند. سلین دیون روز شنبه دوباره در پاریس روی صحنه رفت؛ کنسرتی بسیار مورد انتظار که نخستین اجرای کامل او در شش سال گذشته بود. این خواننده کانادایی که در سال ۲۰۲۲ اعلام کرده بود به یک بیماری نادر عصبی به نام سندرم فرد خشک مبتلا شده است، هنگام ورود به صحنه در برابر ۳۰ هزار هوادار در سالن پلنی‌تیود آرنا، در مجموعه لا دفانس در حومه غربی پایتخت فرانسه، تا حد اشک احساساتی شد. او به حضار گفت: «راه دشوار بود، سفر بیشتر از آنچه انتظار می‌رفت طول کشید.» او افزود: «اما خودم را کشیده‌شده به یک رشته نور ضعیف در دوردست، آنجا وسط کوه‌ها دیدم. امشب می‌خواهم برای شما بخوانم، برای خودم بخوانم، برای زندگی بخوانم.» او این سخنان را در میان تشویق‌ها بیان کرد. دیون سپس برخی از مشهورترین و نمادین‌ترین ترانه‌هایش از جمله «My Heart Will Go On» و «Because You Loved Me» را اجرا کرد و با تحسین هواداران و منتقدان روبه‌رو شد. اجرای شنبه که گفته می‌شود با حضور میشل اوباما، بانوی اول پیشین آمریکا، و شماری از مسئولان سیاسی فرانسه همراه بود، نخستین کنسرت از مجموعه ۲۶ شبی (۱۶ اجرا در سپتامبر و اکتبر و ۱۰ اجرا در ماه مه) در سالن پلنی‌تیود آرنا است؛ سالنی که پیش‌تر با نام لا دفانس آرنا شناخته می‌شد. مارک کارنی، نخست‌وزیر کانادا، دیون را به خاطر آنچه «بازگشتی باورنکردنی به صحنه پس از شش سال طولانی» توصیف کرد، تبریک گفت. او در پیامی در شبکه‌های اجتماعی نوشت: «همه چیز در حال بازگشت است.»"}, {"source": "Euronews Persian", "title": "حمله به خط لوله عربستان؛ عراق گذرگاه‌های مرزی با ایران را بازگشایی می‌کند", "link": "https://parsi.euronews.com/2026/09/13/iraq-reopen-iran-border-crossings-drone-attack-saudi-pipeline", "summary": "مقام‌های عراقی اعلام کردند سه گذرگاه مرزی این کشور با ایران را که در پی حمله پهپادی به یک خط لوله نفت عربستان تعطیل شده بود از روز یکشنبه به‌تدریج بازگشایی خواهند شد.", "date_str": "2026-09-13T07:44:36+00:00", "hash": "10fb22969e0aa188", "title_fa": "حمله به خط لوله عربستان؛ عراق گذرگاه‌های مرزی با ایران را بازگشایی می‌کند", "summary_fa": "همرسانی نظرها یورونیوز را در گوگل دنبال کنید همرسانی Facebook Twitter Flipboard Send Balatarin Messenger Bluesky Telegram Threads Whatsapp لینک کپی پیست کد امبد ویدیو: لینک کپی شد! مقام‌های عراقی اعلام کردند سه گذرگاه مرزی این کشور با ایران را که در پی حمله پهپادی به یک خط لوله نفت عربستان تعطیل شده بود از روز یکشنبه به‌تدریج بازگشایی خواهند شد. این حمله شامگاه جمعه از خاک عراق به خط لوله عربستان که نفت را از مناطق شرقی این کشور به سواحل دریای سرخ منتقل می‌کند انجام شد. مقام‌های عراقی پس از بررسی محل شلیک پهپادها، اعلام کردند این حمله از استان میسان در نزدیکی مرز ایران انجام شده است. در پی این حمله، دولت عراق فرمانده نظامی استان میسان را برکنار کرد و سپس سه گذرگاه مرزی با ایران را به‌منظور بازسازمان‌دهی فعالیت‌ها و تقویت اقدامات اطلاعاتی برای جلوگیری از نقض امنیتی بست. دو منبع امنیتی عراقی روز شنبه به خبرگزاری فرانسه گفتند تجهیزات پرتاب پهپاد در نزدیکی در استان میسان پیدا شده است. مرکز اطلاع‌رسانی امنیتی دولت عراق روز یکشنبه اعلام کرد پس از بررسی روند فعالیت در گذرگاه‌های مرزی، بازگشایی آنها برای مسافران و فعالیت‌های تجاری به‌صورت مرحله‌ای و از روز یکشنبه تا پنجشنبه انجام خواهد شد. سه گذرگاه موردنظر عبارت‌اند از شلمچه در استان بصره، الشیب در استان میسان و مندلی در استان دیاله. بر اساس اعلام مرکز اطلاع‌رسانی دولت عراق، گذرگاه‌های شلمچه و الشیب روز یکشنبه برای تردد مسافران بازگشایی شدند، اما فعالیت‌های تجاری در آنها همچنان متوقف است."}, {"source": "Euronews Persian", "title": "عملیات تجارت دریایی بریتانیا: یک کشتی در تنگه هرمز مورد اصابت «پرتابه‌ ناشناس» قرار گرفت", "link": "https://parsi.euronews.com/2026/09/13/ukmto-reports-vessel-struck-by-unknown-projectile-strait-of-hormuz-sep-2026", "summary": "سازمان عملیات تجارت دریایی بریتانیا شامگاه شنبه اعلام کرد که گزارشی مبنی بر اصابت یک «پرتابه ناشناس» به یک کشتی هنگام عبور از تنگه هرمز دریافت کرده است. این حادثه یک روز پس از آن رخ داد که عربستان از تعطیلی خط لوله انتقال نفت خود در پی حملات پهپادی خبر داد.", "date_str": "2026-09-13T05:17:49+00:00", "hash": "12e5fc7170bc7413", "title_fa": "عملیات تجارت دریایی بریتانیا: یک کشتی در تنگه هرمز مورد اصابت «پرتابه‌ ناشناس» قرار گرفت", "summary_fa": "همرسانی نظرها یورونیوز را در گوگل دنبال کنید همرسانی Facebook Twitter Flipboard Send Balatarin Messenger Bluesky Telegram Threads Whatsapp سازمان عملیات تجارت دریایی بریتانیا شامگاه شنبه اعلام کرد که گزارشی مبنی بر اصابت یک «پرتابه ناشناس» به یک کشتی هنگام عبور از تنگه هرمز دریافت کرده است. این حادثه یک روز پس از آن رخ داد که عربستان از تعطیلی خط لوله انتقال نفت خود در پی حملات پهپادی خبر داد. سازمان عملیات تجارت دریایی بریتانیا اعلام کرد: «یک شناور هنگام عبور از تنگه هرمز مورد اصابت یک پرتابه ناشناس قرار گرفت. وضعیت خدمه، ارزیابی خسارات و تاثیرات محیط زیستی تاکنون نامشخص است.» این در حالی است که وزارت انرژی عربستان سعودی روز جمعه اعلام کرد که خط لوله شرق به غرب این کشور هدف حمله قرار گرفته و به‌عنوان «اقدام احتیاطی» تعطیل شده است. این خط لوله هزار و ۲۰۰ کیلومتری که از شرق به غرب شبه‌جزیره عربستان عبور می‌کند، طی شش ماه گذشته و در شرایطی که تنگه هرمز عمدتا به‌دلیل جنگ بسته بوده، به مسیر اصلی انتقال نفت خاورمیانه به بازارهای جهانی تبدیل شده است. بغداد و ریاض اعلام کردند که این حمله از خاک عراق، جایی که شبه‌نظامیان مورد حمایت جمهوری اسلامی فعالیت می‌کنند، انجام شده است. به گزارش رویترز، وقوع این دو حادثه نگرانی‌ها درباره تهدیدهای مرتبط با ایران علیه عرضه انرژی را افزایش داده است. در پی حملات روز جمعه، بهای نفت بیش از پیش افزایش گل دنبال کنید همرسانی Facebook Twitter Flipboard Send Balatarin Messenger Bluesky Telegram Threads Whatsapp درگیری‌هایی که سال‌ها متوقف مانده بود، صبح پنجشنبه با پیشروی حوثی‌ها به سوی شهر بندری «مخا» در غرب یمن دوباره شعله‌ور شد. اما تنها ۳۶ ساعت بعد، این شبه‌نظامیان مورد حمایت ایران علاوه بر این شهر، کنترل جزیره راهبردی «پریم» را نیز در اختیار گرفتند و عملا تسلط خود بر باب‌المندب را تثبیت کردند. سی‌ان‌ان در گزارشی، تصویری مرحله‌به‌مرحله از این پیشروی برق‌آسا ارائه داده است. بنابر این گزارش، به‌رغم درخواست‌های پی‌درپی فرماندهان نیروهای دولتی یمن، خبری از پشتیبانی متحد اصلی‌شان، یعنی عربستان سعودی، نبود. بنابر این گزارش، فرماندهان یمنی از صبح پنجشنبه به‌صورت مکرر خواستار پشتیبانی هوایی شدند. هم‌زمان، پیشروی حوثی‌ها به‌سوی شهر بندری و راهبردی «مخا» با تمام قوا ادامه داشت. یک منبع ارشد یمنی مرتبط با نیروهای نظامی این کشور به سی‌ان‌ان گفت: «حوثی‌ها هرچه در اختیار داشتند وارد میدان کردند؛ موج پشت موج نیروهای شبه‌نظامی، به‌همراه موشک‌های بالستیک و دیگر تسلیحاتشان.» به گفته این منبع، او با فرماندهی مرکزی ایالات متحده آمریکا (سنتکام) تماس گرفت و به او اطمینان داده شد که آمریکا «اوضاع را از نزدیک زیر نظر دارد و پشتیبانی هوایی عربستان سعودی در راه است.» این منبع گفت: «اما پشتیبانی هوایی هرگز از راه نرسید و اکنون مخا سقوط کرده است.» چند ساعت بعد، در روز جمعه، حوثی‌ها یک موقعیت مهم ساحلی دیگر، یعنی جزیره پریم، را در ورودی دریای سرخ تصرف کردند. این جزیره تنگه باب‌المندب را به دو بخش تقسیم می‌کند و در عمل کنترل یک مسیر کلیدی دیگر کشتیرانی را در اختیار تهران قرار می‌دهد."}, {"source": "Euronews Persian", "title": "«زن ناشناس» برنده شیر طلایی جشنواره فیلم ونیز شد و «نازا» جایزه ویژه هیات داوران گرفت", "link": "https://parsi.euronews.com/culture/2026/09/12/venice-film-festival-2026-woman-unknown-by-may-el-toukhy-wins-the-golden-lion", "summary": "درام التوقهی زندگی پرستار و خدمتکار جوانی را روایت می‌کند که با کارفرمای ثروتمند و سالخورده بیوه‌اش ازدواج می‌کند اما راز شرم آوری دارد که در هرج‌ومرج پس از جنگ جهانی دوم می‌تواند زندگی و موقعیت تازه‌اش را از هم بپاشد.", "date_str": "2026-09-12T19:04:55+00:00", "hash": "9d009541ef562160", "title_fa": "«زن ناشناس» برنده شیر طلایی جشنواره فیلم ونیز شد و «نازا» جایزه ویژه هیات داوران گرفت", "summary_fa": "همرسانی نظرها یورونیوز را در گوگل دنبال کنید همرسانی Facebook Twitter Flipboard Send Balatarin Messenger Bluesky Telegram Threads Whatsapp درام التوقهی زندگی پرستار و خدمتکار جوانی را روایت می‌کند که با کارفرمای ثروتمند و سالخورده بیوه‌اش ازدواج می‌کند اما راز شرم آوری دارد که در هرج‌ومرج پس از جنگ جهانی دوم می‌تواند زندگی و موقعیت تازه‌اش را از هم بپاشد. فیلم درام «زن ناشناس» درباره دانمارک در دوران پس از اشغال نازی که می ال‌توخی آن را کارگردانی کرده، روز شنبه در هشتاد و سومین دوره جشنواره فیلم ونیز جایزه معتبر شیر طلایی را از آن خود کرد. می ال‌توخی تنها زنی بود که امسال به‌تنهایی کارگردان یک فیلم در بخش مسابقه اصلی جشنواره بود. داستان فیلم او حول محور دختری جوان به نام ماری می‌چرخد که ماتیلد آرسل نقش او را بازی می‌کند؛ دریافت جایزه بهترین بازیگر زن توسط او این فیلم را به یک پیروزی دوگانه کم‌سابقه تبدیل کرد. ماری پرستار کودک و خدمتکار خانه‌ای است که در روزهای بلافاصله پس از پایان جنگ قرار است با کارفرمای ثروتمندش ازدواج کند. اما او رابطه عاشقانه پنهانی گذشته با یک سرباز آلمانی را در دل دارد؛ رازی که شهرتش را تهدید می‌کند و ممکن است همه چیز را زیر و رو کند. پرتره شاعرانه لی چانگ‌دونگ، فیلمساز صاحب‌سبک کره‌جنوبی، از طبقه و کار با عنوان «عشق ممکن» موفق به دریافت جایزه شیر نقره‌ای هیات داوران، به‌عنوان جایزه دوم جشنواره شد. «عشق ممکن» نخستین فیلم لی در هشت سال گذشته است و پس از اثر تحسین‌شده او در سال ۲۰۱۸ با عنوان «سوختن» ساخته شده است. مستند تکان‌دهنده «نازا» درباره راهبردهای نظامی به‌کاررفته در جنگ غزه، ساخته فیلمسازان اسرائیلی یووال آبراهام و راشل زور، جایزه ویژه هیات داوران را دریافت کرد. آبراهام گفت: «برای ما واقعا، واقعا به‌طور خاص مهم است که اسرائیلی‌ها این فیلم را ببینند.»"}, {"source": "Euronews Persian", "title": "«اتحاد ایرلند»، جزر و مد در فالکند؛ چطور ترامپ خشم بریتانیایی‌ها را برمی‌انگیزد", "link": "https://parsi.euronews.com/2026/09/12/trump-irish-unification-northern-ireland-britain", "summary": "دونالد ترامپ، رئیس جمهوری آمریکا روز شنبه در اظهاراتی درباره یکی از موضوعات حساس و مناقشه‌برانگیز سیاسی در ایرلند، از ایده اتحاد جمهوری ایرلند با ایرلند شمالی حمایت کرد و گفت که تحقق چنین اتحادی «فوق‌العاده» خواهد بود.", "date_str": "2026-09-12T17:21:50+00:00", "hash": "a491db48c6e09a3f", "title_fa": "«اتحاد ایرلند»، جزر و مد در فالکند؛ چطور ترامپ خشم بریتانیایی‌ها را برمی‌انگیزد", "summary_fa": "همرسانی نظرها یورونیوز را در گوگل دنبال کنید همرسانی Facebook Twitter Flipboard Send Balatarin Messenger Bluesky Telegram Threads Whatsapp دونالد ترامپ، رئیس جمهوری آمریکا روز شنبه در اظهاراتی درباره یکی از موضوعات حساس و مناقشه‌برانگیز سیاسی در ایرلند، از ایده اتحاد جمهوری ایرلند با ایرلند شمالی حمایت کرد و گفت که تحقق چنین اتحادی «فوق‌العاده» خواهد بود. آقای ترامپ در دیدار با میهال مارتین، نخست‌وزیر ایرلند در دوبلین، در پاسخ به پرسشی درباره اتحاد ایرلند گفت: «نمی‌خواهم مشکلی ایجاد کنم، اما دوست دارم ایرلند متحد شود. بالاخره این اتفاق خواهد افتاد؛ پس چه بهتر که همین حالا رخ دهد.» او افزود: «فکر می‌کنم اتفاق فوق‌العاده‌ای خواهد بود»، هرچند تأکید کرد که «بدیهی است بریتانیا نیز در این باره حرفی برای گفتن خواهد داشت.» آقای ترامپ در ادامه سفر خود و در دیدار با فعالان اقتصادی دو کشور در اقامتگاه سفیر آمریکا در دوبلین، اذعان کرد که برای مسئله اتحاد ایرلند «پاسخ خوبی وجود ندارد». آینده ایرلند شمالی و اینکه این منطقه بخشی از بریتانیا باقی بماند یا به جمهوری ایرلند ملحق شود، از دهه‌ها پیش یکی از عمیق‌ترین شکاف‌های سیاسی در این جزیره بوده است. اختلاف میان ملی‌گرایان، که عمدتا کاتولیک هستند و خواهان اتحاد با جمهوری ایرلندند، و اتحادگرایان، که عمدتا پروتستان هستند و خواهان باقی ماندن ایرلند شمالی در بریتانیا هستند، به دهه‌ها درگیری موسوم به «دردسرها» انجامید. توافق صلح سال ۱۹۹۸ که آمریکا نقش مهمی در مذاکرات آن داشت، عمدتاً به خشونت‌ها پایان داد، اما وضعیت نهایی ایرلند شمالی را حل نکرد."}, {"source": "Euronews Persian", "title": "کپجمینی شرکت تابعه آمریکایی خود را به‌دلیل قرارداد با ICE می‌فروشد", "link": "https://parsi.euronews.com/business/2026/09/12/capgemini-sells-its-american-subsidiary-criticised-for-its-contract-with-ice", "summary": "شرکت کپ‌ژمینی گورنمنت سولوشنز برای پلیس مهاجرت آمریکا راه‌حل‌های فناورانه‌ای فراهم می‌کرد که امکان شناسایی و ردیابی اتباع خارجی را می‌داد.", "date_str": "2026-09-12T17:08:49+00:00", "hash": "81d943c3e330a993", "title_fa": "کپجمینی شرکت تابعه آمریکایی خود را به‌دلیل قرارداد با ICE می‌فروشد", "summary_fa": "همرسانی نظرها یورونیوز را در گوگل دنبال کنید همرسانی Facebook Twitter Flipboard Send Balatarin Messenger Bluesky Telegram Threads Whatsapp شرکت کپ‌ژمینی گورنمنت سولوشنز برای پلیس مهاجرت آمریکا راه‌حل‌های فناورانه‌ای فراهم می‌کرد که امکان شناسایی و ردیابی اتباع خارجی را می‌داد. شرکت فرانسوی کپ‌ژمینی، غول حوزه فناوری اطلاعات، روز شنبه اعلام کرد که برای واگذاری شعبه آمریکایی خود به توافق نهایی رسیده است؛ تصمیمی که پس از جنجال بر سر روابط این شرکت با ICE، پلیس مهاجرت دولت دونالد ترامپ، اتخاذ شد. کپ‌ژمینی در یک بیانیه (منبع به زبان فرانسوی) اعلام کرد که خریدار این شعبه ITC Federal است، «یک تامین‌کننده آمریکایی خدمات و راه‌حل‌های دیجیتال برای آژانس‌های فدرال مسئول امنیت داخلی و دفاع» . گروه کپ‌ژمینی توضیح داد: «این واگذاری مشمول شرایط مرسوم برای معاملات از این دست است و انتظار می‌رود در هفته‌های آینده نهایی شود» . این شرکت در پاسخ به پرسش یورونیوز درباره رقم معامله اعلام کرد که این اطلاعات را منتشر نمی‌کند. کپ‌ژمینی در ماه فوریه اعلام کرده بود قصد دارد شرکت Capgemini Government Solutions، شعبه آمریکایی خود را که در ارائه خدمات به آژانس‌های فدرال تخصص دارد، واگذار کند. این تصمیم پس از افشای یک قرارداد با ICE اتخاذ شد؛ قراردادی برای تامین ابزاری که هدف آن شناسایی شهروندان خارجی حاضر در خاک آمریکا و رصد رفت‌وآمدهای آنان است. کپ‌ژمینی آن زمان برای توجیه این همکاری توضیح داده بود: «محدودیت‌های قانونی معمول در ایالات متحده برای عقد قرارداد با نهادهای فدرالی که فعالیت‌های طبقه‌بندی‌شده انجام می‌دهند، به گروه اجازه نمی‌داد بر برخی جنبه‌های عملیات این زیرمجموعه کنترل کافی اعمال کند» ."}, {"source": "Euronews Persian", "title": "سازمان ملل: در کمتر از دو هفته ۷۰ هزار نفر در یمن آواره شدند", "link": "https://parsi.euronews.com/2026/09/12/at-least-76000-flee-fighting-in-yemen-since-july-un", "summary": "سازمان ملل متحد اعلام کرد که از ماه ژوئیه تاکنون دست‌کم ۷۶ هزار نفر در یمن بر اثر تشدید درگیری‌ها میان نیروهای دولتی و شورشیان حوثی مورد حمایت ایران، از خانه‌های خود آواره شده‌اند. شمار آوارگان تنها در هفته گذشته چهار برابر شده است.", "date_str": "2026-09-12T16:59:11+00:00", "hash": "970ed1b1f86a739e", "title_fa": "سازمان ملل: در کمتر از دو هفته ۷۰ هزار نفر در یمن آواره شدند", "summary_fa": "همرسانی نظرها یورونیوز را در گوگل دنبال کنید همرسانی Facebook Twitter Flipboard Send Balatarin Messenger Bluesky Telegram Threads Whatsapp سازمان ملل متحد اعلام کرد که از ماه ژوئیه تاکنون دست‌کم ۷۶ هزار نفر در یمن بر اثر تشدید درگیری‌ها میان نیروهای دولتی و شورشیان حوثی مورد حمایت ایران، از خانه‌های خود آواره شده‌اند. شمار آوارگان تنها در هفته گذشته چهار برابر شده است. سازمان بین‌المللی مهاجرت (IOM) وابسته به سازمان ملل در بیانیه‌ای هشدار داد که بحران آوارگی در یمن «با سرعتی نگران‌کننده و ساعتی در حال وخیم‌تر شدن است». حوثی‌ها که سال‌هاست بخش‌های گسترده‌ای از شمال یمن را در کنترل دارند، هفته گذشته حمله‌ای گسترده علیه نیروهای دولتی مورد حمایت عربستان سعودی آغاز کردند و در جریان درگیری‌هایی که صدها کشته بر جای گذاشته، به پیروزی‌های پی‌درپی دست یافته‌اند. سازمان بین‌المللی مهاجرت اعلام کرد از زمان اعلام محاصره دریایی عربستان سعودی از سوی حوثی‌ها در ماه ژوئیه، «دست‌کم ۷۶ هزار نفر خانه‌های خود را ترک کرده‌اند». این سازمان افزود شمار آوارگان چهار برابر آمار هفته گذشته شده است، زیرا درگیری‌ها شدت گرفته‌اند. سازمان بین‌المللی مهاجرت هشدار داد: «خانواده‌های کامل در حال جابه‌جایی هستند، اغلب در طول شب، در حالی که هیچ مکان امنی برای رفتن ندارند.» سخنگوی این سازمان به خبرگزاری فرانسه گفت بیش از ۷۰ هزار نفر از این افراد تنها از ابتدای ماه سپتامبر آواره شده‌اند. این آمار تنها یک روز پس از آن اعلام شد که سازمان بین‌المللی مهاجرت شمار موارد آوارگی از ابتدای ماه را ۴۶ هزار نفر اعلام کرده بود؛ رقمی که روز سه‌شنبه ۱۸ هزار و ۵۰۰ نفر اعلام شده بود."}, {"source": "Euronews Persian", "title": "داریو امودی مدیرعامل Anthropic خواهان کاهش سرعت توسعه هوش مصنوعی به‌دلیل خطرات ابرهوش است", "link": "https://parsi.euronews.com/my-europe/2026/09/12/anthropic-ceo-dario-amodei-calls-on-ai-companies-to-slow-down-ai-development-amid-superint", "summary": "اعلام آمودی چند روز پس از آن انجام شد که شرکت هوش مصنوعی فاش کرد از مدل‌هایش در حملات سایبری، کارزارهای تبلیغاتی و تحقیقات خطرناک زیستی استفاده می‌شود.", "date_str": "2026-09-12T16:25:55+00:00", "hash": "6ca8b65c42343775", "title_fa": "داریو امودی مدیرعامل Anthropic خواهان کاهش سرعت توسعه هوش مصنوعی به‌دلیل خطرات ابرهوش است", "summary_fa": "همرسانی نظرها یورونیوز را در گوگل دنبال کنید همرسانی Facebook Twitter Flipboard Send Balatarin Messenger Bluesky Telegram Threads Whatsapp اعلام آمودی چند روز پس از آن انجام شد که شرکت هوش مصنوعی فاش کرد از مدل‌هایش در حملات سایبری، کارزارهای تبلیغاتی و تحقیقات خطرناک زیستی استفاده می‌شود. داریا آمودی، مدیرعامل انتروپیک، روز شنبه از شرکت‌های فعال در حوزه هوش‌مصنوعی (AI) خواست روند توسعه این فناوری قدرتمند را کند کنند، همزمان با آنکه نگرانی‌ها از خطرات سامانه‌های رایانه‌ای «فراهوشمند» رو به افزایش است. فراهوشمندی مفهومی نظری است که در آن توانایی‌های هوش‌مصنوعی از هوش انسانی فراتر می‌رود. این اظهارات چند روز پس از آن مطرح شد که پژوهشگر هوش‌مصنوعی، جیکوب کاکسون، که از اوپن‌اِی‌آی جدا شده و به انتروپیک پیوسته بود، تصمیم گرفت از این صنعت خارج شود و شرکت‌های آمریکایی و غول‌های این حوزه را متهم کرد که در رقابت برای توسعه مدل‌های خودبهبودشونده «با جان ما قمار می‌کنند». آمودی در یک یادداشت در وب‌سایت شخصی خود (منبع به زبان انگلیسی) نوشت: «باید سرعت بهبود توانایی‌های مدل‌های هوش‌مصنوعی را کاهش دهیم. پیشرفت همچنان سریع به نظر خواهد رسید و باید از زمانی که به دست می‌آوریم عاقلانه استفاده کنیم.» آمودی افزود: «هوش‌مصنوعی با خود خطراتی می‌آورد و چون فناوری بسیار قدرتمندی است این خطرات جدی هستند.» آمودی که همراه خواهرش دانیلا در سال ۲۰۲۱ انتروپیک، سازنده مدل هوش‌مصنوعی کلود، را بنیان گذاشت، گفت: «نساختن این فناوری بشر را از منافع آن محروم می‌کند یا صرفا هوش‌مصنوعی را در اختیار قدرت‌های اقتدارگرا قرار می‌دهد، در حالی ک  "summary_fa": "همرسانی نظرها یورونیوز را در گوگل دنبال کنید همرسانی Facebook Twitter Flipboard Send Balatarin Messenger Bluesky Telegram Threads Whatsapp لینک کپی پیست کد امبد ویدیو: لینک کپی شد! رهبران کشورهای عضو بریکس روز شنبه نسبت در نشست خود در دهلی نو، پایتخت هند، با انتشار بیانیه مشترک حمله به زیرساخت‌های غیرنظامی و تحریم‌های یک‌جانبه را محکوم کردند. نشست سران بریکس در دهلی‌نو با حضور مسعود پزشکیان، رئیس جمهوری ایران و سایر رهبران کشورهای عضو برگزار شد. اعضای این گروه در بیانیه مشترک خود نسبت به «حملات عمدی» علیه زیرساخت‌های غیرنظامی و تاسیسات هسته‌ای صلح‌آمیز تحت نظارت آژانس بین‌المللی انرژی اتمی ابراز نگرانی کردند. آنها تأکید کردند که ایمنی و امنیت هسته‌ای باید در جریان درگیری‌های مسلحانه حفظ شود. این موضع به‌عنوان انتقادی غیرمستقیم از حملات آمریکا و اسرائیل به تاسیسات هسته‌ای ایران ارزیابی شده است. رهبران بریکس همچنین تحریم‌های یکجانبه‌ای را که از سوی شورای امنیت سازمان ملل متحد مجاز نشده‌اند، هدف قرار دادند. در بیانیه مشترک نام هیچ کشوری ذکر نشد، اما ایران و روسیه با مجموعه‌ای از تحریم‌های کشورهای غربی دست و پنجه نرم می‌کنند. در این بیانیه آمده است: «ما خواستار لغو چنین اقدامات غیرقانونی هستیم. اقداماتی که مقررات بین‌المللی و اصول و اهداف منشور سازمان ملل متحد را تضعیف می‌کنند.» بریکس در سال ۲۰۰۶ با عضویت برزیل، روسیه، هند و چین تشکیل شد و آفریقای جنوبی نیز در سال ۲۰۱۰ به آن پیوست. این گروه اکنون ۱۱ عضو دارد و کشورهای عضو آن حدود نیمی از جمعیت جهان و سهم قابل توجهی از تولید اقتصادی جهان را تشکیل می‌دهند. بریکس در سال‌های اخیر خواستار نقش و نمایندگی بیشتر کشورهای در حال توسعه در نهادهای بین‌المللی شده و تلاش کرده است تا با حمایت از گزینه‌هایی در برابر نهادهای مالی تحت سلطه غرب، جایگاه خود را به‌عنوان صدای کشورهای جنوب جهانی و اقتصادهای نوظهور تقویت کند."}, {"source": "Euronews Persian", "title": "جیمک: هیپ‌هاپ لهستان از بهترین‌های اروپاست و بابت این حرفم عذرخواهی نمی‌کنم", "link": "https://parsi.euronews.com/culture/2026/09/12/jimek-said-polish-hip-hop-is-among-the-best-in-europe-and-he-wouldnt-apologise-for-saying", "summary": "رادزیمیر دِمسکی معروف به ج tle": "کشته شدن ۱۱ نفر در حملات گسترده روسیه به اوکراین؛ کی‌یف «ناوگان سایه» مسکو را هدف قرار داد", "link": "https://parsi.euronews.com/my-europe/2026/09/12/ukraine-russia-overnight-strikes-odesa-shadow-fleet", "summary": "در پی حملات هوایی و موشکی گسترده روسیه به مناطق مختلف اوکراین طی شبانه روز گذشته (۱۱ تا ۱۲ سپتامبر)، دست‌کم ۱۱ تن کشته و ۹۶ نفر مجروح شدند.", "date_str": "2026-09-12T14:44:50+00:00", "hash": "113dbe3f37a30970", "title_fa": "کشته شدن ۱۱ نفر در حملات گسترده روسیه به اوکراین؛ کی‌یف «ناوگان سایه» مسکو را هدف قرار داد", "summary_fa": "همرسانی نظرها یورونیوز را در گوگل دنبال کنید همرسانی Facebook Twitter Flipboard Send Balatarin Messenger Bluesky Telegram Threads Whatsapp لینک کپی پیست کد امبد ویدیو: لینک کپی شد! در پی حملات هوایی و موشکی گسترده روسیه به مناطق مختلف اوکراین طی شبانه روز گذشته (۱۱ تا ۱۲ سپتامبر)، دست‌کم ۱۱ تن کشته و ۹۶ نفر مجروح شدند. منطقه اودسا شدیدترین خسارات را متحمل شد، اما استان‌های دنیپروپتروفسک، دونتسک، زاپوریژیا، کیِف، سومی، خارکیف و خیرسون نیز هدف این حملات قرار گرفتند. نیروی هوایی اوکراین اعلام کرد روسیه در این حمله از ۱۲۹ فروند پهپاد و انواع مختلف موشک‌ استفاده کرده است. به گفته مقامات اوکراینی، پدافند هوایی این کشور ۱۱۰ هدف هوایی از جمله ۱۰۱ پهپاد و ۹ فروند از انواع موشک‌های کروز را منهدم یا رهگیری کرده است. یکی از اهداف اصلی این حملات، شهر ساحلی اودسا بود که در پی آن یک مجتمع مسکونی چندطبقه خسارت دید. اوله کیپر، فرماندار اودسا، تایید کرد که شمار زخمی‌های این استان به حداقل ۳۵ نفر رسیده است که یک نوزاد پنج‌ماهه و یک نوجوان ۱۷ ساله نیز در میان آنها هستند. در استان دنیپروپتروفسک، حملات پهپادی و توپخانه‌ای به شهر دنیپرو و تاسیسات صنعتی کریفی‌ریه به کشته شدن ۲ تن و مجروح شدن ۲۲ نفر منجر شد. همچنین در استان زاپوریژیا، حمله به ۴۵ شهر و روستا ۲ کشته و ۱۱ زخمی بر جای گذاشت. در دونتسک ۴ تن (در اسلوویانسک، کراماتورسک و یاسنوهیرکا) و در استان‌های کیِف، سومی و خارکیف نیز در مجموع ۳ تن جان باختند. در منطقه خیرسون نیز ضربات به مناطق مسکونی و زیرساخت‌های خدماتی، ۱۸ مجروح بر جای گذاشت. هم‌زمان با این حملات، نیروهای اوکراین از اجرای عملیات پ ی که تنش میان ایران، آمریکا و اسرائیل ادامه دارد، به رویارویی آنها بُعدی تازه و بالقوه خطرناک ببخشد.", "date_str": "2026-09-12T23:02:00+00:00", "hash": "767ab155c2be5d4a", "title_fa": "پیشروی سریع حوثی‌ها در یمن؛ جنگ با ایران وارد مرحله‌ای تازه و خطرناک می‌شود", "summary_fa": "به نظر می‌رسد پیشروی برق‌آسای حوثی‌ها در بخش‌های جنوبی منطقه تهامه، دشت ساحلی خشک یمن، بیشتر ناظران را غافلگیر کرده است. تا همین اواخر، ائتلاف ضدحوثی موسوم به «مقاومت ملی» بخش‌های قابل توجهی از سواحل دریای سرخ یمن را در اختیار داشت. اما ظرف تنها چند روز، بخش بزرگی از این مناطق به کنترل حوثی‌ها درآمده است. بر اساس برخی برآوردها، نیروهای حوثی تا ۱۳۰ کیلومتر از نوار ساحلی راهبردی یمن را در امتداد دریای سرخ به تصرف خود درآورده‌اند. این پیشروی، چشمگیرترین دستاورد نظامی حوثی‌ها در چند سال اخیر به شمار می‌رود و نشان می‌دهد که با وجود ۱۲ سال جنگ داخلی، حملات ویرانگر هوایی عربستان سعودی و نیز حملات نیروهای آمریکایی، اسرائیلی و بریتانیایی، حوثی‌ها همچنان نیرویی هستند که نمی‌توان آنها را نادیده گرفت. با توجه به اینکه رقبای حوثی‌ها غافلگیر و تضعیف شده‌اند، بعید به نظر می‌رسد که این گروه دست‌کم در آینده نزدیک از این مناطق عقب رانده شود. هشام العمیسی، تحلیلگر ارشد موسسه اروپایی صلح در بروکسل، به بی‌بی‌سی گفت: «حالا که حوثی‌ها در این مناطق مستقر شده‌اند، به‌احتمال زیاد مواضع خود را تحکیم خواهند کرد و بیرون راندن آنها هزینه بسیار بیشتری خواهد داشت.»"}, {"source": "BBC Persian", "title": "پردرآمدترین رهبر سیاسی جهان کیست و رئیس‌جمهور ایران چقدر حقوق می‌گیرد؟", "link": "https://www.bbc.com/persian/articles/ckg7l135601o?at_medium=RSS&at_campaign=rss", "summary": "افزایش حقوق لورنس ونگ، نخست‌وزیر سنگاپور و پردرآمدترین رئیس دولت جهان، بار دیگر توجه‌ها را به دریافتی رهبران سیاسی جلب کرده است. در حالی که حقوق مقام‌های ارشد در برخی کشورها به طور علنی اعلام می‌شود، در ایران به دلیل نبود آمار رسمی، برآورد حقوق رئیس‌جمهور و اعضای دولت همچنان محل بحث و گمانه‌زنی است.", "date_str": "2026-09-12T23:04:01+00:00", "hash": "c310a84abac5c311", "title_fa": "پردرآمدترین رهبر سیاسی جهان کیست و رئیس‌جمهور ایران چقدر حقوق می‌گیرد؟", "summary_fa": "حقوق رهبران جهان همواره موضوع بحث بوده است. حالا با تصمیم دولت سنگاپور برای افزایش حقوق لورنس ونگ، پردرآمدترین رئیس دولت جهان، این موضوع دوباره در کانون توجه قرار گرفته است. در ایران اما به دلیل نبود آمار رسمی، برآورد حقوق رئیس‌جمهور و اعضای دولت بیشتر بر پایه اظهارات خود مقام‌ها و گزارش‌های غیررسمی انجام می‌شود. دولت سنگاپور اعلام کرده است حقوق و مزایای سالانه وزرا و مقام‌های ارشد این کشور، از جمله نخست‌وزیر، افزایش خواهد یافت. بر این اساس، حقوق و مزایای سالانه لورنس ونگ ۱/۴ میلیون دلار سنگاپور افزایش می‌یابد. او گفته است این افزایش را در پنج سال آینده به سازمان‌های خیریه اختصاص خواهد داد. نخست‌وزیر سنگاپور اکنون سالانه ۲/۲ میلیون دلار سنگاپور دریافت می‌کند و با اجرای این طرح، دریافتی او با بیش از ۶۰ درصد افزایش به ۳/۶ میلیون دلار سنگاپور، معادل حدود ۲/۸ میلیون دلار آمریکا، خواهد رسید. آقای ونگ گفته است افزایش حقوق وزرا برای جذب افراد توانمندتر به عرصه سیاست ضروری است. دولت سنگاپور نیز پیش‌تر استدلال کرده بود که پرداخت حقوق بالا به مقام‌های دولتی، خطر فساد را کاهش می‌دهد. این تصمیم اما با انتقادهایی روبه‌رو شده است. بسیاری از شهروندان سنگاپور در حالی با افزایش هزینه‌های زندگی و نگرانی درباره امنیت شغلی دست و پنجه نرم می‌کنند که حتی پیش از این افزایش نیز لورنس ونگ با اختلاف، پردرآمدترین رهبر سیاسی جهان به شمار می‌رفت."}, {"source": "BBC Persian", "title": "نشست بریکس در هند؛ پزشکیان و ولیعهد امارات دیدار کردند", "link": "https://www.bbc.com/persian/articles/cj06emdqnqmo?at_medium=RSS&at_campaign=rss", "summary": "مسعود پزشکیان، رئیس‌جمهور ایران، و خالد بن محمد بن زاید آل نهیان، ولیعهد امارات متحده عربی، در حاشیه نشست سران بریکس به میزبانی هند با هم دیدار کردند.", "date_str": "2026-09-12T16:12:39+00:00", "hash": "ae9c3d7ac5c802ca", "title_fa": "نشست بریکس در هند؛ پزشکیان و ولیعهد امارات دیدار کردند", "summary_fa": "مسعود پزشکیان، رئیس‌جمهور ایران، و خالد بن محمد بن زاید آل نهیان، ولیعهد امارات متحده عربی، در حاشیه نشست سران بریکس به میزبانی هند با هم دیدار کردند. این عالی‌ترین سطح دیدار مقام‌های دو کشور پس از جنگ هم‌زمان اسرائیل و آمریکا با ایران است. ایران گفته است که در پاسخ متقابل به حملات آمریکا از جمله به پایگاه‌های این کشور در امارات حمله کرده است. تصاویری از دیدار مسعود پزشکیان و خالد بن محمد بن زاید آل نهیان منتشر شده که نشان می‌دهد عباس عراقچی، وزیر خارجه ایران، و محسن حاجی‌میرزایی، رئیس دفتر آقای پزشکیان هم در ملاقات حاضر بودند. روابط ایران و امارات در ماه‌های اخیر بحرانی بوده است. ایران گفته است امارات در جنگ اخیر «دخالت داشته» و در همین ارتباط، از این کشور به‌صورت مستقیم انتقاد کرده بود. در جریان نشست وزیران خارجه بریکس در هند که بهار امسال در دهلی‌نو برگزار شده بود، آقای عراقچی گفته بود: «امارات مستقیماً در اقدام تجاوزکارانه علیه کشور من دخیل بود. زمانی که این تجاوز آغاز شد، آنها حتی از محکوم کردن آن خودداری کردند. آنها اجازه دادند از سرزمین‌شان برای شلیک توپخانه و تجهیزات علیه ما استفاده شود.» ساعاتی پیش از دیدار امروز مقام‌های ارشد ایران و امارات، رئیس‌جمهور ایران در سخنرانی‌اش در نشست سران بریکس گفت: «هیچ کشوری نباید از سرزمین خود برای تهدید و حمله به دیگری استفاده کند. اجلاس بریکس باید در برابر عادی‌سازی حمله به زیرساخت‌های غیرنظامی و حیاتی ایستادگی کند و تأسیسات هسته‌ای صلح‌آمیز نیز باید از حمله و تهدید به حمله مصون باشند.»"}, {"source": "Radio Farda", "title": "اوکراین و لهستان می‌گویند روسیه قطار مسافربری کی‌یف-ورشو را با پهپاد هدف قرار داد", "link": "https://www.radiofarda.com/a/russian-drone-hits-kyiv-warsaw-train/33853356.html", "summary": "مقام‌های اوکراین و لهستان اعلام کردند یک پهپاد روسیه روز یکشنبه ۲۲ شهریور به یک قطار مسافربری که از کی‌یف عازم ورشو بود، برخورد کرد اما این حمله تلفاتی در پی نداشت.", "date_str": "2026-09-13T12:38:34+00:00", "hash": "772df64bc1c0dffe", "title_fa": "اوکراین و لهستان می‌گویند روسیه قطار مسافربری کی‌یف-ورشو را با پهپاد هدف قرار داد", "summary_fa": "لینک به این صفحه در مناطقی که وبسایت ما مسدود است، کار می‌کند مقام‌های اوکراین و لهستان اعلام کردند یک پهپاد روسیه روز یکشنبه ۲۲ شهریور به یک قطار مسافربری که از کی‌یف عازم ورشو بود، برخورد کرد اما این حمله تلفاتی در پی نداشت. اوکراین اعلام کرد این حمله در فاصله حدود دو کیلومتری مرز لهستان، یکی از کشورهای عضو ناتو، رخ داده است. ولودیمیر زلنسکی، رئیس‌جمهور اوکراین، گفت روسیه این حمله را «عمداً» انجام داده است. تصاویر ویدئویی منتشرشده از محل حادثه، افرادی را نشان می‌دهد که پس از وقوع انفجار در ایستگاه راه‌آهن در حال فرار هستند. اولکساندر شفچنکو، یکی از مقام‌های محلی مسئول حمل‌ونقل، گفت یک پهپاد روسی صبح یکشنبه لوکوموتیو قطاری را که از کی‌یف به ورشو در حرکت بود، هدف قرار داد. به گفته او، این حمله نیز تلفاتی در پی نداشته است. همچنین یک پهپاد روسی بامداد همین روز یک جایگاه سوخت در نزدیکی گذرگاه مرزی یاگودین میان لهستان و اوکراین را هدف قرار داد. در این حمله گزارشی از تلفات جانی منتشر نشده است. این گذرگاه در منطقه وولین در غرب اوکراین قرار دارد و پس از حمله برای مدتی به‌طور موقت بسته شد، اما فعالیت آن از سر گرفته شده است."}, {"source": "Radio Farda", "title": "پزشکیان: اگر دنبال سلاح اتمی بودیم عضو ان‌پی‌تی نمی‌شدیم؛ درخواست آزمایش اتمی در مجلس", "link": "https://www.radiofarda.com/a/pezeshkian-npt/33853316.html", "summary": "مسعود پزشکیان، رئیس‌جمهوری ایران، بار دیگر گفت جمهوری اسلامی در پی دستیابی به سلاح هسته‌ای نیست و اظهار داشت: «اگر دنبال سلاح هسته‌ای بودیم، عضو ان‌پی‌تی نمی‌شدیم.»", "date_str": "2026-09-13T11:03:33+00:00", "hash": "d7c77b9857db58da", "title_fa": "پزشکیان: اگر دنبال سلاح اتمی بودیم عضو ان‌پی‌تی نمی‌شدیم؛ درخواست آزمایش اتمی در مجلس", "summary_fa": "لینک به این صفحه در مناطقی که وبسایت ما مسدود است، کار می‌کند مسعود پزشکیان، رئیس‌جمهوری ایران، در سفر خود به هند بار دیگر تأکید کرد که جمهوری اسلامی در پی دستیابی به سلاح هسته‌ای نیست و اظهار داشت: «اگر دنبال سلاح هسته‌ای بودیم، عضو ان‌پی‌تی نمی‌شدیم.» این در حالی است که همزمان یک نماینده مجلس از آماده‌ شدن طرح خروج ایران از این پیمان، پیمان منع گسترش سلاح‌های هسته‌ای، خبر داد و حتی خواستار انجام «آزمایش‌های لازم» برای دستیابی به سلاح هسته‌ای شد. آقای پزشکیان در گفت‌وگو با شبکه خبری ایندیا تودی که روز یکشنبه ۲۲ شهریور منتشر شد، گفت برنامه هسته‌ای ایران زیر شدیدترین نظارت‌ها قرار داشته و تهران در چارچوب قوانین بین‌المللی فعالیت کرده است. او اتهام تلاش ایران برای ساخت جنگ‌افزار هسته‌ای را «بهانه‌ای» برای توجیه حمله به خاک ایران خواند و پرسید: «این‌ها کدام مستند را پیدا کرده‌اند که ما داریم سلاح هسته‌ای درست می‌کنیم؟» رافائل گروسی، مدیرکل آژانس بین‌المللی انرژی اتمی، در روزهای اخیر و پیش از تصویب قطعنامه‌ای جدید علیه ایران گفته بود این نهاد بیش از یک سال است که از وضعیت برنامه هسته‌ای ایران اطلاعات کافی ندارد و از ژوئن ۲۰۲۵ نتوانسته فعالیت‌های راستی‌آزمایی خود را در تأسیسات اعلام‌شده ایران انجام دهد."}, {"source": "Radio Farda", "title": "واکنش مدیران شرکت‌های بزرگ هوش مصنوعی به هشدار جنجالی یک کارمند سابق", "link": "https://www.radiofarda.com/a/anthropic-boss-calls-for-ai-slowdown-altman-and-musk-agree/33853242.html", "summary": "در پی گزارش‌هایی از نفوذ برنامه‌های هوش مصنوعی به وب‌سایت‌ها بدون مجوز، مدیرعامل شرکت آمریکایی «آنتروپیک» خواستار کاهش سرعت توسعه این فناوری شد.", "date_str": "2026-09-13T06:59:15+00:00", "hash": "bb42444cce9c85f3", "title_fa": "واکنش مدیران شرکت‌های بزرگ هوش مصنوعی به هشدار جنجالی یک کارمند سابق", "summary_fa": "لینک به این صفحه در مناطقی که وبسایت ما مسدود است، کار می‌کند در پی هشدار یک متخصص درباره خطر احتمالی هوش مصنوعی [هوشواره] برای بشریت، مدیرعامل شرکت آمریکایی «آنتروپیک» خواستار کاهش سرعت توسعه این فناوری شد؛ پیشنهادی که سم آلتمن، مدیرعامل اوپن‌ای‌آی، و ایلان ماسک، مالک شرکت ایکس‌ای‌آی، نیز از آن حمایت کردند. این هشدار که در چند روز اخیر بسیار جنجالی شده است خود پس از انتشار گزارش‌هایی از نفوذ بدون مجوزِ برنامه‌های هوش مصنوعی به وب‌سایت‌ها صادر شده است. داریو آمودِئی، مدیرعامل شرکت آمریکایی «آنتروپیک»، روز شنبه ۲۱ شهریور در یادداشتی نوشت شرکت‌ها باید سرعت افزایش توانایی مدل‌های هوش مصنوعی را کم کنند تا فرصت بیشتری برای مهار خطرهای آنها داشته باشند. او تأکید کرد هدفش توقف پیشرفت نیست، بلکه اختصاص زمان کافی به بررسی ایمنی و اطمینان از کنترل‌پذیری این سامانه‌هاست. آمودئی پیشنهاد کرد ارزیابان مستقل با دسترسی مشابه کارکنان این شرکت‌ها، بر اقدامات ایمنی شرکت‌ها نظارت کنند و شرکت‌های پیشرو نیز با همکاری دولت‌ها استانداردهای مشترکی تدوین کنند. آلتمن اعلام کرد اوپن‌ای‌آی نیز چنین نظارت مستقلی را می‌پذیرد و ماسک در واکنشی کوتاه نوشت: «داریو درست می‌گوید.» این درخواست‌ها پس از چند مورد خروج برنامه‌های خودکار هوش مصنوعی از محدوده تعیین‌شده در آزمایش‌ها مطرح شده است. این برنامه‌ها که می‌توانند بدون نظارت مداوم انسان وظایفی را انجام دهند، در برخی موارد به سامانه‌های بیرونی دسترسی غیرمجاز پیدا کرده‌اند."}, {"source": "Radio Farda", "title": "افزایش صادرات نفت کشورهای عرب خلیج فارس در مقابل ماندن نفت خام ایران پشت خط محاصره", "link": "https://www.radiofarda.com/a/iran-oil-exports-us-naval-blockade-tankertrackers/33853034.html", "summary": "تانکرترکرز: بررسی عبور نفتکش‌ها در ۶۰ روز نشان می‌دهد نفت خام عراق، کویت، عربستان سعودی، قطر، امارات و عمان با میانگین روزانه ۷ میلیون و ۸۵۰ هزار بشکه از خط محاصره خارج شده است.", "date_str": "2026-09-12T17:01:15+00:00", "hash": "6cd8909ad0e963bb", "title_fa": "افزایش صادرات نفت کشورهای عرب خلیج فارس در مقابل ماندن نفت خام ایران پشت خط محاصره", "summary_fa": "لینک به این صفحه در مناطقی که وبسایت ما مسدود است، کار می‌کند داده‌های جدید یک مؤسسهٔ ردیابی نفتکش‌ها نشان می‌دهد طی ۶۰ روز گذشته هیچ محموله‌ای از نفت خام ایران از خط محاصرهٔ دریایی آمریکا در مرز دریای عمان و دریای عرب عبور نکرده است، در حالی که صادرات نفت خام شش کشور عرب منطقه از همین محدوده به‌طور متوسط روزانه نزدیک هشت میلیون بشکه بوده است. این آمار چند روز پس از آن منتشر می‌شود که روزنامهٔ وال‌استریت جورنال گزارش داد درآمد نفتی ایران به‌دلیل محاصره و کاهش ذخایر روی آب تحت فشار قرار گرفته است. وب‌سایت تانکرترکرز روز شنبه ۲۱ شهریور اعلام کرد بررسی عبور نفتکش‌ها در ۶۰ روز کامل منتهی به این روز نشان می‌دهد نفت خام عراق، کویت، عربستان سعودی، قطر، امارات متحده عربی و عمان با میانگین روزانه ۷ میلیون و ۸۵۰ هزار بشکه از این خط خارج شده است. بر اساس جدول داده‌های این مؤسسه، حجم عبور نفت خام این کشورها در برخی روزها بسیار بالاتر از میانگین بوده است. برای نمونه، در ۹ اوت حدود ۱۶ میلیون و ۶۰۰ هزار بشکه و در ۲۵ اوت نزدیک به ۱۴ میلیون بشکه نفت خام از این خط عبور کرده است. به‌طور متوسط روزانه پنج نفتکش حامل نفت خام این کشورها از محدودهٔ مورد بررسی عبور کرده‌اند، اما در تمام این مدت، به گفتهٔ تانکرترکرز، «حتی یک بشکه» نفت خام ایران از این خط عبور نکرده است."}],
      tech: [{"source": "TechCrunch AI", "title": "OpenAI’s Sam Altman says it would be ‘ill-advised’ to go public in 2026", "link": "https://techcrunch.com/2026/09/12/openais-sam-altman-says-it-would-be-ill-advised-to-go-public-in-2026/", "summary": "While OpenAI has filed confidentially for an IPO, the company will not be going public this year, according to CEO Sam Altman.", "date_str": "2026-09-12T20:19:16+00:00", "hash": "c4730512f74dcc4d", "title_fa": "سام آلتمن از OpenAI می‌گوید عرضه عمومی در سال 2026 \"بی‌مورد\" است.", "summary_fa": "Disrupt 2026: OpenAI، Anthropic، Replit، و موارد دیگر در 6 مرحله صنعتی قرار می گیرند. 25 درصد تخفیف بلیط ها اکنون بازگشت با تقاضای عمومی: به گفته مدیر عامل سام آلتمن، مدیر عامل شرکت سام آلتمن، تا 300 دلار در Disrupt صرفه جویی کنید در حالی که OpenAI به صورت محرمانه برای IPO ثبت نام کرده است، این شرکت امسال عمومی نخواهد شد. آلتمن اخیراً با آلیسون شونتل، سردبیر مجله Fortune مصاحبه کرد. در میان پیامدهای هک OpenAI-HuggingFace، و همچنین بحث‌های گسترده‌تر در مورد ایمنی هوش مصنوعی، Shontell این سوال را مطرح کرد که آیا OpenAI هنوز به دلیل برنامه‌های IPO خود برای «حرکت واقعاً سریع» تحت فشار است؟ آلتمن گفت: «ما برای عرضه اولیه سهام عجله نداریم. من در واقع فکر می‌کنم که با توجه به اینکه همه چیز با امنیت اتفاق می‌افتد، در حال حاضر زمان مناسبی برای انتشار عمومی خواهد بود.» در عوض، او اصرار داشت که OpenAI «زمانی که ما آماده باشیم، یعنی زمانی که کسب‌وکار آماده است، زمانی که احساس کنیم از لحظه‌ای که در جامعه با این فناوری است، آماده هستیم، عمومی خواهد شد». آلتمن وقتی تحت فشار قرار گرفت که آیا این بدان معناست که IPO در سال 2026 اتفاق نمی افتد، آلتمن پاسخ داد: \"من می گویم نه 2026، بله. ما کارهای زیادی برای انجام داریم.\""}, {"source": "TechCrunch AI", "title": "Anthropic CEO outlines plan to slow AI development", "link": "https://techcrunch.com/2026/09/12/anthropic-ceo-outlines-plan-to-pace-the-frontier/", "summary": "Anthropic's Dario Amodei and OpenAI's Sam Altman seem to agree that it's time to \"pace the frontier.\" What would that actually look like?", "date_str": "2026-09-12T19:34:44+00:00", "hash": "153c305337d0d1b6", "title_fa": "مدیر عامل Anthropic طرحی را برای کند کردن توسعه هوش مصنوعی بیان می کند", "summary_fa": "Disrupt 2026: OpenAI، Anthropic، Replit، و موارد دیگر در 6 مرحله صنعتی قرار می گیرند. 25 درصد تخفیف بلیط ها اکنون بازگشت بر اساس تقاضای عمومی: تا 300 دلار صرفه جویی در هزینه تصویر مختل کنید اعتبارات: روحانی Kaur/Bloomberg/Getty Images AI Anthropic مدیر عامل برنامه ای برای کند کردن توسعه هوش مصنوعی طرح می کند Anthony Ha 12:34 PM PDT · 12 سپتامبر 2026 ما شاهد تحقیقاتی درباره هوش مصنوعی و حتی تحقیقات وحشتناک تر از جنگ های AI هستیم. از مدیر عامل OpenAI سم آلتمن که ممکن است زمان آن فرا رسیده باشد که توسعه هوش مصنوعی را «سرعت» کنیم. اما در واقع چه شکلی خواهد بود؟ در یک پست وبلاگ جدید، داریو آمودی، مدیر عامل آنتروپیک، نه تنها دعوت به \"سرعت در مرز\" را تکرار کرد، بلکه سه استراتژی کلی برای انجام این کار را نیز تشریح کرد. و او گفت که Anthropic به طور یکجانبه به یکی از آنها متعهد می شود و آلتمن می خواهد بگوید OpenAI از این روش پیروی خواهد کرد. بحث در مورد ایمنی و همسویی هوش مصنوعی این هفته پس از اینکه محقق Jacob Coxon نوشت که او از Anthropic استعفا می دهد به دلیل نگرانی از اینکه شرکت های پیشرو هوش مصنوعی \"با زندگی ما قمار می کنند\" استعفا می دهد در حالی که افرادی که این فناوری را می سازند \"صادقانه معتقدند که می تواند تا پایان دهه همه ما را بکشد\"، ادعایی که دیگران در Anthropic تکرار کردند. در پست آمودی به صراحت به استعفای کاکسون یا نگرانی‌های او اشاره نشده است، اما مدیر عامل شرکت نوشت که دو چیز او را متقاعد کرد که زمان آن رسیده است که رویکرد محتاطانه‌تری برای توسعه هوش مصنوعی در پیش بگیرد: هک OpenAI-HuggingFace و این واقعیت که «هوش مصنوعی در ماه‌های اخیر «به‌شدت سریع‌تر» هوش مصنوعی را با نسل بعدی رو"}, {"source": "NYT Tech", "title": "Anthropic C.E.O. Dario Amodei Calls for A.I. Slowdown", "link": "https://www.nytimes.com/2026/09/12/technology/anthropic-dario-amodei-ai-slowdown.html", "summary": "In an essay, the head of Anthropic laid out the rapidly advancing capabilities of artificial intelligence and said there needed to be greater safety controls across the industry.", "date_str": "2026-09-13T00:15:54+00:00", "hash": "5fafd24cfe4a86d1", "title_fa": "Anthropic C.E.O. داریو آمودی فراخوان A.I. کاهش سرعت", "summary_fa": "در مقاله‌ای، رئیس Anthropic توانایی‌های هوش مصنوعی را که به سرعت در حال پیشرفت هستند، بیان کرد و گفت که باید کنترل‌های ایمنی بیشتری در سراسر صنعت وجود داشته باشد."}, {"source": "NYT Tech", "title": "10-Year-Old Children Predict the Future", "link": "https://www.nytimes.com/2026/09/13/style/10-year-old-children-predict-the-future.html", "summary": "Robot butlers. Underwater homes. Root beer perfume. Kids across the nation weigh in on what life will be like in the year 2050.", "date_str": "2026-09-13T13:05:14+00:00", "hash": "45ee6a41c2605d4c", "title_fa": "کودکان 10 ساله آینده را پیش بینی می کنند", "summary_fa": "ربات ساقی. خانه های زیر آب عطر آبجو ریشه. کودکان در سراسر کشور در مورد اینکه زندگی در سال 2050 چگونه خواهد بود، می سنجید."}, {"source": "The Guardian AI", "title": "OpenAI boss and Elon Musk back calls to put brakes on ‘reckless’ AI development", "link": "https://www.theguardian.com/technology/2026/sep/13/openai-sam-altman-elon-musk-back-anthropic-calls-brakes-ai-development", "summary": "Rare show of unity from rival developers after safety warnings from Anthropic boss and AI researchers The Guardian view on controlling AI: humanity cannot outsource its survival Sam Altman and Elon Musk have backed a call from the head of Anthropic, Dario Amodei, to “slow the pace” of AI development after he warned that an AI swarm could otherwise become capable of “taking over the entire internet” within a year. In a rare show of unity, the rival technology leaders threw their weight behind the appeal from the founder and chief executive of the artificial intelligence company Anthropic, which came after a series of warnings from AI researchers last week. Continue reading...", "date_str": "2026-09-13T14:02:24+00:00", "hash": "356ff36620295f7a", "title_fa": "رئیس OpenAI و ایلان ماسک از فراخوان ها برای ترمز کردن توسعه \"بی پروا\" هوش مصنوعی حمایت می کنند", "summary_fa": "نمایش نادری از اتحاد از سوی توسعه دهندگان رقیب پس از هشدارهای ایمنی رئیس Anthropic و محققان هوش مصنوعی دیدگاه گاردین در مورد کنترل هوش مصنوعی: بشریت نمی تواند بقای خود را برون سپاری کند سام آلتمن و ایلان ماسک از درخواست رئیس Anthropic، داریو آمودی، حمایت کردند تا \"سرعت توسعه هوش مصنوعی را پایین بیاورند\" پس از اینکه او هشدار داد که \"در غیر این صورت ممکن است یک AI در غیر این صورت یک کلاهبرداری از اینترنت باشد.\" سال در یک نمایش نادر از اتحاد، رهبران فناوری رقیب به درخواست بنیانگذار و مدیر اجرایی شرکت هوش مصنوعی Anthropic که پس از یک سری هشدار از سوی محققان هوش مصنوعی در هفته گذشته ارائه شد، اهمیت دادند. ادامه مطلب..."}, {"source": "The Guardian AI", "title": "AI will transform capitalism – but how?", "link": "https://www.theguardian.com/technology/2026/sep/13/ai-will-transform-capitalism-but-how", "summary": "Technology is going to drastically reshape the economy, and it’s within our power to decide what that looks like The idea that autonomous, thinking machines may one day destroy property, hierarchy and inequality is as old as western political thought. In Aristotle’s Politics, the philosopher cites a fantasy from the Iliad, in which machines begin to act independently of human direction, concluding: “If every tool could perform its own work when ordered, or by seeing what to do in advance … if thus shuttles wove and quills played harps of themselves, master-craftsmen would have no need of assistants and masters no need of slaves.” The dream that automation could inaugurate a classless society is also present in the writings of Karl Marx. In 1858 he imagined the replacement of intellectual property with “socialised knowledge”, which would merge into a “general intellect”, blowing the foundations of capitalism sky high. Continue reading...", "date_str": "2026-09-13T11:00:02+00:00", "hash": "046d744ae966c31d", "title_fa": "هوش مصنوعی سرمایه داری را متحول خواهد کرد - اما چگونه؟", "summary_fa": "فناوری به شدت اقتصاد را تغییر خواهد داد، و این در اختیار ماست که تصمیم بگیریم که چگونه به نظر می رسد. در کتاب سیاست ارسطو، فیلسوف خیالی از ایلیاد را ذکر می‌کند که در آن ماشین‌ها مستقل از جهت‌دهی انسان شروع به عمل می‌کنند و نتیجه می‌گیرد: «اگر هر ابزاری می‌توانست کار خود را در صورت سفارش انجام دهد، یا با دیدن کارهایی که از قبل انجام می‌شد... اگر به این ترتیب شاتل‌ها می‌بافند و قلاب‌ها برای خودشان چنگ می‌نواختند، نیازی به استادان و استادکاران نبود.» این رویا که اتوماسیون می تواند جامعه ای بی طبقه را آغاز کند در نوشته های کارل مارکس نیز وجود دارد. در سال 1858 او جایگزینی مالکیت فکری را با «دانش اجتماعی» تصور کرد که در یک «عقل عمومی» ادغام می‌شود و پایه‌های سرمایه‌داری را به آسمان می‌برد. ادامه مطلب..."}, {"source": "The Guardian AI", "title": "‘Really helpful’: the AI bootcamps aimed at addressing UK youth unemployment", "link": "https://www.theguardian.com/technology/2026/sep/13/ai-bootcamps-uk-youth-unemployment-neets-preston", "summary": "Pilot project in Preston comes with apprenticeship offer for Neets at end of three-week course In a youth centre opposite Preston bus station , the UK government is trying to address two of the greatest challenges facing the national economy: AI and youth unemployment. The hope is that one will solve – rather than cause – the other. In a room at the recently opened Vault, a community hub in the Lancashire city, an “AI bootcamp” is under way – part of a trial in the north-west to give 16- to 24-year-olds AI training. Continue reading...", "date_str": "2026-09-13T09:00:04+00:00", "hash": "37cf22596ace4693", "title_fa": "\"واقعا مفید\": بوت کمپ های هوش مصنوعی با هدف رسیدگی به بیکاری جوانان در بریتانیا", "summary_fa": "پروژه آزمایشی در پرستون همراه با پیشنهاد کارآموزی برای Neets در پایان دوره سه هفته‌ای در مرکز جوانان روبروی ایستگاه اتوبوس پرستون، دولت بریتانیا در تلاش است تا به دو مورد از بزرگترین چالش‌های پیش روی اقتصاد ملی بپردازد: هوش مصنوعی و بیکاری جوانان. امید این است که یکی eg رئیس هیئت مدیره و مدیرعامل Automattic است، با پشتیبانی کامل هیئت مدیره و اگر به صورت آنلاین جستجو کنید، می توانید بسیاری از مدیران ارشد و Automatticians را نیز مشاهده کنید که از او حمایت می کنند، سخنگوی شرکت از طریق ایمیل درست بعد از ساعت 5 عصر به وقت ET عصر شنبه با TechCrunch به اشتراک گذاشت. (به نظر می رسد ذکر پشتیبانی آنلاین به پست های حمایتی در X اشاره دارد که مولنوگ از حساب X خود بازنشر می کرده است.) هیئت مدیره Automattic اوایل این هفته رای داده بود که Mullenweg به دلایل نامعلومی به مرخصی با حقوق بپردازد. ظاهراً این حرکت برای مولنوگ غافلگیرکننده بود، او در Automattic Slack پست گذاشت و اعضای هیئت مدیره را به توطئه علیه او متهم کرد. Automattic روز چهارشنبه برکناری Mullenweg را از TechCrunch تأیید کرد و گفت که Mullenweg در حال حاضر در مرخصی است و مدیر مالی Automattic، Mark Davies، با اطمینان کامل از هیئت مدیره، به عنوان مدیر عامل موقت هدایت خواهد شد."}, {"source": "TechCrunch Main", "title": "Tesla says it will finally unveil the second generation Roadster on October 1", "link": "https://techcrunch.com/2026/09/12/tesla-says-it-will-finally-unveil-the-second-generation-roadster-on-october-1/", "summary": "Tesla’s halo sports car was first announced in November 2017.", "date_str": "2026-09-12T19:21:19+00:00", "hash": "955772bba3a8472a", "title_fa": "تسلا می گوید بالاخره در اول اکتبر از نسل دوم رودستر رونمایی خواهد کرد", "summary_fa": "Disrupt 2026: OpenAI، Anthropic، Replit، و موارد دیگر در 6 مرحله صنعتی قرار می گیرند. 25٪ تخفیف بلیط اکنون بازگشت با تقاضای عمومی: تا 300 دلار در Disrupt صرفه جویی کنید نسل دوم تسلا رودستر که مدت ها در انتظار آن بودیم ممکن است بالاخره برای عموم آماده شود. در پستی در روز شنبه در X، شرکت خودروهای برقی به سادگی نوشت: «برای راه‌اندازی بروید»، با گرافیکی که تاریخ «10.01» را نشان می‌دهد – بنابراین انتظار دارید رودستر جدید در اول اکتبر رونمایی شود. همچنین به نظر می‌رسد این گرافیک به پیشرانه‌های گاز سرد وعده داده شده که توسط شرکت بزرگ دیگر تسلا، ایلان ماسک، توسعه یافته است، اشاره دارد. این پیشرانه های اختیاری قرار است به رودستر اجازه پرواز  اضافه کرده‌ام، یادداشت‌های آزمایشی طولانی‌مدت را در Birdfy Nest Duo و Birdfy Bath Pro به‌روزرسانی کردم، انتخاب قبلی را به Others Tested در صورت استفاده بیشتر منتقل کردم، و از قیمت‌ها و پیوندهای به‌روز اطمینان حاصل کردم. بهترین فیدر پرنده هوشمند Netvue Birdfy Lite به بررسی 250 دلاری آمازون (شناسه هوش مصنوعی، خورشیدی) عکس‌های با بالاترین وضوح Camojojo Hibird Pro پرش"}, {"source": "Wired", "title": "Try These 3 iOS 27 Safari Settings to Get More Out of Apple’s Browser", "link": "https://www.wired.com/story/iphone-settings-ios-27-safari-browser/", "summary": "Apple’s Safari browser gets a few helpful automation and personalization features in iOS 27.", "date_str": "2026-09-13T10:30:00+00:00", "hash": "83dff1302b450f47", "title_fa": "برای استفاده بیشتر از مرورگر اپل، این 3 تنظیمات سافاری iOS 27 را امتحان کنید", "summary_fa": "Loader Save Story ذخیره این داستان Comment Loader Save Story ذخیره این داستان در رویداد سخت افزاری اخیر اپل، نرم افزاری که iPhone Duo تاشو آن را تامین می کند، با جلوه های شفاف Liquid Glass و نمادهای عمودی روی هم برجسته شد. اما برای بهره مندی از مزایای به روز رسانی iOS 27 اپل، نیازی به ربودن یک گوشی هوشمند تاشو ندارید. هنگامی که iOS 27 در روز دوشنبه از نسخه بتا خارج شود، برنامه مستقل Siri AI و ادغام جستجوی تلفن هوشمند احتمالاً آشکارترین تغییر برای بسیاری از کاربران آیفون خواهد بود. اما برای کشف افزودنی‌های مفید به برنامه‌های کلیدی، مانند مرورگر سافاری اپل، و همچنین اصلاحات به برنامه‌های کم‌استفاده، مانند Shortcuts، ارزش آن را دارد که عمیق‌تر بگردیم. نسخه سافاری موجود در iOS 27 تقریباً شبیه به نسخه قبلی است و چند به‌روزرسانی کلیدی در تنظیمات پنهان شده است. این ویژگی‌های سافاری توسط Apple Intelligence پشتیبانی می‌شوند که به آیفون 15 پرو یا جدیدتر نیاز دارد (این ویژگی‌ها در iPadOS 27 و macOS 27 نیز موجود هستند). عکس: با حسن نیت از اپل اگر به صورت آنلاین خرید می‌کنید و می‌خواهید یک اعلان کاهش قیمت سریع دریافت کنید، می‌توانید از ویژگی «به من اطلاع بده» برای اسکن یک صفحه وب در یک آهنگ خاص و جستجوی تغییرات استفاده کنید. ابتدا به صفحه ای که می خواهید ردیابی کنید بروید و روی نماد منوی همبرگر سه خطی در گوشه سمت راست بالای Safari ضربه بزنید. تقریباً در نیمه پایین، این گزینه را در لیست خواهید دید. در توضیحات این ویژگی آمده است: «زمانی که وب‌سایتی محتوای مورد نظر شما را به‌روزرسانی می‌کند، Safari می‌تواند به شما اطلاع دهد. در اینجا یک کادر متنی باز پیدا خواهید کرد که در آن می‌توانید توضیح دهید که چه تغییری در محتوایی که می‌خواهید سافاری برای آن اسکن کند، و همچنین تعداد"}, {"source": "Wired", "title": "Best Indoor Garden Systems I’ve Been Testing All Year (2026)", "link": "https://www.wired.com/gallery/best-indoor-gardening-systems/", "summary": "Grow a backyard’s worth of greens and vegetables in your house with a vertical hydroponic garden. Here are a few that might be worth the investment.", "date_str": "2026-09-13T10:30:00+00:00", "hash": "86f32d5f2717ab41", "title_fa": "بهترین سیستم های باغ داخلی که در تمام سال آزمایش کرده ام (2026)", "summary_fa": "Loader Save Story ذخیره این داستان نظر Loader Save Story ذخیره این داستان در این مقاله برجسته شده است بهترین باغ هیدروپونیک سرپوشیده Gardyn بیشتر بخوانید 549 دلار آمازون (استودیو 2) باغی که همچنین بیانیه ای است که یک قطعه کاهو رشد می کند پایه مزرعه بیشتر بخوانید 599 دلار کاهو رشد می کند (Outdoorg) EVE Tower Garden بیشتر بخوانید 599 دلار آمازون بهترین برای مبتدیان AeroGarden Bounty بیشتر بخوانید 115 دلار آمازون آیا به دلیل شیوع اخیر سیکلوسپوریازیس نمی توانید کاهو بخورید؟ من نیستم. نه به این دلیل که به باد احتیاط می کنم و به هر حال آن را می خرم، بلکه به این دلیل که خودم در خانه خودم، در کمتر از چند فوت مربع، چندین نوع کاهوی ارگانیک می کارم. و شما هم می توانید. در سال گذشته، سیستم‌های مختلف باغ هوشمند داخلی را در خانه‌ام آزمایش کرده‌ام، که به من در تمام طول سال دسترسی به گوجه‌فرنگی، فلفل، توت‌فرنگی و حتی کدو سبز تازه داده است. راه اندازی و استفاده از بسیاری از آنها برای هر کسی آسان است، با حداقل نیاز به فضا و نگهداری - تقریباً برای هر خانه ای یک راه اندازی باغبانی سرپوشیده وجود دارد."}, {"source": "Wired", "title": "AI Agents Are Thirsty for Power", "link": "https://www.wired.com/story/ai-agents-are-thirsty-for-power/", "summary": "Silicon Valley is shifting away from chatbot queries toward a future filled with resource-intensive agentic AI—and it's driving the data center buildout.", "date_str": "2026-09-13T10:00:00+00:00", "hash": "21defce6c3b03e2c", "title_fa": "عوامل هوش مصنوعی تشنه قدرت هستند", "summary_fa": "Loader Save Story ذخیره این داستان نظر Loader Save Story ذخیره این داستان به Power Play خوش آمدید! هر هفته، مولی تافت، نویسنده ارشد، به موضوعی در مورد بزرگترین مشکل این فصل میان ترم می پردازد: مراکز داده. اگر سؤال یا فکری برای ستون دارید، می‌توانید به ایمیلی به مولی در [email protected] شلیک کنید یا به‌طور ایمن در Signal در mollytaft.76 به آنها برسید. یکی از دوستان خشمگین اخیراً از من پرسید: \"آنها همه این مراکز داده را برای چه می سازند؟\" آنها تنها کسی نیستند که می پرسند: ما چندین سؤال مشابه در جریان مستقیم مرکز داده اخیر خود دریافت کردیم. این یک چیز واقعا معقول است که در مورد آن تعجب کنید. به هر حال، اگر هوش مصنوعی در حال حاضر همه این پیشرفت‌ها را ایجاد کرده است، چرا شرکت‌های فناوری میلیاردها دلار بدهی می‌گیرند و برخی از بزرگترین نیروگاه‌های جهان را برای ساخت مراکز داده بیشتر می‌سازند؟ پاسخ این نیست که به کاربر عادی کمک کنیم تا دستور العمل ها را جستجو کند یا مکان هایی را برای بازدید در تعطیلات جستجو کند. پرس و جوهای ساده چت بات روشی فزاینده منسوخ برای تفکر در مورد نحوه عملکرد هوش مصنوعی هستند. در حال حاضر، هوش مصنوعی تماماً در مورد عوامل است - هیچ تعریف رسمی وجود ندارد، اما به طور کلی، عامل ها سیستم های بزرگ مبتنی بر مدل زبان هستند که برای تصمیم گیری مستقل برای اجرای یک کار طراحی شده اند - و تغییر به سمت آنها بخشی از چیزی است که باعث ایجاد قدرت در سیلیکون ولی می شود. ماکسول زف، همکار من، که خبرنامه هفتگی Model Behavior را می نویسد، می گوید: «به جای پرسیدن یک سوال و پاسخ ساده از یک ربات چت هوش مصنوعی، این عوامل می توانند صدها پیام کوچک را بر اساس سؤال اصلی کاربر به خود بدهند."}, {"source": "Wired", "title": "With a Better Understanding of Physics, We Could Predict Volcanic Eruptions", "link": "https://www.wired.com/story/physics-predict-volcanic-eruptions/", "summary": "“There’s no reason we can’t think that, at some point in the future, we can have volcano forecasts that are like weather forecasts.”", "date_str": "2026-09-13T09:30:00+00:00", "hash": "94428618417dfc98", "title_fa": "با درک بهتر فیزیک، می‌توانیم فوران‌های آتشفشانی را پیش‌بینی کنیم", "summary_fa": "Loader Save Story ذخیره این داستان نظر Loader Save Story ذخیره این داستان نسخه اصلی این داستان در مجله Quanta ظاهر شد. در تابستان 1991، آتشفشان پیناتوبو در فیلیپین، خود ویران شد. فوران در 12 ژوئن آغاز شد و سه روز بعد با انفجاری مهیب به اوج خود رسید. زمانی که جریان‌های آذرآواری - بهمن‌های رشته‌ای از سنگ و گاز مذاب - از شیب‌های استریل‌شده آن فرود آمدند، قله پیناتوبو محو شده بود و شکافی به عرض 2.5 کیلومتر جایگزین آن شد. این فوران باعث مرگ بیش از 800 نفر شد، عمدتاً به این دلیل که سقف‌هایی که توسط خاکستر اشباع شده از باران سنگین شده بودند، فروریختند. اما می‌توانست خیلی بدتر از این باشد: حدود 250000 نفر در چندین شهر و پایگاه گسترده نیروی هوایی ایالات متحده در سایه آتشفشان زندگی می‌کردند. هنگامی که پیناتوبو در آوریل همان سال شروع به تشنج و آروغ زدن بخار کرد، دانشمندانی از ایالات متحده و فیلیپین مجموعه‌ای از ابزارها را به کار گرفتند که غوغای درونی آتشفشان را ردیابی می‌کردند. مایک لهستان، دانشمند فعلی مسئول رصدخانه آتشفشانی یلوستون در سرویس زمین‌شناسی ایالات متحده، می‌گوید: \"ما چیز زیادی در مورد آن آتشفشان نمی‌دانستیم، و بنابراین این ارزیابی زمین‌شناسی واقعاً سریع انجام شد. و ارزیابی گفت: \"اوه، احمق، وقتی این چیز فوران می‌کند، فقط فوران بزرگی می‌کند.\" \"و این مبنای یک پیش بینی شد.\" در اوایل ژوئن، خاکستر و گدازه در حال فرار از جناحین پیناتوبو بودند و دستور تخلیه داده شد، درست چند روز قبل از سقوط چکش فاجعه‌آمیز. به عبارت دیگر، یک تماس بسیار نزدیک بود. آن دانشمندان جان بی‌شماری را نجات دادند، اما پیش‌بینی آن‌ها بیشتر از آن چیزی که به نظر می‌رسید یک حدس علمی بود. هیچ شباهتی به پیش بینی آب و هوا نداشت. آنها نمی‌توانستند با اطمینان چیزی بگویند که در 12 ژوئن یک فوران انفجاری رخ خواهد"}, {"source": "The Next Web", "title": "Xi pitches open-source AI to BRICS as Beijing weighs curbs on its own models", "link": "https://thenextweb.com/news/xi-brics-open-source-ai-eu", "summary": "Xi Jinping used the BRICS summit to propose a China-led community for open-source AI and to invite members into the World AI Cooperation Organization, a Beijing-founded body of 29 countries with no EU state among them. Europe drew its line in the AI Act, which exempts genuinely open models but not those carrying systemic risk, [ ] This story continues at The Next Web", "date_str": "2026-09-13T09:58:04+00:00", "hash": "660a1c2c74dd0a5c", "title_fa": "شی در حالی که پکن مدل‌های خود را محدود می‌کند، هوش مصنوعی منبع باز را به BRICS ارائه می‌کند.", "summary_fa": "شی جین پینگ از نشست بریکس برای پیشنهاد جامعه ای به رهبری چین برای هوش مصنوعی منبع باز و دعوت از اعضا به سازمان جهانی همکاری هوش مصنوعی، سازمانی متشکل از 29 کشور که در پکن تأسیس شده و هیچ کشور اتحادیه اروپا در میان آنها وجود ندارد، استفاده کرد. اروپا خط خود را در قانون هوش مصنوعی ترسیم کرد، که مدل‌های واقعاً باز را معاف می‌کند، اما نه آن‌هایی که ریسک سیستماتیک دارند، [ ] این داستان در The Next Web ادامه دارد."}, {"source": "The Next Web", "title": "China’s data regulator plans standards for embodied AI, ten days after industry asked", "link": "https://thenextweb.com/news/china-embodied-ai-data-eu-gap", "summary": "China’s National Data Administration said it will develop standards for embodied AI data and guide local authorities on the work, ten days after seven companies asked it for exactly that. Europe regulates who may reach the data a machine generates but has no programme producing it, and the data labs promised in its Data Union [ ] This story continues at The Next Web", "date_str": "2026-09-13T09:36:50+00:00", "hash": "b0aa1adbc0cc6bea", "title_fa": "رگولاتور داده چین، ده روز پس از درخواست صنعت، استانداردهایی را برای هوش مصنوعی تجسم یافته برنامه ریزی می کند", "summary_fa": "اداره ملی داده چین اعلام کرد که استانداردهایی را برای داده های تجسم AI توسعه خواهد داد و مقامات ipo-talks/", "summary": "انتروپیک در حال مذاکره با انویدیا برای جذب سرمایه‌گذاری ۱۰ میلیارد دلاری در بزرگ‌ترین عرضه اولیه تاریخ است.", "date_str": "2026-09-13T13:45:00+00:00", "hash": "284f614a1db7dd0e", "title_fa": "انویدیا احتمالا با ۱۰ میلیارد دلار به استقبال عرضه اولیه سهام آنتروپیک می‌رود", "summary_fa": "انتروپیک در حال مذاکره با انویدیا برای جذب سرمایه‌گذاری ۱۰ میلیارد دلاری در بزرگ‌ترین عرضه اولیه تاریخ است. تبلیغات استارتاپ هوش مصنوعی انتروپیک در حال مذاکره است تا انویدیا را به‌عنوان سرمایه‌گذار کلیدی وارد بزرگ‌ترین عرضه‌ی اولیه‌ی عمومی تاریخ کند. رویترز به نقل از منابع آگاه می‌گوید ، انتروپیک قصد دارد با جذب سرمایه‌ای تا سقف ۱۰۰ میلیارد دلار، ارزش بازار خود را به حدود ۲ تریلیون دلار برساند و انویدیا نیز در حال بررسی سرمایه‌گذاری تا ۱۰ میلیارد دلار در فرایند عرضه‌ی سهام است. حضور احتمالی تیم سبز به‌عنوان حامی راهبردی، اعتماد بازار سرمایه را به تقاضای مالی سنگین شرکت‌های پیشرو هوش مصنوعی جلب می‌کند. مذاکرات یادشده محرمانه خواهد بود و جزئیات نهایی‌اش ممکن است تغییر کند، در حالی که انتروپیک و انویدیا هنوز بیانیه‌ای در این رابطه منتشر نکرده‌اند. سرمایه‌گذاران کلیدی معمولا پیش از عرضه گسترده، متعهد به خرید بخش مشخصی از سهام می‌شوند. در سال ۲۰۲۵، انویدیا اعلام کرده بود تا ۱۰ میلیارد دلار در انتروپیک سرمایه‌گذاری می‌کند و در مقابل، توسعه‌دهنده‌ی مدل هوش مصنوعی Claude متعهد به خرید ۳۰ میلیارد دلار ظرفیت پردازشی مایکروسافت آژور مجهز به تراشه‌های انویدیا شد. غول‌های فناوری متعددی مانند آمازون و گوگل نیز در جمع حامیان انتروپیک حضور دارند. طبق توافق‌های پیشین، انتروپیک متعهد به تخصیص بیش از ۱۰۰ میلیارد دلار طی یک دهه به بخش ابری آمازون و استفاده از بیش از یک میلیون تراشه Trainium2 شده و با همکاری گوگل و برودکام نیز در پی افزایش چندین گیگاواتی ظرفیت پردازنده‌های TPU است."}, {"source": "Zoomit", "title": "چرا الکتریسیته‌ ساکن هنوز یکی از معماهای حل‌نشده‌ علم است؟", "link": "https://www.zoomit.ir/fundamental-science/465583-static-electricity-physics-mystery/", "summary": "دانشمندان هنوز پاسخ روشنی برای یکی از بنیادی‌ترین پرسش‌های الکتریسیته‌ ساکن ندارند: هنگام تماس دو ماده، چه چیزی باعث انتقال بار الکتریکی می‌شود؟", "date_str": "2026-09-13T13:30:00+00:00", "hash": "61303c1947b74acc", "title_fa": "چرا الکتریسیته‌ ساکن هنوز یکی از معماهای حل‌نشده‌ علم است؟", "summary_fa": "چرا الکتریسیته‌ ساکن هنوز یکی از معماهای حل‌نشده‌ علم است؟ یک‌شنبه ۲۲ شهریور ۱۴۰۵ مطالعه ۸ دقیقه مریم صفدری دانشمندان هنوز پاسخ روشنی برای یکی از بنیادی‌ترین پرسش‌های الکتریسیته‌ ساکن ندارند: هنگام تماس دو ماده، چه چیزی باعث انتقال بار الکتریکی می‌شود؟ همه‌ی ما الکتریسیته ساکن را به شکلی تجربه کرده‌ایم؛ همان نیرویی که موها را پس از مالیدن بادکنک سیخ می‌کند یا با لمس یک سطح فلزی، شوک کوتاهی به دستمان می‌دهد. عجیب این است که دانشمندان با وجود قرن‌ها مطالعه، هنوز دقیقاً نمی‌دانند هنگام ایجاد این بار الکتریکی چه اتفاقی می‌افتد. گالین گروژان در آزمایش‌های خود با چند دانه‌ی کوچک شیشه‌ای با دقتی شبیه کار با نمونه‌های بسیار حساس کار می‌کرد. او دانه‌ها را تمیز و با موچین جابه‌جا می‌کرد و تا حد امکان مانع تماس آنها با هر سطحی می‌شد؛ زیرا حتی یک تماس ناخواسته می‌توانست ویژگی‌های الکتریکی سطحشان را تغییر دهد. گروژان، فیزیکدانی که هنگام انجام این آزمایش‌ها در مؤسسه‌ی علم و فناوری اتریش کار می‌کرد، برای جلوگیری از تماس مستقیم، یک دانه‌ی شیشه‌ای را با کمک امواج فراصوت در هوا معلق نگه می‌داشت. سپس امواج را قطع می‌کرد تا دانه روی صفحه‌ای شیشه‌ای سقوط کند و چند میلی‌ثانیه بعد دوباره آن را با نیروی صوتی در هوا می‌گرفت. هدف، بررسی یکی از قدیمی‌ترین و درعین‌حال عجیب‌ترین مسائل فیزیک بود: الکتریسیته ساکن. افلاطون حدود ۳۶۰ سال پیش از میلاد درباره‌ی خاصیت کهربای مالیده‌شده در جذب اجسام نوشته بود مشکل آنجاست که پدیده‌ای تا این حد آشنا هنوز از نظر بنیادی به‌خوبی شناخته نشده است. دانشمندان می‌دانند وقتی دو جسم با هم تماس پیدا می‌کنند یا روی یکدیگر مالیده می‌شوند، می‌توانند بار الکتریکی مبادله کنند؛ اما در بسیاری از مواد مشخص نیست دقیقاً چه چیزی منتقل می‌شود و چه عاملی جهت این انتقال را تعیین می‌کند."}, {"source": "Zoomit", "title": "«رهن سالیانه اقامت»، راهکار گروه هتل‌های دُنسه برای رفاهیات شرکت‌ها و سازمان‌ها", "link": "https://www.zoomit.ir/iran-news/467141-donse-hotels-annual-corporate-stay/", "summary": "هتل‌های دُنسه با طرح رهن سالیانه، امکان استفاده شرکت‌ها از ظرفیت‌های اقامتی را با بازگشت اصل ودیعه در پایان قرارداد فراهم کرد.", "date_str": "2026-09-13T13:05:00+00:00", "hash": "5ce46e9d41fdbc4c", "title_fa": "«رهن سالیانه اقامت»، راهکار گروه هتل‌های دُنسه برای رفاهیات شرکت‌ها و سازمان‌ها", "summary_fa": "هتل‌های دُنسه با طرح رهن سالیانه، امکان استفاده شرکت‌ها از ظرفیت‌های اقامتی را با بازگشت اصل ودیعه در پایان قرارداد فراهم کرد. تبلیغات گروه هتل‌های دُنسه با ارائه طرح «رهن سالیانه دُنسه»، امکان دسترسی سازمان‌ها و شرکت‌ها به ظرفیت اقامتی در مقاصد مختلف را برای استفاده کارکنان، سفرهای کاری و برنامه‌های سازمانی فراهم کرده است. در این مدل، سازمان‌ها با اختصاص مبلغی به‌عنوان رهن، در طول مدت قرارداد از ظرفیت مشخص اقامتی در مجموعه هتل‌ها و اقامتگاه‌های دُنسه استفاده می‌کنند و در پایان قرارداد، اصل مبلغ رهن به آن‌ها بازگردانده می‌شود. این طرح با هدف ایجاد یک راهکار منعطف برای مدیریت هزینه‌های اقامت سازمانی و توسعه خدمات رفاهی کارکنان طراحی شده است. شرکت‌ها می‌توانند ظرفیت در اختیار خود را متناسب با نیازشان در مقاصد مختلف مورد استفاده قرار دهند و برخلاف مدل‌هایی که یک سازمان را به یک شهر یا اقامتگاه مشخص محدود می‌کنند، امکان جابه‌جایی ظرفیت میان هتل‌ها و مقاصد مختلف دُنسه را خواهند داشت. در قالب این سرویس، ظرفیت اقامتی سازمان می‌تواند برای سفرهای کاری، سفرهای رفاهی کارکنان، برنامه‌های تیم‌سازی، نشست‌های مدیریتی، همایش‌ها و سایر رویدادهای سازمانی مورد استفاده قرار گیرد. سازمان‌های طرف قرارداد همچنین در صورت نیاز می‌توانند بیش از ظرفیت تعیین‌شده در قرارداد از خدمات اقامتی دُنسه استفاده کنند. این ظرفیت مازاد با ۲۰ درصد تخفیف نسبت به نرخ فروش عمومی در اختیار آن‌ها قرار می‌گیرد. تاکنون شرکت‌هایی مانند ایرانسل، دیجی‌کالا، دیجی‌پی، مپنا، کارگزاری مفید، بانک رفاه، شرکت ملی گاز ایران و شرکت طراحی و ساختمان نفت، از این سرویس برای رفاهیات سازمانی خود استفاده کرده‌اند. طرح رهن سالیانه دُنسه در کنار مدیریت هزینه‌های سفر، می‌تواند به‌عنوان بخشی از بسته مزایای رفاهی و منابع انسانی سازمان‌ها مورد استفاده قرار گیرد؛ مزیتی که شرکت‌ها می‌توانند از آن برای افزایش رضایت کارکنان و تقویت برنامه‌های جذب و نگهداشت نیروی انسانی استفاده کنند."}, {"source": "Zoomit", "title": "خبر بد برای غول‌های هوش مصنوعی؛ سناتورهای آمریکا در پی وضع قوانین سخت‌گیرانه هستند", "link": "https://www.zoomit.ir/ai-articles/467068-us-senate-ai-safety-legislation/", "summary": "مذاکره‌کنندگان سنای آمریکا در حال بررسی طرحی هستند که توسعه‌دهندگان هوش مصنوعی را ملزم به تضمین ایمنی محصولات پیشرفته می‌کند.", "date_str": "2026-09-13T12:50:00+00:00", "hash": "0c87d1ca8e8de24d", "title_fa": "خبر بد برای غول‌های هوش مصنوعی؛ سناتورهای آمریکا در پی وضع قوانین سخت‌گیرانه هستند", "summary_fa": "مذاکره‌کنندگان سنای آمریکا در حال بررسی طرحی هستند که توسعه‌دهندگان هوش مصنوعی را ملزم به تضمین ایمنی محصولات پیشرفته می‌کند. تبلیغات مذاکره‌کنندگان سنای آمریکا روی پیش‌نویس قانونی کار می‌کنند که شرکت‌های فناوری را موظف به طراحی ایمن مدل‌های هوش مصنوعی می‌کند و در صورت تلاش دولت برای مسدودسازی انتشار آن‌ها، پای دادگاه‌های فدرال را به میان می‌کشد. هدف اصلی این طرح ایجاد الزام حقوقی موسوم به «وظیفه‌ی مراقبت» برای توسعه‌دهندگان هوش مصنوعی به‌منظور جلوگیری از خطرات فاجعه‌بار است. به روایت رویترز ، طرح سنا به دولت آمریکا اختیار می‌دهد تا از انتشار مدل‌های ناامن جلوگیری کند؛ هرچند شرکت‌ها می‌توانند علیه تصمیمات یادشده در دادگاه شکایت کنند. لایحه‌ی پیشنهادی همچنین قوانین ایالتی مستقل پیرامون خطرات هوش مصنوعی نظیر سوءاستفاده‌ی احتمالی برای طراحی سلاح‌های هسته‌ای یا بیولوژیکی را باطل می‌کند و متمرکز بر پیشرفته‌ترین سامانه‌های شرکت‌هایی چون گوگل، آنتروپیک و اوپن‌ای‌آی خواهد بود. امی کلوبوچار ، سناتور دموکرات درگیر در مذاکرات، گفت: «من به تلاش برای رسیدن به توافقی دوحزبی درباره‌ی قانون نظارت دولت بر بزرگ‌ترین خطرات مدل‌های هوش مصنوعی ادامه می‌دهم. چنین توافقی شامل الزام توسعه‌دهندگان به همکاری با کارشناسان دولتی برای اعتبارسنجی و آزمایش مدل‌ها جهت اطمینان از ایمنی هوش مصنوعی است.» ماریا کانتول ، سناتور ارشد دموکرات در کمیته‌ی بازرگانی سنا، در پیامی اعلام کرد: «قانون‌گذاری معنادار مستلزم آن است که قدرتمندترین مدل‌های هوش مصنوعی توسط دانشمندان و کارشناسان آزمایشگاه‌های ملی ما مورد آزمایش قرار بگیرند تا مشخص شود که آیا توانایی تسهیل حملات پیچیده‌ی سایبری یا کمک به ساخت سلاح‌های بیولوژیکی یا هسته‌ای را دارند یا خیر.»"}, {"source": "Zoomit", "title": "نامه انجمن VOD به پزشکیان: تنظیم‌گری باید بر عهده نهاد متولی فرهنگ باشد، نه صداوسیما", "link": "https://www.zoomit.ir/iran-news/467134-vod-association-pezeshkian-satra-regulation/", "summary": "انجمن وی‌اودی در نامه‌ای به رئیس‌جمهور نوشت: تنظیم‌گری باید بر عهده نهاد پاسخ‌گو و متولی فرهنگ باشد نه صدا‌وسیما که خودش رقیب این صنعت است.", "date_str": "2026-09-13T12:30:00+00:00", "hash": "c48fcbf5184584ee", "title_fa": "نامه انجمن VOD به پزشکیان: تنظیم‌گری باید بر عهده نهاد متولی فرهنگ باشد، نه صداوسیما", "summary_fa": "انجمن وی‌اودی در نامه‌ای به رئیس‌جمهور نوشت: تنظیم‌گری باید بر عهده نهاد پاسخ‌گو و متولی فرهنگ باشد نه صدا‌وسیما که خودش رقیب این صنعت است. تبلیغات هیئت‌مدیره انجمن صنفی شرکت‌های نمایش ویدیوی آنلاین در نامه‌ای خطاب به مسعود پزشکیان، رئیس‌جمهور، نسبت به وضعیت تنظیم‌گری شبکه نمایش خانگی اعتراض کرد. امضاکنندگان این نامه می‌گویند تأخیر و ابهام در صدور مجوزهای ساترا، فعالیت حرفه‌ای، سرمایه‌گذاری و اشتغال در این حوزه را مختل کرده است. به گزارش انجمن صنفی شرکت‌های نمایش ویدیویی آنلاین، این نامه به امضای علی سرتیپی، مدیر فیلم‌نت؛ محمدجواد شکوری‌مقدم، مدیر فیلیمو؛ محمدحسین میرطاووسی، مدیر نماوا؛ سعید رسول‌اف، مدیر چارخونه و محمد صراف، از اعضای هیئت‌مدیره انجمن رسیده است. انجمن در این نامه تأکید کرده که ادامه وضعیت موجود در فرایند صدور مجوزهای تولید و پخش، به دلسردی و کوچ بسیاری از تولیدکنندگان به شبکه‌های ماهواره‌ای، پلتفرم‌های خارجی و تولیدات زیرزمینی منجر شده است. به گفته نویسندگان نامه، بسیاری از درخواست‌های مجوز، به‌ویژه مجوز پخش، به‌دلیل نبود ضوابط مشخص و مورد قبول، به نتیجه روشنی نمی‌رسند یا رسیدگی به آن‌ها چنان با تأخیر و ابهام همراه می‌شود که امکان برنامه‌ریزی برای تولید، سرمایه‌گذاری و انتشار آثار را از صاحبان آن‌ها می‌گیرد. اعضای هیئت‌مدیره انجمن با پذیرش اختیار قانونی تنظیم‌گر برای موافقت یا مخالفت بر اساس ضوابط مصوب، تأکید کرده‌اند که این اختیار نباید به بی‌تصمیمی، تعلیق درخواست‌ها و پاسخ‌گو نبودن در بازه زمانی معقول منجر شود."}, {"source": "Zoomit", "title": "رسول جلیلی: بازگشایی اینستاگرام برخلاف عقلانیت و انصاف است/ مصوبات ستاد راهبری فضای مجازی قابلیت اجرا ندارد", "link": "https://www.zoomit.ir/iran-news/467136-rasool-jalili-latest-statements/", "summary": "عضو حقیقی شورای عالی فضای مجازی تشکیل ستاد راهبری فضای مجازی را غیرقانونی دانست و خواستار توقف مصوبه فعالیت دستگاه‌های دولتی در سکوهای خارجی شد.", "date_str": "2026-09-13T12:22:21+00:00", "hash": "571e1a7148cc713e", "title_fa": "رسول جلیلی: بازگشایی اینستاگرام برخلاف عقلانیت و انصاف است/ مصوبات ستاد راهبری فضای مجازی قابلیت اجرا ندارد", "summary_fa": "عضو حقیقی شورای عالی فضای مجازی تشکیل ستاد راهبری فضای مجازی را غیرقانونی دانست و خواستار توقف مصوبه فعالیت دستگاه‌های دولتی در سکوهای خارجی شد. تبلیغات رسول جلیلی، عضو حقیقی شورای عالی فضای مجازی، از مدافعان سرسخت فیلترینگ و حامیان طرح‌های محدودکننده‌ای مثل صیانت در گفت‌وگو با مهر مثل همیشه با موضوعاتی مثل رفع فیلتر مخالفت کرده و هم‌چنین مصوبات ستاد ویژه راهبری و ساماندهی فضای مجازی را زیر سوال برده است. او در خصوص ستاد ویژه که به دستور رئیس‌جمهور تشکیل شده اشاره کرده و آن را یک نهاد موازی با شورای عالی فضای مجازی خواند: «تاسیس این ستاد، از عنوان آن گرفته تا متنی که به‌عنوان پیوست دستور رئیس‌جمهور به معاون اول ابلاغ شد، عملا ایجاد یک نهاد کاملا موازی با شورای عالی فضای مجازی بود. هر کسی که اسناد و مصوبات حوزه حکمرانی فضای مجازی طی یک و نیم دهه اخیر را مطالعه کرده باشد، با مشاهده مستندات این ستاد، بدون تردید درمی‌یابد که شکل‌گیری یک ساختار موازی به‌وضوح رخ داده است.» او که از ابتدا جزو چهار نفر عضو شورای عالی فضای مجازی بود که شکایت از تشکیل این ستاد را نزد دیوان عدالت اداری برد، در این خصوص توضیح داد: «بر همین اساس، چهار نفر از اعضای حقیقی شورای عالی فضای مجازی که قاعدتا صیانت از حریم قانون را وظیفه ذاتی خود می‌دانند، نسبت به این موضوع اعتراض کردند. مسیر قانونی این اعتراض نیز از طریق پیگیری در قوه قضاییه و دیوان عدالت اداری طی شد.» کپی لینک جلیلی مختومه‌ شدن پرونده شکایت را غیرمنتظره می‌داند عضو حقیقی شورای عالی فضای مجازی درباره سرنوشت شکایت اعضای این شورا در
