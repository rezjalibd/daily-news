    .news-link {

      transition: color 0.2s ease;

      text-decoration: underline;

    .modal-overlay {

      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;

    .modal-card {

    @media (max-width: 640px) {

      .footer-bottom-row { width: 100%; display: flex; justify-content: space-between; align-items: center; }
    }
  </style>
</head>

رین هسته‌ای «مطالبه ملی» است", "link": "https://www.bbc.com/persian/articles/cq98zre0j9d1o?at_medium=RSS&at_campaign=rss", "summary": "محمدجواد حاج‌علی‌اکبری، امام جمعه موقت تهران، خواستار بازنگری در دکترین هسته‌ای جمهوری اسلامی ایران است.", "date_str": "2026-10-30T17:39:22+00:00", "hash": "73ef42a8fd7acf39", "title_fa": "امام جمعه موقت تهران: تغییر دکترین هسته‌ای «مطالبه ملی» است", "summary_fa": "محمدجواد حاج‌علی‌اکبری، امام جمعه موقت تهران، خواستار بازنگری در دکترین هسته‌ای جمهوری اسلامی ایران است. در ادبیات سیاسی و موضوعات مرتبط با اشاعه تسلیحات هسته‌ای، بازنگری در دکترین هسته‌ای می‌تواند به معنای تغییر سیاست درباره دستیابی به سلاح اتمی باشد. آقای حاج‌علی‌اکبری امروز، هشتم آبان/۳۰ اکتبر، در خطبه‌های نماز جمعه تهران گفت که این موضوع به یک «مطالبه ملی» تبدیل شده است. ایران از سوی کشورهای غربی با اتهام تلاش برای دستیابی به تسلیحات هسته‌ای در پوشش یک برنامه صلح‌آمیز روبه‌روست، اما همواره این اتهام را رد کرده و می‌گوید که برنامه هسته‌ای آن فقط اهداف صلح‌آمیز دارد. امام جمعه موقت تهران در اظهاراتی متفاوت از گذشته گفت: «این موضوع واکنشی شتاب‌زده و هیجانی نیست، بلکه برآمده از آگاهی و تجربه تاریخی ملت ایران در مواجهه با بدعهدی‌های آمریکاست و ریشه در حق ملت برای برخورداری از امنیت و زندگی عزتمندانه دارد.» آقای حاج‌علی‌اکبری می‌گوید که بر اساس برخی نظرسنجی‌های پیشین، بیش از «۷۰ درصد مردم از تغییر دکترین هسته‌ای حمایت می‌کنند»، اما به منبع این نظرسنجی‌ها اشاره نکرد. او از کارشناسان خواست پیشنهادهای خود را با همکاری نهادهای مسئول تهیه و برای تصمیم‌گیری نهایی به مجتبی خامنه‌ای ارائه کنند. امام جمعه موقت تهران گفت: «چرا نباید در دکترین هسته‌ای تجدیدنظر کنیم؟ ملت ایران در طول سال‌های گذشته تجربه‌های دردناکی از رفتار آمریکا داشته است؛ طرف مقابل از خطوط قرمز ملت ایران عبور کرده» و «به تعهدات و توافق‌های خود پایبند نمانده است.» او افزود: «ملت ایران در مسیرهای مختلف فرصت تعامل و توافق را فراهم کرده، اما تجربه بدعهدی‌های طرف مقابل، ضرورت بازنگری در برخی محاسبات امنیتی را به یک موضوع جدی تبدیل کرده است.» خبرنامه بی‌بی‌سی فارسی گزیده‌ای از مهم‌ترین خبرها، گزارش‌های میدانی و گفت‌وگوهای تشدید نظارت بر مبادلات مالی با میانمار شد. گروه ویژه اقدام مالی (اف‌ای‌تی‌اف) بار دیگر ایران، کره شمالی و میانمار را در فهرست کشورهای پرخطر، موسوم به «فهرست سیاه»، حفظ کرد و خواستار تداوم اقدامات مقابله‌ای علیه ایران و کره شمالی و نظارت شدیدتر بر مبادلات مالی با میانمار شد. این نهاد بین‌المللی روز جمعه هشتم آبان در بیانیه‌ای اعلام کرد که این سه کشور همچنان با کاستی‌های اساسی در نظام‌های مقابله با پول‌شویی، تأمین مالی تروریسم و تأمین مالی گسترش سلاح‌های کشتار جمعی روبه‌رو هستند. گروه ویژه اقدام مالی که مقر آن در پاریس است، تلاش‌های بیش از ۲۰۰ کشور و حوزه قضایی را برای مقابله با پول‌شویی، تأمین مالی تروریسم و تأمین مالی گسترش سلاح‌های کشتار جمعی تدوین می‌کند و بر اجرای آن‌ها نظارت دارد. گروه ویژه اقدام مالی در بخش مربوط به ایران اعلام کرد که با وجود ازسرگیری تعامل تهران با این نهاد، جمهوری اسلامی همچنان نتوانسته است بخش عمده‌ای از تعهدات خود را در چارچوب برنامۀ اقدام برای مقابله با پول‌شویی و تأمین مالی تروریسم اجرا کند. بر اساس این بیانیه، ایران در سپتامبر ۲۰۲۶ اطلاعات تازه‌ای دربارۀ اقدامات خود برای رفع کاستی‌های شناسایی‌شده ارائه کرده است. اف‌ای‌تی‌اف اعلام کرد ایران با تدوین چارچوبی برای دریافت درخواست‌های بین‌المللی مسدودسازی دارایی‌ها، پیشرفت محدودی در انطباق فنی با استانداردهای این نهاد داشته است، اما نظام مقابله با پول‌شویی و تأمین مالی تروریسم در این کشور همچنان با کاستی‌های بنیادین روبه‌رو است. به‌گفتۀ این نهاد، چارچوب قانونی ایران تأمین مالی تروریسم را به شکل کافی جرم‌انگاری نمی‌کند و سازوکار تحریم‌های مالی هدفمند نیز با استانداردهای بین‌المللی مطابقت ندارد.", "image_url": "https://gdb.rferl.org/F6D7A6F6-5567-452F-ADD6-D32DED910874.jpg", "category": "هوش مصنوعی مولد", "tags": ["روابط بین‌الملل"], "datetime_fa": "۸ آبان • ۲۱:۰۹"}, {"source": "IranWire", "title": "تایید بازداشت دو زن لیتوانیایی در ایران؛ ادامه تلاش‌ها برای دسترسی کنسولی", "link": "https://iranwire.com/fa/news-1/159602-%D8%AA%D8%A7%DB%8C%DB%8C%D8%AF-%D8%A8%D8%A7%D8%B2%D8%AF%D8%A7%D8%B4%D8%AA-%D8%AF%D9%88-%D8%B2%D9%86-%D9%84%DB%8C%D8%AA%D9%88%D8%A7%D9%86%DB%8C%D8%A7%DB%8C%DB%8C-%D8%AF%D8%B1-%D8%A7%DB%8C%D8%B1%D8%A7%D9%86-%D8%AA%D9%84%D8%A7%D8%B4-%D8%A8%D8%B1%D8%A7%DB%8C-%D8%AF%D8%B3%D8%AA%D8%B1%D8%B3%DB%8C-%DA%A9%D9%86%D8%B3%D9%88%D9%84%DB%8C-%D8%A7%D8%AF%D8%A7%D9%85%D9%87-%D8%AF%D8%A7%D8%B1%D8%AF/", "summary": "وزارت خارجۀ لیتوانی اعلام کرد مقامات جمهوری اسلامی بازداشت دو زن شهروند این کشور در ایران را تأیید کرده‌اند، اما علت بازداشت آن‌ها نامشخ ...", "date_str": "2026-10-30T16:09:42+00:00", "hash": "2d3b905c4566a7b5", "title_fa": "تایید بازداشت دو زن لیتوانیایی در ایران؛ ادامه تلاش‌ها برای دسترسی کنسولی", "summary_fa": "وزارت خارجۀ لیتوانی اعلام کرد مقامات جمهوری اسلامی بازداشت دو زن شهروند این کشور در ایران را تأیید کرده‌اند، اما علت بازداشت آن‌ها نامشخ ... تصاویر دایوا زاکاژاوسکایته (چپ) و اریکا شلیمایته، دو شهروند لیتوانیایی بازداشت‌شده در ایران، که پلیس منطقه‌ای ویلنیوس در لیتوانی منتشر کرده است وزارت خارجۀ لیتوانی اعلام کرد مقامات جمهوری اسلامی بازداشت دو زن شهروند این کشور در ایران را تأیید کرده‌اند، اما علت بازداشت آن‌ها نامشخص است و دیپلمات‌های لیتوانی هنوز موفق به تماس مستقیم با این دو نفر نشده‌اند. بر اساس گزارش‌های رادیو و تلویزیون ملی لیتوانی، هویت این دو زن «دایوا زاکاژاوسکایته» و «اریکا شلیمایته» اعلام شده و گفته می‌شود برای گردشگری به ایران سفر کرده بودند. آن‌ها روز ۲۳مهر۱۴۰۵ بازداشت شدند و خبر بازداشت آن‌ها روز پنجم آبان به اطلاع مقامات ارشد وزارت خارجۀ لیتوانی رسیده است. «استاکنیه‌نه» وزیر خارجه این کشور از اظهارنظر دربارۀ علت بازداشت این دو زن خودداری کرد و گفت این تازه‌ترین اطلاعات رسمی است که در اختیار دولت لیتوانی قرار گرفته است. به گفته وزیر خارجه، مقام‌های لیتوانی در تلاش‌اند هرچه سریع‌تر امکان ملاقات کنسولی با دو زن بازداشت شده را فراهم کنند تا از شرایط نگهداری، وضعیت سلامت و دسترسی آن‌ها به وکیل، دارو و خدمات ترجمه مطلع شوند. به‌گفتۀ او، احتمالاً یک مامور کنسولی از دیگر کشورهای عضو اتحادیۀ اروپا برای انجام این ماموریت کمک خواهد کرد. خواهر دایوا زاکاژاوسکایته، در گفت‌وگو با رادیو تلویزیون ملی لیتوانی گفته است که در جریان سفر خواهرش به ایران به‌طور مرتب با او در ارتباط بوده، اما پس از آنکه این دو زن برای گردش به منطقه‌ای بیابانی رفتند، تماس با آن‌ها قطع شد. روتا کورساکینه در ادامه گفته است پیش از تایید رسمی خبر بازداشت، از طریق «منابع غیررسمی» از وضعیت خواهرش مطلع شده و اطلاعاتی را برای بررسی در اختیار وزارت خارجۀ لیتوانی قرار داده بود.", "image_url": "https://static.prod.iranwire.com/_versions_jpeg/articleslide/Screenshot_2026-10-30_at_12.01.35PM_mkVN__v1024x512__box_0%2C5%2C2458%2C1297.jpeg", "category": "اقتصاد و بازرگانی", "tags": ["رویداد", "گزارش"], "datetime_fa": "۸ آبان • ۱۹:۳۹"}, {"source": "Euronews Persian", "title": "از وعده درآمد میلیاردی تا عقب‌نشینی در مذاکرات؛ چه بر سر مطالبه عوارض هرمز آمد؟", "link": "https://parsi.euronews.com/2026/10/30/iran-hormuz-strait-tolls-retreat-negotiations", "summary": "مقام‌های جمهوری اسلامی در بهار امسال از دریافت عوارض عبور نفتکش‌ها از تنگه هرمز و واریز نخستین درآمدها به حساب بانک مرکزی خبر می‌دادند. اما چند ماه بعد، مطالبه عوارض از محور اصلی مذاکرات و سخنرانی‌های پرشور آنها حذف شد.", "date_str": "2026-10-30T16:24:16+00:00", "hash": "6fbc6af85486e955", "title_fa": "از وعده درآمد میلیاردی تا عقب‌نشینی در مذاکرات؛ چه بر سر مطالبه عوارض هرمز آمد؟", "summary_fa": "مقام‌های جمهوری اسلامی در بهار امسال از دریافت عوارض عبور نفتکش‌ها از تنگه هرمز و واریز نخستین درآمدها به حساب بانک مرکزی خبر می‌دادند. اما چند ماه بعد، مطالبه عوارض از محور اصلی مذاکرات و سخنرانی‌های پرشور آنها حذف شد.", "image_url": "https://images.euronews.com/articles/stories/09/97/38/38/1200x675_cmsv2_91a28b00-662e-5cbc-9614-eee956c78143-9973838.jpg", "category": "اقتصاد و بازرگانی", "tags": ["روابط بین‌الملل"], "datetime_fa": "۸ آبان • ۱۹:۵۴"}, {"source": "BBC Persian", "title": "غیبت علی‌اف در نشست کشورهای ترک؛ تنش میان باکو و آنکارا آشکارتر شد", "link": "https://www.bbc.com/persian/articles/cjx2310gpxzpo?at_medium=RSS&at_campaign=rss", "summary": "الهام علی‌اف، رئیس‌جمهور جمهوری آذربایجان، با وجود دعوت شخصی رجب طیب اردوغان، همتای ترکیه‌ای خود، در نشست سران کشورهای ترک شرکت نکرد.", "date_str": "2026-10-30T16:58:25+00:00", "hash": "ac1466d48ee6c2d7", "title_fa": "غیبت علی‌اف در نشست کشورهای ترک؛ تنش میان باکو و آنکارا آشکارتر شد", "summary_fa": "الهام علی‌اف، رئیس‌جمهور جمهوری آذربایجان، با وجود دعوت شخصی رجب طیب اردوغان، همتای ترکیه‌ای خود، در نشست سران کشورهای ترک شرکت نکرد. رسانه‌های بین‌المللی غیبت آقای علی‌اف را نشانه‌ای دیگر از تیرگی روابط ترکیه و جمهوری آذربایجان دانستند. در هفته‌های اخیر، انتقاد مقام‌ها و چهره‌های سیاسی ترکیه از مقررات جدید حجاب در آذربایجان به اختلافات دو کشور دامن زده است. آذربایجان مقررات جدیدی برای پوشش دانش‌آموزان و معلمان وضع کرده که اگرچه به‌صراحت حجاب را ممنوع نکرده، اما گزارش‌هایی از جلوگیری از ورود دختران محجبه به مدارس و محدودیت فعالیت معلمان محجبه منتشر شده است. آذربایجان می‌گوید که این مقررات بر مبنای اصول سکولار تنظیم شده است. رجب طیب اردوغان، رئیس‌جمهور ترکیه، روز جمعه در نشست آنکارا، بدون نام بردن از جمهوری آذربایجان گفت: «در تصویر خانواده ما جایی برای جدایی، تفرقه یا درگیری نیست. همه ما یکی هستیم و در کنار هم قرار داریم و به خواست خدا، تا ابد برادر خواهیم ماند.» جیحون بایراموف، وزیر خارجه جمهوری آذربایجان، نمایندگی این کشور در نشست سران کشورهای ترک را بر عهده داشت. او پس از سخنرانی آقای اردوغان، بدون اشاره به تنش‌های اخیر، از ترکیه به خاطر میزبانی نشست تشکر کرد. چنین سطحی از تنش در روابط ترکیه و جمهوری آذربایجان کم‌سابقه است. تیرگی روابط دو کشور در حالی است که پس از حمایت ترکیه از جمهوری آذربایجان در جنگ قره‌باغ کوهستانی در سال ۲۰۲۳، همکاری‌های دو کشور به سطح بی‌سابقه‌ای رسیده بود. ترکیه از خریداران اصلی گاز طبیعی جمهوری آذربایجان است. آقای اردوغان در همین هفته یکی از مشاورانش را پس از انتقاد علنی او از تصمیم جمهوری آذربایجان درباره حجاب در مدارس برکنار کرده بود. دفتر ریاست‌جمهوری ترکیه اعلام کرد که آقای اردوغان هفته گذشته نیز در جریان یک تماس تلفنی، شخصاً از الهام علی‌اف دعوت کرده بود تا در نشست سازمان کشورهای ترک شرکت کند.", "image_url": "https://ichef.bbci.co.uk/news/1200/branded_persian/6d17/live/a4354420-d481-11f1-a701-fddedf244c16.png", "category": "سیاست و دیپلماسی", "tags": ["رویداد", "گزارش"], "datetime_fa": "۸ آبان • ۲۰:۲۸"}, {"source": "BBC Persian", "title": "زن محکوم به اعدام که از دو تزریق جان به در برد: از آن زمان لحظه‌ای بی‌درد نبوده‌ام", "link": "https://www.bbc.com/persian/articles/c5n49pl07r43o?at_medium=RSS&at_campaign=rss", "summary": "کریستا پایک، زندانی زن محکوم به اعدام در ایالت تنسی آمریکا که بیش از یک ماه پیش، از تزریق دو دوز داروی کشنده جان سالم به در برد، اولین بیانیه عمومی خود را منتشر کرده است.", "date_str": "2026-10-30T16:11:05+00:00", "hash": "ddb30a9f3d5bdf73", "title_fa": "زن محکوم به اعدام که از دو تزریق جان به در برد: از آن زمان لحظه‌ای بی‌درد نبوده‌ام", "summary_fa": "کریستا پایک، زندانی زن محکوم به اعدام در ایالت تنسی آمریکا که بیش از یک ماه پیش، از تزریق دو دوز داروی کشنده جان سالم به در برد، اولین بیانیه عمومی خود را منتشر کرده است. او در این بیانیه گفته است که از آن زمان، حتی یک لحظه هم نبوده که درد جسمانی یا روحی نکشیده باشد. خانم پایک پس از ناکامی مقام‌های زندان در اجرای حکم اعدامش، به بیمارستان منتقل و بعداً مرخص شد. در جریان تلاش برای اجرای حکم، دو دوز از داروی پنتوباربیتال به او تزریق شده بود، اما او زنده ماند. خانم پایک روز جمعه در بیانیه‌ای که اعضای تیم حقوقی او در شبکه‌های اجتماعی منتشر کردند، گفت بدنش، بازوهایش، دست‌هایش و گلویش درد می‌کند و به‌سختی می‌تواند صحبت کند. پرونده او و روند اجرای حکم اعدامش باعث انتقاد شدید طرفداران و مخالفان مجازات اعدام شد. کریستا پایک از سی سال قبل به دلیل قتل و شکنجه کالین اسلمر، یکی از همکلاسی‌هایش، در انتظار اجرای حکم اعدام بوده است. هنوز مشخص نیست که آیا ایالت تنسی آمریکا قصد دارد در آینده حکم اعدام او را اجرا کند یا نه. خانم پایک حالا پنجاه ساله است و به همان زندانی بازگردانده شده که طی سی سال اخیر در آن حبس بوده است. خبرنامه بی‌بی‌سی فارسی گزیده‌ای از مهم‌ترین خبرها، گزارش‌های میدانی و گفت‌وگوهای اختصاصی را هر هفته در ایمیل خود دریافت کنید. گمان می‌رود او تنها فردی باشد که از تلاش برای اعدام از طریق تزریق داروی کشنده جان به در برده است. پیش‌تر، وکلای خانم پایک گفته بودند که او پس از آنکه از تلاش برای اعدام جان به در برد، به ذات‌الریه مبتلا شده، بازوهایش به‌شدت ورم کرده و توانایی بلعیدن را نیز از دست داده است. او در بیانیه‌اش گفته است: «در حال بهبودی هستم و می‌دانم که روزبه‌روز ی جمهوری اسلامی با نصب مین‌های چسبان بر بدنه یک نفتکش در تنگه هرمز به آن حمله کردند؛ نخستین عملیات از این نوع از سال ۲۰۱۹ که می‌تواند نشانه تغییر تاکتیک تهران برای مختل کردن کشتیرانی باشد.", "image_url": "https://i.iranintl.com/images/rdk9umy0/production/e6810ffbeb01c06cc090bb0031ce9b3b3b5d131f-1280x853.jpg?rect=0,91,1280,672&w=1200&h=630&q=66&fit=max&auto=format", "category": "جامعه و رویدادها", "tags": ["رویداد", "گزارش"], "datetime_fa": "۸ آبان • ۱۹:۱۴"}, {"source": "Iran International", "title": "مدال برنز مسابقات جهانی آستانه برای حسن یزدانی و رحمان عموزاد", "link": "https://www.iranintl.com/202610300080", "summary": "حسن یزدانی و رحمان عموزاد، دو نماینده کشتی آزاد ایران، با پیروزی در دیدارهای رده‌بندی رقابت‌های قهرمانی جهان در آستانه قزاقستان، به مدال برنز رسیدند.", "date_str": "2026-10-30T15:16:28+00:00", "hash": "24aac4d2767b842a", "title_fa": "مدال برنز مسابقات جهانی آستانه برای حسن یزدانی و رحمان عموزاد", "summary_fa": "حسن یزدانی و رحمان عموزاد، دو نماینده کشتی آزاد ایران، با پیروزی در دیدارهای رده‌بندی رقابت‌های قهرمانی جهان در آستانه قزاقستان، به مدال برنز رسیدند.", "image_url": "https://i.iranintl.com/images/rdk9umy0/production/db59e6e5dae5461b3799fa759783bdb0cfb3783a-2560x1707.jpg?rect=479,210,1588,834&w=1200&h=630&q=66&fit=max&auto=format", "category": "جامعه و رویدادها", "tags": ["رویداد", "گزارش"], "datetime_fa": "۸ آبان • ۱۸:۴۶"}, {"source": "Radio Farda", "title": "سپاه مدعی انفجار سه نفتکش در تنگۀ هرمز شد؛ عمان ۲۵ ملوان یک کشتی را نجات داد", "link": "https://www.radiofarda.com/a/irgc-claims-three-tankers-explode-strait-hormuz-oman-rescues-crew/33887505.html", "summary": "سپاه پاسداران مدعی انفجار سه نفتکش در تنگۀ هرمز شده و عمان از نجات ۲۵ ملوان خبر داده است. این تحولات در حالی رخ می‌دهد که سنتکام بر امنیت مسیرهای اصلی کشتیرانی تأکید دارد.", "date_str": "2026-10-30T15:23:08+00:00", "hash": "9f8c5ac6519f98f6", "title_fa": "سپاه مدعی انفجار سه نفتکش در تنگۀ هرمز شد؛ عمان ۲۵ ملوان یک کشتی را نجات داد", "summary_fa": "سپاه پاسداران مدعی انفجار سه نفتکش در تنگۀ هرمز شده و عمان از نجات ۲۵ ملوان خبر داده است. این تحولات در حالی رخ می‌دهد که سنتکام بر امنیت مسیرهای اصلی کشتیرانی تأکید دارد. نیروی دریایی سپاه پاسداران مدعی شد سه نفتکش هنگام عبور از مسیرهایی که این نیرو «غیرمجاز» می‌خواند، در تنگۀ هرمز دچار آتش‌سوزی و انفجار شده‌اند. هم‌زمان، عمان از نجات ۲۵ خدمۀ یک کشتی تجاری آتش‌گرفته در نزدیکی سواحل خود خبر داد. نیروی دریایی سپاه روز جمعه هشتم آبان در بیانیه‌ای اعلام کرد که سه نفتکش هنگام تلاش برای عبور از مسیرهای «غیرمجاز» در تنگۀ هرمز دچار حادثه شده‌اند. بر اساس این بیانیه، یکی از نفتکش‌ها که حامل دو میلیون بشکه نفت خام بوده، با مین دریایی برخورد کرده است. این در حالی است که فرماندهی مرکزی ارتش آمریکا، سنتکام، بارها ادعای ایران در مورد برخورد کشتی‌ها با مین‌های دریایی هنگام عبور از تنگه هرمز را تکذیب کرده و این گزارش‌ها را نادرست خوانده است. نیروی دریایی سپاه همچنین مدعی شد که یک شناور بدون سرنشین آمریکایی را در بخش شرقی تنگۀ هرمز منهدم کرده است. ارتش آمریکا تاکنون واکنشی به این گزارش نشان نداده است. هم‌زمان، مرکز امنیت دریایی عمان اعلام کرد نیروی دریایی سلطنتی این کشور ۲۵ خدمۀ یک کشتی تجاری با پرچم پاناما را که در نزدیکی سواحل راس مسندام هدف قرار گرفته و دچار آتش‌سوزی شده بود، تخلیه کرده است. به‌گفتۀ این مرکز، کشتی در فاصلۀ ۱.۶ مایل دریایی از سواحل مسندام هدف قرار گرفته و عملیات نجات با هماهنگی مرکز امنیت دریایی انجام شده است. مقام‌های عمان اعلام کردند خدمات پزشکی لازم به خدمۀ کشتی ارائه شده، اما جزئیات بیشتری دربارۀ نوع حمله، عامل آن یا وضعیت کشتی منتشر نکردند. هنوز مشخص نیست حادثۀ گزارش‌شده در سواحل عمان ارتباطی با سه نفتکشی دارد که سپاه از آتش‌سوزی و انفجار در آن‌ها خبر", "image_url": "https://gdb.rferl.org/E349AAFC-B381-4976-B548-CC95535DCF1C.jpg", "category": "هوش مصنوعی مولد", "tags": ["امنیت سایبری"], "datetime_fa": "۸ آبان • ۱۸:۵۳"}, {"source": "Radio Farda", "title": "ترامپ: برای توافق با ایران تضمین می‌خواهیم که هرگز سلاح هسته‌ای نداشته باشد", "link": "https://www.radiofarda.com/a/trump-demands-iran-guarantee-never-develop-nuclear-weapons/33887407.html", "summary": "دونالد ترامپ می‌گوید ایران برای دس       tech: [{"source": "The Guardian AI", "title": "Tech sell-off drives US markets down by nearly $1tn after subpar earnings reports", "link": "https://www.theguardian.com/technology/2026/oct/30/tech-stocks-drop-earnings-report", "summary": "Big tech stocks falter as investors question whether billions being poured into AI can generate returns quickly enough A sell-off of tech stocks that began earlier this month and gained steam with disappointing earnings from leading tech companies drove US markets down by hundreds of billions of dollars Friday. In total, the decline has knocked nearly $1tn in value off the tech-heavy Nasdaq exchange in one week and erased about $2tn in a month. The S P 500, the index of the 500 most valuable companies in the US, fell by more than 1% Friday, losing hundreds of billions of dollars in market value. It was on track to erase its gain for October, even though it set its all-time high during the same month. The weakness for technology stocks dragged the Nasdaq composite down even further, more than 3%, also erasing hundreds of billions in value. The Down Jones Industrial Average fell less. Continue reading...", "date_str": "2026-10-30T18:27:51+00:00", "hash": "a37d2974b1e3068e", "title_fa": "فروش فناوری بازارهای ایالات متحده را تقریباً 1 تریلیون دلار پس از گزارش درآمدهای پایین تر از سطح کاهش می دهد", "summary_fa": "سهام‌های بزرگ فناوری متزلزل می‌شوند زیرا سرمایه‌گذاران این سوال را مطرح می‌کنند که آیا میلیاردها دلار سرمایه برای هوش مصنوعی می‌تواند به اندازه کافی سریع بازده ایجاد کند. در مجموع، این کاهش در یک هفته نزدیک به 1 تریلیون دلار از ارزش مبادلات فناوری Nasdaq را از بین برد و حدود 2 تریلیون دلار را در یک ماه از بین برد. S P 500، شاخص 500 شرکت با ارزش در ایالات متحده، روز جمعه بیش از 1 درصد کاهش یافت و صدها میلیارد دلار از ارزش بازار را از دست داد. در مسیر حذف سود خود در ماه اکتبر بود، حتی اگر در همان ماه به بالاترین حد خود رسید. ضعف سهام‌های فناوری، کامپوزیت نزدک را حتی بیش از 3 درصد به پایین‌تر کشاند و صدها میلیارد ارزش را نیز از بین برد. میانگین صنعتی داون جونز کمتر سقوط کرد. ادامه مطلب... بیش از 2 تریلیون دلار از ارزش بازار قرار است در این ماه از نزدک ⁠100 حذف شود، زیرا درآمدهای فناوری بزرگ بررسی سرمایه گذاران را در مورد اینکه آیا میلیاردها دلاری که برای هوش مصنوعی ریخته می شود می تواند به اندازه کافی سریع بازده ایجاد کند، تشدید کرد. این حذف کمی بیشتر از کل ارزش بازار اسپیس ایکس خواهد بود. این شاخص تا کنون بیش از 5.8 درصد در اکتبر کاهش یافته است زیرا تجارت هوش مصنوعی دچار تلاطم شد، به‌علاوه متا پلتفرم‌های متا، آلفابت و آمازون پیش‌بینی‌های هزینه‌ها را بیشتر افزایش دادند. اینتل نزدیک به 30 درصد سقوط کرد و با بدترین روز خود از سال 1974 معاشقه می کند، حتی اگر سازنده تراشه سود بیشتری را برای سه ماهه اخیر گزارش کرده بود که تحلیلگران انتظار داشتند. پیش بینی سود در سه ماه پایانی سال جاری را ارائه کرد که بسیار کمتر از انتظارات تحلیلگران بود.", "image_url": "https://i.guim.co.uk/img/media/7a052dd1015720ea8d19c722dd7b8bcd0586aab3/452_0_4515_3613/master/4515.jpg?width=1200&height=630&quality=85&auto=format&fit=crop&precrop=40:21,offset-x50,offset-y0&overlay-align=bottom%2Cleft&overlay-width=100p&overlay-base64=L2ltZy9zdGF0aWMvb3ZlcmxheXMvdGctZGVmYXVsdC5wbmc&enable=upscale&s=930dcdd08e3b30fddc8297bec9bfddfc", "category": "هوش مصنوعی مولد", "tags": ["هوش مصنوعی", "Meta", "تراشه", "بورس و طلا"], "datetime_fa": "۸ آبان • ۲۱:۵۷"}, {"source": "The Verge", "title": "Google s satellite AI server transmits its first response to Earth", "link": "https://www.theverge.com/tech/1023528/google-project-suncatcher-ai-satellite-transmission", "summary": "Google's AI chip-equipped satellite has generated its first response from space. In a blog post on Friday, Google says it successfully booted up the satellite's Tensor Processing Units (TPUs), allowing the on-board Gemma 4 model to follow through on a prompt to create a haiku about being in space: Blue marble below Data streams in silent grace Starlight feeds my core. Google says it tried out other space-themed limericks and telemetry prompts as well. The test is p atcher-google.png?quality=90&strip=all&crop=0%2C1.4420367390612%2C100%2C97.115926521878&w=1200", "category": "هوش مصنوعی مولد", "tags": ["هوش مصنوعی", "Google", "تراشه"], "datetime_fa": "۸ آبان • ۲۱:۵۱"}, {"source": "TechCrunch Main", "title": "Satlyt takes another step toward turning satellites into space data centers", "link": "https://techcrunch.com/2026/10/30/satlyt-takes-another-step-toward-turning-satellites-into-space-data-centers/", "summary": "Satlyt ran a successful test this month bringing it closer to turning spacecraft, starting with satellites, into virtual data centers.", "date_str": "2026-10-30T18:01:24+00:00", "hash": "6518a8127f5dfb1b", "title_fa": "Satlyt گام دیگری در جهت تبدیل ماهواره ها به مراکز داده فضایی برمی دارد", "summary_fa": "Satlyt یک آزمایش موفقیت آمیز در این ماه انجام داد و آن را به تبدیل فضاپیماها، از ماهواره ها، به مراکز داده مجازی نزدیک کرد. او گفت که طبیعتا اولین واکنش راما افولو این بود: \"بیایید گوووووووووووووووووووووووووووووووووووووووووووووووووووووو\" شرکت او، Satlyt، در حال ساختن نرم افزاری برای تبدیل ماهواره های موجود به شبکه های پردازش داده، شبیه به مفهوم مرکز داده مداری است. و او فقط یک قدم دیگر به آن نزدیک شد. پس از 13 ماه کار، این شرکت در اوایل این ماه یک آزمایش موفقیت آمیز داشت. با همکاری دانشگاه هیوستون بر روی یک پروژه تحقیقاتی با بودجه ناسا، این آزمایش نشان داد که چگونه نرم‌افزار استارت‌آپ می‌تواند بر اساس ارتباطات و محاسبات موجود، وظایف را بین رایانه‌ها در حالی که در مدار است، پخش کند. او گفت که هدف ایجاد نرم افزاری است که به چندین ماهواره متصل می شود تا وظایف محاسباتی را به اشتراک بگذارد. Afullo به TechCrunch گفت که کاربران سیستم «فقط نیاز به تعریف مجوزها، اولویت‌ها و محدودیت‌های عملیاتی دارند» در حالی که نرم‌افزار در این محدودیت‌ها تصمیم می‌گیرد. نرم افزار آن در حال حاضر روی سه ماهواره در مدار قرار دارد و اولین قدم برای رسیدن به این دید این آزمایش بود. در حالی که این آزمایش از تحقیقات با بودجه ناسا استفاده می کرد، آژانس هنوز آن را برای هیچ ماموریت خاصی انتخاب نکرده یا آن را برای استقرار فناوری خود انتخاب نکرده است. ا 29245645597%2C100%2C78.541508708806&w=1200", "category": "هوش مصنوعی مولد", "tags": ["تراشه"], "datetime_fa": "۸ آبان • ۲۰:۴۶"}, {"source": "The Verge", "title": "Vizio’s discounted Mini LED TV lets you skip the sign-ups and smarts", "link": "https://www.theverge.com/gadgets/1022794/vizio-mini-led-quantum-tv-65-inch-walmart-deal-sale", "summary": "Walmart’s inexpensive Vizio produces a nice, bright image, though its black levels aren’t that deep. | Photo: John Higgins / The Verge Modern smart TVs let you skip the streaming device, which is convenient, but they also come with their own issues, including privacy concerns and frequent updates. The Vizio Mini LED Quantum TV lets you cut out the rigamarole and just get straight to the HDMI ports. And right now, it’s discounted at Walmart, with the 65-inch model going for $358 ($40 off) and the 85-inch model going for $698 ($100 off). Vizio Mini LED Quantum TV Where to Buy: $278 $248 at Walmart (55-inch) $398 $358 at Walmart (65-inch) $768 $698 at Walmart (85-inch) Although Vizio’s Mini LED TV comes loaded with Vizio OS, you can bypass the TV’s host of agreements during setup. By pushing past the manufacturer’s warnings about “missing out” on smart TV features, you can disable the built-in operating system, letting you use your own streaming device like a Roku or Apple TV 4K without worrying about what data Vizio and Walmart might be collecting. As for specs, the TV features quantum dots for full, vivid color and high brightness (our testing showed it can reach 936 nits when calibrated thanks to its mini-LED panel). There are some compromises, though, which is expected given the low price point. The IPS panel doesn’t have the best black levels, as you might see on more expensive sets, and there’s a touch of motion blur during faster scenes, which may also hurt its appeal for gamers. It also has three HDMI ports, but they’re only 2.0, although the screen only supports up to 4K at 60Hz, so it’s not detrimental to the experi  ["Apple"], "datetime_fa": "۸ آبان • ۲۰:۳۱"}, {"source": "Ars Technica", "title": "Fujifilm to boost tape production 5x as AI fuels archiving demand", "link": "https://arstechnica.com/gadgets/2026/10/fujifilm-to-boost-tape-production-5x-as-ai-fuels-archiving-demand/", "summary": "In an announcement released Thursday, Fujifilm said it will invest roughly 10 billion yen (about $63 million) to increase its production capacity fivefold for an unlikely beneficiary of the AI era: magnetic tape. Fujifilm attributes the surge in archiving demand to the spread of generative AI, which the company remarked is producing \"exponential growth\" in data needs worldwide. The 5x increase in production capacity will be measured against fiscal year 2025 production levels. The investment in Fujifilm's Kanagawa Factory, Odawara site will make it \"the largest investment Fujifilm has made to date in dedicated LTO tape facilities.\" The project will run from fiscal years 2026 through 2028 to fund manufacturing expansion and additional personnel, primarily to produce the latest-generation \"FUJIFILM LTO Ultrium10\" tape. Read full article Comments", "date_str": "2026-10-30T17:38:19+00:00", "hash": "1a9c58e962022916", "title_fa": "فوجی فیلم تولید نوار را 5 برابر افزایش می دهد زیرا هوش مصنوعی تقاضای بایگانی را افزایش می دهد", "summary_fa": "فوجی‌فیلم در اطلاعیه‌ای که پنجشنبه منتشر شد، اعلام کرد که تقریباً ۱۰ میلیارد ین (حدود ۶۳ میلیون دلار) سرمایه‌گذاری خواهد کرد تا ظرفیت تولید خود را برای یک ذینفع بعید از عصر هوش مصنوعی: نوار مغناطیسی، پنج برابر افزایش دهد. فوجی‌فیلم افزایش تقاضای بایگانی را به گسترش هوش مصنوعی مولد نسبت می‌دهد که به گفته این شرکت باعث ایجاد «رشد تصاعدی» در نیازهای داده در سراسر جهان می‌شود. افزایش 5 برابری ظرفیت تولید در مقایسه با سطوح تولید سال مالی 2025 اندازه گیری خواهد شد. سرمایه گذاری در کارخانه کاناگاوا فوجی فیلم، سایت اوداوارا، آن را به \"بزرگترین سرمایه گذاری فوجی فیلم تا به امروز در امکانات اختصاصی نوار LTO\" تبدیل می کند. این پروژه از سال مالی 2026 تا 2028 برای ت al Fraud Enforcement Division credited new fraud-detection measures implemented by the Trump administration for the arrests. He said that “this is the first international seizure of its kind in Kenya,” while warning fraudsters that the crackdown has only just begun. “If you steal American identities, if you steal taxpayer dollars, if you exploit programs meant to help students build a future—we will find you,” McDonald said. “Whether you are in Nebraska, New Jersey, Virginia, or Nairobi, we will pursue you.” Read full article Comments", "date_str": "2026-10-30T16:53:49+00:00", "hash": "8e55ada9c7879e31", "title_fa": "وزارت دادگستری می گوید هزاران دانش آموز ارواح از هوش مصنوعی برای سرقت میلیون ها وام دانشجویی استفاده می کنند.", "summary_fa": "ایالات متحده پنج نفر را به عنوان بخشی از اولین سرکوب گسترده فدرال علیه \"دانشجویان ارواح\" متهم کرده است - کلاهبردارانی که هویت صدها آمریکایی را می دزدند تا خود را به عنوان دانشجویان کالج جعلی معرفی کنند و وام های دانشجویی را می دزدند. در بیانیه مطبوعاتی روز پنجشنبه، وزارت دادگستری اعلام کرد که یک طرح در مقیاس بزرگ را کشف کرده است که تا حدی بر هوش مصنوعی متکی است. وزارت دادگستری آمریکا بیش از 750000 دلار ارز دیجیتال را از «شبکه مرتبط با اتباع کنیایی» پس از تجزیه و تحلیل داده‌ها به شناسایی کلاهبرداران احتمالی توقیف کرد. کالین ام. مک‌دونالد، دستیار دادستان کل از بخش ملی اجرای تقلب در وزارت دادگستری، اقدامات جدید کشف کلاهبرداری را که توسط دولت ترامپ اجرا شده است، برای دستگیری‌ها اعلام کرد. او گفت که \"این اولین توقیف بین المللی در نوع خود در کنیا است\"، در حالی که به کلاهبرداران هشدار داد که سرکوب تازه آغاز شده است. مک‌دونالد می‌گوید: «اگر هویت آمریکایی‌ها را می‌دزدید، دلارهای مالیات‌دهندگان را می‌دزدید، اگر از برنامه‌هایی برای کمک به دانش‌آموزان برای ساختن آینده سوء استفاده می‌کنید، ما شما را پیدا خواهیم کرد.» \"چه در نبراسکا، نیوجرسی، ویرجینیا یا نایروبی باشید، ما شما را تعقیب خواهیم کرد.\" مقاله کامل را بخوانید نظرات تنظیمات متن متن داستان اندازه کوچک استاندارد پهنای بزرگ * پیوندهای گسترده استاندارد استاندارد نارنجی * فقط مشترکین بیشتر بیاموزید برای پیمایش به حداقل برسانید ایالات متحده پنج نفر را به عنوان بخشی از اولین سرکوب گسترده فدرال علیه \"دانشجویان ارواح\" متهم کرده است - کلاهبردارانی که هویت صدها آمریکایی را می دزدند تا به عنوان دانشجوی جعلی ظاهر شوند. در یک کنفرانس مطبوعاتی، مقامات FBI و وزارت آموزش به مک دونالد پیوستند تا نحوه عملکرد این طرح را توضیح دهند. این کار با بازیگران بدی شروع می‌شود که اطلاعات شناسایی شخصی (PII) آمریکایی‌ها", "image_url": "https://cdn.arstechnica.net/wp-content/uploads/2026/10/GettyImages-1425343562-1152x648.jpg", "category": "هوش مصنوعی مولد", "tags": ["هوش مصنوعی", "بورس و طلا"], "datetime_fa": "۸ آبان • ۲۰:۲۳"}, {"source": "Ars Technica", "title": "Analysts find looming launch crisis is \"more severe\" than anticipated", "link": "https://arstechnica.com/space/2026/10/analysts-find-looming-launch-crisis-is-more-severe-than-anticipated/", "summary": "A new report from the analytics firm Quilty Space confirms that, outside of China, the world faces a significant shortage of rockets over the next five years. The firm estimates that between now and 2030, there will be a shortfall of about 150 launches compared to demand from satellite operators and civil space agencies. If demand from the US military is added in—and SpaceX does not extend the Falcon 9 and Falcon Heavy program to accommodate increased national security needs—the shortage could be doubled. \"What we wanted to get at is to understand how severe this launch crisis is and when will it be resolved,\" said Caleb Henry, director of research at Quilty Space. \"What we learned is that the launch crisis is more severe than we thought and that it will not go away this decade for sure, and it might not abate until sometime late in the 2030s.\" Read full article Comments", "date_str": "2026-10-30T16:12:59+00:00", "hash": "78e95cd11f097688", "title_fa": "تحلیلگران دریافتند که بحران پرتاب در آینده \"شدیدتر\" از آن چیزی است که پیش بینی می شد", "summary_fa": "گزارش جدیدی از شرکت تحلیلی Quilty Space تأیید می‌ he funds, like Corgi's MANGOS ETF, use complex derivative such as perpetual futures and swaps to simulate exposure to a private company. 2. Early exposure can cost you a pretty penny If you want in on Anthropic before its IPO, you may have to pay a hefty premium. While low-cost index funds often have expense ratios well below 0.1%, specialized funds that invest in firms like Anthropic and other private companies can carry high price tags. Some expense ratios you'll see below climb well above 2%, which can eat into returns over time. 3. Like SpaceX, Anthropic will IPO at a steep valuation Anthropic is expected to IPO at around a $1.5 trillion to $2 trillion market cap, which would make it one of the top 10 largest most valuable companies in the world. That implies a steep valuation considering it's still losing money. But the company's revenue continues to increase. It recently reported $16.8 billion in revenue in Q3, up 45% from Q2. 4. Stocks tend to underperform in the months after going public All of the hype around an IPO can cause a stock to soar in its first few days of trading. Yet, over the following months, performance is more lackluster, historical data shows. Truist data on 30 high-profile tech IPOs published earlier this year showed that the average stock-price drawdown within a year of going public was -55% . SpaceX went through a rough patch shortly after its launch on public markets. After an initial surge, it fell as much as 46% from June 16 highs. Since August 5 lows,", "date_str": "2026-10-30T16:32:10+00:00", "hash": "2e48ae3c2ac1fc7d", "title_fa": "آیا می خواهید قبل از IPO آنتروپیک سرمایه گذاری کنید؟ این 5 صندوق در معرض غول هوش مصنوعی قرار می گیرند.", "summary_fa": "داریو آمودی، یکی از بنیانگذاران آنتروپیک. آرون شوارتز/بلومبرگ از طریق گتی ایماژ بلومبرگ/گتی ایماژ آنتروپیک قرار است در اواسط نوامبر با ارزش 1.5 تا 2 تریلیون دلار عرضه عمومی شود. سرمایه گذاران خرد می توانند از طریق صندوق هایی مانند ARK Venture Fund و Corgi MANGOS ETF به Anthropic pre-IPO s biggest creator, MrBeast, has found his first CMO. The company promoted Feastables head and marketing vet Michelle St. Jacques to the role. Her remit will include leading marketing and defining the MrBeast brand. MrBeast has found his first CMO, Business Insider exclusively learned. The top YouTuber's company promoted Michelle St. Jacques to the role. St. Jacques has led consumer goods, including Feastables, MrBeast's snack and candy company, since February. In her new role, she'll add marketing duties for Beast Industries, the star's holding company, while continuing to oversee consumer goods. She's based in Chicago. Beast Industries started the search earlier this year, a move that reflected the company's growing ambitions. It's been expanding far beyond its core YouTube channel and seeks to become a Disney-style entertainment giant. Beast Industries CEO Jeff Housenbold said in a memo to staff, viewed by Business Insider, that he considered external candidates for the CMO role but decided St. Jacques was the best person for the job. \"In her time at Beast, MSJ has shown she can set clear strategy and deliver strong execution for our products and partners,\" he wrote. \"She has served as both CMO and Chief Commercial Officer and built iconic consumer brands like Dove, Heinz, Miller Lite, and Coors Light. She's also a world-class people leader who knows how to build high-performing teams.\" St. Jacques joined the company following a slowdown in Feastables' growth. Housenbold wrote that St. Jacques' remit would involve defining the MrBeast brand and making sure everything the company does ladders up to the same positioning; leading marketing for MrBeast and partner brands; and overseeing the viral marketing team. He said that he saw an opportunity to lean into e-commerce and performance marketing to drive customer acquisition and retention. St. Jacques steps into a role overseeing a brand that's looking to lessen its reliance on its famous founder. Her job requires  پهپاد جدید StarGate برای انجام دو ماموریت نجات جسورانه در ماه اکتبر استفاده کردند. نیروهای اوکراینی با کمک SkyFall از یک پهپاد تخصصی برای انجام ماموریت های نجات پشت سر هم در این ماه استفاده کردند. این پهپاد که StarGate نام دارد، یک هگزاکوپتر سنگین است که یک برانکارد محصور در زیر آن حمل می کند. Business Insider با خلبان و یکی از سربازان نجات یافته در مورد این ماموریت صحبت کرد. ایزیوم فکر می کرد که می خواهد بمیرد. یک انفجار مهیب بخشی از پای چپ پیاده نظام اوکراینی را گرفته بود و خون زیادی از دست داده بود. بدتر از آن، سربازان روسی در حال نزدیک شدن به موقعیت او بودند و هیچ فرار آسانی وجود نداشت. سپس یک هواپیمای بدون سرنشین آمد - یک هواپیمای عظیم شش روتور با یک برانکارد محصور در زیر. این هواپیما تقریباً 10 متر دورتر از موقعیت ایزیوم، در چمن بلند در کنار میدان مین فرود آمد. کابل های فیبر نوری در سراسر منطقه پخش شده بود و او نگران بود که خطرات مانع از بلند شدن هواپیمای بدون سرنشین نجات شوند. رفقای ایزیوم با سرگیجه و حالت تهوع به او کمک کردند تا به هواپیمای غیرعادی برود. با احضار قدرت کمی که داشت، خود را داخل کپسول برانکارد بلند کرد. با بلند شدن پهپاد، او کمی راحت‌تر نفس می‌کشید و بالاخره کمی احساس آرامش کرد. ایزیوم یکی از دو سرباز اوکراینی است که توسط هواپیمای جدید تخصصی StarGate بدون خدمه که اخیرا توسط شرکت اوکراینی SkyFall رونمایی شده است، از جنگ خارج شده اند. سربازان مجروح در این ماه در ماموریت های نجات پشت سر هم از نظر پزشکی تخلیه شدند. ایزیوم و KVN، یک خلبان هواپیمای بدون سرنشین در هنگ هجومی 475 مجزای اوکراین که در طول عملیات نجات با StarGate پرواز کرد، این ماموریت ها را", "image_url": "https://i.insider.com/6ae48df0120d8ce03d246788?width=1200&format=jpeg", "category": "هوش مصنوعی مولد", "tags": ["امنیت سایبری"], "datetime_fa": "۸ آبان • ۱۹:۳۵"}, {"source": "Business Insider", "title": "Binance cofounder asks Elon Musk to stop trolling at a time like this", "link": "https://www.businessinsider.com/binance-cofounder-cz-elon-musk-trolling-hack-crypto-spacex-2026-10", "summary": "Elon Musk trolled Binance cofounder Changpeng Zhao on X after hackers stole some $6 billion e legendary investor's favorite drink, Cherry Coke . The Pershing Square founder and CEO said that once they were sitting at the table, he asked Buffett whether he'd like still or sparkling water. Buffett politely declined, opting for his preferred soda instead. \"But I said, you know, 'Don't you drink water?'\" Ackman recalled. \"And he said, 'Bill, I haven't had water in 48 years.'\" Ackman didn't immediately respond to a request for more detail about Buffett's hydration habits. Not drinking water might sound unbelievable, but Buffett — who retired as Berkshire Hathaway's CEO after 60 years in charge last December, and as the company's chairman this September — is famous for drinking five cans of Coke daily. He quipped in 2015 that he was \"one-quarter Coca-Cola,\" as it accounted for 25% of his daily calories . Buffett's love of soda goes back decades. During Berkshire's 1986 meeting, he declared that after \"48 years of allegiance\" to Pepsi, he was switching to Cherry Coke, saying it would be the meeting's official drink going forward. Coca-Cola has also been one of Buffett's landmark investments . Berkshire hasn't touched its roughly 9% stake in the beverage giant since it finished building it in the mid-1990s. The position cost about $1.3 billion and was worth around $28 billion at the end of December — a roughly 21-fold gain . Coke is only part of Buffett's iconic diet . He's known for grabbing McDonald's for breakfast on his drive to work, and munching on hot dogs, fries, popcorn, cookies, candy, ice cream, and other comfort foods. His love of fast food and sweet treats extends to his investments. Berkshire counts See's Candies and Dairy Queen among its subsidiaries, and Kraft Heinz among its largest stock holdings.", "date_str": "2026-10-30T15:36:11+00:00", "hash": "450e3a8db01779b2", "title_fa": "وارن بافت 50 سال است که آب ننوشیده است. حداقل، این چیزی است که او به بیل آکمن گفت.", "summary_fa": "وارن بافت یکی از طرفداران قدیمی Cherry Coke است. دانیل آکر/ بلومبرگ از طریق گتی ایماژ وارن بافت یک بار در هنگام شام به بیل آکمن گفت که پنج دهه است یک لیوان آب ننوشیده است. آکمن این هفته در یک پادکست در مورد رابطه خود با این افسانه سرمایه گذار این داستان را بازگو کرد. بافت 96 ساله معروف است که روزی پنج قوطی کوکاکولا می نوشد و با فست فود و خوراکی های شیرین زندگی می کند. وارن بافت حداقل از دهه 1970 یک لیوان آب ننوشیده است. این همان چیزی است که نماد تجاری 96 ساله زمانی به بیل آکمن، مدیر صندوق سرمایه گذاری میلیاردر، در بخشی از پادکست سرمایه گذاری Equity Mates که این هفته پخش شد، به یاد آورد. آکمن گفت که بافت «سال‌ها پیش» برای صرف شام به خانه‌اش آمد و مطمئن شد که نوشیدنی مورد علاقه سرمایه‌گذار افسانه‌ای، کوکای گیلاس، را تهیه کرده است. بنیانگذار و مدیر عامل پرشینگ اسکوئر گفت زمانی که آنها پشت میز نشسته بودند، از بافت پرسید که آیا آب گاز می‌خواهد یا آب گازدار. بافت مودبانه نپذیرفت و به جای آن نوشابه مورد علاقه خود را انتخاب کرد. آکمن به یاد می آورد: «اما من گفتم، می دانی، «آب نمی خوری؟» و او گفت: «بیل، من ۴۸ سال است که آب نخورده‌ام.» آکمن بلافاصله به درخواست جزئیات بیشتر درباره عادت‌های بافت هیدراتاسیون پاسخ نداد. شاید ننوشیدن آب باورنکردنی به نظر برسد، اما بافت - که پس از 60 سال مسئولیت در دسامبر گذشته به عنوان مدیرعامل برکشایر هاتاوی بازنشسته شد و در سپتامبر امسال به عنوان رئیس شرکت - به نوشیدن روزانه پنج قوطی کوکاکولا مشهور است. او در سال 2015 به طعنه گفت که او یک چهارم کوکاکولا است، زیرا 25 درصد از کالری روزانه او را تشکیل می دهد. عشق بافت به نوشابه به دهه ها", "image_url": "https://i.insider.com/6ae48b49911659c36c01b84d?width=1200&format=jpeg", "category": "هوش مصنوعی مولد", "tags": ["فناوری", "نوآوری"], "datetime_fa": "۸ آبان • ۱۹:۰۶"}, {"source": "Business Insider", "title": "Reddit is going logged-in only. Blame Google AI Overviews.", "link": "https://www.businessinsider.com/reddits-logged-in-google-ai-overviews-traffic-2026-10", "summary": "Reddit s Google search-fueled traffic bonanza has come to an end. Kirill KUDRYAVTSEV / AFP via Getty Images Reddit announced it will be going logged-in only (with some caveats). This comes after Reddit's search traffic has fallen, as people use AI more and more. But in 2024, Reddit had a search traffic bonanza after cutting a deal with Google. Reddit announced on Thursday that it will soon start being a (mostly) logged-in-only experience , citing declining search traffic as one of the reasons. Redditors, who are famously level-headed and open to change, reacted about how you would expect . In an earnings call, CEO Steve Huffman said that Google's AI Overviews \"are not traffic drivers\",\" and that \"Google has really shifted in their relationship with the rest of the internet.\" It wasn't so long ago — June 2024 — that I wrote an article with the headline \" Reddit's traffic is way, way up. Like, banoodles up .\" Things have changed a lot in those two short years! Here's what happened back in 2024. Reddit was going public , and just made a deal with Google to license gazillions of posts for Google's AI training. Reddit's search traffic was also way, way up. It saw a 39% increase in traffic from May 2023 to May 2024, according to web analytics firm Similarweb. This was a time period where other social companies saw much slower growth (and Facebook even slightly declined). Much of that was because of Google search traffic. But that was 2024. People were only tentatively trying out these newfangled AI services like ChatGPT as a potential search replacement. Google had just launched its AI Overviews in search results in May 2024, and they didn't seem very useful — it told people to put glue in their pizza , after all. Fast forward to 2026, and people are much more comfortable using AI services like ChatGPT instead of Googling. You can ask Muse to shop for the best air conditioner for you and even make the purchase. Google AI overviews have gotten way, way better, making it so you rarely have to actually click on a website to get your answer. Thanks to all this, search traffic has tanked across the entire internet. Plenty of publishers talk about \"Google Zero,\" bracing for Google referral traffic to fully bottom out. Reddit, even with the deal it cut with Google, is experiencing the truth that search traffic is easy come, easy go. Huffman said in a letter to shareholders said that search traffic was \"down meaningfully in Q3,\" and that in October it dropped by over 1 ", "date_str": "2026-10-30T15:32:12+00:00", "hash": "0397cf90dfa8f44f", "title_fa": "Reddit فقط وارد سیستم می شود. مرورهای هوش مصنوعی گوگل را سرزنش کنید.", "summary_fa": "رونق ترافیک جستجوی گوگل Reddit به پایان رسیده است. Kirill KUDRYAVTSEV / AFP از طریق Getty Images Reddit اعلام کرد که فقط وارد سیستم می شود (با برخی اخطارها). این امر پس از کاهش ترافیک جستجوی Reddit انجام می شود، زیرا مردم بیشتر و بیشتر از هوش مصنوعی استفاده می کنند. اما در سال 2024، Reddit پس از انعقاد قرارداد با Google، ترافیک جستجوی خوبی داشت. Reddit روز پنجشنبه اعلام کرد که به زودی یک تجربه (عمدتا) فقط وارد سیستم می شود و یکی از دلایل آن را کاهش ترافیک جستجو عنوان کرد. Redditors، که معروف هستند سطح سر و آماده برای تغییر، در مورد انتظار شما واکنش نشان دادند. استیو هافمن، مدیر عامل شرکت، در یک تماس کسب درآمد گفت که مرورهای هوش مصنوعی گوگل «محرک ترافیک نیستند» و «گوگل واقعاً در رابطه خود با بقیه اینترنت تغییر کرده است.» خیلی وقت پیش - ژوئن 2024 - مقاله ای با عنوان «ترافیک Reddit بسیار بالاست» نوشتم. مثل بانودلز بالا.» در این دو سال کوتاه همه چیز خیلی تغییر کرده است! این چیزی است که در سال 2024 اتفاق افتاد. Reddit در حال عمومی شدن بود و به تازگی با Google قراردادی برای مجوز دهی هزاران پست برای آموزش هوش مصنوعی گوگل بسته است. ترافیک جستجوی Reddit نیز بسیار بالا بود. به گفته شرکت تجزیه و تحلیل وب Similarweb، از مه 2023 تا مه 2024 شاهد افزایش 39 درصدی ترافیک بوده است. این دوره زمانی بود که سایر شرکت‌های اجتماعی رشد بسیار کندتری را تجربه کردند (و فیس‌بوک حتی اندکی کاهش یافت). بیشتر آن به دلیل ترافیک جستجوی گوگل بود. اما آن سال 2024 بود. مردم فقط به طور آزمایشی این سرویس های هوش مصنوعی جدید مانند ChatGPT را به عنوان جایگزینی بالقوه برای جستجو امتحان می کردند. گوگل به تازگی در می 2024 مرورهای هوش مصنوعی خود را در", "image_url": "https://i.insider.com/6ae4b876d8cc18cf7950f86e?width=1200&format=jpeg", "category": "هوش مصنوعی مولد", "tags": ["هوش مصنوعی", "OpenAI", "Google"], "datetime_fa": "۸ آبان • ۱۹:۰۲"}, {"source": "Business Insider", "title": "I never play with my kids at the playground. Other parents may think I'm lazy, but there's a good reason I sit back.", "link": "https://www.businessinsider.com/single-mom-raising-independent-boys-parenting-rules-2026-10", "summary": "Jodie Lopez has always wanted her kids to be independent. Courtesy of Jodie Lopez Jodie Lopez is a single mom raising two boys to be independent and responsible from a young age. She expects them to clean their rooms, carry their bags, and manage their own screen time. She believes giving kids responsibility helps them become confident and capable adults. This as-told-to essay is based on a conversation with Jodie Lopez. It has been edited for length and clarity. When I first became a mother, I knew I wanted my children to grow up to be independent, resilient, and prepared for life in the real world. Growing up, my mom wasn't around much. Although I didn't want my children to feel alone as I often did, I did want to pass on the independence I developed by doing things for myself. I have never been afraid to go out and do exciting things, and I wanted to raise children who could stand on their own two feet and take whatever life might one day throw at them. Before being their friend, it was most important to me that I was their mom, preparing them for the day they would eventually leave my care. Having boys , I also hoped they would grow into men who would make good housemates or partners one day. I've talked to them about the stereotypes surrounding men and housework, and I never wanted those stereotypes to become true of them. Tidying their bedrooms Even as tiny toddlers and young children, the boys were expected to tidy up after themselves. If they got something out, they would put it away. If they forgot, I reminded them. Their bedrooms are their responsibility, not mine. While I would help them, I would never simply clean their rooms for them. Carrying their own backpacks I've always taken the boys out on little adventures . When they were tiny, I carried most of what we needed for the day, but they always had tiny backpacks of their own, usually with a pack of wipes and their own snacks. By carrying their own snacks, they were able to feed themselves when they got hungry, listening to their bodies and responding to what they were telling them. As they got older, I never carried their backpacks or school belongings to and from school. I see parents carrying everything at the start or end of a school day, but I've never done this. When we go on vacations now, the boys carry backpacks full of toys, clothes, and toiletries. They are responsible for their own belongings. Learning to help around the house I've always expected the boys to pitch in and help a", "date_str": "2026-10-30T15:32:01+00:00", "hash": "08109733c07f2455", "title_fa": "من هرگز با بچه هایم در زمین بازی بازی نمی کنم. ممکن است والدین دیگر فکر کنند که من تنبل هستم، اما دلیل خوبی برای عقب نشینی وجود دارد.", "summary_fa": "جودی لوپز همیشه دوست داشته فرزندانش مستقل باشند. با حسن نیت از جودی لوپز جودی لوپز یک مادر مجرد است که از سنین جوانی دو پسر را برای مستقل بودن و مسئولیت پذیری بزرگ می کند. او از آنها انتظار دارد که اتاق‌هایشان را تمیز کنند، کیف‌هایشان را حمل کنند و زمان تماشای نمایش را خودشان مدیریت کنند. او معتقد است که مسئولیت دادن به بچه ها به آنها کمک می کند تا بزرگسالانی با اعتماد به نفس و توانا شوند. این مقاله گفته شده بر اساس گفتگو با جودی لوپز است. برای طول و وضوح ویرایش شده است. وقتی برای اولین بار مادر شدم، می دانستم که می خواهم فرزندانم مستقل، انعطاف پذیر و آماده برای زندگی در دنیای واقعی بزرگ شوند. وقتی بزرگ شدم، مادرم زیاد دور و برم نبود. اگرچه نمی‌خواستم فرزندانم مثل من احساس تنهایی کنند، اما می‌خواستم استقلالی را که با انجام کارهایی برای خودم به وجود آورده‌ ompared the taste, portion sizes, and overall value. Here's how it went. Shake Shack was my first stop. Amanda Shammas Unlike the other two chains I visited, Shake Shack is a publicly traded company. It began as a hot-dog cart in New York City's Madison Square Park before becoming a permanent kiosk in 2004. Today, the chain has over 700 locations around the world. One recently opened near my house, so it seemed like the perfect time to give it a try. The ShackBurger was simple but satisfying. Amanda Shammas I ordered a single ShackBurger ($7.79), which came with an Angus beef patty, American cheese, lettuce, tomato, and the chain's signature ShackSauce. The patty was cooked well and had a nice sear, with thin, crispy edges. The cheese was also perfectly melted over the top. I especially enjoyed the ShackSauce, which was creamy and tangy, and tasted like a blend of ketchup, mustard, and mayonnaise. The crinkle-cut fries were crispy and well salted. Amanda Shammas As a side, I ordered the fries ($4.99). These were crinkle-cut, nicely salted, and crispy on the outside. I usually prefer very thin fries , but these had a satisfying crunch that won me over and paired well with the burger. I had enough left in my budget to add a vanilla shake. Amanda Shammas For dessert, I ordered a vanilla shake ($6.49). Although it had a pleasant, classic vanilla flavor, the consistency was thinner and more watery than I would have liked. To me, it seemed slightly overmixed. Overall, I thought this was a solid meal for the price. Amanda Shammas My burger, fries, and shake cost $19.27 before tax and tip. The meal wasn't particularly inventive, but everything tasted great, an", "date_str": "2026-10-30T15:25:21+00:00", "hash": "1c1a112b6d1f6f49", "title_fa": "با بودجه 20 دلاری به Shake Shack، Five Guys و Smashburger رفتم. یک زنجیره بهترین غذا و بیشترین ارزش را ارائه می کرد.", "summary_fa": "من وعده های غذایی 20 دلاری را در فروشگاه های زنجیره ای برگر مانند Five Guys مقایسه کردم تا بهترین ارز aboard for less than a month. He packed his Florida life into six bags and boarded the Odyssey earlier this month. On Tuesday, however, residents were ordered off in Cambodia as Villa Vie suspended operations. This as-told-to essay is based on several conversations with Joel Greiff, 57, a Villa Vie Odyssey passenger from Florida. It has been edited for length and clarity. Villa Vie Residences and its founders, Mikael Petterson and Kathy Villalba, did not immediately respond to a request from Business Insider. I planned to live on the Odyssey for 10, 20, or even more years. I don't think that will be happening now. Still, unlike others, I am celebrating the time I was able to enjoy on the Odyssey , which was 26 days before Villa Vie suspended operations on Tuesday and we had to disembark in Cambodia. If you have worked on the Villa Vie Odyssey and have a story to share, get in touch with this reporter: jzitser@businessinsider.com . I thought I had found my new home In April 2024, I read an article about the Odyssey. I called a sales agent at the company and asked a bunch of questions. The following May, I stayed on the Odyssey for four days. Within five minutes of boarding, I concluded that this was my new home, these were my new neighbors, and this would be my future. What drew me in was that it would be a place where I could come, live, and be part of a community. I was following residents on Facebook and reached out to a couple of them individually. I asked whether they were happy with their decisions, and they said yes. In August this year, I left my home in Florida . I spent a couple of months driving around the US, visiting friends and family, and saying my goodbyes. Then, in September, I flew to Bangkok and moved onto the ship on October 1. Joel Greiff introduced himself as Fantastic Joel to the residents of the Odyssey. Courtesy of Joel Greiff I introduced 'Fantastic Joel' — that's what I go by — to many people on a ship. Most enjoyed meeting me. I'm sure a few didn't. There was always something going on, and people were really nice to each other. There were arts-and-crafts, plays, karaoke, and Seder dinners for Jewish residents. I tried to put myself out there, meet a lot of different people, and say hi. There was always a good community having a good time. I absolutely fell in love with the cre", "date_str": "2026-10-30T15:08:58+00:00", "hash": "bd6e64bf5b0b82d6", "title_fa": "من برنامه‌ریزی کردم که دهه‌ها را در سفر دریایی «بی پایان» ویلا وی بگذرانم. من فقط در 26 روز حرکت کردم قبل از اینکه متوقف شود.", "summary_fa": "جوئل گریف در اکتبر 2026 به ویلا وی ادیسه نقل مکان کرد. با حسن نیت جوئل گریف جوئل گریف قصد داشت چندین دهه در ویلا وی ادیسه زندگی کند، اما کمتر از یک ماه در کشتی بود. او زندگی خود در فلوریدا را در شش کیسه جمع کرد و اوایل این ماه سوار کشتی اودیسه شد. با این حال، روز سه‌شنبه، به دلیل تعلیق فعالیت‌های ویلا وی، به ساکنان کامبوج دستور داده شد. این مقاله گفته شده بر اساس چندین گفتگو با جوئل گریف، 57 ساله، مسافر ویلا وی اودیسه از فلوریدا است. برای طول و وضوح ویرایش شده است. Villa Vie Residences و بنیانگذاران آن، Mikael Petterson و Kathy Villalba، بلافاصله به درخواست Business Insider پاسخ ندادند. من قصد داشتم 10، 20 یا حتی بیشتر در اودیسه زندگی کنم. فکر نمی کنم الان این اتفاق بیفتد. با این حال، بر خلاف دیگران، من زمانی را جشن می‌گیرم که توانستم در Odyssey لذت ببرم، که 26 روز قبل از توقف عملیات ویلا وای در روز سه‌شنبه بود و ما مجبور شدیم در کامبوج پیاده شویم. اگر روی Villa Vie Odyssey کار کرده اید و داستانی برای به اشتراک گذاشتن دارید، با این خبرنگار در تماس باشید: jzitser@businessinsider.com. فکر می‌کردم خانه جدیدم را پیدا کرده‌ام در آوریل 2024، مقاله‌ای درباره اودیسه خواندم. با یک نماینده فروش در شرکت تماس گرفتم و چند سوال پرسیدم. اردیبهشت ماه بعد، چهار روز در ادیسه ماندم. در عرض پنج دقیقه پس از سوار شدن، به این نتیجه رسیدم که اینجا خانه جدید من است، اینها همسایه های جدید من هستند و این آینده من خواهد بود. چیزی که مرا جذب کرد این بود که می توانستم بیایم، زندگی کنم و بخشی از یک جامعه باشم. من ساکنین را در فیس بوک د  hunting world, AI is an unwelcome presence. Since the release of ChatGPT in 2022, AI-generated ghost stories and images of the supernatural have flooded online spaces, so much so that popular forums like the r/ nosleep subreddit , meant for scary stories, have implemented a strict policy against AI-generated material. Continue reading...", "date_str": "2026-10-30T15:00:16+00:00", "hash": "985962984eaab189", "title_fa": "روح در ماشین: چگونه هوش مصنوعی در جستجوی ماوراء طبیعی است", "summary_fa": "شکار ارواح در سال های اخیر به دلیل چت ربات های هوش مصنوعی تغییر کرده است و علاقه مندان به ماوراء الطبیعه نگران هستند که شکار ارواح یک تعقیب فناوری سنگین است. هنگامی که امی وین و جاراد کاتینگ مکان‌های خالی از سکنه را بررسی می‌کنند، با نرم‌افزاری با طراحی خودشان بارگذاری می‌شوند، مانند برنامه‌ای که سیگنال‌های حسگرهای تلفن را به کلمات مختلف در پایگاه داده اختصاص می‌دهد. در عصر ChatGPT، جفت شکار ارواح در حال بررسی دنیای هوش مصنوعی هستند. آنها یکی از آخرین اختراعات خود، اپلیکیشنی به نام GhostTube Seer را به عنوان «اولین ابزار شکار ارواح هوش مصنوعی در جهان» توصیف می کنند. در دست محققان ماوراء الطبیعه، ابزارهای علمی مانند EMF متر (که برای تشخیص میدان های الکترومغناطیسی استفاده می شود) برای شناسایی تغییرات و ناهنجاری هایی که به عقیده آنها نشان دهنده فعالیت ماوراء طبیعی است، تغییر کاربری داده می شوند. Seer از بسیاری جهات صرفاً گسترش آن عمل است، راه دیگری برای اسکن یک اتاق خالی و باور اینکه ممکن است چیزی آنجا باشد. طبق فهرست فروشگاه Google Play، این برنامه که به اشتراک ماهانه پولی نیاز دارد، بیش از 1 میلیون دانلود دارد. اما برای دیگران در دنیای شکار ارواح، هوش مصنوعی یک حضور ناخواسته است. از زمان انتشار ChatGPT در سال 2022، داستان‌های ارواح و تصاویر ماوراء الطبیعه تولید شده توسط هوش مصنوعی فضاهای آنلاین را پر کرده است، به طوری که انجمن‌های محبوبی مانند r/nosleep subreddit که برای داستان‌های ترسناک طراحی شده است، سیاست سخت‌گیرانه‌ای را علیه مطالب تولید شده توسط هوش مصنوعی اعمال کرده‌اند. به خواندن ادامه دهید... Waine و Cutting ادعا می‌کنند که اپلیکیشن آن‌ها می‌تواند با استفاده از سیگنال اری شرکت می‌دهد. صرافی کریپتو - بزرگترین صرافی جهان - گفت که در حال حاضر تمام سپرده‌ها و برداشت‌ها را تا زمانی که تحقیقاتش در مورد نقض ادامه دارد، به حالت تعلیق درآورده است. TechCrunch روز پنجشنبه گزارش داد که این صرافی برداشت از برخی از بلاک چین های خود را متوقف کرده است. بایننس گفت وجوه کاربر ایمن است، اما فوراً مدرکی برای این ادعا ارائه نکرد. این شرکت گفت که پس از تکمیل اصلاح، یک مدرک به روز شده از ذخایر منتشر خواهد کرد. سخنگوی اندی کوپر در بیانیه ای که روز جمعه با TechCrunch به اشتراک گذاشته شد،", "image_url": "https://techcrunch.com/wp-content/uploads/2026/10/binance-2206279918.jpg?resize=1200,800", "category": "هوش مصنوعی مولد", "tags": ["امنیت سایبری", "بورس و طلا"], "datetime_fa": "۸ آبان • ۱۷:۳۰"}, {"source": "Ars Technica", "title": "GM to pay $220 million after selling customer Smart Driver data", "link": "https://arstechnica.com/cars/2026/10/gm-to-pay-220-million-after-selling-customer-smart-driver-data/", "summary": "General Motors marketed its Smart Driver system as a way for parents to monitor teen drivers or for adults to track their driving behavior. But in 2024, it emerged that GM had been sharing that data with brokers. Those brokers then sold the data to insurance companies , and some drivers found that their insurance became more expensive as a result. To make matters worse, many of those drivers claimed they had no knowledge of ever agreeing to share such data for such purposes. Last year , GM and its OnStar subsidiary entered into a settlement with the FTC, prohibiting them from sharing some kinds of driver data with third parties. The settlement was finalized this January. That agreement banned the two companies from sharing geolocation data or driver behavior data for five years. At the time, GM also discontinued Smart Driver across its entire range. Now the automaker has reached terms with the District of Columbia and 35 states after their attorneys general joined together to sue GM as well. Read full article Comments", "date_str": "2026-10-30T13:53:20+00:00", "hash": "485c88f04c4f3c45", "title_fa": "جنرال موتورز 220 میلیون دلار پس از فروش داده های Smart Driver مشتری پرداخت می کند", "summary_fa": "جنرال موتورز سیستم Smart Driver خود را به عنوان راهی برای نظارت والدین بر رانندگان نوجوان یا بزرگسالان برای ردیابی رفتار رانندگی آنها به بازار عرضه کرد. اما در سال 2024 مشخص شد که جنرال موتورز آن داده ها را با کارگزاران به اشتراک گذاشته است. آن کارگزاران سپس داده ها را به شرکت های بیمه فروختند و برخی از رانندگان متوجه شدند که بیمه آنها در نتیجه گران شده است. بدتر از آن، بسیاری از این رانندگان ادعا کردند که هیچ اطلاعی از موافقت با اشتراک گذاری چنین داده هایی برای چنین اهدافی نداشته اند. سال گذشته، جنرال موتورز و زیرمجموعه OnStar آن با FTC توافق کردند و آنها را از به اشتراک گذاری برخی از انواع داده های راننده با اشخاص ثالث منع کردند. تسویه حساب در ژانویه امسال نهایی شد. این توافق دو شرکت را از اشتراک گذاری داده های موقعیت جغرافیایی یا داده های رفتار راننده به مدت پنج سال منع کرد. در آن زمان، جنرال موتورز همچنین Smart Driver را در کل محدوده خود متوقف کرد. اکنون پس از اینکه دادستان های کل آنها برای شکایت از جنرال موتورز نیز به هم پیوستند، این خودروساز با ناحیه کلمبیا و 35 ایالت به توافق رسیده است. مقاله کامل را بخوانید نظرات تنظیمات متن متن داستان اندازه کوچک استاندارد پهنای بزرگ * پیوندهای عریض استاندارد استاندارد نارنجی * فقط مشترکین بیشتر بدانید. But in 2024, it emerged that GM had been sharing that data with brokers. Those brokers then sold the data to insurance companies , and some drivers found that their insurance became more expensive as a result. To make matters worse, many of those drivers claimed they had no knowledge of ever agreeing to share such data for such purposes.", "image_url": "https://cdn.arstechnica.net/wp-content/uploads/2018/05/myBuick-App-01-1152x648.jpg", "category": "هوش مصنوعی مولد", "tags": ["فناوری", "نوآوری"], "datetime_fa": "۸ آبان • ۱۷:۲۳"}, {"source": "Ars Technica", "title": "Hackers steal $6.3 billion from Binance in record crypto heist", "link": "https://arstechnica.com/secu acking. When we had moved to England seven months earlier, I never imagined returning so soon. At first, moving to the UK felt like it could be a grand adventure The idea of leaving Canada behind to try living in the United Kingdom seemed exciting. Cara Howlett Packing up a life in Canada and starting a new one in England had been a herculean endeavor, but I had been excited to do it. For two years leading up to our move to the UK , my husband, two kids (ages 7 and 10), and I had been settled in Alberta, Canada. As much as we enjoyed it, I ached for a new adventure; something different. I didn't feel particularly connected to our community, and our day-to-day lives had felt monotonous for a while. Some of our only reprieves as busy young parents were monthlong summer holidays spent with my husband's family in the bucolic British countryside. We enjoyed these trips so much and looked forward to them for weeks, from planning excursions to castles and museums to researching the best local restaurants and pubs. When we arrived, we loved taking day trips to nearby locales and eating fish and chips by the seaside. I started wondering if living in England would be just as enjoyable and exciting as these monthlong stints. Maybe it'd also satisfy our longing for adventure. Although moving meant leaving my extended family in Canada behind, the idea of our kids spending the rest of their childhoods with my husband's family nearby felt like the right next step. My in-laws also seemed excited about the arrangement, as they offered to help pay for my visa application to live in England permanently . My (more skeptical) husband decided he'd continue running his business in Canada after we moved, occasionally commuting back every few weeks while working remote", "date_str": "2026-10-30T14:10:01+00:00", "hash": "0e10f630c9bdbc31", "title_fa": "ما به انگلستان نقل مکان کردیم تا در نزدیکی خانواده شوهرم زندگی کنیم. بعد از 7 ماه متوجه شدیم که اشتباه کرده ایم.", "summary_fa": "با نگاهی به nting investors with Q3 earnings. Both tech giants said they expected to spend more on AI in 2027, despite negative cash flow. The Nasdaq 100 shed nearly 3%, putting the index on track for a losing month. It's another Friday filled with bruising losses for the tech trade . The Nasdaq 100 was on track to log a losing week as the sell-off in tech intesified overnight. The losses were sparked by Amazon and Intel , which plunged after hours on Thursday as both tech giants disappointed investors with their third-quarter earnings reports and reignited fears that the AI trade is headed for a slowdown. Amazon dropped as much as 7% in the early morning as the retail giant reported earnings per share and revenue that came in below expectations for the third quarter. The company also posted a negative cash flow of $7.6 billion for the second-straight quarter, which it said was due to its growing AI spend. CEO Andy Jassy said the firm expected it would continue to \"spend meaningfully more\" into next year. Meanwhile, Intel shares cratered as much as 26%. The computer hardware maker beat on earnings and revenue, but issued weak guidance for the fourth quarter, forecasting a slowdown in the PC market that would stretch into at least the first half of 2027. Revenue in Intel's client computing and physical AI business also dropped 5% year-over-year to $8.1 billion, missing estimates. The firm maintained its capex guidance, but warned that it likely wouldn't generate free cash flow in 2027, partly due to capex being \"up strongly,\" chief financial officer Dave Zinsner said on the call with investors. Q3 earnings metric Amazon Intel Earnings per share $1.89 vs. $1.96 expected $0.52 vs. $0.40 expected (adjusted) Revenue $201.94B vs. $202.31B expected $16.51B vs. $16.50B expected The results stoked fresh fears for the AI trade, ramping up scrutiny from investors over the finances of major tech players who are worried that AI investment isn't paying off. The fear is running in both di
