, "link": "https://www.rollingstone.com/tv-movies/tv-movie-news/jon-stewart-donald-trump-free-press-attack-daily-show-1235629672/", "summary": "“He doesn’t even respect us enough to pretend he’s bound by our Constitution”", "date_str": "2026-09-22T07:04:11+00:00", "hash": "13f4e55e8c4813ee", "title_fa": "انتقاد جان استوارت از حمله ترامپ به مطبوعات آزاد", "summary_fa": "جان استوارت در آخرین قسمت از برنامه دیلی شو حمله اخیر دونالد ترامپ به رسانه ها را هدف قرار داد: «او حتی آنقدر به ما احترام نمی گذارد که وانمود کند که به قانون اساسی ما متعهد است. کاخ سفید چند رسانه مهم از جمله CNN، MS Now و Politico را از ورود به استخر مطبوعات در آخر هفته ممنوع کرد، که منجر به طرح شکایتی شد که صبح دوشنبه اعلام شد. همانطور که بسیاری از شما شنیده اید، اگر اخبار را دنبال کرده باشید، داغ ترین نقطه در D.C. استوارت در خلال مونولوگ خود گفت که به تازگی سیاست درب خود را تغییر داده است. او سپس کلیپی از ترامپ پخش کرد که می‌گفت: «بی‌حال است که یک کشور به مطبوعاتش اجازه می‌دهد تا داستان‌های منفی عمدی بنویسند. آیا رئیس جمهور را بهتر امتحان کرده اید؟ استوارت پاسخ داد. شما می توانید. اما نه. شما می توانید مطبوعات را ممنوع کنید یا می توانید رئیس جمهور لعنتی بهتری باشید. به مطبوعات کاری بدهید که با آن کار کنند. اوه، این یک داستان مثبت است: هرگز فکر نمی‌کردم ماشین من بتواند با چنین مخزن کوچکی 140 دلار بنزین بگیرد. هیچ نظری نداشتم! او اضافه کرد، و نه بیهوده، آیا ما تا به حال رئیس‌جمهوری داشته‌ایم که فقط در اتاق بیضی ظاهر شده و مخالف قانون اساسی باشد؟ او هیچ لعنتی نمی کند. او حتی آنقدر به ما احترام نمی گذارد که وانمود کند که به قانون اساسی ما متعهد است. استوارت اذعان کرد که ممنوعیت مطبوعاتی ترامپ به این معنی است که او نه تنها به سوگند مقدس خود خیانت کرده است، بلکه اکنون همه ما را در معرض داستان های بی پایان تدارکات ورودی ساختمان قرار داده است. مجری برنامه کلیپی از چندین خبرنگار پخش کرد که در مورد ناتوانی خود در ورود به کاخ سفید و مسائل مربوط"}, {"source": "Rolling Stone", "title": "Channing Tatum Says He Hasn’t Been Harassing Zoë Kravitz and Harry Styles With Burner Account", "link": "https://www.rollingstone.com/tv-movies/tv-movie-news/channing-tatum-zoe-kravitz-harry-styles-burner-account-1235629668/", "summary": "“Yo i truly can’t believe yall think this is what I’m doing with my free time”", "date_str": "2026-09-22T06:36:47+00:00", "hash": "d3ad37b9c5e33dc9", "title_fa": "چانینگ تاتوم می‌گوید با حساب Burner زوئه کراویتز و هری استایلز را مورد آزار و اذیت قرار نداده است.", "summary_fa": "چانینگ تیتوم در پاسخ به این ادعا که او پشت یک حساب کاربری در شبکه های اجتماعی است که از نامزد سابقش، زو کراویتز، و نامزد جدیدش، هری استایلز، متنفر بوده است، گفت: \"اوه، واقعاً نمی توانم باور کنم که فکر کنم این همان کاری است که من با اوقات فراغت خود انجام می دهم.\" پس از انتشار شایعات اینترنتی مبنی بر اینکه او صاحب حسابی به نام @bidness_nonya است، تیتوم در استوری اینستاگرام خود پست کرد: واقعاً نمی توانم باور کنم فکر می کنم این همان کاری است که من در اوقات فراغت خود انجام می دهم. لعنتی خنده دار همچنین اگر نمی‌خواهم مردم من را به آن متصل کنند، چرا باید یک حساب رایتر را دنبال کنم؟ Wtf بیا اما اگر واقعاً لازم باشد آن را بگویم، من فقط یک حساب IG @channingtatum دارم. تاتوم و کراویتز در سال 2021 با یکدیگر رابطه برقرار کردند و در سال 2023 نامزد کردند. این زوج در اکتبر 2024 از هم جدا شدند. کراویتز در مقطعی پس از آن با استایلز رابطه برقرار کرد و رابطه خود را در آگوست 2025 تأیید کرد. آنها در آوریل نامزد کردند. حساب مورد بحث، که به نظر می رسد در روز گذشته حذف شده است، مرتباً در مورد پست ها و شایعات مربوط به Kravitz و Styles، از جمله پست اخیر PDA در Deuxmoi که این زوج را نشان می دهد، اظهار نظر می کند. طرفداران حدس می زدند که در واقع تیتوم این حساب را اجرا می کند، تا حدی به این دلیل که او آن را دنبال کرده است. حدس و گمان آنقدر شدید شد که خود تیتوم مجبور شد هوا را پاک کند. داستان‌های پرطرفدار ببینید ویلیام شاتنر کاور متالیکا و آزی آزبورن را در اولین هوی متال What Waits Sean Combs پس از آزادی او از زندان سوزانا هافز یادداشت‌هایی"}, {"source": "Rolling Stone", "title": "Sea.Hear.Now 2026: See The Best Photos", "link": "https://www.rollingstone.com/music/music-pictures/sea-hear-now-festival-2026-best-photos-beach-1235629464/", "summary": "Every year since 2018 — except for 2020, thanks to the pandemic — the Sea.Hear.Now festival in Asbury Park, N.J., has provided a destination for East Coast music fans. Past lineups have included some of the biggest names in rock, including headline sets by Bruce Springsteen and the E Street Band, Pearl Jam, Brandi Carlile, [ ]", "date_str": "2026-09-21T21:38:35+00:00", "hash": "60e9448f2bd771b9", "title_fa": "Sea.Hear.Now 2026: بهترین عکس ها را ببینید", "summary_fa": "از سال 2018 هر سال - به جز سال 2020، به لطف همه‌گیری - جشنواره Sea.Hear.Now در آسبری پارک، نیوجرسی، مقصدی را برای طرفداران موسیقی ساحل شرقی فراهم کرده است. ترکیب‌های قبلی برخی از بزرگ‌ترین نام‌های راک را شامل می‌شوند، از جمله مجموعه‌های تیتراژ توسط بروس اسپرینگستین و گروه ای استریت، پرل جم، برندی کارلیل، [ ] گروه هفت نفره مستقر در فیلادفیا، جمعه شب بدیعی را در خیابان کوکمن اجرا کردند و تماشاگران جشنواره را با آهنگشان با هم متحد کردند."}, {"source": "Rolling Stone", "title": "Mark Hoppus Remembers New Found Glory’s Chad Gilbert: ‘I Miss You Already, Little Brother’", "link": "https://www.rollingstone.com/music/music-features/mark-hoppus-blink-182-chad-gilbert-new-found-glory-tribute-1235629441/", "summary": "The Blink-182 singer-bassist pays tribute to his friend and New Found Glory’s founding guitarist, who died Sunday after a battle with brain cancer", "date_str": "2026-09-21T18:47:05+00:00", "hash": "6a7f2dab93b98cb6", "title_fa": "مارک هاپوس چاد گیلبرت از New Found Glory را به یاد می آورد: «از قبل دلم برایت تنگ شده، برادر کوچک»", "summary_fa": "خواننده و بیسیست Blink-182 به دوستش و گیتاریست بنیانگذار New Found Glory که یکشنبه پس از نبرد با سرطان مغز درگذشت، ادای احترام می کند. مارک هاپوس، خواننده اصلی، بنیانگذار و نوازنده بیس Blink-182، در طول سالها با گیلبرت، چه در داخل و چه خارج از تور، آشنا شد. هاپوس که خود یک نجات یافته از سرطان بود، با گیلبرت در مورد این بیماری صحبت کرد، اما پیوند آنها بسیار عمیق تر شد. هاپوس در این ادای احترام منحصر به فرد گیلبرت را به یاد می آورد. من همیشه چاد گیلبرت را برادر کوچکم می دانستم. یادم نیست روزی که همدیگر را دیدیم او و یکسری از دوستان احمقش به هر برنامه ای که Blink در فلوریدا اجرا می کرد می آمدند. منظورم هر نمایش است. این افراد دور هم جمع می‌شدند و سؤال می‌پرسیدند و مکان‌های خوب برای خوردن را به ما نشان می‌دادند. ما هر بار که Blink در فلوریدا می چرخید، با هم می نشستیم. و چاد همیشه لبخند می زد. فقط شادترین، مشتاق ترین لعنتی، بله، زندگی حکم می کند پسر خروس عاشق موسیقی که تا به حال می توانید امیدوار باشید که ملاقات کنید. لعنتی خنده دار آروم باش، مرد، متوجه شدیم. حکومت کرد. در مقطعی متوجه شدم که او در گروهی به نام New Found Glory حضور داشت و آنها آلبومی را در Drive-Thru Records منتشر کردند (که در آن زمان سبک بود). حکومت کرد. نمی توانستم از گوش دادن به آن دست بردارم. من آن را برای همه کسانی که می شناختم بازی کردم. من آن را برای دوستان و برچسب ها و ایستگاه های رادیویی پخش کردم. من از مدیریت خود خواهش کردم که آنها را قبول کنند. آنها با لیبل ما امضا کردند و مدیران ما آنها را به عنوان مشتری و دوست پذیرفتند. پلک زدن آنها را به تور برد."}, {"source": "Rolling Stone", "title": "Miley Cyrus Finds Contentment in New Motivations on ‘Bass Persuades’", "link": "https://www.rollingstone.com/music/music-album-reviews/miley-cyrus-bass-persuades-review-1235629586/", "summary": "Massive bangers don't seem to motivate her any more — at least, not as much as the love she goes home to at the end of the night", "date_str": "2026-09-21T18:44:47+00:00", "hash": "c175bc4f7c480de1", "title_fa": "مایلی سایرس از انگیزه های جدید در «Bass Persuades» راضی می شود", "summary_fa": "به نظر می‌رسد که صداهای انبوه دیگر انگیزه‌ای برای او ایجاد نمی‌کند - حداقل، نه به اندازه عشقی که در پایان شب به خانه می‌رود. روز قبل از انتشار آلبوم جدید مایلی سایرس، Bass Persuades، او به زین لو از Apple Music گفت که زندگی در جاده تهدیدی بیش از حد برای متانت او است، که به شدت متکی به عادت و سازگاری مداوم است. او به جای ریسک کردن، ترجیح می‌دهد در یک مکان بماند و مخاطبانش به سمت او بیایند، مانند دو نمایش هالیوود بول که در راه است. کوروش گفت: این عالی است زیرا مردم دوست دارند اجرای من را ببینند و من دوست دارم در تخت مارشمالو بخوابم. هر دوی ما می توانیم خوشحال باشیم. خوب، به نوعی، اما نه کاملاً. در حالی که طرفداران در حال نمایش و تشریح احساسات او بودند که مردم به سراغ من خواهند آمد، بخش دیگری از مصاحبه وجود داشت که آنها نادیده گرفتند. شاید در زمینه اصلی آن چندان مهم به نظر نمی رسید، اما جزئیات کوچکی است که برای درک Bass Persuades و هنرمند سازنده آن بسیار مهم است. در یک نقطه، کوروش در حال تأمل در غم و اندوه، اضطراب و تجربه نزدیک به مرگ در سال 2022 است و سپس به خاطره ای خاص از اجرای آهنگ Fly on the Wall برای 250000 نفر اشاره می کند. او گفت که من شروع کردم به درک وجودی از اینکه چقدر کوچک هستم و چگونه شروع به فکر کردن به زمان کردم. و این همه زمانی است که من Fly on the Wall را اجرا می کنم. او به شوخی می‌گفت که نمی‌خواهد با اگزیستانسیالیسم خود این حس را در طول کات‌های اولیه‌ای که جمعیت شنیده بودند، از بین ببرد. کوروش تعداد زیادی از این آهنگ های قدیمی و پر سر و صدا را در آن مجموعه 2022"}, {"source": "Rolling Stone", "title": "Seven Reasons Why You Should See Harry Styles Right Now", "link": "https://www.rollingstone.com/music/music-features/harry-styles-together-together-reasons-to-see-live-2026-1235610318/", "summary": "Together, Together will hit six more cities next year. From euphoric vibes to high fashion (and yes, celebrity sightings), here’s why it’s absolutely necessary to catch this tour", "date_str": "2026-09-21T18:40:01+00:00", "hash": "69701572829a8096", "title_fa": "هفت دلیل که چرا باید همین حالا هری استایلز را ببینید", "summary_fa": "با هم، Together در سال آینده به شش شهر دیگر خواهد رسید. از حال و هوای سرخوشانه گرفته تا مد بالا (و بله، مشاهدات افراد مشهور)، این است که چرا تماشای این تور کاملا ضروری است. او در حال ضربه زدن به شش شهر آمریکای شمالی است و سپس به خارج از کشور می رود، همراه با بازیگران ستاره ای که شامل کارولین پولاک، تیناشه، اشک برای ترس ها، لینی ویلسون و غیره می شود (استایلز در انتخاب نقش های مکمل عالی مهارت دارد). هر چه سال آینده بیاورد، ما همچنان می‌توانیم با همه دوستانمان برقصیم. همان طور که همکارم راب شفیلد گفت که برای اولین بار در سه سال برگزار می شود، نوعی نمایش پاپ است که پرها را در سراسر زمین به جا می گذارد و هیستری در هوا باقی می ماند. این نمایش در بهار گذشته در آمستردام و پس از انتشار آلبوم جدید او \"Kiss All Time\" آغاز شد. دیسکو، گهگاهی، و او فقط از آن زمان به بعد آن را افزایش داده است، به ویژه با اجرای 30 تاریخ خود در مدیسون اسکوئر گاردن که همیشه بهتر و بهتر می شود. یک شب به جمعیت گفت: ما با هم می خوانیم، با هم می رقصیم، این لحظه را با هم تقسیم می کنیم، با هم عرق می کنیم. یک عصر منزجر کننده خواهد بود! به عنوان بخشی از فرنچایز جدید ما Don t Miss Out، در اینجا دلایلی وجود دارد که چرا باید همین الان Styles را ببینید. اما شما به آنها نیاز نداشتید، نه؟ آماده، ثابت، برو! Styles برای هر Together آماده می شود، Together قبل از اینکه حتی وارد محل برگزاری مسابقه شود و در اوایل تابستان امسال دویدن شش مایلی خود را به ومبلی برساند، یا بارها در حال قدم زدن در شهر نیویورک دیده شده است، از جمله اینکه یک روز"}, {"source": "Hollywood Reporter", "title": "Hayden Panettiere Died From Toxic Effects of Fentanyl, Other Drugs", "link": "https://www.hollywoodreporter.com/news/general-news/hayden-panettiere-cause-of-death-1236707486/", "summary": "The actress' death last month has been ruled an accident.", "date_str": "2026-09-22T14:30:31+00:00", "hash": "9c99a39ef610ecec", "title_fa": "هیدن پانتییر بر اثر اثرات سمی فنتانیل و سایر داروها درگذشت", "summary_fa": "علت مرگ هایدن پانتییر فاش شد. این بازیگر که ماه گذشته در سن 36 سالگی درگذشت، بر اثر اثرات سمی فنتانیل و همچنین داروهای تجویزی، از جمله آلپرازولام، که با نام تجاری زاناکس شناخته می شود، درگذشت. متوکاربامول، شل کننده عضلات؛ و کوتیاپین، یک داروی ضد روان پریشی که برای درمان اسکیزوفرنی، اختلال دوقطبی و اختلال افسردگی اساسی استفاده می شود. طبق اعلام اداره پزشکی قانونی شهرستان گرینویل که اوایل سه شنبه یافته های خود را اعلام کرد، نحوه مرگ تصادفی اعلام شد. داستان‌های مرتبط تلویزیون روبی رز هیدن پانتی‌یر را به یاد می‌آورد: ما همه چیز را در اخبار مشترک داشتیم نماینده هیدن پانتی‌یر کسانی را که در میان تحقیقات مرگ شایعات و گمانه‌زنی‌ها را دامن می‌زنند محکوم می‌کند همانطور که قبلاً گزارش شده بود، پانتی‌یر در یکی از اقامتگاه‌های گرین‌ویل، کارولینای جنوبی، بدون پاسخ‌گویی پیدا شد، و اولین بازداشت‌کنندگان به کارت EMS پاسخ دادند. تلاش‌های احیا ناموفق بود و مرگ او اعلام شد. پانتی یر که بازیگری را از کودکی آغاز کرد، در مورد مبارزه خود با سوء مصرف مواد آشکارا صحبت کرده بود و در سال 2022 فاش کرد که سال ها را صرف مبارزه با اعتیاد به مواد افیونی و الکل کرده است. او در آن زمان به مجله People گفت: لطف من این است که نمی‌توانم در صحنه فیلمبرداری و کار بی‌نظم باشم. اما اوضاع از کنترل خارج شد. و همانطور که بزرگتر شدم، مواد مخدر و الکل چیزی شد که تقریباً نمی توانستم بدون آن زندگی کنم. پانتی یر پس از استقبال از دختر کایا با ولادیمیر کلیچکو سابق، با افسردگی پس از زایمان دست و پنجه نرم کرد، که به دنبال درمان آن بود، اما با فروپاشی رابطه اش با کلیچکو، به مبارزه با نوشیدن و استفاده از مواد افیونی ادامه داد."}, {"source": "Hollywood Reporter", "title": "Billy Bush Joins Fox News As Contributor", "link": "https://www.hollywoodreporter.com/tv/tv-news/billy-bush-joins-fox-news-1236707487/", "summary": "The former 'Access Hollywood' correspondent will make his debut Tuesday on Fox News’ 'Jesse Watters Primetime.'", "date_str": "2026-09-22T14:26:29+00:00", "hash": "83dc7be6762a74aa", "title_fa": "بیلی بوش به عنوان همکار به فاکس نیوز پیوست", "summary_fa": "خبرنگار سابق \"Access Hollywood\" اولین کار خود را در روز سه شنبه در برنامه \"Jesse Watters Primetime\" شبکه فاکس نیوز انجام خواهد داد. بیلی بوش به عنوان همکار به فاکس نیوز پیوست. این پادکست و مجری تلویزیونی اولین حضور خود را در روز سه‌شنبه در شبکه فاکس نیوز جسی واترز پرایم‌تایم (۸ بعد از ظهر به وقت شرقی) انجام خواهد داد و برنامه‌هایی برای حضور در تمامی پلتفرم‌های فاکس دارد. بوش در حال حاضر میزبان Hot Micks with Billy Bush است، یک نمایش دیجیتالی که ورزش، سیاست، سرگرمی، فناوری و فرهنگ پاپ را پوشش می دهد، پس از پنج فصل میزبانی Extra از سال 2019 تا 2025. پیش از این، بوش به عنوان مجری مشترک ساعت سوم امروز شبکه NBC و همچنین خبرنگار ساحل شرقی Access Hollywood و مجری برنامه رادیویی موسیقی و گفتگوی ملی، نمایش بیلی بوش، فعالیت می کرد. من برای پیوستن به FOX News Media و مخاطبان وفادار آن هیجان‌زده هستم تا دیدگاه خود را در مورد مردم، ایده‌ها و لحظاتی که فرهنگ امروز را شکل می‌دهند به اشتراک بگذارم. بوش گفت که مجری برنامه همچنین پس از اینکه در سال 2016 یک اکسس نشان داد که دونالد ترامپ، نامزد ریاست جمهوری در آن زمان، در حال صحبت با بوش در مورد چنگ زدن نامناسب زنان بود، در تیتر خبرها قرار گرفت. واشنگتن پست ماجرا را منتشر کرد و بوش شغل خود را در NBC امروز از دست داد. او برادرزاده رئیس جمهور سابق جورج اچ دبلیو بوش و پسر عموی رئیس جمهور سابق جورج دبلیو بوش و جب بوش فرماندار سابق فلوریدا است. بوش رویدادهای مهم سرگرمی زنده از جمله گلدن گلوب، گرمی و جوایز اسکار را پوشش داده است. او بازی های المپیک را از سال 2004 تا 2016 در شبکه NBC پوشش می داد و از عروسی شاهزاده ویلیام با کاترین میدلتون برای NBC"}, {"source": "Hollywood Reporter", "title": "More Xbox Layoffs Hit as Massive Reorg Continues; Activision to Make Next ‘Halo’ Game", "link": "https://www.hollywoodreporter.com/business/business-news/xbox-layoffs-reorg-activision-takes-over-halo-games-1236707478/", "summary": "The Microsoft-owned gamemaker is in the process of eliminating 3,200 jobs.", "date_str": "2026-09-22T14:24:20+00:00", "hash": "439fc3133ab83e6b", "title_fa": "اخراج های بیشتر Xbox با ادامه Massive Reorg. اکتیویژن برای ساخت بازی بعدی \"Halo\".", "summary_fa": "این بازی ساز متعلق به مایکروسافت در حال حذف 3200 شغل است. مت بوتی، مدیر ارشد محتوای این شرکت در یک یادداشت داخلی که توسط هالیوود ریپورتر به دست آمده است، اعلام کرد که ایکس باکس امروز 268 کارگر دیگر را اخراج می کند. این به سادگی دور بعدی در یک ماموریت گسترده تر برای کاهش تعداد کارکنان به میزان 3200 است. علاوه بر این، استودیو اکتیویژن، استودیوی Call of Duty، بازی بعدی Halo را خواهد ساخت. بازی‌های Halo قبلاً توسط سازنده فرنچایز Bungie و بعدها Halo Studios (FKA 343 Industries) ساخته شده‌اند. Activision همچنین بازی‌های Crash Bandicoot، Spyro the Dragon و Tony Hawk Pro Skater را می‌سازد. تیم، من می‌نویسم تا چندین به‌روزرسانی را به‌عنوان بخشی از بازنشانی XBOX که در اوایل امسال مشخص شد، به اشتراک بگذارم. اول، ما در حال حذف 268 نقش در استودیو Halo، دیگر استودیوهای شخص اول، و مدیریت XGS و لایه توابع مرکزی هستیم. اقدامات تکمیل شده از ژوئیه، شامل واگذاری استودیو، تقریباً سه چهارم راه را برای تجدید ساختار اعلام شده قبلی به ارمغان می آورد. من عمیقاً از آنچه همکارانمان ساخته اند سپاسگزارم و می دانم که امروز برای کسانی که می روند و تیم های اطرافشان چقدر سخت خواهد بود. دوم، ما در حال سازماندهی مجدد استودیوهای خود هستیم. هدف این است که امتیازات و بازی‌های خود را با راه اندازی واحدهای تجاری کمتر، همسو کردن گروه‌هایی که از قبل نزدیک با هم کار می‌کنند، و تمرکز تخصص ما در انتشارات، تقویت کنیم. سوم، به‌روزرسانی در مورد واگذاری‌های استودیو ما: در ماه آگوست، Compulsion و Double Fine با IP، کاتالوگ‌های پشتیبان و بودجه باند به مدیریت بازگشتند. Undead Labs اکنون با موفقیت شرایط مشابه را تغییر داده است و با یک ناشر جدید، State of Decay 3 روز اول را در Game Pass منتشر خواهد کرد. متأسفانه، دو قرارداد جداگانه"}, {"source": "Hollywood Reporter", "title": "Peter Berg’s Netflix War Movie ‘The Mosquito Bowl’ to Premiere at AFI Fest (Exclusive)", "link": "https://www.hollywoodreporter.com/movies/movie-news/peter-berg-netflix-mosquito-bowl-premiere-2026-afi-fest-1236707355/", "summary": "The film, an adaptation of Buzz Bissinger's bestseller of the same name, will premiere in a Gala slot on Oct. 22.", "date_str": "2026-09-22T14:00:00+00:00", "hash": "f10f29f4fb8b5c34", "title_fa": "فیلم جنگی پیتر برگ به نام «کاسه پشه» در نتفلیکس برای نمایش در جشنواره AFI (اختصاصی)", "summary_fa": "این فیلم که اقتباسی از پرفروش‌ترین کتاب باز بیسینجر به همین نام است، در 22 اکتبر در یک جشن گالا اکران خواهد شد. هالیوود ریپورتر به طور انحصاری گزارش می دهد که تهاجم وحشیانه به اوکیناوا، اولین نمایش جهانی خود را در چهلمین جشنواره AFI FEST خواهد داشت. این فیلم در 22 اکتبر در یک نمایش گالا در تئاتر چینی TCL رونمایی خواهد شد. برگ و بیسینجر که پسر عمو هستند، قبلا در فیلم 2004 و نسخه های تلویزیونی 2008-2011 Friday Night Lights همکاری کرده بودند. داستان‌های مرتبط فیلم‌ها در تریلر کلیف غرفه نتفلیکس، براد پیت در تلویزیون لئوناردو دی کاپریو به بازی لئوناردو دی کاپریو اشاره می‌کند. ماگنولیاهای شیرین در نتفلیکس پس از پنج فصل فیلم «کاسه پشه» که برگ با همکاری مارک ال. اسمیت به کارگردانی و تهیه کنندگی در کنار برایان گریزر و الکس گاینر، چهار ستاره نوظهور هالیوود را بازی می کند: نیکلاس گالیتسین در نقش جان مک لاگری، بیل اسکارسگ در نقش باب باومن، ری نیکلسون در نقش تونی بوتکوویچ و تام فرانسیس در نقش دیوید شراینر. نتفلیکس آن را در تاریخ 30 اکتبر در سینماها و سپس در 25 نوامبر در پلتفرم استریم خود منتشر خواهد کرد. THR همچنین دریافته است که The Mosquito Bowl جوایزی دریافت خواهد کرد که کلیت فیلم و افراد فوق الذکر و همچنین دستاوردهای مهم تیم صنایع دستی فیلم را برجسته می کند. در میان افراد برجسته: ویلی استیتمن، طراح صدا که 9 بار نامزد جایزه اسکار شده، آریل ولاسکو شاو ناظر VFX نامزد جایزه اسکار، آنجلا کونته طراح آرایش مو و برنده جایزه بفتا، فیل آیوی طراح تولید نامزد جایزه بفتا، ژاک ژوفرت فیلمبردار، ژاک ژوفرت فیلمبردار در جوایز اسکای زوفرت، آهنگسازان و آهنگسازان اکسلوستا. دانلی و ریچل تنر، کارگردان بازیگر."}, {"source": "Hollywood Reporter", "title": "Tupac Shakur Murder Trial Doc in The Works", "link": "https://www.hollywoodreporter.com/tv/tv-news/tupac-shakur-trial-documentary-1236707464/", "summary": "The feature documentary from Passion Pictures and Propagate Content will follow Duane “Keffe D” Davis being tried and eventually convicted in the long-unsolved case following the rapper’s 1996 infamous death.", "date_str": "2026-09-22T14:00:00+00:00", "hash": "4b3cf8df188ac432", "title_fa": "مستند دادگاه قتل توپاک شکور در The Works", "summary_fa": "این مستند داستانی از Passion Pictures و Propagate Content به دنبال محاکمه و در نهایت محکومیت Duane \"Keffe D\" Davis در پرونده طولانی مدت حل نشده پس از مرگ بدنام رپر در سال 1996 خواهد بود. یک مستند داستانی درباره محاکمه قتل توپاک شکور و محکومیت دوان کفه دی دیویس قرار است توسط ماریان محمد نامزد جایزه امی برای پروپاگاند محتوا و فیلم شور کارگردانی شود. فیلم جنایی واقعی نگاهی درونی به دادگاه اخیر هیئت منصفه در لاس وگاس خواهد داشت که پس از مرگ بدنام رپر در 30 سال پیش و نقش دیویس در سازماندهی قتل او انجام شد. این مستند در سال 2027 در Sky Documentaries و سرویس استریم NOW قرار خواهد گرفت و شامل مصاحبه هایی با اعضای خانواده شکور در مورد درام دادگاه خواهد بود. داستان‌های مرتبط سبک زندگی زندایا بار دیگر همه را در رده‌بندی قدرت فرش قرمز Emmys اجرا می‌کند. کارگردان محمد همچنین برنده بفتا است و تیتراژ فیلمی از جمله دفاع از Digga D و Cult Massacre: One Day in Jonestown دارد. وقایع دادگاه قتل او قرار است با اولین روز شواهد آغاز شود و طبق برنامه در 13 اکتبر به صدور حکم و محکومیت دیویس برسد. دادستان بیش از 22 شاهد از جمله افسران پلیس و بازرسان را در طول دادگاه فراخواند. قتل طولانی مدت حل نشده شکور با خشونت گروهی و رقیب شدید هیپ هاپ ساحل شرقی / ساحل غربی در دهه 1990 درگیر شد. گروه ضبط شکور Death Row، به رهبری سوج نایت، که رانندگی ماشین را در شبی که شکور مورد اصابت گلوله قرار گرفت، به گروه خون‌ها وابسته بود و رقیب Bad Boy Records، که توسط شان دیدی کامبز تأسیس شده بود، ادعا می‌کرد که با کریپ‌ها ارتباط دارد."}, {"source": "Hollywood Reporter", "title": "Mike Leigh Explains Why “It’s More Than Probable” That ‘Tender Loving Care’ Is His Final Film", "link": "https://www.hollywoodreporter.com/movies/movie-news/mike-leigh-final-film-tender-loving-care-1236707446/", "summary": "At a San Sebastian Film Festival press conference on Tuesday, the British director was asked about his retirement and staying optimistic when \"so many things are happening in the world, which are frightening and limiting.\"", "date_str": "2026-09-22T13:29:28+00:00", "hash": "02345103ceb089f0", "title_fa": "مایک لی توضیح می دهد که چرا «بیش از محتمل است» که «مراقبت محبت آمیز» آخرین فیلم او باشد", "summary_fa": "در کنفرانس مطبوعاتی جشنواره فیلم سن سباستین در روز سه‌شنبه، از کارگردان بریتانیایی درباره بازنشستگی و خوش‌بین بودن‌اش در زمانی که «خیلی چیزها در دنیا رخ می‌دهد، ترسناک و محدودکننده» سؤال شد. مایک لی، نویسنده محبوب بریتانیایی، به جشنواره فیلم سن سباستین توضیح داده است که چرا به احتمال زیاد آخرین فیلم کمدی درام او، مراقبت عاشقانه، آخرین فیلم او خواهد بود. این فیلمساز از طریق لینک ویدئویی در یک کنفرانس مطبوعاتی برای عنوان مسابقه، در کنار تهیه کننده جورجینا لو و بازیگران آلیس بیلی جانسون، پل جسون و ماریون بیلی، که مادر بیلی جانسون و شریک زندگی واقعی لی است، ظاهر شد. همبازی آنها کیت او فلین، که به تازگی جایزه امی را برای اجرای صحنه دزدی خود در Widow s Bay دریافت کرد، نتوانست به جشنواره فیلم در شمال اسپانیا سفر کند. داستان‌های مرتبط Business VFX House 22Dogs تأسیسات جدیدی را در استودیو Pinewood Toronto راه‌اندازی می‌کند (اختصاصی) فیلم‌ها جشنواره فیلم دریای سرخ نسخه 2026 را لغو می‌کند، قول می‌دهد سال آینده با چشم‌انداز تجدیدشده بازگردد، لی در پاسخ به این سوال که آیا Tender Loving Care واقعاً آخرین فیلم او خواهد بود، گفت: این کاملاً ساده است. من یک وضعیت پزشکی [میوزیت] دارم که بر حرکت عضلانی من تأثیر می گذارد و حرکت کردن در اطراف بسیار دشوار است. [این] مطمئناً برای یک فیلمساز دشوارتر از آن چیزی است که باید باشد، و به همین دلیل بیش از حد محتمل است که این فیلم آخرین فیلم من باشد. او توضیح داد که همین. این یک موضوع عملی است که با وضعیت پزشکی من یک وضعیت فیزیکی انجام شود. لی در سال جاری چندین بار به مبارزه با بیماری مبتلا به سیستم ایمنی اشاره کرده است، زیرا Tender Loving Care اولین حضور خود را در Telluride، TIFF و اکنون در سن سباستین انجام داد. اگر قرار باشد آخرین"}, {"source": "Hollywood Reporter", "title": "California Vowed to Stop Paramount-Warner Bros. Merger. Why Did It Fold?", "link": "https://www.hollywoodreporter.com/business/business-news/california-paramount-warner-bros-settle-why-fold-1236707326/", "summary": "Political pressure, a dice roll of an antitrust trial and competing factions within the alliance of states and the Writers Guild of America all played a part in the states' decision to settle.", "date_str": "2026-09-22T13:16:56+00:00", "hash": "facf4b00cbed9dbd", "title_fa": "کالیفرنیا متعهد شد که ادغام پارامونت و برادران وارنر را متوقف کند. چرا تا شد؟", "summary_fa": "فشار سیاسی، تاس یک محاکمه ضد انحصار و جناح های رقیب در اتحاد ایالت ها و انجمن نویسندگان آمریکا، همگی در تصمیم ایالت ها برای حل و فصل نقش داشتند. متن لوگو برای ماه‌ها، راب بونتا، دادستان کل کالیفرنیا به هر کسی که گوش می‌داد می‌گفت پیشنهاد 111 میلیارد دلاری پارامونت برای برادران وارنر دیسکاوری هالیوود را خراب می‌کند و او می‌تواند ادغام را متوقف کند. سپس، زمانی که اهرم او به بالاترین حد خود رسید، نادیده گرفتن واقعیت های سیاسی و اقتصادی پیرامون این مسابقه برای او غیرممکن شد. این فشار از بالا آمد. فرماندار گاوین نیوسام در مورد شکایت ایالت، به ویژه در رابطه با سطوح اشتغال ابراز نگرانی کرده بود. او خود را وارد مذاکرات کرده بود تا راه حلی را تشویق کند. او ماه گذشته در یک سخنرانی مطبوعاتی گفت: من بسیار حواسم به این هستم که این به چه معناست که شهرت ما را نشان می دهد، و افزود که تهدید مدیر عامل شرکت دیوید الیسون مبنی بر خروج از کالیفرنیا را جدی گرفته است. در واقع، اثر انگشت نیوسام در سراسر اعلام این توافق بود. پارامونت از حمایت او در طول این فرآیند تشکر کرد. بین خطوط بخوانید و تصویر مورد توجه قرار می گیرد: نیوسام یک معامله می خواست و بونتا در صف قرار گرفت. نیوسام با تکیه بر بونتا همراه با کارن باس، شهردار لس آنجلس و خاویر بسرا، نامزد فرمانداری، دادستان ارشد ایالت را در موقعیتی غیرقابل دفاع قرار داد. کالیفرنیا برای متوقف کردن ادغام شکایت کرده بود، اما همچنین با احتمال از دست دادن پارامونت بدون توجه به نتیجه دعوی در صورتی که معامله قبل از ضرب‌الاجل اول اکتبر که به اصطلاح 7 میلیون دلار در روز شروع به افزایش کارمزد می‌شود، منعقد نشد، مواجه شد."}, {"source": "Hollywood Reporter", "title": "Neon Sets ‘Paper Tiger’ Awards Categories, Plans First Real Push for a James Gray Film (Exclusive)", "link": "https://www.hollywoodreporter.com/movies/movie-news/neon-oscars-paper-tiger-awards-categories-james-gray-1236706637/", "summary": "Miles Teller, Scarlett Johansson and Adam Driver are among the contenders for Gray's crime-thriller, which premiered at the Cannes Festival in May and will open the New York Film Festival on Friday.", "date_str": "2026-09-22T13:00:00+00:00", "hash": "a8455e98453cd32f", "title_fa": "مجموعه‌های جوایز «ببر کاغذی» نئون، اولین فشار واقعی را برای فیلم جیمز گری برنامه‌ریزی می‌کند (اختصاصی)", "summary_fa": "مایلز تلر، اسکارلت جوهانسون و آدام درایور از جمله رقبای فیلم جنایی گری گری هستند که در ماه می در جشنواره کن نمایش داده شد و روز جمعه جشنواره فیلم نیویورک را افتتاح خواهد کرد. ببر کاغذی، فیلم جنایی جیمز گری با بازی مایلز تلر، آدام درایور و اسکارلت جوهانسون، که برای اولین بار در جشنواره فیلم کن در ماه می به نمایش درآمد و قرار است جمعه شب جشنواره فیلم نیویورک را افتتاح کند. منحصرا گزارش دهید THR می‌تواند تأیید کند که به عنوان بخشی از این کمپین، نئون تلر را برای بهترین بازیگر مرد، راننده را برای بهترین بازیگر نقش مکمل مرد و جوهانسون را برای بهترین بازیگر نقش مکمل زن تبلیغ می‌کند، و به ماه‌ها گمانه‌زنی در مورد اینکه سه A-listers کجا خاتمه می‌یابند پایان می‌دهد. داستان‌های مرتبط فیلم‌های درون رده‌بندی Splashy NYFF: فرود مصنوعی، وزن کردن یک نمایش مخفیانه و افتتاحیه بر روی ببر کاغذی معجزه‌آسا (اختصاصی) فیلم‌های Na Hong-jin کارگردان کره‌ای درباره معنای پشت امید و برنامه‌های دنباله‌اش: خیلی‌ها را شگفت‌زده نکنید، اگر او مانند Tigers از فیلم شمالی عبور کرد، شگفت‌زده نشوید، نیمه اتوبیوگرافیک داستان این است که چگونه یک مرد خانواده یقه آبی (راننده) توسط برادر جاه طلب ترش (درایور) به یک شرکت تجاری نابخرد اغوا می شود که در نهایت دو نفر و همچنین همسر مرد (جوهانسون) و فرزندانش را در تیررس مافیای روسی قرار می دهد."}, {"source": "Hollywood Reporter", "title": "‘Heart of the Beast’ Review: Brad Pitt and His Canine Co-Star Earn Your Tears in David Ayer’s Tense, Tender Survival Thriller", "link": "https://www.hollywoodreporter.com/movies/movie-reviews/heart-of-the-beast-review-brad-pitt-david-ayer-1236706924/", "summary": "A former Special Forces soldier and his combat dog struggle to survive in the Alaskan wilderness in this adventure from the 'Fury' filmmaker.", "date_str": "2026-09-22T13:00:00+00:00", "hash": "098db84dce87fab4", "title_fa": "نقد و بررسی «قلب هیولا»: برد پیت و همبازی سگش اشک های شما را در فیلم هیجان انگیز بقای پرتنش دیوید آیر به دست می آورند.", "summary_fa": "یک سرباز سابق نیروهای ویژه و سگ رزمی اش برای زنده ماندن در بیابان آلاسکا در این ماجراجویی از فیلمساز \"Fury\" تلاش می کنند. اگر تریلر فیلم جدید برد پیت را دیده باشید، احتمالا فکر می کنید که این یک داستان دلخراش از بقا در یک بیابان خطرناک است. گول نخورید Heart of the Beast در واقع یک داستان عاشقانه است و یکی از تکان دهنده ترین داستان هایی است که در یک زمان طولانی به وجود آمده است. اینکه این یک داستان عاشقانه بین یک مرد و سگش است، به هیچ وجه از تأثیر احساسی آن کم نمی کند. در واقع، پیت نامزدی با همبازی خود را نشان می دهد که ممکن است پرطرفدارترین او باشد. اگرچه اگر منصف باشیم، این واقعاً نمی‌توان گفت، زیرا دو تا از برجسته‌ترین رمان‌های عاشقانه سینمایی او ملاقات با جو بلک، که در آن نقش مرگ را بازی می‌کرد، و آقای و خانم اسمیت، که در آن شخصیت او بیشتر فیلم را صرف تلاش برای کشتن همسرش کرد، هستند. داستان‌های مرتبط فیلم‌ها در تریلر کلیف غرفه نتفلیکس، براد پیت به بازی لئوناردو دی‌کاپریو ضربه می‌زند، دنباله‌ای از جنگ جهانی Z با بازگشت برد پیت، ادوارد برگر کارگردانی قلب هیولا را کارگردانی می‌کند. تاریخ اکران : جمعه 25 سپتامبر بازیگران : Brad Pitt, J.K. سیمونز، آنا لمبه کارگردان: دیوید آیر فیلمنامه‌نویس: کامرون الکساندر دارای رتبه PG-13، 1 ساعت و 41 دقیقه این فیلم، که پیت را با کارگردان فیلم Fury خود، دیوید آیر، پیوند می‌دهد، بازیگر نقش جیمز بلمونت را نشان می‌دهد که پس از 30 سال حضور در نیروهای ویژه بازنشسته شد و او را در جنگ در عراق و افغانستان دید. اکنون او زندگی آرام و انفرادی دارد. خوب، نه کاملاً انفرادی، زیرا او آن را با اودون، سگ رزمی ژرمن شپرد دوست داشتنی خود، که ماموریت های خطرناک بسیاری را با"}, {"source": "Hollywood Reporter", "title": "VFX House 22Dogs Launches New Facility at Pinewood Toronto Studios (Exclusive)", "link": "https://www.hollywoodreporter.com/business/business-news/vfx-house-22dogs-1236706967/", "summary": "The Milan-based visual effects studio has expanded beyond a Los Angeles commercial office to set its North American headquarters in Canada.", "date_str": "2026-09-22T13:00:00+00:00", "hash": "db771bd08d039ae2", "title_fa": "VFX House 22Dogs امکانات جدیدی را در استودیو Pinewood Toronto راه اندازی کرد (انحصاری)", "summary_fa": "استودیوی جلوه های بصری مستقر در میلان فراتر از یک دفتر تجاری در لس آنجلس گسترش یافته و دفتر مرکزی خود را در آمریکای شمالی در کانادا قرار داده است. 22Dogs VFX، استودیوی جلوه‌های بصری پشت کار بر روی برنامه تلویزیونی Apple TV و سریال هیجان انگیز Here Comes the Flood در نتفلیکس، پایگاه جدیدی در تورنتو به عنوان مقر خود در آمریکای شمالی افتتاح کرده است. استودیوی بین‌المللی مستقر در میلان، با اعتبارات VFX همچنین در نتفلیکس Outer Banks، Lionsgates Day Drinker و Prime Videos The Greatest، در حال حاضر یک دفتر تجاری در لس آنجلس در ردپای جهانی خود دارد. دفتر مرکزی جدید آمریکای شمالی در استودیو Pinewood Toronto، سومین استودیوی تولیدی 22Dogs VFX پس از امکاناتی در میلان و تنریف خواهد بود. 22Dogs VFX به دیگر استودیوهای جهانی در تورنتو می‌پیوندد و جلوه‌های بصری را برای استودیوهای بزرگ و پخش‌کننده‌هایی که به دنبال معافیت‌های مالیاتی دیجیتال، پس‌انداز ارز و هزینه‌های کمتر نیروی کار در انتاریو هستند، انجام می‌دهد. تاسیسات استودیو Pinewood Toronto روزانه توسط سامارا ملانسون، رئیس استودیو هدایت می‌شود، که از نزدیک با آندریا ماروتی، شریک و تهیه‌کننده اجرایی 22Dogs، مستقر در دفتر تجاری لس‌آنجلس، همکاری خواهد کرد. از زمان تأسیس 22Dogs، چشم انداز ما همیشه این بوده است که استودیویی بسازیم که در آن خلاقیت، نوآوری و همکاری برای حمایت از فیلمسازان در بالاترین سطح گرد هم آیند. کارلو توسی، بنیانگذار 22Dogs VFX در بیانیه‌ای گفت: تورنتو گام بعدی طبیعی در سفر جهانی ما است، و ما مشتاق هستیم که از هنرمندان، شرکا و مشتریان جدید استقبال کنیم زیرا همچنان به رشد ردپای بین‌المللی خود ادامه می‌دهیم. دفتر لس آنجلس به همکاری نزدیک با استودیوها و پخش‌کننده‌های بزرگ و تهیه‌کنندگان بین‌المللی ادامه خواهد داد، که بسیاری از آنها کارهای فیلم و سریال‌های تلویزیونی را برای تولید و پس از تولید به کانادا می‌آورند. استودیو Pinewood"}, {"source": "Variety", "title": "This $760 ‘Handmaid’s Tale’ Box Set Comes With Hand-Signed Artwork and a New Margaret Atwood Introduction", "link": "https://variety.com/2026/shopping/news/handmaids-tale-testaments-box-set-signed-limited-edition-1236872074/", "summary": "The Folio Society is giving Margaret Atwood’s Gilead novels a lavish makeover. The independent publisher is releasing a new collector’s edition box set of “The Handmaid’s Tale” and “The Testaments,” limited to just 750 hand-signed copies and priced at $760. The set, featuring new artwork from acclaimed Italian illustrators Anna and Elena Balbusso, will be [ ]", "date_str": "2026-09-22T14:23:34+00:00", "hash": "eb109f1f0cdb4362", "title_fa": "این جعبه جعبه 760 دلاری «Handmaid's Tale» همراه با آثار هنری با امضای دستی و معرفی جدید مارگارت اتوود است.", "summary_fa": "انجمن Folio به رمان‌های Gilead اثر مارگارت اتوود تغییراتی مجلل داده است. این ناشر مستقل مجموعه جعبه‌های نسخه کلکسیونی جدیدی از «داستان ندیمه» و «عهدنامه‌ها» را منتشر می‌کند که تنها در 750 نسخه با امضای دستی و قیمت 760 دلار محدود شده است. این مجموعه، شامل آثار هنری جدید از تصویرگران سرشناس ایتالیایی آنا و النا بالبوسو، [ ] خواهد بود اگر محصول یا خدماتی را که به طور مستقل بررسی شده را از طریق پیوندی در وب سایت ما خریداری کنید، Variety ممکن است کمیسیون وابسته دریافت کند. قابل ذکر است، تاریخ انتشار مصادف با روز انتخابات در ایالات متحده است، جایی که انتخابات میان دوره ای 2026 تمام 435 کرسی مجلس و تقریباً یک سوم مجلس سنا را تعیین می کند. رمان‌های دیستوپیایی اتوود، جمهوری گیلاد را تصور می‌کنند، جامعه‌ای توتالیتر که زنان را از حقوق اساسی محروم کرده و نقش‌های اجتماعی سفت و سختی را به آنها اختصاص داده است. داستان ندیمه برای اولین بار در سال 1985 منتشر شد و از آن زمان به یکی از شناخته شده ترین آثار نویسنده تبدیل شد، در حالی که دنباله آن، The Testaments در سال 2019، برنده جایزه بوکر شد. برای نسخه جدید فولیو، این دو رمان در جعبه نمایش تاشو طراحی شده توسط دوقلوهای بالبوسو قرار می گیرند که تصاویر آن تکنیک های طراحی و نقاشی دستی از جمله مداد، آبرنگ، گواش و تمپر را با روش های دیجیتال ترکیب می کند. هنرمندان رویکرد بصری به کتاب ها را یک کابوس سورئالیستی توصیف می کنند. او قبلاً خواهران نسخه 2012 The Handmaids Tale را در انجمن Folio Society مصور کرده بودند، سالها قبل از اینکه این رمان در سریال موفق Hulu با بازی الیزابت ماس ​​اقتباس شود. دوقلوهای بالبوسو در بیانیه ای گفتند که نمایش نسخه 2012 The Handmaids Tale برای ما یک رعد و برق خالص بود"}, {"source": "Variety", "title": "Rachel Maddow’s ‘Kill. Bury. Print.’ Wins 2026 David Carr Award From Montclair Film Festival", "link": "https://variety.com/2026/tv/news/rachel-maddow-kill-bury-print-wins-2026-david-carr-award-1236871616/", "summary": "The 2026 Montclair Film Festival will present producer Rachel Maddow and director Ben Klein with its 2026 David Carr Award For Truth In Non-Fiction Filmmaking for their new true crime documentary, “Kill. Bury. Print.” The film follows the standoff between a tiny family-run newspaper and the local sheriff s department in McCurtain County, Oklahoma. Maddow first [ ]", "date_str": "2026-09-22T14:20:00+00:00", "hash": "2e614efc1568f685", "title_fa": "راشل مدو «کشتن». دفن کنید. Print.’ برنده جایزه دیوید کار 2026 از جشنواره فیلم مونتکلیر", "summary_fa": "جشنواره فیلم مونتکلر 2026 به تهیه کننده ریچل مدو و کارگردان بن کلاین جایزه دیوید کار سال 2026 را برای حقیقت در فیلمسازی غیرداستانی برای مستند جنایی واقعی جدیدشان، \"Kill. Bury. Print\" اهدا خواهد کرد. این فیلم درگیری بین یک روزنامه کوچک خانوادگی و اداره کلانتری محلی در شهرستان مک کورتین، اوکلاهاما را دنبال می کند. مدو در بیانیه‌ای گفت: این داستان بسیار گستاخانه و هیجان‌انگیز است، من هفت دقیقه آن را در برنامه‌ام وقت گذاشتم در حالی که فقط 42 دقیقه در هفته زمان پخش داشتم. این شامل رابطه جنسی، مواد مخدر، ناپدید شدن های مشکوک، فرار از زندان، یک قلم جاسوسی، جنایات غیرقابل توصیف و یک نقشه قتل ادعایی است که همگی در مکانی اتفاق می‌افتند که به نظر می‌رسد مربوط به فصلی از تاریخ آمریکاست. محبوب در Variety از ابتدا، ما گفتیم که این داستان به نظر می رسد که همه مردان رئیس جمهور با هیچ کشوری برای پیرمردها ملاقات نمی کنند. جشنواره فیلم مونت‌کلیر هر ساله با اهدای جایزه به فیلمی که اشتیاق او به حقیقت و تعهدش به روزنامه‌نگاری بزرگ را گرامی می‌دارد، میراث دیوید کار، خبرنگار محبوب نیویورک تایمز و ساکن قدیمی مونت‌کلیر را گرامی می‌دارد. بن کلاین، کارگردان، در بیانیه ای گفت: از طرف am VI شناخته می‌شد، در 16 اوت در گرین‌ویل، کارولینای جنوبی در سن 36 سالگی درگذشت. تقریباً در ساعت 1:51 بعد از ظهر، یک تماس با 911 مبنی بر یک ایست قلبی گزارش شده دریافت شد و اولین پاسخ‌دهندگان متوجه شدند که او در داخل خود ناخودآگاه بوده است. ماندن آنها اقدامات حمایتی را آغاز کردند، اما پانتییر در ساعت 2:32 بعد از ظهر مرده اعلام شد. اداره پلیس گرین‌ویل بعداً به ورایتی تأیید کرد که هیچ بازی ناپسندی در مرگ او مشکوک نیست. یک سخنگوی گفت که تحقیقات اولیه هیچ نشانه ای از بازی نادرست یا شرایط مشکوک را نشان نداده است. یکی از آشنایان خانم پانتییر با 911 تماس گرفت. پانتی یر کار خود را در سن 5 سالگی با بازی در سریال های یک زندگی برای زندگی و راهنما آغاز کرد. در سال 2000، او نقش مهم خود را در درام ورزشی به یاد تایتان ها را در کنار دنزل واشنگتن به دست آورد، و سال بعد در سریال ابرقهرمانی NBC Heroes انتخاب"}, {"source": "Variety", "title": "Netflix Unveils ‘Kpop Demon Hunters’ Immersive Experience", "link": "https://variety.com/2026/shopping/news/kpop-demon-hunters-immersive-experience-netflix-tickets-1236872059/", "summary": "Netflix is bringing the world of “KPop Demon Hunters” off the screen and into its Netflix House locations in Dallas and Philadelphia. The streamer has unveiled a new “KPop Demon Hunters: The Immersive Experience,” a ticketed attraction inspired by its blockbuster animated film that will open Nov. 12 at Netflix House Dallas and Nov. 20 [ ]", "date_str": "2026-09-22T14:13:13+00:00", "hash": "6f9633e94222bc54", "title_fa": "نتفلیکس از تجربه همه جانبه «شکارچیان شیاطین Kpop» رونمایی کرد", "summary_fa": "نتفلیکس دنیای «شکارچیان شیاطین KPop» را از روی صفحه نمایش و به مکان‌های خانه نتفلیکس خود در دالاس و فیلادلفیا می‌آورد. پخش‌کننده از «شکارچیان شیاطین KPop: تجربه غوطه‌ور» پرده‌برداری کرده است، جاذبه‌ای با بلیت الهام گرفته از فیلم انیمیشن پرفروش‌اش که ۱۲ نوامبر در Netflix House دالاس و ۲۰ نوامبر اکران می‌شود [ ] اگر محصول یا خدماتی را که به‌طور مستقل بررسی شده را از طریق پیوندی در وب‌سایت ما خریداری کنید، Variety ممکن است کمیسیون دریافت کند. این تجربه مهمانان را در دا     let currentTab = 'persian';

    function toFaDigits(n) {
      const f = ['۰','۱','۲','۳','۴','۵','۶','۷','۸','۹'];
      return n.toString().replace(/\d/g, d => f[d]);
    }

    function toggleRead(hash) {
      if (readArticles.has(hash)) {
        readArticles.delete(hash);

        readArticles.add(hash);

      localStorage.setItem('read_articles_registry', JSON.stringify(Array.from(readArticles)));
      renderNews();
    }

    function renderNews() {
      const container = document.getElementById('newsContainer');
      const rawItems = data[currentTab] || [];
      
      const filtered = rawItems.filter(item => {
        if (!searchQuery) return true;
        const q = searchQuery.toLowerCase();
        const title = (item.title_fa || item.title || '').toLowerCase();
        const summary = (item.summary_fa || item.summary || '').toLowerCase();
        const source = (item.source || '').toLowerCase();
        return title.includes(q) || summary.includes(q) || source.includes(q);
      });

      const unreadList = [];
      const readList = [];

      filtered.forEach(item => {
        if (readArticles.has(item.hash)) {
          readList.push(item);
        } else {
          unreadList.push(item);
        }
      });

      if (sortedItems.length === 0) {
        container.innerHTML = '<div style="text-align:center; padding: 40px; color: var(--text-muted);">هیچ خبری در این بخش در ۲۴ ساعت گذشته ثبت نشده است.</div>';
        return;

      container.innerHTML = sortedItems.map((item, idx) => {
        const title = item.title_fa || item.title || '';

        const isRead = readArticles.has(item.hash);
        const num = toFaDigits(idx + 1);

        return `

              <h2 class="news-title">${title}</h2>

          </article>

      const listContainer = document.getElementById('archiveListContainer');
      if (!archiveManifest || archiveManifest.length === 0) {
        listContainer.innerHTML = '<div style="text-align:center; padding: 20px; color: var(--text-muted);">هنوز شماره قبلی ثبت نشده است.</div>';
        return;
      }

      listContainer.innerHTML = archiveManifest.map(item => `
        <a href="${item.url}" class="archive-item">
          <div>
            <div class="archive-date-fa">📰 شماره ${item.p_date}</div>
            <div class="archive-date-g">🌍 ${item.g_date}</div>
          </div>
          <span class="archive-arrow">←</span>
        </a>
      `).join('');
    }

    const savedTheme = localStorage.getItem('theme') || 'dark';
    document.documentElement.setAttribute('data-theme', savedTheme);
    updateThemeButton(savedTheme);

    document.getElementById('searchInput').addEventListener('input', (e) => {
      searchQuery = e.target.value.trim();
      renderNews();
    });

    renderNews();
  </script>
</body>
</html>
