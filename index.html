led disasters are taking lives and costing billions, while political shifts and international conflict have stalled progress. We urgently need to cut emissions and avoid climate change’s most harmful effects, and that’s where our 10 companies come in. They’re working on everything from mobile flood barriers and semi-solid-state batteries to compressed-CO₂ energy storage and next-generation nuclear reactors. They also reflect the biggest shifts in climate tech—including the surging energy demands of AI data centers. Meet the 10 companies working on some of the biggest challenges in climate tech . Over the coming days, we’ll take a closer look at each of the 10 companies, along with how we chose this year’s list, right here in The Download. So stay tuned! The must-reads I’ve combed the internet to find you today’s most fun/important/scary/fascinating stories about technology. 1 Musk’s new Pentagon role has raised conflict-of-interest fears His companies could directly benefit from the weapons he recommends. ( NPR ) + SpaceX has received billions in Pentagon and NASA contracts. ( NYT $) + Beware the rise of the “Pentagon-Silicon Complex.” ( Gizmodo ) + The Pentagon wants an AI-powered lie detector. ( MIT Technology Review ) 2 The only billionaires making money this year are in tech Tech fortunes now account for 36% of billionaire wealth. ( Bloomberg $) + Nvidia is on the verge of the first $6 trillion valuation. ( CNBC ) + SpaceX stock has made Elon Musk a trillionaire again. ( Gizmodo ) 3 Norway is planning the first national ban on smart glasses Camera-enabled glasses could be barred from public spaces. ( Guardian ) + Several other countries are also mulling bans. ( Reuters $) + Smart glasses are causing havoc in India. ( MIT Technology Review ) 4 Tandem panels could help the US catch up with China in solar They could produce 25% more electricity from sunlight. ( NYT $) + The balcony solar boom is coming to the US. ( MIT Technology Review ) 5 South Korea’s President suspects AI’s been used in bank hacks He called for new cybersecurity measures for the AI era. ", "date_str": "2026-10-06T12:10:00+00:00", "hash": "401b5f65764d4664", "title_fa": "دانلود: 10 شرکت فناوری آب و هوا برای تماشا", "summary_fa": "هر ساله، MIT Technology Review فهرستی از امیدوارکننده ترین شرکت های فناوری آب و هوا در جهان را گردآوری می کند. امسال، ریسک بالاتر از همیشه احساس می شود. جهان در مسیر یکی از گرم ترین سال های ثبت شده خود قرار دارد، بلایای ناشی از آب و هوا جان انسان ها را گرفته و میلیاردها هزینه دارد، در حالی که تغییرات سیاسی و درگیری های بین المللی پیشرفت را متوقف کرده است. ما نیاز فوری به کاهش انتشار گازهای گلخانه ای و جلوگیری از مضرترین اثرات تغییرات آب و هوایی داریم، و اینجاست که 10 شرکت ما وارد عمل می شوند. آنها در حال کار بر روی همه چیز هستند، از سدهای سیار سیل و باتری های نیمه جامد گرفته تا ذخیره سازی انرژی فشرده CO2 و راکتورهای هسته ای نسل بعدی. آنها همچنین منعکس کننده بزرگترین تغییرات در فناوری آب و هوا - از جمله افزایش تقاضای انرژی مراکز داده هوش مصنوعی هستند. با 10 شرکتی که روی برخی از بزرگترین چالش‌های فناوری آب و هوا کار می‌کنند، آشنا شوید. در روزهای آینده، نگاه دقیق‌تری به هر یک از 10 شرکت و نحوه انتخاب فهرست امسال خواهیم داشت، درست در اینجا در دانلود. پس با ما همراه باشید! من اینترنت را بررسی کردم تا سرگرم کننده ترین/مهم ترین/ترسناک/جذاب ترین داستان های امروز در مورد تکنولوژی را برای شما پیدا کنم. 1 نقش جدید ماسک در پنتاگون باعث ایجاد ترس از تضاد منافع شده است که شرکت‌های او می‌توانند مستقیماً از سلاح‌هایی که او توصیه می‌کند بهره ببرند. (NPR ) + اسپیس ایکس میلیاردها دلار قرارداد پنتاگون و ناسا دریافت کرده است. (NYT $) + مراقب ظهور \"مجتمع پنتاگون-سیلیکون\" باشید. ( Gizmodo ) + پنتاگون یک دروغ سنج با هوش مصنوعی می خواهد. ( بررسی فناوری MIT ) 2 تنها میلیاردرهایی که در سال جاری درآمد کسب می کنند،"}, {"source": "MIT Tech Review", "title": "Here’s how our climate team picked 10 promising companies to watch", "link": "https://www.technologyreview.com/2026/10/06/1144978/2026-climate-tech-companies-to-watch-how-we-chose/", "summary": "As the team at MIT Technology Review set out to choose companies for this year’s edition of our annual list of Climate Tech Companies to Watch, the challenge felt more daunting than any year since we started compiling the list in 2023. This year is shaping up to be one of the hottest ever recorded . The world must begin to reduce greenhouse-gas emissions to address the climate crisis, which is already affecting communities around the globe. Wildfires, floods, and other climate-fueled disasters are killing thousands and costing billions of dollars. At the same time, political shifts and international conflict have stalled progress, particularly in the US. Technology alone can’t solve climate change. But we believe innovations can help us make real changes and improve lives around the world as we try to address one of the most pressing challenges of our time. In this project, we look for companies developing technologies that can help us face the climate crisis. Some are driving down the greenhouse-gas emissions fueling climate change; others are working to reduce the dangers that communities face from extreme heat, drought, or other shifts brought on by a warming planet. We focus on companies that have established a track record, whether through research findings, capital raised, or deployments. When we set out to build our list, we start by soliciting nominations from our team of reporters and editors. We ask experts for suggestions and reach out to academics, researchers, investors, and analysts. Once we have a pool of nominees, we then consider each one, digging through literature, reports, and patents to vet both the technology and the business. We judge each company not only on its own merits, but also on how it might fit into our list overall. We want the final slate of companies to represent a range of industries and include firms based around the globe that are at different stages of development. We also aim to strike a balance between highlighting companies previously included and introducing new names. Finally, we consider some of the most important trends and events of the year and look for nominees that reflect those developments. The dismembering of US federal regulations and cuts to financial government incentives for innovation means that the country is no longer a leader in climate tech. Like last year, the 2026 list is largely composed of companies that are based outside the US. China is an obvious hotspot for technological innovation acros", "date_str": "2026-10-06T10:35:00+00:00", "hash": "0b4882878552eee5", "title_fa": "در اینجا آمده است که چگونه تیم آب و هوای ما 10 شرکت امیدوارکننده را برای تماشا انتخاب کرد", "summary_fa": "از آنجایی که تیم MIT Technology Review تصمیم گرفت شرکت‌هایی را برای نسخه امسال فهرست سالانه شرکت‌های فناوری آب و هوا برای تماشا انتخاب کند، از زمانی که شروع به تهیه فهرست در سال 2023 کردیم، این چالش بیش از هر سال دیگری احساس می‌شد. امسال یکی از داغ‌ترین سال‌هایی است که تاکنون ثبت شده است. جهان باید شروع به کاهش انتشار گازهای گلخانه ای برای مقابله با بحران آب و هوا کند، که در حال حاضر جوامع را در سراسر جهان تحت تاثیر قرار داده است. آتش‌سوزی‌های جنگلی، سیل‌ها و سایر بلایای ناشی از آب و هوا هزاران کشته و میلیاردها دلار هزینه در بر دارند. در عین حال، تغییرات سیاسی و درگیری های بین المللی پیشرفت را به ویژه در ایالات متحده متوقف کرده است. فناوری به تنهایی نمی تواند تغییرات آب و هوایی را حل کند. اما ما معتقدیم که نوآوری‌ها می‌توانند به ما در ایجاد تغییرات واقعی و بهبود زندگی در سراسر جهان کمک کنند، زیرا سعی می‌کنیم یکی از مهم‌ترین چالش‌های زمان خود را برطرف کنیم. در این پروژه، ما به دنبال شرکت‌هایی هستیم که فناوری‌هایی را توسعه می‌دهند که می‌توانند به ما در مقابله با بحران آب و هوا کمک کنند. برخی از آنها باعث کاهش انتشار گازهای گلخانه ای می شوند که به تغییرات آب و هوایی دامن می زند. دیگران در تلاشند تا خطراتی را که جوامع ناشی از گرمای شدید، خشکسالی، یا سایر تغییرات ناشی از گرم شدن سیاره با آن مواجه هستند، کاهش دهند. ما بر شرکت‌هایی تمرکز می‌کنیم که سابقه‌ای را، چه از طریق یافته‌های تحقیقاتی، چه از طریق افزایش سرمایه، یا استقرار، ایجاد کرده‌اند. هنگامی که قصد داریم فهرست خود را بسازیم، با درخواست نامزدی از تیم خبرنگاران و سردبیران خود شروع می کنیم. ما از کارشناسان درخواست پیشنهاد می کنیم و با دانشگاهیان، محققان، سرمایه گذاران و"}, {"source": "MIT Tech Review", "title": "WeLion New Energy and its semi-solid-state batteries", "link": "https://www.technologyreview.com/2026/10/06/1144987/2026-climate-tech-companies-to-watch-welion-semi-solid-state-batteries/", "summary": "WeLion New Energy is on a quest to make safer, better batteries. The company’s semi-solid-state cells could improve safety and offer greater energy density than lithium-ion batteries to power electric cars, boats, and drones. From the EVs that carry commuters home to the ships that transport goods across countries, more and more vehicles around us are powered by batteries. Lithium-ion batteries are commonly used to power personal devices and vehicles today. But as the need for batteries surges, there’s a growing appetite for cells that can store more energy on a single charge. Also, in lithium-based batteries the electrolyte, which facilitates ion transfer, uses a flammable liquid that can create a fire hazard. Several companies, including WeLion New Energy, are working to make solid-state cells, which use a solid electrolyte instead of a liquid one. This could increase the energy density of batteries, as well as improve their safety. Fully solid-state cells are extremely difficult to manufacture, though. So WeLion currently focuses on developing and producing semi-solid-state cells, which have a part-liquid, part-solid electrolyte. On that front, they have made steady progress. In 2023, WeLion released a battery pack in partnership with Shanghai-based EV-maker Nio, best known for its battery-swapping technology. The pack had an energy density of 360 watt-hours per kilogram (wh/kg), significantly higher than the 200 wh/kg average for lithium-ion packs today. That translated to a range of over 1,000 kilometers (621 miles). However, only about 200 of the battery packs were manufactured due to their high production cost, but they are still being used by Nio, WeLion says. WeLion has also built batteries to power cargo ships and ferries through a subsidiary. And the company is developing batteries with even higher energy density too. WeLion’s engineers made a semi-solid-state battery that achieved a remarkable energy density of 824 wh/kg during testing in 2025, more than three times that of a standard lithium-ion battery available today. Key indicators Industry: Energy storage Founded: 2016 Headquarters: Beijing, China Notable fact: WeLion’s cofounders include Chen Liquan, a scientist at the Chinese Academy of Sciences who led the development of the country’s first all-solid-state battery back in 1988. Potential for impact China emits more carbon dioxide than any other country, and its transportation sector accounts for around 10% of that total. Scaling up the ", "date_str": "2026-10-06T10:35:00+00:00", "hash": "70146a3934526cd9", "title_fa": "WeLion New Energy و باتری های نیمه جامد آن", "summary_fa": "WeLion New Energy در تلاش برای ساخت باتری های ایمن تر و بهتر است. سلول‌های نیمه جامد این شرکت می‌توانند ایمنی را بهبود بخشند و چگالی انرژی بیشتری نسبت به باتری‌های لیتیوم یونی برای تامین انرژی خودروهای الکتریکی، قایق‌ها و پهپادها ارائه دهند. از خودروهای برقی که مسافران را به خانه می برند تا کشتی هایی که کالاها را در سراسر کشورها حمل می کنند، وسایل نقلیه بیشتری در اطراف ما با باتری کار می کنند. امروزه معمولاً از باتری‌های لیتیوم یونی برای تأمین انرژی وسایل شخصی و وسایل نقلیه استفاده می‌شود. اما با افزایش نیاز به باتری، اشتهای فزاینده ای برای سلول هایی وجود دارد که می توانند انرژی بیشتری را با یک بار شارژ ذخیره کنند. همچنین، در باتری های لیتیومی، الکترولیت که انتقال یون را تسهیل می کند، از مایع قابل اشتعال استفاده می کند که می تواند خطر آتش سوزی ایجاد کند. چندین شرکت از جمله WeLion New Energy در حال کار برای ساخت سلول های حالت جامد هستند که به جای الکترولیت مایع از الکترولیت جامد استفاده می کنند. این می تواند چگالی انرژی باتری ها را افزایش دهد و همچنین ایمنی آنها را بهبود بخشد. با این حال، ساخت سلول های کاملاً جامد بسیار دشوار است. بنابراین WeLion در حال حاضر بر توسعه و تولید سلول های نیمه جامد که دارای الکترولیت نیمه مایع و نیمه جامد هستند، تمرکز دارد. در آن جبهه، آنها پیشرفت ثابتی داشته اند. در سال 2023، WeLion یک بسته باتری را با همکاری شرکت سازنده خودروهای برقی مستقر در شانگهای Nio منتشر کرد که بیشتر به خاطر فناوری تعویض باتری خود شناخته شده است. این بسته دارای چگالی انرژی 360 وات ساعت بر کیلوگرم (wh/kg) بود که به طور قابل توجهی بالاتر از میانگین 200 وات ساعت بر کیلوگرم بسته های لیتیوم یونی امروزی است. که به برد بیش"}, {"source": "MIT Tech Review", "title": "Form Energy and its iron batteries", "link": "https://www.technologyreview.com/2026/10/06/1145020/2026-climate-tech-companies-to-watch-form-energy-iron-batteries/", "summary": "Form Energy is building iron-based batteries that can store energy for multiple days. The company is ramping up supply at its factory and signing deals for commercial projects. New solar and wind installations produce electricity more affordably than fossil fuels in most places, but their output varies based on season, time of day, and weather. To compensate, utilities are increasingly investing in battery storage systems, which can charge when power is abundant and discharge when the grid needs a boost. Lithium-ion batteries are the fastest-growing storage technology. Although light and energy-dense, they require pricey metals and are costly to scale, and few of the large batteries of this type used in industry are designed to store energy for longer than four to six hours. Form Energy wants to build cheaper long-duration energy storage technology. The company has developed a new type of battery, built with a far more abundant and cheaper metal, iron, that can store energy for 100 hours. It uses a process that Form calls “reversible rusting.” During discharge, oxygen from the air converts the iron metal to rust, releasing electrons. When charging, current converts the rust back into iron metal. Over the past two years, Form has gained commercial traction. It began producing batteries at its West Virginia factory for its first commercial deployment, a 150 megawatt-hour system for Minnesota electricity provider Great River Energy, which is set to come online in 2027. And Form has signed several other deals with power providers. The largest is a project with another Minnesota-based utility, Xcel Energy, where wind and solar power, backed by 30 gigawatt-hours of Form’s batteries, will be used to power a new Google data center. That project is expected to come online in phases between 2028 and 2031. Key indicators Industry: Energy storage Founded: 2017 Headquarters: Somerville, Massachusetts, US Notable fact: Once complete, Form’s proposed 30 gigawatt-hour energy storage system at a Google data center in Minnesota could be the world’s largest battery project by energy capacity. Potential for impact Wind and solar power play a major role in limiting growth in global carbon dioxide emissions. Still, many grid operators depend on fossil fuel plants, especially natural gas ones, to fill gaps caused by periods of low renewable supply or high demand. Form’s batteries are designed to cover multiday supply-demand imbalances, like those that crop up during heat waves, ", "date_str": "2026-10-06T10:35:00+00:00", "hash": "83b506ac0e174acb", "title_fa": "Form Energy و باتری های آهنی آن", "summary_fa": "Form Energy در حال ساخت باتری های آهنی است که می توانند انرژی را برای چند روز ذخیره کنند. این شرکت در حال افزایش عرضه در کارخانه خود و امضای قراردادهایی برای پروژه های تجاری است. تأسیسات جدید خورشیدی و بادی در بیشتر مکان‌ها برق مقرون‌به‌صرفه‌تری نسبت به سوخت‌های فسیلی تولید می‌کنند، اما خروجی آنها بر اساس فصل، زمان روز و آب و هوا متفاوت است. برای جبران، شرکت‌های برق به طور فزاینده‌ای روی سیستم‌های ذخیره‌سازی باتری سرمایه‌گذاری می‌کنند، که می‌توانند زمانی که برق زیاد است شارژ شوند و زمانی که شبکه نیاز به تقویت دارد، تخلیه شود. باتری‌های لیتیوم یون سریع‌ترین فناوری ذخیره‌سازی هستند. اگرچه سبک و پر انرژی هستند، اما به فلزات گران قیمت نیاز دارند و مقیاس آنها پرهزینه است، و تعداد کمی از باتری های بزرگ از این نوع که در صنعت استفاده می شوند برای ذخیره انرژی برای بیش از چهار تا شش ساعت طراحی شده اند. Form Energy می‌خواهد فناوری ذخیره‌سازی انرژی طولانی‌مدت ارزان‌تری بسازد. این شرکت نوع جدیدی از باتری را ساخته است که با فلز بسیار فراوان تر و ارزان تر، آهن ساخته شده است که می تواند انرژی را برای 100 ساعت ذخیره کند. از فرآیندی استفاده می کند که Form آن را «زنگ زدگی برگشت پذیر» می نامد. در هنگام تخلیه، اکسیژن هوا فلز آهن را به زنگ زدگی تبدیل می کند و الکترون آزاد می کند. هنگام شارژ، جریان زنگ زدگی را دوباره به فلز آهن تبدیل می کند. در طول دو سال گذشته، فرم کشش تجاری به دست آورده است. این شرکت شروع به تولید باتری در کارخانه ویرجینیای غربی برای اولین استقرار تجاری خود کرد، یک سیستم 150 مگاوات ساعتی برای تامین کننده برق مینه سوتا، گریت ریور انرژی، که قرار است در سال 2027 به صورت آنلاین عرضه شود. و Form چندین قرارداد دیگر با ارائه"}, {"source": "MIT Tech Review", "title": "X-energy and its helium-cooled nuclear reactors", "link": "https://www.technologyreview.com/2026/10/06/1145025/2026-climate-tech-companies-to-watch-x-energy-helium-cooled-nuclear-reactors/", "summary": "X-energy is developing small modular reactors to satisfy some of the planet’s most power-hungry users: industrial manufacturers that need high temperatures to produce billions of tons of concrete, plastics, fibers, and chemicals. Solar panels and wind turbines are great at producing electricity but what heavy industry also needs is raw heat—and lots of it. The manufacture of concrete, glass, and steel, as well as the production of many chemicals, plastics, and fertilizers, are still highly reliant on fossil fuels to produce that heat. Traditional nuclear reactors simply don’t get hot enough . The cooling systems they use require liquid water to work, and even applying pressure to raise the water’s boiling point leaves their maximum operating temperatures hundreds of degrees cooler than needed. X-energy’s proposed Xe-100 reactor will use helium gas as a coolant instead, allowing it to operate at much lower pressures and higher temperatures. The helium will heat water and create super-heated steam, which industry can use either directly or to generate 80 megawatts (MW) of electricity via a turbine, or a combination of the two. That’s about one-tenth of the capacity of most reactors operating today. In common with other small modular reactors (SMRs), the Xe-100 will use a modern uranium-based fuel called TRISO (short for tristructural-isotropic) that is extremely resistant to corrosion and melting. Compact TRISO “pebbles” will be added continuously to the top of the reactor, then flow slowly to the bottom, where they will either be recycled or removed as waste. The company says the reactor will be intrinsically safe in the event of a loss of power—if temperatures inside rise, the nuclear reaction naturally slows and stops. Key indicators Industry: Nuclear fission Founded: 2009 Headquarters: Rockville, Maryland, US Notable fact: The first helium-cooled reactor was proposed for the World War II Manhattan Project but was passed over in favor of a simpler and cheaper water-cooled design. Potential for impact Industrial heating currently accounts for 18 percent of annual global greenhouse-gas emissions , with about half of that coming from high-temperature processes that are difficult to electrify. Co-locating small nuclear reactors at large manufacturing facilities could shrink some of the biggest carbon footprints in the world. The Xe-100 reactor could also be used by the fossil fuel industry, which today uses vast quantities of natural gas to generate the heat ", "date_str": "2026-10-06T10:35:00+00:00", "hash": "9ddc7bbecbe5a586", "title_fa": "X-energy و راکتورهای هسته‌ای خنک‌شده با هلیوم آن", "summary_fa": "X-energy در حال توسعه راکتورهای مدولار کوچک است تا برخی از پرمصرف ترین کاربران سیاره زمین را راضی کند: تولیدکنندگان صنعتی که برای تولید میلیاردها تن بتن، پلاستیک، الیاف و مواد شیمیایی به دمای بالا نیاز دارند. پنل های خورشیدی و توربین های بادی در تولید الکتریسیته عالی هستند، اما آنچه که صنعت سنگین نیز به آن نیاز دارد، گرمای خام و مقدار زیادی از آن است. تولید بتن، شیشه و فولاد و همچنین تولید بسیاری از مواد شیمیایی، پلاستیک و کود، هنوز هم برای تولید این گرما به شدت به سوخت‌های فسیلی وابسته است. راکتورهای هسته ای سنتی به سادگی به اندازه کافی داغ نمی شوند. سیستم‌های خنک‌کننده‌ای که استفاده می‌کنند برای کار کردن به آب مایع نیاز دارند و حتی اعمال فشار برای بالا بردن نقطه جوش آب، حداکثر دمای عملیاتی آنها را صدها درجه خنک‌تر از حد مورد نیاز می‌کند. راکتور Xe-100 پیشنهادی X-energy از گاز هلیوم به عنوان خنک‌کننده استفاده می‌کند و به آن اجازه می‌دهد در فشارهای بسیار پایین‌تر و دمای بالاتر کار کند. هلیوم آب را گرم می‌کند و بخار فوق‌گرم ایجاد می‌کند که صنعت می‌تواند مستقیماً یا برای تولید 80 مگاوات برق از طریق توربین یا ترکیبی از این دو استفاده کند. این حدود یک دهم ظرفیت اکثر رآکتورهایی است که امروزه کار می کنند. مشابه با دیگر راکتورهای کوچک مدولار (SMR)، Xe-100 از سوخت مدرن مبتنی بر اورانیوم به نام TRISO (مخفف سه ساختاری-ایزوتروپیک) استفاده می کند که در برابر خوردگی و ذوب شدن بسیار مقاوم است. سنگریزه های فشرده TRISO به طور مداوم به بالای راکتور اضافه می شوند، سپس به آرامی به سمت پایین جریان می یابند، جایی که یا بازیافت می شوند یا به عنوان زباله حذف می شوند. این شرکت می‌گوید که راکتور ذاتاً در صورت از دست دادن نیرو ایمن خواهد بود - اگر دمای داخل افزایش"}, {"source": "MIT Tech Review", "title": "Energy Dome and its carbon dioxide batteries", "link": "https://www.technologyreview.com/2026/10/06/1145032/2026-climate-tech-companies-to-watch-energy-dome-carbon-dioxide-batteries/", "summary": "There’s a growing need for long-duration storage to meet energy demand and balance out renewables on the grid. Energy Dome uses compressed carbon dioxide gas in its massive grid batteries, which can deliver power for up to 24 hours. As the world races to meet growing electricity demand, solar and onshore wind power have become the cheapest and quickest-to-deploy sources to install on the grid. But, despite their upsides, both are subject to variations in weather patterns, which means supplies can be intermittent. Energy Dome is using stored carbon dioxide to help smooth out gaps between supply and demand. The key component of an Energy Dome plant is a huge white dome that covers an area about the size of seven soccer fields and holds about 2,000 metric tons of carbon dioxide. When energy is available—say, from a connected solar farm—compressors squeeze the gas, turning it into a liquid that’s then stored in carbon-steel tanks. That process generates heat, which the system holds in a proprietary thermal storage material. Then, when the grid needs power, the carbon dioxide is released from the tanks and warmed with the stored heat, turning it back into a gas. That gaseous carbon dioxide then passes through a turbine to generate electricity and flows back into the dome, ready to begin the cycle again. Compressing gas to store energy isn’t new—utilities have been using compressed air in underground caverns to hang on to reserves for decades. But Energy Dome’s approach doesn’t require any specific geology to work, so it could be more easily scaled to help grids around the world. Energy Dome turned on its first commercial plant in Sardinia, Italy, in 2025. The facility has a capacity of 200 megawatt-hours. That’s enough to power about 18,000 Italian homes for 10 hours. Key indicators Industry: Energy storage Founded: 2020 Headquarters: Milan, Italy Notable fact: Energy Dome has plans for 30 gigawatt-hours’ worth of projects across five continents. Potential for impact Cheaper energy storage could help wind and solar meet more of the world’s electricity demand. Today, lithium-ion batteries dominate new installations for short-duration applications of up to four hours. But the economics aren’t competitive for longer durations: A lithium-ion system that provides eight hours of storage at the same power output requires doubling the number of cells. Energy Dome estimates that its technology is roughly 10% to 15% cheaper than lithium-ion batteries for an eight-hour sy", "date_str": "2026-10-06T10:35:00+00:00", "hash": "598f0546c01511ad", "title_fa": "انرژی Dome و باتری های دی اکسید کربن آن", "summary_fa": "نیاز فزاینده ای به ذخیره سازی طولانی مدت برای پاسخگویی به تقاضای انرژی و متعادل کردن انرژی های تجدیدپذیر در شبکه وجود دارد. انرژی Dome از گاز دی اکسید کربن فشرده در باتری های شبکه عظیم خود استفاده می کند که می تواند تا 24 ساعت انرژی را ارائه دهد. در حالی که جهان برای برآوردن تقاضای رو به رشد برق رقابت می کند، انرژی خورشیدی و بادی خشکی به ارزان ترین و سریع ترین منابع برای نصب در شبکه تبدیل شده اند. اما، با وجود نقاط مثبت، هر دو در معرض تغییرات در الگوهای آب و هوا هستند، به این معنی که منابع می توانند متناوب باشند. انرژی Dome از دی اکسید کربن ذخیره شده برای کمک به هموار کردن شکاف بین عرضه و تقاضا استفاده می کند. جزء کلیدی یک نیروگاه انرژی گنبد یک گنبد سفید بزرگ است که مساحتی به اندازه هفت زمین فوتبال را پوشش می دهد و حدود 2000 تن دی اکسید کربن را در خود جای می دهد. هنگامی که انرژی در دسترس است - مثلاً از یک مزرعه خورشیدی متصل - کمپرسورها گاز را فشرده می کنند و آن را به مایع تبدیل می کنند که سپس در مخازن فولاد کربنی ذخیره می شود. این فرآیند گرما را تولید می کند که سیستم آن را در یک ماده ذخیره حرارتی اختصاصی نگه می دارد. سپس، هنگامی که شبکه به برق نیاز دارد، دی اکسید کربن از مخازن آزاد می شود و با گرمای ذخیره شده گرم می شود و دوباره به گاز تبدیل می شود. آن دی اکسید کربن گازی سپس از یک توربین عبور می کند تا برق تولید کند و دوباره به داخل گنبد جریان می یابد و آماده شروع دوباره چرخه است. فشرده سازی گاز برای ذخیره انرژی چیز جدیدی نیست - شرکت های برق ده ها سال است که"}, {"source": "MIT Tech Review", "title": "Brimstone and its one-stop process for making cleaner cement and critical minerals", "link": "https://www.technologyreview.com/2026/10/06/1145172/2026-climate-tech-companies-to-watch-brimstone-one-stop-process-making-cleaner-cement-critical-minerals/", "summary": "Brimstone is making strides on two industrial problems, reducing the emissions from cement and providing a way to produce more critical minerals within the US. If the company can do both, with the same rocks in the same plant, it would unlock a cleaner and more efficient process for manufacturing building materials, aluminum, steel, and more. Brimstone is a code-switching climate tech company for these polarized political times. The US-based startup—part green cement company, part critical mineral producer—is well positioned to sustain its momentum no matter which party is in power. During the more climate-focused Biden administration, the company’s primary pitch was its ability to produce cement while generating about 60% less greenhouse-gas emissions. It achieves this by switching to silicate rocks instead of standard limestone, which releases carbon dioxide when it’s heated. The conventional process for creating cement, the binding used to produce concrete, contributes about 8% of the world’s carbon dioxide pollution. Under the protectionist and climate-denying Trump administration, however, the company is now stressing the secondary benefits of its process: the ability to extract other valuable materials from those same silicate rocks. The company has said for years that its process could also generate materials that can be used to strengthen cement. But in early 2025, Brimstone highlighted that it would be able to also produce smelter-grade alumina, the raw material used in aluminum. It then revealed it had another trick up its sleeve late last year : the ability to make steel, magnesium, titanium, and other critical minerals from the same rock in a single refinery. The company’s CEO, Cody Finke , said those materials represent a $2.4 trillion global market. Brimstone’s approach promises to provide a domestic path for goods mostly produced today in China, the subject of Trump’s harshest trade policies and rhetoric. Key indicators Industry: Heavy industry Founded: 2019 Headquarters: Oakland, California, US Notable fact: In 2023, the company earned third-party industry certification for its process for manufacturing Portland cement, allowing its product to qualify for standard manufacturing projects. Potential for impact The company made a very big deal of its newfound ability to produce all these other goods, arguing its process would bolster national security and usher in the “next generation of industrial refining.” The basic environmental promise is", "date_str": "2026-10-06T10:35:00+00:00", "hash": "f6b4b07660228ff4", "title_fa": "بریمستون و فرآیند یک مرحله ای آن برای ساخت سیمان تمیزتر و مواد معدنی حیاتی", "summary_fa": "بریمستون در حال برداشتن دو مشکل صنعتی است، کاهش انتشار گازهای گلخانه ای از سیمان و ارائه راهی برای تولید مواد معدنی حیاتی تر در ایالات متحده. اگر این شرکت بتواند هر دو را با سنگ های یکسان در یک کارخانه انجام دهد، فرآیند تمیزتر و کارآمدتری را برای تولید مصالح ساختمانی، آلومینیوم، فولاد و غیره باز می کند. Brimstone یک شرکت فناوری آب و هوای تغییر کد برای این دوران سیاسی قطبی است. این استارتاپ مستقر در ایالات متحده - بخشی از شرکت سیمان سبز، بخشی از تولیدکننده مواد معدنی حیاتی - بدون توجه به اینکه کدام حزب در قدرت است، موقعیت خوبی برای حفظ حرکت خود دارد. در طول دولت بایدن که بیشتر بر اقلیم متمرکز بود، هدف اصلی شرکت توانایی آن در تولید سیمان و در عین حال تولید حدود 60 درصد کمتر گازهای گلخانه ای بود. این امر با استفاده از سنگ‌های سیلیکاته به جای سنگ آهک استاندارد، که هنگام گرم شدن دی اکسید کربن آزاد می‌کند، به دست می‌آید. فرآیند مرسوم برای ایجاد سیمان، اتصالی که برای تولید بتن استفاده می شود، حدود 8 درصد از آلودگی دی اکسید کربن جهان را تشکیل می دهد. با این حال، تحت دولت ترامپ حمایت‌گرا و منکر آب و هوا، این شرکت اکنون بر مزایای ثانویه فرآیند خود تأکید می‌کند: توانایی استخراج مواد ارزشمند دیگر از همان سنگ‌های سیلیکات. این شرکت برای سال‌ها گفته است که فرآیند آن می‌تواند موادی را نیز تولید کند که می‌توان از آن برای تقویت سیمان استفاده کرد. اما در اوایل سال 2025، بریمستون تاکید کرد که می تواند آلومینا درجه ذوب، ماده خام مورد استفاده در آلومینیوم را نیز تولید کند. سپس در اواخر سال گذشته فاش کرد که ترفند دیگری در آستین خود دارد: توانایی ساخت فولاد، منیزیم، تیتانیوم و سایر مواد معدنی حیاتی از همان سنگ در یک پالایشگاه واحد."}, {"source": "MIT Tech Review", "title": "WaveSave and its portable rubber dam", "link": "https://www.technologyreview.com/2026/10/06/1145208/2026-climate-tech-companies-to-watch-wavesave-portable-rubber-dam/", "summary": "As sea levels rise and flood risks worsen due to global warming, WaveSave’s easy-to-erect portable dam offers a quick-response tool. People can use the dam to protect themselves and their property, and it can also store freshwater for later use. Communities in Europe, Africa, and Southeast Asia have deployed it successfully. Now, the company is expanding into other water-related services to help vulnerable places become more resilient. One in five people globally are at high risk of being exposed to serious floods. Many live in communities without proper protection and can’t afford to evacuate during a flood or relocate permanently. Climate change-driven extreme weather and sea-level rise is only exacerbating the problem. WaveSave makes a portable rubber dam called SlamDam that customers can quickly install in the early hours of a flood. Anyone can unfurl it on the ground along a riverbank or shoreline and pump it full of water until it swells into place. And there it stands, up to 1.3 meters high, shielding nearby property or structures from damage as waters rise. Developed in 2013 in the Netherlands, SlamDam was initially tested and is still used today by regional water authorities in that country. WaveSave has since expanded into Africa and Southeast Asia, and customers have now deployed SlamDam in at least a dozen countries. Key indicators Industry: Flood barriers Year the company was founded: 2017 City and country of headquarters: Eindhoven, the Netherlands Notable fact: WaveSave is demoing its SlamDam product on New York City’s Governors Island as one of seven winners in a competition for urban climate adaptations. The barrier is installed at a site where high tides and waves from passing ferries often wash ashore. Potential for impact Due to both climate change and population growth, nearly 2 billion people will be exposed to floods by 2100—an increase of 300 million from 2020, according to one estimate . A SlamDam is designed to help protect farmland and personal property as well as critical facilities like hospitals or water treatment plants. It’s cheaper in the short term than more permanent modifications like building levees or rebuilding facilities on higher ground. And its temporary nature means it can be deployed as needed, and then stored away. To fill the SlamDam, a local installer can use any portable water pump they may have on hand. With a lifespan of more than 40 years, the flood barriers can be used again and again. This low-tech solut", "date_str": "2026-10-06T10:35:00+00:00", "hash": "1504fa9320114f40", "title_fa": "WaveSave و سد لاستیکی قابل حمل آن", "summary_fa": "با افزایش سطح دریا و بدتر شدن خطرات سیل به دلیل گرم شدن کره زمین، سد قابل حمل WaveSave که به راحتی قابل نصب است ابزاری برای واکنش سریع ارائه می دهد. مردم می توانند از سد برای محافظت از خود و اموال خود استفاده کنند و همچنین می توانند آب شیرین را برای استفاده بعدی ذخیره کنند. جوامع در اروپا، آفریقا و آسیای جنوب شرقی آن را با موفقیت به کار گرفته اند. اکنون، این شرکت در حال گسترش به سایر خدمات مرتبط با آب است تا به مکان‌های آسیب‌پذیر کمک کند تا انعطاف‌پذیرتر شوند. از هر پنج نفر در سراسر جهان، یک نفر در معرض خطر بالای قرار گرفتن در معرض سیل قرار دارد. بسیاری از آنها در جوامع بدون حفاظت مناسب زندگی می کنند و نمی توانند در طول سیل تخلیه شوند یا به طور دائم نقل مکان کنند. آب و هوای شدید ناشی از تغییرات آب و هوایی و افزایش سطح آب دریاها فقط این مشکل را تشدید می کند. WaveSave یک سد لاستیکی قابل حمل به نام SlamDam می سازد که مشتریان می توانند به سرعت آن را در ساعات اولیه سیل نصب کنند. هر کسی می تواند آن را روی زمین در امتداد یک رودخانه یا خط ساحلی باز کند و آن را پر از آب پمپ کند تا زمانی که در جای خود متورم شود. و در آنجا ایستاده است، تا ارتفاع 1.3 متر، و از اموال یا سازه های مجاور در برابر آسیب با بالا آمدن آب محافظت می کند. SlamDam که در سال 2013 در هلند توسعه یافت، ابتدا مورد آزمایش قرار گرفت و هنوز هم توسط مقامات آب منطقه ای در آن کشور استفاده می شود. WaveSave از آن زمان به آفریقا و آسیای جنوب شرقی گسترش یافته است و مشتریان اکنون SlamDam را در حداقل دوازده کشور مستقر کرده"}, {"source": "MIT Tech Review", "title": "BasiGo and its fleet of electric buses", "link": "https://www.technologyreview.com/2026/10/06/1145216/2026-climate-tech-companies-to-watch-basigo-fleet-electric-buses/", "summary": "BasiGo aims to replace the tens of thousands of diesel-powered buses on sub-Saharan African roads with electric ones that generate far fewer emissions. The company’s pay-as-you-drive business model has helped make EVs more attainable and is changing the way public transport operates. In a bid to contain the covid-19 pandemic in 2020, the Kenyan government temporarily suspended public transportation. The suspension lasted only three days, yet the change in air quality was dramatic. The air was so clear that Mt. Kenya—Africa’s second-highest peak—was visible in Nairobi, roughly 175 kilometers away. Some could even spot Mt. Kilimanjaro, the continent’s highest mountain, even farther in the distance. This reprieve from smog sparked the idea for BasiGo’s electric bus business. The company’s founders glimpsed what could happen to the air if diesel buses and trucks were cleaned up. Since then, they’ve built a fleet of more than 100 electric buses to lease to customers who are operating them in Kenya and Rwanda. These buses have ferried 15 million passengers since BasiGo’s founding. The company doesn’t manufacture its own buses—the vehicles come from China and are assembled in Kenya. BasiGo’s innovation lies in offering a full range of services that make its electric buses more competitive with internal combustion engine (ICE) buses, says Jit Bhattacharya, co-founder and CEO. Instead of simply selling its buses to operators, as other bus companies do, BasiGo leases them out, offers maintenance services and insurance, and provides a charging network for its customers. Those customers are primarily individual operators or bus cooperatives, of which there are more than 300 in Kenya. Key indicators Industry: Electric vehicles Founded: 2021 Headquarters: Nairobi, Kenya Notable fact: BasiGo is the first authorized service provider in sub-Saharan Africa for CATL, the world’s largest EV battery company. Its own buses use CATL batteries and BasiGo’s employees are trained to repair the batteries on other vehicles. Potential for impact The initial price of electric buses is very high compared to combustion-engine models. Electric vehicle expenses are lower over the long term, though, because of the savings from fuel. BasiGo’s model aims to remove the barrier of high up-front cost for private bus operators in Africa looking to add an electric bus to their fleet. Under this approach, the operator pays a small deposit, which Bhattacharya says is 40% less than the down payment t", "date_str": "2026-10-06T10:35:00+00:00", "hash": "cbb0c2bf5a268db6", "title_fa": "BasiGo و ناوگان اتوبوس های برقی آن", "summary_fa": "BasiGo قصد دارد ده‌ها هزار اتوبوس دیزلی را در جاده‌های جنوب صحرای آفریقا با اتوبوس‌های برقی جایگزین کند که آلایندگی بسیار کمتری دارند. مدل کسب‌وکار «پرداخت به ازای رانندگی» این شرکت کمک کرده است تا خودروهای برقی قابل دسترس‌تر شود و نحوه عملکرد حمل‌ونقل عمومی را تغییر دهد. دولت کنیا در تلاش برای مهار همه گیری کووید-19 در سال 2020، حمل و نقل عمومی را به طور موقت متوقف کرد. تعلیق تنها سه روز به طول انجامید، با این حال تغییر در کیفیت هوا چشمگیر بود. هوا آنقدر شفاف بود که کوه کنیا - دومین قله مرتفع آفریقا - در نایروبی، تقریباً 175 کیلومتر دورتر، قابل مشاهده بود. برخی حتی می توانند کوه کلیمانجارو، مرتفع ترین کوه قاره، حتی دورتر از آن را ببینند. این خلاص شدن از مه دود باعث ایجاد ایده برای تجارت اتوبوس برقی BasiGo شد. بنیانگذاران این شرکت می‌دانستند که اگر اتوبوس‌ها و کامیون‌های دیزلی تمیز شوند، چه اتفاقی برای هوا می‌افتد. از آن زمان، آنها ناوگانی متشکل از بیش از 100 اتوبوس برقی برای اجاره به مشتریانی که آنها را در کنیا و رواندا کار می کنند، ساخته اند. این اتوبوس ها از زمان تاسیس BasiGo تاکنون 15 میلیون مسافر را جابجا کرده اند. این شرکت اتوبوس های خود را تولید نمی کند - وسایل نقلیه از چین می آیند و در کنیا مونتاژ می شوند. Jit Bhattacharya، یکی از بنیانگذاران و مدیرعامل، می گوید: نوآوری BasiGo در ارائه طیف کاملی از خدمات است که اتوبوس های الکتریکی آن را با اتوبوس های موتور احتراق داخلی (ICE) رقابتی تر می کند. BasiGo به جای اینکه به سادگی اتوبوس های خود را به اپراتورها بفروشد، مانند سایر شرکت های اتوبوسرانی، آنها را اجاره می کند، خدمات تعمیر و نگهداری و بیمه ارائه می دهد و یک شبکه شارژ برای مشتریان خود فراهم می کند. این مشتریان"}, {"source": "Business Insider", "title": "The best Apple Prime Day deals include $70 off AirPods Pro 3 and $50 off the brand-new Apple Watch Series 12", "link": "https://www.businessinsider.com/guides/deals/apple-prime-day-deals-2026-10", "summary": "When you buy through our links, Business Insider may earn an affiliate commission. Learn more Our reviewers top-rated Apple devices, like the AirPods Pro 3 and Apple Watch SE 3, are on sale for Amazon s October Prime Day event. Tyler Hayes/Business Insider Amazon's October sale has arrived with Prime Day deals on all kinds of products. Tech gadgets are getting especially great discounts, including several Apple devices. The best Apple Prime Day deals even include savings on a few new models that just launched in September. Right now, you can save big on the AirPods Pro 3, which are $70 off . That's just $10 more than the record-low price they hit over the summer. Meanwhile, the brand-new Apple Watch Series 12 is getting its first notable deal since its September release, with a s ther.\" Skydance will be \"powered by creativity and technology,\" Ellison said, adding that the company has four top priorities: Win in storytelling. Become the most technologically capable media company. Lead in a crowded market. Earn Trust Every Day. \"Audiences have more choices than ever, technology is reshaping how stories are created, distributed and experienced, and competition for people's time and attention has never been greater,\" Ellison said in his memo. \"We don't just want to succeed in this environment — we want to win and help shape the future of the industry.\" Read the full memo from Ellison and co-CEO Ynon Kreiz to Skydance employees here: Team, Today we begin an exciting new chapter as Skydance. Getting here has been quite a journey. Over the past year and beyond, it has taken hard work, perseverance and commitment with many challenges along the way — but we did it! To everyone at both companies who helped get us to this moment: thank you. Thank you for your patience, your resilience and, above all, your belief in what we could accomplish together. Bringing Paramount and Warner Bros. Discovery together fulfills a vision that began with Skydance's acquisition of Paramount: to build the next-generation media and entertainment company, powered by creativity and technology. The goal was never simply to add more production capacity, brands or IP. It was to unite the talent, resources and capabilities of these companies into a stronger competitor, one with the scale to take on the biggest players in our industry. Together, we will give these iconic studios the opportunity to win for ", "date_str": "2026-10-06T13:56:28+00:00", "hash": "12e8e00ee2674374", "title_fa": "\"ما آن را انجام دادیم!\": یادداشت دیوید الیسون برای کارمندان را پس از بسته شدن قرارداد WBD پارامونت بخوانید.", "summary_fa": "دیوید الیسون پس از ادغام پارامونت با برادران وارنر دیسکاوری، مدیرعامل Skydance است. پل موریگی/گتی ایماژ; دیوید بکر/ گتی ایماژ برای CinemaCon Skydance، دیوید الیسون، مدیر عامل شرکت CinemaCon Skydance، پس از بستن قرارداد WBD پارامونت، یادداشتی را برای کارکنان ارسال کرد. \"ما انجامش دادیم!\" الیسون قبل از اضافه کردن چهار اولویت اصلی خود برای شرکت جدید، به کارکنان گفت. یادداشت کامل الیسون برای کارمندان Skydance را در زیر بخوانید. دیوید الیسون پس از تکمیل ادغام پارامونت با برادران وارنر، در حال گذراندن یک دور پیروزی است. اکتشاف، تشکیل Skydance با ظاهر جدید. \"این کار سخت، پشتکار و تعهد همراه با چالش های زیادی در طول راه نیاز داشت - اما ما آن را انجام دادیم!\" الیسون صبح روز سه شنبه در یادداشتی به کارمندان گفت که توسط Business Insider بدست آمد. الیسون از کارکنان در سراسر پارامونت و WBD برای \"صبر، انعطاف پذیری شما و مهمتر از همه، اعتقاد شما به آنچه ما می توانیم با هم انجام دهیم\" تشکر کرد. الیسون گفت که Skydance \"با خلاقیت و فناوری قدرت می گیرد\" و افزود که این شرکت چهار اولویت دارد: پیروزی در داستان. به توانمندترین شرکت رسانه ای از نظر فناوری تبدیل شوید. در بازار شلوغ پیشرو باشید. هر روز اعتماد کسب کنید. الیسون در یادداشت خود می‌گوید: «مخاطبان بیش از هر زمان دیگری انتخاب دارند، فناوری در حال تغییر نحوه خلق، توزیع و تجربه داستان‌ها است و رقابت برای وقت و توجه مردم هرگز بزرگ‌تر نبوده است.» ما فقط نمی‌خواهیم در این محیط موفق شویم، بلکه می‌خواهیم برنده شویم و به شکل‌دهی آینده صنعت کمک کنیم.» یادداشت کامل الیسون و یکی از مدیران اجرایی یونن کریز به کارمندان Skydance را در اینجا بخوانید: تیم، امروز فصل جدید هیجان انگیزی را به عنوان Skydance آغاز می کنیم. رسیدن به اینجا سفر بسیار زیادی بوده است. در طول سال گذشته"}, {"source": "Business Insider", "title": "Skydance has a debt problem. Meet new co-CEO Ynon Kreiz, the man who's supposed to fix it.", "link": "https://www.businessinsider.com/skydance-warner-paramount-ceo-ynon-kreiz-who-is-david-ellison-2026-10", "summary": "Ynon Kreiz s new job as co-CEO of Skydance makes him one of the most powerful men in media. Kevin Dietsch/Getty Images David Ellison's new Skydance empire comes with $80 billion in debt. Ynon Kreiz, Ellison's newly hired co-CEO, is the man who has to figure out how to shave that number down. Kreiz is not a high-profile Hollywood figure. The cuts he's about to make may make him one. Hollywood has spent a couple of years trying to figure out Skydance CEO David Ellison, who now runs the companies formerly known as Paramount and Warner Bros. Discovery . Now they have a new character to get to know: Ynon Kreiz , Ellison's newly appointed co-CEO. Kreiz, who is expected to co-host a press event with Ellison on Tuesday night, comes to Skydance from Mattel, where he is best-known for two things: engineering a deal with Warner Bros. and actress Margot Robbie to produce the colossally successful \"Barbie\" movie — and taking an ax to the toymaker's payroll, by laying off 22% of its workforce in one fell swoop. At Skydance, no one expects him to be making deals with studios and talent — that will be Ellison's purview. Instead, Kreiz will be expected to take on the grim task of finding a $6 billion in savings over 3 years — a job that will likely involve meaningful layoffs. It's a job that has drawn repeated comparisons to Gunnar Wiedenfels, the former CFO at WBD, who repeatedly hacked at that company's P L via layoffs and other cost-saving measures, like mothballing TV shows and movies . \"He's Gunnar,\" one of Kreiz's friends told me this week. But few people outside the company knew who Wiedenfels was. Instead, people in and out of Hollywood focused their attention and ire on David Zaslav , the spotlight-loving WBD CEO. This time around, it seems clear that Ellison will be the public face of Skydance, and the one who gets to do fun stuff like schmoozing with stars. Kreiz will be the one getting his hands very dirty. People who've worked with him in the past say he's cut out for the role. \"He's very serious,\" says Candle Media co-CEO Kevin Mayer, who negotiated with Kreiz when Mayer was a top executive at Disney, and Kreiz was CEO of Maker Studios, a web video startup Disney ended up buying in 2014 . \"He's unflappable, and is willing to take on the heaviest of heavy lifts.\" Kreiz, who declined to comment for this story, arrives at Skydance with a résumé stocked with media bona fides: He ran Endemol, the Dutch TV production company, back when it was a powerhouse; he helpe", "date_str": "2026-10-06T13:55:15+00:00", "hash": "c2f115dbeb770167", "title_fa": "Skydance مشکل بدهی دارد. با مدیر عامل جدید ینون کریز آشنا شوید، مردی که قرار است آن را برطرف کند.", "summary_fa": "شغل جدید ینون کریز به عنوان مدیرعامل Skydance او را به یکی از قدرتمندترین مردان رسانه تبدیل می کند. Kevin Dietsch/Getty Images امپراتوری جدید Skydance دیوید الیسون با 80 میلیارد دلار بدهی همراه است. ینون کریز، مدیرعامل تازه استخدام شده الیسون، مردی است که باید بفهمد که چگونه این عدد را کم کند. کریز یک چهره مطرح هالیوود نیست. برش هایی که قرار است انجام دهد ممکن است او را تبدیل به یکی کند. هالیوود چند سالی را صرف پیدا کردن دیوید الیسون، مدیرعامل Skydance کرده است که اکنون شرکت‌هایی را که قبلاً پارامونت و برادران وارنر دیسکاوری نامیده می‌شدند، اداره می‌کند. اکنون آنها شخصیت جدیدی برای شناختن دارند: ینون کریز، مدیرعامل جدید الیسون. کریز که انتظار می رود سه شنبه شب یک رویداد مطبوعاتی را با الیسون برگزار کند، از Mattel به Skydance می آید، جایی که بیشتر به دو چیز معروف است: مهندسی قرارداد با برادران وارنر. و مارگوت رابی، بازیگر، فیلم فوق‌العاده موفق «باربی» را تولید می‌کنند - و با تبر به دستمزد اسباب‌بازی‌ساز، با اخراج 22 درصد از نیروی کار خود در یک لحظه. در Skydance، هیچ کس انتظار ندارد که او با استودیوها و استعدادها معامله کند - این وظیفه الیسون خواهد بود. در عوض، انتظار می‌رود که کرایز وظیفه تلخ یافتن 6 میلیارد دلار پس‌انداز در طول 3 سال را بر عهده بگیرد - شغلی که احتمالاً مستلزم اخراج‌های معنادار است. این شغلی است که مکرراً با گونار ویدنفلز، مدیر مالی سابق WBD، که بارها از طریق اخراج و سایر اقدامات صرفه‌جویی در هزینه‌ها، مانند نمایش‌های تلویزیونی و فیلم‌های سینمایی، PL آن شرکت را هک کرد، مقایسه شده است. یکی از دوستان کریز این هفته به من گفت: \"او گونار است.\" اما تعداد کمی از افراد خارج از شرکت می دانستند که Wiedenfels کیست. در عوض، مردم داخل و خارج از هالیوود توجه و"}, {"source": "Business Insider", "title": "The best Prime Day deals at 50% off or more: Save on Bose, Stanley, Shark, and the like", "link": "https://www.businessinsider.com/guides/deals/prime-day-half-off-deals-2026-10", "summary": "When you buy through our links, Business Insider may earn an affiliate commission. Learn more You can save over 50% on last-gen tech, homeware staples, and fall wardrobe essentials during October Prime Day. Tyler Hayes, Juliana Kaplan, Antonio Villas-Boas/Business Insider If you've been holding off on a purchase, Prime Day's 50%-off deals are the ones worth a closer look. We found savings half off or more on useful things you may already have on your list, along with a few satisfying splurges that are much easier to justify at this price. But not every dramatic markdown is a real bargain. We're looking beyond the percentage off to highlight products that are genuinely worth buying at their current sale prices — so you can skip the dud deals and get to the good stuff. Check out our guide to the best Prime Day deals for more discounts across all categories. We're reporting live on Amazon's dynamic pricing system, so you'll be the first to know when an item's price drops. Top 3 deals at 50% off or more Bose Quiet Comfort Headphones $359 $169 Shark AI Ultra Robot Vacuum (AV2501S) $549.99 $239.99 Waterpik Aquarius Water Flosser $99.99 $49.99 Amazon Prime Day quick links Prime Day: Shop deals of all categories on Amazon's homepage Amazon devices: Save on Kindles, Echos, Fire TV Sticks, and more Home kitchen: Save on coffee makers, vacuums, and mattresses Beauty: Discounts on Laneige, La Roche-Posay, and more Everyday essentials: Score deals on laundry detergent, toothbrushes, and more Apple: Shop Apple Watches, iPads, and AirPods on sale Shopping for more discounts today? Check out our roundup of all of the best Prime Day deals or browse Amazon's website for the full selection. Read the original article on Business Insider", "date_str": "2026-10-06T13:51:18+00:00", "hash": "8da1b03b05518850", "title_fa": "بهترین معاملات Prime Day با 50٪ تخفیف یا بیشتر: صرفه جویی در Bose، Stanley، Shark و موارد مشابه", "summary_fa": "وقتی از طریق پیوندهای ما خرید می کنید، Business Insider ممکن است کمیسیون وابسته را دریافت کند. بیشتر بیاموزید می‌توانید بیش از 50 درصد در فناوری‌های نسل آخر، لوازم خانگی و لوازم ضروری کمد لباس پاییزی در روز اول اکتبر صرفه‌جویی کنید. تایلر هیز، جولیانا کاپلان، آنتونیو ویلاس بواس/Business Insider اگر خرید خود را متوقف کرده‌اید، تخفیف‌های 50 درصدی پرایم دی آن‌هایی هستند که ارزش بررسی دقیق‌تری دارند. ما متوجه شدیم که در موارد مفیدی که ممکن است قبلاً در لیست خود داشته باشید، نصف یا بیشتر صرفه جویی کنید، همراه با چند هجمه رضایت بخش که توجیه آنها با این قیمت بسیار آسان تر است. اما هر شکست دراماتیک یک معامله واقعی نیست. ما فراتر از درصد تخفیف برای برجسته کردن محصولاتی هستیم که واقعاً ارزش خرید با قیمت‌های فروش فعلی‌شان را دارند - بنابراین می‌توانید از معاملات نامعقول صرفنظر کنید و به چیزهای خوب برسید. راهنمای ما را برای بهترین معاملات Prime Day برای تخفیف های بیشتر در همه دسته ها بررسی کنید. ما در حال گزارش مستقیم در سیستم قیمت گذاری پویا آمازون هستیم، بنابراین شما اولین کسی خواهید بود که از کاهش قیمت یک کالا مطلع خواهید شد. 3 تخفیف برتر با 50% تخفیف یا بیشتر برای هدفون Bose Quiet Comfort 359 دلار 169 دلار Shark AI Ultra Robot Vacuum (AV2501S) 549.99 دلار 239.99 دلار Waterpik Aquarius Water Flosser 99.99 دلار: 49.99 دلار آمازون قیمت‌های صفحه اصلی مجموعه‌های آمازون پرایم روز: معاملات سریع Amazon Sa Kindles، Echos، Fire TV Sticks و موارد دیگر آشپزخانه خانگی: صرفه جویی در قهوه ساز، جاروبرقی و تشک زیبایی: تخفیف در Laneige، La Roche-Posay، و موارد ضروری دیگر: امتیازی برای مواد شوینده لباسشویی، مسواک، و موارد دیگر کسب کنید: اپل برای خرید اپل واچ، اپل واچ تخفیف، اپل واچ، اپل واچ تخفیف بیشتری بخرید؟ خلاصه ما از همه بهترین معاملات Prime"}, {"source": "Business Insider", "title": "The 14 most innovative influencer marketers of 2026", "link": "https://www.businessinsider.com/most-innovative-influencer-marketers-working-with-creators-2026-10", "summary": "Julian Wass; NFL; ALSAC; Alyssa Powell/BI Creators can hype up a brand or ruin its week in a single social media post. For marketers, figuring out how to tap into that influence is a balancing act. It requires experimentation, choosing the right influencer partners, handing over enough creative control, and reacting quickly when lightning strikes and your brand's name is suddenly all over the internet. Business Insider's 2026 list of the most innovative influencer marketers inside brands highlights the executives figuring out how to make their companies look good on social media. This year's 14 marketers were nominated by peers and other industry insiders who shared dozens of examples of how the marketers are working smartly with creators or making original content for social. Some, like PepsiCo's Charlie Crideford and Walmart's Sarah Henry, work with curated networks of influencers who make content or help advise on their social strategies. Others, like the National Football League's Ian Trombetta, work with large teams of in-house producers to make original content tailored to social feeds. Breaking through the noise means finding new audiences in different corners of the internet. Footwear brand Rothy's turned to Substack , for instance, to hire tastemaker writers who could help drive attention to its shoes. \"We don't really care about follower count necessarily,\" Rothy's vice president Anna Doré said. \"We really look for great partners and creators who have pull in their own circles, and that can be anyone these days.\" Our roster of innovative creator marketers faces challenges. Though the creator economy is booming, engagement is harder than ever to come by as social feeds become more saturated and algorithms surface content selectively to different users. \"The creative bar is going up in order for us to drive that organic reach and engagement,\" the NFL's Trombetta said. \"No one can predict exactly where the algorithms are going to go one day to the next.\" Here are Business Insider's 2026 most innovative influencer marketers, listed in alphabetical order by last name. Lindsay Burstein, Keurig Dr Pepper s senior director of integrated social and communications Lindsay Burstein Lindsay Burstein jumps into action when marketing opportunities show up unexpectedly, like when TikTok creator Romeo Bingham posted an impromptu Dr Pepper jingle that went viral and gathered over 100 million views. Burstein oversees a social team that works on creator partnership", "date_str": "2026-10-06T13:33:49+00:00", "hash": "4ff0a25cb412332a", "title_fa": "14 نوآورترین اینفلوئنسر مارکتینگ در سال 2026", "summary_fa": "جولیان واس؛ NFL; ALSAC; سازندگان آلیسا پاول/بی‌آی می‌توانند با یک پست در رسانه‌های اجتماعی یک برند را تبلیغ کنند یا هفته آن را خراب کنند. برای بازاریابان، فهمیدن اینکه چگونه می توان از آن نفوذ بهره برد، یک اقدام متعادل کننده است. این نیاز به آزمایش، انتخاب شرکای اینفلوئنسر مناسب، واگذاری کنترل خلاقانه کافی، و واکنش سریع در هنگام برخورد رعد و برق و نام تجاری شما به طور ناگهانی در سراسر اینترنت دارد. فهرست 2026 Business Insider از مبتکرترین اینفلوئنسر مارکتینگ ها در برندها، مدیرانی را که متوجه می شوند چگونه شرکت های خود را در رسانه های اجتماعی خوب جلوه دهند، برجسته می کند. 14 بازاریاب امسال توسط همتایان و دیگر صاحبان صنعت نامزد شدند که ده‌ها نمونه از نحوه کار هوشمندانه بازاریابان با سازندگان یا تولید محتوای اصلی برای شبکه‌های اجتماعی را به اشتراک گذاشتند. برخی، مانند چارلی کریدفورد از پپسی و سارا هنری از والمارت، با شبکه‌های سرپرستی از اینفلوئنسرها کار می‌کنند که محتوا تولید می‌کنند یا به مشاوره در مورد استراتژی‌های اجتماعی آنها کمک می‌کنند. دیگران، مانند ایان ترومبتا از لیگ ملی فوتبال، با تیم‌های بزرگی از تولیدکنندگان داخلی همکاری می‌کنند تا محتوای اصلی متناسب با فیدهای اجتماعی تولید کنند. شکستن سر و صدا به معنای یافتن مخاطبان جدید در گوشه های مختلف اینترنت است. به عنوان مثال، برند کفش Rothy's به Substack روی آورد تا نویسندگان ذوقی را استخدام کند که می توانند به جلب توجه به کفش های آن کمک کنند. آنا دوره، معاون روتی، گفت: «ما واقعاً به تعداد فالوورها اهمیت نمی دهیم. ما واقعاً به دنبال شرکا و سازندگان بزرگی هستیم که در حلقه‌های خودشان باشند و این روزها هر کسی می‌تواند باشد.» فهرست بازاریابان مبتکر مبتکر ما با چالش هایی مواجه است. اگرچه اقتصاد سازندگان در حال رونق است، اما به دلیل اشباع شدن فیدهای اجتماعی و الگوریتم ها به"}, {"source": "Business Insider", "title": "One phrase I learned while living in Japan for a year has helped me become a more flexible, laid-back person", "link": "https://www.businessinsider.com/phrase-learned-living-in-japan-made-me-relaxed-laidback-shoganai-2026-10", "summary": "After many situations where things didn t go according to plan, I started to embrace letting things go. Courtesy of Alessa Hickman I've embraced the Japanese concept of \"shōganai,\" or accepting that some things can't be helped. My husband and I use the phrase to brush off late buses, bad weather, and other daily frustrations. As an overthinker who loves a plan , the concept of shōganai helps me be flexible and let things go. Picture me, hungry (and hangry), scrolling through Google Maps for a local spot to try. I find a restaurant that looks good, see that it's open, and think, perfect, let's go. Twenty minutes later, I confidently walk up to the door, only to find the place magically closed. This has happened to me so many times since moving to Japan that I've lost count. I'll admit the first few times I was pretty confused … and probably reacted a little more dramatically than the situation warranted. I've always been a big overthinker and a planner. Before I moved to Japan 10 months ago, I had so many preconceived ideas about how the year would go, where I'd end up, and everything I'd see and do along the way. Unsurprisingly, I've learned the same lesson here over and over again: Things won't always go according to plan. I learned 'shōganai' on a night out in Kumamoto The concept of shōganai helped me shift my perspective. Courtesy of Alessa Hickman A couple of months ago, I was spending some time in Kumamoto city, and I was lucky enough to make a friend who's also from Canada. One night, while we were hanging out in the main area, we stopped by the Kumamoto Food Stall Village. At one of the stalls, we met two Japanese guys around our age, and before long, we were all sampling sake and hanging out together. During our conversation, we started exchanging slang, both Canadian and Japanese, and the concept of \"shōganai\" came up. The way it was explained to me, it essentially means \"it can't be helped\" or \"it is what it is.\" It's something you'd say when you're stuck in traffic, or the rain ruins your plans , and there's nothing you can do about it. Instead of getting hung up on what went wrong, you accept the situation and choose to move on. It really resonated with me at the time, and it rubbed off on my husband pretty quickly, too. Within a couple of days, he was using shōganai all the time — when we'd miss our bus, when I was complaining about how hot and humid it was, or whenever I was spiraling over something that definitely wasn't worth stressing ove", "date_str": "2026-10-06T13:25:01+00:00", "hash": "b00aec90f5aa3f91", "title_fa": "عبارتی که در طول یک سال زندگی در ژاپن یاد گرفتم به من کمک کرد تا فردی انعطاف پذیرتر و آرام تر باشم", "summary_fa": "بعد از موقعیت‌های زیادی که همه چیز طبق برنامه پیش نمی‌رفت، شروع کردم به پذیرفتن اجازه دادن به همه چیز. با حسن نیت از Alessa Hickman من مفهوم ژاپنی \"shōganai\" را پذیرفتم یا پذیرفتم که برخی چیزها نمی توانند کمک کنند. من و شوهرم از این عبارت برای از بین بردن تاخیر اتوبوس ها، آب و هوای بد و دیگر ناراحتی های روزانه استفاده می کنیم. به عنوان یک متفکر بیش از حد که عاشق یک برنامه است، مفهوم شوگانای به من کمک می کند انعطاف پذیر باشم و همه چیز را رها کنم. من را تصور کنید که گرسنه (و گرسنه) هستم، در حال پیمایش در نقشه های گوگل به دنبال یک نقطه محلی برای امتحان کردن هستم. رستورانی پیدا می کنم که ظاهر خوبی دارد، می بینم که باز است، و فکر می کنم عالی است، بیایید برویم. بیست دقیقه بعد، با اطمینان به سمت در رفتم، اما دیدم که مکان به طرزی جادویی بسته شده است. از زمانی که به ژاپن نقل مکان کردم، این اتفاق برای من بارها رخ داده است که حسابم را از دست داده ام. اعتراف می‌کنم که چند بار اول خیلی گیج بودم… و احتمالاً کمی بیشتر از آنچه که شرایط لازم بود واکنش نشان دادم. من همیشه یک متفکر بزرگ و یک برنامه ریز بوده ام. قبل از اینکه 10 ماه پیش به ژاپن نقل مکان کنم، ایده های از پیش تعیین شده زیادی در مورد اینکه سال چگونه می گذرد، به کجا می رسم و هر کاری که در طول مسیر می بینم و انجام می دهم، داشتم. جای تعجب نیست که من در اینجا بارها و بارها همین درس را آموخته ام: همه چیز همیشه طبق برنامه پیش نمی رود. من \"شوگانای\" را در یک شب در کوماموتو یاد گرفتم مفهوم شوگانای به من کمک کرد دیدگاهم را تغییر"}, {"source": "Business Insider", "title": "Walmart moves to grab a bigger chunk of the TV ad business", "link": "https://www.businessinsider.com/walmart-connect-linear-tv-warner-bros-ad-deal-2026-10", "summary": "Walmart ads are coming to a TV near you. Justin Sullivan/Getty Images Walmart is making a bigger play for TV ad dollars. It's struck a partnership with Warner Bros. Discovery. The deal means advertisers can reach Walmart shoppers on linear TV networks like TBS. Walmart is taking its ad business to the TV screen. On Tuesday, Walmart exclusively told CMO Insider that advertisers can now use its shopper targeting and measurement data on linear TV through a new partnership with Warner Bros. Discovery, which is merging with Paramount to form Skydance. The move positions Walmart more favorably in its pursuit of the big brand budgets traditionally spent on TV, and beyond the performance marketing spend that typically accounts for the largest share of its Walmart Connect ad business . It's also the latest sign of retail media giants further expanding into new media beyond their own stores, sites, and apps. Walmart's pitch to advertisers is that they can reach its millions of shoppers and measure whether those ads drove purchases through its sales data. Those properties naturally have a finite amount of advertising inventory, so the company has been ramping up efforts to help advertisers target Walmart shoppers elsewhere. Walmart acquired the TV-maker Vizio in 2024, helping it tap into connected-TV ad budgets. This year, it scooped up the adtech firm Vibe.co , which also focuses on streaming TV, as part of a plan to pursue small- and medium-sized advertisers. Walmart's ad revenue reached $6.4 billion in 2025. Khurrum Malik, Walmart Connect VP of business and product marketing, told CMO Insider the WBD deal came about because advertisers and agencies had asked for the capability. Advertisers' audiences are split across CTV and linear, but advertisers want consistent targeting and measurement across both, he said. Walmart advertisers can access this linear inventory via a private marketplace deal on its demand-side platform. It includes WBD networks such as TBS, TLC, and TruTV, and can include live sports when those networks carry them. Walmart has experimented with linear TV before: In 2024, it partnered with NBCUniversal to make \"shoppable\" ads available on its live Thanksgiving sports programming via Walmart's DSP. Malik said he envisioned Walmart expanding into more non-digital channels. \"We want to start slow and then go fast,\" Malik said. \"I could see us scaling as the solution works for advertisers.\" Walmart isn't alone in chasing TV ad budgets in the fast-gro", "date_str": "2026-10-06T13:00:01+00:00", "hash": "2193abf0f4d1d542", "title_fa": "Walmart به سمت تصاحب بخش بزرگی از تجارت تبلیغات تلویزیونی حرکت می کند", "summary_fa": "تبلیغات والمارت به تلویزیون نزدیک شما می آید. جاستین سالیوان/ گتی ایماژ والمارت در حال ساخت بازی بزرگتری برای دلارهای تبلیغات تلویزیونی است. این یک همکاری با برادران وارنر دیسکاوری است. این معامله به این معنی است که تبلیغ‌کنندگان می‌توانند در شبکه‌های تلویزیونی خطی مانند TBS به خریداران Walmart دسترسی پیدا کنند. والمارت کسب و کار تبلیغاتی خود را به صفحه تلویزیون می برد. روز سه‌شنبه، Walmart به طور انحصاری به CMO Insider گفت که تبلیغ‌کنندگان اکنون می‌توانند از طریق همکاری جدید با برادران وارنر، از داده‌های هدف‌گیری و اندازه‌گیری خریداران آن در تلویزیون خطی استفاده کنند. دیسکاوری که در حال ادغام با پارامونت برای تشکیل Skydance است. این حرکت والمارت را در پیگیری بودجه‌های برند بزرگی که به طور سنتی در تلویزیون صرف می‌شود، و فراتر از هزینه‌های بازاریابی عملکردی که معمولاً بیشترین سهم از تجارت تبلیغاتی Walmart Connect را تشکیل می‌دهد، موقعیت مطلوب‌تری دارد. همچنین این آخرین نشانه از گسترش بیشتر غول های رسانه ای خرده فروشی به رسانه های جدید فراتر از فروشگاه ها، سایت ها و برنامه های خودشان است. هدف Walmart برای تبلیغ‌کنندگان این است که آنها می‌توانند به میلیون‌ها خریدار دسترسی پیدا کنند و اندازه‌گیری کنند که آیا این تبلیغات از طریق داده‌های فروش آن خرید را افزایش داده است یا خیر. این املاک به طور طبیعی دارای مقدار محدودی از موجودی تبلیغاتی هستند، بنابراین شرکت تلاش‌های خود را برای کمک به تبلیغ‌کنندگان برای هدف قرار دادن خریداران والمارت در جاهای دیگر افزایش داده است. Walmart سازنده تلویزیون Vizio را در سال 2024 خریداری کرد و به آن کمک کرد تا از بودجه تبلیغات تلویزیون متصل استفاده کند. امسال، شرکت تبلیغاتی Vibe.co را به عنوان بخشی از طرحی برای تعقیب تبلیغ‌کنندگان کوچک و متوسط ​​جذب کرد، که بر پخش تلویزیون نیز تمرکز دارد. درآمد تبلیغات والمارت در سال 2025 به 6.4 میلیارد دلار رسید."}, {"source": "Business Insider", "title": "The best Prime Day vacuum deals from Shark, Bissell, Roborock, and more", "link": "https://www.businessinsider.com/guides/deals/prime-day-vacuum-deals-2026-10", "summary": "When you buy through our links, Business Insider may earn an affiliate commission. Learn more I found the best vacuum deals on the best models we ve tested this year from Dyson, Shark, Roborock, and more. Tyler Hayes; Camryn Rabideau/Business Insider Another Prime Day is here, and if you're hoping to scoop up a discount on a vacuum, I've been monitoring the best Prime Day vacuum deals from models we've tested and loved, featuring b ps://www.businessinsider.com/skydance-buys-warner-bros-discovery-david-ellison-paramount-deal-hollywood-2026-10", "summary": "David Ellison has created Skydance by bringing together Paramount and Warner Bros. Discovery. Mario Tama/Getty Images; David Becker/Getty Images for CinemaCon; Mario Tama/Getty Images Paramount has bought Warner Bros. Discovery, forming a new media giant: Skydance. David Ellison has become a media mogul overseeing two major movie studios, HBO, CNN, and CBS News. Skydance will be run by Ellison and co-CEO Ynon Kreiz, who will oversee the merger integration. David Ellison and his partners have completed their purchase of Warner Bros. Discovery for $110 billion in a mega-deal that promises to reshape Hollywood. Paramount Skydance, now known as Skydance , closed its acquisition of WBD on Tuesday. The combined company now controls Paramount Pictures and the Warner Bros. studio; streaming services HBO Max, Paramount+, Pluto TV, and Discovery+; and TV networks HBO, CBS, CNN, TNT, HGTV, and The Food Network. It also has iconic IP like DC Comics, Harry Potter, and SpongeBob Squarepants. Skydance has the potential to be an entertainment behemoth that can rival Disney and Netflix in size and cultural influence. Controlling this treasure trove of assets cements Ellison as a media mogul . Skydance Media, the production company Ellison started in 2006 that was behind films like \"Top Gun: Maverick,\" merged with Paramount last August. Ellison was backed by the fortune of his billionaire father — Larry, who cofounded Oracle — and financial partners like RedBird Capital, plus a trio of Middle East wealth funds from Saudi Arabia, Qatar, and Abu Dhabi. The new Skydance will be led by David Ellison and former Mattel CEO Ynon Kreiz . Ellison will be in charge of Skydance's creative and tech strategies while Kreiz, who's joining as a co-CEO , will handle the merger integration and day-to-day operations. Casey Bloys, the head of HBO, will head up the combined company's streaming strategy after Paramount streaming chief Cindy Holland stepped down . CNN CEO Mark Thompson is staying on, while Bari Weiss is heading up CBS News. The new-look Skydance faces many challenges, including a massive debt load and stiff competition in streaming. Even when combined, Paramount+ and HBO Max lack the viewership of Disney or Netflix, let alone YouTube. \"It's a war for time spent, you're chasing the juggernaut in the space, which is YouTube,\" media analyst Rich Greenfield of Lightshed Partners said about Ellison's streaming mission . This deal's completion ends a monthslong saga that's worthy of an", "date_str": "2026-10-06T12:56:23+00:00", "hash": "10d47d5e5ebf78a1", "title_fa": "دیوید الیسون بالاخره کمپانی برادران وارنر دیسکاوری را خرید و هالیوود را بازسازی کرد", "summary_fa": "دیوید الیسون Skydance را با گرد هم آوردن پارامونت و برادران وارنر دیسکاوری ساخته است. ماریو تاما/گتی ایماژ; دیوید بکر/گتی ایماژ برای CinemaCon; ماریو تاما/ گتی ایماژ پارامونت شرکت برادران وارنر دیسکاوری را خرید و یک غول رسانه ای جدید را تشکیل داد: Skydance. دیوید الیسون به یک غول رسانه ای تبدیل شده است که بر دو استودیو بزرگ فیلم، HBO، CNN و CBS News نظارت می کند. Skydance توسط الیسون و یکی از مدیران اجرایی Ynon Kreiz اداره خواهد شد که بر ادغام نظارت خواهند داشت. دیوید الیسون و شرکای او خرید 110 میلیارد دلاری برادران وارنر دیسکاوری را در یک معامله بزرگ که نوید تغییر شکل هالیوود را می دهد، به پایان رساندند. پارامونت اسکای دنس که اکنون با نام Skydance شناخته می شود، خرید WBD خود را در روز سه شنبه تعطیل کرد. این شرکت ترکیبی اکنون پارامونت پیکچرز و استودیو برادران وارنر را کنترل می کند. خدمات پخش HBO Max، Paramount+، Pluto TV، و Discovery+؛ و شبکه های تلویزیونی HBO، CBS، CNN، TNT، HGTV، و شبکه غذا. همچنین دارای IP نمادین مانند DC Comics، Harry Potter و SpongeBob SquarePants است. Skydance پتانسیل تبدیل شدن به یک غول سرگرمی را دارد که می تواند از نظر اندازه و نفوذ فرهنگی با دیزنی و نتفلیکس رقابت کند. کنترل این گنجینه دارایی الیسون را به عنوان یک غول رسانه ای تثبیت می کند.
