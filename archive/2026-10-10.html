ority targets such as missile sites, defense production facilities, military infrastructure, and Iranian naval capabilities. Air assets also shielded the strike group from enemy action. The Navy said that the air wing, with its combination of stealth fighter jets and workhorse aircraft, effectively penetrated contested airspace and demonstrated the \"Air Wing of the Future\" concept in a real-world combat scenario. Among the air assets deployed with Carrier Air Wing 9 were F-35C Lightning II Joint Strike Fighters, fifth-generation stealth jets. U.S. Navy photo by Mass Communication Specialist 3rd Class Angel Campbell Following the April ceasefire and the conclusion of Epic Fury, Carrier Strike Group 3 supported the Navy's blockade. When Iran began targeting commercial shipping, the group participated in strikes on Iranian coa", "date_str": "2026-10-10T11:17:01+00:00", "hash": "dfc7fbe69eeeda0e", "title_fa": "در اینجا اعداد خیره کننده پشت استقرار 321 روزه Abraham Lincoln Carrier Strike Group آمده است.", "summary_fa": "ناو هواپیمابر یو اس اس آبراهام لینکلن این هفته به خانه بازگشت. عکس نیروی دریایی ایالات متحده توسط متخصص ارتباطات جمعی کلاس 3 آرون جی رول یو اس اس آبراهام لینکلن از یک استقرار رزمی چالش برانگیز بازگشته است. بال هوایی آن هزاران ماموریت جنگی را انجام داد و بیش از یک میلیون پوند مهمات پرتاب کرد. نیروی دریایی می گوید این استقرار در حال شکل دادن به عملیات آینده ناو هواپیمابر است. ناو هواپیمابر یو اس اس آبراهام لینکلن نیروی دریایی آمریکا این هفته پس از یک استقرار جنگی طولانی و دشوار به کشور بازگشت. اعداد به اشتراک گذاشته شده توسط خدمات دریایی برای آن استقرار خیره کننده است. این کشتی جنگی در نوامبر 2025 بندر اصلی خود را در سن دیگو ترک کرد و به مدت 321 روز مستقر شد که شامل 286 روز متوالی در دریا بدون تماس با بندر بود. استقرار طولانی مدت، که توسط عملیات حماسه خشم که جنگ ایران را آغاز کرد، تمدید شد، یک رکورد امروزی را ثبت کرد. با شروع خصومت ها در پایان فوریه، گروه ضربتی حامل آبراهام لینکلن نقش اصلی را در مبارزه ایفا کرد. هواپیمای حامل ایر وینگ 9 متعلق به گروه حمله ناو - یک نیروی هوانوردی دریایی متشکل از 9 اسکادران از F/A-18E/F Super Hornets، F-35C Lightning II Joint Strike Fighters و EA-18G Growler، در میان سایر دارایی ها، تقریباً در طول عملیات 400 روزه پرواز کرد. در طول استقرار چند ماهه، 14037 سورتی هواپیما را انجام داد و 31460 ساعت پرواز به جلو را جمع آوری کرد. نیروی دریایی گفت که تخمین زده می شود 20.5 میلیون گالن سوخت هوانوردی، عملیات بال هوایی را فعال کرد. در طول عملیات Epic Fury، ترکیبی از هواپیماهای نسل چهارم و پنجم بال هوایی ناو هواپیمابر 1499 مهمات دقیق را پرتاب کرد که بیش از 1.37 میلیون پوند مهمات را"}, {"source": "Business Insider", "title": "The Iran war is exposing dangerous gaps in the US military system built to save wounded troops", "link": "https://www.businessinsider.com/iran-war-dangerous-gaps-us-military-care-wounded-troops-2026-10", "summary": "Military medical officials said that as US forces entered the war with Iran, they lacked the same level of medical support they saw during the Global War on Terror. US Central Command Public Affairs The American doctors weren't in the room, or even in the country, when they were informed that the man's crushed limb could be saved. The US service member had been deployed aboard a ship in the Middle East, but an equipment accident in March had left him with severe injuries that exceeded the ship's medical capabilities. He had to go ashore for care, but there wasn't a US-run medical facility available nearby. At a host-nation hospital in the region, local doctors monitored and treated him while reassuring their US counterparts from afar that he was in stable condition. However, when he arrived at the American military hospital in Landstuhl, Germany, a week later, doctors saw a limb that had turned almost black and a life in danger. The incident, described publicly to an audience of military medical professionals by US Army Col. Jennifer Gurney during a panel on trauma case studies, speaks to a problem American forces have confronted amid the conflict with Iran. The system built for treating wounded troops during the post-9/11 Global War on Terror has struggled in this new fight. Gurney, who recently rotated out after serving as director of the Pentagon's Joint Trauma System , shared details of the incident at an August conference that Business Insider attended. Her remarks were not an isolated warning. Other military leaders who spoke at the event, along with half a dozen military medical officials interviewed separately, described a casualty-care system grappling with a battlefield far different from Iraq and Afghanistan . Officials who spoke with Business Insider said that at the beginning of the Iran war, medical capabilities close to the fighting were constrained by persistent drone and missile threats . They said that medical facilities on or near military centers have only recently received improved protection. Additionally, large, US-run hospitals in the region are absent, officials said, and reliance on host-nation hospitals, combined with limits on American oversight and fragmented records, has complicated efforts to track both patients and lessons from the war. The US once operated large Role 3 hospitals, such as this one in Afghanistan in 2011, during the Global War on Terror. Donna Miles/Department of Defense A spokesperson for Central Command , w", "date_str": "2026-10-10T11:07:01+00:00", "hash": "244d14f789cbf494", "title_fa": "جنگ ایران شکاف های خطرناکی را در سیستم نظامی ایالات متحده که برای نجات نیروهای مجروح ساخته شده است را آشکار می کند", "summary_fa": "مقامات پزشکی نظامی گفتند که با ورود نیروهای آمریکایی به جنگ با ایران، از همان سطح حمایت پزشکی که در طول جنگ جهانی علیه ترور دیده بودند، بی بهره بودند. روابط عمومی فرماندهی مرکزی ایالات متحده پزشکان آمریکایی در اتاق یا حتی در کشور نبودند که به آنها اطلاع دادند که عضو له شده مرد قابل نجات است. این سرباز آمریکایی در یک کشتی در خاورمیانه مستقر شده بود، اما یک تصادف تجهیزاتی در ماه مارس باعث جراحات شدید او شد که بیش از توانایی های پزشکی کشتی بود. او باید برای مراقبت به ساحل می رفت، اما یک مرکز پزشکی تحت اداره ایالات متحده در آن نزدیکی وجود نداشت. در یکی از بیمارستان های کشور میزبان در منطقه، پزشکان محلی او را تحت نظر گرفتند و تحت درمان قرار دادند و در عین حال به همتایان آمریکایی خود از دور اطمینان دادند که وضعیت او باثبات است. با این حال، هنگامی که او یک هفته بعد به بیمارستان نظامی آمریکا در لندستول آلمان رسید، پزشکان عضوی را دیدند که تقریباً سیاه شده بود و جانش در خطر بود. این حادثه که توسط سرهنگ ارتش ایالات متحده جنیفر گورنی در خلال یک پانل در مورد مطالعات موردی تروما به طور علنی برای حضار متخصصان پزشکی نظامی توضیح داده شد، از مشکلی صحبت می کند که نیروهای آمریکایی در بحبوحه درگیری با ایران با آن مواجه شده اند. سیستمی که برای معالجه سربازان مجروح در جریان جنگ جهانی علیه تروریسم پس از 11 سپتامبر ساخته شده بود، در این مبارزه جدید با مشکل مواجه شده است. گارنی که اخیراً پس از خدمت به عنوان مدیر سیستم مشترک ترومای پنتاگون از سمت خود برکنار شد، جزئیات این حادثه را در کنفرانسی در ماه اوت که Business Insider در آن شرکت کرد به اشتراک گذاشت. اظهارات او یک هشدار منفرد نبود. دیگر رهبران"}, {"source": "Business Insider", "title": "I used to feel embarrassed about graduating from a trade school. But now my career is safe from AI.", "link": "https://www.businessinsider.com/trade-school-instead-college-career-ai-safe-2026-10", "summary": "Sade Slack says her job is safe from AI. Courtesy of Sade Slack Sade Slack chose trade school over a four-year college and became a surgical technician. She now has no student loan debt, but sometimes feels embarrassed for not attending college. She feels secure from AI because her job depends on reading people and reacting in real time. This as-told-to essay is based on a conversation with Sade Slack, a 38-year-old surgical technician based in California. It has been edited for length and clarity. I entered high school with a heavy load of AP and honors classes . My middle school grades had put me on an accelerated track, and I pushed myself hard to keep up. By 10th grade, I was burned out . I came home from school and slept for hours just to recover. I obsessed over making A's. Then the pressure started affecting how I handled tests. I got so anxious that I began avoiding them. Halfway through the semester, I dropped all my classes. That changed how I thought about success. I stopped worrying so much about what looked impressive on paper and started asking myself what kind of life I actually wanted. That's when I decided a trade school was the better option for me. My family was disappointed when I said I didn't want to attend a four-year college My high school had a second path: Seniors who weren't going to university could meet representatives from trade schools, community colleges, and companies that hire straight out of high school. Suddenly, I could see options I hadn't considered before. I got excited about my future again. Trade school was also much easier to get into. No SAT. No waiting to hear from a first- or second-choice university. They reviewed my transcript and application and accepted me into an 18-month surgical technology program. Tuition was about $23,000. My parents didn't understand why I would borrow that much money for trade school, and they refused to cosign my student loans, so I took out the loan myself. Once classes started, the choice made even more sense Anatomy, physiology, and sociology were built on subjects I had already studied in high school, but now I could actually use what I was learning. We trained with our hands. I wasn't memorizing information just to pass an exam. I was learning skills I would eventually use in an operating room with real patients. That matters even more to me now when students can ask AI to explain almost anything in seconds. AI can be a great learning tool, but in my job, eventually, you have t", "date_str": "2026-10-10T11:07:01+00:00", "hash": "e1127bf2f16868ae", "title_fa": "قبلاً از فارغ التحصیلی از یک مدرسه بازرگانی خجالت می کشیدم. اما اکنون حرفه من از هوش مصنوعی در امان است.", "summary_fa": "Sade Slack می گوید شغلش از هوش مصنوعی در امان است. با حسن نیت از Sade Slack Sade Slack مدرسه تجارت را بیش از یک کالج چهار ساله انتخاب کرد و یک تکنسین جراحی شد. او اکنون هیچ بدهی وام دانشجویی ندارد، اما گاهی اوقات به خاطر عدم شرکت در کالج احساس خجالت می کند. او از هوش مصنوعی احساس امنیت می کند زیرا کارش به خواندن افراد و واکنش در زمان واقعی بستگی دارد. این مقاله گفته شده بر اساس گفتگو با Sade Slack، یک تکنسین جراحی 38 ساله مستقر در کالیفرنیا است. برای طول و وضوح ویرایش شده است. من با بار سنگینی از کلاسهای AP و افتخارات وارد دبیرستان شدم. نمرات مدرسه راهنمایی من را در مسیری شتابان قرار داده بود و من به سختی به خودم فشار آوردم تا از این راه پیش بروم. تا کلاس دهم، من سوخته بودم. من از مدرسه به خانه آمدم و ساعت ها خوابیدم تا بهبود پیدا کنم. من وسواس زیادی در ساختن A دارم. سپس فشار شروع به تأثیر بر نحوه انجام آزمایشات کرد. من آنقدر مضطرب شدم که شروع به اجتناب از آنها کردم. نیمی از ترم تمام کلاس هایم را رها کردم. این طرز فکر من در مورد موفقیت را تغییر داد. دیگر نگران چیزهایی بودم که روی کاغذ چشمگیر به نظر می رسیدند و از خودم می پرسیدم واقعاً چه نوع زندگی می خواهم. آن زمان بود که به این نتیجه رسیدم که یک مدرسه بازرگانی گزینه بهتری برای من است. وقتی گفتم نمی‌خواهم در کالج چهار ساله شرکت کنم، خانواده‌ام ناامید شدند. دبیرستان من راه دومی داشت: سالمندانی که به دانشگاه نمی‌رفتند، می‌توانستند نمایندگانی از مدارس تجاری، کالج‌های محلی و شرکت‌هایی که مستقیماً از دبیرستان استخدام می‌کنند ملاقات کنند. ناگهان می‌توانستم گزینه‌هایی را ببینم که قبلاً به آن فکر نکرده بودم. دوباره در مورد آینده"}, {"source": "Business Insider", "title": "I avoided shopping on Amazon for 449 days. Having a baby brought me back to it, but I'm shopping smarter now.", "link": "https://www.businessinsider.com/quit-shopping-amazon-before-pregnancy-2026-10", "summary": "The author found herself shopping on Amazon again after she had her third child. Courtesy of Kate Bratskeir I challenged myself to stop shopping on Amazon a few years ago. I went without it for 449 days, and became more thoughtful about my purchases. With my third child, I started shopping on Amazon again. But I still try to avoid it when possible. I bought 72 things from Amazon in 2024. The range of items runs the gamut: A replacement basket for the air fryer, dozens of children's books, an XL cone for my dog's post-surgery care, kids' birthday presents, skincare products I gave up on, pacifiers for my newborn twins before I remembered stashing some extras in the diaper bag, and lots of forgettable items in between. I was feeling uncomfortable about my consumption, my carbon footprint, and how second-nature buying on Amazon had become for me. I relied on the site to instantly cross off items on my to-do list. The lack of friction before purchasing became an issue It felt like the site's \" 1-Click checkout \" feature evolved into its own kind of mechanism in my brain chemistry: I was ordering things without doing any of the logical thinking that usually happens with in-store shopping, and I knew that was all by design. Making a purchase no longer had friction: Free shipping, a stored credit card and address, infinite stock, and a tantalizing algorithm all make shopping anywhere else feel like a chore. When it comes to Amazon, buying begets more buying, and I was getting sick of my high level of participation in that kind of ceaseless consumer culture and of funding a company with values that don't align with my own. I decided to stop shopping on Amazon So I challenged myself to see how long I could go without the platform, and after a month , the experiment became easier. The rush of not buying was addictive. I'd found adding back in some of the friction to online shopping — whether by deciding the thing wasn't worth the shipping fees or feeling too lazy to walk across my apartment to get my credit card — put the power back in my hands. I started to want for less, and my brain got the space it needed to recalibrate, adding logic back into my purchasing decisions . I'd ask, did I really need it? Could I borrow it? Did we have an alternative at home? With friction, these questions finally had the space to resurface. And I'd started to feel smug, living out my personal values every day by resisting the corporate machine. And then I had another baby. Having my ", "date_str": "2026-10-10T10:41:01+00:00", "hash": "fff3182d2fa79def", "title_fa": "من به مدت 449 روز از خرید در آمازون اجتناب کردم. بچه دار شدن من را به آن بازگرداند، اما اکنون هوشمندانه تر خرید می کنم.", "summary_fa": "این نویسنده پس از به دنیا آمدن فرزند سوم خود دوباره در آمازون خرید کرد. با حسن نیت از کیت براتسکیر، چند سال پیش خودم را به چالش کشیدم تا خرید در آمازون را متوقف کنم. من 449 روز بدون آن رفتم و بیشتر در مورد خریدهایم فکر کردم. با فرزند سومم، دوباره شروع به خرید در آمازون کردم. اما همچنان سعی می کنم در صورت امکان از آن اجتناب کنم. من در سال 2024 72 چیز از آمازون خریدم. طیف وسیعی از اقلام را شامل می شود: یک سبد جایگزین برای سرخ کن هوا، ده ها کتاب برای کودکان، یک مخروط XL برای مراقبت های بعد از جراحی سگم، هدایای تولد بچه ها، محصولات مراقبت از پوست که من از آنها صرف نظر کردم، پستانک برای دوقلوهای تازه متولد شده ام قبل از اینکه به یاد بیاورم مقداری وسایل اضافی را در کیسه پوشک گذاشته بودم، و تعداد زیادی اقلام قابل فراموشی بین کیسه پوشک. در مورد مصرف، ردپای کربن و اینکه چقدر خرید در آمازون برای من تبدیل به طبیعت دوم شده بود، احساس ناراحتی می کردم. من به سایت تکیه کردم تا فوراً موارد موجود در لیست کارهایم را خط بزنم. عدم اصطکاک قبل از خرید به یک مسئله تبدیل شد. احساس می‌کردم که ویژگی «تجهیز با یک کلیک» سایت به نوع مکانیزم خود در شیمی مغز من تبدیل شده است: من بدون انجام هیچ‌یک از تفکرات منطقی که معمولاً در خرید در فروشگاه اتفاق می‌افتد، چیزهایی را سفارش می‌دادم، و می‌دانستم که همه اینها از روی طراحی بود. خرید دیگر اصطکاک نداشت: حمل و نقل رایگان، کارت اعتباری و آدرس ذخیره شده، موجودی بی‌نهایت، و الگوریتمی وسوسه‌انگیز، همگی باعث می‌شوند خرید در هر جای دیگری مانند یک کار طاقت فرسا باشد. وقتی صحبت از آمازون به میان می‌آید، خرید باعث خرید بیشتر می‌شود، و من از"}, {"source": "Business Insider", "title": "Your official guide to cozying up for fall", "link": "https://www.businessinsider.com/bitoday-fall-guide-cozy-clothing-decor-food-2026-10", "summary": "James Andrews/Getty Images This post originally appeared in the BI Today newsletter. You can sign up for Business Insider's daily newsletter here . Your fall starter pack Business Insider has gotten into the colder-weather spirit as the leaves fall off the trees, pumpkins abound, and your work wardrobe suddenly needs to change. And many companies have too — from Starbucks to Amazon to Trader Joe's to Target. It's a smart business strategy as companies seem to have figured out how to increase sales during the traditional lull before the holiday season. \"It gives you another twist around the calendar and a different season to be able to get people engaged,\" Ronald Hill, a professor of marketing at American University's Kogod School of Business, told Business Insider in 2024. If you need inspiration to cozy up to fall, we've got you. Here's your official guide to fall — with suggestions on what to cook, what to wear, what fragrances are in, and what home decor is out. Fall fashion : Stylists told us what items we should ditch from our closets right now. Sorry, ankle boots. Autumn in a bottle: Fall scents are all about woodsy, vanilla, and sandalwood notes. Find your new signature scent . Cozy couches: Seasonal decorations can get pretty tacky pretty fast. One interior designer shared which items to avoid . Sip, sip: We spoke to three bartenders to find out what people are ordering . Turns out, darker days call for darker spirits. Savory treats: Looking for a comforting soup , or maybe a sweet treat ? Our food reporters tested out the best fall bites. Read the original article on Business Insider", "date_str": "2026-10-10T10:40:01+00:00", "hash": "5dafb65c405845da", "title_fa": "راهنمای رسمی شما برای دنج بودن برای پاییز", "summary_fa": "جیمز اندروز/ گتی ایماژ این پست در اصل در خبرنامه BI Today منتشر شد. از اینجا می توانید برای خبرنامه روزانه Business Insider ثبت نام کنید. بسته شروع پاییز شما Business Insider به روح هوای سردتر تبدیل شده است، زیرا برگ ها از درختان می ریزند، کدو تنبل فراوان است و کمد لباس کار شما به طور ناگهانی باید تغییر کند. و بسیاری از شرکت‌ها نیز چنین کرده‌اند - از استارباکس گرفته تا آمازون، تارگت تارگت. این یک استراتژی تجاری هوشمندانه است زیرا به نظر می رسد شرکت ها متوجه شده اند که چگونه فروش خود را در خلال آرامش سنتی قبل از فصل تعطیلات افزایش دهند. رونالد هیل، استاد بازاریابی در دانشکده بازرگانی کوگود دانشگاه آمریکایی، در سال 2024 به Business Insider گفت: «این به شما یک چرخش دیگر در تقویم و یک فصل متفاوت می دهد تا بتوانید افراد را درگیر کنید. در اینجا راهنمای رسمی شما برای پاییز است - با پیشنهاداتی در مورد اینکه چه چیزی بپزید، چه چیزی بپوشید، چه عطرهایی در آن وجود دارد، و چه دکوراسیونی در خانه وجود دارد. مد پاییزی: استایلیست ها به ما گفتند در حال حاضر چه وسایلی را باید از کمد خود حذف کنیم. با عرض پوزش، نیم بوت. پاییز در یک بطری: رایحه های پاییزی در مورد نت های چوبی، وانیل و چوب صندل هستند. عطر جدید خود را پیدا کنید. کاناپه‌های دنج: تزئینات فصلی می‌توانند خیلی زود گیر کنند. یکی از طراحان داخلی به اشتراک گذاشت که از چه مواردی باید اجتناب کرد. جرعه جرعه: ما با سه بارمن صحبت کردیم تا بفهمیم مردم چه چیزی سفارش می دهند. به نظر می رسد، روزهای تاریک تر به ارواح تاریک تر نیاز دارند. خوراکی های خوش طعم: به دنبال یک سوپ آرامش بخش، یا شاید یک خوراکی شیرین هستید؟ خبرنگاران مواد غذایی ما بهترین لقمه های پاییزی"}, {"source": "Business Insider", "title": "Ari Emanuel says Elon Musk’s AI prediction to him helped inspire his live events business", "link": "https://www.businessinsider.com/ari-emanuel-elon-musk-ai-prediction-inspired-live-events-business-2026-10", "summary": "Ari Emanuel is the real-life inspiration for Ari Gold in HBO s Entourage. Chris Unger/Zuffa LLC Ari Emanuel said Elon Musk's early AI insights helped inspire his push into the live events business. Emanuel said Musk told him live entertainment could not be \"disintermediated\" by AI. The Hollywood powerbroker launched Mari, a live events and experiences company, last year. Hollywood powerbroker Ari Emanuel said a conversation he had years ago with Elon Musk about artificial intelligence helped inspire his push into the live events business. Speaking on a recent episode of David Senra's podcast, Emanuel said he first connected with the Tesla CEO after reading about his electric car venture. Emanuel said he called Musk, despite not knowing him, and the two developed what Emanuel described as an \"incredible relationship.\" \"I don't agree with him all the time. I do agree with him. I learn a ton. I disagree a ton,\" Emanuel, the super agent-turned-entertainment-mogul who is the real-life inspiration for Ari Gold in the HBO TV series \"Entourage,\" told Senra. A major takeaway from Musk, Emanuel said, was his early view of where AI was headed. \"He was talking about AI in 2007, what it was going to be,\" said Emanuel. \"He said the only thing that can't be disintermediated by AI is live, in the entertainment business,\" Emanuel told Senra of Musk, adding that he specifically asked Musk about entertainment. That's what Emanuel said gave him the idea behind Mari, the live events and experiences company he launched last year. \"We're now building a pretty big business\" in the live entertainment space, Emanuel said, adding that his company has acquired the Miami Open and the Madrid Open tennis tournaments, along with the trading card convention, Collect-A-Con. Emanuel — who also leads TKO Group Holdings , the parent company of WWE and UFC — said Mari \"will be everything live events on a global basis.\" Read the original article on Business Insider", "date_str": "2026-10-10T10:21:01+00:00", "hash": "337bdb760bc1f430", "title_fa": "آری امانوئل می‌گوید پیش‌بینی هوش مصنوعی ایلان ماسک به او به الهام بخشیدن به تجارت رویدادهای زنده او کمک کرد", "summary_fa": "آری امانوئل الهام بخش واقعی آری گلد در شبکه HBO s Entourage است. کریس آنگر/زوفا LLC آری امانوئل گفت که بینش‌های اولیه هوش مصنوعی ایلان ماسک به الهام بخشیدن به او در تجارت رویدادهای زنده کمک کرد. امانوئل گفت ماسک به او گفته است که سرگرمی‌های زنده نمی‌توانند توسط هوش مصنوعی «محلول» شوند. این قدرتمند هالیوود سال گذشته ماری، یک شرکت رویدادهای زنده و تجربیات را راه اندازی کرد. آری امانوئل، کارگزار قدرتمند هالیوود، گفت که گفت‌وگویی که سال‌ها پیش با ایلان ماسک درباره هوش مصنوعی داشت، به او کمک کرد تا به تجارت رویدادهای زنده الهام بخشد. امانوئل در یکی از قسمت‌های اخیر پادکست دیوید سنرا، گفت که اولین بار پس از مطالعه در مورد سرمایه‌گذاری خودروی الکتریکی با مدیرعامل تسلا ارتباط برقرار کرده است. امانوئل گفت که با وجود اینکه ماسک را نمی‌شناخت با او تماس گرفت و آن دو رابطه‌ای باورنکردنی ایجاد کردند. \"من همیشه با او موافق نیستم. من با او موافقم من یک تن یاد میگیرم من خیلی موافق نیستم.\" امانوئل، ابر مامور تبدیل به غول سرگرمی که الهام بخش واقعی آری گلد در سریال تلویزیونی HBO \"Entourage\" است، به سنرا گفت. امانوئل گفت، نکته مهم ماسک، دیدگاه اولیه او از اینکه هوش مصنوعی به کجا می رود، بود. امانوئل به Senra of Musk گفت: «او گفت که تنها چیزی که نمی‌توان هوش مصنوعی آن را از بین برد، زنده بودن، در تجارت سرگرمی است. این همان چیزی است که امانوئل گفت، ایده ماری، شرکت رویدادهای زنده و تجربیاتی را که او سال گذشته راه اندازی کرد، به او داد. امانوئل گفت: \"اکنون در حال ساختن یک تجارت بزرگ\" در فضای سرگرمی زنده هستیم، و افزود که شرکت او مسابقات تنیس اوپن میامی و اوپن مادرید را به همراه کنوانسیون کارت معاملاتی، Collect-A-Con، تصاحب کرده است. امانوئل - که همچنین رهبری TKO Group Holdings، شرکت"}, {"source": "Business Insider", "title": "Gen Alpha founders are already pitching VCs. Here's what investors want them to know.", "link": "https://www.businessinsider.com/vc-investor-advice-for-gen-alpha-founders-2026-10", "summary": "Venture capitalists Claire Zau, Jake Jolis, and Sarah Catanzaro gave their advice for Gen Alpha. Lightspeed; Zeno; Amplify Five venture capitalists told Business Insider their tips for Gen Alpha founders. Some older members of Gen Alpha, who are up to age 16, are already pitching to VCs. The VCs discussed AI, social media, and college. There's a new generation of founders on the rise — and they're not old enough to vote. Generation Alpha was born between 2010 and 2024, making the oldest members 16 years old. That's the age Stripe's John Collison cofounded his first company, and when Mike Kittredge set the stage for Yankee Candle. Let's face it: Gen Alpha founders are coming in hot. Many VCs have already been pitched by them; others will be soon. \"What I've noticed about Gen Alpha is they seem to have a ton of hustle,\" said Sarah Catanzaro, a general partner at Amplify. \"They tend to have an advantage in markets where execution may be more important than experience.\" Business Insider asked five venture capitalists to share their advice for Gen Alpha entrepreneurs. They spoke about AI, social media — and that pesky college question. The ChatGPT generation When ChatGPT premiered in 2022, the oldest of Gen Alpha were 12. Gen Alpha has had AI tools since middle school, if not earlier. They've used AI to write their essays and cheat on tests. They've also used it to build new products. Catanzaro thinks critical thinking could take a hit. She's seen it in Gen Z already: they grew up with the internet and could look up answers to their problems rather than thinking them through. \"I worry a little bit about that type of cognitive offloading for Gen Alpha,\" she said. It's too early to know exactly how, or even if, AI will change our thinking patterns. Researchers told Business Insider they observed alarming patterns while studying how humans solve math equations and write essays. On the other hand, Catanzaro said Gen Alpha might be able to wield AI more effectively, precisely because they grew up with it. Zeno partner Jake Jolis agrees: the barriers to entry have never been lower, and Gen Alpha will know how to climb them. \"You don't have to raise a trillion dollars to build your own superintelligence,\" Jolis said. \"You can rent it for 20 bucks a month.\" To college or not to college Before his VC days, Jolis dropped out of Stanford to found his first company. He knows young founders are itching to drop out of college or forgo it altogether. Jolis had built his produ", "date_str": "2026-10-10T10:12:01+00:00", "hash": "99c679a5b2040241", "title_fa": "بنیانگذاران Gen Alpha در حال حاضر VC ها را ارائه کرده اند. در اینجا چیزی است که سرمایه گذاران می خواهند آنها بدانند.", "summary_fa": "سرمایه گذاران خطرپذیر، کلر زائو، جیک جولیس و سارا کاتانزارو توصیه های خود را برای ژنرال آلفا ارائه کردند. سرعت نور؛ زنو؛ سرمایه گذاران خطرپذیر Amplify Five نکات خود را برای بنیانگذاران Gen Alpha به Business Insider گفتند. برخی از اعضای قدیمی Gen Alpha، که تا 16 سال سن دارند، در حال حاضر در VC ها شرکت می کنند. VC ها در مورد هوش مصنوعی، رسانه های اجتماعی و کالج بحث کردند. نسل جدیدی از بنیانگذاران در حال افزایش هستند - و آنها به اندازه کافی برای رای دادن نیستند. نسل آلفا بین سال های 2010 تا 2024 متولد شد و مسن ترین اعضای آن 16 سال سن داشتند. این همان سنی است که جان کولیسون از استرایپ اولین شرکت خود را تأسیس کرد و زمانی که مایک کیترج صحنه را برای Yankee Candle آماده کرد. بیایید با آن روبرو شویم: بنیانگذاران Gen Alpha در حال آمدن هستند. بسیاری از VCها قبلاً توسط آنها ارائه شده است. دیگران به زودی خواهند بود سارا کاتانزارو، یک شریک عمومی در آمپلفای، می‌گوید: «چیزی که من در مورد Gen Alpha متوجه شدم این است که به نظر می‌رسد آن‌ها شلوغی زیادی دارند. آنها در بازارهایی که ممکن است اجرا مهمتر از تجربه باشد، مزیت دارند.\" Business Insider از پنج سرمایه گذار خواست تا توصیه های خود را برای کارآفرینان Gen Alpha به اشتراک بگذارند. آنها در مورد هوش مصنوعی، رسانه های اجتماعی - و آن سوال مزاحم دانشگاه صحبت کردند. نسل ChatGPT هنگامی که ChatGPT در سال 2022 به نمایش درآمد، قدیمی ترین Gen Alpha 12 ساله بود. Gen Alpha از دوران راهنمایی، اگر نه زودتر، ابزارهای هوش مصنوعی داشته است. آنها از هوش مصنوعی برای نوشتن مقالات خود و تقلب در آزمون ها استفاده کرده اند. آنها همچنین از آن برای ساخت محصولات جدید استفاده کرده اند. کاتانزارو فکر می کند که"}, {"source": "Business Insider", "title": "Why am I so mean to my AI?", "link": "https://www.businessinsider.com/does-being-mean-ai-chatbots-make-me-bad-person-2026-10", "summary": "I find myself channeling my inner Gordon Ramsay when talking to my AI. FOX Image Collection via Getty Images I'm often very rude to AI chatbots — especially when they get things wrong. Anthropic, meanwhile, is banning \"sustained and needless abusive or cruel behavior\" to Claude. Am I going to be the first on the list of who AI kills first when it reaches AGI? Oops! Anthropic is banning \"sustained and needless abusive or cruel behavior\" to its AI models. Uh oh. This is bad news for me, a person who is frequently very mean to AI chatbots. Anthropic says the rule is for \"extreme cases, where users repeatedly act cruelly toward our models, with no discernible purpose.\" Voicing frustration or pushback is still par for the course, according to the new rules . It's not clear what would constitute these extreme cases (I think I'm afraid to know?), but I hope that my general rudeness to chatbots isn't quite that extreme. Maybe? I hope? I often find myself being really nasty — short-tempered, insulting, dismissive — toward LLMs like ChatGPT or Claude. Whenever they get something wrong (which is often), I berate them for wasting my time and doing poorly. When I've asked ChatGPT for matters of taste, like brainstorming ideas, I generally find the ideas corny and lame — feedback I immediately relay with no compliment sandwich. When Muse couldn t do a task, I snapped You failed me. Not cruel exactly, but I d never talk to a real person like that. Katie Notopoulos / Business Insider It's not that I'm sadistically torturing AI, per se, more that I treat it like I'm a mean boss — a Miranda Priestly or Gordon Ramsay screaming at a chef about undercooked chicken. I once said to Muse, \"you have failed me.\" This isn't at all how I act in real life. I like to think I'm a nice person (although I think that's probably impossible to self-assess), but I rarely ever yell or insult people. I am generally pretty conflict-avoidant: I don't really get into arguments with friends, and I feel pretty certain I'm not rude to strangers. I worked for a long time in customer service, so I try to go out of my way and be polite and cheerful to the (real) humans on the other end of a call center line or chat. But with an AI chatbot? All that flies out the window. I'm not totally sure why. I suppose the obvious thing is \"AI isn't a person,\" and in my use of chatbots over the last few years, I have never felt for a second that it was anything close to personhood. As much as I try to empathize with ", "date_str": "2026-10-10T10:11:01+00:00", "hash": "a094199a28f8942c", "title_fa": "چرا من اینقدر نسبت به هوش مصنوعی خود بد هستم؟", "summary_fa": "وقتی با هوش مصنوعی صحبت می کنم، متوجه می شوم که گوردون رمزی درونی ام را کانالیزه می کنم. مجموعه تصاویر FOX از طریق Getty Images من اغلب با چت ربات‌های هوش مصنوعی بسیار بی‌ادب رفتار می‌کنم - مخصوصاً وقتی که آنها اشتباه می‌کنند. در همین حال، آنتروپیک «رفتار توهین آمیز یا بی رحمانه پایدار و بی مورد» را به کلود ممنوع می کند. آیا من اولین نفر در لیست افرادی هستم که هوش مصنوعی با رسیدن به AGI اولین کسانی را که می کشد؟ اوه! آنتروپیک «رفتار توهین آمیز یا بی رحمانه پایدار و بی مورد» را برای مدل های هوش مصنوعی خود ممنوع کرده است. اوه اوه این یک خبر بد برای من است، فردی که اغلب با چت ربات‌های هوش مصنوعی بسیار بد رفتار می‌کند. آنتروپیک می‌گوید این قانون برای موارد شدید است، که در آن کاربران مکرراً نسبت به مدل‌های ما بی‌رحمانه رفتار می‌کنند، بدون اینکه هدف مشخصی داشته باشند. بر اساس قوانین جدید، ابراز ناامیدی یا پس زدگی همچنان برای دوره یکسان است. مشخص نیست که چه چیزی این موارد شدید را تشکیل می دهد (فکر می کنم می ترسم بدانم؟)، اما امیدوارم که بی ادبی عمومی من با ربات های چت آنقدر افراطی نباشد. شاید؟ امیدوارم؟ من اغلب متوجه می شوم که نسبت به LLM هایی مانند ChatGPT یا Claude بسیار بد - کوتاه مزاج، توهین آمیز، طرد کننده- رفتار می کنم. هر زمان که آنها اشتباهی می‌کنند (که اغلب اتفاق می‌افتد)، من آنها را به خاطر اتلاف وقت و عملکرد بدشان سرزنش می‌کنم. وقتی از ChatGPT در مورد مسائل سلیقه ای، مانند ایده های طوفان فکری پرسیدم، به طور کلی ایده ها را بد و بی رمق می یابم - بازخوردی که من فوراً بدون ساندویچ تعریفی ارسال می کنم. وقتی میوز نتوانست کاری را انجام دهد، تو را شکست دادم. دقیقاً بی"}, {"source": "Business Insider", "title": "Shoppers find AI agents need a short leash — unless you need 20 pounds of chicken wings", "link": "https://www.businessinsider.com/ai-agents-instinct-muse-redefine-personal-shopping-online-2026-10", "summary": "Some shoppers are using AI agents like Instinct and Muse to find and order products for them. Smith Collection/Gado/Getty Images Shoppers are using AI agents like Muse and Instinct to buy stuff online. Three users said they're using the agents to monitor flight prices and order groceries. They also pointed to kinks, such as misunderstandings and paying securely. AI agents like Instinct and Muse are quickly becoming personal shoppers — and some are finding the tools need to be kept on a short leash. From finding cheap airline tickets to ordering groceries, three shoppers told Business Insider that they are using the agents to automate parts of their shopping. Some say the decision has saved them time and found them deals they would not have found on their own. But even those impressed with AI agents as shopping assistants say they're using them carefully. Sometimes, the agents order the wrong thing. In other cases, users say they want to make the purchase themselves, or at least add another layer of security, rather than handing their credit card information directly to AI. The shoppers' experiences also point to a big question as the holiday shopping season approaches: How much can shoppers delegate, if they want to at all, to AI agents? Plane tickets, ballet shoes, and 20 pounds of chicken wings Austin Welch, who works in finance in Houston, said that he's used Instinct for several kinds of purchases since getting an invite to use the AI agent in late August. Welch said that he's fed the agent a list of 10 flights that he needs to take over the next six months, asked it to monitor prices, and ping him when it thinks they're cheapest. Instinct also found him a referral code for a United Airlines-branded credit card with a bigger mile bonus than he could find elsewhere, he said. He also texts Instinct to order groceries for him, something that has become \"really, really useful in my life,\" he said. The agent has made mistakes. Once, he asked Instinct to order chicken wings and drumsticks so that he could make dinner for himself and his partner. He didn't specify the amount, but expected a small pack. Later, 20 pounds of chicken wings showed up on his doorstep — an order that Instinct had executed. Welch suspects that Instinct saw some larger grocery purchases in his past and inferred that he wanted a similar quantity. \"We were shamelessly eating chicken wings for about five or six days straight for every meal,\" he said. Loni Stark, vice president of strateg", "date_str": "2026-10-10T10:07:01+00:00", "hash": "99c406107b42cad1", "title_fa": "خریداران متوجه می شوند که عوامل هوش مصنوعی به یک بند کوتاه نیاز دارند - مگر اینکه به 20 پوند بال مرغ نیاز داشته باشید.", "summary_fa": "برخی از خریداران از عوامل هوش مصنوعی مانند Instinct و Muse برای پیدا کردن و سفارش محصولات برای آنها استفاده می کنند. Smith Collection/Gado/Getty Images خریداران از عوامل هوش مصنوعی مانند Muse و Instinct برای خرید آنلاین کالاها استفاده می کنند. سه کاربر گفتند که از این نمایندگی ها برای نظارت بر قیمت پروازها و سفارش خواربار استفاده می کنند. آنها همچنین به پیچیدگی هایی مانند سوء تفاهم و پرداخت مطمئن اشاره کردند. عوامل هوش مصنوعی مانند Instinct و Muse به سرعت در حال تبدیل شدن به خریداران شخصی هستند - و برخی متوجه می شوند که ابزارها باید روی یک افسار کوتاه نگه داشته شوند. سه خریدار به Business Insider گفتند از پیدا کردن بلیط هواپیما ارزان تا سفارش مواد غذایی، از این نمایندگی ها برای خودکارسازی بخش هایی از خرید خود استفاده می کنند. برخی می گویند این تصمیم باعث صرفه جویی در وقت آنها شده و معاملاتی را برای آنها پیدا کرده است که به تنهایی نمی توانستند پیدا کنند. اما حتی آنهایی که تحت تأثیر عوامل هوش مصنوعی به عنوان دستیار خرید قرار گرفته اند، می گویند که با دقت از آنها استفاده می کنند. گاهی اوقات، ماموران دستور اشتباه می دهند. در موارد دیگر، کاربران می‌گویند که می‌خواهند خودشان خرید کنند، یا حداقل یک لایه امنیتی دیگر را اضافه کنند، نه اینکه اطلاعات کارت اعتباری خود را مستقیماً به هوش مصنوعی بدهند. تجارب خریداران همچنین به یک سوال بزرگ با نزدیک شدن به فصل خرید تعطیلات اشاره می کند: خریداران، اگر اصلاً بخواهند، چقدر می توانند به نمایندگان هوش مصنوعی تفویض کنند؟ بلیط هواپیما، کفش باله و 20 پوند بال مرغ آستین ولش، که در امور مالی در هیوستون کار می کند، گفت که از زمان دریافت دعوتنامه برای استفاده از عامل هوش مصنوعی در اواخر آگوست، از Instinct برای چندین نوع خرید استفاده کرده"}, {"source": "Business Insider", "title": "Police picked him up at 10 for walking home alone. At 21, he says free-range parenting gave him freedom.", "link": "https://www.businessinsider.com/free-range-parenting-child-walking-home-police-2026-10", "summary": "In 2015, Danielle Meitiv (left) let her son Rafi (right) walk home alone with his sister, Dvora. The kids were stopped by the police, and the family was investigated by CPS. Caroline Gutman for BI Bundled in heavy coats, hats, scarves, and mittens, Rafi Meitiv and his little sister Dvora had just spent a sunny Saturday afternoon in December 2014 playing at a local playground in suburban Maryland. After an hour, the 10- and 6-year-olds began their trek home , about three-quarters of a mile. While it was their first time walking from that particular park to their house alone, they'd traced the same route in Silver Spring dozens of times with their parents and had also ventured off alone to other playgrounds in the area before. About halfway through their journey, they were stopped by three police officers, who instructed them to get in their car so they could drive them home and speak to their parents. Rafi and Dvora were confused. \"At this point, we knew how to obviously use crosswalks, walk the street safely,\" Rafi, now 21, told Business Insider in his first time speaking out about this incident in over a decade. \"We had our parents' phone numbers. We knew how to take care of ourselves.\" The incident led to a six-month investigation into potential child neglect by Child Protective Services , followed by another, more harrowing run-in with CPS and the police. Rafi and Dvora's parents, Alexander and Danielle Meitiv, fought back, appearing on TV news programs, including \"Today\" and \"Good Morning America.\" They were eventually cleared of \"unsubstantiated child abuse or neglect\" — a legal limbo meaning that CPS could neither find enough evidence to prove nor fully rule out neglect — in June 2015. The Maryland Department of Human Services told Business Insider in a comment that it's \"committed to transparency and being as open as possible while maintaining the confidentiality of children and their families, as protected by law.\" Alexander Meitiv, right, prepares dinner with Rafi (left) and Dvora (center) in 2015. Bonnie Jo Mount/The Washington Post via Getty Images The Meitivs' story isn't unique. In August 2026, Karyann Parkinson , a mom of five from Virginia, was convicted of \"contributing to the delinquency of a minor\" after allowing her 5-year-old son to walk half a mile alone within their gated community. It earned her a six-month prison sentence, which was immediately suspended, and landed her on the state's child abuse and neglect registry for seven years", "date_str": "2026-10-10T10:03:01+00:00", "hash": "8007a81420c10acb", "title_fa": "پلیس او را در ساعت 10 به دلیل پیاده روی به خانه به تنهایی دستگیر کرد. در 21 سالگی، او می گوید که فرزندپروری آزاد به او آزادی داد.", "summary_fa": "در سال 2015، دانیل میتیو (سمت چپ) به پسرش رافی (راست) اجازه داد تا با خواهرش، دورا، تنها به خانه برود. بچه ها توسط پلیس متوقف شدند و خانواده توسط CPS مورد بررسی قرار گرفتند. کارولین گاتمن برای BI با کت‌های سنگین، کلاه، روسری و دستکش، رافی میتیو و خواهر کوچکش دورا، به تازگی یک بعد از ظهر شنبه آفتابی را در دسامبر 2014 به بازی در یک زمین بازی محلی در حومه مریلند سپری کرده بودند. پس از یک ساعت، کودکان 10 و 6 ساله راهپیمایی خود را به خانه آغاز کردند، حدود سه چهارم مایل. در حالی که اولین باری بود که از آن پارک خاص به تنهایی به خانه‌شان راه می‌رفتند، آن‌ها ده‌ها بار با والدینشان همان مسیر را در سیلور اسپرینگ دنبال کرده بودند و قبلاً نیز به تنهایی به زمین‌های بازی دیگر در منطقه رفته بودند. تقریباً در نیمه راه، آنها توسط سه افسر پلیس متوقف شدند و آنها به آنها دستور دادند که سوار ماشینشان شوند تا بتوانند آنها را به خانه برانند و با والدینشان صحبت کنند. رافی و دوورا گیج شده بودند. رفیع که اکنون 21 ساله است، در اولین باری که در بیش از یک دهه اخیر درباره این حادثه صحبت می‌کند، به Business Insider گفت: «در این مرحله، ما می‌دانستیم چگونه از عابر پیاده استفاده کنیم، با خیال راحت در خیابان راه برویم. ما شماره تلفن پدر و مادرمان را داشتیم. می‌دانستیم چگونه از خود مراقبت کنیم.» این حادثه منجر به یک تحقیق شش ماهه در مورد بی‌توجهی احتمالی کودک توسط خدمات حفاظت از کودکان شد و به دنبال آن برخورد دلخراش دیگری با CPS و پلیس انجام شد. پدر و مادر رافی و دورا، الکساندر و دانیل میتیو، با حضور در برنامه های خبری تلویزیونی، از جمله \"امروز\" و \"صبح بخیر آمریکا\"، به مبارزه پرداختند. آنها در نهایت از"}, {"source": "Business Insider", "title": "Cutting 1 compound from processed foods could reduce brain fog, anxiety, and chronic pain, scientists say.", "link": "https://www.businessinsider.com/low-glutamate-diet-chronic-pain-brain-fog-anxiety-2026-10", "summary": "Kathleen Holton studies the link between diet and neurological changes, searching for strategies to use food in optimizing brain health. Jeff Watts/Jeff Watts A dietary change may help relieve complex symptoms like brain fog and chronic pain, studies suggest. Glutamate, a compound in processed foods, can overexcite nerve cells, causing damage in sensitive brains. In new research, Gulf War veterans reported that cutting out glutamate relieved pain, PTSD, and more. US Navy Chaplain Deb Mariya had been struggling with PTSD and fibromyalgia for decades, unable to find relief despite trying every treatment she could find, from medication to acupuncture. Then a new diet changed her life, she told Business Insider. Maryia said that she had developed escalating symptoms after deploying to Kuwait in 1991's Operation Desert Storm, amid black clouds of burning oil and debris-laden sandstorms. In the more than 30 years since, persistent brain fog has prevented Maryia from thinking clearly. An autoimmune condition attacked her bones and joints, leaving her in need of hip replacement surgery, but unable to heal properly afterward, causing life-threatening complications. Then in 2024, Maryia enrolled in an experimental clinical trial for veterans. The goal: to test whether cutting out a compound common in processed foods could alleviate symptoms of a mysterious condition known as Gulf War Illness. The syndrome is a collection of neurological issues like joint problems, severe fatigue, and mood disturbances. After living on a low-glutamate diet for a month, Mariya was scheduled for another surgery. This time, she said, she healed rapidly and was walking within weeks. She said that her brain fog lifted, and she regained the energy to complete her physical therapy sessions. \"I couldn't believe it,\" Mariya said. \"It was like an answer from God.\" Hundreds of veterans like Mariya have tried the diet program since 2020, led by Kathleen Holton at American University in Washington, DC. As many as 80% of them see improvements after following the diet, according to both their self-reports as well as data collected by Holton's team: less chronic pain, fewer symptoms of depression, anxiety, and PTSD, and sharper cognitive function . \"The people who go onto this diet usually don't come off it due to how much better they feel,\" Holton, a nutritional neuroscientist, told Business Insider. Her research suggests that reducing glutamate may help prevent nerve cell damage, offering a promis", "date_str": "2026-10-10T09:43:02+00:00", "hash": "710072d03b99edf4", "title_fa": "دانشمندان می گویند که قطع یک ترکیب از غذاهای فرآوری شده می تواند مه مغزی، اضطراب و درد مزمن را کاهش دهد.", "summary_fa": "کاتلین هولتون ارتباط بین رژیم غذایی و تغییرات عصبی را مطالعه می کند و به دنبال راهبردهایی برای استفاده از غذا در بهینه سازی سلامت مغز است. جف واتس/ جف واتس مطالعات نشان می دهد که تغییر رژیم غذایی ممکن است به تسکین علائم پیچیده ای مانند مه مغزی و درد مزمن کمک کند. گلوتامات، ترکیبی در غذاهای فرآوری شده، می تواند سلول های عصبی را بیش از حد تحریک کند و باعث آسیب به مغزهای حساس شود. در تحقیقات جدید، کهنه سربازان جنگ خلیج فارس گزارش دادند که قطع کردن گلوتامات باعث تسکین درد، PTSD و غیره می شود. کشیش نیروی دریایی ایالات متحده، دب ماریا، برای چندین دهه با PTSD و فیبرومیالژیا دست و پنجه نرم می کرد و علیرغم تلاش برای هر درمانی که پیدا می کرد، از دارو گرفته تا طب سوزنی، نمی توانست تسکین یابد. او به Business Insider گفت، سپس یک رژیم غذایی جدید زندگی او را تغییر داد. ماریا گفت که او پس از اعزام به کویت در عملیات طوفان صحرا در سال 1991، در میان ابرهای سیاه نفت سوز و طوفان های شن مملو از زباله، علائم تشدید کننده ای پیدا کرد. در بیش از 30 سال از آن زمان، مه مداوم مغز ماریا را از تفکر واضح باز داشته است. یک بیماری خودایمنی به استخوان ها و مفاصل او حمله کرد و باعث شد که او نیاز به جراحی تعویض مفصل ران داشته باشد، اما پس از آن نتوانست به درستی بهبود یابد و باعث عوارض تهدید کننده زندگی شود. سپس در سال 2024، ماریا در یک آزمایش بالینی تجربی برای جانبازان ثبت نام کرد. هدف: آزمایش اینکه آیا قطع کردن یک ترکیب رایج در غذاهای فرآوری شده می تواند علائم یک بیماری مرموز به نام بیماری جنگ خلیج فارس را کاهش دهد یا خیر. این سندرم مجموعه ای از مسائل"}, {"source": "Business Insider", "title": "How would the $70,000 fee on international students working in the US impact schools and grads? 2 lawyers break it down.", "link": "https://www.businessinsider.com/international-students-working-usa-new-fee-impact-explainer-2026-10", "summary": "Lawyers said the proposed rule could impact international students, employers, and American students. Moyo Studio/Getty Images US universities are one of the latest targets in Trump's immigration policy overhaul. The DHS wants to charge schools a $70,000 fee so international students can get work authorization. Two lawyers broke down what parties the rule could affect beyond universities. The Trump administration's latest immigration policies are hitting American universities . On Wednesday, the Department of Homeland Security proposed a new rule that would require schools to pay a $70,000 fee to enable international students to work in the US on a type of student work authorization called Optional Practical Training. The department is also proposing an additional $30,000 fee for any subsequent OPT periods. An ICE spokesperson told Business Insider the proposal is designed to strengthen program oversight and address concerns of fraud and abuse in the program. The Trump administration has made a slew of changes in the past 12 months in an effort to reshape legal immigration processes. Those include changes to the H-1B process, which Business Insider has been covering in our ongoing H-1B Fallout series , and changes that impact how long students on F-1 visas will initially be admitted to stay in the US. This week's OPT proposal came one day before the administration announced it was suspending tech companies, including Microsoft , from a program used to sponsor foreign workers for permanent residency. Business Insider spoke to two attorneys who broke down the answers to three important questions about what this proposed rule could mean if it goes into effect, and how international students should be responding now. Who stands to be impacted by the $70,000 fee? The proposed rule places an added burden on universities at a time when many are already facing financial pressures, said Hector Chichoni, a partner at the business law firm Greenspoon Marder. But this burden could be handed down from the universities to other parties, he said, since it states that schools \"may pass the financial obligation of this proposed fee onto F-1 nonimmigrant students, all students, or employers.\" Aaron Blumberg, a partner at the immigration law firm Fragomen, said this could make OPT financially inaccessible for many international students who are asked to fork out the cash. In turn, this risks \"limiting opportunities for international students to gain valuable U.S. work experi", "date_str": "2026-10-10T09:37:01+00:00", "hash": "466a324c6cdac838", "title_fa": "هزینه 70000 دلاری دانشجویان بین المللی شاغل در ایالات متحده چگونه بر مدارس و فارغ التحصیلان ایالات متحده تأثیر می گذارد؟ 2 وکیل آن را خراب می کنند.", "summary_fa": "وکلا گفتند که قانون پیشنهادی می تواند بر دانشجویان بین المللی، کارفرمایان و دانشجویان آمریکایی تأثیر بگذارد. Moyo Studio/Getty Images دانشگاه های ایالات متحده یکی از آخرین اهداف در بازنگری سیاست های مهاجرتی ترامپ هستند. DHS می خواهد 70000 دلار هزینه از مدارس دریافت کند تا دانش آموزان بین المللی بتوانند مجوز کار دریافت کنند. دو وکیل اعلام کردند که این قانون چه احزابی را فراتر از دانشگاه ها می تواند تحت تأثیر قرار دهد. آخرین سیاست‌های مهاجرتی دولت ترامپ بر دانشگاه‌های آمریکا ضربه می‌زند. روز چهارشنبه، وزارت امنیت داخلی قانون جدیدی را پیشنهاد کرد که بر اساس آن مدارس باید هزینه ای 70000 دلاری بپردازند تا دانشجویان بین المللی بتوانند در ایالات متحده با مجوز کار دانشجویی به نام آموزش عملی اختیاری کار کنند. این بخش همچنین هزینه 30000 دلار اضافی را برای هر دوره OPT بعدی پیشنهاد می کند. یکی از سخنگویان ICE به Business Insider گفت این پیشنهاد برای تقویت نظارت بر برنامه و رسیدگی به نگرانی های مربوط به تقلب و سوء استفاده در برنامه طراحی شده است. دولت ترامپ در 12 ماه گذشته تغییرات زیادی در تلاش برای تغییر شکل فرآیندهای قانونی مهاجرت ایجاد کرده است. این تغییرات شامل تغییراتی در فرآیند H-1B است که Business Insider در سری H-1B Fallout در حال انجام ما پوشش داده است، و تغییراتی که بر مدت زمانی که دانشجویان ویزای F-1 در ابتدا برای اقامت در ایالات متحده پذیرفته می‌شوند، تأثیر می‌گذارد. پیشنهاد OPT این هفته یک روز قبل از اینکه دولت اعلام کرد شرکت های فناوری از جمله مایکروسافت را از برنامه ای که برای حمایت از کارگران خارجی برای اقامت دائم استفاده می شود، تعلیق می کند. Business Insider با دو وکیل صحبت کرد که پاسخ‌های سه سوال مهم را در مورد اینکه این قانون پیشنهادی در صورت اجرایی شدن چه معنایی می‌تواند داشته باشد و"}, {"source": "Business Insider", "title": "Elon Musk says SpaceX could one day be worth vastly more than Earth's economy. Here's what that would take.", "link": "https://www.businessinsider.com/elon-musk-spacex-stock-valuation-global-economy-space-travel-vision-2026-10", "summary": "Elon Musk is known for making outlandish predictions. Chip Somodevilla/Getty Images Elon Musk says SpaceX could be worth \"orders of magnitude\" more than the entire global economy. That implies a $12 quadrillion-plus valuation, or roughly 5,500 times SpaceX's current market cap. One analyst called the post \"classic Musk hype and theatre,\" and others flagged the costs involved. Elon Musk is known for having planet-sized ambitions , and his latest pronouncement lives up to that billing. \"This will sound super crazy, but I see a path to SpaceX being worth orders of magnitude more than the current Earth economy,\" the Tesla and SpaceX CEO wrote in a Thursday post on X. The International Monetary Fund projected in April that the total value of world output, measured at market exchange rates, would hit $126 trillion this year. SpaceX had a $2.2 trillion market capitalization at Thursday's close, meaning the global economy is worth roughly 57 times more. Musk's vision of SpaceX becoming at least two orders of magnitude — 100 times — more valuable suggests it will one day have a market cap in excess of $12 quadrillion. All else being equal, SpaceX's stock price would have to rise 5,500-fold to achieve that valuation, meaning $1,000 invested today would skyrocket in value to $5.5 million. This will sound super crazy, but I see a path to SpaceX being worth orders of magnitude more than the current Earth economy — Elon Musk (@elonmusk) October 8, 2026 Musk elaborated on his statement in a Friday post. \"'Seeing a path' is not a statement of extreme confidence that we will achieve that outcome,\" he wrote. \"Just means that I believe there is such a path and the probability of achieving it is not zero.\" SpaceX's revenue amounted to $7.8 billion in the second quarter , up 92% from the same period last year. The maker of rockets, spacecraft, and satellites recorded a $541 million net loss, down from $1 billion 12 months earlier. Musk told Wall Street analysts in August that SpaceX was internally projecting $1 trillion of revenue in 2030, and there was a \"non-zero chance\" it could reach that milestone in 2029. But even if the company hits that mark, then grows revenue 100-fold from there to $100 trillion, that would still be less than 1% of the minimum company valuation Musk envisions. \"I guess his idea is that SpaceX will open up new colonies or human civilizations beyond the Earth, and thus tap into minerals, energy, and growth beyond what we are capable of with the finite ", "date_str": "2026-10-10T09:34:01+00:00", "hash": "bc5e3e4a0ed36ff7", "title_fa": "ایلان ماسک می گوید SpaceX روزی می تواند بسیار بیشتر از اقتصاد زمین ارزش داشته باشد. این چیزی است که طول می کشد.", "summary_fa": "ایلان ماسک به پیش بینی های عجیب و غریب معروف است. تراشه Somodevilla/Getty Images ایلان ماسک می‌گوید SpaceX می‌تواند ارزشی بالاتر از کل اقتصاد جهانی داشته باشد. این به معنای ارزش گذاری 12 کوادریلیون دلاری یا تقریباً 5500 برابر ارزش بازار فعلی اسپیس ایکس است. یکی از تحلیلگران این پست را «هیاهو و تئاتر کلاسیک ماسک» نامید و دیگران هزینه های مربوط به آن را مشخص کردند. ایلان ماسک به خاطر داشتن جاه‌طلبی‌هایی به اندازه یک سیاره شناخته می‌شود و آخرین اظهارات او مطابق با آن است. مدیرعامل تسلا و اسپیس ایکس در پست پنجشنبه خود در X نوشت: \"این فوق العاده دیوانه کننده به نظر می رسد، اما من می بینم که مسیری به سوی اسپیس ایکس که ارزش بیشتری از اقتصاد زمین فعلی دارد.\" اسپیس ایکس در پایان روز پنج‌شنبه ارزش بازار ۲.۲ تریلیون دلاری داشت، یعنی ارزش اقتصاد جهانی تقریباً ۵۷ برابر بیشتر است. چشم انداز ماسک مبنی بر اینکه اسپیس ایکس حداقل دو مرتبه - 100 برابر - ارزشمندتر می شود، نشان می دهد که روزی ارزش بازاری بیش از 12 کوادریلیون دلار خواهد داشت. در صورت مساوی بودن، قیمت سهام اسپیس ایکس باید 5500 برابر افزایش یابد تا به این ارزش برسد، به این معنی که 1000 دلار سرمایه گذاری امروز به ارزش 5.5 میلیون دلار افزایش می یابد. این فوق العاده دیوانه کننده به نظر می رسد، اما من می بینم که مسیری به سوی SpaceX ارزشی بالاتر از اقتصاد زمین فعلی دارد - ایلان ماسک (@elonmusk) 8 اکتبر 2026 ماسک در یک پست جمعه بیانیه خود را توضیح داد. او نوشت: \"دیدن یک مسیر\" بیانیه ای مبنی بر اطمینان شدید از دستیابی به آن نتیجه نیست.\" فقط به این معناست که من معتقدم چنین مسیری وجود دارد و احتمال دستیابی به آن صفر نیست.» درآمد اسپیس ایکس در سه ماهه دوم به 7.8"}, {"source": "Business Insider", "title": "My kids came first. At 50, I finally went to law school.", "link": "https://www.businessinsider.com/career-on-hold-for-kids-law-school-at-50-2026-10", "summary": "Nancy Vinsel wanted to be a lawyer, but raising her kids came first. Sean Vinsel Nancy Vinsel put off going to law school until after raising her children. Vinsel passed the bar on her first try at 53 and landed her dream legal job at a state agency at 64. She said she now tells people to consider the law as a second career. This as-told-to essay is based on a conversation with Nancy Vinsel, a retired lawyer in Florida. Business Insider has verified her identity and background. This story has been edited for length and clarity. I got married after my sophomore year of college, and my husband and I started having children early. I left school when my first was born, and went back part-time after my second, but I stopped again because juggling school and two kids was too hard. I didn't finish college until my youngest was in third grade. I was 29. I attended the University of Louisville and earned my undergraduate degree in history. I'd always wanted to be a librarian or a lawyer. I worked as a librarian and a book vendor while earning a master's degree in library science from the University of Kentucky. I considered going to law school, but it would take too long, and both of my kids were in their prime years. I didn't want to miss that. Later, when I thought I was ready to apply to law school , I conducted informational interviews with a few lawyers, all of whom told me they hated their jobs. This convinced me that I should first get experience working in a law firm, so I went back to the University of Louisville and got an associate degree in paralegal studies. After graduation, I was hired as a paralegal by one of my instructors, though I ended up doing the work of an associate attorney . That was fine for a while, because I wanted to get experience, and I loved writing complaints. But one day, I looked at my salary and thought, \"This is crazy. I need to be rewarded for the work I'm doing.\" That's when I decided to go to law school. I passed the bar on my first try I applied to two law schools, and I got into both. It was 2009, and I was 50. At a student open house for one of them, a school official told me that one of the professors thought I was a parent and was annoyed that I was participating. I realized I wasn't going to fit in here. Most students were right out of college. Since I knew the other school, the University of Louisville, had a tradition of serving adults , I went there. While a student, I interned at the Kentucky Public Service Commissi", "date_str": "2026-10-10T09:23:01+00:00", "hash": "fb937880d586fccb", "title_fa": "بچه های من اول شدند. در 50 سالگی بالاخره به دانشکده حقوق رفتم.", "summary_fa": "نانسی وینسل می خواست وکیل شود، اما بزرگ کردن فرزندانش در درجه اول بود. شان وینسل نانسی وینسل رفتن به دانشکده حقوق را به بعد از بزرگ کردن فرزندانش موکول کرد. وینسل در اولین تلاش خود در 53 سالگی موفق شد و در 64 سالگی شغل قانونی رویایی خود را در یک آژانس دولتی به دست آورد. او گفت که اکنون به مردم می گوید که قانون را به عنوان شغل دوم در نظر بگیرند. این مقاله گفته شده بر اساس گفتگو با نانسی وینسل، یک وکیل بازنشسته در فلوریدا است. Business Insider هویت و سابقه او را تأیید کرده است. این داستان برای طولانی بودن و وضوح ویرایش شده است. من بعد از سال دوم دانشگاه ازدواج کردم و من و شوهرم زود بچه دار شدیم. وقتی اولی ام به دنیا آمد مدرسه را ترک کردم و بعد از دومی نیمه وقت برگشتم، اما دوباره دست از کار کشیدم زیرا شعبده بازی با مدرسه و دو بچه خیلی سخت بود. من دانشگاه را تمام نکردم تا اینکه کوچکترینم کلاس سوم بود. من 29 ساله بودم. در دانشگاه لوئیزویل تحصیل کردم و مدرک کارشناسی خود را در رشته تاریخ گرفتم. همیشه دوست داشتم کتابدار یا وکیل شوم. من به عنوان کتابدار و فروشنده کتاب مشغول به کار شدم و در عین حال مدرک کارشناسی ارشد خود را در رشته علوم کتابداری از دانشگاه کنتاکی دریافت کردم. فکر کردم وارد دانشکده حقوق شوم، اما خیلی طول می‌کشد، و هر دوی بچه‌هایم در سال‌های ابتدایی خود بودند. من نمی خواستم آن را از دست بدهم. بعداً، زمانی که فکر کردم برای پذیرش در دانشکده حقوق آماده هستم، مصاحبه‌های اطلاعاتی با چند وکیل انجام دادم که همگی به من گفتند که از شغل خود متنفرند. این من را متقاعد کرد که ابتدا باید تجربه کار در یک شرکت حقوقی را به دست بیاورم،"}, {"source": "Business Insider", "title": "AWS head says Amazon needs to be more vocal about data center services: 'Do you not want to use Netflix?'", "link": "https://www.businessinsider.com/aws-amazon-matt-garman-data-centers-messaging-netflix-2026-10", "summary": "AWS CEO Matt Garman Noah Berger/Getty Images for Amazon Web Services AWS CEO Matt Garman says Amazon needs to be more \"vocal\" in how it talks about data centers. He said the tech giant should focus on how data centers support everyday services like watching Netflix. Garman previously warned that data center moratoriums could set the US back by decades. AWS CEO Matt Garman says he wants Amazon to be more upfront about how data centers already affect daily life. \"If you usually go to a community and say, 'Do you not want to use Netflix?' They'll go, 'No, no, I still want Netflix,'\" Garman said during a recent interview on the \"A16z Show\" podcast. Garman's point is that services like Netflix, which rely on AWS' cloud, require the very data centers that Americans increasingly oppose. His comments underscore how the industry is trying to respond to data centers becoming a political pariah. \"I think we need to be more vocal and be more upfront because we actually do a ton that's really beneficial,\" he said. Netflix has been an Amazon customer for years. In 2016, Netflix said it decided it needed to move to the cloud after a 2008 disruption that left it unable to ship DVDs out to customers for three days. In its 2025 annual report, the streaming giant said it runs \"the vast majority of our computing on AWS,\" to the point that switching to another provider would be difficult. Garman previously laid out Amazon's opposition to data center moratoriums, which he said would stifle the nation's largest infrastructure buildout on a scale comparable to the creation of the Interstate Highway System and risk ceding the lead in the global AI race. \"If these measures are enacted, the U.S. could be writing its own losing ticket to this race, and the consequences would last generations,\" he wrote on October 2. \"As a country, we can't afford to find ourselves in that position.\" Polling shows that Americans remain overwhelmingly opposed to the construction of AI data centers in their communities. A Fox News survey conducted last month found that more than 7 out of 10 (71%) of registered voters said they opposed building a data center in their area to support AI development. Previous surveys have also found that majorities oppose such construction. Business Insider has previously reported that some state leaders are backing away from their support for data centers as the issue becomes a political liability for incumbents. In addition to the services data centers provide, Garman sa", "date_str": "2026-10-10T09:21:01+00:00", "hash": "b5d45d4edab41710", "title_fa": "رئیس AWS می‌گوید آمازون باید در مورد خدمات مرکز داده پر سر و صداتر باشد: \"آیا نمی‌خواهید از Netflix استفاده کنید؟\"", "summary_fa": "مت گارمن، مدیر عامل AWS، نوح برگر/ گتی ایماژ برای خدمات وب آمازون، مت گارمن، مدیر عامل AWS می گوید آمازون باید در نحوه صحبت در مورد مراکز داده \"با صدای تر\" عمل کند. او گفت که غول فناوری باید بر نحوه پشتیبانی مراکز داده از خدمات روزمره مانند تماشای نتفلیکس تمرکز کند. گارمن قبلاً هشدار داده بود که تعلیق مراکز داده می تواند ایالات متحده را چندین دهه عقب بیاندازد. مت گارمن، مدیرعامل AWS می‌گوید که می‌خواهد آمازون در مورد اینکه چگونه مراکز داده در حال حاضر بر زندگی روزمره تأثیر می‌گذارند، آگاه‌تر باشد. \"اگر معمولاً به انجمنی می روید و می گویید \"آیا نمی خواهید از نتفلیکس استفاده کنید؟\" گارمن طی مصاحبه اخیر در پادکست «A16z Show» گفت: «نه، نه، من هنوز نتفلیکس را می‌خواهم.» نکته گارمن این است که خدماتی مانند نتفلیکس، که بر ابر AWS متکی هستند، به مراکز داده ای نیاز دارند که آمریکایی ها به طور فزاینده ای با آن مخالف هستند. نظرات او نشان می دهد که چگونه صنعت تلاش می کند به مراکز داده که تبدیل به یک منحرف سیاسی شده اند، پاسخ دهد. او گفت: «من فکر می‌کنم ما باید صدادارتر باشیم و پیشروتر باشیم، زیرا در واقع کارهایی انجام می‌دهیم که واقعاً مفید است. نتفلیکس سالهاست که مشتری آمازون بوده است. در سال 2016، نتفلیکس اعلام کرد که پس از یک اختلال در سال 2008 که باعث شد تا سه روز قادر به ارسال دی‌وی‌دی به مشتریان نباشد، تصمیم گرفته است که به فضای ابری منتقل شود. در گزارش سالانه 2025 خود، غول استریمینگ گفت که \"اکثریت قریب به اتفاق محاسبات ما را بر روی AWS\" اجرا می کند، تا جایی که تغییر به ارائه دهنده دیگری دشوار خواهد بود. گارمن قبلاً مخالفت آمازون را با تعلیق مراکز داده مطرح کرده بود، که به گفته او بزرگترین ساخت زیرساخت کشور"}, {"source": "Business Insider", "title": "The 'Oracle of Wall Street' says prepare for a prolonged housing slowdown as rates and home prices refuse to budge", "link": "https://www.businessinsider.com/housing-market-outlook-home-prices-slowdown-mortgage-rates-meredith-whitney-2026-10", "summary": "Meredith Whitney predicts the housing market slowdown will last for another year as rates and home prices stay high. Daniel Acker/Bloomberg via Getty Images Meredith Whitney says the US housing slump could stretch on through 2027. The veteran forecaster sees signs that supply will remain tight. A 2008-style correction in home prices is \"absolutely\" out of the question, she added. One of the forecasters renowned for calling the last housing crash has some bad news for buyers: the market isn't going to get more affordable anytime soon. Meredith Whitney , the \"Oracle of Wall Street\" who was among the analysts that rose to fame in \"The Big Short,\" says she isn't expecting the yearslong US housing slowdown to pick up anytime soon. While home sales have dropped sharply in recent years, that won't be enough to lower mortgage rates or home prices — meaning the deep freeze in housing activity could stretch on for at least the next year without improvement, she told Business Insider in an interview this week. 2026 is on track to be the weakest year for home sales since 2011, according to one estimate from Capital Economics. Whitney said she expected 2027 to be at least \"just as bad\" as 2026 for home sales. \"I don't see it improving dramatically anytime soon,\" she said, adding that a 2008-style correction in home prices was \"absolutely\" out of the question despite the slowdown in sales and waning demand from buyers. \"To see home prices coming down dramatically, you'd have to see more supply than demand, and that dynamic just doesn't exist,\" she added. The housing market has been trapped in a years-long sales slump, with buyers pulling out of the market as home prices have soared in. Mortgage rates have also surged, making homeowners hesitant to sell and finance a new purchase at higher rates. The S P Cotality Case-Shiller US National Home Price Index has appreciated 59% since the start of 2020. Meanwhile, the average 30-year fixed mortgage rate broke through 7% for the first time in years in September, and is hovering above 7.5% in the last week. The hope for some prospective buyers is that sales will eventually slow to a point that causes prices to fall. But the conditions to create that dynamic don't exist, Whitney said, pointing to factors that should keep prices elevated for the foreseeable future. 1. Supply remains tight overall There are some areas in the US where prices are coming down, but those are anomalies where supply was overbuilt during the pandemic, Wh", "date_str": "2026-10-10T09:15:01+00:00", "hash": "f5bc35cc7afbef02", "title_fa": "«اوراکل وال استریت» می‌گوید خود را برای کاهش طولانی‌مدت مسکن آماده کنید زیرا نرخ‌ها و قیمت مسکن از جابجایی خودداری می‌کنند.", "summary_fa": "مردیث ویتنی پیش‌بینی می‌کند که با بالا ماندن نرخ‌ها و قیمت مسکن، کندی بازار مسکن تا یک سال دیگر ادامه خواهد داشت. دنیل آکر/ بلومبرگ از طریق گتی ایماژ مردیث ویتنی می گوید که رکود مسکن در ایالات متحده ممکن است تا سال 2027 ادامه یابد. او اضافه کرد که اصلاح قیمت مسکن به سبک سال 2008 «کاملاً» قابل بحث نیست. یکی از پیش بینی کنندگان که به دلیل اعلام آخرین سقوط مسکن شهرت دارد، خبر بدی برای خریداران دارد: بازار به این زودی مقرون به صرفه تر نخواهد شد. مردیث ویتنی، «اوراکل وال استریت» که از جمله تحلیلگرانی بود که در «شورت بزرگ» به شهرت رسید، می‌گوید که انتظار ندارد به این زودی‌ها رکود چند ساله مسکن در ایالات متحده افزایش یابد. او در مصاحبه ای با Business Insider این هفته گفت، در حالی که فروش خانه در سال های اخیر به شدت کاهش یافته است، این برای کاهش نرخ وام مسکن یا قیمت خانه کافی نخواهد بود - به این معنی که انجماد عمیق در فعالیت مسکن می تواند حداقل تا سال آینده بدون بهبود ادامه یابد. بر اساس یک برآورد از Capital Economics، سال 2026 ضعیف ترین سال برای فروش خانه از سال 2011 است. ویتنی گفت که انتظار دارد سال 2027 حداقل به اندازه سال 2026 برای فروش خانه \"بد\" باشد. او گفت: «من نمی‌بینم که به این زودی‌ها بهبود چشمگیری پیدا کند.» وی افزود که اصلاح قیمت مسکن به سبک سال 2008 با وجود کاهش فروش و کاهش تقاضا از سوی خریداران، «کاملاً» غیرممکن است. او افزود: «برای مشاهده قیمت‌های مسکن که به‌طور چشمگیری کاهش می‌یابد، باید شاهد عرضه بیشتر از تقاضا باشیم، و این پویایی وجود ندارد». بازار مسکن در رکود چند ساله فروش گرفتار شده است و خریداران با افزایش قیمت مسکن از بازار خارج شدند. نرخ وام مسکن نیز افزایش یافته است"}, {"source": "Business Insider", "title": "Kids could be gifted company stocks in their Trump accounts. Here's what parents need to know.", "link": "https://www.businessinsider.com/trump-accounts-individual-stock-donations-explained-parents-2026-10", "summary": "The Department of the Treasury launched Trump Accounts over the summer. Bloomberg/Getty Images Trump Accounts are rolling out to all American children, and donors can now gift stock to kids. The gifts are free money, but cannot be declined, and come with compliance questions. Here's how to think about the financial and tax implications of your child's Trump Account. When Trump Accounts became available, Gene Goldman was on board. The chief investment officer of Cetera Investment Management opened accounts for his twin girls, born earlier this year, giving each access to the $1,000 government contribution and a diversified stake in the market. But now, the accounts he signed up for could look a little different. The Treasury Department is now allowing companies and other donors to gift individual stocks to children's Trump Accounts . What's raised some eyebrows is that shares can't be declined or sold for five years. Goldman said that changes the \"character of the program\" from a \"simple, diversified vehicle\" to one that could leave children with \"single-stock exposure.\" There is still a lot of upside with a gifted stock, Goldman said. \"A child gets part ownership in a business at no cost, and it can grow tax-deferred for decades,\" he said, potentially \"adding up to a lot by adulthood.\" But many prickly issues and concerns could come up for parents, from taxes and investment risk to workplace compliance. And, maybe most importantly, what can you do if you don't want the stock? After all, as part of the rollout of this new stock donation rule, the Treasury Department also opened new accounts for more than 60 million American children, without their parents needing to sign up. (Those born from 2025 to 2028 are eligible for the $1,000 government contribution, but their parents will still need to claim it.) The Treasury declined to comment for this story. \"This is the most generational thing we've done for youth,\" IRS CEO and Social Security administrator Frank Bisignano said on CNBC Thursday, noting that donations already lined up range from \"small to mega.\" Stock donations could make some children serious cash a couple of decades from now, but they are not free of considerations. Here's what four financial planning experts said parents should know. How and why does my child get gifted a stock in their Trump account? Soon enough, there will be parents who find out that not only is their child a Trump Account holder, but their child owns some stock. So how did ", "date_str": "2026-10-10T09:14:01+00:00", "hash": "ac6e73cfe8628c7d", "title_fa": "به کودکان می‌توان سهام شرکت را در حساب‌های ترامپ هدیه داد. در اینجا چیزی است که والدین باید بدانند.", "summary_fa": "وزارت خزانه داری در تابستان حساب های ترامپ را راه اندازی کرد. Bloomberg/Getty Images حساب‌های ترامپ برای همه کودکان آمریکایی در دسترس است و اهداکنندگان اکنون می‌توانند سهام را به کودکان هدیه دهند. هدایا پول رایگان هستند، اما نمی توان آنها را رد کرد و همراه با سؤالات مربوط به انطباق است. در اینجا نحوه فکر کردن به پیامدهای مالی و مالیاتی حساب ترامپ فرزندتان آورده شده است. زمانی که حساب‌های ترامپ در دسترس قرار گرفت، جین گلدمن در هیئت مدیره بود. افسر ارشد سرمایه گذاری Cetera Investment Management برای دختران دوقلوی خود که در اوایل امسال متولد شده اند حساب باز کرد و به هر یک از آنها به کمک 1000 دلاری دولت و یک سهم متنوع در بازار دسترسی پیدا کرد. اما اکنون، حساب‌هایی که او در آن ثبت‌نام کرده است می‌تواند کمی متفاوت به نظر برسد. وزارت خزانه داری اکنون به شرکت ها و سایر اهداکنندگان اجازه می دهد تا سهام فردی را به حساب های ترامپ کودکان هدیه دهند. چیزی که باعث نگرانی شده این است که سهام را نمی توان به مدت پنج سال کاهش داد یا فروخت. گلدمن گفت که «شخصیت برنامه» را از «وسیله نقلیه ساده و متنوع» به وسیله‌ای که می‌تواند کودکان را در معرض «تک سهام قرار گرفتن» قرار دهد تغییر می‌دهد. گلدمن گفت که هنوز با یک سهام با استعداد پیشرفت زیادی وجود دارد. او گفت: «کودک بدون هیچ هزینه‌ای مالکیت یک کسب‌وکار را به دست می‌آورد، و می‌تواند برای چندین دهه به تعویق درآمده مالیاتی رشد کند، که احتمالاً «تا بزرگسالی به مقدار زیادی اضافه می‌شود». اما بسیاری از مسائل و نگرانی‌های خاردار ممکن است برای والدین ایجاد شود، از مالیات و ریسک سرمایه‌گذاری گرفته تا پیروی از محل کار. و شاید مهمتر از همه، اگر سهام را نمی خواهید چه کاری می توانید انجام دهید؟ به هر حال،"}, {"source": "Business Insider", "title": "I'm the Naked Cowboy. Here's the routine that lets me make a living singing in my underwear every day in Times Square.", "link": "https://www.businessinsider.com/naked-cowboy-times-square-business-expenses-routine-2026-10", "summary": "Robert John Burck II, as the Naked Cowboy, performing in Times Square. Nicole Raucheisen Robert John Burck II, the Naked Cowboy, earns $150k yearly performing in Times Square. Burck uses Cameo and merchandise sales to boost his income beyond tips in Times Square. Burck's disciplined lifestyle and business expenses support his Naked Cowboy alter ego. This is an as-told-to essay based on a conversation for our video series The Pay Check with Robert John Burck II, also known as the Naked Cowboy, a Times Square street performer. It has been edited for length and clarity. I'm Robert John Burck II. I exist to get my alter ego, the Naked Cowboy, to Times Square . I make roughly $150,000 a year, on average, singing and playing my guitar for tourists and locals in New York City . In my best year, I have earned as much as $250,000, and I have had previous consecutive years when I have only made $25,000 to $30,000 — this was just enough to go to work. Burck holds up tips he made after working in Times Square. Nicole Raucheisen I'm here because, in my opinion, this is the most productive use of my time. It's hard to imagine that getting in your underwear, boots, and hat and standing in the middle of a street corner with no one expecting you to be there could be the most productive thing you can do. But Tony Robbins said: \"The most valuable resource is resourcefulness.\" And that's me, I'm a good sport. The secret to youth and vitality is routine and ritual. I have an unbelievably disciplined, methodical, and consistent personality. I've religiously gone to Times Square every day unless I was flying to another country, going on spring break, or attending other major events; still, these vacations are working vacations. Everywhere I've ever been, my underwear, boots, and hat travel with me. For nearly 28 years, it's been the same every single day. I wake up and read nonstop for hours, books about mythology, psychology, and sociology. Then I run to the gym and make it a point to train harder than anyone else there. After, I come back to my house and drive to my garage in Times Square, where I work from 11 a.m. to around 5 p.m. Burck paints his underwear in his home. Nicole Raucheisen I eat the exact same foods every day. Food is my biggest expense, because it's the only thing I can't put off as a business expense. I spend around $120 a day, which includes up to 12 egg whites before I leave the house, plus my lunch of sushi and a protein shake from a Times Square deli. Alm", "date_str": "2026-10-10T09:02:01+00:00", "hash": "a25a7574fa750f77", "title_fa": "من کابوی برهنه هستم. این روتینی است که به من اجازه می دهد هر روز در میدان تایمز با آواز خواندن با لباس زیرم امرار معاش کنم.", "summary_fa": "رابرت جان برک دوم، در نقش گاوچران برهنه، در حال اجرا در میدان تایمز. نیکول راوشایزن رابرت جان بورک دوم، کابوی برهنه، سالانه 150 هزار دلار از اجرا در میدان تایمز درآمد دارد. برک از Cameo و فروش کالا برای افزایش درآمد خود فراتر از انعام در میدان تایمز استفاده می کند. شیوه زندگی منضبط برک و مخارج تجاری او از منیت جایگزین کابوی برهنه او حمایت می کند. این یک مقاله گفته شده است که بر اساس گفتگوی مجموعه ویدیویی ما The Pay Check با رابرت جان بورک دوم، که به عنوان کابوی برهنه، مجری خیابان تایمز نیز شناخته می شود، است. برای طول و وضوح ویرایش شده است. من رابرت جان برک دوم هستم. من وجود دارم تا آلتر من، کابوی برهنه، را به میدان تایمز برسانم. من با آواز خواندن و نواختن گیتارم برای گردشگران و مردم محلی در شهر نیویورک، تقریباً 150000 دلار در سال درآمد دارم. در بهترین سال زندگی‌ام، 250000 دلار درآمد داشتم، و سال‌های متوالی قبلی را داشتم که فقط 25000 تا 30000 دلار درآمد داشتم - این برای سرکار رفتن کافی بود. برک نکاتی را که پس از کار در میدان تایمز انجام داده است، حفظ می کند. Nicole Raucheisen من اینجا هستم زیرا به نظر من این کار مفیدترین استفاده از زمان من است. تصور اینکه پوشیدن لباس زیر، چکمه و کلاه و ایستادن در وسط یک خیابان بدون اینکه هیچ کس از شما انتظار حضور در آنجا را نداشته باشد، کارآمدترین کاری است که می توانید انجام دهید، سخت است. اما تونی رابینز گفت: \"با ارزش ترین منبع، تدبیر است.\" و این من هستم، من ورزش خوبی هستم. راز جوانی و شادابی در روال و تشریفات است. من شخصیتی باورنکردنی منظم، روشمند و ثابت دارم. من از نظر مذهبی هر روز به میدان تایمز رفته ام مگر اینکه به کشور"}, {"source": "Business Insider", "title": "Gen X is going deeper into credit card debt — even as they make more money than ever", "link": "https://www.businessinsider.com/gen-x-faces-growing-credit-card-debt-despite-high-incomes-2026-10", "summary": "Gen Xers are dealing with mounting credit card debt. d3sign/Getty Images Gen X, the economy's middle child, is contending with rising credit card debt. The Federal Reserve's latest accounting of consumer finances found their balances soared. That comes even as Gen X makes even more money, but sees shrinking net worths. Gen Xers are putting their credit cards to work. The Federal Reserve's latest accounting of consumer finances finds that as of 2025, 45 to 54-year-olds had the largest credit card balances among age groups, surpassing 64 to 75-year-olds. At the same time, their younger millennial peers have been paying down debt, with balances for 35 to 44-year-olds falling. The latest data comes as the country's forgotten middle-child generation contends with its own mixed financial fortunes . Consumer sentiment is lowest among Americans ages 35 to 54, according to the University of Michigan's index, with sentiment among that millennial-Gen X cohort sliding below both their younger and older counterparts in the same period that their credit card balances began to tick up. For 45- to 54-year-olds, inflation-adjusted balances rose from around $3,300 in 2022 to around $5,100 in 2025, bringing them above their older peers, who previously had the highest debt. Even so, the 45- to 54-year-old cohort remains the highest paid in the economy. Per the Survey of Consumer Finances, their median pre-tax income is nearly $109,000, the highest among all age groups; it's also the largest median income ever recorded in the dataset after adjusting for inflation, meaning that Gen Xers are reaching new earnings heights. One source of stress for the Gen X cohort could be lagging overall wealth, despite their high incomes. Their older peers' median assets, which include things like stocks, bonds, and retirement accounts, have risen since 2022, bolstering their net worths. In particular, the median value of directly held stocks by the oldest Americans has soared by nearly $15,000 since 2022, while the value of stocks for 45 to 54-year-olds remains below 2019 levels. That means that the wealthiest Americans aren't those earning the highest incomes. Instead, it's the retirement-aged group holding onto increasingly valuable stocks and retirement accounts. The median net worth of those 75 and older rose from around $366,000 to nearly $50
