age Petty was, 57, when he rocked the 2008 game where the New York Giants bested the New England Patriots. The gig, typically the most-watched 15 minutes of musical performance in any given year, finally came around to 25-time Grammy winner Jay more than three decades into his career. The news was announced during halftime of last night’s Monday Night Football (Oct. 26) game between the Dallas Cowboys and his Eagles, when the world learned that Jay picked himself to headline next year’s show. Good things come to those who wait, and following a year of triumphal, cameo-packed shows across the world marking his 30 years in the game, and, as MNF commentator Jason Kelce said during the broadcast, He’s got more stadium-ready hits than most artists have songs, period. Elder statesman Jay is following up Bad Bunny, then 31, who skewed the average halftime performer age down by several decades during his record-setting show earlier this year — as did Kendrick Lamar, then 37, when he headlined in 2025. Jay, who will turn 57 in December, is actually in the age-appropriate sweet spot if you look at some of the rock and pop icons who ve taken the Super Bowl stage over the past two decades. While the beginning of the millennium was defined by teen and early 20s pop stars, including Christina Aguilera (19) in 2000, Britney Spears (19) and then boyfriend Justin Timberlake (19) with his boy band *NSYNC s in 2001 (alongside Aerosmith s Steven Tyler, 52 and Joe Perry, 50), the middle of the early 2000s was defined by veteran acts in the same age range as Jay. Paul McCartney was a sprightly 62 when he headlined in 2005 in Jacksonville, Fla, followed by the Rolling Stones in Detroit the next year at a time when tireless lead singer and guitarist Mick Jagger and Keith Richards were also both 62. Prince was a relative young un at the rain-soaked 2007 game, when he was 48. The Who became the oldest act to headline the show in 2010 in Miami when singer Roger Daltrey was 65 and guitarist Pete Townshend was 64, a year after then-59-year-old Bruce Springsteen took the stage in Tampa. In 2012, then 53-year-old Madonna did the honors in Indianapolis for a blow-out that included support from younger acts LMFAO, Nicki Minaj, M.I.A. and Cee Lo", "date_str": "2026-10-27T17:21:04+00:00", "hash": "7563a4799ac613c6", "title_fa": "جی زی با این اسطوره راک هم سن و سالی خواهد بود که سرفصل نمایش نیمه وقت Super Bowl LXI", "summary_fa": "نماد متاخر راک تام پتی و جی زی چه مشترکاتی دارند؟ چیز زیادی نیست، به جز اینکه هر دو مرد در تالار مشاهیر راک رول هستند و وقتی جی در 14 فوریه 2027 در استادیوم SoFi روی صحنه می رود تا در نمایش نیمه وقت Super Bowl LXI اجرا کند، همان سنی خواهد بود که پتی، 57 ساله، زمانی که در سال 2008 در بازی سال 2008 که جاینت نیویورک بر نیوانگلند پاتریوت برتری یافت، بود. این کنسرت که معمولاً 15 دقیقه پربیننده ترین اجرای موسیقی در هر سال معین بود، سرانجام به جیی برنده 25 گرمی، بیش از سه دهه از عمر حرفه ای اش رسید. این خبر در نیمه بازی دوشنبه شب فوتبال دوشنبه شب گذشته (26 اکتبر) بین دالاس کابوی و ایگلز اعلام شد، زمانی که جهان متوجه شد که جی خودش را به عنوان تیتر برنامه سال آینده انتخاب کرده است. چیزهای خوبی نصیب کسانی می‌شود که منتظر می‌مانند و پس از یک سال نمایش‌های پیروزمندانه و کمئو در سراسر جهان به مناسبت 30 سال حضور او در این بازی، و همانطور که مفسر MNF، جیسون کلس در طول پخش گفت، تعداد بازدیدهای آماده استادیوم بیشتر از آهنگ‌های بسیاری از هنرمندان است. سیاستمدار بزرگ جی در حال پیگیری Bad Bunny است که در آن زمان 31 سال داشت، که میانگین سنی نوازندگان را در اوایل امسال چند دهه کاهش داد - همانطور که کندریک لامار، در آن زمان 37 سال داشت، زمانی که در سال 2025 تیتر اول شد. مرحله کاسه در دو دهه گذشته. در حالی که آغاز هزاره توسط ستارگان پاپ نوجوان و اوایل دهه 20 تعریف شد، از جمله کریستینا آگیلرا (19) در سال 2000، بریتنی اسپیرز (19) و پس از آن دوست پسر جاستین تیمبرلیک (19) با گروه پسرش *NSYNC s در سال 2001 (در کنار Aerosmith0، و 5، 2، و 5", "image_url": "https://www.billboard.com/wp-content/uploads/2026/07/2275012575-e1787266408956.jpg?w=1024", "category": "هوش مص time Show: Our Dream Setlist", "summary_fa": "بز از کیسه خارج شده است. این همان خطی است که جی زی برای اعلام اینکه تیتر نمایش نیمه وقت سوپر بول 2027 در لس آنجلس خواهد بود، استفاده کرد. پس از هفته‌ها حدس و گمان، هاو رسماً در بلیت جشن سال آینده است، جایی که او به دنبال اولین حضور پرشور خود در 30 و 25 سالگرد آلبوم‌های تحسین‌شده‌اش، Reasonable Doubt و The Blueprint، خواهد بود. هاو در بیانیه‌ای مطبوعاتی گفت: «از تردید معقول تا ایستادن روی صحنه نیمه‌تیم سوپر باول، این یک سفر بوده است. \"سی سال موسیقی، کار و فرهنگ در بزرگترین صحنه جهان. این اجرا همچنان رویایی است که به حقیقت پیوسته است.\" برای Jay-Z، این اولین بازی او در نیمه اول سوپر باول پس از گذراندن هفت سال گذشته برای کمک به شکل دادن به نمایش مورد علاقه از طریق Roc Nation است. در طول آن اجرا، او کمک کرد تا بازیگرانی مانند کندریک لامار، خرگوش بد، ریحانا و The Weeknd به بزرگ‌ترین صحنه ورزشی برود. اکنون، غول Roc Nation نوبت به خلق جادو می رسد - و مهمتر از همه، این کار را طبق شرایط خودش انجام می دهد. هاو با ۲۵ جایزه گرمی و ۱۴ آلبوم شماره ۱ در بیلبورد ۲۰۰، گنجینه ای از موفقیت ها را در اختیار دارد. او می‌تواند مسیر انفرادی را طی کند و سرودهایی مانند «۹۹ مشکل» و «اعلام خدمات عمومی» را منتشر کند، یا به رولودکس پر ستاره‌اش متمایل شود و از دوستان معروفش دعوت کند تا مهمانی را به هم بزنند. از بیانسه گرفته تا ریحانا، آقای کارتر هیچ کمبودی در لیست A ندارد، همانطور که کنسرت های پر ستاره او در استادیوم یانکی در تابستان گذشته نشان می دهد. در زیر، Billboard رویای نهایی Jay-Z's Super Bowl Halftime Show را می‌بیند که مملو از آثار کلاسیک انفرادی، همکاری‌های جاودانه و چند شگفتی بالقوه است.", "image_url": "https://www.billboard.com/wp-content/uploads/2026/07/jay-z-yankee-stadium-the-blueprint-2026-billboard-1800.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["موسیقی"], "datetime_fa": "۵ آبان • ۲۰:۴۵"}, {"source": "Deadline", "title": "‘Fear Factor’ Vertical Scripted Spinoff Set To Launch On Holywater Tech’s My Drama From Fox & Endemol Shine North America", "link": "https://deadline.com/2026/10/fear-factor-spinoff-vertical-scripted-serie  کند.", "summary_fa": "مجری سابق Call Her Daddy را در کتاب خاطرات آینده اش باباش به تفصیل شرح داد. در حال حاضر، بیشتر علاقه مندان به فرهنگ پاپ داستان «باباش را صدا کن» و شکستگی عمومی و کثیف آن را می دانند. فرانکلین و بهترین دوست و هم اتاقی آن زمانش، کوپر، پادکست را در سال 2018 شروع کردند و به سرعت این برنامه را - که به خاطر پرشور و رک بودنش در مورد قرارهای مدرن تجلیل شد - به یک میلیون شنونده محبوب تبدیل کردند. هنگامی که آنها در سال 2020 قرارداد خود را با Barstool Sports متعلق به دیو پورتنوی مذاکره کردند، یک ماه تنش چند ماهه با کوپر به عنوان تنها میزبان و برکناری فرانکلین به پایان رسید. این پیامد سال‌هاست که توسط مردم بررسی می‌شود و کوپر و فرانکلین به طور گسترده در مورد آن صحبت می‌کنند. اما فرانکلین در کتاب خاطرات آینده‌اش «مسائل بابا» جزئیات روزهای منتهی به جدایی را باز می‌کند. در گزیده جدیدی که توسط هالیوود ریپورتر منتشر شد، فرانکلین به یاد آورد که فهمید کوپر مخفیانه 20000 دلار بیشتر از او هر سال درآمد داشته است - و حتی مدتها قبل از اینکه آنها به طور حرفه ای راه خود را از هم جدا کنند تلاش کرده بود او را اخراج کند. تمام عقلانیت از بین رفته است. ساده لوح؟ گنگ؟ ساده لوح؟ زندگی در چیزی که حقیقت نداشت؟ این درست نیست؟ آیا او هرگز دوست من بود؟\" او در گزیده ای نوشت و فاش کرد که از طریق وکیلش از اختلاف دستمزد مطلع شده است. \"من به هر گفتگوی قراردادی که تا به حال داشته ایم فکر می کنم. جوک. چگونه همه چیزهای لعنتی را با یکدیگر به اشتراک می گذاریم - فضا، زمان، احساسات، کار، درد، اوج، شرم، دلشکستگی، خانواده. الکس این کار را نمی کند. در مورد چیزی خیلی احمقانه دروغ", "image_url": "https://www.rollingstone.com/wp-content/uploads/2026/10/Sofia-Franklyn-update.jpg?crop=0px%2C11px%2C1800px%2C1014px&#038;resize=1600%2C900", "category": "هوش مصنوعی مولد", "tags": ["رسانه", "هنر"], "datetime_fa": "۵ آبان • ۲۰:۲۸"}, {"source": "Hollywood Reporter", "title": "‘Fear Factor’ Goes Vertical With Scripted Microdrama", "link": "https://www.hollywoodreporter.com/tv/tv-news/fear-factor-scripted-microdrama-fox-endemol-shine-1236740933/", "summary": "The series will stream on Holywater's My Drama platform, in which Fox has an equity stake.", "date_str": "2026-10-27T18:00:00+00:00", "hash": "8d0401bf6a8a036b", "title_fa": "\"عامل ترس\" با فیلمنامه میکرودرام عمودی می شود", "summary_fa": "این سریال بر روی پلتفرم My Drama Holywater پخش خواهد شد که فاکس در آن سهام دارد. متن لوگو فاکس فاکتور ترس: خانه ترس در چند جهت جدید پیش می رود: سریال واقعیت مبنایی برای فیلمنامه میکرودرام خواهد بود. استودیوی سرگرمی فاکس و اندمول شاین آمریکای شمالی در حال همکاری برای یک نمایش ویدیویی عمودی با الهام از تکرار فعلی Fear Factor هستند که در حال رفتن به فصل دوم خود در این شبکه است (Endemol Shine North America، یک شرکت Banijay، سریال بدون فیلمنامه را تولید می کند). این میکروسریال بر روی پلتفرم My Drama متعلق به Holywater Tech پخش خواهد شد که فاکس در آن سهام دارد. داستان‌های مرتبط کسب و کار دو سوم از میکرودرام‌های منتشر شده در سه ماهه آخر در خارج از چین، هوش مصنوعی تولید شده است، گزارش می‌شود که Business Banana Republic اولین فیلمنامه میکروسریال، یک کمدی آفیس با بازی جک اینانن (اختصاصی) را به نمایش می‌گذارد. به گفته فاکس، میکرودرام تلویزیونی بدون عنوان در حال حاضر اولین مجموعه بدون فیلمنامه را نشان می‌دهد. همچنین این اولین سریال ترسناک برای My Drama است (البته تعدادی داستان عاشقانه خون آشام و گرگینه روی پلتفرم وجود دارد). هانا پیلمر، سرپرست فیلمنامه در استودیوی سرگرمی فاکس، می‌گوید: «فاکتور ترس همیشه به چیزی ابتدایی دست زده است: چه چیزی ما را می‌ترساند، تا کجا پیش خواهیم رفت و چه اتفاقی می‌افتد وقتی مجبور می‌شویم با ترس‌های خود مقابله کنیم. «پاسخ فوق‌العاده [به Fear Factor: House of Fear] راه را برای بردن Factor به جایی باز کرد که قبلاً هرگز نرفته بود: تبدیل شدن به اولین فرانچایز تلویزیونی بدون فیلمنامه که جهشی را به داستان‌سرایی فیلم‌نامه‌ای اصلی انجام داد. دوستان ما در Endemol Shine با روشی الهام‌بخش به ما مراجعه کردند تا دقیقاً همین کار را انجام دهند، و هر چیزی را که مخاطبان در مورد Fear Factor", "image_url": "https://www.hollywoodreporter.com/wp-content/uploads/2026/10/FF_S1-Ep101-1972_f.jpg?w=1296&#038;h=730&#038;crop=1", "category": "هوش مصنوعی مولد", "tags": ["هوش مصنوعی", "سینما /artisans/news/tom-cruise-prosthetics-digger-kazu-hiro-1236931707/", "summary": "Oscar-winning prosthetic makeup artist Kazu Hiro has been in the industry for over 30 years. He’s transformed Bradley Cooper, Gary Oldman, Charlize Theron and, most recently, Dwayne Johnson in “The Smashing Machine.” This year, he was tasked with transforming Tom Cruise in “Digger,” in which Cruise plays a Texas oil tycoon. But this isn’t the [ ]", "date_str": "2026-10-27T17:15:00+00:00", "hash": "ce0ab14028229743", "title_fa": "چگونه کازو هیرو با پروتز شکم، بینی و چانه تام کروز را به «حفار» تبدیل کرد", "summary_fa": "کازو هیرو هنرمند برنده اسکار آرایش مصنوعی بیش از 30 سال است که در این صنعت فعالیت می کند. او بردلی کوپر، گری اولدمن، شارلیز ترون و اخیراً دواین جانسون را در «ماشین درهم شکستن» متحول کرده است. در این سال، او وظیفه داشت تام کروز را در فیلم «حفار» که در آن کروز نقش یک سرمایه دار نفتی تگزاس را بازی می کند، تبدیل کند. اما این [ ] نیست این فیلم به کارگردانی الخاندرو گونزالس ایناریتو است و همچنین ریز احمد، جان گودمن و ساندرا هولر در آن بازی می‌کنند و Digger را دنبال می‌کند که کمپانی او باعث یک فاجعه جهانی بالقوه می‌شود. این دگرگونی می‌توانست ساعت‌ها طول بکشد - به طور دقیق شش. جز اینکه کروز نمی خواست مدت زیادی را روی صندلی آرایش برای گذاشتن پروتز بگذراند. او متقاعد شده بود که تیم می تواند این کار را سریعتر انجام دهد و هیرو هم این کار را انجام داد. او این کار را انجام داد و راهی برای ساده‌سازی این فرآیند پیدا کرد. هیرو با Variety در مورد روند خود و چگونگی تبدیل کروز به بارون نفت صحبت کرد. نماینده ام با من تماس گرفت و گفت الخاندرو می خواهد در مورد این پروژه با من صحبت کند. من می خواستم فیلمنامه را قبل از ملاقات با او بخوانم و آن را خواندم و شگفت انگیز بود، با یک داستان عالی. ما با هم صحبت کردیم، اما او قرار است یک سرمایه دار نفتی باشد. در آن زمان، او حدود 76 سال سن داشت، بسیار بزرگتر از ظاهر نهایی. من برای دیدن تام در لندن رفتم و با او و الخاندرو ملاقاتی داشتیم - در آن زمان این یک ایده باز بود. او برنامه فشرده‌ای داشت زیرا داشت «ماموریت غیرممکن» را فیلم‌برداری می‌کرد، اما ما زمانی را برای انجام یک اسکن سه‌بعدی، کلاه‌برداری زنده و", "image_url": "https://variety.com/wp-content/uploads/2026/10/rev-1-RWS_7143_COMP_V425_INH_r709g24_20260917.0095949_High_Res_JPEG.jpeg?crop=0px%2C406px%2C3996px%2C2248px&#038;resize=1000%2C563", "category": "هوش مصنوعی مولد", "tags": ["عامل‌های هوشمند", "سینما"], "datetime_fa": "۵ آبان • ۲۰:۴۵"}, {"source": "Billboard", "title": "Feid, Milo J, Cristian Castro & More to Perform at 2026 Latin Grammy Awards", "link": "https://www.billboard.com/music/awards/latin-grammy-awards-2026-performers-feid-milo-j-1236368870/", "summary": "The Latin Recording Academy on Tuesday (Oct. 27) announced a new wave of performers for the 2026 Latin Grammy Awards set for Nov. 12. Related Edgar Barrera Leads 2026 Latin Grammy Nominations: Full List Billboard Latin Music Week 2026 Photo Booth: Anuel AA, Becky G, Maluma More 10 José Alfredo Jiménez Songs to Celebrate His 100th Birthday: Si Nos Dejan, Te Solté la Rienda More Cristian Castro, Camila Fernández, Feid, Luis Figueroa, Fonseca, Grupo Frontera, Milo J, Niña Pastori, Reik, Sofía Reyes, Yami Safdie and The Warning are all set to take center stage at the gala in Las Vegas. Additionally, the telecast will celebrate the legacy of José Alfredo Jiménez with a tribute in honor of the 100th anniversary of his birth. Born on Jan. 19, 1926, in Dolores Hidalgo, Guanajuato, Jiménez, known as the “King of Ranchero Music,” is considered one of the most important singers and songwriters of the genre, and was behind hits such as “El Rey” and “Caminos de Guanajuato.” His music has been performed and reimagined by superstars including Pedro Infante, Vicente Fernández, Luis Miguel, Maná and more. On the Billboard charts, Jiménez had 12 entries on Top Latin Albums, reaching his highest position with La Historia del Rey , which peaked at No. 11 in 2006. The album also earned him his first and only No. 1 on regional Mexican Albums that same year. The tribute will be produced by Edgar Barrera, who leads this year s nominees with 10 nods, including record of the year, album of the year and song of the year, mostly for his work on projects by Karol G and Carín León. The 27th annual Latin Grammy Awards will air live from Las Vegas on Thursday, Nov. 12, at 8 p.m. ET/PT in the U.S. via TelevisaUnivision platforms. Prior to the broadcast, the Latin Grammy Premiere, a non-televised ceremony announcing most of the winners, will take place.", "date_str": "2026-10-27T16:50:31+00:00", "hash": "499fe285c90c6cf8", "title_fa": "فید، میلو جی، کریستین کاسترو و دیگران در جوایز گرمی لاتین ۲۰۲۶ اجرا خواهند کرد", "summary_fa": "آکادمی ضبط لاتین روز سه شنبه (27 اکتبر) موج جدیدی از اجراکنندگان را برای جوایز گرمی لاتین 2026 اعلام کرد که قرار است در 12 نوامبر برگزار شود. مرتبط ادگار بارارا پیشتاز نامزدهای گرمی لاتین 2026: فهرست کامل بیلبورد هفته موسیقی لاتین 2026 غرفه عکس: Anuel AA، Becky G، Maluma 10 آهنگ بیشتر خوزه آلفردو جیمنز برای جشن تولد 100 سالگی اش: Si Nos la Dejanend CASTMORE فرناندز، فید، لوئیس فیگوئروآ، فونسکا، گروپو فرانترا، میلو جی، نینا پاستوری، ریک، سوفیا ریس، یامی سافدی و The Warning قرار است در مرکز گالا در لاس وگاس حضور داشته باشند. علاوه بر این، پخش تلویزیونی میراث خوزه آلفردو خیمنز را با ادای احترام به صدمین سالگرد تولد او جشن خواهد گرفت. متولد ژانویه 19، 1926، در Dolores Hidalgo، Guanajuato، Jiménez، شناخته شده به عنوان \"پادشاه موسیقی Ranchero\"، یکی از مهمترین خوانندگان و ترانه سرایان این ژانر در نظر گرفته می شود، و پشت سر موفقیت هایی مانند \"El Rey\" و \"Caminos de Guanajuato\" قرار گرفت. موسیقی او توسط سوپراستارهایی از جمله پدرو اینفانته، ویسنته فرناندز، لوئیس میگل، مانا و غیره اجرا و بازسازی شده است. در نمودارهای بیلبورد، جیمنز 12 اثر در آلبوم‌های لاتین برتر داشت، که با La Historia del Rey به بالاترین جایگاه خود رسید، که در سال 2006 به رتبه 11 رسید. این آلبوم همچنین اولین و تنها شماره 1 خود را در آلبوم‌های منطقه‌ای مکزیکی در همان سال به دست آورد. این ادای احترام توسط ادگار باررا تهیه می‌شود، که با 10 نوبت، از جمله رکورد سال، آلبوم سال و آهنگ سال، بیشتر برای کارهایش روی پروژه‌های کارول جی و کارین لئون، نامزدهای امسال را رهبری می‌کند.", "image_url": "https://www.billboard.com/wp-content/uploads/2026/10/feid-cr-courtesy-latin-recording-academy-press-billboard-1800.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["موسیقی"], "datetime_fa": "۵ آبان • ۲۰:۲۰"}, {"source": "Billboard", "title": "Elvis Presley AI Lawsuit, Neil Young Trump Case, Drake Spotify Ruling & More Music Law News", "link": "https://www.billboard.com/pro/legal-beat-elvis-presley-neil-young-drake-spotify/", "summary": "THE BIG STORY: Big players in the music industry has already been litigating over artificial intelligence for years. But now they’re led by a King. The owners of Elvis Presley ‘s music threw the rock legend into the epic battle over AI this week, suing AI giant Anthropic over accusations that it trained its models on hundreds of the legendary artist’s song without permission. Related Anthropic Sued For Stealing Elvis Presley Music to Train AI: Deeply Protective of These Iconic Songs Kenny MacPherson, Veteran Music Publisher and Big Deal Music Co-Founder, Dies at 71 Diddy Moved From New Jersey Prison to Similar Facility in Pennsylvania The case, which claims Anthropic used “Can’t Help Falling in Love,” “A Little Less Conversation” and “Don’t Be Cruel” and more than 270 more Elvis tracks, represents by far the most high-profile legal action filed on behalf of an individual musician so far — in this case, arguably the most famous recording artist of all time. Will modern music stars take similar legal action over AI? We’ll let you know if they do. For more details, go read our full story here , including access to the actual lawsuit filed in federal court. You’re reading the Legal Beat , a weekly newsletter about music law from Billboard Pro , offering you a one-stop cheat sheet of big new cases, important rulings and all the fun stuff in between. To get the newsletter in your inbox every Tuesday, subscribe here . Other top stories this week… My Che alent and Brand First Partnerships", "link": "https://variety.com/2026/biz/news/lego-head-of-celebrity-talent-1236929633/", "summary": "The Lego Group has appointed its first head of celebrity talent and brand first partnerships. Kelsey Gray Sherman has joined the company in the Hollywood whisperer role, which is part of the Entertainment, Partnerships Content division. The new position reflects the company’s growing focus on expanding the Lego brand’s presence across entertainment and culture, [ ]", "date_str": "2026-10-27T17:00:00+00:00", "hash": "278bccc2fa7ebb80", "title_fa": "لگو اولین رئیس استعدادهای مشهور و مشارکت های برند اول خود را منصوب کرد", "summary_fa": "گروه لگو اولین رئیس خود را در زمینه استعدادهای مشهور و اولین مشارکت های برند منصوب کرده است. کلسی گری شرمن در نقش نجواگر هالیوود، که بخشی از بخش محتوای سرگرمی و مشارکت است، به این شرکت پیوست. موقعیت جدید نشان دهنده تمرکز روزافزون شرکت بر گسترش حضور برند لگو در عرصه سرگرمی و فرهنگ است، [ ] شرمن که از WME به لگو می آید، جایی که به عنوان معاون گروه مشاوره بازاریابی سرگرمی فعالیت می کرد، در لس آنجلس مستقر خواهد شد. او مستقیماً به جیل ویلفرت، معاون ارشد لگو در بخش سرگرمی، محتوای مشارکت گزارش می دهد و به عنوان عضوی از تیم رهبری این بخش خدمت خواهد کرد. ویلفرت گفت: «کلسی روابط عمیقی را در میان جوامع استعداد و سرگرمی به همراه می‌آورد، همراه با درک قوی از برند لگو». او می‌داند که چگونه استعدادها، شرکا و ایده‌های مناسب را به روش‌هایی گرد هم بیاورد که احساس تازگی و اصالت داشته باشند، و تجربه و غرایز او ارزشمند خواهد بود، زیرا ما به رشد کار خود در زمینه سرگرمی و فرهنگ ادامه می‌دهیم. شرمن افزود: «با سال‌ها همکاری نزدیک با گروه لگو، از نزدیک توانایی منحصربه‌فرد آن را برای گردآوری سرگرمی‌ها، تجربیات و فرهنگ دیدم. من هیجان زده هستم که از طریق همکاری های بلندپروازانه و متمایز با استعدادها و برندهای استثنایی، این قدرت را تقویت کنم. ما با هم می توانیم راه های جدیدی برای الهام بخشیدن به خلاقیت و بازی و ارتباط با مخاطبان در سراسر جهان ایجاد کنیم. لگو با شراکت‌هایی که به دهه‌ها قبل برمی‌گردد، حضور گسترده‌ای در صنعت سرگرمی و م ده فیلمنامه با تجربه است که در بی بی سی، پارامونت و چندین شرکت تولید مستقل کار می کند. بفتا گفت، علاوه بر تولید، او", "image_url": "https://variety.com/wp-content/uploads/2026/10/Hilary-Rosen.jpg?w=1000&#038;h=563&#038;crop=1", "category": "هوش مصنوعی مولد", "tags": ["سینما"], "datetime_fa": "۵ آبان • ۲۰:۰۵"}, {"source": "Variety", "title": "‘All of a Sudden,’ ‘Clarissa,’ ‘La Gradiva,’ ‘The Invite’ and ‘Tender Loving Care’ Lead Gothams Nominees", "link": "https://variety.com/2026/film/news/gothams-nominees-all-of-a-sudden-clarissa-la-gradiva-the-invite-tender-loving-care-1236932124/", "summary": "All of a Sudden, Clarissa, La Gradiva, The Invite and Tender Loving Care lead the nominations for the 36th edition of The Gothams with four nods each. The Gotham Film Media Institute announced nominations for the 36th edition of The Gothams, singling out 42 feature films and 25 performances in 11 award categories. Clarissa [ ]", "date_str": "2026-10-27T16:30:00+00:00", "hash": "d94b85922c8948d1", "title_fa": "«ناگهان»، «کلاریسا»، «لا گرادیوا»، «دعوت» و «مراقبت محبت آمیز» نامزدهای اصلی گاتهامز شدند", "summary_fa": "به طور ناگهانی، کلاریسا، لا گرادیوا، دعوت و مراقبت محبت آمیز، نامزدهای سی و ششمین نسخه گاتهامز را با چهار تکان دادن سر هر کدام پیشتاز هستند. موسسه رسانه فیلم گاتهام نامزدهای سی و ششمین دوره گاتهامز را اعلام کرد و 42 فیلم بلند و 25 اجرا را در 11 بخش جایزه انتخاب کرد. Clarissa [ ] خوشحالم که نامزدهای امسال را اعلام می کنم. جفری شارپ، مدیر اجرایی مؤسسه رسانه ای فیلم گاتهام، با اعلام این خبر گفت: سال قابل توجهی برای فیلم بود، با تماشاگرانی که برای کارهای جسورانه و متمایز از فیلمسازان اولین بار و هنرمندان شناخته شده به سینما آمدند. نامزدهای امسال، در کنار ادای احترام ما و بازگشت جایزه مخاطب، منعکس کننده این فراوانی است و از جامعه خلاقی که بیش از سه دهه در قلب گاتهامز بوده است، تجلیل می کند. نامزدهای جوایز فیلم گاتهام برای سال 2026 عبارتند از: بهترین فیلم بلند کلاریسا آری اسیری، چوکو اسیری، کارگردانان؛ آری اسیری، چوکو اسیری، ترزا پارک، نیکلاس واینستاک، تهیه کنندگان (NEON) Club Kid Jordan Firstman، کارگردان. مایکل بلوم، الکس کوکو، گالن کور، رایان هلر، تهیه کنندگان (A24) اولین جسی آیزنبرگ، کارگردان. جسی آیزنبرگ، علی هرتینگ، دیو مک‌کاری، اما استون، تهیه‌کنندگان (A24) رویاها در کابوس‌ها شاتارا میشل فورد، کارگردان. نعیما عابد، شاتارا میشل فورد، پین چون لیو، تهیه کنندگان (Lunette Films) دعوت از اولیویا وایلد، کارگردان. بن براونینگ، مگان الیسون، دیوید پرموت، تهیه‌کنندگان (A24) ژوزفین بت د آرائوجو، کارگردان. بت دی آرائوخو، جاش بیرن-گلدن، جما چان، دیوید کاپلان، جاش پیترز، جردن راپاپورت، مارک اچ. Rapaport، Robina Riccitiello، Marina Stabile، Channing Tatum، Crystine Zhang، تهیه کنندگان (Sumerian Pictures)", "image_url": "https://variety.com/wp-content/uploads/2026/10/gothams-nominees.jpg?w=1000&#038;h=563&#038;crop=1", "category": "هوش مصنوعی مولد", "tags": ["سینما"], "datetime_fa": "۵ آبان • ۲۰:۰۰"}, {"source": "Variety", "title": "Russell Brand Trial: Judge Drops Indecent Assault Charge, Replaces It With Attempted Assault Count", "link": "https://variety.com/2026/film/global/russell-brand-trial-judge-drops-indecent-assault-attempted-assault-1236932110/", "summary": "A judge overseeing Russell Brand’s criminal trial has dismissed an indecent assault charge against the British comedian and actor, replacing it with a count of attempted indecent assault. Mr Justice Bennathan made the decision midway through the trial, telling jurors that he had concluded there was “insufficient evidence” to support the indecent assault charge in [ ]", "date_str": "2026-10-27T16:18:57+00:00", "hash": "2f4925b4e1250a8c", "title_fa": "محاکمه برند راسل: قاضی اتهام حمله غیرقانونی را کنار گذاشت و آن را با تعداد تلاش برای حمله جایگزین کرد", "summary_fa": "یک قاضی ناظر بر محاکمه جنایی راسل برند، اتهام تجاوز ناشایست علیه این کمدین و بازیگر بریتانیایی را رد کرده و آن را با اتهام تلاش برای حمله ناشایست جایگزین کرده است. آقای قاضی بناتان در اواسط دادگاه این تصمیم را گرفت و به هیئت منصفه گفت که به این نتیجه رسیده است که \"شواهد کافی\" برای حمایت از اتهام تجاوز ناشایست در [] وجود ندارد. قاضی متعاقباً اتهام اقدام به تعرض ناشایست را در رابطه با همان حادثه ادعایی به کیفرخواست اضافه کرد. در حالی که برند به طور رسمی از تعداد تجاوزات ناشایست اولیه تبرئه شده است، همچنان از هیئت منصفه خواسته می شود تا بررسی کنند که آیا او اقدام به ارتکاب جرم ادعایی کرده است یا خیر. برای رسمی کردن تصمیم، قاضی یک هیئت منصفه را برای صدور حکم بی گناهی در مورد اتهام اصلی انتخاب کرد. بناتان با توصیف این روند به عنوان یک \"فرایند کمی مصنوعی\" به هیئت منصفه گفت: \"متهم راسل برند در این مورد ادعای بی گناهی کرده است.\" این تحول پس از شنیدن چهار اظهارات پلیس توسط برند توسط دادگاه شنیده شد. برند 51 ساله که قبل از شروع کار در هالیوود با فیلم هایی از جمله \"فراموش کردن سارا مارشال\" و \"او را به یونانی ببر\" به عنوان یک کمدین استندآپ و مجری تلویزیون به شهرت رسید، تمام اتهامات مربوط به تخلف را رد کرده است. محاکمه در دادگاه سلطنتی Southwark لندن بر اتهامات شش زن در رابطه با حوادث مربوط به سال‌های 1999 تا 2009 متمرکز است. برند ابتدا با هفت اتهام از جمله سه مورد تجاوز جنسی، سه مورد تجاوز جنسی و یک مورد تجاوز غیرقانونی روبرو بود.", "image_url": "https://variety.com/wp-content/uploads/2026/10/russell-3-1000.jpg?w=1000&#038;h=563&#038;crop=1", "category": "هوش مصنوعی مولد", "tags": ["سینما"], "datetime_fa": "۵ آبان • ۱۹:۴۸"}, {"source": "Billboard", "title": "Donnie Iris, ‘Ah! Leah!’ and ‘The Rapper’ Singer Dies at 83", "link": "https://www.billboard.com/music/rock/donnie-iris-death-ah-leah-the-rapper-singer-dies-obituary-1236368700/", "summary": "Pittsburgh rocker Donnie Iris, best known for his 1981 No. 29 Billboard Hot 100 new wave hit Ah! Leah! and his 1970s Hot 100 No. 2 song The Rapper with the group the Jaggerz, has died at 83. Related Ryan Gosling s Dead Man s Bones Duo Creep Back With Romantic Lost in the Night Video Starring Noah Jupe and Rain Spencer Gone But Not Forgotten: Musicians We Lost in 2026 Taylor Swift, George Strait, Lee Thomas Miller More Celebrated During Nashville Songwriters Hall of Fame Gala The news was shared by Donnie Iris the Cruisers drummer Joe Vitale Jr., who wrote, Tonight, I have some very sad news to share. Many of you may already know about this, but today my boss and friend Donnie Iris passed away at the age of 83, in a Facebook post on Monday (Oct. 26). At the first full show I performed with them in 2021, right before we went on stage, Donnie turned to me and gave me a huge hug. He always had an infectious smile, incredible energy and a wonderous personality. After you meet him, you honestly just love him. You could just sit and talk with him, laugh with him. He was King Cool. No cause of death had been announced at press time. A beloved staple of the Pittsburgh music scene, Elwood City native Iris was diagnosed with bladder cancer in 2023 shortly after his 80th birthday show, later canceling several shows and continuing to perform until announcing his retirement from the stage earlier this month after a final gig at Citizens Live at The Wylie in Pittsburg on Sept. 28. After much thought, and in light of recent health issues, I have made the difficult decision to retire from future concert performances, Iris wrote on Oct. 9. Music has given me far more than I could ever put into words. From the earliest days to every chapter of my life, your support has been a constant source of joy and inspiration. Dominic Ierace was born on Feb. 28, 1943 in New Castle, Pa., and got his start in grade school singing at weddings and talent contests. The man who would grow up to be dubbed Pittsburgh s King Cool of Rock and Roll first played with the doo-wop group The Fabutons in high school, then with the R B/rock cover bands the Tri-Vels and Donnie and the Donnells while at Slippery Rock State College, before dropping out to pursue a music career. He found success pretty quickly with The Rapper from his group The Jaggerz, a swinging rock tune about a smooth-talking dude who uses a series of smarmy lines to pick up women at bars. The song he recorded for Gamble Records (formed", "date_str": "2026-10-27T15:46:33+00:00", "hash": "5b28e9fa00a7d556", "title_fa": "دانی آیریس، «آه! لیا!» و خواننده «رپ» در ۸۳ سالگی درگذشت", "summary_fa": "دانی آیریس، راک‌باز پیتسبورگ، که بیشتر به‌خاطر آهنگ 100 بیلبورد شماره 29 خود در موج جدید Ah! لیا! و آهنگ 100 شماره 2 داغ او در دهه 1970 رپر با گروه جگرز در 83 سالگی درگذشت. Related Dead Man's Bones Duo رایان گاسلینگ با ویدیوی رمانتیک گمشده در شب با بازی نوح جوپ و رین اسپنسر رفته اما فراموش نشده است: نوازندگانی که در سال 2026 گم کردیم تیلور سویفت، جورج استریت، لی توماس میلر بیشتر جشن گرفته شد در طول نشویل اخبار آهنگسازان دان. درامر جو ویتال جونیور، که نوشت، امشب، یک خبر بسیار ناراحت کننده برای به اشتراک گذاشتن دارم. شاید بسیاری از شما قبلاً در مورد این موضوع بدانید، اما امروز رئیس و دوست من دانی آیریس در سن 83 سالگی در یک پست فیس بوک در روز دوشنبه (26 اکتبر) درگذشت. در اولین نمایش کاملی که با آنها در سال 2021 اجرا کردم، درست قبل از اینکه روی صحنه برویم، دانی به سمت من برگشت و مرا در آغوش گرفت. او همیشه لبخندی عفونی، انرژی باورنکردنی و شخصیتی شگفت انگیز داشت. بعد از ملاقات با او، صادقانه او را دوست دارید. شما فقط می توانید با او بنشینید و صحبت کنید، با او بخندید. او کینگ کول بود. هیچ علت مرگ در زمان مطبوعات اعلام نشده بود. آیریس اهل الوود سیتی که یکی از اعضای محبوب صحنه موسیقی پیتزبورگ است، در سال 2023 کمی پس از نمایش 80 سالگی اش به سرطان مثانه مبتلا شد، بعداً چندین برنامه را لغو کرد و تا اعلام بازنشستگی خود از صحنه در اوایل این ماه پس از اجرای آخرین کنسرت در Citizens Live در The Wylie 28 Sept در پیت، به اجرای برنامه ادامه داد. آیریس در 9 اکتبر نوشت، پس از تفکر زیاد، و با توجه به مسائل بهداشتی اخیر، تصمیم سختی برای بازنشستگی از کنسرت‌های آینده گرفتم.", "image_url": "https://www.billboard.com/wp-content/uploads/2026/10/donnie-iris-1982-billboard-1800.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["موسیقی"], "datetime_fa": "۵ آبان • ۱۹:۱۶"}, {"source": "Billboard", "title": "Tate McRae, Olivia Rodrigo, Chappell Roan & More: Highlights of This Week’s Billboard Charts", "link": "https://www.billboard.com/lists/tate-mcrae-olivia-rodrigo-chappell-roan-chart-highlights-oct/", "summary": "Tuesday is new Billboard chart day each week! As all charts update each Tuesday, here’s a look at highlights of the latest rankings, dated Oct. 31 and reflecting the Oct. 16-22 measurement week, according to data tracker Luminate. Among this week’s chart stars are Tate McRae, Olivia Rodrigo, Chappell Roan, Zach Bryan and Lana Del Rey. Thanks to new releases, multiple stars are at career-high ranks, led by McRae, who claims her highest Billboard Hot 100 placement as a lead act as “Housewife” debuts at No. 2. The song also arrives as her second No. 1 on both the Billboard Global 200 and Billboard Global Excl. U.S. Related Olivia Rodrigo’s ‘You Seem Pretty Sad for a Girl So in Love’ Returns to No. 1 on Billboard 200 Roan matches her Hot 100 best as “Expectations,” with Olivia Rodrigo, bounds 63-3. The song surges following the Oct. 15 release of its remix and video, adding Roan. It was originally released in June by Rodrigo only on her album you seem pretty sad for a girl so in love . Plus, Del Rey ties her top Hot 100 showing as Bryan’s “Lies,” on which she’s featured, launches at No. 4. It’s her third top 10, following her featured role on Taylor Swift’s “Snow on the Beach” in 2022 and her own “Summertime Sadness,” with Cedric Gervais (No. 6, 2013). “Lies” is from Bryan’s Young Manhood and Other Donatable Organs , which starts as his fifth No. 1 on Top Country Albums, Top Rock Albums and Americana/Folk Albums. Read on for more key highlights from this week’s Billboard charts below. For a deeper dive into all of the above and more, go to Billboard ’s Chart Beat hub, sign up for the weekly Chart Beat newsletter , among other e-blasts, and browse the full menu of Billboard ’s charts, which refresh every Tuesday (and each Wednesday during holiday weeks).", "date_str": "2026-10-27T15:35:45+00:00", "hash": "1e10e09402418621", "title_fa": "تیت مک‌ری، اولیویا رودریگو، چاپل روان و موارد دیگر: نکات برجسته نمودارهای بیلبورد این هفته", "summary_fa": "سه شنبه هر هفته روز جدید نمودار بیلبورد است! طبق گزارش ردیاب داده Luminate، از آنجایی که همه نمودارها هر سه شنبه به روز می شوند، در اینجا نگاهی به نکات مهم آخرین رتبه بندی، در تاریخ 31 اکتبر و منعکس کننده هفته اندازه گیری 16 تا 22 اکتبر است. از جمله ستاره‌های این هفته می‌توان به تیت مک‌ری، اولیویا رودریگو، چاپل روآن، زک برایان و لانا دل ری اشاره کرد. به لطف نسخه‌های جدید، چندین ستاره در رتبه‌های بالای حرفه‌ای قرار دارند، به رهبری مک‌ری، که ادعا می‌کند بالاترین جایگاه خود را در بیلبورد Hot 100 به‌عنوان نقش اصلی به‌عنوان «خانه‌دار» در رتبه 2 قرار می‌دهد. این آهنگ همچنین به عنوان دومین شماره 1 او در بیلبورد جهانی 200 و بیلبورد جهانی می‌رسد. یو.اس.روان با الیویا رودریگو با امتیاز 63-3 بهترین رقابت خود را در 100 داغ خود به عنوان \"انتظارات\" دارد. این آهنگ پس از انتشار ریمیکس و ویدیوی خود در 15 اکتبر افزایش یافت و Roan را اضافه کرد. این در ابتدا توسط رودریگو در ژوئن منتشر شد و تنها در آلبوم او به نظر می رسد که برای دختری بسیار عاشق غمگین به نظر می رسد. به‌علاوه، دل ری بهترین نمایش 100 داغ خود را به عنوان «دروغ‌ها» از برایان، که در آن نقش‌آفرینی می‌کند، در رتبه 4 قرار می‌گیرد. این سومین 10 نمایش برتر او پس از نقش برجسته‌اش در «برف در ساحل» تیلور سویفت در سال 2022 و «Summertime Sadness, 30، C2» (No.30, Gerricvais) است. «دروغ‌ها» از «جوانمردی و سایر اعضای قابل اهدای برایان» است که به عنوان پنجمین شماره او شروع می‌شود. 1 در آلبوم‌های برتر کشور، آلبوم‌های راک برتر و آلبوم‌های آمریکایی/فولک. برای اطلاعات مهم بیشتر از نمودارهای بیلبورد این هفته در زیر بخوانید. \"Choosin' Texas\" برای بیست و پنجمین هفته رکورددار خود در صدر 100 رکورددار است. همزمان، آلبوم مادر قاصدک", "image_url": "https://www.billboard.com/wp-content/uploads/2026/10/olivia-rodrigo-chappell-roan-expectations-Phoenix-Johnson-billboard-1800.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["موسیقی"], "datetime_fa": "۵ آبان • ۱۹:۰۵"}, {"source": "Billboard", "title": "Ariana Grande Shines Brighter Than a Christmas Tree in Luxury Brand’s Musical Holiday Spectacular Campaign Video", "link": "https://www.billboard.com/music/music-news/ariana-grande-swarovski-musical-holiday-campaign-video-1236368690/", "summary": "Who needs Christmas tree ornaments when you ve already got all the sparkle you need? Ariana Grand e raises the question through her shimmering new Swarovski holiday musical campaign, which the iconic jewelry brand unveiled Tuesday (Oct. 27). Related Ariana Grande Is So Honored to Be the New Ambassador for This Sparkling Brand Ariana Grande Shows Off New Bob That Has Boyfriend Ricky Alvarez Falling in Love All Over Again Ariana Grande Mourns Coco, Her Beloved Dog of 17 Years: I Will Miss You Every Day Soundtracked by a theatrical orchestral arrangement that switches back and forth between jazzy and classical styles, the minute-long video opens with the pop star in a white suit and top hat, outfitted with many silver gems and brooches. She then leads a group of similarly dapper-looking backup dancers in a routine on a grand staircase before the scene switches to Grande in a princess gown surrounded by pink feathers. Other scenes in the sequence show Grande poking her head inside a festive dollhouse to hand a present to its miniature residents and channeling her inner ballerina in a Swan Lake -inspired sequence. At the end, the video cuts to the Wicked actress watching the ad in a theater, cheering as the credits roll before winking at the camera. Grande has been the face of Swarovski since July 2024 and has starred in a number of seasonal campaigns for the brand, including visuals for Valentine s Day, summer and one called Ariana Grande’s Fantasy Garden Comes to Life. I cannot wait to embark on this journey and to inspire others to embrace their own unique sparkle, she stated when the partnership was first announced. The Grammy winner is currently on a break from the public eye since the conclusion of her Eternal Sunshine Tour in September. Her rep announced she d be taking time away from the spotlight in August amid a spike in public scrutiny stemming from her physical appearance in the Petal music video. Billboard later confirmed that Grande still planned to do promo for her upcoming film, Focker-in-Law , as well as her brands, including R.E.M. Beauty. Watch Grande sparkle in Swarovski s new holiday campaign above.", "date_str": "2026-10-27T15:30:41+00:00", "hash": "264b981475c52a5d", "title_fa": "آریانا گرانده در ویدیوی کمپین تماشایی موزیکال تعطیلات برند لوکس، درخشان تر از درخت کریسمس می درخشد.", "summary_fa": "چه کسی به زیور آلات درخت کریسمس نیاز دارد وقتی که شما تمام درخشش مورد نیاز خود را دارید؟ آریانا گرند ای این سوال را از طریق کمپین موسیقی درخشان جدید خود در تعطیلات سواروسکی که این برند جواهرات نمادین روز سه شنبه (27 اکتبر) رونمایی کرد، مطرح می کند. آریانا گرانده بسیار مفتخر است که سفیر جدید این برند درخشان است. این ویدئوی یک دقیقه‌ای با سبک‌های جازی و کلاسیک با ستاره پاپ با کت و شلوار سفید و کلاه بالا، مجهز به جواهرات نقره و سنجاق‌های فراوان آغاز می‌شود. او سپس گروهی از رقصندگان پشتیبان با ظاهری شبیه به هم را در یک روال روی پلکانی بزرگ پیش از اینکه صحنه به گرانده در لباس شاهزاده خانمی که با پرهای صورتی احاطه شده است تغییر کند، رهبری می کند. صحنه‌های دیگر این سکانس نشان می‌دهد که گرانده سرش را در داخل یک عروسک‌خانه جشن می‌برد تا هدیه‌ای را به ساکنان مینیاتوری آن بدهد و بالرین درونی‌اش را در سکانسی الهام‌گرفته از دریاچه قو هدایت می‌کند. در پایان، این ویدیو به بازیگر Wicked مربوط می‌شود که در حال تماشای آگهی در یک تئاتر است و در حالی که تیتراژ پخش می‌شود قبل از چشمک زدن به دوربین، تشویق می‌کند. گرانده از جولای 2024 چهره سواروسکی بوده است و در تعدادی از کمپین های فصلی این برند، از جمله تصاویری برای روز ولنتاین، تابستان و یکی به نام باغ فانتزی آریانا گراند به زندگی می آید، ایفای نقش کرده است. او زمانی که برای اولین بار این همکاری را اعلام کرد، نمی‌توانم صبر کنم تا این سفر را آغاز کنم و دیگران را تشویق کنم تا درخشش منحصر به فرد خود را در آغوش بگیرند. برنده گرمی در حال حاضر از زمان پایان تور Eternal Sunshine خود در ماه سپتامبر، از انظار عمومی فاصله گرفته است. نماینده او در ماه", "image_url": "https://www.billboard.com/wp-content/uploads/2026/10/ariana-grande-swarovski-holiday-screenshot-billboard-1800.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["سینما", "موسیقی"], "datetime_fa": "۵ آبان • ۱۹:۰۰"}, {"source": "Billboard", "title": "50 Cent Sues Rick Ross Ex in $6M Defamation Lawsuit Over ‘Offensive’ Posts About Teenage Son", "link": "https://www.billboard.com/pro/50-cent-sues-rick-ross-ex-over-posts-about-teenage-son/", "summary": "50 Cent is suing Rick Ross ex-girlfriend over highly offensive social media posts about his 14-year-old son, including “sexually degrading” insults and a “fabricated medical diagnosis.” In a lawsuit Monday (Oct. 26) in Los Angeles federal court, attorneys for the rapper (Curtis Jackson) accuse Tiallondra Tia Kemp of defamation over her posts last week about Sire Jackson, in which she claimed he had autism due to conduct by his mother, Daphne Joy, when she was pregnant with him. Related 50 Cent Says He Had a Strong Feeling Suspect Accused of Assaulting Rick Ross Son Was Innocent After Posting Bond Kenny MacPherson, Veteran Music Publisher and Big Deal Music Co-Founder, Dies at 71 Diddy Moved From New Jersey Prison to Similar Facility in Pennsylvania “Ms. Kemp shamelessly used the label ‘on the spectrum’ as a pejorative slur hurled at a child to humiliate him and his family. But autism is not shameful,” 50 Cent’s lawyers write. “What is shameful is fabricating a diagnosis for a private child, inventing a sexually degrading cause for it, and broadcasting both to a mass audience.” The star’s lawyers say the offensive comments, under an Instagram photo of Sire and his parents, were made as part of an effort “to settle a score with his father” via a “a mass-audience campaign of falsehood and sexual degradation.” “This action arises from a grown adult’s deliberate decision to use a young child as a prop and a punchline in order to wound the child’s father,” 50 Cent’s lawyers write. “S.J. is a minor and not a public figure.” Monday’s federal lawsuit, obtained and first reported by Billboard , builds on a case filed earlier that day in Florida court, in which 50 accused Kemp of cyberstalking and harassing Sire. That case, which also seeks a restraining order, was first reported by TMZ. According to the new California lawsuit, the full caption under Kemp’s original post of Sire and his mother read: “Btchhhh azzzz @50cent U wanna play? U have NO room to post anyone’s child when urs on the spectrum and the reason being this hoooo was still swallowing 10,000 gallons of CUMMM when she was pregnant.” Kemp s comments appear to have been in response to posts earlier this month in which 50 Cent trolled Ross over an alleged assault on his 21-year-old son, whom he shares with Kemp. The rapper posted an image of the suspected assailant s mugshot and joked that he would bail him out. Kemp later repeated her claims several times, according to 50 Cent s lawyers, including in more", "date_str": "2026-10-27T15:26:29+00:00", "hash": "76fadccfe409b2c4", "title_fa": "شکایت 50 سنت از ریک راس سابق در شکایت 6 میلیون دلاری افترا به دلیل پست های توهین آمیز درباره پسر نوجوان", "summary_fa": "50 سنت از دوست دختر سابق ریک راس به دلیل پست های بسیار توهین آمیز در رسانه های اجتماعی در مورد پسر 14 ساله اش، از جمله توهین های \"تحقیر آمیز جنسی\" و \"تشخیص پزشکی ساختگی\" شکایت کرد. وکلای خواننده رپ (کرتیس جکسون) در شکایتی در روز دوشنبه (26 اکتبر) در دادگاه فدرال لس آنجلس، تیالوندرا تیا کمپ را به توهین به خاطر پست های هفته گذشته خود در مورد سر جکسون متهم کردند که در آن او ادعا کرد که او به دلیل رفتار مادرش دافنه جوی در زمان بارداری او به اوتیسم مبتلا شده است. مرتبط 50 سنت می گوید که او مظنونی با احساس قوی داشت که متهم به حمله به ریک راس پسر پس از ارسال باند کنی مک فرسون، ناشر کهنه کار موسیقی و یکی از بنیانگذاران موسیقی Big Deal، بی گناه بود. دیدی در سن 71 سالگی درگذشت. وکلای 50 سنت می نویسند: \"در طیف\" به عنوان یک توهین توهین آمیز به کودک برای تحقیر او و خانواده اش می گویند. \"آنچه شرم آور است، جعل تشخیص برای یک کودک خصوصی، ابداع دلیل تحقیرآمیز جنسی برای آن، و پخش هر دو برای مخاطبان انبوه است.\" وکلای این ستاره می گویند که این اظهارات توهین آمیز، زیر عکس اینستاگرامی Sire و والدینش، به عنوان بخشی از تلاش \"برای حل و فصل اختلاف با پدرش\" از طریق \"یک کمپین انبوه مخاطبان دروغ و تحقیر جنسی\" صورت گرفته است. وکلای 50 سنت می نویسند: \"این اقدام ناشی از تصمیم عمدی یک بزرگسال برای استفاده از یک کودک خردسال به عنوان تکیه گاه و ضربه مشت برای زخمی کردن پدر کودک است.\" S.J یک فرد صغیر است و یک شخصیت عمومی نیست. دعوای فدرال روز دوشنبه که بیلبورد به دست آورد و برای اولین بار گزارش داد، مبتنی بر پرونده ای است که اوایل همان روز در دادگاه", "image_url": "https://www.billboard.com/wp-content/uploads/2026/10/1454532706-e1793113299798.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["موسیقی"], "datetime_fa": "۵ آبان • ۱۸:۵۶"}, {"source": "Billboard", "title": "BET Revamps the Soul Train Awards: ‘We Knew This Couldn’t Be a Granddaddy’ Show", "link": "https://www.billboard.com/pro/bet-revamps-soul-train-awards-couldnt-be-granddaddy-show/", "summary": "When the Soul Train Awards return on Nov. 27 after a two-year hiatus, BET president Louis Carr is promising viewers one thing. “We knew this couldn’t be a granddaddy Soul Train,” he tells Billboard . “We knew we had to celebrate the past — but also introduce the future of R B.” With that in mind, this year s Soul Train Awards will feature only two fan-voted categories: R B/Soul Song of the Year, with voting on BET.com and Spotify’s RNB X International Artist, with voting in the Spotify app. The revamped format for the two-hour show will also be comprised of tributes to three special artist honorees representing Classic Soul, New Soul and Soul Personified. Chaka Khan was recently announced as the 2026 recipient of the Classic Soul Honor. On Tuesday (Oct. 27), it was revealed that Durand Bernarr will be presented with the Soul Personified Honor. Related Here Are Special Award Recipients Performers for the 2026 Soul Train Awards: Updating List Ryan Gosling s Dead Man s Bones Duo Cre Charades، گفت: \"واردات دیدگاه جدیدی را در مورد ورزشی ارائه می دهد که مدت ها توسط تسلط ایالات متحده بر تصویر جهانی بسکتبال شکل گرفته است. در صربستان، بسکتبال چیزی بیش از یک بازی است - یک دین است.\" «پل اسکاردوف فضای منحصر به فرد و خشن آن را به تصویر می کشد و داستانی", "image_url": "https://variety.com/wp-content/uploads/2026/10/261021-IMPORT-KEYART-1_Norman-Wong.jpg?w=1000&#038;h=563&#038;crop=1", "category": "هوش مصنوعی مولد", "tags": ["سینما"], "datetime_fa": "۵ آبان • ۱۸:۴۷"}, {"source": "Variety", "title": "Sosie Bacon Joins Nikolaj Coster-Waldau in ‘Black Tapes’ Series at MGM+", "link": "https://variety.com/2026/tv/news/sosie-bacon-nikolaj-coster-waldau-black-tapes-series-mgm-1236932042/", "summary": "Sosie Bacon is set for a lead role in the upcoming MGM+ series The Black Tapes, Variety has learned. Bacon will star in the series alongside previously announced cast member Nikolaj Coster-Waldau. As previously reported, the show is based on the hit horror podcast of the same name and will begin production on its eight-episode [ ]", "date_str": "2026-10-27T15:00:00+00:00", "hash": "d096129a82e8b7ab", "title_fa": "سوسی بیکن به نیکولای کوستر والداو در سریال «نوارهای سیاه» در MGM+ می‌پیوندد.", "summary_fa": "ورایتی دریافته است که سوسی بیکن قرار است در سریال آینده MGM+ The Black Tapes ایفای نقش کند. بیکن در این سریال در کنار نیکولای کوستر والدائو، بازیگری که قبلا اعلام شده بود، بازی خواهد کرد. همانطور که قبلاً گزارش شده بود، این سریال بر اساس پادکست ترسناک پرطرفدار با همین نام ساخته شده است و تولید آن در هشت قسمت آغاز خواهد شد [ ] در لاگ لاین رسمی آمده است: «Dr. ریچارد استرند (کاستر والداو)، روانپزشکی درخشان با گذشته ای مرموز، با دانشمند وسواس و بی رحم الکس ریگان (بیکن) همکاری می کند تا موارد ماوراء الطبیعه تسخیر، دارایی ها، ناپدید شدن ها و افسانه های شوم - نوارهای سیاه بدنام را از بین ببرند. اما همانطور که استرند و ریگان رازهای این رویدادها را کشف می کنند، دنیای پنهانی را در پشت دنیای ما کشف می کنند و باید یک توطئه آخرالزمانی چند صد ساله را کشف کنند. داستان‌های مرتبط تیلور سوئیفت صدمین هفته خود را در جایگاه شماره 1 بیلبورد 200 سپری می‌کند، زیرا Life of a Showgirl در هفته 2 از Encore Rebound، Patient Zero تیلور سویفت در رتبه اول باقی می‌ماند. 1 برای هفته دوم در نمودار مجردها، ریگان بیشتر به عنوان یک فیزیکدان باهوش و روشمند توصیف می‌شود که به تحقیقات نوارهای سیاه به عنوان یک افشاگر می‌پیوندد، اما به سرعت آموزش‌های بسیار علمی خود را می‌یابد به این معنی که نمی‌تواند شواهد فزاینده‌ای را نادیده بگیرد که این اسرار شامل چیزی فراتر از دنیای طبیعی است. بیکن اخیراً فیلمبرداری فصل 2 اسکارپتا را برای آمازون به پایان رسانده و همچنین در نمایش هایی مانند Mare of Easttown، Narcos: Mexico و 13 Reasons Why بازی کرده است. در این فیلم، او در فیلم‌هایی از جمله لبخند و لبخند ۲ ایفای نقش کرده است و در ادامه در فیلم کمدی ترسناک خانوادگی که توسط", "image_url": "https://variety.com/wp-content/uploads/2026/10/Sosie-Bacon-Headshot-Photo-Credit-Martin-Rusch-e1793111187794.png?w=1000&#038;h=563&#038;crop=1", "category": "هوش مصنوعی مولد", "tags": ["سینما"], "datetime_fa": "۵ آبان • ۱۸:۳۰"}, {"source": "Billboard", "title": "How KATSEYE’s Sophia Laforteza Made ‘Forgotten Island’ INXS Cover Her Own: ‘She Really Has the Story in Her DNA’", "link": "https://www.billboard.com/culture/tv-film/katseye-sophia-laforteza-forgotten-island-inxs-cover-video-1236368521/", "summary": "With Forgotten Island s central story of friendship and themes inspired by Philippines mythology, Filipino-American singer Sophia Laforteza of the global girl group KATSEYE was a fitting pick to make music for the DreamWorks Animation film. In a new digital bonus feature debuting exclusively on Billboard , Sophia and her collaborators including composer Nathan Matthew David, producer Mike Elizondo and writers/directors Joel Crawford and Januel P. Mercado take viewers inside the studio to discuss the making of her cover of INXS Never Tear Us Apart for the film, which arrives on digital platforms Tuesday (Oct. 27) with more than 60 minutes of bonus content. Related KATSEYE s Sophia Says Her INXS Cover for Forgotten Island Is The Most Sophia Thing I Could Do Why Filipino Pop Powerhouses SB19 BINI Are Embracing the Grammys Asian Pop Category: We See It as a Door Opening, Not a Box Closing SB19 Has No Plans to Stop Breaking Barriers: It Feels Like We re Unstoppable ‘Never Tear Us Apart’ is really kind of the journey of this movie and of the girls’ friendship – their anthem, in a way, Crawford says of lead besties Raissa and Jo (voiced by singer/songwriter H.E.R.). For Sophia and Mike and Nathan to make it an interpretation that stands on its own is an incredible accomplishment, Mercado adds of reinterpreting the 1988 top 10 Billboard Hot 100 hit for INXS. For David, Sophia immediately impressed him in the studio. Right from the beginning of her vocal session, we knew it was going to be really special. I think she just sang the hell out of this song. Sophia s personal connection to the film as a Filipino American was what drove home the musical connection. Hearing her talk about how she really has the story in her DNA, in her soul what she brought to this, I can’t imagine anyone else, Crawford says. That story was Sophia s north star as she navigated making Never Tear Us Apart her own. As a performer, my strength is, if you tell me what the story is, I’ll tell it the best way that I can, she says in the bonus feature. I got to watch the scene while singing it, and I really tried to take every ounce of knowledge I knew just growing up in this world. This is one of the most beautiful things I think I’ll ever do. Watch the full bonus feature here: Sophia is currently on hiatus from KATSEYE, but HYBE announced earlier this month that she plans to return to group activities in January 2027. She stepped back from the group in August to focus on her mental health, mean", "date_str": "2026-10-27T15:00:00+00:00", "hash": "0a1479e7cb08f702", "title_fa": "سوفیا لافورتزا از KATSEYE چگونه «جزیره فراموش شده» را ساخت INXS پوشش خود را: «او واقعاً داستان را در DNA خود دارد»", "summary_fa": "سوفیا لافورتزا، خواننده فیلیپینی-آمریکایی از گروه جهانی دختران KATSEYE، با داستان اصلی دوستی جزیره فراموش شده و مضامین الهام گرفته شده از اساطیر فیلیپین، انتخاب مناسبی برای ساخت موسیقی برای فیلم انیمیشن DreamWorks بود. سوفیا و همکارانش از جمله آهنگساز ناتان متیو دیوید، تهیه کننده مایک الیزوندو و نویسندگان/کارگردانان جوئل کرافورد و ژانوئل پی. Mercado بینندگان را به داخل استودیو می برد تا درباره ساخت کاور INXS Never Tear Us Apart برای این فیلم که از سه شنبه (27 اکتبر) روی پلتفرم های دیجیتالی با بیش از 60 دقیقه محتوای جایزه می آید، بحث کنند. سوفیای مرتبط KATSEYE می گوید جلد INXS او برای Forgotten Island بهترین کاری است که می توانم انجام دهم چرا پاپ پاپ فیلیپینی SB19 BINI دوباره گرمی را پذیرفته است رده: ما آن را به عنوان یک درب باز می بینیم، نه یک جعبه بسته شدن SB19 هیچ برنامه ای برای توقف آن ندارد. «هرگز ما را از هم جدا نکن» واقعاً نوعی سفر این فیلم و دوستی دختران است – سرود آن‌ها، به نوعی، کرافورد درباره بهترین بازیگران اصلی رایسا و جو (با صدای خواننده/ترانه‌سرا H.E.R.) می‌گوید. برای سوفیا و مایک و ناتان که تفسیری بی‌نظیر از آن بسازند، موفقیتی باورنکردنی است، مرکادو تفسیر مجدد 10 موفقیت برتر بیلبورد 100 برتر سال 1988 را برای INXS اضافه می‌کند. برای دیوید، سوفیا بلافاصله او را در استودیو تحت تأثیر قرار داد. درست از ابتدای جلسه آواز او، ما می دانستیم که واقعاً خاص خواهد بود. من فکر می کنم او فقط از این آهنگ جهنم خوانده است. ارتباط شخصی سوفیا با فیلم به عنوان یک آمریکایی فیلیپینی چیزی بود که ارتباط موسیقی را به خانه رساند. کرافورد می‌گوید با شنیدن صحبت‌های او درباره اینکه واقعاً چگونه داستان را در DNA خود دارد، در روحش که چه چیزی را به این موضوع رساند، نمی‌توانم شخص دیگری", "image_url": "https://www.billboard.com/wp-content/uploads/2026/10/sophia-laforteza-forgotten-island-2026-billboard-1800.png?w=1024", "category": "هوش مصنوعی مولد", "tags": ["سینما", "موسیقی"], "datetime_fa": "۵ آبان • ۱۸:۳۰"}, {"source": "Billboard", "title": "Here Are Special Award Recipients & Performers for the 2026 Soul Train Awards: Updating List", "link": "https://www.billboard.com/lists/soul-train-awards-2026-special-awards-recipients-performers/", "summary": "BET is starting to announce the talent that will appear on the 2026 Soul Train Awards . The show, hosted by actor Anthony Anderson , will air on BET on Friday, Nov. 27, at 8 p.m. ET/PT, with a simulcast on CBS, BET Her, VH1, MTV2 and LOGO. Grammy-winning singer, songwriter and producer Durand Bernarr will receive the Soul Personified Honor and perform on the show. Bernarr will also host the 2026 Soul Train Awards Red Carpet Show: Back on Track . This digital experience is billed as “a reimagination of the traditional red carpet.” Chaka Khan has already been announced as the recipient of the Classic Soul Honor. Related Chaka Khan to Receive Classic Soul Honor at 2026 Soul Train Awards This is the first Soul Train Awards since 2023 and the first ever to simulcast on CBS. The two-hour show will tape on Thursday, Nov. 5, in Chicago. Anderson, best known for his role on ABC’s long-running Black-ish , previously hosted the Soul Train Awards in 2013. The show will be light on competitive award categories (just two, both fan-voted) but heavy on special awards and performances. In addition, the show will crown the greatest R B song of the 2020s, according to the fans. Connie Orlando serves as the executive producer of the 2026 Soul Train Awards for BET. Jesse Collins Entertainment is the production company for the show, with Jesse Collins , Dionne Harmon and Jeannae Rouzan-Clay also serving as executive producers. Here are award recipients and performers that have been announced so far for the 2026 Soul Train Awards. This post will be updated as additional names are announced.", "date_str": "2026-10-27T15:00:00+00:00", "hash": "f3541e2e866b9a97", "title_fa": "در اینجا دریافت کنندگان و مجریان جوایز ویژه برای جوایز Soul Train 2026 آمده اند: لیست به روز رسانی", "summary_fa": "BET شروع به اعلام استعدادهایی می کند که در جوایز Soul Train 2026 ظاهر می شوند. این برنامه با مجری گری بازیگر آنتونی اندر     let currentTab = 'persian';
    let searchQuery = '';
    let readArticles = new Set(JSON.parse(localStorage.getItem('read_articles_registry') || '[]'));

    function toFaDigits(n) {
      const f = ['۰','۱','۲','۳','۴','۵','۶','۷','۸','۹'];
      return n.toString().replace(/\d/g, d => f[d]);
    }

    function toggleRead(hash) {
      if (readArticles.has(hash)) {
        readArticles.delete(hash);
      } else {
        readArticles.add(hash);
      }
      localStorage.setItem('read_articles_registry', JSON.stringify(Array.from(readArticles)));
      renderNews();
    }

    function renderNews() {
      const container = document.getElementById('newsContainer');
      const rawItems = data[currentTab] || [];
      
      const filtered = rawItems.filter(item => {
        if (!searchQuery) return true;
        const q = searchQuery.toLowerCase();
        const title = (item.title_fa || item.title || '').toLowerCase();
        const summary = (item.summary_fa || item.summary || '').toLowerCase();
        const source = (item.source || '').toLowerCase();
        const category = (item.category || '').toLowerCase();
        const tags = (item.tags || []).join(' ').toLowerCase();
        return title.includes(q) || summary.includes(q) || source.includes(q) || category.includes(q) || tags.includes(q);
      });

      const unreadList = [];
      const readList = [];

      filtered.forEach(item => {
        if (readArticles.has(item.hash)) {
          readList.push(item);
        } else {
          unreadList.push(item);
        }
      });

      const sortedItems = [...unreadList, ...readList];

      if (sortedItems.length === 0) {
        container.innerHTML = '<div style="text-align:center; padding: 40px; color: var(--text-muted);">هیچ خبری در این بخش در ۲۴ ساعت گذشته ثبت نشده است.</div>';
        return;
      }

      container.innerHTML = sortedItems.map((item, idx) => {
        const title = item.title_fa || item.title || '';
        const summary = item.summary_fa || item.summary || '';
        const source = item.source || 'منبع خبر';
        const link = item.link || '#';
        const isRead = readArticles.has(item.hash);
        const num = toFaDigits(idx + 1);
        const category = item.category || '';
        const tags = item.tags || [];
        const datetimeFa = item.datetime_fa || '';

        return `
          <article class="news-card ${isRead ? 'is-read' : ''}" id="card-${item.hash}">
            <div class="news-header">
              <span class="news-num">${isRead ? '✓' : num}</span>
              <h2 class="news-title">${title}</h2>
            </div>
            ${summary ? `<p class="news-summary">${summary}</p>` : ''}
            <div class="news-footer">
              <div class="footer-top-row">
                <div class="meta-group">
                  <span class="news-source">📌 ${source}</span>
                  ${datetimeFa ? `<span class="news-datetime">🕒 ${datetimeFa}</span>` : ''}
                  ${category ? `<span class="news-category-badge" onclick="filterByTag('${category}')">📂 ${category}</span>` : ''}
                </div>
              </div>
              ${tags && tags.length > 0 ? `
                <div class="footer-tags-row">
                  ${tags.map(t => `<span class="news-tag-chip" onclick="filterByTag('${t}')">#${t}</span>`).join('')}
                </div>
              ` : ''}
              <div class="footer-bottom-row">
                <div class="footer-actions-right">
                  <button class="btn-mark-read" onclick="toggleRead('${item.hash}')">
                    ${isRead ? '✓ خوانده شد' : '○ علامت خوانده‌شده'}
                  </button>
                </div>
                <div class="footer-actions-left">
                  ${link && link.startsWith('http') ? `<a href="${link}" target="_blank" rel="noopener noreferrer" class="news-link">مطالعه اصل خبر ↗</a>` : ''}
                </div>
              </div>
            </div>
          </article>
        `;
      }).join('');
    }

    function filterByTag(val) {
      const searchInput = document.getElementById('searchInput');
      if (searchInput) {
        searchInput.value = val;
        searchQuery = val;
        renderNews();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    }

    function switchTab(tab, el) {
      currentTab = tab;
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      if (el) el.classList.add('active');
      renderNews();
    }

    function toggleTheme() {
      const html = document.documentElement;
      const current = html.getAttribute('data-theme') || 'dark';
      const next = current === 'dark' ? 'light' : 'dark';
      html.setAttribute('data-theme', next);
      localStorage.setItem('theme', next);
      updateThemeButton(next);
    }

    function updateThemeButton(theme) {
      const icon = document.getElementById('themeIcon');
      const text = document.getElementById('themeText');
      if (theme === 'dark') {
        icon.textContent = '☀️';
        text.textContent = 'حالت روشن';
      } else {
        icon.textContent = '🌙';
        text.textContent = 'حالت تاریک';
      }
    }

    function toggleArchiveModal(show) {
      const modal = document.getElementById('archiveModal');
      if (show) {
        renderArchiveList();
        modal.classList.add('active');
      } else {
        modal.classList.remove('active');
      }
    }

    function renderArchiveList() {
      const listContainer = document.getElementById('archiveListContainer');
      if (!archiveManifest || archiveManifest.length === 0) {
        listContainer.innerHTML = '<div style="text-align:center; padding: 20px; color: var(--text-muted);">هنوز شماره قبلی ثبت نشده است.</div>';
        return;
      }

      listContainer.innerHTML = archiveManifest.map(item => `
        <a href="${item.url}" class="archive-item">
          <div>
            <div class="archive-date-fa">📰 شماره ${item.p_date}</div>
            <div class="archive-date-g">🌍 ${item.g_date}</div>
          </div>
          <span class="archive-arrow">←</span>
        </a>
      `).join('');
    }

    const savedTheme = localStorage.getItem('theme') || 'dark';
    document.documentElement.setAttribute('data-theme', savedTheme);
    updateThemeButton(savedTheme);

    document.getElementById('searchInput').addEventListener('input', (e) => {
      searchQuery = e.target.value.trim();
      renderNews();
    });

    renderNews();
  </script>
