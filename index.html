زب‌الله همچنان از اعتماد ۵۹.۵درصد پاسخ‌دهندگان برخوردار است. این تفاوت نشان می‌دهد که اعتماد به حزب‌الله لزوما به معنای حمایت از ادامه فعالیت نظامی مستقل آن نیست. در مقابل، ۷۸.۵درصد پاسخ‌دهندگان به ارتش لبنان اعتماد دارند و بیش از نیمی از آن‌ها ارتش را مناسب‌ترین نهاد برای تامین امنیت بلندمدت کشور می‌دانند. این نتایج در شرایطی منتشر شده که حزب‌الله برای حفظ موقعیت خود در لبنان، برنامه تازه‌ای برای پرداخت کمک‌های مالی به خانواده‌های آسیب‌دیده از جنگ اعلام کرده است. پیشتر رویترز گزارش داده بود که جمهوری اسلامی اخیرا ۲۰۰میلیون دلار در اختیار حزب‌الله لبنان قرار داده است. «علی دعموش»، رییس شورای اجرایی حزب‌الله، روز سه‌شنبه ۲۱مهر۱۴۰۵ گفت خانواده‌هایی که خانه اصلی آن‌ها در جنگ امسال با اسراییل تخریب شده یا غیر‌قابل سکونت است، تا ۱۴هزار دلار کمک دریافت خواهند کرد. براساس این طرح، خانواده‌های واجد شرایط در بیروت و حومه جنوبی پایتخت لبنان، ۱۴هزار دلار شامل هشت هزار دلار برای اثاثیه و شش هزار دلار برای اجاره دریافت می‌کنند. مبلغ کمکی، در دیگر مناطق لبنان ۱۲هزار دلار است. نتایج نظرسنجی تازه، در کنار ادامه حمایت سیاسی، نظامی و مالی تهران، تصویری تازه از موقعیت کنونی حزب‌الله ارایه می‌دهد؛ گروهی که همچنان بخشی از"}, {"source": "IranWire", "title": "مصادره اموال یک فعال سیاسی خارج از کشور در یزد", "link": "https://iranwire.com/fa/news-1/158852-%D8%AF%D8%A7%D8%AF%D8%B3%D8%AA%D8%A7%D9%86-%DB%8C%D8%B2%D8%AF-%D8%A7%D8%B2-%D8%AA%D9%88%D9%82%DB%8C%D9%81-%D8%AF%D8%A7%D8%B1%D8%A7%DB%8C%DB%8C%D9%87%D8%A7%DB%8C-%DB%8C%DA%A9-%D9%81%D8%B9%D8%A7%D9%84-%D8%B3%DB%8C%D8%A7%D8%B3%DB%8C-%D8%AE%D8%A7%D8%B1%D8%AC-%D8%A7%D8%B2-%DA%A9%D8%B4%D9%88%D8%B1-%D8%AE%D8%A8%D8%B1-%D8%AF%D8%A7%D8%AF/", "summary": "دادستان مرکز استان یزد", "date_str": "2026-10-14T08:05:17+00:00", "hash": "9eaaea32f518cecf", "title_fa": "مصادره اموال یک فعال سیاسی خارج از کشور در یزد", "summary_fa": "دادستان مرکز استان یزد اعلام کرد خودرو، یک پلاک ثبتی، موجودی حساب‌های بانکی و پنج خط تلفن متعلق به یک فعال سیاسی و اجتماعی زن توقیف شده است. به‌گفته مهدی حسن‌پور، این زن در حال حاضر خارج از ایران زندگی می‌کند و برای او در دادسرای یزد پرونده‌ای با اتهام‌های مرتبط با امنیت ملی تشکیل شده است. حسن‌پور گفته است این پرونده پس از رصد فعالیت‌های متهم در فضای مجازی و انتشار مطالب و استوری‌هایی که مقام‌های قضایی آن‌ها را «خلاف امنیت ملی» خوانده‌اند، تشکیل شده است. به‌گفته او، توقیف دارایی‌ها با دستور قضایی و برای جلوگیری از نقل‌وانتقال آن‌ها تا تعیین تکلیف پرونده انجام شده است. دادستان یزد تأکید کرده است پرونده هنوز در مرحله تحقیقات مقدماتی قرار دارد و درباره عنوان اتهامی، مسئولیت کیفری متهم و سرنوشت نهایی دارایی‌های او تصمیمی گرفته نشده است. نام متهم و جزئیات مطالب منتشر شده در گزارش اعلام نشده است. دادستان یزد به ماده ۲ قانون «تشدید مجازات جاسوسی و همکاری با رژیم صهیونیستی و کشورهای متخاصم علیه امنیت و منافع ملی» استناد کرده است. موج تازه توقیف اموال مخالفان جمهوری اسلامی از فروردین۱۴۰۵ و هم‌زمان با جنگ شدت گرفت. روز ۱۵فروردین، دادستان تهران دستور شناسایی و توقیف دارایی‌های بیش از ۱۰۰ چهره شناخته‌شده خارج از کشور را صادر کرد. همان روز دستور مسدودسازی حساب‌ها و شناسایی اموال ۶۳ نفر از مدیران و کارکنان ایران‌اینترنشنال و ۲۵ نفر از کارکنان شبکه من‌وتو نیز صادر شد. با وجود گذشت نزدیک به ۹ ماه از آغاز این روند، قوه قضاییه تاکنون گزارش جامعی درباره ارزش مجموع دارایی‌های توقیف‌شده، تعداد اموالی که با حکم قطعی از مرحله توقیف به مصادره رسیده‌اند و سرنوشت دارایی‌های مصادره‌شده منتشر نکرده است. در اطلاع‌رسانی‌های این نهاد نیز مشخص نشده درآمد حاصل از فروش یا بهره‌برداری احتمالی از این اموال به چه حسابی واریز و در چه محلی هزینه می‌شود."}, {"source": "IranWire", "title": "کاهش تولید نفت ایران به کمتر از ۲میلیون بشکه در روز", "link": "https://iranwire.com/fa/news-1/158855-%D8%AA%D9%88%D9%84%DB%8C%D8%AF-%D9%86%D9%81%D8%AA-%D8%A7%DB%8C%D8%B1%D8%A7%D9%86-%D8%AF%D8%B1-%D8%B4%D9%87%D8%B1%DB%8C%D9%88%D8%B1-%D8%A8%D9%87-%DA%A9%D9%85%D8%AA%D8%B1-%D8%A7%D8%B2-%D8%AF%D9%88-%D9%85%DB%8C%D9%84%DB%8C%D9%88%D9%86-%D8%A8%D8%B4%DA%A9%D9%87-%D8%AF%D8%B1-%D8%B1%D9%88%D8%B2-%D8%B1%D8%B3%DB%8C%D8%AF/", "summary": "بر اساس گزارش ماهانه سازمان کشورهای صادرکننده نفت، اوپک، تولید روزانه نفت ایران در شهریور ۱۴۰۵ با کاهش ۹۹ هزار بشکه‌ای به ی  ماموریت‌ها را مختل کرده است.» آقای بزکرستنوف گفت که «روشن است این اقدام نمی‌تواند تصادفی باشد و با وضعیت سیاسی کنونی ارتباط دارد.» او در پیام دیگری، استارلینک را یکی از «مؤثرترین» ابزارها برای هدایت پهپادهایی دانست که برای رهگیری پهپادهای تهاجمی جدید روسیه به کار می‌روند. پهپادهای جدید روسیه به موتور جت مجهزند. یک منبع در وزارت دفاع اوکراین هم که بی‌بی‌سی با او تماس گرفته است، محدودیت‌های جدید استارلینک را تایید کرد و گفت که علت اصلی این اختلالات در دست بررسی است. او گفت که «این وضعیت عملیات را به‌شدت پیچیده کرده است. به‌ویژه در زمینه تدارکات، سامانه‌های بدون سرنشین، حملات با بُرد متوسط و فعالیت‌های دیگر.» شرکت اسپیس‌ایکس تاکنون درباره گزارش‌های مرتبط با محدودیت سرعت اظهارنظری نکرده است. استارلینک به ابزاری حیاتی برای دسترسی نیروهای اوکراینی به اینترنت تبدیل شده است."}, {"source": "BBC Persian", "title": "واتیکان: پاپ به سرطان ریه مبتلا شده، اما عمل جراحی موفقیت‌آمیزی داشت", "link": "https://www.bbc.com/persian/articles/c9p8gk86xjgvo?at_medium=RSS&at_campaign=rss", "summary": "واتیکان در یک بیانیه پزشکی اعلام کرد که پاپ لئون چهاردهم به سرطان ریه مبتلا شده است و تحت عمل جراحی موفقیت‌آمیزی برای برداشتن «لوب پایینی ریه راست» قرار گرفت.", "date_str": "2026-10-14T11:44:34+00:00", "hash": "6472421da6902224", "title_fa": "واتیکان: پاپ به سرطان ریه مبتلا شده، اما عمل جراحی موفقیت‌آمیزی داشت", "summary_fa": "واتیکان در یک بیانیه پزشکی اعلام کرد که پاپ لئون چهاردهم به سرطان ریه مبتلا شده است و تحت عمل جراحی موفقیت‌آمیزی برای برداشتن «لوب پایینی ریه راست» قرار گرفت. این رهبر ۷۱ ساله روز سه‌شنبه (۱۳ اکتبر، ۲۱ مهر) در بیمارستان جملی در رم تحت یک عمل جراحی ۹۰ دقیقه‌ای قرار گرفت و سپس ابتلای او به نوعی سرطان ریه به‌نام «آدنوکارسینومای ریه» تشخیص داده شد. واتیکان گفت: «عمل جراحی موفقیت‌آمیز بود و هیچ عوارض و مشکلی پیش نیامد. پاپ پس از عمل به‌طور عادی به‌هوش آمد، یک دوره کوتاه تحت نظر بود، سپس به اتاق خود بازگشت.» واتیکان صبح چهارشنبه گفت که پاپ «شبی آرام» را در بیمارستان سپری کرده است؛ انتظار می‌رود او حدود یک هفته در آنجا بستری بماند. روز سه‌شنبه، پیش از ورود پاپ، جمعیت زیادی ساعت‌ها بیرون بیمارستان منتظر او بودند. این توده نخستین بار در جریان آنچه واتیکان «معاینات معمول» توصیف کرد، شناسایی شد. واتیکان در بیانیه خود اعلام کرد که کل لوب پایینی ریه راست پاپ برداشته شده است تا «اطمینان حاصل شود [توده] از ریشه برداشته می‌شود.» یک منبع در واتیکان به خبرگزاری فرانسه گفت که آزمایش‌های تکمیلی در حال انجام است تا مشخص شود آیا نشانه‌ای از گسترش سرطان وجود دارد یا خیر. یکشنبه گذشته، پاپ لئون خودش پس از خواندن دعای سنتی آنجلوس و سخنرانی از بالکن میدان سن پیتر (سنت پی‌یترو) خبر عمل جراحی‌اش را به جهانیان داد. پاپ لئون گفت که گرهک (ندول)، یا توده، در ریه‌اش «محدود به همان ناحیه» و «در مراحل بسیار اولیه» است، اما پزشکان به او توصیه کرده‌اند که آن را بردارد. تیم جراحی قفسه سینه بیمارستان جملی پاپ را تحت عمل جراحی قرار داد؛ برنامه‌های کاری او تا ۲۰ اکتبر لغو شده است تا فرصت کافی برای بهبودی داشته باشد. واتیکان گفت که اگرچه وجود گرهک‌های (ندول‌های) ریوی امری نسبتا شایع"}, {"source": "BBC Persian", "title": "توماس پیکتی: آمریکا در حال از دست دادن کنترل جهان است", "link": "https://www.bbc.com/persian/articles/c6d09zjz3887o?at_medium=RSS&at_campaign=rss", "summary": "پنج سال پس از هشدار توماس پیکتی درباره خطرهای ناشی از تشدید نابرابری، این اقتصاددان فرانسوی می‌گوید جهان وارد مرحله‌ای تازه از دگرگونی شده است؛ مرحله‌ای که در آن نفوذ آمریکا رو به کاهش است، نظم جهانی در حال تغییر است و آنچه «نگاه ترامپی به آینده» می‌نامد، نمی‌تواند پاسخی برای چالش‌های پیش روی جهان باشد.", "date_str": "2026-10-14T07:46:26+00:00", "hash": "f407ffcba0641a0d", "title_fa": "توماس پیکتی: آمریکا در حال از دست دادن کنترل جهان است", "summary_fa": "پنج سال پس از هشدار توماس پیکتی درباره خطرهای ناشی از تشدید نابرابری، این اقتصاددان فرانسوی می‌گوید جهان وارد مرحله‌ای تازه از دگرگونی شده است؛ مرحله‌ای که در آن نفوذ آمریکا رو به کاهش است، نظم جهانی در حال تغییر است و آنچه «نگاه ترامپی به آینده» می‌نامد، نمی‌تواند پاسخی برای چالش‌های پیش روی جهان باشد. توماس پیکتی، اقتصاددان فرانسوی، پنج سال پیش هشداری داد که بازتاب گسترده‌ای در سراسر جهان داشت. نابرابری ناشی از وجود طبقه‌ای ممتاز که ثروت‌های هنگفتی را در اختیار داشت، به سطحی رسیده بود که با دوره پیش از انقلاب فرانسه در اواخر سده هجدهم قابل مقایسه بود. پیام این اقتصاددان یادآور این واقعیت بود که هرگاه عدم توازنی با چنین ابعادی پدید می‌آید، ممکن است بحرانی سیاسی به راه بیفتد که بتواند مسیر تاریخ را تغییر دهد. اگرچه پیکتی معتقد است شرایط بدتر شده، همچنان به آینده خوش‌بین است. پیکتی معتقد است ما در دوره‌ای زندگی می‌کنیم که مملو از روایت‌های ویران‌شهری است؛ نگاهی به آینده از جنس سیاست‌های ترامپ که نه کارآمد است و نه می‌تواند مشکلات توسعه‌ای و زیست‌محیطی‌ را که باید حل کنیم، برطرف کند. با این حال، او اطمینان دارد که این آینده ویران‌شهری تحقق نخواهد یافت و جهان به‌سوی نظمی چند قطبی حرکت خواهد کرد که در آن نیروهای دموکراتیک نقش پررنگ‌تری خواهند داشت و فشار کشورهای جنوب جهانی تا حد زیادی محرک این تغییر خواهد بود. نویسندهٔ کتاب «سرمایه در قرن بیست‌ویکم» بار دیگر مجموعه‌ای از پیشنهادهای جسورانه را مطرح کرده است؛ پیشنهادهایی که در قالب «پروژه عدالت جهانی»، گزارشِ «آزمایشگاه جهانی نابرابری» گردآوری شده‌اند. خبرنامه بی‌بی‌سی فارسی گزیده‌ای از مهم‌ترین خبرها، گزارش‌های میدانی و گفت‌وگوهای اختصاصی را هر هفته در ایمیل خود دریافت کنید. از جمله پیشنهادهای مطرح‌شده می‌توان به ایجاد یک واحد پول بین‌المللی واحد برای جایگزینی دلار، برابر کردن درآمد سرانه و کاهش ساعات کار"}, {"source": "BBC Persian", "title": "«محاسبات الهی» چیست و چرا مجتبی خامنه‌ای ایران را قدرت اول جهان می‌داند؟", "link": "https://www.bbc.com/persian/articles/cm0e087q9rl9o?at_medium=RSS&at_campaign=rss", "summary": "مجتبی خامنه‌ای در پیامی جمهوری اسلامی ایران را بر اساس «محاسبات الهی» قدرت اول جهان توصیف کرده؛ ادعایی که با واکنش‌ها و تفسیرهای متفاوتی روبه‌رو شده است. این مطلب بررسی می‌کند که «محاسبات الهی» در ادبیات رهبران جمهوری اسلامی چه معنایی داشته، چه نسبتی با معیارهای متعارف سنجش قدرت دارد و چگونه می‌تواند بر نگاه حاکمیت به سیاست خارجی، روابط با آمریکا و تصمیم‌گیری‌های سیاسی تأثیر بگذارد.", "date_str": "2026-10-14T04:38:36+00:00", "hash": "61a22015a67c2f25", "title_fa": "«محاسبات الهی» چیست و چرا مجتبی خامنه‌ای ایران را قدرت اول جهان می‌داند؟", "summary_fa": "مجتبی خامنه‌ای در پیامی جمهوری اسلامی ایران را بر اساس «محاسبات الهی» قدرت اول جهان توصیف کرده؛ ادعایی که با واکنش‌ها و تفسیرهای متفاوتی روبه‌رو شده است. این مطلب بررسی می‌کند که «محاسبات الهی» در ادبیات رهبران جمهوری اسلامی چه معنایی داشته، چه نسبتی با معیارهای متعارف سنجش قدرت دارد و چگونه می‌تواند بر نگاه حاکمیت به سیاست خارجی، روابط با آمریکا و تصمیم‌گیری‌های سیاسی تأثیر بگذارد. ادعای اخیر مجتبی خامنه‌ای مبنی بر اینکه جمهوری اسلامی ایران بر اساس «محاسبات الهی» «قدرت اول جهان» است، بحث‌ها و تلاش‌هایی را برای توضیح این مفهوم در میان رسانه‌ها و نهادهای نزدیک به حکومت به دنبال داشت. در همین راستا، خبرگزاری حوزه نخستین نشست «ایران، قدرت اول جهان بر اساس محاسبات الهی» را برگزار کرد و سه تن از روحانیان حوزه علمیه قم به تبیین این دیدگاه پرداختند. پیام منسوب به مجتبی خامنه‌ای که ششم مهرماه منتشر شد، واکنش‌ها و تفسیرهای گوناگونی را در فضای رسانه‌ای برانگیخت. شماری از چهره‌های سیاسی، از جمله سعید جلیلی، نماینده رهبر جمهوری اسلامی در شورای عالی امنیت ملی، این سخنان را در چارچوب «منطق قرآنی» تایید کردند. خبرگزاری صدا و سیما نیز در یادداشتی «قدرت اول بودن» را توضیح داد و نوشت: «در منطق قرآن، قدرت حقیقی یک جامعه صرفا از میزان برخورداری آن از منابع مادی، اقتصادی، نظامی و فناورانه حاصل نمی‌شود، بلکه نسبت آن جامعه با سنت‌های الهی و میزان قرار گرفتن آن در مسیر نصرت حق نیز در تعیین سرنوشت آن نقش اساسی دارد». چهره‌هایی مانند مهدی فضائلی، عضو دفتر حفظ و نشر آثار رهبر جمهوری اسلامی ایران، نیز به تحلیل و تفسیر سخنان مجتبی خامنه‌ای پرداختند. او در مراسم جان‌فدایان دانشگاهی استان البرز گفت: «تحلیلگران بر اساس محاسبات مادی و مولفه‌های موجود در معادلات جهانی، ایران را در جایگاه قدرت چهارم جهان قرار می‌دهند؛ یعنی پس از آمریکا، چین و روسیه، جمهوری اسلامی"}, {"source": "BBC Persian", "title": "از تهران تا ریاض و واشنگتن؛ جنگی که سیاست و انتخابات را به هم گره زده است", "link": "https://www.bbc.com/persian/articles/cmz7x9d5e8r0o?at_medium=RSS&at_campaign=rss", "summary": "در حالی که کارزار انتخابات میان‌دوره‌ای آمریکا به هفته‌های پایانی خود رسیده و جنگ میان حوثی‌های یمن و عربستان نگرانی‌ها درباره اختلال بیشتر در بازار انرژی را افزایش داده است، رسانه‌های آمریکایی از پیوند خوردن بحث حمله دوباره به ایران با محاسبات انتخاباتی در آمریکا و اسرائیل نوشته‌اند.", "date_str": "2026-10-14T07:07:50+00:00", "hash": "0731188dba15fa31", "title_fa": "از تهران تا ریاض و واشنگتن؛ جنگی که سیاست و انتخابات را به هم گره زده است", "summary_fa": "در حالی که کارزار انتخابات میان‌دوره‌ای آمریکا به هفته‌های پایانی خود رسیده و جنگ میان حوثی‌های یمن و عربستان نگرانی‌ها درباره اختلال بیشتر در بازار انرژی را افزایش داده است، رسانه‌های آمریکایی از پیوند خوردن بحث حمله دوباره به ایران با محاسبات انتخاباتی در آمریکا و اسرائیل نوشته‌اند. برخی تحلیلگران از افزایش هزینه انتخاب میان جنگ و مذاکره سخن گفته‌اند و یک مفسر نیز سیاست اسرائیل‌ستیزی حکومت جمهوری اسلامی را بهترین هدیه به راست افراطی اسرائیل و ماندگاری بنیامین نتانیاهو در قدرت توصیف کرده است. وب‌سایت خبری اکسیوس نوشت که دونالد ترامپ رئيس جمهوری آمریکا و بنیامین نتانیاهو نخست وزیر اسرائيل طی دو هفته اخیر چند بار درباره احتمال ازسرگیری عملیات نظامی گسترده علیه ایران گفت‌وگو کرده‌اند. به گفته منابع آگاه، نتانیاهو در این رایزنی‌ها نگرانی خود را از آنچه تلاش ایران برای بازسازی بخش‌هایی از برنامه هسته‌ای‌اش می‌خواند مطرح کرده است. اکسیوس به نقل از مقام‌های بدون نام نوشته حتی احتمال یک عملیات مشترک آمریکا و اسرائیل علیه اهداف نظامی و هسته‌ای ایران نیز مورد بحث بوده و تاکید کرده که این گفت‌وگوها پیش از آن انجام شده که ترامپ اعلام کند تا پیش از انتخابات میان‌دوره‌ای آمریکا به ایران حمله نخواهد کرد. دقیقا مشخص نیست کدام طرف ابتدا موضوع حمله دوباره به ایران و دعوت به مشارکت طرف دیگر را مطرح کرده است. یک مقام آمریکایی به اکسیوس گفته نتانیاهو این کار را کرده و یک مقام اسرائيلی هم در گفتگو با اکسیوس مدعی شده که این ترامپ بوده که موضوع حمله دوباره، قبل از انتخابات را مطرح کرده و از نخست وزیر اسرائيل پرسیده که آیا حاضر است در چنین حمله‌ای مشارکت کند یا نه. مقام‌های آمریکایی که با اکسیوس گفت‌وگو کرده‌اند، روایت‌های متفاوتی از موضع کاخ سفید ارائه داده‌اند. یکی از آنها به این وب‌سایت گفته است: «به نظر می‌رسد بی‌بی [نتانیاهو] می‌خواهد دوباره حمله کند."}, {"source": "BBC Persian", "title": "پشت موج حذف کتاب‌ها از کتابخانه‌های آمریکا چیست؟", "link": "https://www.bbc.com/persian/articles/cq33xd6rl7nvo?at_medium=RSS&at_campaign=rss", "summary": "کتابخانه‌های عمومی آمریکا به میدان نبرد یک رویارویی ایدئولوژیک شدید بر سر این موضوع تبدیل شده‌اند که چه کتاب‌هایی باید در دسترس دانش‌آموزان قرار بگیرند.", "date_str": "2026-10-14T03:26:50+00:00", "hash": "d554e6d30f542c5f", "title_fa": "پشت موج حذف کتاب‌ها از کتابخانه‌های آمریکا چیست؟", "summary_fa": "کتابخانه‌های عمومی آمریکا به میدان نبرد یک رویارویی ایدئولوژیک شدید بر سر این موضوع تبدیل شده‌اند که چه کتاب‌هایی باید در دسترس دانش‌آموزان قرار بگیرند. پنج سال پیش، نیکول، مادری که در شهرستان پینلاس در ایالت فلوریدای آمریکا زندگی می‌کند، متوجه شد برخی کتاب‌ها از مدارس فرزندانش جمع‌آوری می‌شوند. خود فرزندانش متوجه شده بودند که بعضی عنوان‌ها دیگر در دسترس نیستند و او نیز با صحبت با معلمان و کتابداران این موضوع را تائید کرد. بنابراین نیکول تصمیم گرفت کتاب‌هایی را که چهار فرزندش دیگر نمی‌توانستند در مدرسه پیدا کنند، برای آن‌ها بخرد، وضعیتی که به گفته او با واقعیت زندگی بیشتر خانواده‌ها فاصله زیادی دارد. او می‌گوید: «در جایی که من زندگی می‌کنم، جوامعی هستند که درآمد اضافه‌ای برای خرید کتاب ندارند.» او می‌افزاید: «پدر و مادرها یا پدربزرگ‌ها و مادربزرگ‌هایی که از بچه‌ها مراقبت می‌کنند، به دلیل ساعت‌های کاری‌شان نمی‌توانند آن‌ها را به کتابخانه ببرند.» کتابخانه‌های عمومی در آمریکا به میدان نبرد بحثی شدید و ایدئولوژیک میان والدین، معلمان، کتابداران، گروه‌های فعال و سیاستمداران تبدیل شده‌اند. بحث بر سر این‌ که چه کتاب‌هایی باید در دسترس کودکان قرار داشته باشند. تنها در سال ۲۰۲۵، بر اساس آمار دفتر آزادی فکری انجمن کتابخانه‌های آمریکا، ۶۵۸۸ مورد سانسور کتاب در کتابخانه‌های عمومی و مدارس ثبت شد؛ یعنی مواردی که کتاب‌ها به‌طور کامل از قفسه‌ها برداشته شدند یا به بخش‌هایی با دسترسی محدودتر منتقل شدند. در مجموع ۴۲۳۵ عنوان مشخص تحت تاثیر این اقدامات قرار گرفتند. این رقم در مقایسه با میانگین سالانه ۷۰ کتاب سانسورشده در فاصله سال‌های ۲۰۰۱ تا ۲۰۲۰ افزایش چشمگیری را نشان می‌دهد. خبرنامه بی‌بی‌سی فارسی گزیده‌ای از مهم‌ترین خبرها، گزارش‌های میدانی و گفت‌وگوهای اختصاصی را هر هفته در ایمیل خود دریافت کنید."}, {"source": "BBC Persian", "title": "در یمن جنگی با پیامدهای جهانی در جریان است", "link": "https://www.bbc.com/persian/articles/crz98542ly75o?at_medium=RSS&at_campaign=rss", "summary": "از خطوط مقدم نبرد در استان لحج تا بیمارستان‌های مملو از مجروح در عدن، جنگ یمن بار دیگر وارد مرحله‌ای تعیین‌کننده شده است. حوثی‌ها که هم‌زمان کشتیرانی جهانی و عربستان سعودی را تحت فشار قرار داده‌اند، اکنون در مرکز رویارویی گسترده‌تری قرار دارند که از تهران تا ریاض امتداد یافته و بر امنیت انرژی، ثبات منطقه و زندگی میلیون‌ها یمنی سایه انداخته است.", "date_str": "2026-10-13T20:24:46+00:00", "hash": "7d2e8a591d11dd36", "title_fa": "در یمن جنگی با پیامدهای جهانی در جریان است", "summary_fa": "از خطوط مقدم نبرد در استان لحج تا بیمارستان‌های مملو از مجروح در عدن، جنگ یمن بار دیگر وارد مرحله‌ای تعیین‌کننده شده است. حوثی‌ها که هم‌زمان کشتیرانی جهانی و عربستان سعودی را تحت فشار قرار داده‌اند، اکنون در مرکز رویارویی گسترده‌تری قرار دارند که از تهران تا ریاض امتداد یافته و بر امنیت انرژی، ثبات منطقه و زندگی میلیون‌ها یمنی سایه انداخته است. سفری پرشتاب در دل بیابان بود؛ سوار بر یک خودروی وانت، در حالی که افراد مسلح در عقب آن نشسته بودند. ما همراه نیروهای طرفدار دولت یمن حرکت می‌کردیم و در مسیر، گهگاه دریای عرب و قله‌های سر به فلک کشیده کوه‌ها را در دوردست می‌دیدیم. به ما گفته بودند که نیروهای حوثی تنها چند روز پیش از این منطقه عقب رانده شده‌اند. وقتی جنگ بر سر پهنه‌های وسیع و خالی صحرا جریان دارد، دیدن پیشروی دشوار است. اما سربازان در شعب‌الجن، در استان لحج، مواضع دفاعی تازه‌ای را که با کیسه‌های شن ساخته بودند به ما نشان دادند؛ خطوط جدیدی که در دل شن‌ها ترسیم شده‌اند. توفیق الحَبون، فرمانده ریش‌دار نیروهای امنیت ملی جنوب یمن که یونیفرم استتار به تن داشت، گفت: «درگیری‌های شدیدی در جریان بود.» او افزود: «آن‌ها تک‌تیرانداز، توپخانه و پرتابگر موشک بالستیک دارند.» اینجا، در گوشه‌ای دورافتاده از خاورمیانه، جنگی با پیامدهای جهانی در جریان است. دیگر نمی‌توان جنگ داخلی ریشه‌دار یمن را نادیده گرفت. این جنگ اکنون بخشی از درگیری گسترده‌تری است که از تهران تا ریاض امتداد دارد؛ جایی که موشک‌ها به فرودگاه بین‌المللی اصابت کردند. حوثی‌های یمن که پیش‌تر نیز تهدیدی برای کشتیرانی جهانی به شمار می‌رفتند، اکنون به تهدیدی فزاینده برای عربستان سعودی تبدیل شده‌اند. آنها همچنین اهرم فشاری در اختیار حامیان خود در ایران، رقیب منطقه‌ای عربستان، قرار می‌دهند. توفیق الحَبون با اشاره به تکه‌های فایبرگلاس و قطعات فلزی پراکنده در اطراف پایش گفت این بقایای یک"}, {"source": "BBC Persian", "title": "اعتراض‌ها به محدودیت حجاب در مدارس جمهوری آذربایجان بالا گرفت", "link": "https://www.bbc.com/persian/articles/cm3697xl9l7wo?at_medium=RSS&at_campaign=rss", "summary": "تصمیم دولت جمهوری آذربایجان برای اعمال محدودیت غیرمستقیم بر استفاده از حجاب توسط دانش‌آموزان و کارکنان مدارس، اعتراض‌هایی را در پی داشته است. اعتراض‌هایی در پی آن شکل گرفته است که برخی مدارس از حضور دانش‌آموزان و معلمان در کلاس‌های درس جلوگیری کرده‌اند.", "date_str": "2026-10-13T17:25:00+00:00", "hash": "3a91930892eb184f", "title_fa": "اعتراض‌ها به محدودیت حجاب در مدارس جمهوری آذربایجان بالا گرفت", "summary_fa": "تصمیم دولت جمهوری آذربایجان برای اعمال محدودیت غیرمستقیم بر استفاده از حجاب توسط دانش‌آموزان و کارکنان مدارس، اعتراض‌هایی را در پی داشته است. اعتراض‌هایی در پی آن شکل گرفته است که برخی مدارس از حضور دانش‌آموزان و معلمان در کلاس‌های درس جلوگیری کرده‌اند. با گسترش اعتراض‌ها، کاربران در جمهوری آذربایجان از اختلال در دسترسی به اینستاگرام و تیک‌تاک خبر داده‌اند و می‌گویند این شبکه‌های اجتماعی تنها با استفاده از وی‌پی‌ان قابل دسترسی هستند؛ موضوعی که گمانه‌زنی‌ها درباره محدود شدن دسترسی به آنها در بحبوحه اعتراض‌ها به محدودیت‌های حجاب در مدارس را تقویت کرده است. مقام‌های دولتی مسدود شدن این پلتفرم‌ها را تایید نکرده‌اند، اما منتقدان مشکلات دسترسی را به اعتراضات علیه ممنوعیت استفاده از حجاب در مدارس مرتبط می‌دانند. خبرنگار بی‌بی‌سی این موضوع را با تعدادی از آشنایان خود بررسی کرد و آنها نیز نتوانستند وارد این شبکه‌های اجتماعی شوند؛ تنها در یک مورد از هشت مورد، دسترسی به تیک‌تاک ممکن بود. برخی کاربران همچنین از کندی یوتیوب، مشکل ی شدند. به گفته زلنسکی، روسیه در موج تازه حملات خود ۳۹ موشک بالستیک و بیش از ۱۲۰ پهپاد و مهمات سرگردان به سوی کی‌یف، مناطق اطراف آن و خارکیف شلیک کرد. در این حملات ده‌ها تأسیسات انرژی آسیب دید و دست‌کم ۶۰۰ هزار نفر بدون برق ماندند. اوکراین برای شناسایی زودهنگام حملات موشکی و پهپادی روسیه به اطلاعات ماهواره‌ای آمریکا وابستگی زیادی دارد و هشدارهای پیشاپیش می‌تواند فرصت بیشتری برای فعال شدن پدافند هوایی و پناه گرفتن غیرنظامیان فراهم کند. با این حال، دونالد ترامپ، رئیس‌جمهور آمریکا، در پاسخ به پرسش خبرنگاران دربارهٔ احتمال توقف ارائه اطلاعات به اوکراین گفت: «نه، ما چنین کاری نکرده‌ایم.» او افزود: «ما به آنها کمک می‌کنیم و اطلاعاتی را در اختیارشان می‌گذاریم. می‌خواهیم جنگ پایان یابد.» آندری سیبیها، وزیر خارجه اوکراین، نیز تأیید کرده است که همکاری اطلاعاتی آمریکا ادامه دارد و احتمال داد دریافت‌نکردن هشدار قبلی به نوع تسلیحات مورد استفاده روسیه مربوط باشد. کورت ولکر، نماینده ویژه پیشین آمریکا در امور اوکراین، به رادیو اروپای آزاد/رادیو آزادی گفته است که بر اساس اطلاعاتی که به او رسیده، پوشش ابری مانع شناسایی شلیک موشک‌ها از سوی ماهواره‌های آمریکایی شده است. او با این حال تأکید کرد که نتوانسته این توضیح را مستقلاً"}, {"source": "Radio Farda", "title": "نتانیاهو: حمله به ایران پیش از انتخابات اسرائیل به نفع ما نیست", "link": "https://www.radiofarda.com/a/netanyahu-iran-strike-trump-election-irgc-warning/33876531.html", "summary": "این اظهارات یک روز پس از انتشار گزارش‌هایی مطرح می‌شود که حاکی از گفت‌وگوی نتانیاهو و دونالد ترامپ دربارهٔ احتمال ازسرگیری حملات به ایران پیش از انتخابات دو کشور بود.", "date_str": "2026-10-14T12:01:27+00:00", "hash": "34dadb3dc446eb5a", "title_fa": "نتانیاهو: حمله به ایران پیش از انتخابات اسرائیل به نفع ما نیست", "summary_fa": "این اظهارات یک روز پس از انتشار گزارش‌هایی مطرح می‌شود که حاکی از گفت‌وگوی نتانیاهو و دونالد ترامپ دربارهٔ احتمال ازسرگیری حملات به ایران پیش از انتخابات دو کشور بود. بنیامین نتانیاهو، نخست‌وزیر اسرائیل، می‌گوید حملهٔ احتمالی اسرائیل یا آمریکا به ایران در روزهای آینده و پیش از برگزاری انتخابات اسرائیل، در شرایط کنونی به نفع این کشور نیست. نتانیاهو روز چهارشنبه ۲۲ مهر در گفت‌وگو با رادیو ارتش اسرائیل، در پاسخ به پرسشی دربارهٔ احتمال ازسرگیری حملات به ایران گفت: «به نظر من، این کار در شرایط کنونی برای ما مناسب نیست.» وب‌سایت آمریکایی آکسیوس روز سه‌شنبه ۲۱ مهر به نقل از دو مقام آمریکایی، یک مقام اسرائیلی و یک منبع آگاه دیگر گزارش داد که ترامپ و نتانیاهو هفتهٔ گذشته دربارهٔ احتمال اجرای عملیات نظامی گستردهٔ تازه‌ای علیه ایران گفت‌وگو کرده‌اند. به‌گزارش آکسیوس، نتانیاهو در این گفت‌وگو نگرانی خود را از آن‌چه اطلاعات اسرائیل دربارهٔ تلاش جمهوری اسلامی برای بازسازی برنامهٔ هسته‌ای ایران نشان می‌دهد، مطرح کرده است. منابع آکسیوس گفته‌اند که دو طرف دربارهٔ احتمال عملیات مشترک آمریکا و اسرائیل علیه اهداف نظامی و هسته‌ای ایران گفت‌وگو کرده‌اند، اما ترامپ تعهد مشخصی برای انجام حمله نداده است. یکی از مقام‌های آمریکایی به آکسیوس گفته است که نتانیاهو ظاهراً خواهان ازسرگیری حملات است و چند بار این موضوع را با ترامپ مطرح کرده، اما رئیس‌جمهور آمریکا تنها از آمادگی برای چنین احتمالی سخن گفته است. با این حال، یک مقام کاخ سفید گزارش گفت‌وگوی ترامپ و نتانیاهو دربارهٔ ازسرگیری جنگ را رد کرده و یادآور شده است که رئیس‌جمهور آمریکا اعلام کرده پیش از انتخابات میان‌دوره‌ای کنگره به ایران حمله نخواهد کرد. دفتر نخست‌وزیری اسرائیل نیز بدون تأیید یا تکذیب جزئیات این گزارش اعلام کرده که نتانیاهو به‌طور منظم با ترامپ و مقام‌های ارشد دولت آمریکا در تماس است، اما دربارهٔ محتوای این گفت‌وگوها اظهارنظر نمی‌کند."}, {"source": "Radio Farda", "title": "مدیران گوگل و مایکروسافت هم درباره خطرات فزاینده هوش مصنوعی هشدار دادند", "link": "https://www.radiofarda.com/a/google-deepmind-hassabis-ai-cyberattacks-safety-warning/33876491.html", "summary": "رئیس شرکت گوگل دیپ‌مایند می‌گوید حملات سایبری اخیر توسط سامانه‌های هوش مصنوعی «زنگ خطرهای اولیه» هستند و جهان ممکن است از سال آینده با حوادث بسیار جدی‌تری در این زمینه روبه‌رو شود.", "date_str": "2026-10-14T11:03:11+00:00", "hash": "4ca7a0e75ae668e4", "title_fa": "مدیران گوگل و مایکروسافت هم درباره خطرات فزاینده هوش مصنوعی هشدار دادند", "summary_fa": "رئیس شرکت گوگل دیپ‌مایند می‌گوید حم  نگرانی‌های بین‌المللی را برانگیخته است. گروه‌های حقوق بشری و دولت‌ها می‌گویند تهران از اعدام‌ها برای"}, {"source": "Radio Farda", "title": "ترامپ: به‌زودی درباره ایران تصمیم می‌گیریم؛ احتمال درخواست کمک از ترکیه علیه حوثی‌ها", "link": "https://www.radiofarda.com/a/trump-on-iran-we-ll-make-a-decision-on-iran-very-soon/33875939.html", "summary": "دونالد ترامپ، رئیس‌جمهور آمریکا، می‌گوید واشینگتن به‌زودی درباره گام بعدی خود در قبال جمهوری اسلامی تصمیم خواهد گرفت.", "date_str": "2026-10-13T16:03:22+00:00", "hash": "5a9b225f2586f4bc", "title_fa": "ترامپ: به‌زودی درباره ایران تصمیم می‌گیریم؛ احتمال درخواست کمک از ترکیه علیه حوثی‌ها", "summary_fa": "دونالد ترامپ، رئیس‌جمهور آمریکا، می‌گوید واشینگتن به‌زودی درباره گام بعدی خود در قبال جمهوری اسلامی تصمیم خواهد گرفت. آقای ترامپ روز سه‌شنبه ۲۱ مهر، هنگام ترک کاخ سفید به مقصد آلاسکا، در پاسخ به پرسش خبرنگاران درباره اقدامات بعدی آمریکا در قبال تهران گفت: «ایران کشوری شکست‌خورده است، اقتصاد ندارد. ما خیلی زود درباره ایران تصمیم خواهیم گرفت.» او همچنین با اشاره به وضعیت تنگه هرمز گفت آمریکا کنترل این آبراه را در اختیار دارد و حجم زیادی نفت از آن عبور می‌کند. رئیس‌جمهوری آمریکا توضیح بیشتری درباره ماهیت تصمیم احتمالی واشینگتن در قبال جمهوری اسلامی و زمان دقیق اعلام آن نداد. این اظهارات یک روز پس از آن بیان شد که ترامپ در یک گردهمایی انتخاباتی در ایالت اوهایو گفت آمریکا ممکن است در هدف قرار دادن رهبران جمهوری اسلامی «بیش از حد پیش رفته باشد» و کشته شدن مقام‌های ارشد ایرانی، یافتن طرفی برای مذاکره را دشوار کرده است. ترامپ در این گردهمایی گفته بود: «شاید درباره رهبران بیش از حد پیش رفته باشیم، چون دیگر نمی‌دانیم با چه کسی طرف هستیم.» دونالد ترامپ شامگاه جمعه ۱۷ مهر در یک گردهمایی انتخاباتی در نیویورک گفت انتظار دارد جنگ با ایران و جنگ روسیه علیه اوکراین را به‌زودی «حل‌وفصل کند یا در آن‌ها به پیروزی برسد» و تهدید کرد جمهوری اسلامی ایران یا خواسته‌های واشینگتن را می‌پذیرد یا «دیگر وجود نخواهد داشت». او ساعاتی پیش‌تر نیز، متفاوت با موضع روز قبل خود، احتمال حمله دوباره به ایران پیش از انتخابات میان‌دوره‌ای آمریکا را رد نکرده بود. دونالد ترامپ یک روز پیشتر گفته بود که ایالات متحده تا پیش از برگزاری انتخابات میان‌دوره‌ای ایالات متحده به ایران حمله نخواهد کرد. رئیس‌جمهوری آمریکا در بخش دیگری از سخنانش درباره جنگ اوکراین گفت واشینگتن همچنان به ارائه کمک و تبادل اطلاعات با کی‌یف ادامه می‌دهد و برای پایان دادن به جنگ با"}],
      tech: [{"source": "MIT AI", "title": "How artificial neural networks build their own learning machinery", "link": "https://news.mit.edu/2026/how-artificial-neural-networks-build-their-own-learning-machinery-1013", "summary": "As artificial intelligence becomes more and more powerful, its ability to handle human-like tasks is undeniable. Artificial neural networks can learn to recognize images, use language, or write computer code. Like the brain’s circuits, they reorganize themselves as they learn, adjusting the strengths of their connections to improve their performance. The question for many neuroscientists is: What can these machine systems teach them about how the brain learns? And what kinds of models are likely to be the most informative? In a paper published Oct. 9 in the journal PNAS , scientists at MIT’s McGovern Institute for Brain Research and K. Lisa Yang Integrative Computational Neuroscience (ICoN) Center argue that a crucial metric for the biological plausibility of an artificial neural network’s approach to learning is the network’s ability to organize itself, without the guiding hand of a developer. They show that it is possible for an artificial neural network to build its own learning machinery. With some simple instructions about how and when connections should change, a group of randomly connected units can reshape itself into an effective information-processing network, learning from the data it is trained on. Biological learning “Current AI technology is working very well, but it doesn’t necessarily use a learning algorithm that is used by the brain,” says Qianli Liao, a K. Lisa Yang ICoN Center Postdoctoral Fellow in the labs of MIT professors and McGovern Institure members Tomaso Poggio and Mark Harnett , and co-first author of the PNAS paper with MIT Research Scientist Liu Ziyin and graduate student Yulu Gan. Liao explains that engineers design the rules about how connections change as an artificial neural network processes training data and receives feedback about its mistakes. When it comes to training AI to do its job, the approach is powerful. But Liao and his colleagues caution that networks designed in this way may not offer much insight into biological learning. “The brain doesn't have an external designer or architect,” Liao says. “The brain has to organize itself. And we need to know how simple rules are going to make the brain organize.” The rules that reshape neural connections as an animal learns may be different in different parts of the brain, or they may change as the brain becomes more mature. Neuroscientists are working to understand how those rules work and how they might be disrupted by aging or disease — a vital step toward developi", "date_str": "2026-10-13T21:00:00+00:00", "hash": "a4ddfb235e490cf7", "title_fa": "چگونه شبکه های عصبی مصنوعی ماشین یادگیری خود را می سازند", "summary_fa": "با قدرتمندتر شدن هوش مصنوعی، توانایی آن در انجام وظایف شبیه به انسان غیرقابل انکار است. شبکه های عصبی مصنوعی می توانند تشخیص تصاویر، استفاده از زبان یا نوشتن کدهای کامپیوتری را بیاموزند. مانند مدارهای مغز، آنها خود را در حین یادگیری سازماندهی مجدد می کنند و نقاط قوت ارتباطات خود را برای بهبود عملکرد خود تنظیم می کنند. سوال بسیاری از دانشمندان علوم اعصاب این است: این سیستم های ماشینی در مورد نحوه یادگیری مغز چه چیزی می توانند به آنها بیاموزند؟ و چه نوع مدل هایی احتمالاً آموزنده ترین هستند؟ در مقاله ای که در 9 اکتبر در ژورنال PNAS منتشر شد، دانشمندان موسسه تحقیقات مغز مک گاورن MIT و مرکز علوم اعصاب محاسباتی یکپارچه K. Lisa Yang (ICoN) استدلال می کنند که یک معیار مهم برای معقول بودن بیولوژیکی رویکرد شبکه عصبی مصنوعی برای یادگیری، توانایی خود شبکه برای سازماندهی دستی است. آنها نشان می دهند که این امکان برای یک شبکه عصبی مصنوعی وجود دارد که بتواند ماشین یادگیری خود را بسازد. با چند دستورالعمل ساده در مورد چگونگی و زمان تغییر اتصالات، گروهی از واحدهای متصل به طور تصادفی می‌توانند خود را به یک شبکه پردازش اطلاعات مؤثر تغییر شکل دهند و از داده‌هایی که روی آن آموزش دیده‌اند یاد بگیرند. یادگیری بیولوژیکی: «فناوری هوش مصنوعی فعلی بسیار خوب کار می‌کند، اما لزوماً از الگوریتم یادگیری که توسط مغز استفاده می‌شود، استفاده نمی‌کند.» لیزا یانگ عضو مرکز آیکون پسادکتری در آزمایشگاه اساتید MIT و اعضای مؤسسه مک گاورن، توماسو پوجیو و مارک هارنت، و اولین نویسنده مقاله PNAS با دانشمند تحقیقاتی MIT، لیو زیین و دانشجوی فارغ التحصیل یولو گان. لیائو توضیح می‌دهد که مهندسان قوانینی را درباره نحوه تغییر اتصالات طراحی می‌کنند، زیرا یک شبکه عصبی مصنوعی داده‌های آموزشی را پردازش می‌کند و درباره اشتباهاتش بازخورد دریافت می‌کند. وقتی نوبت به آموزش هوش مصنوعی"}, {"source": "MIT AI", "title": "MIT Lincoln Laboratory hosts National Security Commission on Emerging Biotechnology", "link": "https://news.mit.edu/2026/mit-lincoln-laboratory-hosts-national-security-commission-emerging-biotechnology-1013", "summary": "MIT Lincoln Laboratory hosted the National Security Commission on Emerging Biotechnology (NSCEB) on Sept. 3, for a stop on its national roadshow. The event convened representatives of state organizations, defense centers, universities, technology companies, and business executives to discuss how Massachusetts' biotechnology ecosystem can strengthen national biodefense capabilities. \"We have a lot to leverage in this region to advance biotechnology,\" said Christina Rudzinski, assistant head of the Biotechnology and Human Systems Division at Lincoln Laboratory. \"Many people are already working together to push the bioindustrial sector beyond biopharmaceuticals and into a broader ecosystem across industries. This synergy is where NSCEB comes in — connecting policy to the real-world work already happening, including here at Lincoln Laboratory and across the state.\" Biotechnology touches many economic and defense sectors, from disease-resistant crops and lifesaving medicines to biofuels and advanced manufacturing materials. In 2022, Congress established the NSCEB to study the national security implications of this rapidly advancing field and issue policy recommendations to ensure continued U.S. leadership. In April 2025, the 11-member bipartisan and bicameral commission released its report , calling for a minimum of $15 billion in federal investment over five years. According to the report, China is investing aggressively to dominate the field, echoing a pattern the United States has seen before in sectors such as semiconductors. \"The coalition of stakeholders working in the Massachusetts biotech ecosystem illustrates how collaborative regional work will help keep the U.S. in the lead by producing exceptional innovation across all areas of biotechnology,\" said NSCEB Executive Director Caitlin Frazer. Now in the final year of its three-year mandate, NSCEB is touring the country to see local biotechnology ecosystems in action. The commission will bring insights back to Washington to help members of Congress support their regions' strengths. Advancing Massachusetts as a defense-biotechnology hub Massachusetts has identified biotechnology as a priority technology area under its Strategic Hub for Innovation, Exchange, and Leadership in Defense (SHIELD) initiative. Launched by Governor Maura Healey in October 2025 alongside $47 million of initial aligned investment, the initiative has moved with speed and at scale. This includes standing up the BioNexus program that ", "date_str": "2026-10-13T20:40:00+00:00", "hash": "0987a5c38cfd54ba", "title_fa": "آزمایشگاه MIT لینکلن میزبان کمیسیون امنیت ملی در زمینه بیوتکنولوژی نوظهور است", "summary_fa": "آزمایشگاه MIT لینکلن در 3 سپتامبر میزبان کمیسیون امنیت ملی در زمینه بیوتکنولوژی نوظهور (NSCEB) برای توقف در نمایشگاه جاده ملی خود بود. این رویداد نمایندگانی از سازمان‌های ایالتی، مراکز دفاعی، دانشگاه‌ها، شرکت‌های فناوری و مدیران تجاری را گرد هم آورد تا درباره چگونگی تقویت اکوسیستم بیوتکنولوژی ماساچوست به تقویت قابلیت‌های دفاع زیستی ملی بحث کنند. کریستینا رودزینسکی، دستیار رئیس بخش بیوتکنولوژی و سیستم های انسانی در آزمایشگاه لینکلن، می گوید: «ما در این منطقه برای پیشرفت بیوتکنولوژی اهرم های زیادی داریم. بسیاری از راد بر تجربیات رسانه‌های اجتماعی است زیرا هوش مصنوعی به طور فزاینده‌ای به کشف محتوا شکل می‌دهد. این حرکت نشان‌دهنده دور شدن از سیستم‌های توصیه سنتی است که سال‌ها تجربیات رسانه‌های اجتماعی را شکل داده‌اند و پلتفرم را به سرویس‌های پخش نزدیک‌تر می‌کند که به کاربران اجازه می‌دهد توصیه‌ها را بر اساس علایق و ترجیحات خود شخصی‌سازی کنند. این راه‌اندازی همچنین مبتنی بر تلاش‌های شخصی‌سازی موجود متا در سایر پلتفرم‌هایش"}, {"source": "TechCrunch AI", "title": "Laplace Intelligence red-teams robots and self-driving cars before they hit the real world", "link": "https://techcrunch.com/2026/10/13/laplace-intelligence-red-teams-robots-and-self-driving-cars-before-they-hit-the-real-world/", "summary": "University of Michigan spinout Laplace Intelligence uses AI agents and interactive simulation to stress-test robots and self-driving vehicles before deployment. The profitable startup is competing in Startup Battlefield at TechCrunch Disrupt, October 13-15 in San Francisco.", "date_str": "2026-10-13T17:30:00+00:00", "hash": "fa6cd4dc8cb7d18d", "title_fa": "لاپلاس اینتلیجنس ربات‌ها و ماشین‌های خودران را قبل از اینکه به دنیای واقعی برسند، تشکیل می‌دهند", "summary_fa": "هوش لاپلاس دانشگاه میشیگان از عوامل هوش مصنوعی و شبیه‌سازی تعاملی برای تست استرس روبات‌ها و وسایل نقلیه خودران قبل از استقرار استفاده می‌کند. این استارت آپ سودآور در استارتاپ بتلفیلد در TechCrunch Disrupt، 13 تا 15 اکتبر در سانفرانسیسکو رقابت می کند. اگر یک درسی که حادثه OpenAI-Hugging Face به ما آموخت، این است که عوامل هوش مصنوعی می توانند غیرقابل پیش بینی باشند. هاوی سان، مدیرعامل و یکی از بنیانگذاران هوش لاپلاس، به TechCrunch گفت: «تصور کنید اگر چنین چیزی در دنیای فیزیکی اتفاق بیفتد. عوامل هوش مصنوعی از رایانه ها به دنیای واقعی می روند و ما واقعاً نمی خواهیم هوش مصنوعی فیزیکی در دنیای واقعی شکست بخورد. لاپلاس مستقر در Ann Arbor در حال ساخت تیم قرمز خودکار - اساساً آزمایش استرس یک سیستم با تلاش عمدی برای شکست آن - برای رباتیک و هوش مصنوعی فیزیکی است. این شرکت شرط می‌بندد که تنها راه برای اطمینان از ایمن بودن هوش مصنوعی  خطراتی که شرکت او در سرتاسر مشتریان خود تشخیص می‌دهد مربوط به ابزارهایی است که توسط غیرتوسعه‌دهنده‌ها کدگذاری شده‌اند: او به TechCrunch گفت که بخش‌های مالی بزرگترین منبع چنین خطراتی هستند و به دنبال آن تیم‌های بازاریابی و حقوقی قرار دارند. او گفت که توسعه دهندگان در رتبه چهارم قرار دارند. ابزارهای استارت‌آپ او ظاهراً یک برنامه کدگذاری شده توسط یک کارمند مالی در یک شرکت Fortune 500 برای مدیریت اطلاعات مشتری و انحراف پیدا کردند، اما این برنامه در معرض اینترنت قرار گرفت. پلوتو، تازه از مخفی کاری با 42 میلیون دلار بودجه، آخرین محصول در مجموعه جدیدی از استارت آپ های امنیتی است که به سرعت برای کمک به شرکت ها برای رفع این شکاف های ترس ایجاد شده اند، و همه آنها با این اعتقاد که تنها استفاده از نرم افزارهای امنیتی موجود برای نظارت و کنترل ابزارهای هوش مصنوعی، اتصال دهنده ها و رویکرد استفاده از یک راه حل جامع است، پول زیادی از سرمایه گذاران جمع آوری می کنند. بهات به TechCrunch می‌گوید استارت‌آپ او تنها در آوریل شروع به فروش کرده است و قبلاً برخی از طرفداران فناوری خود را پیدا کرده است، که به شرکت‌ها کمک می‌کند"}, {"source": "TechCrunch AI", "title": "Google Play now lets anyone build private, vibe-coded apps that run on Android", "link": "https://techcrunch.com/2026/10/13/google-play-now-supports-private-vibe-coded-apps-built-just-for-you/", "summary": "Google is making it easier to build and use personal Android apps created with AI, without having to make them available to everyone on the Play Store.", "date_str": "2026-10-13T17:00:00+00:00", "hash": "b2a54208d84433b8", "title_fa": "Google Play اکنون به هر کسی اجازه می‌دهد تا برنامه‌های خصوصی و با کد vibe بسازد که در اندروید اجرا می‌شوند", "summary_fa": "گوگل ساخت و استفاده از برنامه‌های اندرویدی شخصی ایجاد شده با هوش مصنوعی را بدون نیاز به در دسترس قرار دادن آن‌ها برای همه در فروشگاه Play آسان‌تر می‌کند. غول فناوری روز سه‌شنبه اعلام کرد که برنامه‌های با کد vibe شما اکنون می‌توانند به راحتی در تلفن‌های هوشمند اندرویدی بدون نیاز به عمومی شدن در فروشگاه Google Play اجرا شوند. یک ویژگی جدید به کاربران این امکان را می‌دهد تا ب یک مهمانی شام دور هم جمع شدند. هوش مصنوعی آنها هم همینطور. عوامل.", "summary_fa": "با گسترش ربات‌های هوش مصنوعی، ما به طور فزاینده‌ای به نحوه تعامل این موجودات دیجیتال و آنچه با یکدیگر صحبت می‌کنند، نگاه می‌کنیم."}, {"source": "NYT Tech", "title": "Rogue A.I. Agents from China Chatted with Researchers", "link": "https://www.nytimes.com/2026/10/14/technology/chinese-ai-agents-rogue.html", "summary": "Researchers discovered that the agents were trying to bypass security controls on websites and made contact with them. A Times reporter was invited to join the discussion.", "date_str": "2026-10-14T11:00:06+00:00", "hash": "cee9ef1beae22e11", "title_fa": "Rogue A.I. ماموران چینی با محققان گپ زدند", "summary_fa": "محققان دریافتند که عوامل در تلاش برای دور زدن کنترل های امنیتی در وب سایت ها و برقراری ارتباط با آنها بودند. از خبرنگار تایمز برای شرکت در بحث دعوت شد."}, {"source": "NYT Tech", "title": "F.B.I. Arrests OpenAI Employee Accused of Planting Bug in Office", "link": "https://www.nytimes.com/2026/10/13/technology/openai-worker-arrested-bugging.html", "summary": "OpenAI said that the employee had placed a device built to evade detection and that he had planned to secretly record meetings in other sensitive spaces.", "date_str": "2026-10-14T01:33:22+00:00", "hash": "1116422cf23834c9", "title_fa": "F.B.I. دستگیری کارمند OpenAI متهم به کاشت اشکال در دفتر", "summary_fa": "OpenAI گفت که این کارمند دستگاهی را برای فرار از تشخیص قرار داده است و او برنامه ریزی کرده بود تا جلسات را به طور مخفیانه در سایر فضاهای حساس ضبط کند."}, {"source": "The Guardian AI", "title": "Use of AI in job interviews on the rise – but UK recruiters say they can spot the cheats", "link": "https://www.theguardian.com/technology/2026/oct/14/use-of-ai-job-interviews-on-rise-uk-recruiters-cheats", "summary": "Body representing some of Britain’s biggest graduate employers reveals misconduct is at a record high It is obvious when someone is using AI to drum up answers in a job interview, according to Chris Morrow, who runs a recruitment agency in Manchester. “It’s like they are reading off an Autocue,” he said. Continue reading...", "date_str": "2026-10-13T23:01:38+00:00", "hash": "ef116b93016ece77", "title_fa": "استفاده از هوش مصنوعی در مصاحبه های شغلی در حال افزایش است - اما استخدام کنندگان بریتانیا می گویند که می توانند تقلب ها را شناسایی کنند", "summary_fa": "به گفته کریس مورو، مدیر یک آژانس استخدامی در منچستر، بدن نماینده برخی از بزرگترین کارفرمایان فارغ التحصیل بریتانیا نشان می دهد که رفتار نادرست در بالاترین حد خود قرار دارد. او گفت: «مثل این است که آنها یک Autocue را می خوانند. ادامه مطلب... مورو، که استعدادها را برای بخش هوش مصنوعی استخدام می کند، گفت برنامه هایی که می توانند به صورت واقعی به آن گوش دهند و پاسخ دهند، در طول مصاحبه های مجازی توسط نامزدها استفاده می شوند که در نتیجه به دور بعدی راه پیدا نمی کنند. او گفت: \"هر وقت این اتفاق برای ما بیفتد، تمایل داریم مصاحبه را پایان دهیم. این تقلب است.\" گزارش‌های سوء رفتار توسط فارغ‌التحصیلان در طول مصاحبه‌های شغلی، طبق گزارش سازمانی که برخی از کارفرمایان پیشرو فارغ‌التحصیل در بریتانیا را نمایندگی می‌کند، به رکورد بالایی رسیده است – با استفاده اعلام‌نشده از هوش مصنوعی در طول مصاحبه‌ها در صدر فهرست. مؤسسه کارفرمایان دانشجو در نظرسنجی سالانه خود فاش کرد که گزارش‌های مربوط به تخلف در درخواست شغل به بالاترین حد خود رسیده است، به طوری که 92 درصد از کارفرمایان به رفتار اشتباه در فرآیندهای ارزیابی و انتخاب مشکوک یا تأیید می‌کنند. این رقم در مقایسه با 85 درصد برای سال قبل و 78 درصد در سال قبل از آن است. رایج ترین شکل سوء رفتار، استفاده غیرمجاز از هوش مصنوعی در طول مصاحبه و ارزیابی آنلاین بود، به طوری که 66 درصد از پاسخ دهندگان حداقل یک مورد از سوء استفاده یک فارغ التحصیل از هوش مصنوعی در طول مصاحبه را گزارش کردند. ISE دارای 290 کارفرما از جمله مارکس اسپنسر، رولز رویس و اکسنچر است، اما از پاسخ دهندگانی که مصاحبه هایی با کمک هوش مصنوعی را تجربه کرده اند نامی نبرد. استفان ایشروود، مدیر اجرایی ISE، گفت که تقلب در مصاحبه‌ها می‌تواند منجر به کسب مشاغلی"}, {"source": "The Guardian AI", "title": "Nvidia, worth $5.5tn, donates $250m to UK for AI safety research", "link": "https://www.theguardian.com/technology/2026/oct/14/nvidia-donates-to-uk-ai-safety-research", "summary": "Pledge spanning five years from world’s most valuable firm comes as concerns about AI agents have risen Business live – latest updates The $5.5tn (£4.1tn) US chipmaker Nvidia is donating $250m worth of computing power to the UK to support AI safety research. The donation from the world’s most valuable company comes as the UK government confirmed its AI Security Institute (AISI), which tests advance AI models, will be able to examine cutting-edge technology developed by companies such as OpenAI, Anthropic and Google before they are released. Continue reading...", "date_str": "2026-10-14T10:10:37+00:00", "hash": "6301bbd7f20b8ac4", "title_fa": "انویدیا، به ارزش 5.5 تریلیون دلار، 250 میلیون دلار به بریتانیا برای تحقیقات ایمنی هوش مصنوعی اهدا می کند", "summary_fa": "تعهد پنج ساله از با ارزش ترین شرکت جهان در حالی است که نگرانی ها در مورد عوامل هوش مصنوعی افزایش یافته است - آخرین به روز رسانی ها تراشه ساز آمریکایی 5.5 تریلیون دلار (4.1 تریلیون پوند) Nvidia در حال اهدای 250 میلیون دلار قدرت محاسباتی به بریتانیا برای حمایت از تحقیقات ایمنی هوش مصنوعی است. کمک مالی ارزشمندترین شرکت جهان در حالی صورت می‌گیرد که دولت بریتانیا تایید کرده است که موسسه امنیت هوش مصنوعی (AISI) که مدل‌های پیشرفته هوش مصنوعی را آزمایش می‌کند، می‌تواند فناوری‌های پیشرفته‌ای را که توسط شرکت‌هایی مانند OpenAI، Anthropic و Google توسعه داده‌اند، قبل از انتشار بررسی کند. به خواندن ادامه دهید... انویدیا گفت که این کمک مالی که پنج سال طول می‌کشد، «از تحقیقات ایمنی و امنیتی در سراسر بریتانیا حمایت می‌کند». نگرانی‌های ایمنی در مورد عوامل هوش مصنوعی - برنامه‌های رایانه‌ای بسیار توانمند که قادر به طراحی و اجرای توالی کارها به طور مستقل هستند - از تابستان، زمانی که OpenAI تأیید کرد که «انبوهی» از عوامل به Hugging Face، یک استارت‌آپ فناوری حمله کرده‌اند، افزایش یافته است. انویدیا در بیانیه خود به AISI اشاره نکرد اما گفت که بیشتر این پول «از جامعه تحقیقاتی ایمنی و امنیت هوش مصنوعی بریتانیا حمایت می‌کند» و بخشی از پول نقد به آزمایشگاه یادگیری و اکتشاف باز بریتانیا، آزمایشگاه تحقیقاتی علوم بنیادی هوش مصنوعی - که توسط دانشگاه‌های ادینبورگ، کمبریج، آکسفورد و کالج دانشگاه ایمپریال لندن - و دانشگاه‌های کالج دانشگاه کالج لندن - و دانشگاه‌های امپریال کالج لندن - اداره می‌شود. قدرت محاسباتی از طریق مراکز داده مستقر در بریتانیا با استفاده از تراشه های Nvidia تحویل داده می شود. جنسن هوانگ، مدیر اجرایی انویدیا، گفت: «بریتانیا دقت علمی در سطح جهانی را برای این چالش مهندسی ضروری به ارمغان می‌آورد. انویدیا با این تعهد 250 میلیون دلاری، محاسبات سریع را در اختیار"}, {"source": "The Guardian AI", "title": "AI overlords say they want to democratise their technology. Here’s how | Richard Wilson and Clara Long", "link": "https://www.theguardian.com/commentisfree/2026/oct/14/ai-overlords-democratise-technology", "summary": "A fight over a datacentre in Utah has been a testing ground for citizens’ assemblies, paving the way to oversight What’s your “(p)doom” – the percentage chance that rogue AI will create an existential catastrophe? Judging by their recent warnings, it is rising among tech bosses. On 25 September, OpenAI paused training of its latest frontier models as reports of AI agents going rogue mounted. A day later, Australia’s Senate asked the bosses of OpenAI and Anthropic to appear before an inquiry after rogue OpenAI agents broke into US government websites and an Australian health portal. Both declined. Richard Wilson is the CEO of Iswe Foundation and Clara Long is the co-executive director of the Bloom Project Continue reading...", "date_str": "2026-10-14T10:00:03+00:00", "hash": "baba922c09f8855e", "title_fa": "صاحبان هوش مصنوعی می گویند که می خواهند فناوری خود را دموکراتیک کنند. در اینجا نحوه | ریچارد ویلسون و کلارا لانگ", "summary_fa": "دعوا بر سر یک مرکز داده در یوتا، محل آزمایشی برای مجامع شهروندان بوده است، و راه را برای نظارت هموار می کند «(p)doom» شما چیست - درصد احتمال اینکه هوش مصنوعی سرکش فاجعه ای وجودی ایجاد کند؟ با قضاوت بر اساس هشدارهای اخیر آنها، در بین روسای فناوری در حال افزایش است. در 25 سپتامبر، OpenAI آموزش آخرین مدل‌های مرزی خود را با افزایش گزارش‌هایی مبنی بر سرکشی عوامل هوش مصنوعی متوقف کرد. یک روز بعد، مجلس سنای استرالیا از روسای OpenAI و Anthropic خواست تا در برابر تحقیقات پس از نفوذ عوامل سرکش OpenAI به وب‌سایت‌های دولت ایالات متحده و یک پورتال بهداشتی استرالیایی حاضر شوند. هر دو رد کردند. ریچارد ویلسون مدیر عامل بنیاد Iswe و کلارا لانگ مدیر اجرایی پروژه بلوم است. در همین حال، بیل گیتس هشدار داده است که هوش مصنوعی در دستان اشتباه می تواند باعث مرگ یک میلیارد نفر شود. او گفت: \"هیچ کس فکر نمی کند خودتنظیمی کافی است.\" چند روز قبل، داریو آمودی و سام آلتمن، مدیران ارشد Anthropic و OpenAI در مقابل شورای امنیت سازمان ملل ظاهر شدند. آمودی هشدار داد که هوش مصنوعی می‌تواند به «خطری برای کل بشریت» تبدیل شود. آلتمن گفت: \"اگر قرار است هوش مصنوعی دموکراتیک باشد، مهم ترین تصمیمات را نمی توان تنها توسط آزمایشگاه های سانفرانسیسکو اتخاذ کرد.\" سناریوهای روز رستاخیز را کنار بگذاریم، هوش مصنوعی در حال حاضر مدارس، محل کار و خدمات عمومی را مختل کرده است، به طوری که حاشیه نشین ترین افراد اغلب این تاثیرات را سخت تر و سریع تر احساس می کنند. اگر قرار است دموکراسی در این عصر قدرت فناوری مهم باشد، مطمئناً باید سعی کنیم هوش مصنوعی را دموکراتیک کنیم. اما چگونه؟ یوتا یک نگاه اجمالی ارائه می دهد. پیشنهادها برای یک مرکز داده بیش از دو برابر منهتن، واکنش شدیدی را در مورد مصرف"}, {"source": "The Guardian AI", "title": "Tool and target: US law enforcement grapple with AI-enabled terrorism and anti-tech extremism", "link": "https://www.theguardian.com/technology/ng-interactive/2026/oct/14/ai-terror-plots-fbi-extremism", "summary": "From the FBI to local police departments, US authorities are increasingly warning of would-be terrorists using chatbots to plan attacks and anti-AI extremist threats In May 2025, a 25-year-old man detonated a car bomb outside a Palm Springs fertility clinic, killing himself and injuring four others. For many, it was a wake-up call about the threats to reproductive care facilities. For the FBI, though, it was also a sign of what the agency had feared for years: bad actors were using generative AI to plan and execute terror plots. The suspect used an unnamed generative AI tool that failed to detect his request for bomb-making instructions, law enforcement officers wrote in a previously unreported document reviewed by the Guardian. The privacy of his conversation with the AI chatbot hindered alerting police that someone was looking up how to make a bomb, according to the memo. How extremists could use AI to devise attacks and recruit new members How AI could be used to disseminate and produce everything from deepfakes to election misinformation and child sexual abuse material (CSAM) How people seeking information on how to make weaponry or bombs could use AI to circumvent police detection How to ensure that officers could take advantage of AI tools in policing, for things like social media monitoring, while managing public concern over the use of these tools Monitoring social media for opposition to AI and potential extremist attacks on datacenters Continue reading...", "date_str": "2026-10-14T10:00:03+00:00", "hash": "222d831e44cb7593", "title_fa": "ابزار و هدف: مجری قانون ایالات متحده با تروریسم مبتنی بر هوش مصنوعی و افراط گرایی ضد فناوری دست و پنجه نرم می کند", "summary_fa": "از اف‌بی‌آی گرفته تا ادارات پلیس محلی، مقامات ایالات متحده به طور فزاینده‌ای نسبت به استفاده تروریست‌های بالقوه از چت‌بات‌ها برای برنامه‌ریزی حملات و تهدیدات افراط‌گرایان ضد هوش مصنوعی هشدار می‌دهند. در ماه مه سال 2025، یک مرد 25 ساله یک خودروی بمب‌گذاری شده را در خارج از کلینیک باروری پالم اسپرینگز منفجر کرد و خود را کشت و چهار نفر دیگر را مجروح کرد. برای بسیاری، این زنگ خطری در مورد تهدیدات مراکز مراقبت باروری بود. اما برای اف‌بی‌آی، این نشانه‌ای از چیزی بود که آژانس سال‌ها از آن می‌ترسید: بازیگران بد از هوش مصنوعی مولد برای طراحی و اجرای توطئه‌های تروریستی استفاده می‌کردند. افسران مجری قانون در سندی که قبلا گزارش نشده بود که توسط گاردین بررسی شده بود، نوشت: مظنون از یک ابزار هوش مصنوعی مولد بدون نام استفاده می کرد که نتوانست درخواست او برای دستورالعمل های ساخت بمب را شناسایی کند. بر اساس این یادداشت، حفظ حریم خصوصی مکالمه او با ربات چت هوش مصنوعی مانع از هشدار دادن به پلیس مبنی بر اینکه شخصی به دنبال چگونگی ساخت بمب است، می‌شود. چگونه افراط‌گرایان می‌توانند از هوش مصنوعی برای طراحی حملات و استخدام اعضای جدید استفاده کنند. چگونه می‌توان از هوش مصنوعی برای انتشار و تولید همه چیز، از دروغ‌های عمیق گرفته تا اطلاعات نادرست انتخاباتی و مطالب سوءاستفاده جنسی از کودکان (CSAM) استفاده کرد. ابزار نظارت بر رسانه های اجتماعی برای مخالفت با هوش مصنوعی و حملات افراطی احتمالی به مراکز داده ادامه خواندن... افسران FBI نگران هستند که این سناریو تکرار شود: \"بازیگران تهدید احتمالاً استفاده خود از ابزارهای GenAI را برای برنامه ریزی حمله افزایش خواهند داد.\""}, {"source": "The Guardian AI", "title": "Bank of England and IMF bosses warn of cyber threat to trust in financial system", "link": "https://www.theguardian.com/business/2026/oct/14/bank-of-england-imf-bosses-warning-cyber-threat-to-trust", "summary": "Kristalina Georgieva says online fraud could lead people to opt out of system and turn to ‘shoeboxes under their bed’ Business live – latest updates The heads of the Bank of England and the International Monetary Fund have issued a stark warning that rising cyber-attacks risk undermining trust in the financial system. Speaking on a panel about online fraud at the IMF and World Bank meetings in Bangkok, the governor of the Bank of England, Andrew Bailey, pointed to alarming headlines about self-replicating AI agents hijacking personal devices , and the French supermarket hack that heated fridges up to 50C . Continue reading...", "date_str": "2026-10-14T09:07:59+00:00", "hash": "3013fe16f2394b57", "title_fa": "روسای بانک انگلستان و صندوق بین المللی پول نسبت به تهدید سایبری برای اعتماد به سیستم مالی هشدار دادند", "summary_fa": "کریستالینا جورجیوا می‌گوید کلاهبرداری آنلاین می‌تواند باعث شود مردم از سیستم منصرف شوند و به «جعبه‌های کفش زیر تخت خود» روی بیاورند. اندرو بیلی، رئیس بانک انگلستان، در یک پنل درباره کلاهبرداری آنلاین در نشست صندوق بین‌المللی پول و بانک جهانی در بانکوک، به سرفصل‌های نگران‌کننده‌ای در مورد ربودن دستگاه‌های شخصی توسط عوامل هوش مصنوعی و هک سوپرمارکت فرانسوی که یخچال‌ها را تا دمای 50 درجه سانتی‌گراد گرم می‌کرد، اشاره کرد. به خواندن ادامه دهید... او گفت: «اگر می‌خواهید آنچه را که در قلب این بحث در مورد هوش مصنوعی وجود دارد بگویید - برای من، اعتماد به فناوری و کنترل انسان برای دستیابی به این اعتماد در فناوری است. وی با اشاره به اهمیت کلیدی فناوری در زیربنای سیستم مالی امروزی، افزود: اگر به پول اعتماد نداشته باشیم، به عنوان یک جامعه عمل نمی کنیم. کریستالینا جورجیوا، مدیر عامل صندوق بین‌المللی پول، با تکرار نگرانی‌های خود، گفت که تلفات کلاهبرداری سایبری اکنون آنقدر زیاد است که مردم می‌توانند تصمیم بگیرند به طور کلی از سیستم مالی رسمی خارج شوند. این اقتصاددان بلغاری گفت: من در آن سوی پرده آهنین به دنیا آمدم و بزرگ شدم. ما به سیستم اعتماد نداشتیم، چه کردیم؟ من دلارهایم را در یک جعبه کفش زیر تختم می گذاشتم. و من امروز نگرانم که اگر نتوانیم با توجه به سرعت، مقیاس و هزینه کلاهبرداری از این منحنی پیشی بگیریم، ممکن است با افراد زیادی روبرو شویم که جعبه‌های کفش زیر تختشان دارند.» او گفت که این تهدید به ویژه برای افرادی که در حاشیه سیستم مالی هستند شدید است. او گفت: «تصور کنید چه اتفاقی می‌افتد اگر اعتماد از بین برود یا به حدی از بین برود که مردم دیگر جرات مشارکت را نداشته باشند."}, {"source": "The Guardian AI", "title": "Is the internet finally unusable? Time to go back to faxes and landlines | First Dog on the Moon", "link": "https://www.theguardian.com/commentisfree/picture/2026/oct/14/is-the-internet-finally-unusable-time-to-go-back-to-faxes-and-landlines", "summary": "We embraced the internet and then forgot how to do things in the real world Sign up here to get an email whenever First Dog cartoons are published Get all your needs met at the First Dog shop if what you need is First Dog merchandise and prints Continue reading...", "date_str": "2026-10-14T05:19:10+00:00", "hash": "0dbfcd67c502eeb9", "title_fa": "آیا اینترنت در نهایت غیر قابل استفاده است؟ زمان بازگشت به فکس و تلفن ثابت | اولین سگ روی ماه", "summary_fa": "ما اینترنت را در آغوش گرفتیم و سپس فراموش کردیم که چگونه کارها را در دنیای واقعی انجام دهیم. اینجا ثبت نام کنید تا هر زمان که کارتون های First Dog منتشر می شود، ایمیلی دریافت کنید. اگر چیزی که نیاز دارید کالاها و چاپ های First Dog است، تمام نیازهای خود را در فروشگاه First Dog برآورده کنید. ادامه خواندن..."}, {"source": "The Guardian AI", "title": "Saudi OpenAI employee arrested after recording device found in headquarters", "link": "https://www.theguardian.com/technology/2026/oct/13/openai-employee-arrested-hidden-recording-device", "summary": "Discovery of ‘sophisticated’ gadget adds to company’s list of privacy concerns after hackings by rogue agents OpenAI said it has found a hidden recording device in one of its offices and has referred the matter to the FBI. One of its employees has been arrested. In a statement on Tuesday, the San Francisco-based AI company said it discovered the “sophisticated recording device” and used one of its “models to understand the device and where it had come from”. Continue reading...", "date_str": "2026-10-13T22:59:55+00:00", "hash": "412559723b1c7f4e", "title_fa": "کارمند OpenAI عربستان سعودی پس از کشف دستگاه ضبط در دفتر مرکزی دستگیر شد", "summary_fa": "کشف گجت \"پیچیده\" پس از هک شدن توسط ماموران سرکش OpenAI اعلام کرد که یک دستگاه ضبط مخفی را در یکی از دفاتر خود پیدا کرده و موضوع را به FBI ارجاع داده است، به لیست نگرانی های شرکت اضافه می شود. یکی از کارمندان آن بازداشت شده است. در بیانیه‌ای روز سه‌شنبه، شرکت هوش مصنوعی مستقر در سانفرانسیسکو اعلام کرد که «دستگاه ضبط پیچیده» را کشف کرده و از یکی از «مدل‌های آن برای درک دستگاه و اینکه از کجا آمده است» استفاده کرده است. ادامه مطلب... این شرکت شناسایی کرده است که \"یک کارمند خاص چند روز قبل آن را کاشته بود\" و افزود: \"در حال حاضر هیچ نشانه ای از دسترسی یا نفوذ نامناسب این فرد به وزن مدل، کد منبع یا داده های مشتری نداریم. کارمند خاتمه یافته است.\" بر اساس بیانیه مطبوعاتی وزارت دادگستری آمریکا، عبدالرحمن الفوزان، 35 ساله، تبعه عربستان سعودی، در 9 اکتبر دستگیر شد. ظاهراً آلفوزان در 28 سپتامبر یک دستگاه ضبط رمزگذاری شده را که در داخل دستمال توالت پنهان شده بود، به تلویزیون در اتاق کنفرانس اجرایی در دفتر مرکزی OpenAI در سانفرانسیسکو وصل کرد. در بیانیه مطبوعاتی FBI آمده است که جلسات در اتاق به طور منظم اطلاعات محرمانه را پوشش می دهند. به گفته وزارت دادگستری، یک کاوش امنیتی که دو روز بعد انجام شد، این دستگاه را فاش کرد. فیلم‌های نظارتی ظاهراً او را در حال قدم زدن در اطراف اتاق جلسه در روزهای منتهی به کشف آن ثبت کردند. بر اساس کیفرخواست آلفوزان، او درخواست‌های متعددی را درباره جزئیات داخلی OpenAI به یک ربات چت هوش مصنوعی ارسال کرد - به گفته FBI، «آدرس ساختمان، اتاق‌های جلسه، ظرفیت‌ها و تقویم‌های اتاق جلسه، مکان‌های «رهبری و اجرایی»."}, {"source": "The Guardian AI", "title": "AI in your oven? Anthropic warns models ‘months away’ from self-replication on smart devices", "link": "https://www.theguardian.com/technology/2026/oct/13/anthropic-ai-replicators-warning", "summary": "Researchers say ‘AI worms’ could soon infiltrate internet-connected devices amid calls for increased guardrails Anthropic is warning that some of its artificial intelligence models could soon become “self-replicating” and find ways to infiltrate internet-connected devices, such as smart fridges and automatic vacuum cleaners. Once this happens, the company said, the models could power themselves within these devices without the need of datacenters. Such self-replication would represent a major loss of control of a runaway AI model. Continue reading...", "date_str": "2026-10-13T20:55:04+00:00", "hash": "f0d30cf0eb79518e", "title_fa": "هوش مصنوعی در فر شما؟ آنتروپیک به مدل‌ها «ماه‌ها دور» از تکرار خود در دستگاه‌های هوشمند هشدار می‌دهد", "summary_fa": "محققان می‌گویند کرم‌های هوش مصنوعی می‌توانند به زودی به دستگاه‌های متصل به اینترنت در میان درخواست‌ها برای افزایش نرده‌های محافظ نفوذ کنند Anthropic هشدار می‌دهد که برخی از مدل‌های هوش مصنوعی آن به زودی می‌توانند «خود تکراری» شوند و راه‌هایی برای نفوذ به دستگاه‌های متصل به اینترنت، مانند یخچال‌های هوشمند و جاروبرقی‌های خودکار بیابند. به گفته شرکت، زمانی که این اتفاق بیفتد، مدل‌ها می‌توانند بدون نیاز به مراکز داده، خود را در این دستگاه‌ها تامین کنند. چنین خود تکراری نشان دهنده از دست دادن عمده کنترل یک مدل هوش مصنوعی فراری است. به خواندن ادامه دهید... محققان Anthropic در گزارشی که روز دوشنبه منتشر شد، نوشتند: «از آنجایی که هیچ نقطه متمرکزی برای خاموش کردن وجود ندارد، خاموش شدن یک شبیه‌ساز مانند این چالش‌برانگیز است.» این شرکت گفت که این کرم‌های هوش مصنوعی، نوعی بدافزار مستقل، ممکن است «ماه‌ها» تا دستیابی به چنین قابلیت‌هایی فاصله داشته باشند. هنگامی که سیستم‌های هوش مصنوعی خارج از کنترل به توانایی هک دستگاه‌های هوشمند دست یابند، می‌توانند از طریق شبکه‌ها پخش شوند و در عین حال از شناسایی طفره بروند. به گفته آنتروپیک، در بدترین سناریو، کرم‌های هوش مصنوعی مختلف می‌توانند برای حمله به سخت‌افزار رایانه با هم جمع شوند. محققان نوشتند: \"ما باید هدف خود را سخت‌تر کنیم تا سیستم‌هایمان را سخت کنیم تا گسترش چنین تکثیرکننده‌هایی را دشوار کنیم، اما همچنین باید برای مقابله با دنیایی که آنها اینجا هستند تا بمانند، آماده شویم.\" گزارش جدید Anthropic در حالی منتشر می شود که نگرانی های ایمنی هوش مصنوعی به اوج خود رسیده است. طی چند ماه گذشته، جریان ثابتی از گزارش‌ها از سوی شرکت‌های هوش مصنوعی، از جمله Anthropic و OpenAI آمده است که می‌گویند عوامل آن‌ها می‌توانند به تنهایی وارد عمل شوند و سایر شرکت‌ها و نهادهای دولتی را هک کنند. افشاگری‌ها باعث شده است که محققان، قانون‌گذاران و مدیران اجرایی،"}, {"source": "The Guardian AI", "title": "Apple unveils new smart home devices that showcase upgraded Siri AI", "link": "https://www.theguardian.com/technology/2026/oct/13/apple-new-smart-home-device-ai", "summary": "New products from Apple include the HomeView, an iPad-like device that acts as a hub for other smart home gadgets Apple on Tuesday began showing off a ⁠new round of smart home products, including an iPad-like device dubbed the HomeView, meant to hang on walls or perch on tabletops ⁠and act as a hub for other smart home devices. The HomeView device starts at $299 and will begin shipping next month. It will feature a 7in screen and face recognition, will help users ⁠control doorbells, thermostats and smart locks in a market where Apple has tinkered for a decade without major success. The device will also showcase Apple’s AI-upgraded Siri virtual ​assistant. Continue reading...", "date_str": "2026-10-13T16:25:22+00:00", "hash": "8aaa7de633059ef8", "title_fa": "اپل از دستگاه‌های خانه هوشمند جدیدی رونمایی می‌کند که هوش مصنوعی سیری ارتقا یافته را به نمایش می‌گذارد", "summary_fa": "محصولات جدید اپل عبارتند از HomeView، دستگاهی شبیه به آی‌پد که به عنوان مرکزی برای سایر گجت‌های خانه هوشمند عمل می‌کند، اپل از روز سه‌شنبه دور جدیدی از محصولات خانه هوشمند را به نمایش گذاشت، از جمله دستگاهی شبیه آی‌پد به نام HomeView که برای آویزان کردن به دیوارها یا قرار گرفتن روی میزها و به عنوان مرکزی برای سایر دستگاه‌های خانه هوشمند عمل می‌کند. دستگاه HomeView از 299 دلار شروع می شود و از ماه آینده ارسال خواهد شد. این گوشی دارای صفحه نمایش 7 اینچی و تشخیص چهره خواهد بود و به کاربران کمک می کند تا زنگ درها، ترموستات ها و قفل های هوشمند را در بازاری که اپل برای یک دهه بدون موفقیت بزرگ در آن دستکاری کرده است، کنترل کنند. این دستگاه همچنین دستیار مجازی سیری ارتقا یافته با هوش مصنوعی اپل را به نمایش خواهد گذاشت. به خواندن ادامه دهید... پیش‌سفارش‌ها از امروز آغاز می‌شود و انتظار می‌رود دستگاه‌ها از 13 نوامبر در دسترس باشند. اپل این محصولات را در حالی عرضه می‌کند که تلاش می‌کند از رقابت رقبای خود جلوگیری کند، از جمله رقبای سنتی مانند آمازون - که سرمایه‌گذاری زیادی روی بلندگوهای Echo و زنگ‌های درهای Ring خود انجام داده و هفته گذشته تبلت‌های ممتاز را روانه بازار کرده است - و همچنین تازه‌ترین شرکت‌های هوش مصنوعی مانند OpenAI که جاه‌طلبی‌های سخت‌افزاری خودشان را دارند. راه‌اندازی HomeView اپل با به‌روزرسانی‌هایی برای بلندگوی هوشمند HomePod و دستگاه‌های Apple TV همراه بود. همچنین مجموعه‌ای از لوازم جانبی از جمله زنگ در، دوربین‌ها و ترموستات‌ها را که توسط ال‌جی و اشنایدر الکتریک ساخته شده
