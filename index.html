      display: inline-flex;
      align-items: center;
      gap: 4px;

    .news-datetime {

      border: 1px solid rgba(56, 189, 248, 0.25);

      padding: 2px 8px;

      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;

      align-items: center;

mitting homes to meet projected new household growth. Jeremy Erickson/Bloomberg via Getty Images US home building permits outpace new household growth, driven by standout state performers. North Carolina leads in housing permits, issuing 8,072 monthly for 4,640 projected new households. States with increasing supply could see an easing of affordability pressures. The US as a whole is approving building permits faster than projected household growth, but the national pace is being pulled up by a few outperforming states. Nationally, states are permitting around 1.7 homes per projected new household, approving about 121,000 housing permits a month, compared with 72,000 projected new households, according to an October research report from the Lied Center for Real Estate at the University of Nevada, Las Vegas. Nicholas Irwin, coauthor of the report and research director at the Lied Center for Real Estate, said that, nationwide, it is an \"OK\" pace — but mostly because some states are doing really well while others are doing very poorly . \"The states that are doing really well are sort of pulling up that average,\" he said. The states doing that heavy lifting could see positive effects on housing and rental affordability, as the housing market might shift into a buyer's market, with increased supply giving buyers more options — helping to ease pressure on housing prices. \"It's going to be great for the buyers,\" he said. \"But if you are then trying to sell a house there, you're going to have much more competition.\" Here are the top 10 states on the report's household-growth measure, where permit pace most exceeds projected household change, adjusted by total number of current households. Land availability and economic growth in many of these states have helped ensure that building permits outpace expected increases in demand. \"Utah, Idaho, South Carolina and North Carolina, South Dakota. I mean, all these places have more land available in their major cities and s 5538543.jpg", "category": "هوش مصنوعی مولد", "tags": ["امنیت سایبری"], "datetime_fa": "۳ آذر • ۱۸:۴۲"}, {"source": "Zoomit", "title": "دیجی‌کالا در بلک‌فرایدی سکه طلا را زیر نرخ اتحادیه عرضه می‌کند", "link": "https://www.zoomit.ir/iran-news/471789-digikala-black-friday-coins-below-union-price/", "summary": "دیجی‌کالا در بلک‌فرایدی، انواع سکه را ۲ تا ۴ میلیون تومان کمتر از نرخ اتحادیه و شمش طلای ۱ و ۵ گرمی را به قیمت اتحادیه با موجودی محدود عرضه کرد.", "date_str": "2026-11-24T15:00:00+00:00", "hash": "db8dec4f846ffb92", "title_fa": "دیجی‌کالا در بلک‌فرایدی سکه طلا را زیر نرخ اتحادیه عرضه می‌کند", "summary_fa": "دیجی‌کالا در بلک‌فرایدی، انواع سکه را ۲ تا ۴ میلیون تومان کمتر از نرخ اتحادیه و شمش طلای ۱ و ۵ گرمی را به قیمت اتحادیه با موجودی محدود عرضه کرد. تبلیغات با آغاز فروش ویژه بلک‌فرایدی، دیجی‌کالا تعدادی از محصولات بازار طلا و سکه را با قیمتی پایین‌تر از نرخ اعلام‌شده اتحادیه طلا و جواهر عرضه کرده است. طبق اطلاعات منتشرشده در صفحه این محصولات، قیمت نیم‌سکه بهار آزادی ۴ میلیون تومان کمتر از نرخ اتحادیه است و تمام‌سکه و ربع‌سکه بهار آزادی نیز به‌ترتیب با اختلاف قیمت ۳ میلیون و ۲ میلیون تومانی نسبت به نرخ اتحادیه به فروش می‌رسند. در زمان تهیه این خبر، نیم‌سکه بهار آزادی با ۲ درصد تخفیف ۱۳۷ میلیون تومان قیمت دارد. تمام‌سکه با ۲ درصد تخفیف ۲۶۲ میلیون و ۵۰۰ هزار تومان و ربع‌سکه بهار آزادی با ۳ درصد تخفیف ۷۶ میلیون تومان عرضه شده است. موجودی هر سه محصول در بلک‌فرایدی محدود اعلام شده است. علاوه بر سکه، شمش‌های طلای آبشده ۱ و ۵ گرمی نیز به قیمت اتحادیه در دیجی‌کالا قابل خرید هستند. شمش ۱ گرمی ۲۵ میلیون و ۹۵۰ هزار تومان و شمش ۵ گرمی ۱۲۸ میلیون و ۹۶۰ هزار تومان قیمت‌گذاری شده است. خرید طلا و سکه همواره یکی از گزینه‌های مورد توجه بسیاری از خانوارها برای حفظ ارزش پس‌انداز بوده و فاصله قیمت خرید با نرخ اتحادیه برای خریداران اهمیت زیادی دارد. به همین دلیل، دیجی‌کالا در بلک‌فرایدی این دسته از محصولات را در کنار سایر پیشنهادهای ویژه خود قرار داده است. امکان خرید این محصولات از طریق وب‌سایت و اپلیکیشن دیجی‌کالا فراهم شده است و خریداران می‌توانند پیش از نهایی‌کردن سفارش، قیمت روز مح g-your-private-signal-chats?utm_medium=RSS", "summary": "If you use Signal , it's likely you care at least a little bit about keeping your communication private so only you and those you're chatting with can see your message threads. Signal's end-to-end encryption keeps prying eyes out, but if you use agentic AI on your device, your chats may not be as locked down as you think. In a recent blog post , Signal president Meredith Whitaker outlined the potential threat AI assistants like Siri and Gemini pose to the platform's promise of privacy. Systems-level capabilities like Gemini Intelligence (on Android) and Siri AI's Onscreen Awareness (on iOS and macOS) scan your screen and may be able to capture data from Signal conversations in the process, which can then be used to perform tasks. Not only does this potentially expose your information, but that of other conversation participants as well. Whitaker notes that this leaves privacy protections outside of Signal's control because the platform cannot easily restrict AI access to the app. Signal has already blocked screenshot capabilities for Microsoft's Recall AI, which by default was able to take and store screen grabs of Signal messages on Windows 11. While Signal cannot guarantee that AI won't have access to your data, there are a few protections now available for those on iOS and Android as well. How to limit AI from reading your Signal chats The main workaround in Signal for now is to restrict screenshots and screen recordings inside the app, though this does not prevent AI agents from potentially grabbing content from other parts of your device. According to Signal's support documents , these protections will now be enabled by default on iOS 27 and Android with the latest versions of the Signal app. Users on iOS 27 can confirm or manually disable screenshot protection via Settings Privacy Block Siri AI . The compromise with this setting is that it also blocks you from taking screenshots of Signal conversations in the app and App Switcher, though you can disable it temporarily for 10 minutes if needed. On Android, Signal automatically engages the \"Screen security\" setting when it detects an AI agent attempting to access the screen. This, too, blocks screenshots inside the app and can be disabled via Settings Privacy App security Screen security . Signal cannot block screenshots on macOS 27. However, users can add Signal to their Excluded Apps list via System Settings Siri , which at least limits proactive access to conversations by Siri AI.", "date_str": "2026-11-24T14:30:00+00:00", "hash": "c37061c9154b4a16", "title_fa": "هوش مصنوعی ممکن است چت های سیگنال خصوصی شما را اسکن کند", "summary_fa": "اگر از Signal استفاده می کنید، احتمالاً حداقل کمی به خصوصی نگه داشتن ارتباط خود اهمیت می دهید تا فقط شما و کسانی که با آنها چت می کنید بتوانید رشته های پیام خود را ببینید. رمزگذاری سرتاسر سیگنال چشمان کنجکاو را از خود دور می کند، اما اگر از هوش مصنوعی عاملی در دستگاه خود استفاده می کنید، ممکن است چت شما آنقدر که فکر می کنید قفل نشود. در یک پست وبلاگ اخیر، مردیث ویتاکر، رئیس سیگنال، تهدید بالقوه دستیاران هوش مصنوعی مانند سیری و جمینی را برای وعده حریم خصوصی پلتفرم بیان کرد. قابلیت‌های سطح سیستم مانند Gemini Intelligence (در اندروید) و Siri AI Onscreen Awareness (در iOS و macOS) صفحه‌نمایش شما را اسکن می‌کنند و ممکن است بتوانند داده‌هایی را از مکالمات سیگنال در این فرآیند ضبط کنند، که سپس می‌تواند برای انجام وظایف استفاده شود. این نه تنها به طور بالقوه اطلاعات شما، بلکه سایر شرکت کنندگان در مکالمه را نیز آشکار می کند. ویتاکر خاطرنشان می کند که این امر حفاظت از حریم خصوصی را خارج از کنترل سیگنال قرار می دهد زیرا این پلتفرم نمی تواند به راحتی دسترسی هوش مصنوعی را به برنامه محدود کند. سیگنال قبلاً قابلیت‌های اسکرین‌شات را برای Recall AI مایکروسافت مسدود کرده است، که به طور پیش‌فرض می‌توانست پیام‌های سیگنال را در ویندوز 11 بگیرد و ذخیره کند. در حالی که سیگنال نمی‌تواند تضمین کند که هوش مصنوعی به داده‌های شما دسترسی نخواهد داشت، اکنون چند محافظت برای کسانی که در iOS و Android نیز هستند در دسترس است. چگونه هوش مصنوعی را در خواندن چت های سیگنال خود محدود کنید راه حل اصلی در سیگنال در حال حاضر محدود کردن اسکرین شات ها و ضبط صفحه در داخل برنامه است، اگرچه این مانع نمی شود که عوامل هوش مصنوعی به طور بالقوه محتوای سایر قسمت های دستگاه", "image_url": "https://lifehacker.com/imagery/articles/01M84NJC6JZ1P63B86PRX2VQBQ/hero-image.fill.size_1200x675.jpg", "category": "هوش مصنوعی مولد", "tags": ["هوش مصنوعی", "Google", "Microsoft", "امنیت سایبری"], "datetime_fa": "۳ آذر • ۱۸:۰۰"}, {"source": "The Guardian AI", "title": "Mamdani says Nvidia drama shows stock market is overly dependent on AI", "link": "https://www.theguardian.com/us-news/2026/nov/24/mamdani-nvidia-stock-market-ai", "summary": "New York City mayor notes ‘massive impact’ on working Americans’ lives when Jensen Huang stepped down as CEO Zohran Mamdani , New York City ’s mayor, on Monday weighed in on the corporate turbulence surrounding Nvidia and the chipmaker’s chief executive officer, Jensen Huang , saying he does not think working Americans “signed up for their pensions being tied to the question of … Huang’s fidelity to his marriage”. The mayor said Huang “had a massive impact”, with Nvidia’s share price dropping dramatically when Huang stepped down as the company’s CEO on 12 November after a reported extramarital relationship with a suspected Chinese spy. Continue reading...", "date_str": "2026-11-24T14:22:17+00:00", "hash": "b9382baf31ef83aa", "title_fa": "ممدانی می گوید درام انویدیا نشان می دهد که بازار سهام بیش از حد به هوش مصنوعی وابسته است", "summary_fa": "شهردار نیویورک به «تأثیر عظیم» بر زندگی آمریکایی‌های شاغل اشاره می‌کند زمانی که جنسن هوانگ از سمت مدیرعاملی زهران ممدانی، شهردار نیویورک کناره‌گیری کرد. وفاداری هوانگ به ازدواجش». شهردار گفت که هوانگ \"تاثیر زیادی داشت\"، به طوری که قیمت سهام انویدیا به شدت کاهش یافت، زمانی که هوانگ از سمت مدیرعاملی شرکت در 12 نوامبر پس از گزارش روابط خارج از ازدواج با یک جاسوس چینی مشکوک استعفا داد. ادامه مطلب...", "image_url": "", "category": "هوش مص       media: [{"source": "Billboard", "title": "Almost Monday Scores Second Alternative Airplay No. 1 With ‘No More Regrets’", "link": "https://www.billboard.com/music/chart-beat/almost-monday-no-more-regrets-number-1-alternative-airplay-1236388630/", "summary": "Almost Monday earns its second No. 1 hit on Billboard ’s Alternative Airplay chart (dated Nov. 28) with “No More Regrets.” The song, released May 1 via Hollywood Records, rises two places to the summit thanks to a 5% increase in spins at the format Nov. 13-19, according to Luminate. (The Alternative Airplay chart measures songs’ weekly plays, as tabulated by Mediabase and provided to Billboard by Luminate, on 60 U.S. alternative radio stations.) The San Diego-based trio first led Alternative Airplay in February 2025 with “Can’t Slow Down,” a crossover hit that also reached No. 12 on Adult Pop Airplay and No. 24 on Pop Airplay. “No More Regrets” is Almost Monday’s eighth career Alternative Airplay entry. The group first made the ranking in October 2020 with “Broken People,” which reached No. 26. Earlier this year, “Lost” hit No. 18. The coronation is also a milestone for Hollywood Records, which earns its third Alternative Airplay No. 1. The label first topped the chart in 1998 with Fastball’s “The Way” and returned with “Can’t Slow Down.” In between, it reached the top 10 on hits by Limp Bizkit (“Take a Look Around”); Breaking Benjamin (“So Cold,” “Sooner or Later,” “The Diary of Jane,” “Breath,” “I Will Not Bow,” “Give Me a Sign [Forever and Ever]”); Atreyu (“Falling Down”); and Little Image (“Out of My Mind”). Meanwhile, of the 15 songs that have ruled Alternative Airplay in 2026, “No More Regrets” is the fifth released on an independent label, following The Paradox’s “Get the Message” (Hundred Days); Yellowcard’s “Bedroom Posters,” featuring Good Charlotte (Better Noise); Young the Giant’s “Different Kind of Love” (Concord); and Temper City’s “Self Aware” (Thirty Knots). There were eight indie No. 1s on -2024-billboard-1548.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["سینما", "موسیقی"], "datetime_fa": "۳ آذر • ۱۸:۵۸"}, {"source": "Deadline", "title": "‘Hunger Games: Sunrise On The Reaping’ Notches Franchise-Record Monday With Near $13M; Lionsgate Pic Will Be No. 1 Over Thanksgiving", "link": "https://deadline.com/2026/11/box-office-hunger-games-sunrise-on-the-reaping-monday-1237231975/", "summary": "UPDATE AFTER EXCLUSIVE: The Hunger Games: Sunrise on the Reaping has notched a Monday record for the franchise with $12.88M, ahead of 2013 s Catching Fire which did $12.3M. The movie is bound to be No. 1 again at the U.S. box office with at least $60M over the 5-day Thanksgiving holiday, and potentially much more [ ]", "date_str": "2026-11-24T15:25:00+00:00", "hash": "d25a0ac90cb729dd", "title_fa": "«Hunger Games: Sunrise On The Reaping» رکورد دوشنبه با نزدیک به 13 میلیون دلار ثبت شد. عکس Lionsgate در روز شکرگزاری شماره 1 خواهد بود", "summary_fa": "به‌روزرسانی پس از انحصاری: بازی‌های Hunger: Sunrise on the Reaping رکورد دوشنبه را برای این فرنچایز با 12.88 میلیون دلار ثبت کرد، پیش از Catching Fire در سال 2013 که 12.3 میلیون دلار درآمد داشت. این فیلم احتمالاً با حداقل 60 میلیون دلار در تعطیلات 5 روزه شکرگزاری، دوباره شماره 1 باکس آفیس ایالات متحده خواهد بود، و احتمالاً بسیار بیشتر [ ] اجرای چهار روزه فیلم Sunrise on the Reaping 132.2 میلیون دلار است. خیلی قبل از یکشنبه آینده، Sunrise on the Reaping به راحتی می‌تواند در عنوان قبلی 2023، Ballad of Songbirds Snakes (166.3 میلیون دلار) از عمر خود بگذرد. تماشا در Deadline انحصاری: پس از به ثمر رساندن بهترین آخر هفته افتتاحیه داخلی برای Lionsgate در 12 سال، The Hunger Games: Sunrise on the Reaping، توانست رکورد دوشنبه 12 میلیون دلاری را به خود اختصاص دهد. رکورد دوشنبه قبلی برای برداشت بلند رمان‌های سوزان کالینز متعلق به Catching Fire در سال 2013 بود که 12.3 میلیون دلار درآمد داشت. به طور جدی، Lionsgate پس از سه سال افتتاحیه و نتیجه کم سابقه آن با The Hunger Games: Ballad of Songbirds Snakes (بازی داخلی 44.6 میلیون دلار youtube-true-crime-channel-dr-insanity-podcast-audioboom-1237232398/", "summary": "Earlier this summer, Ed Simpson teamed with Content Partners to buy YouTube true-crime channel Dr. Insanity. Wonderloom Media, founded by Wheelhouse’s former chief strategy officer and the investment firm, is now launching a Dr. Insanity podcast. They have teamed with Audioboom on the project. Audioboom is behind podcasts including Pod Save America and The Tim [ ]", "date_str": "2026-11-24T15:00:00+00:00", "hash": "95b009c9e4e537b1", "title_fa": "کانال YouTube True-Crime Dr. Insanity پادکست را با Audioboom راه اندازی کرد", "summary_fa": "در اوایل تابستان امسال، اد سیمپسون با Content Partners برای خرید کانال جنایی واقعی YouTube Dr. Insanity همکاری کرد. Wonderloom Media که توسط مدیر ارشد استراتژی سابق Wheelhouse و شرکت سرمایه گذاری تأسیس شده است، اکنون پادکست Dr. Insanity را راه اندازی می کند. آنها با Audioboom در این پروژه همکاری کرده اند. Audioboom پشت پادکست هایی از جمله Pod Save America و The Tim [ ] Wonderloom Media که توسط مدیر ارشد استراتژی سابق Wheelhouse و شرکت سرمایه گذاری تأسیس شده است، اکنون در حال راه اندازی Dr. پادکست جنون. این پادکست دارای اپیزودهای عمیق و مستندی است که به بررسی پرونده های جنایی در زندگی واقعی می پردازد. در ددلاین تماشا کنید این کانال که توسط جرد وست تأسیس شده است، بیش از 6 میلیون مشترک در YouTube دارد، که در آن ویدیوهایی مانند چگونه پلیس باهوش ترین قاتل کلرادو را دستگیر کرد و وقتی کارنس های گنگ تلاش می کنند به پلیس ها حمله کنند را ارائه می دهد. «دکتر اد سیمپسون، مدیر عامل Wonderloom Media، گفت: \"مخاطب ما همیشه با ما عمیقاً همراه بوده اند و بسیاری از آنها در حال حاضر با جنایت واقعی در گوش خود زندگی می کنند.\" Audioboom تعهد ما به داستان سرایی عالی را به اشتراک می‌گذارد و ما هیجان‌زده هستیم که دکتر Insanity را به یک جامعه کاملاً جدید از شنوندگان گرد هم بیاوریم.\" «دکتر برندان ریگان، مدیر ارشد محتوای Audioboom، گفت: «Insanity با ارائه داستان‌های جنایی واقعی با کیفیت و متقاعدکننده، مخاطبان باورنکردنی را در YouTube ایجاد کرده است. ما فرصت فوق‌العاده‌ای را بر ستی بود، همانطور که من او را می شناختم. او که یک دادستان هم از لحاظ حرفه و هم خلق و خوی است، سیاست را به عنوان یک دادگاه غول پیکر می بیند و به توانایی خود در متقاعد کردن شما به حق با او اعتماد کامل دارد - به نحوی که تجربه بی رحمانه ای ندارد. من با کریستی در چند نقطه بسیار پایین (بلافاصله پس از رسوایی وجودی معروف به «بریج گیت») و برخی موارد بهتر (در آستانه اولین کمپین ریاست جمهوری او) به گفتگو نشسته ام. اودیسه او او را از مرکز سیاست جمهوری خواهان به حواشی بیرونی آن رسانده است، از مدیریت تقریباً کاخ سفید دونالد ترامپ تا تبدیل شدن به یکی از سرسخت ترین منتقدان آن. لحظات تحقیرآمیزی وجود داشته است که برخی از آنها ساخته خود او بوده است. اما کریستی حتی اکنون نیز یکی از جالب‌ترین چهره‌های حزبش و پیچیده‌ترین", "image_url": "https://www.rollingstone.com/wp-content/uploads/2026/11/chris-christie-lead.jpg?crop=0px%2C591px%2C1800px%2C1012px&#038;resize=1600%2C900", "category": "هوش مصنوعی مولد", "tags": ["رسانه", "هنر"], "datetime_fa": "۳ آذر • ۱۸:۳۰"}, {"source": "Rolling Stone", "title": "Rey Quinto Is the Peso Pluma-Approved Singer Bringing Guyliner and Glam to Corridos", "link": "https://www.rollingstone.com/music/music-latin/rey-quinto-atravesao-peso-pluma-interview-1235663032/", "summary": "His new album Atravesao features heavyweights like Netón Vega and Luis R. Conriquez, plus Peso and Tito Double P", "date_str": "2026-11-24T15:00:00+00:00", "hash": "013cdbcb1ce06ec8", "title_fa": "ری کوئینتو خواننده مورد تایید پزو پلوما است که گیلینر و گلم را به کوریدوس می آورد", "summary_fa": "آلبوم جدید او Atravesao دارای شخصیت‌های سنگین وزنی مانند Netón Vega و Luis R. Conriquez، به علاوه پزو و Tito Double P است. در سال گذشته، ستاره نوظهور مکزیکی تبدیل به یک همکار برای افراد سنگین وزن در ژانر مانند Peso Pluma، Netón Vega، و Luis R. Conriquez شده است که می خواهند صدای غیرمنتظره او را لمس کنند. اکنون ری کوینتو با اولین آلبوم خود، با عنوان مناسب Atravesao، در کانون توجه قرار گرفته است - و بله، او همه این کارها را با یک لیوان تازه انجام می دهد. ری کوینتو به رولینگ استون می گوید: من می خواس     let currentTab = 'persian';
    let searchQuery = '';
    let readArticles = new Set(JSON.parse(localStorage.getItem('read_articles_registry') || '[]'));

    function toFaDigits(n) {
      const f = ['۰','۱','۲','۳','۴','۵','۶','۷','۸','۹'];
      return n.toString().replace(/\d/g, d => f[d]);
    }

    function toggleRead(hash) {
      if (readArticles.has(hash)) {
        readArticles.delete(hash);
      } else {
        readArticles.add(hash);
      }
      localStorage.setItem('read_articles_registry', JSON.stringify(Array.from(readArticles)));
      renderNews();
    }

    function renderNews() {
      const container = document.getElementById('newsContainer');
      const rawItems = data[currentTab] || [];
      
      const filtered = rawItems.filter(item => {
        if (!searchQuery) return true;
        const q = searchQuery.toLowerCase();
        const title = (item.title_fa || item.title || '').toLowerCase();
        const summary = (item.summary_fa || item.summary || '').toLowerCase();
        const source = (item.source || '').toLowerCase();
        const category = (item.category || '').toLowerCase();
        const tags = (item.tags || []).join(' ').toLowerCase();
        return title.includes(q) || summary.includes(q) || source.includes(q) || category.includes(q) || tags.includes(q);
      });

      const unreadList = [];
      const readList = [];

      filtered.forEach(item => {
        if (readArticles.has(item.hash)) {
          readList.push(item);
        } else {
          unreadList.push(item);
        }
      });

      const sortedItems = [...unreadList, ...readList];

      if (sortedItems.length === 0) {
        container.innerHTML = '<div style="text-align:center; padding: 40px; color: var(--text-muted);">هیچ خبری در این بخش در ۲۴ ساعت گذشته ثبت نشده است.</div>';
        return;
      }

      container.innerHTML = sortedItems.map((item, idx) => {
        const title = item.title_fa || item.title || '';
        const summary = item.summary_fa || item.summary || '';
        const source = item.source || 'منبع خبر';
        const link = item.link || '#';
        const isRead = readArticles.has(item.hash);
        const num = toFaDigits(idx + 1);
        const category = item.category || '';
        const tags = item.tags || [];
        const datetimeFa = item.datetime_fa || '';

        return `
          <article class="news-card ${isRead ? 'is-read' : ''}" id="card-${item.hash}">
            <div class="news-header">
              <span class="news-num">${isRead ? '✓' : num}</span>
              <h2 class="news-title">${title}</h2>
            </div>
            ${summary ? `<p class="news-summary">${summary}</p>` : ''}
            <div class="news-footer">
              <div class="footer-top-row">
                <div class="meta-group">
                  <span class="news-source">📌 ${source}</span>
                  ${datetimeFa ? `<span class="news-datetime">🕒 ${datetimeFa}</span>` : ''}
                  ${category ? `<span class="news-category-badge" onclick="filterByTag('${category}')">📂 ${category}</span>` : ''}
                </div>
              </div>
              ${tags && tags.length > 0 ? `
                <div class="footer-tags-row">
                  ${tags.map(t => `<span class="news-tag-chip" onclick="filterByTag('${t}')">#${t}</span>`).join('')}
                </div>
              ` : ''}
              <div class="footer-bottom-row">
                <div class="footer-actions-right">
                  <button class="btn-mark-read" onclick="toggleRead('${item.hash}')">
                    ${isRead ? '✓ خوانده شد' : '○ علامت خوانده‌شده'}
                  </button>
                </div>
                <div class="footer-actions-left">
                  ${link && link.startsWith('http') ? `<a href="${link}" target="_blank" rel="noopener noreferrer" class="news-link">مطالعه اصل خبر ↗</a>` : ''}
                </div>
              </div>
            </div>
          </article>
        `;
      }).join('');
    }

    function filterByTag(val) {
      const searchInput = document.getElementById('searchInput');
      if (searchInput) {
        searchInput.value = val;
        searchQuery = val;
        renderNews();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    }

    function switchTab(tab, el) {
      currentTab = tab;
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      if (el) el.classList.add('active');
      renderNews();
    }

    function toggleTheme() {
      const html = document.documentElement;
      const current = html.getAttribute('data-theme') || 'dark';
      const next = current === 'dark' ? 'light' : 'dark';
      html.setAttribute('data-theme', next);
      localStorage.setItem('theme', next);
      updateThemeButton(next);
    }

    function updateThemeButton(theme) {
      const icon = document.getElementById('themeIcon');
      const text = document.getElementById('themeText');
      if (theme === 'dark') {
        icon.textContent = '☀️';
        text.textContent = 'حالت روشن';
      } else {
        icon.textContent = '🌙';
        text.textContent = 'حالت تاریک';
      }
    }

    function toggleArchiveModal(show) {
      const modal = document.getElementById('archiveModal');
      if (show) {
        renderArchiveList();
        modal.classList.add('active');
      } else {
        modal.classList.remove('active');
      }
    }

    function renderArchiveList() {
      const listContainer = document.getElementById('archiveListContainer');
      if (!archiveManifest || archiveManifest.length === 0) {
        listContainer.innerHTML = '<div style="text-align:center; padding: 20px; color: var(--text-muted);">هنوز شماره قبلی ثبت نشده است.</div>';
        return;
      }

      listContainer.innerHTML = archiveManifest.map(item => `
        <a href="${item.url}" class="archive-item">
          <div>
            <div class="archive-date-fa">📰 شماره ${item.p_date}</div>
            <div class="archive-date-g">🌍 ${item.g_date}</div>
          </div>
          <span class="archive-arrow">←</span>
        </a>
      `).join('');
    }

    const savedTheme = localStorage.getItem('theme') || 'dark';
    document.documentElement.setAttribute('data-theme', savedTheme);
    updateThemeButton(savedTheme);

    document.getElementById('searchInput').addEventListener('input', (e) => {
      searchQuery = e.target.value.trim();
      renderNews();
    });

    renderNews();
  </script>
</body>
</html>
