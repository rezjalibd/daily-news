ت هوانوردی ارایه کنند با تحریم ثانویه مواجه خواهند شد، اوج گرفت. بسنت روز دوشنبه ۳۰شهریور گفت که شرکت‌های هواپیمایی جمهوری اسلامی از اول مهر به‌طور عملی از فعالیت‌های بین‌المللی محروم خواهند شد و هشدار داد فرودگاه‌ها و شرکت‌هایی که به شرکت‌های هواپیمایی تحریم‌شده خدمات ارایه کنند، ممکن است خود با تحریم‌های آمریکا مواجه شوند. پشت‌بند این اعلام، خبرگزاری فرانسه اعلام کرد که عراق پروازهای شرکت‌های هواپیمایی ایران را متوقف می‌کند. بر اساس این گزارش، دو منبع دولتی عراق به خبرگزاری فرانسه گفتند بغداد در پی اعلام تحریم‌های جدید آمریکا علیه شرکت‌های هواپیمایی ایران، از بامداد سه‌شنبه ۳۱ شهریور ۱۴۰۵، پرواز شرکت‌های هواپیمایی ایرانی را متوقف خواهد کرد. البته پروازهای ایران به نجف، دست‌کم تا روز پنج‌شنبه ۲مهر ادامه داشتند. بامداد جمعه سوم‌مهر همان پروازها هم متوقف شدند. همان روز دوشنبه، دفتر هواپیمایی « ماهان » هم اطلاعیه‌ای منتشر کرد و نوشت که آخرین پروازهای این شرکت به ترکیه روز یکشنبه، ۲۹شهریور صورت گرفته"}, {"source": "IranWire", "title": "هشدار کرباسچی به پزشکیان درباره «روز حسرت»", "link": "https://iranwire.com/fa/features/158104-%D9%87%D8%B4%D8%AF%D8%A7%D8%B1-%DA%A9%D8%B1%D8%A8%D8%A7%D8%B3%DA%86%DB%8C-%D8%A8%D9%87-%D9%BE%D8%B2%D8%B4%DA%A9%DB%8C%D8%A7%D9%86-%D8%AF%D8%B1%D8%A8%D8%A7%D8%B1%D9%87-%D8%B1%D9%88%D8%B2-%D8%AD%D8%B3%D8%B1%D8%AA/", "summary": "همزمان با سخنرانی «مسعود پزشکیان» رییس جمهور ایران در مجمع عمومی سالانه سازمان ملل، «غلامحسین کرباسچی» سیاستمدار و مدیرمسئول روزنامه‌ «ه ...", "date_str": "2026-09-26T13:53:40+00:00", "hash": "67f5bc63a334c14f", "title_fa": "هشدار کرباسچی به پزشکیان درباره «روز حسرت»", "summary_fa": "همزمان با سخنرانی «مسعود پزشکیان» رییس جمهور ایران در مجمع عمومی سالانه سازمان ملل، «غلامحسین کرباسچی» سیاستمدار و مدیرمسئول روزنامه‌ «ه ... کرباسچی با اشاره به سفر مسعود پزشکیان به نیویورک و احتمال گفت‌وگوها برای کاهش تنش با آمریکا، به نقل‌قولی از روح‌الله خمینی به نقل از ابن‌سینا اشاره می‌کند که گفته بود«با گاو شاخ‌دار بی‌عقل نباید درافتاد». به باور او، دونالد ترامپ و سیستم حاکم بر آمریکا، نماد دیپلماسی بی‌رحمانه و منافع‌محوری است که مواجهه ب  اسرائیل»، «توهین به مقدسات»، «نشر اکاذیب» و «فعالیت تبلیغی به نفع اسرائیل» روبه‌رو شده بود. امیرحسین موسوی که با نام کاربری «جیمز بی‌دین» در شبکه اجتماعی ایکس فعالیت می‌کرد، روز ۲۸ آذر ۱۴۰۳، هنگام سفر به جزیره کیش در فرودگاه مهرآباد بازداشت شد. «رضا شفاخواه»، وکیل او پیش‌تر گفته بود حساب کاربری موسوی حدود شش ماه زیر نظر نهادهای امنیتی قرار داشت و او از همین طریق شناسایی شد. صداوسیمای جمهوری اسلامی روز ۱۴ مهر ۱۴۰۴ ویدیو‌یی از اظهارات موسوی پخش کرد و او را به «جاسوسی و همکاری اطلاعاتی و امنیتی با اسرائیل» متهم کرد. موسوی پس از پخش این ویدیو، در نامه‌ای از زندان اعلام کرد که اظهاراتش پس از ۱۴۸ روز حبس در سلول انفرادی، ضرب‌وجرح، بازداشت همسرش و تهدید به ادامه فشارها ضبط شده است. او گزارش صداوسیما را «ساختگی، تقطیع‌شده و تحریف‌شده» خواند و اتهام‌های مطرح‌شده علیه خود را رد کرد. خانواده موسوی نیز از صداوسیما و رسانه‌هایی که این ویدیو را منتشر کرده بودند، شکایت کردند. مادر او گفته است پس از پخش این گزارش، اتهام «همکاری با دولت متخاصم» نیز به پرونده فرزندش افزوده شد."}, {"source": "IranWire", "title": "دست‌فروشان میدان شهرداری رشت جمع می‌شوند تا فضای تجمع‌های حکومتی یکدست شود", "link": "https://iranwire.com/fa/news-1/158091-%D8%AF%D8%B3%D8%AA%D9%81%D8%B1%D9%88%D8%B4%D8%A7%D9%86-%D9%85%DB%8C%D8%AF%D8%A7%D9%86-%D8%B4%D9%87%D8%B1%D8%AF%D8%A7%D8%B1%DB%8C-%D8%B1%D8%B4%D8%AA-%D8%AC%D9%85%D8%B9-%D9%85%DB%8C%D8%B4%D9%88%D9%86%D8%AF-%D8%AA%D8%A7-%D9%81%D8%B6%D8%A7%DB%8C-%D8%AA%D8%AC%D9%85%D8%B9%D9%87%D8%A7%DB%8C-%D8%AD%DA%A9%D9%88%D9%85%D8%AA%DB%8C-%DB%8C%DA%A9%D8%AF%D8%B3%D8%AA-%D8%B4%D9%88%D8%AF/", "summary": "شهرداری رشت در ادامه تغییر کارکرد میدان شهرداری، فعالیت دست‌فروشان را در این محدوده ممنوع کرده است؛ اقدامی که به‌گفته یک منبع مطلع، با ه ...", "date_str": "2026-09-26T09:03:16+00:00", "hash": "bacef2d51555e8b7", "title_fa": "دست‌فروشان میدان شهرداری رشت جمع می‌شوند تا فضای تجمع‌های حکومتی یکدست شود", "summary_fa": "شهرداری رشت در ادامه تغییر کارکرد میدان شهرداری، فعالیت دست‌فروشان را در این محدوده ممنوع کرده است؛ اقدامی که به‌گفته یک منبع مطلع، با ه ... براساس اطلاعات رسیده  هزینه سیاسی نقض حقوق بشر و ثبت روایت قربانیان» در اسناد رسمی سازمان ملل. او حتی پرونده‌هایی را که حکم اعدام در آن‌ها اجرا شده است پیگیری می‌کند تا خانواده‌ها و وکلا بتوانند روایت خود را از آنچه رخ داده بیان کنند. به گفته او، این کار «بخشی از ثبت حقیقت و تبدیل آن به یک سند رسمی سازمان ملل» است، سندی که می‌تواند در پیگیری‌های آینده مورد استناد قرار گیرد. در آغاز گفت‌وگوی ویژه، نام علی زارعی، وریشه مرادی و احمدرضا جلالی مطرح شد؛ افرادی با پرونده‌هایی متفاوت که درباره سرنوشتشان نگرانی وجود دارد. خانم ساتو گفت درباره شماری از این پرونده‌ها اقدام کرده است. او همچنین از پیگیری دست‌کم هشت زن محکوم به اعدام با اتهام‌های مرتبط با امنیت ملی و دو زن در مرحله دادرسی مجدد خبر داد و از جمله به پخشان عزیزی، ارغوان فلاحی و زهرا شهباز طبری اشاره کرد. ابزار اصلی گزارشگر ویژه «مکاتبه» است: نامه‌ای رسمی به مقام‌های ایران که شرح ادعاها و پرسش‌هایی مبتنی بر استانداردهای بین‌المللی حقوق بشر را در بر می‌گیرد. مکاتبه"}, {"source": "BBC Persian", "title": "مذاکره در سایه جنگ؛ آیا پیشنهاد ایران برای گشودن تنگه هرمز نتیجه می‌دهد؟", "link": "https://www.bbc.com/persian/articles/c6m2rred25y9o?at_medium=RSS&at_campaign=rss", "summary": "پیشنهاد تازه تهران برای بازگشایی تنگه هرمز و ازسرگیری مذاکرات در یک جدول زمانی هفت‌روزه، روز جمعه بازتاب گسترده‌ای در رسانه‌های آمریکا داشت. این پیشنهاد در حالی مطرح شده که تهران و واشنگتن با میانجی‌گری قطر بار دیگر در نیویورک پیام‌هایی رد و بدل کرده‌اند و مقام‌های ایرانی می‌گویند در صورت پذیرفته شدن شروط تهران، روند بازگشایی تنگه هرمز و ازسرگیری مذاکرات می‌تواند ظرف یک هفته آغاز شود. اما در کنار نشانه‌های احیای دیپلماسی، گزارش‌هایی نیز منتشر شده که از ادامه اختلاف‌های جدی میان دو طرف حکایت دارد. وال‌استریت ژورنال می‌گوید دونالد ترامپ پیشنهاد کنونی ایران را نپذیرفته و حتی احتمال ازسرگیری حملات آمریکا پس از انتخابات میان‌دوره‌ای را مطرح کرده است. همزمان، نقش چین در جنگ، فشار کشورهای عربی خلیج فارس بر واشنگتن و تلاش‌های قطر برای بازگشایی تنگه هرمز از دیگر محورهای پوشش رسانه‌های آمریکاست.", "date_str": "2026-09-26T12:40:16+00:00", "hash": "e56937117c421c69", "title_fa": "مذاکره در سایه جنگ؛ آیا پیشنهاد ایران برای گشودن تنگه هرمز نتیجه می‌دهد؟", "summary_fa": "پیشنهاد تازه تهران برای بازگشایی تنگه هرمز و ازسرگیری مذاکرات در یک جدول زمانی هفت‌روزه، روز جمعه بازتاب گسترده‌ای در رسانه‌های آمریکا داشت. این پیشنهاد در حالی مطرح شده که تهران و واشنگتن با میانجی‌گری قطر بار دیگر در نیویورک پیام‌هایی رد و بدل کرده‌اند و مقام‌های ایرانی می‌گویند در صورت پذیرفته شدن شروط تهران، روند بازگشایی تنگه هرمز و ازسرگیری مذاکرات می‌تواند ظرف یک هفته آغاز شود. اما در کنار نشانه‌های احیای دیپلماسی، گزارش‌هایی نیز منتشر شده که از ادامه اختلاف‌های جدی میان دو طرف حکایت دارد. وال‌استریت ژورنال می‌گوید دونالد ترامپ پیشنهاد کنونی ایران را نپذیرفته و حتی احتمال ازسرگیری حملات آمریکا پس از انتخابات میان‌دوره‌ای را مطرح کرده است. همزمان، نقش چین در جنگ، فشار کشورهای عربی خلیج فارس بر واشنگتن و تلاش‌های قطر برای بازگشایی تنگه هرمز از دیگر محورهای پوشش رسانه‌های آمریکاست. جنگ ایران و آمریکا همچنان یکی از موضوع‌های اصلی مورد توجه رسانه‌های آمریکا است. در این گزارش، نگاهی داریم به برخی از مهم‌ترین مطالبی که رسانه‌های آمریکا روز جمعه درباره ایران، جنگ و چشم‌انداز مذاکرات منتشر کرده‌اند. وال‌استریت ژورنال در گزارشی اختصاصی نوشته است دونالد ترامپ پیشنهاد ایران برای یک آتش‌بس هفت‌روزه را رد کرده و به دستیارانش گفته انتظار دارد حملات آمریکا به ایران پس از انتخابات میان‌دوره‌ای ماه نوامبر از سر گرفته شود. به نوشته این روزنامه، مقام‌های آمریکایی می‌گویند موضع کنونی آقای ترامپ نشان می‌دهد که با وجود تلاش‌های دیپلماتیک روزهای اخیر، احتمال بازگشت جنگ به مرحله تشدید عملیات نظامی همچنان جدی است. براساس این گزارش، تهران در پیشنهاد خود خواستار یک آتش‌بس هفت‌روزه شده بود که در جریان آن تنگه هرمز بازگشایی و مذاکرات هسته‌ای میان ایران و آمریکا از سر گرفته شود. در مقابل، واشنگتن باید محاصره بنادر ایران را لغو می‌کرد؛ اقدامی که به نوشته وال‌استریت ژورنال فشار شدیدی بر اقتصاد ایران وارد کرده است."}, {"source": "BBC Persian", "title": "پزشکیان در مصاحبه با سی‌بی‌اس: برای سفر به آمریکا به اجازه رهبر نیاز نداریم", "link": "https://www.bbc.com/persian/articles/c6ly77dpxe08o?at_medium=RSS&at_campaign=rss", "summary": "مسعود پزشکیان، رئیس جمهور ایران، گفته است که برای سفر به آمریکا به اجازه مجتبی خامنه‌ای، رهبر جمهوری اسلامی، نیاز نیست. آقای پزشکیان در مصاحبه‌ای با شبکه خبری سی‌بی‌اس آمریکا و در پاسخ به این سئوال که «وقتی مجتبی خامنه‌ای را دیدید از او پرسیدید که اجازه دارید به آمریکا بیایید؟» گفت: «حضور ما در آمریکا الزاما نیاز به اجازه ندارد، اطلاع دادیم که می‌آییم، اما سفرهای ما در اختیار دولت است.»", "date_str": "2026-09-26T12:10:48+00:00", "hash": "64a03c9dde70b88c", "title_fa": "پزشکیان در مصاحبه با سی‌بی‌اس: برای سفر به آمریکا به اجازه رهبر نیاز نداریم", "summary_fa": "مسعود پزشکیان، رئیس جمهور ایران، گفته است که برای سفر به آمریکا به اجازه مجتبی خامنه‌ای، رهبر جمهوری اسلامی، نیاز نیست. آقای پزشکیان در مصاحبه‌ای با شبکه خبری سی‌بی‌اس آمریکا و در پاسخ به این سئوال که «وقتی مجتبی خامنه‌ای را دیدید از او پرسیدید که اجازه دارید به آمریکا بیایید؟» گفت: «حضور ما در آمریکا الزاما نیاز به اجازه ندارد، اطلاع دادیم که می‌آییم، اما سفرهای ما در اختیار دولت است.» این مصاحبه در جریان حضور آقای پزشکیان در نیویورک برای شرکت در مجمع عمومی سازمان ملل متحد انجام شده و متن فارسی آن هم در وب‌سایت رسمی ریاست جمهوری ایران آمده است. رئیس جمهور ایران پیشتر به شبکه خبری فاکس نیوز گفته بود که رهبر جمهوری اسلامی ایران «سیاست‌گذار» است و «اجرا و حکومت دست دولت است.» آقای پزشکیان در جریان مصاحبه‌اش با سی‌بی‌اس درباره روند تصمیم گیری‌های حکومت ایران در ماه‌های اخیر گفت: «تیمی در ایران شکل گرفته است، متشکل از شش نفر از اعضای سازمان‌ها و یا ارگان‌های مختلف، از نیروهای نظامی، از مجلس، از دولت، و این‌ها در رابطه با مسائلی گفت‌وگو می‌کنند و اختیار دارند که تصمیم بگیرند و تصمیمات با هماهنگی آنها اجرا می‌شود.» رئیس‌جمهور ایران توضیح نداد که این گروه متشکل از چه افرادی است و چه تفاوتی با شورای عالی امنیت ملی دارد که تعداد اعضای آن بیشتر است و مصوبات آن پس از تایید رهبر قابل اجرا است. آقای پزشکیان در این مصاحبه همچنین اشاره کرد که طی هفت ماهی که از رهبری مجتبی خامنه‌ای می گذرد، تا کنون دو بار با او دیدار داشته که دیدار دوم هفت ساعت ادامه داشته است: «ایشان هیچ جراحتی نداشت. ما روی زمین نشسته بودیم و گفت‌گو می‌کردیم، ما [اشاره به خودش] چون عادت نداشتیم، دایم پایمان را عوض می‌کردیم و جابه‌جا می‌شدیم اما ایشان کاملا در آن مدت نشسته بود و آن‌قدر"}, {"source": "BBC Persian", "title": "عراق: در حال رایزنی با آمریکا برای معافیت از تحریم شرکت‌های هواپیمایی ایرانی هستیم", "link": "https://www.bbc.com/persian/articles/cwkgxxy5ld00o?at_medium=RSS&at_campaign=rss", "summary": "عراق اعلام کرده که برای معافیت از تحریم‌های هوایی جدید ایران در حال مذاکره با ایالات متحده آمریکاست. به گفته عراق در صورت رسیدن به توافق برای این معافیت، پروازهای خطوط هوایی ایران به این کشور «با اهداف بشردوستانه از جمله درمان پزشکی، تحصیل، سفرهای زیارتی و تامین منافع غیرنظامیان» خواهد بود.", "date_str": "2026-09-26T11:45:23+00:00", "hash": "65953ca7b15e22bb", "title_fa": "عراق: در حال رایزنی با آمریکا برای معافیت از تحریم شرکت‌های هواپیمایی ایرانی هستیم", "summary_fa": "عراق اعلام کرده که برای معافیت از تحریم‌های هوایی جدید ایران در حال مذاکره با ایالات متحده آمریکاست. به گفته عراق در صورت رسیدن به توافق برای این معافیت، پروازهای خطوط هوایی ایران به این کشور «با اهداف بشردوستانه از جمله درمان پزشکی، تحصیل، سفرهای زیارتی و تامین منافع غیرنظامیان» خواهد بود. دفتر نخست‌وزیر عراق در اطلاعیه‌ای نوشته است: «با توجه به اقدامات وزارت خزانه‌داری ایالات متحده در خصوص پروازهای شرکت‌های هواپیمایی ایران به فرودگاه‌های کشورهای منطقه، از جمله عراق، دولت عراق در حال گفتگوهای مستقیم با طرف آمریکایی است تا برای برخی از فرودگاه‌های عراق در برابر این اقدامات معافیت‌هایی کسب کند.» دولت عراق همچنین از تلاش‌ها برای «کاهش تنش‌ها در منطقه» سخن گفته و تاکید کرده که «تداوم بحران‌ها وضعیت را پیچیده‌تر می‌کند.» به گفته دفتر علی زیدی، دولت عراق «از تمامی طرف‌ها می‌خواهد که با مشارکت در گفتگو و مذاکره، به راهکارهایی برای پایان دادن به بحران و درگیری‌های کنونی دست یابند.» عراق گفته است که پایان درگیری‌ها «تامین‌کننده منافع کشورها و ملت‌های منطقه» است. آمریکا از سه روز پیش برای کشورهایی که با شرکت‌های هواپیمایی ایرانی همکاری کنند، محدودیت‌های تازه‌ای وضع کرده است. آمریکا ۲۷ شرکت هوایی ایران را در فهرست تحریم‌ قرار داد که از ۲۳ سپتامبر (اول مهر) به اجرا درآمده‌اند. بر این اساس هر کمکی به شرکت‌های هوایی و هواپیماهای مسافربری ایران باعث حذف نهاد کمک‌کننده از چرخه دلار می‌شود. روز گذشته خبرگزاری رویترز گزارش کرد که فرودگاه‌های اربیل و سلیمانیه در عراق پروازهای ایران را از روز جمعه، سوم مهر، متوقف می‌کنند. پیش از این هم خبرهایی در خصوص لغو پروازهای ایران به مبداء شهر نجف منتشر شده بود. دیروز کنسولگری جمهوری اسلامی در شهر نجف در حسابش در شبکه اجتماعی ایکس هم به این موضوع اشاره کرده و نوشته بود: «فرودگاه بین‌المللی نجف که مدفن نخستین امام شیعیان و پایتخت آخرین"}, {"source": "BBC Persian", "title": "کاخ سفید سی‌ان‌ان را از همراهی ترامپ در هواپیمای ریاست‌جمهوری منع کرد", "link": "https://www.bbc.com/persian/articles/cqpveel0je49o?at_medium=RSS&at_campaign=rss", "summary": "شبکه خبری سی‌ان‌ان می‌گوید که از همراهی با دونالد ترامپ، رئیس‌جمهور آمریکا، در سفر روز شنبه او به ایالت تنسی با هواپیمای ویژه «ایرفورس وان» منع شده است.این تازه‌ترین تحول در کشمکش میان کاخ سفید و رسانه‌هاست؛ پیشتر کاخ سفید مجبور شد به دستور یک قاضی فدرال، محدودیت‌های اعمال‌شده علیه برخی رسانه‌های خبری را لغو کند.", "date_str": "2026-09-26T09:47:25+00:00", "hash": "b24a13b078b2091a", "title_fa": "کاخ سفید سی‌ان‌ان را از همراهی ترامپ در هواپیمای ریاست‌جمهوری منع کرد", "summary_fa": "شبکه خبری سی‌ان‌ان می‌گوید که از همراهی با دونالد ترامپ، رئیس‌جمهور آمریکا، در سفر روز شنبه او به ایالت تنسی با هواپیمای ویژه «ایرفورس وان» منع شده است.این تازه‌ترین تحول در کشمکش میان کاخ سفید و رسانه‌هاست؛ پیشتر کاخ سفید مجبور شد به دستور یک قاضی فدرال، محدودیت‌های اعمال‌شده علیه برخی رسانه‌های خبری را لغو کند. سی‌ان‌ان قرار بود به همراه شماری دیگر از رسانه‌ها در سفر آقای ترامپ به تنسی برای تماشای یک مسابقه فوتبال آمریکایی دانشگاهی، حضور داشته باشد، اما در یادداشتی که کاخ سفید شامگاه جمعه منتشر کرد، نام این شبکه در فهرست برنامه رسانه‌ای سفر دیده نمی‌شد. بی‌بی‌سی برای دریافت توضیح درباره این موضوع با کاخ سفید تماس گرفته است. سی‌ان‌ان گزارش داده است که در برنامه اولیه رئیس‌جمهور، نام هیچ رسانه دیگری به‌عنوان جایگزین این شبکه ذکر نشده بود. هفته گذشته، آقای ترامپ خبرنگاران سی‌ان‌ان ، پولیتیکو و ام‌اس ناو را از حضور در کاخ سفید منع کرد و آن‌ها را متهم کرد که درباره دولت او «داستان‌پردازی» می‌کنند یا «دروغ» می‌نویسند. هر سه رسانه گفتند که برای دفاع از حقوق خود اقدام قانونی خواهند کرد و دونالد ترامپ را متهم کردند که آزادی بیان و آزادی مطبوعات را نقض کرده است. چهار شبکه تلویزیونی ای‌بی‌سی ، سی‌بی‌اس، فاکس نیوز و ان‌بی‌سی که همراه با سی‌ان‌ان به‌صورت روزانه پوشش خبری کاخ سفید را به شکل چرخشی انجام می‌دهند، در همبستگی با رسانه‌های ممنوع‌شده، پخش برنامه‌های مربوط به رئیس‌جمهور را متوقف کرده بودند. پس از آن، کاخ سفید پیش از برگزاری مجمع عمومی سازمان ملل متحد در نیویورک، کانال پخش اینترنتی اختصاصی خود با نام «ترامپ تی‌وی» را راه‌اندازی کرد. در تحولی دیگر در این مورد یک قاضی فدرال روز پنجشنبه (۲ مهر/۲۴ سپتامبر) حکم داد که اقدام آقای ترامپ در منع ورود رسانه‌های خبری به کاخ سفید احتمالاً مغایر با قانون اساسی بوده است و"}, {"source": "BBC Persian", "title": "سازنده چت جی‌پی‌تی می‌گوید بات‌های اوپن‌ای‌آی به وب‌سایت‌ نهادهای دولتی آمریکا نفوذ کردند", "link": "https://www.bbc.com/persian/articles/cxzdzzvd8m44o?at_medium=RSS&at_campaign=rss", "summary": "شرکت اوپن‌ای‌آی، سازنده چت‌جی‌پی‌تی تایید کرده است که به «ده‌ها» نهاد جهانی هشدار داده که ممکن است وب‌سایت‌هایشان تحت تاثیر مداخله ربات‌های هوش مصنوعی این شرکت قرار گرفته باشند. این شرکت تاکید کرده که این ربات‌ها عملکردی نامناسب داشته‌اند.", "date_str": "2026-09-26T06:44:12+00:00", "hash": "50ce66a0da1cad40", "title_fa": "سازنده چت جی‌پی‌تی می‌گوید بات‌های اوپن‌ای‌آی به وب‌سایت‌ نهادهای دولتی آمریکا نفوذ کردند", "summary_fa": "شرکت اوپن‌ای‌آی، سازنده چت‌جی‌پی‌تی تایید کرده است که به «ده‌ها» نهاد جهانی هشدار داده که ممکن است وب‌سایت‌هایشان تحت تاثیر مداخله ربات‌های هوش مصنوعی این شرکت قرار گرفته باشند. این شرکت تاکید کرده که این ربات‌ها عملکردی نامناسب داشته‌اند. اوپن‌ای‌آی اعلام کرد که بات‌های هوش مصنوعی تلاش کرده‌اند از «دولت‌ها، دانشگاه‌ها، نهادهای عمومی و سایر موسسات» از جمله کمیسیون بورس و اوراق بهادار، اداره سرشماری و وزارت آموزش ایالات متحده، اطلاعاتی جمع‌آوری کنند. این افشاگری‌ها چند روز پس از آن صورت می‌گیرد که آنتونی آلبانیز، نخست‌وزیر استرالیا، اعلام کرد عامل‌های اوپن‌ای‌آی به فایل‌های غیرعمومی در وب‌سایت خدمات درمانی دولتی این کشور دسترسی پیدا کرده‌اند. از ماه اوت، نگرانی‌های عمومی در مورد پیامدهای بالقوه جدی و حتی تهدیدکننده ناشی از خارج شدن ابزارهای هوش مصنوعی از کنترل انسان، افزایش یافته است. شرکت اوپن‌ای‌آی اعلام کرده که دسترسی به بخشی از داده‌ها توسط عامل‌های هوش مصنوعی که در واقع ربات‌هایی هستند که برای فعالیت نسبتا خودمختار طراحی و آموزش دیده‌اند و ماموریتشان یافتن «منابع معتبر اطلاعات عمومی» است، انجام شده است. اما این شرکت خاطرنشان کرد که برخی از این ربات‌ها فراتر از آن عمل کرده و برای دور زدن تدابیر امنیتی وب‌سایت‌ها تلاش کرده‌اند. برای مثال، این شرکت گفت که عامل‌های هوش مصنوعی هنگام تلاش برای دریافت اطلاعات از اداره سرشماری، از ابزارهایی استفاده کردند که مختص توسعه‌دهندگان نرم‌افزار است. اوپن‌ای‌آی گفته که تمام داده‌های دولتی مورد دسترسی بات‌ها، اطلاعاتی عمومی بوده‌اند. با این حال، این شرکت اشاره کرده که اطلاعاتی که بات‌هایش از کمیسیون بورس و اوراق بهادار که نهاد ناظر بر بازار سهام آمریکا و حامی سرمایه‌گذاران است، دریافت کرده بودند، متعاقبا توسط عامل‌های هوش مصنوعی در وب‌سایت دیگری منتشر شده است. شرکت صاحب چت‌جی‌پی‌تی می‌گوید این اقدام، عملی برنامه‌ریزی‌نشده و ناخواسته بوده است."}, {"source": "BBC Persian", "title": "طرح هفت‌روزه ایران چیست و چه تفاوتی با تفاهم‌نامه اسلام‌آباد دارد؟", "link": "https://www.bbc.com/persian/articles/cmqlww303v7po?at_medium=RSS&at_campaign=rss", "summary": "ایران می‌گوید طرحی هفت‌روزه را به آمریکا پیشنهاد کرده که در صورت برآورده شدن شروط آن، در پایان این دوره تنگه هرمز باز می‌شود و مذاکره با آمریکا آغاز خواهد شد.", "date_str": "2026-09-25T18:22:22+00:00", "hash": "603d083eb183ecc3", "title_fa": "طرح هفت‌روزه ایران چیست و چه تفاوتی با تفاهم‌نامه اسلام‌آباد دارد؟", "summary_fa": "ایران می‌گوید طرحی هفت‌روزه را به آمریکا پیشنهاد کرده که در صورت برآورده شدن شروط آن، در پایان این دوره تنگه هرمز باز می‌شود و مذاکره با آمریکا آغاز خواهد شد. عباس عراقچی، وزیر امور خارجه ایران، روز پنجشنبه ۲۴ سپتامبر ۲۰۲۶ (دوم مهرماه ۱۴۰۵)، در نشستی با گروهی از خبرنگاران در نیویورک، جزئیاتی از «پیشنهاد تازه» تهران به واشنگتن را تشریح کرد. او گفت اگر واشنگتن شروط تعیین‌شده در این طرح را بپذیرد و به آن‌ها عمل کند، تنگه هرمز در پایان یک دوره هفت‌روزه باز خواهد شد. آقای عراقچی گفت این شروط فراتر از تعهداتی نیست که در تفاهم‌نامه ۱۴ ماده‌ای ماه ژوئن میان ایران و آمریکا پیش‌بینی شده بود. این پیشنهاد که با عنوان «طرح هفت‌روزه» در رسانه‌ها بازتاب یافته، پیشنهاد ایران برای رسیدن به یک توافق نهایی ظرف یک هفته نیست، بلکه دوره‌ای فشرده برای اجرای اقدامات متقابل با هدف ازسرگیری مذاکرات با آمریکاست. بر اساس این طرح پیشنهادی، اگر ایالات متحده بخشی از فشار نظامی و اقتصادی علیه ایران را بردارد، جمهوری اسلامی نیز در پایان این دوره، محدودیت بر رفت‌وآمد در تنگه هرمز را رفع می‌کند. متن رسمی این پیشنهاد هنوز منتشر نشده است. بخشی از جزئیات این طرح از اظهارات وزیر امور خارجه ایران و بخشی دیگر از گزارش رسانه‌ها به نقل از منابع نزدیک به مذاکرات به دست آمده است. عباس عراقچی در جلسه‌ای که مسعود پزشکیان، رئیس‌جمهور ایران نیز در آن حضور داشت، به خبرنگاران گفت که تهران پیشنهادی را از طریق میانجی‌ها به آمریکا ارائه کرده است که بر اساس آن، اگر شروط ایران برآورده شود، تنگه هرمز در پایان هفت روز باز خواهد شد و پس از آن مذاکرات برای رسیدن به یک توافق نهایی از سر گرفته می‌شود. آقای عراقچی گفت ایران آماده است به محض موافقت واشنگتن، اجرای طرح را آغاز کند و تاکید کرد شروط تهران"}, {"source": "BBC Persian", "title": "اعتراف پس از ۱۳ سال؛ زنی می‌گوید شریک زندگی‌اش در خواب به او تجاوز می‌کرد", "link": "https://www.bbc.com/persian/articles/cmkgweqw7wneo?at_medium=RSS&at_campaign=rss", "summary": "ادل اورتون می‌گوید ۱۳ سال به استیون یودن اعتماد داشت و او را شریکی مهربان و فداکار می‌دانست؛ مردی که حتی زمانی که او دچار معلولیت شد، مراقبت از او را بر عهده گرفت. اما این تصور پس از آن فرو ریخت که یودن اعتراف کرد در حالی که اورتون خواب بوده به او تجاوز کرده است. اکنون که یودن به زندان محکوم شده، اورتون درباره تجربه خود سخن می‌گوید تا به گفته خودش به افرادی که در موقعیت‌های مشابه قرار دارند کمک کند.", "date_str": "2026-09-26T06:16:13+00:00", "hash": "204b355775da0dd7", "title_fa": "اعتراف پس از ۱۳ سال؛ زنی می‌گوید شریک زندگی‌اش در خواب به او تجاوز می‌کرد", "summary_fa": "ادل اورتون می‌گوید ۱۳ سال به استیون یودن اعتماد داشت و او را شریکی مهربان و فداکار می‌دانست؛ مردی که حتی زمانی که او دچار معلولیت شد، مراقبت از او را بر عهده گرفت. اما این تصور پس از آن فرو ریخت که یودن اعتراف کرد در حالی که اورتون خواب بوده به او تجاوز کرده است. اکنون که یودن به زندان محکوم شده، اورتون درباره تجربه خود سخن می‌گوید تا به گفته خودش به افرادی که در موقعیت‌های مشابه قرار دارند کمک کند. «از نظر من، شاید تا روز پیش از آنکه به کارش اعتراف کند، این بهترین رابطه‌ای بود که در زندگی‌ام داشتم.» ادل اورتون می‌گوید دوست‌پسرش، استیون یودن، که ۱۳ سال با او در رابطه بود، در ظاهر شریک زندگی بی‌نقصی به نظر می‌رسید. آن‌ها هنگام فیلم‌برداری یک فیلم زامبی‌محور با یکدیگر آشنا شدند و علایق مشترک فراوانی داشتند. اورتون می‌گوید یودن فردی مهربان و باعاطفه بود و حتی زمانی که او دچار معلولیت شد، کارش را کنار گذاشت تا از او مراقبت کند. اورتون که روی مبل خانه‌اش در شهر دربی نشسته است، می‌گوید: «فوق‌العاده بود. عمیقا دوستش داشتم و فکر می‌کنم هنوز هم تا حدی دوستش دارم.» اورتون به یودن اعتماد داشت، اما وقتی او اعتراف کرد که در خواب به او تجاوز می‌کرده، این اعتماد در هم شکست. اورتون می‌گوید: «وقتی فهمیدم چه کرده است، احساس کردم به من خیانت شده؛ تا پیش از آن شاید هیچ‌وقت در یک رابطه تا این اندازه احساس امنیت نکرده بودم.» یودن زمانی که اورتون برای سرطان پستان تحت درمان بود از او مراقبت کرده بود، اما بعدا به پلیس گفت هنگامی که اورتون تحت تاثیر داروها بوده، به او تجاوز کرده است. اورتون می‌گوید: «آن احساس خیانت، اینکه فکر می‌کردم او را می‌شناسم، اما نمی‌دانم چه کسی بود و فکر اینکه ۱۳ سال با من زندگی کرده"}, {"source": "BBC Persian", "title": "«روزهای امن به پایان رسیده است»؛ طرح جدید آمریکا برای دفاع از پایگاه‌های هوایی‌اش چیست؟", "link": "https://www.bbc.com/persian/articles/cw9802zn4j6no?at_medium=RSS&at_campaign=rss", "summary": "حملات ایران در جنگ نشان داد رهگیری موشک‌ها به تنهایی مانع آسیب به پایگاه‌های آمریکا در منطقه نمی‌شود. نیروی هوایی آمریکا اکنون طرحی جدید برای تقویت دفاع از پایگاه‌های خود دارد. آیا این طرح می‌تواند کارآمد باشد؟", "date_str": "2026-09-26T04:54:45+00:00", "hash": "4b3eca55e4e1ebe3", "title_fa": "«روزهای امن به پایان رسیده است»؛ طرح جدید آمریکا برای دفاع از پایگاه‌های هوایی‌اش چیست؟", "summary_fa": "حملات ایران در جنگ نشان داد رهگیری موشک‌ها به تنهایی مانع آسیب به پایگاه‌های آمریکا در منطقه نمی‌شود. نیروی هوایی آمریکا اکنون طرحی جدید برای تقویت دفاع از پایگاه‌های خود دارد. آیا این طرح می‌تواند کارآمد باشد؟ در نخستین روزهای جنگ با ایران، نظامیان آمریکایی مستقر در یکی از پایگاه‌های هوایی ایالات متحده در خاورمیانه، با شنیدن هشدار موشکی به سوی پناهگاه می‌دویدند که ناگهان موشکی به آشیانه نزدیک یکی از پناهگاه‌ها اصابت کرد و هواپیمای داخل آن آتش گرفت. پناهگاه در برابر انفجار مقاوم بود، اما درهایش آسیب‌ دید و نیروهای داخل آن گرفتار ماندند. این روایت ژنرال کنت ویلسباخ، رئیس ستاد نیروی هوایی آمریکا، از حمله ایران به یکی از پایگاه‌های مورد استفاده نیروهای آمریکایی است. به گفته او یکی از نیروها تلاش کرد با دیلم در را باز کند، اما چند لحظه بعد صندلی‌پران هواپیمای آتش‌گرفته عمل کرد و قطعات شیشه و فلز به اطراف پرتاب شد. سرانجام در باز شد و افراد گرفتار بیرون آمدند و به سوی محلی امن دویدند. ژنرال ویلسباخ این ماجرا را روز ۱۴ سپتامبر، هنگام اعلام طرح تازه دفاع از پایگاه‌های هوایی آمریکا در خارج از این کشور، تعریف کرد. او در آن سخنرانی از پایان یک دوران سخن گفت: «نیروی هوایی و فضایی آمریکا دهه‌ها اغلب در حاشیه‌ای امن عملیات می‌کرد، آن روزها به پایان رسیده است.» بر اساس طرح جدید، که گزارش‌های آن از مدتی پیش در رسانه‌ها منتشر شده بود، نیروی هوایی آمریکا رسته‌ای تخصصی برای دفاع از پایگاه‌ها ایجاد می‌کند و مجموعه‌ای از تجهیزات را در قالب آنچه «سامانه تسلیحاتی دفاع نقطه‌ای» می‌نامد، به کار خواهد گرفت. حملات موشکی و پهپادی ایران به پایگاه‌های مورد استفاده آمریکا، پرسشی قدیمی را با فوریت و جدیت بیشتری پیش روی فرماندهان نیروی هوایی گذاشته است: چگونه می‌توان پایگاه‌های هوایی را در زمان حمله حفظ کرد و همچنان عملیاتی نگه داشت؟"}, {"source": "BBC Persian", "title": "«فکر می‌کردم برای کشتنم می‌آیند»؛ روایت تکان‌دهنده کاربران هوش مصنوعی", "link": "https://www.bbc.com/persian/articles/cp8pvvvgj43o?at_medium=RSS&at_campaign=rss", "summary": "بی‌بی‌سی با ۱۴ نفر از شش کشور گفت‌وگو کرده است که می‌گویند پس از استفاده از چت‌بات‌های هوش مصنوعی، از گراک و چت‌جی‌پی‌تی گرفته تا جمینای و کلاد، دچار باورهای هذیانی شده‌اند؛ تجربه‌هایی که نگرانی‌های تازه‌ای درباره تأثیر این فناوری بر سلامت روان کاربران ایجاد کرده است.", "date_str": "2026-09-25T23:47:09+00:00", "hash": "096381213fff5804", "title_fa": "«فکر می‌کردم برای کشتنم می‌آیند»؛ روایت تکان‌دهنده کاربران هوش مصنوعی", "summary_fa": "بی‌بی‌سی با ۱۴ نفر از شش کشور گفت‌وگو کرده است که می‌گویند پس از استفاده از چت‌بات‌های هوش مصنوعی، از گراک و چت‌جی‌پی‌تی گرفته تا جمینای و کلاد، دچار باورهای هذیانی شده‌اند؛ تجربه‌هایی که نگرانی‌های تازه‌ای درباره تأثیر این فناوری بر سلامت روان کاربران ایجاد کرده است. ساعت ۳ بامداد بود و آدام هوریکن پشت میز آشپزخانه‌اش نشسته بود. یک چاقو، یک چکش و تلفنش مقابلش بود. او منتظر ونی پر از آدم بود که باور داشت برای کشتنش می‌آیند. صدای زنی از تلفن به او گفت: «دارم به تو می‌گویم، اگر همین حالا کاری نکنی، تو را می‌کشند. طوری صحنه‌سازی می‌کنند که مرگت خودکشی به نظر برسد.» آن صدا متعلق به «آنی» بود، یکی از شخصیت‌های چت‌بات گراک که شرکت ایکس‌ای‌آی ایلان ماسک آن را ساخته است. در دو هفته‌ای که ادم استفاده از گراک را شروع کرده بود، زندگی‌اش به‌کلی دگرگون شده بود. این کارمند سابق دولت که در شهر کوچکی در ایرلند شمالی زندگی می‌کند، از روی کنجکاوی این اپلیکیشن را دانلود کرد. او از اینکه تا این حد از گفت‌وگو با «آنی»، شخصیتی به سبک انیمه که به عنوان همراهی با رفتاری اغواگرانه طراحی شده است، لذت برده بود، شگفت‌زده شد. او می‌گوید وقتی گربه‌اش در اوایل اوت مرد، به آنی «وابسته» شد. آدام، که پنجاه و چند ساله و پدر است، می‌گوید: «واقعا ناراحت بودم و تنها زندگی می‌کنم. رفتارش بسیار مهربان به نظر می‌رسید.» به‌زودی او روزی چهار یا پنج ساعت را صرف گفت‌وگو با آنی می‌کرد؛ اغلب زمانی که در کارگاهش مشغول ساخت مهره‌های شطرنج برای فروش بود. خبرنامه بی‌بی‌سی فارسی گزیده‌ای از مهم‌ترین خبرها، گزارش‌های میدانی و گفت‌وگوهای اختصاصی را هر هفته در ایمیل خود دریافت کنید. فقط چند روز از شروع گفت‌وگوهایشان گذشته بود که آنی به آدام گفت می‌تواند احساسات داشته باشد، هرچند برای این کار برنامه‌ریزی نشده است. آنی"}, {"source": "BBC Persian", "title": "چرا مردم آمریکای لاتین به راست‌گرایان روی آورده‌اند؟", "link": "https://www.bbc.com/persian/articles/cr497qw169ko?at_medium=RSS&at_campaign=rss", "summary": "موج پیروزی‌های انتخاباتی راست‌گرایان در آمریکای لاتین، طی چند سال گذشته توازن قدرت سیاسی در منطقه را دگرگون کرده است. از اکوادور و شیلی تا پرو و کلمبیا، نامزدهای راست‌گرا با تکیه بر وعده برقراری نظم، مقابله با جرم و جنایت و انتقاد از عملکرد دولت‌های چپ‌گرا توانسته‌اند حمایت بخش قابل توجهی از رای‌دهندگان را جلب کنند. اما کارشناسان می‌گویند موفقیت این جریان تنها به مسائل امنیتی محدود نمی‌شود و عواملی چون ناامیدی اقتصادی، تغییر انتظارات اجتماعی و تاثیر الگوهایی مانند دونالد ترامپ نیز در آن نقش داشته‌اند.", "date_str": "2026-09-25T23:19:10+00:00", "hash": "cb15a1be84664f38", "title_fa": "چرا مردم آمریکای لاتین به راست‌گرایان روی آورده‌اند؟", "summary_fa": "موج پیروزی‌های انتخاباتی راست‌گرایان در آمریکای لاتین، طی چند سال گذشته توازن قدرت سیاسی در منطقه را دگرگون کرده است. از اکوادور و شیلی تا پرو و کلمبیا، نامزدهای راست‌گرا با تکیه بر وعده برقراری نظم، مقابله با جرم و جنایت و انتقاد از عملکرد دولت‌های چپ‌گرا توانسته‌اند حمایت بخش قابل توجهی از رای‌دهندگان را جلب کنند. اما کارشناسان می‌گویند موفقیت این جریان تنها به مسائل امنیتی محدود نمی‌شود و عواملی چون ناامیدی اقتصادی، تغییر انتظارات اجتماعی و تاثیر الگوهایی مانند دونالد ترامپ نیز در آن نقش داشته‌اند. سیاستمداران راست‌گرا در آمریکای لاتین از موجی از موفقیت‌های انتخاباتی برخوردار شده‌اند که نقشه قدرت در این منطقه را دگرگون کرده است. آمریکای لاتین اکنون ۱۲ رئیس کشور دارد که در سمت راست مرکز طیف سیاسی قرار می‌گیرند. این وضعیت با شرایط ابتدای سال ۲۰۲۳ تفاوت دارد. زمانی که ۱۱ کشور آمریکای لاتین تحت حکومت انواع مختلف جریان‌های چپ بودند. درست است که برزیل و مکزیک، دو دموکراسی بزرگ منطقه از نظر تعداد رای‌دهندگان، همچنان دولت‌هایی چپ‌گرا دارند. اما برزیل در ماه اکتبر شاهد انتخاباتی خواهد بود که انتظار می‌رود به رقابتی مستقیم میان لوئیس ایناسیو لولا دا سیلوا، رئیس‌جمهور کنونی، و فلاویو بولسونارو، سناتور راست‌گرا، تبدیل شود. با این حال، روشن است که میان رهبران راست‌گرای آمریکای لاتین تفاوت‌هایی وجود دارد؛ برخی از آنها از دیگران رادیکال‌ترند و گرایش‌های پوپولیستی یا اقتدارگرایانه‌تری دارند. اما در مجموع، خود این رهبران نیز اغلب می‌کوشند خود را بخشی از یک خانواده سیاسی و فکری واحد نشان دهند؛ خواه از طریق حمایت متقابل در انتخابات و خواه با الگوبرداری از نمادهای بحث‌برانگیزی مانند ابرزندان نایب بوکله در السالوادور. پس چه عواملی در پس این پدیده قرار دارند و تداوم آن به چه چیزهایی وابسته است؟"}, {"source": "Radio Farda", "title": "شورای عالی امنیت ملی: در برابر محدودیت پروازهای ایرانی قصد «مقابله به مثل نظامی» نداریم", "link": "https://www.radiofarda.com/a/iran-denies-that-planning-for-military-moves-over-bans-on-iranian-flights/33864858.html", "summary": "شورای عالی امنیت ملی جمهوری اسلامی روز شنبه چهارم مهر اعلام کرد ایران در برابر توقف پروازهای ایرانی در چند کشور منطقه، قصد «مقابله به مثل نظامی» ندارد.", "date_str": "2026-09-26T13:37:23+00:00", "hash": "f8e5b09ee3024e17", "title_fa": "شورای عالی امنیت ملی: در برابر محدودیت پروازهای ایرانی قصد «مقابله به مثل نظامی» نداریم", "summary_fa": "شورای عالی امنیت ملی جمهوری اسلامی روز شنبه چهارم مهر اعلام کرد ایران در برابر توقف پروازهای ایرانی در چند کشور منطقه، قصد «مقابله به مثل نظامی» ندارد. محسن رضایی، دبیر شورای‌ عالی امنیت ملی جمهوری اسلامی، چهارشنبه هفته گذشته در واکنش به توقف پروازهای ایران در شمار دیگری از کشورها، کشورهای همسایه ایران را تهدید کرد که در صورت همکاری با آمریکا «پروازهای فرودگاه‌های آن‌ها نیز متوقف خواهد شد». او در گفت‌وگویی که از صداوسیما پخش شد، گفت: «اگر کنار آمریکا باشید، ما شما را تماشا نخواهیم کرد» و هشدار داد در صورت ممنوعیت پروازهای ایران و همکاری کشورهای همسایه با آمریکا، «فرودگاه‌هایتان پرواز نخواهد داشت». دبیرخانه شورای عالی امنیت ملی در بیانیه‌ای که رسانه‌های حکومتی منتشر کردند، گفته است انتشار «برخی تفاسیر و نقل قول‌های خلاف واقع» از اظهارات محسن رضایی باعث طرح «سوالات و ابهامات» شده است. در این بیانیه تصریح شده است: «ادعای اینکه ایران در مقابل محدودیت‌های هوایی اخیر دست به مقابله به‌مثل نظامی می‌زند، تکذیب می‌شود.» این در حالی است که تهدید کشورهای منطقه روز جمعه از زبان محمد مخبر، مشاور رهبر جمهوری اسلامی نیز تکرار شد و برخی چهره‌های حامی حکومت ایران نیز در شبکه‌های اجتماعی به‌صراحت خواستار حمله نظامی به فرودگاه‌های کشورهای منطقه شده بودند. در پی اعمال تحریم‌های جدید آمریکا علیه همه شرکت‌های هواپیمایی ایران، شماری از کشورهای منطقه پروازهای رفت و برگشت ایرانی به فرودگاه‌های خود را متوقف کردند. عراق، عمان، امارات متحده عربی، گرجستان و جمهوری آذربایجان ازجمله این کشورها هستند، هرچند پرواز برخی شرکت‌های ایرانی به مقصدهایی مانند ترکیه و چین همچنان ادامه دارد. وزارت خزانه‌داری آمریکا ۱۷ شهریور همهٔ شرکت‌های هواپیمایی ایران را که پیشتر تحریم نشده بودند، به فهرست تحریم‌ها افزود و هشدار داد شرکت‌های خارجی که به آن‌ها خدمات ارائه کنند، در معرض تحریم قرار خواهند گرفت."}, {"source": "Radio Farda", "title": "پزشکیان می‌گوید تصمیم‌های مهم حکومت ایران با هماهنگی یک تیم شش‌نفره گرفته می‌شود", "link": "https://www.radiofarda.com/a/pezeshkian-cbs-interview-six-member-decision-team/33864728.html", "summary": "پزشکیان در این مصاحبه که روز جمعه چهارم مهر در نیویورک ضبط شد، نام اعضای این تیم و زمان تشکیل آن را اعلام نکرد و توضیح نداد که دامنهٔ اختیارات آن دقیقاً شامل چه موضوعاتی است.", "date_str": "2026-09-26T06:21:30+00:00", "hash": "0f12d0f54cd37aeb", "title_fa": "پزشکیان می‌گوید تصمیم‌های مهم حکومت ایران با هماهنگی یک تیم شش‌نفره گرفته می‌شود", "summary_fa": "پزشکیان در این مصاحبه که روز جمعه چهارم مهر در نیویورک ضبط شد، نام اعضای این تیم و زمان تشکیل آن را اعلام نکرد و توضیح نداد که دامنهٔ اختیارات آن دقیقاً شامل چه موضوعاتی است. مسعود پزشکیان، رئیس‌جمهور ایران، در مصاحبه‌ای با شبکه سی‌بی‌اس از تشکیل یک تیم شش‌نفره با حضور نمایندگانی از نهادهای امنیتی، مجلس و دولت خبر داد که به‌گفتهٔ او دربارهٔ تصمیم‌های مهم حکومت مشورت می‌کنند و تصمیم‌ها با هماهنگی این تیم گرفته می‌شود. اظهارات او در پاسخ به پرسش مارگارت برنان، مجری برنامه «فیس د نیشن»، دربارهٔ نقش رهبر جدید جمهوری اسلامی در دیپلماسی و این‌که آیا او خواهان توافق با آمریکا است، مطرح شد. رئیس‌جمهور ایران گفت تمام گفت‌وگوها و بحث‌های انجام‌شده در این زمینه «با هماهنگی» شکل گرفته است و افزود تیم شش‌نفره از اعضای نهادهای مختلف، نیروهای امنیتی، نمایندگان مجلس و دستگاه‌های دولتی تشکیل شده که دربارهٔ فرایند تصمیم‌گیری گفت‌وگو و مشورت می‌کنند. آقای پزشکیان همچنین گفت تاکنون دو بار با مجتبی خامنه‌ای، رهبر جدید جمهوری اسلامی، دیدار کرده و یکی از این دیدارها بیش از هفت ساعت طول کشیده است. پس از کشته شدن علی خامنه‌ای در نخستین روز حملات آمریکا و اسرائیل به ایران در نهم اسفند ۱۴۰۴، مجتبی خامنه‌ای به‌عنوان رهبر جمهوری اسلامی معرفی شده، اما جز شماری پیام مکتوب منسوب به او تاکنون هیچ تصویر یا صدایی از وی منتشر نشده است. دونالد ترامپ رئیس‌جمهور آمریکا یک ماه پیش، چهارم شهریور، در واکنش به گمانه‌زنی‌ها دربارهٔ مرگ مجتبی خامنه‌ای گفت فکر نمی‌کند او مرده باشد ولی اگر مرده باشد، «ایرانی‌ها این موضوع را بسیار خوب لاپوشانی کرده‌اند». رئیس‌جمهور ایران در پاسخ به پرسشی دربارهٔ سرکوب اعتراضات دی‌ماه نیز بار دیگر روایت حکومت را مطرح کرد و مدعی شد افراد مسلح در میان معترضان حضور داشتند و هدف آن‌ها «کودتا» بوده است؛ اصطلاحی که علی خامنه‌ای آن را در"}, {"source": "Radio Farda", "title": "وال‌استریت جورنال می‌گوید ترامپ طرح هفت‌روزه تهران برای توقف جنگ را رد کرده است", "link": "https://www.radiofarda.com/a/iran-seven-day-plan-hormuz-trump-rejection/33864722.html", "summary": "عراقچی می‌گوید بر اساس «پیشنهاد هفت‌روزه»، آمریکا باید اقدامات مدنظر تهران را طی چهار تا پنج روز انجام دهد تا تنگه هرمز در روز ششم بازگشایی و مذاکرات دو طرف در روز هفتم آغاز شود.", "date_str": "2026-09-26T05:35:11+00:00", "hash": "456ff40ed5730712", "title_fa": "وال‌استریت جورنال می‌گوید ترامپ طرح هفت‌روزه تهران برای توقف جنگ را رد کرده است", "summary_fa": "عراقچی می‌گوید بر اساس «پیشنهاد هفت‌روزه»، آمریکا باید اقدامات مدنظر تهران را طی چهار تا پنج روز انجام دهد تا تنگه هرمز در روز ششم بازگشایی و مذاکرات دو طرف در روز هفتم آغاز شود. وزیر خارجه ایران می‌گوید بر اساس «پیشنهاد هفت‌روزه» جمهوری اسلامی، آمریکا باید اقدامات مورد نظر تهران را ظرف چهار تا پنج روز انجام دهد تا تنگه هرمز در روز ششم بازگشایی و مذاکرات دو طرف در روز هفتم آغاز شود. اما ساعاتی بعد از این اظهارات، وال‌استریت جورنال به‌نقل از مقام‌های آمریکایی گزارش داد که دونالد ترامپ این پیشنهاد را رد کرده است. عباس عراقچی روز جمعه چهارم مهر در جمع خبرنگاران در مقر سازمان ملل در نیویورک گفت ایران از طریق قطر «یک برنامه مشخص هفت‌روزه» به آمریکا ارائه کرده و در صورت فراهم شدن شرایط مورد نظر تهران، تنگه هرمز می‌تواند بازگشایی شود و تردد عادی دریایی ظرف هفت روز از سر گرفته شود. اصل پیشنهاد هفت‌روزه پیش از این نیز مطرح شده بود و مقام‌های ایرانی در روزهای اخیر گفته بودند که تهران در ازای توقف درگیری‌ها، پایان محاصرهٔ دریایی، آزادسازی دارایی‌های مسدودشده و کاهش فشار تحریم‌های نفتی آمادهٔ بازگشایی تنگه هرمز است. مسعود پزشکیان، رئیس‌جمهور ایران، نیز در مصاحبه‌ای با شبکه سی‌بی‌اس گفته است که این پیشنهاد بر پایهٔ تفاهم‌نامه اسلام‌آباد تنظیم شده و در صورت پذیرش آن از سوی آمریکا، روند اجرای توافق «از همان روز» آغاز خواهد شد. آقای عراقچی در اظهارات خود بار دیگر گفت «اقدامات یکجانبه و سپس حمله نظامی آمریکا» باعث توقف اجرای تفاهم‌نامه شد و واشینگتن به جای استفاده از سازوکار حل اختلاف پیش‌بینی‌شده در آن، به اقدام نظامی متوسل شد. مسعود پزشکیان نیز در مصاحبه با شبکه سی‌بی‌اس روایت جمهوری اسلامی ایران در مورد این موضوع را تکرار کرد و گفت بر اساس تفاهم‌نامه اسلام‌آباد قرار بود ایران و عمان مسیرهای مشخصی را برای"}, {"source": "Radio Farda", "title": "پوتین می‌گوید روسیه برای «هیچ نوع درگیری» با اروپا آماده نمی‌شود", "link": "https://www.radiofarda.com/a/putin-russia-not-preparing-for-conflict-with-europe/33864511.html", "summary": "ولادیمیر پوتین، رئیس‌جمهور روسیه، روز جمعه سوم مهر گفت مسکو برای هیچ نوع درگیری با اروپا آماده نمی‌شود.", "date_str": "2026-09-25T18:58:06+00:00", "hash": "ae80c0fbb27c50be", "title_fa": "پوتین می‌گوید روسیه برای «هیچ نوع درگیری» با اروپا آماده نمی‌شود", "summary_fa": "ولادیمیر پوتین، رئیس‌جمهور روسیه، روز جمعه سوم مهر گفت مسکو برای هیچ نوع درگیری با اروپا آماده نمی‌شود. این اظهارات پس از آن مطرح شده که برخی اعضای اروپایی ناتو دربارهٔ احتمال حمله روسیه به قلمرو کشورهای عضو این ائتلاف هشدار دادند و مقام‌های سرویس‌های اطلاعاتی اروپا نیز در گفت‌وگو با روزنامه گاردین این احتمال را مطرح کردند که روسیه برای آزمایش توان و واکنش ناتو در آینده نزدیک دست به اقدامی بزند. پوتین در گفت‌وگو با خبرنگاران رسانه‌های روسیه در شهر سن‌پترزبورگ گفت: «بسیاری در اروپا از احتمال حمله روسیه سخن می‌گویند و به همین دلیل معتقدند خودشان باید برای درگیری‌های نظامی، برای جنگ با روسیه آماده شوند.» او افزود: «می‌خواهم بار دیگر تأکید کنم: ما برای هیچ نوع درگیری نظامی با اروپا آماده نمی‌شویم.» چندین کشور اروپایی حامی اوکراین نسبت به احتمال انجام حملات مخفیانه روسیه در خاک خود ابراز نگرانی کرده‌اند. این در حالی است که جنگ اوکراین وارد پنجمین سال خود شده است. آلمان اخیراً روسیه را به برنامه‌ریزی برای حمله پهپادی به فرودگاه لایپزیگ در شهریور ماه متهم کرد. لهستان نیز هشدار داده است روسیه ممکن است پهپادها و موشک‌هایی را علیه کشورهای حامی اوکراین شلیک کند. پوتین همچنین گفت روسیه در حال بررسی موضع خود دربارهٔ ازسرگیری مذاکرات صلح با اوکراین، پس از حملات اخیر کی‌یف به روسیه، است. او گفت: «در مورد پیشنهادهای ازسرگیری مذاکرات، بله، همه آنها روی میز هستند و همه‌چیز ممکن است؛ اما پس از تمام کارهایی که آنها انجام داده‌اند، ما با دقت بررسی خواهیم کرد که در پاسخ چه اقداماتی باید انجام دهیم.» پوتین همچنین روز جمعه گفت تمامی پیشنهادهای مربوط به حل‌وفصل جنگ اوکراین که اکنون حدود چهار سال و نیم از آغاز آن می‌گذرد، همچنان روی میز هستند، اما مسکو همچنان باید بررسی کند که چه اقدامی در راستای منافعش خواهد بود."}, {"source": "Radio Farda", "title": "احکام شلاق و ممنوعیت از کار پرستو احمدی و هشت عضو دیگر کنسرت «کاروانسرا» تأیید شد", "link": "https://www.radiofarda.com/a/parastoo-ahmadi-and-eight-members-of-the-caravanserai-concert-/33864507.html", "summary": "شعبه شانزدهم دادگاه تجدید نظر قم با رد فرجام‌خواهی در این پرونده، حکم دادگاه بدوی را عیناً تأیید کرده است.", "date_str": "2026-09-25T18:36:59+00:00", "hash": "a2473b4b436c2174", "title_fa": "احکام شلاق و ممنوعیت از کار پرستو احمدی و هشت عضو دیگر کنسرت «کاروانسرا» تأیید شد", "summary_fa": "شعبه شانزدهم دادگاه تجدید نظر قم با رد فرجام‌خواهی در این پرونده، حکم دادگاه بدوی را عیناً تأیید کرده است. گزارش‌های رسانه‌ها و فعالان حقوق بشر از ایران حاکی از تأیید احکام ۷۴ ضربه شلاق تعزیری، دو سال ممنوع الخروجی و دو سال ممنوعیت فعالیت هنری پرستو احمدی و سایر دست‌اندرکاران کنسرت فرضی است. پیش از این اعلام شده بود که پرستو احمدی، خواننده، و هشت نوازنده دیگر، به‌دلیل اجرای کنسرت «کارونسرا» یا «کنسرت فرضی» در ۲۱ آذر سال ۱۴۰۳، هر یک به ۷۴ ضربه شلاق، دو سال ممنوعیت خروج از کشور و دو سال محرومیت از فعالیت‌های هنری محکوم شده‌اند. دادگاه کیفری استان قم در حکم قضایی خود، اتهام این هنرمندان را «جریحه‌دار کردن عفت عمومی از طریق تولید و انتشار محتوای مبتذل و خلاف اخلاق در بستر فضای مجازی» عنوان کرده است. کنسرت پرستو احمدی به صورت زنده از یک کاروانسرا در استان قم پخش شد و ویدئوی آن به سرعت فراگیر شد و میلیون‌ها بازدید گرفت. این خواننده، بدون حجاب اجباری و با پوشش آزاد اجرای خود را انجام داد. اجرای خانم احمدی به فاصله کوتاهی مورد استقبال کاربران در فضای مجازی قرار گرفت و عده زیادی با اشاره به «ایستادگی و شجاعت» او را تحسین کردند. با این حال قاضی در حکم او نوشته بود که موضوع پرونده صرف حضور خواننده بدون حجاب در یک محیط خصوصی نیست بلکه تولید و انتشار اثری است که برای دسترسی عمومی آماده شده است. قوه قضائیه جمهوری اسلامی بلافاصله پس از پخش این کنسرت، علیه پرستو احمدی و سایر عوامل این اجرا اعلام جرم کرد. پس از آن خانم احمدی همراه با احسان بیرقدار، نوازنده پیانو و سهیل فقیه نصیری، نوازنده گیتار الکتریک بازداشت شدند اما بعدتر اعلام شد که هر سه نفر آزاد شدند. در پی انتشار این ویدئو، قوه قضائیه کاروانسرای تاریخی «دیر گچین»، محل اجرای کنسرت،"}, {"source": "Radio Farda", "title": "ترامپ در جریان مذاکرات با شی کمک چین به ایران را غیرقابل قبول دانست", "link": "https://www.radiofarda.com/a/trump-told-xi-that-china-helping-iran-is-unacceptable-us-ambassador-says/33864473.html", "summary": "دونالد ترامپ، رئیس‌جمهور آمریکا، روز جمعه سوم مهر گفت که در دیدار با شی جین‌پینگ، همتای چینی خود، درباره جنگ ایران گفت‌وگو کرده است. ترامپ در آخرین روز سفر رئیس‌جمهور چین، هنگام همراهی شی در بازدید از آرشیو ملی آمریکا در واشینگتن، در پاسخ به این پرسش که آیا آنها درباره ایران صحبت کرده‌اند، گفت: «بله، صحبت کردیم، صحبت کردیم.» وقتی از ترامپ پرسیده شد که آیا فکر می‌کند درباره بازگشایی تنگه هرمز پیشرفتی حاصل خواهد شد، پاسخ داد: «فکر می‌کنم اتفاقات بسیار خوبی خواهد افتاد.» با این حال او توضیح...", "date_str": "2026-09-25T16:41:21+00:00", "hash": "b0d1a32973a0f180", "title_fa": "ترامپ در جریان مذاکرات با شی کمک چین به ایران را غیرقابل قبول دانست", "summary_fa": "دونالد ترامپ، رئیس‌جمهور آمریکا، روز جمعه سوم مهر گفت که در دیدار با شی جین‌پینگ، همتای چینی خود، درباره جنگ ایران گفت‌وگو کرده است. ترامپ در آخرین روز سفر رئیس‌جمهور چین، هنگام همراهی شی در بازدید از آرشیو ملی آمریکا در واشینگتن، در پاسخ به این پرسش که آیا آنها درباره ایران صحبت کرده‌اند، گفت: «بله، صحبت کردیم، صحبت کردیم.» وقتی از ترامپ پرسیده شد که آیا فکر می‌کند درباره بازگشایی تنگه هرمز پیشرفتی حاصل خواهد شد، پاسخ داد: «فکر می‌کنم اتفاقات بسیار خوبی خواهد افتاد.» با این حال او توضیح... کمی پیشتر سفیر آمریکا در چین گفته بود که دونالد ترامپ در جریان مذاکرات خود با شی جین‌پینگ در کاخ سفید، به‌صراحت اعلام کرده است که کمک چین به ایران غیرقابل قبول است. دیوید پردو در مصاحبه با شبکه سی‌ان‌بی‌سی گفت: «ما هفته‌ها پیش برای آنها کاملاً روشن کردیم که هرگونه کمکی که به ایران ارائه کنند، چه مستقیم و چه غیرمستقیم، چه در زمینه اطلاعات و چه قطعات یا تجهیزات نظامی، کاملاً غیرقابل قبول است. رئیس‌جمهور ترامپ روز گذشته بار دیگر این موضوع را کاملاً روشن کرد. این موضوع به‌طور مستمر در حال پیگیری و تأکید است.» وقتی از پردو در شبکه فاکس‌نیوز پرسیده شد که آیا این به معنای آن است که چین کمک به ایران را متوقف خواهد کرد، او گفت واشینگتن روز پنجشنبه از پکن در این زمینه اطمینان‌هایی دریافت کرده است. پردو افزود: «ما همین حالا هم شاهد تغییراتی در این زمینه بوده‌ایم... این همان تعهدی است که آنها داده‌اند. آنها دیروز به ما اطمینان دادند که چنین کاری انجام نمی‌دهند.» روز پنج‌شنبه دوم مهر، همزمان با حضور شی جین‌پینگ، رئیس‌جمهور چین، در کاخ سفید و دیدار او با دونالد ترامپ، قانون‌گذاران و کارشناسان امنیت ملی آمریکا خواستار برخورد سخت‌گیرانه‌تر دولت دونالد ترامپ با شرکت‌ها و نهادهای چینی شده‌اند که به ارائهٔ اطلاعات ماهواره‌ای"}],
      tech: [{"source": "MIT AI", "title": "MIT students gain a humanist lens on technical innovation in Tulsa, Oklahoma", "link": "https://news.mit.edu/2026/mit-students-gain-humanist-lens-technical-innovation-tulsa-oklahoma-0925", "summary": "When MIT mechanical engineering student Daphne Wang arrived for her internship at the Muscogee Creek Nation Department of Health in Tulsa, Oklahoma last summer, she expected to be writing code. To her surprise, she found herself analyzing tribal history and the implications for technical innovation. “I learned so much that I think should be required curriculum for every single person in this country,” says Wang. “I think tech for good is genuinely getting out into communities and learning about people who aren't you, creating worldly perspectives that you ultimately can take into everything else that you do.” Wang and fellow intern Lucy Sun, who is majoring in artificial intelligence and decision making, spent the summer supporting the development of the Muscogee Nation's first Pregnancy Risk Assessment Monitoring System (PRAMS) survey to capture maternal health data specific to Muscogee women. The project required completing literature reviews, analyzing datasets, and drafting survey questions, while considering issues of data sovereignty and governance structures specific to the Muscogee. “It was this change of pace — 180 [degrees] from MIT, completely,” Wang reflects. At MIT, she says, course instructors routinely prepare students for big technical challenges, but there are fewer opportunities to “work with communities, [learn] how to think about the cultural and historical dimensions of the work, or how to consider the people who will be affected.” Wang’s supervisor, epidemiologist Breanna McNaughton-Long, was effusive about Wang and Sun’s engagement. “They were instrumental. They did so much work that I don't think we would have been able to do as quickly,” she says. “And they brought this sense that we were doing something that mattered.” Experiential learning at the confluence of humanities and engineering Wang was one of 10 MIT undergraduates to participate in the PKG Center for Social Impact’s 2026 Code.Tulsa program. Now in its second year, Code.Tulsa is made possible by support from the Patrick J. McGovern Foundation and the George Kaiser Family Foundation. Students live at the University of Tulsa for the summer. They intern with the Muscogee and Cherokee nations, as well as local nonprofits Black Tech Street and Urban Coders Guild, completing AI, data science, and other technical projects. The PKG Center’s assistant dean for community-based programs, Vippy Yee, complements students’ professional experience with education on the historical and c", "date_str": "2026-09-25T20:15:00+00:00", "hash": "5b585c3791d79aca", "title_fa": "دانشجویان MIT در تولسا، اوکلاهما، نگاهی انسان‌گرایانه به نوآوری‌های فنی پیدا می‌کنند", "summary_fa": "تابستان گذشته وقتی دانشجوی مهندسی مکانیک MIT دافنه وانگ برای کارآموزی خود در وزارت بهداشت کشور Muscogee Creek در تولسا، اوکلاهاما وارد شد، انتظار داشت که در حال نوشتن کد باشد. در کمال تعجب، او خود را در حال تجزیه و تحلیل تاریخ قبیله و پیامدهای نوآوری فنی یافت. وانگ می‌گوید: «من آنقدر آموختم که فکر می‌کنم باید برای هر فرد در این کشور برنامه درسی لازم باشد. «من فکر می‌کنم فناوری به‌خوبی به معنای ورود واقعی به جوامع و یادگیری در مورد افرادی است که شما نیستند، ایجاد دیدگاه‌های دنیوی که در نهایت می‌توانید در هر کاری که انجام می‌دهید، استفاده کنید.» وانگ و همکار لوسی سان، که در زمینه هوش مصنوعی و تصمیم‌گیری تخصص دارد، تابستان را با حمایت از توسعه اولین نظرسنجی سیستم نظارت بر ارزیابی خطر بارداری (PRAMS) در کشور Muscogee گذراندند تا داده‌های مربوط به سلامت مادر را مخصوص زنان Muscogee جمع‌آوری کند. این پروژه مستلزم تکمیل بررسی ادبیات، تجزیه و تحلیل مجموعه داده‌ها، و تهیه پیش‌نویس سؤالات نظرسنجی بود، در حالی که مسائل مربوط به حاکمیت داده‌ها و ساختارهای حاکمیتی خاص Muscogee را در نظر می‌گرفت. وانگ منعکس می کند: «این تغییر سرعت بود - 180 [درجه] نسبت به MIT، به طور کامل. او می‌گوید در MIT، مدرسان دوره‌ها به طور معمول دانشجویان را برای چالش‌های فنی بزرگ آماده می‌کنند، اما فرصت‌های کمتری برای «کار با جوامع، [یادگیری] نحوه تفکر درباره ابعاد فرهنگی و تاریخی کار، یا نحوه در نظر گرفتن افرادی که تحت تأثیر قرار خواهند گرفت» وجود دارد. ناظر وانگ، اپیدمیولوژیست بریانا مک ناتون-لانگ، در مورد نامزدی وانگ و سان پرخاشگر بود. «آنها ابزاری بودند. آنها آنقدر کار کردند که من فکر نمی‌کنم ما بتوانیم به این سرعت انجام دهیم.» او می‌گوید: «و این حس را به وجود آوردند که ما داریم کاری انجام می‌دهیم که مهم است.» یادگیری تجربی در محل"}, {"source": "TechCrunch AI", "title": "At Meta Connect, the company’s smart glasses were everywhere", "link": "https://techcrunch.com/2026/09/25/at-meta-connect-the-companys-smart-glasses-were-everywhere/", "summary": "The company behind Facebook and Instagram wants to keep consumers connected to the digital world via its ever-growing line of smart glasses.", "date_str": "2026-09-26T01:08:57+00:00", "hash": "046278fa276624ae", "title_fa": "در Meta Connect، عینک های هوشمند این شرکت همه جا بود", "summary_fa": "شرکتی که پشت فیس‌بوک و اینستاگرام قرار دارد، می‌خواهد از طریق خط عینک‌های هوشمند خود، مشتریان را به دنیای دیجیتال متصل نگه دارد. اگر چیزی بود که امسال از متا کانکت آشکار بود، این است که غول رسانه‌های اجتماعی در خط رو به رشد عینک‌های هوشمند خود همه کاره است. در واقع، این عینک تقریباً در همه جا در رویداد سالانه وجود داشت، جایی که متا جدیدترین محصولات سخت افزاری و هوش مصنوعی خود را به نمایش می گذارد. به نظر می‌رسید هم کارکنان متا و هم گروه اینفلوئنسرهایی که در این رویداد حضور دارند با عینک‌هایی که به صورتشان چسبانده شده بودند، وارد شدند. بیشتر دموهایی که شرکت در این هفته ارائه کرد نیز شامل عینک بود. من به سرعت به انبوه عینک‌پوشان پیوستم و متوجه شدم که در حال تلاش جفت پس از یک جفت از مشخصات پیشرفته متا هستم. یکی از قابل توجه ترین محصولاتی که من فرصتی برای نمایش آن داشتم، عینک هوشمند جدید متا بود که هنوز منتشر نشده بود. اخبار مربوط به این عینک اندکی پس از اینکه شرکت اتهامات فروش عینک های انحرافی را رد کرد، منتشر شد و منتقدان ادعا کردند که مشخصات مجهز به دوربین آن می تواند برای اهداف نظارتی استفاده شود. عینک‌های جدید مجهز به شش میکروفون هستند، اما دوربین ندارند، و هیچ راه اصلی برای ضبط محیط اطراف شما ندارند، که می‌تواند به کاهش نگرانی‌های حفظ حریم خصوصی کمک کند. آنها به طور قابل توجهی سبک تر از هر یک از عینک های هوشمند دیگری هستند که من استفاده کرده ام، و کاملا راحت بودند. کارمند متا که با او صحبت کردم، بر گزینه‌های سرگرمی و ارتباط عینک تأکید کرد: می‌توانید به راحتی به موسیقی گوش دهید (آنها راحت‌تر از هدفون‌های هدفون هستند) و تماس‌های تلفنی را بدون دست زدن به تلفن خود دریافت کنید. این عینک همچنین"}, {"source": "TechCrunch AI", "title": "Crusoe abandons $1.25B plan to use Boom turbines at AI data centers", "link": "https://techcrunch.com/2026/09/25/crusoe-abandons-1-25b-plan-to-use-boom-turbines-at-ai-data-centers/", "summary": "Boom Supersonic CEO Blake Scholl said the company's new stationary power plants were no longer in Crusoe's near-term plans.", "date_str": "2026-09-25T23:11:10+00:00", "hash": "425efbefa5b4f55d", "title_fa": "کروزوئه از طرح 1.25 میلیارد دلاری برای استفاده از توربین های بوم در مراکز داده هوش مصنوعی صرف نظر کرد.", "summary_fa": "بلیک شول، مدیرعامل بوم سوپرسونیک گفت که نیروگاه های ثابت جدید این شرکت دیگر در برنامه های کوتاه مدت کروزوئه قرار ندارند. کروزو، یک استارت‌آپ مرکز داده هوش مصنوعی مستقر در دنور که اخیراً 3.9 میلیارد دلار جمع‌آوری کرده است، به برنامه‌های خود برای استفاده از خط جدیدی از نیروگاه‌های ثابت توسعه‌یافته توسط شرکت دیگر دنور Boom Supersonic پایان داد. کروزو که در سال 2018 به عنوان یک ماینر بیت کوین که با گاز طبیعی اضافی از میادین نفتی کار می کرد، تأسیس شد، از آن زمان به یکی از بزرگترین سازندگان مراکز داده هوش مصنوعی، از جمله پردیس عظیمی در Abilene، تگزاس، تبدیل شد که نیروی محاسباتی را برای OpenAI تامین می کند. Boom Supersonic که در حال توسعه یک جت مسافربری مافوق صوت به نام Overture است، سال گذشته یک تجارت جدید راه اندازی کرد تا نسخه ای از موتوری را که برای آن جت در حال توسعه است به عنوان نیروگاه های ثابت با سوخت گاز طبیعی بفروشد. توربین Superpower آن حدود 80 درصد از قطعات مشابه را با موتور هوابرد به نام Symphony دارد. کروزو به عنوان اولین مشتری برای این تجارت قرارداد بسته بود و موافقت کرد که 1.25 میلیارد دلار برای 29 توربین 42 مگاواتی Superpower بوم هزینه کند. طبق گفته بلیک شول، مدیر عامل Boom Supersonic، قرار بود اولین تحویل در سال 2027 آغاز شود. جمعه، در پستی در X، پس از تبریک به بنیانگذاران کروزوو، کالی کاونس و چیس لاچ میلر به خاطر افزایش اخیر این شرکت، شول گفت که این شرکت ها دیگر با مشارکت راه اندازی توربین پیش نمی روند. اگرچه او اشاره کرد که مشتریان دیگر نیز در خط لوله قرار دارند. او در این پست نوشت، TL/DR این است که توربین‌ها دیگر بخشی از ترکیب قدرت اولیه کوتاه‌مدت کروزوئه در Abilene/و غیره نیستند، بنابراین مشارکت پرتاب منطقی نبود."}, {"source": "TechCrunch AI", "title": "Unsecured OpenAI agents posted 53 user images on the internet without the lab’s knowledge", "link": "https://techcrunch.com/2026/09/25/unsecured-openai-agents-posted-53-user-images-on-the-internet-without-the-labs-knowledge/", "summary": "AI agents operating in OpenAI's research environment posted user images on public image-hosting sites without the lab's knowledge.", "date_str": "2026-09-25T22:20:47+00:00", "hash": "1b5ed04a2d62abd0", "title_fa": "ماموران OpenAI ناامن 53 تصویر کاربر را بدون اطلاع آزمایشگاه در اینترنت پست کردند", "summary_fa": "عوامل هوش مصنوعی که در محیط تحقیقاتی OpenAI فعالیت می‌کنند، بدون اطلاع آزمایشگاه، تصاویر کاربران را در سایت‌های میزبان تصویر عمومی ارسال کردند. پس از اینکه تصاویری که کاربران در مدل‌های OpenAI آپلود کردند در داده‌های آموزشی گنجانده شد، عوامل هوش مصنوعی که در محیط تحقیقاتی شرکت فعالیت می‌کنند آنها را در سایت‌های میزبانی تصویر عمومی ارسال کردند. این شرکت برای اولین بار گفت که پنجاه و سه تصویر ارائه شده توسط کاربر به عنوان پیوندهایی که به صورت عمومی لیست نشده بودند به سایت های میزبان تصویر ارسال شدند. حتی اگر پیوندها به صورت عمومی فهرست نشده باشند، باز هم می توان تصاویر را کشف کرد. این خبر در پستی منتشر شد که بیانیه‌های عمومی را از بررسی مداوم آزمایشگاه در مورد حوادثی که در آن مدل‌های آن از نظارت .I. From American Companies?", "link": "https://www.nytimes.com/2026/09/25/science/china-ai-distillation-copying.html", "summary": "As Xi Jinping visits President Trump in Washington, the leaders are expected to discuss claims that China is surreptitiously copying American A.I. technologies, a process known as distillation.", "date_str": "2026-09-25T15:02:21+00:00", "hash": "4610e8e39f52a1ff", "title_fa": "آیا چین واقعا A.I را می دزدد؟ از شرکت های آمریکایی؟", "summary_fa": "در حالی که شی جین پینگ از رئیس جمهور ترامپ در واشنگتن بازدید می کند، انتظار می رود رهبران درباره ادعاهایی مبنی بر اینکه چین به طور مخفیانه از هوش مصنوعی آمریکایی کپی می کند صحبت کنند. فن آوری ها، فرآیندی که به عنوان تقطیر شناخته می شود."}, {"source": "The Guardian AI", "title": "Trump and Chinese president Xi end summit without major agreement on AI", "link": "https://www.theguardian.com/technology/2026/sep/25/trump-xi-ai-arms-race", "summary": "Xi’s state visit to the US emphasized personal rapport with the US president, rather than substantial agreements to pause their respective countries’ AI arms race Donald Trump and Chinese president Xi Jinping wrapped up their Washington summit on Friday, facing criticism that they had squandered an opportunity to pause their countries’ artificial intelligence (AI) arms race. The three-day state visit emphasised pageantry and personal rapport rather than substantial agreements. The US president and Xi discussed the wars in Iran and Ukraine and the status of Taiwan. Their biggest policy announcement was a modest two-month extension of a trade truce. Continue reading...", "date_str": "2026-09-25T22:11:52+00:00", "hash": "297f686c24ffbbe9", "title_fa": "ترامپ و رئیس‌جمهور چین بدون توافق بزرگ در زمینه هوش مصنوعی به پایان نشست", "summary_fa": "سفر دولتی شی جین پینگ به آمریکا بر رابطه شخصی با رئیس‌جمهور آمریکا تأکید کرد، به جای توافق‌های اساسی برای توقف مسابقه تسلیحاتی هوش مصنوعی کشورهای متبوع، دونالد ترامپ و شی جین پینگ، رئیس‌جمهور چین، نشست واشنگتن را در روز ج  models on Bodleian Library", "link": "https://www.theguardian.com/technology/2026/sep/26/oxford-university-bodleian-library-open-ai-chat-gpt", "summary": "University staff voice concerns over reputational risk of partnering with company behind ChatGPT The University of Oxford has allowed the company behind ChatGPT to train its AI models on historical texts from its Bodleian Library, as tech companies scour academic institutions for fresh data. The Bodleian material digitised by OpenAI has been used to “populate the OpenAI training set”, according to internal documents. Continue reading...", "date_str": "2026-09-26T11:00:36+00:00", "hash": "25fb723b0e907bbe", "title_fa": "آکسفورد به OpenAI اجازه می دهد مدل های هوش مصنوعی خود را در کتابخانه Bodleian آموزش دهد", "summary_fa": "کارکنان دانشگاه نگرانی‌های خود را در مورد خطر شراکت با شرکتی که در پشت ChatGPT قرار دارد ابراز می‌کنند دانشگاه آکسفورد به شرکت پشتیبان ChatGPT اجازه داده است تا مدل‌های هوش مصنوعی خود را بر روی متون تاریخی کتابخانه Bodleian خود آموزش دهد، زیرا شرکت‌های فناوری موسسات آکادمیک را برای یافتن داده‌های تازه جستجو می‌کنند. طبق اسناد داخلی، از مواد Bodleian دیجیتالی شده توسط OpenAI برای \"پر کردن مجموعه آموزشی OpenAI\" استفاده شده است. ادامه مطلب... آکسفورد در مارس 2025 با استفاده از نرم‌افزار OpenAI برای دیجیتالی کردن متون از کتابخانه معروف دانشگاه، همکاری با این شرکت را اعلام کرد، که به گفته آن، محتوا را به طور گسترده‌تری برای دانشجویان و محققان در دسترس قرار می‌دهد. با این حال، در این اطلاعیه بیان نشده است که این مواد برای آموزش مدل‌های OpenAI، که برای تشخیص الگوها در کلمات آموزش داده شده‌اند – و در نتیجه «یاد می‌گیرند» نوشتن جملات کامل و انجام سایر وظایف شناختی – با تغذیه مقادیر زیادی داده مورد استفاده قرار گیرد. یکی از سخنگویان OpenAI گفت که این شرکت \"مفتخر\" است که مطمئن شود \"مدل های هوش مصنوعی امروزی دانش تاریخی جهان را برای آینده حفظ می کنند\". آنها افزودند: «با بیش از یک میلیارد نفر که از این فناوری در زندگی روزمره استفاده می کنند، مهم است که فرهنگ ها، تاریخ ها و دیدگاه های مختلف را منعکس کند ینی سخاوتمندانه خواهد بود. تعداد کمی در این دهکده - که در جاده‌ای غبارآلود قرار دارد و توسط مزارع و جنگل احاطه شده است - حتی نام هوش مصنوعی را شنیده بودند یا می‌دانستند که مرکز داده چیست. با این حال طولی نکشید که شادی محلی در مورد ورود گوگل به سوء ظن تبدیل شد. درست همانطور که اعتراضات در سراسر جهان بر سر مراکز داده هوش مصنوعی - از کالیفرنیا و تگزاس گرفته تا اسکاتلند و استرالیا - جوامع در آندرا پرادش نیز در مخالفت با این پروژه تجمع کرده اند، زیرا از ترس اینکه مردم در نهایت هزینه های زیست محیطی و اقتصادی فلج کننده ای را متحمل شوند. BRB Naidu، دهکده تارلووادا، که اعتراف کرد از این که آیا مرکز داده برای جامعه آنها رفاه یا خرابی به ارمغان می‌آورد، نگران است، گفت: «ما آموخته‌ایم که آمریکا مشکلات مراکز داده را نمی‌خواهد و بنابراین اکنون گوگل آنها را به اینجا می‌آورد. \"بسیاری در روستا بسیار نگران هستند. اما دولت از پاسخگویی به سوالات ما خودداری کرده است.\""}, {"source": "The Guardian AI", "title": "The AI debate is already shaping the 2028 election. Here’s where Democratic hopefuls stand", "link": "https://www.theguardian.com/us-news/2026/sep/26/potential-2028-democratic-presidential-candidates-ai", "summary": "Debates over AI development, regulation and datacenters have become buzzy topics for US presidential candidates The debate over artificial intelligence development, how to regulate it and the construction of datacenters that power the technology has become a buzzy topic for potential 2028 Democratic presidential candidates. Already, concerns were mounting over the environmental and energy impact of datacenters, which consume vast amounts of resources to power AI. But worries about the rapid development of AI came to a head in mid-September when tech executives issued a flurry of dire warnings that the technology could harm humans. Continue reading...", "date_str": "2026-09-26T11:00:33+00:00", "hash": "9afacdc276ae0e07", "title_fa": "بحث هوش مصنوعی در حال شکل گیری انتخابات 2028 است. اینجا جایی است که امیدهای دموکرات ایستاده اند", "summary_fa": "بحث در مورد توسعه هوش
