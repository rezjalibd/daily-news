rgan، برای بازدهی بهینه طی 10 تا 15 سال آینده، پاسخ ممکن است مثبت باشد. در گزارش \"فرض بازار سرمایه بلندمدت 2027\" که این هفته منتشر شد، این شرکت ساختار پرتفوی دیگری را به جای سهام کلاسیک 60٪ و اوراق قرضه 40٪ ارائه کرد. در عوض، شرکت پرتفویی شامل تخصیص عظیم 30 درصدی به سرمایه گذاری های جایگزین را مشخص کرد. این پرتفوی دقیقاً چگونه به نظر می رسد: تخصیص دارایی 42% سهام جهانی 28% اوراق قرضه جهانی 7.5% املاک و مستغلات 7.5% سایر دارایی های واقعی (طلا، زیرساخت ها، کالاها) 7.5% سهام خصوصی 4.5% اعتبار خصوصی 3% صندوق های تامینی 7% جی پی مورگان می گوید که این ترکیب بازده سالانه بالاتر از میانگین سالانه است. 10-15 سال، در حالی که 60/40 7٪ بازگشت خواهد داشت. اما این فقط چشم انداز بازده نیست که پیشنهاد سبد سهام JPMorgan را بهینه تر می کند. همچنین تنوع بیشتری دارد، خطر کمتری دارد و کمتر مستعد حرکت در قفل است. پرتفوی این شرکت 21% نسبت شارپ بالاتری نسبت به 60/40 دارد، به این معنی که بازده بهتری نسبت به مشخصات ریسک خود دارد. موقعیت‌های سهام و اوراق قرضه 60/40 در ابتدا به‌گونه‌ای طراحی شدند که پوشش‌های طبیعی باشند، که یکی در زمان‌های نوسان، دیگری را جبران می‌کرد. از لحاظ تاریخی، زمانی که سهام سقوط کرده است، اوراق قرضه عملکرد بهتری داشته است زیرا سرمایه گذاران به دارایی های امن پناه برده اند. با این حال، در شرایط"}, {"source": "Business Insider", "title": "SpaceX-Tesla merger could create a Frankenstein's monster Wall Street can't value", "link": "https://www.businessinsider.com/spacex-tesla-merger-conglomerate-discount-investors-musk-ai-robotics-valuation", "summary": "Win McNamee/Getty Images This post appeared in the Business Insider Today newsletter. You can sign up for Business Insider's daily newsletter here . Some pairings feel inevitable. \"Friends\" had Ross and Rachel. \"The Office\" had Jim and Pam. Elon Musk has SpaceX and Tesla. But a deal between Musk's two giant companies could end up looking more like Frankenstein's monster than a Hollywood love story. And investors might struggle to understand and value it. The SpaceX-Tesla tie-up isn't a shoo-in, but both sides are officially considering it . That raises questions about what's gained from a merger. Combining the companies turns Musk's two jobs into one. Their somewhat overlapping AI plans could create significant efficiencies in areas like compute and talent. Joe Ciolli, author of the First Trade newsletter , broke down the pros and cons for SpaceX and Tesla investors . These companies have A LOT under their hoods, though. Here are just some of the businesses or long-term bets that SpaceX and Tesla are pursuing: Space-mission services (Falcon 9, Dragon, Starship) Internet service (Starlink broadband) Mobile carrier (Starlink Mobile) Electric vehicles (Model 3, Model Y, Cybertruck, Roadster) Government satellite systems (Starshield) Autonomous vehicles (Robotaxi) Humanoid robots (Optimus) Energy storage (Powerwall, Megapack) Frontier AI models (Grok) Social media (X) Payments app (X Money) AI infrastructure (Colossus) AI coding tools (Cursor) And don't forget Musk's grandest ambition: colonizing Mars. A conglomerate with such a diverse set of businesses can become a headache to value. Let's start simple: How would you describe a SpaceX-Tesla entity? A space company? An AI company? A robotics company? Saying it's \"a little bit of everything\" might not sit well with investors. When a company plays in a bunch of industries, the market doesn't always give it the benefit of the doubt. There's a term for this phenomenon: conglomerate discount . It means a company's stock is valued lower than the sum of its individual parts. Some investors fear the company will be too complex to manage, or too expensive to run. Others worry its combined financials will make it hard to understand its true health, or stronger parts of the business will subsidize weaker ones. A widely cited 1995 paper on the topic found the discount to be between 13% and 15% among a sample of diversified companies from 1986 to 1991. Some academics and economists have argued the conglomerate discount is", "date_str": "2026-10-22T09:28:45+00:00", "hash": "b49ed3661e6ad38e", "title_fa": "ادغام اسپیس ایکس و تسلا می تواند هیولای فرانکشتاین را ایجاد کند که وال استریت نمی تواند ارزشی برای آن قائل شود", "summary_fa": "برنده McNamee/Getty Images این پست در خبرنامه Business Insider Today منتشر شد. از اینجا می توانید برای خبرنامه روزانه Business Insider ثبت نام کنید. برخی جفت‌ها اجتناب‌ناپذیر هستند. \"دوستان\" راس و ریچل داشتند. «دفتر» جیم و پم را داشت. ایلان ماسک دارای اسپیس ایکس و تسلا است. اما معامله ای بین دو شرکت غول پیکر ماسک ممکن است بیشتر شبیه هیولای فرانکنشتاین باشد تا یک داستان عشقی هالیوودی. و سرمایه گذاران ممکن است برای درک و ارزش گذاری آن مشکل داشته باشند. اتصال SpaceX-Tesla یک حمله نیست، اما هر دو طرف رسماً در حال بررسی آن هستند. این سؤالاتی را در مورد آنچه از ادغام به دست می آید ایجاد می کند. ترکیب این شرکت ها، دو شغل ماسک را به یک شغل تبدیل می کند. برنامه های هوش مصنوعی تا حدودی همپوشانی آنها می تواند کارایی قابل توجهی در زمینه هایی مانند محاسبات و استعداد ایجاد کند. جو سیولی، نویسنده خبرنامه تجارت اول، مزایا و معایب سرمایه گذاران اسپیس ایکس و تسلا را بیان کرد. با این حال، این شرکت ها چیزهای زیادی در زیر کاپوت خود دارند. در اینجا فقط برخی از کسب‌وکارها یا شرط‌بندی‌های طولانی‌مدتی که اسپیس ایکس و تسلا دنبال می‌کنند آورده شده است: خدمات مأموریت فضایی (Falcon 9، Dragon، Starship) سرویس اینترنت (Starlink پهن‌باند) حامل تلفن همراه (Starlink Mobile) وسایل نقلیه الکتریکی (مدل 3، مدل Y، Cybertruck، Roadster) سیستم‌های ماهواره‌ای دولتی (Startroidstarshman) (Optimus) ذخیره‌سازی انرژی (Powerwall، Megapack) مدل‌های هوش مصنوعی مرزی (Grok) رسانه‌های اجتماعی (X) برنامه پرداخت (X Money) زیرساخت‌های هوش مصنوعی (Colossus) ابزارهای کدگذاری هوش مصنوعی (مکان‌نما) و بزرگ‌ترین جاه‌طلبی ماسک: استعمار مریخ را فراموش نکنید. یک مجموعه با چنین مجموعه ای از مشاغل متنوع می تواند به دردسر ارزشی تبدیل شود. بیایید ساده شروع کنیم: چگونه یک موجودیت SpaceX-Tesla را توصیف می کنید؟ یک شرکت فضایی؟ یک شرکت هوش مصنوعی؟ یک شرکت رباتیک؟"}, {"source": "Business Insider", "title": "Trump Accounts for adults: 4 things advisors want Congress to consider", "link": "https://www.businessinsider.com/trump-accounts-american-adults-under-40-financial-advice-tax-2026-10", "summary": "Roberto Schmidt/Getty Images After expanding Trump Accounts to all children, the administration may look to adults next. We spoke to five experts about what should be in a Trump Account program for adults. Accounts should support the millions of Americans who don't have retirement savings, they said. Trump Accounts, created for children, may be coming to adults, too. Brad Gerstner, an architect of Trump Accounts, said on Wednesday that the tax-advantaged accounts should be rolled out to every US citizen under 40 , though he flagged that Congress would need to pass new legislation to make that happen. President Trump similarly said on Tuesday that the White House is exploring creating an \"alternative\" Trump Account for adults. \"We are looking at something different because it really is somewhat of a different thing having to do with adults,\" Trump said. So what might that look like? We spoke to five experts about how Trump Accounts could work for adults, who they should be for, and how they could figure into financial planning. Ray Boshara, a senior policy advisor at the Aspen Institute and Washington University in St. Louis' Center for Social Development, said the accounts could be a boon to the 46% of Americans without money in a retirement account, according to Federal Reserve data. \"I really like the idea of all Americans having a lifelong investment account through which they can build wealth and achieve financial security,\" said Boshara, who advocated e nrolling all American children in Trump Accounts, a change that was rolled out earlier this month. He sees expanding Trump accounts as an extension of the same push, as long as the accounts are automatically created for those adults, too. Focus on those without retirement savings There's a \"pretty robust retirement savings system\" in place for employees, said Boshara, but nearly half of Americans don't have retirement savings , many because their employer doesn't offer a plan. Trump Accounts could \"fill that huge gap,\" Boshara said, but unlike the plans for children, it may be worthwhile to focus on those without 401(k) or similar plans. \"One of the benefits of the Trump accounts for kids is that it's universal, but I'm not so sure you'd want it to be universal for an adult,\" Boshara said. Traditional IRAs already limit tax deductions for some higher earners, and that's a \"good thing,\" he added. \"That way, you're not just giving wealthier Americans yet another tool,\" Boshara said. If the goal is to hel", "date_str": "2026-10-22T09:23:01+00:00", "hash": "6dc93b08b164a455", "title_fa": "حساب های ترامپ برای بزرگسالان: 4 مورد که مشاوران می خواهند کنگره در نظر بگیرد", "summary_fa": "روبرتو اشمیت/گتی ایماژ پس از گسترش حساب های ترامپ برای همه کودکان، دولت ممکن است به بزرگسالان نگاه کند. ما با پنج کارشناس در مورد آنچه باید در برنامه حساب ترامپ برای بزرگسالان باشد صحبت کردیم. آنها گفتند که حساب ها باید از میلیون ها آمریکایی که پس انداز بازنشستگی ندارند حمایت کند. حساب‌های ترامپ که برای کودکان ایجاد شده‌اند، ممکن است برای بزرگسالان نیز ارائه شوند. براد گرستنر، معمار حساب‌های ترامپ، روز چهارشنبه گفت که حساب‌های دارای مزیت مالیاتی باید برای هر شهروند آمریکایی زیر 40 سال ارائه شود، اگرچه او تاکید کرد که کنگره برای تحقق این امر باید قوانین جدیدی را تصویب کند. پرزیدنت ترامپ به طور مشابه روز سه شنبه گفت که کاخ سفید در حال بررسی ایجاد یک حساب ترامپ \"جایگزین\" برای بزرگسالان است. ترامپ گفت: «ما به چیز متفاوتی نگاه می کنیم، زیرا واقعاً تا حدودی چیز متفاوتی است که مربوط به بزرگسالان است. پس چه چیزی ممکن است به نظر برسد؟ ما با پنج کارشناس در مورد اینکه چگونه حساب‌های ترامپ می‌توانند برای بزرگسالان کار کنند، چه کسانی باید باشند و چگونه می‌توانند در برنامه‌ریزی مالی نقش داشته باشند، صحبت کردیم. بر اساس داده های فدرال رزرو، ری بوشارا، مشاور ارشد سیاست در موسسه آسپن و دانشگاه واشنگتن در مرکز توسعه اجتماعی سنت لوئیس، گفت که این حساب ها می تواند برای 46 درصد آمریکایی هایی که پولی در حساب بازنشستگی ندارند، موهبت باشد. بوشارا که از ثبت نام تمام کودکان آمریکایی در حساب های ترامپ حمایت می کند، گفت: «من واقعاً از این ایده که همه آمریکایی ها یک حساب سرمایه گذاری مادام العمر داشته باشند که از طریق آن می توانند ثروت بسازند و امنیت مالی داشته باشند، دوست دارم. او گسترش حساب‌های ترامپ را به‌عنوان گسترش همان فشار می‌بیند، تا زمانی که حساب‌ها به‌طور خودکار برای آن بزرگسالان نیز ایجاد"}, {"source": "Business Insider", "title": "Morgan Stanley says these 24 AI infrastructure stocks are built to hold up even if capex slows", "link": "https://www.businessinsider.com/ai-infrastructure-stocks-to-buy-hyperscaler-spending-capex-2026-10", "summary": "The New York Stock Exchange is being seen in the Financial District in New York City, on November 18, 2023. (Photo by Mairo Cinquetti/NurPhoto via Getty Images) Mairo Cinquetti/NurPhoto via Getty Images Investors have been mulling what a decline in capex spending could mean for the AI trade. Morgan Stanley see spending growth slowing in the coming years. It compiled a list of stocks poised to benefit from bottlenecks as capex growth wanes through 2028. Wall Street pros are saying it's time to get picky about with which stocks tied to the AI buildout you're pouring money into as doubts swirl about the durability of the capex boom. Higher financing costs are dimming the outlook and raising concerns about continued big spending from the AI hyperscalers. Morgan Stanley expects year-over-year capex growth to slow from 60% in 2027 to 14% in 2028. In 2026, hyperscaler capex is expected to will have grown by almost 100%. But not every AI firm will be affected equally by the slowdown, and some are better positioned than others to weather the storm. To identify these names, Morgan Stanley's analysts compiled a list of stocks that have either strong pricing power for their products thanks to supply chain bottlenecks , or those that have an opportunity to expand market share in their respective industry. \"We expect these companies to continue to see upward revenue and earnings revisions from the ongoing AI capex boom even if hyperscaler/neocloud capex revisions moderate,\" said Nicholas Lentini, an equity strategist, in an October 15 note. The bank added that capex levels may not even decelerate as much as investors worry. It pointed out that Wall Street has so far consistently underestimated the scale of compute cycles in the past, like the internet and cloud buildouts leading up to 2000 and 2020. It also emphasized the importance of bottlenecks and that capex levels exceeding expectations could boost the earnings of AI infrastructure beneficiaries. \"We expect bottlenecks to persist as the race to build data centers continues, with willingness to pay hinging heavily on time-to-market,\" Lentini wrote. \"An acceleration in hyperscaler and neocloud capex from current levels, or a shift in priorities among incumbent players, could put acute pressure on specific pockets of the supply chain.\" Below are the 24 stocks that Morgan Stanley says are in a prime position to gain from bottlenecks as capex growth moderates in the coming years. Company name Stock ticker Analyst Bottle", "date_str": "2026-10-22T09:15:01+00:00", "hash": "aae3fda07e3f7279", "title_fa": "مورگان استنلی می‌گوید این 24 ذخایر زیرساخت هوش مصنوعی به گونه‌ای ساخته شده‌اند که حتی در صورت کاهش حجم سرمایه، پایداری خود را حفظ کنند", "summary_fa": "بورس اوراق بهادار نیویورک در 18 نوامبر 2023 در منطقه مالی در شهر نیویورک دیده می شود. (عکس از Mairo Cinquetti/NurPhoto از طریق Getty Images) Mairo Cinquetti/NurPhoto از طریق Getty Images سرمایه گذاران به این فکر کرده اند که کاهش مخارج سرمایه گذاری در هوش مصنوعی می تواند به چه معنا باشد. مورگان استنلی شاهد کاهش رشد هزینه ها در سال های آینده است. فهرستی از سهامی را تهیه کرد که با کاهش رشد سرمایه تا سال 2028 از تنگناها سود می برند. طرفداران وال استریت می گویند که وقت آن رسیده است که در مورد سهامی که به ساخت هوش مصنوعی پول می ریزید دقت کنید زیرا شک و تردید در مورد دوام رونق سرمایه در حال چرخش است. هزینه های تامین مالی بالاتر چشم انداز را کم رنگ می کند و نگرانی ها را در مورد ادامه هزینه های کلان از سوی hyperscalers هوش مصنوعی افزایش می دهد. مورگان استنلی انتظار دارد که رشد سرمایه سالانه از 60 درصد در سال 2027 به 14 درصد در سال 2028 کاهش یابد. اما همه شرکت‌های هوش مصنوعی به یک اندازه تحت تأثیر این کندی قرار نخواهند گرفت، و برخی از آنها در موقعیت بهتری نسبت به سایرین برای مقابله با طوفان قرار دارند. برای شناسایی این نام‌ها، تحلیلگران مورگان استنلی فهرستی از سهامی را تهیه کردند که به دلیل تنگناهای زنجیره تامین، یا دارای قدرت قیمت‌گذاری قوی برای محصولات خود هستند، یا سهامی که فرصتی برای گسترش سهم بازار در صنعت مربوطه خود دارند. نیکلاس لنتینی، استراتژیست سهام، در یادداشتی در 15 اکتبر گفت: «ما انتظار داریم که این شرکت‌ها همچنان شاهد بازبینی‌های افزایشی درآمد و درآمد ناشی از رونق مداوم سرمایه هوش مصنوعی باشند، حتی اگر بازبینی‌های سرمایه‌ای ابرمقیاس‌گر/نئوکلاد متوسط ​​باشد». این بانک افزود که سطوح سرمایه حتی ممکن است به اندازه نگرانی سرمایه گذاران کاهش نیابد. این گزارش"}, {"source": "Business Insider", "title": "Walmart’s chief people officer shares 3 green flags in a job interview", "link": "https://www.businessinsider.com/walmart-chief-people-officer-shares-interview-green-flags-2026-10", "summary": "Donna Morris oversees 2.1 million employees. Ethan Miller/Getty Images Walmart chief people officer Donna Morris oversees more than 2 million workers globally. She shared three green flags that make her lean in during a job interview. Morris said she likes to see a track record of grit in a candidate. Donna Morris oversees over 2 million employees , so she knows a strong candidate when she sees one. Walmart's chief people officer identified three green flags that make her lean in during a job interview — regardless of the role they're applying for. First, she told Business Insider that she looks for a genuine alignment with the company's purpose and values. Second, she wants to see an ability to take on multiple responsibilities and make things work. \"They demonstrate a track record of grit,\" Morris said, defining those individuals as people who have overcome adversity. In an ideal world, she said that means they've worked on the frontline, since so many of Walmart employees have customer-facing roles. She said the company looks for candidates with a focus on service. Morris, who started working at 13 at a dry cleaner's and then worked at a drugstore for eight years, said that if a candidate has never experienced what it's like to be a frontline hourly worker, it may be challenging for them to lead. Morris said those jobs gave her purpose, and she found it hard to resign. Now, when she interviews candidates, Morris said her go-to question is \"If I was to ask people who've worked for you before, what will they tell me?\" She said the open-ended question generates a genuine response and helps her gauge whether the person is focused on servant leadership, which is a \"big green flag.\" Asking this question allows her to hear more about a candidate's first job or a work experience. She said that while graduating from an Ivy League school is valuable, she's more focused on hearing about what they've learned from work experience. \"What was the grit they had to persevere through?\" Morris asked. The chief people officer, who worked at Adobe for more than 17 years before joining Walmart, said that her third green flag is candidates who are passionate about making a difference. \"That, to us, would be really, really key,\" Morris said. Read the original article on Business Insider", "date_str": "2026-10-22T09:14:01+00:00", "hash": "3ff04224b00f4e20", "title_fa": "مدیر ارشد والمارت در یک مصاحبه شغلی 3 پرچم سبز را به اشتراک می گذارد", "summary_fa": "دونا موریس بر 2.1 میلیون کارمند نظارت دارد. اتان میلر/ گتی ایماژ، افسر ارشد والمارت، دونا موریس، بر بیش از 2 میلیون کارگر در سراسر جهان نظارت دارد. او سه پرچم سبز را به اشتراک گذاشت که باعث می‌شود در طول یک مصاحبه شغلی به او متمایل شود. موریس گفت که دوست دارد در یک کاندیدا سابقه ای از صلابت ببیند. دونا موریس بر بیش از 2 میلیون کارمند نظارت دارد، بنابراین با دیدن یک نامزد قوی می شناسد. مدیر ارشد مردمی والمارت سه پرچم سبز را شناسایی کرد که باعث می‌شود او در طول یک مصاحبه شغلی به سمت خود متمایل شود - صرف نظر از نقشی که برای آن درخواست می‌کنند. ابتدا، او به Business Insider گفت که به دنبال همسویی واقعی با هدف و ارزش های شرکت است. دوم، او می‌خواهد توانایی بر عهده گرفتن مسئولیت‌های متعدد و انجام کارها را ببیند. موریس با تعریف این افراد به عنوان افرادی که بر ناملایمات غلبه کرده اند، گفت: \"آنها سابقه ای از ظرافت را نشان می دهند.\" او گفت در یک دنیای ایده‌آل، این بدان معناست که آنها در خط مقدم کار کرده‌اند، زیرا بسیاری از کارمندان والمارت نقش‌هایی رو به مشتری دارند. او گفت که این شرکت به دنبال نامزدهایی با تمرکز بر خدمات است. موریس که از 13 سالگی در یک خشکشویی شروع به کار کرد و سپس به مدت 8 سال در یک داروخانه کار کرد، گفت که اگر یک نامزد هرگز تجربه کار ساعتی خط مقدم بودن را نداشته باشد، ممکن است رهبری برای آنها چالش برانگیز باشد. موریس گفت که این مشاغل هدف او را نشان می‌دهد و استعفا برای او سخت است. حالا، وقتی او با نامزدها مصاحبه می کند، موریس گفت: سوال اصلی او این است که \"اگر بخواهم از افرادی که قبلا برای شما کار کرده اند بپرسم، آنها به"}, {"source": "Business Insider", "title": "I'm the 25-year-old CEO of Lean In. I love my 2-minute cleaning hack, talking to myself on walks, and beach weekends — here's my routine.", "link": "https://www.businessinsider.com/day-in-life-lean-in-ceo-bridget-griswold-ai-2026-10", "summary": "Bridget Griswold, the CEO of Lean In. Gabriela Hasbun for BI This as-told-to essay is based on a conversation with Bridget Griswold, the 25-year-old CEO of Lean In, who lives in San Francisco. It's been edited for length and clarity. I fell in love with technology at Brown University, where I studied computer science and business. I worked with two female professors to build a robot. I interned at a semiconductor manufacturing company and also loved design and art. Product management felt like a really wonderful combination of all those interests, and that was my role at Meta a year after graduating from college. My team and I redesigned the Instagram search grid, so now when you search for large Instagram accounts, you're routed to the search results page rather than directly to those accounts. I'm very proud of that. Business Insider's Power Hours series gives readers an inside look at how powerful people structure their workday. Reach out to editor Lauryn Haas to share your daily routine. While at Meta, an incredible female mentor connected me to Sheryl Sandberg . Meeting her felt so surreal and is what led me to start my role as CEO at Lean In in March. It feels like a once-in-a-lifetime opportunity to do mission-driven work. Griswold started working at Meta two years after Sheryl Sandberg stepped down as COO. Gabriela Hasbun for BI I was a swimmer as a kid, and as my swim coach used to say: \"You get out of swimming what you put into it.\" I think that applies to many things in life: The more you put in, the more you get out. Here's a day in my life. I wake up to my needy, angelic cat around 7:30 a.m. The second I wake up, I pet my crying and whining cat. She's an angel but very needy. I'm not a breakfast person, but I need coffee immediately. I have many cups of coffee throughout the day. One of the first things I do is make some at home. I always tidy up my apartment while brushing my teeth The most productive two minutes of my day are when I brush my teeth. I clean and tidy my apartment at the same time. I'm probably not super focused on brushing my teeth, which is maybe a problem, but I'm also making my bed, emptying the dishwasher, feeding my cat, or starting the coffee maker. I always move really quickly; I don't like to sit still. Brushing my teeth and standing still would make me antsy, so I like to get something else done at the same time. I'm still adjusting to West Coast hours I moved from New York City to San Francisco in August. In New York", "date_str": "2026-10-22T09:05:01+00:00", "hash": "523e8f2f85bebbb1", "title_fa": "من مدیر اجرایی 25 ساله Lean In هستم. من عاشق هک 2 دقیقه‌ای تمیز کردن، صحبت کردن با خودم در پیاده‌روی و تعطیلات آخر هفته در ساحل هستم - این روال من است.", "summary_fa": "بریجیت گریسولد، مدیرعامل Lean In. گابریلا هاسبون برای BI این مقاله گفته شده بر اساس گفتگو با بریجت گریسولد، مدیر اجرایی 25 ساله Lean In، که در سانفرانسیسکو زندگی می کند، است. برای طول و وضوح ویرایش شده است. من در دانشگاه براون، جایی که علوم کامپیوتر و تجارت خواندم، عاشق فناوری شدم. من با دو استاد زن برای ساخت یک ربات کار کردم. من در یک شرکت تولید نیمه هادی کارآموزی کردم و همچنین عاشق طراحی و هنر بودم. مدیریت محصول ترکیبی فوق العاده از همه آن علایق احساس می شد، و این نقش من در متا یک سال پس از فارغ التحصیلی از کالج بود. من و تیمم شبکه جستجوی اینستاگرام را دوباره طراحی کردیم، بنابراین اکنون وقتی اکانت‌های بزرگ اینستاگرام را جستجو می‌کنید، به جای مستقیم به آن حساب‌ها، به صفحه نتایج جستجو هدایت می‌شوید. من خیلی به این افتخار می کنم. مجموعه «ساعت‌های نیرو» Business Insider به خوانندگان نگاهی درونی می‌دهد که چگونه افراد قدرتمند روز کاری خود را ساختار می‌دهند. با ویرایشگر لورین هاس تماس بگیرید تا کارهای روزمره خود را به اشتراک بگذارید. زمانی که در متا بودم، یک مربی زن باورنکردنی مرا به شریل سندبرگ متصل کرد. ملاقات با او بسیار سورئال بود و همین چیزی بود که باعث شد نقشم را به عنوان مدیر عامل در Lean In در ماه مارس شروع کنم. این یک فرصت یک بار در زندگی برای انجام کارهای ماموریت محور به نظر می رسد. گریسولد دو سال پس از کناره گیری شریل سندبرگ از سمت مدیر ارشد اجرایی، کار در متا را آغاز کرد. گابریلا هاسبون برای BI من در کودکی یک شناگر بودم و همانطور که مربی شنای من می‌گفت: \"شما از شنا کردن آن چیزی را که در آن می‌گذارید به دست می‌آورید.\" فکر می‌کنم این برای خیلی چیزها در زندگی صدق می‌کند: هرچه بیشتر"}, {"source": "Business Insider", "title": "Top Anthropic engineer says Claude now writes 'literally all' her team's code", "link": "https://www.businessinsider.com/anthropic-katelyn-lesse-team-shifted-to-ai-coding-entirely-2026-10", "summary": "Katelyn Lesse, head of platform engineering at Anthropic. Chris Ratcliffe/Bloomberg via Getty Images Anthropic platform engineering head Katelyn Lesse said that Claude now writes all her team's code. Lesse shared ways that Claude Code has helped the company become more efficient. Anthropic nears an initial public offering at a potential $2 trillion valuation. A top Anthropic engineer says that Claude Code has already wiped out all human coding at one of the AI lab's central teams. Katelyn Lesse leads the AI startup's platform engineering group, which handles the company's core services, developer tools, and product infrastructure — it's essentially the engine room of Anthropic. Lesse said at Grafana Labs ' ObservabilityCON event on Tuesday that among her staff, which tallied 200 as of this summer, the era of human-written code is fully over. \"When it comes to our team and how we're actually building and maintaining our systems, all of our code is written by Claude,\" Lesse said. \"Like, literally all of it.\" Anthropic's heavy reliance on Claude Code has helped it remain relatively small, as it approaches an initial public offering that could value it at nearly $2 trillion. The company's revenue growth slowed in the third quarter of this year. Maintaining its lofty valuation may depend on selling more companies on the AI-first approach espoused by Lesse and other Anthropic leaders. Lesse said that people on her teams are still designing systems and verifications, and then offloading the actual coding to Claude. She said that when the company changed the programming language of a major codebase from Python to Rust, workers developed a way to verify the final product. \"But the grunt work of building the pieces and actually monitoring the pieces and actually making sure that we felt good about it, that was agents all the way down,\" Lesse said. Lesse said Anthropic already lets agents fix tests autonomously, with no human interaction, and it's thinking about how staff can get comfortable with agents autonomously making changes to the actual codebase, given the improvements in AI models over the last year. \"As engineering leaders, we're like terrified, and we're like, let's be really careful about this, but I think the line is starting to push,\" Lesse said. Anthropic has also embraced Claude Code companywide. It released a report last week saying that as AI agents have worked more inside the company, it has hired for a smaller share of junior technical positions. ", "date_str": "2026-10-22T09:00:05+00:00", "hash": "09ca609596a47028", "title_fa": "مهندس برتر آنتروپیک می گوید که کلود اکنون «به معنای واقعی کلمه» کدهای تیمش را می نویسد", "summary_fa": "Katelyn Lesse، رئیس مهندسی پلت فرم در Anthropic. کریس رتکلیف/ بلومبرگ از طریق Getty Images، رئیس مهندسی پلت فرم Anthropic، Katelyn Lesse، گفت که کلود اکنون تمام کدهای تیمش را می نویسد. روش های کمتری به اشتراک گذاشته شده است که Claude Code به کارآمدتر شدن شرکت کمک کرده است. Anthropic نزدیک به عرضه اولیه عمومی با ارزش بالقوه 2 تریلیون دلار است. یکی از مهندسان برتر Anthropic می گوید که کلود کد قبلاً تمام کدگذاری های انسانی را در یکی از تیم های مرکزی آزمایشگاه هوش مصنوعی از بین برده است. Katelyn Lesse رهبری گروه مهندسی پلت فرم استارتاپ هوش مصنوعی را بر عهده دارد که خدمات اصلی، ابزارهای توسعه‌دهنده و زیرساخت محصول شرکت را مدیریت می‌کند - این اساساً موتورخانه Anthropic است. لس روز سه‌شنبه در رویداد ObservabilityCON آزمایشگاه Grafana گفت که در میان کارکنانش که تا تابستان امسال به 200 نفر رسیدند، دوران کدهای نوشته شده توسط انسان کاملاً به پایان رسیده است. لس گفت: «وقتی صحبت از تیم ما و نحوه ساخت و نگهداری سیستم‌هایمان می‌شود، تمام کدهای ما توسط کلود نوشته می‌شود. \"مثل، به معنای واقعی کلمه همه آن.\" اتکای شدید Anthropic به Claude Code به آن کمک کرده تا نسبتاً کوچک باقی بماند، زیرا به عرضه اولیه عمومی نزدیک می شود که می تواند ارزش آن را نزدیک به 2 تریلیون دلار کند. رشد درآمد این شرکت در سه ماهه سوم سال جاری کاهش یافت. حفظ ارزش‌گذاری عالی آن ممکن است به فروش شرکت‌های بیشتر بر اساس رویکرد اول هوش مصنوعی که توسط Lesse و دیگر رهبران آنتروپیک حمایت می‌شود، بستگی داشته باشد. لسه گفت که افراد تیم او هنوز در حال طراحی سیستم‌ها و تأییدیه‌ها هستند و سپس کدگذاری واقعی را برای کلود بارگذاری می‌کنند. او گفت که وقتی شرکت زبان برنامه نویسی یک پایگاه کد اصلی را از پایتون به Rust تغییر"}, {"source": "Business Insider", "title": "A San Francisco gym went viral for a sign about vibe coding. The gym says it's an AI-generated fake.", "link": "https://www.businessinsider.com/san-francisco-gym-viral-vibe-coding-sign-ai-fake-2026-10", "summary": "Fitness SF said that this gym etiquette sign is an AI-generated fake. @iansbrash A sign instructing San Francisco gym-goers not to vibe code between sets went viral. The sign was an \"AI-generated fake,\" according to the gym. Amid tech's vibe-coding obsession and fitness boom, it's no surprise the image has gotten heat. Don't hog the leg press while prompting Claude. A screen with the logo of Fitness SF, a Bay Area chain of gyms, went viral among techies on X and Instagram on Monday. The image instructed gym-goers to refrain from writing code or prompting AI during their workouts. \"Be present. Lift harder. Ship later,\" the image reads. Troy Macfarland, Fitness SF's director of marketing, said, however, that the image was an \"AI-generated fake.\" The gym does have etiquette signs that mention phone usage and being courteous, he wrote, but none mention vibe coding. \"This person altered our actual images displayed on the screen,\" Macfarland wrote. \"I will give an 'A' for creativity to him.\" It's not clear whether the image was generated with AI, Photoshop, or some other tool. Ian Brash, whose post with the image got almost 7,000 likes, did not respond to a request for comment. Being non-technical in San Francisco must feel like divine retribution At least Fitness SF knows their customer base pic.twitter.com/skeGGvluBJ — ian brash (@iansbrash) October 19, 2026 In San Francisco's AI mania, it's no surprise a sign like that blew up on X. Techies weighed in, cracking their own jokes about how tied they were to their coding agents . One X user told Fitness SF to give their copywriter a raise. A Cognition engineer said that vibe coding between sets was encouraged at his company's gym. \"Vibe coding at the gym?\" one X user wrote. \"You're worried about the wrong weights.\" One reaction image often appears in the comment sections of posts like this one. It shows a muscled man, holding a giant nuclear bomb in his hands, jumping into the city of San Francisco. One VC posted it with the message: \"Even I have limits.\" Claude Code and cardio The sign tapped into two of the buzziest subcultures in tech. First, there's AI coding. Ever since the launch of Claude Code and OpenAI's Codex, engineers have been tied to their phones (or walking around with half-open laptops ) to continue building. Some techies told Business Insider that their love of vibe coding created distance between them and their girlfriends. Then there's the gym. Tech bros are getting fit, pumping themselves full", "date_str": "2026-10-22T09:00:04+00:00", "hash": "6c09f4241cff36ad", "title_fa": "یک باشگاه ورزشی در سانفرانسیسکو به دلیل علامتی در مورد کدنویسی ویبر در فضای مجازی منتشر شد. باشگاه می‌گوید که این یک تقلبی است که توسط هوش مصنوعی تولید شده است.", "summary_fa": "Fitness SF گفت که این علامت آداب ورزشگاه یک جعلی ساخته شده توسط هوش مصنوعی است. @iansbrash تابلویی که به ورزشکاران سانفرانسیسکو دستور می داد از کد ویبره بین ست ها استفاده نکنند، در فضای مجازی پخش شد. به گفته باشگاه ورزشی، این علامت یک «جعلی تولید شده توسط هوش مصنوعی» بود. در میان وسواس کدنویسی و رونق تناسب اندام فناوری، جای تعجب نیست که این تصویر داغ شده است. در حالی که از کلود درخواست می کنید، پرس پا را فشار ندهید. صفحه‌ای با لوگوی Fitness SF، یک باشگاه ورزشی زنجیره‌ای در Bay Area، روز دوشنبه در بین متخصصان تکنولوژی در X و اینستاگرام منتشر شد. این تصویر به ورزشکاران دستور داد که از نوشتن کد یا درخواست هوش مصنوعی در طول تمرین خودداری کنند. در این تصویر آمده است: \"حضور داشته باشید. بیشتر بلند کنید. دیرتر ارسال کنید.\" تروی مک فارلند، مدیر بازاریابی Fitness SF، گفت، با این حال، این تصویر \"جعلی تولید شده توسط هوش مصنوعی\" است. او نوشت: ورزشگاه نشانه‌هایی از آداب معاشرت دارد که به استفاده از تلفن و مودب بودن اشاره می‌کند، اما هیچ‌کدام به کدنویسی vibe اشاره نمی‌کنند. مک فارلند نوشت: \"این شخص تصاویر واقعی ما را که روی صفحه نمایش داده می شود تغییر داد.\" \"من \"A\" برای خلاقیت به او می دهم.\" مشخص نیست که آیا تصویر با هوش مصنوعی، فتوشاپ یا ابزار دیگری تولید شده است. ایان براش که پست او با این تصویر تقریباً 7000 لایک دریافت کرد، به درخواست اظهار نظر پاسخ نداد. غیر فنی بودن در سانفرانسیسکو باید احساس انتقام الهی داشته باشد حداقل Fitness SF پایگاه مشتریان خود را می شناسد pic.twitter.com/skeGGvluBJ — ian brash (@iansbrash) 19 اکتبر 2026 در شیدایی هوش مصنوعی سانفرانسیسکو، جای تعجب نیست که چنین علامتی در X منفجر شود. فن‌آوران به شوخی می‌پرداختند و می‌گفتند که چقدر با عوامل برنامه‌نویسی مرتبط"}, {"source": "Business Insider", "title": "The legal AI boom just lured a researcher out of Meta's Superintelligence Lab", "link": "https://www.businessinsider.com/ethem-coban-meta-superintelligence-labs-legal-ai-startup-2026-10", "summary": "Josh Edelson/Bloomberg via Getty Images One of Meta's AI researchers left the company this month to start a legal tech company. Ethem Coban worked on teaching Meta's language models to reason through legal questions. Since then, he's had talks to raise $6 million in funding for a startup, according to a person familiar. The legal industry's artificial intelligence gold rush is luring talent from Silicon Valley's biggest labs. Ethem Coban, a researcher at Meta, left the company earlier this month to launch a legal tech startup, according to a person familiar with the matter. Coban, who worked on teaching Meta's language models to reason through legal questions, has been in talks to raise $6 million at a $25 million valuation. Talks are still early, and the terms of the deal could change. The startup is the latest entrant in an increasingly crowded legal tech market. Long seen as laggards, lawyers have spent the past two years experimenting with tools built on large language models. Early movers like Harvey and Legora saw a crush of demand, setting off a wave of investment in startups promising to transform how lawyers work. Now, that opportunity is attracting researchers from the companies building the underlying models. Coban spent almost two years at Meta , most recently at its Superintelligence Labs, where he helped train models to give better answers to legal questions and reduce hallucinations, the person said. He previously studied law at American University and Goethe University in Frankfurt. A spokesperson for Meta didn't respond to a request for comment. Coban has told investors that his new company aims to help law firms and corporate legal teams build and customize models around their expertise. The bet is that companies will increasingly want to own their AI rather than license it from outside companies, because it gives them more control over their data. Law firms also see a chance to turn mountains of case files into a competitive advantage that other firms can't simply buy off the shelf. Kirkland Ellis, the industry's revenue leader, has committed $500 million to building proprietary software. Latham Watkins has been buying its own Nvidia servers to customize models in-house. For Coban, the challenge won't be convincing law firms that they need artificial intelligence. It will be persuading them that someone who knows how the models work from the inside is best suited to build them. Read the original article on Business Insider", "date_str": "2026-10-22T09:00:03+00:00", "hash": "4c688fd3e638efba", "title_fa": "رونق قانونی هوش مصنوعی یک محقق را از آزمایشگاه ابراطلاعات متا بیرون آورد", "summary_fa": "جاش ادلسون/ بلومبرگ از طریق گتی ایماژ یکی از محققان هوش مصنوعی متا این ماه شرکت را ترک کرد تا یک شرکت فناوری قانونی راه اندازی کند. Ethem Coban روی آموزش مدل‌های زبان متا برای استدلال از طریق سؤالات حقوقی کار کرد. به گفته یکی از آشنایان، از آن زمان، او مذاکراتی برای جذب 6 میلیون دلار بودجه برای یک استارتاپ داشته است. هوش مصنوعی صنعت حقوقی، استعدادها را از بزرگترین آزمایشگاه‌های دره سیلیکون جذب می‌کند. اتهم کوبان، محقق متا، اوایل این ماه شرکت را ترک کرد تا یک استارتاپ فناوری قانونی راه اندازی کند. کوبان که روی آموزش مدل های زبان متا برای استدلال از طریق سؤالات حقوقی کار می کرد، در حال مذاکره برای جمع آوری 6 میلیون دلار با ارزش 25 میلیون دلاری بوده است. مذاکرات هنوز زود است و شرایط معامله ممکن است تغییر کند. این استارت‌آپ جدیدترین شرکت کننده در بازار فزاینده فناوری قانونی است. وکلا دو سال گذشته را به عنوان افراد عقب مانده در نظر گرفته اند و ابزارهایی را که بر اساس مدل های زبانی بزرگ ساخته شده اند، آزمایش کرده اند. متحرکان اولیه مانند هاروی و لگورا شاهد کاهش تقاضا بودند و موجی از سرمایه گذاری را در استارتاپ ها به راه انداختند که قول می دادند نحوه کار وکلا را متحول کنند. اکنون، این فرصت، محققان را از شرکت‌هایی که مدل‌های زیربنایی را می‌سازند، جذب می‌کند. کوبان تقریباً دو سال را در متا گذراند و اخیراً در آزمایشگاه سوپراینتلیجنس آن، به آموزش مدل‌ها کمک کرد تا پاسخ‌های بهتری به سؤالات حقوقی بدهند و توهمات را کاهش دهند. او قبلا در دانشگاه آمریکایی و دانشگاه گوته در فرانکفورت در رشته حقوق تحصیل کرده است. سخنگوی متا به درخواست برای اظهار نظر پاسخ نداد. کوبان به سرمایه گذاران گفته است که شرکت جدید او قصد دارد به شرکت های حقوقی و تیم"}, {"source": "Business Insider", "title": "Most AI data centers may never be built. Blame the 'bragawatts.'", "link": "https://www.businessinsider.com/ai-data-centers-never-built-bragawatts-kevin-oleary-2026-10", "summary": "Kevin O Leary speaks at the University of Southern Indiana. MaCabe Brown / Courier amp; Press / USA TODAY NETWORK via Imagn Images/Reuters Newcomers like Kevin O'Leary face skepticism due to a lack of experience in data center development. Bernstein analysts dubbed O'Leary and others \"bragawatts.\" Most announced projects will never happen. \"Press releases are cheap…concrete is not.\" The AI industry has a problem with bragging. Companies are announcing enormous new data centers to power the AI boom. Some promise facilities bigger than anything the industry has built before. There's just one problem: Most of these projects may never happen. Bernstein Research analyzed thousands of planned US data centers and concluded that only about 35% of the announced capacity is likely to get built. That's roughly 170 gigawatts of data center capacity out of a total of almost 500 gigawatts. The rest? A significant chunk of it belongs to a category the industry has a wonderfully dismissive name for: \"Bragawatts.\" These are ambitious announcements, often from newcomers with little experience building data centers, that have a slim chance of becoming reality. \"Press releases are cheap…concrete is not,\" Bernstein analysts wrote in a research note. Bernstein began its analysis with more than 7,000 data center projects across North America, drawing on information from Aterio, a company that tracks construction through satellite imagery, permits, and other records. The analysts narrowed that to more than 5,000 projects (partly by excluding those already canceled). Then they assessed the chances of these remaining projects being completed. The analysts considered factors such as whether construction had started, whether electricity was available, and whether the companies involved had successfully built data centers before. The results revealed a striking divide. The 'bragawatt brigade' Kevin O Leary. Daniel Delgado Jr./Disney via Getty Images Experienced operators including Amazon, Google, Microsoft , and Meta landed at the top . Bernstein gave these companies perfect scores of 5 out of 5 for their development credentials. Other data center specialists, such as Digital Realty , Equinix, and CoreSite, got top marks, too. O'Leary Digital , associated with celebrity investor Kevin O'Leary , ended up at the bottom, with a credibility score of 0.35 out of 5, according to Bernstein. His company has announced 15 gigawatts of data center projects, and Bernstein estimates that only 489 ", "date_str": "2026-10-22T09:00:02+00:00", "hash": "706140e3d4fc3366", "title_fa": "اکثر مراکز داده هوش مصنوعی ممکن است هرگز ساخته نشوند. 'براگاوات ها' را سرزنش کنید.", "summary_fa": "کوین او لیری در دانشگاه ایندیانای جنوبی سخنرانی می کند. Macabe Brown / Courier amp; مطبوعات / شبکه USA TODAY از طریق Imagn Images/Reuters تازه واردانی مانند کوین اولری به دلیل فقدان تجربه در توسعه مرکز داده با شک و تردید روبرو هستند. تحلیلگران برنشتاین به اولری و دیگران لقب «براگاوات» دادند. اکثر پروژه های اعلام شده هرگز اتفاق نمی افتد. انتشارات مطبوعاتی ارزان هستند... بتن ارزان نیست. صنعت هوش مصنوعی با لاف زدن مشکل دارد. شرکت ها مراکز داده عظیمی را برای تقویت رونق هوش مصنوعی اعلام می کنند. برخی وعده تسهیلات بزرگتر از هر چیزی که صنعت قبلا ساخته است را می دهند. فقط یک مشکل وجود دارد: اکثر این پروژه ها ممکن است هرگز اتفاق نیفتند. تحقیقات برنشتاین هزاران مرکز داده برنامه ریزی شده ایالات متحده را تجزیه و تحلیل کرد و به این نتیجه رسید که تنها حدود 35 درصد از ظرفیت اعلام شده احتمالا ساخته می شود. این تقریباً 170 گیگاوات ظرفیت مرکز داده از مجموع تقریباً 500 گیگاوات است. بقیه؟ بخش قابل توجهی از آن متعلق به دسته‌ای است که صنعت نامی نادیده‌انگیز برای آن دارد: «براگاوات». اینها اعلامیه های بلندپروازانه ای هستند که اغلب از سوی تازه واردانی که تجربه کمی در ساخت مراکز داده دارند و شانس کمی برای تبدیل شدن به واقعیت دارند. تحلیلگران برنشتاین در یادداشتی تحقیقاتی نوشتند: \"آشناهای مطبوعاتی ارزان هستند... بتن ارزان نیست.\" برنشتاین تجزیه و تحلیل خود را با بیش از 7000 پروژه مرکز داده در سرتاسر آمریکای شمالی آغاز کرد و از اطلاعات شرکت Aterio که ساخت و ساز را از طریق تصاویر ماهواره‌ای، مجوزها و سایر سوابق ردیابی می‌کند، استفاده کرد. تحلیلگران آن را به بیش از 5000 پروژه کاهش دادند (تا حدی با حذف پروژه هایی که قبلاً لغو شده بودند). سپس شانس تکمیل این پروژه های باقی مانده را ارزیابی کردند. تحلیلگران عواملی"}, {"source": "Business Insider", "title": "One chart shows how Gen Zers are way less likely to have kids than older generations at their age", "link": "https://www.businessinsider.com/gen-z-having-kids-comparison-older-generations-affordability-medical-issues-2026-10", "summary": "Gen Zers are less likely to have at least one kid than older generations were at the same age. Rawlstock/Getty Images Gen Zers are much less likely to have at least one kid than older generations at the same age. Not wanting kids, affordability problems, and medical challenges are plausible reasons. Having at least three kids is becoming less common across income percentiles, except in the top 1%. Birth rates in the US have been falling for decades, but there's been an especially large drop in the likelihood of Gen Zers in their 20s having a kid compared with their older peers at the same age. For 26-year-old Gen Zers, the likelihood of having at least one kid was 26%, down from 47% for millennials , 50% for Gen X, and 46% for boomers at that age. There were also differences between Gen Z and older generations in the probability of wanting another kid. That's based on an analysis by a group of researchers published by the Federal Reserve Bank of Atlanta. Julie Hotchkiss, a research economist at the Atlanta Fed, told Business Insider the analysis controls for education, partnership status, and some health conditions. The analysis uses National Survey of Family Growth data up to 2023. From affordability challenges to concerns about the future, there are several likely reasons behind the lower probabilities. Hotchkiss said that a lower desire to have kids is one explanation. Gen Zer Brooklen Farley said in an as-told-to Business Insider essay in 2023 that she decided during college she didn't want to have kids . Farley is worried about issues like the economy and climate crisis. \"Many people call us Zoomers, but honestly, a lot of us are doomers: We feel pessimistic about the future and don't want to subject our children to it,\" she said. What are your thoughts on having kids? Have you decided not to, prioritizing other life milestones, or changed your mind? Reach out to this reporter to share at mhoff@businessinsider.com The research also notes that there's been a rise in medical challenges related to having kids. The researchers looked at impaired fecundity, or trouble becoming pregnant or carrying to term. The average probability of impaired fecundity at 26 was 18% for Gen Z compared to 10% for boomers at that age. The probabilities are higher for older ages — the likelihood for 40-year-old millennials was about 30%, higher than the 26% for Gen Xers at that age. \"If we want to talk about birth rates, we can't just talk about preferences,\" Hotchkiss said. \"", "date_str": "2026-10-22T09:00:01+00:00", "hash": "19f5bc102aa09911", "title_fa": "یک نمودار نشان می دهد که چگونه ژنرال زرها نسبت به نسل های بزرگتر در سن خود کمتر احتمال دارد بچه دار شوند", "summary_fa": "ژنرال زرها نسبت به نسل های بزرگتر در همان سن کمتر احتمال دارد که حداقل یک بچه داشته باشند. Rawlstock/Getty Images ژنرال زرها نسبت به نسل های بزرگتر در همان سن، احتمال داشتن حداقل یک بچه بسیار کمتر است. بچه نخواستن، مشکلات مقرون به صرفه و چالش های پزشکی دلایل قابل قبولی هستند. داشتن حداقل سه فرزند در صدک های درآمدی کمتر رایج می شود، به جز در 1٪ بالا. نرخ زاد و ولد در ایالات متحده برای چندین دهه کاهش یافته است، اما احتمال بچه دار شدن ژن Zers در 20 سالگی در مقایسه با همسالان بزرگتر خود در همان سن، کاهش زیادی داشته است. برای ژنرال زرز 26 ساله، احتمال داشتن حداقل یک بچه 26 درصد بود، از 47 درصد برای نسل هزاره، 50 درصد برای نسل X و 46 درصد برای افراد پررونق در آن سن. همچنین تفاوت‌هایی بین نسل Z و نسل‌های قدیمی‌تر در احتمال داشتن فرزند دیگری وجود داشت. این بر اساس تجزیه و تحلیل گروهی از محققان است که توسط بانک فدرال رزرو آتلانتا منتشر شده است. جولی هوچکیس، یک اقتصاددان محقق در فدرال رزرو آتلانتا، به Business Insider گفت که کنترل های تجزیه و تحلیل برای تحصیل، وضعیت مشارکت و برخی از شرایط بهداشتی. این تجزیه و تحلیل از داده‌های بررسی ملی رشد خانواده تا سال 2023 استفاده می‌کند. از چالش‌های مقرون‌به‌صرفه تا نگرانی‌ها در مورد آینده، دلایل احتمالی متعددی پشت احتمال‌های پایین‌تر وجود دارد. Hotchkiss گفت که تمایل کمتر به بچه دار شدن یک توضیح است. ژنرال زر بروکلن فارلی در مقاله ای که به Business Insider در سال 2023 گفته شد گفت که در دوران کالج تصمیم گرفت که نمی خواهد بچه دار شود. فارلی نگران مسائلی مانند اقتصاد و بحران آب و هوا است. او گفت: \"بسیاری از مردم ما را زومر می نامند، اما صادقانه بگوییم، بسیاری از ما"}, {"source": "Business Insider", "title": "I put Muse, Dot, and Instinct to the test. There was a clear winner, but not because it worked best.", "link": "https://www.businessinsider.com/ai-agents-muse-dot-instinct-test-review-2026-10", "summary": "I put Muse (left), Instinct (middle), and Dot (right) to the test. Meta / Instinct / Getty I tested out the leading AI agents for a while, and gave them each the same tasks. OpenAI's Dot saved me from failing to file my taxes, but was the worst at ordering lunch. Ultimately, dealing with multiple AI agents at once is a hassle! I've been playing around with various AI agents — Muse, Instinct, and OpenAI's Dot, and I've found them genuinely really useful for certain things. But which one is best? I put them to some, uh, semi-rigorous testing. Ok, not totally rigorous or controlled, but I gave them all the same 3 tasks — triage my email, order me lunch, and build me a personal website — and it was interesting to see which worked best. It was also interesting to see how differently they functioned at these tasks. If you haven't started using an AI agent yet but are curious, well, I'm not sure that this is going to answer all your questions, but maybe is a place to get started. A big spoiler here for my ultimate recommendation: right now, Meta's Muse is the only free one of the bunch, so in my mind, that wins for most normal people who just want to try an agent out . OpenAI's Dot is only for the $100/month plan (ouch!) and Instinct is currently invite-only. To me, that's a no brainer. Do the free one (unless you're already paying for the ChatGPT plan, in which case you're probably already a pretty pro user and probably don't need my advice). Challenge #1: Manage my email Sometimes managing emails can feel like the mail scene in Harry Potter. Could the AI agents help? Jun Sato/WireImage I get a lot of email. Most of it I don't need to bother opening. Help me figure out which are the important ones. Muse: Muse has been a dutiful soldier here, and this was pretty much the first task I gave it when I started using it a few weeks ago. So far, \"triage my email\" has been the one truly useful thing an agent has done for me. Instinct: Overall, I don't like the fact that Instinct works mainly through your text messages vs. a dedicated app. While that's very convenient in certain ways, I don't like the idea of seeing email (bad, no fun) in my texts (good, fun) — mixing the two feels wrong. However, I have to hand it to Instinct — it found a Paperless Post invite for a party that I would otherwise have completely missed in my personal email. It was the only agent to pull that one out for me. Dot: Dot did something truly useful that required a lot of context, and it did all", "date_str": "2026-10-22T08:40:01+00:00", "hash": "faf17e1c1e4629b0", "title_fa": "Muse، Dot و Instinct را امتحان کردم. یک برنده آشکار وجود داشت، اما نه به این دلیل که بهترین کار را انجام داد.", "summary_fa": "Muse (سمت چپ)، Instinct (وسط) و Dot (راست) را امتحان کردم. متا / غریزه / گتی من عوامل پیشرو هوش مصنوعی را برای مدتی آزمایش کردم و به هر یک از آنها وظایف مشابهی دادم. نقطه OpenAI من را از عدم ارائه مالیات نجات داد، اما بدترین حالت در سفارش ناهار بود. در نهایت، برخورد با چندین عامل هوش مصنوعی به طور همزمان یک دردسر است! من با عوامل مختلف هوش مصنوعی - Muse، Instinct، و OpenAI's Dot بازی کرده‌ام، و آنها را واقعاً برای چیزهای خاصی مفید یافته‌ام. اما کدام یک بهترین است؟ من آنها را در یک آزمایش نیمه سخت قرار دادم. خوب، کاملاً سختگیرانه یا کنترل‌شده نیست، اما من به همه آنها 3 کار یکسان دادم - ایمیلم را تریاژ کنید، ناهار را به من سفارش دهید، و یک وب‌سایت شخصی برایم بسازید - و جالب بود که ببینم کدام کار بهتر است. همچنین جالب بود که ببینیم آنها چقدر در این وظایف متفاوت عمل می کنند. اگر هنوز استفاده از یک عامل هوش مصنوعی را شروع نکرده اید اما کنجکاو هستید، خوب، مطمئن نیستم که این به تمام سوالات شما پاسخ دهد، اما شاید جایی برای شروع باشد. یک اسپویلر بزرگ در اینجا برای توصیه نهایی من: در حال حاضر، Meta's Muse تنها رایگان از این دسته است، بنابراین در ذهن من، برای اکثر افراد عادی که فقط می خواهند یک نماینده را امتحان کنند، برنده است. OpenAI's Dot فقط برای طرح 100 دلاری در ماه است (اوه!) و Instinct در حال حاضر فقط برای دعوت است. برای من، این یک بی فکری است. رایگان را انجام دهید (مگر اینکه قبلاً برای طرح ChatGPT پرداخت کرده باشید، در این صورت احتمالاً قبلاً یک کاربر حرفه ای هستید و احتمالاً به مشاوره من نیاز ندارید). چالش شماره 1: مدیریت ایمیل من گاهی اوقات مدیریت ایمیل ها می"}, {"source": "Business Insider", "title": "Barclays is cutting 5,000 jobs — including developers — in an AI push", "link": "https://www.businessinsider.com/barclays-job-cuts-ai-push-layoffs-2026-10", "summary": "Barclays is cutting around 5% of its workforce. KHemaz/GVN via Getty Images Barclays said it's cutting 5,000 jobs, or 5% of its workforce, in an AI push. Most of the cuts will impact support functions, including developers. Wall Street at large is grappling with how AI will transform both back- and front-office roles. Barclays said it's cutting 5,000 jobs, or around 5% of its full-time workforce, as it increases its reliance on AI. The British bank said in its third-quarter earnings statement that it is \"structurally reducing\" its costs through \"technology-enabled\" head count reductions. Barclays laid out the numbers in its accompanying earnings presentation, linking the cuts specifically to \"organisational simplification and technology change efficiency driven by AI.\" Around 60% of the cuts will impact support functions, including developers, according to the presentation. Coding has become one of the main business use cases for AI across industries, causing some companies to cut back on developers. Anna Cross, Barclays' group finance director, said the layoffs come as \"AI makes our people more productive.\" \"Nowhere in the bank is this more relevant than in Barclays UK, where we have taken more structural cost actions than planned in '26,\" she said on the earnings call. Wall Street is grappling with how AI will impact head count for both back- and front-office roles, as much of junior bankers' technical, repetitive workload can be automated. Some executives have said they're looking for young people with sharp judgment and communication skills rather than just analytical brainpower, as AI places an even greater premium on client interactions. Goldman Sachs said in a memo last year that it plans to \"restrain head count growth,\" and JPMorgan CEO Jamie Dimon has said he will likely hire fewer bankers and more \"AI people.\" Barclays joins a growing list of companies that have announced AI-related layoffs this year, including Snap and Coinbase. Business Insider analyzed 15 layoff memos earlier this year and found that \"AI\" was the most commonly used term. AI hasn't always led to companies cutting back. Some companies have increased hiring , while others have cut some roles and hired more for others. Read the original article on Business Insider", "date_str": "2026-10-22T08:38:35+00:00", "hash": "2fd288ba5f9f0887", "title_fa": "بارکلیز 5000 شغل - از جمله توسعه دهندگان - را در یک اقدام هوش مصنوعی کاهش می دهد", "summary_fa": "بارکلیز حدود 5 درصد از نیروی کار خود را کاهش می دهد. KHemaz/GVN از طریق Getty Images بارکلیز اعلام کرد که 5000 شغل یا 5 درصد از نیروی کار خود را در یک اقدام هوش مصنوعی اخراج می کند. اکثر برش ها بر عملکردهای پشتیبانی، از جمله توسعه دهندگان تأثیر می گذارد. وال استریت در کل با این موضوع دست و پنجه نرم می‌کند که چگونه هوش مصنوعی نقش‌های پشتی و جلویی را تغییر می‌دهد. بارکلیز اعلام کرد که 5000 شغل یا حدود 5 درصد از نیروی کار تمام وقت خود را کاهش می دهد زیرا اتکای خود به هوش مصنوعی را افزایش می دهد. این بانک بریتانیایی در بیانیه درآمد سه ماهه سوم خود اعلام کرد که از طریق کاهش تعداد کارمندان «به دلیل فناوری» هزینه‌های خود را «به طور ساختاری کاهش می‌دهد». بارکلیز این اعداد را در ارائه درآمد همراه خود بیان کرد و این کاهش ها را به طور خاص به \"ساده سازی سازمانی و کارایی تغییر فناوری ناشی از هوش مصنوعی\" مرتبط کرد. با توجه به ارائه، حدود 60٪ از برش ها بر عملکردهای پشتیبانی، از جمله توسعه دهندگان تأثیر می گذارد. کدنویسی به یکی از موارد اصلی استفاده تجاری برای هوش مصنوعی در صنایع تبدیل شده است و باعث شده است که برخی از شرکت ها توسعه دهندگان را کاهش دهند. آنا کراس، مدیر مالی گروه بارکلیز، گفت که اخراج کارکنان در شرایطی رخ می دهد که \"هوش مصنوعی باعث بهره وری بیشتر مردم می شود.\" او در تماس با درآمد گفت: «هیچ جای بانکی این موضوع به اندازه بارکلیز انگلستان نیست، جایی که ما اقدامات هزینه ساختاری بیشتری نسبت به برنامه ریزی در سال 26 انجام داده ایم. وال استریت با این موضوع دست و پنجه نرم می‌کند که چگونه هوش مصنوعی بر تعداد کارها برای نقش‌های پشتی و جلویی تأثیر می‌گذارد، زیرا بسیاری"}, {"source": "Business Insider", "title": "The AI safety bottleneck: Save the world or get the bag", "link": "https://www.businessinsider.com/ai-safety-jobs-pay-work-in-labs-nonprofits-save-humanity-2026-10", "summary": "Getty Images; Tyler Le/BI When Rishub Jain worked on safety at Google DeepMind , he held one of the most coveted jobs in tech. He was among a small group of researchers working to mitigate the most consequential risks of AI. But he left to cofound a nonprofit, Sampura Research. Jain traded the prestige and access that come with a Google job because he feels he can have a sharper, more profound impact on AI safety from the outside. Jain says he wants the autonomy to pursue research on a specific issue in AI alignment, which he felt had been deprioritized. \"All the top AI companies do care a lot about safety, and they invest in it, but they could be investing a lot more, and that's kind of what was inhibiting me,\" Jain says. \"If they invested more in safety, I would still be at the lab and working on what I'm interested in with a large team.\" Google did not respond to a request for comment about whether it maintains a focus on this specific area of research, but DeepMind's principles state that it maintains \"a holistic approach to responsibility, safety and security.\" Jain's founder story echoes concerns raised by safety researchers who have quit OpenAI and Anthropic, including dire warnings that these companies are \" gambling with our lives ,\" and could develop technology that ends humanity. Once dismissed as fringe and doomsday-obsessed, the AI safety profession is growing as hacks by rogue agents and a string of departures have vaulted the issue into mainstream concern. Open roles in AI safety jumped by 91% on LinkedIn over the past year. The industry expects a flood of cash from much-anticipated IPOs at Anthropic and, potentially, OpenAI , as those made absurdly wealthy by the equity returns may funnel money into potential clean-up crews for the messes created by the technology's rapid development. The AI safety problem is existentially big, but the people who have spent time honing AI expertise are few. These are people who test and train AI systems to operate ethically. Some focus on technical research, others on policy and governance. And they're increasingly sounding alarms. \"The people who are most worried about AI are often the people who have been closest to the technology,\" Laura González Salmerón, advising manager at 80,000 Hours, a nonprofit focused on transitioning people into careers with high social impact. The scarcity issue is less about funds and more about people. \"Talent is the main bottleneck.\" Startups and nonprofits in AI safety must", "date_str": "2026-10-22T08:37:01+00:00", "hash": "88aae0ecd9dfa11e", "title_fa": "گلوگاه ایمنی هوش مصنوعی: جهان را نجات دهید یا کیف را بدست آورید", "summary_fa": "گتی ایماژ; Tyler Le/BI زمانی که Rishub Jain روی ایمنی در Google DeepMind کار می‌کرد، یکی از آرزومندانه‌ترین شغل‌ها را در زمینه فناوری داشت. او در میان گروه کوچکی از محققان بود که برای کاهش خطرات احتمالی هوش مصنوعی کار می‌کردند. اما او را ترک کرد تا یک موسسه غیرانتفاعی به نام Sampura Research را تأسیس کند. جین اعتبار و دسترسی را که با یک شغل گوگل همراه است عوض کرد، زیرا احساس می‌کند می‌تواند تاثیر عمیق‌تر و عمیق‌تری بر ایمنی هوش مصنوعی از بیرون داشته باشد. جین می‌گوید که می‌خواهد خودمختاری تحقیقاتی را در مورد یک موضوع خاص در همسویی هوش مصنوعی دنبال کند، که او احساس می‌کرد از اولویت برخوردار است. جین می‌گوید: «همه شرکت‌های برتر هوش مصنوعی به ایمنی اهمیت زیادی می‌دهند، و روی آن سرمایه‌گذاری می‌کنند، اما می‌توانند خیلی بیشتر سرمایه‌گذاری کنند، و این چیزی است که من را مهار می‌کند. \"اگر آنها روی ایمنی سرمایه گذاری بیشتری می کردند، من همچنان در آزمایشگاه بودم و با یک تیم بزرگ روی چیزی که به آن علاقه دارم کار می کردم.\" گوگل به درخواستی برای اظهار نظر در مورد اینکه آیا تمرکز خود را بر روی این حوزه خاص از تحقیق حفظ می کند یا خیر پاسخ نداد، اما اصول DeepMind بیان می کند که \"رویکردی جامع برای مسئولیت، ایمنی و امنیت\" حفظ می کند. داستان موسس جین بازتاب نگرانی‌های مطرح شده توسط محققان ایمنی است که OpenAI و Anthropic را ترک کرده‌اند، از جمله هشدارهای وحشتناک مبنی بر اینکه این شرکت‌ها با زندگی ما قمار می‌کنند و می‌توانند فناوری‌ای را توسعه دهند که به بشریت پایان می‌دهد. حرفه ایمنی هوش مصنوعی زمانی که به عنوان حاشیه‌ای و گرفتار روز قیامت کنار گذاشته شد، در حال رشد است، زیرا هک‌ها توسط عوامل سرکش و مجموعه‌ای از ترک‌ها این موضوع را به نگرانی اصلی تبدیل کرده‌اند. نقش‌های باز"}, {"source": "Business Insider", "title": "The director behind Yung Lean's viral 'Storm' video says AI imitations on social media made even good work look 'lame'", "link": "https://www.businessinsider.com/yung-lean-storm-video-director-romain-gavras-ai-copies-2026-10", "summary": "The director of Yung Lean s viral Storm video says AI made his work look lame. Francis Specker/CBS via Getty Images The director behind Yung Lean's \"Storm\" video said AI copies made him consider quitting filmmaking. Romain Gavras said AI imitations of \"Storm\" on social media made his work look \"lame.\" The original video, released in April, has amassed more than 40 million views on YouTube. The director behind Swedish rapper Yung Lean's viral \"Storm\" video says AI almost drove him from filmmaking. In an interview with Vulture published on Tuesday, Romain Gavras said he was disheartened by the wave of AI-generated copies of the music video. Gavras directed the video for \"Gener8ion,\" an audiovisual project he runs with French producer Surkin. The video, which has amassed over 40 million views since its release in April, follows Lean as a bully at a boarding school before the boys he has been tormenting break into an elaborate dance sequence around him during a class photo. In September, social media users began using AI to remake the dance scene from \"Storm,\" swapping Lean and the schoolboys for a wide range of new characters, including animals and celebrities. \"My daughter sent me the first one I saw,\" Gavras said. \"She was like, 'Look, this dog is doing it.'\" It was funny for a while, he said, but the novelty soon wore off as the copies seemed to spread everywhere. \"It made me sad for all the people who put in so much work on our video,\" Gavras said. \"A trend like this can make even good work look lame. Part of me wanted to quit filmmaking, move back to Greece, and become an olive farmer.\" Gavras said he wasn't trying to make any commentary on AI, but when people started calling \"Storm\" the kind of video AI couldn't pull off, he found himself drawn into the debate. \"The tech people were like, 'Oh yeah? AI could never?' Then they started replicating it. So we were forced into this conversation. It's a nightmare,\" Gavras said. He added that he has turned down a few AI companies that have approached him about licensing the video. \"There's an economic model coming that we didn't want to be a part of,\" he said. However, even as AI-made versions of his work proliferate online, Gavras said the technology can imitate elements of the video but has yet to create anything with the same originality or human spark. \"They're missing the swagger of Yung Lean . He looks like a dangerous baby. There's something in the imperfection of humanity, and the interior life of someo", "date_str": "2026-10-22T05:56:32+00:00", "hash": "5339af21ef5453df", "title_fa": "کارگردان ویدیوی ویروسی «طوفان» یونگ لین می‌گوید تقلید هوش مصنوعی در شبکه‌های اجتماعی باعث می‌شود حتی کارهای خوب هم «لنگ» به نظر برسند.", "summary_fa": "کارگردان ویدیوی طوفان ویروسی یونگ لین می‌گوید هوش مصنوعی کار او را لنگ کرده است. فرانسیس اسپکر/سی‌بی‌اس از طریق گتی ایماژ کارگردان ویدیوی «طوفان» یونگ لین گفت که کپی‌های هوش مصنوعی او را مجبور به ترک فیلم‌سازی کرده است. رومن گاوراس گفت که تقلید هوش مصنوعی از \"طوفان\" در شبکه های اجتماعی باعث شده کار او \"لنگ\" به نظر برسد. ویدیوی اصلی که در ماه آوریل منتشر شد، بیش از 40 میلیون بازدید در یوتیوب به دست آورد. کارگردان ویدیوی ویروسی «طوفان» خواننده رپ سوئدی، یونگ لین می‌گوید هوش مصنوعی تقریباً او را از ساختن فیلم دور کرده است. رومن گاوراس در مصاحبه ای با Vulture که روز سه شنبه منتشر شد، گفت که از موج کپی های تولید شده توسط هوش مصنوعی از موزیک ویدیو دلسرد شده است. گاوراس این ویدئو را برای \"Gener8ion\" کارگردانی کرد، یک پروژه سمعی و بصری که او با تهیه کننده فرانسوی سورکین اجرا می کند. این ویدئو که از زمان انتشار در آوریل بیش از 40 میلیون بازدیدکننده داشته است، لین را به عنوان یک قلدر در یک مدرسه شبانه روزی دنبال می‌کند، قبل از اینکه پسرانی که او تحت عذابش قرار می‌دهند در طی یک عکس کلاسی به یک سکانس رقص پیچیده اطراف او نفوذ کنند. در ماه سپتامبر، کاربران شبکه‌های اجتماعی شروع به استفاده از هوش مصنوعی برای بازسازی صحنه رقص «طوفان» کردند و لین و بچه‌های مدرسه را با طیف گسترده‌ای از شخصیت‌های جدید، از جمله حیوانات و افراد مشهور، عوض کردند. گاوراس گفت: «دخترم اولین موردی را که دیدم برایم فرستاد. او می‌گفت: «ببین، این سگ دارد این کار را می‌کند.» او گفت که برای مدتی خنده‌دار بود، اما این تازگی خیلی زود از بین رفت زیرا به نظر می‌رسید نسخه‌های آن در همه جا پخش شده است. گاوراس گفت: «این باعث ناراحتی همه افرادی شد که روی ویدیوی"}, {"source": "Business Insider", "title": "Japan's aging business owners are selling their legacies for cheap to young entrepreneurs who are down to hustle", "link": "https://www.businessinsider.com/japan-small-business-owner-retirement-successor-crisis-2026-10", "summary": "Aging owners are putting Japan s small businesses up for sale. These young entrepreneurs are stepping up. Provided by Takayuki Otawara. Japan's aging population and rural exodus are fueling a small-business succession crisis. With no heirs, many aging business owners are listing their companies on succession platforms, often at low prices. Meet the young entrepreneurs betting on themselves to keep these businesses alive. Six days a week, Kengo Ohama is up before the sun. He takes 5 minutes to get ready, and is soon out the door for an hourlong motorbike ride to the neighboring town of Mihara in Hiroshima, Japan. By 6 a.m., he pulls up outside a log-cabin-style building, home to Country Road, the café and roastery that he's been managing with his wife since April. Kengo Ohama took over Countryroad, a café in Hiroshima, Japan, early this year. Provided by Kengo Ohama. He cleans the space, makes pastries , roasts coffee beans, and serves guests throughout the day. After the last table has cleared, Ohama stays behind to prepare for tomorrow. By the time he gets home, it is already 11 p.m. Ohama had always dreamed of opening a café . When he found an established one listed on Relay, a Japanese business-succession platform, it felt like fate. The café's owners, an older couple looking to retire, no longer had the physical stamina to run the business.\"Their biggest wish was simply for someone to take good care of the shop and keep it a lively place,\" Ohama, 31, told Business Insider. The previous owners were getting on in age and wanted to find a successor for their café. Provided by Kengo Ohama. The terms of the takeover were simple: He had to keep the business operating, but was free to redesign the interiors as he saw fit. \"That flexibility made the opportunity very attractive,\" Ohama said. Ohama now covers 50,000 Japanese yen in monthly rent for the building. The business itself — including the brand, furniture, kitchen equipment, recipes, and supplier information — was transferred to him for zero Japanese yen. Ohama said the previous owners wanted someone passionate to succeed them, and were willing to transfer the business to him at no cost. Provided by Kengo Ohama. A new generation steps in Ohama is part of a younger generation taking over Japan's small businesses as their longtime owners age out with no successor in sight. The country's low birth rate and rapidly aging population have left many business owners without adult children to inherit their compa", "date_str": "2026-10-22T05:13:09+00:00", "hash": "edcf96dcd23ba9d5", "title_fa": "صاحبان مشاغل سالخورده ژاپنی میراث خود را ارزان به کارآفرینان جوان می فروشند.", "summary_fa": "صاحبان سالخورده، مشاغل کوچک ژاپن را برای فروش قرار می دهند. این کارآفرینان جوان در حال پیشرفت هستند. ارائه شده توسط تاکایوکی اوتاوارا. جمعیت پیر ژاپن و مهاجرت روستایی به بحران جانشینی مشاغل کوچک دامن می زند. بدون وارث، بسیاری از صاحبان مشاغل مسن شرکت های خود را در پلتفرم های جانشینی، اغلب با قیمت های پایین، فهرست می کنند. با کارآفرینان جوان آشنا شوید که روی خودشان شرط بندی می کنند تا این مشاغل را زنده نگه دارند. شش روز در هفته، کنگو اوهاما قبل از آفتاب طلوع می کند. او 5 دقیقه طول می کشد تا آماده شود و به زودی برای یک ساعت موتور سواری به شهر همسایه میهارا در هیروشیما، ژاپن می رود. تا ساعت 6 صبح، او از ساختمانی به سبک کلبه چوبی بیرون می‌آید، جایی که جاده کانتری، کافه و کباب‌پزی که از آوریل با همسرش اداره می‌کرده است. کنگو اوهاما در اوایل سال جاری، کافه ای در هیروشیما، ژاپن، Countryroad را تصاحب کرد. ارائه شده توسط Kengo Ohama. او فضا را تمیز می کند، شیرینی درست می کند، دانه های قهوه را برشته می کند و در طول روز از مهمانان پذیرایی می کند. پس از پاک شدن آخرین جدول، اوهاما پشت سر می ماند تا برای فردا آماده شود. وقتی به خانه می رسد، ساعت 11 شب است. اوهاما همیشه آرزوی افتتاح یک کافه را داشت. وقتی او یک پلتفرم مستقر را پیدا کرد که در Relay، یک پلتفرم جانشینی کسب و کار ژاپنی فهرست شده بود، به نظر سرنوشت رسید. صاحبان کافه، زوج مسن‌تری که به دنبال بازنشستگی بودند، دیگر استقامت فیزیکی لازم برای اداره تجارت را نداشتند. اوهاما، 31 ساله، به Business Insider گفت: \"بزرگترین آرزوی آنها این بود که کسی به خوبی از مغازه مراقبت کند و آن را مکانی پر جنب و جوش نگه دارد.\" صاحبان قبلی در"}, {"source": "Business Insider", "title": "This Box executive loves candidates with side projects. His own involves bringing back old-school TV.", "link": "https://www.businessinsider.com/box-rand-wacker-candidates-side-projects-apple-tv-app-cursor-2026-10", "summary": "Rand Wacker, a Box executive, loves a good side project. Box Rand Wacker, a Box product executive, wants his potential hires to go beyond being just AI-literate. Wacker likes when candidates show him their side projects, especially if they've monetized them. He's dipped his toes into building, too, with an Apple TV app that evokes the feel of old-school TV. Knowing how to use AI is only enough to get a foot in the door for interviews, according to a Box executive. Rand Wacker, Box's vice president of product strategy, said that for candidates applying for a job at Box, AI literacy is a bare-minimum requirement. Having a fully developed side hustle or project — something he practices himself — is what gives potential hires a leg up in interviews. Case studies, which he said used to be a staple in Box interviews, are now a relic of the past. Now, he expects candidates to be prototyping out their ideas. What he really likes to see is candidates showing him a product they've built themselves using AI, even if it has nothing to do with Box's business. He said he's had potential hires show him mobile apps that they've built, gotten onto the App Store, and are monetizing to some degree. \"They're running this little side hustle overall,\" he said. \"And it shows the passion.\" He said that people who explore and experiment with AI are the ones who win in the AI world, as they figure out how to use it most effectively in their personal and professional lives. He practices what he preaches Wacker, who's spent almost 30 years in the software engineering and product management fields, said he started out as a \"computer nerd\" and loved playing around with software tools and building things. As he progressed in his career, he said he had less time to experiment with building, but AI has recently allowed him to test small ideas he didn't have time to explore before vibe coding existed. He recently made an app to bring back old-school TV because he missed the days when he'd turn it on, pick one of three cable channels, and it would play a random movie from a random point. \"These days, whenever I'm trying to find something to watch on the weekends, it's decision fatigue . Which of the six streaming services do I go to? What are the 20 million titles I scroll through?\" he said. Using Cursor, he built an Apple TV app that would access his entire movie library, pick a random movie, and play it from a random point. Working on these kinds of projects is a great way to learn the to", "date_str": "2026-10-22T05:11:35+00:00", "hash": "2b339391754b8ad6", "title_fa": "این مدیر باکس عاشق نامزدهایی با پروژه های جانبی است. خودش شامل بازگرداندن تلویزیون قدیمی است.", "summary_fa": "رند واکر، یکی از مدیران باکس، عاشق یک پروژه جانبی خوب است. باکس رند واکر، مدیر محصولات باکس، می‌خواهد استخدام‌های بالقوه‌اش فراتر از سواد هوش مصنوعی باشد. واکر دوست دارد که کاندیداها پروژه های جانبی خود را به او نشان دهند، به خصوص اگر از آنها درآمدزایی کرده باشند. او با اپلیکیشن Apple TV که حس تلویزیون قدیمی را القا می کند، انگشتان پای خود را در ساختمان فرو برده است. به گفته یکی از مدیران باکس، دانستن نحوه استفاده از هوش مصنوعی تنها برای ورود به درب مصاحبه کافی است. رند واکر، معاون استراتژی محصول Box، گفت که برای نامزدهایی که برای شغل در Box درخواست می کنند، سواد هوش مصنوعی یک نیاز حداقلی است. داشتن یک پروژه یا پروژه جانبی کاملاً توسعه یافته - چیزی که او خودش آن را تمرین می کند - چیزی است که به استخدام کنندگان بالقوه در مصاحبه ها پای کار می گذارد. مطالعات موردی، که به گفته او در مصاحبه‌های باکس جزء اصلی آنها بود، اکنون به یادگار گذشته است. اکنون، او انتظار دارد که نامزدها ایده های خود را نمونه سازی کنند. چیزی که او واقعاً دوست دارد ببیند این است که نامزدها محصولی را که خودشان با استفاده از هوش مصنوعی ساخته اند به او نشان می دهند، حتی اگر ربطی به تجارت باکس نداشته باشد. او گفت که استخدام‌های بالقوه‌ای به او نشان می‌دهند که برنامه‌های موبایلی را که ساخته‌اند، وارد اپ استور شده‌اند و تا حدودی در حال کسب درآمد هستند. او گفت: «آنها به طور کلی در حال اجرای این شلوغی جانبی کوچک هستند. \"و این اشتیاق را نشان می دهد.\" او گفت که افرادی که هوش مصنوعی را کشف و آزمایش می کنند، کسانی هستند که در دنیای هوش مصنوعی پیروز می شوند، زیرا می دانند چگونه از آن در زندگی شخصی و حرفه ای خود"}, {"source": "Business Insider", "title": "Wait: Your autonomous Tesla won't drive everywhere just yet", "link": "https://www.businessinsider.com/tesla-full-self-driving-fsd-release-date-unsupervised-limits-geofences-2026-10", "summary": "Tesla said that it expects to release unsupervised FSD around Q2 2027. Harald Tittel/picture alliance via Getty Images Tesla's Full Self-Driving feature still requires drivers to pay attention to the road. During its Q3 earnings call, the company said unsupervised FSD for personal cars is coming in 2027. The catch? Your Tesla must remain within the company's Robotaxi geofences. When I reviewed Tesla's Full Self-Driving software in January, I hailed it as an \"impressive\" driver-assistance feature that left me wanting more. I dreamed of being able to flip the autonomous driving system on whenever I make my routine 400-mile trip from San Francisco to Los Angeles — kick my feet up, listen to music, and ideally fall asleep without having to supervise the road. That's been part of Tesla's ultimate pitch for the future. \"With autonomy, you get your time back,\" Elon Musk has said. And the pitch may soon come true. Just don't expect to make long self-driven road trips quite yet. On Wednesday, during Tesla's Q3 earnings call, Ashok Elluswamy , the company's VP of AI, painted a more modest picture of what FSD unsupervised will look like for a personal car — at least at first. Elluswamy said unsupervised FSD is coming \"somewhere around Q2 next year\" for privately owned Teslas, with the rollout of FSD V15. The caveat is that it will only be operable in areas where Tesla already operates its Robotaxi service, which represents a small fraction of square miles for the total number of Teslas on US roads. The Robotaxi platform is available in parts of seven metropolitan regions: Austin, Dallas, Houston, Miami, Orlando, Tampa, and the San Francisco Bay Area. In the Bay Area, all Tesla robotaxis are supervised by a human operator. \"The only additional requirement is to make sure that, for example, the customer Model Ys can be part of the geofences and the fleet management that Tesla has for it to be fully autonomous,\" Elluswamy said. In other words, your Tesla may be able to drive itself, but only if you're within the zones where Tesla Robotaxi is operating. If you're in Austin, that could cover about 260 square miles of the city, excluding high-speed roadways. That's similar to what other aspiring self-driving car companies have pitched. Tensor, a San Jose-based automaker , aims to sell a luxury sedan that it says can drive itself. However, the self-driving feature will only operate within restricted geofences, the company told Business Insider. Tesla didn't say why it needs", "date_str": "2026-10-22T04:10:01+00:00", "hash": "4f5f18b31cb98c61", "title_fa": "صبر کنید: تسلای خودران شما هنوز در همه جا رانندگی نخواهد کرد", "summary_fa": "تسلا گفت که انتظار دارد FSD بدون نظارت را در سه ماهه دوم سال 2027 منتشر کند. اتحاد هارالد تیتل/تصویر از طریق Getty Images ویژگی کامل خودران تسلا همچنان از رانندگان می خواهد که به جاده توجه کنند. این شرکت در جریان تماس سود سه ماهه سوم خود گفت که FSD بدون نظارت برای خودروهای شخصی در سال 2027 عرضه می شود. تسلا شما باید در محدوده زمین‌های Robotaxi شرکت باقی بماند. هنگامی که در ژانویه نرم افزار کامل خودران تسلا را بررسی کردم، از آن به عنوان یک ویژگی کمک راننده \"معمول\" استقبال کردم که باعث شد بیشتر بخواهم. من رویای این را داشتم که بتوانم سیستم رانندگی خودران را هر زمان که از سانفرانسیسکو به لس آنجلس 400 مایلی معمولی می‌روم روشن کنم - پاهایم را با لگد بالا بیاورم، به موسیقی گوش دهم و در حالت ایده‌آل بدون نیاز به نظارت بر جاده بخوابم. این بخشی از برنامه نهایی تسلا برای آینده است. ایلان ماسک گفته است: «با خودمختاری، زمان خود را برمی‌گردانید. و زمین ممکن است به زودی محقق شود. فقط انتظار نداشته باشید که هنوز سفرهای جاده ای طولانی مدت خود را انجام دهید. روز چهارشنبه، در جریان تماس سود سه ماهه سوم تسلا، آشوک الوسوامی، معاون هوش مصنوعی این شرکت، تصویری ساده‌تر از اینکه FSD بدون نظارت برای یک خودروی شخصی - حداقل در ابتدا - چگونه خواهد بود، ترسیم کرد. Elluswamy گفت که FSD بدون نظارت \"حدوداً در سه ماهه دوم سال آینده\" برای تسلاس خصوصی با عرضه FSD V15 عرضه می شود. اخطار این است که فقط در مناطقی قابل اجرا خواهد بود که تسلا قبلاً سرویس Robotaxi خود را اجرا می کند، که نشان دهنده کسری کوچک از مایل مربع برای تعداد کل تسلا در جاده های ایالات متحده است. پلت فرم Robotaxi در بخش هایی از هفت منطقه شهری موجود"}, {"source": "Business Insider", "title": "Sundar Pichai explains how a team of AI agents helps him run the company", "link": "https://www.businessinsider.com/sundar-pichai-explains-how-ai-agents-help-him-run-google-2026-10", "summary": "The Google CEO said he uses AI agents to track Google s model development and internal discussions. Bloomberg/Getty Images Sundar Pichai said he uses AI agents to track Google's model development and internal discussions. The bots summarize updates and monitor how Google's computing resources are used. Pichai said humans still make consequential decisions about resource allocation. Even Google's CEO needs help keeping up with Google. On the Sources podcast released Wednesday, Sundar Pichai described to host Alex Heath how he delegates some of the information-gathering that comes with running the tech giant. “It could easily take me an hour a day to kind of catch up, what's happened in the last 24 hours, right?\" Pichai said. \"But now I have agents running which summarize and bring that information to me. I can still go deeper, and I do so often.\" Pichai said that his AI agents give him a way to \"understand the model development arc,\" figure out how Google's computing resources are being used, and follow threads spread across numerous internal chat groups without having to read through every conversation himself. “Similarly, there are agents with telemetry into our compute usage by product area, efficiency, utilization, and giving me inputs and insights, you know,\" Pichai added. \"I think it's made all of us, you know, be better at what we do.\" That doesn't mean Pichai has handed over the important calls to AI. He said humans — including himself — remain directly involved in consequential decisions about allocating computing resources. Managing agents is becoming a skill in its own right, giving some workers a new set of headaches, from checking the bots' output to preventing them from duplicating work or straying beyond their assignments. Business Insider previously reported that the need to manage agents is making everyone a boss without higher pay. Delegating to bots doesn't necessarily make work easier, either. A Cisco engineering director who manages more than 10 agents told Business Insider that overseeing them involves more task switching and can make work feel more intense without shortening his days. For the Google CEO, however, continuous work is a plus. \"So because your agents, they're running in the cloud, they're run
