etwork — reported. Screenshots circulating on social media show products being offered for a fraction of their retail prices, including bags overflowing with Sephora cosmetics advertised for as little as €10 (£8.40). The listings have triggered suspicions that looters are trying to sell stolen goods online. eBay and Vinted have removed some items and stepped up their monitoring of suspicious activity. One advert on Vinted showed six Sephora lip glosses being sold for €15, while another offered six tubes of cleansing cream for just €12. Sephora France sells comparable own-brand lip glosses for around €13 each, meaning six would ordinarily cost around €78. A screenshot of a Vinted listing showing suspected stolen Sephora beauty products Screenshot Other listings included Christian Dior perfumes advertised for €250 and large quantities of make-up still in their original packaging. In one case, Pokémon trading cards allegedly stolen from a shop in Lille were advertised on Vinted, with some still bearing their original price stickers. Hundreds of cards were reportedly found scattered across streets in the northern French city after a fire at Le Coin des Barons, a shop specialising in collectable cards. A trophy said to have been stolen from French e-sport club Team Vitality was advertised on eBay for €1,250. The silver StarLadder Counter-Strike trophy was photographed against a graffiti-covered wall and listed under the title: \"STOLEN RARE VITALITY CS2 TROPHÉE.\" Team Vitality confirmed that its Paris premises had been looted during Satur", "date_str": "2026-10-19T18:44:55+00:00", "hash": "2a82551102c76e6e", "title_fa": "وب‌سایت‌های فروش مجدد از جمله Vinted در پی غارت فرانسوی‌ها مملو از کالاهای «دزدیده شده» هستند.", "summary_fa": "معترضان یک فروشگاه خرده‌فروشی را در جریان تظاهراتی در نزدیکی میدان جمهوری تخریب می‌کنند، در حالی که ژله‌های ژله به دانش‌آموزان برای فعالیت آخر هفته در 17 اکتبر 2026 در پاریس ملحق می‌شوند، Franc Carl Court/Getty Images اسکرین‌شات‌هایی از فهرست‌های Vinted که در رسانه‌های اجتماعی پخش می‌شوند نشان می‌دهند که محصولات با قیمت‌های خرده‌فروشی‌شان عرضه می‌شوند. کالای مشکوک به سرقت رفته پس از غارت در فرانسه در لیست قرار گرفت. وینتد به تلگراف گفت که اقدام فوری برای شناسایی و حذف لیست های مرتبط با خشونت انجام داده است. وب‌سایت‌های فروش مجدد از جمله Vinted، فهرست‌های مشکوک را پس از اینکه در پی شورش‌هایی که در سراسر فرانسه در گرفت، با کالاهای ظاهرا دزدیده شده پر شده بودند، حذف کردند. به گزارش تلگراف که مانند Business Insider بخشی از شبکه گزارشگران جهانی Axel Springer است، عطرها، کیف‌های دستی طراحان، لوازم آرایشی و حتی کارت‌های پوکمون در بازارهای دست دوم ظاهر شده‌اند. اسکرین‌شات‌هایی که در رسانه‌های اجتماعی پخش می‌شوند نشان می‌دهند که محصولاتی با کسری از قیمت‌های خرده‌فروشی‌شان عرضه می‌شوند، از جمله کیسه‌های مملو از لوازم آرایشی Sephora که با قیمتی کمتر از ۱۰ یورو (۸.۴۰ پوند) تبلیغ می‌شوند. این فهرست‌ها این ظن را برانگیخته است که غارتگران سعی دارند کالاهای دزدیده شده را به صورت آنلاین بفروشند. eBay و Vinted برخی از موارد را حذف کرده و نظارت خود را بر فعالیت های مشکوک افزایش داده اند. یک آگهی در Vinted نشان می‌دهد که شش براق کننده لب Sephora به قیمت 15 یورو فروخته می‌شود، در حالی که آگهی دیگر شش تیوپ کرم پاک‌کننده را تنها با قیمت 12 یورو ارائه می‌دهد. Sephora France براق‌های لب مشابه با برند خود را با قیمتی در حدود 13 یورو به فروش می‌رساند، به این معنی که شش عدد معمولاً حدود 78 یورو قیمت دارند. تصویری از فهرست Vinted که محصولات آرایشی سفورا"}, {"source": "Business Insider", "title": "A major housing indicator just flashed its most negative reading in 14 years", "link": "https://www.businessinsider.com/housing-market-warning-homebuilder-sentiment-nahb-mortgage-rates-2026-10", "summary": "Homebuilder sentiment fell to its lowest level in 14 years in October, according to the National Association of Home Builders. Joshua Lott/Bloomberg via Getty Images Homebuilder sentiment has plunged, the latest signal that the housing market is in rough shape. Sentiment dropped to 29 in October, its lowest level in 14 years, the NAHB said. The decline reflects pressures from slowing sales, higher mortgage rates, and higher building costs. The mood among America's homebuilders is grim. Homebuilder sentiment fell three points to 29 in October, according to the National Association of Home Builders/Wells Fargo Housing Market Index. October's reading marks the lowest homebuilder sentiment the US has seen since June 2012, the NAHB said, when the housing market was still moving through the aftermath of the 2008 crisis. It shows just how much builders have soured on the housing landscape amid rising costs and a record-breaking slowdown in home sales. Here's what explains the decline: The housing market is frozen. Home sales have been suppressed for years, but the yearslong housing freeze appears to have gotten worse in recent months as more prospective homebuyers head back to the sidelines. 2026 is on track to be the worst year for home sales since 2011, according to an estimate from Capital Economics. Barring the housing slowdown during the pandemic, pending home sales dropped to a 14-year-low in September, according to a Redfin estimate. Cancellations are rising. More buyers are also getting cold feet and backing out of purchases of new houses as affordability concerns swell. Homebuilding cancellations in the West rose to their highest level since November 2023, according to an estimate from the boutique housing research firm Zelman. Mortgage rates have surged in the last year. Higher borrowing costs—as well as stubbornly high prices in many markets—are causing more prospective buyers to hold off on purchasing a home. The average 30-year fixed mortgage rate clocked in at 7.4% last week, according to Freddie Mac data, the highest level in three years. Building costs are rising. Homebuilders are also being pressured on the cost front, thanks to higher gas and materials prices. To top it off, they're also facing pressure to lower prices to entice buyers , cutting into profits. Prices for building material and supplies dealers rose 28.8% year-over-year in September, per the latest producer price index report. Meanwhile, 43% of homebuilders cut prices in October, t", "date_str": "2026-10-19T18:05:13+00:00", "hash": "949f5d95eca6c502", "title_fa": "یک شاخص اصلی مسکن به تازگی منفی ترین قرائت خود را در 14 سال گذشته ثبت کرد", "summary_fa": "بر اساس گزارش انجمن ملی سازندگان خانه، احساسات خانه ساز در اکتبر به پایین ترین سطح خود در 14 سال گذشته رسید. جاشوا لات/ بلومبرگ از طریق Getty Images احساسات خانه‌سازان کاهش یافته است، آخرین سیگنالی که بازار مسکن در وضعیت نامساعدی قرار دارد. NAHB گفت که احساسات در اکتبر به 29 کاهش یافت که پایین ترین سطح در 14 سال گذشته است. این کاهش منعکس کننده فشارهای ناشی از کاهش فروش، نرخ بالاتر وام مسکن و هزینه های ساختمانی بالاتر است. خلق و خوی در میان خانه سازان آمریکایی بسیار بد است. بر اساس گزارش انجمن ملی سازندگان خانه/شاخص بازار مسکن ولز فارگو، تمایل خانه‌سازان در ماه اکتبر به 29 کاهش یافت. NAHB گفت که قرائت ماه اکتبر پایین‌ترین احساس خانه‌ساز را نشان می‌دهد که ایالات متحده از ژوئن 2012 مشاهده کرده است، زمانی که بازار مسکن همچنان در حال حرکت در مسیر پس از بحران 2008 بود. این نشان می‌دهد که سازندگان در بحبوحه افزایش هزینه‌ها و کاهش بی‌سابقه فروش مسکن تا چه حد بر چشم‌انداز مسکن ضربه زده‌اند. آنچه این کاهش را توضیح می دهد این است: بازار مسکن یخ زده است. فروش مسکن برای سال‌ها متوقف شده است، اما به نظر می‌رسد که توقف سال‌ها مسکن در ماه‌های اخیر بدتر شده است، زیرا خریداران بالقوه بیشتری به حاشیه رفته‌اند. بر اساس برآورد کپیتال اکونومیکس، سال 2026 بدترین سال برای فروش خانه از سال 2011 تاکنون خواهد بود. بر اساس برآورد Redfin، با جلوگیری از کندی مسکن در طول همه‌گیری، فروش مسکن معلق در سپتامبر به پایین‌ترین حد در 14 سال گذشته رسید. لغو در حال افزایش است. با افزایش نگرانی‌های مربوط به مقرون‌به‌صرفه، خریداران بیشتری نیز دچار سردرگمی می‌شوند و از خرید خانه‌های جدید خودداری می‌کنند. بر اساس برآورد شرکت تحقیقاتی مسکن زلمن، لغو ساخت خانه در غرب به بالاترین سطح خود از نوامبر 2023 رسیده"}, {"source": "Business Insider", "title": "Kylie Jenner wore the most expensive Fantasy Bra in Victoria's Secret history. See the bras that came before it.", "link": "https://www.businessinsider.com/victorias-secret-fantasy-bra-evolution-fashion-show-photos-2026-10", "summary": "Kylie Jenner at the Victoria s Secret Fashion Show 2026. Michael Buckner/WWD via Getty Images The Fantasy Bra was a staple of the Victoria's Secret Fashion Show before it was canceled in 2019. The diamond-encrusted bra was always extravagant and worn by a top model at the VS Fashion Show. Kylie Jenner brought it back in 2026, modeling the most expensive Fantasy Bra ever created. Victoria's Secret brought some extra sparkle to its runway on Sunday night. The brand's annual fashion show, which returned in 2024 after being canceled five years earlier , was held in Los Angeles, with models including Adriana Lima and Barbara Palvin donning their wings for the occasion. Since making its comeback, the fashion show has been more than a spectacle for Victoria's Secret. It's also been a way to attract a new generation of shoppers by leaning into nostalgia . Elizabeth Preis, Victoria's Secret's chief marketing officer, previously told Fast Company that the show was about \"brand consideration for the audience that doesn't currently shop with us.\" This year, the brand ramped up its social media promotion and made 17 times as many runway items available to purchase, Barron's reported. The 2026 show also brought back a symbol of Victoria's Secret's heyday: the Fantasy Bra , an elaborate piece of lingerie often worth millions that hadn't appeared on the runway since 2018. Kylie Jenner modeled the bra for its comeback. Designed by Jacob Co., it's the most expensive Fantasy Bra ever created at $50 million. Take a look back at other Fantasy Bras Victoria's Secret has designed over the years. The Fantasy Bra was first introduced by Victoria s Secret in 1996 via a massive New York City billboard. Evan Agostini/Getty Images Worn by Claudia Schiffer, the diamond-encrusted lingerie was dubbed the \"Million Dollar Miracle Bra.\" It was modeled for the Victoria's Secret catalog and advertisements, such as the massive one displayed in New York City. Tyra Banks wore the next one in 1997. Tyra Banks models the Victoria s Secret Fantasy Bra in 1997. Ron Galella/Getty Images The \" Diamond Dream Bra \" was much more understated than the original. It was crafted from white satin, lined with diamonds, and had one 42-carat teardrop gem hanging from its center. Though the bra cost $3 million, it was never modeled on the Victoria's Secret Fashion Show runway — only by Banks at a private event held later. Gisele Bündchen modeled the Red Hot Fantasy Bra in 2000. Gisele Bündchen models the Victoria", "date_str": "2026-10-19T18:01:06+00:00", "hash": "31691f158f1c85fd", "title_fa": "کایلی جنر گران ترین سوتین فانتزی تاریخ ویکتوریا سیکرت را پوشید. سوتین های قبل از آن را ببینید.", "summary_fa": "کایلی جنر در فشن شوی ویکتوریا سکرت 2026. مایکل باکنر/WWD از طریق گتی ایماژ سوتین فانتزی پیش از لغو شدنش در سال 2019 یکی از اجزای اصلی فشن شو ویکتوریا سیکرت بود. سوتین الماس پوشیده شده در فشن شوی VS همیشه گران قیمت بود و توسط یک مدل برتر پوشیده می شد. کایلی جنر آن را در سال 2026 به ارمغان آورد و از گران ترین سوتین فانتزی ساخته شده الگوبرداری کرد. ویکتوریا سیکرت در یکشنبه شب درخشش بیشتری به باند فرودگاه خود آورد. شوی مد سالانه این برند، که در سال 2024 پس از پنج سال لغو آن بازگشت، در لس آنجلس برگزار شد و مدل هایی از جمله آدریانا لیما و باربارا پالوین برای این مناسبت بال های خود را به پا کردند. از زمان بازگشت، این فشن شو برای ویکتوریا سیکرت چیزی بیش از یک تماشایی بوده است. همچنین راهی برای جذب نسل جدیدی از خریداران با گرایش به نوستالژی بوده است. الیزابت پریس، مدیر ارشد بازاریابی ویکتوریا سیکرت، قبلاً به Fast Company گفته بود که این نمایش در مورد \"در نظر گرفتن برند برای مخاطبانی است که در حال حاضر از ما خرید نمی کنند.\" بارون گزارش داد که امسال، این برند تبلیغات خود را در رسانه های اجتماعی افزایش داد و 17 برابر بیشتر اقلامی را برای خرید در دسترس قرار داد. نمایش سال 2026 همچنین نمادی از دوران اوج ویکتوریا سیکرت را به ارمغان آورد: سوتین فانتزی، یک لباس زیر زنانه استادانه که اغلب میلیون‌ها ارزش دارد و از سال 2018 روی باند فرودگاه ظاهر نشده بود. کایلی جنر برای بازگشت آن مدل سوتین را ساخت. این سینه بند که توسط شرکت جیکوب طراحی شده است، گران ترین سوتین فانتزی است که تا به حال ساخته شده است با قیمت 50 میلیون دلار. نگاهی به سایر سوتین های فانتزی که ویکتوریا سیکرت در طول"}, {"source": "Business Insider", "title": "Jackery SolarSaga 40W Air review: Ultra-lightweight solar power for camping and heading off-grid", "link": "https://www.businessinsider.com/guides/home/jackery-solarsaga-40w-air-solar-panel-review", "summary": "When you buy through our links, Business Insider may earn an affiliate commission. Learn more The portable Jackery SolarSaga 40W Air Solar Panel keeps small tech charged on off-grid trips when power banks aren t enough, but you ll need to level your expectations about how much it can power. Lauren Allain/Business Insider Whether I'm camping or off the grid, a portable power station is my preferred way to stay charged up. But eventually, the battery runs out. I've found that one of the best ways to recharge small tech gadgets is with a solar panel. The exceptionally lightweight and portable Jackery SolarSaga 40W Air has become my favorite tool for keeping my phone and essential devices topped off off-grid. Unlike power banks, solar panels don't store power; they convert sunlight into usable energy in real time. Weighing under two pounds and folding down to the footprint of a book, this panel is built specifically for portability. It features a rugged IP68 waterproof rating, operates in extreme temperatures, and has direct USB-A and USB-C charging ports, making it an ideal companion for backpackers, campers, and field creators who need reliable power without added weight. What I liked When folded, it s about 1 inch thick, with the footprint of a standard sheet of paper. Lauren Allain/Business Insider An ultra-portable solar panel that weighs under two pounds Unlike most rigid and bulky solar panels, the Jackery SolarSaga 40W Air consists of four panels that fold down to a portable size — about 1 inch thick, with the footprint of a standard sheet of paper — that easily slips into a backpack. It only weighs about two pounds, and it comes with four mounting rivets and two carabiners to hang it off a backpack while hiking or attach it to the side of a tent while camping. Since it's only about three feet long when unfolded, it sits well on my backpack without getting in the way. On top of its portability, Jackery made this solar panel a cinch to use. Jackery included a solar charging cable with both a USB-A and USB-C port inside the box that can directly recharge devices from the solar panel, like phones, camera batteries, flashlights, and portable speakers. There's also an adapter to recharge Jackery power stations via the solar panel and an accessory pouch to hold the cables. A shadow dot appears on the bullseye sun angle indicator when placed in sunlight to let you know the panel is properly positioned. Lauren Allain/Business Insider Jackery added a bullseye i", "date_str": "2026-10-19T18:00:01+00:00", "hash": "a4b27247f44bd77b", "title_fa": "بررسی Jackery SolarSaga 40W Air: انرژی خورشیدی بسیار سبک برای کمپینگ و حرکت خارج از شبکه", "summary_fa": "وقتی از طریق پیوندهای ما خرید می کنید، Business Insider ممکن است کمیسیون وابسته را دریافت کند. بیشتر بدانید پنل خورشیدی هوای قابل حمل Jackery SolarSaga 40 واتی، فناوری کوچک را در سفرهای خارج از شبکه زمانی که پاوربانک‌ها کافی نیستند شارژ نگه می‌دارد، اما باید انتظارات خود را در مورد میزان انرژی آن یکسان کنید. Lauren Allain/Business Insider چه در کمپینگ باشم و چه خارج از شبکه، یک نیروگاه قابل حمل بهترین راه برای شارژ ماندن من است. اما در نهایت باتری تمام می شود. من متوجه شده ام که یکی از بهترین راه ها برای شارژ مجدد گجت های کوچک فناوری، استفاده از پنل خورشیدی است. بسیار سبک وزن و قابل حمل Jackery SolarSaga 40W Air به ابزار مورد علاقه من برای دور نگه داشتن تلفن و دستگاه های ضروری من در خارج از شبکه تبدیل شده است. برخلاف پاوربانک‌ها، پنل‌های خورشیدی انرژی را ذخیره نمی‌کنند. آنها نور خورشید را به انرژی قابل استفاده در زمان واقعی تبدیل می کنند. این پنل با وزن کمتر از دو پوند و تا شدن تا جای پای کتاب، به طور خاص برای حمل و نقل ساخته شده است. دارای استاندارد ضدآب مقاوم IP68 است، در دماهای شدید کار می‌کند و دارای پورت‌های شارژ مستقیم USB-A و USB-C است که آن را به همراهی ایده‌آل برای کوله‌پشتی‌ها، کمپینگ‌ها و سازندگان میدانی تبدیل می‌کند که به برق قابل اعتماد بدون وزن اضافی نیاز دارند. چیزی که دوست داشتم وقتی تا شد، حدود 1 اینچ ضخامت دارد، با رد پای یک ورق کاغذ استاندارد. Lauren Allain/Business Insider یک پنل خورشیدی فوق‌العاده قابل حمل با وزن کمتر از دو پوند برخلاف اکثر پنل‌های خورشیدی سفت و سخت و حجیم، Jackery SolarSaga 40W Air از چهار پنل تشکیل شده است که تا اندازه‌ای قابل حمل - به ضخامت حدود 1 اینچ، با ردپای یک ورق کاغذ"}, {"source": "Business Insider", "title": "Saudi Arabia postpones major investment conference as Iran war fallout expands", "link": "https://www.businessinsider.com/saudi-arabia-future-investment-initiative-postponed-2026-10", "summary": "Participants attending the annual Future Investment Initiative (FII) conference in Riyadh are seen here in 2024. Amid the US-Iran War, organizers announced that the 2026 event is postponed. Fayez Nureldine/AFP via Getty Images Saudi Arabia is postponing the \"Future Investment Initiative\" conference, which was set for later this month. The announcement came as fighting has renewed between Iran-backed Houthi rebels and Saudi Arabia. The conference, which was set to return Wall Street titans to Riyadh, will now take place next year. Saudi Arabia has postponed a gathering of Wall Street titans as instability spreads across the Middle East amid the US-Iran War. On Monday, Princess Maha Bint Mishari Al Saud announced that officials were postponing the Future Investment Initiative, which was scheduled for October 26 through the 29th until next year. \"This decision comes from a deep commitment to our partners, members, speakers, and delegates,\" Princess Maha said in a statement. \"Because this is our landmark tenth edition, we want to ensure it delivers the full scale, extraordinary quality, and unforgettable impact that our community has come to expect and truly deserves.\" The postponement comes after a recent attack by Iran-backed Houthi rebels on Riyadh's King Khalid International Airport, which left at least 13 people dead, the Associated Press reported. Before the announcement, CNBC reported that some delegates were prepared to land in Bahrain and then drive around five hours to Riyadh. The conference, which has become a major gathering since its launch in 2017, was set to feature the likes of Goldman Sachs CEO David Solomon, JPMorgan Chase CEO Jamie Dimon, and BlackRock CEO Larry Fink. \"We will announce the new 2027 dates very soon,\" the statement said. Houthi rebels have attacked Saudi Arabia in recent weeks as an informal 2022 truce between the two sides deteriorated amid the US-Iran War. In 2015, Saudi Arabia began a bombing campaign against the rebels after they seized Sanaa, Yemen's capital. Read the original article on Business Insider", "date_str": "2026-10-19T17:50:38+00:00", "hash": "97b1f74570e9a78f", "title_fa": "عربستان سعودی کنفرانس سرمایه گذاری بزرگ را با گسترش پیامدهای جنگ ایران به تعویق انداخت", "summary_fa": "شرکت‌کنندگانی که در کنفرانس سالانه ابتکار سرمایه‌گذاری آینده (FII) در ریاض در سال 2024 شرکت می‌کنند، اینجا در سال 2024 دیده می‌شوند. در بحبوحه جنگ ایالات متحده و ایران، سازمان‌دهندگان اعلام کردند که رویداد 2026 به تعویق افتاده است. فایز نورالدین/ خبرگزاری فرانسه از طریق گتی ایماژ عربستان سعودی کنفرانس \"ابتکار سرمایه گذاری آینده\" را که برای اواخر این ماه تعیین شده بود، به تعویق می اندازد. این اعلام در حالی منتشر شد که درگیری ها بین شورشیان حوثی مورد حمایت ایران و عربستان سعودی از سر گرفته شده است. این کنفرانس که قرار بود غول های وال استریت را به ریاض بازگرداند، اکنون سال آینده برگزار می شود. عربستان سعودی گردهمایی غول های وال استریت را به دلیل گسترش بی ثباتی در خاورمیانه در بحبوحه جنگ ایران و آمریکا به تعویق انداخت. روز دوشنبه، شاهزاده ماها بنت مشاری آل سعود اعلام کرد که مقامات ابتکار سرمایه گذاری آینده را که برای 26 اکتبر تا 29 اکتبر برنامه ریزی شده بود، به سال آینده موکول می کنند. پرنسس ماها در بیانیه ای گفت: \"این تصمیم ناشی از تعهد عمیق به شرکا، اعضا، سخنرانان و نمایندگان ما است.\" \"از آنجایی که این دهمین نسخه برجسته ما است، ما می خواهیم اطمینان حاصل کنیم که مقیاس کامل، کیفیت فوق العاده و تاثیر فراموش نشدنی را ارائه می دهد که جامعه ما انتظارش را داشته و واقعاً سزاوار آن است.\" به گزارش آسوشیتدپرس، این تعویق پس از حمله اخیر شورشیان حوثی مورد حمایت ایران به فرودگاه بین‌المللی ملک خالد ریاض که حداقل 13 کشته برجای گذاشت، صورت می‌گیرد. پیش از اعلام این خبر، CNBC گزارش داد که برخی از نمایندگان آماده فرود در بحرین و پس از آن حدود پنج ساعت رانندگی به سمت ریاض بودند. در این کنفرانس که از زمان راه اندازی آن در سال 2017 به یک گردهمایی بزرگ تبدیل"}, {"source": "Business Insider", "title": "The tech world reacts to the Elizabeth Holmes doc", "link": "https://www.businessinsider.com/tech-world-reactions-elizabeth-holmes-doc-nathan-fielder-2026-10", "summary": "Techies are tuning into the Elizabeth Holmes doc — and they have thoughts. Justin Sullivan/Getty Images The tech world is buzzing with thoughts about the fresh Elizabeth Holmes doc. From \"sympathetic\" to \"uncanny\" to \"innovative\" to \"boring — the film is inspiring huge reactions. If you haven't seen it, don't worry. We're holding the movie spoilers. Elizabeth Holmes is back on the silver screen, and the tech world has has thoughts. Holmes, the disgraced Theranos founder, is the subject of Nathan Fielder and Lance Oppenheim's new documentary, \"You Can See Everything.\" Holmes was convicted of defrauding investors after her blood-testing startup falsely claimed it could run hundreds of diagnostic tests from a small amount of blood. She has consistently denied wrongdoing. Since the film's theatrical release on Friday (it grossed an impressive $15 million in its opening weekend), people who work in and around tech have been sharing their reactions. And don't worry if you haven't seen the film yet: We're keeping it spoiler-free. Holmes' legacy Audiences can't pin down how they feel about the film's central characters. John Loeber, a San Francisco-based investor and the former CEO of Limit, said the film brought him back to a 2019 party when he ran into Holmes and her partner, Billy Evans. \"Double take. She's not in jail?\" he wrote Saturday on X about the encounter. Seeing them on screen was equally \"uncanny.\" \"I have never before seen a movie where I have personally met the leading cast. And I was not prepared for the level of surprise and weirdness in seeing their faces — especially Billy, whom I had not thought about in seven years — on the big screen,\" he wrote. I ran into Elizabeth Holmes and Billy Evans in November 2019 at a party in San Francisco. It was very surprising. Imagine you’re in a group of 50 or so people and then you turn to your left and there she is. Doing the deep husky voice and everything. Double take. She’s not in jail? Triple take. “This is my fiance Billy” — “Hey what’s up” She has a boyfriend? Did he not hear about Theranos? I guess the San Francisco dating market is what it is. I was confused by Billy. Talking to him, and, like, what is he doing here? This is not a tech person? Anyway. I have never before seen a movie where I have personally met the leading cast. And I was not prepared for the level of surprise and weirdness in seeing their faces — especially Billy, whom I had not thought about in seven years — on the big screen, like ", "date_str": "2026-10-19T17:29:32+00:00", "hash": "a65717bae8cf0d0d", "title_fa": "واکنش دنیای فناوری به سند الیزابت هلمز", "summary_fa": "فناوران در حال تنظیم سند الیزابت هلمز هستند - و آنها افکاری دارند. جاستین سالیوان/گتی ایمیجز دنیای فناوری پر از افکاری درباره مستند جدید الیزابت هلمز است. از \"همدلانه\" تا \"غیر معمولی\" تا \"نوآورانه\" تا \"خسته کننده\" - این فیلم واکنش های زیادی را برانگیخته است. اگر آن را ندیده اید، نگران نباشید. ما اسپویل های فیلم را نگه می داریم. الیزابت هولمز به صفحه نقره ای بازگشته است و دنیای فناوری افکاری دارد. هولمز، بنیانگذار شرمنده Theranos، موضوع مستند جدید ناتان فیلدر و لنس اوپنهایم، \"شما می توانید همه چیز را ببینید\" است. هولمز پس از اینکه استارتاپ آزمایش خون او به دروغ ادعا کرد که می تواند صدها آزمایش تشخیصی را از مقدار کمی خون انجام دهد، به دلیل کلاهبرداری از سرمایه گذاران محکوم شد. او به طور مداوم تخلفات را رد کرده است. از زمان اکران این فیلم در سینما در روز جمعه (که در آخر هفته افتتاحیه آن 15 میلیون دلار فروش داشت)، افرادی که در حوزه فناوری و اطراف آن کار می کنند واکنش های خود را به اشتراک گذاشته اند. و اگر هنوز فیلم را ندیده اید نگران نباشید: ما آن را بدون اسپویل نگه می داریم. میراث هولمز تماشاگران نمی توانند احساس خود را نسبت به شخصیت های اصلی فیلم مشخص کنند. جان لوبر، یک سرمایه گذار ساکن سانفرانسیسکو و مدیر عامل سابق لیمیت، گفت که این فیلم زمانی که با هولمز و شریک زندگی اش بیلی ایوانز برخورد کرد، او را به یک مهمانی در سال 2019 بازگرداند. او در زندان نیست؟ او شنبه در X درباره این برخورد نوشت. دیدن آنها روی صفحه نمایش به همان اندازه \"غیرعادی\" بود. من هرگز فیلمی را ندیده بودم که در آن شخصاً با بازیگران اصلی ملاقات کرده باشم. و من برای دیدن چهره‌های آن‌ها - مخصوصاً بیلی، که هفت سال بود به او فکر"}, {"source": "Business Insider", "title": "New York has been losing young families to cheaper suburbs. Now the city is expanding free childcare.", "link": "https://www.businessinsider.com/zohran-mamdani-expands-free-nyc-childcare-program-curb-family-flight-2026-10", "summary": "New York City Mayor Zohran Mamdani announced 10,000 more free 2-K seats. Michael M. Santiago/Getty Images Mayor Zohran Mamdani is expanding NYC's free 2-K program, adding 10,000 more seats across the city. New York's under-five population dropped post-pandemic, spurred by high childcare and housing costs. For parents to comfortably afford childcare in New York, they need to make $300,000. As families flee cities across the country in search of more affordable housing and childcare, New York City is angling to keep its youngest residents. On Monday, Mayor Zohran Mamdani announced that 10,000 more seats under his signature free childcare for two-year-olds program will be covered in fall 2027. Under the expansion, all of the Bronx and Staten Island's school districts will be eligible. \"For far too many New York City families, the joy of welcoming a child comes with a terrifying set of questions: How will I afford child care? Will I need to give up my job? Will I be forced to leave the city I love?\" Mamdani said in a statement. \"Today, for 10,000 more families, we have an answer.\" Those affordability questions loom large for urban parents around the country. Cities including New York have seen their under-five population fall since the onset of the pandemic. Between April 2020 and July 2024, the population of children under five fell by 18% in New York City , per an analysis from the Economic Innovation Group. That population collapsed by 15% in San Francisco, 15% in Chicago's Cook County, and 14% in Los Angeles County over the same period. Lowering childcare costs, a key plank of Mamdani's platform, was one area where even CEOs agreed with the socialist . In New York, families with kids under six were more than twice as likely to leave the city as families without younger children, according to a Fiscal Policy Institute analysis. The share of two-year-olds in New York City's population fell as families fled the city during the pandemic, before rebounding somewhat in 2024 and 2025. For parents still in the city, childcare costs for toddlers in care centers reached $23,400 annually in 2024, per an analysis from the comptroller's office. That means a New York family would have to earn at least $334,000 to pay only 7% of their family income for childcare, the federal definition of affordable. The new 2-K program, which has reportedly faced implementation problems including funding and payment delays , initially targeted a handful of districts based on economic ne", "date_str": "2026-10-19T17:27:35+00:00", "hash": "fbb47a06191f4462", "title_fa": "نیویورک خانواده های جوان را به حومه های ارزان تر از دست داده است. اکنون شهر در حال گسترش مراقبت از کودکان رایگان است.", "summary_fa": "زهران ممدانی، شهردار نیویورک، 10000 صندلی 2-K رایگان دیگر را اعلام کرد. مایکل ام. سانتیاگو/ زهران ممدانی، شهردار گتی ایماژ، در حال گسترش برنامه رایگان 2-K نیویورک است و 10000 صندلی دیگر در سراسر شهر اضافه می کند. جمعیت زیر پنج سال نیویورک پس از شیوع بیماری همه گیر کاهش یافت که به دلیل هزینه های بالای مراقبت از کودکان و مسکن افزایش یافت. برای اینکه والدین بتوانند به راحتی هزینه مراقبت از کودک در نیویورک را بپردازند، باید 300000 دلار درآمد داشته باشند. در حالی که خانواده ها از شهرهای سراسر کشور به دنبال مسکن و مراقبت از کودکان مقرون به صرفه تر فرار می کنند، شهر نیویورک به دنبال حفظ جوان ترین ساکنان خود است. روز دوشنبه، شهردار زهران ممدانی اعلام کرد که 10000 صندلی دیگر تحت برنامه مراقبت از کودکان دو ساله رایگان امضا شده وی در پاییز 2027 تحت پوشش قرار خواهد گرفت. تحت این گسترش، همه مناطق مدارس برونکس و استاتن آیلند واجد شرایط خواهند بود. برای بسیاری از خانواده‌های شهر نیویورک، لذت استقبال از کودک با مجموعه‌ای از سوالات وحشتناک همراه است: چگونه هزینه مراقبت از کودک را بپردازم؟ آیا باید کارم را رها کنم؟ آیا مجبور خواهم شد شهری را که دوست دارم ترک کنم؟ ممدانی در بیانیه ای اعلام کرد. امروز برای 10000 خانواده دیگر پاسخی داریم.» این سؤالات مقرون به صرفه برای والدین شهری در سراسر کشور بزرگ است. شهرهایی از جمله نیویورک از زمان شروع همه‌گیری، شاهد کاهش جمعیت زیر پنج سال خود بوده‌اند. بر اساس تجزیه و تحلیل گروه نوآوری اقتصادی، بین آوریل 2020 و ژوئیه 2024، جمعیت کودکان زیر پنج سال در شهر نیویورک 18 درصد کاهش یافت. این جمعیت در سانفرانسیسکو 15 درصد، در شهرستان کوک شیکاگو 15 درصد و در شهرستان لس آنجلس 14 درصد کاهش یافت. کاهش هزینه‌های مراقبت از کودکان، یکی از بخش‌های کلیدی"}, {"source": "Business Insider", "title": "Netflix cuts film chief Dan Lin after laying off about 1,000 employees", "link": "https://www.businessinsider.com/netflix-film-chief-dan-lin-out-streamer-cuts-1000-2026-10", "summary": "Dan Lin, with Ava DuVernay, is Netflix s latest exec cut. Kate Green/Getty Images for Netflix Netflix's film chief Dan Lin is out after two years. He's the latest top exec to exit following a 6% cut at the streamer, its biggest since 2022. New content chief Peter Rice will oversee film until a successor to Lin is announced. Film head Dan Lin is out at Netflix, the latest exec to be ousted in the wake of the streamer's biggest layoff since 2022 . Lin was hired as film chair in 2024 with a mandate to bring greater cost discipline and variety to Netflix's films, which had focused on big-budget output under his predecessor, Scott Stuber. Lin cut big upfront paychecks to actors, reduced staff, and reorganized his department. He oversaw a slate that included Oscar-winning \"KPop Demon Hunters,\" \"Happy Gilmore 2,\" and \"Frankenstein.\" Lin's exit is the latest big shocker at Netflix. Also out in recent days was chief content officer Bela Bajaria , who was replaced by Hollywood veteran Peter Rice, a former exec at Disney and Fox. Rice will oversee film until a new head is announced, Netflix said in a statement confirming Lin's departure. Last week, Netflix laid off 1,000 employees, or about 6% of global head count. That was the streamer's largest cull since 2022, when the company lost subscribers for the first time in more than a decade. The streaming giant has been hampered by slowing engagement growth and a stock price that has declined more than 40% over the past year. The streamer is contending with the rise of free, ad-supported streaming led by YouTube and the popularity of social video. In recent months, Netflix has turned to podcasters and creators to bulk up its library. Netflix is set to report third-quarter earnings after the bell on Tuesday. Read the original article on Business Insider", "date_str": "2026-10-19T17:21:36+00:00", "hash": "87838469e58110e1", "title_fa": "نتفلیکس پس از اخراج 1000 کارمند، مدیر فیلم دان لین را برکنار کرد", "summary_fa": "دن لین، با آوا دوورنی، آخرین اثر اجرایی نتفلیکس است. کیت گرین/گتی ایماژ برای نتفلیکس، دن لین، مدیر فیلم نتفلیکس، پس از دو سال منتشر شد. او جدیدترین مدیر ارشد اجرایی است که پس از کاهش 6 درصدی استریمر، بزرگترین کاهش از سال 2022، از آن خارج شده است. پیتر رایس، مدیر محتوای جدید، تا زمان معرفی جانشین لین، بر فیلم نظارت خواهد داشت. دن لین، مدیر فیلم، در نتفلیکس حضور دارد، آخرین مدیر اجرایی که در پی بزرگترین اخراج استریمر از سال 2022 برکنار شده است. لین در سال 2024 به عنوان صندلی فیلم استخدام شد تا نظم و انضباط هزینه و تنوع بیشتری را برای فیلم‌های نتفلیکس ایجاد کند، فیلمی که در زمان سلفش، اسکات استابر، بر خروجی‌های بودجه کلان تمرکز داشت. لین حقوق اولیه زیادی را به بازیگران کاهش داد، کارمندان خود را کاهش داد و بخش خود را سازماندهی مجدد کرد. او بر فهرستی نظارت داشت که شامل «شکارچیان شیاطین کی پاپ»، «هپی گیلمور ۲» و «فرانکنشتاین» برنده اسکار بود. خروج لین آخرین شوک بزرگ در نتفلیکس است. همچنین در روزهای اخیر، بلا باجاریا، مدیر ارشد محتوا، پیتر رایس، کهنه کار هالیوود، مدیر اجرایی سابق دیزنی و فاکس، جایگزین او شد. نتفلیکس در بیانیه ای که خروج لین را تایید کرد، گفت رایس تا زمانی که رئیس جدید معرفی نشود، فیلم را نظارت خواهد کرد. هفته گذشته، نتفلیکس 1000 کارمند یا حدود 6 درصد از تعداد کارمندان جهانی را اخراج کرد. این بزرگترین حذف استریمر از سال 2022 بود، زمانی که این شرکت برای اولین بار در بیش از یک دهه مشترکین خود را از دست داد. این غول استریم به دلیل کند شدن رشد تعامل و قیمت سهام که بیش از 40 درصد در سال گذشته کاهش یافته است، با مشکل مواجه شده است. این استریمر با افزایش جریان رایگان و تبلیغاتی که توسط یوتیوب"}, {"source": "Business Insider", "title": "5 details you might have missed at the 2026 Victoria's Secret Fashion Show", "link": "https://www.businessinsider.com/victorias-secret-fashion-show-details-you-missed-2026-10", "summary": "Elsa Hosk walks the 2026 Victoria s Secret Fashion Show runway in Los Angeles. Frazer Harrison/Getty Images There was a lot to see at the Victoria's Secret Fashion Show on Sunday night. Kylie Jenner modeled a $50 million bra that featured no fabric. Adriana Lima, on the other hand, walked her 21st show at 45 years old. Los Angeles lived up to its \"city of angels\" nickname over the weekend. The Victoria's Secret Fashion Show went to the West Coast this year and was hosted at Sony Pictures Studios on Sunday night. Gigi Hadid, Candice Swanepoel, and other iconic models all hit the runway. Of course, there were lots of lingerie and athleisure looks on the red carpet , too. Still, you might not have caught some of the night's best details — like the significance of certain outfits and the celebrities who made surprise appearances. Here's what you might have missed. Kylie Jenner modeled the 2026 Fantasy Bra, which is worth $50 million and features zero fabric. Kylie Jenner walks the 2026 Victoria s Secret Fashion Show in Los Angeles. Dimitrios Kambouris/Getty Images For the first time since 2018, Victoria's Secret sent a Fantasy Bra down the runway at its famed fashion show. It collaborated with jewelers Jacob and Co. to create the one-of-a-kind piece, which took over 1,000 hours and 15 artisans to make. On Instagram, Jacob and Co. said the bra features 4,410 diamonds totaling 1,373 carats. One of those is the brand's 75.54-carat natural Fancy Vivid Yellow diamond, which hangs in the middle of the bra. It's valued at $50 million, which makes it the most expensive Fantasy Bra ever shown on the Victoria's Secret runway. It was also a massive surprise that Jenner, 29, who never previously walked for Victoria's Secret, had the honor of wearing the special piece. It's usually reserved for veteran models of the show. Barbara Palvin walked the runway six weeks postpartum. Barbara Palvin walks the 2026 Victoria s Secret Fashion Show runway in Los Angeles. Gilbert Flores/Variety/Getty Images Palvin walked her fifth Victoria's Secret Fashion Show on Sunday — and it was one of her most impressive appearances. The 33-year-old model delivered her first child, a son, six weeks earlier, as she and her husband Dylan Sprouse announced on Instagram in September. Backstage at the show, Palvin told People that it was \"empowering\" to walk the runway, but also \"not that big of a deal.\" \"I'm going to be six weeks postpartum tomorrow, which I think in the US most people have to go back", "date_str": "2026-10-19T16:37:27+00:00", "hash": "80ebb97f6dede21d", "title_fa": "5 جزئیاتی که ممکن است در فشن شو ویکتوریا سیکرت 2026 از دست داده باشید", "summary_fa": "السا هاسک در باند نمایش مد ویکتوریا سیکرت 2026 در لس آنجلس قدم می زند. Frazer Harrison/Getty Images در نمایش مد ویکتوریا سیکرت یکشنبه شب چیزهای زیادی برای دیدن وجود داشت. کایلی جنر یک سوتین 50 میلیون دلاری را مدل کرد که هیچ پارچه ای نداشت. از طرف دیگر آدریانا لیما بیست و یکمین برنامه خود را در 45 سالگی راه اندازی کرد. لس آنجلس در آخر هفته به لقب \"شهر فرشتگان\" خود ادامه داد. فشن شوی ویکتوریا سیکرت امسال به ساحل غربی رفت و یکشنبه شب در استودیوی سونی پیکچرز میزبانی شد. جیجی حدید، کندیس سوانپول و دیگر مدل‌های نمادین همگی به باند فرود آمدند. البته، لباس های زیر زنانه و لباس های ورزشی زیادی روی فرش قرمز نیز وجود داشت. با این حال، ممکن است برخی از بهترین جزئیات شب را نگرفته باشید - مانند اهمیت برخی لباس‌ها و افراد مشهوری که ظاهر غافلگیرکننده‌ای داشتند. در اینجا چیزی است که ممکن است از دست داده باشید. کایلی جنر مدل سوتین فانتزی 2026 را که 50 میلیون دلار ارزش دارد و دارای پارچه صفر است، طراحی کرده است. کایلی جنر در نمایشگاه مد ویکتوریا سکرت 2026 در لس آنجلس قدم می زند. دیمیتریوس کامبوریس/ گتی ایماژ برای اولین بار از سال 2018، ویکتوریا سیکرت یک سوتین فانتزی را در شوی مد معروف خود به پایین فرود. این شرکت با جواهرسازان Jacob and Co همکاری کرد تا این قطعه منحصر به فرد را ایجاد کند که ساخت آن بیش از 1000 ساعت و 15 صنعتگر به طول انجامید. در اینستاگرام، Jacob and Co. گفت این سوتین دارای 4410 الماس است که مجموعاً 1373 قیراط است. یکی از آنها الماس طبیعی 75.54 قیراطی Fancy Vivid Yellow این برند است که در وسط سوتین آویزان است. ارزش آن 50 میلیون دلار است که آن را به گران ترین سوتین فانتزی در باند"}, {"source": "Business Insider", "title": "Why Barclays says the market's CoreWeave-induced AI panic is overblown", "link": "https://www.businessinsider.com/coreweave-bonds-ai-investing-stocks-bonds-crwv-barclays-2026-10", "summary": "Mike Intrator, CEO and founder of CoreWeave, poses for a photo during the company s IPO in March 2025. Michael M. Santiago/Getty Images CoreWeave stock plunged last week on fears about its debt as yields on its bonds surged. However, Barclays says the panic is overblown and the wider AI trade is likely fine. Analysts made a comparison to SVB, which collapsed in 2023 but did not cause a wider bank crisis. CoreWeave's bond drama isn't a reason to panic about the health of the wider AI trade. That's according to Barclays analysts writing in a note on Monday, adding that even if the neocloud infrastructure provider runs into more trouble, investors don't need to fret about more distress to come. CoreWeave saw its stock plunge last week after the yield on some of its bonds surged to 15% . Yet, Barclays' global research chairman Ajay Rajadhyaksha writes that investors shouldn't be worried, drawing parallels to another major market event that rattled investors, but ultimately proved to be contained in its lasting impact. \"In 2023, markets extrapolated regional bank issues to the US economy,\" he wrote in a note to investors, referring to the troubles that ultimately took down Silicon Valley Bank in the spring of that year. \"It was a mistake. Similarly, investors shouldn't extrapolate recent challenges for CoreWeave debt to a view on the entire AI capex cycle.\" The unexpected collapse of Silicon Valley Bank drummed up fears of a wider banking crisis, with investors concerned about a potential for cascade of bank failures sending shockwaves through the financial system. While spasms in regional bank stocks persisted for weeks, broader fears were ultimately overdone. \"The mistake was in extrapolating from a small, volatile, structurally vulnerable instrument to the entire US economy,\" he said, adding that investors' barometer for stress, the SPDR S P Regional Banking ETF, \"was catastrophically wrong as a signal about what came next.\" Rajadhyaksha added that the same scenario could be unfolding now, with investors fretting over CoreWeave's bonds and rising borrowing costs as companies continue to fund their AI spending with debt . \"CoreWeave's unsecured bonds are a tiny slice of CoreWeave's capital structure,\" he said. \"CoreWeave's capex is a tiny slice of total AI CapEx. And the hyperscalers doing the vast majority of the spending don't finance it the way CoreWeave does.\" Importantly, Rajadhyaksha also argues that the broader trade will likely be fine even if CoreWea", "date_str": "2026-10-19T16:36:15+00:00", "hash": "f158f09559251462", "title_fa": "چرا بارکلیز می گوید وحشت هوش مصنوعی بازار ناشی از CoreWeave بیش از حد است", "summary_fa": "مایک اینتراتور، مدیر عامل و بنیانگذار CoreWeave، در طول عرضه اولیه اولیه شرکت در مارس 2025 عکس می گیرد. Michael M. Santiago/Getty Images سهام CoreWeave هفته گذشته به دلیل ترس از بدهی خود با افزایش بازده اوراق قرضه سقوط کرد. با این حال، بارکلیز می گوید که وحشت بیش از حد است و تجارت گسترده تر هوش مصنوعی احتمالا خوب است. تحلیلگران مقایسه ای با SVB انجام دادند که در سال 2023 سقوط کرد اما باعث بحران بانکی گسترده تری نشد. درام اوراق قرضه CoreWeave دلیلی برای وحشت در مورد سلامت تجارت گسترده تر هوش مصنوعی نیست. تحلیلگران بارکلیز در یادداشتی در روز دوشنبه نوشتند و افزودند که حتی اگر ارائه‌دهنده زیرساخت‌های نئوکلاد با مشکلات بیشتری مواجه شود، سرمایه‌گذاران نیازی به نگرانی در مورد مشکلات آینده ندارند. CoreWeave هفته گذشته پس از اینکه بازدهی برخی از اوراق قرضه خود به 15 درصد رسید، سهام خود را افت کرد. با این حال، آجی راجادیاکشا، رئیس تحقیقات جهانی بارکلیز، می‌نویسد که سرمایه‌گذاران نباید نگران باشند، و شباهت‌هایی را با یکی دیگر از رویدادهای مهم بازار ترسیم می‌کند که سرمایه‌گذاران را به لرزه درآورد، اما در نهایت ثابت شد که تأثیر پایدار آن مهار شده است. او در یادداشتی خطاب به سرمایه گذاران با اشاره به مشکلاتی که در نهایت بانک سیلیکون ولی در بهار همان سال را از بین برد، نوشت: «در سال 2023، بازارها مسائل بانک های منطقه ای را به اقتصاد ایالات متحده تعمیم دادند. \"این یک اشتباه بود. به طور مشابه، سرمایه‌گذاران نباید چالش‌های اخیر برای بدهی CoreWeave را به کل چرخه سرمایه هوش مصنوعی تعبیر کنند.\" سقوط غیرمنتظره بانک سیلیکون ولی ترس از یک بحران بانکی گسترده‌تر را برانگیخت و سرمایه‌گذاران نگران احتمال وقوع هفته‌ها ورشکستگی بانک‌ها بودند که موج‌های شوک‌کننده‌ای را در سیستم مالی به همراه داشت. در نهایت بیش از حد او گفت: «اشتباه در برون"}, {"source": "Business Insider", "title": "This chart shows how junior-level hiring is down at Anthropic due to AI", "link": "https://www.businessinsider.com/anthropic-chart-shows-junior-hiring-down-company-ai-2026-10", "summary": "Anthropic CEO Dario Amodei has become a leading voice on AI s potential to disrupt jobs. Chance Yeh/Getty Images for HubSpot Anthropic said it has been hiring a smaller number of junior technical positions. Entry-level hires in technical departments fell from 27% to 9%, the AI company said. AI agents have spread across the firm to write code, fix bugs, and handle other tasks. Anthropic's own data offers a stark warning for entry-level tech employees in an AI-heavy workplace. The company behind the AI chatbot Claude said in a newly released internal report that it has been hiring for a \"smaller share of junior technical positions\" as AI agents have been deployed across the firm to write code, fix bugs, and handle other tasks. By August, Anthropic said its interactive AI agents were logging six hours of work for every hour a human employee logged. A chart published in the new report titled \"How Employment is Changing at Anthropic\" shows that junior workers made up 27% of hires in technical departments at the company in early 2025. By June of this year, that number had plummeted to 9%. The share of junior-level workers in technical departments had also declined over the same period from 21% to 14%, while open roles for junior positions slid to 6% after topping 20% late last year, the chart shows. Anthropic included this chart in its How Employment is Changing at Anthropic internal report. Anthropic That downward trend was less pronounced in non-technical departments, where hiring of junior workers fell from 31% to 26% over the same timeframe, while their share of head count rose from 23% to 25%. Junior job openings in non-technical departments, meanwhile, dropped from 31% to 13%. Anthropic said the changes came as AI usage inside the company rapidly expanded. \"As AI agents diffused through the company, Anthropic began producing more code per person, closing more sales per rep, and processing more contracts,\" the report said. \"Following the same employee over time, output rose as they adopted new AI tools.\" It added, \"We find that even as the company grows, relative hiring in junior technical positions has slowed. Productivity for both engineers and non-technical employees has leapt up and did so sharply when they adopted coding agents.\" The findings land as Anthropic CEO Dario Amodei has emerged as one of the tech industry's most prominent voices on how AI could disrupt jobs. Amodei has repeatedly said that AI may eliminate up to half of entry-level white-col", "date_str": "2026-10-19T16:14:44+00:00", "hash": "a867fee6d6904205", "title_fa": "این نمودار نشان می دهد که چگونه استخدام در سطح جوان در Anthropic به دلیل هوش مصنوعی کاهش یافته است", "summary_fa": "داریو آمودی، مدیر عامل آنتروپیک، به صدای پیشرو در زمینه پتانسیل هوش مصنوعی برای ایجاد اختلال در مشاغل تبدیل شده است. Chance Yeh/Getty Images برای HubSpot Anthropic گفت که تعداد کمتری از موقعیت‌های فنی جوان را استخدام کرده است. این شرکت هوش مصنوعی اعلام کرد که استخدام های اولیه در بخش های فنی از 27 درصد به 9 درصد کاهش یافته است. عوامل هوش مصنوعی در سراسر شرکت پخش شده اند تا کد بنویسند، اشکالات را برطرف کنند و کارهای دیگر را انجام دهند. داده های خود Anthropic یک هشدار جدی برای کارمندان فناوری سطح ابتدایی در یک محل کار با هوش مصنوعی ارائه می دهد. شرکتی که پشت ربات چت هوش مصنوعی Claude قرار دارد، در یک گزارش داخلی که به تازگی منتشر شده است، گفته است که برای «سهم کمتری از موقعیت‌های فنی پایین‌تر» استخدام می‌کند، زیرا عوامل هوش مصنوعی در سراسر شرکت مستقر شده‌اند تا کد بنویسند، اشکالات را برطرف کنند و کارهای دیگر را انجام دهند. تا ماه آگوست، Anthropic گفت که عوامل هوش مصنوعی تعاملی آن به ازای هر ساعتی که یک کارمند انسانی ثبت می‌کند، شش ساعت کار ثبت می‌کنند. نمودار منتشر شده در گزارش جدید با عنوان \"چگونه اشتغال در آنتروپیک تغییر می کند\" نشان می دهد که کارگران جوان 27٪ از استخدام ها در بخش های فنی در شرکت را در اوایل سال 2025 تشکیل می دادند. تا ژوئن سال جاری، این تعداد به 9٪ کاهش یافته است. این نمودار نشان می‌دهد که سهم کارگران سطح پایین در بخش‌های فنی نیز در مدت مشابه از 21 درصد به 14 درصد کاهش یافته است، در حالی که نقش‌های باز برای پست‌های پایین‌تر پس از بالای 20 درصد در اواخر سال گذشته به 6 درصد کاهش یافته است. آنتروپیک این نمودار را در گزارش داخلی نحوه تغییر اشتغال در آنتروپیک گنجانده است. Anthropic این"}, {"source": "Business Insider", "title": "I'm 55 with no idea where I want to retire. Housesitting is helping me work my way toward an answer.", "link": "https://www.businessinsider.com/dont-know-where-want-to-retire-testing-living-different-places-2026-10", "summary": "I ve spent the last three years living out of suitcases and housesitting from Washington to Mexico, trying to figure out where I want to retire. Amber Campbell At 55, I thought I would have already figured out where I want to retire in the next few years. Instead, I've been living out of suitcases and housesitting in different places to see what I like. I still don't know where I will retire, but I do have a much better idea of what I want — and don't. I always thought I'd be settled somewhere for good by age 55, with a comfortable home, established garden, and chest freezer in the garage. But after growing up in the San Francisco Bay Area, raising my kids in Seattle, and becoming an empty nester , I realized I had no idea where I wanted to settle down. For the first time in more than 20 years, I suddenly had the freedom to choose where I wanted to live. So at 52, I started housesitting in exchange for places to stay so I could travel without depleting my savings. I quickly realized how much I enjoyed the nomadic lifestyle and how this gave me the opportunity to test out places I might eventually want to live in. After a few months, I liked it so much that I gave away almost everything I owned, put the rest in storage, and decided to do it full-time. That was almost three years ago. Since then, I've lived in dozens of cities, towns, and remote islands, from northern Washington to the southeastern coast of Mexico's Baja California peninsula . Housesitting has changed my mind about what I thought I wanted Living in so many different places for several weeks or even months at a time helped me realize that how I want to live is just as important as where I want to live. Amber Campbell I typically stay in each home for two weeks to three months at a time, which allows me to get to know a new place without signing a lease, buying a house, or committing to a community. Instead, I chat with locals, visit the library and grocery store, explore nearby nature trails, and try to imagine what it would be like to live there. I ask myself a lot of questions: Can I tolerate this climate? Do I feel able to connect with this community? Could I live without whatever thing this place might be missing … which is sometimes as simple as my beloved Trader Joe's ? Throughout my stays, I've learned new things about myself and what I really want. For example, I'd long pictured myself settling in a city since I've spent most of my life in major metropolitan areas. So, I was thrilled ", "date_str": "2026-10-19T16:08:01+00:00", "hash": "e50bd82f2a79cb6e", "title_fa": "من 55 ساله هستم و نمی دانم کجا می خواهم بازنشسته شوم. نشستن در خانه به من کمک می‌کند تا به سمت پاسخ حرکت کنم.", "summary_fa": "من سه سال گذشته را از واشنگتن تا مکزیک بیرون از چمدان و خانه نشینی گذراندم و سعی کردم بفهمم کجا می خواهم بازنشسته شوم. امبر کمپبل در سن 55 سالگی، فکر می‌کردم قبلاً متوجه شده بودم که در چند سال آینده کجا می‌خواهم بازنشسته شوم. در عوض، من بیرون از چمدان زندگی کرده ام و در مکان های مختلف خانه نشسته ام تا ببینم چه چیزی را دوست دارم. من هنوز نمی دانم کجا بازنشسته خواهم شد، اما ایده بسیار بهتری از آنچه می خواهم دارم - و ندارم. همیشه فکر می‌کردم تا سن 55 سالگی برای همیشه در جایی مستقر شوم، با خانه‌ای راحت، باغی مستقر، و یخچال فریزر در گاراژ. اما پس از بزرگ شدن در منطقه خلیج سانفرانسیسکو، بزرگ کردن فرزندانم در سیاتل و تبدیل شدن به یک آشیانه خالی، متوجه شدم که نمی‌دانم کجا می‌خواهم ساکن شوم. برای اولین بار در بیش از 20 سال، ناگهان این آزادی را پیدا کردم تا جایی که می خواهم زندگی کنم. بنابراین در سن 52 سالگی، در ازای گرفتن مکان برای اقامت، شروع به نشستن در خانه کردم تا بتوانم بدون اینکه پس اندازم را تمام کنم، سفر کنم. من به سرعت متوجه شدم که چقدر از سبک زندگی عشایری لذت می برم و چگونه این فرصت را به من داد تا مکان هایی را که در نهایت بخواهم در آنها زندگی کنم را آزمایش کنم. بعد از چند ماه، آنقدر از آن خوشم آمد که تقریباً همه چیزهایی را که داشتم، بخشیدم، بقیه را در انبار گذاشتم و تصمیم گرفتم این کار را تمام وقت انجام دهم. این تقریباً سه سال پیش بود. از آن زمان، من در ده‌ها شهر، شهرک، و جزیره دورافتاده، از شمال واشنگتن تا ساحل جنوب شرقی شبه جزیره باجا کالیفرنیا در مکزیک زندگی کرده‌ام. نشستن در خانه نظر من را در مورد"}, {"source": "Business Insider", "title": "4 figures that help explain the affordability crisis behind France's protests", "link": "https://www.businessinsider.com/france-cost-of-living-protests-stats-anger-affordability-2026-10", "summary": "Protesters gather at Monument a la Republique during demonstrations in Paris, France. Bloomberg/Getty Images France's cost-of-living protests descended into violence and looting over the weekend. Hundreds of thousands demonstrated amid growing anger over the cost of living and public services. From soaring energy prices to declining incomes, five figures help explain the unrest. France's growing anger over the cost of living erupted into scenes of looting and violence over the weekend. While most of the hundreds of thousands of people who demonstrated across the country did so peacefully, clashes broke out between police and some protesters, with officers firing tear gas. The unrest began as student protests over worsening school conditions, but has since grown into a broader movement fueled by frustration over the unaffordability of life in France. The financial pressures facing French households are familiar to Americans: surging energy prices , wages struggling to keep pace with inflation, and the difficulty of making ends meet. Here are four numbers that help explain the financial frustrations driving the protests. 1. The poverty rate is at a 30-year high INSEE defines monetary poverty as having a standard of living below 60% of the national median, adjusted for household size. In 2024, that threshold was €1,337 a month for someone living alone. France's monetary poverty rate stood at 15.4% in 2024, its highest level since annual records began in 1996, according to INSEE data published in July. The figures are the latest available because calculating poverty rates requires detailed tax and benefits records, which take time to compile and analyze. That means around 9.8 million people in mainland France were living below the poverty line. 2. Energy prices are up more than 60% since 2015 It's not just Americans who are grappling with rising energy costs. Energy prices in France increased by more than 60% between 2015 and the first half of 2026, according to INSEE. Electricity prices rose 43% over that period, while fuel prices were 31% higher at the end of 2025 than in 2015. As with much of the world, the war in Iran and the Strait of Hormuz crisis sent fuel prices soaring. By April 2026, fuel prices in France were 30% higher than at the end of 2025, per the INSEE report. Rising fuel costs were behind French protests in September, and members of that movement have joined students and trade unions in the riots over the past week. 3. Nearly 3 in 10 French p", "date_str": "2026-10-19T15:55:58+00:00", "hash": "98def0823de5dfb8", "title_fa": "4 رقمی که به توضیح بحران مقرون به صرفه در پس اعتراضات فرانسه کمک می کند", "summary_fa": "در جریان تظاهرات در پاریس، فرانسه، معترضان در بنای یادبود a la Republique تجمع کردند. بلومبرگ/گتی ایماژ تظاهرات هزینه زندگی در فرانسه در آخر هفته به خشونت و غارت منجر شد. صدها هزار نفر در بحبوحه خشم فزاینده نسبت به هزینه های زندگی و خدمات عمومی تظاهرات کردند. از افزایش قیمت انرژی گرفته تا کاهش درآمد، پنج رقم به توضیح این ناآرامی کمک می کند. خشم فزاینده فرانسه نسبت به هزینه های زندگی در آخر هفته به صحنه هایی از غارت و خشونت تبدیل شد. در حالی که اکثر صدها هزار نفری که در سراسر کشور تظاهرات کردند، این تظاهرات را به صورت مسالمت آمیز انجام دادند، درگیری بین پلیس و برخی از معترضان رخ داد و افسران نیز گاز اشک آور پرتاب کردند. این ناآرامی ها با اعتراض دانشجویان به بدتر شدن شرایط مدرسه آغاز شد، اما از آن زمان به جنبش گسترده تری تبدیل شد که ناشی از ناامیدی از مقرون به صرفه بودن زندگی در فرانسه بود. فشارهای مالی که خانوارهای فرانسوی با آن روبه رو هستند برای آمریکایی ها آشنا هستند: افزایش قیمت انرژی، دستمزدها برای همگام شدن با تورم، و دشواری تامین هزینه های زندگی. در اینجا چهار عدد وجود دارد که به توضیح ناامیدی های مالی منجر به اعتراضات کمک می کند. 1. نرخ فقر در بالاترین حد در 30 سال گذشته است INSEE فقر پولی را به عنوان داشتن استاندارد زندگی زیر 60 درصد از میانگین ملی تعریف می کند که بر اساس اندازه خانوار تنظیم شده است. در سال 2024، این آستانه برای فردی که به تنهایی زندگی می کرد، 1337 یورو در ماه بود. طبق داده‌های INSEE که در ژوئیه منتشر شد، نرخ فقر پولی فرانسه در سال 2024 به 15.4 درصد رسید که بالاترین سطح از زمان شروع رکوردهای سالانه در سال 1996 است. این ارقام جدیدترین ارقام موجود هستند"}, {"source": "Lifehacker", "title": "How to Lock Your Phone Number Against eSIM Hijacking on Verizon, T-Mobile, and AT&T", "link": "https://lifehacker.com/tech/how-to-lock-your-phone-number-against-sim-swaps-and-esim-hijacking?utm_medium=RSS", "summary": "Your phone number is the skeleton key to your digital life, and carriers have spent years handing out copies to anyone with a decent script. Resetting a bank password, recovering an email account, approving a crypto withdrawal: All of it can run through a text message sent to a number that a call-center rep can reassign in minutes. The good news is that all three major U.S. carriers now let you lock your number with a toggle. Here's how the attacks work and where to find each switch. How SIM swaps and eSIM hijacking work A SIM swap starts with research. Attackers collect your name, address, and account details from data breaches or phishing, then contact your carrier pretending to be you. If they convince someone to move your number onto a SIM they control, your calls, texts, and two-factor codes go to them instead. A close cousin is port-out fraud, where the attacker opens an account with a different carrier and arranges for your number to be transferred there. The scale is hard to pin down, but the FBI's Internet Crime Complaint Center logged 982 SIM swap complaints and about $26 million in losses in 2024 , down from 2,026 complaints and $72.7 million in 2022. That decline looks encouraging, but the figures only include crimes that victims bothered to report to one federal portal. eSIMs removed the plastic card, not the weak link. Researchers at the Russian firm F.A.C.C.T. found that attackers now break into a victim's carrier account with stolen or leaked credentials, generate a QR code, and scan it on their own device. Your legitimate SIM is deactivated at the same moment. There's no store visit and no phone call to a rep. Intel 471 also flagged a provider that let the activation code go to email instead of SMS , which gave attackers a second inbox to compromise. That provider has since closed the loophole, but the lesson stands: Every shortcut for locked-out customers is also a shortcut for criminals. What SIM locks and port-out PINs actually do Carriers now offer three overlapping defenses. A SIM lock blocks SIM or eSIM changes and device upgrades; a port-out lock stops your number from moving to another carrier; and a PIN adds a password check when you contact customer service or request a transfer. I'd treat the PIN as the weakest of the three. PINs aren t bulletproof because company reps can still override them. A lock that grays out the option entirely is much harder to talk your way around. In its 2023 order, the FCC instructed wireless provider", "date_str": "2026-10-20T14:00:25+00:00", "hash": "e09aa59183121926", "title_fa": "نحوه قفل کردن شماره تلفن خود در برابر سرقت eSIM در Verizon، T-Mobile، و AT&T", "summary_fa": "شماره تلفن شما کلید اصلی زندگی دیجیتالی شماست، و اپراتورها سال‌ها وقت صرف کرده‌اند تا نسخه‌های آن را در اختیار هرکسی که فیلمنامه مناسبی داشته باشد، ارائه دهند. بازنشانی رمز عبور بانکی، بازیابی یک حساب ایمیل، تأیید برداشت رمزارز: همه این موارد می‌تواند از طریق یک پیام متنی ارسال شده به شماره‌ای انجام شود که یک نماینده مرکز تماس می‌تواند در عرض چند دقیقه دوباره آن را اختصاص دهد. خبر خوب این است که هر سه اپراتور بزرگ ایالات متحده اکنون به شما اجازه می دهند شماره خود را با یک کلید قفل کنید. در اینجا نحوه عملکرد حملات و مکان یافتن هر سوئیچ آورده شده است. تعویض سیم‌کارت‌ها و ربودن سیم‌کارت‌های الکترونیکی چگونه کار می‌کنند تعویض سیم‌کارت با تحقیق شروع می‌شود. مهاجمان نام، آدرس و جزئیات حساب شما را از نقض داده‌ها یا فیشینگ جمع‌آوری می‌کنند، سپس با شرکت مخابراتی‌تان تماس می‌گیرند و وانمود می‌کنند که شما هستید. اگر کسی را متقاعد کنند که شماره شما را روی سیم‌کارتی که کنترل می‌کند منتقل کند، تماس‌ها، پیامک‌ها و کدهای دوعاملی شما به‌جای آن به او ارسال می‌شود. یک پسر عموی نزدیک کلاهبرداری پورت-out است، جایی که مهاجم یک حساب کاربری با یک اپراتور دیگر باز می کند و ترتیبی می دهد که شماره شما به آنجا منتقل شود. تعیین این مقیاس دشوار است، اما مرکز شکایات جرایم اینترنتی FBI 982 شکایت تعویض سیم‌کارت و حدود 26 میلیون دلار ضرر در سال 2024 ثبت کرده است که نسبت به 2026 شکایت و 72.7 میلیون دلار در سال 2022 کاهش یافته است. سیم‌کارت‌های الکترونیکی کارت پلاستیکی را حذف کردند، نه پیوند ضعیف. محققان شرکت روسی F.A.C.C.T. متوجه شد که مهاجمان اکنون با اطلاعات سرقت شده یا لو رفته به حساب حامل قربانی نفوذ می کنند، یک کد QR تولید می کنند و آن را در دستگاه خود اسکن می کنند. سیم کارت"}, {"source": "Lifehacker", "title": "This 55-Inch LG OLED TV Is $400 Off Right Now", "link": "https://lifehacker.com/tech/55-inch-lg-oled-tv-sale-october-2026?utm_medium=RSS", "summary": "We may earn a commission from links on this page. Deal pricing and availability subject to change after time of publication. LG s OLED TVs are widely hailed as some of the top-rated on the market, and while their price tags can climb with the fancier models, critics and reviewers agree that one of the brand s most popular, best-performing OLEDs is the LG OLED Evo C6 . The 55-inch model is down to a lowest-ever price of $999.99 (originally $1,399.99), saving shoppers $400 on the impressive TV. The deal also comes with 90 free days of Amazon Music, upping the value even more. LG 55 inch Class LG OLED Evo $999.99 at Amazon $1,399.99 Save $400.00 Get Deal Get Deal $999.99 at Amazon $1,399.99 Save $400.00 Brighter than its predecessor, the OLED evo C5 has a peak brightness of 1,522 nits with a 10% white field, according to PCMag . The outlet praises its gorgeous picture quality, excellent contrast, and well-balanced colors. It has perfect black levels with no light bloom and uses LG s webOS smart TV platform , like most current LG TVs. It s also strengthened by features like AI dialogue enhancement, which helps improve the internal 2.2-channel audio system. It has a native 120Hz refresh rate, with VRR up to 165Hz, and supports AMD FreeSync Premium and Nvidia G-Sync, making it a solid choice for gamers. It also has an input l
