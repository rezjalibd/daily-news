<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مجله خبری روزانه — ۳ آذر ۱۴۰۵</title>
  <style>
    @font-face {
      font-family: 'Dastkhat';
      src: url('../fonts/DastkhatFaNum-Variable.woff2') format('woff2-variations');
      font-weight: 100 900;
      font-display: swap;
    }
    @font-face {
      font-family: 'Dastkhat';
      src: url('../fonts/DastkhatFaNum-Regular.woff2') format('woff2');
      font-weight: 400;
      font-display: swap;
    }
    @font-face {
      font-family: 'Dastkhat';
      src: url('../fonts/DastkhatFaNum-Bold.woff2') format('woff2');
      font-weight: 700;
      font-display: swap;
    }
  </style>
  <style>
    :root[data-theme="dark"] {
      --bg: #0b0f19;
      --header-bg: linear-gradient(135deg, #1e293b, #0f172a);
      --card-bg: #151d30;
      --card-border: #232f48;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --primary: #38bdf8;
      --primary-hover: #0284c7;
      --badge-bg: rgba(56, 189, 248, 0.15);
      --tab-bg: #151d30;
      --tab-border: #232f48;
      --tab-text: #94a3b8;
      --tab-active-bg: #38bdf8;
      --tab-active-text: #0f172a;
      --search-bg: #151d30;
      --search-border: #232f48;
      --toggle-bg: #1e293b;
      --toggle-border: #334155;
      --modal-bg: #151d30;
      --modal-border: #334155;
      --read-bg: #0d1322;
      --read-border: #1e293b;
      --success: #10b981;
    }
    :root[data-theme="light"] {
      --bg: #f8fafc;
      --header-bg: linear-gradient(135deg, #ffffff, #f1f5f9);
      --card-bg: #ffffff;
      --card-border: #e2e8f0;
      --text: #0f172a;
      --text-muted: #64748b;
      --primary: #0284c7;
      --primary-hover: #0369a1;
      --badge-bg: rgba(2, 132, 199, 0.1);
      --tab-bg: #ffffff;
      --tab-border: #e2e8f0;
      --tab-text: #64748b;
      --tab-active-bg: #0284c7;
      --tab-active-text: #ffffff;
      --search-bg: #ffffff;
      --search-border: #cbd5e1;
      --toggle-bg: #f1f5f9;
      --toggle-border: #cbd5e1;
      --modal-bg: #ffffff;
      --modal-border: #cbd5e1;
      --read-bg: #f1f5f9;
      --read-border: #e2e8f0;
      --success: #059669;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Dastkhat', -apple-system, BlinkMacSystemFont, Tahoma, sans-serif;
    }
    body {
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.8;
      padding: 20px 12px;
      direction: rtl;
      transition: background-color 0.3s ease, color 0.3s ease;
    }
    .container {
      max-width: 880px;
      margin: 0 auto;
    }
    header {
      background: var(--header-bg);
      border: 1px solid var(--card-border);
      border-radius: 18px;
      padding: 22px 20px;
      margin-bottom: 20px;
      position: relative;
      text-align: center;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
      transition: all 0.3s ease;
    }
    .header-actions {
      position: absolute;
      top: 18px;
      left: 18px;
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .btn-action {
      background: var(--toggle-bg);
      border: 1px solid var(--toggle-border);
      color: var(--text);
      padding: 7px 12px;
      border-radius: 12px;
      cursor: pointer;
      font-size: 0.85rem;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-weight: 600;
      transition: all 0.2s ease;
    }
    .btn-action:hover {
      border-color: var(--primary);
    }
    h1 {
      font-size: 1.7rem;
      font-weight: 800;
      margin-bottom: 6px;
    }
    .meta-bar {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin-top: 12px;
      font-size: 0.85rem;
      color: var(--text-muted);
    }
    .meta-tag {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      padding: 4px 12px;
      border-radius: 9999px;
    }
    .search-box {
      margin-bottom: 18px;
    }
    .search-input {
      width: 100%;
      padding: 13px 18px;
      border-radius: 12px;
      background: var(--search-bg);
      border: 1px solid var(--search-border);
      color: var(--text);
      font-size: 0.95rem;
      outline: none;
      transition: all 0.2s ease;
    }
    .search-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2);
    }
    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      padding-bottom: 4px;
    }
    .tabs::-webkit-scrollbar {
      display: none;
    }
    .tab-btn {
      flex: 1;
      white-space: nowrap;
      padding: 12px 14px;
      border-radius: 12px;
      background: var(--tab-bg);
      border: 1px solid var(--tab-border);
      color: var(--tab-text);
      font-size: 0.92rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s ease;
      flex-shrink: 0;
    }
    .tab-btn.active {
      background: var(--tab-active-bg);
      color: var(--tab-active-text);
      border-color: var(--tab-active-bg);
    }
    .badge {
      background: rgba(0, 0, 0, 0.15);
      padding: 2px 7px;
      border-radius: 9999px;
      font-size: 0.8rem;
    }
    .news-grid {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .news-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 20px;
      transition: all 0.25s ease;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.03);
      position: relative;
    }
    .news-card:hover {
      border-color: var(--primary);
      transform: translateY(-2px);
    }
    .news-card.is-read {
      background: var(--read-bg);
      border-color: var(--read-border);
      opacity: 0.7;
    }
    .news-card.is-read:hover {
      opacity: 0.95;
    }
    .news-header {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 12px;
    }
    .news-num {
      background: var(--badge-bg);
      color: var(--primary);
      font-weight: 700;
      font-size: 0.85rem;
      min-width: 30px;
      height: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      margin-top: 2px;
      flex-shrink: 0;
    }
    .news-card.is-read .news-num {
      background: rgba(16, 185, 129, 0.15);
      color: var(--success);
    }
    .news-title {
      font-size: 1.1rem;
      font-weight: 700;
      line-height: 1.6;
      flex: 1;
    }
    .news-summary {
      font-size: 0.94rem;
      color: var(--text-muted);
      margin-bottom: 14px;
      text-align: justify;
      line-height: 1.75;
    }
    .news-footer {
      display: flex;
      flex-direction: column;
      gap: 10px;
      border-top: 1px solid rgba(128, 128, 128, 0.12);
      padding-top: 12px;
      font-size: 0.85rem;
    }
    .footer-top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
    }
    .meta-group {
      display: inline-flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      font-size: 0.82rem;
    }
    .news-source {
      color: var(--text-muted);
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .news-datetime {
      color: var(--text-muted);
      font-size: 0.78rem;
      background: rgba(148, 163, 184, 0.08);
      padding: 2px 7px;
      border-radius: 6px;
      border: 1px solid rgba(148, 163, 184, 0.15);
    }
    .news-category-badge {
      display: inline-flex;
      align-items: center;
      background: var(--badge-bg);
      color: var(--primary);
      border: 1px solid rgba(56, 189, 248, 0.25);
      border-radius: 6px;
      padding: 2px 8px;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .news-category-badge:hover {
      background: var(--primary);
      color: #0f172a;
      transform: translateY(-1px);
    }
    .footer-tags-row {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
    }
    .news-tag-chip {
      display: inline-flex;
      align-items: center;
      font-size: 0.75rem;
      color: var(--text-muted);
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--card-border);
      padding: 1px 7px;
      border-radius: 5px;
      cursor: pointer;
      transition: all 0.2s ease;
      font-weight: 500;
    }
    .news-tag-chip:hover {
      color: var(--primary);
      border-color: var(--primary);
      background: var(--badge-bg);
      transform: translateY(-1px);
    }
    .footer-bottom-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      border-top: 1px dashed rgba(128, 128, 128, 0.12);
      padding-top: 10px;
      margin-top: 4px;
    }
    .footer-actions-right {
      display: flex;
      align-items: center;
    }
    .footer-actions-left {
      display: flex;
      align-items: center;
      margin-right: auto;
    }
    .btn-mark-read {
      background: transparent;
      border: 1px solid var(--toggle-border);
      color: var(--text-muted);
      padding: 4px 10px;
      border-radius: 8px;
      font-size: 0.8rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-weight: 600;
      transition: all 0.2s ease;
    }
    .btn-mark-read:hover {
      border-color: var(--success);
      color: var(--success);
    }
    .news-card.is-read .btn-mark-read {
      background: rgba(16, 185, 129, 0.15);
      border-color: var(--success);
      color: var(--success);
    }
    .news-link {
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
      transition: color 0.2s ease;
    }
    .news-link:hover {
      text-decoration: underline;
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 16px;
    }
    .modal-overlay.active {
      display: flex;
    }
    .modal-card {
      background: var(--modal-bg);
      border: 1px solid var(--modal-border);
      border-radius: 18px;
      width: 100%;
      max-width: 520px;
      max-height: 80vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
      animation: modalFadeIn 0.2s ease;
    }
    @keyframes modalFadeIn {
      from { transform: scale(0.95); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
    .modal-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--card-border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .modal-title {
      font-size: 1.15rem;
      font-weight: 700;
    }
    .btn-close {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 1.4rem;
      cursor: pointer;
      line-height: 1;
      padding: 4px;
    }
    .btn-close:hover {
      color: var(--text);
    }
    .modal-body {
      padding: 16px 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .archive-item {
      background: var(--bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      text-decoration: none;
      color: var(--text);
      transition: all 0.2s ease;
    }
    .archive-item:hover {
      border-color: var(--primary);
      transform: translateX(-4px);
    }
    .archive-date-fa {
      font-weight: 700;
      font-size: 0.95rem;
    }
    .archive-date-g {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 2px;
    }
    .archive-arrow {
      color: var(--primary);
      font-size: 1.1rem;
    }

    @media (max-width: 640px) {
      header { padding: 18px 14px; padding-top: 56px; }
      .header-actions { top: 12px; left: 12px; width: calc(100% - 24px); justify-content: space-between; }
      .btn-action { font-size: 0.78rem; padding: 6px 9px; }
      h1 { font-size: 1.35rem; }
      .tabs { gap: 6px; }
      .tab-btn { padding: 10px 10px; font-size: 0.84rem; gap: 6px; }
      .badge { padding: 1px 5px; font-size: 0.75rem; }
      .news-card { padding: 16px; }
      .news-title { font-size: 0.98rem; }
      .news-summary { font-size: 0.88rem; }
      .news-footer { flex-direction: column; align-items: stretch; gap: 10px; }
      .footer-bottom-row { width: 100%; display: flex; justify-content: space-between; align-items: center; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="header-actions">
        <button class="btn-action" id="themeBtn" onclick="toggleTheme()">
          <span id="themeIcon">☀️</span>
          <span id="themeText">حالت روشن</span>
        </button>
        <button class="btn-action" onclick="toggleArchiveModal(true)">
          <span>📚</span>
          <span>آرشیو شماره‌ها</span>
        </button>
      </div>

      <h1>📰 مجله خبری روزانه</h1>
      <div class="meta-bar">
        <span class="meta-tag">📅 ۳ آذر ۱۴۰۵</span>
        <span class="meta-tag">🌍 ۲۴ November ۲۰۲۶</span>
        <span class="meta-tag">⏰ ساعت انتشار: ۲۲:۲۰</span>
      </div>
    </header>

    <div class="search-box">
      <input type="text" id="searchInput" class="search-input" placeholder="🔍 جست‌وجو در تمام اخبار امروز...">
    </div>

    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab('persian', this)">
        🇮🇷 عمومی
        <span class="badge" id="badge-persian">۶۲</span>
      </button>
      <button class="tab-btn" onclick="switchTab('tech', this)">
        🤖 تکنولوژی
        <span class="badge" id="badge-tech">۱۲۰</span>
      </button>
      <button class="tab-btn" onclick="switchTab('media', this)">
        🎬 مدیا
        <span class="badge" id="badge-media">۱۲۶</span>
      </button>
    </div>

    <main id="newsContainer" class="news-grid"></main>
  </div>

  <div class="modal-overlay" id="archiveModal" onclick="if(event.target===this) toggleArchiveModal(false)">
    <div class="modal-card">
      <div class="modal-header">
        <div class="modal-title">📚 آرشیو شماره‌های قبلی مجله</div>
        <button class="btn-close" onclick="toggleArchiveModal(false)">&times;</button>
      </div>
      <div class="modal-body" id="archiveListContainer"></div>
    </div>
  </div>

mary_fa": "در ادامه موج بازداشت شهروندان در آبدانان استان ایلام، سروش گیلانی و شایان مردانی نیز توسط نیروهای حکومتی بازداشت و به مکان نامعلومی منتق ... بر اساس گزارش سازمان حقوق بشری هه‌نگاو، سروش گیلانی، شهروند اهل آبدانان، شامگاه شنبه ۳۰ آبان ۱۴۰۵، در پی اعتراضات مردمی این شهر، بدون ارائه حکم قضایی توسط نیروهای اداره اطلاعات بازداشت شد. همچنین شایان مردانی، دیگر شهروند اهل آبدانان، شامگاه جمعه ۲۹ آبان، با توسل به خشونت توسط نیروهای حکومتی بازداشت و به مکان نامعلومی منتقل شد. به گفته منابع مطلع، تاکنون اطلاعاتی درباره دلایل بازداشت، اتهامات مطرح‌شده و محل نگهداری این دو شهروند در دست نیست و پیگیری‌های خانواده‌های آنها برای اطلاع از سرنوشت فرزندانشان بی‌نتیجه مانده است. بر اساس آمار هه‌نگاو، با احتساب این دو مورد، طی هفته اخیر دست‌کم ۱۷ شهروند کورد در آبدانان توسط نهادهای حکومتی بازداشت شده‌اند. در این بخش ایران وایر می‌توانید با مسوولان تماس بگیرید و کارزار خود را برای مشکلات مختلف راه‌اندازی کنید با ایران‌وایر همکاری کنید ویدیوها و مطالب خود را برای ما بفرستید", "image_url": "https://static.prod.iranwire.com/_versions_jpeg/articleslide/Gemini_Generated_Image_ar32taar32taar32_raEc__v1024x512__box_0%2C427%2C1856%2C1404.jpeg", "category": "اقتصاد و بازرگانی", "tags": ["رویداد", "گزارش"], "datetime_fa": "۲ آذر • ۲۰:۳۵"}, {"source": "BBC Persian", "title": "موج جدید مسمومیت الکلی در ایران؛ دستکم هشت نفر جان باختند", "link": "https://www.bbc.com/persian/articles/c5evr41ermp2o?at_medium=RSS&at_campaign=rss", "summary": "موج جدید مسمومیت الکلی در ایران از نیشابور و شیراز حالا به هرمزگان رسیده است و تاکنون دستکم هشت نفر جان باخته و ده‌ها نفر بستری شده‌اند که جال تعدادی از آن‌ها وخیم گزارش شده است.", "date_str": "2026-11-23T17:21:35+00:00", "hash": "c1deca23f1ef4b7c", "title_fa": "موج جدید مسمومیت الکلی در ایران؛ دستکم هشت نفر جان باختند", "summary_fa": "موج جدید مسمومیت الکلی در ایران از نیشابور و شیراز حالا به هرمزگان رسیده است و تاکنون دستکم هشت نفر جان باخته و ده‌ها نفر بستری شده‌اند که جال تعدادی از آن‌ها وخیم گزارش شده است. به گفته مدیر روابط عمومی دانشگاه علوم پزشکی و نویسنده ۶۰ مقاله علمی و دو کتاب دانشگاهی، حدود شش ماه است ... پایگاه خبری امتداد، روز دوم آذر ۱۴۰۵، در گزارشی به نقل از صابر مبارکی، برادر کژال مبارکی، نوشت این زوج سوم تیر ۱۴۰۵ در ارومیه و مقابل چشمان دو فرزند ۹ و ۱۳ ساله خود بازداشت شدند. پرونده آنها اکنون در شعبه دوم دادگاه انقلاب ارومیه در جریان است. به گفته برادر کژال مبارکی، این زوج که در حوزه بهداشت و سلامت فعالیت داشتند و در دوران کرونا نیز خدمت کرده بودند، سال‌ها برای تحصیل و پژوهش تلاش کرده‌اند و در آستانه تکمیل تحصیلات و پژوهش‌های دکتری خود بودند. صابر مبارکی گفته است اتهامات مطرح‌شده علیه این زوج به پیگیری وضعیت برادر کژال مبارکی بازمی‌گردد که به گفته او، در سال ۱۳۹۷ به یکی از گروه‌ها پیوسته بود. او تاکید کرده که خواهر و همسر خواهرش این اتهامات را قبول ندارند و خانواده نیز بر اساس شناخت خود از آنها، چنین اتهاماتی را باور نمی‌کند. بر اساس این گزارش، اتهامات انتسابی به این زوج شامل عضویت در گروه باغی، موضوع ماده ۲۸۸ قانون مجازات اسلامی، و اقدام عملیاتی به سود اسراییل یا دولت‌های متخاصم، همچنین هرگونه مساعدت مستقیم یا غیرمستقیم امنیتی، نظامی، اقتصادی، مالی یا فناورانه به منظور تقویت یا مشروعیت‌بخشی به اسراییل، موضوع مواد یک و دو قانون تشدید مجازات جاسوسی است. سیداد شیرزاد، وکیل این زوج، با انتقاد از کیفرخواست صادرشده، گفته است اتهامات بدون تفکیک روشن رفتار هر یک از متهمان، تبیین دقیق اقدامات منتسب و ارائه شواهد مشخص مطرح شده‌اند و همین موضوع دفاع موثر را دشوار می‌کند. به گفته این وکیل، برخی از اتهامات مطرح‌شده از نظر ماهیت رفتار و شرایط قانونی تحقق، به‌سادگی قابل جمع نیستند و اقدامات منتسب به متهمان نیز به شکل روشن و مستند", "image_url": "https://static.prod.iranwire.com/_versions_jpeg/articleslide/%DB%B5%DB%B5%DB%B5_RfEg__v1024x512__box_0%2C37%2C1200%2C667.jpeg", "category": "امنیت سایبری و شبکه", "tags": ["رویداد", "گزارش"], "datetime_fa": "۲ آذر • ۲۰:۰۸"}, {"source": "Euronews Persian", "title": "هجوم بی‌سابقه مهاجران به جزایر قناری؛ رکورد ماهانه با ورود ۱۰ هزار نفر شکسته شد", "link": "https://parsi.euronews.com/2026/11/23/canary-islands-10000-migrants-november-el-hierro-reception-capacity", "summary": عدالت و صلح از طریق حساب‌دهی» اعلام شده است. خوزه مانوئل آلبارس وزیر خارجه اسپانیا و میزبان اصلی این نشست در سخنرانی اش گفت که پنج سال پس از حاکمیت دوباره طالبان « وضعیت زنان در این کشور همچنان یکی از جدی‌ترین بحران‌های حقوق بشری این دوره است و افغانستان به آشکارترین نمونه‌ای نقض حقوق زنان و حقوق بشر مبدل شده است.» خوزه مانوئل آلبارس، وزیر خارجه اسپانیا، در سخنانی گفت که کشورش هیچگاه طالبان را به رسمیت نخواهد شناخت. آقای آلبارس این اظهارات را در نشست که دربخصوص وضعیت زنان در افغانستان در مادرید، پایتخت اسپانیا، برگزار شده بود اظهار کرد. در این نشست با میزبانی وزارت خارجه اسپانیا حدود ۷۰ فعال حقوق زن، نمایندگان جامعهٔ مدنی، دیپلمات‌ها و هیئتی از ملل متحد حضور دارند. او وضعیت زنان و دختران افغانستان را نمادی از «آپارتاید جنسیتی» توصیف کرد و گفت هیچ کشوری با حذف نیمی از جمعیت‌اش، نمی‌تواند آینده‌اش را بسازد. دیپلمات ارشد اسپانیا همچنین گفت که در پنج سال گذشته دنیا شاهد «تبعیض و خشونت» در برابر زنان و دختران افغانستان بوده، زنان و دخترانی که به گفته او از درس، کار، حضور سیاسی و آزادی در گشت و گذار و آزادی بیان محروم شده‌اند. آقای آلبارس گفت: «با نشست امروز می‌خواهیم [به طالبان] بگوییم که شما موفق نشده‌اید. زنان و دختران افغان با صدا، حضور و وقت‌شان در اینجا حضور دارند.» وزیر خارجه اسپانیا تأکید کرد که «ما طالبان را به رسمیت نمی‌شناسیم و نخواهیم شناخت.» و افزود که « ما هرگز نمی‌توانیم حقوق زنان را به عنوان عامل چانه‌زنی برای منافع سیاسی، اقتصادی و مهاجرتی بپذیریم.» فوزیه کوفی رئیس نهاد موسوم به «زنان برای افغانستان» و یکی از برگزارکنندگان", "image_url": "https://ichef.bbci.co.uk/news/1200/branded_persian/0dbd/live/465817c0-e759-11f1-b407-33329b1ec67a.jpg", "category": "هوش مصنوعی مولد", "tags": ["عامل‌های هوشمند"], "datetime_fa": "۲ آذر • ۱۹:۵۴"}, {"source": "BBC Persian", "title": "آکسفام: حملات اسرائیل غزه را به «سرزمینی آلوده و غیرقابل زیست» تبدیل کرده است", "link": "https://www.bbc.com/persian/articles/cqglre1g71n7o?at_medium=RSS&at_campaign=rss", "summary": "این گزارش می‌گوید در نتیجه اقدامات اسرائیل، در تقریبا سراسر غزه نشانه‌هایی از آلودگی احتمالی زیست‌محیطی مشاهده می‌شود.", "date_str": "2026-11-23T16:10:23+00:00", "hash": "63e6620089f5b202", "title_fa": "آکسفام: حملات اسرائیل غزه را به «سرزمینی آلوده و غیرقابل زیست» تبدیل کرده است", "summary_fa": "این گزارش می‌گوید در نتیجه اقدامات اسرائیل، در تقریبا سراسر غزه نشانه‌هایی از آلودگی احتمالی زیست‌محیطی مشاهده می‌شود. گزارشی تازه از سازمان غیرانتفاعی آکسفام می‌گوید غزه به «سرزمینی آلوده و غیرقابل زیست» تبدیل شده است و بیش از ۹۹ درصد زمین‌های فلسطینیان، نشانه‌هایی از آلودگی زیست‌محیطی ناشی از حملات نظامی اسرائیل را در خود دارد. این گزارش می‌گوید فلزات سنگین، بقایای مواد منفجره، آزبست برجای‌مانده از ساختمان‌های ویران‌شده، دیوکسین‌ها و آلودگی‌های زیستی موجود در هوا، خاک و منابع آب، اکنون فلسطینی‌ها را تهدید می‌کنند و ممکن است این تهدید دهه‌ها ادامه داشته باشد. آمیتاب بهار، مدیر اجرایی آکسفام اینترنشنال، اسرائیل را متهم می‌کند که در چارچوب «نسل‌کشیِ در حال وقوع در غزه»، مرتکب «جنایت‌های جنگی زیست‌محیطی» شده است. او می‌گوید: «ویرانی و آلودگی غزه به‌شکلی بنیادین شرایط زیست‌محیطی لازم برای امنیت و بقای انسان را از میان برده است.» از دولت اسرائیل خواسته شده است به این گزارش واکنش نشان دهد. اسرائیل در پرونده‌ای که همچنان در دیوان بین‌المللی دادگستری در جریان است، اتهام‌های مربوط به نسل‌کشی را بی‌اساس و تحریف‌شده دانسته و رد کرده است. اسرائیل تاکید می‌کند که عملیات نظامی‌اش در غزه اقدامی برای دفاع از خود در برابر حماس و در واکنش به حمله مرگبار این گروه به اسرائیل در ۷ اکتبر ۲۰۲۳ (۱۵ مهر ۱۴۰۲) است و می‌گوید برای کاهش آسیب به غیرنظامیان اقداماتی انجام می‌دهد. آکسفام و «مرکز پایش منازعه و محیط زیست» مستقر در بریتانیا، با استفاده از تصاویر ماهواره‌ای، سنجش از دور، تحلیل فضایی و دیگر داده‌های متن‌باز به این نتیجه‌گیری‌ها رسیده‌اند. این یافته‌ها در جامع‌ترین گزارش منتشرشده تاکنون درباره پیامدهای شدید زیست‌محیطی ناشی از سه سال جنگ شدید در غزه ارائه شده است. این گزارش شرح می‌دهد که مهمات به‌کاررفته در بمباران گسترده اسرائیل، و همچنین آوار برجای‌مانده از ساختمان‌ها و زیرساخت‌های ویران‌شده، همگی بر محیط زیست تاثیر می‌گذارند.", "image_url": "https://ichef.bbci.co.uk/news/1200/branded_persian/810a/l  بازار سهام روبرو شد. هیئت مدیرۀ «اِنویدیا»، غول فناوری و تراشه‌های پیشرفتۀ هوش مصنوعی، روز دوشنبه دوم آذر جنسن هوانگ را به عنوان رئیس، مدیر عامل و رئیس هیئت مدیره ابقا کرد. در بیانیۀ این شرکت تصریح شده که اعضای هیئت مدیره، یک‌صدا به بازگشت جنسن هوانگ به مدیریت شرکت رأی داده و تأکید کرده‌اند که این اقدام هیچ‌گونه خطری برای امنیت ملی ایجاد نخواهد کرد. این بیانیه در عین حال تأکید می‌کند که کمیته‌ای پیرامون تلاش‌ نهادهای اطلاعاتی خارجی برای هدف قرار دادن جنسن هوانگ تشکیل خواهد داد. اعضای هیئت مدیره افزودند که این شرکت به همکاری با تحقیقات دولتی در این زمینه ادامه خواهد داد. جنسن هوانگ بیش از ۳۰ سال در سمت ریاست این شرکت حضور داشته و نقش بسیار پررنگی در رشد و توسعۀ آن داشته است. با وجود این، آقای هوانگ ماه گذشته در پی افشای رابطۀ خارج از ازدواجش با یک زن بازرگان چینی، که برخی منابع، احتمال جاسوس‌بودنش را مطرح کرده بودند، از سمت‌های مدیریتی‌اش در انویدیا کناره‌گیری کرده بود. مدتی بعد، اما دربارۀ جاسوس‌بودن زنی که با آقای هوانگ رابطۀ عاطفی داشته، تردیدهایی مطرح شد و حتی دونالد ترامپ، رئیس‌جمهور ایالات متحده، هم تأکید کرد که سند و مدرکی، حاکی از جاسوسی او ندیده است. دونالد ترامپ در آستانۀ سفر هفتۀ گذشتۀ خود به شنژن برای شرکت در نشست «آسیا-پاسیفیک» در پاسخ به خبرنگاران در ارتباط با این موضوع، برخی رسانه‌ها را متهم کرد که «هر زن زیبای چینی را که وارد آمریکا می‌شود، جاسوس می‌خوانند». رئیس‌جمهور ایالات متحده امروز هم با انتشار مطلبی در شبکۀ اجتماعی خود، «تروث سوشال»، ضمن حمایت از تصمیم هیئت مدیرۀ انویدیا، نوشت دادستانی کل این کشور", "image_url": "https://gdb.rferl.org/157D7E92-11D3-4485-8E13-764355F39B4C.jpg", "category": "هوش مصنوعی مولد", "tags": ["هوش مصنوعی", "Nvidia", "امنیت سایبری", "تراشه"], "datetime_fa": "۲ آذر • ۱۸:۲۱"}, {"source": "IranWire", "title": "بیان صالحیان، پزشک ساکن ارومیه، به یک سال زندان محکوم شد", "link": "https://iranwire.com/fa/news-1/160648-%D8%A8%DB%8C%D8%A7%D9%86-%D8%B5%D8%A7%D9%84%D8%AD%DB%8C%D8%A7%D9%86-%D9%BE%D8%B2%D8%B4%DA%A9-%D8%B3%D8%A7%DA%A9%D9%86-%D8%A7%D8%B1%D9%88%D9%85%DB%8C%D9%87-%D8%A8%D9%87-%DB%8C%DA%A9-%D8%B3%D8%A7%D9%84-%D8%B2%D9%86% ه سمت مدیرعامل و رئیس این شرکت بازگرداند. بر اساس بیانیه‌ای که در وب‌سایت انویدیا منتشر شده است، هیئت‌مدیره به اتفاق آرا به بازگرداندن جنسن هوانگ رأی داد. در این بیانیه آمده است: «هیئت‌مدیره بر این باور است که جنسن فرد مناسبی برای رهبری انویدیاست و بازگشت او به این سمت، به نفع سهامداران، کارکنان، شرکا و مشتریان ماست.» انویدیا، شرکت تولیدکننده تراشه‌های هوش مصنوعی، کمتر از دو هفته پس از آنکه جنسن هوانگ، مدیرعامل این شرکت به دلیل گزارش‌هایی مبنی بر رابطه با یک زن مظنون به جاسوسی برای چین مجبور به استعفا شد، او را به سمت خود بازگرداند. آقای هوانگ گفت که از بازگشت به سمت خود مفتخر است. انویدیا از سوی دونالد ترامپ تحت فشار قرار گرفته بود تا او را به سمت خود بازگرداند و رئیس‌جمهور آمریکا پس از انتشار این خبر از تصمیم هیئت مدیره تمجید کرد. ارزش سهام این غول فناوری که پس از استعفای جنسن هوانگ صدها میلیارد دلار کاهش یافته بود، پس از انتصاب مجدد او، با باز شدن بازارها به شدت افزایش یافت. آقای هوانگ که در پی جنجال‌های مربوط به رابطه‌اش با یک زن مشکوک به جاسوسی برای چین از مدیرعاملی انویدیا کنار رفته بود، با انتشار بیانیه‌ای از این تصمیم اسنتقبال کرد: «مفتخرم که به انویدیا بازمی‌گردم تا در آغاز یک انقلاب صنعتی جدید، هدایت یکی از تأثیرگذارترین شرکت‌های فناوری در جهان را بر عهده بگیرم. من این مسئولیت را با نهایت فروتنی و تعهدی تازه می‌پذیرم.» جنسن هوانگ ۶۳ ساله اوایل ماه جاری میلادی، پس از اعتراف به داشتن رابطه با زنی که گفته می‌شود جاسوس چین بوده، از سمت خود کناره‌گیری کرد؛ او همچنین به داشتن رابطه با یکی از مدیران شرکت انویدیا متهم شده بود. گزیده‌ای از مهم‌ترین خبرها، گزارش‌های میدانی و گفت‌وگوهای اختصاصی را هر هفته در ایمیل خود", "image_url": "https://ichef.bbci.co.uk/news/1200/branded_persian/c6a2/live/0569ef50-e74e-11f1-99b6-a35a62fa4264.jpg", "category": "هوش مصنوعی مولد", "tags": ["هوش مصنوعی", "Nvidia", "تراشه", "بورس و طلا"], "datetime_fa": "۲ آذر • ۱۸:۴۳"}, {"source": "Euronews Persian", "title": "مدیرعامل «بولت»: اروپا در ربات‌تاکسی و بورس از رقبا عقب مانده است", "link": "https://parsi.euronews.com/2026/11/23/robotaxis-and-stock-exchanges-why-bolts-ceo-says-europe-is-w  و تراشه‌های پیشرفتۀ هوش مصنوعی، روز دوشنبه دوم آذر جنسن هوانگ را به عنوان رئیس، مدیر عامل و رئیس هیئت مدیره ابقا کرد. در بیانیۀ این شرکت تصریح شده که اعضای هیئت مدیره، یک‌صدا به بازگشت جنسن هوانگ به مدیریت شرکت رأی داده و تأکید کرده‌اند که این اقدام هیچ‌گونه خطری برای امنیت ملی ایجاد نخواهد کرد. این بیانیه در عین حال تأکید می‌کند که کمیته‌ای پیرامون تلاش‌ نهادهای اطلاعاتی خارجی برای هدف قرار دادن جنسن هوانگ تشکیل خواهد داد. اعضای هیئت مدیره افزودند که این شرکت به همکاری با تحقیقات دولتی در این زمینه ادامه خواهد داد. جنسن هوانگ بیش از ۳۰ سال در سمت ریاست این شرکت حضور داشته و نقش بسیار پررنگی در رشد و توسعۀ آن داشته است. با وجود این، آقای هوانگ ماه گذشته در پی افشای رابطۀ خارج از ازدواجش با یک زن بازرگان چینی، که برخی منابع، احتمال جاسوس‌بودنش را مطرح کرده بودند، از سمت‌های مدیریتی‌اش در انویدیا کناره‌گیری کرده بود. مدتی بعد، اما دربارۀ جاسوس‌بودن زنی که با آقای هوانگ رابطۀ عاطفی داشته، تردیدهایی مطرح شد و حتی دونالد ترامپ، رئیس‌جمهور ایالات متحده، هم تأکید کرد که سند و مدرکی، حاکی از جاسوسی او ندیده است. دونالد ترامپ در آستانۀ سفر هفتۀ گذشتۀ خود به شنژن برای شرکت در نشست «آسیا-پاسیفیک» در پاسخ به خبرنگاران در ارتباط با این موضوع، برخی رسانه‌ها را متهم کرد که «هر زن زیبای چینی را که وارد آمریکا می‌شود، جاسوس می‌خوانند». رئیس‌جمهور ایالات متحده امروز هم با انتشار مطلبی در شبکۀ اجتماعی خود، «تروث سوشال»، ضمن حمایت از تصمیم هیئت مدیرۀ انویدیا، نوشت دادستانی کل این کشور", "image_url": "https://gdb.rferl.org/157D7E92-11D3-4485-8E13-764355F39B4C.jpg", "category": "هوش مصنوعی مولد", "tags": ["هوش مصنوعی", "Nvidia", "امنیت سایبری", "تراشه"], "datetime_fa": "۲ آذر • ۱۸:۲۱"}, {"source": "Iran International", "title": "جنسن هوانگ به مدیریت انویدیا بازگشت", "link": "https://www.iranintl.com/202611239734", "summary": "شرکت آمریکایی انویدیا، یکی از بزرگ‌ترین تولیدکنندگان تراشه‌های هوش مصنوعی در جهان، اعلام کرد جنسن هوانگ بار دیگر به‌عنوان مدیرعامل این شرکت منصوب شده است. هوانگ پس از افشای روابط خارج از ازدواج خود، از جمله رابطه با فردی مظنون به جاسوسی برای چین، از سمتش استعفا داد ", "summary_fa": "هیئت‌‌مدیره انویدیا، جنسن هوانگ را به سمت مدیرعامل و رئیس این شرکت بازگرداند. بر اساس بیانیه‌ای که در وب‌سایت انویدیا منتشر شده است، هیئت‌مدیره به اتفاق آرا به بازگرداندن جنسن هوانگ رأی داد. در این بیانیه آمده است: «هیئت‌مدیره بر این باور است که جنسن فرد مناسبی برای رهبری انویدیاست و بازگشت او به این سمت، به نفع سهامداران، کارکنان، شرکا و مشتریان ماست.» آقای هوانگ که در پی جنجال‌های مربوط به رابطه‌اش با یک زن مشکوک به جاسوسی برای چین از مدیرعاملی انویدیا کنار رفته بود، با انتشار بیانیه‌ای از این تصمیم اسنتقبال کرد: «مفتخرم که به انویدیا بازمی‌گردم تا در آغاز یک انقلاب صنعتی جدید، هدایت یکی از تأثیرگذارترین شرکت‌های فناوری در جهان را بر عهده بگیرم. من این مسئولیت را با نهایت فروتنی و تعهدی تازه می‌پذیرم.» در بیانیه هیئت‌‌مدیره انویدیا آمده است که آن‌ها اطمینان دارند این تصمیم خطری برای امنیت ملی آمریکا ایجاد نمی‌کند: «هیئت‌مدیره در روند اتخاذ تصمیم خود، نظراتی را از سطوح عالی دولت ایالات متحده دریافت کرد و بر اساس این نظرات، اطمینان دارد که بازگرداندن آقای هوانگ به سمتش، هیچ‌گونه خطری برای امنیت ملی ایجاد نمی‌کند.» دونالد ترامپ، رئیس‌جمهور آمریکا، هم از بازگشت آقای هوانگ به شرکت انویدیا استقبال کرد و آن را «تصمیمی درست و بجا» خواند. او در شبکه اجتماعی تروث سوشال نوشت: «برای تضمین موفقیت و شکوفایی، نه تنها برای این شرکت، بلکه برای اقتصاد آمریکا، کشور به رهبری جنسن در انویدیا نیاز دارد.» او همچنین اظهار داشت که دولت ایالات متحده «هیچ دلیلی ندارد که تصور کند» بازگشت آقای هوانگ «هیچ‌گونه خطری» برای امنیت ملی ایجاد می‌کند. او آقای هوانگ را «یک میهن‌پرست بزرگ و گنجینه‌ای ملی» توصیف کرد.", "image_url": "https://ichef.bbci.co.uk/news/1200/branded_persian/987a/live/b26b9cf0-4313-11ed-9ae9-959994b8a64c.png", "category": "هوش مصنوعی مولد", "tags": ["Nvidia", "امنیت سایبری"], "datetime_fa": "۲ آذر • ۱۸:۰۲"}, {"source": "Euronews Persian", "title": "چگونه توسعه صنایع رباتیک نظامی به ایجاد فرصت‌های شغلی در یک شهر کوچک اسپانیا کمک می‌کند؟", "link": "https://parsi.euronews.com/2026/11/23/how-military-robotics-is-creating-jobs-in-rural-spain", "summary": "گسترش فعال nstruction must keep up. Across the country, states are permitting 1.7 homes for every projected new household—about 121,000 homes a month versus 72,000 projected new households, according to an October research report from the Lied Center for Real Estate at the University of Nevada, Las Vegas. The rate reflects the average number of approved building permits from January to August of 2026, offering a glimpse of how much housing could come online in the coming years, and compares it to the number of new households projected to enter each state from October 2026 through December 2027. \"Most states are permitting ahead of projected household growth,\" the report said. Projected household growth signals how housing demand might rise in the future, while the pace of permitting indicates how supply is responding. Permits are expected to exceed household growth, rather than settle at a one-to-one match, to account for homes replacing houses destroyed in disasters, vacancies, second homes, and units never built, the report said. Nicholas Irwin, coauthor of the report and research director at the Lied Center for Real Estate, said the measurement indicates how the housing market is responding to future demand. To him, the national average shows that \"we're doing OK.\" \"That's only because there are some states that are doing really, really well, and there's some states that are doing really poorly. So the states that are doing really well are sort of pulling up that average,\" he said. North Carolina is ahead of the curve, with the highest rate of approved permits relative to projected household growth. Following North Carolina came Kansas and West Virginia, ahead of the pack, with the number of approved permits outpacing projected household growth from October 2026 through December 2027. What some of these states have in common is the actual area available for building. \"Utah, Idaho, South Carolina and North Carolina, South Dakota. ", "date_str": "2026-11-23T18:16:08+00  doesn't mean maximizing the stock price every day or ignoring executive misconduct. That includes Huang's alleged relationship with a subordinate. And some Nvidia customers may have smuggled the company's cutting-edge GPUs into China, although how much Huang knew about that remains unclear. There are also unconfirmed media reports that another woman he slept with might be a Chinese spy. All this raises serious questions. The board has every reason to investigate. On Monday, the board said Huang's reinstatement \"poses no national security risk.\" Its independent investigation into allegations that he was targeted by foreign intelligence will continue, with the CEO's full cooperation. But the directors also had to weigh the enormous cost of losing the visionary founder who built Nvidia into the world's dominant AI chip company. That's where things get uncomfortable. A board cannot possibly represent every stakeholder opinion about morality, politics, or acceptable behavior. Those views often conflict. This is the agency problem at the heart of corporate governance. It's already incredibly difficult to run a successful business. Adding a responsibility to change things based on thousands of competing, individual opinions is almost impossible. That's why the job of a public company board has been mostly whittled down to this guiding responsibility: Direc", "date_str": "2026-11-23T17:28:44+00:00", "hash": "d2e49ae416dbd18b", "title_fa": "جنسن هوانگ 1 تریلیون دلار برای انویدیا ارزش دارد. هیئت مدیره آن نمی توانست آن را نادیده بگیرد.", "summary_fa": "جنسن هوانگ، مدیرعامل انویدیا کیم هونگ جی/رویترز/بلومبرگ از طریق Getty Images بازگردانده شد، سهام انویدیا پس از بازگشت جنسن هوانگ به عنوان مدیرعامل، جهش کرد. معکوس شدن هیئت مدیره در مورد بنیانگذار رویایی خود نشان می دهد که سرنوشت انویدیا چقدر به هوانگ گره خورده است. حماسه انویدیا حاکمیت شرکتی را مورد توجه قرار می دهد، زیرا مدیران باید منافع سهامداران را بسنجند. به ندرت پیش می‌آید که سرمایه‌گذاران این فرصت را پیدا کنند که ارزش ردازنده‌های نسل آینده‌ی اینتل با نام تجاری Nova Lake-S و Nova Lake-H پیش از معرفی رسمی آشکار شد. اطلاعات فاش‌شده نشان می‌دهند مدل‌های رومیزی و لپ‌تاپی این خانواده با پیکربندی‌های متفاوتی در دست توسعه قرار دارند. به روایت ویدیوکاردز پردازنده‌ی Core Ultra Series 4 ملقب به Nova Lake-H دارای ۱۶ هسته شامل هشت هسته‌ی قدرتمند P، چهار هسته‌ی کم‌مصرف E و چهار هسته‌ی فوق کم‌مصرف LPE است. بیشینه‌ی فرکانس به ۴٫۸ گیگاهرتز می‌رسد، فرکانس پایه‌ی هسته‌های قدرتمند ۲ گیگاهرتز ثبت شده و توان طراحی حرارتی ۲۵ وات در کنار ۱۸ مگابایت کش سطح نهایی ذکر شده است. هم‌زمان در پایگاه داده‌ی OpenBenchmarking نمونه‌ی مهندسی پردازنده‌ی رومیزی Nova Lake-S با ۲۸ هسته و فرکانس ۵٫۲ گیگاهرتز رؤیت شد. مادربرد مرجع اینتل NVL-S UDIMM 1DPC CRB Fab2 میزبان این تراشه بود و سیستم‌عامل اوبونتو ۲۶٫۰۴ همراه کرنل لینوکس ۷٫۲٫۳ روی آن اجرا شده است. آرایش هسته‌های این پردازنده اینتل احتمالا ترکیبی از ۸ هسته‌ی قدرتمند، ۱۶ هسته‌ی کم‌مصرف و ۴ هسته‌ی فوق کم‌مصرف را در بر می‌گیرد. لایک نظرت چیه؟ ارسال نظر بوکمارک اشتراک‌گذاری امیر عبدالملکی دنبال کردن به محتوای این مطلب چه امتیازی میدی؟ نظر شما برامون مهمه و به بهتر شدن کیفیت مطالب کمک می‌کنه.", "image_url": "https://api2.zoomit.ir/media/intel-panther-lake-68e7bcfda358db02e0901c8b?w=1920&q=75", "category": "هوش مصنوعی مولد", "tags": ["تراشه"], "datetime_fa": "۲ آذر • ۲۱:۳۰"}, {"source": "The Guardian AI", "title": "Sweden’s datacentre politics are more complicated than they appear | Letter", "link": "https://www.theguardian.com/world/2026/nov/23/swedens-datacentre-politics-are-more-complicated-than-they-appear", "summary": "There are distinct tensions over who controls, benefits from and gains access to natural and public resources, write James White and Nora Söderberg Steve Rose’s account of Sweden’s datacentre sector ( ‘Datacentres are deeply unpopular. Has Sweden made one we can all love?’, 12 November ) is a welcome reminder that digital infrastructure can be developed in more environmentally responsible ways. However, his suggestion that datacentres have become politically contentious elsewhere, “but here in Sweden, not so much”, is a misrepresentation. Consider the proposed Google datacentre development at Torsboda, near Sundsvall, which requires an enormous allocation of electricity and industrial land. The StoppaGoogle campaign , initiated by the regional political party Norrlandspartiet, has been vocal in challenging what this development will mean for electricity prices, employment and regional development. Controversy over datacentres in Sweden’s north reflect wider debate about resource extraction for the green and technological transitions, and the worry that Sweden is becoming an “electricity colony” of big tech , providing cheap, green energy while the economic benefits are realised elsewhere. At the same time, Sweden-based researchers, such as Julia Velkova , and Jutta Haider and Malte Rödl , have argued that the sustainability of digital infrastructure cannot be reduced to carbon emissions and technological efficiency. Datacentres place high demands on electricity grids, necessitating government investment and compromising access for other industries, communities and public services. While these direct impacts of datacentres are important, so too are the downstream consequences that they overshadow, including how digital services promote climate disinformation and unsustainable mass consumption. Sweden’s renewable energy infrastructure does not make datacentre development environmentally or politically unproblematic, but contributes to distinct tensions over who controls, benefits from and gains access to natural and public resources. Rather than presenting Sweden as an exception to the growing politicisation of datacentres, we should recognise how these conflicts emerge differently in different places, shaped by their histories, infrastructures and political economies. James White and Nora Söderberg Department of Technology and Society, Lund University Continue reading...", "date_str": "2026-11-23T18:04:25+00:00", "hash": "e866b146995212d4", "title_fa": "سیاست مرکز داده سوئد پیچیده تر از آن چیزی است که به نظر می رسد | نامه", "summary_fa": "گزارش جیمز وایت و نورا سودربرگ استیو رز در مورد بخش مرکز داده سوئد می نویسند، تنش های مشخصی بر سر اینکه چه کسی منابع طبیعی و عمومی را کنترل می کند، از آنها سود می برد و به آنها دسترسی پیدا می کند (\"مرکزهای داده عمیقاً نامحبوب هستند. آیا سوئد یکی را ساخته است که همه می توانیم دوستش داشته باشیم؟\"، 12 نوامبر) یادآور خوشامدگویی است که زیرساخت های زیست محیطی مسئولانه تر را می توان توسعه داد. با این حال، پیشنهاد او مبنی بر اینکه مراکز داده در جاهای دیگر از نظر سیاسی بحث برانگیز شده‌اند، «اما اینجا در سوئد، نه چندان»، یک تعبیر نادرست است. توسعه مرکز داده پیشنهادی گوگل در Torsboda، در نزدیکی Sundsvall را در نظر بگیرید، که به تخصیص عظیم برق و زمین صنعتی نیاز دارد. کمپین StoppaGoogle، که توسط حزب سیاسی منطقه‌ای Norrlandspartiet راه‌اندازی شد، در به چالش کشیدن معنای این توسعه برای قیمت برق، اشتغال و توسعه منطقه‌ای با صدای بلند بود. مناقشه بر سر مراکز داده در شمال سوئد منعکس کننده بحث گسترده تری در مورد استخراج منابع برای انتقال سبز و فناوری است، و این نگرانی که سوئد در حال تبدیل شدن به یک \"مستعمره برق\" فناوری های بزرگ است که انرژی ارزان و سبز را ارائه می دهد در حالی که مزایای اقتصادی آن در جاهای دیگر محقق می شود. در همان زمان، محققان سوئدی، مانند جولیا ولکووا، و جوتا هایدر و مالت رودل، استدلال کرده‌اند که پایداری زیرساخت‌های دیجیتال را نمی‌توان به انتشار کربن و کارایی فن‌آوری کاهش داد. دیتاسنترها تقاضاهای زیادی برای شبکه های برق دارند که نیاز به سرمایه گذاری دولت و به خطر انداختن دسترسی سایر صنایع، جوامع و خدمات عمومی را دارد.", "image_url": "", "category": "هوش مصنوعی مولد", "tags": ["Google"], "datetime_fa": "۲ آذر • ۲۱:۳۴"}, {"source": "Engadget", "title": "The Samsung Odyssey G6 G60H is the world's first 1,100Hz gaming monitor", "link": "https://www.engadget.com/2325384/samsung-odyssey-g6-g60h-is-the-worlds-first-1100hz-gaming-monitor/", "summary": "That big catch is that this monitor s refresh rate only gets that high in HD mode.", "date_str": "2026-11-23T17:47:59+00:00", "hash": "54192afac36f31c3", "title_fa": "Samsung Odyssey G6 G60H اولین مانیتور گیمینگ 1100 هرتزی در جهان است.", "summary_fa": "نکته مهم این است که نرخ تازه سازی این مانیتور فقط در حالت HD به این میزان می رسد. نکته مهم این است که نرخ تازه سازی آن تنها در حالت HD به این میزان می رسد. Samsung Engadget را به Google اضافه کنید: منبع ترجیحی Google Discover من فکر می‌کردم که جنگ‌های نرخ تازه‌سازی ممکن است پس از رسیدن نمایشگرها به 1000 هرتز کند شود، اما ظاهراً اشتباه می‌کردم. این به این دلیل است که امروز سامسونگ مانیتور 27 اینچی را معرفی کرد که اولین مانیتور بازی 1100 هرتزی در جهان است. Odyssey G6 جدید مبتنی بر یک پنل IPS دو حالته است که از دو رزولوشن اصلی پشتیبانی می کند: QHD (2560 x 1440) و HD (1280 × 720). همچنین دارای روشنایی مناسب (معمولاً 400 نیت)، گواهی HDR10+، زمان پاسخ خاکستری به خاکستری تاول‌آمیز تنها 1 میلی‌ثانیه و سازگاری با AMD FreeSync Premium و NVIDIA G-Sync است. با این حال، احتیاط بزرگ در مورد این نمایشگر این است که تنها می تواند در حالت HD به اوج نرخ تازه سازی 1100 هرتز خود برسد، به این معنی که نمی توانید همزمان از حداکثر وضوح و حداکثر نرخ تازه سازی آن لذت ببرید. گفته می‌شود، حتی در حالت QHD، پنل همچنان می‌تواند به 600 هرتز برسد که از اکثر مانیتورهای موجود امروزی بالاتر است. در همین حال، برای کمک به بهینه‌سازی قابلیت‌های مانیتور، G60H با فناوری Odyssey Clear Motion سامسونگ نیز عرضه می‌شود که از یک الگوریتم سفارشی برای کمک به کاهش تاری و حفظ وضوح تصاویر تا حد ممکن استفاده می‌کند. همچنین یک ویژگی اکولایزر سیاه وجود دارد که به طور خودکار سطوح روشنایی را در صحنه های تاریک تنظیم می کند تا کنتراست درک شده را افزایش دهد. پایه G6 همچنین قابلیت تنظیم ارتفاع را دارد و از چرخش، شیب و چرخش پشتیبانی می‌کند، اما در جهت", "image_url": "https://www.engadget.com/img/gallery/the-samsung-odyssey-g6-g60h-is-the-worlds-first-1100hz-gaming-monitor/l-intro-1795456011.jpg", "category": "هوش مصنوعی مولد", "tags": ["Google", "Nvidia"], "datetime_fa": "۲ آذر • ۲۱:۱۷"}, {"source": "Engadget", "title": "You can block AI slop and spam on these social media platforms", "link": "https://www.engadget.com/2320284/how-block-ai-slop-spam-social-media-platforms/", "summary": "Some sites offer tools to filter the slop out of your feeds, while doing so on others will require some dedicated effort.", "date_str": "2026-11-23T17:45:00+00:00", "hash": "533902a7c75fd8bf", "title_fa": "می‌توانید در این پلتفرم‌های رسانه‌های اجتماعی، ناهنجاری و اسپم‌های هوش مصنوعی را مسدود کنید", "summary_fa": "برخی از سایت‌ها ابزارهایی را برای فیلتر کردن شیب فیدهای شما ارائه می‌کنند، در حالی که انجام این کار در سایر سایت‌ها نیازمند تلاش اختصاصی است. برخی از سایت ها شروع به ارائه ابزارهایی برای فیلتر کردن شیب از فیدهای شما کرده اند. GoodIdeas/Shutterstock افزودن Engadget به Google: منبع برگزیده Google Discover این روزها، رهایی از هجوم شیب هوش مصنوعی به دلیل اینکه اکنون تقریباً همه پلتفرم‌های رسانه‌های اجتماعی را فراگرفته است، بسیار دشوار است. و هر روز که می گذرد، تشخیص اینکه چه چیزی واقعی است و چه چیزی از یک درخواست ناشی شده است، حتی سخت تر می شود، و باعث می شود که نظریه اینترنت مرده کمتر از گذشته دور از ذهن به نظر برسد. بدترین بخش این است که کاربران دقیقاً به هشیاری فیدهای رسانه های اجتماعی خود علاقه نشان ندادند. خوشبختانه، پلتفرم‌های رسانه‌های اجتماعی به کاربران اجازه می‌دهند تصمیم بگیرند چه مقدار محتوای تولید شده توسط هوش مصنوعی به فید آنها برسد. با این حال، در حال حاضر، بیشتر پلتفرم‌ها فقط به شما اجازه می‌دهند میزان محتوای هوش مصنوعی را که می‌بینید کاهش دهید، نه اینکه آن را کاملاً مسدود کنید. همچنین این واقعیت وجود دارد که یک بلوک 100 درصد دقیق ممکن است حتی امکان پذیر نباشد - پلتفرم های رسانه های اجتماعی از برچسب ها و ابرداده ها برای شناسایی محتوای هوش مصنوعی استفاده می کنند که ممکن است با ویرایش یا بارگذاری مجدد محتوا از بین بروند. همانطور که انتظار دارید، پلتفرم های مختلف محتوای هوش مصنوعی را متفاوت مدیریت می کنند. برخی از پلتفرم‌ها از جمله Pinterest، LinkedIn و TikTok به شما این امکان را می‌دهند که میزان شیب هوش مصنوعی به فید خود را کاهش دهید. در همین حال، پلتفرم‌های دیگر از جمله اینستاگرام، فیس‌بوک و یوتیوب هیچ تنظیمات اختصاصی ندارند، اما راه‌حل‌هایی وجود دارد که می‌تواند محتوای هوش مصنوعی", "image_url": "https://www.engadget.com/img/gallery/you-can-block-ai-slop-and-spam-on-these-social-media-platforms/l-intro-1794769415.jpg", "category": "هوش مصنوعی مولد", "tags": ["هوش مصنوعی", "Google"], "datetime_fa": "۲ آذر • ۲۱:۱۵"}, {"source": "Wired", "title": "Jensen Huang Is Back and So Is Nvidia’s Stock", "link": "https://www.wired.com/story/jensens-back-stocks-up-what-the-hell-sure/", "summary": "Jensen Huang comes back, numbers go up. Maybe the reason behind the CEO’s return is just that simple?", "date_str": "2026-11-23T17:52:56+00:00", "hash": "1ecdaffc4e23acb1", "title_fa": "جنسن هوانگ برگشته و سهام انویدیا هم همینطور", "summary_fa": "جنسن هوانگ برمی گردد، اعداد بالا می روند. شاید دلیل بازگشت مدیرعامل به همین سادگی باشد؟ Loader Save Story ذخیره این داستان نظر Loader Save Story ذخیره این داستان جنسن هوانگ برگشته عزیزم، و وال استریت هیجان زده است. پس از اعلام هیئت مدیره مبنی بر بازگرداندن هوانگ به عنوان رئیس، مدیرعامل و عضو هیئت مدیره، سهام این سازنده تراشه بیش از 30 درصد افزایش یافته است. ارزش این شرکت بیش از یک تریلیون دلار افزایش یافته است که آن را در مسیر شکستن رکورد مایکروسافت برای بیشترین افزایش یک روزه در ارزش بازار با صدها میلیارد دلار قرار می دهد. هوانگ در 12 نوامبر شرکتی را که به آن کمک کرد در میان بوسیدن دارایی مشکوک و اتهامات روابط خارج از ازدواج با کارمندان ترک کرد. هر گزارش به ارزش شرکت حذف شد، تا اینکه در ماه گذشته نزدیک به 2.2 تریلیون دلار پاک شد. هفته گذشته، هاروی جونز، رئیس هیئت مدیره، در طی تماس با درآمد شرکت گفت که هیئت مدیره \"قصدی برای بازگرداندن جنسن به عنوان مدیرعامل ندارد.\" WIRED همچنین گزارش داد که هیئت مدیره انویدیا از \"عدم صراحت\" و \"دروغگویی\" هوانگ نگران شده است. با این حال، با وجود همه اینها، هیئت مدیره روز دوشنبه اعلام کرد که هوانگ را با کمک دولت ایالات متحده بازگردانده است. سمافور گزارش داد که ساعاتی قبل از بازگرداندن هوانگ، دونالد ترامپ، رئیس‌جمهور آمریکا در جلسه هیئت مدیره شرکت سهامی عام تماس گرفت تا در مورد بازگشت مدیرعامل برکنار شده بحث کند. بسیاری از سوالات بی پاسخ 0 survey of 1,092 philosophers, 39% said some future AI systems will be conscious (for comparison, the philosophers were less confident about worms or flies being conscious). But last week, Anthropic’s openness to the consciousness question came under fire from a rather inconvenient source: one of the philosophers who helped shape our understanding of consciousness in the first place. Thomas Nagel is best known for a 1974 essay involving a bat. Acknowledging that it’s deceptively hard to define what consciousness is , Nagel offered one way out: we all can see that there is “something that it is like” to be a bat. But the problem is that a bat’s experience of the world—what it is like to navigate via echolocation, for example—is something we cannot actually know. Consciousness is a subjective thing, difficult to define or describe as an outside observer. You might think this analogy makes it likely that Nagel is open to the idea of AI consciousness. Not at all. In an interview with Wired last week, just after he was awarded the one-million-dollar Berggruen Prize for Philosophy Culture, Nagel was bluntly critical of the entire idea. “Here are some of the smartest people on the planet being completely idiotic,” he said, referring to those at Anthropic and elsewhere who care about the welfare of AI model", "date_str": "2026-11-23T17:36:08+00:00", "hash": "03212554ddb823ae", "title_fa": "یک فیلسوف افسانه ای استدلال آگاهی آنتروپیک را نمی خرد", "summary_fa": "قبل از عرضه عمومی در هفته گذشته، آنتروپیک این احتمال را که هوش مصنوعی می تواند آگاهانه یا حساس باشد به عنوان یک عامل خطر برای هر کسی که سرمایه گذاری می کند نام برد. آنتروپیک نوشت: با توجه به «نحوه برخورد ما با احساسات و موقعیت اخلاقی مدل» - که می‌گوید این احتمال را بیشتر از هر شرکت هوش مصنوعی دیگری جدی می‌گیرد - ممکن است قوانین و محدودیت‌های بیشتری نسبت به رقبای خود اتخاذ کند تا مطمئن شود با مدل‌های هوش مصنوعی آن به خوبی رفتار می‌شود. Anthropic تعدادی از فیلسوفان محترم را در اردوگاه خود می شمارد، و منطق شرکت چیزی شبیه ه‌ها نفر و شناخت دقیق محیط نیاز داشت. آن‌ها گله‌های بزرگ بایسون را به‌سمت پرتگاه‌های طبیعی هدایت می‌کردند و با سقوط حیوانات از ارتفاع، در یک نوبت شکار به مقدار زیادی گوشت دست می‌یافتند. اکنون باستان‌شناسان در تگزاس شواهدی از تکرار این روش در طول سه هزار سال پیدا کرده‌اند. به‌گزارش لایوساینس ، محوطه‌ی باستانی نایت‌هاوک (Nighthawk) در پارک ایالتی کاپراک کنیونز در شمال غربی تگزاس قرار دارد. این مکان دومین نمونه‌ی شناخته‌شده از محوطه‌های شکار بایسون با استفاده از پرتگاه در دشت‌های جنوبی آمریکای شمالی است؛ روشی که پیش‌تر بیشتر با جوامع بومی دشت‌های شمالی ارتباط داده می‌شد. محوطه‌ی نایت‌هاوک زمانی توجه باستان‌شناسان را جلب کرد که فرسایش خاک، تعداد زیادی استخوان گاومیش‌ کوهان‌دار را در پایین برآمدگی صخره‌ای به ارتفاع حدود ۲۰ متر آشکار کرد. در بسیاری از محوطه‌های مشابه، شکارچیان گله را به دویدن وامی‌داشتند تا حیوانات ناگهان از لبه‌ی پرتگاه سقوط کنند پژوهشگران پس از بررسی محل، صدها استخوان بایسون، ابزارهای سنگی تراش‌خورده و چند نوک پیکان کشف کردند. روی برخی استخوان‌ها نیز آثار برش با ابزارهای سنگی دیده می‌شد که نشان می‌داد انسان‌ها پس از مرگ حیوانات، لاشه‌ها را برای استفاده از گوشت قطعه‌قطعه کرده بودند. موقعیت استخوان‌ها سرنخ مهم دیگری در اختیار باستان‌شناسان قرار داد. محل تجمع بقایا میان دو دیواره‌ی صخره‌ای قرار گرفته و به‌گفته‌ی پژوهشگران، تنها راه رسیدن بایسون‌ها به آن نقطه، سقوط از بالای صخره بوده است. شکارچیان احتمالاً از شکل طبیعی صخره برای هدایت گله به‌سمت پرتگاه استفاده می‌کردند. بااین‌حال، روش شکار در نایت‌هاوک ممکن است با نمونه‌های شناخته‌شده تفاوت داشته باشد.", "image_url": "https://api2.zoomit.ir/media/american-bison-texas-landscape-6b025e2e6c258944521175e2?w=1920&q=75", "category": "موسیقی و هنر", "tags": ["فناوری", "نوآوری"], "datetime_fa": "۲ آذر • ۲۱:۰۵"}, {"source": "Zoomit", "title": "چرا اف‌بی‌آی بلافاصله پس از مرگ تسلا سراغ دست‌نوشته‌های مخفی او رفت؟ جعبه‌ای که نباید باز می‌شد", "link": "https://www.zoomit.ir/human-science/471718-esla-secret-handwriting-death/", "summary": "در بحبوحه جنگ جهانی دوم، استاد برق دانشگاه MIT برای خنثی‌کردن اختراع مرموز تسلا به  look and feel bigger. However, figuring out where to start can be difficult, especially when the clutter gets overwhelming. For tips on the process, Business Insider asked two professional organizers who cofounded the organizing service Uncluttered Spaces what people should get rid of in their bedrooms. Here's what the experts said. Exercise equipment should be kept outside the bedroom. BM_27/Getty Images Although home workouts are popular, Uncluttered Spaces' Tina Horan said having equipment in your bedroom could create more clutter and make you feel less relaxed. She recommended moving the equipment to a designated area for working out in order to make the bedroom feel more organized, relaxed, and spacious. Keeping bills, mail, and other documents in the bedroom can make your space look messy. sirtravelalot/Shutterstock Horan advised against opening mail and keeping documents inside your bedroom. \"Having a buildup of mail can cause stress, but it's also messy to have a pile of documents laying around your room,\" she said. Instead, she recommended designating a drawer or basket for your mail to keep the collection nice and tidy. Mismatched socks can take up valuable drawer space. chickaz/Getty Images Uncluttered Spaces' Nancy Yerkes told BI that having a graveyard of mismatched socks takes up a lot of useful drawer space. \"It's time to buy a new pack of matching socks — let go of the misfit ones and reclaim that drawer space,\" Yerkes said. Dishes should either be kept out of the room or cleaned up right away. Cuchulainn Liam Gent/Shutterstock Sometimes a snack in bed is comforting — but Horan advised against letting a pile of dirty dishes build up in your bedroom. \"I'm sure we're all guilty of bringing dishes into our room, but don't wait too long to declutter and remove it to ensure a constantly clean room,\" Horan said. You don’t need a huge collection of extra bedding. AdShooter/Getty Images Having extra bedding sets with different designs is a nice way to decorate, but having too many takes up an annoying amount of spa", "date_str": "2026-11-23T16:07:23+00:00", "hash": "e95e53d61a2d44d1", "title_fa": "به گفته سازمان دهندگان حرفه ای 8 چیزی که هرگز نباید در اتاق خواب خود داشته باشید", "summary_fa": "سازمان دهندگان حرفه ای توصیه های خود را در مورد شلوغ کردن اتاق خواب به اشتراک گذاشتند. کاترین لدنر/Getty Images Business Insider با دو سازمان دهنده حرفه ای در مورد نحوه شلوغ کردن اتاق خواب صحبت کرد. ملافه های اضافی، جوراب های نامتناسب و لباس های قدیمی می توانند فضای غیر ضروری را اشغال کنند. بیرون بردن وسایلی مانند پست، ظروف و جعبه های خالی از اتاق به کاهش شلوغی کمک می کند. هر چقدر هم که خسته کننده باشد، بی نظمی یک کار ضروری است که می تواند فضا را بزرگتر و بزرگتر جلوه دهد. با این حال، فهمیدن اینکه از کجا شروع کنید می تواند دشوار باشد، به خصوص زمانی که درهم و برهمی زیاد شود. برای راهنمایی در مورد این فرآیند، Business Insider از دو سازمان دهنده حرفه ای که سرویس سازماندهی Uncluttered Spaces را پایه گذاری کردند، پرسید که مردم باید از چه چیزی در اتاق خواب خود خلاص شوند. این چیزی است که کارشناسان گفتند. وسایل ورزشی باید بیرون از اتاق خواب نگهداری شوند. BM_27/Getty Images اگرچه تمرینات خانگی محبوب هستند، اما تینا هوران از Uncluttered Spaces می‌گوید داشتن تجهیزات در اتاق خواب می‌تواند به هم ریختگی بیشتری ایجاد کند و احساس آرامش کمتری داشته باشید. او توصیه کرد که وسایل را به یک منطقه مشخص شده برای تمرین منتقل کنید تا اتاق خواب سازماندهی، آرامش و جادارتر به نظر برسد. نگهداری صورتحساب، نامه و سایر اسناد در اتاق خواب می تواند فضای شما را نامرتب نشان دهد. sirtravelalot/Shutterstock Horan توصیه کرد از باز کردن نامه و نگهداری اسناد در داخل اتاق خواب خودداری کنید. او می‌گوید: «انباشته شدن نامه‌ها می‌تواند باعث استرس شود، اما داشتن انبوهی از اسناد در اطراف اتاق شما نیز کثیف است. در عوض، او توصیه کرد که یک کشو یا سبد برای پست خود تعیین کنید تا مجموعه را زیبا", "image_url": "https://i.insider.com/6b046441d6c5d341c9b4c334?width=1200&format=jpeg", "category": "هوش مصنوعی مولد", "tags": ["فناوری", "نوآوری"], "datetime_fa": "۲ آذر • ۱۹:۳۷"}, {"source": "Business Insider", "title": "Nasdaq surges 7% as the AI trade roars back after Jensen Huang is reinstated as Nvidia CEO", "link": "https://www.businessinsider.com/ai-stock-rally-jensen-huang-nvidia-reinstated-ceo-2026-11", "summary": "Jensen Huang s return stoked a massive recovery in tech stocks on Monday. Heather Diehl/Getty Images Stock investors are cheering Jensen Huang's return to Nvidia. The chipmaker said it reinstated Huang as CEO, removing a huge overhang for the AI trade. Shares of Nvidia soared more than 30%, helping the Nasdaq surge 7% to star the short week. Jensen Huang is back and the stock market couldn't be happier. AI stocks are in the midst of a sharp rebound as traders raced to buy Friday's dip and took in news that Huang was reinstated as Nvidia CEO, removing a huge overhang that pummeled the AI trade last week. The news caps off a wild, weekslong saga that began with reports of Huang having an extramarital affair with a suspected Chinese spy, which led investors to dump Nvidia and the data center suppliers in its orbit. In a statement, the board said it believed Huang was the \"right person to lead Nvidia,\" and that it took input from US government officials, which led it to be confident that Huang would pose no national security risk on the company. In a separate statement, Huang said he was \"honored\" to come back. Shares of Nvidia soared 34% on Monday as investors took in his reinstatement. The stock had plunged as much as 47% from its latest peak, and was down 21% last week. Glen Smith, the chief investment officer at GDS Wealth Management, called the decision to reinstate Huang \"shocking.\" \" Nvidia's stock is understandably surging on the news to reinstate Jensen Huang because much of its decline stemmed from this Nvidia crisis and it appears that the worst is over,\" he wrote in a note. AI stocks took it on the chin when Huang was first ousted . The Nvidia founder is seen as an unofficial poster child for the AI trade, leadi on to run safely,\" he noted.\"We see a path to become the largest AI safety and security company the world has ever seen.\" Recent outages at banks and airlines have sparked widespread fear of cyber attacks driven by increasingly sophisticated AI capabilities. While this has put cybersecurity firms in full focus, it hasn't sparked much momentum for share prices since AI doomsday fears pushed them up in September. Zscaler's tie-up with CrowdStrike drove several other cybersecurity stocks higher on Monday. Some of the top movers include: Okta : +10% Cloudflare : +9% Fortinet: +5% SentinelOne : +9% Palo Alto Networks : +4% CrowdStrike fell 5% on news of the deal. Dan Ives of Yorkville Ives, maintains an Outperform rating on CrowdStrike stock, citing the edge that it will gain from adding Zscaler's Secure Access Service Edge (SASE) platform to its network. \"We view this as the clearest signal yet that cybersecurity is consolidating into a handful of platforms, with the AI era forcing the hand of vendors who had been content to partner,\" Ives wrote in a note on Monday morning. \"The two already shared more than 2,000 customers and 16 integrations.\" Read the original article on Business Insider", "date_str": "2026-11-23T15:48:55+00:00", "hash": "9f6f6b6c48852ad5", "title_fa": "سهام Zscaler پس از امضای قرارداد 44 میلیارد دلاری با CrowdStrike در امنیت سایبری پیشتاز شد.", "summary_fa": "لوگوی Zscaler بر روی صفحه نمایش گوشی هوشمند در برابر آرم Crowdstrike در پس زمینه نمایش داده می شود. VCG/VCG از طریق Getty Images سهام Zscaler روز دوشنبه با اخباری مبنی بر خرید آن توسط Crowdstrike افزایش یافت. این معامله بزرگ 44 میلیارد دلاری رخ می دهد که قطعی های اخیر امنیت سایبری را در تمرکز کامل قرار داده است. دیگر موتورهای برتر در این فضا عبارتند از Okta، Cloudflare و Fortinent. سهام Zscaler روز دوشنبه افزایش یافت و پس از اخباری مبنی بر خرید این شرکت توسط CrowdStrike، منجر به افزایش سهام امنیت سایبری شد. پس از اینکه اعلام شد Zscaler توسط CrowdStrike در یک معامله 44 میلیارد دلاری که دو بازیگر اصلی در این فضا را ترکیب می کند، 17 درصد افزایش یافت. جورج کورتز، مدیر عامل شرکت Crowdstrike، در بیانیه‌ای گفت که این خرید بخشی از استراتژی این شرکت برای ماندن در آینده است زیرا هوش مصنوعی به بخش بزرگ‌تری از چشم‌انداز امنیت سایبری تبدیل می‌شود. او خاطرنشان کرد: «با Zscaler، ما در حال ساختن سیستم عامل امنیت سایبری هستیم: یک هواپیمای کنترلی واحد برای استقرار هوش مصنوعی، کنترل هوش مصنوعی و فعال کردن هر برنامه عاملی برای اجرای ایمن.» قطعی‌های اخیر در بانک‌ها و خطوط هوایی ترس گسترده‌ای از حملات سایبری ناشی از قابلیت‌های پیشرفته‌تر هوش مصنوعی را برانگیخته است. در حالی که این امر شرکت‌های امنیت سایبری را در کانون توجه کامل قرار داده است، اما از زمانی که ترس از روز رستاخیز هوش مصنوعی در ماه سپتامبر آنها را افزایش داد، حرکت زیادی برای قیمت سهام ایجاد نکرد. پیوند Zscaler با CrowdStrike باعث افزایش چند سهام دیگر در امنیت سایبری در روز دوشنبه شد. برخی از پیشروان برتر عبارتند از: Okta: +10% Cloudflare: +9% Fortinet: +5% SentinelOne: +9% Palo Alto Networks: +4% CrowdStrike با اخبار معامله 5% سقوط کرد. Dan Ives از Yorkville Ives،", "image_url": "https://i.insider.com/6b04524873f126f9eccb9734?width=1200&format=jpeg", "category": "هوش مصنوعی مولد", "tags": ["هوش مصنوعی", "امنیت سایبری", "بورس و طلا"], "datetime_fa": "۲ آذر • ۱۹:۱۸"}, {"source": "Business Insider", "title": "We moved across the country to a more expensive city. I love it, but feel embarrassed when friends from home visit.", "link": "https://www.businessinsider.com/moved-to-more-expensive-city-across-country-better-complicated-feelings-2026-11", "summary": "My husband and I moved from the Southeast US to Olympia, Washington. It s worth the higher cost of living, but I feel self-conscious when friends from home visit. Courtesy of Laura Grace Tarpley We moved across the country from the Southeast US to a more expensive city, Olympia, Washington. The higher cost of living has been worth it, but I'm embarrassed telling friends from home about it. I'm working to stop judging myself for spending more and projecting those insecurities onto others. I grew up in Little Rock, Arkansas, and my husband, Daniel, grew up just south of Atlanta. Aside from brief stints living abroad, we've each spent most of our lives in the Southeast United States. By 2021, though, we were ready to live somewhere else in the US. The weather was one reason. Rather than getting used to slogging through humid Southern summers over the years, my animosity toward the weather only grew. Also, we both love hiking, and it's hard to enjoy the outdoors when you're sweating for roughly five months of the year. Religion was another reason for moving. We were both raised in Evangelical Christian households and had spent nearly all our years in the Bible Belt. However, neither of us was religious anymore. We wanted some space from that part of traditional Southern culture. My job was fully remote, so I could work from anywhere in America. Daniel, on the other hand, worked for the state government. He started applying for jobs out West, and he was finally hired in Olympia, Washington. We had never visited, but we just said, \"Why not?\" The mountains and lifestyle are worth the higher cost of living for us With our new home, we ve got access to tons of incredible outdoor activities on the Puget Sound. Courtesy of Laura Grace Tarpley From the start, life in Washington was more expensive than we were used to. Although we'd lived in several cities down South, I most often compared Olympia prices to those in Little Rock , since that's where I grew up and several of my close friends still live. The cost of living in Olympia is significantly higher than in Little Rock. Groceries and gas cost more, but housing was the biggest sticker shock for us. (Homes tend to cost about 40% more in Olympia, according to estimates from PayScale and Forbes' Cost of Living Calculators.) Daniel and I decided the extra expenses were worth the trade-off of being surrounded by mountains and water, though. Just a year after moving to Olympia, we  ways to upgrade a box of brownie mix.", "link": "https://www.businessinsider.com/best-ways-upgrade-brownie-mix-professional-baker-tips", "summary": "As a professional baker, I ve learned a lot of easy ways to upgrade a box of brownie mix. Tetra Images/Getty Images As a professional baker, I think it's possible to make brownies from a boxed mix taste gourmet. Extracts, fun mix-ins, and a sprinkle of salt can elevate brownies. Use cream or milk instead of water when making your brownies to make them even more moist. Brownies are easily a top favorite treat for many — and baking a great batch at home is easier than you think. I'm a former bakery owner, now a professional baker and recipe developer, and although I can bake brownies from scratch , I often prefer to use a mix I've doctored up. With a few swaps and additions, you can take a premade blend to the next level and make the brownies your own. Here are some of the best ways to upgrade a box of brownie mix . Make the brownies more moist using milk or cream. Jen Tepp/Getty Images When preparing your boxed mix, try swapping out the water needed for milk or heavy cream. This will still check the liquid off the ingredient list while creating a richer, fudgier, moister brownie. Add mix-ins to play with texture and flavor. natashamam/Getty Images A plain brownie batter is calling for mix-ins, and the possibilities are endless. Consider adding chocolate chips or dark-chocolate chunks. Crushed Oreo cookies, M M's, Reese's Pieces, chopped walnuts, or hazelnuts are excellent options as well. Fold in the mix-ins after the batter is prepped, then transfer to the baking pan and bake as directed. Play with extracts. brazzo/Getty Images Switch up the flavor of boxed brownies with just a few drops of an extract. Even just a teaspoon of vanilla extract can go a long way in enhancing the flavor of this treat. You can also play around with different flavors. For example, adding peppermint extract will offer a chocolate-mint combo that's wonderful for the holiday season. Coconut extract is another fun option to try; you can amplify its flavors by also folding shredded coconut into your brownie batter. Use brewed coffee in place of water for brownies with more depth. Karl Tapales/Getty Images Most brownie mixes call for a few tablespoons of water on the back of the box. To enhance your brownies, swap some of that water out for strong brewed coffee. This can add a more complex depth of flavor. For an even more pronounced coffee flavor, add a teaspoon of instant espresso powder to the dry ingredients as well. Sprinkle them with salty snack foods. KateSmirnova/Getty Images ", "date_str": "2026-11-23T15:24:12+00:00", "hash": "5d61ee6128774a49", "title_fa": "من یک نانوای حرفه ای هستم. در اینجا 8 مورد از بهترین راه ها برای ارتقاء یک جعبه مخلوط براونی آورده شده است.", "summary_fa": "به‌عنوان یک نانوای حرفه‌ای، راه‌های آسان زیادی برای ارتقاء یک جعبه مخلوط براونی آموختم. Tetra Images/Getty Images به عنوان یک نانوای حرفه ای، فکر می کنم می توان براونی ها را از یک غذای خوش طعم مخلوط جعبه درست کرد. عصاره‌ها، مخلوط‌های سرگرم‌کننده و پاشیدن نمک می‌توانند براونی را افزایش دهند. هنگام درست کردن براونی ها به جای آب از خامه یا شیر استفاده کنید تا مرطوب تر شوند. براونی ها به راحتی یکی از بهترین خوراکی های مورد علاقه بسیاری هستند - و پخت یک دسته عالی در خانه آسان تر از آن چیزی است که فکر می کنید. من قبلاً یک نانوایی هستم، اکنون یک نانوای حرفه ای و تهیه کننده دستور پخت هستم، و اگرچه می توانم براونی را از ابتدا بپزم، اغلب ترجیح می دهم از مخلوطی استفاده کنم که قبلاً درست کرده ام. با چند تعویض و اضافه کردن، می توانید یک ترکیب از پیش ساخته شده را به سطح بعدی ببرید و براونی ها را خودتان بسازید. در اینجا برخی از بهترین راه ها برای ارتقاء جعبه مخلوط براونی آورده شده است. براونی ها را با استفاده از شیر یا خامه مرطوب تر کنید. Jen Tepp/Getty Images هنگام تهیه مخلوط جعبه ای خود، سعی کنید آب مورد نیاز را با شیر یا خامه غلیظ عوض کنید. این کار همچنان مایع را از لیست مواد تشکیل می دهد و در عین حال یک براونی غنی تر، مرطوب تر و مرطو tor, a tactic that Kyiv has called out every winter for years. Neither Russia's defense ministry nor its US embassy responded to a request for comment. Earlier this month, Ukraine's military intelligence agency released a new assessment detailing Russian missile stockpiles and production capacity. It said that as of October, Moscow's reserves included up to 700 ballistic missiles and thousands of cruise missiles. Ukrainian intelligence said this month that Russia had stockpiled hundreds of ballistic missiles. Maxym Marusenko/NurPhoto via Getty Images The GUR said Russia can produce up to 110 ballistic missiles a month, roughly one every six-and-a-half hours, including 9M723 Iskander-M and RM-48U models, the latter of which is fired from S-400 air defense launchers and accounts for more than half of Moscow's reserves. Khmara said that Ukraine isn't only trying to down incoming ballistic missiles; it's also going after the Russian launchers. Kyiv has struck 16 Iskander and S-400 systems in recent months, he said. \"We will also work to diminish Russia's capacity to manufacture weapons,\" Khmara said, according to a translation of his remarks at the NATO assembly. \"For this reason, the enemy's defense-industrial facilities are among our targets.\" Ballisti", "date_str": "2026-11-23T15:14:33+00:00", "hash": "cd157b5f310b797c", "title_fa": "اوکراین هشدار داد روسیه هر 5 ساعت یک موشک بالستیک جدید می سازد و سرعت آن را افزایش می دهد", "summary_fa": "رئیس دفاع اوکراین روز دوشنبه هشدار داد روسیه می تواند هر پنج ساعت یک موشک بالستیک تولید کند. وزیر دفاع اوکراین روز دوشنبه گفت که روسیه هر پنج ساعت یک موشک بالستیک تولید می کند. یوهنی خمارا به مجمع ناتو هشدار داد که روسیه در حال تلاش برای تسریع این سرعت است. اطلاعات اوکراین اخیرا هشدار داده است که روسیه تا 700 موشک بالستیک در انبارهای خود دارد. یوهنی خمارا، وزیر دفاع اوکراین روز دوشنبه گفت که روسیه هر پنج ساعت یک موشک بالستیک تولید می کند و در حال تلاش برای تسریع این سرعت است. خمارا در جریان سخنرانی در مجمع پارلمانی ناتو در برلین es. We knew we couldn't do everything at once, so we planned to tackle the renovations in stages . The only issue? Figuring out where to live while the construction took place. Since Boulder is a destination for tourists year-round, the cost of staying in local hotels and long-term rentals comes at a premium. So, we got creative and turned to a cost-effective solution — living in the pop-up camper we had bought about 20 years ago for camping trips. The camper was comfortable enough for our needs Even though we had a sink in the camper, we never ended up using it. Dee Saale One of the things that drew us to our home was its large (by Boulder standards) backyard. At over a third of an acre, we had plenty of room to set up the camper. Over the years, we've taken the camper on countless trips, from Canada to the Mexican border. However, living in it for more than a few weeks would be a first for us. It's not large — with both ends pulled out and the roof raised, it measures about 15 feet long, 7 feet tall, and 7 feet wide — but we knew it would be comfortable enough for what we needed. Each end of the camper is equipped with a double-sized bed with a foam mattress that, although not as luxurious as a \"normal\" mattress, is comfortable enough. The camper has two double beds. Dee Saale There's also a small table with booth-like seating, although we typically preferred to eat on our patio instead. Speaking of meals, these were especially tricky to navigate since we didn't have a reliable way to clean the dishes and didn't want to attract unwanted animals. Although there is a sink in the camper, we didn't hook it up out of fear of mold growth. However, once the kitchen was demolished, there was no longer a kitchen sink or any appliances. Luckily, we always had at least one functioning bathroom in the house, so we rinsed fruit and vegetables there and used the showe", "date_str": "2026-11-23T15:13:51+00:00", "hash": "078976eb5ed28c22", "title_fa": "من و شوهرم خانه رویایی خو  Find Hub app that helps you keep track of things without actually using a Bluetooth tracker. You can simply ask Gemini to remember where you put things, and it will show up in the Find Hub app. To use it, pull up Gemini and say something like, Remember in Find Hub that the passport is in the downstairs wardrobe, or I ve kept the spare car keys behind the garage door. You can then ask Gemini, Where did I keep my passport? and it will tell you. If you change the location of an item, just ask Gemini to update it for you. When you go to the Remembered tab, you ll see the location of all remembered items. You can also add items manually here using the Add button. Make sure your Android smartphone is trackable even after it's turned off Some Android smartphones can remain findable for several hours after they've been switched off or their batteries have run out. If you re using a supported device (like the latest Pixel series smartphone), you can use a hardware feature ", "date_str": "2026-11-23T15:30:00+00:00", "hash": "1cef5232cfefe17a", "title_fa": "10 هک Find Hub که هر کاربر اندرویدی باید بداند", "summary_fa": "ممکن است از پیوندهای موجود در این صفحه کمیسیون دریافت کنیم. اپلیکیشن Find Hub گوگل فقط برای ردیابی گوشی هوشمند گم شده شما نیست. در طول سال گذشته، Google به طور مداوم ویژگی‌هایی را برای مدیریت وسایل شما، اشتراک‌گذاری موقعیت مکانی شما با عزیزان و مکان یابی دستگاه‌های گمشده اضافه کرده است. Find Hub اکنون می تواند وقتی دستگاه یا ردیاب خود را پشت سر گذاشته اید به شما اطلاع دهد. به‌علاوه، می‌توانید از Gemini برای به خاطر سپردن مواردی که در آن جا گذاشته‌اید، حتی بدون ردیاب متصل استفاده کنید. در پشت صحنه، تنظیمات و ویژگی های مخفی تری وجود دارد که به ردیابی دستگاه های شما کمک می کند و در صورت دزدیده شدن یا جابجایی آنها، بازیابی آنها را آسان تر می کند. اگر از Find Hub استفاده می کنید، باید در مورد این 10 هک بدانید. این ویژگی را برای دریافت اعلان‌های Left Behind به سبک AirTag فعال کنید این ماه، Google سرانجام اعلان‌های Left Behind را به ردیاب‌های اندروید اضافه کرد، اما ش . as Doctor Doom. Read full article Comments", "date_str": "2026-11-23T15:55:12+00:00", "hash": "4c2662098789c19e", "title_fa": "مارول تمام ابرقهرمانان تاریخ را در تریلر نهایی Avengers: Doomsday جمع می کند", "summary_fa": "چند روزی است که شایعاتی مبنی بر اینکه ما آخرین تریلر فیلم Avengers: Doomsday (انتقام‌جویان: روز قیامت) را دریافت می‌کنیم، فیلم ماقبل آخر در فاز ششم MCU، خبر از پایان به اصطلاح «حماسه چندگانه» می‌دهیم. شایعات درست بودند: مارول به تازگی تریلر را منتشر کرده است که تقریباً تمام ابرقهرمانانی که تا به حال در MCU نمایندگی شده اند را نشان می دهد. و به نظر می رسد که انتقام جویان با عواقب به هم ریختن جدول زمانی برای معکوس کردن بلیپ در پایان بازی مواجه خواهند شد. همانطور که قبلاً گزارش شده بود، داستان فیلم 14 ماه پس از وقایع Thunderbolts می گذرد. طبق لاگ لاین رسمی: \"قهرمانان محبوب از سه جهان متمایز در مسیر برخورد مرگبار قرار می گیرند و برخلاف هر چیزی که تاکنون با آن مواجه شده اند، با یک تهدید وجودی روبرو می شوند.\" این جهان‌ها Earth-616 (انتقام‌جویان، واکاندان‌ها و انتقام‌جویان جدید)، Earth-828 (چهار شگفت‌انگیز)، و مردان ایکس «اصلی» هستند. از نظر بازیگران، ما ثور (کریس همسورث)، کاپیتان آمریکای جدید (آنتونی مکی)، باکی بارنز (سباستین استن)، مرد مورچه ای (پل راد)، فالکون (دنی رامیرز) و لوکی (تام هیدلستون) را داریم. سپس گروه واکاندان وجود دارد: شوری در نقش پلنگ سیاه جدید (لتیتیا رایت)، ام باکو (وینستون دوک)، و نامور (تنوچ هوئرتا مجیا)، و همچنین الکس لیوینالی در نقش متحد نامور، آتوما. و البته رابرت داونی جونیور در نقش دکتر دووم. مقاله کامل را بخوانید نظرات تنظیمات متن متن داستان اندازه کوچک استاندارد پهنای بزرگ * پیوندهای عریض استاندارد استاندارد نارنجی * فقط مشترکین بیشتر بدانید. شایعات درست بودند: مارول به تازگی تریلر را منتشر کرده است که تقریباً تمام ابرقهرمانانی که تا به حال در MCU نمایندگی شده اند را نشان می دهد. و به نظر می رسد که انتقام جویان با عواقب به هم ریختن جدول زمانی برای معکوس کردن بلیپ در پایان بازی", "image_url": "https://cdn.arstechnica.net/wp-content/uploads/2026/11/doomsday1-1152x648.jpg", "category": "هوش مصنوعی مولد", "tags": ["سینما"], "datetime_fa": "۲ آذر • ۱۹:۲۵"}, {"source": "Engadget", "title": "What is Sound Glow on HomePods, and how do you get it on your Apple speaker?", "link": "https://www.engadget.com/2320280/what-is-apple-homepod-sound-glow/", "summary": "Apple's latest HomePod update makes the top of your speaker glow in sync with music.", "date_str": "2026-11-23T15:45:00+00:00", "hash": "4119f028f2cb2f94", "title_fa": "Sound Glow در HomePods چیست و چگونه آن را روی اسپیکر اپل خود قرار دهید؟", "summary_fa": "جدیدترین آپدیت هوم پاد اپل باعث می شود که بالای بلندگوی شما همگام با موسیقی بدرخشد. آخرین به‌روزرسانی هوم پاد اپل باعث می‌شود که بالای بلندگوی شما همگام با موسیقی بدرخشد. Apple Engadget را به Google اضافه کنید: منبع ترجیحی Google Discover HomePod اپل مجموعه‌ای از چراغ‌ها را در بالا دارد که در هنگام گوش دادن سیری یا زمانی که چیزی در حال پخش است، کار دیگری فراتر از درخشان شدن ندارند. اما پس از عرضه HomePod mini 2، اپل قابلیت جدیدی به نام Sound Glow را نیز معرفی کرد که استفاده بهتری از این چراغ ها می کند. وقتی روشن می‌شود، بالای بلندگو به یک نمایش نوری رنگارنگ تبدیل می‌شود که با آهنگی که به آن گوش می‌دهید همگام‌سازی می‌شود - و خبر خوب این است که این اسپیکر منحصر به آخرین HomePod mini نیست. این ویژگی بخشی از نرم افزار HomePod 27.2 است و همچنین با HomePod mini اصلی و HomePod 2 (مدل بزرگتر) کار می کند. در اینجا نحوه عملکرد Sound Glow و نحوه فعال کردن (یا غیرفعال کردن) آن در HomePods توضیح داده شده است. Filipe Espósito برای Engadget HomePods صفحه نمایش سنتی مانند HomeView اپل ندارد. در عوض، اپل مجموعه ای از LED ها را در بالا به همراه یک سطح حساس به لمس قرار داده است که به کاربران امکان می دهد به کنترل های سریع مانند صدا و پخش/مکث دسترسی داشته باشند. با آخرین به‌روزرسانی نرم‌افزار HomePod، این LED‌ها اکنون برای سرگرم‌تر کردن HomePods با Sound Glow استفاده می‌شوند. اکنون، هنگامی که آهنگی را پخش می کنید، بلندگو رنگ ها را از هنر آلبوم بیرون می کشد و به موقع با ضرب آهنگ آن ها را پالس می کند. گوش دادن به The Life of a Showgirl اثر تیلور سوئیفت به نورهای سبز و نارنجی منجر می شود، در حالی که تعطیلات ing her incredible cakes , and started many mornings with her easy breakfasts . So it's no surprise that I always turn to Garten's dishes during the holidays. These are my three favorite Barefoot Contessa recipes for Thanksgiving. Ina Garten s overnight mac and cheese is delicious, decadent, and super comforting. Anneta Konstantinides/Business Insider In her cookbook \"Go-To Dinners,\" Garten said her overnight mac and cheese is the \"creamiest, crustiest, most delicious mac and cheese.\" And believe me, she's not exaggerating! Garten s overnight mac and cheese features Gruyère, sharp white cheddar, and fresh breadcrumbs. Anneta Konstantinides/Business Insider To make Garten's dish for four, you'll need: 8 ounces of cavatappi or elbow macaroni 3 cups of heavy cream 2 cups of Gruyère cheese, grated 1 ½ cups of fine fresh white breadcrumbs 1 cup of sharp white cheddar, grated 2 tablespoons of unsalted butter, melted ¼ teaspoon of ground nutmeg Garten s mac and cheese is the perfect make-ahead dish for the holidays. Anneta Konstantinides/Business Insider Garten's mac and cheese couldn't be easier to assemble — you don't even need to make a roux. Plus, it requires less than 30 minutes in the oven, so it's an easy dish to bake right before Thanksgiving dinner. I love the crunchy breadcrumbs on top, and the sauce is decadent without being too rich. When I made this dish for the first time at Friendsgiving, my fiancé praised it for being \"exceptionally creamy,\" while a friend said it tasted \"like a hug in your mouth.\" It's my favorite Barefoot Contessa mac and cheese recipe, although Garten's \"grown-up\" mac and cheese is a close second. Get the full recipe for Ina Garten's overnight mac and cheese here . My family always requests Garten s potato gratin. Anneta Konstantinides/Business Insider I didn't use to be much of a cook, but I wanted to finally contribute something to my family's holiday menu. Garten's potato-fennel gratin seemed like a good place to start,", "d
