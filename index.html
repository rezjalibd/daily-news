c2b7fe0e7849f83b3?w=1920&q=75", "category": "امنیت سایبری و شبکه", "tags": ["فناوری", "نوآوری"], "datetime_fa": "۹ آبان • ۱۸:۴۵"}, {"source": "Business Insider", "title": "I spent $26,000 coloring my hair over the years. I'm finally going gray, and I wish I'd done it sooner.", "link": "https://www.businessinsider.com/stopped-dyeing-hair-after-decades-going-gray-2026-10", "summary": "Westend61/Getty Images I started dyeing my hair in my 40s after seeing a photo of myself that made me look tired. Over the decades, I spent an estimated $26,000 on hair color and touch-ups every six weeks. I finally decided to embrace my gray after meeting women my age who looked beautiful naturally. My mother had the most gorgeous hair . It was a deep, rich red that looked more like Bordeaux than carrots. My favorite photograph of her is from her modeling days when she posed as one of the original Breck girls. Three of my four grandparents were redheads . My grandmothers had the more common copper color. It was my mother's father who passed down the auburn and my other grandfather's black hair that fated my cousins and me to our very dark brown. In my family, hair was a frequent topic of conversation. For my mother, in her later years, the talk often focused on how hers wasn't turning gray. I never questioned her claim that she was miraculously maintaining her original color , even though it seemed a little incredible that no wispy whites were visible on her 60+-year-old head, while silver streaks started multiplying on mine in my early 40s. My new lighter strands didn't bother me. In fact, I liked them. I thought they added dimension to my flat brown until I looked at a photo of myself and saw a sad, tired woman. I colored my hair because I was curious Maybe I was tired because at 42, I'd become a single mother of five children ranging in age from 8 months to 16 years. Or maybe it was just natural selection. My father started to turn gray in his late 30s. No matter the reason, I decided to abandon my defiant stance of aging naturally and color my hair . I was curious about the process and what the results might be. For years, I booked appointments every six weeks, investing hundreds of dollars in dye jobs and touch-ups. I estimate that over the decades, I've spent about $26,000. But the color never felt authentic. At each visit, I told my stylist to be honest with me when I was too old to keep this up. There's nothing less attractive than an older woman with a head full of unnaturally dark hair. My dyed hair looked weird in photos I hate how artificial my hair looks in our family photos . Everyone else has soft brown, but mine looks harsh. That made me start to consider solutions like leaving a few of the pieces around my face gray. My stylist thought I was nuts, so we compromised with different formulas, but I still wasn't satisfied. It was a confluence", "date_str": "2026-10-31T15:38:01+00:00", "hash": "73a3dac871699b70", "title_fa": "من در طول این سال ها 26000 دلار برای رنگ کردن موهایم خرج کردم. بالاخره دارم خاکستری می شوم و ای کاش زودتر این کار را می کردم.", "summary_fa": "Westend61/Getty Images من در 40 سالگی پس از دیدن عکسی از خودم که باعث خستگی من شد شروع به رنگ کردن موهایم کردم. در طول دهه‌ها، من هر شش هفته یکبار حدود 26000 دلار برای رنگ مو و اصلاح آن هزینه کردم. سرانجام پس از آشنایی با زنان هم سن و سال خود که به طور طبیعی زیبا به نظر می رسیدند، تصمیم گرفتم خاکستری خود را در آغوش بگیرم. مادرم زیباترین موها را داشت. رنگ قرمز پررنگ و عمیقی بود که بیشتر شبیه بوردو بود تا هویج. عکس مورد علاقه من از او مربوط به روزهای مدلینگ اوست که به عنوان یکی از دختران اصلی برک ژست گرفته است. سه تا از چهار پدربزرگ و مادربزرگ من مو قرمز بودند. مادربزرگ‌های من رنگ مسی رایج‌تری داشتند. این پدر مادرم بود که موهای سیاه و سفید پدربزرگ دیگرم را به رنگ قهوه‌ای تیره‌مان منتقل کرد. در خانواده من، مو موضوع مکرر گفتگو بود. برای مادرم، در سال‌های آخر زندگی، صحبت‌ها اغلب بر این بود که چگونه مادرم خاکستری نمی‌شد. من هرگز ادعای او را مبنی بر اینکه به طور معجزه آسایی رنگ اصلی خود را حفظ می کرد زیر سوال نبردم، حتی اگر کمی باورنکردنی به نظر می رسید که هیچ رنگ سفیدی روی سر 60+ ساله او دیده نمی شد، در حالی که رگه های نقره در اوایل 40 سالگی من شروع به تکثیر روی سر من کردند. رشته های سبک تر جدیدم آزارم نمی داد. در واقع من آنها را دوست داشتم. فکر کردم آنها به رنگ قهوه ای صاف من بعد اضافه کردند تا اینکه به عکسی از خودم نگاه کردم و زنی غمگین و خسته را دیدم. من موهایم را رنگ کردم چون کنجکاو بودم شاید خسته بودم چون در 42 سالگی مادر تنها 5 فرزند از 8 ماهگی تا 16 سالگی شدم. یا شاید فقط", "image_url": "https://i.insider.com/6ad78b05e50b02f612be534b?width=1200&format=jpeg", "category": "هوش مصنوعی مولد", "tags": ["فناوری", "نوآوری"], "datetime_fa": "۹ آبان • ۱۹:۰۸"}, {"source": "Business Insider", "title": "I paid $1.6 million for the Lizzie Borden House. I wasn't prepared for what I found inside.", "link": "https://www.businessinsider.com/living-lalaurie-mansion-new-orleans-haunted-house-2026-10", "summary": "Lance Zaal owns several properties in the US. Courtesy of Lance Zaal Lance Zaal lives in the LaLaurie Mansion, a reportedly haunted property in New Orleans. His foray into ghostly properties began when he purchased the Lizzie Borden house in 2021. He wants these properties to highlight history, not just the paranormal, he says. This as-told-to essay is based on a conversation with Lance Zaal, president of US Ghost Adventures . Zaal was the subject of a recent Business Insider story . It has been edited for length and clarity . When I heard that the Lizzie Borden House was for sale in 2021, I was immediately fascinated. Most people know the famous nursery rhyme: \" Lizzie Borden took an axe…\" But few know the history of the home where the crime occurred. They don't realize that the 1892 case was one of the earliest and most widespread use of crime scene photos. Or that Lizzie was tried by an all-male jury and quickly acquitted, with the case still unsolved . When I took over the property, those weren't the scariest details. What was more terrifying was the state of the place. There were rotten doors I could put my hands through, and a toxic workplace full of employees who couldn't stand each other. Too often, historic properties are treated as cash cows and not reinvested in. I take the opposite approach: I believe these buildings with difficult and uncomfortable histories need to be cared for and accessible to everyone. I started with food tours before buying haunted properties I never wanted to become an entrepreneur. When I lost my job in tech consulting, I planned to get another, but as I did that, I explored creating my own business: food tours. By 2014, I was making more money running tours than I had as a consultant. Over time, I realized that haunted tours had strong demand and started incorporating them into my company in various cities. Buying the Borden House for $1.6 million was a natural progression for my business — a way to venture into hospitality and have a brick-and-mortar space. Lance Zaal bought the Borden House for $1.6 million. Courtesy of Lance Zaal Since then, I've expanded into other properties with sordid pasts. My company owns the Villisca Axe Murders House — the Iowa home where eight people were killed in an unsolved attack — and the Welty House, the site of fierce fighting during the Battle of Gettysburg. Since 2024, I've lived in the LaLaurie Mansion, supposedly New Orleans' most haunted property. Highlighting history, not just ", "date_str": "2026-10-31T15:12:01+00:00", "hash": "6b380c32a2e3e230", "title_fa": "من 1.6 میلیون دلار برای خانه لیزی بوردن پرداخت کردم. من برای چیزی که در داخل پیدا کردم آماده نبودم.", "summary_fa": "لنس زال دارای چندین ملک در ایالات متحده است. با حسن نیت از لنس زال لنس زال در عمارت LaLaurie زندگی می کند، یک ملک خالی از سکنه در نیواورلئان. هجوم او به املاک ارواح با خرید خانه لیزی بوردن در سال 2021 آغاز شد. او می‌گوید که او می‌خواهد این املاک تاریخ را برجسته کنند، نه فقط ماوراء الطبیعه. این مقاله همانطور که گفته شد بر اساس گفتگو با لنس زال، رئیس US Ghost Adventures است. زال موضوع یک داستان اخیر Business Insider بود. برای طول و وضوح ویرایش شده است. وقتی شنیدم که خانه لیزی بوردن در سال 2021 برای فروش است، بلافاصله مجذوب شدم. اکثر مردم قافیه معروف مهد کودک را می شناسند: \"لیزی بوردن تبر گرفت...\" اما تعداد کمی از تاریخ خانه ای که جنایت در آن رخ داده است می دانند. آنها متوجه نیستند که پرونده 1892 یکی از اولین و گسترده ترین موارد استفاده از عکس های صحنه جرم بوده است. یا اینکه لیزی توسط هیئت منصفه کاملاً مرد محاکمه شد و به سرعت تبرئه شد و پرونده هنوز حل نشده بود. وقتی ملک را تصاحب کردم، اینها ترسناک ترین جزئیات نبودند. چیزی که وحشتناک تر بود وضعیت آن مکان بود. درهای پوسیده‌ای بود که می‌توانستم دستانم را از بین ببرم، و یک محل کار سمی پر از کارمندانی که نمی‌توانستند یکدیگر را تحمل کنند. اغلب اوقات، اموال تاریخی به عنوان گاوهای نقدی تلقی می شوند و در آنها سرمایه گذاری مجدد نمی شود. من رویکرد مخالف را در پیش می گیرم: من معتقدم این ساختمان ها با تاریخچه دشوار و ناراحت کننده نیاز به مراقبت دارند و برای همه قابل دسترسی هستند. من قبل از خرید ملک های جن زده با تورهای غذایی شروع کردم و هرگز نمی خواستم کارآفرین شوم. وقتی شغلم را در مشاوره فناوری از دست دادم، برنامه‌ریزی کردم که", "image_url": "https://i.insider.com/6ad78f3b2428f6b455814056?width=1200&format=jpeg", "category": "هوش مصنوعی مولد", "tags": ["فناوری", "نوآوری"], "datetime_fa": "۹ آبان • ۱۸:۴۲"}, {"source": "Business Insider", "title": "I took a round-trip ferry to a stunning island off the coast of California for $122. It was the perfect day trip.", "link": "https://www.businessinsider.com/took-trip-to-island-in-california-catalina-express-ferry-review-2026-10", "summary": "I took a trip to Catalina Island, located off the coast of Los Angeles. Allison Tibaldi I took the Catalina Express ferry to Catalina Island , a gorgeous spot off the coast of California. For $61 each way, I enjoyed an upgraded ferry experience with snacks and priority boarding. On the island, I had a great time exploring and taking a guided kayaking tour. When I recently flew out to Southern California to visit my two young-adult children, I had some time to myself while they were both busy working. So, I decided to plan a day trip to Catalina Island, a spot many travelers describe as a stunning locale with a European feel. One of the state's Channel Islands, Catalina is located about 22 miles off the coast of Los Angeles and is easy to reach by ferry. So, I decided to book the one-hour journey from Long Beach to Avalon, Catalina's main tourist hub, with Catalina Express. There were four departures scheduled that day, a Wednesday in October. I selected 9:50 a.m., the Goldilocks of departure times — not too early or too late. Luckily, I was even able to use my first-ever senior discount and secure $5 off my ticket. For $61 each way (after the discount), I booked an upgraded ticket with priority boarding , access to a special seating area called the Commodore lounge, a drink, and a snack. This was only about $20 more than I would've paid for a standard adult ticket, which I thought seemed like a solid value. Here's what the experience was like. I started my day at the Catalina Landing in Downtown Long Beach. Allison Tibaldi I arrived at the Catalina Express terminal in Long Beach an hour early. I gave myself ample time to get there, since I know how awful Los Angeles traffic can be. Luckily, plenty of indoor seating and clean restrooms made the wait pleasant, and I read the Los Angeles Times to pass the time. About 25 minutes before the ferry was set to depart, I heard the announcement that Commodore lounge passengers could go outside and board first. The process was easy and organized. The Commodore lounge wasn t crowded. Allison Tibaldi Upon entering the lounge, I saw individual packets of Chex Mix and chocolate-chip cookies in a basket. I took one of each and selected a padded window seat; I had the row to myself. The seats were wider than those offered in the standard class of tickets, and I thought they were comfortable. Then, a crew member came by with e": "Business Insider", "title": "Vintage photos show what London looked like 100 years ago", "link": "https://www.businessinsider.com/vintage-photos-london-century-ago-2020-7", "summary": "Flappers at the bar of a nightclub in London, circa 1925. General Photographic Agency/Getty Images A century ago, London was a bustling city, filled with culture and beautiful architecture. Poverty, however, remained an issue, with slum dwellings in parts of the city. Take a look at what life was like in London in the 1920s. Today, London is a bustling, metropolitan city, and the same could be said about the city 100 years ago . Like today, London was known for its attractions such as Piccadilly Circus, Buckingham Palace, and the River Thames. But many photos show parts of the city that are unrecognizable now. From the glamorous fashion all the way to the slum dwellings, take a look at these photos from 1920s London to see how much life has changed. An aerial shot of Trafalgar Square in London shows that parts of the city are still structurally the same 100 years later. DE AGOSTINI PICTURE LIBRARY/Getty Images In the early 1800s, the square was meant to be a cultural center of the city, and it officially got its name in 1830 after several transformations, according to the Greater London Authority . At the time, Trafalgar Square was the perfect place for children to frolic in fountains. Mirrorpix/Getty Images The fountains were built in 1845. Oxford Street no longer has any cars or buses. Fox Photos/Getty Images While Oxford Street remains lined with stores and restaurants, it has recently been pedestrianized. As of October, vehicles are no longer permitted to enter between Orchard Street and Great Portland Street. Piccadilly Circus had a similar scene of hustle and bustle 100 years ago. Topical Press Agency/Getty Images If you look closely, you can see the double-decker buses that are still popular today. Piccadilly Circus has always been a popular destination in London. Universa crosoft wants owners to trade in their unused Xbox Series X and S consoles. Here's what's behind the push, and what to know before you take the deal.", "date_str": "2026-10-31T14:00:00+00:00", "hash": "ee2ebb91582a3aad", "title_fa": "مایکروسافت واقعاً از شما می خواهد که ایکس باکسی را که از آن استفاده نمی کنید بفروشید", "summary_fa": "مایکروسافت از مالکان می خواهد که کنسول های Xbox Series X و S استفاده نشده خود را معامله کنند. در اینجا آنچه در پشت فشار وجود دارد، و آنچه باید قبل از انجام معامله بدانید، آمده است. اگر ایکس باکس شما بدون استفاده است، ممکن است ایمیلی از مایکروسافت دریافت کنید. vfhnb12/Shutterstock افزودن Engadget به Google: منبع ترجیحی Google Discover با توجه به RAMpocalypse که باعث کاهش موجودی کنسول و افزایش قیمت ها می شود، زمان خوبی برای خرید Xbox نیست. علاوه بر این، اگر در حال حاضر آخرین مدل ایکس باکس را داشته باشید، با سیل انحصاری ها مواجه نخواهید شد. استراتژی تاریخی چند پلتفرمی مایکروسافت (علی رغم نکات مثبت آن) باعث شده است که کنسول در این زمینه حتی از سونی نیز عقب بماند. با این حال، مایکروسافت ظاهرا کمپینی را برای افزایش عرضه و در عین حال ارائه خدمات به مشتریان ناراضی طراحی کرده است. در نتیجه تقاضای مداوم برای رم از بخش هوش مصنوعی (که در بخش کوچکی توسط خود مایکروسافت ایجاد شد)، افزایش قیمت دیگری برای کنسول‌های Xbox Series X و S در ماه ژوئن اعلام شد - درست پس از افزایش قیمت در اکتبر گذشته. در همان اعلامیه، مایکروسافت تعدادی از اقداماتی که برای کاهش ضربه انجام خواهد داد را فهرست کرد. یکی از این موارد به تازگی در حال آشکار شدن است، با کمپین مایکروسافت برای ترغیب کاربران به تجارت در کنسول های استفاده نشده خود. Craig T Fruchtman/Getty Images در اوایل این ماه، همانطور که برای اولین بار توسط PowerUpGaming پوشش داده شد، ایکس باکس شروع به ارسال ایمیل به کاربران خاص در مورد فرصتی برای معامله در کنسول Series X و S خود کرد. در این ایمیل ها آمده است: \"مدتی است روی کنسول خود بازی نکرده اید؟\" و در ادامه به تجارت مرجع در Best Buy برای \"بازگشت تا 375", "image_url": "https://www.engadget.com/img/gallery/microsoft-really-wants-you-to-sell-that-xbox-youre-not-using/l-intro-1793129533.jpg", "category": "هوش مصنوعی مولد", "tags": ["هوش مصنوعی", "Google", "Microsoft"], "datetime_fa": "۹ آبان • ۱۷:۳۰"}, {"source": "Engadget", "title": "CDs are back, but they come with a modern problem", "link": "https://www.engadget.com/2298767/cds-are-back-modern-listening-complicated/", "summary": "With CD sales on the rise again, collectors are finding that enjoying their favorite tunes is more challenging than ever in the modern audio landscape.", "date_str": "2026-10-31T13:45:00+00:00", "hash": "a9cd6823987f3b51", "title_fa": "سی‌دی‌ها بازگشته‌اند، اما با یک مشکل مدرن عرضه می‌شوند", "summary_fa": "با افزایش دوباره فروش سی دی، مجموعه داران در می یابند که لذت بردن از آهنگ های مورد علاقه شان در منظره صوتی مدرن چالش برانگیزتر از همیشه است. کلکسیونرها برای لذت بردن از آهنگ های مورد علاقه خود مشکل دارند. آنا بلن گارسیا سانچز/Shutterstock افزودن Engadget به Google: منبع برگزیده Google Discover برای سال‌ها، صفحات وینیل سلطان روایت بازگشت رسانه‌های فیزیکی بوده است. همانطور که پیش می‌رود، در عصر دیجیتال - سرد، غیرشخصی، بی‌متن - هیچ چیز مانند گرمای صداهای وینیل نیست. (تا زمانی که مجبور شوید کل مجموعه خود را به حالت دیگری منتقل کنید.) با این حال، سی دی ها ممکن است آماده باشند تا فرمت مورد علاقه خود را از بین ببرند. گزارشی از Luminate که داده‌ها و تحلیل‌های صنعت سرگرمی را ردیابی می‌کند، نشان می‌دهد که فروش سی‌دی در نیمه اول سال 2026 16 درصد افزایش یافته و به حدود 16.3 میلیون دستگاه در ایالات متحده رسیده است. این اولین باری نیست که فروش سی دی جهشی داشته است. این گزارش اشاره می کند که بخشی از رشد از انتشارات کلکسیونی کی پاپ حاصل شده است. دیگر ناظران صنعت و مفسران حدس می‌زنند که علاقه ژنرال Z که ناشی از نوستالژی است نیز می‌تواند عاملی باشد. به هر حال، اگر آنها به دوربین‌های مربوط به دهه 2000 علاقه‌مند هستند، چرا سی‌دی‌ها هم نباشند؟ صرف نظر از نسل یا دلیل پذیرش سی دی ها، راه اندازی یک مجموعه با چالش های مدرن و همچنین مزایایی همراه است که در سرویس پخش انتخابی شما وجود ندارد. در اینجا مزایا و محدودیت‌های ورود به سی‌دی‌ها (یا بازگشت به آن) وجود دارد. Charday Pe e it promised financial stability. Instead, she was competing against experienced engineers, other graduates, and potentially AI itself. \"It's a bloodbath,\" she told me. We've stayed in touch ever since. I've sent her articles, offered (unsolicited!) career advice, and occasionally shared my own professional struggles. She's kept me updated on the job hunt, her volunteer work, and the fellowships she pursued to gain experience. In June, she was still searching. But she was learning new skills, building websites, and meeting people. Then, last week, an email arrived. \"I have great news: I started my first full time job as a software engineer!\" she wrote. Kiran is now working for the Virginia Digital Service, the state's government technology modernization team. She's moved from Los Angeles to Richmond, Virginia, and is settling into her new life. Yessss! Nothing feels better than to share in other people's success, without doing any of the work. Are robots really scary? Seriously, though: Kiran's experience is worth remembering as we confront another frightening prediction about the future of work: Robots are coming for everyone's jobs. Business Insider recently launched Robonomics , a major reporting series examining how AI-powered robots could transform work, businesses, and the economy. One story, by my colleague Eugene Kim , takes us inside an enormous Amazon warehouse in Tracy, California . The facility is packed with robots that move shelves, sort packages, and transport carts. Jobs that once required people to walk ", "date_str": "2026-10-31T14:00:01+00:00", "hash": "007f883a29b7f738", "title_fa": "یک فارغ التحصیل علوم کامپیوتر به من چیزهای زیادی در مورد یافتن کار در عصر هوش مصنوعی آموخت. در اینجا چیزی است که برای به دست آوردن اولین کار بزرگ لازم است.", "summary_fa": "", "image_url": "https://i.insider.com/6ae4ffc2f3bee449b3d29d2d?width=1200&format=jpeg", "category": "هوش مصنوعی مولد", "tags": ["هوش مصنوعی"], "datetime_fa": "۹ آبان • ۱۷:۳۰"}, {"source": "B cult for humans to keep up, and are looking to software for solutions. Concern that the speed and scale of future warfare could be too great for humans to handle without help is growing; however, Army officials have said artificial intelligence can help soldiers process large amounts of data from sensors and networks to deliver potential responses in a fight. At the Association of the United States Army convention in Washington, DC, last month, service leaders and soldiers spoke about using AI to process battlefield data and help troops make decisions without removing humans from the process. \"I think it's important to use super intelligence… for things that humans aren't necessarily good at, and that's speed and scale,\" Brig. Gen. Steven Carpenter, head of Multi-Domain Command Europe, told Business Insider, \"but I also know we shouldn't take humans completely out of the loop.\" Earlier this year, Carpenter told reporters that US forces in Europe needed to be prepared to process more than 1,500 potential targets a day while also defending against as many as 1,200 incoming missiles and drones. That volume of targets and threats could overwhelm human analysts, but AI could help them keep up. In a conflict, soldiers could use AI to analyze battlefield data and targets based on a commander's objectives and other parameters. The system could then assess available military capabilities and recommend responses, from conventional weapons strikes to electronic warfare or cyber operations. The entire process is intended to move quickly, but officials say speed isn't the only benefit. AI can also remember or recognize patterns that humans might forget or not even notice in the first place. And all of that information provides commanders with options. AI and autonomy are quickly being integrated across uncrewed systems, command and control processes, and o", "date_str": "2026-10-31T13:27:01+00:00", "hash": "9ee9ac4d630b07fb", "title_fa": "نیروهای ایالات متحده در اروپا برای \ ong in hospitality", "link": "https://www.businessinsider.com/property-manager-vacation-rentals-hospitality-burnout-2026-10", "summary": "Paul Burke built a 64-home rental portfolio from scratch in Colorado, and sold it in two years. Courtesy of Paul Burke Paul Burke used his business and tech background to build a vacation rental portfolio in Colorado. Burke exited after two years, saying that the hospitality industry took a toll on him. Burke later founded a company for vacation rental operators, drawing on the experience he gained. This as-told-to essay is based on a conversation with Paul Burke, 42, the CEO and cofounder of Vantory, an AI startup that streamlines vacation rental operations for property managers. He previously built a 64-home rental portfolio in Colorado and sold it in 2026 after two years. The following has been edited for length and clarity. If you'd asked me two years ago if I'd ever be running a property management company, I probably would've told you you're crazy. One of my sisters lives in Winter Park, Colorado . She's a real estate agent, and I was visiting her and met her boss, who owns the brokerage. He invited me into his office that weekend, and he gave me this whole pitch on Winter Park and how billions of dollars are being invested in it, and there's all this opportunity. I thought he was trying to sell me a house, and he was like, \"We've got this brokerage, but we've wanted a property management company for five years, but we haven't found the right partner to build it with. We think you're that guy.\" Those opportunities don't just fall into your lap. I'd sold my previous tech company and was trying to figure out what was next, so I jumped at it. A jacuzzi at one of Burke s properties. Courtesy of Paul Burke Winter Park is not like Aspen. It was known for a very long time as the economical ski resort. People who were getting priced out or sick of the insane prices of the Vails and the Aspens were starting to come to Winter Park. انه‌ای به من بفروشد، و او می‌گوید: \"ما این کارگزاری را داریم، اما پنج سال است که یک شرکت مدیریت املاک می‌خواهیم، ​​اما شریک مناسبی برای ساختن آن پیدا نکرده‌ایم. ما فکر می‌کنیم شما آن مرد هستید.\" این فرصت‌ها فقط در دامان شما نمی‌افتند.", "image_url": "https://i.insider.com/6ae22fb6e793e12971426502?width=1200&format=jpeg", "category": "هوش مصنوعی مولد", "tags": ["هوش مصنوعی", "عامل‌های هوشمند"], "datetime_fa": "۹ آبان • ۱۶:۵۰"}],

      const f = ['۰','۱','۲','۳','۴','۵','۶','۷','۸','۹'];
      return n.toString().replace(/\d/g, d => f[d]);
    }

    function toggleRead(hash) {
      if (readArticles.has(hash)) {
        readArticles.delete(hash);
      } else {
        readArticles.add(hash);
      }
      localStorage.setItem('read_articles_registry', JSON.stringify(Array.from(readArticles)));
      renderNews();
    }

    function renderNews() {
      const container = document.getElementById('newsContainer');
      const rawItems = data[currentTab] || [];
      
      const filtered = rawItems.filter(item => {
        if (!searchQuery) return true;
        const q = searchQuery.toLowerCase();
        const title = (item.title_fa || item.title || '').toLowerCase();
        const summary = (item.summary_fa || item.summary || '').toLowerCase();
        const source = (item.source || '').toLowerCase();
        const category = (item.category || '').toLowerCase();
        const tags = (item.tags || []).join(' ').toLowerCase();
        return title.includes(q) || summary.includes(q) || source.includes(q) || category.includes(q) || tags.includes(q);
      });

      const unreadList = [];
      const readList = [];

      filtered.forEach(item => {
        if (readArticles.has(item.hash)) {
          readList.push(item);
        } else {
          unreadList.push(item);
        }
      });

      const sortedItems = [...unreadList, ...readList];

      if (sortedItems.length === 0) {
        container.innerHTML = '<div style="text-align:center; padding: 40px; color: var(--text-muted);">هیچ خبری در این بخش در ۲۴ ساعت گذشته ثبت نشده است.</div>';
        return;
      }

      container.innerHTML = sortedItems.map((item, idx) => {

        const summary = item.summary_fa || item.summary || '';
        const source = item.source || 'منبع خبر';
        const link = item.link || '#';
        const isRead = readArticles.has(item.hash);
        const num = toFaDigits(idx + 1);
        const category = item.category || '';
        const tags = item.tags || [];
        const datetimeFa = item.datetime_fa || '';

        return `
          <article class="news-card ${isRead ? 'is-read' : ''}" id="card-${item.hash}">
            <div class="news-header">
              <span class="news-num">${isRead ? '✓' : num}</span>
              <h2 class="news-title">${title}</h2>
            </div>
            ${summary ? `<p class="news-summary">${summary}</p>` : ''}
            <div class="news-footer">
              <div class="footer-top-row">
                <div class="meta-group">
                  <span class="news-source">📌 ${source}</span>
                  ${datetimeFa ? `<span class="news-datetime">🕒 ${datetimeFa}</span>` : ''}
                  ${category ? `<span class="news-category-badge" onclick="filterByTag('${category}')">📂 ${category}</span>` : ''}
                </div>
              </div>
              ${tags && tags.length > 0 ? `
                <div class="footer-tags-row">
                  ${tags.map(t => `<span class="news-tag-chip" onclick="filterByTag('${t}')">#${t}</span>`).join('')}
                </div>
              ` : ''}
              <div class="footer-bottom-row">
                <div class="footer-actions-right">
                  <button class="btn-mark-read" onclick="toggleRead('${item.hash}')">
                    ${isRead ? '✓ خوانده شد' : '○ علامت خوانده‌شده'}
                  </button>
                </div>
                <div class="footer-actions-left">
                  ${link && link.startsWith('http') ? `<a href="${link}" target="_blank" rel="noopener noreferrer" class="news-link">مطالعه اصل خبر ↗</a>` : ''}
                </div>
              </div>
            </div>
          </article>
        `;
      }).join('');
    }

    function filterByTag(val) {
      const searchInput = document.getElementById('searchInput');
      if (searchInput) {
        searchInput.value = val;
        searchQuery = val;
        renderNews();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    }

    function switchTab(tab, el) {
      currentTab = tab;
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      if (el) el.classList.add('active');
      renderNews();
    }

    function toggleTheme() {
      const html = document.documentElement;
      const current = html.getAttribute('data-theme') || 'dark';
      const next = current === 'dark' ? 'light' : 'dark';
      html.setAttribute('data-theme', next);
      localStorage.setItem('theme', next);
      updateThemeButton(next);
    }

    function updateThemeButton(theme) {
      const icon = document.getElementById('themeIcon');
      const text = document.getElementById('themeText');
      if (theme === 'dark') {
        icon.textContent = '☀️';
        text.textContent = 'حالت روشن';
      } else {
        icon.textContent = '🌙';
        text.textContent = 'حالت تاریک';
      }
    }

    function toggleArchiveModal(show) {
      const modal = document.getElementById('archiveModal');
      if (show) {
        renderArchiveList();
        modal.classList.add('active');
      } else {
        modal.classList.remove('active');
      }
    }

    function renderArchiveList() {
      const listContainer = document.getElementById('archiveListContainer');
      if (!archiveManifest || archiveManifest.length === 0) {
        listContainer.innerHTML = '<div style="text-align:center; padding: 20px; color: var(--text-muted);">هنوز شماره قبلی ثبت نشده است.</div>';
        return;
      }

      listContainer.innerHTML = archiveManifest.map(item => `
        <a href="${item.url}" class="archive-item">
          <div>
            <div class="archive-date-fa">📰 شماره ${item.p_date}</div>
            <div class="archive-date-g">🌍 ${item.g_date}</div>
          </div>
          <span class="archive-arrow">←</span>
        </a>
      `).join('');
    }

    const savedTheme = localStorage.getItem('theme') || 'dark';
    document.documentElement.setAttribute('data-theme', savedTheme);
    updateThemeButton(savedTheme);

    document.getElementById('searchInput').addEventListener('input', (e) => {
      searchQuery = e.target.value.trim();
      renderNews();
    });

    renderNews();
  </script>
