MS NOW. For October 2026, Fox News is on [ ]", "date_str": "2026-10-28T15:10:23+00:00", "hash": "bae09e4f78b1c44f", "title_fa": "رتبه‌بندی فاکس نیوز در ماه اکتبر به میزان خیره کننده 27 درصد کاهش یافت، اما همچنان مخاطبان بسیار بیشتری نسبت به CNN یا MS NOW دارد.", "summary_fa": "طبق داده‌های جدید، در آستانه انتخابات میان‌دوره‌ای ۲۰۲۶، فاکس نیوز بیش از یک چهارم مخاطبان کلی خود را در ماه اکتبر از دست داد. گفته می‌شود، این شبکه همچنان پربیننده‌ترین رسانه خبری کابلی است و بسیار جلوتر از رقبای CNN و MS NOW است. برای اکتبر 2026، فاکس نیوز روشن است [ ] این کاهش رتبه‌بندی در بحبوحه ادامه افت بینندگان تلویزیونی به طور کلی اتفاق می‌افتد، اما فاکس نیوز در یک کلیپ دو رقمی بینندگان خود را از دست داده است زیرا CNN و MS NOW در ماه‌های اخیر کمی افزایش یافته‌اند. همانطور که ورایتی گزارش کرده است، فاکس نیوز در بسیاری از شب ها مخاطبان زنده بیشتری را نسبت به یک یا چند شبکه تلویزیونی پخش می کند. اما بینندگان آن به طور پیوسته در حال کاهش است: در سه ماهه سوم سال 2026، فاکس نیوز شاهد کاهش 16 درصدی بینندگان کل روز بود و بینندگان در نسخه نمایشی 25 تا 54 24 درصد کاهش یافت. هر دو CNN و MS NOW در سه ماهه سوم شاهد افزایش اندکی در مخاطبان کلی بودند. طبق داده‌های نیلسن، فاکس نیوز در ماه اکتبر به طور متوسط ​​حدود 2 میلیون بیننده (کاهش 28 درصدی نسبت به سال) داشت که بینندگان در نسخه نمایشی 25 تا 54 با کاهش 36 درصدی به 183000 نفر رسید. فاکس فرندز دومین ماه متوالی خود را کمتر از 1 میلیون بیننده و کمتر از 100000 در دموی کلیدی داشت که اکتبر کمترین تعداد بیننده را از جولای 2015 نشان می‌دهد (و کمترین تعداد بینندگان 25 تا 54 از ژوئن 2001). در همین حال، طبق آمار اولیه نیلسن، رقیب پیشرو MS NOW شاهد افزایش 16 درصدی مخاطبان روزانه خود بود و به 588000 بیننده در ماه اکتبر رسید و بینندگان CNN در همان بازه زمانی 3 درصد افزایش یافت و به 402000 بیننده رسید. Variety برای اظهار", "image_url": "https://variety.com/wp-content/uploads/2021/08/Fox-News-Channel.png?w=888&#038;h=500&#038;crop=1", "category": "هوش مصنوعی مولد", "tags": ["رسانه", "هنر"], "datetime_fa": "۶ آبان • ۱۸:۴۰"}, {"source": "Variety", "title": "Jamie Dornan Says There’s ‘Pressure’ to Taking Over Aragorn Role in ‘Lord of the Rings: Hunt for Gollum’: I’m Not ‘Trying to Outdo’ Viggo Mortensen", "link": "https://variety.com/2026/film/news/hunt-for-gollum-jamie-dornan-aragorn-lord-of-rings-1236933354/", "summary": "Jamie Dornan is stepping into the shoes of Aragorn in The Lord of the Rings: The Hunt for Gollum, after the hero was famously played by Viggo Mortensen in the original LOTR trilogy. Dornan spoke to L Officiel (translated by Slash Film) about taking on the role and playing a younger version in the prequel. “There’s [ ]", "date_str": "2026-10-28T15:02:36+00:00", "hash": "565ba33534441f88", "title_fa": "جیمی دورنان می‌گوید «فشاری» برای تصاحب نقش آراگورن در «ارباب حلقه‌ها: شکار گولوم» وجود دارد: «سعی نمی‌کنم از ویگو مورتنسن پیشی بگیرم».", "summary_fa": "جیمی دورنان به جای آراگورن در The Lord of the Rings: The Hunt for Gollum، پس از نقش معروف این قهرمان توسط ویگو مورتنسن در سه گانه اصلی LOTR، قدم می گذارد. دورنان با L Officiel (ترجمه شده توسط اسلش فیلم) در مورد ایفای نقش و ایفای یک نسخه جوانتر در پیش درآمد صحبت کرد. وقتی می‌خواهید دنباله‌روی کنید، [ ] فشار وجود دارد. از من خواسته شده که نقشی فوق العاده نمادین بازی کنم و من تمام تلاشم را خواهم کرد. اما برای من، آراگورن همیشه فقط ویگو خواهد بود. بازی او یکی از بازی های مورد علاقه من است و من احساس افتخار می کنم که سعی کنم حداقل بخشی از انرژی را که او در ابتدا به شخصیت آورده بود دوباره به دست بیاورم. دورنان گفت هیچ بخشی از من نیست که بخواهد از او پیشی بگیرد. داستان‌های مرتبط گیلرمو دل تورو وقتی می‌گوید: «دنیایی را خراب می‌کنیم» اشک می‌ریزد: «این که سه نسل بعدی را شکست می‌دهند بسیار دردسرساز است» The Hunt for Gollum به کارگردانی و بازیگری اندی سرکیس است که صدا و ضبط حرکت هابیت CGI را در سه‌گانه اصلی ارائه کرده است. سرکیس، که همچنین کارگردانی Mowgli: Legend of the Jungle، Venom: Let There Be Carnage و غیره را بر عهده داشته است، دومین کارگردان واحد در سه گانه هابیت پیتر جکسون بود. The Hunt for Gollum که یک فیلم مستقل است، اولین باری است که او به عنوان کارگردان اصلی در یکی از فیلم‌های فرانچایز فانتزی نقش آفرینی می‌کند. علاوه بر بازگشت سرکیس به سرزمین میانه، The Hunt for Gollum ایان مک کلن را در نقش گندالف و الیجا وود را در نقش فرودو بازگرداند. تازه واردها عبارتند از کیت وینسلت، لئو وودال، لی پیس و آنیا تیلور جوی. فیلم جدید از دیدگاه گولوم روایت می شود زیرا گندالف آراگورن جوان را", "image_url": "https://variety.com/wp-content/uploads/2026/10/dior-homme-photocall-paris-fashion-week-menswear-fall-winter-1000x667-1.jpg?w=1000&#038;h=563&#038;crop=1", "category": "هوش مصنوعی مولد", "tags": ["سینما"], "datetime_fa": "۶ آبان • ۱۸:۳۲"}, {"source": "Billboard", "title": "Harry Shum Jr. and Jenna Johnson Scare Up a Wickedly Spooky Dance to a Britney Spears Classic on ‘DWTS’: Watch", "link": "https://www.billboard.com/culture/tv-film/harry-shum-johnson-spooky-dance-britney-spears-toxic-dwts-watch-1236369531/", "summary": "It was a frightfully entertaining night on Dancing With the Stars on Tuesday (Oct. 27) when the show got into the Halloween spirit a few days early on a Horror Movie Night -themed episode. And nobody nailed the combination of scares and flawless steps more than Glee alum Harry Shum Jr. and his professional dance partner Jenna Johnson. Related ADÉLA Says The Baddest Bi es Ain t in LA, But Hot Topic Thinks Otherwise: Shop Exclusive Prima Merch Online The Glee Reboot Is Officially in the Works Julia Stiles Pays Emotional Tribute to Late 10 Things I Hate About You Co-Star Heath Ledger on Dancing With the Stars : Watch Shum hit the stage in a blood-soaked white shirt and tie, his face dripping with viscera as Johnson stalked him across the floor in a look inspired by the Saw horror franchise. Dancing to 2WEI s cover of Britney Spears 2004 hit Toxic, the pair did a high-energy contemporary routine full of daring lifts, spins and one impressive move where Johnson sat on Shum s shoulder and then lay down flat to form a human T shape. The acrobatic routine rushed to a conclusion with Johnson grabbing Shum and ripping off his tie, sending the actor crashing to the ground, convulsing, as each attempt to get up was met by his partner repeatedly shoving him down with her foot. The dance ended on the creepiest of notes, with Saw s Billy the Puppet rolling onto the stage on his squeaky tricycle. The dance clearly landed with the judges, with guest adjudicator Shirley Ballas saying she d never seen anything like it and Bruno Toniolo dubbing it perfect, leading to the first 40/40 perfect score of the season so far. Because there was no elimination during last week s Dedication Night, two stars were sent packing on Tuesday, marking the last dance for The Bachelorette s Tyler Cameron and his partner Sharna Burgess — who did a Dracula-themed Viennese waltz to Annie Lennox s Love Song For a Vampire — and Savannah Bananas player Jackson Olson and professional partner Emma Slater, who did a Joker -inspired routine to Frank Sinatra s That s Life. DWTS airs live on Tuesdays at 8 p.m. ET on ABC and Disney+ and streams the next day on Hulu. Watch Shum and Johnson get Toxic below.", "date_str": "2026-10-28T15:00:31+00:00", "hash": "21ed8c1f212f39f0", "title_fa": "هری شوم جونیور و جنا جانسون در DWTS یک رقص وحشتناک وحشتناک را با یک کلاسیک بریتنی اسپیرز می ترسانند: تماشا کنید", "summary_fa": "این یک شب سرگرم‌کننده وحشتناک در Dancing With the Stars در روز سه‌شنبه (۲۷ اکتبر) بود، زمانی که نمایش چند روز زودتر در یک قسمت با مضمون شب فیلم ترسناک به روح هالووین رسید. و هیچ کس بیشتر از زاج Glee Harry Shum Jr و شریک رقص حرفه ای او Jenna Johnson، ترکیبی از ترس ها و گام های بی عیب و نقص را نمیخکوب کرد. ADÉLA می گوید بدترین چیز در لس آنجلس است، اما موضوع داغ به گونه ای دیگر فکر می کند: خرید آنلاین کالای انحصاری Prima را انجام می دهد. پیراهن و کراوات سفید آغشته به خون، در حالی که جانسون با نگاهی الهام‌گرفته از فرنچایز ترسناک Saw، او را روی زمین تعقیب می‌کرد. این زوج با رقصیدن روی جلد 2WEI از بریتنی اسپیرز 2004، یک روال معاصر پرانرژی پر از بلند کردن جسورانه، چرخش و یک حرکت چشمگیر انجام دادند که در آن جانسون روی شانه شوم نشست و سپس صاف دراز کشید تا به شکل T انسان شکل بگیرد. روال آکروباتیک با عجله به پایان رسید و جانسون شوم را گرفت و کراواتش را پاره کرد، بازیگر را به زمین خورد و تشنج کرد، زیرا هر تلاشی برای بلند شدن توسط شریک زندگی‌اش که مکرراً او را با پا به پایین هل می‌داد، مواجه می‌شد. رقص با ترسناک ترین نت ها به پایان رسید، بیلی عروسک اره که با سه چرخه جیرجیر خود روی صحنه می غلتید. رقص به وضوح با داوران روبرو شد، شرلی بالاس داور مهمان گفت که هرگز چیزی شبیه به آن ندیده است و برونو تونیولو آن را کامل دوبله کرده است، که منجر به اولین امتیاز عالی 40/40 فصل تا کنون شده است. از آنجایی که در شب تقدیم هفته گذشته حذفی وجود نداشت، دو ستاره در روز سه‌شنبه برای جمع‌آوری بسته‌بندی فرستاده شدند، که آخرین رقص تایلر کامرون،", "image_url": "https://www.billboard.com/wp-content/uploads/2026/10/harry-shum-dwts-toxic-billboard-1800.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["سینما"], "datetime_fa": "۶ آبان • ۱۸:۳۰"}, {"source": "Billboard", "title": "Westwood Recordings Enters JV With Monstercat, With Eye on Artist Development & Global Reach", "link": "https://www.billboard.com/pro/electronic-label-westwood-recordings-signs-jv-monstercat/", "summary": "Canadian independent electronic label Westwood Recordings has entered a joint venture with fellow Canadian electronic label Monstercat. The partnership will provide Westwood with access to capital, global infrastructure (including monthly royalty accounting, global digital distribution and a gaming partnerships department) and an expanded team. Westwood will continue to be based in Vancouver and run by its founder, Nick Middleton . Related Indie Electronic Label Monstercat Acquired by Create Music Group Kenny MacPherson, Veteran Music Publisher and Big Deal Music Co-Founder, Dies at 71 Diddy Moved From New Jersey Prison to Similar Facility in Pennsylvania Middleton, one half of longstanding electronic duo The Funk Hunters, founded Westwood Recordings in 2013 as a home for bass, electronic and hip-hop. The imprint s roster includes Big Gigantic, Dirtwire, Cut Chemist, Flamingosis, Maddy O Neal and Chali 2na. Beyond releases, the label has done branded events and stage takeovers at British Columbia music festivals Shambhala Music Festival and Rifflandia and Vancouver’s Malkin Bowl, an outdoor venue in the city s Stanley Park. The partnership is part of a broader expansion spurred by Monstercat s 2025 acquisition by Create Music Group, which invested $50 million in the label — funding that contributed to the new venture with Westwood. As part of the joint venture, Monstercat will support Westwood in signing new artists and recordings, expanding its release schedule, entering new genres and pursuing catalog acquisitions. The partnership will also support the launch of a publishing arm, building on Westwood’s history in synch licensing. “I’ve always respected how Monstercat has built its business, especially how transparent they are with their artists and how connected they are to their fans. Those things matter a lot to me, and we’ve built Westwood with that same care,” Middleton said in a statement. “After more than a decade of running Westwood independently, I know how much the right support can mean for an artist or a record. This partnership gives us the backing to put more behind the music we believe in, be more ambitious with the artists and projects we take on, and open more doors for the people we work with. We’ve built something special with Westwood, and there’s a lot more I want to do. After years of working together, the trust I have in Daniel and the Monstercat team is a big part of why this feels right. They understand what we’re building and wan", "date_str": "2026-10-28T15:00:00+00:00", "hash": "7e7a262e987327d7", "title_fa": "Westwood Recordings با Monstercat، با چشم به توسعه هنرمندان و دسترسی جهانی وارد JV می شود", "summary_fa": "برچسب الکترونیکی مستقل کانادایی Westwood Recordings وارد یک سرمایه گذاری مشترک با همتای خود برچسب الکترونیکی کانادایی Monstercat شده است. این مشارکت به وست‌وود دسترسی به سرمایه، زیرساخت‌های جهانی (از جمله حسابداری ماهانه حق امتیاز، توزیع دیجیتال جهانی و بخش مشارکت‌های بازی) و یک تیم گسترده را فراهم می‌کند. Westwood همچنان در ونکوور مستقر است و توسط بنیانگذار آن، نیک میدلتون اداره می شود. Label Indie Electronic Monstercat که توسط گروه موسیقی Create خریداری شد، کنی مک فرسون، ناشر کهنه کار موسیقی و یکی از بنیانگذاران Big Deal Music، در سن 71 سالگی درگذشت. باس، الکترونیک و هیپ هاپ. فهرست آثار شامل Big Gigantic، Dirtwire، Cut Chemist، Flamingosis، Maddy O Neal و Chali 2na است. علاوه بر انتشارات، این لیبل رویدادهای مارکدار و تصاحب صحنه‌ها را در جشنواره‌های موسیقی بریتیش کلمبیا جشنواره موسیقی شامبالا و Rifflandia و Malkin Bowl ونکوور، یک مکان در فضای باز در پارک استانلی شهر، انجام داده است. این مشارکت بخشی از توسعه گسترده‌تر است که توسط گروه Create Music Group در سال 2025 توسط Monstercat، که 50 میلیون دلار در این لیبل سرمایه‌گذاری کرد - سرمایه‌گذاری کرد - سرمایه‌گذاری که به سرمایه‌گذاری جدید با Westwood کمک کرد. به عنوان بخشی از سرمایه گذاری مشترک، Monstercat از Westwood در امضای قرارداد با هنرمندان و ضبط های جدید، گسترش برنامه انتشار خود، ورود به ژانرهای جدید و پیگیری خرید کاتالوگ حمایت خواهد کرد. این مشارکت همچنین از راه‌اندازی بازوی انتشاراتی که بر اساس تاریخچه وست‌وود در صدور مجوز همگام است، حمایت می‌کند. من همیشه به اینکه Monstercat چگونه کسب و کار خود را ایجاد کرده است، احترام می‌گذارم، به خصوص اینکه چقدر آنها با هنرمندان خود شفاف هستند و چقدر با طرفداران خود مرتبط هستند. میدلتون در بیانیه‌ای گفت: «پس از بیش از یک دهه مدیریت مستقل وست‌وود، می‌دانم حمایت درست چقدر می‌تواند برای یک هنرمند یا", "image_url": "", "category": "هوش مصنوعی مولد", "tags": ["موسیقی", "سرمایه‌گذاری"], "datetime_fa": "۶ آبان • ۱۸:۳۰"}, {"source": "Billboard", "title": "Brandy, Lena Waithe & More Named Members of 2026 Ebony Power 100 Honoree Court", "link": "https://www.billboard.com/music/awards/brandy-2026-ebony-power-100-honoree-1236369539/", "summary": "Grammy Award-winning artist Brandy , Emmy Award-winning writer-producer-actor Lena Waithe and Allen Media Group founder Byron Allen are three of the six special honorees who will be celebrated during the 2026 Ebony Power 100 Gala. The event will take place at the Hollywood Palladium in Los Angeles on Nov. 9. The three additional special honorees comprising the Power 100 Court are Seattle Storm WNBA player Flau jae Johnson, digital influencer and culinary tastemaker Keith Lee and NASA Astronaut Emeritus Victor Glover. Encompassing music, sports, media ownership, finance and space exploration, the court personifies the gala’s theme, “The Stories We Shape.” In accepting their award on stage, each member of the court will be honored with a dedicated tribute. “For more than 80 years, Ebony has kept the record of the people moving Black America forward, and the court is that record at its most vivid,” said Ebony CEO Eden Bridgeman in announcing the news. “They wrote it themselves, and that is exactly what this year’s Power 100 celebrates.” The ceremony will take honorees and guests inside an immersive creative world called “La Cour” — a reimagining of historical grand royal courts. Headlining the evening’s live entertainment will be Grammy winners Kirk Franklin and T.I., who will open and close the celebration, respectively. T.I. is also a member of this year’s Power 100 Music Innovators class. T.I., as well as every member of the 2026 Power 100, will be recognized during the ceremony. Additional honorees in the Music Innovators class who were previously announced include Jay-Z, Megan Thee Stallion, Durand Bernarr and Adam Blackstone. The complete list of Power 100 honorees — leaders chosen across 11 categories — is available on the Ebony website . The 2026 Ebony Power 100 Gala is produced in partnership with Jesse Collins Entertainment.", "date_str": "2026-10-28T15:00:00+00:00", "hash": "5435e903293f9249", "title_fa": "برندی، لنا ویث و سایرین اعضای نام‌گذاری شده در دادگاه Honoree Ebony Power 100 2026", "summary_fa": "برندی هنرمند برنده جایزه گرمی، لنا وایت نویسنده، تهیه کننده و بازیگر برنده جایزه امی و بایرون آلن، بنیانگذار گروه رسانه ای آلن، سه نفر از شش جایزه ویژه هستند که در مراسم جشن آبنوس پاور 100 2026 تجلیل خواهند شد. این رویداد در تاریخ 9 نوامبر در هالیوود پالادیوم در لس آنجلس برگزار خواهد شد. سه جایزه ویژه دیگر که شامل Power 100 Court هستند عبارتند از فلو جاه جانسون بازیکن WNBA سیاتل استورم، کیت لی، اینفلوئنسر دیجیتال و طعم‌دهنده آشپزی و فضانورد بازنشسته ناسا، ویکتور گلاور. این دادگاه که شامل موسیقی، ورزش، مالکیت رسانه، امور مالی و اکتشاف فضایی است، مضمون گالا، \"داستان هایی که ما شکل می دهیم\" را به تصویر می کشد. با دریافت جایزه خود بر روی صحنه، از هر یک از اعضای دادگاه با یک ادای احترام ویژه تجلیل خواهد شد. ادن بریجمن، مدیرعامل آبنوس در اعلام این خبر گفت: \"بیش از 80 سال، آبنوس سابقه افرادی را که سیاه‌پوست آمریکا را به جلو می‌برند، حفظ کرده است و دادگاه این رکورد در واضح‌ترین حالت خود است.\" آنها خودشان آن را نوشتند و این دقیقا همان چیزی است که Power 100 امسال جشن می گیرد. مراسم تجلیل‌کنندگان و مهمانان را به دنیای خلاقانه‌ای به نام «La Cour» می‌برد - تصویری دوباره از بارگاه‌های سلطنتی بزرگ. کرک فرانکلین و تی.آی برندگان جایزه گرمی، تیتر اصلی برنامه های سرگرمی زنده این شب خواهند بود که به ترتیب جشن را افتتاح و تعطیل خواهند کرد. T.I. همچنین یکی از اعضای کلاس Power 100 Music Innovators امسال است. T.I و همچنین تمامی اعضای Power 100 2026 در این مراسم مورد تقدیر قرار خواهند گرفت. برگزیدگان دیگر در کلاس نوآوران موسیقی که قبلا اعلام شده بودند عبارتند از Jay-Z، Megan Thee Stallion، Durand Bernarr و Adam Blackstone. فهرست کامل برگزیدگان Power 100 - رهبران انتخاب شده در 11 دسته", "image_url": "https://www.billboard.com/wp-content/uploads/2026/10/2258989577.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["موسیقی"], "datetime_fa": "۶ آبان • ۱۸:۳۰"}, {"source": "Billboard", "title": "Ezekiel Lewis Talks New Epic Records CEO Gig & the Art of A&R: ‘It’s Not About Genres. It’s About Artists’", "link": "https://www.billboard.com/pro/epic-records-ezekiel-lewis-ceo-role-first-time-interview/", "summary": "Ezekiel Zeke Lewis doesn t have the typical origin story of a major label CEO. He got his start as a Grammy-winning songwriter and producer in Atlanta, co-penning songs like One Less Lonely Girl by Justin Bieber and The Way I Are by Timbaland , often with his collective The Clutch, before he made his jump to the boardroom. Today, however, Lewis sees the creative journey as critical to his understanding of the music business and what artists need from their industry partners. When I got inside the building, I realized that my songwriting career and the fact that I had achieved some success was a miracle, he explains. He was fascinated by the way music moves through buildings, and he found a new calling to get inside to help creators navigate the industry with greater success. Related Molly Neuman on the Evolution of Independent Music From the 90s to Now: ‘It Was a High-Risk Business’ First, he built up his own publishing house, Bar Music Group. Then he landed an A R gig at Motown Records, where he worked his way up the ladder to become senior vp of A R by the time he left in 2018. That job was also where he first worked with legendary label executive Sylvia Rhone , who he says taught him to be diligent, never give up and never take no for an answer, as he puts it. But when Rhone left the job and took a role at Sony Music s Epic Records, where she eventually rose to become its CEO/chairman, she courted Lewis to follow her and scout the next generation of talent there. As Lewis has advanced in his career at Epic, he s played a pivotal role in shaping the careers of 21 Savage, Madison Beer, BIA, Black Eyed Peas, DDG, Future, GIVĒON, Zara Larsson, Mariah the Scientist, Travis Scott, Southside, Meghan Trainor and Tyla. When Rhone stepped away in 2025, rumors swirled that Lewis was being eyed as her successor. In March, the confirmation finally came that Lewis had been appointed CEO/chairman of Epic. Lewis joins the latest episode of Billboard On the Record in his first-ever interview as CEO and chairman to discuss what it takes to run a successful label in 2026, how he approaches A R, and how his songwriting career shaped his leadership in the boardroom. To watch this episode of Billboard On the Record , sponsored by ASCAP, check out the YouTube video below or click here for more viewing and listening options. An edited and condensed excerpt of the conversation can also be found below. You have built up your whole business career in music in A R. This historical", "date_str": "2026-10-28T14:16:06+00:00", "hash": "7dac87e2fece64c2", "title_fa": "ازکیل لوئیس درباره ژانرها صحبت می کند. درباره هنرمندان است", "summary_fa": "Ezekiel Zeke Lewis داستان منشأ معمولی یک مدیر عامل لیبل بزرگ را ندارد. او کار خود را به عنوان یک ترانه‌سرا و تهیه‌کننده برنده گرمی در آتلانتا آغاز کرد و آهنگ‌هایی مانند One Less Lonely Girl اثر جاستین بیبر و The Way I Are از تیمبالند، اغلب با گروه خود The Clutch، قبل از اینکه به اتاق هیئت مدیره بپرد، نوشت. با این حال، امروز، لوئیس سفر خلاقانه را برای درک خود از تجارت موسیقی و آنچه هنرمندان از شرکای خود در صنعت نیاز دارند، حیاتی می‌داند. او توضیح می دهد که وقتی وارد ساختمان شدم، متوجه شدم که حرفه ترانه سرایی من و این واقعیت که به موفقیت هایی دست یافته ام یک معجزه است. او مجذوب روشی بود که موسیقی در ساختمان‌ها حرکت می‌کند و فراخوان جدیدی برای ورود به داخل پیدا کرد تا به سازندگان کمک کند تا با موفقیت بیشتری در صنعت حرکت کنند. مولی نیومن در مورد تکامل موسیقی مستقل از دهه 90 تا کنون: «این یک تجارت پرخطر بود» ابتدا، او انتشارات خود را به نام گروه موسیقی بار تأسیس کرد. سپس یک کنسرت A R را در Motown Records انجام داد، جایی که از نردبان بالا رفت تا در سال 2018، معاون ارشد A R شود. این کار همچنین جایی بود که او برای اولین بار با سیلویا رون، مدیر اجرایی لیبل افسانه ای کار کرد، که به گفته او به او آموخت که سخت کوش باشد، هرگز تسلیم نشود و هرگز جواب منفی ندهد. اما زمانی که رون کار را ترک کرد و در سونی موزیک اپیک رکوردز ایفای نقش کرد، جایی که در نهایت به مدیرعاملی/رئیس آن تبدیل شد، از لوئیس خواست که او را دنبال کند و نسل بعدی استعدادها را در آنجا جستجو کند. از آنجایی که لوئیس در حرفه خود در Epic پیشرفت کرده است، او نقش اساسی", "image_url": "https://www.billboard.com/wp-content/uploads/2023/05/Ezekiel-Lewis-2023-cr-Travis-Shinn-billboard-1548.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["موسیقی"], "datetime_fa": "۶ آبان • ۱۷:۴۶"}, {"source": "Billboard", "title": "Leading U.K. Indies Distiller Records & Speedy Wunderground Launch Label Partnership With New Heartworms Material", "link": "https://www.billboard.com/pro/distiller-records-speedy-wunderground-labels-partnership/", "summary": "Leading U.K. indie record labels Distiller Records and Speedy Wunderground have launched a new partnership. The new collaboration begins with the release of Heartworms’ new single “Guess I’m Stuck in the Dark,” out Tuesday (Oct. 27). Under the new partnership, Speedy Wunderground will retain “full creative autonomy over its A R and production” and utilize Distiller’s “marketing, distribution, and operational scale to amplify its roster further,” per a joint statement. Speedy Wunderground was founded in London by producer Dan Carey and has been instrumental in shaping the sound of the capital’s indie and alternative scene for the past decade with Black Country, New Road, Squid, Black Midi and Mercury Prize winners English Teacher all releasing early material via the label. In his work as a producer, Carey has credits on studio albums by Fontaines D.C. , Wet Leg and Kneecap , among others. Distiller, led by managing director James Moodie , recently scored its first U.K. No. 1 album with Blossoms’ sixth studio album Songs From the Wedding Cake . Its roster also includes Reverend The Makers, Yonaka, Sports Team and The Ramona Flowers. Heartworms is the moniker for London-based musician Josephine Orme, who released her 2025 debut album Glutton for Punishment through Speedy Wunderground. The album charted at No. 9 on the U.K.’s Independent Albums Chart. She’ll be the lead support act for Interpol and Bloc Party ’s co-headline tour in the U.K. and Europe, beginning Nov. 20 in Birmingham. Speaking on the collaboration Moodie said, “I’ve always loved what Dan and the team at Speedy Wunderground have built, it’s a respected label brand that is the very definition of creative integrity and credibility. This partnership is about giving each artist a bigger platform, deeper resources, and the backing to push their incredible talents even further. Carey added, “It s a great partnership as the team at Distiller are really experienced and clearly understand the ethos of Speedy and the way we like to work. We re looking forward to working together on a range of different projects, from very quick turnaround punk records to big campaigns — kicking off with this week s release from Heartworms.”", "date_str": "2026-10-28T14:11:26+00:00", "hash": "9722d924b029fda0", "title_fa": "مشارکت لیبل پیشرو در هند Distiller Records & Speedy Wunderground Launch با مواد جدید Heartworms", "summary_fa": "شرکت‌های موسیقی مستقل پیشرو در بریتانیا Distiller Records و Speedy Wunderground همکاری جدیدی را راه‌اندازی کرده‌اند. همکاری جدید با انتشار تک آهنگ جدید Heartworms \"Guess I'm Stuck in the Dark\" در روز سه شنبه (27 اکتبر) آغاز می شود. طبق یک بیانیه مشترک، Speedy Wunderground بر اساس شراکت جدید، \"استقلال خلاقانه کامل در مورد A R و تولید خود\" را حفظ خواهد کرد و از \"بازاریابی، توزیع و مقیاس عملیاتی Distiller برای تقویت بیشتر فهرست خود\" استفاده خواهد کرد. Speedy Wunderground در لندن توسط تهیه کننده Dan Carey تأسیس شد و در شکل دادن به صدای صحنه مستقل و جایگزین پایتخت در دهه گذشته با برندگان Black Country، New Road، Squid، Black Midi و Mercury Prize معلم انگلیسی که همگی مطالب اولیه را از طریق این لیبل منتشر کردند، نقش اساسی داشته است. کری در کار خود به‌عنوان تهیه‌کننده، در آلبوم‌های استودیویی از فونتینز دی سی، پا خیس و کاسه زانو و غیره نام‌هایی دارد. Distiller به رهبری جیمز مودی، مدیر عامل، اخیراً اولین آلبوم شماره 1 بریتانیا را با ششمین آلبوم استودیویی Blossoms Songs From the Wedding Cake به دست آورد. فهرست آن همچنین شامل Reverend The Ma را آغاز کرد و جایزه گرمی آلبوم سال را برای او به ارمغان آورد، اما او هرگز از تنظیم آهنگ های دانیل لانوا، تهیه کننده، راضی نبود. دیلن در سال 2001 به میکال گیلمور از رولینگ استون گفت [این آلبوم] بیش از چند بار از آهنگ خارج شد و مردم ناامید شدند. اگر اراده داشتم می توانستم. من در آن زمان این کار را نکردم، و بنابراین شما باید آن را به جایی که خود رویداد می‌خواهد هدایت کنید. احساس می کنم یکسانی در ریتم ها وجود دارد.", "image_url": "https://www.rollingstone.com/wp-content/uploads/2026/10/bob-dylan-not-dark-yet.jpg?crop=0px%2C35px%2C1800px%2C1014px&#038;resize=1600%2C900", "category": "هوش مصنوعی مولد", "tags": ["موسیقی"], "datetime_fa": "۶ آبان • ۱۸:۲۳"}, {"source": "Rolling Stone", "title": "Foo Fighters Go Back to the Start on ‘Kimmel’ With ‘This Is a Call’", "link": "https://www.rollingstone.com/music/music-news/foo-fighters-perform-this-is-a-call-kimmel-1235649146/", "summary": "The band's latest selection for their week of performances on the late-night series was first released as the lead single from their debut album Foo Fighters in 1995", "date_str": "2026-10-28T14:48:47+00:00", "hash": "11537259cd3adfa8", "title_fa": "Foo Fighters با «This Is a Call» به شروع بازی «کیمل» بازگشته است.", "summary_fa": "آخرین منتخب گروه برای اجرای هفته‌شان در مجموعه‌های آخر شب ابتدا به‌عنوان تک‌آهنگ اصلی از اولین آلبوم آنها Foo Fighters در سال 1995 منتشر شد. سه شنبه شب، گروه برای This Is a Call، اولین تک آهنگی که از اولین آلبوم خود Foo Fighters در سال 1995 منتشر کردند، شروع به کار کردند. اولین قسمت از This Is A Call به یک شکست موسیقی خشمگین و کف زدن تبدیل می شود. دیو گرول در سال 1994 این رکورد را به عنوان ابزاری برای جدا شدن از گذشته و ساختن چیزی جدید نوشت. او در سال 2006 به Kerrang گفت که احساس می‌کردم چیزی برای از دست دادن ندارم و لزوماً نمی‌خواستم تا آخر عمرم بدون نیروانا درامر نیروانا باشم. فکر می‌کردم باید کاری را امتحان کنم که قبلاً هرگز انجام نداده‌ام و هرگز جلوی یک گروه نمی‌ایستم و خواننده اصلی آن نمی‌شوم، که لعنتی وحشتناک بود و هنوز هم هست. داستان‌های پرطرفدار چگونه ملانی س 00+00:00", "hash": "d0e82a065b3ec56a", "title_fa": "انجمن رسانه های محیطی و جوایز آن نشان می دهد که بخشی از سازمان غیرانتفاعی متحد طبیعت می شود", "summary_fa": "مراسم افتتاحیه جوایز United by Nature در آوریل 2027 همزمان با ماه زمین برگزار می شود. این یک دوره جدید برای انجمن رسانه های محیطی است، زیرا گروه پایداری هالیوود در حال تبدیل شدن به بخشی از غیرانتفاعی متحد توسط طبیعت است. EMA نزدیک به 40 سال است که در این صنعت فعال بوده و گفتگو را از طریق ابتکارات آموزشی، مشارکت های صنعتی و رویدادهایی مانند Impact Summit و جشن EMA Awards امضا کرده است. United by Nature - سازمانی متمرکز بر ساخت نسل بعدی جنبش حفاظت از آمریکا - قصد دارد بر اساس این برنامه ها و روابط ایجاد کند و همچنین میزبان اولین جوایز United by Nature در آوریل 2027 مصادف با ماه زمین باشد. خبرهای مرتبط اخبار ربات وحشی، نمایش روزانه در میان برندگان جوایز رسانه‌های محیطی اخبار ستارگان درباره آتش‌سوزی‌های لس‌آنجلس، بازسازی خانه‌ها و با تسلای خود در نشست EMA Impact Summit صحبت می‌کنند، بنجی بک‌ای، بنیان‌گذار بیانیه‌ای در یونایتد و ان‌سی‌ای گفت: پیشرفت زیست‌محیطی نیازمند ائتلاف بزرگ‌تری است که بیشتر منعکس‌کننده جوامع در سراسر آمریکا باشد. EMA ثابت کرد که چگونه داستان سرایی قدرتمند می تواند فرهنگ را شکل دهد، مردم را متحد کند و نتایج معناداری را برای طبیعت به ارمغان آورد. با هم، با دستیابی به مخاطبان جدید و دعوت از افراد با هر زمینه‌ای برای محافظت از فضای باز که دوست دارند، بر این تأثیر می‌افزاییم. دبی لوین، مدیر عامل سابق EMA که اکنون به عنوان مدیر رویایی United by Nature خدمت می کند، گفت: EMA همیشه به قدرت خارق العاده سرگرمی و داستان سرایی برای الهام بخشیدن به اقدامات محیطی اعتقاد داشته است. برای بیش از سه دهه، ما در کنار جامعه سرگرمی کار کرده ایم تا پایداری را بخشی از گفتگوی فرهنگی کنیم. ما به میراثی که ساخته‌ایم افتخار می‌کنیم و از همکاری با United by Nature برای دستیابی", "image_url": "https://www.hollywoodreporter.com/wp-content/uploads/2026/10/GettyImages-2240528091.jpg?crop=0px%2C166px%2C5000px%2C2798px&#038;resize=1440%2C810", "category": "هوش مصنوعی مولد", "tags": ["رسانه", "هنر"], "datetime_fa": "۶ آبان • ۱۸:۳۰"}, {"source": "Hollywood Reporter", "title": "Sundance Sets Legacy Screenings Including Films by Christopher Nolan, Justin Lin and Alfonso Cuarón", "link": "https://www.hollywoodreporter.com/movies/movie-news/sundance-2027-legacy-screenings-lineup-schedule-1236741586/", "summary": "Old will be new again at Sundance 2027. Also fresh: Letterboxd joins as Legacy program co-presenter.", "date_str": "2026-10-28T15:00:00+00:00", "hash": "a2062c0c8eaa3fc7", "title_fa": "ساندنس اکران های قدیمی را شامل فیلم هایی از کریستوفر نولان، جاستین لین و آلفونسو کوارون می کند.", "summary_fa": "قدیمی دوباره در ساندنس 2027 جدید خواهد بود. همچنین تازه: Letterboxd به عنوان یکی از مجریان برنامه Legacy می‌پیوندد. در حالی که ساندنس برای نوشتن میراث جدیدی در بولدر، کلرادو در سال 2027 و پس از آن آماده می شود، جشنواره فیلم در حال آوردن آثاری از گذشته خود به خانه جدید است. موسسه ساندنس امروز ترکیب برنامه Legacy را برای جشنواره سال آینده معرفی کرد و شامل آثاری از فیلمسازانی از جمله کریستوفر نولان، آلفونسو کوارون، جاستین لین، استیسی پرالتا، جولی تیمور، باربارا همر، پاتریشیا کاردوسو و تام کالین است. در حالی که قدیمی دوباره جدید خواهد شد، چیز تازه ای نیز برای خط تولید وجود دارد که زمانی به نام From the Collection شناخته می شد: Letterboxd به عنوان یکی از ارائه کنندگان برنامه Legacy با جزئیات اضافی برای فعال سازی در محل می پیوندد. داستان‌های مرتبط فیلم‌هایی که آلفونسو کوارون درباره ساختن هری پاتر فکر می‌کند: پادکست گپ جوایز دو سال از زیباترین سال‌های زندگی من جان لگوئیزامو در فیلم «اودیسه»، «بازیگری غیر سنتی» و «بی دعوت از مرد عنکبوتی: بازگشت به خانه از مرد عنکبوتی: بازگشت به خانه به خانه برداشته شد» از جمله برنامه‌ای مستقل از سینمای کاخ به نمایش گذاشته شد. و نمایش ترمیم آثار داستانی و غیرداستانی و همچنین رویدادهای ویژه — ترمیم‌های کاملاً جدید نسخه ساندنس 2002 Lin s Better Luck Tomorrow، بازسازی دیجیتالی 4K از Peraltas Dogtown و Z-Boys، اکران سالگرد سی و پنجمین سالگرد Taymores Fires a Fool's Taymors a Fool's نمایش بیست و پنجمین سالگرد فیلم Cardoso's Real Women Have Curves، یک چرخش ستاره ای برای America Ferrera، اکران سالگرد سی و پنجمین فیلم Swoon کالین، و اکران سالگرد ۲۵ سالگی بازسازی 4K Y tu mamá también کوارون، ستاره ای برای دیگو لونا و گارسیا گائل.", "image_url": "https://www.hollywoodreporter.com/wp-content/uploads/2026/10/Better_Luck_Tomorrow_Still_1.jpg?crop=0px%2C5px%2C2560px%2C1433px&#038;resize=1440%2C810", "category": "هوش مصنوعی مولد", "tags": ["سینما"], "datetime_fa": "۶ آبان • ۱۸:۳۰"}, {"source": "Variety", "title": "Versant Expands Suite of FAST Channels With 4 New Selections From CNBC, E!, Oxygen", "link": "https://variety.com/2026/tv/news/versant-expands-fast-channels-4-new-cnbc-e-oxygen-1236933344/", "summary": "Versant may best be known for the cable channels that provide the bulk of its revenue, but the company continues to build out new-media extensions. The owner of MS NOW, CNBC and USA is launching four new free ad-supported streaming networks based on programming franchises from CNBC, Oxygen and E!. When these new options debut, [ ]", "date_str": "2026-10-28T14:45:00+00:00", "hash": "6247945261e691f7", "title_fa": "Versant مجموعه کانال های FAST را با 4 انتخاب جدید از CNBC، E!، Oxygen گسترش می دهد.", "summary_fa": "Versant ممکن است بیشتر به دلیل کانال های کابلی که بخش عمده ای از درآمد آن را تامین می کنند شناخته شود، اما این شرکت به ساخت برنامه های افزودنی رسانه های جدید ادامه می دهد. مالک MS NOW، CNBC و USA در حال راه‌اندازی چهار شبکه استریم رایگان با پشتیبانی آگهی بر اساس امتیازهای برنامه‌نویسی CNBC، Oxygen و E! است. هنگامی که این گزینه های جدید شروع به کار کردند، [ ] سه ماهه جدید شامل Snapped می شود، برنامه ای که زندگی زنی را که متهم به قتل است و در سال 2004 از Oxygen پخش می شد را شرح می دهد. خراب، انتخابی از E! که بالا و پایین های جراحی پلاستیک را بررسی می کند. Oxygen Murders of America، مجموعه مستند جنایی واقعی؛ و CNBC Ambition، که داستان‌هایی از کارآفرینی، نوآوری، خلق ثروت و موفقیت ارائه می‌دهد و بر مجموعه‌ای از سریال‌های پربیننده تکیه می‌کند که قبلاً از شبکه‌های کابلی اخبار کسب و کار پخش می‌شد. داستان‌های مرتبط گیلرمو دل تورو وقتی می‌گوید «دنیایی را خراب می‌کنیم» اشک می‌ریزد: «ببینم سه نسل بعدی شکست می‌خورند، عمیقاً عذابم می‌دهد» هر چهار کانال جدید از 27 اکتبر در Prime Video در ایالات متحده در دسترس خواهند بود و راه‌اندازی‌های مبهم در The Roku Channel از 3 نوامبر آغاز می‌شود. انتظار می‌رود پلتفرم‌های FAST از 3 نوامبر به راه‌اندازی دیگر ادامه دهند. دیو پیتریچا، مدیر ارشد درآمد و کسب‌وکار Versant در بیانیه‌ای گفت: «رشد پلت‌فرم‌های دیجیتال ما و دستیابی به مخاطبان جدید در استراتژی Versant نقش اساسی دارد. آوردن بیشتر برنامه‌هایمان به Prime Video و کانال Roku، دامنه دسترسی برندهای نمادین ما را افزایش می‌دهد و راه‌های بیشتری را برای مخاطبان فراهم می‌کند تا محتوایی را که در هر کجا تماشا می‌کنند، کشف کنند.", "image_url": "https://variety.com/wp-content/uploads/2026/10/kTxGLjnQ.png?w=1000&#038;h=563&#038;crop=1", "category": "هوش مصنوعی مولد", "tags": ["رسانه", "هنر"], "datetime_fa": "۶ آبان • ۱۸:۱۵"}, {"source": "Variety", "title": "Peter Medak, Director of ‘The Changeling’ and ‘The Krays,’ Dies at 88", "link": "https://variety.com/2026/film/news/peter-medak-dead-changeling-the-krays-director-1236933340/", "summary": "Peter Medak, the Hungarian-born director and actor best known for films including The Changeling, The Krays and The Ruling Class died Tuesday in Los Angeles. He was 88. Over a career spanning six decades, Medak directed 27 feature films, moving between psychological horror, black comedy and crime dramas. His 1980 supernatural thriller The Changeling, starring [ ]", "date_str": "2026-10-28T14:18:35+00:00", "hash": "220bbdeb6bdde0ff", "title_fa": "پیتر مداک، کارگردان فیلم‌های The Changeling و The Krays در ۸۸ سالگی درگذشت", "summary_fa": "پیتر مداک، کارگردان و بازیگر مجارستانی الاصل که بیشتر برای فیلم‌هایی از جمله The Changeling، The Krays و The Ruling شناخته می‌شد، روز سه‌شنبه در لس‌آنجلس درگذشت. او 88 سال داشت. مداک در طول 6 دهه فعالیت حرفه ای، 27 فیلم بلند را کارگردانی کرد که بین درام های ترسناک روانی، کمدی سیاه و درام جنایی حرکت می کرد. تریلر ماوراء طبیعی او در سال 1980 The Changeling با بازی [ ] Medak همچنین به طور گسترده در تلویزیون کار کرد و قسمت‌هایی از Breaking Bad و The Wire را کارگردانی کرد. پیتر مداک، کارگردان و بازیگر مجارستانی الاصل که بیشتر برای فیلم‌هایی مانند The Changeling، The Krays و The Ruling شناخته می‌شد، روز سه‌شنبه در لس‌آنجلس درگذشت. او 88 سال داشت. مداک در سال 1937 در بوداپست به دنیا آمد و بخشی از جنگ جهانی دوم را با خانواده خود در مخفیگاه گذراند. در رژیم کمونیستی مجارستان، پدرش زندانی شد و مداک از رفتن به مدرسه منع شد. او در جریان انقلاب مجارستان در سال 1956 به انگلستان گریخت و شروع به کار در صنعت فیلم بریتانیا کرد و در نهایت پیش از نقل مکان به هالیوود به عنوان دستیار کارگردان مشغول به کار شد. او اولین کارگردانی بلند خود را با فیلم منفی در سال 1968 با بازی گلندا جکسون انجام داد. طنز او در سال 1972، طبقه حاکم، با بازی پیتر او تول، برای دریافت نخل طلایی در کن رقابت کرد و نامزدی اسکار را برای تول به دست آورد. از دیگر فیلم‌ها می‌توان به یک روز در مرگ جو تخم، اجازه دهید آن را داشته باشد و رومئو در حال خونریزی به رهبری گری اولدمن است. از او چهار فرزند، کریستوفر، جاشوا، کارن و کورنلا و پنج نوه به یادگار مانده است.", "image_url": "https://variety.com/wp-content/uploads/2026/10/peter-medak_.png?w=1000&#038;h=563&#038;crop=1", "category": "سینما و سریال", "tags": ["سینما"], "datetime_fa": "۶ آبان • ۱۷:۴۸"}]

    let currentTab = 'persian';
    let searchQuery = '';
    let readArticles = new Set(JSON.parse(localStorage.getItem('read_articles_registry') || '[]'));

    function toFaDigits(n) {
      const f = ['۰','۱','۲','۳','۴','۵','۶','۷','۸','۹'];
      return n.toString().replace(/\d/g, d => f[d]);
    }

    function toggleRead(hash) {
      if (readArticles.has(hash)) {
        readArticles.delete(hash);
      } else {
        readArticles.add(hash);
      }
      localStorage.setItem('read_articles_registry', JSON.stringify(Array.from(readArticles)));
      renderNews();
    }

    function renderNews() {
      const container = document.getElementById('newsContainer');
      const rawItems = data[currentTab] || [];
      
      const filtered = rawItems.filter(item => {
        if (!searchQuery) return true;
        const q = searchQuery.toLowerCase();
        const title = (item.title_fa || item.title || '').toLowerCase();
        const summary = (item.summary_fa || item.summary || '').toLowerCase();
        const source = (item.source || '').toLowerCase();
        const category = (item.category || '').toLowerCase();
        const tags = (item.tags || []).join(' ').toLowerCase();
        return title.includes(q) || summary.includes(q) || source.includes(q) || category.includes(q) || tags.includes(q);
      });

      const unreadList = [];
      const readList = [];

      filtered.forEach(item => {
        if (readArticles.has(item.hash)) {
          readList.push(item);
        } else {
          unreadList.push(item);
        }
      });

      const sortedItems = [...unreadList, ...readList];

      if (sortedItems.length === 0) {
        container.innerHTML = '<div style="text-align:center; padding: 40px; color: var(--text-muted);">هیچ خبری در این بخش در ۲۴ ساعت گذشته ثبت نشده است.</div>';
        return;
      }

      container.innerHTML = sortedItems.map((item, idx) => {
        const title = item.title_fa || item.title || '';
        const summary = item.summary_fa || item.summary || '';
        const source = item.source || 'منبع خبر';
        const link = item.link || '#';
        const isRead = readArticles.has(item.hash);
        const num = toFaDigits(idx + 1);
        const category = item.category || '';
        const tags = item.tags || [];
        const datetimeFa = item.datetime_fa || '';

        return `
          <article class="news-card ${isRead ? 'is-read' : ''}" id="card-${item.hash}">
            <div class="news-header">
              <span class="news-num">${isRead ? '✓' : num}</span>
              <h2 class="news-title">${title}</h2>
            </div>
            ${summary ? `<p class="news-summary">${summary}</p>` : ''}
            <div class="news-footer">
              <div class="footer-top-row">
                <div class="meta-group">
                  <span class="news-source">📌 ${source}</span>
                  ${datetimeFa ? `<span class="news-datetime">🕒 ${datetimeFa}</span>` : ''}
                  ${category ? `<span class="news-category-badge" onclick="filterByTag('${category}')">📂 ${category}</span>` : ''}
                </div>
              </div>
              ${tags && tags.length > 0 ? `
                <div class="footer-tags-row">
                  ${tags.map(t => `<span class="news-tag-chip" onclick="filterByTag('${t}')">#${t}</span>`).join('')}
                </div>
              ` : ''}
              <div class="footer-bottom-row">
                <div class="footer-actions-right">
                  <button class="btn-mark-read" onclick="toggleRead('${item.hash}')">
                    ${isRead ? '✓ خوانده شد' : '○ علامت خوانده‌شده'}
                  </button>
                </div>
                <div class="footer-actions-left">
                  ${link && link.startsWith('http') ? `<a href="${link}" target="_blank" rel="noopener noreferrer" class="news-link">مطالعه اصل خبر ↗</a>` : ''}
                </div>
              </div>
            </div>
          </article>
        `;
      }).join('');
    }

    function filterByTag(val) {
      const searchInput = document.getElementById('searchInput');
      if (searchInput) {
        searchInput.value = val;
        searchQuery = val;
        renderNews();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    }

    function switchTab(tab, el) {
      currentTab = tab;
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      if (el) el.classList.add('active');
      renderNews();
    }

    function toggleTheme() {
      const html = document.documentElement;
      const current = html.getAttribute('data-theme') || 'dark';
      const next = current === 'dark' ? 'light' : 'dark';
      html.setAttribute('data-theme', next);
      localStorage.setItem('theme', next);
      updateThemeButton(next);
    }

    function updateThemeButton(theme) {
      const icon = document.getElementById('themeIcon');
      const text = document.getElementById('themeText');
      if (theme === 'dark') {
        icon.textContent = '☀️';
        text.textContent = 'حالت روشن';
      } else {
        icon.textContent = '🌙';
        text.textContent = 'حالت تاریک';
      }
    }

    function toggleArchiveModal(show) {
      const modal = document.getElementById('archiveModal');
      if (show) {
        renderArchiveList();
        modal.classList.add('active');
      } else {
        modal.classList.remove('active');
      }
    }

    function renderArchiveList() {
      const listContainer = document.getElementById('archiveListContainer');
      if (!archiveManifest || archiveManifest.length === 0) {
        listContainer.innerHTML = '<div style="text-align:center; padding: 20px; color: var(--text-muted);">هنوز شماره قبلی ثبت نشده است.</div>';
        return;
      }

      listContainer.innerHTML = archiveManifest.map(item => `
        <a href="${item.url}" class="archive-item">
          <div>
            <div class="archive-date-fa">📰 شماره ${item.p_date}</div>
            <div class="archive-date-g">🌍 ${item.g_date}</div>
          </div>
          <span class="archive-arrow">←</span>
        </a>
      `).join('');
    }

    const savedTheme = localStorage.getItem('theme') || 'dark';
    document.documentElement.setAttribute('data-theme', savedTheme);
    updateThemeButton(savedTheme);

    document.getElementById('searchInput').addEventListener('input', (e) => {
      searchQuery = e.target.value.trim();
      renderNews();
    });

    renderNews();
  </script>
