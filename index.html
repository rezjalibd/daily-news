نبه به لی توضیح داد، \"Rockin' Around the Christmas Tree\" یکی از دو آهنگ کریسمس است که تاکنون گواهی الماس را دریافت کرده است. دیگری اثر ماریا کری «همه چیزی که برای کریسمس می خواهم تو هستی. لی، به نوبه خود، در این ویدیو احساساتی می شود و از ترانه سرا، جانی مارکس، تهیه کننده اوون بردلی و نوازندگان استودیویی که در ضبط بازی می کردند نام می", "image_url": "https://www.rollingstone.com/wp-content/uploads/2026/11/Brenda-Lee-Taylor-Swift-Diamond-Photo-Credit-TAS-Rights-Management-2.jpg?w=1600&#038;h=900&#038;crop=1", "category": "هوش مصنوعی مولد", "tags": ["سینما", "موسیقی"], "datetime_fa": "۲ آذر • ۱۹:۴۰"}, {"source": "Variety", "title": "Byron Allen’s BuzzFeed Hires Chris Poydenis, Co-Founder of Creator Marketing Agency Influential, as Chief Revenue Officer", "link": "https://variety.com/2026/digital/news/buzzfeed-chris-poydenis-chief-revenue-officer-cofounder-influential-1236955952/", "summary": "Byron Allen is hoping to turn things around at BuzzFeed, the money-losing digital publisher he envisions becoming a major free, ad-supported streaming property, with the hiring of Chris Poydenis as chief revenue officer. Poydenis previously was chief revenue officer and co-founder of Influential, a leading creator-marketing company. In joining BuzzFeed, Poydenis is bringing over Jesse [ ]", "date_str": "2026-11-23T16:14:26+00:00", "hash": "69c4094672c0afac", "title_fa": "BuzzFeed بایرون آلن، کریس پویدنیس، یکی از بنیانگذاران آژانس بازاریابی خلاق، را به عنوان مدیر ارشد درآمد استخدام می کند.", "summary_fa": "بایرون آلن امیدوار است با استخدام کریس پویدنیس به عنوان مدیر ارشد درآمد، اوضاع را در BuzzFeed تغییر دهد، ناشر دیجیتالی که او در نظر دارد با استخدام کریس پویدنیس به عنوان مدیر ارشد درآمد، به یک ملک اصلی پخش رایگان و با پشتیبانی تبلیغات تبدیل شود. پویدنیس قبلاً مدیر ارشد درآمد و یکی از بنیانگذاران اینفلوئنال بود، یک شرکت بازاریابی خلاق. پویدنیس با پیوستن به BuzzFeed، جسی [] بایرون آلن، رئیس و مدیر عامل BuzzFeed را به خدمت گرفت که در اوایل سال جاری 51 درصد از سهام این شرکت را به دست آورد. بر اساس این قرارداد، او 20 میلیون دلار به صورت نقدی در زمان بسته شدن پرداخت کرد و یک سفته 100 میلیون دلاری را که سررسید آن ظرف پنج سال بود صادر کرد (با سود 5 درصد سالانه). در ماه جولای، BuzzFeed 35 درصد از کارکنان خود را اخراج کرد و حدود 180 شغل را در سراسر شرکت اخراج کرد. سه برند این شرکت BuzzFeed، HuffPost و Tasty متمرکز بر غذا هستند. آلن در بیانیه‌ای گفت: «کریس و جسی دقیقاً همان رهبران درآمد ثابتی هستند که ما می‌خواهیم تیم فروش BuzzFeed را در حالی که BuzzFeed را به یک پلتفرم محتوای ممتاز پخش رایگان می‌سازیم هدایت کنیم.» علاوه بر BuzzFeed، آلن به عنوان رئیس هیئت مدیره و مدیرعامل آلن مدیا گروپ، مجموعه ای از کسب و کارهای تلویزیونی و استریم ایفای نقش می کند. پویدنیس اظهار داشت: «از پیوستن به BuzzFeed در چنین لحظه مهمی در تکامل جریان آزاد، بسیار مفتخر و متواضع هستم. اعتقاد من به چشم انداز بایرون صریح است، و من در تعهد خود به ترجمه آن چشم انداز به یک واقعیت تجاری ملموس و پایدار قاطع هستم - واقعیتی که برندها را برای دستیابی به نتایج تجاری قابل اندازه گیری از طریق تعامل معنادار در پلتفرم ها، قالب ها و مخاطبان", "image_url": "https://variety.com/wp-content/uploads/2026/11/Chris-Poydenis.jpg?w=1000&#038;h=563&#038;crop=1", "category": "هوش مصنوعی مولد", "tags": ["بورس و طلا"], "datetime_fa": "۲ آذر • ۱۹:۴۴"}, {"source": "Pitchfork", "title": "Portishead Reportedly Pull Music From Israeli Streaming Services", "link": "https://pitchfork.com/story/portishead-reportedly-pull-music-from-israeli-streaming-services/", "summary": "The band, long aligned with the Palestinian cause, has not commented on the removal", "date_str": "2026-11-23T16:00:53+00:00", "hash": "f84e8e4f8e04dc1c", "title_fa": "بنا به گزارش‌ها، پورتی‌هد موسیقی را از سرویس‌های پخش جریانی اسرائیل می‌کشد", "summary_fa": "این گروه که مدت‌ها با آرمان فلسطین همسو بود، در مورد حذف Loader Save Story Save this Story نظری نداد. در حالی که گروه هنوز بیانیه‌ای در مورد حذف منتشر نکرده است، هاآرتص گزارش می‌دهد که موسیقی پورتی‌هد - از جمله آهنگ‌های صفحه یوتیوب خودش - در اوایل این ماه از سرویس‌های استریم اسرائیل ناپدید شد. اعضای این سه نفر که مدت ها در حمایت از فلسطین صدا می کردند، در سپتامبر 2025 دوباره گرد هم آمدند تا اجرای آهنگ \"جاده ها\" را برای کنسرت جمع آوری کمک های مالی با هم برای فلسطین در لندن از قبل ضبط کنند. در آن ماه، جف بارو در اینستاگرام نوشت که گروه «به شدت می‌خواستند برای کمک به پایان دادن به نسل‌کشی در حال وقوع که هم‌اکنون در حال وقوع است، مشارکت داشته باشند.» (پیش از آن، آخرین اجرای آنها برای یک کنسرت خیریه War Child در سال 2022 بود که از تلاش های امدادی در اوکراین حمایت می کرد.) در سال 2018، گروه در فیس بوک پستی برای حمایت از تحریم اسرائیل به دلیل اشغال فلسطین منتشر کرد. No Music for Genocide در یک استوری اینستاگرام نوشت که پورتی هد به کمپین آن پیوسته است و به زودی اخبار بسیار بیشتری منتشر خواهد شد. به گزارش هاآرتص، آهنگ‌های گروه از مجموعه‌ها و سایر نسخه‌های منتشر شده، همراه با آلبوم‌های انفرادی بث گیبونز و موسیقی جف بارو با Beak، زنده باقی می‌مانند. (Pitchfork نتوانسته است از در دسترس بودن موسیقی Portishead در سایر سرویس‌های استریم در اسرائیل اطمینان حاصل کند.) Pitchfork به نمایندگان گروه، Gibbons و برچسب Barrow's Invada ایمیل ارسال کرده است. کمپین No Music for Genocide طیف وسیعی از هنرمندان - از جمله Massive Attack، Björk و MJ Lenderman - را در تلاش خود برای بلوک جغرافیایی موسیقی در اسرائیل از سال گذشته گرد هم آورده است.", "image_url": "https://media.pitchfork.com/photos/6b0460843cdd8f70b4c87c01/16:9/w_1280,c_limit/portishead-israel.jpg", "category": "هوش مصنوعی مولد", "tags": ["Apple", "عامل‌های هوشمند", "موسیقی", "روابط بین‌الملل"], "datetime_fa": "۲ آذر • ۱۹:۳۰"}, {"source": "Variety", "title": "Justin Timberlake Documentary Trailer: Apple TV Series to Unpack Britney Spears, Janet Jackson Controversies", "link": "https://variety.com/2026/music/news/justin-timberlake-documentary-trailer-britney-spears-janet-jackson-1236955955/", "summary": "Apple TV has confirmed that it will launch “Timberlake,” a new four-part documentary on Justin Timberlake’s life and career helmed by Academy Award winner Fisher Stevens; Variety first reported the news earlier this month. The series premieres globally on Apple TV on Friday, December 11 with the first two episodes, followed by the third episode [ ]", "date_str": "2026-11-23T16:03:04+00:00", "hash": "3a6d792b804e056b", "title_fa": "تریلر مستند جاستین تیمبرلیک: مجموعه تلویزیونی اپل برای بازگشایی جنجال های بریتنی اسپیرز و جنت جکسون", "summary_fa": "اپل تی‌وی تأیید کرده است که «تیمبرلیک»، یک مستند چهار قسمتی جدید درباره زندگی و حرفه‌ی جاستین تیمبرلیک که توسط فیشر استیونز، برنده جایزه اسکار ساخته می‌شود، عرضه خواهد کرد. ورایتی برای اولین بار این خبر را در اوایل ماه جاری منتشر کرد. این سریال در روز جمعه، 11 دسامبر با دو قسمت اول و به دنبال آن اپیزود سوم در سطح جهانی در اپل تی‌وی در روز جمعه، 11 دسامبر پخش می‌شود. نمایش نیمه وقت سوپر بول در سال 2004. داستان‌های مرتبط کمدین فقید سام کینیسون - با آواتار هوش مصنوعی خود - برای دومین بار با بوچوالد آماده می‌شود (اختصاصی) تیمبرلیک در صداپیشگی می‌گوید: «مطمئنم که به عقب برمی‌گردی و این چیزهای شیرین و مسخره باورنکردنی دوران کودکی‌ام را می‌بینی. چیزهایی که صحبت کردن در مورد آنها واقعاً سخت است، که سپس به فیلم او و اسپیرز تبدیل می شود. تریلر چندین شات از اسپیرز و جکسون و همچنین تیمبرلیک به همراه همسرش جسیکا بیل و دیگران را نشان می دهد. در این اطلاعیه آمده است: «تیمبرلیک خام، بازتاب‌دهنده و آشکار می‌نشیند تا درباره پیروزی‌هایی که او را به موفقیت جهانی رساند، دیدگاه شخصی‌اش فراتر از سرفصل‌ها و چالش‌هایی که در پشت پرده با آن روبرو شده است، صحبت کند. این سریال به کارگردانی برنده جایزه اسکار فیشر استیونز (The Cove, Beckham)، سه دهه از موسیقی و فرهنگ عامه را در بر می گیرد و شامل فیلم های آرشیوی و مصاحبه های انحصاری با خانواده، دوستان و همکاران است که قبلاً دیده نشده است.", "image_url": "https://variety.com/wp-content/uploads/2026/11/Screenshot-2026-11-23-at-10.49.21-AM-e1795449557290.png?w=1000&#038;h=563&#038;crop=1", "category": "هوش مصنوعی مولد", "tags": ["هوش مصنوعی", "Apple", "سینما", "موسیقی"], "datetime_fa": "۲ آذر • ۱۹:۳۳"}, {"source": "Billboard", "title": "‘Everyone Comes Here to Be Wowed’: Las Vegas Grand Prix Hits Live Music Jackpot With Backstreet Boys, Kacey Musgraves & More", "link": "https://www.billboard.com/music/music-news/las-vegas-grand-prix-2026-backstreet-boys-kacey-musgraves-1236387637/", "summary": "The Las Vegas Grand Prix might be the only Formula 1 race where the intensity of the sound of cars thundering down the track is rivaled by the city s lights and that s saying something. Related The Whole Thing Is A Show : Why the Love Affair Between F1 Racing and Music Just ‘Makes Sense’ Red Bull Racing — And Music Fans — Win Big at the Formula 1 U.S. Grand Prix, Featuring Garth Brooks, Kygo More Ring in 2027 With the Backstreet Boys: Band Adds 3 New Year s Shows to Las Vegas Sphere Residency But this weekend s LVGP was easily as bright as it was loud, from the 1.2 million LEDs shooting out of the ginormous Sphere looming over the circuit to the flashing casino signs that dotted the horizon as 22 drivers sped past Sin City landmarks and thousands of fans for 50 laps on Saturday (Nov. 21). Max Verstappen secured a first-place finish for Red Bull Racing after spending much of the drive fighting off 2026 World Champion Kimi Antonelli and George Russell of Mercedes, who dropped down to Nos. 4 and 9, respectively, in the final few laps. In the end, Verstappen was joined instead by 2025 champion Lando Norris and Oscar Piastri, both from McLaren, on the podium Saturday but the night was far from over as the trio sprayed each other down with the ceremonial champagne. Revved up by the excitement on the track, the thousands of attendees who left the grandstands and flooded into the Sphere for the official T-Mobile F1 Afterparty were already ready to party when the Backstreet Boys took the stage for a special one-off show between blocks of the group s Into the Millennium residency in Vegas. The jaw-dropping light displays and innovative, immersive special effects which at times made fans feel as though they were hurtling through space in an enormous rocket ship or traversing snowy mountain ranges with rock formations shaped like Nick Carter, Howie Dorough, AJ McLean, Brian Littrell and Kevin Richardson s faces proved that the Sphere was the only concert venue that could possibly match the grandeur of the race itself. The Backstreet Boys finale capped off a weekend of not just racing, but numerous other live music offerings. T-Mobile one of the Vegas Grand Prix s main sponsors also presented pop, R B and dance acts such as Sean Paul, Disclosure, Two Friends, Natasha Bedingfield and Ja Rule on its T-Mobile Zone stage, located right next to the Sphere, across three days leading up to the main race. And then there was Kacey Musgraves disco rodeo at MGM Grand Arena, hoste", "date_str": "2026-11-23T15:59:44+00:00", "hash": "2e4b9f8631d99dfe", "title_fa": "\"همه به اینجا می آیند تا شگفت زده شوند\": جایزه بزرگ لاس وگاس به جکپات موسیقی زنده با پسران بک استریت، کیسی ماسگریوز و غیره رسید", "summary_fa": "گرندپری لاس وگاس ممکن است تنها مسابقه فرمول 1 باشد که در آن شدت صدای رعد و برق ماشین‌ها در مسیر با چراغ‌های شهر رقابت می‌کند و چیزی می‌گوید. موارد مرتبط: کل چیز یک نمایش است: چرا رابطه عشقی بین مسابقات فرمول 1 و موسیقی فقط «معنی دارد» مسابقه ردبول - و طرفداران موسیقی - در فرمول 1 ایالات متحده برنده بزرگی هستند. جایزه بزرگ، با حضور Garth Brooks، Kygo More Ring در 2027 With The Backstreet Boys: Band 3 نمایش سال نو را به لاس وگاس Sphere Residency اضافه می کند، اما LVGP آخر هفته به راحتی به همان اندازه که بلند بود، روشن بود، از 1.2 میلیون LED که از مدار کازینوی عظیم بر فراز Sphere فلاش می زدند تا به سمت پایین. 22 راننده در روز شنبه (21 نوامبر) به مدت 50 دور از نقاط دیدنی سین سیتی و هزاران طرفدار عبور کردند. مکس ورشتاپن پس از صرف زمان زیادی برای مبارزه با قهرمان جهان 2026 کیمی آنتونلی و جورج راسل از مرسدس که در چند دور پایانی به ترتیب به شماره های 4 و 9 سقوط کردند، مقام اول را برای ردبول ریسینگ به دست آورد. در پایان، به جای ورشتاپن، قهرمان سال 2025، لاندو نوریس و اسکار پیاستری، هر دو از مک لارن، شنبه روی سکو رفتند، اما شب به پایان نرسیده بود زیرا این سه نفر با شامپاین تشریفاتی روی -op Live در منچستر بود که تقریباً 40 دقیقه پس از پایان صحنه، این حادثه رخ داد. به گفته بی بی سی، پلیس بزرگ منچستر معتقد است که این ماده گاز اشک آور است. بیش از 12000 نفر از محل تخلیه شدند و یک حادثه بزرگ اعلام شد. سرویس آمبولانس شمال غرب گفت: 80 نفر به دلیل علائم چشمی و تنفسی تحت درمان قرار گرفتند و یک نفر در بیمارستان بستری شد. GMP در بیانیه‌ای به Billboard U.K گفت: «مأموران ابتدا کمی بعد از ساعت 10 شب توسط کارکنان محل باخبر شدند و در کنار سایر خدمات اضطراری در اولویت پاسخگویی قرار گرفتند. اعضای مردم در صورت امن بودن شروع به تخلیه کردند تا اطمینان حاصل شود که افرادی که از اثرات این حادثه رنج می برند می توانند توسط متخصصان پزشکی ارزیابی شوند. وی افزود: \"هر کسی که در مراسم", "image_url": "https://www.billboard.com/wp-content/uploads/2026/11/P1186HZF-e1795427157414.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["امنیت سایبری", "موسیقی"], "datetime_fa": "۲ آذر • ۱۹:۲۴"}, {"source": "Deadline", "title": "‘Lil Kev’ Ends Up Behind Bars In Season 2 Trailer For Kevin Hart Animated Series", "link": "https://deadline.com/2026/11/kevin-hart-animated-series-lil-kev-trailer-1237231157/", "summary": "Lil Kev is in big trouble. After leading cops on a slow-speed chase, 12-year-old Kev ends up in the slammer (juvenile detentation actually) in the official trailer for Season 2 of the Kevin Hart animated series Lil Kev. Set in 1993 North Philadelphia, Lil Kev follows twelve-year-old Kev (Hart) as his enormous ambition and wild [ ]", "date_str": "2026-11-23T16:00:00+00:00", "hash": "b5d4ef8321fbccf4", "title_fa": "تریلر سریال انیمیشن کوین هارت در فصل دوم، «لیل کیو» پشت میله‌ها به پایان می‌رسد.", "summary_fa": "لیل کیو در دردسر بزرگی است. پس از پلیس های رهبری کننده در یک تعقیب و گریز با سرعت آهسته، کیو 12 ساله در تریلر رسمی فصل 2 سریال انیمیشن کوین هارت، لیل کیو، در مهلکه (در واقع بازداشت نوجوانان) قرار می گیرد. در سال 1993 فیلادلفیا شمالی اتفاق می‌افتد، لیل کیو، کیو (هارت) دوازده ساله را به عنوان جاه‌طلبی عظیم و وحشی‌اش دنبال می‌کند. بازیگران Watch on Deadline Returning همچنین ی شود.", "summary_fa": "انحصاری: Frontline Features در اقدامی بی‌سابقه، در اقدامی بی‌سابقه، مستند مدعی اسکار One in a Million را در کانال یوتیوب خود به‌طور رایگان در کانال یوتیوب خود عرضه خواهد کرد. این فیلم برنده جایزه به کارگردانی ایتاب عزام و جک مک اینس سه شنبه، اول دسامبر در یوتیوب، اپلیکیشن PBS و PBS.org/frontline نمایش داده می شود، بیش از یک ماه قبل از اینکه [ ] Raney Aronson-Rath، سردبیر و تهیه کننده اجرایی Frontline، اظهار داشت: «ما تمام مستندهای خود را با یک دهه رشد و نزدیک به یک دهه در یوتیوب منتشر کرده‌ایم. تشنه داستان هایی که می گوییم یک در میلیون اولین بار هیجان انگیز برای FRONTLINE است: انتشار یک مستند بلند در YouTube قبل از پخش اولیه آن. این دقیقاً فیلم مناسبی برای ایجاد زمینه جدید است و مستند فوق‌العاده ایتاب و جک را پس از استقبال باورنکردنی تماشاگران جشنواره و تئاتر، مستقیماً به مخاطب دیجیتال ما می‌آورد.» تماشا در Deadline One in a Million برای اولین بار در ساندنس نمایش داده شد، جایی که جایزه تماشاگران را برای مستند سینمای جهان و جایزه کارگردانی در آن بخش را به دست آورد، با تقدیر از Azzam و MacInnes. این فیلم در شفیلد داک فست در بریتانیا، جشنواره فیلم مونتکلر در نیوجرسی و جشنواره بین المللی فیلم دالاس مورد تقدیر قرار گرفته است. هر دو DOC NYC و IDA Documentary Awards یک در میلیون را در فهرست کوتاه بهترین مستندهای سال خود قرار داده اند. این فیلم که طی یک دوره 10 ساله فیلمبرداری شده است، اسرای قهرمان داستان را از کودکی تا بزرگسالی «در سفری خارق‌العاده از سوریه به آلمان - و دوباره بازگشت» دنبال می‌کند.", "image_url": "https://deadline.com/wp-content/uploads/2026/03/One-in-a-Million.png?w=968", "category": "هوش مصنوعی مولد", "tags": ["سینما"], "datetime_fa": "۲ آذر • ۱۹:۳۰"}, {"source": "Variety", "title": "Colin Farrell: For Emma Fogarty, Who Means the World to Me", "link": "https://variety.com/2026/tv/columns/colin-farrell-emma-fogarty-the-slightest-touch-hbo-epidermolysis-bullosa-1236955666/", "summary": "I met my friend Emma Fogarty nearly 16 years ago. I was sat beside her at a dinner table on an evening purposed to raise awareness for those who hav pg?crop=0px%2C62px%2C1800px%2C1014px&#038;resize=1600%2C900", "category": "هوش مصنوعی مولد", "tags": ["موسیقی"], "datetime_fa": "۲ آذر • ۱۹:۱۹"}, {"source": "Rolling Stone", "title": "See Cheap Trick Play Last Concert Before Indefinite Hiatus: ‘Thanks for Everything You’ve Given Us’", "link": "https://www.rollingstone.com/music/music-news/cheap-trick-last-concert-hiatus-1235662620/", "summary": "After 50 years of relentless touring, Cheap Trick now have a blank calendar for the first time in their history", "date_str": "2026-11-23T15:47:04+00:00", "hash": "f294d6a7c6dbd83b", "title_fa": "آخرین کنسرت قبل از وقفه نامحدود را با ترفند ارزان ببینید: \"بابت همه چیزهایی که به ما دادید متشکرم\"", "summary_fa": "پس از 50 سال تور بی امان، Cheap Trick اکنون برای اولین بار در تاریخ خود یک تقویم خالی دارد. فصل مهمی در تاریخ Cheap Trick عصر یکشنبه در تئاتر Sound Board در دیترویت آشکار شد، زمانی که گروه آخرین کنسرت خود را قبل از شروع یک استراحت نامعلوم از جاده اجرا کرد. هیچ سخنرانی طولانی یا خداحافظی با چشمانی اشک آلود با طرفداران آنها وجود نداشت، بلکه یک کنسرت استاندارد Cheap Trick بود که بر روی علاقه مندی های دهه 1970 سنگین بود و تغییرات زیادی در گیتار داشت. Cheap Trick ماه گذشته طرفداران را نگران کرد، زمانی که آنها تمام قرارهای خود در سال 2027 را لغو کردند و اعلام کردند که پس از انجام تمام تعهدات خود در سال جاری، یک استراحت طولانی خواهند داشت. چند روز بعد بیانیه ای برای رفع نگرانی ها صادر شد. با تشکر فراوان از همه کسانی که نسبت به ما ابراز نگرانی کردند.» آنها نوشتند: «برای روشن شدن همه چیز، تصمیم گرفتیم پس از دهه ها تور کمی مرخصی بگیریم زیرا به استراحت نیاز داریم. نه به دلایل سلامتی ما برنامه های نوامبر خود را اجرا خواهیم کرد و سپس اولین استراحت خود را در 50 سال گذشته خواهیم داشت. از همه حمایت های شما متشکرم!» اغراق نیست که ترفند ارزان 50 سال است که در راه است. در طول فراز و نشیب‌های فراوان آنها از زمان انتشار اولین LP خود در سال 1977، از جمله سال‌های بسیار ضعیف در دهه 1980 قبل از بازگشت آنها به The Flame در سال 1988، جدایی آشفته با درامر Bun E. کارلوس در سال 2010 که اختلافات زیادی را در پی داشت و مشکلات سلامتی مختلف در سال های اخیر که گیتاریست ریک نیلسن و نوازنده باس تام پترسون را به طور موقت کنار گذاشته بود، Cheap Trick همیشه با سرعتی بی امان اجرا", "image_url": "https://www.rollingstone.com/wp-content/uploads/2026/11/cheap-trick-last-gig-before-hiatus.jpg?w=1600&#038;h=900&#038;crop=1", "category": "هوش مصنوعی مولد", "tags": ["رسانه", "هنر"], "datetime_fa": "۲ آذر • ۱۹:۱۷"}, {"source": "Billboard", "title": "Here Are All the K-pop Albums That Have Topped the Billboard 200: Full List", "link": "https://www.billboard.com/lists/k-pop-albums-number-one-billboard-200-albums-full-list/", "summary": "ATEEZ s GOLDEN HOUR: Part.6 puts K-pop back in a familiar spot — No. 1 on the all-genre Billboard 200 chart. It s the 27th album or EP by a K-pop act to reach No. 1 on Billboard’s flagship albums chart in just over eight years. The first was BTS ’ Love Yourself: Tear , back in June 2018. This is the fifth K-pop album or EP to top Billboard 200 in 2026, which ties 2023 as the year with the most K-pop leaders. Here s another fun fact: ATEEZ s EP opened with 195,000 equivalent album units earned in the United States. That s the highest one-week total for any release (from any genre) since another K-Pop act, Stray Kids , opened with 369,000 equivalent album units of This That on the chart dated Aug. 22. Related ATEEZ Earn Fourth No. 1 on Billboard 200 With ‘GOLDEN HOUR : Part.6’ Stray Kids has amassed nine No. 1 titles on the Billboard 200, which puts the group out front among K-pop acts. BTS is second, with seven No. 1 titles. ATEEZ is next in line with four No. 1s. SuperM , BLACKPINK , TOMORROW X TOGETHER , NewJeans , TWICE and ENHYPEN have all notched one No. 1 to date. In addition, one multi-artist K-pop soundtrack, KPop Demon Hunters , has reached No. 1. BLACKPINK was the first female K-pop act to land a No. 1 album on the Billboard 200. They scored with Born Pink in 2022. They were followed by NewJeans and TWICE. K-pop groups tend to be large ensembles. TWICE has nine members, one more than Stray Kids and ATEEZ. BTS has seven members, as did SuperM, which went on hiatus in mid-2021. ENHYPEN has six members. TOMORROW X TOGETHER and NewJeans each have five members. BLACKPINK has four members. To date, no K-pop solo artists, duos or trios have topped the Billboard 200. There have been multiple No. 1 albums on the Billboard 200 by K-pop acts in every year since 2018 except for 2021, when there were none. Here’s a list of all K-pop albums to top the Billboard 200. They are listed in chronological order.", "date_str": "2026-11-23T15:35:00+00:00", "hash": "79247b896019962d", "title_fa": "در اینجا همه آلبوم های کی پاپ که در صدر بیلبورد 200 قرار گرفته اند آورده شده است: لیست کامل", "summary_fa": "ساعت طلایی ATEEZ: قسمت 6، کی پاپ را به جایگاهی آشنا بازمی گرداند — شماره 1 در جدول همه ژانر بیلبورد 200. این بیست و هفتمین آلبوم یا EP یک بازیگر کی‌پاپ است که در کمتر از هشت سال گذشته به رتبه اول جدول آلبوم‌های شاخص بیلبورد رسیده است. اولین آلبوم BTS' Love Yourself: Tear در ژوئن 2018 بود. این پنجمین آلبوم کی پاپ یا EP است که در سال 2026 در بیلبورد 200 رتبه اول را کسب می کند، که سال 2023 را به عنوان سالی با بیشترین رهبران کی پاپ مرتبط می کند. در اینجا یک واقعیت جالب دیگر وجود دارد: EP ATEEZ با 195000 واحد آلبوم معادل در ایالات متحده افتتاح شد. این بالاترین مجموع یک هفته‌ای برای هر نسخه (از هر ژانری) پس از یک بازی دیگر کی‌پاپ، Stray Kids است که با 369000 واحد آلبوم معادل This That در نمودار مورخ 22 آگوست افتتاح شد. 1 عنوان در بیلبورد 200، که گروه را در میان کنش های کی پاپ قرار می دهد. BTS با هفت عنوان شماره 1 دوم است. ATEEZ در ردیف بعدی با چهار شماره 1 قرار دارد. SuperM، BLACKPINK، TOMORROW X TOGETHER، NewJeans، TWICE و ENHYPEN همگی تا به امروز رتبه اول را کسب کرده اند. علاوه بر این، یک موسیقی متن کی پاپ با چند هنرمند، KPop Demon Hunters، به رتبه 1 رسیده است. BLACKPINK اولین آلبوم کی پاپ زن بود که در بیلبورد 200 آلبوم شماره 1 را به دست آورد. آنها با Born Pink در سال 2022 گلزنی کردند. NewJeans و TWICE پس از آنها. گروه های کی y": "EXCLUSIVE: Sixty-years in the making, post-production is nearing completion on feature thriller The Wrong People, an adaptation of the 1967 novel of the same name by Robin Maugham, a dark thriller exposing trafficking in North Africa in the sixties. First announced as a feature film in 1972, the project was shot in-and-around London and Essaouira, [ ]", "date_str": "2026-11-23T15:27:55+00:00", "hash": "398bd3db41ad519e", "title_fa": "شصت سال در ساخت، تریلر عجیب و غریب «مردم اشتباه» اکنون با کارگردانی فیلم The Affair و «امیلی در پاریس» ساخته شده است.", "summary_fa": "انحصاری: شصت سال در حال ساخت، پس‌تولید فیلم هیجان‌انگیز The Wrong People، اقتباسی از رمانی به همین نام در سال 1967 توسط رابین موام، یک تریلر تاریک که قاچاق در شمال آفریقا در دهه شصت را افشا می‌کند، به پایان می‌رسد. این پروژه اولین بار در سال 1972 به عنوان یک فیلم بلند معرفی شد، این پروژه در داخل و اطراف لندن و اساویرا فیلمبرداری شد. استیون فیربرگ، فیلمبردار باسابقه فیلم‌هایی از جمله وزیر و مواد مخدر دیگر و سریال‌های موفقی از جمله The Affair و Emily In Paris، این فیلم را بر اساس فیلمنامه‌ای توسط دیوید گریفین کارگردانی کرده است. Pic توسط استفان اسرائیل (شنا با کوسه ها) از طریق شرکت تولید کننده او School Pictures، در کنار Ioanna Karavela (روز بد در دفتر) تهیه می شود. تهیه کنندگان اجرایی برت شوهر و تام آبل از متخصص LGBTQ Peccadillo هستند که حقوق توزیع ایرلندی بریتانیا را بر عهده دارد. Watch on Deadline The Wrong People به دنبال آرنولد ترنر (نیوبری)، معلم مدرسه شبانه روزی همجنسگرا در انگلستان است که در جستجوی مهلت از سرکوب در بریتانیا، جایی که همجنسگرایی غیرقانونی است، به طنجه سفر می کند. او در آنجا با لاوینیا موریس (گودال) تبعیدی دوست می شود و با کلارنس برد (نیومن) ثروتمند درگیر می شود، اما در گوشه های تاریک شهر باج گیری می شود تا یکی از شاگردانش به نام دان (راس) را به مراکش قاچاق کند، نقشه ای که پیامدهای ویرانگری دارد.", "image_url": "https://deadline.com/wp-content/uploads/2026/11/Luke-Newberry-Caroline-Goodall-Alec-Neuman-Calum-Ross.jpg?w=1000", "category": "هوش مصنوعی مولد", "tags": ["سینما"], "date ال 2026 انتخاب شد. همیلتون به Deadline گفت: «عناصر مشترک این فیلم‌ها سنگ بنای کاری است که من می‌خواهم با Swampwife انجام دهم، که داستان‌هایی است که ریشه در سرزمین دارند، شخصیت‌ها را هدایت می‌کند، و ایده‌های ما را در مورد ژانر گسترش می‌دهد. من می‌خواهم Swampwife را به خاطر داستان‌هایی بشناسند که احساس می‌کنند وارد دنیای دیگری می‌شوند، یکی از لایه‌های بصری غنی و شخصیت‌های پرطنین عاطفی. Swampwife به همه علاقه مندی های داستان سرایی من یک خانه واحد می دهد. تیم خلاق Holler همچنین شامل نیکیتا کارپنتر فیلمبردار است که قبلا با همیلتون در ونوس اوساباو همکاری کرده بود. فریجا باردل، طراح تولید، که تیتراژ اخیر او شامل فیلم سینمایی Is God Is (2026) و موزیک ویدیوی کندریک لامار", "image_url": "https://deadline.com/wp-content/uploads/2026/11/DSC07437.jpeg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["سینما", "موسیقی"], "datetime_fa": "۲ آذر • ۱۸:۳۰"}, {"source": "Deadline", "title": "Samantha Morton To Receive BFI Fellowship", "link": "https://deadline.com/2026/11/samantha-morton-bfi-fellowship-2026-1237231480/", "summary": "The UK’s leading film organization, the British Film Institute, is honouring actor Samantha Morton with its highest accolade: a BFI Fellowship. The BFI said the honor recognizes Morton’s “extraordinary talent for bringing empathetic, raw and complex performances to her work.” The BFI Fellowship will be presented to Morton at the BFI Chair’s Dinner on January [ ]", "date_str": "2026-11-23T15:00:00+00:00", "hash": "c7b4859dd1d23a32", "title_fa": "سامانتا مورتون برای دریافت کمک هزینه تحصیلی BFI", "summary_fa": "مؤسسه فیلم بریتانیا، مؤسسه فیلم بریتانیا، از بازیگر سامانتا مورتون با بالاترین نشان خود تقدیر می کند: بورسیه BFI. BFI گفت که این افتخار نشان دهنده «استعداد فوق العاده مورتون برای ارائه اجراهای همدلانه، خام و پیچیده به کارش است». بورسیه BFI در شام کرسی BFI در ژانویه به مورتون اعطا خواهد شد [ ] سازمان سینمایی پیشرو بریتانیا، مؤسسه فیلم بریتانیا، از بازیگر سامانتا مورتون با بالاترین نشان خود تقدیر می کند: بورسیه BFI. مورتون اخیراً به خاطر بازی جادوگرانه‌اش در فیلم The Odyssey اثر کریس نولان به یاد می‌آید. از دیگر آثار او می توان به Sweet and Lowdown، Minority Report، The Walking Dead، She Said، Under the Skin، Mister Lonely و The Serpent Queen اشاره کرد. او همچنین یک فیلم بلند را کارگردانی کرده است، فیلم The Unloved در سال 2009. Watch on Deadline Morton در بیانیه ای بورسیه BFI را به عنوان \"بزرگترین افتخار و هدیه ای که می توانم تصور کنم\" توصیف کرد. او گفت: «از اولین نقش جدی من در فیلم زیر پوست کارین آدلر تا زنده کردن سیرس برای کریستوفر نولان در «اودیسه»، تجربه‌ای که واقعاً زندگی را تغییر می‌دهد، BFI همیشه آنجا بوده است، نگهبان امیدهای من به عنوان یک هنرمند، و افزود: «فیلم زندگی‌ها را تغییر می‌دهد. این فیلم زندگی‌ها را تغییر می‌دهد. نیروی من است. بازیگران نترس نسل او سامانتا بیش از 30 سال است که از ریشه‌هایش در فیلم‌های مستقل گرفته تا حضور صحنه‌دزدی‌اش در یکی از بزرگ‌ترین فیلم‌های سال، ادیسه، تأثیر قدرتمندی بر تماشاگران در سراسر جهان داشته است. تعهد او به حمایت از جوانان و تسهیل دسترسی آنها به هنر، این بورسیه BFI را معنادارتر می کند. او بهترین‌های بخش نمایشگر را مظهر می‌کند.\"", "image_url": "https://deadline.com/wp-content/uploads/2026/11/Samantha-Morton-image-credit-Jana-Schueller-1.jpeg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["سینما"], "datetime_fa": "۲ آذر • ۱۸:۳۰"}, {"source": "Deadline", "title": "Keith Scholey & Alastair Fothergill Stepping Back From CEO Duties At ‘Our Planet’ Producer Silverback", "link": "https://deadline.com/2026/11/silverback-films-scholey-fothergill-stepping-back-ceo-1237231539/", "summary": "Keith Scholey and Alastair Fothergill are stepping back from the day-to-day running of Our Planet maker Silverback Films after 14 years. The pair of storied natural history makers will be replaced by a new team following a revamp at Silverback, which is now owned by Banijay. Jane Hamlin, currently Chief Operating Officer, will become Chief [ ]", "date_str": "2026-11-23T15:00:00+00:00", "hash": "e06444f84d2b2841", "title_fa": "کناره گیری کیت شولی و آلستر فوترگیل از سمت مدیر عاملی در تولیدکننده «سیاره ما» Silverback", "summary_fa": "کیت اسکولی و آلستر فوترگیل پس از 14 سال از فعالیت روزمره فیلم‌های Silverback سازنده ما سیاره عقب‌نشینی می‌کنند. پس از بازسازی در Silverback، که اکنون تحت مالکیت Banijay است، این دو سازنده تاریخ طبیعی با یک تیم جدید جایگزین خواهند شد. جین هملین، مدیر ارشد عملیاتی فعلی، رئیس خواهد شد [] هاو کوردی، تهیه کننده اجرایی، نقش مدیر خلاقیت را بر عهده خواهد گرفت. و الی سالزبری معاون مدیر تولید، مدیر عملیاتی خواهد شد. اخبار مرتبط بانیجی از اولین درآمدهای مالی خود از زمان قرارداد All3Media رونمایی می کند. می گوید انتظار می رود هم افزایی ها در سال آینده افزایش یابد. در ددلاین تماشا کنید پس از یک دوره طولانی در استودیو بی‌بی‌سی، اسکولی و فاترگیل Silverback را در سال 2012 تأسیس کردند. این شرکت تا به حال 30 برنامه برای شبکه‌هایی مانند بی‌بی‌سی، نتفلیکس، نشنال جئوگرافیک و دیزنی ساخته است که شامل چندین مشارکت با دیوید آتن‌برو، مانند سیاره ما در نتفلیکس است. دیگر موفقیت‌های بزرگ شامل Ocean با دیوید آتنبرو و Secrets of the Bees بود. Dolphins: My Close Encounters که در 28 دسامبر در نتفلیکس به نمایش درمی‌آیند و Disneynature s Wolf که در آوریل سال آینده وارد دیزنی پلاس می‌شوند، در آینده قرار دارند. Silverback گفت که این انتقال باعث می‌شود که این لباس با Banijay UK همکاری نزدیک‌تری داشته باشد، که چند هفته پیش با مالک قبلی Silverback، All3Media ادغام شد. All3Media Silverback را در سال 2020 خریداری کرد. پاتریک هالند، رئیس Banijay در بریتانیا، Silverback را یک تولیدکننده بی‌نظیر برنامه‌نویسی تاریخ طبیعی در کلاس جهانی خواند.", "image_url": "https://deadline.com/wp-content/uploads/2019/08/ourplanet_fdtg_11_adamchapman.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["سینما", "نتفلیکس"], "datetime_fa": "۲ آذر • ۱۸:۳۰"}, {"source": "Pitchfork", "title": "Listen to D’Angelo’s Posthumous Song “Kamikaze”", "link": "https://pitchfork.com/story/listen-to-dangelos-posthumous-song-kamikaze/", "summary": "The previously unreleased track surfaced in Grand Theft Auto VI’s Worldwide FM radio station", "date_str": "2026-11-23T15:02:19+00:00", "hash": "1a08596c7b14719e", "title_fa": "به آهنگ پس از مرگ D’Angelo \"Kamikaze\" گوش کنید", "summary_fa": "آهنگی که قبلاً منتشر نشده بود در ایستگاه رادیویی FM جهانی Grand Theft Auto VI ظاهر شد Loader Save Story ذخیره این داستان Comment Loader Save Story ذخیره این داستان نه، شما صدای منحصر به فرد D'Angelo فقید را در Grand Theft Auto VI تصور نمی کردید. همانطور که قبلاً گزارش شده بود، گنجینه‌ای از آهنگ‌های جدید و فیلم‌های بعید در بلاک باستر مورد انتظار Rockstar Games که هفته گذشته منتشر شد، وجود دارد. در Worldwide FM، یکی از ایستگاه های رادیویی درون بازی آن، آهنگ منتشر نشده D'Angelo \"Kamikaze\" قرار دارد. اکنون آن تک آهنگ بالاخره در سرویس های پخش در دسترس است. آن را در زیر گوش کنید. D’Angelo با پیوندهای بازی های ویدیویی غریبه نبود. در سال 2019، او آهنگ Unshaken را برای Red Dead Redemption 2 نوشت. او در ادامه توضیح داد که او یکی از طرفداران پرشور، انبوه و گسترده این فرنچایز است، با خود Rockstar Games تماس گرفت و از دفاتر این شرکت در نیویورک بازدید کرد تا ساعت ها آن را بازی کند. D'Angelo در اکتبر 2025 بر اثر سرطان درگذشت. پس از یک دوره تحسین برانگیز بین اولین آلبوم او، شکر قهوه ای سال 1995، و ادامه آن، وودو در سال 2000، D'Angelo تبدیل به یک چهره منزوی شد که به ندرت در انظار عمومی ظاهر می شد. در سال 2014 زمانی که او با Black Messiah، آلبوم تحسین‌شده‌اش با Vanguard، و تعداد انگشت شماری از حضورهای تلویزیونی خاطره‌انگیز بازگشت، تغییر کرد. او در سال‌های بعد روی چند آهنگ دیگر از جمله «IBTIHAJ» با GZA و Rapsody در سال 2019، «Behove» از Slingbaum با Erykah Badu در اوایل سال 2020 و «I Want You Forever» از Jeymes Samuel با Jay-Z برای موسیقی متن The Book of Clarence.", "image_url": "https://media.pitchfork.com/photos/67b34a61b0f42d44492ac0c0/16:9/w_1280,c_limit/d&#x27;angelo%20roots%20picnic%202025%20headlienrs.jpg", "category": "هوش مصنوعی مولد", "tags": ["سینما", "موسیقی"], "datetime_fa": "۲ آذر • ۱۸:۳۲"}, {"source": "Billboard", "title": "Corina Smith Signs With Universal Music Latino: ‘They’ve Embraced Me Exactly As I Am’", "link": "https://www.billboard.com/pro/corina-smith-universal-music-latino-signing-exclusive/", "summary": "Corina Smith has signed a deal with Universal Music Latino, Billboard can exclusively announce today (Nov. 23). “Corina Smith is an exceptional talent with a unique artistic identity, authenticity, and undeniable global potential,” Daniel Luna, general manager at Universal Music Latino, said in a statement. “What drew us to Corina is how much of herself she puts into her songs. With this genuine connection we believe Corina has everything it takes to become one of the leading voices of the next generation of Latin music. We are proud to welcome her to Universal Music Latino and be part of her new global journey.” Related Ignacio Meyer Named President of Universal Music Latin America Iberian Peninsula Ignacio Meyer Named President of Universal Music Latin America Iberian Peninsula Chris Brown Agrees to Increase Child Support For Now to Ex Diamond in Bitter Custody Fight Smith is a Venezuelan singer-songwriter who began writing songs in her bedroom and quickly brought those personal experiences to life through her blooming music career. Blending elements of pop, reggaeton and R B music, Smith’s musical identity is rooted in authenticity, vulnerability and creative independence. She says, “Through my career as an artist my fans and I have developed our own universe and the UML team has given that universe a home. They ve embraced me exactly as I am, allowing me to continue genuinely making the music that I love, with the support of their world-class team. I m so excited to continue building our universe together.” This year, Smith released key collaborations with Mika Bahía (“Encubiertos”), Dome (“@BOMBA DE HUMO” ), and Dani Barranco (“8 Preguntas”). She’s released three studio albums: Antisocial (2022), triste pero siempre mami (2023) and menos triste más mami (2025), and has collaborated with Arcángel, Eladio Carrión and De La Ghetto, to name a few. New music is slated for release in the first quarter of 2027 under her new chapter with Universal Music Latino.", "date_str": "2026-11-23T15:00:00+00:00", "hash": "f06aaa057883c93a", "title_fa": "کورینا اسمیت با یونیورسال موزیک لاتین امضا می کند: \"آنها مرا دقیقاً همانطور که هستم در آغوش گرفتند\"", "summary_fa": "کورینا اسمیت قراردادی با Universal Music Latino امضا کرده است، بیلبورد می تواند به طور انحصاری امروز (23 نوامبر) اعلام کند. دانیل لونا، مدیر کل یونیورسال موزیک لاتین در بیانیه ای گفت: «کورینا اسمیت یک استعداد استثنایی با هویت هنری منحصر به فرد، اصالت و پتانسیل جهانی غیرقابل انکار است. آنچه ما را به سمت کورینا جذب کرد این است که چقدر از خودش در آهنگ هایش استفاده می کند. با این ارتباط واقعی، ما معتقدیم که کورینا همه چیز لازم را برای تبدیل شدن به یکی از صداهای پیشرو نسل بعدی موسیقی لاتین دارد. ما مفتخریم که به او در Universal Music Latino خوش آمد می‌گوییم و بخشی از سفر جهانی جدید او هستیم. مرتبط ایگناسیو مایر به عنوان رئیس یونیورسال موسیقی آمریکای لاتین شبه جزیره ایبری ایبریا انتخاب شد ایگناسیو مایر به عنوان رئیس یونیورسال موسیقی آمریکای لاتین شبه جزیره ایبری آمریکای لاتین موافقت کرد در حال حاضر حمایت از کودکان را افزایش دهد تا دیاموند سابق در مبارزه تلخ حضانت اسمیت یک خواننده و ترانه سرای ونزوئلایی است که در اتاق خواب خود شروع به نوشتن آهنگ های شخصی کرد و به سرعت شروع به نوشتن آهنگ کرد. حرفه ترکیب عناصر موسیقی پاپ، رگیتون و RB، هویت موسیقی اسمیت ریشه در اصالت، آسیب پذیری و استقلال خلاقانه دارد. او می‌گوید: «در طول حرفه‌ام به‌عنوان یک هنرمند، من و طرفدارانم دنیای خود را توسعه داده‌ایم و تیم UML به آن جهان خانه داده است. آنها من را دقیقاً همانطور که هستم در آغوش گرفتند و به من این امکان را دادند که با حمایت تیم کلاس جهانی خود به ساختن واقعی موسیقی مورد علاقه‌ام ادامه دهم. \"من بسیار هیجان زده هستم که به ساختن جهان خود با هم ادامه دهم.\" در این سال، اسمیت همکاری‌های کلیدی خود را با Mika Bahía (\"مخفی\")، Dome (\"@BOMBA DE HUMO\") و Dani", "image_url": "https://www.billboard.com/wp-content/uploads/2026/11/corina-smith-cr-universal-music-latino-press-billboard-1800.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["موسیقی"], "datetime_fa": "۲ آذر • ۱۸:۳۰"}, {"source": "Billboard", "title": "‘It’s Not Just a Song on the Radio’: How Music Became A Main Character In ‘Grand Theft Auto VI’", "link": "https://www.billboard.com/music/features/gta-6-radio-songs-soundtrack-justice-billboard-cover-1236386805/", "summary": "For decades, Rockstar Games was chasing one song. In 2002, when the gaming behemoth was developing Grand Theft Auto: Vice City , the fourth installment of its iconic series, it had successfully secured classics like Michael Jackson’s Billie Jean and Grandmaster Flash and the Furious Five’s The Message for the game. But one record remained tantalizingly out of reach: The Cars 1984 single Drive, the highest-charting of the power-pop band’s career. A favorite of Rockstar co-founder Sam Houser, the haunting, synth-driven song encapsulated the neon-soaked 80s world the developer was expanding. Rockstar couldn t clear the track then — but more than two decades later, the wait is finally over. On Nov. 19, Rockstar made its long-awaited return to Vice City with the epic, stunningly cinematic Grand Theft Auto VI . Even before breathless reviews of the game flooded the internet, GTA VI was predicted to be the biggest entertainment launch in history, with possibly more than $5 billion in first week sales alone. And when players turn on one of the game’s defining features — the in-game radio — Drive is the first song they hear. Related Every Track From Grand Theft Auto VI: The Album Ranked Grand Theft Auto VI Soundtrack, Gracie Abrams, LISA, Tomorrow x Together More: New Music Friday Guide Justice, Pretty Lights, Honey Dijon RL Grime Lead Lightning In a Bottle 2027 Lineup For Rockstar vice president of music Ivan Pavlovich, clearing Drive wasn’t just a licensing victory — it was a testament to the company s unwavering prioritization of music, the relationships it has cultivated throughout the industry and the meticulous curation that has transformed Grand Theft Auto into one of the past 20 years’ most culture-saturating, riveting and lucrative products. Music, Pavlovich says, is the through line through all of that. That’s never been more true than with GTA VI , which Pavlovich calls the biggest project we’ve ever done, with, by his count, over 800 songs in the game right now. With 23 radio stations — 21 for music and two for talk radio — along with in-game podcasts to crank up as you re cruising through the streets of Leonida ( GTA ’s Florida stand-in), plus even TV shows to watch when you’re not, it s Rockstar’s most ambitious music-driven experience yet. In 1997, video game developers David Jones and Mike Dailly helped bring the first Grand Theft Auto to life at Scottish gaming studio DMA Design (now Rockstar North). Originally published by BMG Interactive, the 2D ", "date_str": "2026-11-23T14:59:18+00:00", "hash": "6f38829927072c0c", "title_fa": "\"این فقط یک آهنگ در رادیو نیست\": چگونه موسیقی به شخصیت اصلی \"Grand Theft Auto VI\" تبدیل شد", "summary_fa": "برای چندین دهه، Rockstar Games دنبال یک آهنگ بود. در سال 2002، زمانی که این غول بازی در حال توسعه Grand Theft Auto: Vice City، چهارمین قسمت از سری نمادین خود بود، با موفقیت آثار کلاسیکی مانند Billie Jean و Grandmaster Flash مایکل جکسون و Furious Five's The Message را برای بازی تضمین کرد. اما یک رکورد به طرز وسوسه انگیزی دور از دسترس ماند: تک آهنگ The Cars 1984 Drive، بالاترین نمودار در کارنامه گروه پاور پاپ. آهنگ مورد علاقه سام هاوسر، یکی از بنیانگذاران Rockstar، آهنگ ترسناک و مبتنی بر سنتز، دنیای نئونی دهه 80 را که سازنده در حال گسترش آن بود، در بر می گیرد. Rockstar در آن زمان نتوانست مسیر را پاک کند - اما بیش از دو دهه بعد، سرانجام انتظار به پایان رسید. در 19 نوامبر، Rockstar با فیلم حماسی و خیره کننده سینمایی Grand Theft Auto VI به Vice City بازگشت که مدت ها منتظرش بودیم. حتی قبل از اینکه بررسی‌های بی‌نفس این بازی به اینترنت سرازیر شود، GTA VI بزرگترین عرضه سرگرمی تاریخ خواهد بود که احتمالاً تنها در هفته اول فروش بیش از 5 میلیارد دلار خواهد داشت. و هنگامی که بازیکنان یکی از ویژگی های تعیین کننده بازی - رادیو درون بازی - را روشن می کنند، Drive اولین آهنگی است که می شنوند. هر آهنگ مرتبط از Grand Theft Auto VI: The Album Ranked Grand Theft Auto VI موسیقی متن، Gracie Abrams، LISA، Tomorrow x Together موارد بیشتر: New Music Friday Guide Justice، Pretty Lights، Honey Dijon RL Grime Lead Lightning In a Bottle 2027 Lineup For Rockstar Driver Pavlovich، معاون رئيس جمهور موسيقي بود. پیروزی - این گواهی بر اولویت بندی تزلزل ناپذیر این شرکت برای موسیقی، روابطی که در سراسر صنعت ایجاد کرده است و مدیریت دقیقی بود که Grand Theft Auto را به یکی از", "image_url": "https://www.billboard.com/wp-content/uploads/2026/11/cover-gta-vi-grand-theft-auto-billboard-rockstar-games-1-jason-lucia-1800.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["سینما", "موسیقی"], "datetime_fa": "۲ آذر • ۱۸:۲۹"}, {"source": "Billboard", "title": "Justin Timberlake Exposes His Doubts in Docuseries Trailer: ‘People Aren’t Gonna Understand Who I Am’", "link": "https://www.billboard.com/culture/tv-film/justin-timberlake-doubts-docuseries-trailer-release-date-1236387718/", "summary": "What goes around comes around back on TV. The Justin Timberlake documentary series that was first reported in early November is now official. Apple TV announced the four-part series, simply titled Timberlake , on Monday (Nov. 23) and dropped the project s first trailer. Related Justin Timberlake to Release 4-Part Docuseries That Includes Janet Jackson as a Guest Justin Timberlake Makes Rare Public Appearance With Sons and Niece on Runway at Down Syndrome Foundation Fashion Show Justin Timberlake Crowns This FutureSex/LoveSounds Hit as the Best Song He s Ever Made: Written in Damn Near 20 Minutes The 2.5 minute clip kicks off with the 10-time Grammy winner plopping down on a cushy couch and demanding to know, What are you looking to accomplish from this documentary? He immediately reveals his doubts about the project directed by Oscar winner Fisher Stevens. People aren t going to understand who I am! The trailer for the docuseries, which will follow the trajectory of Timberlake s career from *NSYNC through his solo success, dives in from the beginning. I m sure that you re going to go back and see these incredibly sweet and goofy things from my childhood — the star says as family footage of Timberlake as a toddler play, moving through his teen years, including a clip of him showing off the poster of Janet Jackson in his bedroom — and some things that are really hard to talk about. At that, clips of him with former girlfriend Britney Spears appear, followed by news footage of Timberlake s DUI arrest. But it s not all bad. Big names in entertainment such as Pharrell Williams and Lorne Michaels also appear to praise the singer-actor, though Janet Jackson, who was previously reported to be taking part in the project, did not appear other than in flashback clips from her 2004 Super Bowl performance with Timberlake. For the first time in my life, I m coming to a place to say, I can t handle it all,' admits the star in one confessional scene. In the finale one, he notes, You want to ask me about specific things? Let s do it! According to the press release, the four-part series will include never-before-seen archival footage, as well as interviews with his friends, collaborators and of course, his family. (Jessica Biel, whom Timberlake married in 2012, as well as his mother appear in the teaser.) The first two episodes of Timberlake will premiere Friday, Dec. 11, on Apple TV with the third episode dropping Dec. 18 and the finale arriving just in time for Christmas ", "date_str": "2026-11-23T14:55:19+00:00", "hash": "907ca7bb080ce56c", "title_fa": "جاستین تیمبرلیک شک های خود را در تریلر مستند افشا می کند: «مردم نمی توانند بفهمند من کی هستم»", "summary_fa": "آنچه در اطراف می گذرد به تلویزیون بازمی گردد. مجموعه مستند جاستین تیمبرلیک که اولین بار در اوایل نوامبر گزارش شد، اکنون رسمی شده است. اپل تی‌وی این مجموعه چهار قسمتی را با نام ساده تیمبرلیک در روز دوشنبه (23 نوامبر) اعلام کرد و اولین تریلر این پروژه را م ا و سریال‌های جدید تمرکز خواهند کرد. مدیر عامل فعلی جین هملین مدیر عامل، تهیه کننده اجرایی هوو کوردی نقش مدیر ارشد خلاقیت را بر عهده خواهد گرفت و الی سالزبری، معاون مدیر تولید، مدیر ارشد عملیات (COO) خواهد شد. این تغییرات از 1 ژانویه 2027 اعمال خواهند شد. فاترگیل بر روی مجموعه های تاریخی تاریخی طبیعی تمرکز خواهد کرد و بر اساس کار خود به عنوان تهیه کننده اجرایی مجموعه های سیاره ما، جزایر وحشی و زندگی در سیاره ما است. شولی پس از موفقیت دیوید آتنبرو: زندگی در سیاره ما و اقیانوس با دیوید آتنبرو، به کار بر روی مستندهای بلند ادامه خواهد داد. Silverback که در سال 2012 در بریستول تأسیس شد، از یک تیم کوچک به یک شرکت با روابط طولانی مدت با BBC، Netflix، National Geographic و Disney تبدیل شده است. کارهای اخیر آن شامل بیلی مولی: داستان عشق سمور، دایناسورها از نتفلیکس و داستان گوریل: به روایت دیوید آتنبورو و رازهای زنبورهای نشنال جئوگرافیک است. داستان‌های مرتبط Business UTA ​​برای متحد کردن کسب‌وکارها در دفتر مرکزی لندن در فیلم‌های 2027 ستاره ادیسه سامانتا مورتون با بورسیه BFI تجلیل شد", "image_url": "https://www.hollywoodreporter.com/wp-content/uploads/2026/11/Silverback-Films-CEO-and-CCO-Jane-Hamlin-and-Huw-Cordey-Silverback-Films.jpg?w=1440&#038;h=810&#038;crop=1", "category": "هوش مصنوعی مولد", "tags": ["سینما", "نتفلیکس"], "datetime_fa": "۲ آذر • ۱۸:۳۰"}, {"source": "Hollywood Reporter", "title": "UTA to Unite Businesses at New London Headquarters in 2027", "link": "https://www.hollywoodreporter.com/business/business-news/uta-new-london-headquarters-one-rathbone-square-2027-1236760955/", "summary": "Bringing UTA, Curtis Brown and ROOF together at a new location \"represents our commitment to our U.K. presence,\" says Darnell Strom, head of UTA’s U.K. office.", "date_str": "2026-11-23T15:00:00+00:00", "hash": "6d99b5a04745fd63", "title_fa": "UTA برای متحد کردن مشاغل در مقر نیو لندن در سال 2027", "summary_fa": "دارنل استروم، رئیس دفتر UTA در بریتانیا، می‌گوید: گرد هم آوردن UTA، Curtis Brown و ROOF در یک مکان جدید \"نماینده تعهد ما به حضور ما در بریتانیا است.\" شرکت استعدادهای .recart.ir/archive/2026-09-13.html"}, {"date_key": "2026-09-12", "p_date": "۲۱ شهریور ۱۴۰۵", "g_date": "۱۲ سپتامبر ۲۰۲۶", "url": "https://news.recart.ir/archive/2026-09-12.html"}, {"date_key": "2026-09-11", "p_date": "۲۰ شهریور ۱۴۰۵", "g_date": "۱۱ سپتامبر ۲۰۲۶", "url": "https://news.recart.ir/archive/2026-09-11.html"}, {"date_key": "2026-09-10", "p_date": "۱۹ شهریور ۱۴۰۵", "g_date": "۱۰ سپتامبر ۲۰۲۶", "url": "https://news.recart.ir/archive/2026-09-10.html"}, {"date_key": "2026-09-09", "p_date": "۱۸ شهریور ۱۴۰۵", "g_date": "۹ سپتامبر ۲۰۲۶", "url": "https://news.recart.ir/archive/2026-09-09.html"}, {"date_key": "2026-09-07", "p_date": "۱۶ شهریور ۱۴۰۵", "g_date": "۷ سپتامبر ۲۰۲۶", "url": "https://news.recart.ir/archive/2026-09-07.html"}];

    let currentTab = 'persian';
    let searchQuery = '';
    let readArticles = new Set(JSON.parse(localStorage.getItem('read_articles_registry') || '[]'));

    function toFaDigits(n) {
      const f = ['۰','۱','۲','۳','۴','۵','۶','۷','۸','۹'];
      return n.toString().replace(/\d/g, d => f[d]);
    }

    function toggleRead(hash) {
      if (readArticles.has(hash)) {
        readArticles.delete(hash);
      } else {
        readArticles.add(hash);
      }
      localStorage.setItem('read_articles_registry', JSON.stringify(Array.from(readArticles)));
      renderNews();
    }

    function renderNews() {
      const container = document.getElementById('newsContainer');
      const rawItems = data[currentTab] || [];
      
      const filtered = rawItems.filter(item => {
        if (!searchQuery) return true;
        const q = searchQuery.toLowerCase();
        const title = (item.title_fa || item.title || '').toLowerCase();
        const summary = (item.summary_fa || item.summary || '').toLowerCase();
        const source = (item.source || '').toLowerCase();
        const category = (item.category || '').toLowerCase();
        const tags = (item.tags || []).join(' ').toLowerCase();
        return title.includes(q) || summary.includes(q) || source.includes(q) || category.includes(q) || tags.includes(q);
      });

      const unreadList = [];
      const readList = [];

      filtered.forEach(item => {
        if (readArticles.has(item.hash)) {
          readList.push(item);
        } else {
          unreadList.push(item);
        }
      });

      const sortedItems = [...unreadList, ...readList];

      if (sortedItems.length === 0) {
        container.innerHTML = '<div style="text-align:center; padding: 40px; color: var(--text-muted);">هیچ خبری در این بخش در ۲۴ ساعت گذشته ثبت نشده است.</div>';
        return;
      }

      container.innerHTML = sortedItems.map((item, idx) => {
        const title = item.title_fa || item.title || '';
        const summary = item.summary_fa || item.summary || '';
        const source = item.source || 'منبع خبر';
        const link = item.link || '#';
        const isRead = readArticles.has(item.hash);
        const num = toFaDigits(idx + 1);
        const category = item.category || '';
        const tags = item.tags || [];
        const datetimeFa = item.datetime_fa || '';

        return `
          <article class="news-card ${isRead ? 'is-read' : ''}" id="card-${item.hash}">
            <div class="news-header">
              <span class="news-num">${isRead ? '✓' : num}</span>
              <h2 class="news-title">${title}</h2>
            </div>
            ${summary ? `<p class="news-summary">${summary}</p>` : ''}
            <div class="news-footer">
              <div class="footer-top-row">
                <div class="meta-group">
                  <span class="news-source">📌 ${source}</span>
                  ${datetimeFa ? `<span class="news-datetime">🕒 ${datetimeFa}</span>` : ''}
                  ${category ? `<span class="news-category-badge" onclick="filterByTag('${category}')">📂 ${category}</span>` : ''}
                </div>
              </div>
              ${tags && tags.length > 0 ? `
                <div class="footer-tags-row">
                  ${tags.map(t => `<span class="news-tag-chip" onclick="filterByTag('${t}')">#${t}</span>`).join('')}
                </div>
              ` : ''}
              <div class="footer-bottom-row">
                <div class="footer-actions-right">
                  <button class="btn-mark-read" onclick="toggleRead('${item.hash}')">
                    ${isRead ? '✓ خوانده شد' : '○ علامت خوانده‌شده'}
                  </button>
                </div>
                <div class="footer-actions-left">
                  ${link && link.startsWith('http') ? `<a href="${link}" target="_blank" rel="noopener noreferrer" class="news-link">مطالعه اصل خبر ↗</a>` : ''}
                </div>
              </div>
            </div>
          </article>
        `;
      }).join('');
    }

    function filterByTag(val) {
      const searchInput = document.getElementById('searchInput');
      if (searchInput) {
        searchInput.value = val;
        searchQuery = val;
        renderNews();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    }

    function switchTab(tab, el) {
      currentTab = tab;
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      if (el) el.classList.add('active');
      renderNews();
    }

    function toggleTheme() {
      const html = document.documentElement;
      const current = html.getAttribute('data-theme') || 'dark';
      const next = current === 'dark' ? 'light' : 'dark';
      html.setAttribute('data-theme', next);
      localStorage.setItem('theme', next);
      updateThemeButton(next);
    }

    function updateThemeButton(theme) {
      const icon = document.getElementById('themeIcon');
      const text = document.getElementById('themeText');
      if (theme === 'dark') {
        icon.textContent = '☀️';
        text.textContent = 'حالت روشن';
      } else {
        icon.textContent = '🌙';
        text.textContent = 'حالت تاریک';
      }
    }

    function toggleArchiveModal(show) {
      const modal = document.getElementById('archiveModal');
      if (show) {
        renderArchiveList();
        modal.classList.add('active');
      } else {
        modal.classList.remove('active');
      }
    }

    function renderArchiveList() {
      const listContainer = document.getElementById('archiveListContainer');
      if (!archiveManifest || archiveManifest.length === 0) {
        listContainer.innerHTML = '<div style="text-align:center; padding: 20px; color: var(--text-muted);">هنوز شماره قبلی ثبت نشده است.</div>';
        return;
      }

      listContainer.innerHTML = archiveManifest.map(item => `
        <a href="${item.url}" class="archive-item">
          <div>
            <div class="archive-date-fa">📰 شماره ${item.p_date}</div>
            <div class="archive-date-g">🌍 ${item.g_date}</div>
          </div>
          <span class="archive-arrow">←</span>
        </a>
      `).join('');
    }

    const savedTheme = localStorage.getItem('theme') || 'dark';
    document.documentElement.setAttribute('data-theme', savedTheme);
    updateThemeButton(savedTheme);

    document.getElementById('searchInput').addEventListener('input', (e) => {
      searchQuery = e.target.value.trim();
      renderNews();
    });

    renderNews();
  </script>
