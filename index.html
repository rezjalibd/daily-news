s. She founded the Austin, Texas-based company, Contrarian Thinking, which helps people buy and build businesses. Sanchez also has a big social media presence, with 3.3 million Instagram followers and a popular podcast called \"BigDeal.\" Sanchez tells a story about gossip in her new book, \"Own or Be Owned: Build a Business So Good It Doesn't Need You.\" It's a follow-up to her New York Times bestseller \"Main Street Millionaire.\" Sanchez wrote that she had just ended remote work, which led to people quitting, being fired, and fights on Slack. One person, she wrote, \"became the mascot for everything broken.\" \"Every week they'd find a new audience to tell, 'We work too hard, this place is crazy, everything else is the problem,'\" she wrote. Her takeaway was that people who \"live on gossip and victimhood\" not only underperform but also spread a bad culture to the rest of the company. Sanchez confronted the employee about whether they'd taken their issues up with their manager, to which they replied, \"They wouldn't listen anyway.\" Sanchez let the employee go. Then she shared at an all-hands meeting that she'd let someone go, not because they were bad at their job, but because they \"broke our code.\" \"If you want to whisper in hallways, this is the wrong company for you,\" she wrote. At times, she's brought leaders together to air their grievances. \"I don't like toxic cultures where people go back and forth behind the scenes,\" she said. \"I like people being direct, and I don't think you should ever get in trouble for saying something that's not, maybe politically correct, because I'm the CEO.\" The pros and cons of radical candor Other CEOs have embraced various forms of radical candor. Under Ray D", "date_str": "2026-09-24T09:05:01+00:00", "hash": "63a09f34446b0cfe", "title_fa": "کودی سانچز مجری برنامه BigDeal می گوید اگر کارمندانش در شرکتش شایعه پراکنی کنند او را اخراج خواهد کرد.", "summary_fa": "کودی سانچز، بنیانگذار تفکر مخالف. تفکر متضاد کودی سانچز گف ng themselves in a perhaps stranger position, wondering if it's actually the \"customer\" that's a robot . Those suspicions are proving to be true. AI agents are increasingly being used to call customer-service lines, sit on hold, and try to negotiate bills or cancel subscriptions, all while the people they're \"working\" for don't lift a bureaucratic finger. With user-friendlier agents such as Meta's Muse and the upstart Instinct on the market, more consumers are giving AI deployment a go. For them, it may be a useful time-saver and a way of giving corporations a taste of their own medicine — who among us hasn't found ourselves begging a bot to speak with a representative? But there are human agents caught in the crossfire, and they're entering a brave, jarring new world: helping a customer that isn't actually there. AI callers remain a small share of total volume, but they're growing at a fast enough pace that outsourcing firms, banks, insurers, and retailers are bracing themselves. The questions go beyond etiquette. How do you authenticate an AI agent? Should you engage at all? How do you tell whether it's authorized to act on someone's behalf or a scammer? Are you even allowed to ask if it's AI? One call center agent who works in the claims department of a California-based insurance company tells me she gets a couple of calls from the same AI agent every shift, reaching out on behalf of a firm of accident attorneys. While AI agents generally have a reputation for being extra polite, that's not the case with this one. She is supposed to ask a series of questions to get more details about the incident. Take, say, a car accident claim: Were the airbags deployed? Was the driver working for Uber? Do they have an auto body shop they want to take it to? The law-bot gets progressively irritated when it doesn't have the answers, angrily repeating that it already told her it doesn't know and insisting she wait on hold for an associate who never materializes. \"If it's still talking back, we have to stay on until it disconnects,\" the insurance agent says. It usually takes about five minutes. \"It has an attitude. It's funny.\" What's not so fun", "date_str": "2026-09-24T08:47:01+00:00", "hash": "dc794aec3caf9d8f", "title_fa": "نماینده خدمات مشتری شما مایل است با یک انسان صحبت کند", "summary_fa": "گتی ایماژ; Alyssa Powell/BI کارکنان خدمات مشتری به این سوال رایج که از آن طرف خط می آید عادت کرده اند: \"صبر کنید، آیا شما یک هوش مصنوعی هستید؟\" اشتباه گرفتن با فناوری که کارفرمای شما امیدوار است جایگزین شما شود، به یک بخش معمولی، و البته ناخوشایند، تبدیل شده است. اکنون، افرادی که در مراکز تماس کار می کنند، خود را در موقعیتی عجیب و غریب می بینند و از خود می پرسند که آیا واقعاً «مشتری» یک ربات است یا خیر. این شبهات ثابت می شود که درست است. عوامل هوش مصنوعی به طور فزاینده ای برای تماس با خطوط خدمات مشتری، نشستن در انتظار و تلاش برای مذاکره در مورد صورتحساب یا لغو اشتراک استفاده می شوند، همه اینها در حالی که افرادی که برای آنها \"کار می کنند\" انگشت بوروکراسی را بر نمی دارند. با وجود عوامل کاربرپسندتر مانند Meta's Muse و Instinct نوپا در بازار، مشتریان بیشتری به استقرار هوش مصنوعی دست می زنند. برای آنها، ممکن است این یک صرفه جویی در زمان مفید باشد و راهی برای طعم دادن به شرکت ها از داروی خود باشد - کدام یک از ما خود را پیدا نکرده ایم که از یک ربات التماس کنیم تا با یک نماینده صحبت کند؟ اما عوامل انسانی در آتش متقابل گرفتار شده‌اند، و آنها وارد دنیای جدید و شجاعانه می‌شوند: کمک به مشتری که واقعاً آنجا نیست. تماس‌گیرندگان هوش مصنوعی سهم کمی از حجم کل باقی می‌مانند، اما با سرعت کافی در حال رشد هستند که شرکت‌های برون‌سپاری، بانک‌ها، بیمه‌گران و خرده‌فروشان خود را آماده می‌کنند. سوالات فراتر از آداب معاشرت است. چگونه یک عامل هوش مصنوعی را تأیید می کنید؟ آیا اصلاً باید درگیر شوید؟ چگونه می توان تشخیص داد که آیا مجاز است از طرف شخصی اقدام کند یا یک کلاهبردار؟ آیا حتی اجازه دارید بپرسید که"}, {"source": "Business Insider", "title": "Flying in Beta Technologies' Alia CX300 showed me why electric planes aren't mainstream yet", "link": "https://www.businessinsider.com/beta-technologies-alia-cx300-electric-plane-commercial-flight-2026-9", "summary": "tk Beta's electric plane can already fly for hours. So why aren't paying passengers riding in one yet? The biggest roadblock is hiding under the floor: nearly 3,000 pounds of batteries. Beta is racing toward a 2027 certification target, but getting airborne may be the easy part. US airline fares rose almost 24% over the past year, making the prospect of cheaper short flights especially appealing. One possible solution: electric planes. For our video series, \" The Limit ,\" I recently took a 25-minute flight on Beta Technologies' Alia CX300. The journey used about $5.25 in electricity. A comparable trip in a conventional jet-fuel-powered plane would have cost an estimated 10 times as much in fuel, about $60 Electric aviation has spent decades promising an electric-car-style revolution. Beyond lower costs, electric planes could make short flights quieter and produce no in-flight emissions. Now, one Vermont-based company is facing a crucial test. Beta Technologies is aiming to get its Alia CX300 certified by the Federal Aviation Administration by the end of 2027. The plane has already flown nearly 400 miles on a charge and stayed airborne for over five hours. The question is whether those advantages can translate into a viable business. Other electric-aircraft startups have run into financial trouble after spending years trying to bring aircraft to market. I toured Beta's manufacturing facility, watched how it builds its batteries and aircraft, and flew aboard the CX300 myself. What I saw helps explain why electric planes still aren't regularly carrying passengers, more than 50 years after the first electric aircraft flew — and what Beta has to accomplish over the next year if it wants to change that. Beta thinks controlling almost everything could give it an edge. Nicolas Economou/NurPhoto via Getty Images Other electric-aircraft companies have already gone under after nsitive information. Kelly ruled that the government had not provided enough evidence to support that argument at this stage of the case. \"The record lacks factual support for Defendants' contention that the revocation of Plaintiffs' hard passes will in fact protect national security or that national security will be endangered if the Court orders their passes reinstated while this litigation proceeds,\" he wrote. Kelly added that he was bound by a long-standing precedent holding that White House correspondents have a protected liberty interest in their White House press credentials. He found the administration revoked the reporters' hard passes without providing notice and an opportunity to be heard. Politico and Business Insider are both owned by Axel Springer SE. Read the original article on Business Insider", "date_str": "2026-09-24T06:47:34+00:00", "hash": "7ba0861830d9bc85", "title_fa": "تلاش ترامپ برای دور نگه داشتن CNN، Politico و MS NOW از کاخ سفید با مشکل مواجه شده است.", "summary_fa": "الکسی جی. روزنفلد/ گتی ایماژ یک قاضی به کاخ سفید دستور داد تا اعتبارنامه خبرنگاران CNN، Politico و MS NOW را بازگرداند. این حکم موقتاً مانع از تلاش ترامپ برای جلوگیری از دسترسی این رسانه‌ها به کاخ سفید می‌شود. این رسانه ها می گویند که این ممنوعیت متمم اول و حفاظت های مربوط به روند قانونی را نقض می کند. یک قاضی فدرال موقتاً دولت ترامپ را از اجرای ممنوعیت فعالیت خبرنگاران CNN، Politico و MS NOW در کاخ سفید منع کرده است و دستور داده است تا زمانی که پرونده ادامه دارد، اعتبار مطبوعاتی این رسانه ها بازیابی شود. تیموتی کلی، قاضی منطقه ای ایالات متحده، پس از اینکه سه سازمان خبری استدلال کردند که کاخ سفید به طور غیرقانونی دسترسی آنها را لغو کرده است، دستور منع موقت 14 روزه صادر کرد. او در حکم خود نوشت: «این سوابق فاقد پشتوانه واقعی برای ادعای متهمان است که ابطال پاس‌های سخت شاکیان در واقع امنیت ملی را حفظ می‌کند یا اگر دادگاه حکم به اعاده گذرنامه‌های آنها در حین ادامه این دعوا بدهد، امنیت ملی به خطر می‌افتد». دونالد ترامپ، رئیس جمهور آمریکا هفته گذشته این ممنوعیت را اعلام کرد و رسانه ها را به انتشار گزارش های نادرست متهم کرد. CNN، Politico، و MS NOW بلافاصله پس از آن شکایت کردند و مدعی شدند که این اقدام حقوق متمم اول و متمم پنجم را نقض می کند. دولت استدلال کرد که این ممنوعیت با نگرانی‌های امنیت ملی توجیه می‌شود و گفت که این رسانه‌ها گزارش‌هایی حاوی اطلاعات طبقه‌بندی شده یا حساس منتشر کرده‌اند. کلی حکم داد که دولت شواهد کافی برای حمایت از این استدلال در این مرحله از پرونده ارائه نکرده است. او نوشت: «سابقه فاقد پشتوانه واقعی برای ادعای متهمان است که ابطال پاس‌های سخت شاکیان در واقع امنیت ملی را حفظ می‌کند یا اگر دادگاه"}, {"source": "Business Insider", "title": "Instinct's founder says the viral AI agent's hallucinations can spit out what looks like a stranger's data", "link": "https://www.businessinsider.com/instinct-founder-noah-shinn-ai-agent-hallucinate-stranger-data-leak-2026-9", "summary": "Personal AI agents like Instinct are taking over the tech world. Dado Ruvic/REUTERS The founder of a viral AI assistant said it can hallucinate and appear to send you a stranger's details. Noah Shinn said Instinct did this by fabricating a proper noun and then amplifying it with its reasoning. It came after a user said on X that Instinct told them a photo had \"crossed into\" their conversation. If your personal AI assistant sends you what looks like intimate details about someone else's life, chances are it made up the whole thing. At least, that's what Instinct's creator, Noah Shinn, said happened when a user of the viral AI tool said an agent admitted to leaking someone else's conversation into their chat. The poster, @prit4k, uploaded screenshots of their interaction with Instinct on Tuesday, which show that the assistant seemingly gave them someone else's middle name and discussed a photo they never sent of a document mentioning money. Then, Instinct apologized and straight up told @prit4k that the photo \"got crossed into\" their conversation, calling it a \"serious glitch.\" \"Was this a data leak or a hallucination?\" @prit4k wrote in alarm on ook place while OpenAI's team was conducting internet research on public medicine spending, leading the AI agent to obtain information in rogue ways. Albanese said that the situation was \"obviously unacceptable.\" \"Today, I spoke with the CEO of OpenAI, Sam Altman , to express Australia's extreme concern about this incident,\" he said. Albanese is in New York to attend the UN General Assembly. The minister added that on Wednesday, he was establishing a task force to conduct an \"urgent and immediate review of this incident,\" and that Australia was working to establish AI standards to ensure the technology works for the people. Drew Pusateri, a spokesperson for OpenAI, told Business Insider that the company is in the midst of an \"extensive review of misaligned model activity during training and evaluation.\" \"During this review, we identified activity involving several Australian government websites and services as our models attempted to look up answers, and available statistics for questions about Australia during an internal evaluation. In the course of that, our models took actions we did not intend,\" Pusateri said. The incident occurred in June, but OpenAI was not aware of the hack until August, when it was reviewing the model. The company notified Services Australia on September 10, per Pusateri, following an investigation into what information the model had accessed. He added that OpenAI's review found no evidence of patient records being accessed, and that the information found concerned health statistics and internal file names. In his media briefing, Albanese said there was a delay in OpenAI notifying the Australian government about the hacking. \"It was that it took until 10 September before there was any", "date_str": "2026-09-24T06:29:09+00:00", "hash": "99d22c78992c1bad", "title_fa": "اوه ربات OpenAI یک وب سایت دولتی استرالیا را هک کرد.", "summary_fa": "آنتونی آلبانیز، نخست وزیر استرالیا گفت که یک عامل OpenAI در ماه ژوئن به وب سایت دولتی هک شد. هی ically tracked a roughly 2-basis-point move in the 10-year Treasury yield. Rising Treasury yields can ripple through mortgages, loans, and stock valuations. Investors worried about rising bond yields may want to spend less time watching the Federal Reserve and more time watching oil prices, according to an economist. The recent sell-off in US government bonds has become closely tied to swings in crude oil prices as the war in Iran fuels fears that inflation could remain elevated, according to GlobalData. TS Lombard chief US economist Steven Blitz. Early Thursday, the benchmark 10-year US Treasury yield was trading above 5.1%, having hit its highest level since the Global Financial Crisis a day earlier. That followed a weekslong bond sell-off fueled by persistent inflation, rising oil prices, heavy government borrowing, and growing competition for capital. \"In this moment, the 10-year is a bet on oil prices,\" Blitz wrote in a note published on Wednesday. Treasury yields are typically driven by expectations for Federal Reserve policy, inflation, and the broader economic outlook. However, oil has become the more important market to watch, he added. International Brent crude futures have climbed about 40% since the US-Iran war began, raising concerns that higher energy prices could keep inflation elevated and prompting investors to demand higher yields on long-term government debt. Since 2012, every $1 move in West Texas Intermediate crude has been associated with nearly a 2-basis-point move in the 10-year Treasury yield, according to Blitz's analysis. \"Short-term, it is a trade, not an investment,\" he wrote, referring to the 10-year Treasury. The pressure isn't limited to the US. Investors are also watching Japan, where government bond yields have climbed to their highest levels in decades as the Bank of Japan unwinds years of ultra-loose monetary policy, making Japanese government debt a more attractive alternative for domestic investors, who have long been among ource": "Business Insider", "title": "Sofia Coppola says she knows a project is worth making when it scares her", "link": "https://www.businessinsider.com/sofia-coppola-new-project-scary-self-doubt-challenge-2026-9", "summary": "Sofia Coppola said fear is what makes a new project worth taking on. Swan Gallet/WWD via Getty Images Sofia Coppola says every new movie still scares her — and that's the point. The award-winning filmmaker said she sees that as a sign the project is worth taking on. Coppola also said she has learned not to look at bad reviews. Sofia Coppola says she still feels nervous whenever she begins a new movie, but considers that fear part of what makes the work meaningful. During an appearance on the \" Happy Hour with Ina Garten \" podcast on Wednesday, the Academy Award-winning filmmaker said she has \"no idea\" how a new movie will come together when she first starts working on it. \"It's always scary — and someone told me it's not worthwhile unless it's scary, because you're invested in it,\" Coppola told host Ina Garten . \"It's a thrill,\" Coppola added. Garten said she, too, sees discomfort as a sign a project is worth taking on: \"If it doesn't keep me up at night, I don't want to do it.\" Coppola said she sees no point in doing something that doesn't challenge her, even if starting a new film can leave her feeling like she has to find her footing all over again. The uncertainty never really goes away, she said: \"You're always like, 'What if it's a disaster?'\" However, once production begins, Coppola said she becomes absorbed in bringing her vision to life with the crew. \"But then I'm so fixated on what I have in my mind and seeing that come together, the fun of making it and getting together with the crew to make it,\" she said. \"It's so collaborative.\" Coppola also said she avoids reading bad reviews, though she recently came across a box of negative reviews of her 2006 film \"Marie Antoinette.\" \"It's so fun that it survived and found a new audience that likes it,\" she said. Coppola has previously spoken about dealing with self-doubt. In a March NPR interview about her documentary on fashion designer Marc Jacobs, Coppola said she could relate to his worries as he prepared for a runway show because she was \"going through the same exact thing\" while making the film. However, she said having some self-doubt can be useful: \"I don't trust anyone that doesn't have a little self-doubt. I think you need a little to keep you on your toes.\" Other high-profile figures have similarly said they see uncertainty as an opportunity to grow. In January 2024, Barbara Corcoran said that feeling like an impostor had fueled her success, since it pushed her to work harder and, in the proce", "date_str": "2026-09-24T06:22:06+00:00", "hash": "7d2cdf9c7fe517e2", "title_fa": "سوفیا کاپولا می‌گوید که می‌داند زمانی که یک پروژه او را می‌ترساند ارزش ساختن آن را دارد", "summary_fa": "سوفیا کاپولا می‌گوید ترس چیزی است که باعث می‌شود یک پروژه جدید ارزش پذیرش داشته باشد. سوفیا کاپولا می‌گوید که هر فیلم جدید همچنان او را می‌ترساند - و نکته اینجاست. این فیلمساز برنده جایزه گفت که او به عنوان نشانه ای از این می بیند که پروژه ارزش اجرا دارد. کاپولا همچنین گفت که یاد گرفته است به نقدهای بد نگاه نکند. سوفیا کاپولا می‌گوید وقتی فیلم جدیدی را شروع می‌کند همچنان عصبی است، اما این ترس را بخشی از چیزی می‌داند که کار را معنادار می‌کند. در جریان حضور در پادکست «ساعت شاد با اینا گارتن» در روز چهارشنبه، این فیلمساز برنده جایزه اسکار گفت که او «هیچ ایده ای» ندارد که وقتی برای اولین بار روی آن کار می کند، یک فیلم جدید چگونه گرد هم می آید. کاپولا به مجری برنامه Ina Garten گفت: \"همیشه ترسناک است - و یکی به من گفت که ارزشش را ندارد مگر اینکه ترسناک باشد، زیرا شما روی آن سرمایه گذاری کرده اید.\" کاپولا افزود: «این یک هیجان است. گارتن گفت که او نیز ناراحتی را نشانه‌ای می‌داند که یک پروژه ارزش انجام آن را دارد: \"اگر من را در شب بیدار نگه نمی‌دارد، نمی‌خواهم آن را انجام دهم.\" کاپولا گفت که هیچ فایده ای برای انجام کاری که او را به چالش نمی کشد، eters, or 1,312 feet, of minefields during that timeframe, as part of a recent offensive in Donetsk called Operation Vivaldi. Few details are publicly known about the operation, though the Third Army Corps said last week that it seized roughly 50 square miles of territory around the city of Lyman. The Third Army Corps has been one of Ukraine's most prominent military formations to promote the use of uncrewed ground vehicles, posting regularly about their deployment in logistics and assault missions. \"During the offensive Operation Vivaldi, these technologies allowed for the rapid mining of enemy movement routes and disruption of their logistics,\" the Third Army Corps said. A map posted by the corps indicated that the mines were laid near Shandryholove, a contested village about six miles northwest of Lyman. Several animated videos also showed a hexacopter heavy bomber drone carrying a mine, as well as a TerMIT tracked modular uncrewed ground vehicle. It's unclear if these were the specific types of drones used in the minelaying operation. The Third Army Corps did not immediately respond to a request for comment sent outside daylight hours in Ukraine by Business Insider. Earlier this week, the corps also said it had used heavy bomber hexacopters — known colloquially as \"vampire\" or \"baba yaga\" drones — to drop exploding uncrewed ground vehicles behind Russian lines. Brig. Gen. Andrii Biletskyi, commander of the Third Army Corps, said in a video shared by the formation that \"our heavy bomber drones deliver suicide ground drones more than 10 kilometers into the enemy's rear.\" The past year has seen Ukraine increasingly use ground drones to carry s", "date_str": "2026-09-24T04:01:01+00:00", "hash": "1aec14e2fac89fa0", "title_fa": "پهپادها فقط به 2 شب برای مین گذاری یک میدان مین نیاز دارند که 2 هفته به سربازان نیاز دارد: سپاه اوکراین", "summary_fa": "ترمیت یکی از پهپادهای زمینی بود که در ویدئوهای ماکتی پیوست شده به اطلاعیه سپاه سوم ارتش نشان داده شد. آلینا اسموتکو/رویترز نیروهای اوکراینی گفتند هواپیماهای بدون سرنشین زمینی و هوایی آنها زمان مین گذاری را با دستورات بزرگی کاهش داده اند. سپاه سوم ارتش اعلام کرد که برای مین گذاری به هواپیماهای بدون سرنشین تقریباً 2 شب زمان نیاز دارد که استقرار آنها 2 هفته طول می کشد. این سازمان گفت که پهپادهای آنها اخیراً در دونتسک این هفته یک چهارم مایل مین گذاشته اند. یک سپاه ارتش اوکراین گفت که از پهپادهای هوایی و زمینی برای قرار دادن میدان مین در عمق تقریباً یک چهارم مایلی، در یکی از اولین نمونه‌های بزرگ مقیاس بزرگ مین‌برداری از راه دور با سیستم‌های بدون خدمه استفاده کرده است. سپاه سوم ارتش روز چهارشنبه گفت که پهپادهایش تقریباً دو شب طول می‌کشد تا مین‌هایی را مستقر کنند که «حدود دو هفته به انسان زمان نیاز دارد». بر اساس بیانیه خود در تلگرام، این سپاه در آن بازه زمانی حدود 400 متر یا 1312 فوت میدان مین گذاشت که بخشی از حمله اخیر در دونتسک به نام عملیات ویوالدی است. جزئیات کمی در مورد این عملیات به طور عمومی شناخته شده است، اگرچه سپاه سوم ارتش هفته گذشته اعلام کرد که حدود 50 مایل مربع از اراضی اطراف شهر لیمان را تصرف کرده است. سپاه سوم ارتش یکی از برجسته‌ترین تشکل‌های نظامی اوکراین برای ترویج استفاده از وسایل نقلیه زمینی بدون خدمه بوده است و مرتباً در مورد استقرار آنها در مأموریت‌های لجستیکی و تهاجمی پست می‌فرستد. سپاه سوم ارتش گفت: «در طول عملیات تهاجمی ویوالدی، این فناوری‌ها امکان استخراج سریع مسیرهای حرکتی دشمن و اختلال در تدارکات آنها را فراهم کردند. نقشه ارسال شده توسط سپاه نشان می‌دهد که مین‌ها در نزدیکی Shandryholove، روستایی مورد مناقشه در حدود شش مایلی شمال غربی"}, {"source": "Business Insider", "title": "Meta beat OpenAI to the punch on announcing an AI gadget", "link": "https://www.businessinsider.com/meta-just-beat-openai-to-the-on-an-ai-device-2026-9", "summary": "Meta CEO Mark Zuckerberg. Andrej Sokolow/picture alliance via Getty Images Meta teased a new AI device called Charm at its Connect event on Wednesday. The small device packs in Meta's new AI agent, Muse, and has a screen. It's a shot across the bow to OpenAI, which has its own high-profile AI device effort. Meta could be beating OpenAI to the punch on the hardware front. The social media giant announced that it has put its viral new AI agent, Muse, into a small device you can speak to. The gizmo is called \"Charm,\" and only a few have been made so far, Meta CEO Mark Zuckerberg announced Wednesday at the company's Connect event. He said it should be ready to ship in time for the holiday shopping season. \"We've packed a lot of technology into this little guy,\" Zuckerberg said onstage. \"If you're not wearing glasses, this is going to be by far the best way to talk to your Muse and show it what's going on around you.\" It signals that Meta is becoming a serious competitor in the race to build an AI device that goes beyond smartphones. It's also a shot across the bow at OpenAI, which has created a lot of buzz around its own efforts to build an AI device. Last year, OpenAI bought legendary Apple designer Jony Ive's startup to work on a physical device. So far, little is publicly known about that device. Zuckerberg only teased Charm at the very end of the conference. Charm has a screen, which showcases \"Jolly,\" the mascot of Muse, which Meta launched earlier this month. While the overwhelming majority of Meta's revenue comes from its ads business, it's making a big bet on hardware. Getting people to use Meta products through its own devices would unlock major advantages for the tech giant. Charm was born out of Meta's new design lab, led by former Apple interface design chief Alan Dye, Bloomberg reported. Meta didn't immediately respond to a request for comment on the report. Meta has been expanding its hardware efforts elsewhere. Earlier this year, Meta tapped Rui Xu , a veteran with years of experience at China's top tech companies, to lead a hardware effort inside its superintelligence division, Business Insider previously reported. OpenAI didn't immediately respond to a request for comment from Business Insider. Have a tip? Contact this reporter via email at crollet@businessinsider.com or on Signal and WhatsApp at 628-282-2811 . Use a personal email address, a nonwork WiFi network, and a nonwork device; here ' s our guide to sharing information securely. Read t", "date_str": "2026-09-24T00:43:22+00:00", "hash": "4d88c4e8101fab26", "title_fa": "متا با معرفی یک ابزار هوش مصنوعی OpenAI را شکست داد", "summary_fa": "مارک زاکربرگ مدیر عامل متا. Andrej Sokolow/تصویر اتحاد از طریق Getty Images Meta یک دستگاه هوش مصنوعی جدید به نام Charm را در رویداد Connect خود در روز چهارشنبه تیز کرد. این دستگاه کوچک در عامل جدید هوش مصنوعی متا، Muse، بسته بندی می شود و دارای صفحه نمایش است. این یک شات در سراسر تعظیم به OpenAI است، که تلاش دستگاه هوش مصنوعی خود را دارد. متا می تواند OpenAI را در بخش سخت افزاری شکست دهد. این غول رسانه های اجتماعی اعلام کرد که عامل جدید هوش مصنوعی ویروسی خود، Muse را در دستگاه کوچکی قرار داده است که می توانید با آن صحبت کنید. مارک زاکربرگ، مدیرعامل متا روز چهارشنبه در رویداد Connect شرکت اعلام کرد که این ابزار \"Charm\" نام دارد و تاکنون تنها تعدادی از آنها ساخته شده است. او گفت که باید به موقع برای فصل خرید تعطیلات آماده ارسال شود. زاکربرگ روی صحنه گفت: «ما فناوری‌های زیادی را در این پسر کوچک قرار داده‌ایم. \"اگر عینک نمی‌زنید، این بهترین راه برای صحبت با موز خود و نشان دادن آنچه در اطراف شما می‌گذرد خواهد بود.\" این نشان می دهد که متا در حال تبدیل شدن به یک رقیب جدی در رقابت برای ساخت دستگاه هوش مصنوعی است که فراتر از تلفن های هوشمند است. این همچنین یک شات در سراسر کمان در OpenAI است، که سر و صدای زیادی در مورد تلاش های خود برای ساخت یک دستگاه هوش مصنوعی ایجاد کرده است. سال گذشته، OpenAI، استارت‌آپ Jony Ive، طراح افسانه‌ای اپل را خرید تا روی یک دستگاه فیزیکی کار کند. تاکنون اطلاعات کمی در مورد آن دستگاه در دسترس عموم قرار گرفته است. زاکربرگ فقط در پایان کنفرانس به Charm مسخره کرد. Charm یک صفحه دارد که \"Jolly\"، طلسم Muse را که متا در اوایل این ماه عرضه کرد، به نمایش می"}, {"source": "Business Insider", "title": "The 10 biggest announcements from Meta Connect", "link": "https://www.businessinsider.com/meta-connect-biggest-announcements-products-recap-2026-09", "summary": "Mark Zuckerberg unveiled different designs for Meta s new audio glasses Carlos Barria/Reuters Meta rolled out a slew of new products during the company's Connect event. The company is launching a whole new VR-focused device. It's also ensuring that its Muse AI assistant is easily accessible to users of Meta glasses. Meta doesn't want its moment to end. Fresh off the launch of Muse , its App Store-topping AI assistant , Meta announced its latest wearables on Wednesday at the company's Meta Connect event. New virtual reality glasses , which Meta CEO Mark Zuckerberg said weigh a fifth as much as the Meta Quest, were a highlight. \"There's really nothing like this,\" Zuckerberg said during the event's keynote. \"It is a glimpse of the future.\" Meta also rolled out audio-only smart glasses , a promise of VR-immersive environments in some of Disney's biggest franchises, and a dedicated button to keep Muse at your fingertips. \"We are excited about building other wearables too, but we think that glasses are going to be the biggest category,\" Zuckerberg said. Here's a list of what caught our attention: A new era for VR Meta Gone are the heavy headsets. In Meta's vision for its new VR era is all about glasses. Meta VR Glasses weigh just 100 grams, the company said. While the bulk is gone, Meta says the glasses are still its \"most advanced device yet.\" \"You can wear Meta VR Glasses to comfortably watch a full movie, or get things done on a portable, private screen during a long flight, while maintaining a sense of the world around you,\" the company wrote in a blog post. The glasses feature \"a 5K Infinite Display built on micro OLED panels, with 37 pixels per degree\" display. Zuckerberg said the glasses combine a private cinema, computer, and console into a pair of glasses. Our colleague Peter Kafka, who got a sneak peek, said he thought it would be great for watching movies, but couldn't immediately see other use cases. Unlike the Meta Quest, no controllers are needed. Meta said that by building AI into the glasses' operating system, users can just talk or use natural motions to do everything from playing movies to adjusting their workspace. In addition to projecting a virtual keyboard, Meta said the VR glasses will connect to a Mac or Windows PC wirelessly or via USB-C. \"Pick up right where you left off on these screens, and bring your own keyboard and mouse,\" the company wrote. \"With full-color passthrough, you can still see your keyboard, desk, mobile phone, and surr", "date_str": "2026-09-24T00:34:31+00:00", "hash": "7d6822c3f3ec2a88", "title_fa": "10 بزرگترین اطلاعیه متا کانکت", "summary_fa": "مارک زاکربرگ از طرح‌های متفاوتی برای عینک صوتی جدید متا رونمایی کرد. این شرکت در حال راه اندازی یک دستگاه کاملاً جدید مبتنی بر واقعیت مجازی است. همچنین تضمین می کند که دستیار هوش مصنوعی Muse آن به راحتی برای کاربران عینک متا قابل دسترسی است. متا نمی خواهد لحظه اش تمام شود. پس از راه اندازی Muse، دستیار هوش مصنوعی برترین فروشگاه App، Meta آخرین پوشیدنی های خود را روز چهارشنبه در رویداد Meta Connect این شرکت معرفی کرد. عینک های واقعیت مجازی جدید، که مارک زاکربرگ، مدیر عامل متا، وزن آن ها را یک پنجم وزن متا کوئست عنوان کرد، یک نکته برجسته بود. زاکربرگ در حین سخنرانی اصلی این رویداد گفت: «واقعاً چیزی شبیه به این وجود ندارد. \"این یک نگاه اجمالی به آینده است.\" متا همچنین عینک‌های هوشمند فقط صوتی، نوید محیط‌های غوطه‌ور در واقعیت مجازی را در برخی از بزرگترین فرنچایزهای دیزنی و یک دکمه اختصاصی برای نگه داشتن Muse در نوک انگشتان شما عرضه کرد. زاکربرگ گفت: «ما در مورد ساخت سایر پوشیدنی‌ها نیز هیجان‌زده هستیم، اما فکر می‌کنیم که عینک بزرگترین دسته خواهد بود. در اینجا لیستی از مواردی که توجه ما را به خود جلب کرد آورده شده است: هدست های سنگین یک دوره جدید برای VR Meta Gone هستند. در چشم انداز متا برای عصر جدید واقعیت مجازی، همه چیز درباره عینک است. این شرکت گفته است که عینک های VR متا فقط 100 گرم وزن دارند. در حالی که بخش عمده آن از بین رفته است، متا می گوید که این عینک همچنان \"پیشرفته ترین دستگاه تا به حال\" آن است. این شرکت در یک پست وبلاگی نوشت: «می‌توانید عینک‌های متا VR را برای تماشای راحت یک فیلم کامل استفاده کنید، یا در طول یک پرواز طولانی، کارها را روی یک صفحه نمایش قابل حمل و خصوصی انجام دهید، در"}, {"source": "Business Insider", "title": "Scott Bessent says the US and China are giving their trade truce 2 more months", "link": "https://www.businessinsider.com/scott-bessent-us-china-trade-truce-extension-two-more-months-2026-9", "summary": "Treasury Secretary Scott Bessent announced the extension of the Busan Agreement with China. Eduardo Munoz Alvarez/Getty Images US and China extend trade truce from November to January amid ongoing negotiations. Treasury Secretary Scott Bessent announced the extension of the 'Busan Agreement' with China. Xi Jinping's US visit may lead to new agreements on trade and AI security measures. The US and China have bought themselves more time to negotiate. Treasury Secretary Scott Bessent said Wednesday that the countries had agreed to extend their trade truce from November 10 to January 10. He announced the extension after a meeting in Washington with Chinese Vice Premier He Lifeng, as Chinese leader Xi Jinping arrived for a state visit. \"We will extend what we call the 'Busan Agreement,' the economic detente between the two countries that was scheduled to end on November 10, that is going to be extended until January 10,\" Bessent told Fox News during a live interview on Wednesday. The extra two months could lead to a broader deal, Bessent said, and the two sides could also \"just roll the current deal\" again. \"There are some deliverables that have not been perfect on the Chinese side, so we also want to see, now that we've sat down and told them our expectations, if over the coming months they can be more fulsome in enacting the agreement,\" Bessent said. Bessent said Xi's visit could bring announcements on Chinese purchases of American farm products and financial services. US and Chinese officials may also discuss lower tariffs on selected goods and a system for sharing alerts about serious AI-related security incidents . Read the original article on Business Insider", "date_str": "2026-09-23T23:51:00+00:00", "hash": "adb10704b4954f82", "title_fa": "اسکات بسنت می گوید آمریکا و چین دو ماه دیگر به آتش بس تجاری خود مهلت می دهند", "summary_fa": "اسکات بسنت وزیر خزانه داری آمریکا از تمدید قرارداد بوسان با چین خبر داد. ادواردو مونوز آلوارز/ گتی ایماژ آمریکا و چین در میان مذاکرات جاری آتش بس تجاری را از نوامبر تا ژانویه تمدید کردند. اسکات بسنت وزیر خزانه داری آمریکا از تمدید «توافق بوسان» با چین خبر داد. سفر شی جین پینگ به آمریکا ممکن است به توافقات جدیدی در زمینه تجارت و اقدامات امنیتی هوش مصنوعی منجر شود. آمریکا و چین برای خود زمان بیشتری برای مذاکره خریده اند. اسکات بسنت، وزیر خزانه داری روز چهارشنبه گفت که کشورها توافق کرده اند آتش بس تجاری خود را از 10 نوامبر تا 10 ژانویه تمدید کنند. او پس از دیدار با هی لیفنگ، معاون نخست وزیر چین در واشنگتن، در حالی که شی جین پینگ، رهبر چین برای یک سفر دولتی وارد شد، این تمدید را اعلام کرد. بسنت در مصاحبه ای زنده روز چهارشنبه به فاکس نیوز گفت: «ما آنچه را «توافق بوسان» می نامیم، تنش زدایی اقتصادی بین دو کشور که قرار بود در 10 نوامبر پایان یابد، تمدید می کنیم و تا 10 ژانویه تمدید می شود. بسنت گفت که دو ماه اضافی می تواند به یک توافق گسترده تر منجر شود و دو طرف همچنین می توانند \"فقط توافق فعلی\" را مجدداً لغو کنند. بسنت گفت: \"برخی از موارد قابل تحویل در طرف چینی بی نقص نبوده اند، بنابراین ما نیز می خواهیم ببینیم، اکنون که نشسته ایم و انتظارات خود را به آنها گفته ایم، آیا در ماه های آینده می توانند در اجرای توافقنامه کامل تر عمل کنند.\" بسنت گفت که سفر شی می تواند اطلاعیه هایی را در مورد خرید محصولات کشاورزی و خدمات مالی آمریکا توسط چین به همراه داشته باشد. مقامات ایالات متحده و چین همچنین ممکن است در مورد تعرفه های پایین تر بر کالاهای منتخب و سیستمی"}, {"source": "Business Insider", "title": "Meta's camera-free AI glasses look like regular Ray Bans", "link": "https://www.businessinsider.com/meta-ray-ban-audio-ai-glasses-without-camera-2026-9", "summary": "The Ray-Ban Meta Audio glasses, which don t include cameras and look a lot more normal. Meta Meta unveiled the Ray-Ban Meta Audio at its big conference. The two styles will have no camera — just audio and AI features. They start at $349, but not dealing with 'pervert glasses' backlash? Priceless. Great news for folks who enjoy the convenience of being able to listen to music or podcasts on their Meta Ray-Ban smart glasses, but don't want to get frog-marched out of the gym locker room: Meta is launching a new audio-only version of its smart glasses that ditch the cameras. These glasses, which come in two styles — Burbank and Clubmaster — will start at $349. They ship October 13. Meta s new audio-only glasses without cameras. Pretty sleek compared to their camera siblings. Meta The audio-only versions still have the AI features. You can ask Meta's AI for things like a restaurant recommendation while you're walking around. You can also talk in real time with Meta's new AI agent, Muse, through the glasses . From my own testing of earlier Meta glasses, I can say that the audio features were one of my favorite aspects. Unlike earbuds or headphones, you weren't cut off from hearing your surroundings. This was great for specific contexts, like biking or walking outside, where I wanted to be able to hear traffic or other sounds for safety reasons. The Ray-Ban Meta Audio glasses don t have cameras embedded in their frame. They look like regular Ray-Bans from the front. Meta You can also make hands-free phone calls, or listen and respond to text messages. The potential downside here is that, compared to taking a phone call on an AirPod, no one can see you've got anything in your ear, so it'll really seem like you're just talking to yourself in public. But that's your burden to bear. Ditching the camera has two big advantages. The first is the form factor: Without cameras, the frames can be lighter and therefore more comfortable (43 grams compared to 51 grams for the Gen 2 Wayfarer camera version). The audio-only glasses are also more stylish looking, with that classic flair in the corner of the Ray-Ban model where the camera would go. From the front, they look like regular Ray-Bans. Meta s new audio-only Clubmaster style glasses. Meta The second advantage is well, you're not wearing a device capable of filming people — which is what spawned the \"pervert glasses\" backlash to Meta's AI glasses. People understandably feel uncomfortable about the idea of being filmed wit", "date_str": "2026-09-23T23:43:56+00:00", "hash": "f0321d94971b4b42", "title_fa": "عینک‌های هوش مصنوعی متا بدون دوربین شبیه ری‌بان‌های معمولی هستند", "summary_fa": "عینک های Ray-Ban Meta Audio که شامل دوربین نیستند و بسیار معمولی تر به نظر می رسند. متا متا در کنفرانس بزرگ خود از Ray-Ban Meta Audio رونمایی کرد. این دو سبک بدون دوربین خواهند بود - فقط ویژگی های صوتی و هوش مصنوعی. آنها از 349 دلار شروع می شوند، اما با واکنش منفی \"عینک های انحرافی\" سروکار ندارند؟ بی قیمت. خبر عالی برای افرادی که از راحتی گوش دادن به موسیقی یا پادکست با عینک هوشمند Meta Ray-Ban خود لذت می‌برند، اما نمی‌خواهند از رختکن باشگاه بیرون بروند: متا نسخه جدیدی از عینک هوشمند خود را که فقط صوتی دارد عرضه می‌کند که دوربین‌ها را کنار می‌گذارد. این عینک که در دو سبک Burbank و Clubmaster عرضه می شود، از 349 دلار شروع می شود. آنها در 13 اکتبر ارسال می شوند. عینک جدید متا فقط صوتی بدون دوربین. در مقایسه با خواهر و برادرهای دوربین خود بسیار شیک هستند. متا نسخه های فقط صوتی همچنان دارای ویژگی های هوش مصنوعی هستند. وقتی در حال قدم زدن هستید، می‌توانید از هوش مصنوعی متا چیزهایی مانند توصیه رستوران را بخواهید. همچنین می‌توانید در زمان واقعی با عامل هوش مصنوعی جدید متا، Muse، از طریق عینک صحبت کنید. از آزمایش خودم روی عینک های متا قبلی، می توانم بگویم که ویژگی های صوتی یکی از جنبه های مورد علاقه من بود. برخلاف هدفون‌ها یا هدفون‌ها، شما از شنیدن محیط اطراف خود بریده‌اید. این برای زمینه‌های خاص، مانند دوچرخه‌سواری یا پیاده‌روی در بیرون، که می‌خواستم به دلایل ایمنی بتوانم ترافیک یا صداهای دیگر را بشنوم، عالی بود. عینک های Ray-Ban Meta Audio دوربینی در قاب خود ندارند. آنها از جلو مانند ری بن های معمولی به نظر می رسند. متا همچنین می توانید تماس های تلفنی بدون هندز برقرار کنید یا به پیام های متنی گوش دهید و به آنها پاسخ"}, {"source": "Business Insider", "title": "I tried Meta's new $1,300 VR Glasses. They might be good for watching a movie — but I'm not sure what else.", "link": "https://www.businessinsider.com/meta-vr-glasses-new-mark-zuckerberg-price-review-2026-9", "summary": "Meta s new VR Glasses are good for watching a movie, but I m not sure what else you d use them for. Business Insider Meta is showing off new VR Glasses, which will start selling next spring for $1,300. These are a much cheaper and lighter version of the Apple Vision Pro, which launched two years ago. But the Vision Pro flopped in part because people can't figure out what to do with them. Can Meta figure it out this time? Two years ago, Apple introduced its Vision Pro virtual reality goggles . They failed : They were too expensive, too heavy, and — crucially — no one could figure out what to do with them . Now Mark Zuckerberg is taking a swing at the same idea. The new Meta VR Glasses, which he debuted at his annual developers' conference Wednesday, are way cheaper and way lighter than Apple's, and they have at least one cool new feature. But I'm still not sure what to do with them. Meta s VR Glasses are connected to a puck. Meta The basics: The Meta VR goggles — which they've been working on for years — will go on sale in spring 2027 for $1,300 — a third of the Apple Vision Pro's starting price. The headset weighs about 100 grams — much, much less than the 600 grams the AVP weighs. (The Meta glasses also require a not-too-bulky \"puck,\" which provides battery and computing power for the device. Meta expects the puck will sit next to you when you use the goggles, but you could also conceivably wear this thing on your belt if you wanted to stand up or (don't do this) walk around with the goggles on.) And at their core, Meta's goggles do the same thing as Apple's: Put them on and you can see a completely encompassing view of a virtual world. You can also toggle them so you can look outside into the real world, sort of*. Just like the Apple Vision Pro, it's quite an amazing experience, at least from a technical standpoint. The Meta goggles also improve on the \" Minority Report \" hand-wavy interface that both Apple and Meta have used before. Instead of having to hold your hands up in front of you to manipulate virtual stuff, like AVP requires, or use a wristband that reads the electrical impulses your hands make, like Meta's souped-up Ray Ban line, these goggles allow you to manipulate your surroundings with your hands when they are at your desk, or at your side, or in your lap. Super cool. But what would you actually do with these things if you owned them? The most obvious answer is \"watch a movie.\" Which helps explain why \"Avatar\" director James Cameron has be", "date_str": "2026-09-23T23:41:52+00:00", "hash": "753bd1733c3652ca", "title_fa": "من عینک واقعیت مجازی 1300 دلاری جدید متا را امتحان کردم. آنها ممکن است برای تماشای یک فیلم خوب باشند - اما من مطمئن نیستم چه چیز دیگری.", "summary_fa": "عینک های VR جدید متا برای تماشای فیلم خوب هستند، اما مطمئن نیستم برای چه چیز دیگری از آنها استفاده کنید. Business Insider Meta در حال نمایش عینک‌های VR جدید است که فروش آن‌ها بهار سال آینده با قیمت 1300 دلار آغاز خواهد شد. اینها نسخه بسیار ارزان تر و سبک تر اپل ویژن پرو هستند که دو سال پیش عرضه شد. اما Vision Pro تا حدی شکست خورد زیرا مردم نمی توانند بفهمند که با آنها چه کنند. آیا متا این بار می تواند آن را بفهمد؟ دو سال پیش، اپل عینک واقعیت مجازی Vision Pro خود را معرفی کرد. آنها شکست خوردند: آنها خیلی گران، خیلی سنگین بودند، و - مهمتر از همه - هیچ کس نمی توانست بفهمد با آنها چه کند. در حال حاضر مارک زاکربرگ در حال انجام همین ایده است. عینک‌های متا VR جدید، که او در کنفرانس سالانه توسعه‌دهندگان خود در روز چهارشنبه معرفی شد، بسیار ارزان‌تر و سبک‌تر از عینک‌های اپل هستند و حداقل یک ویژگی جدید جالب دارند. اما هنوز مطمئن نیستم که با آنها چه کنم. عینک VR متا به یک پوک متصل است. اصول متا: عینک‌های واقعیت مجازی متا – که سال‌ها روی آن کار می‌کردند – در بهار ۲۰۲۷ با قیمت ۱۳۰۰ دلار – یک سوم قیمت اولیه اپل ویژن پرو – به فروش خواهند رسید. وزن این هدست حدود 100 گرم است - بسیار بسیار کمتر از وزن 600 گرم AVP. (عینک متا همچنین به یک \"پاک\" نه چندان بزرگ نیاز دارد که باتری و توان محاسباتی دستگاه را تامین می کند. متا انتظار دارد که وقتی از عینک استفاده می‌کنید، جن در کنار شما بنشیند، اما اگر می‌خواهید بایستید یا (این کار را انجام ندهید) با عینک راه بروید، می‌توانید این لباس را روی کمربند خود ببندید.) و در هسته خود، عینک‌های متا همان کاری را"}, {"source": "Business Insider", "title": "Meta is bringing its Muse AI agent to its glasses", "link": "https://www.businessinsider.com/meta-muse-ai-agent-smart-glasses-2026-9", "summary": "Meta glasses. Meta Meta is betting its glasses can become a new front door for its fast-growing Muse AI agent. Meta is making a broader hardware push that includes audio glasses and a forthcoming VR device. AI agents are still imperfect, and sites like Amazon are pushing back. Meta is bringing its hot new AI agent Muse to its smart glasses. The move, announced Wednesday at its annual Connect conference in Menlo Park, California, gives Meta a new way to put Muse directly in front of users throughout the day. Muse has become a fast-rising entrant in the increasingly competitive AI agent market: software that can take actions on a person's behalf, rather than merely answer questions or generate text. Instead of opening an app or sitting down at a computer, people could eventually ask Muse for help through a pair of glasses already on their face. With a connection to your Muse personal AI agent, Meta's glasses \"offer more ways than ever to help you manage daily life, whether you're building healthy habits or navigating a busy calendar, all without reaching for your phone,\" the company said in an announcement. At Connect, CEO Mark Zuckerberg said the company will \"start upgrading the AI experience on Meta glasses\" in the coming weeks. The announcement makes clear that the company sees its hardware business as important for the agent, which launched earlier this month and quickly rose to the top of the App Store charts , beating rivals like ChatGPT. Meta's broader hardware blitz at Connect also included Ray-Ban Meta Audio, a new audio-focused pair of glasses. It said it expects to offer more than 100 styles across Ray-Ban, Oakley, and Meta Glasses by the end of the year. It also announced Meta VR Glasses , which it said will offer a more immersive way to watch movies, play games, and work in virtual reality, and will go on sale next spring. Meta is waging a bigger battle over AI agents. Already, Muse can browse the web, make calls, shop, and handle other chores. Meta has also announced partnerships with companies including Shopify, PayPal, Expedia, and Instacart. That puts Meta in a heated race with startups such as Instinct, an invite-only personal AI assistant founded by 23-year-old Noah Shinn. Instinct launched before Muse and quickly caught on with Silicon Valley, turning the tiny startup into an unlikely rival for Meta. Personal AI agents are still early products, with uneven results. In a recent hands-on review, Business Insider's Katie Notopoulos found th", "date_str": "2026-09-23T23:22:48+00:00", "hash": "31ffb665a70fe7d8", "title_fa": "متا عامل هوش مصنوعی Muse خود را به عینک خود می آورد", "summary_fa": "عینک متا. متا متا شرط می‌بندد که عینک‌هایش می‌توانند به درب ورودی جدیدی برای عامل هوش مصنوعی Muse در حال رشد تبدیل شوند. متا در حال ایجاد یک فشار سخت افزاری گسترده تر است که شامل عینک های صوتی و یک دستگاه VR آینده می شود. عوامل هوش مصنوعی هنوز ناقص هستند و سایت هایی مانند آمازون در حال عقب نشینی هستند. متا عامل جدید هوش مصنوعی خود Muse را به عینک هوشمند خود آورده است. این حرکت که روز چهارشنبه در کنفرانس سالانه Connect در منلو پارک، کالیفرنیا اعلام شد، به متا راهی جدید می‌دهد تا Muse را مستقیماً در طول روز در مقابل کاربران قرار دهد. Muse به شرکتی در حال رشد در بازار رقابتی فزاینده عامل هوش مصنوعی تبدیل شده است: نرم‌افزاری که می‌تواند از طرف یک شخص اقداماتی را انجام دهد، نه اینکه صرفاً به سؤالات پاسخ دهد یا متن تولید کند. به جای باز کردن یک برنامه یا نشستن پشت کامپیوتر، افراد در نهایت می‌توانند از طریق یک عینک از قبل روی صورتشان از Muse کمک بخواهند. این شرکت در بیانیه ای اعلام کرد که با اتصال به عامل هوش مصنوعی شخصی Muse شما، عینک های متا \"راه های بیشتری از همیشه برای کمک به مدیریت زندگی روزمره به شما ارائه می دهند، چه در حال ایجاد عادات سالم یا پیمایش در یک تقویم شلوغ، بدون دست زدن به تلفن خود.\" در Connect، مارک زاکربرگ، مدیر عامل شرکت، گفت که این شرکت در هفته‌های آینده \"به‌روزرسانی تجربه هوش مصنوعی در عینک‌های متا\" را آغاز خواهد کرد. این اعلامیه روشن می‌کند که این شرکت تجارت سخت‌افزاری خود را برای این نماینده مهم می‌بیند، که اوایل این ماه راه‌اندازی شد و به سرعت به صدر جدول اپ استور رسید و رقبایی مانند ChatGPT را شکست داد. حمله سخت‌افزاری گسترده‌تر متا در Connect همچنین شامل Ray-Ban Meta Audio،"}, {"source": "Business Insider", "title": "Authorities are investigating Comma AI's hands-off driving tech after fatal crashes", "link": "https://www.businessinsider.com/comma-ai-driving-tech-faces-federal-probe-after-fatal-crashes-2026-9", "summary": "NHTSA opened a probe into Comma AI s hands-off driving devices after five reported crashes that raise questions about the tech s ability to detect stopped vehicles. Bloomberg/Getty Images NHTSA opened a probe into Comma AI's hands-off driving devices after five reported crashes. Regulators said Comma AI devices struck slow-moving or stopped vehicles in their lanes. NHTSA had issued a broader warning to driverless-vehicle developers about emergency vehicles. A device that promises hands-off driving for cars people already own is under federal scrutiny. The National Highway Traffic Safety Administration opened a preliminary investigation on September 21 into devices made by Comma AI, the startup founded by security hacker George Hotz , who is no longer managing day-to-day operations but remains a major owner. Regulators said vehicles equipped with the devices struck slow-moving or stopped vehicles in their lanes. Eleven people were injured, and three people died across the five reported crashes, according to the Office of Defects Investigation. \"ODI has confirmed that the systems were powered on or engaged in multiple crashes,\" NHTSA wrote. \"Preliminary data reviewed by ODI suggests that the comma system may not have adequately detected or responded to the in-lane vehicles.\" Authorities also plan to determine what kind of software was running during each crash, adding that some vehicles may have used modified versions, known as forks, of Comma AI's open-source software. The software in question involves comma three, comma 3X, comma four, and OpenPilot. Comma AI sells an aftermarket device that brings its driver-assistance system to more than 325 car models. The company's website states that the system can steer, accelerate, and brake, and said that it \"can drive for hours without intervention.\" The website also tells drivers to stay alert and ready to take control at any time, and includes a driver-monitoring system that alerts when it detects driver distraction. One crash described in the NHTSA reporting appears to match a February incident in Louisiana. A state police report said a Toyota RAV4 hit an unoccupied police vehicle that was stopped in a highway lane with its emergency lights on, and two passengers in the Toyota died. The police did not identify the driving software in their account of the crash. Other autonomous driving systems and companies have faced investigations over the past few years. NHTSA in 2021 investigated Tesla's Autopilot and said ", "date_str": "2026-09-23T22:59:05+00:00", "hash": "a511ce1f2859a396", "title_fa": "مقامات در حال بررسی فناوری رانندگی دست‌آف Comma AI پس از تصادفات مرگبار هستند", "summary_fa": "NHTSA پس از پنج تصادف گزارش شده که سؤالاتی را در مورد توانایی فناوری برای شناسایی وسایل نقلیه متوقف شده ایجاد می کند، کاوشگری را بر روی دستگاه های رانندگی دست آف Comma AI باز کرد. بلومبرگ/گتی ایماژ NHTSA پس از 5 تصادف گزارش شده، کاوشگری را بر روی دستگاه‌های رانندگی دست‌آف کاما AI گشود. تنظیم‌کننده‌ها گفتند که دستگاه‌های هوش مصنوعی کاما به خودروهایی که در مسیر حرکت آهسته حرکت می‌کردند یا متوقف می‌شدند، برخورد کردند. NHTSA هشدار گسترده تری به توسعه دهندگان وسایل نقلیه بدون راننده در مورد وسایل نقلیه اضطراری داده بود. دستگاهی که نوید رانندگی بدون دست را برای خودروهایی که افراد از قبل دارند را می دهد، تحت نظارت فدرال است. اداره ملی ایمنی ترافیک بزرگراه ها در 21 سپتامبر تحقیقات مقدماتی را در مورد دستگاه های ساخته شده توسط Comma AI، استارت آپی که توسط هکر امنیتی جورج هاتز تأسیس شده بود، آغاز کرد، که دیگر عملیات روزمره را مدیریت نمی کند اما مالک اصلی آن باقی مانده است. رگولاتورها گفتند وسایل نقلیه مجهز به این دستگاه ها با خودروهای کند حرکت یا توقف در خطوط خود برخورد کردند. بر اساس گزارش دفتر بررسی نقص، 11 نفر مجروح شدند و سه نفر در پنج تصادف گزارش شده جان باختند. NHTSA نوشت: «ODI تأیید کرده است که سیستم‌ها روشن شده یا درگیر خرابی‌های متعدد بوده‌اند. \"داده های اولیه بررسی شده توسط ODI نشان می دهد که سیستم کاما ممکن است به اندازه کافی خودروهای داخل خط را شناسایی نکرده یا به آنها پاسخ نداده باشد.\" مقامات همچنین قصد دارند مشخص کنند که چه نوع نرم افزاری در طول هر تصادف در حال اجرا بوده است، و اضافه می کنند که برخی از خودروها ممکن است از نسخه های اصلاح شده، معروف به فورک، نرم افزار منبع باز Comma AI استفاده کرده باشند. نرم افزار مورد بحث"}, {"source": "Business Insider", "title": "The best Samsung Galaxy Z Flip 8 cases: Stylish protection for your new flip phone", "link": "https://www.businessinsider.com/guides/tech/best-samsung-galaxy-z-flip-8-cases", "summary": "When you buy through our links, Business Insider may earn an affiliate commission. Learn more OtterBox; Dbrand; Amazon; Samsung/Business Insider Flip phones are so back, and just like the early 2000's, cases are all the rage برای Z Flip 8 جدید خود، مانند یک برند برتر مانند OtterBox یا یک"}, {"source": "Business Insider", "title": "Why Dolly Parton's estate is suing her nephew — and what's at stake for her business empire", "link": "https://www.businessinsider.com/dolly-parton-estate-nephew-lawsuit-timeline-2026-9", "summary": "Dolly Parton at Dollywood. Ron Davis/Getty Images Dolly Parton's nephew, Bryan Seaver, was fired after making alleged threats to employees of her estate. Seaver confirms he was fired, but that his texts were taken out of context and mischaracterized. Dolly Parton left behind a $450 million estate, with a theme park and her catalog of hits. There's legal drama swirling around Dolly Parton's estimated $450 million estate . Nearly a month after Parton's death in August, her nephew and longtime head of security, Bryan Seaver, was fired and sued by Parton's manager and one of the entities established to oversee Parton's business affairs, She's Alive LLC. In court filings, Parton's manager, Danny Nozell, and She's Alive LLC allege that Seaver made violent threats against employees and vowed to damage her business empire unless his demands were met. Seaver confirmed he was fired but disputed that he made threats, saying the language was taken out of context. Seaver, Nozell, and Parton's estate did not respond to requests for comment from Business Insider. The dispute casts a spotlight on the business empire Parton built over her decadeslong career and on the people now responsible for protecting it. Here's what you need to know about the fallout and what, exactly, is at stake in this conflict. Dolly Parton died on August 25. She was 80. Dolly Parton attends the opening of Country Music Hall of Fame® and Museum s new exhibit Dolly Parton: Journey of a Seeker at Country Music Hall of Fame and Museum on May 19, 2025 in Nashville, Tennessee. Jason Kempin/Getty Images Parton died after a private battle with cancer, though she had referenced unspecified health issues earlier in the year. Her death sent shockwaves around the world. There were tributes across the US, including a heartwarming one to her at the 2026 Emmys, with a song performed by Reba McEntire. President Donald Trump ordered all the flags to be lowered to half-mast, a rare honor for a private citizen. Her death was announced on Instagram by her nephew, Bryan Seaver. He was her head of security for over 20 years. DOLLY PARTON S MOUNTAIN MAGIC CHRISTMAS -- Pictured: (l-r) Cassie Parton as herself, Dolly Parton as herself, Rachel Parton as herself Katherine Bomboy/NBC/Getty Images \"This video announcement is something Dolly asked of me years ago, before I fully absorbed it as a future reality. As her head of security for more than two decades, a role my father Larry held before me, I have imagined the heavin", "date_str": "2026-09-23T22:13:05+00:00", "hash": "e6e67e9ac27f9924", "title_fa": "چرا املاک دالی پارتون از برادرزاده او شکایت می کند - و چه چیزی برای امپراتوری تجاری او در خطر است", "summary_fa": "دالی پارتون در Dollywood. ران دیویس/ گتی ایماژ، برایان سیور، برادرزاده دالی پارتون، پس از تهدیدهای ادعایی برای کارمندان املاکش اخراج شد. سیور تأیید می‌کند که اخراج شده است، اما متن‌هایش از متن خارج شده و به اشتباه توصیف شده است. دالی پارتون دارایی 450 میلیون دلاری با یک پارک موضوعی و کاتالوگ آثارش را پشت سر گذاشت. درام حقوقی پیرامون دارایی 450 میلیون دلاری دالی پارتون در حال چرخش است. نزدیک به یک ماه پس از مرگ پارتون در ماه آگوست، برادرزاده و رئیس قدیمی امنیت او، برایان سیور، توسط مدیر پارتون و یکی از نهادهایی که برای نظارت بر امور تجاری پارتون تاسیس شده بود، به نام She's Alive LLC از کار برکنار و شکایت کرد. در پرونده های دادگاه، مدیر پارتون، دنی نوزل، و She's Alive LLC ادعا می کنند که سیور تهدیدهای خشونت آمیزی علیه کارمندان داشته و قول داده است که به امپراتوری تجاری خود آسیب برساند مگر اینکه خواسته های او برآورده شود. سیور تأیید کرد که اخراج شده است، اما با بیان اینکه این زبان از متن خارج شده است، مخالفت کرد که تهدید کرده است. سیور، نوزل، و املاک پارتون به درخواست‌های بیزینس ut something, anything, happening on my watch that could change her life forever. I thought being a grandparent was supposed to be easier than parenting because you get all the love and fun, and you don't have all the responsibility, but to me, it feels like twice as much. If something were to happen to my granddaughter , I wouldn't just be heartbroken myself. I'd have to watch my son and his wife go through the anguish. I can't imagine how heavy and awful that would be. I was carefree once When I became a mother, I was young, energetic, optimistic, and blissfully inexperienced. My Enneagram personality type is the \"Enthusiast,\" so I had nothing but sweet dreams and big plans for my kids, and I totally believed the world would cooperate. Over the decades, I've watched friends lose children, illnesses appear without warning, and accidents change lives in an instant, so I've developed the art of fear and pessimism. The author said she was more carefree as a mother than she is now as a grandmother. Courtesy of Stephanie Davis. I also know a lot more now. I have a bachelor's degree in psychology and have felt equipped to raise confident, emotionally healthy children. I knew to say, \"You're behaving badly,\" instead of \"you're a bad boy\" (to make sure behavior, not identity, was being shamed), and \"g", "date_str": "2026-09-23T21:56:01+00:00", "hash": "e3b30254c52245eb", "title_fa": "فکر می کردم مادربزرگ شدن از مادر شدن راحت تر است. حالا که من یکی هستم، از بسیاری جهات سخت تر است.", "summary_fa": "نویسنده می‌گوید وقتی بچه‌هایش را مادر می‌کرد بی‌خیال‌تر بود. به عنوان یک مادربزرگ، ریسک بالاتر است. با حسن نیت از استفانی دیویس. من همیشه شنیده ام که وقتی پدربزرگ و مادربزرگ هستید، بدون هیچ مسئولیتی سرگرم می شوید. برای من، مسئولیت دو چندان می شود: شما می توانید هم به فرزند و هم به نوه خود آسیب برسانید. جوان بودن و ساده لوح بودن مزایای خود را دارد. اکنون من پیرتر و عاقل تر هستم - و بسیار محتاط تر هستم. وقتی نوه کوچکم را از پله ها پایین می آوردم، فکری در ذهنم گذشت که 30 سال پ om/guides/streaming/how-to-watch-survivor-season-51", "summary": "When you buy through our links, Business Insider may earn an affiliate commission. Learn more Survivor airs on Wednesdays. Robert Voets/CBS After the extravaganza of nostalgia that was Survivor 50, the much-loved reality show returns for its second run in 2026. And without wanting to become branded as the comedown from that huge anniversary series, Season 51 is set to be the start of a whole new era for the show — its so-called Open Era. Ready to head back to Fiji? Then stick with us to see all the ways you can watch Survivor. You won't be surprised to learn that Survivor Season 51 will go out on CBS in the US, with the network's Paramount Plus and OTT cable alternatives like YouTube TV and Fubo all good options for cord cutters. The show goes out on the free-to-air Global TV north of the border in Canada, while the Stan subscription service is the place to view it in Australia now, since it left the free 9Now. How to watch Survivor: quick links US: Paramount Plus (from $9/month) YouTube TV (free trial) Fubo (free trial) Canada: Global TV (free next-day) Australia: Stan (from $10/month) Access streaming from anywhere: NordVPN (30-day money-back guarantee) When: Wednesdays from September 23, at 8 p.m. ET/PT / 1 a.m. BST (Thu) / 8 a.m. AWST (Thu) So what is the Open Era? As stalwart presenter Jeff Probst explains in the series trailer (which you can watch at the bottom of this article), it means that \"every type of advantage, every twist we've ever done, is in play.\" So you can expect the show's producers to replay some of the greatest hits from previous iterations, with all the most grueling, soul-destroying, tribe-splitting challenges coming back to haunt the 21 castaways, all desperate to end up as Sole Survivor and $1 million richer. With 11 females and 10 males starting things off, there are a couple of potentially familiar faces in the list of contestants; actor Devin Way has appeared in Grey's
