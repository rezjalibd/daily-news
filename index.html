nian Air Force spokesperson, said automated gun turrets have intercepted Russian jet-powered drones , including the Geran-5 — a significant development for Kyiv as it struggles to defend against Russia's high-speed weapons. Ukrainian President Volodymyr Zelenskyy said on Sunday that more than a dozen turrets were installed around Kyiv, with another eight planned for deployment across the wider region, to counter the rise in Russia's jet-powered drones. Inhat described the turrets as \"innovative technologies\" that rely on AI and machine vision to enable the interception. Speaking during a national telethon, he said the guns have a limited range, Ukrainian media reported. At least some of the turrets will be installed on Kyiv's bridges, which Russian forces have targeted multiple times with drones over the past week amid a broader escalation of attacks on Ukraine's civilian infrastructure . Ukraine has not disclosed the specific type of turret deployed. The system does, however, feature a .50-caliber machine gun, Zelenskyy revealed, a typical weapon used by mobile air defense units . Russia s jet-powered drones are faster than many Ukrainian interceptors, prompting local companies to upgrade their models. AP Photo/Evgeniy Maloletka Last year, Ukraine confirmed the deployment of the Sky Sentinel, an AI-powered turret capable of shooting down Russian attack drones. Russia is increasingly using drones powered by mini turbojet engines to attack Ukraine; Kyiv said Moscow launched 2,800 in August compared to 350 in June. The Geran-5, the newest and fastest of the models in service, can reach speeds of up to 375 mph. The uptick in jet-powered drones over the past few months has presented a significant challenge for Ukrainian air defenses . Inhat said on Monday that the interception rate for these drones is 50% to 70%, compared to over 85% for older, slower propeller-powered models like the Gera", "date_str": "2026-10-05T13:11:10+00:00", "hash": "bb69bfb168bed7ca", "title_fa": "برجک های اسلحه رباتیک اوکراین اولین کشتار خود را از سریع ترین پهپادهای تهاجمی روسیه به دست آوردند.", "summary_fa": "اوکراین گفت که یک برجک مجهز به هوش مصنوعی سریعترین پهپاد تهاجمی روسیه را سرنگون کرد. برجک های اسلحه روباتیک اوکراین به لطف یونایتد 24 اولین رهگیری سریع ترین پهپاد تهاجمی روسیه را به دست آوردند. برجک های مجهز به هوش مصنوعی در اطراف کیف در بحبوحه افزایش حملات پهپادهای جت مستقر شدند. اوکراین برای دفاع در برابر این کلاس سریعتر از تسلیحات ضربتی روسیه تلاش کرده است. یک مقام ارشد نیروی هوایی روز دوشنبه تایید کرد که اوکراین برای اولین بار از برجک های تفنگ رباتیک مجهز به هوش مصنوعی برای سرنگونی سریع ترین پهپادهای تهاجمی روسیه استفاده کرده است. یوری اینهات، سخنگوی نیروی هوایی اوکراین، گفت که برجک‌های تفنگ خودکار پهپادهای جت روسی از جمله Geran-5 را رهگیری کرده‌اند - پیشرفت مهمی برای کیف در حالی که این کشور در تلاش برای دفاع در برابر تسلیحات پرسرعت روسیه است. ولودیمیر زلنسکی، رئیس جمهور اوکراین روز یکشنبه گفت که بیش از دوازده برجک در اطراف کیف نصب شده است و هشت برجک دیگر برای استقرار در سراسر منطقه برنامه ریزی شده است تا با افزایش پهپادهای جت روسیه مقابله کنند. اینهات این برجک ها را \"فناوری های نوآورانه\" توصیف کرد که برای فعال کردن رهگیری به هوش مصنوعی و بینایی ماشین متکی هستند. رسانه‌های اوکراینی گزارش دادند که در طول یک تله‌تون ملی، او گفت که این اسلحه‌ها برد محدودی دارند. حداقل برخی از برجک ها بر روی پل های کیف نصب خواهند شد که نیروهای روسی در هفته گذشته چندین بار با هواپیماهای بدون سرنشین آنها را در بحبوحه تشدید حملات به زیرساخت های غیرنظامی اوکراین هدف قرار داده اند. اوکراین نوع خاصی از برجک مستقر شده را فاش نکرده است. Zelenskyy فاش کرد، با این حال، این سیستم دارای یک مسلسل با کالیبر 50 است، یک سلاح معمولی که توسط واحدهای دفاع هوایی متحرک استفاده می شود."}, {"source": "Business Insider", "title": "Why October is an ideal window to load up on stocks, according to Citadel Securities' top strategist", "link": "https://www.businessinsider.com/stock-market-outlook-citadel-securities-q3-earnings-tech-investing-october-2026-10", "summary": "NYSE Market maker Citadel Securities sees a reset coming for the stock market as Q4 kicks off. The firm's Scott Rubner says several catalysts are opening a window for investors to reload. \"Positioning is cleaner, valuations are lower, earnings are returning,\" Rubner said. September lived up to its reputation as a tough month for investors, but Citadel Securities' top stock strategist sees better things on the horizon as the fourth quarter kicks off. The firm's Scott Rubner predicts this month will likely set up a more hospitable investing environment, laying out in a note late last week the bull case for through year end and why it's an ideal window to load up on stocks. \"October could still bring volatility and a better entry point,\" he wrote in a blog post . \"But positioning is cleaner, valuations are lower, earnings are returning, and several of the market's largest buyers have considerably more capacity to participate.\" Rubner emphasized that it might not be a straight line up and to the right, but said that after the market's September reset, new catalysts are emerging. For one, \"the super bowl\" of earnings will arrive at the end of this month, when 44% of the S P 500 and 38% of the Nasdaq 100 report results, including the biggest tech names that have boosted the market in the second half of the year. \"US corporate profits rose 22.8% year-over-year in Q2 to a record $4.83 trillion, the largest annual increase since Q4 2021,\" Rubner said. \"Profit growth has now accelerated for four consecutive quarters, while nominal GDP grew 6.6% over the same year. That strength is showing up again heading into Q3 earnings.\" Meanwhile, Rubner also sees a comeback from stock buyers including corporations, systematic funds, and retail traders. He noted that funds are likely done selling and that historically, activity from the retail side often picks up around this time of year. \"That slowdown has historically tended to reverse in October,\" he said. \"Cash activity has increased from September to October in each of the last four years, by an average of ~8%, while options activity has risen in each of the last three, by an average of ~15%.\" All of this should lead to a more favorable market for stock pickers, even if early October brings some trading volatility. The combination of a strong earnings season that puts more companies back in control of their own performance and the return of several key buying groups is likely setting stocks up to surge in the coming months,", "date_str": "2026-10-05T13:03:29+00:00", "hash": "9e7657381aed8ba7", "title_fa": "به گفته استراتژیست ارشد Citadel Securities، چرا اکتبر یک پنجره ایده آل برای بارگذاری سهام است", "summary_fa": "Citadel Securities، سازنده بازار NYSE، با شروع سه ماهه چهارم بازنشانی برای بازار سهام در راه است. اسکات رابنر از این شرکت می گوید چندین کاتالیزور دریچه ای را برای سرمایه گذاران باز می کنند تا دوباره بارگذاری کنند. روبنر گفت: «موقعیت یابی تمیزتر است، ارزش گذاری ها پایین تر است، درآمد در حال بازگشت است. سپتامبر شهرت خود را به عنوان ماه سخت برای سرمایه گذاران حفظ کرد، اما استراتژیست ارشد سهام Citadel Securities با شروع سه ماهه چهارم، چیزهای بهتری را در افق می بیند. اسکات رابنر از این شرکت پیش‌بینی می‌کند که این ماه احتمالاً محیط سرمایه‌گذاری مهمان‌نوازتری را ایجاد خواهد کرد و در یادداشتی در اواخر هفته گذشته به بررسی روند صعودی تا پایان سال و اینکه چرا این یک پنجره ایده‌آل برای بارگذاری سهام است، می‌پردازد. او در یک پست وبلاگ نوشت: «اکتبر همچنان می تواند نوسانات و نقطه ورود بهتری به همراه داشته باشد. اما موقعیت‌یابی پاک‌تر است، ارزش‌گذاری‌ها پایین‌تر است، درآمدها در حال بازگشت هستند، و چندین نفر از بزرگترین خریداران بازار ظرفیت بسیار بیشتری برای مشارکت دارند.» رابنر تاکید کرد که ممکن است یک خط مستقیم به سمت راست نباشد، اما گفت که پس از تنظیم مجدد بازار در سپتامبر، کاتالیزورهای جدیدی در حال ظهور هستند. برای اولین بار، \"سوپر کاسه\" درآمد در پایان این ماه می رسد، زمانی که 44٪ از S P 500 و 38٪ از نتایج Nasdaq 100، از جمله بزرگترین نام های فناوری که بازار را در نیمه دوم سال رونق داده اند، گزارش می شود. رابنر گفت: \"سود شرکت های آمریکایی در سه ماهه دوم 22.8 درصد نسبت به مدت مشابه سال قبل افزایش یافت و به رکورد 4.83 تریلیون دلار رسید که بزرگترین افزایش سالانه از سه ماهه چهارم 2021 است.\" رشد سود اکنون برای چهار فصل متوالی شتاب گرفته است، در حالی که تولید ناخالص"}, {"source": "Business Insider", "title": "KPMG has a new CEO leading its 276,000 staff. Here are the key challenges he faces.", "link": "https://www.businessinsider.com/kpmg-new-global-ceo-challenges-consulting-accounting-ai-2026-10", "summary": "KPMG is the smallest of the Big Four professional services firms. Sean Gallup/Getty Images KPMG has a new global chairman and CEO: Gary Wingrove. From AI transformation to an auditing scandal, he's taken over at a turbulent time for consulting. Business Insider spoke to industry watchers about the challenges Wingrove faces as he starts his tenure. KPMG has a new boss. On October 1, Gary Wingrove took over as global chairman and CEO of the Big Four accounting and consulting firm, succeeding Bill Thomas after an eight-year tenure. Wingrove joined KPMG in 2000 and most recently held roles as CEO of KPMG Australia from 2013 to 2021 and international COO. He now oversees more than 276,000 employees across KPMG's member firms. The firms operate as a global network of legally separate firms rather than as a single company, making the role of global chair different from that of a typical corporate CEO. Big Four leaders typically spend decades building the trust, personal networks, and credibility needed to win an internal election — the way Big Four firms choose their heads. Once in the role, they are responsible for holding the network together across geographies, monitoring its performance, and stepping in during high-stakes crises. KPMG did not respond to a request for comment for this story. When Wingrove's appointment was announced in March, he said that he would aim to create an environment where KPMG employees could thrive . AI, AI, and more AI AI is both one of KPMG's biggest growth opportunities and a tricky management challenge. The Big Four have cast themselves as \"client zero\" as AI changes the workplace — whatever happens to the rest of the workforce with AI, it probably happened inside the firms first. Wingrove will be under pressure to ensure all of KPMG's firms innovate quickly and cohesively, and that the workforce can adapt without weakening its pipeline of future managers and partners. Have a tip or story to share about working in consulting? Contact this reporter via email at pthompson@businessinsider.com or Signal at Polly_Thompson.89. Use a personal email address, a nonwork WiFi network, and a nonwork device; here's our guide to sharing information securely . \"In consulting, AI is already reducing the value of some of the more junior, research-heavy and analytical work that has traditionally supported the pyramid,\" said James Ransome, a partner and consulting lead at executive-search and industry-analysis firm Patrick Morgan. That raises a lo", "date_str": "2026-10-05T13:01:32+00:00", "hash": "9683a961e7d508e5", "title_fa": "KPMG یک مدیر عامل جدید دارد که 276000 پرسنل خود را رهبری می کند. در اینجا چالش های کلیدی او وجود دارد.", "summary_fa": "KPMG کوچکترین شرکت خدمات حرفه ای از چهار شرکت بزرگ است. شان گالوپ/ گتی ایماژ KPMG یک رئیس هیئت مدیره و مدیر عامل جهانی جدید دارد: گری وینگرو. از تحول هوش مصنوعی گرفته تا یک رسوایی حسابرسی، او در یک زمان پرتلاطم برای مشاوره اداره می شود. Business Insider با ناظران صنعت در مورد چالش هایی که وینگرو با شروع کار خود با آن مواجه است صحبت کرد. KPMG یک رئیس جدید دارد. در اول اکتبر، گری وینگرو به عنوان رئیس جهانی و مدیر عامل شرکت حسابداری و مشاوره چهار بزرگ، پس از یک دوره هشت ساله جانشین بیل توماس شد. وینگرو در سال 2000 به KPMG ملحق شد و اخیراً به عنوان مدیر عامل KPMG استرالیا از سال 2013 تا 2021 و مدیر اجرایی بین المللی فعالیت داشته است. او اکنون بر بیش از 276000 کارمند در سراسر شرکت های عضو KPMG نظارت دارد. این شرکت‌ها به‌عنوان یک شبکه جهانی از شرکت‌های قانونی مجزا عمل می‌کنند تا به‌عنوان یک شرکت واحد، که نقش صندلی جهانی را از نقش یک مدیر عامل شرکت معمولی متفاوت می‌کند. رهبران چهار بزرگ معمولاً ده‌ها سال را صرف ایجاد اعتماد، شبکه‌های شخصی و اعتبار مورد نیاز برای پیروزی در انتخابات داخلی می‌کنند - روشی که چهار شرکت بزرگ، مدیران خود را انتخاب می‌کنند. هنگامی که این نقش را به عهده می گیرند، مسئول نگه داشتن شبکه در سراسر مناطق جغرافیایی، نظارت بر عملکرد آن و ورود در طول بحران های پرمخاطره هستند. KPMG به درخواست برای اظهار نظر در مورد این داستان پاسخ نداد. زمانی که انتصاب وینگرو در ماه مارس اعلام شد، او گفت که هدفش ایجاد محیطی است که کارکنان KPMG بتوانند در آن پیشرفت کنند. هوش مصنوعی، هوش مصنوعی و موارد دیگر هوش مصنوعی یکی از بزرگترین فرصت‌های رشد KPMG و یک چالش مدیریتی پیچیده است. چهار بزرگ خود را به"}, {"source": "Business Insider", "title": "Instinct users say its new shopping feature is pushing products they never asked for", "link": "https://www.businessinsider.com/instinct-users-say-its-ai-agent-is-pushing-unsolicited-products-2026-10", "summary": "Instinct users flagged unsolicited shopping recommendations, raising questions about how personal AI agents will monetize their platforms. Gabby Jones/Bloomberg via Getty Images Instinct users say it texted them a shopping list pulled from chats they thought were private. Instinct's CEO says agents shouldn't push purchases users don't want. But users say they got them. Marketing and media analysts say the shopping suggestions may hint at monetization. If Instinct has suddenly texted you a shopping list you never asked for, you're not alone. Three early users, among dozens of X users, told Business Insider that the personal AI agent sent them unsolicited product recommendations based on details from earlier conversations. Shruti Gandhi, a general partner and founding engineer at AI-focused venture firm Array Ventures, said Instinct sent her a shopping list despite not requesting one. \"I didn't ask for anything,\" Gandhi told Business Insider, adding that the agent knew she had a trip coming up. Screenshots Gandhi shared on X show Instinct using details about her upcoming conference and keynote to create a five-item list, including a $250.75 carry-on suitcase, sunscreen, and a power bank. The recommendations — reviewed by Business Insider — come as Instinct expanded its shopping tools through a Shopify partnership and began rolling out Instinct Selections , a feature that Shinn says draws on recommendations curated by chefs, designers, architects, and local guides. They were not labeled as ads, and Business Insider could not determine whether Instinct earns money from resulting purchases . But they could test a red line set by Instinct CEO Noah Shinn. In an interview on \"Invest Like The Best\" posted last week, Shinn said agents should not use their knowledge of users to steer them into purchases they do not want. He criticized platforms that use paid ads to persuade people to buy products they \"may or may not want.\" \"I think it would be a very dangerous world if Instinct were influencing the user's behavior to purchase something that they don't want to purchase or to subscribe to something that they don't want,\" he said. Instinct didn't respond to a request for comment. When a recommendation feels like a pitch Ghandi isn't the only Instinct user to have flagged such unsolicited recommendations. Tanmaye Bhatia, AI lead at Primary Venture Partners, said Instinct texted him unsolicited product recommendations on Tuesday. A screenshot he published on X last Tuesd", "date_str": "2026-10-05T11:40:36+00:00", "hash": "9e970b83c7d2ca27", "title_fa": "کاربران غریزی می گویند ویژگی خرید جدید آن، محصولاتی است که هرگز درخواست نکرده اند", "summary_fa": "کاربران غریزی توصیه‌های خرید ناخواسته را علامت‌گذاری کردند و سؤالاتی را در مورد چگونگی درآمدزایی عوامل هوش مصنوعی از پلتفرم‌هایشان ایجاد کردند. Gabby Jones/Bloomberg از طریق Getty Images Instinct کاربران می‌گویند که لیست خریدی را که از چت‌هایی که فکر می‌کردند خصوصی هستند، برایشان پیامک کرده است. مدیر عامل Instinct می گوید که نمایندگان نباید خریدهایی را که کاربران نمی خواهند انجام دهند. اما کاربران می گویند که آنها را دریافت کرده اند. تحلیلگران بازاریابی و رسانه می گویند که پیشنهادات خرید ممکن است به کسب درآمد اشاره داشته باشد. اگر Instinct به طور ناگهانی لیست خریدی را برای شما ارسال کرده است که هرگز درخواست نکرده اید، شما تنها نیستید. سه کاربر اولیه، از میان ده‌ها کاربر X، به Business Insider گفتند که عامل هوش مصنوعی شخصی توصیه‌های محصول ناخواسته را بر اساس جزئیات مکالمات قبلی برای آنها ارسال کرده است. شروتی گاندی، یک شریک عمومی و مهندس موسس در شرکت سرمایه گذاری مبتنی بر هوش مصنوعی Array Ventures، گفت که Instinct با وجود درخواست نکردن لیست خرید، برای او لیست خرید فرستاد. گاندی به Business Insider گفت: \"من چیزی نخواستم.\" وی افزود که این نماینده می دانست که او سفری در پیش دارد. اسکرین‌شات‌هایی که گاندی در X به اشتراک گذاشته است، Instinct را با استفاده از جزئیات مربوط به کنفرانس آینده‌اش و سخنرانی اصلی خود برای ایجاد یک لیست پنج موردی، شامل یک چمدان دستی 250.75 دلاری، ضد آفتاب و یک پاوربانک نشان می‌دهد. این توصیه‌ها – که توسط Business Insider مورد بررسی قرار گرفته است – زمانی ارائه می‌شوند که Instinct ابزارهای خرید خود را از طریق مشارکت Shopify گسترش داد و شروع به عرضه Instinct Selections کرد، ویژگی‌ای که Shinn می‌گوید از توصیه‌های سرپرست‌شده توسط سرآشپزها، طراحان، معماران و راهنمایان محلی استفاده می‌کند. آنها به عنوان تبلیغات برچسب گذاری نشدند و Business Insider نمی توانست"}, {"source": "Business Insider", "title": "HR org SHRM heads to court in latest workplace discrimination case", "link": "https://www.businessinsider.com/hr-group-shrm-trial-disability-accommodation-case-2026-10", "summary": "iStock; Tyler Le/BI SHRM is headed to trial on October 6 over a claim it mishandled a disability accommodation request. Jurors will weigh whether the HR group adequately worked with the plaintiff to find a solution. In 2025, SHRM was hit with an $11.5 million verdict in another discrimination case. It is appealing. The nation's largest HR group is set to face a jury this week over allegations that it mishandled a job applicant's request for a disability accommodation. The trial comes after the Society for Human Resource Management, or SHRM, was hit by a jury with an $11.5 million verdict last year in an unrelated race discrimination and retaliation case involving a former employee. SHRM has since appealed that decision. In the complaint for the lawsuit about to go to trial, plaintiff Fiona Torres alleges that SHRM offered her a role as a senior specialist in its product management department in June 2024, then revoked the offer that July because she wanted to bring her medical service dog to work. She said she is diabetic and that her dog could detect changes in her blood-sugar levels faster and more reliably than a top-tier glucose monitor. \"I was ready and able to work,\" Torres previously told Business Insider in an email through her attorney. \"They said they were eager to have me until they found out I had a disability and a service dog.\" In a January court filing in response to the allegations, SHRM said it offered Torres \"multiple accommodations,\" including the ability to use her continuous glucose monitoring system and an insulin pump at work, to take breaks as needed to check her blood sugar levels, and to consume food or drink as needed at or near her workstation. SHRM also posted a statement to its website on September 28 about the case, saying that it had \"tried to understand Torres' need\" for a service dog and what reasonable accommodations were available. SHRM further said it asked Torres to speak with her doctor about an alternative to the dog. \"This was a genuine good-faith attempt to find a mutually agreeable solution through an interactive process,\" the group said in the statement. \"SHRM did not say no; we followed proper procedure.\" The trial, which is scheduled to last four days, will take place in Alexandria, Virginia, where SHRM is headquartered. Last year, Business Insider reported that SHRM had been embroiled in various controversies . Those included an attendance policy that penalized workers who arrived a minute after 9 a.m.; a memo", "date_str": "2026-10-05T10:35:01+00:00", "hash": "d9bde6c49a16aece", "title_fa": "HR org SHRM در آخرین پرونده تبعیض در محل کار به دادگاه می رود", "summary_fa": "آی استوک؛ Tyler Le/BI SHRM در تاریخ 6 اکتبر به دلیل ادعای عدم رسیدگی به درخواست اسکان معلولان به محاکمه می رود. هیئت منصفه بررسی خواهند کرد که آیا گروه منابع انسانی به اندازه کافی با شاکی برای یافتن راه حل کار کرده است یا خیر. در سال 2025، SHRM با یک حکم 11.5 میلیون دلاری در یک پرونده تبعیض دیگر مورد ضربه قرار گرفت. جذاب است. بزرگترین گروه منابع انسانی کشور قرار است این هفته با هیئت منصفه به اتهام رسیدگی نادرست به درخواست متقاضی کار برای مسکن معلولان روبرو شود. این محاکمه پس از آن صورت می گیرد که انجمن مدیریت منابع انسانی یا SHRM در سال گذشته توسط هیئت منصفه با حکم 11.5 میلیون دلاری در یک پرونده تبعیض نژادی و تلافی جویانه غیرمرتبط با یک کارمند سابق مورد ضربه قرار گرفت. SHRM از آن زمان به این تصمیم اعتراض کرده است. فیونا تورس شاکی ادعا می‌کند که SHRM در ژوئن 2024 به او به عنوان یک متخصص ارشد در بخش مدیریت محصول خود پیشنهاد داد و سپس در جولای این پیشنهاد را لغو کرد زیرا او می‌خواست سگ خدمات پزشکی خود را به محل کار بیاورد. او گفت که دیابتی است و سگش می‌تواند تغییرات در سطح قند خونش را سریع‌تر و با اطمینان‌تر از یک دستگاه مانیتور قند خون تشخیص دهد. تورس قبلاً در ایمیلی از طریق وکیلش به Business Insider گفت: \"من آماده بودم و می توانستم کار کنم.\" آنها گفتند که مشتاق بودند من را داشته باشند تا اینکه متوجه شدند من معلولیت و سگ سرویس دارم. در یک پرونده قضایی در ماه ژانویه در پاسخ به این اتهامات، SHRM گفت که به تورس «تسکین‌های متعددی» ارائه کرده است، از جمله توانایی استفاده از سیستم پایش مداوم گلوکز و پمپ انسولین در محل کار، استراحت در صورت لزوم برای بررسی سطح قند خون"}, {"source": "Business Insider", "title": "American investors are touring China’s robot factories to size up the competition", "link": "https://www.businessinsider.com/why-silicon-valley-investors-are-touring-chinas-robot-factories-2026-10", "summary": "AgiBot s factory in Shanghai. (Photo by Tang Yanjun/China News Service/VCG via Getty Images) Tang Yanjun/China News Service/VCG via Getty Images Silicon Valley investors are taking field trips to robot factories in China. The goal is not to scout investments, but to size up rivals to their portfolio companies. Some investors are paying $10,000 for tours with translators, five hotels, and executive dinners. Last year, when Ryan Cunningham, a Silicon Valley investor, floated a trip to China in a WhatsApp group of robotics investors, the response was lukewarm. One person jokingly asked if he could smuggle a humanoid robot home. This year, the jokes have given way to travel plans. Cunningham, the founder of Edgerunner Ventures, a venture capital firm that backs energy and computing startups, is planning an April trip to China for 10 investors. Nearly every investor group chat he is in now trades notes on recent or upcoming excursions to China, he told Business Insider, as venture capitalists gauge China's hardware prowess to see what American robotics startups are up against. \"The reason I want to bring them to China is because I want to take them by the shoulders and say, 'Guys, if you want to get serious, this is what we should be learning from,'\" said Cunningham, who visited Shanghai last year for the World Artificial Intelligence Conference, an annual gathering for the AI industry. Cunningham is among a growing cadre of Silicon Valley investors heading east to see how China built its edge in robotics and other hardware. For many, the point is not to scout Chinese investments. It is to size up the rivals confronting their US portfolio companies. The excursions range from private VC delegations to $10,000-a-head tours that pair factory visits with translators, five-star hotels, and dinners with local tech executives. Behind the tours is the sobering realization that China has established a formidable lead in crucial parts of robotics, from manufacturing and supply chains to deploying machines and collecting the data needed to improve them. Robotic arms at a BYD factory in Fuzhou. Wan Xiang/Xinhua via Getty Images Chinese companies Unitree and AgiBot together shipped 71% of the world's humanoid robots last year, according to research firm Omdia. China also controls 63% of the key companies in the global supply chain for humanoid-robot components, according to the Mercator Institute for China Studies, a German think tank. Meanwhile, most American humanoids are", "date_str": "2026-10-05T10:00:01+00:00", "hash": "8e81f38088fa9126", "title_fa": "سرمایه‌گذاران آمریکایی در حال بازدید از کارخانه‌های ربات‌های چین هستند تا رقابت را افزایش دهند", "summary_fa": "کارخانه AgiBot در شانگهای. (عکس از تانگ یانجون/ سرویس خبری چین/ VCG از طریق گتی ایماژ) تانگ یانجون/ سرویس خبری چین/ VCG از طریق گتی ایماژ سرمایه گذاران دره سیلیکون در حال سفرهای میدانی به کارخانه های ربات در چین هستند. هدف جستجوی سرمایه گذاری نیست، بلکه بزرگ کردن رقبای شرکت های پرتفوی آنها است. برخی از سرمایه گذاران 10000 دلار برای تورهایی با مترجم، پنج هتل و شام مدیران می پردازند. سال گذشته، زمانی که رایان کانینگهام، سرمایه‌گذار دره سیلیکون، سفری به چین را در گروهی از سرمایه‌گذاران روباتیک واتس‌اپ ارائه کرد، پاسخ چندان گرم نبود. یک نفر به شوخی پرسید که آیا می تواند یک ربات انسان نما را به خانه قاچاق کند؟ امسال شوخی ها جای خود را به برنامه های سفر داده اند. کانینگهام، بنیانگذار Edgerunner Ventures، یک شرکت سرمایه‌گذاری خطرپذیر که از استارت‌آپ‌های انرژی و محاسباتی حمایت می‌کند، در نظر دارد برای 10 سرمایه‌گذار در ماه آوریل سفری به چین داشته باشد. او به Business Insider گفت: تقریباً در هر گفتگوی گروهی سرمایه‌گذارانی که او در آن حضور دارد، یادداشت‌هایی درباره سفرهای اخیر یا آتی به چین معامله می‌کند، زیرا سرمایه‌گذاران خطرپذیر توانایی سخت‌افزاری چین را می‌سنجید تا ببینند استارت‌آپ‌های روباتیک آمریکایی با چه چیزی روبرو هستند. کانینگهام که سال گذشته برای کنفرانس جهانی هوش مصنوعی که یک گردهمایی سالانه برای صنعت هوش مصنوعی است از شانگهای بازدید کرد، گفت: «دلیل اینکه می‌خواهم آنها را به چین بیاورم این است که می‌خواهم شانه‌هایشان را بگیرم و بگویم: «بچه‌ها، اگر می‌خواهید جدی باشید، این چیزی است که ما باید از آن یاد بگیریم». کانینگهام یکی از کادر رو به رشد سرمایه‌گذاران دره سیلیکون است که به شرق می‌روند تا ببینند چین چگونه در رباتیک و سایر سخت‌افزارها پیشرفت کرده است. برای بسیاری، هدف این نیست که سرمایه‌گذاری‌های چینی را جستجو کنند. این است که رقبایی را"}, {"source": "Business Insider", "title": "I was 16 when I started reselling online. A few months later, my garage was a warehouse and I was making $25,000 a month.", "link": "https://www.businessinsider.com/teen-reselling-walmart-products-amazon-business-2026-10", "summary": "Courtesy of Ethan Alexander Ethan Alexander was a high school sophomore when he started reselling goods on Amazon. He did $125,000 in sales last year, before the business became overwhelming. He's invested much of the money and plans to use what he learned from the business. This as-told-to essay is based on a conversation with Ethan Alexander . It has been edited for length and clarity . Each year, I get a $500 gift from an investment account that my great-grandfather set up for all of his great-grandkids. My gramps — Jack Davis — owned his own company and left a legacy of entrepreneurship in our family. I get the money on his birthday, May 9th. In 2025, my sophomore year of high school, I came across a video on Instagram about making a profit by reselling items online shortly after I received Gramp's gift. I had stopped playing lacrosse, my typical spring sport, and I was looking for something to fill my time. I used the $500 to pay someone to teach me how to resell. I didn't do much research, just thought \"what's the worst that can happen?\" The business took off immediately, and I generated just under $10,000 in revenue that first month. In August, I did more than $25,000 in revenue. I resold lots of goods at a relatively small profit Success reselling on Amazon comes from volume. I would find a product where I could make a relatively small profit margin — about $2 to $4 — and sell lots of it. To find these products, I utilized software that many Amazon sellers use. I also used AI to create my own system for finding products. The first product I sold was laundry detergent , which I could buy at Walmart and resell on Amazon for about a 25% profit. I'd spend hours driving my truck to all the Walmarts in Greater Kansas City, buying as much detergent as I could fit. The garage at my home looked like a warehouse. Ethan Alexander turned his family s garage into his warehouse. Courtesy of Ethan Alexander After spending afternoons buying the goods, I'd stay up until the early morning packaging them. Then, I'd wake up in the early afternoon and bring my shipments to the post office. Before long, they knew me by name. I learned about the rewards of business and the risks The work wasn't glamorous. I was essentially working a warehouse job in my own house. I didn't see much of my friends that summer, because I was focused on scaling my sales. My mom was a huge asset. She runs her own health and wellness business and is also a business coach. I'm always willing to ", "date_str": "2026-10-05T09:59:01+00:00", "hash": "6d410bbfd0a899a4", "title_fa": "16 ساله بودم که شروع به فروش مجدد آنلاین کردم. چند ماه بعد، گاراژ من یک انبار بود و ماهیانه 25000 دلار درآمد داشتم.", "summary_fa": "با حسن نیت از Ethan Alexander اتان الکساندر دانش آموز دوم دبیرستان بود که شروع به فروش مجدد کالا در آمازون کرد. او سال گذشته 125000 دلار فروش داشت، قبل از اینکه تجارت بسیار زیاد شود. او بسیاری از پول را سرمایه گذاری کرده است و قصد دارد از آموخته های خود استفاده کند. این مقاله گفته شده بر اساس گفتگو با ایتان الکساندر است. برای طول و وضوح ویرایش شده است. هر سال، من یک هدیه 500 دلاری از یک حساب سرمایه گذاری که پدربزرگم برای همه اجدادش راه اندازی کرده است، دریافت می کنم. گرام من - جک دیویس - صاحب شرکت خودش بود و میراثی از کارآفرینی در خانواده ما به جا گذاشت. من پول را در روز تولد او، 9 مه دریافت می کنم. در سال 2025، سال دوم دبیرستان، مدت کوتاهی پس از دریافت هدیه گرامپ، با ویدیویی در اینستاگرام مواجه شدم که در مورد کسب سود از طریق فروش مجدد اقلام آنلاین بود. من بازی چوگان، ورزش معمولی بهاری ام را کنار گذاشته بودم و به دنبال چیزی بودم که وقتم را پر کند. من از 500 دلار استفاده کردم تا به کسی پول بدهم تا به من یاد دهد چگونه دوباره بفروشم. من خیلی تحقیق نکردم، فقط فکر کردم \"بدترین چیزی که ممکن است اتفاق بیفتد چیست؟\" تجارت بلافاصله شروع به کار کرد و من در همان ماه اول کمتر از 10000 دلار درآمد کسب کردم. در ماه آگوست، بیش از 25000 دلار درآمد داشتم. من کالاهای زیادی را با سود نسبتاً کم فروختم. فروش مجدد موفقیت آمیز در آمازون ناشی از حجم است. من محصولی را پیدا می کنم که بتوانم حاشیه سود نسبتاً کمی داشته باشم - حدود 2 تا 4 دلار - و مقدار زیادی از آن را بفروشم. برای یافتن این محصولات، از نرم افزاری استفاده کردم که بسیاری"}, {"source": "Business Insider", "title": "I toured Qatar's new Qsuite business class, which passengers are still waiting to fly. These are the 7 best upgrades.", "link": "https://www.businessinsider.com/see-qatar-airways-new-qsuite-business-class-next-gen-2026-10", "summary": "The new Qsuite is impressive, and I particularly liked the two-person window suite and personal safe. Angelo De Guzman Qatar Airways debuted its new Qsuite Next Gen business class in 2024, but it's still not flying. The airline said the cabin was planned for the Boeing 777-9, a plane years behind schedule. I toured the new seat to see what flyers can expect once it launches and found surprising upgrades. Qatar Airways hoped to debut the next generation of its famous Qsuite business class last year — with lockable drawers and two-person window suites — but it still hasn't flown a single passenger. The Doha-based airline unveiled its reinvented Qsuite at the UK's Farnborough Airshow in 2024, promising a new level of luxury for its Boeing 777-9 jets by 2025. The 777-9 is the larger variant of the 777X. But Boeing's new widebody still isn't certified. The 777X is seven years behind its original schedule, while Boeing continues to grapple with safety, quality, production, and supply-chain problems. Boeing CEO Kelly Ortberg said at a September Morgan Stanley conference that the 777-9 was still on track for 2027, but an engine issue discovered earlier this year could slightly push the timeline. \"I don't see that as a major challenge for us, but we still got a lot in front of us on the flight test program,\" Ortberg said. \"Not done until we're done.\" Neither Boeing nor Qatar Airways responded to a request for comment from Business Insider. While passengers continue to fly in the original Qsuite — introduced nearly a decade ago and already considered one of the world's best airline business class cabins — I toured Next Gen at the Arabian Travel Market trade show in Dubai in September. Qatar Airways Group CEO Hamad Ali Al-Khater told Euronews the same month that Qsuite Next Gen is due in summer 2027, though the airline has not announced any specific routes. Upgrades include new combinable suites, improved tech, and smarter storage. Seeing these features up close revealed interesting differences that weren't immediately obvious. Here are the seven things that stood out most on the Qsuite Next Gen. The Companion Suite connects two window passengers. The dual window seats. Angelo De Guzman The current Qsuite lets passengers open center seats into shared configurations. Next Gen brings that concept to two window passengers with the Companion Suite. One faces forward and the other backward, situated diagonally from each other instead of directly opposite. I could see my c", "date_str": "2026-10-05T09:45:01+00:00", "hash": "6e5cb64915a16acb", "title_fa": "من از کلاس تجاری جدید Qsuite قطر بازدید کردم که مسافران هنوز منتظر پرواز هستند. این 7 بهترین ارتقا هستند.", "summary_fa": "Qsuite جدید چشمگیر است و من به خصوص از مجموعه پنجره دو نفره و گاوصندوق شخصی خوشم آمد. Angelo De Guzman Qatar Airways کلاس تجاری جدید Qsuite Next Gen خود را در سال 2024 معرفی کرد، اما هنوز پرواز نمی کند. این شرکت هواپیمایی گفت که کابین برای هواپیمای بوئینگ 777-9 برنامه ریزی شده بود، هواپیمایی که سال ها از برنامه زمان بندی عقب تر بود. من صندلی جدید را گشتم تا ببینم پس از راه‌اندازی، آگهی‌دهنده‌ها چه انتظاری دارند و به‌روزرسانی‌های شگفت‌انگیزی پیدا کردم. قطر ایرویز امیدوار بود که نسل بعدی کلاس تجاری معروف Qsuite خود را در سال گذشته با کشوهای قفل شونده و سوئیت های پنجره دو نفره معرفی کند، اما هنوز حتی یک مسافر نیز پرواز نکرده است. این شرکت هواپیمایی مستقر در دوحه در نمایشگاه هوایی Farnborough انگلستان در سال 2024 از Qsuite اختراع شده خود رونمایی کرد و نوید سطح جدیدی از تجمل را برای جت های بوئینگ 777-9 تا سال 2025 داد. 777-9 نوع بزرگتر 777X است. اما بدنه پهن جدید بوئینگ هنوز تایید نشده است. 777X هفت سال از برنامه اولیه خود عقب است، در حالی که بوئینگ همچنان با مشکلات ایمنی، کیفیت، تولید و زنجیره تامین دست و پنجه نرم می کند. کلی اورتبرگ، مدیرعامل بوئینگ، در کنفرانس مورگان استنلی در سپتامبر گفت که 777-9 هنوز در مسیر سال 2027 قرار دارد، اما یک مشکل موتور که در اوایل سال جاری کشف شد می‌تواند تا حدودی جدول زمانی را تغییر دهد. اورتبرگ گفت: «من این را چالش بزرگی برای ما نمی‌دانم، اما هنوز هم در برنامه آزمایشی پرواز، چیزهای زیادی پیش روی خود داریم. \"تا زمانی که کارمان تمام نشود، انجام نمی شود.\" نه بوئینگ و نه قطر ایرویز به درخواست بیزینس اینسایدر برای اظهار نظر پاسخ ندادند. در حالی که مسافران همچنان با Qsuite اصلی پرواز می کنند - که"}, {"source": "Business Insider", "title": "America's EV graveyard has grown by nearly 20 discontinued vehicles this year", "link": "https://www.businessinsider.com/evs-automakers-axed-this-year-2026-3", "summary": "Several EV models have been pulled from automaker s lineups in 2026. It extends a trend that stretched from September 2025. Hyundai USA Automakers have reorganized their EV lineups since September 2025, when federal tax credits ended. Sagging demand, tariffs, and a new generation of EVs have also led to several product cancellations. Business Insider compiled a list of EVs that have been killed or indefinitely delayed in 2026. American EV sales aren't looking too hot . Since September 2025, when the federal $7,500 tax credit for US-made EVs ended, fewer shoppers have chosen a battery-powered car for their next set of wheels. In the second quarter of 2026, deliveries dropped 20.5%, according to Cox Automotive data. That follows a 27% drop in first-quarter 2026 EV sales and a 36% plunge in EV sales in the final quarter of 2025. The slowdown began reshaping which new car models appeared on US dealership lots last year. By the end of 2025, Ford ended production of the F-150 Lightning, Nissan axed the Ariya, Acura stopped building the ZDX, and Volkswagen paused the ID. Buzz until 2027. That shake-up has continued into 2026, but the lineup changes aren't a wholesale retreat from EVs . \"It's a part of many legacy automakers retooling their EV strategies,\" Seth Goldstein, an analyst at Morningstar, told Business Insider. \"A lot of automakers are going back to the drawing board. They're looking to discontinue unprofitable EVs and replace them with more affordable, long-range EVs.\" Business Insider is tracking every EV canceled or postponed since January 1, 2026 — a list we'll keep updating as the industry redraws its all-electric road map. Hyundai Ioniq 6 Standard Hyundai. confirmed to Business Insider that the Standard model Ioniq 6 is discontinued in the US. Sjoerd van der Wal/Getty Images Hyundai confirmed to Business Insider that it will stop selling the Korean-built, standard Ioniq 6 in the US. The retro-styled sedan never matched the success of its crossover sibling, the Ioniq 5, which has sold more than 30,000 units this year. Hyundai said it sold just 229 Ioniq 6s in February, its final full month of sales. \"Sedan sales have declined a lot over the past decade, and the Ioniq 6 is no exception,\" Sam Abuelsamid, the vice president of market research at Telemetry, told Business Insider. \"Without enough sales to justify US production, the numbers just don't add up for Hyundai.\" Hyundai said it plans to import a limited number of high-performance Ioniq 6 N model", "date_str": "2026-10-05T09:33:01+00:00", "hash": "228a6664958eb440", "title_fa": "قبرستان EV آمریکا در سال جاری نزدیک به 20 وسیله نقلیه متوقف شده افزایش یافته است", "summary_fa": "چندین مدل EV از خط تولید خودروسازان در سال 2026 خارج شدند. این روند از سپتامبر 2025 ادامه یافت. خودروسازان هیوندای ایالات متحده از سپتامبر 2025، زمانی که اعتبار مالیاتی فدرال به پایان رسید، خط تولید خودروهای برقی خود را سازماندهی مجدد کرده اند. کاهش تقاضا، تعرفه ها و نسل جدید خودروهای برقی نیز منجر به لغو چندین محصول شده است. Business Insider فهرستی از خودروهای برقی که در سال 2026 کشته شده اند یا به طور نامحدود به تعویق افتاده اند جمع آوری کرده است. فروش خودروهای برقی آمریکایی چندان داغ به نظر نمی رسد. از سپتامبر 2025، زمانی که اعتبار مالیاتی 7500 دلاری فدرال برای خودروهای الکتریکی ساخت ایالات متحده به پایان رسید، تعداد کمتری از خریداران خودرویی با باتری را برای چرخ های بعدی خود انتخاب کردند. بر اساس داده های Cox Automotive، در سه ماهه دوم سال 2026، تحویل 20.5 درصد کاهش یافت. این به دنبال کاهش 27 درصدی در فروش سه ماهه اول 2026 و افت 36 درصدی در فروش خودروهای برقی در سه ماهه پایانی سال 2025 است. کاهش سرعت شروع به تغییر شکل مدل‌های جدید خودرو در سال گذشته در نمایندگی‌های ایالات متحده کرد. در پایان سال 2025، فورد به تولید F-150 لایتنینگ پایان داد، نیسان آریا را تبر کرد، آکورا ساخت ZDX را متوقف کرد و فولکس واگن ID را متوقف کرد. تا سال 2027 پر سر و صدا. این تغییر تا سال 2026 ادامه داشت، اما تغییرات خط تولید، عقب نشینی عمده ای از خودروهای برقی نیست. ست گلدشتاین، تحلیلگر مورنینگ استار، به بیزینس اینسایدر گفت: «این بخشی از بسیاری از خودروسازان قدیمی است که استراتژی‌های خودروهای برقی خود را بازطراحی می‌کنند. «بسیاری از خودروسازان در حال بازگشت به تابلوی طراحی هستند. آنها به دنبال توقف تولید خودروهای برقی غیرسودآور و جایگزینی آنها با خودروهای برقی دوربرد مقرون به صرفه تر"}, {"source": "Business Insider", "title": "Where to invest $10,000 right now in a market rattled by higher interest rates", "link": "https://www.businessinsider.com/where-to-invest-10000-right-now-bond-yields-interest-rates-2026-10", "summary": "Getty Images; Tyler Le/BI The Fed is hiking rates for the first time since 2023, changing the landscape for investors. Complicating matters is an ever-shifting AI trade that's constantly minting new winners and losers. We asked eight investing pros how they would invest $10,000 right now. Do you feel that? The nagging sense that financial conditions are slowly getting tighter? It's a new reality for investors contending with the first interest-rate-hiking cycle since 2023 . And it's the backdrop for the latest installment of Business Insider's quarterly \" Where to Invest $10,000 \" series. The Federal Reserve is fighting against inflation at a time when the Iran war is pushing energy costs higher . AI companies, meanwhile, are continuing to pour hundreds of billions into capex, and increasingly tapping debt markets to fund it. The result has been a run of multi-decade highs in Treasury yields , reflecting a market that's worried not just about the Fed's next move, but America's ballooning debt and deficits. We spoke to eight investing pros to find out where they're seeing the best opportunities right now as rate hikes collide with AI ambitions. If you have a chunk of money you're looking to invest, here's what they recommend: Kriti Gupta, global investment strategist, JPMorgan Private Bank JPMorgan Chase named 135 executives in global banking and markets to the rank of managing director, part of a larger class of employees raised to the title this week. Bloomberg/Getty Images Investing ideas: Utility stocks, industrials, defense, financials Interest rates look poised to remain structurally higher, but US stocks seem resilient for now, Gupta told BI. She pointed to how the recent rise in yields has been spread out over weeks, and the broader move up has taken place over the course of this year, giving investors time to adjust. Gupta said that the AI trade likely has more room to climb, especially considering how stock valuations have compressed recently amid the bond sell-off. Her allocation view is to be overweight US stocks over bonds. In equities, she sees opportunities in four sectors: (1) utilities , a defensive play, (2) industrials , linked to the AI buildout, (3), defense , because of US government investment, and (4) financials , because higher rates will juice their interest income. Funds that track these sectors include the Vanguard Utilities ETF, the State Street Industrial Select Sector SPDR ETF, the iShares US Aerospace Defense ETF, and the iSh", "date_str": "2026-10-05T09:30:01+00:00", "hash": "eff8c61357302892", "title_fa": "کجا می توان در حال حاضر 10000 دلار در بازاری که با نرخ های بهره بالاتر متلاطم شده است، سرمایه گذاری کرد", "summary_fa": "گتی ایماژ; تایلر لی/بی آی فدرال رزرو برای اولین بار از سال 2023 نرخ بهره را افزایش می دهد و چشم انداز سرمایه گذاران را تغییر می دهد. پیچیده‌تر کردن مسائل، تجارت دائماً در حال تغییر هوش مصنوعی است که دائماً برندگان و بازنده‌های جدیدی را ایجاد می‌کند. از هشت کارشناس سرمایه‌گذاری پرسیدیم که در حال حاضر چگونه 10000 دلار سرمایه‌گذاری می‌کنند. آیا شما آن را احساس می کنید؟ حس آزار دهنده ای که شرایط مالی کم کم تنگ تر می شود؟ این یک واقعیت جدید برای سرمایه گذارانی است که با اولین چرخه افزایش نرخ بهره از سال 2023 مبارزه می کنند. و این پس‌زمینه آخرین قسمت از مجموعه فصلی Business Insider با نام «کجا سرمایه‌گذاری 10000 دلاری» است. فدرال رزرو در حالی با تورم مبارزه می کند که جنگ ایران هزینه های انرژی را بالاتر می برد. در همین حال، شرکت‌های هوش مصنوعی همچنان به سرمایه‌گذاری صدها میلیارد دلاری خود ادامه می‌دهند و به طور فزاینده‌ای از بازارهای بدهی برای تامین مالی آن بهره می‌برند. نتیجه افزایش چند دهه در بازدهی خزانه داری بوده است که بازتاب بازاری است که نه تنها در مورد حرکت بعدی فدرال رزرو، بلکه در مورد بدهی و کسری بودجه آمریکا نگران است. ما با هشت سرمایه‌گذار حرفه‌ای صحبت کردیم تا بفهمیم که بهترین فرصت‌ها را در حال حاضر کجا می‌بینند، زیرا افزایش نرخ‌ها با جاه‌طلبی‌های هوش مصنوعی برخورد می‌کند. اگر مقدار زیادی پول دارید که به دنبال سرمایه‌گذاری هستید، توصیه آن‌ها به این صورت است: کریتی گوپتا، استراتژیست سرمایه‌گذاری جهانی، بانک خصوصی جی‌پی مورگان جی‌پی مورگان چیس، ۱۳۵ مدیر اجرایی در بانکداری و بازارهای جهانی را به عنوان مدیر عامل، بخشی از طبقه بزرگ‌تری از کارمندانی که این هفته به این عنوان ارتقا یافتند، معرفی کرد. بلومبرگ/گتی ایماژ ایده‌های سرمایه‌گذاری: سهام شرکت‌ها، صنایع، دفاع، امور مالی، به نظر می‌رسد که نرخ‌های بهره"}, {"source": "Business Insider", "title": "I increased my salary from $22K to $180K salary before a layoff. Taking a pay cut in my next role felt like a step backward.", "link": "https://www.businessinsider.com/salary-journey-to-180k-wine-studies-career-change-laid-off-2026-10", "summary": "Elianor Williamson went from making $22,000 to $180,000 in a decade. Then a layoff and job search made her feel like she s taken a step backward. Courtesy of Elianor Williamson; BI Elianor Williamson is a 36-year-old living in Seattle. Business Insider has verified Williamson's income and employment history with documentation. The following as-told-to essay has been edited for length and clarity. I went to school for wine. My major was originally education, but while studying abroad for a year in Ireland, I took a class on global food and beverage, and loved it. I switched majors to global wine studies — a little bit of the marketing world and a lot of the wine world. I was drawn to it because it seemed like a fun, cool, shiny, interesting career path. Salary wasn't really discussed in my two years of studying; looking back now, that was disappointing. After graduating from Central Washington University in June 2013, I worked in the wine industry for about half a year at a tasting room, pouring wine for people and helping at events. I was broke and didn't feel I could make any money in that space. I wanted to start a corporate career. Here's my salary journey since then. Event coordinator, $22,000 Later in 2013, I found a nonprofit in my area that was hiring for an event coordinator role for wine-related events, like fundraisers where we'd auction off wine for donations. My offer was around $22,000, my first salary. I was thrilled; before, I'd been paid hourly. I had an office that I went into every day. I did that for about a year, and I realized there was a sort of ceiling on salary for nonprofit work. Salary Journeys is Business Insider's first-person series following real people and their real paychecks — how they built their income, what it means for their lives, and what they learned along the way. If you're willing to share how your salary has changed over time, please fill out this Google Form . Marketing manager, $45,000 A friend of a friend worked at a marketing agency, which I knew nothing about, but he got me an interview. I was offered a role as a marketing manager in 2015, and they asked what I was looking for from a salary perspective. I'd read all these articles about not being the first one to share a number , so I was like, \"Well, it's going to have to be a lot more than what I'm making now,\" which wasn't helpful, because I hadn't told them what I was making. We went back and forth, and finally I asked for between $40,000 and $45,000. The", "date_str": "2026-10-05T09:15:01+00:00", "hash": "046bf6bfe7ed1c50", "title_fa": "قبل از اخراج، حقوقم را از 22 هزار دلار به 180 هزار دلار افزایش دادم. کاهش دستمزد در نقش بعدی من یک قدم به عقب به نظر می رسید.", "summary_fa": "الینور ویلیامسون در یک دهه از 22000 دلار به 180000 دلار رسید. سپس اخراج و جستجوی شغل باعث شد او احساس کند که یک قدم به عقب برداشته است. با حسن نیت از Elianor Williamson; BI Elianor Williamson یک 36 ساله است که در سیاتل زندگی می کند. Business Insider درآمد و سابقه اشتغال ویلیامسون را با مستندات تأیید کرده است. مقاله زیر برای طولانی بودن و وضوح ویرایش شده است. برای شراب به مدرسه رفتم. رشته من در اصل تحصیلات بود، اما در حین تحصیل در خارج از کشور به مدت یک سال در ایرلند، در کلاسی در مورد غذا و نوشیدنی جهانی شرکت کردم و آن را دوست داشتم. من رشته را به مطالعات جهانی شراب تغییر دادم - کمی از دنیای بازاریابی و بسیاری از دنیای شراب. من به سمت آن کشیده شدم زیرا به نظر یک مسیر شغلی سرگرم کننده، باحال، درخشان و جالب بود. حقوق در دو سال تحصیل من واقعاً مورد بحث قرار نگرفت. اکنون که به گذشته نگاه می کنم، ناامید کننده بود. پس از فارغ التحصیلی از دانشگاه مرکزی واشنگتن در ژوئن 2013، حدود نیم سال در یک اتاق چشایی در صنعت شراب کار کردم و برای مردم شراب می ریختم و در رویدادها کمک می کردم. من شکست خورده بودم و احساس نمی کردم می توانم در آن فضا پولی به دست بیاورم. من می خواستم یک حرفه شرکتی را شروع کنم. این سفر حقوق من از آن زمان است. هماهنگ کننده رویداد، 22000 دلار بعداً در سال 2013، یک سازمان غیرانتفاعی در منطقه خود پیدا کردم که برای نقش هماهنگ کننده رویداد برای رویدادهای مرتبط با شراب، مانند جمع آوری کمک های مالی که در آن شراب را برای کمک های مالی به حراج می گذاریم، استخدام می کرد. پیشنهاد من حدود 22000 دلار بود، اولین حقوقم. من هیجان زده"}, {"source": "Business Insider", "title": "GameStop CEO Ryan Cohen shared his best and worst investments with Business Insider. Neither of them involves money.", "link": "https://www.businessinsider.com/gamestop-ryan-cohen-best-worst-investments-chewy-father-buffett-trust-2026-10", "summary": "GameStop CEO Ryan Cohen. GameStop Ryan Cohen outlined his best and worst investments to Business Insider in an email in late September. GameStop's billionaire CEO said nothing could match his return from spending time with his father. The Chewy cofounder said his biggest investing mistake was trusting the wrong people. Ryan Cohen says the best and worst investments of his life have to do with people, not money. GameStop's CEO and Chewy's billionaire cofounder told Business Insider by email last week that nothing has yielded a greater return for him than spending \"time with my dad.\" \"I'm still collecting dividends,\" Cohen said about his father, Ted, who died in 2019. Cohen launched a \"Teddy\" series of children's books in 2022 to share his father's lessons with a wider audience. He detailed some of them in an email to Business Insider in 2020. \"My dad showed me how to trust my instincts,\" he wrote. \"When I was a child, he treated me like an adult. He never patronized me. When I asked him for his opinion, he turned it back on me and asked me what I thought. He never wanted to bias me with his. He was the best listener. He was a glassware importer and knew his business inside and out. I learned how to build my company by watching him build his.\" In a prior phone interview, Cohen said that his father had the \"greatest influence\" on him of anyone, and \"taught me everything.\" \"Most importantly, he taught me to shave,\" he quipped. I just played with my dad. Dreams with him are the best. — Ryan Cohen (@ryancohen) May 23, 2022 In his email last week, Cohen said his gravest investing error was putting his faith in others who talked a big game but ultimately disappointed him. \" Trusting people who were better at selling themselves than doing the work,\" he said. Warren Buffett , Cohen's biggest professional influence after his dad, has warned against falling for false promises. In his final shareholder letter as Berkshire Hathaway CEO, Buffett wrote that \"our country has forever had many scoundrels and promoters who seek to take advantage of those who mistakenly trust them with their savings.\" Writing about brokers in his 1983 letter, Buffett said: \"Those who cannot fill your pocket will confidently fill your ear.\" Cohen was clearly burned by people who sold him on their abilities but failed to deliver, leading him to chalk up his investment of time, energy, and resources in them as a loss. Read the original article on Business Insider", "date_str": "2026-10-05T09:07:21+00:00", "hash": "85c722b3a6eee217", "title_fa": "رایان کوهن، مدیر عامل GameStop، بهترین و بدترین سرمایه گذاری های خود را با Business Insider به اشتراک گذاشت. هیچ کدام از آنها پولی را شامل نمی شود.", "summary_fa": "رایان کوهن مدیر عامل GameStop. GameStop رایان کوهن در اواخر سپتامبر در ایمیلی به Business Insider بهترین و بدترین سرمایه گذاری خود را معرفی کرد. مدیر عامل میلیاردر GameStop گفت هیچ چیز نمی تواند به اندازه بازگشت او از گذراندن وقت با پدرش باشد. بنیانگذار Chewy گفت بزرگترین اشتباه سرمایه گذاری او اعتماد به افراد اشتباه بود. رایان کوهن می‌گوید بهترین و بدترین سرمایه‌گذاری‌های زندگی‌اش به مردم مربوط می‌شود، نه پول. مدیر عامل GameStop و یکی از بنیانگذاران میلیاردر Chewy هفته گذشته از طریق ایمیل به Business Insider گفت که هیچ چیز به اندازه گذراندن \"زمان با پدرم\" سود بیشتری برای او به همراه نداشته است. کوهن درباره پدرش تد که در سال 2019 درگذشت، گفت: \"من هنوز دارم سود سهام جمع می کنم.\" کوهن در سال 2022 مجموعه ای از کتاب های کودک \"تدی\" را راه اندازی کرد تا درس های پدرش را با مخاطبان بیشتری به اشتراک بگذارد. او در ایمیلی به Business Insider در سال 2020 برخی از آنها را توضیح داد. او نوشت: «پدرم به من نشان داد که چگونه به غرایز خود اعتماد کنم. او می گوید: \"وقتی بچه بودم، مثل یک بزرگسال با من رفتار می کرد. هرگز از من حمایت نمی کرد. وقتی از او نظر خواستم، نظرش را به من برگرداند و از من پرسید که چه فکری می کنم. او هرگز نمی خواست مرا با نظر خود سوگیری کند. او بهترین شنونده بود. او وارد کننده ظروف شیشه ای بود و کار خود را از درون و بیرون می دانست. من یاد گرفتم که چگونه شرکتم را با تماشای ساختن شرکتش بسازم.\" کوهن در یک مصاحبه تلفنی قبلی گفت که پدرش \"بزرگترین تاثیر\" را در بین هر کسی روی او گذاشت و \"همه چیز را به من آموخت.\" او با تمسخر گفت: \"مهمتر از همه این که او به من یاد"}, {"source": "Business Insider", "title": "The midterms will come down to the cost of everything — and who voters trust to fix it", "link": "https://www.businessinsider.com/affordability-midterm-elections-inflation-gas-electricity-housing-prices-swing-states-2026-10", "summary": "Getty Images; BI Candidates in swing states are vying to win on the Big A: Affordability. In states with key Senate races, gas, electricity, and housing prices have all soared. Now, candidates on both sides of the aisle are touting their plans to bring costs down. Zac Owen, a 31-year-old brand strategist and high school football coach in the hotly contested swing state of Michigan , said that it's normal to drive two to four hours to get somewhere else in the state. The cost of those long commutes is top of mind for Owen and other voters as the country heads into the midterm congressional elections. \" Gas prices , oh boy. People are up in arms about gas prices over here. I'll tell you that,\" Owen said. Hearing more about gas pricing from candidates, he said, would help sway his decision. The elections are in about a month, and candidates have touted their plans to bring costs down. But a war in Iran and rising prices for things like electricity and housing threaten to keep the affordability issue front-and-center. A Reuters/Ipsos poll from August found that 47% of registered voters said the cost of living would be the most important factor in choosing a candidate if the elections were held today. Consumer price growth came in at 3.4% in August, exacerbated by the ongoing Iran war and its disruptions to the oil market . Tariffs have also added upward pressure . That puts inflation above the Fed's 2% target, although it's down from its post-pandemic highs. The Fed raised interest rates for the first time since 2023 in September to try to dampen rising prices, and more hikes could happen before the year is over. Senate races in Alaska, Iowa, Maine, Michigan, New Hampshire, Ohio, and Texas are all toss-ups, according to the political handicappers at The Cook Political Report. Business Insider took a look at how prices have fared during President Donald Trump's second term in those states, along with how candidates in key elections have been talking about affordability. Gasoline Americans are shelling out more to fill their gas tanks , as average prices are up from a year ago. \"Typically, the start of autumn brings lower gas prices, but lingering volatility in the Strait of Hormuz and the high cost of crude oil are driving up pump prices,\" AAA said in September. Data from GasBuddy, which collects price reports from gas stations, showed prices have increased about 46% nationally from January 2025 to roughly the end of September 2026. Most of the seven swing stat", "date_str": "2026-10-05T09:00:01+00:00", "hash": "d9e61955dc848b14", "title_fa": "میان‌دوره‌ها به هزینه همه چیز کاهش می‌یابد – و اینکه رای‌دهندگان به چه کسی برای رفع آن اعتماد دارند", "summary_fa": "گتی ایماژ; نامزدهای BI در ایالت های نوسان برای برنده شدن در Big A: Affordability رقابت می کنند. در ایالت هایی با رقابت های مهم سنا، قیمت گاز، برق و مسکن همگی افزایش یافته است. اکنون، نامزدهای هر دو طرف راهرو در حال تبلیغ برنامه های خود برای کاهش هزینه ها هستند. زک اوون، استراتژیست 31 ساله و مربی فوتبال دبیرستانی در ایالت سوئینگ میشیگان، 31 ساله، گفت که برای رفتن به جای دیگری در ایالت، رانندگی دو تا چهار ساعته عادی است. هزینه این رفت و آمدهای طولانی برای اوون و سایر رای دهندگان در حالی که کشور به سمت انتخابات میان دوره ای کنگره می رود، مهم است. اوون گفت: \"قیمت بنزین، اوه پسر. مردم اینجا در مورد قیمت بنزین نگران هستند. من این را به شما می گویم.\" او گفت که شنیدن بیشتر در مورد قیمت گاز از سوی نامزدها به تغییر تصمیم او کمک می کند. انتخابات حدود یک ماه دیگر است و نامزدها برنامه های خود را برای کاهش هزینه ها اعلام کرده اند. اما جنگ در ایران و افزایش قیمت‌ها برای چیزهایی مانند برق و مسکن تهدید می‌کند که موضوع مقرون‌به‌صرفه را در کانون توجه قرار دهد. نظرسنجی رویترز/ایپسوس در ماه اوت نشان داد که 47 درصد از رای دهندگان ثبت نام شده گفتند که اگر انتخابات امروز برگزار شود، هزینه زندگی مهمترین عامل در انتخاب نامزد خواهد بود. رشد قیمت مصرف کننده در ماه اوت به 3.4 درصد رسید که به دلیل جنگ ادامه دار ایران و اختلالات آن در بازار نفت تشدید شد. تعرفه ها فشار صعودی را نیز به همراه داشته است. این تورم را بالاتر از هدف 2 درصدی فدرال رزرو قرار می دهد، اگرچه از بالاترین سطح پس از همه گیری کاهش یافته است. فدرال رزرو برای اولین بار از سال 2023 در سپتامبر نرخ بهره را افزایش داد"}, {"source": "Business Insider", "title": "My family of 5 moved into a 3-bedroom duplex. I was dreading downsizing at first, but I'm glad we did.", "link": "https://www.businessinsider.com/dreaded-downsizing-family-unexpected-benefits-smaller-home-2026-10", "summary": "The author s family of five moved into a three-bedroom duplex. Courtesy of Melissa Noble Most of my previous homes have been bigger, two-story houses. However, my family of five just moved into a smaller three-bedroom duplex. I was dreading having less space at first, but there are unexpected benefits. I've always loved the idea of having a big family home . I grew up in a two-story house with six family members, and it was always loud, fun, and messy. Now that I'm a mother of three, I have a very different perspective on what it actually takes to run a busy family home. After living in multiple two-story houses in the last few years, I've realized that bigger isn't necessarily better in many ways. In August, our family of five downsized to a small three-bedroom duplex in Labrador on the Gold Coast, Australia. Before that, we'd been living with my parents , and prior to that, we lived in a double-story house in Bright, in country Victoria. Initially, I dreaded the idea of residing in what felt like a shoebox. How would we all cope? Would the kids drive each other nuts? How would they manage without a big yard to run around in? And most importantly, where on earth would I hide, aside from the shower? The first couple of weeks were an adjustment, as we got used to our smaller abode . But much to my surprise, I'm actually finding it to be a refreshing change, and there have been plenty of unexpected benefits. The inside is so much easier to clean Our previous homes took me at least three hours to clean each week. When you're busy running businesses and raising three children , that kind of time can feel like dead expenditure, a bit like paying rent. In contrast, it takes less than an hour to clean our new home. It's light and bright and somehow doesn't seem to accumulate dust in the same way the two-story properties did. Having a smaller space to maintain has saved me an enormous amount of time and energy. Instead of spending hours keeping on top of the housework , my husband and I have more time for things that actually matter to us, like making memories with our kids. The author spends less time on cleaning in her smaller home. Courtesy of Melissa Noble There's less yard work One of my favorite things about our home in country Victoria was the garden. It had these beautiful, mature trees that were spectacular to look at, but they also dropped a huge amount of foliage. As a result, my husband was forever outside raking up debris. Likewise, when we lived with", "date_str": "2026-10-05T08:38:01+00:00", "hash": "6e8aa7187984a335", "title_fa": "خانواده 5 نفره من به یک دوبلکس 3 خوابه نقل مکان کردند. من در ابتدا از کوچک سازی می ترسیدم، اما خوشحالم که انجام دادیم.", "summary_fa": "خانواده پنج نفره نویسنده به یک دوبلکس سه خوابه نقل مکان کردند. با اجازه ملیسا نوبل اکثر خانه های قبلی من خانه های بزرگتر و دو طبقه بودند. با این حال، خانواده پنج نفره من به تازگی به یک دوبلکس سه خوابه کوچکتر نقل مکان کردند. من در ابتدا از داشتن فضای کمتر می ترسیدم، اما مزایای غیرمنتظره ای دارد. من همیشه ایده داشتن یک خانه بزرگ خانوادگی را دوست داشتم. من در یک خانه دو طبقه با شش عضو خانواده بزرگ شدم و همیشه پر سر و صدا، سرگرم کننده و نامرتب بود. اکنون که مادر سه فرزند هستم، دیدگاه بسیار متفاوتی در مورد اینکه واقعاً برای اداره یک خانه خانوادگی شلوغ نیاز است، دارم. پس از زندگی در چند خانه دو طبقه در چند سال گذشته، متوجه شدم که بزرگتر بودن لزوما از بسیاری جهات بهتر نیست. در ماه اوت، خانواده پنج نفره ما به یک دوبلکس کوچک سه خوابه در لابرادور در ساحل طلایی، استرالیا کوچک شدند. قبل از آن، ما با پدر و مادرم زندگی می کردیم، و قبل از آن، در خانه ای دو طبقه در برایت، در ایالت ویکتوریا زندگی می کردیم. در ابتدا، از این که در جایی که شبیه یک جعبه کفش بود، می ترسیدم. همه ما چگونه کنار می آییم؟ آیا بچه ها همدیگر را دیوانه می کنند؟ چگونه آنها بدون یک حیاط بزرگ برای دویدن از پس آن بر می آیند؟ و مهمتر از همه، در کجای زمین، جدا از دوش، پنهان می‌شوم؟ چند هفته اول یک تغییر بود، چون به خانه کوچکترمان عادت کردیم. اما در کمال تعجب، در واقع متوجه می‌شوم که این یک تغییر تازه‌کننده است، و مزایای غیرمنتظره‌ای زیادی به همراه داشته است. تمیز کردن داخل آن بسیار آسان‌تر است. خانه‌های قبلی ما هر هفته حداقل سه ساعت طول می‌کشید تا تمیز کنم. وقتی مشغول راه"}, {"source": "Business Insider", "title": "LinkedIn pros have found a new key to getting opportunities: selfies", "link": "https://www.businessinsider.com/linkedin-pros-found-a-new-key-to-getting-opportunities-selfies-2026-10", "summary": "Courtesy of Arielle Berlinsky and Tara Crymble LinkedIn creators are finding career success by posting work selfies and videos on the platform. AI's impact on LinkedIn is making authentic, personal posts more effective than polished content. LinkedIn launched a Next Gen Voices program to help young creators connect and grow their careers. Your next career opportunity could start with your front-facing camera. For some LinkedIn creators , selfies and unscripted videos are opening doors that career updates alone did not — from speaking invitations to a new job. Three LinkedIn professionals told Business Insider that what used to be awkward on a platform where your boss, colleagues, and potential employers are watching is becoming the new norm that those looking to stand out may need to adapt to. Arielle Berlinsky, the Director of Marketing at Movement Strategy, told Business Insider she started posting on LinkedIn while in a workplace where rules and expectations felt constraining, and LinkedIn became a space to share opinions, humor, and — eventually — her face. “Even if you're working for a small company, you have a certain box that you can be kept in or standards you have to uphold,” Berlinsky said, adding that she initially shared photos from work events, then began recording videos about experiences and lessons as they happened. \"The one thing you carry with you everywhere is your face and your name and your personality because that's the heart of who you are,\" Berlinsky said. “I'm so much more than just my job and my title.” AI is reshaping tactics for how to stand out As AI makes polished posts easier to produce, some creators say personality can help people connect with the human behind the profile. Tara Crymble, an account manager at B2B influencer marketing agency Creatorbuzz , told Business Insider that showing her face and speaking on video helps convey something a text post can struggle to capture. “In this time of AI, it's so easy for people to get lost in this overly polished, filtered, corporate, or even robotic tone ,” Crymble said. “I think if you're posting your face or especially video content, you can add in your personality and your quirks into your content, and it just comes across as more genuine,” Crymble added. “And I think that layer of trust is more quickly built.” LinkedIn has been tightening its approach to AI content , introducing a “Seems like AI slop ” feedback option and tools to limit the distribution of generic AI-generate", "date_str": "2026-10-05T08:11:01+00:00", "hash": "1584f4430c71bb08", "title_fa": "متخصصان لینکدین یک کلید جدید برای گرفتن فرصت پیدا کرده اند: سلفی", "summary_fa": "خالقان لینکدین آریل برلینسکی و تارا کرایمبل با ارسال سلفی ها و ویدیوهای کاری در این پلتفرم به موفقیت شغلی دست می یابند. تاثیر هوش مصنوعی بر لینکدین باعث می‌شود که پست‌های معتبر و شخصی مؤثرتر از محتوای صیقلی باشد. لینکدین برنامه Next Gen Voices را راه اندازی کرد تا به سازندگان جوان کمک کند تا با هم ارتباط برقرار کنند و حرفه خود را رشد دهند. فرصت شغلی بعدی شما می تواند با دوربین جلوی شما شروع شود. برای برخی از سازندگان لینکدین، سلفی‌ها و ویدیوهای بدون اسکریپت درهایی را باز می‌کنند که به‌روزرسانی‌های شغلی به تنهایی نتوانستند - از دعوت‌نامه‌های سخنرانی تا شغل جدید. سه نفر از متخصصان لینکدین به Business Insider گفتند که آنچه قبلاً در پلتفرمی که رئیس، همکاران و کارفرمایان بالقوه شما آن را تماشا می‌کردند ناخوشایند بود، در حال تبدیل شدن به هنجار جدیدی است که کسانی که به دنبال برجسته شدن هستند ممکن است نیاز داشته باشند با آن سازگار شوند. آریل برلینسکی، مدیر بازاریابی در Movement Strategy، به Business Insider گفت که شروع به پست گذاشتن در لینکدین کرد در حالی که در محل کار بود که در آن قوانین و انتظارات محدود کننده بود و لینکدین به فضایی برای به اشتراک گذاشتن نظرات، شوخ طبعی و - در نهایت - چهره او تبدیل شد. برلینسکی گفت: «حتی اگر برای یک شرکت کوچک کار می‌کنید، جعبه خاصی دارید که می‌توانید در آن نگه دارید یا استانداردهایی را که باید رعایت کنید، دارید. برلینسکی گفت: \"تنها چیزی که همه جا با خود حمل می کنید، صورت، نام و شخصیت شماست، زیرا این قلب شماست.\" \"من خیلی بیشتر از شغل و عنوانم هستم.\" هوش مصنوعی در حال تغییر شکل تاکتیک‌هایی برای برجسته شدن است، از آنجایی که هوش مصنوعی تولید پست‌های صیقلی را آسان‌تر می‌کند، برخی از سازندگان می‌گویند شخصیت می‌تواند به افراد کمک"}, {"source": "Business Insider", "title": "Silicon Valley founders' hottest funding source: the Bank of Best Friends", "link": "https://www.businessinsider.com/silicon-valley-founders-funding-bank-best-friends-2026-10", "summary": "iStock; Tyler Le/BI Katherine Naylor Pullman started Our Third Place, a networking group for women in media, as a part-time side project. It began four years ago with monthly, then weekly, dinners. Women in Chicago and Los Angeles reached out, wanting to host their own dinners. Now, Our Third Place is in 40 cities, and running it has blossomed into a full-time gig for Naylor Pullman, who left a previous job in brand partnerships. Our Third Place has grown to 1,800 members without big investors, and that's by design. \"If someone were to throw us millions of dollars, they would then want millions of members,\" Naylor Pullman says. \"I firmly believe you cannot scale community by the millions.\" She and the company's CEO, Ashley Preininger, are building by seed-strapping , a tactic where companies raise smaller investments and forgo the traditional venture capital cycle of Series A and Series B fundraising, and then grow the company through revenue. They're raising money now from family, friends, and members, because they can work within that smaller fundraising space, and keep costs for members lower when the company isn't beholden to massive investor returns. \"We actually don't feel like we need a huge influx of cash to do what we need to do,\" Preininger says. Seed-strapping has become more appealing to founders as venture capital funding waned following the 2010s boom and the end of the zero-interest rate policy . The shift also comes amid the rise of the single-person startup , as more founders deploy AI agents to help with coding, accounting, marketing, and other tasks that once required expensive labor. The founders who spoke with me for this story tell me they're taking an alternate path to funding by choice, seeing that more money can come with more problems — more commitments, more expectations, and less control of their company. Amid \"all the fundraising doom and gloom,\" says Caroline Lewis, managing partner at early-stage venture firm Nura Ventures, \"the rules are being rewritten.\" \"You can go back to business fundamentals of building a product that customers want to buy, then you can raise some capital and get some decent traction, and don't necessarily have to be beholden to the traditional venture train,\" Lewis says. For some founders, hopping off the venture capital treadmill allows them to build at the speed they want. Seed-strapping isn't new. Software company Zapier seed-strapped before the term was in the zeitgeist, raising just $1.3 million s", "date_str": "2026-10-05T08:07:01+00:00", "hash": "26e370d5994b707b", "title_fa": "داغ ترین منبع مالی بنیانگذاران سیلیکون ولی: بانک بهترین دوستان", "summary_fa": "آی استوک؛ Tyler Le/BI Katherine Naylor Pullman «محل سوم ما» را که یک گروه شبکه‌ای برای زنان در رسانه است، به‌عنوان یک پروژه نیمه‌وقت راه‌اندازی کرد. چهار سال پیش با شام های ماهانه و سپس هفتگی شروع شد. زنان در شیکاگو و لس آنجلس دست دراز کردند و می خواستند شام خود را میزبانی کنند. اکنون، مکان سوم ما در 40 شهر است، و اجرای آن به یک کنسرت تمام وقت برای نیلور پولمن، که شغل قبلی خود را در شراکت با برندها ترک کرده بود، شکوفا شده است. رتبه سوم ما بدون سرمایه گذاران بزرگ به 1800 عضو افزایش یافته است و این به دلیل طراحی است. نیلور پولمن می‌گوید: «اگر کسی میلیون‌ها دلار به ما بدهد، میلیون‌ها عضو می‌خواهد». من قویاً معتقدم که شما نمی‌توانید جامعه را میلیون‌ها نفر افزایش دهید.» او و مدیرعامل شرکت، اشلی پرینینگر، در حال ساختن با تسمه‌بندی بذر هستند، تاکتیکی که در آن شرکت‌ها سرمایه‌گذاری‌های کوچک‌تری را جمع‌آوری می‌کنند و از چرخه سنتی سرمایه‌گذاری سرمایه‌گذاری سری A و سری B چشم‌پوشی می‌کنند و سپس شرکت را از طریق درآمد رشد می‌دهند. آن‌ها اکنون از خانواده، دوستان و اعضا پول جمع‌آوری می‌کنند، زیرا می‌توانند در فضای جمع‌آوری سرمایه کوچک‌تر کار کنند و وقتی شرکت متعهد به بازده سرمایه‌گذاران بزرگ نباشد، هزینه‌های اعضا را پایین‌تر نگه دارند. پرینینگر می‌گوید: «ما در واقع احساس نمی‌کنیم که برای انجام کارهایی که باید انجام دهیم نیازی به هجوم پول نقد داریم. پس از رونق دهه 2010 و پایان سیاست نرخ بهره صفر، سرمایه‌گذاری خطرپذیر برای بنیان‌گذاران جذاب‌تر شده است. این تغییر همچنین در بحبوحه ظهور استارت‌آپ تک‌نفره رخ می‌دهد، زیرا بنیان‌گذاران بیشتری عوامل هوش مصنوعی را برای کمک به کدنویسی، حسابداری، بازاریابی و سایر وظایفی که زمانی به نیروی کار گران نیاز داشتند، مستقر می‌کنند. بنیانگذارانی که برای این داستان با من صحبت کردند به من می گویند"}, {"source": "Business Insider", "title": "50 October Prime Day deals we're stuffing in our baskets right now", "link": "https://www.businessinsider.com/guides/deals/prime-day-deals-2026-10-5", "summary": "When you buy through our links, Business Insider may earn an affiliate commission. Learn more Gritin, Business Insider, Crockpot The October Prime Day deals event is upon us once again, just a few short months since the big summer sale. While many early offers won't require Prime membership, once the Prime Big Deal Days sale begins officially on Tuesday, you'll find most deals are members-only. You can
