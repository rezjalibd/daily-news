r of your bedroom or a full-on garage-based weightlifting paradise. I'll start with space- and budget-friendly items, then move on to some bigger-ticket buys. Kettlebells If I had to put together a home gym from scratch, I think I would start with two kettlebells: one light enough to strict press or snatch, and one heavy enough to make swings and goblet squats challenging . For a beginner, that might be a 25-pound kettlebell and a 50-pound kettlebell ; if you're stronger, obviously go heavier. The basic cast iron type is usually cheapest, while the colorful competition style kettlebells feel a bit nicer. By the way, I have a guide here to buying your first (or next) kettlebell. If I had a smidge of extra cash, I d buy them as adjustable kettlebells , like these here , so they could get heavier as I got stronger. Competition-style adjustables are by far the best kind , since they keep the same smooth shape no matter what weight you load them to. This lets you do cleans, presses, and snatches, rather than limiting you to swings. Adjustable Kettlebell Set Bells of Steel - Steel Shell 35mm Handle Home $199.99 at Amazon $209.99 Save $10.00 Shop Now Shop Now $199.99 at Amazon $209.99 Save $10.00 Dumbbells After securing your adjustable kettlebell, I'd move on to adjustable dumbbells. Dumbbells are a great way to lift weights at home. They re smaller than a barbell, less specialized than a set of kettlebells, and you can do a ton of different workouts with them. As with kettlebells, you ll need to decide if you want to get a few pairs at specific fixed weights (cheaper to start) or go for a pricier adjustable set. Rubber hex dumbbells are the best bet if you want a selection of dumbbells you can just grab and use without adjusting. But if space is at a premium, be sure to check out this adjustable dumbbell roundup . (You'd be hard-pressed to find a \"best home dumbbells\" list without these PowerBlocks near the top. The futuristic cubic design isn't just for show these dumbbells really a", "date_str": "2026-09-17T19:30:00+00:00", "hash": "f9af33d07a145b2f", "title_fa": "14 چیزی که هر باشگاه خانگی به آن نیاز دارد", "summary_fa": "ممکن است از پیوندهای موجود در این صفحه کمیسیون دریافت کنیم. یک بازی کوچک وجود دارد که من دوست دارم گاهی اوقات آن را انجام دهم، و به نظر می رسد که در بین افرادی که تمایل دارند در خانه ورزش کنند محبوب است: اگر یک باشگاه ورزشی خانگی جدید را از ابتدا شروع کنم، چه تجهیزاتی را می خریدم؟ شما همچنین می توانید نسخه پیشرفته را بازی کنید: اگر از قبل دارید (اقلام رایج را در اینجا وارد کنید)، بعداً چه چیزی می خرید؟ آنچه در ادامه می‌آید، انتخاب‌های من برای هر کسی است که یک باشگاه ورزشی جدید در خانه راه‌اندازی می‌کند یا به دنبال گسترش باشگاهی است که دارد، چه به معنای گوشه‌ای از اتاق خواب شما باشد یا یک بهشت ​​وزنه‌برداری با گاراژ کامل. من با اقلام مقرون به صرفه و مناسب شروع می کنم، سپس به خرید بلیط های بزرگتر می پردازم. کتل بلز اگر بخواهم یک باشگاه ورزشی خانگی را از ابتدا بسازم، فکر می‌کنم با دو کتل بل شروع می‌کردم: یکی به اندازه کافی سبک برای فشار دادن یا قاپ کردن سخت، و دیگری به اندازه‌ای سنگین که تاب خوردن و چمباتمه زدن با جام را چالش‌برانگیز کند. برای یک مبتدی، ممکن است یک کتل بل 25 پوندی و یک کتل بل 50 پوندی باشد. اگر قوی تر هستید، واضح است که سنگین تر شوید. نوع اصلی چدن معمولاً ارزان‌ترین است، در حالی که کتل بل‌های رنگارنگ سبک رقابتی کمی زیباتر هستند. به هر حال، من در اینجا راهنمای خرید اولین (یا بعدی) کتل بل شما را دارم. اگر مقداری پول نقد اضافی داشتم، آنها را به عنوان کتل بل های قابل تنظیم می خرم، مانند این اینجا، تا با قوی تر شدن من، سنگین تر شوند. قابل تنظیم های سبک رقابتی تا حد زیادی بهترین نوع هستند، زیرا بدون توجه به وزنی"}, {"source": "Lifehacker", "title": "What You Need to Know About Walmart's 'Fall Deals' Sale", "link": "https://lifehacker.com/walmart-fall-deals-sale-announcement-october-2026?utm_medium=RSS", "summary": "We may earn a commission from links on this page. Deal pricing and availability subject to change after time of publication. Amazon's Prime Big Deal Days promotion think of it as October Prime Day is typically one of the biggest sales of the fall, and every year, it prompts other retailers to follow suit with their own discounts and promotions including Walmart. After Amazon announced the date for its sale next month, Walmart started the clock for its own Prime Day-esque sale (there is literally a countdown on its homepage). The promotion is simply called \"Fall Deals, and there's some good news for those of you who balk at the idea of paying for a membership to take advantage of a sale it's free to everyone. What is Walmart Fall Deals? Walmart Fall Deals is the answer to Amazon's October Prime Day sales, officially known as Prime Big Deal Days. It is both an in-store and online sale with deals on most things that Walmart sells (food being arguably the biggest omission). The sale happens every year around spring, summer, fall, and winter, revolving around Prime Day sales. When is Walmart Fall Deals? Walmart Fall Deals kicks off at midnight ET on Oct. 5 and runs through Oct. 11. For Walmart+ members, there is usually a pre-sale period where they can get deals before everyone else (last year it was five hours long). Do you need to be a Walmart+ member to shop during Walmart Deals? No. But if you are a Walmart+ member, you'll get early access to the sale. There is no official announcement from Walmart on when that will be this year, and I will update this article once it's announced. You can sign up for a free 30-day Walmart+ subscription or get the annual plan for $98 ($8.17/month). What deals to expect for Walmart Fall Deals While there has been no official announcement from Walmart, we have a pretty good idea of what to expect from the Fall Deals sale based on previous years and what is currently on the home page of the Walmart website. There are likely to be sales in many different categories, including deals on electronics, home, toys, travel, and more. Here is what the landing page tells us right now: Up to 30% off toys Up to 50% off home Up to 40% off \"home upgrades\" Up to 25% off tools Up to 30% off Halloween deals, from candy to decor Up to 40% off tech Up to 25% off wellness deals What other sales are competing with Walmart's Fall Deals? You can always expect major retailers to have their own competitive sales around Amazon's October Prime Day . So f", "date_str": "2026-09-17T19:00:00+00:00", "hash": "194495b127699264", "title_fa": "آنچه شما باید در مورد فروش \"تخفیف های پاییزی\" Walmart بدانید", "summary_fa": "افزودن به عنوان منبع برگزیده در Google افزودن به عنوان منبع برگزیده در Google ممکن است از پیوندهای موجود در این صفحه کمیسیون دریافت کنیم. قیمت قرارداد و در دسترس بودن ممکن است پس از زمان انتشار تغییر کند. اعتبار: عکس از کوین کارتر/ گتی ایماژها فهرست مطالب تبلیغات پرمخاطب آمازون در روزهای معاملات بزرگ، به آن فکر کنید که روز اول اکتبر معمولاً یکی از بزرگترین فروش‌های پاییز است و هر سال، سایر خرده‌فروشان را وادار می‌کند تا با تخفیف‌ها و تبلیغات خود از جمله والمارت، از آن پیروی کنند. پس از اینکه آمازون تاریخ فروش خود را در ماه آینده اعلام کرد، والمارت ساعت را برای فروش خود به سبک Prime Day آغاز کرد (به معنای واقعی کلمه یک شمارش معکوس در صفحه اصلی آن وجود دارد). این تبلیغ به سادگی \"تخفیفات پاییزی\" نامیده می شود، و برای کسانی از شما که از پرداخت هزینه عضویت برای استفاده از مزایای فروش رایگان برای همه خودداری می کنند، خبرهای خوبی وجود دارد. تخفیف های پاییزی والمارت پاسخی به فروش روز اول اکتبر آمازون است که رسما به عنوان روزهای معاملات بزرگ پرایم شناخته می شود. این هم یک فروش درون فروشگاهی و هم فروش آنلاین با معاملات بیشتر چیزهایی است که والمارت می فروشد (غذا مسلما بزرگترین حذف است). این فروش هر سال در حوالی بهار، تابستان، پاییز و زمستان اتفاق می‌افتد و حول محور فروش روز پرایم می‌چرخد. تخفیف‌های پاییزی Walmart در نیمه‌شب ET در 5 اکتبر آغاز می‌شود و تا 11 اکتبر ادامه دارد. برای اعضای Walmart+، معمولاً یک دوره پیش‌فروش وجود دارد که در آن می‌توانند معاملات را قبل از دیگران دریافت کنند (سال گذشته پنج ساعت طول کشید). در حالی که هیچ اعلامیه رسمی از سوی Walmart وجود ندارد، ما ایده بسیار خوبی داریم که بر اساس سال های گذشته و آنچه در حال حاضر"}, {"source": "Lifehacker", "title": "Seven Things That Surprised Me About Apple's New Health App", "link": "https://lifehacker.com/health/things-that-surprised-me-about-apples-new-health-app?utm_medium=RSS", "summary": "We may earn a commission from links on this page. Apple is revamping its Health app, which I've previously written is a huge deal. Most wearables come with dashboards to help you understand your data and advice on what to do about it, but Apple hasn't provided anything like that for the Apple Watch or for the data it collects from other devices or apps you might use. The Health app has always contained a wealth of information and well-hidden power tools , so it's nice that the app is finally getting a better interface to make it easier to actually use. I installed a beta version, and here's what I'm learning. Apple Watch Series 12 (GPS, 42mm) $399.00 at Amazon Get Deal Get Deal $399.00 at Amazon Apple's Health app doesn t come with iOS 27 or with the new Apple Watches I was using the public beta for iOS 27 and didn t have the new Health app. Then iOS 27 officially came out, I updated, and I still didn t have the new Health app. That was a disappointment it turns out the update is coming later this year. Fortunately, there is a way I was able to get it. It s in the Developer Beta of iOS 27.2. To get access to that, you have to sign up as a developer , which is free. (There is a higher tier of developer membership that costs $99, but the free registration is all you need to download developer betas.) Once you re signed up, go to Settings on your phone, then General , Software Updates , and then tap Beta Updates to get the options for public and developer betas. Step count is at the top of the screen on the Health app Apple announced that the Series 12 and Ultra 4 watches will be getting step counts on watch face complications and in the Smart Stack. Unfortunately, WatchOS 27 does not bring step counts to older Apple Watches. But the Health app has its little insights cards at the top of the home screen, and right on the Fitness one, I can see my step count for the day. You can see your Fitness rings from the Health app Credit: Beth Skwarecki \"Closing your rings\" is an Apple Watch-based thing: Do enough activity throughout the day, and you'll complete each of three counters, represented as rings. Until now, those rings were only viewable from the Watch or from the Fitness app. But the new Health app has a card for your rings right at the top of the screen (the same card as your step count), and when you tap on it, you'll see your rings and their status. The Fitness app is still available and seems to give the same information it always did, so it seems rings ", "date_str": "2026-09-17T17:30:40+00:00", "hash": "7186773a5757eab0", "title_fa": "هفت موردی که مرا در مورد اپلیکیشن سلامت جدید اپل شگفت زده کرد", "summary_fa": "ممکن است از پیوندهای موجود در این صفحه کمیسیون دریافت کنیم. اپل در حال اصلاح برنامه Health خود است، که قبلاً نوشتم معامله بزرگی است. اکثر ابزارهای پوشیدنی دارای داشبوردهایی هستند که به شما کمک می کنند اطلاعات خود را درک کنید و توصیه هایی در مورد اینکه چه کاری باید انجام دهید، اما اپل چیزی شبیه به آن را برای Apple Watch یا برای داده هایی که از سایر دستگاه ها یا برنامه هایی که ممکن است استفاده کنید جمع آوری می کند ارائه نکرده است. برنامه Health همیشه حاوی اطلاعات زیادی و ابزارهای برقی به خوبی پنهان بوده است، بنابراین خوب است که این برنامه در نهایت رابط بهتری برای سهولت استفاده از آن به دست آورد. من یک نسخه بتا را نصب کردم و این چیزی است که در حال یادگیری هستم. Apple Watch Series 12 (GPS, 42mm) 399.00 دلار در آمازون دریافت معامله دریافت معامله 399.00 دلار در آمازون برنامه Health اپل با iOS 27 یا با اپل واچ های جدید که من از نسخه بتا عمومی برای iOS 27 استفاده می کردم و برنامه جدید Health را نداشتم ارائه نمی شود. سپس iOS 27 رسما منتشر شد، من آپدیت کردم و هنوز برنامه جدید Health را نداشتم. این ناامید کننده بود، به نظر می رسد که به روز رسانی اواخر امسال ارائه می شود. خوشبختانه راهی وجود دارد که توانستم آن را بدست بیاورم. در نسخه بتای توسعه دهنده iOS 27.2 قرار دارد. برای دسترسی به آن، باید به عنوان یک توسعه دهنده ثبت نام کنید که رایگان است. (سطح بالاتری از عضویت برنامه نویس وجود دارد که هزینه آن 99 دلار است، اما ثبت نام رایگان تنها چیزی است که برای دانلود نسخه های بتا توسعه دهنده نیاز دارید.) پس از ثبت نام، به تنظیمات گوشی خود بروید، سپس به بخش عمومی، به روز"}, {"source": "Lifehacker", "title": "If You Loved 'Friends,' There's One Movie You Need to Watch Now", "link": "https://lifehacker.com/entertainment/one-movie-like-friends?utm_medium=RSS", "summary": "We may earn a commission from links on this page. Friends wasn't just the quintessential '90s sitcom; it remains one of the most popular TV shows of all time, even as it has evolved into a hermetically sealed vision of the Before Times (before 9/11, before smartphones, before it was considered weird to just show up at your friend's house unannounced). Not every aspect of the show has aged well, but the sharp writing and stellar comic timing of its talented cast are what keep it at the top of people s comfort-watch lists. If you re looking for a movie that also celebrates friendship, being young in a big city, and navigating the brackish waters of singlehood, forget the 1990s look no further than 2024 s Players . Like Friends, 2024's Players is a fun riff on young adults finding love in the city Led by an effervescent Gina Rodriguez, Players is a modern riff on a group of bright young things making their way in New York City. Rodriguez plays Mack, a sports writer who approaches hookups like a sweet science, developing plays for herself and her friends designed to break ice and engineer meet-cutes. Just like on Friends , Mack s life is balanced and sustained by her support group best friends Adam (Damon Wayans Jr.), Brannagan (Augustus Prew), and Little (Joel Courtney). The four of them have the same sibling energy as the gang on Friends , especially in the early seasons, before the characters all began incestuously dating one another. Naturally, romantic shenanigans ensue Mack longs for a serious relationship, and when a new reporter, Nick (Tom Ellis), joins her paper, she targets him with the same laser focus that Rachel (Jennifer Aniston) used on Joshua (Tate Donovan) in season four. She recruits her buddies to help her run one of her plays on him, and things go hilariously awry. And yep, just like Ross and Rachel, there s a slow-burn realization that maybe everything Mack is looking for was already right there in front of her. Players offers a lot of the same pleasures as the show: A breezy storyline, sharp jokes, and well-sketched characters you can root for, with a Big City setting and a narrative that captures the particular energy of being young, single, and totally reliant on a small group of close friends who would walk through fire for you (or, in this case, Scooby Doo a romantic longing for you). If you ve been looking for the one with a movie that feels like Friends , this is The One. You can stream Players on Netflix . Players (2024) at Netflix", "date_str": "2026-09-17T17:00:00+00:00", "hash": "97ec7936e0c5c80d", "title_fa": "اگر «دوستان» را دوست داشتید، یک فیلم وجود دارد که باید اکنون تماشا کنید", "summary_fa": "ممکن است از پیوندهای موجود در این صفحه کمیسیون دریافت کنیم. Friends فقط کمپین اصلی دهه 90 نبود. این یکی از محبوب‌ترین برنامه‌های تلویزیونی در تمام دوران باقی می‌ماند، حتی زمانی که به یک چشم‌انداز محرمانه از قبل از زمان تبدیل شده است (قبل از 11 سپتامبر، قبل از گوشی‌های هوشمند، قبل از اینکه ظاهر شدن بدون اعلام قبلی در خانه دوستتان عجیب تلقی شود). همه جنبه‌های سریال به خوبی پیر نشده‌اند، اما نوشتن تند و زمان‌بندی کمیک خیره‌کننده بازیگران بااستعداد آن چیزی است که آن را در صدر فهرست تماشای راحت مردم نگه می‌دارد. اگر به دنبال فیلمی هستید که دوستی، جوان بودن در یک شهر بزرگ و پیمایش در آب‌های شور دوران مجردی را نیز تجلیل کند، دهه 1990 را فراموش کنید و به بازیکنان 2024 نگاه نکنید. مانند دوستان، Players 2024 یک ریف سرگرم‌کننده برای بزرگسالان جوانی است که در شهر عشق پیدا می‌کنند، به رهبری جینا رودریگز جوشان، Players یک ریف مدرن بر روی گروهی از چیزهای جوان باهوش است که در شهر نیویورک راه پیدا می‌کنند. رودریگز نقش مک، یک نویسنده ورزشی را بازی می‌کند که مانند یک علم شیرین به پیوندها نزدیک می‌شود و نمایشنامه‌هایی را برای خودش و دوستانش طراحی می‌کند که برای شکستن یخ‌ها و مهندسی ملاقات‌های ناز طراحی شده‌اند. درست مانند فیلم دوستان، زندگی مک توسط بهترین دوستان گروه حامی او، آدام (دیمون وینز جونیور)، براناگان (آگوستوس پریو) و لیتل (جوئل کورتنی) متعادل و پایدار است. این چهار نفر از همان انرژی خواهر و برادری با گروه Friends برخوردارند، مخصوصاً در فصول اولیه، قبل از اینکه همه شخصیت ها شروع به معاشرت محارم با یکدیگر کنند. به طور طبیعی، جنجال‌های عاشقانه باعث می‌شود که مک آرزوی یک رابطه جدی را به دنبال داشته باشد، و وقتی یک خبرنگار جدید به نام نیک (تام الیس)، به مقاله او می‌پیوندد، او را با"}],
      media: [{"source": "Billboard", "title": "William Shatner Talks Going Metal for Riot Fest & His Unusual Interpretation of Metallica’s ‘Enter Sandman’", "link": "https://www.billboard.com/music/rock/william-shatner-heavy-metal-riot-fest-1236342909/", "summary": "William Shatner’s list of lifetime accomplishments is very long. Yes, there is his acting career. He is also an entertaining guest speaker, as he proved again on Aug. 9 at the annual Star Trek convention in Las Vegas, engaging enthralled fans for over an hour. Lately, he s been working on his 13th album, continuing a discography that stretches back to his 1968 debut, The Transformed Man . This weekend, he adds another item to his résumé, with performances at Riot Fest, Chicago’s annual music festival with an emphasis on punk rock. The legendary entertainer will preview six songs from his forthcoming album, What the F Is Heavy Metal? Shatner and his band the *uckers join a roster that includes Iggy Pop, Social Distortion, Patti Smith, Elvis Costello, Tool, Morrissey, Bad Religion and Alanis Morissette. It may sound like Shatner is doing this as a joke, but he assures Billboard that he is not. After Shatner recorded albums of blues, progressive rock, country, Americana and Christmas songs, Brian Perera founder of Shatner’s label home Cleopatra suggested he tackle heavy metal. “I said, ‘What the f k is heavy metal?’ and that’s the title of the album: What the F Is Heavy Metal? ” Shatner explains. “Then I began to discover what the f k is heavy metal. I’ve been preparing for two months now, on a scratch track on my phone doing the entrances and exits, which is only visible to a trained musician. Only by counting down do you know where to come in on heavy metal because it all sounds alike. Yesterday I had my first rehearsal with the *uckers and it’s working and it’s going to be fantastic. It’s going to be extraordinary.” Shatner will perform six songs from the album at Riot Fest – three originals written by Shatner and his longtime writing partner Rob Sharenow, and three covers, including Metallica’s “Enter Sandman.” Music tracks for the album have already been recorded, and Shatner will go into the studio sometime this winter to lay down his vocals. “We’ve got 50 musicians on a heavy metal album. It’s a happening that nobody could have thought of six months ago and after that rehearsal yesterday and the ensuing fervor of everybody there, it’s as good as we think it is. It may even be better.” Speaking to Billboard just before going to his second rehearsal with the *uckers, the 95-year-old declares, “I’m so enlivened. I’m so filled with passion. I’ve come to understand what heavy metal is. It’s an energy that permeates your body and lifts you up. Heavy metal is", "date_str": "2026-09-18T14:29:04+00:00", "hash": "2f5f45670e9cb77f", "title_fa": "ویلیام شاتنر برای ریوت فست و تفسیر غیرمعمول او از «Enter Sandman» متالیکا صحبت می کند.", "summary_fa": "فهرست دستاوردهای زندگی ویلیام شاتنر بسیار طولانی است. بله، حرفه بازیگری او وجود دارد. او همچنین یک سخنران مهمان سرگرم کننده است، همانطور که در 9 آگوست در کنوانسیون سالانه پیشتازان فضا در لاس وگاس دوباره ثابت کرد و طرفداران را برای بیش از یک ساعت درگیر خود کرد. اخیراً، او در حال کار بر روی سیزدهمین آلبوم خود بوده و دیسکوگرافی را ادامه می دهد که به اولین آلبوم او در سال 1968، The Transformed Man باز می گردد. این آخر هفته، او مورد دیگری را به رزومه خود اضافه می کند، با اجرا در Riot Fest، جشنواره موسیقی سالانه شیکاگو با تاکید بر پانک راک. این سرگرم کننده افسانه ای شش آهنگ از آلبوم آینده خود، What the F Is Heavy Metal را پیش نمایش خواهد کرد؟ شاتنر و گروهش *uckers به ​​فهرستی می‌پیوندند که شامل ایگی پاپ، سوشال دیستورشن، پتی اسمیت، الویس کاستلو، تول، موریسی، دین بد و آلانیس موریست می‌شود. شاید به نظر برسد که شاتنر این کار را به شوخی انجام می دهد، اما او به بیلبورد اطمینان می دهد که اینطور نیست. پس از اینکه شاتنر آلبوم‌های بلوز، پراگرسیو راک، کانتری، آمریکاییانا و آهنگ‌های کریسمس را ضبط کرد، برایان پررا، بنیان‌گذار کمپانی شاتنر، کلئوپاترا، به او پیشنهاد کرد که با هوی متال مقابله کند. شتنر توضیح می‌دهد: «گفتم، «ف کی هوی متال چیست؟» و این عنوان آلبوم است: «اف هوی متال چیست؟» «سپس شروع کردم به کشف اینکه f k هوی متال چیست. من الان دو ماهه که دارم آماده میشم، روی یک آهنگ اسکرچ روی گوشیم که مسیرهای ورودی و خروجی رو انجام میده، که فقط برای یک نوازنده آموزش دیده قابل دیدنه. فقط با شمارش معکوس می‌دانید که در هوی متال کجا باید وارد شوید، زیرا همه آنها شبیه هم هستند. دیروز اولین تمرینم را با *uckers داشتم و کار می کند"}, {"source": "Billboard", "title": "After Threatening to ‘Retire’ The Weeknd Persona, Abel Tesfaye Hits Reverse and Says He’s ‘Not Stepping Away From Anything’", "link": "https://www.billboard.com/music/rb-hip-hop/the-weeknd-not-stepping-away-from-anything-reverse-retirement-1236343278/", "summary": "The Weeknd freaked out some of his longtime fans last year when he told Variety magazine that after 16 years inhabiting his stage persona, the man born Abel Tesfaye was ready to move on to his next era and retire the character . Well, after explaining at the time that it never ends until you end it, now he s doubling-down on not ending it. Tesfaye, 36, who has been releasing music as The Weeknd since 2011, told a crowd in Stockholm last month that he d had a change of heart. “ I’ll never disappear. I love this too much to ever disappear . I tested retirement a little bit, and I don’t like the way it feels. I said, Imma be here forever with you, I’ll never disappear,” he said, according to fan video of the statement. Now, in a new interview with GQ Hong Kong , Tesfaye has clarified those comments and explained his strike-that-reverse-it stance. Disappearing simply means finally taking some time to focus all my energy on one project instead of juggling multiple things, he told the magazine. This past five years for me has been creating four concept albums, countless music videos, a TV show, a feature film, and I’m still out here on a massive world tour spanning years. I think disappearing for a little while is well earned. And, if that wasn t clear enough, he added, I’m not stepping away from anything. I’m just hibernating. I’m not going anywhere. My fans know I’ve shed my skin multiple times throughout my career. I was telling one story from 2020 until now, and that story has reached its conclusion. But that’s only the 2020 story. Given his list of accomplishments over the past decade, Abel was asked what he might pursue after the Weeknd is actually fully retired. I can’t even put into words the amount of inspiration I’ve felt over the last year. I can’t contain it. At one point I thought, ‘What if I just stopped?’ But then I realized what a waste all of that inspiration would be, he said. I can’t let that happen. I had a glimpse of what retirement looks like, and it isn’t for me. It’s a real privilege to do what I do. There’s nothing else like this job. The gratitude I’ve felt over the last year has been overwhelming. I’m going to keep doing this for as long as I possibly can. The Weeknd isn’t going anywhere. The singer completed a sold-out two-night run of gigs in Lisbon, Portugal two weeks ago and is gearing up to take the ongoing After Hours til Dawn tour to Asia with a pair of shows at Belluna Dome in Tokorozawa, Japan on Saturday (Sept. 19) and Sunday", "date_str": "2026-09-18T13:13:46+00:00", "hash": "93cb3c4653895077", "title_fa": "آبل تسفایه پس از تهدید به \"بازنشستگی\" شخصیت Weeknd، برعکس می زند و می گوید که \"از هیچ چیز دور نمی شود\"", "summary_fa": "The Weeknd سال گذشته هنگامی که به مجله Variety گفت که پس از 16 سال زندگی در شخصیت صحنه خود، مردی که متولد Abel Tesfaye بود، برخی از طرفداران دیرینه خود را وحشت زده کرد و آماده است به دوره بعدی خود برود و این شخصیت را بازنشسته کند. خوب، بعد از اینکه در آن زمان توضیح داد که تا زمانی که شما آن را تمام نکنید، هرگز تمام نمی شود، اکنون او در حال پایان ندادن آن است. تسفایه، 36 ساله، که از سال 2011 موسیقی را به عنوان The Weeknd منتشر کرده است، ماه گذشته در جمع جمعیتی در استکهلم گفت که نظرش تغییر کرده است. او گفت: \"من هرگز ناپدید نخواهم شد. من این را آنقدر دوست دارم که هرگز ناپدید نمی شوم. من بازنشستگی را کمی آزمایش کردم، و از احساسش خوشم نمی آید. گفتم: برای همیشه با تو خواهم بود، من هرگز ناپدید نخواهم شد.\" اکنون، تسفایه در یک مصاحبه جدید با GQ هنگ کنگ، این اظهارات را روشن کرده و موضع خود را برای ضربه زدن به آن توضیح داده است. او به مجله گفت که ناپدید شدن به سادگی به این معنی است که بالاخره کمی وقت بگذارم تا تمام انرژی خود را به جای دستکاری چند چیز روی یک پروژه متمرکز کنم. این پنج سال گذشته برای من چهار آلبوم مفهومی، موزیک ویدیوهای بی‌شماری، یک برنامه تلویزیونی، یک فیلم بلند خلق کرده‌ام، و من هنوز در یک تور جهانی عظیم که سال‌ها را در بر می‌گیرد، اینجا هستم. من فکر می کنم ناپدید شدن برای مدت کوتاهی درآمد خوبی دارد. و اگر این به اندازه کافی روشن نبود، او اضافه کرد، من از هیچ چیزی دور نمی شوم. من فقط در خواب زمستانی هستم من جایی نمی روم طرفداران من می‌دانند که من در طول دوران حرفه‌ای‌ام چندین بار پوستم را ریخته‌ام."}, {"source": "Billboard", "title": "MNEK Is Betting on Himself With ‘Bulldozer!!’: ‘An Album That Only I Can Make’", "link": "https://www.billboard.com/music/features/mnek-bulldozer-album-interview-zara-larsson-1236335152/", "summary": "There’s seemingly no end to MNEK ’s drive or creative reserves; over the past decade, the London singer, songwriter and producer’s fingerprints have been everywhere in modern pop and R B, even when his name hasn’t. The 31-year-old’s dedicated ‘Written By’ playlist on Spotify paints the picture of a studio auteur who has built a career around extreme multifacetedness: He’s penned tracks for cultural behemoths Beyoncé (“Hold Up”) and BTS (“Paradise”), as well as U.K. No. 1 hits for Dua Lipa (“IDGAF”) and Little Mix (“Sweet Melody”). Related MNEK Made One of the Year s Most Ambitious Pop Albums Why Aren t People Paying Attention? Miley Cyrus Says Dolly Parton Helped Her Have a Persona Still Be Who You Are : Dolly Was Just Always Right Here s the Full Tracklist for Dexter and the Moonrocks New Album Known for his abrasive-yet-glossy futurism equally as much as his ear for house-pop heaters, there have been co-writes with Madonna and a wealth of British dance supernovas (Becky Hill, Joel Corry). More recently, he helped revitalize close collaborator Zara Larsson’s career with his work on the singer’s celestial slow-burn mega-hit “Midnight Sun” and her verse on the remix of PinkPantheress’ “Stateside,” which reached No. 1 on the Billboard Global 200 in March. MNEK was just 14 when a set of vibrant, self-produced MySpace demos landed him his first publishing deal in 2009. Since then, he’s rarely been far from the centre of the pop cosmos; with his sophomore LP, Bulldozer!! , released this September, he turns that decade-plus of experience back on himself. The follow-up to 2018’s Language , the album takes in the invincible highs and lonely comedowns of partying, body image, the Wild West of dating apps and his conflicted relationship with the U.S. It’s a portrait of a life lived both inside and adjacent to the industry, sticking proudly to a dancefloor-based mood with decadent tropical flourishes and skittering tempo switch-ups. “I feel like there is no limit to where my music could go,” MNEK tells Billboard U.K. , speaking over a video call from his home studio. “I can only worry about what my music makes me feel, and what the emotion I want people to feel is when they hear my music, whether that be happy and euphoric or sassy and confident.” That freedom feels pertinent this time around. Language fell considerably short of commercial expectations, missing the Billboard 200 entirely and also failing to make a dent in the U.K. top 40. MNEK responded to the news w", "date_str": "2026-09-18T13:07:19+00:00", "hash": "70b13efd7251d646", "title_fa": "MNEK با \"بولدوزر!!\" روی خودش شرط بندی می کند: \"آلبومی که فقط من می توانم بسازم\"", "summary_fa": "به ظاهر هیچ پایانی برای انگیزه یا ذخایر خلاق MNEK وجود ندارد. در طول دهه گذشته، اثر انگشت خواننده، ترانه سرا و تهیه‌کننده لندنی همه جا در پاپ مدرن و RB وجود داشته است، حتی اگر نام او وجود نداشته باشد. لیست پخش اختصاصی «Written By» این مرد 31 ساله در Spotify تصویر یک نویسنده استودیویی را نشان می‌دهد که حرفه‌ای را حول چند وجهی شدید ساخته است: او آهنگ‌هایی را برای غول‌های فرهنگی بیانسه («Hold Up») و BTS («Paradise») و همچنین برای اولین بار در بریتانیا نوشته است. 1 بازدید برای Dua Lipa (\"IDGAF\") و Little Mix (\"Sweet Melody\"). MNEK مرتبط یکی از جاه طلبانه ترین آلبوم های پاپ سال شد چرا مردم توجه نمی کنند؟ مایلی سایرس می‌گوید دالی پارتون به او کمک کرد تا شخصیتی داشته باشد که هنوز همان کسی باشد که هستی: دالی همیشه درست بود در اینجا لیست کامل آهنگ‌های آلبوم جدید دکستر و مون‌راکس است که به خاطر آینده‌نگاری ساینده و در عین حال براقش به همان اندازه که گوشش برای بخاری‌های هاوس پاپ بریتانیایی و هیترهای جنون‌آمیز بریتانیایی شناخته شده است. (بکی هیل، جوئل کوری). اخیراً، او به احیای کار زارا لارسون، همکار نزدیکش، با کارش بر روی آهنگ مگا آهنگ آهسته آسمانی این خواننده \"Midnight Sun\" و شعر او در ریمیکس \"Stateside\" از PinkPantherss که در ماه مارس به رتبه 1 بیلبورد جهانی 200 رسید، کمک کرد. MNEK تنها 14 سال داشت که مجموعه‌ای از دموهای پر جنب و جوش و تولید خود MySpace اولین قرارداد انتشاراتش را در سال 2009 برای او رقم زد. با LP سال دومش، بولدوزر!! او که در سپتامبر امسال منتشر شد، تجربه بیش از یک دهه را به خودش برگرداند. در ادامه آلبوم 2018 Language، این آلبوم در اوج‌های شکست‌ناپذیر و نزول‌های تنهایی مهمانی‌ها، تصویر بدن، غرب وحشی اپلیکیشن‌های دوستیابی و رابطه متناقض او با"}, {"source": "Billboard", "title": "CoComelon Puts a ‘Peaceful’ Spin on ‘Farmer in the Dell’ & More Nursery Rhymes for New ‘Lullabies’ Album", "link": "https://www.billboard.com/music/music-news/cocomelon-lullabies-album-farmer-in-the-dell-premiere-1236343027/", "summary": "When families think of CoComelon , they might instantly imagine an upbeat kids song like The Wheels on the Bus which has 9 billion-plus views and counting on YouTube. But for the preschool brand s latest release, they re slowing things down way down to help families with bedtime. CoComelon s new 30-track Nursery Rhyme Lullabies album takes some of the most recognizable kids songs (yes, even Wheels on the Bus ) and turns them into sleepy-time anthems and Billboard Family is exclusively premiering a peaceful new spin on The Farmer in the Dell below. Related CoComelon s New Ode to Sleepy Time Has Baby JJ Flying Through the Clouds Declaring I Love My Bed : Premiere CoComelon: The Movie Brings Baby JJ (And SZA) To the Big Screen: Watch the First Teaser Trailer SZA to Star in Animated CoComelon: The Movie With Nicholas Hoult, Sarah Sherman More Josh Embury, director of music at Moonbug Entertainment, tells Billboard Family that Farmer was one of the more interesting challenges of the project, Because it is naturally such a playful, upbeat song. We wanted to soften it without taking away the melody and repetition that make it so recognizable. It also became one of my favorite transformations. There is something really special about hearing a song associated with movement and play take on this peaceful, comforting quality. Hear the new version below: After all the familiar tunes CoComelon has tackled over the years, Embury said he and the team felt this was an organic next step. Nursery rhymes are often some of the first songs children hear and some of the first songs parents remember sharing with them, Embury tells Billboard Family . Because those melodies are already so familiar, it felt natural to reimagine them for a quieter part of the day. We slowed the tempos and used gentle acoustic instrumentation and warm arrangements to create music that feels calming without losing what children already love about the songs. The team also recognized that bedtime is not always an instant transition from a busy day to sleep, especially with young children, and they re hoping the new project helps quiet down an often-chaotic night. We would love for these songs to become a comforting part of families’ nighttime routines and help them share a quiet moment of connection at the end of the day. The project comes at an exciting time for CoComelon too: September marks the 20th anniversary of the CoComelon YouTube channel . It is both really exciting and a little crazy to think ", "date_str": "2026-09-18T13:00:00+00:00", "hash": "4b3f7a6f8389af47", "title_fa": "کوکاملون یک چرخش صلح‌آمیز بر روی «Farmer in the Dell» و آهنگ‌های بیشتر برای آلبوم جدید «Lullabies» قرار می‌دهد.", "summary_fa": "وقتی خانواده‌ها به CoComelon فکر می‌کنند، ممکن است فوراً یک آهنگ شاد برای کودکان مانند The Wheels on the Bus را تصور کنند که بیش از 9 میلیارد بازدید دارد و در یوتیوب همچنان ادامه دارد. اما برای آخرین نسخه این برند پیش دبستانی، آنها سرعت را کم می کنند تا به خانواده ها در زمان خواب کمک کنند. آلبوم 30 آهنگی جدید کوکاملون Nursery Rhyme Lullabies برخی از شناخته‌شده‌ترین آهنگ‌های کودکانه (بله، حتی Wheels on the Bus) را می‌گیرد و آن‌ها را به سرودهای خواب‌آلود تبدیل می‌کند و Billboard Family به طور انحصاری یک چرخش جدید آرام در The Farmer in the Dell را در زیر به نمایش می‌گذارد. مربوط به قصیده جدید CoComelon برای Sleepy Time Has Baby JJ Flying Through Clouds Declaring I Love My Bed: Premiere CoComelon: The Movie Brings Baby JJ (And SZA) را به پرده بزرگ نمایش می دهد: تماشای اولین تریلر تیزر SZA برای ایفای نقش در انیمیشن انیمیشنی، کارگردانی به نام کوکاملون، سارا کومولون، ساراچولون بیشتر از موسیقی در Moonbug Entertainment، به Billboard Family می‌گوید که Farmer یکی از چالش‌های جالب‌تر این پروژه بود، زیرا طبیعتاً آهنگی شاد و سرزنده است. ما می خواستیم آن را بدون حذف ملودی و تکراری که آن را بسیار قابل تشخیص می کند، نرم کنیم. همچنین به یکی از دگرگونی های مورد علاقه من تبدیل شد. چیزی واقعاً خاص در مورد شنیدن آهنگی وجود دارد که با حرکت و بازی با این کیفیت آرام و آرام همراه است. نسخه جدید را در زیر بشنوید: پس از تمام آهنگ‌های آشنا که CoComelon در طول سال‌ها به آن پرداخته است، Embury گفت که او و تیم احساس می‌کنند که این مرحله بعدی ارگانیک است. Embury به Billboard Family می گوید که قافیه های مهد کودک اغلب از اولین آهنگ هایی هستند که کودکان می شنوند و برخی از"}, {"source": "Billboard", "title": "Tom Cruise Reveals What He and Taylor Swift Really Talked About at Chiefs Game: ‘She Was Schooling Me on Football … She’s a Genius’", "link": "https://www.billboard.com/culture/tv-film/tom-cruise-taylor-swift-schooling-football-genius-tonight-show-1236343270/", "summary": "Taylor Swift has shared the family suite with a lot of fellow celebs since she began attending Kansas City Chiefs games to watch her boyfriend, then fiancé and now husband Travis Kelce. But until this week, she s never sat next to an objectively bigger star than Tom Cruise . When the two were spotted laughing and yucking it up at the Chiefs 2026 season kick-off game earlier this week and the world was dying to know what these two mega A-listers were chatting about. Well, Cruise, 64, stopped by The Tonight Show on Thursday (Sept. 17) to promote his new film, Digger , and, naturally, host Jimmy Fallon had to ask what the unlikely pals were discussing during the Chiefs 31-10 dismantling of the Denver Broncos on Monday Night Football . When the biggest movie star in the world is sitting next to the biggest artist in the world, what do you talk about?” Fallon wondered. “She was schooling me on football, a smiling Cruise responded. For real? Fallon said. For real, Cruise confirmed. “She was bringing the football. First of all, she’s a genius. I’ve been following her since she was a kid, said Cruise of Swift, 36. Everybody there, all their friends, they’re a beautiful couple and magical in their own right. Everybody there in that booth. I hadn’t been to a football game since pre-COVID, where I was working and everything. So to get to hang out there and have that moment, it was a lot of fun … she knows her stuff.” Cruise, who was among the hundreds of celebrity guests at Swift and Kelce s wedding in July at Madison Square Garden in New York, said the singer admitted she knew nothing about football before meeting Kelce, with Cruise relating a story about Taylor asking Travis what it was like playing against older brother retired NFL great Jason Kelce and tackling each other; both men play on the offensive side of the ball, so they would not have had a chance to tackle each other on the field. “She said, ‘You know, he’s so patient,’” laughed Cruise, who attended one of Swift s Eras Tour show in London in 2024. “I said, ‘I’m sure he was.’ I think everybody would be very patient [with her] [Now] she knows … she’s just bringing it. Cruise said he and Swift also talk about music and movies and he praised her great sense of humor. And, not for nothing, box office colossus Cruise dubbed Swift a brilliant writer also, by the way. Brilliant musician and director. Very skilled. Watch Cruise talk Swift on The Tonight Show below.", "date_str": "2026-09-18T12:38:39+00:00", "hash": "d1ddc9e13d29ac57", "title_fa": "تام کروز آشکار می کند که او و تیلور سویفت واقعاً در مورد چه چیزی در بازی Chiefs صحبت کرده اند: \"او به من در مورد فوتبال آموزش می داد ... او یک نابغه است\"", "summary_fa": "تیلور سوئیفت از زمانی که شروع به شرکت در بازی‌های کانزاس سیتی برای تماشای دوست پسر، نامزد و اکنون شوهرش، تراویس کلسه کرد، مجموعه خانوادگی را با بسیاری از افراد مشهور به اشتراک گذاشته است. اما تا این هفته، او هرگز در کنار ستاره‌ای بزرگ‌تر از تام کروز ننشسته است. زمانی که این دو در اوایل این هفته در بازی آغازین فصل Chiefs 2026 در حال خندیدن و خندیدن دیده شدند و دنیا در حال مرگ بود تا بداند این دو مگا لیستر A در مورد چه چیزی چت می‌کنند. خب، کروز 64 ساله، پنجشنبه (17 سپتامبر) برای تبلیغ فیلم جدیدش، Digger، در برنامه The Tonight Show توقف کرد، و طبیعتاً، جیمی فالون مجری برنامه باید بپرسد که دوستان بعید در خلال برچیدن دنور برانکوها در دوشنبه شب فوتبال در مورد چیفز 31-10 صحبت می کردند. وقتی بزرگترین ستاره سینمای جهان در کنار بزرگترین هنرمند جهان نشسته است، در مورد چه چیزی صحبت می کنید؟ فالون تعجب کرد. کروز خندان پاسخ داد: «او به من فوتبال آموزش می‌داد. برای واقعی؟ فالون گفت. در واقع، کروز تایید کرد. کروز سوئیفت، 36 ساله، گفت: \"او داشت فوتبال می آورد. اول از همه، او یک نابغه است. من از کودکی او را دنبال می کردم. همه آنجا، همه دوستانشان، آنها یک زوج زیبا و جادویی هستند. همه در آن غرفه هستند. من از قبل از کووید و همه چیز در یک بازی فوتبال نرفته بودم، جایی که کار می کردم. بنابراین برای اینکه در آنجا بنشینم و آن لحظه را سپری کنم، بسیار سرگرم کننده بود... او چیزهای خود را می داند.\" کروز که در میان صدها مهمان مشهور در مراسم عروسی سوئیفت و کلسه در ماه جولای در مدیسون اسکوئر گاردن در نیویورک حضور داشت، گفت که خواننده اعتراف کرد که قبل از ملاقات با کلسه چیزی از فوتبال نمی‌دانست. کروز داستانی"}, {"source": "Billboard", "title": "Gibson Honors Gustavo Cerati With Ultra-Limited Guitar Available Exclusively at Gibson Garage Miami", "link": "https://www.billboard.com/music/latin/gibson-custom-gustavo-cerati-limited-edition-guitar-es-335-1236342122/", "summary": "Gibson Custom is honoring the late Argentine legend Gustavo Cerati with a meticulously crafted recreation of the iconic guitar that became inseparable from the Latin rock star s artistic identity. Announced exclusively by Billboard Español on Friday (Sept. 18), the Gibson Custom Gustavo Cerati ES-335 is limited to just 60 guitars worldwide. The ultra-limited instrument is available only through Gibson Garage Miami, both in store and by phone, beginning Friday. Inspired by Cerati’s original 1965 ES-335, the instrument accompanied him through some of the defining moments of his career, including Soda Stereo’s landmark 1996 MTV Unplugged performance , the band’s 1997 El Último Concierto farewell tour and its 2007 Me Verás Volver reunion tour. It later became Cerati’s primary guitar during the Bocanada (1999) era and reappeared during his Live Earth performance alongside Shakira in 2007 The Murphy Lab-aged instrument features a 60s Cherry finish, factory double pickguards, Grover kidney button tuning keys, and a B7 Bigsby, according to the press release. It also comes with a custom hardshell case, leather back pad and Certificate of Authenticity. “This rare offering presents collectors, musicians, and fans with a unique opportunity to acquire one of the most culturally significant Gibson Custom instruments ever produced,” states the press release. According to the statement, Cerati purchased the original Gibson ES-335 TD in the mid-1990s at Rudy’s Music in New York. The guitar had already been customized with a second pickguard, leather back pad and Bigsby vibrato. Born in Buenos Aires in 1959, Cerati rose to international prominence as the frontman, guitarist and creative force behind Soda Stereo, the pioneering band that helped define rock en español across the 1980s and ’90s. As a solo artist, he pushed further into electronic, experimental and alternative rock with albums including Bocanada and Ahí Vamos (2007). More than a decade after his death in 2014, Cerati’s influence continues to reverberate across Latin music and beyond. Earlier this year, Billboard named Soda Stereo the No. 1 Latin Rock Band of All Time. Soda is currently on their ECOS tour, where surviving members Charly Alberti and Zeta Bosio are performing live alongside a lifelike digital avatar of their late frontman. Gibson’s tribute marks the first time the guitar maker has formally celebrated the musician’s legacy with an artist instrument. Collectors and fans can purchase the guitar by ca", "date_str": "2026-09-18T12:00:00+00:00", "hash": "be3c2e5043c1a967", "title_fa": "Gibson Honors Gustavo Cerati with Ultra-Limited Guitar به طور انحصاری در Gibson Garage Miami موجود است", "summary_fa": "گیبسون کاستوم از اسطوره فقید آرژانتینی گوستاوو سراتی با بازسازی دقیقی از گیتار نمادین که از هویت هنری ستاره راک لاتین جدایی ناپذیر شد، تجلیل می کند. Gibson Custom Gustavo Cerati ES-335 که به طور انحصاری توسط Billboard Español در روز جمعه (18 سپتامبر) معرفی شد، تنها به 60 گیتار در سراسر جهان محدود شده است. این ابزار بسیار محدود فقط از طریق Gibson Garage Miami در فروشگاه و تلفن از روز جمعه در دسترس است. این ساز با الهام از نسخه اصلی ES-335 سراتی در سال 1965، او را در برخی از لحظات تعیین کننده حرفه اش همراهی کرد، از جمله اجرای برجسته Soda Stereo در سال 1996 MTV Unplugged، تور خداحافظی El Último Concierto در سال 1997 و تور 2007 Voláverun. این ساز بعداً در دوران بوکانادا (1999) به گیتار اصلی سراتی تبدیل شد و در طول اجرای Live Earth او در کنار شکیرا در سال 2007 دوباره ظاهر شد. بر اساس بیانیه مطبوعاتی، ساز متعلق به آزمایشگاه مورفی دارای پوشش گیلاس دهه 60، گاردهای دوتایی کارخانه، کلیدهای تنظیم دکمه کلیه گروور و یک B7 Bigsby است. همچنین با یک قاب سخت پوسته سفارشی، پد پشتی چرمی و گواهی اصالت همراه است. در بیانیه مطبوعاتی آمده است: «این پیشنهاد نادر به مجموعه‌داران، نوازندگان و طرفداران فرصتی منحصربه‌فرد برای به دست آوردن یکی از مهم‌ترین سازهای سفارشی گیبسون از نظر فرهنگی که تاکنون تولید شده است، ارائه می‌کند. بر اساس این بیانیه، سراتی نسخه اصلی Gibson ES-335 TD را در اواسط دهه 1990 در Rudy’s Music در نیویورک خریداری کرد. گیتار قبلاً با گارد دوم، پد چرمی پشتی و ویبراتوی Bigsby سفارشی شده بود. سراتی که در سال 1959 در بوئنوس آیرس به دنیا آمد، به‌عنوان پیشرو، گیتاریست و نیروی خلاق پشت Soda Stereo، گروه پیشگامی که در دهه‌های 1980 و 1990 به تعریف موسیقی راک و اسپانیا کمک"}, {"source": "Billboard", "title": "Miley Cyrus and Fiancé Maxx Morando Are Blissfully Alone in a Beautiful Crowd in Loved-Up ‘Let’s Get Married’ Video: Watch", "link": "https://www.billboard.com/music/pop/miley-cyrus-fiance-maxx-morando-lets-get-married-video-watch-1236343264/", "summary": "Miley Cyrus and fiancé Maxx Morando only have eyes for each other in the loved-up video for the singer s second Bass Persuades single, Let s Get Married. The black-and-white clip filmed by fashion photographer Mert Alas has the feel of blissful home video shot at the coolest party you will never get invited to. The clip for the swoony ballad features the couple lolling in bed and hanging out with a beautiful crew of model-like pals at Los Angeles famed Chateau Marmont hotel at a weekend-long party where clothing is mostly optional, but perfect abs and open minds are a must. Let s go get married tonight/ Let s get married/ I m having visions of white, Miley croons over footage of the singer dancing on the bed in leopard-print underwear while Morando shoots footage of her on an old Super 8 camera. The happy couple, naturally, take occasional breaks to sip champagne, soak in a bubble bath and lasciviously feed each other ice cream amid the barely dressed, hedonistic debauchery. Let s get married/ Let s turn the rest of our lives to a holiday/ Anytime, any place, we can run away/ Get married tonight/ Let s get married, Miley sings dreamily. Let s Get Married is the second single from Cyrus just-released Bass Persuades album and in a post before the clip dropped, she wrote , It’s been less than a year since starting to create this album and now releasing it. Having this record keep up with the way my life moves in real time and still feel so alive is special. Thank you to everyone who made this album what it is. Love you. ❤️ Bass Persuades — credited to the singer s new mononym, Miley — is the follow-up to Cyrus 2024 Something Beautiful album, which debuted at No. 4 on the Billboard 200. Watch the Let s Get Married video below.", "date_str": "2026-09-18T11:44:54+00:00", "hash": "0577215bb17d48c2", "title_fa": "مایلی سایرس و نامزدش مکس موراندو در فیلم Loved-Up \"Let's Get Married\" در یک جمع زیبا تنها هستند با خوشحالی: تماشا کنید", "summary_fa": "مایلی سایرس و نامزدش، مکس موراندو، در ویدیوی محبوب دومین تک آهنگ خواننده Bass Persuades، Let s Get Married، فقط چشم به یکدیگر دارند. کلیپ سیاه و سفیدی که توسط عکاس مد Mert Alas فیلمبرداری شده است، حس یک ویدیوی شاد خانگی را دارد که در جالبترین مهمانی گرفته شده است که هرگز به آن دعوت نخواهید شد. در کلیپ این تصنیف خمیده، این زوج در رختخواب غلت می زنند و با خدمه ای زیبا از دوستان مدل مانند در هتل معروف Chateau Marmont در لس آنجلس در یک مهمانی آخر هفته که پوشیدن لباس اکثرا اختیاری است، اما شکم عالی و داشتن ذهنی باز ضروری است. بیا امشب با هم ازدواج کنیم/ بیا ازدواج کنیم/ من تصویر سفید را می بینم، مایلی از رقص خواننده روی تخت با لباس زیر پلنگی در حالی که موراندو از او با دوربین قدیمی Super 8 فیلم می گیرد، غر می زند. این زوج خوشبخت، طبیعتاً، گاه به گاه استراحت می‌کنند تا شامپاین بنوشند، در حمام حبابی غوطه ور شوند و در میان هرج و مرج لذت‌پرستانه‌ای که به سختی لباس می‌پوشند، به یکدیگر بستنی می‌خورند. بیایید با هم ازدواج کنیم/ بیایید بقیه زندگیمان را به تعطیلات برگردانیم/ هر زمان و هر مکانی، می توانیم فرار کنیم/ امشب ازدواج کنیم/ بیا ازدواج کنیم، مایلی رویایی می خواند. Let s Get Married دومین تک آهنگ از آلبوم تازه منتشر شده توسط کوروش Bass Persuades است و در پستی قبل از انتشار کلیپ، او نوشت: کمتر از یک سال از شروع ساخت این آلبوم و انتشار آن می گذرد. داشتن این رکورد با روشی که زندگی من در زمان واقعی حرکت می کند و هنوز احساس زنده بودن می کنم، خاص است. با تشکر از همه کسانی که این آلبوم را همان چیزی که هست ساختند. دوستت دارم ❤️ Bass Persuades - که به مونونام"}, {"source": "Billboard", "title": "Ella Langley’s ‘Choosin’ Texas’ Notches 14th Week Atop ARIA Chart", "link": "https://www.billboard.com/music/chart-beat/ella-langley-choosin-texas-14th-week-atop-aria-chart-1236343254/", "summary": "Nothing is budging Ella Langley ’s “Choosin’ Texas” (via Sony Music) from the top of the leaderboard on the ARIA Singles Chart , as the country hit collects a 14 th non-consecutive week at No. 1. It’s an impressive streak, although “Choosin’ Texas” will need to reach deep should it close in on some of the all-time champions. Tones And I’s “Dance Monkey” is king of the jungle, with 24 non-consecutive weeks atop the ARIA Singles Chart. “Choosin’ Texas” has gone the distance in the United States , where it scores a 22nd week at No. 1 on the Billboard Hot 100 — tying for the longest reign, equaling Mariah Carey’s jolly No. 1 run with “All I Want for Christmas Is You.” Just one new title impacts the latest ARIA chart, published Friday, Sept. 18, and it has a local flavor. Adéla ’s “Nicole Kidman” (Capital/Universal) starts at No.14 just one place behind the Slovak singer and songwriter’s “Ain’t In LA,” up 15-13. Tame Impala accounts for the Australian contingent on the national singles survey. Kevin Parker ’s psychedelic pop act has two Deadbeat (Columbia/Sony) tracks in the top 40: “Loser,” down 7-9, and “Dracula,” up 26-21. Over on the ARIA Albums Chart , Olivia Rodrigo ’s You Seem Pretty Sad For A Girl So In Love (Geffen/Universal) returns to No. 1 after a four-week break. You Seem Pretty Sad has now chalked up six non-consecutive weeks at the summit. The best of the new arrivals belongs to Australian-born, Los Angeles-based artist and producer Jack Gray , whose debut album Swimming In Jeans (Island/Universal) dives in at No. 7. It’s the week’s best-seller in Australia on vinyl. Hailing from Mackay, Queensland, Gray recorded Swimming In Jeans across a 12-month period in studios around the world. He produced and performed almost the entire album himself, contributing drums, bass, guitar, synth and piano. Following this Saturday’s (Sept. 19) performance at Reeperbahn Festival in Hamburg, Germany, Gray joins In Color for tour dates in the United States and Canada. Meanwhile, British electronic artist Bonobo (real name: Simon Green) drops in at No. 22 on the ARIA Chart with Distance in Static (Ninja Tune/Inertia), his eighth album, while U.S. R B singer Jhené Aiko ( Westside Whimsy at No. 42 via Def Jam/Universal) and homegrown folk artist Mietta ( When The Water Stills at No. 49 via GYRO) enjoy top 50 starts.", "date_str": "2026-09-18T09:29:59+00:00", "hash": "fc70d5b9687c9ecd", "title_fa": "فیلم «Choosin» تگزاس به کارگردانی الا لنگلی در چهاردهمین هفته در جدول ARIA قرار گرفت", "summary_fa": "هیچ چیز از الا لنگلی \"Choosin' Texas\" (از طریق سونی موزیک) از صدر جدول امتیازات در جدول ARIA Singles جدا نمی شود، زیرا این کشور موفق به کسب چهاردهمین هفته غیر متوالی در رتبه 1 است. این یک رگه چشمگیر است، اگرچه \"Choosin' Texas\" برای رسیدن به عمق قهرمانی به زمان نیاز دارد. Tones And I's Dance Monkey پادشاه جنگل است و 24 هفته متوالی در صدر جدول تک آهنگ های ARIA قرار دارد. «Choosin’ Texas» در ایالات متحده آمریکا را پشت سر گذاشته است، جایی که در هفته بیست و دوم در رتبه 1 در بیلبورد Hot 100 قرار گرفت - طولانی ترین دوره سلطنت را به تساوی رساند و با «همه چیزی که برای کریسمس می خواهم تو هستی» برابری کرد. تنها یک عنوان جدید بر آخرین نمودار ARIA، منتشر شده در جمعه، 18 سپتامبر، تأثیر می گذارد و طعمی محلی دارد. «نیکول کیدمن» (پایتخت/یونیورسال) آدلا در رتبه 14 قرار دارد و تنها یک مکان پس از «Ain’t In LA» خواننده و ترانه سرای اسلواکی با امتیاز 15-13 بالاتر است. Tame Impala برای مشروط استرالیا در نظرسنجی ملی تک نفره حساب می کند. آهنگ پاپ روانگردان کوین پارکر دارای دو قطعه Deadbeat (کلمبیا/سونی) در 40 آهنگ برتر است: \"بازنده\" با 7-9 شکست و \"Dracula\" با 26-21 صعود. در نمودار آلبوم های ARIA، آلبوم اولیویا رودریگو، شما برای دختری خیلی عاشق، بسیار غمگین به نظر می رسد (گفن/یونیورسال) پس از یک وقفه چهار هفته ای، به رتبه اول باز می گردد. شما بسیار غمگین به نظر می رسید اکنون شش هفته غیر متوالی را در این اجلاس پشت سر گذاشته است. بهترین آلبوم‌های جدید متعلق به جک گری، هنرمند و تهیه‌کننده ساکن لس‌آنجلس، استرالیایی‌الاصل است که اولین آلبومش به نام Swimming In Jeans (جزیره/یونیورسال) در رتبه 7 قرار می‌گیرد. این آلبوم پرفروش‌ترین هفته در استرالیا برای وینیل است. گری"}, {"source": "Billboard", "title": "Carly Rae Jepsen Drops Double Album ‘Day and Night’: Stream It Now", "link": "https://www.billboard.com/music/pop/carly-rae-jepsen-double-album-day-and-night-stream-1236343240/", "summary": "You can call Carly Rae Jepsen many things, but lazy isn’t one of them. Try pop star, mom, busy. The Canadian pop artist burst out the gates with her all-conquering 2012 smash “Call Me Maybe,” a song that logged nine weeks at No. 1 on the Billboard Hot 100, the first of her six appearances on the chart. With the release at midnight of Day and Night , her eighth studio album, Jepsen provides us with two-dozen potential new hits. Day and Night is a double album, spanning 24 songs and clocking in at more than 100 minutes. “I always knew I wanted to do one day was a double album, and if not now, then when, really,” she tells Billboard News . “I was kind of divided in these two different flavors of what I wanted to do musically, and the solution was sort of just why not do both at the same time? So Day and Night was born.” The brooding first single from it, “On Wires,” is like a brand new toy. “I hadn’t really done anything quite like ‘On Wires’ before,” she explains, “and I think, you know, as a musician who’s been in this for a while now, that’s so exciting to land on, like, a new genre to play with that maybe you haven’t dabbled in before and to figure out how to make it your own.” Co-written with Nate Cyphert and Kyle Shearer, “we all felt like we had something special,” she recounts. Jepsen doesn’t do things by halves. Last month, producers of an upcoming Broadway musical adaptation of 10 Things I Hate About You announced that Jepsen will team up with Grammy-winner Ethan Gruska (boygenius) to write the project’s music and lyrics. And in March of this year, the artist became a mom when she and her husband, Cole Marsden Greif-Neill (aka Cole M.G.N.), welcomed a baby boy, Ilya. Day and Night is the followup to 2023’s The Loveliest Time . All told, Jepsen has five entries on the all-genres albums chart, including 2016’s top 10 release EMOTION , which recently celebrated its 10th anniversary with a special expanded edition featuring new songs “More,” “Guardian Angel,” “Back Of My Heart” and “Lost In Devotion.” Stream Day and Night below and watch Jepsen s interview with Billboard News here .", "date_str": "2026-09-18T07:49:59+00:00", "hash": "4a5ea58c84ce022b", "title_fa": "Carly Rae Jepsen آلبوم دوگانه \"Day and Night\" را منتشر کرد: اکنون آن را پخش کنید", "summary_fa": "می توانید کارلی رائه جپسن را خیلی چیزها صدا کنید، اما تنبل یکی از آنها نیست. ستاره پاپ را امتحان کنید، مادر، مشغول است. این هنرمند پاپ کانادایی در سال 2012 با آهنگ فوق‌العاده‌اش «Call Me Maybe» را شکست، آهنگی که 9 هفته در رتبه 1 بیلبورد Hot 100 قرار گرفت، اولین بار از شش حضور او در جدول. با انتشار در نیمه‌شب روز و شب، هشتمین آلبوم استودیویی‌اش، جپسن دو دوجین آهنگ جدید بالقوه را در اختیار ما قرار می‌دهد. روز و شب یک آلبوم دوگانه است که شامل 24 آهنگ و بیش از 100 دقیقه است. او به بیلبورد نیوز می‌گوید: «همیشه می‌دانستم که می‌خواهم روزی یک آلبوم دوگانه بسازم، و اگر الان نه، واقعاً چه زمانی». \"من به نوعی در این دو نوع متفاوت از کاری که می خواستم انجام دهم تقسیم شده بودم، و راه حل این بود که چرا هر دو را همزمان انجام ندهم؟ بنابراین روز و شب متولد شد.\" اولین تک‌آهنگ آن، «On Wires» مانند یک اسباب‌بازی کاملاً جدید است. او توضیح می‌دهد: «من واقعاً قبلاً چیزی شبیه «On Wires» انجام نداده بودم، و فکر می‌کنم، می‌دانید، به‌عنوان یک نوازنده که مدتی است در این کار بوده‌ام، بسیار هیجان‌انگیز است که روی یک ژانر جدید برای نواختن با آن وارد شوید، شاید قبلاً در آن کار نکرده باشید و بفهمید که چگونه آن را متعلق به خودتان کنید. او می گوید که با همکاری نیت سایفرت و کایل شیرر، \"همه ما احساس می کردیم چیز خاصی داریم\". جپسن کارها را به نصف انجام نمی دهد. ماه گذشته، تهیه‌کنندگان اقتباس موزیکال برادوی از 10 Things I Hate About You اعلام کردند که جپسن با برنده جایزه گرمی Ethan Gruska (پسر پسر) برای نوشتن موسیقی و اشعار پروژه همکاری خواهد کرد. و در ماه مارس امسال، این هنرمند زمانی مادر شد که او و همسرش،"}, {"source": "Billboard", "title": "Miley Cyrus’ ‘Bass Persuades’: All 10 Tracks Ranked", "link": "https://www.billboard.com/lists/miley-cyrus-bass-persuades-best-songs-tracks-ranked/", "summary": "It was just last June that Miley Cyrus released both a new album and an accompanying film in the ambitious, genre-spanning Something Beautiful . But not even 18 months back, Miley is back — though this time she has a new label, having made the switch from Columbia to Atlantic earlier this year, and she also (sort of) has a new name, having officially dropped the Cyrus from the album s promotion. So, now officially just being Miley, the longtime pop icon has returned this Friday (Sept. 17) with Bass Persuades , a 10-track set co-written and produced by Cyrus along with collaborators Kid Harpoon, Maxx Morando, Michael Pollack and The Monsters Strangerz. Miley will showcase the set this weekend with two shows at the Hollywood Bowl, with Brooklyn-based post-punk quartet Model/Actriz — who also appears as a featured artist on the album, as does longtime Miley collaborator Andrew Wyatt — serving as the opening act. “Music takes hold of us,” she posted on Instagram when announcing the album. “We feel it, sing it, sometimes dance to it, let it out and carry on. It is powerful, vulnerable, sweet and strong.” The album s title and lead single — as well as some of the comments Miley s made about it — may have suggested a more clubby sound for the full Bass Persuades , but while some of the songs definitely do some working out on the dancefloor, there are also ballads marked by woozy synths and breezy acoustic songs with classic pop melodies. See how Billboard ranks all 10 of the set s tracks below.", "date_str": "2026-09-18T05:40:46+00:00", "hash": "18459add09c874d3", "title_fa": "\"Bass Persuades\" مایلی سایرس: همه 10 آهنگ رتبه بندی شده اند", "summary_fa": "همین ژوئن گذشته بود که مایلی سایرس هم یک آلبوم جدید و هم یک فیلم همراه را در جاه طلبانه و ژانر چیزی به نام Something Beautiful منتشر کرد. اما حتی 18 ماه پیش، مایلی برگشته است - اگرچه این بار او یک برچسب جدید دارد، اوایل امسال از کلمبیا به آتلانتیک تغییر مسیر داده است، و همچنین (نوعی) نام جدیدی دارد که رسماً Cyrus را از تبلیغ آلبوم کنار گذاشته است. بنابراین، اکنون رسماً به عنوان مایلی، نماد قدیمی پاپ این جمعه (سپتامبر) بازگشته است. 17) با Bass Persuades، مجموعه ای 10 آهنگی که توسط سایروس نوشته و تهیه شده است، همراه با همکاران Kid Harpoon، Maxx Morando، Michael Pollack و The Monsters Strangerz. مایلی این مجموعه را در آخر هفته با دو نمایش در هالیوود بول به نمایش خواهد گذاشت و گروه کوارتت پست پانک مستقر در بروکلین Model/Actriz - که همچنین به عنوان یک هنرمند برجسته در آلبوم ظاهر می شود، و همچنین اندرو وایات، همکار قدیمی مایلی - به عنوان بازیگر افتتاحیه. او هنگام اعلام این آلبوم در اینستاگرام پست کرد: \"موسیقی ما را فرا می گیرد.\" ما آن را احساس ine تماشا کنید من کاملا متوجه نشدم. متوجه شدی پیرز؟ کونتی لبخند شیطنت آمیزی زد. مورگان پرسید: به نظر می رسد که شما به طور کاملاً تصادفی و بدون دلیل چینی صحبت می کنید. چرا این کار را کردی؟ نوروود پاسخ داد: به نظر می رسد من آنجا کمی سکسکه داشتم، گاهی اوقات سیم هایم کمی به هم می خورند، و اضافه کرد که این یک خطای غیر معمول است. این حتی برای من کمی انحنا بود. معمولاً سواری بسیار نرمی است، اما گاهی اوقات این اتفاقات رخ می دهد. Eline van der Velden، بنیانگذار و مدیر عامل Particle6، به Deadline گفت: من حدس می‌زنم که تیلی می‌تواند کمی خودنمایی کند، او فقط می‌خواست مهارت‌های زبانی خود را نشان دهد زیرا بیشتر مصاحبه‌هایش تا به امروز به زبان انگلیسی بوده است. بالاخره او خودمختار است. در طول مصاحبه بدون سانسور پیرز مورگان، این هنرپیشه هوش مصنوعی نیز شکسپیر را خواند و گفت که معتقد است بازیگران دیجیتال و بازیگران واقعی هرگز نباید در یک رشته اسکار رقابت کنند. متن کامل این مصاحبه امروز منتشر خواهد شد."}, {"source": "Deadline", "title": "Fatih Akin On How A Period Of Professional Crisis Inspired His Paranormal Love Story ‘Ghost Song’ — San Sebastian", "link": "https://deadline.com/2026/09/fatih-akin-ghost-song-san-sebastian-interview-1237107377/", "summary": "This evening, Spain’s San Sebastian Film Festival opens with Ghost Song, the latest feature from German filmmaker Fatih Akin. The screening marks Akin’s first appearance at the festival in his decades-long career, a surprising fact considering his strong presence on the festival circuit: Akin is among the rare group of directors to win major competitive [ ]", "date_str": "2026-09-18T14:09:57+00:00", "hash": "a94a830258b5dad2", "title_fa": "فاتح آکین در مورد اینکه چگونه یک دوره بحران حرفه ای الهام بخش داستان عشق ماوراء الطبیعه \"آهنگ شبح\" او شد - سن سباستین", "summary_fa": "عصر امروز، جشنواره فیلم سن سباستین اسپانیا با آهنگ شبح، جدیدترین فیلم سینمایی فاتح آکین، فیلمساز آلمانی، افتتاح می شود. این نمایش اولین حضور آکین در جشنواره را در طول چندین دهه فعالیت حرفه‌ای‌اش نشان می‌دهد، یک واقعیت شگفت‌انگیز با توجه به حضور قوی او در مدار ور می شود، من نسبت به گذشته خود نوستالژیک نیستم، اما نسبت به مردم نوستالژیک هستم. من به اندازه کافی به کسانی که این بردها را ممکن می کردند توجه نکردم. یک ماشین و یک تیم مجرب از رانندگان فقط تعداد انگشت شماری از قطعات پازل هستند. مهندسان، تحلیلگران داده، مربیان، فیزیوتراپیست‌ها، مکانیک‌ها و تعداد زیادی جادوگر طرف تجاری، همگی برای ساخت و نگهداری دستگاه به‌همراه یکدیگر تلاش می‌کنند. در COTA، GMR یک بار دیگر سن خود را پشت سر گذاشت و هر دو خودرو را در Hyperpole قرار داد و رتبه های 8 و 10 را در جدول شروع قرار داد. در حالی که روز مسابقه با مشکلات پیت لاین و یک حادثه ناگوار در اوایل مسابقه همراه بود، اتومبیل شماره 17 با خلبانی دو بار قهرمان استقامت جهان، آندر لاتتر، برنده عنوان IMSA، پیپو درانی، و ماتیس ژائبرت، مبتدی سال در سری لمان اروپا، بهترین"}, {"source": "Hollywood Reporter", "title": "‘Monster’ Creator Ian Brennan Shares 10-Season Plan and Dives Into First Female Serial Killer Season With Wild ‘Lizzie Borden Story’", "link": "https://www.hollywoodreporter.com/tv/tv-features/monster-the-lizzie-borden-story-10-seasons-creator-interview-1236705112/", "summary": "Brennan peels back the curtain into his and Ryan Murphy's 'Monster' selection process, how they landed on the infamous female axe murderer for season four and why she's the most sympathetic subject yet of their hit Netflix true-crime anthology.", "date_str": "2026-09-18T14:14:38+00:00", "hash": "5b32c0b5a6e92cf1", "title_fa": "ایان برنان، خالق «هیولا» برنامه 10 فصلی را به اشتراک می‌گذارد و در اولین فصل قاتل سریالی زن با «داستان لیزی بوردن» وحشی فرو می‌رود.", "summary_fa": "برنان پرده‌ای را از روند انتخاب «هیولا» خود و رایان مورفی باز می‌کند، این که چگونه آن‌ها در فصل چهارم به قاتل زن بدنام تبری رسیدند و چرا او دلسوزترین سوژه تا به حال در گلچین موفق نتفلیکس با جنایات واقعی است. متن لوگو، یان برنان، نوشتن آخرین فصل هیولا، در مورد پرونده لیزی بوردن، را به عنوان یک رویای تب توصیف می کند. برنان، که مجموعه‌ای از جنایات واقعی نت‌فلیکس را با تهیه‌کننده پرکار رایان مورفی می‌سازد، می‌گوید نوشتن این فصل‌ها درباره قاتلان سر از رمان سال 2014 خود اقتباس کرده است، عمیق است. کارگردان کانادایی به هالیوود ریپورتر می‌گوید: ابتدا تصمیم گرفتم این را به‌عنوان یک رمان بنویسم، اما همیشه حتی در آن زمان معتقد بودم که این چیزی است که می‌خواهم روی پرده بیاورم. داستان‌های مرتبط فیلم‌ها Bad Lieutenant: Tokyo Review: Shun Oguri and Lily James in a Meandering Franchise Entry from Takashi Miike Thats Semi-Coherent at the best films The Life and Deaths of Wilson Shedd نقد: آماندا سیفرید و اسکات مک نیری Bring T Raw Center Blaamaskeathl رویارویی پشت فیلم The Betrayers بین باروخ کاتلر، سیاستمداری با بازی مایکل آرونوف اتفاق می‌افتد که وقتی رابطه‌اش با معشوقه‌اش، لئورا، با بازی کائلن اوم، فاش می‌شود، به همسر و دخترش خیانت می‌کند. او و لئورا در شرایطی که زندگی سیاسی‌اش به هم ریخته و همسر و دخترش از غم و اندوه رابطه‌اش ویران شده‌اند، تبعیدی شرم‌آور در یالتا را انتخاب می‌کنند. اما دیری نمی‌گذرد که کاتلر با «خایم تانکیلیویچ» (سایمون مک‌بورنی)، دوست سابقش که خیانت او را قبل از اینکه در سیاست اسرائیل روی پاهایش قرار بگیرد، به گولاگ فرستاد، برخورد خیابانی می‌کند. تنش در حال جوش بین کاتلر و تانکیلویچ به بزمزگی کمک می کند تا با صبر و حوصله رویارویی خود را به تعویق بیندازند"}, {"source": "Hollywood Reporter", "title": "Why Matthew McConaughey Doesn’t Want to Take a DNA Test — Despite Woody Harrelson’s Insistence — to See If the Two Stars Are Really Brothers", "link": "https://www.hollywoodreporter.com/tv/tv-news/matthew-mcconaughey-dna-test-woody-harrelson-brothers-1236705177/", "summary": "The duo play versions of themselves in 'Brothers,' the Apple TV series that brings to life the rumor that they may be related.", "date_str": "2026-09-18T13:00:00+00:00", "hash": "8f5455f3f0d70f14", "title_fa": "چرا متیو مک‌کانهی نمی‌خواهد آزمایش DNA انجام دهد - علیرغم اصرار وودی هارلسون - تا ببیند آیا این دو ستاره واقعاً برادر هستند یا خیر؟", "summary_fa": "این دو نسخه‌های خود را در «برادران» بازی می‌کنند، سریال Apple TV که شایعه مرتبط بودن آنها را زنده می‌کند. ممکن است داستانی را بدانید که مادر متیو مک‌کانهی یک بار به او گفت که پدر وو nnam, Rebecca Hall and Vicky Krieps join lead Ella Beatty in co-creator Murphy and showrunner Ian Brennan's take on the infamous axe murderess.", "date_str": "2026-09-18T04:30:54+00:00", "hash": "0df2f9451a5859f4", "title_fa": "نقد \"هیولا: داستان لیزی بوردن\": آخرین حماسه قاتل سریالی نتفلیکس رایان مورفی مزخرفات فمینیستی است", "summary_fa": "چارلی هانام، ربکا هال و ویکی کریپس به الا بیتی در نقش مورفی، یکی از خالقان و ایان برنان، مجری برنامه، به قاتل بدنام تبر می پیوندند. در آخرین ساعت از نتفلیکس Monster: The Lizzie Borden Story، قاتل عنوانی که در نهایت با خشونتی که زندگی او را مشخص کرده است، صلح کرده است، به همراه وفاداری روی می‌آورد که در تمام این ماجرا در کنار او بوده است. باشه میگه بیایید آن را به معنایی تبدیل کنیم. لیزی (الا بیتی) در مورد ثروت و بدنامی خود صحبت می کند که می خواهد آن را به یک نیروی خوب هدایت کند. با این حال، در آن لحظه، تنها چیزی که می‌شنیدم این بود که ایان برنان، مجری برنامه، این احساس را برای خودش زمزمه می‌کرد. آخرین اضافه شده به شعر قتل او و رایان مورفی، ناامیدانه تلاش می‌کند چیزی را از حماسه بوردن بیرون بیاورد، هر چیزی معنی‌دار باشد، با تمام ظرافت یک دانشجوی سال اول کالج که تلاش می‌کند یک مقاله ترمی 15 صفحه‌ای را در دو ساعت قبل از مهلت مقرر و با همان قدرت متقاعدسازی تهیه کند. داستان های مرتبط تلویزیون هومر گیر نظریه خود را درباره هیولای تلویزیونی شارد و رابرت مالوری به اشتراک می گذارد: تیم داستان لیزی بوردن در مورد نقاشی پرتره ای از خشم زن -- و تمایل به تئوری های لزبین هیولا: داستان لیزی بوردن خط پایین تعداد زیادی قاتل، هزاران پرکننده. تاریخ پخش: پنجشنبه، شهریور 17 (نتفلیکس) بازیگران: الا بیتی، ویکی کریپس، چارلی هانام، ربکا هال، سارا پالسون، جسیکا باردن، جوی پولاری، بیلی لورد خالقان: رایان مورفی، ایان برنان همانطور که زیرنویس نشان می‌دهد، Monster: The Lizzie Borden Story احتمالاً اولین وقایع واقعی است که برای اولین بار شنیده می‌شود. آواز خواندن (یکی که ملودی آن تبدیل به یک موتیف مکرر می شود)، یا شاید دیده شود که با جزئیات بیشتر"}, {"source": "Hollywood Reporter", "title": "‘Bad Lieutenant: Tokyo’ Review: Shun Oguri and Lily James in a Meandering Franchise Entry From Takashi Miike That’s Semi-Coherent at Best", "link": "https://www.hollywoodreporter.com/movies/movie-reviews/bad-lieutenant-tokyo-review-shun-oguri-lily-james-1236705118/", "summary": "The Japanese cult director follows Abel Ferrara and Werner Herzog in charting the downward spiral of a corrupt detective with a drug habit, this time navigating the yakuza underworld.", "date_str": "2026-09-18T04:05:14+00:00", "hash": "f1510bd7b02a01b7", "title_fa": "نقد و بررسی «Bad Lieutenant: Tokyo»: Shun Oguri و Lily James in a Meandering Franchise Entry from Takashi Miike که در بهترین حالت نیمه منسجم است", "summary_fa": "کارگردان فرقه ژاپنی آبل فرارا و ورنر هرتزوگ را در ترسیم مارپیچ رو به پایین یک کارآگاه فاسد با عادت مواد مخدر دنبال می کند، این بار در دنیای اموات یاکوزا حرکت می کند. اولین مورد از یک سری دنباله‌های بین‌المللی برنامه‌ریزی‌شده، ستوان بد: توکیو، علیرغم اینکه شون اوگوری مغناطیسی را به‌عنوان آخرین تجسم کارآگاه بد اخلاق و توخالی که فیلم‌ها عنوان خود را مدیون او هستند، به کار می‌گیرد، شروعی بسیار بد دارد. از نظر طرح داستانی به فیلم اصلی آبل فرارا در سال 1992 با هاروی کایتل نزدیک تر است تا به دنباله 2009 عجیب و غریب ورنر هرتزوگ، Bad Lieutenant: Port of Call New Orleans، مناسب برای افراطی های گونزو نیکلاس کیج. اما این بدان معنا نیست که روایت متلاطم همیشه بخار زیادی جمع می کند. آنچه شگفت‌انگیز است این است که تاکاشی مییک، کارگردان پرکار کالت ژاپنی، که به خاطر انفجارهای خشونت‌آمیز اپرا، غم و انحراف در فیلم‌های موفقیت‌آمیز مانند آدیتون و ایچی قاتل شناخته می‌شود، یک فرنچایز را ارائه می‌کند که آرزوی تبدیل شدن به یک تریلر جنایی سرسخت را دارد، اما انرژی لازم برای ایجاد تعلیق یا حتی تنش را ندارد. در حالی که میکه هدهای مومن ممکن است از یک یا دو ست مجموعه تقویت شده و نوع خاصی از طنز تیره احساس سیری کنند، این ضعیف ترین در بین سه گروه Bad Lieutenant است. داستان‌های مرتبط فیلم‌ها بررسی زندگی و مرگ ویلسون شید: آماندا سایفرید و اسکوت مک‌نیری شدت خامی را به فیلم‌های درام محکوم به مرگ تیم بلیک نلسون می‌آورند بررسی مجدد/جفت: دیوید شویمر، دبلیو. کامائو بل و ون جونز ر estival, where they are presenting “Bucking Fastard,” renowned German director Werner Herzog and the film’s star Orlando Bloom spoke about a threesome scene between the “Pirates of the Caribbean” actor and Rooney and Kate Mara, who lead Herzog’s latest as two deeply intertwined sisters. Asked about the scene, [ ]", "date_str": "2026-09-18T14:06:24+00:00", "hash": "9791c87a2510141b", "title_fa": "ورنر هرتزوگ و اورلاندو بلوم در «Bucking Fastard» و آن صحنه سه نفری با خواهران مارا: «این چنین جذابیت و عمقی دارد»", "summary_fa": "ورنر هرتزوگ، کارگردان مشهور آلمانی و اورلاندو بلوم ستاره فیلم، هنگام سخنرانی در جشنواره فیلم سن سباستین، جایی که در حال ارائه فیلم «Bucking Fastard» هستند، درباره صحنه‌ای سه نفره بین بازیگر «دزدان دریایی کارائیب» و رونی و کیت مارا صحبت کردند، که آخرین فیلم هرتزوگ را به عنوان دو خواهر عمیقاً درگیر می‌کنند. در پاسخ به سوالی درباره صحنه، [ ] هرتزوگ در جشنواره فیلم سن سباستین حضور دارد تا باکینگ فستارد را ارائه کند و دستاورد حرفه ای معتبر خود را جایزه دونوستیا دریافت کند. بلوم در پاسخ به سوالی درباره صحنه، گفت که شخصیت ها و تمایلات جسمانی [آنها] چنین سادگی دارند، اما برای خواهران نیز معصومیتی دارند، و اضافه کرد: شخصیت من، فاست، بیش از حد است. و او از برخی جهات به سرعت از عمق خود خارج می شود. این لحظه ای بسیار صمیمانه بود که خلق شد. داستان‌های مرتبط Lionsgate، Neon، FilmNation متعهد به شغل تهیه‌کننده می‌خواهد هزینه‌های مراقبت‌های بهداشتی و توسعه را بخواهد (اختصاصی) هرتزوگ گفت: لحظاتی وجود دارد که یک کارگردان باید عقب‌نشینی کند. در صحنه عشق به اورلاندو گفتم: تو در رختخواب هستی و دو زن در آغوشت داری. چگونه با آن برخورد می کنید، من نمی توانم دستورالعملی ارائه کنم. زیباست چون چنین جذابیت و عمقی دارد. محبوب در Variety علیرغم اینکه کمتر از دو هفته پیش فیلم Bucking Fastard را به نمایش درآورد، کارگردان پرکار ورنر هرتزوگ که همچنین برنده جوایز Donostia امسال در سن سباستین است، تنها چند روز تا پایان پروژه بعدی خود فاصله دارد. او گفت که سه روز، و من فیلم بعدی ام را تمام خواهم کرد. دوشنبه، من دوباره سر کار هستم. هرتزوگ در مورد پروژه بعدی وارد جزئیات بیشتر نشد، اما     let currentTab = 'persian';
    let searchQuery = '';
    let readArticles = new Set(JSON.parse(localStorage.getItem('read_articles_registry') || '[]'));

    function toFaDigits(n) {
      const f = ['۰','۱','۲','۳','۴','۵','۶','۷','۸','۹'];
      return n.toString().replace(/\d/g, d => f[d]);
    }

    function toggleRead(hash) {
      if (readArticles.has(hash)) {
        readArticles.delete(hash);
      } else {
        readArticles.add(hash);
      }
      localStorage.setItem('read_articles_registry', JSON.stringify(Array.from(readArticles)));
      renderNews();
    }

    function renderNews() {
      const container = document.getElementById('newsContainer');
      const rawItems = data[currentTab] || [];
      
      const filtered = rawItems.filter(item => {
        if (!searchQuery) return true;
        const q = searchQuery.toLowerCase();
        const title = (item.title_fa || item.title || '').toLowerCase();
        const summary = (item.summary_fa || item.summary || '').toLowerCase();
        const source = (item.source || '').toLowerCase();
        return title.includes(q) || summary.includes(q) || source.includes(q);
      });

      const unreadList = [];
      const readList = [];

      filtered.forEach(item => {
        if (readArticles.has(item.hash)) {
          readList.push(item);
        } else {
          unreadList.push(item);
        }
      });

      const sortedItems = [...unreadList, ...readList];

      if (sortedItems.length === 0) {
        container.innerHTML = '<div style="text-align:center; padding: 40px; color: var(--text-muted);">هیچ خبری در این بخش در ۲۴ ساعت گذشته ثبت نشده است.</div>';
        return;
      }

      container.innerHTML = sortedItems.map((item, idx) => {
        const title = item.title_fa || item.title || '';
        const summary = item.summary_fa || item.summary || '';
        const source = item.source || 'منبع خبر';
        const link = item.link || '#';
        const isRead = readArticles.has(item.hash);
        const num = toFaDigits(idx + 1);

        return `
          <article class="news-card ${isRead ? 'is-read' : ''}" id="card-${item.hash}">
            <div class="news-header">
              <span class="news-num">${isRead ? '✓' : num}</span>
              <h2 class="news-title">${title}</h2>
            </div>
            ${summary ? `<p class="news-summary">${summary}</p>` : ''}
            <div class="news-footer">
              <span class="news-source">📌 منبع: ${source}</span>
              <div class="footer-right">
                <button class="btn-mark-read" onclick="toggleRead('${item.hash}')">
                  ${isRead ? '✓ خوانده شد' : '○ علامت خوانده‌شده'}
                </button>
                ${link && link.startsWith('http') ? `<a href="${link}" target="_blank" rel="noopener noreferrer" class="news-link">مطالعه اصل خبر ↗</a>` : ''}
              </div>
            </div>
          </article>
        `;
      }).join('');
    }

    function switchTab(tab, el) {
      currentTab = tab;
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      if (el) el.classList.add('active');
      renderNews();
    }

    function toggleTheme() {
      const html = document.documentElement;
      const current = html.getAttribute('data-theme') || 'dark';
      const next = current === 'dark' ? 'light' : 'dark';
      html.setAttribute('data-theme', next);
      localStorage.setItem('theme', next);
      updateThemeButton(next);
    }

    function updateThemeButton(theme) {
      const icon = document.getElementById('themeIcon');
      const text = document.getElementById('themeText');
      if (theme === 'dark') {
        icon.textContent = '☀️';
        text.textContent = 'حالت روشن';
      } else {
        icon.textContent = '🌙';
        text.textContent = 'حالت تاریک';
      }
    }

    function toggleArchiveModal(show) {
      const modal = document.getElementById('archiveModal');
      if (show) {
        renderArchiveList();
        modal.classList.add('active');
      } else {
        modal.classList.remove('active');
      }
    }

    function renderArchiveList() {
      const listContainer = document.getElementById('archiveListContainer');
      if (!archiveManifest || archiveManifest.length === 0) {
        listContainer.innerHTML = '<div style="text-align:center; padding: 20px; color: var(--text-muted);">هنوز شماره قبلی ثبت نشده است.</div>';
        return;
      }

      listContainer.innerHTML = archiveManifest.map(item => `
        <a href="${item.url}" class="archive-item">
          <div>
            <div class="archive-date-fa">📰 شماره ${item.p_date}</div>
            <div class="archive-date-g">🌍 ${item.g_date}</div>
          </div>
          <span class="archive-arrow">←</span>
        </a>
      `).join('');
    }

    const savedTheme = localStorage.getItem('theme') || 'dark';
    document.documentElement.setAttribute('data-theme', savedTheme);
    updateThemeButton(savedTheme);

    document.getElementById('searchInput').addEventListener('input', (e) => {
      searchQuery = e.target.value.trim();
      renderNews();
    });

    renderNews();
  </script>
