to Billboard ’s Chart Beat hub, sign up for the weekly Chart Beat newsletter , among other e-blasts, and browse the full menu of Billboard ’s charts, which refresh every Tuesday (and each Wednesday during holiday weeks).", "date_str": "2026-11-17T16:59:03+00:00", "hash": "e9e84c0b30d50d2d", "title_fa": "الا لنگلی، وام!، ماریا کری و موارد دیگر: نکات برجسته نمودارهای بیلبورد این هفته", "summary_fa": "سه شنبه هر هفته روز جدید نمودار بیلبورد است! طبق گزارش ردیاب داده Luminate، از آنجایی که همه نمودارها هر سه شنبه به روز می شوند، در اینجا نگاهی به نکات مهم آخرین رتبه بندی، در تاریخ 21 نوامبر و منعکس کننده هفته اندازه گیری 6 تا 12 نوامبر است. از جمله ستارگان چارت این هفته می توان به اللانگلی، اولویا رودریگو، لیل بیبی و پی 1 هارمونی اشاره کرد. به علاوه، همانطور که سفر به سوپرمارکت نشان می دهد (تخم مرغ در نزدیکی شیر فروخته می شود، پس سالم است، درست است؟)، فصل تعطیلات اینجاست. در Billboard Hot 100 نیز مشخص است که کجای کلاسیک Wham! در سال 1984، هشت سرود را به ارمغان می‌آورد. خلاصه‌ای از این موارد وجود دارد: به‌ویژه قابل‌توجه است که «کریسمس گذشته» تا کنون رتبه‌بندی برتر تعطیلات را به خود اختصاص داده است، زیرا سال گذشته به بالاترین رتبه 100 داغ رسید، زیر «All I Want for Christmas Is You» که مجموع آن به 22 هفته در رتبه 1 رسید. در همین حال، تک تیره‌های رودریگو در ادامه انتشار 6 خط تیره‌اش. این اولین آهنگ تعطیلات شغلی او است. در بیلبورد 200، مایکل بابله بالاترین آلبوم فصلی نمودار را دارد، به عنوان کریسمس، از سال 2011، خزانه 119-35. برای اطلاعات مهم بیشتر از نمودارهای بیلبورد این هفته در زیر بخوانید. \"Choosin' Texas\" برای بیست و هشتمین هفته رکورددار خود در صدر 100 فیلم داغ ادامه دارد. بعلاوه، با آهنگ \"All I Want for Christmas Is You\" از کری برای بیشترین هفته - 27 - در رتبه اول جدول آهنگ های استریمینگ قرار گرفت. به نظر می رسد که شما برای یک دختر بسیار غمگین هستید، بنابراین عاشق هیچ است. 1 در بیلبورد 200 برای پنجمین هفته، با ترش سال 2021 برای طولانی ترین فرمان او. او پنجمین آلبوم برتر R B/Hip-Hop شماره 1 و", "image_url": "https://www.billboard.com/wp-content/uploads/2026/11/wham-1985-billboard-1800.jpg?w=1024", "category": "سینما و سریال", "tags": ["سینما", "موسیقی"], "datetime_fa": "۲۶ آبان • ۲۰:۲۹"}, {"source": "Billboard", "title": "Intocable Announces Texicano Tour 2027: ‘A Journey Through Our Culture’", "link": "https://www.billboard.com/music/latin/intocable-2027-tour-dates-texicano-tour-1236384031/", "summary": "After a year of major achievements in its career — including the unveiling of the group s star on the Hollywood Walk of Fame, a historic performance at the Zócalo in Mexico City and six RIAA Latin Diamond certifications — Intocable has announced the first 21 dates of its Texicano Tour 2027, which kicks off on Feb. 20 in Chicago. Spanning the U.S., Mexico and Puerto Rico, the tour will make stops in cities including Atlanta; Nashville; Los Angeles; San Juan, Puerto Rico; and Guadalajara and Mexico City in Mexico, concluding on Nov. 9 in Monterrey, Mexico. More dates are expected to be announced. Related Intocable Commemorates Mexican Independence Day Alongside 300,000 Fans in Zócalo: Celebrating on This Date Is Pure Poetry Intocable Makes History With Six RIAA Latin Diamond Awards Intocable Receive Star on the Hollywood Walk of Fame: Thank You for Putting Us Here The tour s name represents the diversity of musical influences the members of the group — formed in Hidalgo, Texas — were exposed to since childhood, influences that helped them create a revolutionary musical style within the regional Mexican genre that has endured for more than three decades. “We never set out to fuse different genres or create a new sound. We grew up listening to country, rock, norteño, conjunto and everything in between. We never saw those sounds as part of different worlds; they were simply part of our identity,” Ricky Muñoz, vocalist and leader of Intocable, said in a statement. “Texicano is not half of anything. It’s the entirety of everything that has shaped us. That is the essence of this tour. We want the concert to feel like a journey through our culture, not just a collection of songs.” The announcement of the Texicano Tour 2027 comes as the group wraps its Cultura Tour, which began in February. In October, Intocable was a special guest of Kacey Musgraves during a performance in Austin, Texas, following the band s collaboration with the country star on the song “Uncertain.” Presale tickets for the tour will begin on Thursday (Nov. 19) at 10 a.m. local time, with the general sale starting on Friday (Nov. 20) at the same time. Tickets will be available on Intocable’s official website . Check out the first announced dates for Intocable s Texicano 2027 Tour below:", "date_str": "2026-11-17T16:52:30+00:00", "hash": "cc2448ccce7afa38", "title_fa": "Intocable تور Texicano 2027 را اعلام کرد: \"سفر در میان فرهنگ ما\"", "summary_fa": "پس از یک سال دستاوردهای مهم در حرفه خود - از جمله رونمایی از ستاره گروه در پیاده‌روی مشاهیر هالیوود، اجرای تاریخی در Zócalo در مکزیکو سیتی و شش گواهینامه الماس لاتین RIAA - Intocable 21 تاریخ اول تور Texicano 2027 خود را که در شیکاگو 20 فوریه آغاز می‌شود، اعلام کرد. این تور که ایالات متحده، مکزیک و پورتوریکو را در بر می گیرد، در شهرهایی از جمله آتلانتا توقف خواهد داشت. نشویل; لس آنجلس؛ سن خوان، پورتوریکو؛ و گوادالاخارا و مکزیکو سیتی در مکزیک، در 9 نوامبر در مونتری، مکزیک به پایان رسید. انتظار می رود تاریخ های بیشتری اعلام شود. Intocable مرتبط به یاد روز استقلال مکزیک در کنار 300000 طرفدار در Zócalo: جشن گرفتن در این تاریخ شعر ناب است Intocable با شش جوایز الماس لاتین RIAA تاریخ ساز می شود این گروه - که در هیدالگو، تگزاس تشکیل شد - از دوران کودکی در معرض تأثیراتی قرار گرفتند که به آنها کمک کرد سبک موسیقی انقلابی در ژانر منطقه ای مکزیکی ایجاد کنند که بیش از سه دهه دوام آورده است. ریکی مونوز، خواننده و رهبر گروه Intocable در بیانیه‌ای گفت: \"ما هرگز قصد ادغام ژانرهای مختلف یا ایجاد صدای جدید را نداشتیم. ما با گوش دادن به کانتری، راک، نورتنیو، conjunto و هر چیز دیگری بزرگ شدیم. ما هرگز آن صداها را بخشی از جهان‌های مختلف ندیدیم؛ آنها به سادگی بخشی از هویت ما بودند.\" \"تکسیکانو نیمی از هیچ چیز نیست. تمام آن چیزی است که ما را شکل داده است. این جوهر این تور است. ما می‌خواهیم این کنسرت مانند یک سفر در فرهنگ ما باشد، نه فقط مجموعه‌ای از آهنگ‌ها.» اعلام تور Texicano 2027 در حالی است که این گروه تور فرهنگی خود را که در فوریه آغاز شده بود به پایان می رساند. در ماه اکتبر، پس از همکاری گروه با", "image_url": "https://www.billboard.com/wp-content/uploads/2026/11/Intocable-cr-Good-I-Music-billboard-1800.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["موسیقی"], "datetime_fa": "۲۶ آبان • ۲۰:۲۲"}, {"source": "Billboard", "title": "Cardi B Celebrates Son Grey’s 1st Birthday With Over-the-Top Birthday Party: ‘A Time Was Had!’", "link": "https://www.billboard.com/music/music-news/cardi-b-son-grey-1st-birthday-party-1236383963/", "summary": "Grey Diggs birthday party was out of this world. Cardi B celebrated her youngest son s first full-trip around the sun by taking him to outer space with an astronaut-themed bash, as captured in clips and videos the rapper shared on Instagram. Related Cardi B Reveals First Photos of Her Son With Stefon Diggs — and His Uncommon Name — as Baby Boy Turns 1 Cardi B Defends Her Success, Addresses Light-Skin Privilege: Colorism Is Real Cardi B Shares the Most Relatable Reaction to Her 2027 Grammy Nominations While Half Asleep In a Monday (Nov. 16) post, Cardi wrote, A long a week celebrating your birthday because it’s GREYS WORLD 🩶🩶🩶love you my fat man ..A TIME WAS HAD !!! The carousel featured a photo and video of the Grammy winner holding her son — who looks fly in a fuzzy Chanel hat in a venue decked out with balloon sculptures, rocket ships, large recreations of the solar system s planets and colorful lights. One clip finds Cardi and her youngest dancing around with a Transformers -esque anthropomorphic robot, and other photos show Grey s lavish Mickey Mouse cake and food stands serving McDonalds, Popeyes, sushi, ice cream and more. Cardi shares Grey with ex Stefon Diggs. Up until a couple of weeks ago, fans did not know what the little boy looked like, much less his name; the hip-hop star finally revealed both in an emotional Instagram post on Nov. 4. It’s only been 1 year since meeting you but it feels like I’ve had you at my side forever,” she wrote at the time. “I carried you through one of the most uncertain high pressured times of my life but having you inside of me through it all gave me an extra strength . I was growing you inside of me and at the same time you were giving me life! The musician whose Billboard 20 0 -topping LP Am I the Drama? just so happened to score a best rap album Grammy nomination on Monday also shares three children with ex Offset. Daughters Kulture and Blossom and son Wave were seemingly all in attendance at baby brother Grey s birthday extravaganza, posing together in another photo Cardi included in her post.", "date_str": "2026-11-17T16:36:10+00:00", "hash": "3469b2615c44ba3a", "title_fa": "Cardi B اولین تولد سون گری را با جشن تولد بسیار عالی جشن می گیرد: «زمانی بود!»", "summary_fa": "جشن تولد گری دیگز خارج از این دنیا بود. کاردی بی اولین سفر کامل پسرش به دور خورشید را با بردن او به فضای خارج از جو با مضمون فضانوردی جشن گرفت، همانطور که در کلیپ ها و ویدئوهایی که رپر در اینستاگرام به اشتراک گذاشته است، ثبت شده است. Cardi B اولین عکس‌های پسرش را با استفون دیگز – و نام غیرمعمول او – در حالی که پسر بچه ۱ ساله می‌شود فاش کرد. یک هفته طولانی تولدت را جشن میگیرم چون دنیای خاکستری است 🩶🩶🩶دوستت دارم مرد چاق من ..زمانی بود!!! این چرخ و فلک عکس و ویدیویی از برنده گرمی را نشان می‌داد که پسرش را در آغوش گرفته بود – که به نظر می‌رسد با کلاه مبهم Chanel در مکانی مملو از مجسمه‌های بالن، کشتی‌های موشکی، تفریحات بزرگ سیارات منظومه شمسی و چراغ‌های رنگارنگ پرواز می‌کند. یکی از کلیپ‌ها کاردی و جوان‌ترین او را در حال رقصیدن با یک ربات انسان‌نما شبیه به ترانسفورمرز می‌بیند، و عکس‌های دیگر کیک مجلل میکی موس گری و غرفه‌های غذا را نشان می‌دهد که مک‌دونالد، پوپی، سوشی، بستنی و غیره سرو می‌کند. کاردی گری را با استفون دیگز سابق به اشتراک می گذارد. تا چند هفته پیش، طرفداران نمی‌دانستند که پسر کوچک چه شکلی است، چه رسد به نام او. ستاره هیپ هاپ سرانجام هر دو را در یک پست احساسی اینستاگرامی در 4 نوامبر فاش کرد. فقط 1 سال از ملاقات شما می گذرد، اما احساس می کنم شما را برای همیشه در کنار خود داشته ام، او در آن زمان نوشت. تو را در درونم بزرگ می کردم و در عین حال به من زندگی می دادی! نوازنده‌ای که بیلبورد 20 0 برترین ال‌پی او آیا من درام هستم؟ اتفاقاً روز دوشنبه موفق شد جایزه بهترین آلبوم رپ را به دست آورد، نامزد گرمی نیز سه فرزند با", "image_url": "https://www.billboard.com/wp-content/uploads/2026/08/P1186JD4-e1787592535950.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["موسیقی"], "datetime_fa": "۲۶ آبان • ۲۰:۰۶"}, {"source": "Billboard", "title": "Mike D and Ad-Rock Talk Beastie Boys’ Early Days, ‘License to Ill’ 40th Anniversary on ‘Daily Show’: ‘Why Not Create What Inspires You?’", "link": "https://www.billboard.com/music/rb-hip-hop/mike-d-ad-rock-beastie-boys-license-to-ill-anniversary-daily-show-1236383918/", "summary": "Beastie Boys bandmates Mike D and Ad-Rock made a rare joint appearance on The Daily Show on Monday night (Nov. 16) to talk about the origins of the beloved hip-hop trio and the 40th anniversary of their landmark breakthrough 1986 Def Jam Records debut, License to Ill . Related Wale on Triumphant Pair of 2027 Grammy Nominations for Everything Is a Lot : I Hope It Teaches a Lot of People About Resilience Mike D Makes Solo Billboard Chart Debut With New Album Thank You Miley Cyrus Reacts to Shared Grammy Nod With Dolly Parton: A Beautiful Way to Honor Her Enormous Heart The chat with host Jon Stewart opened with Ad-Rock recalling that he was not an original member of the trio that also included Adam MCA Yauch, who died in 2012 at age 47 following a fight with parotid cancer. I was in a real band. We were called the Young and the Useless, Ad-Rock (born Adam Horovitz) said of his teenage hardcore band. When an early member of the Beastie Boys, guitarist John Berry, quit, the duo tapped their former opening act to join up. They like to say I went from the minors to the majors, Ad-Rock said of his glow-up into the group whose debut became the first rap album to top the Billboard 200 chart. The old friends also reminisced about their favorite shows and venues from back in the day, with Ad-Rock, 60, shouting out the underground Manhattan club Pizza-a-Go-Go, and an early gig opening for horror punk legends the Misfits and the Detroit hardcore band the Necros. We were the baby band on the punk rock bill, Mike D (born Michael Diamond), 60, said of the gig where Ad-Rock was a spectator, but not yet a band member. The Misfits were a real band, real records, outfits, you know, the hair, the whole thing. And we were like just kids carrying our own equipment. The free-wheeling conversation touched on the heady downtown music scene of the 1980s and how the gumbo of different sounds leaking out from the city s clubs and scenes made the group realize they didn t have to focus on one kind of music. We don t have to just make this one particular thing, why not create what inspires you? Ad-Rock explained. He also said, with all offense to Mike-D, that neither of them had the vision for what the band could be, a role that was left to their late comrade MCA. I m gonna lump Yauch in with us dumbasses here, Mike replied a short time later. In that time we were just hanging out by the bathroom at Irving Plaza, seeing this show or that show and talking about what was next week. And th", "date_str": "2026-11-17T16:17:29+00:00", "hash": "4466d8d27a688f25", "title_fa": "Mike D و Ad-Rock Talk Beastie Boys Early Days، \"License to Ill\" چهلمین سالگرد در \"Daily Show\": \"Why Not Create What It Inspires You?\"", "summary_fa": "هم گروه Beastie Boys، مایک دی و اد-راک، دوشنبه شب (16 نوامبر) در برنامه The Daily Show ظاهر شدند تا در مورد منشأ سه‌گانه محبوب هیپ‌هاپ و چهلمین سالگرد موفقیت برجسته‌شان در سال 1986 Def Jam Records، License to Ill صحبت کنند. ویل مرتبط در مورد نامزدی جایزه گرمی 2027 برای همه چیز بسیار زیاد است: امیدوارم به افراد زیادی درباره انعطاف‌پذیری آموزش دهد. استوارت با Ad-Rock شروع به کار کرد و یادآور شد که او یکی از اعضای اصلی این سه نفر که آدام MCA Yauch نیز در آن حضور داشت، نبود که در سال 2012 در سن 47 سالگی به دنبال مبارزه با سرطان پاروتید درگذشت. من در یک گروه موسیقی واقعی بودم. Ad-Rock (متولد آدام هوروویتز) در مورد گروه نوجوان هاردکور خود گفت که ما را جوان و بی فایده می نامیدند. زمانی که یکی از اعضای اولیه گروه Beastie Boys، گیتاریست جان بری، کناره گیری کرد، این دو نفر از مراسم افتتاحیه قبلی خود برای پیوستن استفاده کردند. آن‌ها دوست دارند بگویند من از خردسالان به بزرگ‌ترها رفتم، اد-راک درباره درخشش خود در گروهی گفت که اولین آلبوم رپ آن اولین آلبوم رپ بود که در جدول بیلبورد 200 در صدر قرار گرفت. دوستان قدیمی همچنین خاطرات نمایش‌ها و مکان‌های مورد علاقه‌شان را در آن روز به یاد آوردند، با Ad-Rock، 60 ساله، که فریاد می‌زد کلوپ زیرزمینی منهتن Pizza-a-Go-Go، و اولین کنسرت افتتاحیه برای اسطوره‌های پانک وحشت، Misfits و گروه هاردکور دیترویت، Necros. مایک گروه کوچک در بیل پانک راک بودیم، مایک دی (متولد مایکل دایموند)، 60 ساله، درباره کنسرتی گفت که اد-راک بیننده بود، اما هنوز عضوی از گروه نبود. Misfits یک گروه موسیقی واقعی بود، صفحه‌های واقعی، لباس‌ها، می‌دانید، مو، همه چیز. و ما مثل بچه هایی بودیم که وسایل خودمان را حمل می کردند. گفتگوی آزادانه به صحنه موسیقی مهیج در مرکز", "image_url": "https://www.billboard.com/wp-content/uploads/2026/11/mike-d-ad-rock-daily-show-2026-billboard-1800.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["موسیقی"], "datetime_fa": "۲۶ آبان • ۱۹:۴۷"}, {"source": "Billboard", "title": "AI Is Changing Music. Its Future Must Be Built Around Artists (Guest Column)", "link": "https://www.billboard.com/pro/soundcloud-ceo-open-letter-ai-is-changing/", "summary": "At SoundCloud, we believe the future of music should be artist-first. Our brand and our business have been built on the trust artists place in us, and protecting that is fundamental to who we are. Being artist-first is the lens through which we approach AI, recognizing both its potential to expand creative possibilities and the risks it presents to artists, their rights and the communities they build. Technology will keep changing how music is made. Our responsibility to protect the artists who make it won’t. Too often, AI is framed as a binary choice: all good or all bad, embrace it or reject it. It is time that we address this transformation with the nuance that artists deserve. The reality is that AI presents existential risks if managed wrong and game-changing opportunities if managed right. It is our responsibility to artists to both minimize those risks and maximize those opportunities. Related SoundCloud CEO Talks AI Policies: ‘Wishing Away the Advent of AI Music Is Not a Strategy’ CL Signs With THEBLACKLABEL, Reuniting With Longtime Producer Teddy For Full Circle Moment Severe Weather, Radius Clauses and Finding the Next Generation of Festival Headliners: It s a Year-by-Year Fight to Stay Alive Innovation and Artist Protection Must Evolve Together Every major shift in music has challenged our understanding of what it means to create. From sampling and synthesizers to auto-tune and digital production, new technologies have consistently pushed the boundaries of creativity, opened doors for new artists, and given rise to entirely new genres and sounds. But music has never been created in isolation. Collaboration, shared experimentation, and the exchange of ideas between artists has always been central to how new sounds and genres emerge. As AI transforms the creative process, we must ensure it doesn’t displace the spaces where artists connect, collaborate, and inspire one another. History shows us that innovation and artist protections don’t have to be opposing forces. They can and must evolve together, on behalf of artists. Artists must have a voice in shaping what comes next. Through artist roundtables and ongoing dialogue with creators and partners across not only our own platform, but Reddit, Discord and beyond, we re listening to how artis     let currentTab = 'persian';
    let searchQuery = '';
    let readArticles = new Set(JSON.parse(localStorage.getItem('read_articles_registry') || '[]'));

    function toFaDigits(n) {
      const f = ['۰','۱','۲','۳','۴','۵','۶','۷','۸','۹'];
      return n.toString().replace(/\d/g, d => f[d]);
    }

    function toggleRead(hash) {
      if (readArticles.has(hash)) {
        readArticles.delete(hash);
      } else {
        readArticles.add(hash);
      }
      localStorage.setItem('read_articles_registry', JSON.stringify(Array.from(readArticles)));
      renderNews();
    }

    function renderNews() {
      const container = document.getElementById('newsContainer');
      const rawItems = data[currentTab] || [];
      
      const filtered = rawItems.filter(item => {
        if (!searchQuery) return true;
        const q = searchQuery.toLowerCase();
        const title = (item.title_fa || item.title || '').toLowerCase();
        const summary = (item.summary_fa || item.summary || '').toLowerCase();
        const source = (item.source || '').toLowerCase();
        const category = (item.category || '').toLowerCase();
        const tags = (item.tags || []).join(' ').toLowerCase();
        return title.includes(q) || summary.includes(q) || source.includes(q) || category.includes(q) || tags.includes(q);
      });

      const unreadList = [];
      const readList = [];

      filtered.forEach(item => {
        if (readArticles.has(item.hash)) {
          readList.push(item);
        } else {
          unreadList.push(item);
        }
      });

      const sortedItems = [...unreadList, ...readList];

      if (sortedItems.length === 0) {
        container.innerHTML = '<div style="text-align:center; padding: 40px; color: var(--text-muted);">هیچ خبری در این بخش در ۲۴ ساعت گذشته ثبت نشده است.</div>';
        return;
      }

      container.innerHTML = sortedItems.map((item, idx) => {
        const title = item.title_fa || item.title || '';
        const summary = item.summary_fa || item.summary || '';
        const source = item.source || 'منبع خبر';
        const link = item.link || '#';
        const isRead = readArticles.has(item.hash);
        const num = toFaDigits(idx + 1);
        const category = item.category || '';
        const tags = item.tags || [];
        const datetimeFa = item.datetime_fa || '';

        return `
          <article class="news-card ${isRead ? 'is-read' : ''}" id="card-${item.hash}">
            <div class="news-header">
              <span class="news-num">${isRead ? '✓' : num}</span>
              <h2 class="news-title">${title}</h2>
            </div>
            ${summary ? `<p class="news-summary">${summary}</p>` : ''}
            <div class="news-footer">
              <div class="footer-top-row">
                <div class="meta-group">
                  <span class="news-source">📌 ${source}</span>
                  ${datetimeFa ? `<span class="news-datetime">🕒 ${datetimeFa}</span>` : ''}
                  ${category ? `<span class="news-category-badge" onclick="filterByTag('${category}')">📂 ${category}</span>` : ''}
                </div>
              </div>
              ${tags && tags.length > 0 ? `
                <div class="footer-tags-row">
                  ${tags.map(t => `<span class="news-tag-chip" onclick="filterByTag('${t}')">#${t}</span>`).join('')}
                </div>
              ` : ''}
              <div class="footer-bottom-row">
                <div class="footer-actions-right">
                  <button class="btn-mark-read" onclick="toggleRead('${item.hash}')">
                    ${isRead ? '✓ خوانده شد' : '○ علامت خوانده‌شده'}
                  </button>
                </div>
                <div class="footer-actions-left">
                  ${link && link.startsWith('http') ? `<a href="${link}" target="_blank" rel="noopener noreferrer" class="news-link">مطالعه اصل خبر ↗</a>` : ''}
                </div>
              </div>
            </div>
          </article>
        `;
      }).join('');
    }

    function filterByTag(val) {
      const searchInput = document.getElementById('searchInput');
      if (searchInput) {
        searchInput.value = val;
        searchQuery = val;
        renderNews();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    }

    function switchTab(tab, el) {
      currentTab = tab;
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      if (el) el.classList.add('active');
      renderNews();
    }

    function toggleTheme() {
      const html = document.documentElement;
      const current = html.getAttribute('data-theme') || 'dark';
      const next = current === 'dark' ? 'light' : 'dark';
      html.setAttribute('data-theme', next);
      localStorage.setItem('theme', next);
      updateThemeButton(next);
    }

    function updateThemeButton(theme) {
      const icon = document.getElementById('themeIcon');
      const text = document.getElementById('themeText');
      if (theme === 'dark') {
        icon.textContent = '☀️';
        text.textContent = 'حالت روشن';
      } else {
        icon.textContent = '🌙';
        text.textContent = 'حالت تاریک';
      }
    }

    function toggleArchiveModal(show) {
      const modal = document.getElementById('archiveModal');
      if (show) {
        renderArchiveList();
        modal.classList.add('active');
      } else {
        modal.classList.remove('active');
      }
    }

    function renderArchiveList() {
      const listContainer = document.getElementById('archiveListContainer');
      if (!archiveManifest || archiveManifest.length === 0) {
        listContainer.innerHTML = '<div style="text-align:center; padding: 20px; color: var(--text-muted);">هنوز شماره قبلی ثبت نشده است.</div>';
        return;
      }

      listContainer.innerHTML = archiveManifest.map(item => `
        <a href="${item.url}" class="archive-item">
          <div>
            <div class="archive-date-fa">📰 شماره ${item.p_date}</div>
            <div class="archive-date-g">🌍 ${item.g_date}</div>
          </div>
          <span class="archive-arrow">←</span>
        </a>
      `).join('');
    }

    const savedTheme = localStorage.getItem('theme') || 'dark';
    document.documentElement.setAttribute('data-theme', savedTheme);
    updateThemeButton(savedTheme);

    document.getElementById('searchInput').addEventListener('input', (e) => {
      searchQuery = e.target.value.trim();
      renderNews();
    });

    renderNews();
  </script>
