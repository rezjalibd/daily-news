قدسین آخرالزمان واقعاً ضعیف است، مانند پادکست مرده بابی آلتوف. برادر آلتوف در بزرگسالی به مورمونیسم گروید، اگرچه احتمالاً بازیگری او بیشتر به دنبال‌کنندگان آنلاین قابل توجه او مربوط می‌شود تا وابستگی مذهبی. ضربات داستانی که از این شکاف درونی به دست می‌آیند، با این وجود به طرز عجیبی آشنا هستند و سنت‌گرایی آماده پینترست را در برابر مدرنیته آینده‌نگر قرار می‌دهند. باز هم، هیچ کس در اولین \"همسران مورمون\" در رابطه ای به اندازه رابطه O.C. یوتیوب Aspyn Ovard، که در یک گروه کامل حضور دارد. همانطور که از شرح شغل‌هایی مانند «پادکستر» و «یوتیوب» برمی‌آید، «همسران مورمون» ابتدا متنی درباره شهرت اینترنتی و در درجه دوم مذهب است. (آلتوف حتی تنها گوینده حرفه‌ای در گروه نیست؛ اوری وودز مجری کمدی به او ملحق شده است.) به جای «#MomTok»، گروه دوستان موجود از همگام‌سازی‌کنندگان لب که سوژه آماده‌ای را برای یک نمایش واقعی ارائه می‌کنند، اورنج کانتی مجموعه‌ای از آشنایان را جمع می‌کند. وجه مشترک از لحاظ نظری افلک است که ادعا می کند خدمه دوستانی هستند که او در هنگام فیلمبرداری «رقص با ستاره ها» در لس آنجلس پیدا کرد.", "image_url": "https://variety.com/wp-content/uploads/2026/11/SecretLivesofMormonWives-OrangeCounty-review.jpg?w=1000&#038;h=563&#038;crop=1", "category": "هوش مصنوعی مولد", "tags": ["رسانه", "هنر"], "datetime_fa": "۲۱ آبان • ۱۹:۰۰"}, {"source": "Variety", "title": "Hollywood’s Next Big Deal: Will Netflix Make an M&A Play for NBCU?", "link": "https://variety.com/2026/tv/news/will-netflix-make-acquisition-move-nbcuniversal-spinoff-1236946048/", "summary": "David Ellison has knocked out Warner Bros. Discovery, merging it with Paramount into the new Skydance Corp. Now the chatter around town is about the industry’s next megamerger. In the current landscape, only one media company of considerable size could be ripe for a takeover: NBCUniversal. Following its planned spinoff from Comcast in mid-2027, NBCU [ ]", "date_str": "2026-11-12T15:30:00+00:00", "hash": "ab9b80d920cf005b", "title_fa": "معامله بزرگ بعدی هالیوود: آیا نتفلیکس یک بازی M&A برای NBCU انجام می دهد؟", "summary_fa": "دیوید الیسون شرکت برادران وارنر دیسکاوری را حذف کرد و آن را با پارامونت در شرکت جدید Skydance ادغام کرد. اکنون صحبت‌های اطراف شهر درباره ادغام‌کننده بعدی این صنعت است. در چشم انداز فعلی، تنها یک شرکت رسانه ای با اندازه قابل توجه می تواند برای تصاحب آن آماده باشد: NBCUniversal. پس از برنامه‌ریزی‌شده آن از Comcast در اواسط سال ۲۰۲۷، تد ساراندوس، رئیس NBCU [ ] Netflix، پس از کناره‌گیری از تلاش پخش‌کننده برای خرید برادران وارنر. و HBO، گفت که نکته کلیدی او این بود که \"ما واقعا عضله M A خود را ساختیم.\" او دست خود را در مورد آنچه که نتفلیکس ممکن است در آینده دنبال کند، نگذاشته است، و تنها در ماه آوریل گفت که \"ما به صورت ارگانیک و فرصت طلبانه در این تجارت سرمایه گذاری می کنیم.\" در همین حال، مدیران Comcast، با اعلام برنامه‌های اسپین‌آف NBCU در ماه ژوئن، گفتند که شرکت رسانه‌ای را برای آماده کردن آن برای فروش جدا نمی‌کنند. اما هنگامی که در مورد احتمال M A پس از جدایی تحت فشار قرار گرفت، مایک کاوانا، مدیر عامل Comcast، که قرار است پس از اسپین، مدیر اجرایی NBCU شود، پیشنهاد داد که ممکن است معاملاتی در راه باشد. او به تحلیلگران وال استریت گفت، به‌عنوان یک شرکت مستقل، «اکنون این آزادی را خواهد داشت که کسب‌وکارهای مجاور را که در آن‌ها حق بازی داریم، کشف کند». جن فریدمن، افسر ارشد ارتباطات در بیانیه‌ای به Variety گفت: «ما از ابتدا گفته‌ایم که این چرخش را برای اهداف M A دنبال نمی‌کنیم. برنامه ما برای NBCU این است که کسب و کار را برای رشد آماده کنیم، و با توجه به کسب و کارهای پیشرو صنعت خود در جذاب ترین بخش های رسانه، استراتژی متفاوت و ترازنامه منحصر به فرد قوی ما، مسیری را برای انجام این کار می بینیم. نتفلیکس", "image_url": "https://variety.com/wp-content/uploads/2026/11/Mergers-Slot-Machine.jpg?w=1000&#038;h=563&#038;crop=1", "category": "هوش مصنوعی مولد", "tags": ["نتفلیکس", "سرمایه‌گذاری"], "datetime_fa": "۲۱ آبان • ۱۹:۰۰"}, {"source": "Variety", "title": "How Citrin Cooperman’s Arnie Herrmann Built a Career Rooted in ‘Trust and Service’", "link": "https://variety.com/2026/biz/news/arnie-herrmann-business-manager-variety-citrin-cooperman-1236944939/", "summary": "Arnie Herrmann was 22 years into his career as a business manager when he came face-to-face with a crisis that led him to a crossroads. At the time, Herrmann worked for the prominent New York-based firm of Starr and Company. The company was well known for representing stars and prominent figures in business. Herrmann had [ ]", "date_str": "2026-11-12T15:16:09+00:00", "hash": "2dacf01792148349", "title_fa": "چگونه آرنی هرمان از سیترین کوپرمن شغلی را ایجاد کرد که ریشه در «اعتماد و خدمات» داشت", "summary_fa": "آرنی هرمان 22 سال از زندگی حرفه ای خود به عنوان یک مدیر تجاری بود که با بحرانی روبرو شد که او را به یک دوراهی کشاند. در آن زمان، هرمان برای شرکت برجسته نیویورکی Starr and Company کار می کرد. این شرکت به دلیل نمایندگی از ستاره ها و چهره های برجسته در تجارت شناخته شده بود. هرمان [ ] برنده جایزه مدیر کسب و کار سال Variety به دلیل صداقت، شفافیت و روابط طولانی با مشتری، در حدود سال 2005، وضعیت Starr and Co. شروع به خراب شدن کرد بنیانگذار و مالک Kenneth I. Starr (نباید با دادستان فدرال فقید به همین نام اشتباه شود) شروع به رفتار نامنظم در زندگی شخصی خود کرد. با گذشت زمان، رفتار استار در حالی که چهارمین ازدواج خود را آغاز کرد، برای شرکت همنام او بازتاب داشت. بحران اقتصادی جهانی 2008-2009 و فوران رسوایی برنی مدوف فقط وضعیت را فوری تر کرد. مقصد استار برای زندان فدرال بود. در سال 2011، او به دلیل دزدی 33 میلیون دلار از مشتریانش در یک طرح پونزی به کلاهبرداری محکوم شد و به هفت سال و نیم محکوم شد. مانند بسیاری از کارمندان Starr and Co.، Herrmann از جزئیات آنچه در آن زمان در حال وقوع بود اطلاعی نداشت. اما او به وضوح می‌دانست که چیزی اشتباه است، و می‌دانست که شهرت طولانی مدت شرکت برای مقابله با طوفان کافی نیست. هرمان در ژانویه 2010 از شرکت استار استعفا داد تا به رقیبش سیترین کوپرمن بپیوندد. استار شش ماه بعد دستگیر شد و شرکت منفجر شد. هرمان می‌گوید: «من آنجا را ترک کردم که فقط به خاطر رفتار او از مراجعان خون می‌ریختیم. \"نیویورک می تواند یک مکان بسیار کوچک باشد. و در حالی که او در اطراف شهر نیویورک هیاهو می کرد، مردم نگران پول خود بودند.\"", "image_url": "https://variety.com/wp-content/uploads/2026/11/Arnie-Herrmann.jpg?crop=0px%2C1px%2C1500px%2C844px&#038;resize=1000%2C563", "category": "اقتصاد و بازرگانی", "tags": ["رسانه", "هنر"], "datetime_fa": "۲۱ آبان • ۱۸:۴۶"}, {"source": "Variety", "title": "International Cinematographers Guild Celebrates 100 Years of Solidarity and Storytelling", "link": "https://variety.com/2026/artisans/news/international-cinematographers-guild-100-years-1236945738/", "summary": "The International Cinematographers Guild (ICG), IATSE Local 600, will officially commemorate its 100th anniversary on Nov. 15, celebrating a century of standing up for workers and championing the artistry, innovation and storytelling of its members who have helped shape film and television around the world. The ICG’s lineage traces back to Nov. 15, 1926, with [ ]", "date_str": "2026-11-12T15:01:00+00:00", "hash": "5157ddc7fc4310b0", "title_fa": "انجمن بین المللی فیلمبرداران صدمین سال همبستگی و داستان سرایی را جشن گرفت", "summary_fa": "انجمن بین‌المللی سینماگران (ICG)، IATSE Local 600، صدمین سالگرد خود را در 15 نوامبر جشن می‌گیرد و یک قرن دفاع از کارگران و دفاع از هنر، نوآوری و داستان‌سرایی اعضای خود را که به شکل‌گیری فیلم و تلویزیون در سراسر جهان کمک کرده‌اند، جشن می‌گیرد. نسب ICG به 15 نوامبر 1926 باز می گردد، با [ ] تبار ICG به نوامبر بازمی گردد. 15، 1926، با اجاره IATSE Local 644 در نیویورک، که در ابتدا توسط پیشگامان دوربین های عصر خاموش سازماندهی شد که مصمم به استانداردسازی دستمزدها، ساعات کار و ایمنی در محل بودند. در سال 1996، افراد محلی دوربین 644 در نیویورک، 659 در لس آنجلس و 666 در شیکاگو ادغام شدند تا یک سازمان ملی ایجاد کنند. در سال 2002، ICG نیروهای خود را با انجمن تبلیغاتی (IATSE Local 818) ترکیب کرد و متخصصان دوربین و تبلیغات را تحت یک اتحادیه گرد هم آورد. داستان‌های مرتبط بررسی «چگونه از بانک سرقت کنیم»: نیکلاس هولت و زوئه کراویتز در یک فیلم دزدی از عصر تأثیرگذار به طرز آزاردهنده و هیجان‌انگیزی دستمزد خود را می‌گیرند جان لیندلی، ASC، رئیس ملی انجمن بین‌المللی فیلم‌برداران، می‌گوید: «برای 100 سال، قدرت اعضای این انجمن نشأت می‌گیرد. این صدمین سالگرد فرصتی برای ارج نهادن به کسانی است که پیش از ما آمده‌اند، از افرادی که این میراث را امروز به پیش می‌برند، تجلیل می‌کنیم، و تعهد خود را برای حفاظت از صنایع دستی، معیشت و صدای خلاق نسل‌های اعضای آینده تأیید می‌کنیم. این صنف مبارزه برای استانداردهای حیاتی کار در سراسر صنعت سرگرمی را رهبری کرده است، رهبری اصلاحات اساسی در ایمنی مجموعه، کاهش خستگی، حفاظت از سلامت و حقوق بازنشستگی چند کارفرمایی، و حفاظ‌های قراردادی سختگیرانه پیرامون اتوماسیون و فناوری‌های نوظهور.", "image_url": "https://variety.com/wp-content/uploads/2026/11/600_100Years.png?w=1000&#038;h=563&#038;crop=1", "category": "هوش مصنوعی مولد", "tags": ["سینما"], "datetime_fa": "۲۱ آبان • ۱۸:۳۱"}, {"source": "Variety", "title": "Brooklyn’s Iconic Domino Sugar Refinery to Host New Music Venue", "link": "https://variety.com/2026/music/news/brooklyn-domino-sugar-refinery-new-music-venue-1236945867/", "summary": "Domino, a new all-ages 750-capacity venue and creative hub, will open in April 2027 on the Williamsburg waterfront in Brooklyn, New York — located in the iconic, landmarked Domino Sugar Refinery that has been a beacon of the Brooklyn waterfront for more than a century. The new venue will feature concerts, club nights, art and [ ]", "date_str": "2026-11-12T15:00:00+00:00", "hash": "347ed97e3a2acb78", "title_fa": "پالایشگاه قند دومینو نمادین بروکلین میزبان مکان موسیقی جدید است", "summary_fa": "دومینو، یک مکان جدید با ظرفیت 750 سن و مرکز خلاقانه، در آوریل 2027 در اسکله ویلیامزبورگ در بروکلین، نیویورک - واقع در پالایشگاه قند نمادین و دیدنی دومینو که بیش از یک قرن چراغ راه آب نما بروکلین بوده، افتتاح می شود. مکان جدید دارای کنسرت‌ها، شب‌های باشگاهی، هنری و [ ] خواهد بود. محل برگزاری همچنین عضو انجمن ملی محل مستقل است و پلتفرم فروش بلیت آن پلتفرم مستقل دایس خواهد بود که به دلیل قیمت‌گذاری شفاف و پشتیبانی از سالن‌های مستقل معروف است. این مکان همچنین متعهد شده است که از فروش کالاهای هنرمند خودداری کند. شاید مهم‌تر از همه، این یک مکان مستقل جدید در یک شهر بزرگ است، در زمانی که مکان‌های مستقل توسط غول‌های سرگرمی زنده چند میلیارد دلاری درهم شکسته می‌شوند. بن لاوت، بنیانگذار TVG، نوازنده کیبورد و یکی از اعضای مؤسس مامفورد سانز، می‌گوید: «ویلیامزبرگ معرفی من به شهر نیویورک بود، همانطور که برای بسیاری از هنرمندان و نوازندگان بیست سال پیش بود. \"محله از آن زمان به شدت تغییر کرده است، اما برای دهه‌ها، مردم در مکان‌هایی مانند جایی که ما می‌سازیم به دنبال جامعه بوده و پیدا کرده‌اند. دومینو شانس ما برای ادامه آن است: جایی که هنرمندان می‌توانند ایده‌های خود را توسعه دهند، مخاطبان می‌توانند چیز جدیدی را کشف کنند، و همسایه‌ها احساس می‌کنند به آنها تعلق دارند. محله‌ها تغییر می‌کنند. نیاز به مکانی مانند این هرگز وجود ندارد.» جن لیون، مالک MeanRed Productions و رئیس انجمن مکان مستقل نیویورک، می‌گوید: «محل‌های مستقل محله‌های بروکلین و اقتصاد زندگی شبانه نیویورک را ایجاد کردند. \"امید ما این است که شهر و ایالت از ما به عنوان یک صنعت حمایت کنند زیرا از مکان جدید TVG Hospitality و روحیه مستقلی که به بروکلین می آورد استقبال می کنیم.\"", "image_url": "https://variety.com/wp-content/uploads/2026/11/GettyImages-1499886432.jpg?w=1000&#038;h=563&#038;crop=1", "category": "هوش مصنوعی مولد", "tags": ["موسیقی"], "datetime_fa": "۲۱ آبان • ۱۸:۳۰"}, {"source": "Billboard", "title": "Keith Sweat Helps Build ‘Twin Pillars’ for New Tubi Drama Series", "link": "https://www.billboard.com/music/rb-hip-hop/keith-sweat-twin-pillars-new-tubi-series-1236379964/", "summary": "Keith Sweat , the singer-songwriter behind R B/pop classics such as “Twisted,” “Nobody” and “I Want Her,” is raising his voice in another medium. He is executive producer of the new drama Twin Pillars: A Series . The show’s first three episodes will be introduced Nov. 16 on Tubi. Sweat — who also portrays club owner Snow in the series — is working in tandem with producer/ choreographer Darrin Dewitt Henson, who created, directed and also stars in Twin Pillars: A Series. Twin Pillars focuses on fraternal twins Dre (Henson) and Maurice ( General Hospital ’s Alimi Ballard) who are placed in the foster care system as youngsters when their parents are incarcerated. As the brothers move forward in different directions, the storyline delves into how childhood adversity, family separation and life s choices influence their identities and futures. In addition to Sweat and Henson, the Twin Pillars cast includes Fat Joe, Sean Anthony Baker and Crystal Coney. “Music has always been my way of connecting with people through stories that speak to real-life experiences,” Sweat commented in the press announcement. “As an executive producer and actor on Twin Pillars , I have the opportunity to bring that same passion for storytelling to television. This series explores family, adversity and the choices that shape our lives. Darrin has created something meaningful, and I m proud to help bring a story to audiences that not only entertains but also sparks important conversations about resilience, family and second chances.” Concurrently, Sweat is preparing for the 2027 release of a new single, “Think Love.” Beginning with his 1987 debut album Make It Last Forever, he has logged five consecutive No. 1 albums on Billboard’s Top R B/Hip-Hop Albums chart during his career. Sweat also earned another No. 1 album on that tally in 2008 with Just Me . Beyond work as a director-producer-choreographer, Henson’s resumé lists various film and television acting credits. Among those credits: BET’s hit drama The Family Business , Soul Food: The Series and Stomp the Yard . Describing Twin Pillars : A Series as “more than a story about two brothers,” Henson further explained, “It s about the circumstances that shape us, the decisions that define us and the family connections that remain even when life pulls us in different directions. I wanted to create a series that reflects the complexity of the human experience, particularly for children whose lives are disrupted by circumstances they did no", "date_str": "2026-11-12T15:00:00+00:00", "hash": "f617837796ce9e59", "title_fa": "کیت عرق به ساخت «ستون‌های دوقلو» برای مجموعه‌های درام جدید توبی کمک می‌کند", "summary_fa": "کیت عرق، خواننده و ترانه سرای کلاسیک های R B/Pop مانند \"Twisted\"، \"Nobody\" و \"I Want Her\" صدای خود را در رسانه دیگری افزایش می دهد. او تهیه کننده اجرایی درام جدید Twin Pillars: A Series است. سه قسمت اول سریال 16 نوامبر در توبی معرفی می شود. عرق - که در سریال اسنو مالک باشگاه را نیز به تصویر می‌کشد - با تهیه‌کننده/ طراح رقص دارین دیویت هنسون، که خالق، کارگردان و همچنین ستاره‌دار سریال Twin Pillars: A Series است، کار می‌کند. ستون‌های دوقلو بر دوقلوهای برادر دره (هنسون) و موریس (علیمی بالارد از بیمارستان عمومی) تمرکز می‌کند که وقتی والدینشان در حبس هستند، در دوران جوانی در سیستم مراقبت از خانواده قرار می‌گیرند. همانطور که برادران در جهات مختلف به جلو حرکت می کنند، خط داستان به این می پردازد که چگونه ناملایمات دوران کودکی، جدایی خانواده و انتخاب های زندگی بر هویت و آینده آنها تأثیر می گذارد. علاوه بر Sweat و Henson، بازیگران Twin Pillars شامل Fat Joe، Sean Anthony Baker و Crystal Coney هستند. Sweat در بیانیه مطبوعاتی اظهار داشت: \"موسیقی همیشه راه من برای برقراری ارتباط با مردم از طریق داستان هایی است که به تجربیات واقعی زندگی می پردازند.\" \"به عنوان یک تهیه کننده اجرایی و بازیگر در ستون های دوقلو، من این فرصت را دارم که همان اشتیاق به داستان سرایی را به تلویزیون بیاورم. این مجموعه به بررسی خانواده، ناملایمات و انتخاب هایی می پردازد که زندگی ما را شکل می دهند. دارین چیزی معنادار خلق کرده است، و من مفتخرم که به ارائه داستانی برای مخاطبان کمک می کنم که نه تنها سرگرم کننده است، بلکه جرقه گفتگوهای مهمی در مورد انعطاف پذیری، خانواده و فرصت های دوم نیز می دهد.\" همزمان، عرق در حال آماده شدن برای انتشار یک تک آهنگ جدید در سال 2027 به نام \"Think Love\"", "image_url": "https://www.billboard.com/wp-content/uploads/2026/11/Keith-Sweat-2026-press-cr-Denny-Mo-billboard-1800.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["سینما", "موسیقی"], "datetime_fa": "۲۱ آبان • ۱۸:۳۰"}, {"source": "Billboard", "title": "Noga Erez Announces Fourth Album, ‘Duck Season,’ Drops Dark Pop Banger Single ‘People, I Hope You Know the World Is Ending’", "link": "https://www.billboard.com/music/pop/noga-erez-fourth-album-duck-season-world-ending-single-tour-1236380163/", "summary": "Noga Erez has seen the future and it is bleak. But it also has a great, catchy beat. The Tel Aviv, Israel-based singer/rapper laments the spiraling madness of modern life her new single, People, I hope you know the world is ending, the first taste of her upcoming fourth studio album, Duck Season . With her signature wit and laconic vocal style, Erez lists the litany of dumpster fires in the rapped verses on the song on which she laments, They never stopped delivering all the boxes/ That s the one thing/ They got you to step outside and see what the bombs did/ On God, over a loping beat. She continues cleverly weighing in on the various conflicts in our personal and collective lives with the lines: Let s weigh the options/ I think what it comes down to is we do Prozac or chocolate, right?/ You don t gotta wait for a siren to start runnin / You ran, I ran/ Wait, should we just send Baron?/ If we want a happy ending we could just a war with Thailand/ Send the Mossad to get a massage/ Hands up if you were on the island! The song then bursts into its soaring, uniting chorus, on which Erez sings, People, I hope you know the world is ending/ Oh yeah/ Don t you look so sad/ Oh no/ I hope you know the world is ending/ Oh yeah/ But we re going down together. Duck Season is due out on Feb. 26 through Neon Gold/Atlantic Records and, according to a release announcing the project it, turns the absurdity of modern life into a sprawling, technicolor spectacle, taking aim at a world where outrage is instantaneous and everyone seems to be fair game. The album s title takes on the darker implications of open season , a time when shooting first has become instinctive and asking questions is almost beside the point. By the closing track, the target has grown even wider: humanity itself is in the crosshairs. The new 14-track LP was recorded alongside Erez s longtim ng’-Themed Escape Rooms in Cities Across the U.S. (Exclusive)", "link": "https://www.hollywoodreporter.com/tv/tv-news/disney-only-murders-in-the-building-escape-rooms-1236753565/", "summary": "The experience is inspired by the sixth season of the series, which will be set in London.", "date_str": "2026-11-12T15:00:00+00:00", "hash": "a9141fc05324d04b", "title_fa": "دیزنی اتاق های فرار با موضوع «فقط قتل در ساختمان» را در شهرهای سراسر ایالات متحده راه اندازی می کند (اختصاصی)", "summary_fa": "این تجربه الهام گرفته از فصل ششم سریال است که در لندن اتفاق می افتد. دیزنی اینترتینمنت روز پنجشنبه یک تجربه جدید اتاق فرار را با موضوع فقط قتل‌ها در ساختمان اعلام کرد. Hulu از Disney و The Escape Game در حال معرفی Only Murders in London هستند، یک ماجراجویی کاملاً جدید که از فصل ششم آینده سریال کمدی برنده امی الهام گرفته شده است. شروع از دسامبر. 9، تجربه فرار قبل از رفتن به لس آنجلس در میدتاون منهتن آغاز می شود. لینفیلد، ماساچوست؛ و واشنگتن، دی سی، تجربه جدید پس از اتاق های فرار قبلی فقط قتل ها در ساختمان در کالیفرنیا، نیویورک و تگزاس دنبال می شود. داستان‌های مرتبط TV FX به Gen Z کمدی بزرگسالان فصل سوم را تمدید می‌کند ویتنی لیویت برای ستاره‌دار شدن، نمایش واقعی هولو خودش را تولید می‌کند: «ما هیجان‌زده هستیم که با Disney Entertainment همکاری کنیم و فصل جدیدی از Hulu's Only Murders in the Building را در The Escape Game بازی بیاوریم.» \"با فصل ششم که به لندن می رود، ما فرصتی عالی برای تجسم مجدد تجربه با پیچ و تاب ها و شگفتی های تازه داشتیم. ما نمی توانیم منتظر باشیم تا طرفداران وارد داستان شوند و مهارت های کارآگاهی خود را آزمایش کنند. تجربه بازسازی شده مصادف با اولین فصل ششم سریال است که چارلز (استیو مارتین)، اولیور (مارتین شورت) و میبل (سلنا گومز) را برای اولین بار به خارج از کشور می‌روند و نیویورک سیتی را با لندن و تحقیقات بین‌المللی جدیدی را مبادله می‌کنند.", "image_url": "https://www.hollywoodreporter.com/wp-content/uploads/2025/10/177834_0905R-e1761655643219.jpg?w=1440&#038;h=810&#038;crop=1", "category": "هوش مصنوعی مولد", "tags": ["رسانه", "هنر"], "datetime_fa": "۲۱ آبان • ۱۸:۳ ت، رقابت داغ و جلیقه زردها می گوید: \"از نظر شغلی، این شلوغ ترین کاری است که من تا به حال داشته ام.\" در زمانی که کمدی‌های کمدی شبکه تقریباً منقرض شده‌اند و میانگین تعداد قسمت‌ها در یک فصل از کمدی‌های استریم که وجود دارند تک رقمی است (و این فصل‌ها تقریباً با فرکانس مشابه دنباله‌دار هالی می‌آیند)، مونتروسو مجیا توانسته است به چیزی تقریباً غیرممکن دست یابد:", "image_url": "https://www.hollywoodreporter.com/wp-content/uploads/2026/11/TALENT_NEXT-GEN-WEB-LEADS_20262-SPLASH-2026.jpg?w=1440&#038;h=810&#038;crop=1", "category": "هوش مصنوعی مولد", "tags": ["Apple", "سینما", "موسیقی", "نتفلیکس"], "datetime_fa": "۲۱ آبان • ۱۷:۳۰"}, {"source": "Hollywood Reporter", "title": "Rotterdam Film Festival, in Nod to ‘Backrooms’ and ‘Obsession,’ Sets Analog Horror 2.0 Focus", "link": "https://www.hollywoodreporter.com/movies/movie-news/rotterdam-2027-iffr-backrooms-nod-analog-horror-focus-1236753830/", "summary": "\"Recent horror hits, such as 'Obsession' and 'Backrooms,' mark the mainstream arrival of a cultural shift which has been in the making since the turn of the millennium.\" Also getting the focus treatment are Jordan Strafer, Slovenian filmmaker Andrej Zdravič, and the late Simon Field.", "date_str": "2026-11-12T14:00:00+00:00", "hash": "3200b2cfa10d0573", "title_fa": "جشنواره فیلم روتردام، در نود به «پشت‌خانه‌ها» و «وسواس»، فوکوس آنالوگ Horror 2.0 را تنظیم می‌کند.", "summary_fa": "فیلم‌های ترسناک اخیر، مانند «وسواس» و «پشت‌خانه‌ها» نشان‌دهنده ورود جریان اصلی یک تغییر فرهنگی است که از آغاز هزاره در حال شکل‌گیری بوده است.» جردن استرافر، فیلمساز اسلوونیایی آندری زدراویچ و سیمون فیلد فقید نیز تحت درمان قرار می گیرند. جشنواره بین‌المللی فیلم روتردام (IFFR) از برنامه‌های فوکوس خود برای نسخه ۲۰۲۷ خود، از جمله تمرکز بر فیلم ترسناک آنالوگ معاصر و نگاهی به آثار ایالات متحده، رونمایی کرد. هنرمند و فیلمساز جردن استرافر. برگزارکنندگان گفتند که روتردام همچنین «تأثیر ماندگار کاله بومان، تهیه‌کننده سوئدی را که شش دهه فعالیت او به شکل‌گیری نسل‌های فیلمساز کمک کرده است، جشن خواهد گرفت». برنامه‌ها با هم به بررسی ماهیت در حال تغییر سینما و افراد و تأثیراتی می‌پردازند که همچنان به شکل‌دهی آن ادامه می‌دهند، و دیدگاه‌های مختلف را گرد هم می‌آورند تا چگونگی ادامه تکامل رسانه، هم در صفحه و هم فراتر از آن را در نظر بگیرند.» تمرکز IFFR آنالوگ Nightmares 2.0 دارای اولین نمایش های جهانی مانند The Space Between اثر Joshua Garity و قسمت پایانی سریال YouTube Midwest Angelica: Landfall است که یک پروژه ترسناک، آنالوگ و کیهانی توسط استودیو AQ است. IFFR گفت: «آثارهای ترسناک اخیر، مانند Obsession و Backrooms، نشان دهنده ورود جریان اصلی یک تغییر فرهنگی است که از آغاز هزاره در حال شکل گیری بوده است. ترسناک آنالوگ با تکیه بر زیبایی‌شناسی رسانه‌های منسوخ، فیلم‌های یافت شده و پخش‌های تخیلی نگران‌کننده، زبان بصری و حساسیت متمایزی را ایجاد کرده است که توسط جوامع آنلاین، داستان‌گویی تعاملی و تخیل جمعی اینترنت شکل گرفته است. این پدیده با حرکت بین ویدیوهای آنلاین، بازی ها و بازی های واقعیت جایگزین، سینمای تئاتر و سایر اشکال ترانس مدیا، راه های جدیدی برای تجربه و درگیر شدن با وحشت ایجاد کرده است.", "image_url": "https://www.hollywoodreporter.com/wp-content/uploads/2026/11/The-Space-Between-film-still-IFFR-H-2026.jpg?w=1440&#038;h=810&#038;crop=1", "category": "هوش مصنوعی مولد", "tags": ["سینما"], "datetime_fa": "۲۱ آبان • ۱۷:۳۰"}, {"source": "Hollywood Reporter", "title": "LGBTQ Representation on TV Dropped in 2025-26, GLAAD Study Finds", "link": "https://www.hollywoodreporter.com/tv/tv-news/tv-lgbtq-representation-falls-2025-26-glaad-report-1236753347/", "summary": "Despite high-profile successes like 'Heated Rivalry,' the overall picture last season was less rosy.", "date_str": "2026-11-12T14:00:00+00:00", "hash": "d525ccbadae14540", "title_fa": "تحقیقات GLAAD نشان می دهد که نمایش LGBTQ در تلویزیون در سال 2025-26 کاهش یافته است", "summary_fa": "علیرغم موفقیت‌های برجسته‌ای مانند «رقابت داغ»، تصویر کلی فصل گذشته کمتر گلگون بود. علی‌رغم موفقیت‌های ناگهانی Heated Rivalry و برنده‌های متعدد امی برای Pluribus، فصل 2025-26 سال ضعیفی برای نمایندگی LGBTQ در تلویزیون بود. گزارش سالانه «جایی که هستیم» در تلویزیون GLAAD درباره وضعیت شخصیت‌های LGBTQ در سریال‌های فیلم‌نامه‌ای نشان می‌دهد که در فصل گذشته بازنمایی 25 درصد کاهش یافته است. این گزارش 369 شخصیت LGBTQ را در برنامه های پخش، پخش و شبکه های کابلی شمارش می کند که از 489 در فصل 2024-25 کمتر است. کاهش در میان شخصیت‌های تراجنسیتی به‌ویژه قابل توجه بود و از 33 نفر در سال‌های 2024-25 به تنها هفت نفر در فصل گذشته رسید - همه آنها در برنامه‌هایی که این فصل برنمی‌گردند. این لزوماً به این معنی نیست که در این فصل هیچ شخصیت ترنس در تلویزیون وجود نخواهد داشت، فقط نمایش‌هایی که آن هفت شخصیت در سال‌های 2025-2026 در آن ظاهر شدند، ادامه نمی‌یابند، چه به این دلیل که سریال‌های محدودی بودند، یا لغو شدند یا به اجرای مداوم پایان دادند. داستان‌های مرتبط رقابت شدید تلویزیون با نمایش‌های 4DX فیلم‌ها آغاز شد. آنها به شیوه هایی تهاجمی و خطرناک مورد هدف قرار گرفته اند. راینا دیرواتر، نویسنده اصلی گزارش و معاون مدیر تحقیقات سرگرمی و تجزیه و تحلیل موسسه رسانه ای GLAAD، گفت که زندگی از دست رفته است. اغلب می‌بینیم که رسانه‌ها آن را منعکس می‌کنند، و به دلیل بسیاری از گفتگوهای سیاسی، تعجب آور نیست که شاهد سقوط نمایندگان ترنس در تلویزیون باشیم. اما بسیار ناامید کننده است، به خصوص وقتی هنرمندان ترنس بزرگ زیادی وجود دارند که داستان های شگفت انگیزی را تعریف می کنند. در حال حاضر، نمایش‌های آن‌ها با نور سبز روشن نمی‌شوند، بنابراین باید در خارج از مکان‌های سنتی به آن‌ها بگویند.", "image_url": "https://www.hollywoodreporter.com/wp-content/uploads/2026/01/hudson-williams-connor-storrie_3-H-2026.jpg?w=1296&#038;h=730&#038;crop=1", "category": "هوش مصنوعی مولد", "tags": ["عامل‌های هوشمند", "سینما"], "datetime_fa": "۲۱ آبان • ۱۷:۳۰"}, {"source": "Hollywood Reporter", "title": "John Malkovich Recalls Spike Jonze’s Surprising Feedback for ‘Being John Malkovich’ in ’60 Minutes’ First Look", "link": "https://www.hollywoodreporter.com/movies/movie-news/john-malkovich-60-minutes-first-look-wild-horse-nine-1236753713/", "summary": "The actor's segment with Ariel Levy airs Sunday, timed to his acclaimed performance in 'Wild Horse Nine.'", "date_str": "20 ior LLP as an Associate (EXCLUSIVE)", "link": "https://variety.com/2026/tv/news/former-netflix-exec-grant-hamilton-weinstein-senior-associate-1236945691/", "summary": "Former Netflix exec Grant Hamilton has joined law firm Weinstein Senior LLP as an associate. It s a homecoming for Hamilton, who had previously worked with Weinstein Senior founding partners Todd Weinstein and Tara Senior at Del Shaw Moonves. Hamilton will help expand Weinstein Senior’s unscripted content practice, including creators and production companies across development, production [ ]", "date_str": "2026-11-12T15:00:00+00:00", "hash": "63e74694b437b126", "title_fa": "مدیر سابق نتفلیکس، گرانت همیلتون، به عنوان یک همکار به Weinstein Senior LLP می پیوندد (انحصاری)", "summary_fa": "گرانت همیلتون، مدیر اجرایی سابق نتفلیکس، به عنوان شریک به شرکت حقوقی Weinstein Senior LLP پیوست. این یک بازگشت به خانه برای همیلتون است که قبلاً با شرکای بنیانگذار Weinstein Senior تاd Weinstein و Tara Senior در Del Shaw Moonves کار کرده بود. همیلتون به گسترش فعالیت محتوای بدون اسکریپت واینستین ارشد، از جمله سازندگان و شرکت‌های تولید در سراسر توسعه، تولید کمک خواهد کرد. ما او را در دل شاو استخدام کردیم و آموزش دادیم، و زمانی که به نتفلیکس نقل مکان کرد، من و تارا از نزدیک در ارتباط بودیم و در طول سفرش به او آموزش می دادیم. ما هیجان زده هستیم که در این زمان هیجان انگیز در شرکت، در حالی که تمرینات بدون نسخه خود را افزایش می دهیم، دوباره با او متحد می شویم.\" در نتفلیکس، همیلتون روی تیم تولید فیزیکی فیلمنامه‌نویسی، مدیریت تولید در بخش‌های مختلف از جمله مدیران عکاسی، خدمه، مکان‌ها و روابط فروشنده تا راه‌اندازی خدمات، کار کرد. قبل از نتفلیکس، همیلتون یکی از همکاران دل شاو مونوز بود و در کنار بنیانگذاران واینستین، تاد واینستین و تارا سنیور کار می کرد. همیلتون در بیانیه‌ای گفت: \"من از پیوستن به واینستین ارشد و کار دوباره با تاد، تارا و میچ، افرادی که عمیقاً به آنها احترام می‌گذارم و آنها را تحسین می‌کنم، هیجان‌زده هستم. واقعاً احساس می‌کنم به خانه می‌آیم. من هیجان‌زده هستم که تجربه تولید خود را به شرکت بیاورم و به حمایت از کار ate": "۹ سپتامبر ۲۰۲۶", "url": "https://rezjalibd.github.io/daily-news/archive/2026-09-09.html"}, {"date_key": "2026-09-07", "p_date": "۱۶ شهریور ۱۴۰۵", "g_date": "۷ سپتامبر ۲۰۲۶", "url": "https://rezjalibd.github.io/daily-news/archive/2026-09-07.html"}];

    let currentTab = 'persian';
    let searchQuery = '';
    let readArticles = new Set(JSON.parse(localStorage.getItem('read_articles_registry') || '[]'));

    function toFaDigits(n) {
      const f = ['۰','۱','۲','۳','۴','۵','۶','۷','۸','۹'];
      return n.toString().replace(/\d/g, d => f[d]);
    }

    function toggleRead(hash) {
      if (readArticles.has(hash)) {
        readArticles.delete(hash);
      } else {
        readArticles.add(hash);
      }
      localStorage.setItem('read_articles_registry', JSON.stringify(Array.from(readArticles)));
      renderNews();
    }

    function renderNews() {
      const container = document.getElementById('newsContainer');
      const rawItems = data[currentTab] || [];
      
      const filtered = rawItems.filter(item => {
        if (!searchQuery) return true;
        const q = searchQuery.toLowerCase();
        const title = (item.title_fa || item.title || '').toLowerCase();
        const summary = (item.summary_fa || item.summary || '').toLowerCase();
        const source = (item.source || '').toLowerCase();
        const category = (item.category || '').toLowerCase();
        const tags = (item.tags || []).join(' ').toLowerCase();
        return title.includes(q) || summary.includes(q) || source.includes(q) || category.includes(q) || tags.includes(q);
      });

      const unreadList = [];
      const readList = [];

      filtered.forEach(item => {
        if (readArticles.has(item.hash)) {
          readList.push(item);
        } else {
          unreadList.push(item);
        }
      });

      const sortedItems = [...unreadList, ...readList];

      if (sortedItems.length === 0) {
        container.innerHTML = '<div style="text-align:center; padding: 40px; color: var(--text-muted);">هیچ خبری در این بخش در ۲۴ ساعت گذشته ثبت نشده است.</div>';
        return;
      }

      container.innerHTML = sortedItems.map((item, idx) => {
        const title = item.title_fa || item.title || '';
        const summary = item.summary_fa || item.summary || '';
        const source = item.source || 'منبع خبر';
        const link = item.link || '#';
        const isRead = readArticles.has(item.hash);
        const num = toFaDigits(idx + 1);
        const category = item.category || '';
        const tags = item.tags || [];
        const datetimeFa = item.datetime_fa || '';

        return `
          <article class="news-card ${isRead ? 'is-read' : ''}" id="card-${item.hash}">
            <div class="news-header">
              <span class="news-num">${isRead ? '✓' : num}</span>
              <h2 class="news-title">${title}</h2>
            </div>
            ${summary ? `<p class="news-summary">${summary}</p>` : ''}
            <div class="news-footer">
              <div class="footer-top-row">
                <div class="meta-group">
                  <span class="news-source">📌 ${source}</span>
                  ${datetimeFa ? `<span class="news-datetime">🕒 ${datetimeFa}</span>` : ''}
                  ${category ? `<span class="news-category-badge" onclick="filterByTag('${category}')">📂 ${category}</span>` : ''}
                </div>
              </div>
              ${tags && tags.length > 0 ? `
                <div class="footer-tags-row">
                  ${tags.map(t => `<span class="news-tag-chip" onclick="filterByTag('${t}')">#${t}</span>`).join('')}
                </div>
              ` : ''}
              <div class="footer-bottom-row">
                <div class="footer-actions-right">
                  <button class="btn-mark-read" onclick="toggleRead('${item.hash}')">
                    ${isRead ? '✓ خوانده شد' : '○ علامت خوانده‌شده'}
                  </button>
                </div>
                <div class="footer-actions-left">
                  ${link && link.startsWith('http') ? `<a href="${link}" target="_blank" rel="noopener noreferrer" class="news-link">مطالعه اصل خبر ↗</a>` : ''}
                </div>
              </div>
            </div>
          </article>
        `;
      }).join('');
    }

    function filterByTag(val) {
      const searchInput = document.getElementById('searchInput');
      if (searchInput) {
        searchInput.value = val;
        searchQuery = val;
        renderNews();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    }

    function switchTab(tab, el) {
      currentTab = tab;
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      if (el) el.classList.add('active');
      renderNews();
    }

    function toggleTheme() {
      const html = document.documentElement;
      const current = html.getAttribute('data-theme') || 'dark';
      const next = current === 'dark' ? 'light' : 'dark';
      html.setAttribute('data-theme', next);
      localStorage.setItem('theme', next);
      updateThemeButton(next);
    }

    function updateThemeButton(theme) {
      const icon = document.getElementById('themeIcon');
      const text = document.getElementById('themeText');
      if (theme === 'dark') {
        icon.textContent = '☀️';
        text.textContent = 'حالت روشن';
      } else {
        icon.textContent = '🌙';
        text.textContent = 'حالت تاریک';
      }
    }

    function toggleArchiveModal(show) {
      const modal = document.getElementById('archiveModal');
      if (show) {
        renderArchiveList();
        modal.classList.add('active');
      } else {
        modal.classList.remove('active');
      }
    }

    function renderArchiveList() {
      const listContainer = document.getElementById('archiveListContainer');
      if (!archiveManifest || archiveManifest.length === 0) {
        listContainer.innerHTML = '<div style="text-align:center; padding: 20px; color: var(--text-muted);">هنوز شماره قبلی ثبت نشده است.</div>';
        return;
      }

      listContainer.innerHTML = archiveManifest.map(item => `
        <a href="${item.url}" class="archive-item">
          <div>
            <div class="archive-date-fa">📰 شماره ${item.p_date}</div>
            <div class="archive-date-g">🌍 ${item.g_date}</div>
          </div>
          <span class="archive-arrow">←</span>
        </a>
      `).join('');
    }

    const savedTheme = localStorage.getItem('theme') || 'dark';
    document.documentElement.setAttribute('data-theme', savedTheme);
    updateThemeButton(savedTheme);

    document.getElementById('searchInput').addEventListener('input', (e) => {
      searchQuery = e.target.value.trim();
      renderNews();
    });

    renderNews();
  </script>
