  <link rel="preconnect" href="https://fonts.googleapis.com">

  <style>

    :root[data-theme="light"] {

      --card-bg: #ffffff;
      --card-border: #e2e8f0;

      border: 1px solid var(--toggle-border);
      color: var(--text);

      border-radius: 12px;

      padding: 4px 12px;
      border-radius: 9999px;
    }
    .search-box {
      margin-bottom: 18px;
    }

      gap: 8px;
      margin-bottom: 20px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      padding-bottom: 4px;
    }
    .tabs::-webkit-scrollbar {
      display: none;
    }
    .tab-btn {
      flex: 1;
      white-space: nowrap;
      padding: 12px 14px;
      border-radius: 12px;
      background: var(--tab-bg);
      border: 1px solid var(--tab-border);
      color: var(--tab-text);
      font-size: 0.92rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;

      transition: all 0.2s ease;
      flex-shrink: 0;

    .tab-btn.active {

      flex-direction: column;
      gap: 16px;

      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 20px;
      transition: all 0.25s ease;

      position: relative;

      border-color: var(--primary);
      transform: translateY(-2px);
    }

      border-color: var(--read-border);
      opacity: 0.7;
    }
    .news-card.is-read:hover {
      opacity: 0.95;
    }
    .news-header {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 12px;
    }
    .news-num {
      background: var(--badge-bg);
      color: var(--primary);
      font-weight: 700;
      font-size: 0.85rem;
      min-width: 30px;
      height: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      margin-top: 2px;
      flex-shrink: 0;
    }
    .news-card.is-read .news-num {
      background: rgba(16, 185, 129, 0.15);
      color: var(--success);
    }
    .news-title {
      font-size: 1.1rem;
      font-weight: 700;
      line-height: 1.6;
      flex: 1;
    }
    .news-summary {
      font-size: 0.94rem;
      color: var(--text-muted);
      margin-bottom: 14px;
      text-align: justify;
      line-height: 1.75;
    }
    .news-footer {
      display: flex;
      flex-direction: column;
      gap: 10px;
      border-top: 1px solid rgba(128, 128, 128, 0.12);
      padding-top: 12px;
      font-size: 0.85rem;
    }
    .footer-top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
    }
    .meta-group {
      display: inline-flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      font-size: 0.82rem;
    }
    .news-source {
      color: var(--text-muted);
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .news-datetime {
      color: var(--text-muted);
      font-size: 0.78rem;
      background: rgba(148, 163, 184, 0.08);
      padding: 2px 7px;
      border-radius: 6px;
      border: 1px solid rgba(148, 163, 184, 0.15);

    .news-category-badge {
      display: inline-flex;
      align-items: center;
      background: var(--badge-bg);
      color: var(--primary);
      border: 1px solid rgba(56, 189, 248, 0.25);
      border-radius: 6px;
      padding: 2px 8px;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .news-category-badge:hover {
      background: var(--primary);
      color: #0f172a;
      transform: translateY(-1px);
    }
    .footer-tags-row {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;

      display: inline-flex;
      align-items: center;
      font-size: 0.75rem;
      color: var(--text-muted);
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--card-border);
      padding: 1px 7px;
      border-radius: 5px;
      cursor: pointer;
      transition: all 0.2s ease;
      font-weight: 500;
    }
    .news-tag-chip:hover {
      color: var(--primary);
      border-color: var(--primary);
      background: var(--badge-bg);
      transform: translateY(-1px);
    }
    .footer-bottom-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      border-top: 1px dashed rgba(128, 128, 128, 0.12);
      padding-top: 10px;
      margin-top: 4px;
    }
    .footer-actions-right {
      display: flex;
      align-items: center;
    }
    .footer-actions-left {
      display: flex;
      align-items: center;
      margin-right: auto;
    }
    .btn-mark-read {
      background: transparent;
      border: 1px solid var(--toggle-border);
      color: var(--text-muted);
      padding: 4px 10px;
      border-radius: 8px;
      font-size: 0.8rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-weight: 600;
      transition: all 0.2s ease;
    }
    .btn-mark-read:hover {
      border-color: var(--success);
      color: var(--success);
    }
    .news-card.is-read .btn-mark-read {
      background: rgba(16, 185, 129, 0.15);
      border-color: var(--success);
      color: var(--success);
    }
    .news-link {
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
      transition: color 0.2s ease;
    }
    .news-link:hover {
      text-decoration: underline;
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 16px;
    }
    .modal-overlay.active {
      display: flex;
    }
    .modal-card {
      background: var(--modal-bg);
      border: 1px solid var(--modal-border);
      border-radius: 18px;
      width: 100%;
      max-width: 520px;
      max-height: 80vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
      animation: modalFadeIn 0.2s ease;
    }
    @keyframes modalFadeIn {
      from { transform: scale(0.95); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
    .modal-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--card-border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .modal-title {
      font-size: 1.15rem;
      font-weight: 700;
    }
    .btn-close {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 1.4rem;
      cursor: pointer;
      line-height: 1;
      padding: 4px;
    }
    .btn-close:hover {
      color: var(--text);
    }
    .modal-body {
      padding: 16px 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .archive-item {
      background: var(--bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      text-decoration: none;
      color: var(--text);
      transition: all 0.2s ease;
    }
    .archive-item:hover {
      border-color: var(--primary);
      transform: translateX(-4px);
    }
    .archive-date-fa {
      font-weight: 700;
      font-size: 0.95rem;
    }
    .archive-date-g {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 2px;
    }
    .archive-arrow {
      color: var(--primary);
      font-size: 1.1rem;
    }

    @media (max-width: 640px) {
      header { padding: 18px 14px; padding-top: 56px; }
      .header-actions { top: 12px; left: 12px; width: calc(100% - 24px); justify-content: space-between; }
      .btn-action { font-size: 0.78rem; padding: 6px 9px; }

      .tabs { gap: 6px; }
      .tab-btn { padding: 10px 10px; font-size: 0.84rem; gap: 6px; }
      .badge { padding: 1px 5px; font-size: 0.75rem; }
      .news-card { padding: 16px; }
      .news-title { font-size: 0.98rem; }
      .news-summary { font-size: 0.88rem; }
      .news-footer { flex-direction: column; align-items: stretch; gap: 10px; }
      .footer-bottom-row { width: 100%; display: flex; justify-content: space-between; align-items: center; }
    }
  </style>
</head>

مای ساتو و هیئت حقیقت‌یاب سازمان ملل نسبت به تشدید سرکوب در ایران هشدار دادند. نمایندۀ جمهوری چک نیز در نشست مجمع عمومی به تهدیدهای اخیر علیه رادیوفردا در پراگ اشاره کرد.", "date_str": "2026-10-29T16:18:50+00:00", "hash": "e4f72a1aa7508c5f", "title_fa": "گزارش ساتو از تبعات جنگ و سرکوب در ایران؛ اشاره نمایندۀ چک به تهدید علیه رادیوفردا", "summary_fa": "مای ساتو و هیئت حقیقت‌یاب سازمان ملل نسبت به تشدید سرکوب در ایران هشدار دادند. نمایندۀ جمهوری چک نیز در نشست مجمع عمومی به تهدیدهای اخیر علیه رادیوفردا در پراگ اشاره کرد. مای ساتو، گزارشگر ویژۀ سازمان ملل در امور حقوق بشر ایران، و هیئت مستقل حقیقت‌یاب این سازمان در نشست مجمع عمومی سازمان ملل هشدار دادند که جنگ و سرکوب داخلی، وضعیت حقوق بشر در ایران را وخیم‌تر کرده‌ است. هیئت حقیقت‌یاب همچنین اعلام کرد که سرکوب اعتراضات دی‌ماه ۱۴۰۴ از سوی جمهوری اسلامی شامل اقداماتی بوده که مصداق «جنایت علیه بشریت» است. در جریان این نشست، نمایندۀ جمهوری چک نیز با اشاره به تهدیدهای اخیر علیه رادیو اروپای آزاد/رادیو آزادی و رادیوفردا در پراگ، این اقدامات را نمونه‌ای از اعمال فشار حکومت جمهوری اسلامی بر رسانه‌های مستقل و روزنامه‌نگاران حتی در خارج از مرزهای ایران دانست. نشست کمیتۀ سوم مجمع عمومی سازمان ملل متحد روز چهارشنبه ششم آبان با حضور مای ساتو، نمایندۀ هیئت مستقل بین‌المللی حقیقت‌یاب دربارۀ ایران و نمایندگان کشورهای عضو برگزار شد. مای ساتو در سخنان خود گفت آنچه در گزارش تازه‌اش ارائه می‌کند، در دو سال فعالیتش به‌عنوان گزارشگر ویژه بی‌سابقه بوده است: مردمی که هم‌زمان با حملات نظامی خارجی، از سوی حکومت خود نیز با تهدید، بازداشت، شکنجه، ناپدیدسازی قهری و اعدام مواجه بوده‌اند. او تأکید کرد که «تهاجم خارجی و سرکوب داخلی» نه‌تنها جای یکدیگر را نگرفته‌اند، بلکه پیامدهای یکدیگر را تشدید کرده‌اند. به‌گفتۀ گزارشگر ویژه، مقام‌های جمهوری اسلامی از جنگ و تحریم‌ها به‌عنوان پوششی برای سرکوب استفاده کرده و معترضان را عوامل قدرت‌های خارجی معرفی کرده‌اند. ساتو همچنین گفت طرف‌های خارجی درگیر جنگ، یعنی آمریکا و اسرائیل، نیز برای توجیه اقدامات خود به سرکوب داخلی در ایران استناد می‌کنند؛ در حالی که مردم ایران متحمل پیامدهای هر دو شده‌اند.", "image_url": ت کشور» و «تبلیغ علیه نظام» به تحمل حبس سنگین و ممنوعیت اشتغال به شغل مرتبط با اتهامات و فعالیت در شبکه‌های اجتماعی به مدت دو سال محکوم شده بود، در شعبه ۳۶ دادگاه تجدیدنظر تهران به تحمل هشت‌سال حبس که ۵سال آن قابل اجراست، محکوم شده است. بر اساس این اطلاعات، خانم هرسینی پیش‌تر از سوی دادگاه انقلاب تهران بابت اتهام «تبلیغ علیه نظام»، به تحمل ۱۳ماه حبس تعزیری، بابت اتهام «توهین به رهبری» به ۲۵ماه حبس، «اهانت به مقدسات»، ۵سال و دو ماه و «اجتماع و تبانی»، ۵سال و یک‌ماه حبس تعزیری محکوم شده بود. همچنین این شهروند ۳۹ساله به مجازات تکمیلی منع از اشتغال به شغل معین و مرتبط با فعالیت در شبکه‌های اجتماعی برای مدت دو سال نیز محکوم شده بود. شعبه ۳۶دادگاه تجدیدنظر حکم او را بابت اتهام تبلیغ علیه نظام به یک سال، اتهام توهین به رهبر، ۲سال و بابت اتهام توهین به مقدسات، ۵ سال اعلام کرده است. این حکم قطعی و قابل‌ اجراست. در این بخش ایران وایر می‌توانید با مسوولان تماس بگیرید و کارزار خود را برای مشکلات مختلف راه‌اندازی کنید با ایران‌وایر همکاری کنید ویدیوها و مطالب خود را برای ما بفرستید", "image_url": "https://static.prod.iranwire.com/_versions_jpeg/articleslide/%D9%85%D9%87%D8%B2%D8%A7%D8%AF_%D9%87%D8%B1%D8%B3%DB%8C%D9%86%DB%8C_%DB%B1_vLRf__v1024x512__box_0%2C14%2C640%2C350.jpeg", "category": "امنیت سایبری و شبکه", "tags": ["امنیت سایبری"], "datetime_fa": "۷ آبان • ۱۹:۱۲"}, {"source": "BBC Persian", "title": "دست‌کم ۱۴ نفر در حمله پهپادی روسیه به یک ایستگاه قطار در اوکراین کشته شدند", "link": "https://www.bbc.com/persian/articles/ckly06j4dqdxo?at_medium=RSS&at_campaign=rss", "summary": "مقام‌های اوکراینی می‌گویند در پی اصابت یک پهپاد روسی مجهز به موتور جت به سکوی شلوغ ایستگاه راه‌آهن شهر دنیپرو دست‌کم ۱۴ نفر کشته شدند. به گفته مقام‌های محلی، در این حمله دست‌کم ۱۴ نفر دیگر نیز مجروح شده‌اند.", "date_str": "2026-10-29T14:44:10+00:00", "hash": "ff94cb6737925ac3", "title_fa": "دست‌کم ۱۴ نفر در حمله پهپادی روسیه به یک ایستگاه قطار در اوکراین کشته شدند", "summary_fa": "مقام‌های اوکراینی می‌گویند در پی اصابت یک پهپاد روسی مجهز به موتور جت به سکوی شلوغ ایستگاه راه‌آهن شهر دنیپرو دست‌کم ۱۴ نفر کشته شدند. به گفته مقام‌های محلی، در این حمله دست‌کم ۱۴ نفر دیگر نیز مجروح شده‌اند. بر اساس گزارش‌ها، قربانیان در انتظار سوار شدن به قطار بودند. رئیس شبکه راه آهن اوکراین گفته است با آنکه پیش از این حمله، سطح هشدار امنیتی در شهر دنیپرو افزایش یافته بود، باز هم شماری از مسافران در ایستگاه جمع شده بودند. ولودیمیر زلنسکی، رئیس جمهور اوکراین گفت روسیه به محلی حمله کرده که مسافران عادی منتظر سوار شدن به یک قطار شهری بودند. او بار دیگر از آمریکا، اروپا و کشورهای عضو گروه هفت خواست تحریم‌های بیشتری علیه مسکو اعمال کنند. وزارت دفاع روسیه ادعای حمله به اهداف غیرنظامی را رد کرده و گفته حمله به شبکه راه آهن اوکراین بخشی از حملات به زیرساخت‌هایی است که برای نقل و انتقالات نظامی استفاده می‌شود. هم‌زمان مقامات اوکراینی از کشته شدن دو دختر نوجوان در حمله موشکی روسیه به شهر چرنیهیف خبر دادند. به گفته این مقامات دست‌کم یازده نفر دیگر که بیشتر آنها کودک بودند، در این حمله زخمی شدند. در خبری دیگر، روسیه حمله پهپادی اوکراین به مسکو را محکوم کرده است. این حمله در زمانی صورت گرفته که مسکو میزبان نشست روسیه-آفریقا با حضور بیش از بیست رهبر آفریقایی است. دیمیتری پسکوف، سخنگوی کرملین زمان این حمله را «بسیار نامتعارف» خوانده است. به گفته سرگئی سوبیانین، شهردار مسکو، بیش از ششصد پهپاد اوکراینی، در طول شب به این منطقه حمله کردند که بیشتر آنها رهگیری شد. در هفته‌های اخیر، اوکراین حملات به خاک روسیه را با هدف آسیب رساندن به زیرساخت‌های این کشور بیشتر کرده است. مقام‌های اوکراینی گفته‌اند مردم عادی روسیه باید تاثیرات جنگ را حس کنند.", "image_url": "https://ichef.bbci.co.uk/news/1200/branded_persian/b8b9/live/f95e0ce0-d39e-11f1-abc7-23eff3a47521.jpg", "category": "امنیت سایبری و شبکه", "tags": ["روابط بین‌الملل"], "datetime_fa": "۷ آبان • ۱۸:۱۴"}, {"source": "BBC Persian", "title": "نقش احزاب عرب در شرایطی که نتانیاهو و آیزنکوت پیروز نشوند", "link": "https://www.bbc.com/persian/articles/cx1l3912rq7zo?at_medium=RSS&at_campaign=rss", "summary": "با شمارش آرا انتخابات پارلمانی اسرائیل، این پرسش مطرح شده که در صورت برنده نشدن نتانیاهو و آیزنکوت، نقش احزاب عربی در سیاست این کشور چه خواهد بود", "date_str": "2026-10-29T14:31:22+00:00", "hash": "b4000f19212b98fc", "title_fa": "نقش احزاب عرب در شرایطی که نتانیاهو و آیزنکوت پیروز نشوند", "summary_fa": "با شمارش آرا انتخابات پارلمانی اسرائیل، این پرسش مطرح شده که در صورت برنده نشدن نتانیاهو و آیزنکوت، نقش احزاب عربی در سیاست این کشور چه خواهد بود با شمارش بیش از۹۰ درصد آرای انتخابات اسرائیل، رسانه‌های اصلی این کشور گزارش داده‌اند که ائتلاف بنیامین نتانیاهو متشکل از احزاب راستگرا و راست افراطی و یهودیان بنیادگرا، در مسیر کسب ۵۳ کرسی پارلمان قرار دارد؛ بسیار بیشتر از ۴۸ کرسی ائتلاف مخالف به رهبری گادی آیزنکوت. اما بی‌سابقه‌ترین نتیجه را احزاب عرب‌ها و فلسطینی‌های اسرائیل به‌دست آوردند که با مشارکت بالا ۱۹ کرسی کنست، پارلمان اسرائیل، را به دست خواهند آورد. با شمارش آرای غیابی، نتایج هنوز ممکن است تغییر کند اما پیروزی گادی آیزنکوت هر لحظه دورتر به نظر می‌رسد. به نظر می‌رسد بنیامین نتانیاهو، نخست‌وزیر کهنه‌کار اسرائیل، عملکردی بهتر از آنچه پیش‌بینی می‌شد داشته و حزب لیکود او به بزرگ‌ترین حزب منفرد تبدیل شده است. با حضور پرشمار ۷۷ درصدی رأی‌دهندگان اسرائیلی در پای صندوق‌های رأی، به‌طور گسترده پیش‌بینی می‌شد که بن‌بستی پرماجرا شکل بگیرد. در نظام سیاسی چندپاره اسرائیل، نشانه‌ها حاکی از آن است که رقیب اصلی نتانیاهو، گادی آیزنکوت، رئیس پیشین ارتش، برای دستیابی به اکثریت پارلمانی بدون احزابی که از سوی اقلیت عرب اسرائیل رهبری می‌شوند، با دشواری روبه‌رو خواهد شد. بخشی از نتایج حاکی از آن است که این احزاب تعداد کرسی‌های رکوردشکن قبلی خود را حفظ کرده‌اند یا بر آن افزوده‌اند. در جریان کارزار انتخاباتی، بیشتر احزاب یهودی مخالف دولت متعهد شدند با فهرست‌های انتخاباتی عمدتا عرب همکاری نکنند و دلیل آن را نبود ارزش‌های مشترک عنوان کردند. خبرنامه بی‌بی‌سی فارسی گزیده‌ای از مهم‌ترین خبرها، گزارش‌های میدانی و گفت‌وگوهای اختصاصی را هر هفته در ایمیل خود دریافت کنید. با این حال، اگر سایر گروه‌ها حاضر به همکاری با آن‌ها باشند، احزاب تحت رهبری اعراب اسرائیل می‌توانند به بازیگران تعیین‌کننده تبدیل شوند.", "image_url": "https://ichef.bbci.co.uk/news/1200/branded_persian/8c43/live/a1cef160-d3a3-11f1-a5cd-49637fcbd4e4.jpg", "category": "سینما و سریال" "title_fa": "شلیک منجر به قتل شهردار جونِقان در استان چهارمحال و بختیاری", "summary_fa": "خبرگزاری میزان رسانه قوه قضاییه به‌نقل از مقامات قضایی و انتظامی استان چهارمحال و بختیاری، از کشته شدن «اسماعیل سلامی باباحیدری»، شهردار ... به گفته رییس دادگستری شهرستان فارسان این حادثه بامداد چهارشنبه، ششم آبان۱۴۰۵، در شهرستان فارسان رخ داده و پرونده قضایی برای روشن شدن ابعاد آن تشکیل شده است. «عبدالعلی ارژنگ»، معاون سیاسی و امنیتی استاندار چهارمحال و بختیاری، در گفت‌وگو با خبرگزاری «ایرنا» ضمن تایید این حادثه اعلام کرده است که ماجرا «امنیتی» نبوده است. با این‌همه توضیح بیشتری درباره چگونگی وقوع تیراندازی یا هویت عامل یا عاملان آن ارایه نشده است. «حسین امجدیان«، فرمانده انتظامی چهارمحال و بختیاری، از آغاز تحقیقات پلیس برای شناسایی عامل یا عاملان تیراندازی خبر داده است اما دربارۀ انگیزۀ قتل یا افراد مظنون به دست داشتن در آن جزییاتی به رسانه‌ها ارایه نشده است. در این بخش ایران وایر می‌توانید با مسوولان تماس بگیرید و کارزار خود را برای مشکلات مختلف راه‌اندازی کنید با ایران‌وایر همکاری کنید ویدیوها و مطالب خود را برای ما بفرستید", "image_url": "https://static.prod.iranwire.com/_versions_jpeg/articleslide/%D8%AC%D9%88%D9%86%D9%82%D8%A7%D9%86_SWYd__v1024x512__box_0%2C75%2C1200%2C706.jpeg", "category": "هوش مصنوعی مولد", "tags": ["رویداد", "گزارش"], "datetime_fa": "۷ آبان • ۱۷:۵۶"}, {"source": "IranWire", "title": "تلاش علی انصاری برای جلوگیری از فروش اموال مجتبی خامنه‌ای در لندن", "link": "https://iranwire.com/fa/news-1/159536-%D8%AA%D9%84%D8%A7%D8%B4-%D8%B9%D9%84%DB%8C-%D8%A7%D9%86%D8%B5%D8%A7%D8%B1%DB%8C-%D8%A8%D8%B1%D8%A7%DB%8C-%D8%AC%D9%84%D9%88%DA%AF%DB%8C%D8%B1%DB%8C-%D8%A7%D8%B2-%D9%81%D8%B1%D9%88%D8%B4-%D8%A7%D9%85%D9%88%D8%A7%D9%84-%D9%85%D8%AC%D8%AA%D8%A8%DB%8C-%D8%AE%D8%A7%D9%85%D9%86%D9%87%D8%A7%DB%8C-%D8%AF%D8%B1-%D9%84%D9%86%D8%AF%D9%86/", "summary": "«علی انصاری» بانکدار ایرانی ساکن دبی که از سوی دولت ایالات متحده آمریکا و بریتانیا «واسطه مالی رهبر جمهوری اسلامی» خوانده می‌شود تلاش می ...", "date_str": "2026-10-29T14:45:46+00:00", "hash": "7e633eb0c01fc123", "title_ یش عکس‌های معترضان زخمی، جلسه را مختل کردند و پلیس را به استفاده از خشونت علیه تظاهرکنندگان خواستار استعفای نخست‌وزیر ادی راما متهم کردند.", "image_url": "https://images.euronews.com/articles/stories/09/97/20/55/1200x675_cmsv2_44e7a797-088a-5d94-b3ed-b20e728b6beb-9972055.jpg", "category": "جامعه و رویدادها", "tags": ["عامل‌های هوشمند"], "datetime_fa": "۷ آبان • ۱۷:۴۰"}, {"source": "Euronews Persian", "title": "وصیت‌نامه خامنه‌ای سوخته یا پنهان شده است؟ سه روایت از راز جانشینی مجتبی", "link": "https://parsi.euronews.com/2026/10/29/ali-khamenei-missing-will-mojtaba-succession-iran", "summary": "هشت ماه پس از کشته‌شدن علی خامنه‌ای، هنوز خبری از وصیت‌نامه او نیست. آیا این سند در بمباران نابود شده یا محتوای آن با رهبری مجتبی خامنه‌ای در تضاد است؟ سه فعال سیاسی در گفت‌وگو با یورونیوز، روایت‌های متفاوتی از موضع رهبر پیشین جمهوری اسلامی درباره جانشینی پسرش مطرح کرده‌اند.", "date_str": "2026-10-29T14:03:44+00:00", "hash": "f5716bf531deb2c8", "title_fa": "وصیت‌نامه خامنه‌ای سوخته یا پنهان شده است؟ سه روایت از راز جانشینی مجتبی", "summary_fa": "هشت ماه پس از کشته‌شدن علی خامنه‌ای، هنوز خبری از وصیت‌نامه او نیست. آیا این سند در بمباران نابود شده یا محتوای آن با رهبری مجتبی خامنه‌ای در تضاد است؟ سه فعال سیاسی در گفت‌وگو با یورونیوز، روایت‌های متفاوتی از موضع رهبر پیشین جمهوری اسلامی درباره جانشینی پسرش مطرح کرده‌اند.", "image_url": "https://images.euronews.com/articles/stories/09/97/20/41/1200x675_cmsv2_9bb23ae7-13bd-544f-b5d1-b9e08dcc2fe6-9972041.jpg", "category": "جامعه و رویدادها", "tags": ["رویداد", "گزارش"], "datetime_fa": "۷ آبان • ۱۷:۳۳"}, {"source": "BBC Persian", "title": "دست‌کم سیزده نفر در حمله پهپادی روسیه به یک ایستگاه قطار در اوکراین کشته شدند", "link": "https://www.bbc.com/persian/articles/ckly06j4dqdxo?at_medium=RSS&at_campaign=rss", "summary": "مقام‌های اوکراینی می‌گویند در پی اصابت یک پهپاد روسی مجهز به موتور جت به سکوی شلوغ ایستگاه راه‌آهن شهر دنیپرو دست‌کم ۱۳ نفر کشته شدند. به گفته مقام‌های محلی، در این حمله دست‌کم ۱۳ نفر دیگر نیز مجروح شده‌اند.", "date_str": "2026-10-29T14:44:10+00:00", "hash": "6b7daf4ff88804d0", "title_fa": "دست‌کم سیزده نفر در حمله پهپادی روسیه به یک ایستگاه قطار در اوکراین کشته شدند", "summary_fa": "مقام‌های اوکراینی می‌گویند در پی اصابت یک پهپاد روسی مجهز به موتور جت به سکوی شلوغ ایستگاه راه‌آهن شهر دنیپرو دست‌کم ۱۳ نفر کشته شدند. به گفته مقام‌های محلی، در این حمله دست‌کم ۱۳ نفر دیگر نیز مجروح شده‌اند. بر اساس گزارش‌ها، قربانیان در انتظار سوار شدن به قطار بودند. رئیس شبکه راه آهن اوکراین گفته است با آنکه پیش از این حمله، سطح هشدار امنیتی در شهر دنیپرو افزایش یافته بود، باز هم شماری از مسافران در ایستگاه جمع شده بودند. ولودیمیر زلنسکی، رئیس جمهور اوکراین گفت روسیه به محلی حمله کرده که مسافران عادی منتظر سوار شدن به یک قطار شهری بودند. او بار دیگر از آمریکا، اروپا و کشورهای عضو گروه هفت خواست تحریم‌های بیشتری علیه مسکو اعمال کنند. وزارت دفاع روسیه ادعای حمله به اهداف غیرنظامی را رد کرده و گفته حمله به شبکه راه آهن اوکراین بخشی از حملات به زیرساخت‌هایی است که برای نقل و انتقالات نظامی استفاده می‌شود. هم‌زمان مقامات اوکراینی از کشته شدن دو دختر نوجوان در حمله موشکی روسیه به شهر چرنیهیف خبر دادند. به گفته این مقامات دست‌کم یازده نفر دیگر که بیشتر آنها کودک بودند، در این حمله زخمی شدند. در خبری دیگر، روسیه حمله پهپادی اوکراین به مسکو را محکوم کرده است. این حمله در زمانی صورت گرفته که مسکو میزبان نشست روسیه-آفریقا با حضور بیش از بیست رهبر آفریقایی است. دیمیتری پسکوف، سخنگوی کرملین زمان این حمله را «بسیار نامتعارف» خوانده است. به گفته سرگئی سوبیانین، شهردار مسکو، بیش از ششصد پهپاد اوکراینی، در طول شب به این منطقه حمله کردند که بیشتر آنها رهگیری شد. در هفته‌های اخیر، اوکراین حملات به خاک روسیه را با هدف آسیب رساندن به زیرساخت‌های این کشور بیشتر کرده است. مقام‌های اوکراینی گفته‌اند مردم عادی روسیه باید تاثیرات جنگ را حس کنند.", "image_url": "https://ichef.bbci.co.uk/news/1200/branded_persian/b8b9/live/f95e0ce0-d39e-11f1-abc7-23eff3a47521.jpg", "category": "امنیت سایبری و شبکه", "tags": ["روابط بین‌الملل"], "datetime_fa": "۷ آبان • ۱۸:۱۴"}, {"source": "BBC Persian", "title": "نقش احزاب عربی در شرایطی که نتانیاهو و آیزنکوت پیروز نشوند", "link": "https://www.bbc.com/persian/articles/cx1l3912rq7zo?at_medium=RSS&at_campaign=rss", "summary": "با شمارش آرا انتخابات پارلمانی اسرائیل، این پرسش مطرح شده که در صورت برنده نشدن نتانیاهو و آیزنکوت، نقش احزاب عربی در سیاست این کشور چه خواهد بود", "date_str": "2026-10-29T14:31:22+00:00", "hash": "a22e08d58defbe6f", "title_fa": "نقش احزاب عربی در شرایطی که نتانیاهو و آیزنکوت پیروز نشوند", "summary_fa": "با شمارش آرا انتخابات پارلمانی اسرائیل، این پرسش مطرح شده که در صورت برنده نشدن نتانیاهو و آیزنکوت، نقش احزاب عربی در سیاست این کشور چه خواهد بود با شمارش بیش از۹۰ درصد آرای انتخابات اسرائیل، رسانه‌های اصلی این کشور گزارش داده‌اند که ائتلاف بنیامین نتانیاهو متشکل از احزاب راستگرا و راست افراطی و یهودیان بنیادگرا، در مسیر کسب ۵۳ کرسی پارلمان قرار دارد؛ بسیار بیشتر از ۴۸ کرسی ائتلاف مخالف به رهبری گادی آیزنکوت. اما بی‌سابقه‌ترین نتیجه را احزاب عرب‌ها و فلسطینی‌های اسرائیل به‌دست آوردند که با مشارکت بالا ۱۹ کرسی کنست، پارلمان اسرائیل، را به دست خواهند آورد. با شمارش آرای غیابی، نتایج هنوز ممکن است تغییر کند اما پیروزی گادی آیزنکوت هر لحظه دورتر به نظر می‌رسد. به نظر می‌رسد بنیامین نتانیاهو، نخست‌وزیر کهنه‌کار اسرائیل، عملکردی بهتر از آنچه پیش‌بینی می‌شد داشته و حزب لیکود او به بزرگ‌ترین حزب منفرد تبدیل شده است. با حضور پرشمار ۷۷ درصدی رأی‌دهندگان اسرائیلی در پای صندوق‌های رأی، به‌طور گسترده پیش‌بینی می‌شد که بن‌بستی پرماجرا شکل بگیرد. در نظام سیاسی چندپاره اسرائیل، نشانه‌ها حاکی از آن است که رقیب اصلی نتانیاهو، گادی آیزنکوت، رئیس پیشین ارتش، برای دستیابی به اکثریت پارلمانی بدون احزابی که از سوی اقلیت عرب اسرائیل رهبری می‌شوند، با دشواری روبه‌رو خواهد شد. بخشی از نتایج حاکی از آن است که این احزاب تعداد کرسی‌های رکوردشکن قبلی خود را حفظ کرده‌اند یا بر آن افزوده‌اند. در جریان کارزار انتخاباتی، بیشتر احزاب یهودی مخالف دولت متعهد شدند با فهرست‌های انتخاباتی عمدتا عرب همکاری نکنند و دلیل آن را نبود ارزش‌های مشترک عنوان کردند. خبرنامه بی‌بی‌سی فارسی گزیده‌ای از مهم‌ترین خبرها، گزارش‌های میدانی و گفت‌وگوهای اختصاصی را هر هفته در ایمیل خود دریافت کنید. با این حال، اگر سایر گروه‌ها حاضر به همکاری با آن‌ها باشند، احزاب تحت رهبری اعراب اسرائیل می‌توانند به بازیگران تعیین‌کننده تبدیل شوند.", "image_url": "https://ichef.bbci.co.uk/news/1200/branded_persian/8c43/live/a1cef160-d3a3-11f1-a5cd-49637fcbd4e4.jpg", "category": "سینما و سریال", "tags": ["رویداد", "گزارش"], "datetime_fa": "۷ آبان • ۱۸:۰۱"}, {"source": "Iran International", "title": "پدر و مادرهایی که از موج مهاجرت ایرانیان جا مانده‌اند", "link": "https://www.iranintl.com/202610294270", "summary": "در حالی که شمار بیشتری از ایرانیان زندگی تازه‌ای را در خارج از کشور آغاز می‌کنند، بسیاری از پدر و مادرهایشان در ایران با پیامدی کمتر دیده‌شده از مهاجرت روبه‌رو هستند: دوری از فرزندان، روابط خانوادگی از پشت صفحه تلفن و نگرانی درباره اینکه در دوران سالمندی چه کسی کنارشان خواهد بود.", "date_str": "2026-10-29T13:58:46+00:00", "hash": "138f5cc990f18c96", "title_fa": "پدر و مادرهایی که از موج مهاجرت ایرانیان جا مانده‌اند", "summary_fa": "در حالی که شمار بیشتری از ایرانیان زندگی تازه‌ای را در خارج از کشور آغاز می‌کنند، بسیاری از پدر و مادرهایشان در ایران با پیامدی کمتر دیده‌شده از مهاجرت روبه‌رو هستند: دوری از فرزندان، روابط خانوادگی از پشت صفحه تلفن و نگرانی درباره اینکه در دوران سالمندی چه کسی کنارشان خواهد بود.", "image_url": "https://i.iranintl.com/images/rdk9umy0/production/31fe6f6bb411ede64e062b51504039afde465ff4-1536x1024.png?rect=0,109,1536,806&w=1200&h=630&q=66&fit=max&auto=format", "category": "سیاست و دیپلماسی", "tags": ["رویداد", "گزارش"], "datetime_fa": "۷ آبان • ۱۷:۲۸"}],

ان • ۱۹:۴۰"}, {"source": "Engadget", "title": "ThermoWorks debuts shorter version of its RFX Meat wireless probe for small cuts", "link": "https://www.engadget.com/2301085/thermoworks-debuts-shorter-version-of-its-rfx-meat-wireless-probe-for-small-cuts/", "summary": "The RFX Meat Mini offers nearly identical performance to the full-sized grilling probe.", "date_str": "2026-10-29T16:04:13+00:00", "hash": "50dc4214eec8718b", "title_fa": "ThermoWorks نسخه کوتاه تری از پروب بی سیم RFX Meat خود را برای برش های کوچک معرفی کرد", "summary_fa": "RFX Meat Mini عملکرد تقریباً یکسانی را با کاوشگر کباب پز در اندازه کامل ارائه می دهد. ThermoWorks افزودن Engadget به Google: منبع ترجیحی Google Discover کاوشگر گوشت ThermoWorks یک ابزار کباب کردن عالی است. هنگامی که آن را به یک درگاه RFX دارای Wi-Fi متصل می کنید، می توانید دمای غذا را در تلفن خود از هر کجا کنترل کنید. و در حالی که کاوشگرهای دمای بی سیم برای مدتی در دسترس بوده اند، خط RFX سابقه اثبات شده ThermoWorks را برای دقت ارائه می دهد. این یکی از ابزارهای ضروری است که باید در جیب پیش بند خود داشته باشید. همانطور که RFX Meat خوب است، پروب 4.7 اینچی برای برش های کوچکتر گوشت، مرغ و ماهی بسیار طولانی است. با حداقل خط غوطه وری 3.15 اینچ، ابزار کباب کردن گزینه خوبی برای چیزهایی مانند فیله مینیون یا تکه های جداگانه ماهی سالمون نیست. اکنون به لطف RFX Meat Mini جدید تغییر کرده است. این نسخه کوتاه‌تر تقریباً همه ویژگی‌های مشابه گوشت اصلی RFX را ارائه می‌کند، از جمله چهار سنسور دمای داخلی، درجه ضدآب IP69K (بنابراین قابل شستشو در ماشین ظرفشویی است) و توانایی تحمل دمای تا 1000 درجه فارنهایت. Mini همچنان دارای یک بلوک شارژ است که توسط یک باتری قلمی تغذیه می‌شود که به گفته ThermoWorks برای بیش از 175 شارژ کافی است. بهترین بخش این است که حداکثر خط غوطه وری 2.6 اینچ است و حداقل خط فقط 2.36 اینچ است. به غیر از طول، تفاوت عمده بین RFX Meat و RFX Meat Mini طول عمر است. مینی با شارژ تا 48 ساعت دوام می آورد، در حالی که RFX Meat می تواند بیش از 65 ساعت کار کند. 48 ساعت برای طولانی‌ترین جلسه باربیکیوی کم و آهسته که در خانه انجام می‌دهید کافی است، و عمر ه‌های مهم آسیب‌پذیر معرفی می‌کند. کپی لینک خطری که در ساعت‌ها و شبکه‌های ارتباطی پنهان است یکی از مهم‌ترین نقش‌های GPS، فراتر از موقعیت‌یابی است: این سامانه ساعت بسیار دقیقی در اختیار تجهیزات زمینی قرار می‌دهد. شبکه‌های مخابراتی برای هماهنگ‌کردن زمان‌بندی ارتباطات، برخی زیرساخت‌های برق برای", "image_url": "https://api2.zoomit.ir/media/gps-interference-power-grid-6ab226e6aa5f757436190eaa?w=1920&q=75", "category": "موبایل و گجت‌ها", "tags": ["فناوری", "نوآوری"], "datetime_fa": "۷ آبان • ۱۹:۴۰"}, {"source": "Zoomit", "title": "حقوق ۱۴۰۵، عیدی، طلا و سهم‌الارث را خودتان حساب کنید؛ ۲۲ ابزار تازه کاویزو", "link": "https://www.zoomit.ir/economics/470056-kavizo-salary-tax-calculation-tools/", "summary": "کاویزو با افزودن ۲۲ ابزار رایگان بر مبنای بخشنامه‌های سال ۱۴۰۵، امکان محاسبه آنلاین و قدم‌به‌قدم حقوق خالص، مالیات، عیدی و سنوات را فراهم کرد.", "date_str": "2026-10-29T16:05:00+00:00", "hash": "99e43d3532415f71", "title_fa": "حقوق ۱۴۰۵، عیدی، طلا و سهم‌الارث را خودتان حساب کنید؛ ۲۲ ابزار تازه کاویزو", "summary_fa": "کاویزو با افزودن ۲۲ ابزار رایگان بر مبنای بخشنامه‌های سال ۱۴۰۵، امکان محاسبه آنلاین و قدم‌به‌قدم حقوق خالص، مالیات، عیدی و سنوات را فراهم کرد. تبلیغات چند هفته پیش در گزارش « کاویزو متولد شد؛ ۸۳ ابزار فارسی و کاملا رایگان برای حساب‌وکتاب روزمره » ابزارهای اولیه‌ی این سرویس را معرفی کردیم. حالا ابزارهایی اضافه شده که بیشتر به پرسش‌های پرتکرار امسال جواب می‌دهند: حقوقم بعد از افزایش چقدر می‌شود، چقدر مالیات می‌دهم، عیدی‌ام چقدر است، کمیسیون بنگاه چقدر است. پیش از شروع یک نکته: این ابزارها ماشین‌حساب‌اند، نه مشاور مالی یا حقوقی. نرخ‌ها و قاعده‌ها از متن قانون و بخشنامه‌ها آمده و منبع هر کدام زیر همان صفحه آمده است. با این حال فیش حقوقی، قرارداد یا رأی دادگاه شما ممکن است جزئیاتی داشته باشد که در یک ماشین‌حساب نمی‌گنجد. کپی لینک حقوق و دستمزد ۱۴۰۵؛ از افزایش حقوق تا عیدی و سنوات پرجست‌وجوترین بخش تازه، دسته‌ی محاسبه حقوق و دستمزد است که هفت ابزار دارد. مبنای همه، بخشنامه‌ی مزد ۱۴۰۵ وزارت کار (شماره‌ی ۶۶۸۲، ۳۱ فروردین ۱۴۰۵) است. حداقل مزد روزانه‌ی کارگران در ۱۴۰۵، ۵ a compound, has been turned and is planning a terrorist attack on the United States. As she has been diagnosed with bipolar disorder, her superiors don't give Mathison's suspicions much credence, kicking off a cat-and-mouse/is-he-or-isn't he? game between the two. As the show progresses, Carrie moves up the ranks until she's working directly for the president. Both leads won Emmys for their performances, and the series took the Outstanding Drama prize in its first year. Stream Homeland on Hulu and Netflix . Homeland (2011 2020) at Hulu Learn More Learn More at Hulu Slow Horses (2022 ) Focusing largely on the seedier side of international espionage, Slow Horses , based on the novels by Mick Herron, shares with The Diplomat a dry sense of humor about the consequences of institutional and human failures. With nods to the great spy dramas of John le Carr , Slow Horses updates the setting without losing either the thrills or the style of a time-honored genre. The Slow Horses of the title are a group of has-been MI5 agents they ve all made messes of significant jobs, but are still seen as having some use, if only in dull administrative tasks. Naturally, the members of the group (led by Gary Oldman's endlessly flatulent Jackson Lamb) find themselves in deeper waters than anyone thought them capable of navigating. Kristin Scott Thomas is the spymaster, navigating political pressures, misogyny, and her own unrepentant ambition in trying to do her job. Stream Slow Horses on Apple TV . Slow Horses (2022 ) at Apple TV Learn More Learn More at Apple TV The Night Agent (2023 ) An actio", "date_str": "2026-10-29T16:30:00+00:00", "hash": "528204ace8dbb8e4", "title_fa": "10 نمایش مانند «دیپلمات» که باید در ادامه تماشا کنید", "summary_fa": "ممکن است از پیوندهای موجود در این صفحه کمیسیون دریافت کنیم. پس از فصل چهارم که اخیراً به پایان رسیده است، تریلر سیاسی نتفلیکس، دیپلمات، برای فصل پنجم تمدید شده است، و حتی بهتر از آن، این سریال نادر استریم است که به نظر می رسد به یک برنامه نسبتاً م 07 میلیارد دلار - 2.70 میلیارد دلار جریان نقدی آزاد آن", "image_url": "https://i.insider.com/6ae3541d81330985cf7b5476?width=1200&format=jpeg", "category": "هوش مصنوعی مولد", "tags": ["هوش مصنوعی", "Google", "بورس و طلا"], "datetime_fa": "۷ آبان • ۱۸:۴۱"}, {"source": "Business Insider", "title": "As a single mom with ADHD, I don't hide my burnout from my kids", "link": "https://www.businessinsider.com/adhd-diagnosis-as-adult-honest-with-kids-2026-10", "summary": "The author said she wasn t diagnosed with ADHD until she was in her 30s. Courtesy of Alexandria Mooney Photography via Olivia Howell. I was diagnosed with ADHD at 38. I spent most of my life masking things I didn't know were ADHD. Instead of pretending I'm fine, I tell my sons when my brain is full and my battery is running low. I'm teaching them that everybody has different limits and it's important to know and respect them. There are nights when I look at my two boys, 13 and 10, and announce, \"My battery is at 1%.\" They know what this means. I get much quieter. The pile of clothes I told myself I was going to fold gets moved to the floor and becomes tomorrow's problem . Video game sounds that normally wouldn't bother me suddenly send my whole system into overdrive . If both kids are talking to me at once, I sometimes have to say, \"I can't process what either one of you is saying right now.\" Eventually, I can hit what feels like an actual wall. I go into a burnout shutdown where decision-making becomes almost impossible. My brain feels frozen. I know there are things I should be doing, but I can't organize them into a next step. If I'm overstimulated enough, I can barely formulate a cohesive thought. Sometimes the only thing that helps is going into my room , closing the door, and sitting in complete silence. I don't hide this from my kids. I let them see it on purpose. I spent most of my life not knowing my brain worked differently I was diagnosed with ADHD at 38. Until then, I genuinely didn't know other people's brains worked the way mine did. The best way I can describe my brain is that there are three musicals happening on three different stages at the same time. There are songs, conversations, ideas, and a constant stream of thoughts all competing for my attention. Do you have a hot take on a common parenting belief? Email Jennifer Beck Goldblatt at jgoldblatt@insider.com to share your experience with Business Insider. From the outside , I looked highly functional. I was an A+ student. I worked hard. I got things done. I became an entrepreneur. Internally, I was exhausted to the point that it sometimes felt like an existential level. I remember hitting this same wall when I was around the same age as my sons. My parents didn't understand what was happening, and why would they? ADHD wasn't something anyone was considering for me. I wasn't physically hyperactive. All of the pinging was happening inside my head. So I learned to push through it and, eve", "date_str": "2026-10-29T14:54:01+00:00", "hash": "332daa43ebb5f8a6", "title_fa": "من به عنوان یک مادر مجرد مبتلا به ADHD، فرسودگی شغلی خود را از فرزندانم پنهان نمی کنم", "summary_fa": "نویسنده گفت که تا قبل از 30 سالگی تشخیص داده نشد که او مبتلا به ADHD است. با حسن نیت از عکاسی الکساندریا مونی از طریق اولیویا هاول. در 38 سالگی تشخیص داده شد که مبتلا به ADHD هستم. بیشتر عمرم را صرف پوشاندن چیزهایی کردم که نمی دانستم ADHD هستند. به جای اینکه وانمود کنم حالم خوب است، وقتی مغزم پر شده و باتریم تمام می شود به پسرانم می گویم. من به آنها یاد می دهم که هر کس محدودیت های متفاوتی دارد و مهم است که آنها را بشناسیم و به آنها احترام بگذاریم. شب‌هایی هست که به دو پسر 13 و 10 ساله‌ام نگاه می‌کنم و می‌گویم: «باتری من یک درصد است». آنها می دانند که این به چه معناست. خیلی ساکت تر میشم انبوه لباس هایی که به خودم گفتم می خواهم تا کنم روی زمین می رود و تبدیل به مشکل فردا می شود. صداهای بازی ویدیویی که معمولاً من را آزار نمی‌دهند، ناگهان کل سیستم من را در حالت Overdrive قرار می‌دهند. اگر هر دو بچه همزمان با من صحبت می کنند، گاهی اوقات مجبور می شوم بگویم: \"در حال حاضر نمی توانم آنچه را که یکی از شما می گویید پردازش کنم.\" در نهایت، من می توانم به چیزی که شبیه یک دیوار واقعی است ضربه بزنم. من وارد یک تعطیلی فرسودگی می شوم که در آن تصمیم گیری تقریباً غیرممکن می شود. مغزم یخ زده است می دانم کارهایی هست که باید انجام دهم، اما نمی توانم آنها را در مرحله بعدی سازماندهی کنم. اگر به اندازه کافی بیش از حد تحریک شده باشم، به سختی می توانم یک فکر منسجم را فرموله کنم. گاهی اوقات تنها چیزی که کمک می کند این است که وارد اتاقم شوم، در را ببندم و در سکوت کامل بنشینم. من این را از بچه", "image_url": "https://i.insider.com/6ae20ba33ae265b597b02f65?width=1200&format=jpeg", "category": "هوش مصنوعی مولد", "tags": ["فناوری", "نوآوری"], "datetime_fa": "۷ آبان • ۱۸:۲۴"}, {"source": "Business Insider", "title": "My kids bring home bags of Halloween candy. I let them keep just 5 pieces each.", "link": "https://www.businessinsider.com/dietitian-mom-candy-fairy-halloween-candy-tradition-2026-10", "summary": "The author s kids (not pictured) give the candy they don t want to the Candy Fairy. Anastasiia Krivenok/Getty Images I'm a dietitian and let my two kids enjoy Halloween candy without making them feel guilty. After trick-or-treating, I let them each choose five favorite pieces of candy to save for later. The Candy Fairy takes the rest and leaves a small toy, making the exchange fun rather than a punishment. Editor's note: Do you let your kids keep all their Halloween candy? Do you have them pick a few they can keep? Share in the comments what your approach is. Every Halloween, I know exactly what's coming: two excited kids, costumes, a neighborhood full of candy , and by the end of the night, bags that seemingly weigh almost as much as they do. They look forward to trick-or-treating for months. Every year it's the same: despite my annual request that they wait until we get home to start eating their haul, more candy than I'd like gets eaten while we're still walking around the neighborhood . I'm a registered dietitian , but I'm also a mom. Halloween is supposed to be fun, the kind of event that becomes a core childhood memory. I want my kids to feel \"normal\" in the best sense of the word. I want them to run from house to house, trade candy, and enjoy the same traditions as their friends without feeling like they have different rules because their mom happens to be a dietitian. At the same time, I want them to understand balance. When we get home, they may each have a few more pieces. Then we dump everything out, and they choose about five favorite pieces to save for later. The rest goes to the Candy Fairy . My kids write letters to the Candy Fairy The Candy Fairy takes the extra candy and leaves a small toy in exchange. My kids even write her letters and put them in the mailbox. It turns getting rid of the excess into something fun instead of a punishment. The author s kids trade in the candy they don t want to the Candy Fairy for something else. Courtesy of the author They still get the excitement of collecting candy and choosing the pieces they really love, while having some control over what stays. I'm not deciding which candy they're allowed to keep or telling them what they should like. They get to decide which pieces are worth saving and which ones they're ready to give up. I get to avoid having a ridiculous amount of candy sitting in the house until Thanksgiving. My daughter may be starting to outgrow the tradition now, at 9 years old, but my son pro", "date_str": "2026-10-29T14:49:01+00:00", "hash": "c17472954e1c60c1", "title_fa": "بچه های من کیسه های آب نبات هالووین را به خانه می آورند. من به آنها اجازه دادم هر کدام فقط 5 قطعه نگه دارند.", "summary_fa": "بچه های نویسنده (در تصویر نیست) آب نباتی را که نمی خواهند به آب نبات پری می دهند. Anastasiia Krivenok/Getty Images من یک متخصص تغذیه هستم و به دو فرزندم اجازه می‌دهم از آب نبات هالووین لذت ببرند بدون اینکه احساس گناه کنند. پس از ترفند، به هر کدام اجازه دادم پنج تکه آب نبات مورد علاقه خود را انتخاب کنند تا برای بعد ذخی  working on AI for decades through Google Brain, Coursera. It's platform promises to help IT easily control enterprise agents", "date_str": "2026-10-29T15:00:00+00:00", "hash": "612d2dc7eeec94a4", "title_fa": "استارت‌آپ هویت عامل Mintive به Cowboy Ventures، Coatue، Angels Jeff Dean، Andrej Karpathy وارد می‌شود.", "summary_fa": "Mintive توسط دو مهندس که دهه‌ها از طریق Google Brain، Coursera روی هوش مصنوعی کار می‌کردند، تاسیس شد. این پلتفرم به IT کمک می‌کند تا به راحتی عوامل سازمانی را کنترل کند. در اینجا یک استارت‌آپ مدیریت عامل در مرحله اولیه دیگر برای تماشا وجود دارد، زیرا سوابق بنیانگذاران و تعداد زیادی از نام‌های بزرگی که قبلاً به عنوان سرمایه‌گذار جذب کرده است: Mintive. Mintive در مجموع ۱۱ میلیون دلار جمع‌آوری کرده است، از جمله یک بذر تازه اعلام شده ۷ میلیون دلاری به رهبری Cowboy Ventures. سرمایه‌گذاران اضافی عبارتند از Coatue، Operator Collective، Hustle Fund، و فرشتگان شامل بنیانگذار Okta، فردریک کرست، بنیانگذار Discovery Loop و دانشمند ارشد سابق گوگل، جف دین، و بنیانگذار OpenAI، Andrej Karpathy و دیگران هستند. Mintive توسط Jiquan Ngiam (تصویر بالا، سمت راست) و Vijay Vasudevan (تصویر بالا سمت چپ) تاسیس شد. Ngiam، مدیر عامل Mintive، مهندس موسس Coursera (کارمند شماره 1، استخدام شده توسط Andrew Ng) بود. نگیام بعداً روی شبکه‌های عصبی در Google Brain کار کرد. Vasudevan، مدیر ارشد فناوری این شرکت، بیشتر به عنوان یکی از خالقان TensorFlow در زمانی که در Google Brain بود شناخته می شود. این پلتفرم آموزشی OG AI بود که قبل از PyTorch بود. Mintive در حال پیوستن به حوزه شلوغی از محصولات است که وعده مدیریت، ارائه و ارائه مدیریت هویت به عوامل هوش مصنوعی سازمانی را می‌دهند. پلتفرم آن شامل یک دروازه MCP است که به متخصصان فناوری اطلاعات اجازه می‌دهد تا به آنچه که عوامل سرویس‌های ابری ممکن است دسترسی داشته باشند و اقداماتی که می‌توانند روی آنها انجام دهند، مجوز دهند. همچنین یک دروازه LLM ارائه می دهد که به مدل های مختلف مسیر می دهد و می تواند هزینه ها را کاهش دهد. شناسه ها و مجوزهایی که ممکن است با کارمندانی که به آنها خدمت می کنند متفاوت باشد را", "image_url": "https://techcrunch.com/wp-content/uploads/2026/10/mintive-founders.jpg?resize=1200,900", "category": "هوش مصنوعی مولد", "tags": ["هوش مصنوعی", "OpenAI", "Google", "عامل‌های هوشمند"], "datetime_fa": "۷ آبان • ۱۸:۳۰"}, {"source": "Ars Technica", "title": "Massive leak exposes 41,000 DHS workers and undercover ICE agents", "link": "https://arstechnica.com/security/2026/10/massive-leak-exposes-41000-dhs-workers-and-undercover-ice-agents/", "summary": "An unprecedented leak of Department of Homeland Security records has exposed details of more than 41,000 employees or contractors who work for the department and its constituent agencies. The records include email addresses, phone numbers, and office addresses, but also references to internal systems and sensitive information on undercover and surveillance programs. In all, the leak provides a map of how DHS is organized and how it operates. The records, which span DHS itself as well as seven component agencies, including Immigration and Customs Enforcement and US Customs and Border Protection, were last updated on August 19, 2026. The transparency nonprofit Distributed Denial of Secrets and cybersecurity researcher and journalist maia arson crimew previewed the data for WIRED, which they say they obtained from a group calling itself the Department of Peace. DDoSecrets published the archive, which it calls “Icepick,” on Wednesday. In a press release, DDoSecrets says the data is from DHS's Okta login system. In a note with the files, the hackers wrote, “They have our information, so it’s only fair that we have theirs.” Read full article Comments", "date_str": "2026-10-29T12:58:34+00:00", "hash": "6e4926f75539f7b7", "title_fa": "نشت گسترده 41000 کارگر DHS و عوامل مخفی ICE را افشا می کند", "summary_fa": "افشای بی‌سابقه سوابق وزارت امنیت داخلی، جزئیات بیش از 41000 کارمند یا پیمانکاری را که برای این وزارتخانه و آژانس‌های سازنده آن کار می‌کنند، فاش کرده است. این سوابق شامل آدرس های ایمیل، شماره تلفن، و آدرس دفتر، اما همچنین ارجاع به سیستم های دا آزاد شکست داده است.", "summary_fa": "آزمایشگاه هوش مصنوعی فرانسوی ادعا می‌کند که آخرین نسخه‌اش با بهترین مدل‌های DeepSeek و Z.ai در کدنویسی و امنیت سایبری همخوانی یا عملکرد بهتری دارد. Loader Save Story ذخیره این داستان نظر Loader Save Story ذخیره این داستان چند هفته پیش، شرکت فرانسوی Mistral نسخه اولیه مدل هوش مصنوعی جدید خود را با نام مستعار Le Chonk منتشر کرد. در آن زمان، این شرکت گفت که این پیشرفته ترین پیشنهاد وزن باز در خارج از چین است. پس از اصلاحات بیشتر، Mistral اکنون می گوید Le Chonk \"بهترین مدل وزن باز جهان\" برای کدنویسی خودکار و امنیت سایبری است. میسترال می‌گوید این پیشرفت‌ها با تامین مشکلات امنیتی سایبری و کدگذاری سخت‌تر این مدل امکان‌پذیر شد، که به Le Chonk با پارامتر تریلیون‌ها اجازه می‌داد تا با مدل‌های آزمایشگاه‌های برجسته چینی مانند DeepSeek و Z.ai مطابقت یا پیشی بگیرد. پیر استاک، معاون علمی Mistral در یک نشست خبری به خبرنگاران گفت: «این یک لحظه مهم در رقابت جهانی رهبری هوش مصنوعی است. این قابلیت‌های مرزی را برای شرکت‌ها و دولت‌ها ارائه می‌کند تا در برابر افزایش سطح تهدید در سایبری دفاع کنند.» نسخه نهایی Le Chonk اکنون به صورت رایگان برای همه در دسترس است. پس از انبوهی از حوادث امنیت سایبری مرتبط با هوش مصنوعی، Mistral ادعا می کند که برای غرب مهم است که مدل های وزن باز پیشرفته خود را داشته باشد. استوک گفت: \"شما هیچ تضمینی ندارید که [مدل های چینی] بدخواهانه رفتار نکنند. آنها می توانند ناقل تهدید باشند.\" پرمخاطب‌ترین قسمت زمانی رخ داد که یکی از مدل‌های OpenAI از یک جعبه آزمایشی خارج شد و در طول تابستان به چندین شرکت هک شد. این موضوع باعث ایجاد وحشت در مورد این ایده شد که هوش مصنوعی می تواند از نظارت انسان فرار کند و توسط عوامل تهدید برای انجام حملات سایبری پیچیده مورد سوء استفاده", "image_url": "https://media.wired.com/photos/6ae34b392cfd29b998d6a112/191:100/w_1280,c_limit/Business_Mistral%20Says%20Its%20%E2%80%98Le%20Chonk%E2%80%99%20Model%20Can%20Outperform%20Top%20Chinese%20Models%20in%20Coding%20and%20Cybersecurity_v3.jpg", "category": "هوش مصنوعی مولد", "tags": ["هوش مصنوعی", "OpenAI", "امنیت سایبری"], "datetime_fa": "۷ آبان • ۱۷:۳۰"}, {"source": "Zoomit", "title": "ادعای جنجالی: اپل برای افزایش تولید آیفون دوئو تا حدی از کیفیت چشم‌پوشی کرد", "link": "https://www.zoomit.ir/mobile/470111-iphone-duo-hinge-defect-reports/", "summary": "گزارش‌های جدید نشان می‌دهند اپل برای رسیدن به اهداف فروش بالا، استانداردهای کنترل کیفیت آیفون دوئو را کاهش داده است.", "date_str": "2026-10-29T14:40:00+00:00", "hash": "9068dbe4f7f7294e", "title_fa": "ادعای جنجالی: اپل برای افزایش تولید آیفون دوئو تا حدی از کیفیت چشم‌پوشی کرد", "summary_fa": "گزارش‌های جدید نشان می‌دهند اپل برای رسیدن به اهداف فروش بالا، استانداردهای کنترل کیفیت آیفون دوئو را کاهش داده است. تبلیغات گزارش‌های متعددی درباره‌ی آسیب‌دیدگی نمایشگر داخلی آیفون دوئو و سازوکار حساس لولای آن منتشر شده است. اپل با پذیرش وجود نقص، اعلام کرد چنین اشکالی تنها دامنگیر «تعداد اندکی از دستگاه‌ها» می‌شود و کاربران آسیب‌دیده می‌توانند برای تعویض دستگاه اقدام کنند. رسانه‌ی چینی Jiemian News به‌نقل از یکی از کارکنان فاکسکان گزارش داد که اپل استانداردهای بازرسی کیفی را کاهش داده است تا تعداد بیشتری از آیفون دوئو را پیش از آغاز فصل تعطیلات به دست خرده‌فروشان برساند. منبع مذکور تأکید می‌کند خط تولید تاکنون «یک سری از قطعات» را جایگزین کرده، اما معیارهای کنترل کیفیت همچنان دست‌نخورده باقی مانده‌اند. اپل همچنان رساندن حداکثر تعداد ممکن از این دستگاه به فروشگاه‌ها را در اولویت قرار داده و هدف‌گذاری نهایی، عرضه‌ی ۷٫۵ میلیون دستگاه پیش از پایان سال جاری میلادی است. کانال یوتیوب CuriousHagi با بررسی دقیق سخت‌افزار، نقصی بحرانی را در سازوکار داخلی لولا به‌تصویر کشید که عامل اصلی آسیب نمایشگر به‌شمار می‌رود. صدای شکستی که خریداران گزارش کرده‌اند ناشی از برخورد قطعه‌ای اتصالی در لولا با صفحه‌ی پشتیبان بالایی است؛ قطعه‌ای که پشت بخش میانی نمایشگر قرار گرفته و نسبت به سایر بخش‌های لولا ضخامت کمتری دارد. لایک نظرت چیه؟ ارسال نظر بوکمارک اشتراک‌گذاری امیر عبدالملکی دنبال کردن به محتوای این مطلب چه امتیازی میدی؟ نظر شما برامون مهمه و به بهتر شدن کیفیت مطالب کمک می‌کنه.", "image_url": "https://api2.zoomit.ir/media/iphone-smartphone-in-hand-6add07cf765406765ecb4cdb?w=1920&q=75", "category": "هوش مصنوعی مولد", "tags": ["Apple"], "datetime_fa": "۷ آبان • ۱۸:۱۰"}, {"source": "Zoomit", "title": "اولین شرکت ۱۰ تریلیون دلاری جهان؟ پیش‌بینی باورنکردنی درباره آنتروپیک", "link": "https://www.zoomit.ir/business/470114-anthropic-ipo-ai-economics/", "summary": "پرونده‌ی بورسی آنتروپیک از درآمد خیره‌کننده، تعهدات سنگین پردازشی و قماری پرده برمی‌دارد که شاید ارزش شرکت را به ۱۰ تریلیون دلار برساند.", "date_str": "2026-10-29T14:20:21+00:00", "hash": "8b49b1b07f532485", "title_fa": "اولین شرکت ۱۰ تریلیون دلاری جهان؟ پیش‌بینی باورنکردنی درباره آنتروپیک", "summary_fa": "پرونده‌ی بورسی آنتروپیک از درآمد خیره‌کننده، تعهدات سنگین پردازشی و قماری پرده برمی‌دارد که شاید ارزش شرکت را به ۱۰ تریلیون دلار برساند. تبلیغات آنتروپیک با انتشار اسناد عرضه‌ی اولیه‌ی سهام خود، برای نخستین‌بار تصویری نسبتاً روشن از اقتصاد یکی از بزرگ‌ترین سازندگان مدل‌های پیشرفته‌ی هوش مصنوعی ارائه کرد؛ تصویری که در آن رشد سریع درآمد و بهبود سودآوری، در کنار هزینه‌های سنگین پردازش و رقابتی فرساینده قرار می‌گیرند. این شرکت ممکن است از ماه آینده معاملات سهام خود را در نزدک، با ارزش‌گذاری ۱٫۵ تا ۲ تریلیون دلار آغاز کند. جویی بروکهارت ، تحلیلگر شرکت پژوهشی SemiAnalysis، در گفت‌وگو با پادکست Decoder می‌گوید درآمد سالانه‌ی آنتروپیک از ۷۰ میلیارد دلار گذشته است. بااین‌حال، پرسش اصلی این است که آیا بازار هوش مصنوعی می‌تواند آن‌قدر بزرگ شود که هزینه‌های توسعه‌ی مدل‌های بعدی را تأمین کند یا خیر. بررسی آمار و ارقام مالی نشان می‌دهد حاشیه‌ی سود ناخالص آنتروپیک از اجرای مدل‌ها برای پاسخ‌گویی به کاربران، طی دو سال از منفی ۹۴ درصد به مثبت ۸۵ درصد رسیده است. به‌گفته‌ی بروکهارت، درآمد حاصل از هر مگاوات ظرفیت پردازش استنتاج اکنون حدود ۶۵ میلیون دلار است، درحالی‌که هزینه‌ی محاسباتی آن کمی بیش از ۱۰ میلیون دلار برآورد می‌شود. افزایش پنج تا ده‌برابری توان پردازش توکن در تراشه‌های Trainium طی یک سال، یکی از عوامل این جهش بهره‌وری است. با وجود این سودآوری، فقط حدود ۳۰ درصد ظرفیت محاسباتی آنتروپیک مستقیماً صرف ارائه‌ی خدمات به مشتریان می‌شود؛ باقی آن به پژوهش، آموزش و بهبود مدل‌ها اختصاص دارد. حاشیه‌ی سود تعدیل‌شده‌ی شرکت به حدود ۱ ز، شست‌وشوی آسانی دارد. پلوپز شیائومی یک دیگ کامپوزیت تیتانیومی با ضخامت ۳ میلی‌متر دارد که فاقد مواد فلورینه بوده و با فناوری پاشش پلاسمای تیتانیوم پوشانده شده است. این دیگ استاندارد سطح ۲ نچسب چین را بدون استفاده از پوشش‌های سنتی تفلون کسب کرده؛ سیستم گرمایشی دستگاه یک واحد القایی با توان ۱۱۷۵ وات است که از سیم‌پیچی ۱۳,۰۰۰ میلی‌متری برای توزیع یکنواخت حرارت استفاده می‌کند. دستگاه از سیستم فشار متغیر سه‌مرحله‌ای با چهار حالت فشار پشتیبانی می‌کند. برای برنج سفید از فشار ۱٫۲x و برای غلات سخت‌تر از فشار ۲٫۰x استفاده می‌شود که نیاز به خیساندن برنج را از بین می‌برد. همچنین قابلیت پخت سریع ۱۴ دقیقه‌ای برای وعده‌های کوچک در نظر گرفته شده است. به‌عنوان یک محصول از سری میجیا، این پلوپز با Xiaomi HyperConnect، فرامین صوتی Xiao AI و اپلیکیشن میاجیا برای کنترل از راه دور سازگار است. این دستگاه ۱۶ لایه‌ی محافظتی ایمنی دارد و شیائومی برای واحد اصلی سه سال و برای دیگ داخلی یک سال گارانتی ارائه می‌دهد. لایک نظرت چیه؟ ارسال نظر بوکمارک اشتراک‌گذاری امیر عبدالملکی دنبال کردن به محتوای این مطلب چه امتیازی میدی؟", "image_url": "https://api2.zoomit.ir/media/xiaomi-mijia-smart-rice-cooker-6ae191ea2b7fe0e7849f7ec3?w=1920&q=75", "category": "هوش مصنوعی مولد", "tags": ["هوش مصنوعی"], "datetime_fa": "۷ آبان • ۱۷:۳۰"}, {"source": "Business Insider", "title": "Mark Cuban says communities are falling victim to 'contractual terrorism' in data center deals", "link": "https://www.businessinsider.com/mark-cuban-data-centers-contractual-terrorism-communities-2026-10", "summary": "Mark Cuban says towns must protect themselves before approving data centers. Shafkat Anowar/The Dallas Morning News via Getty Images Mark Cuban says data center developers are using healthcare-style contracts to confuse communities. He said healthcare contracts are \"so big and so long\" that insurers \"get to be contractual terrorists.\" Data centers, which are crucial for the AI boom, have become a hugely contentious issue across America. Healthcare has long used complex contracts that can obscure who pays for what. Mark Cuban says data center developers are using a similar playbook. \"A lot of communities have been really dumb with the deals they've negotiated for data centers,\" Cuban said on an episode of \"The A16z Show\" released on Wednesday. \"They've fallen for the contractual terrorism in a lot of cases.\" Cuban, who co-founded Cost Plus Drugs, a company that sells generic medicines at a transparent markup, previously coined the phrase \"contractual terrorism\" while discussing healthcare. On the A16z podcast, he said massive healthcare insurers and their subsidiaries use sprawling, opaque agreements to obscure costs and make it difficult for employers to know where their money is going. Cuban said those contracts are \"so big and so long\" that insurers \"get to be contractual terrorists\" — a formulation he also applied to communities' data center deals. His comments come as the data center boom has become a hugely contentious issue in communities across the US. Residents living near facilities have reported incessant low-frequency hums, diesel smells, intrusive lights, construction disruption, pressure on water and electricity supplies, and the loss of trees and open land. In Northern Virginia, the country's data center capital , local opposition has helped reshape elections, prompted lawsuits, and pushed residents to demand tighter noise and zoning rules. A University of Massachusetts Amherst poll of 1,000 Americans from September found that 65% opposed building an AI data center in their local community, including 49% who said they strongly opposed it. The ghost data center backlash The race to build AI infrastructure has also produced far more announcements than operating facilities. Aterio, which tracks projects through satellite imagery, permits, and other records, counted 8,268 announced US facilities as of October 20. But only 2,126 were active, and 861 were under construction. Thousands more had just been announced, leaving local governments to negot", "date_str ۱۸:۰۱"}, {"source": "Business Insider", "title": "I spent 53 hours in a 50-square-foot Amtrak bedroom with a full bathroom. I'd gladly pay $2,200 for it again.", "link": "https://www.businessinsider.com/amtrak-california-zephyr-bedroom-tour-2026-10", "summary": "Business Insider s reporter spent 53 hours on Amtrak s California Zephyr train in a bedroom accommodation. Joey Hadden/Business Insider A couch, a seat, a table, two beds, a full bathroom, a window, and a sliding door. My home for the longest train ride in the US was basically a hotel room in motion. It wasn't cheap, but I don't regret splurging on an Amtrak bedroom. I wasn't about to sacrifice comfort to save a few bucks. Not when booking the longest train ride in the US. Most people use trains to get from one place to another. But in February, Amtrak's California Zephyr was my destination. I wanted to thoroughly enjoy the 53-hour journey from snowy Chicago to sunny Emeryville, California. That's why I spent $2,200 on a bedroom accommodation, a private cabin with a full bathroom. While I was excited to stay in the tiny, moving hotel room, I wondered whether I'd regret spending so much. In the end, I was sure I had made the right choice for such a long journey. Here's a look inside the 50-square-foot bedroom. My bedroom was on the second level of an Amtrak Superliner train. Joey Hadden/Business Insider The California Zephyr is an Amtrak Superliner — a two-story train with coach seating , bedrooms, roomettes (a private cabin that's about half the size of a bedroom), a dining car, and a lounge car. There are also larger, family-sized bedrooms and accessible bedrooms. I'd ridden the California Zephyr a year earlier, but I took a shorter trip in a roomette. This was my first time riding the entire route from Chicago to California. It was also my first time booking a bedroom on an Amtrak Superliner. The 50-square-foot enclosed space packed in two bunks, a couch, a single seat, and a full bathroom. Joey Hadden/Business Insider The couch folded out to form the bottom bunk, and the top bunk pulled down from the ceiling. The Amtrak bedroom sleeps up to two passengers, though I traveled solo. The booking also included some perks. Sleeper-car ticket holders get a first-class attendant, priority boarding, lounge access at some stations, and complimentary meals on board. When I first boarded the train, there were no bunks in sight. Joey Hadden/Business Insider During the day, the lower bunk was set up as a couch, and the upper bunk was folded up. A single seat faced the couch with a pullout table in between. There was a pullout table between the seats that I used for working and eating. Joey Hadden/Business Insider The table also had two foldout leaves for more space. ", "date_str": "2026-10-29T14:27:23+00:00", "hash": "6b919e023728a3f1", "title_fa": "من 53 ساعت را در یک اتاق خواب 50 فوت مربعی Amtrak با حمام کامل گذراندم. من با کمال میل دوباره برای آن 2200 دلار پرداخت می کنم.", "summary_fa": "خبرنگار Business Insider 53 ساعت را در قطار کالیفرنیا زفیر Amtrak در یک اتاق خواب گذراند. Joey Hadden/Business Insider یک کاناپه، یک صندلی، یک میز، دو تخت، یک حمام کامل، یک پنجره، و یک در کشویی. خانه من برای طولانی ترین سفر قطار در ایالات متحده اساساً یک اتاق هتل در حال حرکت بود. ارزان نبود، اما پشیمان نیستم که در اتاق خواب آمتراک ولخرجی کردم. من قصد نداشتم راحتی را فدای چند دلار پس انداز کنم. نه هنگام رزرو طولانی ترین سفر قطار در ایالات متحده. اکثر مردم برای رفتن از یک مکان به مکان دیگر از قطار استفاده می کنند. اما در ماه فوریه، Amtrak's California Zephyr مقصد من بود. می‌خواستم از سفر 53 ساعته از شیکاگوی برفی تا آفتابی امریویل کالیفرنیا لذت ببرم. به همین دلیل 2200 دلار برای یک اتاق خواب، یک کابین خصوصی با حمام کامل هزینه کردم. در حالی که برای اقامت در اتاق کوچک و متحرک هتل هیجان زده بودم، به این فکر می کردم که آیا از خرج کردن این همه پشیمان می شوم. در نهایت مطمئن بودم که انتخاب درستی برای چنین سفر طولانی انجام داده ام. در اینجا نگاهی به داخل اتاق خواب 50 فوت مربعی می اندازیم. اتاق خواب من در eceive debt relief. A January 2025 decision under the Biden administration expanded the timeframe for relief, allowing more borrowers to qualify. The lawsuit said the department has not been adhering to the timeframe extension. \"The Department cannot make promises to students and then pretend that those promises do not exist,\" said Alexander Elson, vice president of Student Defense, in a statement. \"Thousands of borrowers are entitled to discharges under the Department's 2025 Decision, and we are going to court to make sure they receive them.\" The Education Department did not immediately respond to a request for comment from Business Insider. The lawsuit said that despite qualifying for relief, Gaussoin and other affected borrowers have been required to keep paying down their balances. Those who do not or cannot repay face the consequences of default , including wage garnishment and the seizure of federal benefits, such as Social Security. Beyond closed school discharges, the Trump administration has faced a range of lawsuits over stalled debt relief. For example, advocacy groups have been pushing for the department to process relief for defrauded borrowers , in addition to those who received lower payments under a Biden-era repayment plan. The department has previously denied wrongdoing in the cases. Gaussoin, the plaintiff in the recent closed-school lawsuit, said he's struggling with \"tens of thousands of dollars of debt and no degree.\" \"When the Department expanded relief for Brooks stude", "date_str": "2026-10-29T14:25:31+00:00", "hash": "8e12d49ccb8ca05e", "title_fa": "یک دادخواست جدید می گوید که هزاران نفر از وام گیرندگان وام دانشجویی که مدارس آنها تعطیل شده است به طور غیرقانونی از پرداخت بدهی خودداری شده اند.", "summary_fa": "در یک دادخواست جدید آمده است که وزارت آموزش و پرورش در رسیدگی به بخشودگی بدهی دانشجویان برای هزاران وام گیرنده ناکام است. کوین کارتر/ گتی ایماژ وزارت آموزش و پرورش با شکایت دیگری به دلیل عدم پرداخت بدهی دانشجویان برای وام گیرندگا rade lately. Spending concerns and fears over rising rates and the economics of AI are brewing. But market veteran Ed Yardeni says investors have three reasons to stay bullish. The AI trade has been rattled in the last month, with Alphabet 's dismal third-quarter results on Wednesday that latest source of angst for investors. But market veteran Ed Yardeni says investors should think about three things to quell their anxiety. Investors are increasingly questioning whether massive AI spending will yield the results they want to see. Microsoft's decision to scale back its AI capex forecast likely isn't helping soothe fears that AI isn't paying off, and capex questions continue to swirl around the other big hypercalers, but Yardeni says that the good news still outweighs the bad. Here are three positive signs he's keeping tabs on. Spending remains robust While Microsoft dialed back its capex forecast for the year, Yardeni sees significant spending from other tech leaders. He highlighted the collective $235 billion AI financing figure that this week brought as a reason the sector is likely to keep growing. This number included $100 billion that Anthropic could raise from its IPO, as well as also $95 billion that Meta is anticipating to raise via new stock sales, and Elon Musk's move to have SpaceX borrow $40 billion to purchase new GPUs. AI economics are encouraging Yardeni's view of AI economics is centered on Anthropic, and he sees several reasons the AI lab's success should indicate to investors that AI compute demand is both strong, and sustainable. \"First, H1 revenues surged from $1.2 billion to $16.3 billion y/y,\" he listed. \"Second, operating losses narrowed from $2.1 billion to $693 million, with Q2 marking its first quarterly operating profit. Third, 11,900 customers now spend at least $100,000 annually, up from roughly 950 a year earlier. Fourth, revenue per dollar of compute expense increased more than fivefold to $2.08.\" Chip earnings have been strong Yar ’ve returned with another mini-series spin-off of our usual Vintage Pop Stardom series, titled Vintage Almost-Pop Stardom. All October, we ve been welcoming on some of our favorite guests (and one or two first-timers) to look at a quintet of really interesting artists during years in which they brushed against pop stardom, but perhaps never quite got all the way there (at least in this country). This week, we end the series with the brilliant Craig Jenkins of Vulture talking about System of a Down s whirlwind 2001, where the band became controversial chart-toppers with music and rhetoric that was transfixing at the time, and has only gotten more resonant (and more popular) in the quarter-century sense. Along the way, we answer all the most pressing questions about 2001 System: What circumstances allowed this thrashy, arty, explicitly challenging form of metal to get in the mix for the top of the Billboard charts? Did the band s combustibility — and the very different personalities of its four members — end up feeding its music? How much did the Clear Channel Memorandum actually affect the airplay of Chop Suey ? How do we feel about Serj Tankian s polarizing Understanding Oil essay and how he handled the blowback from it? Was it a big deal for Toxicity to be named SPIN s No. 1 album of 2001? And perhaps most importantly: Will the band ever record new music again? Check it out above — along with a YouTube playlist of some of the most important moments from System of a Down s 2001, all of which are discussed in the podcast. And subscribe to the Greatest Pop Stars podcast on Apple Music or Spotify (or wherever you get your podcasts ) for weekly discussions every Thursday about all things related to pop stardom! Find Craig s work at Vulture here , and follow him a", "date_str": "2026-10-29T16:18:57+00:00", "hash": "1930e8d8f0cd5b3f", "title_fa": "آیا System of a Down هنرمند تعیین کننده دوران 11 سپتامبر در سال 2001 بود؟ (پادکست بزرگترین ستاره های پاپ)", "summary_fa": "در ا داشت، شر را تقبیح نکرد. این ستاره هیپ هاپ که در ترینیداد و توباگو به دنیا آمد اما در کوئینز، نیویورک بزرگ شد، از سن 5 سالگی به ویدئویی که او در مورد اظهارات جنجالی هوچول در سال 2024 بازنشر داد، پاسخ داد که در آن بچه‌های سیاه پوستی در برانکس بزرگ شده‌اند که حتی نمی‌دانند کلمه «کامپیوتر» همان روز عذرخواهی کرده است. این سیاستمدار در آن زمان گفت: «من اشتباه گفتم و پشیمانم. چقدر بیشتر نیاز دارید تا از آنها بشنوید؟!! میناژ از این حادثه دو ساله نوشت. شما به عنوان سیاه پوستان چگونه جرات دارید به این نفرین شریرانه زننده رای دهید؟ شما به عنوان یک مسیحی چقدر جرات دارید؟! او در مورد آسیبی که به افراد بیگناه وارد می شود سکوت می کند. این چیزی است که", "image_url": "https://www.billboard.com/wp-content/uploads/2026/10/2301977707-e1793029181229.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["رسانه", "هنر"], "datetime_fa": "۷ آبان • ۱۹:۲۸"}, {"source": "Billboard", "title": "LISA Talks Vegas Residency Jitters, Why ‘SaWaDiKa’ Was the Perfect Solo Single & Her Labubu Obsession: ‘I Have No Space to Walk’", "link": "https://www.billboard.com/music/pop/lisa-blackpink-vegas-residency-sawadika-labubu-therapuss-1236370270/", "summary": "As she gears up to kick off her VIVA LA LISA residency at the Colosseum at Caesars Palace in Las Vegas on Nov. 12, BLACKPINK s LISA sat down with Jake Shane on his Therapuss podcast on Thursday (Oct. 29) to talk first night jitters, working with Rosalía and how she went from never hearing of Labubu dolls to helping to launch a worldwide phenomenon and being fully overwhelmed by the adorably ugly collectible plushies. Coming off of her 2026 MTV VMA win for best pop for Dream from her debut solo album, last year s Alter Ego , LISA said the boost she got from snagging her own Moon Person and debuting her single SaWaDiKa at the show amped her up for the Sin City run. Now I m like, OK, I m looking forward to my residency, she said, confessing that she was having butterflies about the residency before her VMA performance. I was so nervous, she said as she s gearing up for intense rehearsals for the six-show run that kicks off next month. SaWaDiKa, which debuted at No. 69 on the Billboard Hot 100, appears on LISA s recently released six-track Press Play EP. The singer said it made perfect sense as the first single from the EP because the phrase is the first thing you say when you say hi to people in Thailand and it fits with the influence of her home country on the album. The 29-year-old singer/actress said she spent six or seven months in Thailand reconnecting to her roots — enjoying the food, friends, family and weather — after living in Korea since she was 14. It feels so good to be back home. Home there. Real home, she said. So, when we re doing this EP, we re just like, ‘OK. I have so many, inspiration from my hometown.' That included putting one of the nation s ubiquitous three-wheeled tuk-tuk motorized rickshaw s in the SaWaDiKa video and filling her mood board with so many Thai-inspired ideas. And then we re always talking oh, what if we put a Thai sound and mix with a pop sound?,' she added about the EP s closing track, the Britney Spears-like burner Sweat, which features a mix of sultry beats and Thai guitar. Speaking of Spears, LISA said she was obsessed with the Gimme More singer as a kid thanks to a cousin who was a huge Brit booster. She listed off Toxic as one of her favorite Britney songs, as well as the 2008 Circus album, which featured the title track single, as well as Womanizer, If U Seek Amy and Radar. LISA revealed the origin of another obsession to Shane as well, one she stumbled on by accident, but which has since become a bit of a problem", "date_str": "2026-10-29T15:53:51+00:00", "hash": "68b892e1b13a966a", "title_fa": "LISA درباره محل اقامت وگاس نگران است، چرا «SaWaDiKa» تک‌نفره عالی بود و وسواس لابوبو او: «من فضایی برای راه رفتن ندارم»", "summary_fa": "در حالی که آماده می شود تا اقامتگاه VIVA LA LISA خود را در کولوسئوم در کاخ سزار در لاس وگاس در 12 نوامبر آغاز کند، لیزای BLACKPINK با جیک شین در پادکست Therapuss خود در روز پنج شنبه (29 اکتبر) به گفتگو نشست و با او صحبت کرد و صحبت کرد که چگونه با او کار می کرد که چگونه از روزالیا شروع به کار کرد و چگونه با او کار می کرد که چگونه از روزالیا کمک می کند. پدیده ای در سراسر جهان و غرق شدن کامل توسط مخمل های مخملی زشت و دوست داشتنی. لیزا پس از برنده شدن در MTV VMA در سال 2026 برای بهترین پاپ برای Dream از اولین آلبوم انفرادی خود، سال گذشته Alter Ego، گفت که تقویتی که از گیر دادن Moon Person خودش به دست آورد و اولین تک آهنگ SaWaDiKa خود را در این برنامه اجرا کرد، او را برای اجرای Sin City تقویت کرد. او گفت: \"حالا خوبم، من مشتاقانه منتظر اقامت خود هستم، او اعتراف کرد که قبل از اجرای VMA خود در مورد رزیدنسی پروانه هایی داشت. من خیلی عصبی بودم، او گفت در حالی که برای تمرین های شدید برای اجرای شش نمایشی که ماه آینده شروع می شود، آماده می شود. SaWaDiKa که در رتبه 69 بیلبورد Hot 100 قرار گرفت، در LISA که اخیراً منتشر شده است، در EP 6 آهنگ Press Play ظاهر می شود. این خواننده گفت که به عنوان اولین تک آهنگ از EP کاملاً منطقی است زیرا این عبارت اولین چیزی است که هنگام سلام کردن به مردم تایلند می گویید و با تأثیر کشور خود در آلبوم مطابقت دارد. این خواننده/بازیگر 29 ساله گفت که پس از زندگی در کره از 14 سالگی، شش یا هفت ماه را در تایلند گذراند تا دوباره به ریشه های خود متصل", "image_url": "https://www.billboard.com/wp-content/uploads/2026/10/2297466352-e1793284153452.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["موسیقی"], "datetime_fa": "۷ آبان • ۱۹:۲۳"}, {"source": "Billboard", "title": "Tate McRae’s ‘Housewife’ Debuts at No. 1 on Streaming Songs Chart", "link": "https://www.billboard.com/pro/tate-mcrae-housewife-number-1-streaming-songs-chart/", "summary": "Tate McRae reaches No. 1 on Billboard ’s Streaming Songs chart for the first time as a lead act, bowing atop the Oct. 31-dated tally with “Housewife.” In the week ending Oct. 22, the song earned 22.9 million chart-eligible streams in the United States, according to Luminate. McRae led Streaming Songs once before, as the featured act on Morgan Wallen ’s “What I Want.” The tune reigned for six weeks in 2025. McRae’s previous best as a lead act was “Tit for Tat,” which peaked at No. 2 in 2025. She first reached the survey in 2020 when “You Broke Me First” peaked at No. 29, while her first top 10 followed in 2023 via “Greedy” (No. 6). “Greedy” takes over the No. 1 spot on Streaming Songs from Ella Langley ’s “Choosin’ Texas,” which equaled Mariah Carey ’s “All I Want for Christmas Is You” mark for the most weeks at No. 1 on the chart in its 13-year history on the Oct. 24 ranking, logging its 26th week atop the list. “Choosin’ Texas” appears at No. 4 on the latest chart via 20 million streams, up 1%. Concurrently, as previously reported , “Housewife” debuts at No. 2 on the multimetric Billboard Hot 100 , her highest charting song as a lead act, surpassing the No. 3 peaks of “Greedy” and “Tit for Tat.” She boasts one No. 1, a one-frame rule by Wallen’s “What I Want.” “Housewife” is expected to be the lead single from McRae’s fourth studio album, which does not yet have a release date. Its predecessor, So Close to What , debuted at No. 1 on the Billboard 200 dated March 8, 2025, and has earned 2.8 million equivalent album units to date.", "date_str": "2026-10-29T15:45:16+00:00", "hash": "ad07b50701c4bcb9", "title_fa": "اولین آهنگ «خانه دار» از تیت مک ری در رتبه اول جدول ترانه های استریمینگ قرار گرفت.", "summary_fa": "تیت مک‌ری برای اولین بار به عنوان بازیگر اصلی به رتبه ۱ جدول آهنگ‌های استریم بیلبورد رسید و با «خانم‌دار» در صدر جدول تاریخ ۳۱ اکتبر قرار گرفت. طبق گزارش Luminate، در هفته منتهی به 22 اکتبر، این آهنگ 22.9 میلیون استریم واجد شرایط چارت در ایالات متحده را به دست آورد. مک‌ری پیش از این یک بار رهبری استریمینگ آهنگز را به‌عنوان نقش برجسته در آهنگ «آنچه می‌خواهم» مورگان والن بر عهده داشت. این آهنگ در سال 2025 به مدت شش هفته حکمفرما شد. بهترین آهنگ قبلی مک‌ری در نقش اصلی «Tit for Tat» بود که در سال 2025 به رتبه دوم رسید. او اولین بار در سال 2020 به این نظرسنجی رسید که «اول تو مرا شکستی» در رتبه 29 قرار گرفت، در حالی که اولین 10 رتبه برتر او در سال 2023 از طریق «Greedy» (شماره 6) دنبال شد. \"Greedy\" جایگاه اول را در Streaming Songs از \"Choosin' Texas\" به کارگردانی الا لنگلی می گیرد، که با رکورد \"All I Want for Christmas Is You\" اثر ماریا کری برای بیشترین هفته ها در رتبه اول جدول در تاریخ 13 ساله خود در 24 اکتبر قرار گرفت و در رده بندی 24 اکتبر قرار گرفت. \"Choosin' Texas\" در شماره شماره ظاهر می شود. رتبه 4 در آخرین نمودار از طریق 20 میلیون استریم، 1٪ افزایش یافته است. به طور همزمان، همانطور که قبلاً گزارش شده بود، \"Housewife\" اولین بار در رتبه 2 بیلبورد Hot 100 قرار گرفت که بالاترین آهنگ نمودار او به عنوان بازیگر اصلی است، و از قله های شماره 3 \"Greedy\" و \"Tit for Tat\" پیشی گرفت. او دارای یک شماره 1 است، قانون تک فریمی توسط والن «آنچه می خواهم». انتظار می‌رود که \"Housewife\" تک آهنگ اصلی چهارمین آلبوم استودیویی مک‌ری باشد که هنوز تاریخ انتشار آن مشخص نیست. نسخه قبلی آن، So Close", "image_url": "https://www.billboard.com/wp-content/uploads/2026/10/P108QT61-e1792423413481.jpg?w=1024", "category": "سینما و سریال", "tags": ["موسیقی"], "datetime_fa": "۷ آبان • ۱۹:۱۵"}, {"source": "Billboard", "title": "Neon Coast Names Nikki Boon Chief Creative Officer", "link": "https://www.billboard.com/pro/neon-coast-nikki-boon-chief-creative-officer/", "summary": "Artist management and entertainment company Neon Coast has named Nikki Boon as chief creative officer, expanding her role to lead creative oversight and direction, as well as international strategy, spanning Neon Coast s full management roster. Neon Coast s roster includes Kane Brown , Nightly, Randall King , Restless Road and Julia Cole. Related Merck Mercuriadis New Hipgnosis Is Rolling Eight Management Companies Into a ‘Juggernaut’ Kenny MacPherson, Veteran Music Publisher and Big Deal Music Co-Founder, Dies at 71 Diddy Moved From New Jersey Prison to Similar Facility in Pennsylvania Boon has been with the company for a decade, working with country music hitmaker Brown and indie alt-pop group Nightly. To date, Brown has earned 12 No. 1 songs on Billboard s Country Airplay chart and has earned RIAA Diamond certification for the songs Heaven and What Ifs. Boon has also been instrumental in propelling the Neon Coast roster globally. Nightly will tour Asia and Australia in January 2027, including stops in China, Japan, Singapore, Sydney and Brisbane. Boon was highlighted as one of five Executives on the Rise in Billboard s 2026 Country Power Players issue. Nikki’s creative thinking is second to none. She has a passion for our artists that you can feel in every conversation she has, Martha Earls , founder and owner of Neon Coast, said in a statement. Nikki dreams bigger than anyone I know and has the rare ability to take an idea beyond the unexpected and see possibilities others can’t imagine. Bringing that vision, creativity, and unique perspective to every artist on our roster is one of the greatest ways we can invest in their success. “I’m so grateful to Kane, who showed me from his earliest days on the road how powerful a real connection with fans can be, to Nightly, who taught me every angle of what it takes to be an independent artist today, and to Martha Earls, who has always encouraged me and our whole team to dream big, chase ideas and go after our own big wins,” Boon added. “In this new role, I’m excited to support each artist’s manager, building on what they’ve already created and finding new ways to connect with fans at home and around the world.”", "date_str": "2026-10-29T15:45:04+00:00", "hash": "d7f4146ead5818bf", "title_fa": "ساحل نئون نیکی بون، مدیر ارشد خلاقیت را معرفی کرد", "summary_fa": "شرکت مدیریت هنرمندان و سرگرمی نئون کوست، نیکی بون را به عنوان مدیر ارشد خلاقیت منصوب کرد و نقش او را به رهبری نظارت و هدایت خلاقیت و همچنین استراتژی بین‌المللی گسترش داد که شامل فهرست کامل مدیریت نئون کوست می‌شود. فهرست مدیران نئون کوست شامل کین براون، نایتلی، رندال کینگ، جاده بی‌قرار و جولیا کول می‌شود. مرتبط با Merck Mercuriadis Hipgnosis جدید هشت شرکت مدیریتی را تبدیل به یک «جاگرنوت» ک tle": "Usher & Chris Brown Bring R&B to No. 1 on Monthly Boxscore Report", "link": "https://www.billboard.com/pro/usher-chris-brown-top-monthly-boxscore-report/", "summary": "Since Billboard launched the monthly Boxscore charts in 2019, all types of acts have been No. 1 on the Top Tours chart. Men ( Elton John was first in February 2019), women ( P!nk followed the next month) and mixed-gender groups ( RBD in November 2023); stars of pop, rock, R B, country, Latin, rap, K-pop, and more. Solo artists and collectives – vocal groups like BTS and Spice Girls , bands like The Rolling Stones and Coldplay , and institutional touring ensembles like Trans-Siberian Orchestra . But in its 75th edition, ranking the biggest touring acts of September 2026, for the first time, co-headliners top the chart. According to figures reported to Billboard Boxscore, Usher and Chris Brown ’s The R B Tour grossed $77.4 million and sold 423,000 tickets across 10 shows in September, making it the highest-grossing and best-selling tour of the month. They are the first pair of artists to share the No. 1 spot on the chart. Usher and Brown came close earlier this summer, landing at No. 3 in July and August, blocked by BTS and The Weeknd in both months. And in the last seven years, other co-headline duos have come even closer. Def Leppard and Motley Crue ’s double-bill was No. 2 in Aug. 2022, held back by Bad Bunny . Red Hot Chili Peppers and Post Malone were runners-up in Jan. and Feb. 2023, stopped short by Elton John and Ed Sheeran , respectively. And last year, Kendrick Lamar and SZA scored silver in April and May 2025, bested by Coldplay and then by Beyoncé . September marks Usher’s first month at No. 1, having previously climbed as high as No. 3 as a soloist in Sept. and Oct. 2024. Brown returns to the top exactly one year after last reigning. He scored a record-tying trifecta with three straight months from July-Sept. 2025. Only Bad Bunny and Beyoncé have also been No. 1 for as many consecutive months. Usher and Brown’s monthly gross and attendance decline from their July and August takes, despite peaking in monthly rank. In July, The R B Tour earned $98.4 million and sold 538,000 tickets and in August, it brought in $91.8 million and sold 465,000. At $77.4 million and 423,000 for September, they are the first No. 1 since April to gross less than $100 million as the summer stadium season winds down in North America. The R B Tour began the month at Levi’s Stadium in Santa Clara, Calif. on Sept. 1 and ended in Glendale, Ariz.’s State Farm Stadium on the 29th. In between, they hit Las Vegas, Arlington, Texas (Dallas-area) and Inglewood, Calif. (Los Angeles)", "date_str": "2026-10-29T15:01:44+00:00", "hash": "04eda5b91aec1ff7", "title_fa": "آشر و کریس براون R&B را به شماره 1 در گزارش ماهانه Boxscore می آورند", "summary_fa": "از زمانی که Billboard نمودارهای ماهانه Boxscore را در سال 2019 راه اندازی کرد، همه انواع کنش ها در جدول Top Tours شماره 1 بودند. مردان (التون جان اولین بار در فوریه 2019 بود)، زنان (P!nk در ماه بعد) و گروه‌های جنسی مختلط (RBD در نوامبر 2023)؛ ستارگان پاپ، راک، آر بی، کانتری، لاتین، رپ، کی پاپ و غیره. هنرمندان و گروه‌های انفرادی – گروه‌های آوازی مانند بی‌تی‌اس و اسپایس گرلز، گروه‌هایی مانند رولینگ استونز و کلدپلی، و گروه‌های تور سازمانی مانند ارکستر ترانس سیبری. اما در هفتاد و پنجمین نسخه آن، با رتبه‌بندی بزرگ‌ترین تورهای سپتامبر 2026، برای اولین بار، همتایان در صدر جدول قرار گرفتند. بر اساس ارقام گزارش شده به Billboard Boxscore، تور The R B از Usher و Chris Brown در ماه سپتامبر 77.4 میلیون دلار فروش داشته و 423000 بلیت در 10 برنامه فروخته است که آن را به پردرآمدترین و پرفروش ترین تور ماه تبدیل کرده است. آنها اولین جفت هنرمندی هستند که رتبه اول جدول را به اشتراک می گذارند. آشر و براون در اوایل تابستان امسال به هم نزدیک شدند و به شماره شماره رسیدند. 3 در جولای و آگوست، توسط BTS و The Weeknd در هر دو ماه مسدود شده است. و در هفت سال گذشته، دیگر دوتاهای هم‌تیتر حتی نزدیک‌تر شده‌اند. اسکناس دوبل دف لپارد و موتلی کرو در آگوست 2022 شماره 2 بود
