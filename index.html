 از گذشته به قایق‌های کوچک و دیده‌بان‌های مستقر در مسیرهای دریایی متکی شده‌اند. خبرگزاری آسوشیتدپرس نیز با استناد به اعلام سپاه پاسداران مبنی بر غرق شدن یک کشتی باری پس از برخورد با مین دریایی در تنگه هرمز، نوشته است که مخاطرات کشتیرانی تجاری در این آبراه افزایش یافته است. به نوشته این خبرگزاری، کشتی‌های تجاری اکنون نه تنها با تهدیدهای لفظی و محدودیت‌های عبور و مرور، بلکه با خطر مستقیم حملات و آسیب‌های فیزیکی نیز روبه‌رو هستند. افزایش مستمر حملات به کشتی‌ها می‌تواند واشنگتن را ناچار کند میان پذیرش محدودیت‌های تردد دریایی و شدت بخشیدن به تلاش‌ها برای بازگشایی تنگه یکی را برگزیند. آسوشیتدپرس همچنین صحبت‌های محمد باقر قالیباف را که گفته ایران باید حتی در شرایط ادامه مذاکرات با واشنگتن، آمادگی خود را برای جنگ حفظ کند"}, {"source": "BBC Persian", "title": "کتاب‌های سالی رونی به دلیل حمایتش از گروه «اقدام برای فلسطین» در بریتانیا توزیع نمی‌شوند", "link": "https://www.bbc.com/persian/articles/ckqxne3rjvqzo?at_medium=RSS&at_campaign=rss", "summary": "سالی رونی، نویسنده ایرلندی رمان «آدم‌های معمولی»، می‌گوید که به دلیل حمایتش از گروه «اقدام برای فلسطین»، ناشرش دیگر کتاب‌های او را در بریتانیا توزیع نخواهد کرد. با این حال، نسخه‌های موجود آثار او همچنان در کتاب‌فروشی‌ها قابل فروش است.", "date_str": "2026-10-15T07:45:24+00:00", "hash": "2865cb05747328ab", "title_fa": "کتاب‌های سالی رونی به دلیل حمایتش از گروه «اقدام برای فلسطین» در بریتانیا توزیع نمی‌شوند", "summary_fa": "سالی رونی، نویسنده ایرلندی رمان «آدم‌های معمولی»، می‌گوید که به دلیل حمایتش از گروه «اقدام برای فلسطین»، ناشرش دیگر کتاب‌های او را در بریتانیا توزیع نخواهد کرد. با این حال، نسخه‌های موجود آثار او همچنان در کتاب‌فروشی‌ها قابل فروش است. این رمان‌نویس سال گذشته اعلام کرده بود که قصد دارد همچنان از درآمد حاصل از فروش کتاب‌هایش برای حمایت از این گروه استفاده کند؛ گروهی که دولت بریتانیا آن را یک سازمان تروریستی اعلام و فعالیتش را ممنوع کرده است. رونی در بیانیه‌ای به بی‌بی‌سی نیوز گفت که ادامه انتشار آثارش در بریتانیا می‌تواند «جرمی کیفری و جدی» محسوب شود و به همین دلیل با ناشرش، انتشارات فابر، توافق کرده است که توزیع کتاب‌های او در این کشور متوقف شود. او گفت: «من تمام تلاش خود را کرده‌ام تا درباره باورها و نیت‌هایم با مردم صادق باشم و کاملاً آماده‌ام پیامدهای آن را بپذیرم.» نسخه‌های الکترونیکی کتاب‌های رونی نیز از فروشگاه‌های آنلاین بریتانیا حذف شده‌اند، اما بسیاری از کتاب‌فروشی‌ها هنوز نسخه‌های چاپی آثار او را در اختیار دارند. کتاب‌فروشی زنجیره‌ای واترستونز به بی‌بی‌سی تایید کرد که انتشارات فابر به کتاب‌فروشی‌ها اطلاع داده است هیچ محدودیتی برای نگهداری و فروش نسخه‌های موجود کتاب‌های سالی رونی وجود ندارد. براساس گزارش یک وب‌سایت تخصصی صنعت نشر، بیش از شش میلیون نسخه از کتاب‌های سالی رونی در سراسر جهان فروخته شده که دو میلیون و ۳۰۰ هزار نسخه آن در بریتانیا بوده است. رمان «آدم‌های معمولی» در سال ۲۰۱۸ منتشر شد و دو سال بعد اقتباس تلویزیونی آن به سریالی پرطرفدار تبدیل شد. از دیگر رمان‌های رونی می‌توان به «میان‌پرده»، «گفت‌وگو با دوستان» و «دنیای زیبا، کجایی؟» اشاره کرد. انتشارات فابر در بیانیه‌ای به بی‌بی‌سی نیوز گفت: «قوانین کنونی بریتانیا شرایطی ایجاد کرده است که فابر نمی‌تواند درآمد حاصل از فروش آثار سالی رونی در بریتانیا را به او پرداخت کند.»"}, {"source": "BBC Persian", "title": "ظهور دوباره رهبر جدایی‌طلبان جنوب یمن؛ شکاف در جبهه ضدحوثی آشکار شد", "link": "https://www.bbc.com/persian/articles/c8r4yzr225yko?at_medium=RSS&at_campaign=rss", "summary": "عیدروس الزبیدی، رهبر شورای انتقالی جنوب یمن، پس از ماه‌ها غیبت با فراخوان «بسیج عمومی» در جنوب این کشور بار دیگر در انظار عمومی ظاهر شد و از عربستان سعودی خواست مطالبات جدایی‌طلبان را به رسمیت بشناسد. این سخنان واکنش‌های متضادی در رسانه‌های مخالف حوثی‌ها برانگیخت؛ از حمایت گسترده رسانه‌های حامی شورای انتقالی جنوب تا انتقادهایی که او را به تلاش برای احیای نفوذ سیاسی خود و ایجاد شکاف در جبهه ضدحوثی متهم کردند.", "date_str": "2026-10-15T06:22:11+00:00", "hash": "ec3faa9def075b42", "title_fa": "ظهور دوباره رهبر جدایی‌طلبان جنوب یمن؛ شکاف در جبهه ضدحوثی آشکار شد", "summary_fa": "عیدروس الزبیدی، رهبر شورای انتقالی جنوب یمن، پس از ماه‌ها غیبت با فراخوان «بسیج عمومی» در جنوب این کشور بار دیگر در انظار عمومی ظاهر شد و از عربستان سعودی خواست مطالبات جدایی‌طلبان را به رسمیت بشناسد. این سخنان واکنش‌های متضادی در رسانه‌های مخالف حوثی‌ها برانگیخت؛ از حمایت گسترده رسانه‌های حامی شورای انتقالی جنوب تا انتقادهایی که او را به تلاش برای احیای نفوذ سیاسی خود و ایجاد شکاف در جبهه ضدحوثی متهم کردند. عیدروس زبیدی، رهبر «شورای انتقالی جنوب»، گروه جدایی‌طلب مورد حمایت امارات در یمن، برای نخستین بار در چند ماه گذشته در انظار عمومی ظاهر شد. عیدروس زبیدی در اتاقی ساده، در حالی که نقشه و پرچم کشور مورد نظر خود برای جنوب یمن در پشت سرش دیده می‌شد، خواستار «بسیج عمومی» در جنوب یمن شد. این سخنرانی شش‌دقیقه‌ای به مناسبت شصت‌وسومین سالگرد آنچه او «انقلاب پرافتخار ۱۴ اکتبر» نامید، ایراد شد؛ انقلابی که در سال ۱۹۶۳ آغازگر شورش مسلحانه علیه حاکمیت بریتانیا در عدن و مناطق پیرامونی آن بود. نیروهای بریتانیایی در نوامبر ۱۹۶۷ عقب‌نشینی کردند و جنوب یمن در ۳۰ نوامبر همان سال استقلال یافت. زبیدی از «قبایل بزرگ جنوب» خواست که دست به تظاهرات بزنند و «برای پاسخ به فراخوان دفاع از میهن جنوبی‌مان آماده شوند». او اعلام کرد شورای انتقالی جنوب «مطابق مفاد اعلامیه قانون اساسی و بیانیه سیاسی صادرشده در دوم ژانویه امسال، مسیر سیاسی خود را ادامه خواهد داد». در دسامبر ۲۰۲۵، شورای انتقالی جنوب و نیروهای هم‌پیمان آن یک عملیات برق‌آسا را برای تصرف مناطق جنوبی و شرقی از دولت مورد حمایت عربستان سعودی آغاز کردند. این عملیات در اوایل ژانویه با اعلام قصد استقلال به اوج رسید. نیروهای سعودی و متحدان یمنی آنها سپس یک ضدحمله موفق انجام دادند که به خروج نیروهای اماراتی از یمن منجر شد. زبیدی پس از آن از «شورای رهبری ریاست جمهوری» کنار گذاشته"}, {"source": "BBC Persian", "title": "رئیس اداره اطلاعات خارجی روسیه برای گفت‌وگو با حکومت طالبان به افغانستان رفته است", "link": "https://www.bbc.com/persian/articles/c68xzg9pq8z1o?at_medium=RSS&at_campaign=rss", "summary": "سرگئی ناریشکین، رئیس سرویس اطلاعات خارجی روسیه، در سفری به کابل با عبدالحق وثیق، رئیس استخبارات حکومت طالبان، و چند تن دیگر از مقام‌های ارشد طالبان گفت‌وگو کرد. آقای ناریشکن دیروز وارد کابل شد. گزارش شده است که دو طرف در این دیدارها دربارهٔ «توسعهٔ روابط و همکاری‌های استخباراتی» رایزنی کرده‌اند.", "date_str": "2026-10-15T10:18:17+00:00", "hash": "c60688e6f2f654ba", "title_fa": "رئیس اداره اطلاعات خارجی روسیه برای گفت‌وگو با حکومت طالبان به افغانستان رفته است", "summary_fa": "سرگئی ناریشکین، رئیس سرویس اطلاعات خارجی روسیه، در سفری به کابل با عبدالحق وثیق، رئیس استخبارات حکومت طالبان، و چند تن دیگر از مقام‌های ارشد طالبان گفت‌وگو کرد. آقای ناریشکن دیروز وارد کابل شد. گزارش شده است که دو طرف در این دیدارها دربارهٔ «توسعهٔ روابط و همکاری‌های استخباراتی» رایزنی کرده‌اند. مشخص نیست که موضوع ویژه‌ای در این دیدارها مطرح بوده است یا خیر، اما براساس گزارش‌ها گفت‌وگوها حول محور «تبادل اطلاعات و همکاری‌های مشترک امنیتی» جریان داشته است. دو هفته پیش نیز روسیه یک هیئت نظامی وابسته به ادارهٔ آموزش وزارت دفاع حکومت طالبان را برای بازدید از تمرینات نظامی سال ۲۰۲۶ دعوت کرده بود؛ رزمایشی که ولادیمیر پوتین، رئیس‌جمهور روسیه، نیز در آن حضور داشت. روسیه تنها کشوری است که حکومت طالبان را در افغانستان به رسمیت می‌شناسد. حکومت طالبان در ماه ژوئیه گذشته اعلام کرد که یک توافق‌نامهٔ همکاری امنیتی با روسیه به امضا رسانده است. با این حال، سفر مقامی در این سطح به کابل کم‌سابقه به شمار می‌رود. پیش از این در ماه سپتامبر، ابراهیم کالین، رئیس سازمان استخبارات ترکیه نیز به کابل سفر کرده بود که بعداً اعلام شد هدف از آن سفر، تلاش برای کاهش تنش‌ها میان کابل و اسلام‌آباد بوده است. همزمان با این سفر همچنین حمد بن خمیس، معاون رئیس شورای امنیت ملی قطر نیز به کابل رفت. بر اساس گزارش‌ها آقای کالین مستقیماً از کابل به اسلام آباد پرواز کرد و در آنجا با فیلد مارشال عاصم منیر، فرمانده کل نیروهای مسلح پاکستان، و تعدادی از مقامات اطلاعاتی دیدار کرد. پیش از این نیز سرگئی لاوروف، وزیر امور خارجهٔ روسیه، نیز در نشست نمایندگان کشورهای منطقه در مورد افغانستان موسوم به «فرمت مسکو»، گفته بود که روسیه آمادگی دارد جهت عادی‌سازی روابط و پایان دادن به تنش‌ها میان پاکستان و افغانستان میانجی‌گری کند. از سوی دیگر، وزیر داخله روسیه برای"}, {"source": "BBC Persian", "title": "آیا حزب‌الله لبنان ۲۰۰ میلیون دلار از ایران برای کمک به آوارگان دریافت کرده است؟", "link": "https://www.bbc.com/persian/articles/cwdd824338n3o?at_medium=RSS&at_campaign=rss", "summary": "حزب‌الله لبنان از برنامه‌ای برای کمک به خانواده‌های آواره و آسیب‌دیده از جنگ به منظور اجاره مسکن و خرید لوازم منزل خبر داده است. ارزش کمک‌های این برنامه برای هر خانواده واجد شرایط به ۱۴ هزار دلار می‌رسد. این اعلام چند روز پس از انتشار گزارشی از خبرگزاری رویترز درباره دریافت ۲۰۰ میلیون دلار از ایران توسط حزب‌الله صورت گرفت؛ موضوعی که آمریکا آن را رد کرده است.", "date_str": "2026-10-15T05:01:49+00:00", "hash": "bc2791c3088a9d93", "title_fa": "آیا حزب‌الله لبنان ۲۰۰ میلیون دلار از ایران برای کمک به آوارگان دریافت کرده است؟", "summary_fa": "حزب‌الله لبنان از برنامه‌ای برای کمک به خانواده‌های آواره و آسیب‌دیده از جنگ به منظور اجاره مسکن و خرید لوازم منزل خبر داده است. ارزش کمک‌های این برنامه برای هر خانواده واجد شرایط به ۱۴ هزار دلار می‌رسد. این اعلام چند روز پس از انتشار گزارشی از خبرگزاری رویترز درباره دریافت ۲۰۰ میلیون دلار از ایران توسط حزب‌الله صورت گرفت؛ موضوعی که آمریکا آن را رد کرده است. علی دعموش، رئیس شورای اجرایی حزب‌الله، در ۱۳ اکتبر طی یک نشست خبری در شهرداری غبیری در حومه جنوبی بیروت گفت این کمک‌ها در چهار مرحله طی یک سال پرداخت خواهند شد و خانواده‌های واجد شرایطی را شامل می‌شوند که در جنگ‌های سپتامبر ۲۰۲۴ و مارس ۲۰۲۶ آسیب دیده‌اند. دعموش در سخنان خود دریافت مبلغی را که رویترز گزارش داده بود تایید نکرد و منبع تامین مالی این برنامه را نیز مشخص نکرد. او فقط گفت حزب‌الله درباره مجموع مبالغ هر یک از پرداخت‌های برنامه‌ریزی‌شده صحبت نمی‌کند. رویترز در گزارشی که ۷ اکتبر منتشر شد، به نقل از دو منبع مطلع نوشت حزب‌الله در ماه سپتامبر ۲۰۰ میلیون دلار از تهران دریافت کرده تا به لبنانی‌هایی که در نتیجه جنگ امسال با اسرائیل آواره شده‌اند کمک کند. به گفته این دو منبع، این پول با وجود تشدید فشار اقتصادی آمریکا بر ایران و افزایش دشواری انتقال پول به حزب‌الله به دست این گروه رسیده است، اما آن‌ها جزئیاتی درباره نحوه انتقال آن به لبنان ارائه نکردند. رویترز از واسطه‌هایی که در انتقال پول نقش داشته‌اند نقل کرده است که آن‌ها ۲۰ درصد کمیسیون دریافت کرده‌اند. یکی از این افراد گفته است این میزان چهار برابر نرخ معمول کمیسیون بوده و به گفته او با سطح خطر مرتبط با معامله با حزب‌الله تناسب داشته است. یکی از منابع گفت حزب‌الله برای انتقال پول از طریق شرکت‌های مالی‌ که پیش‌تر این کار را انجام"}, {"source": "BBC Persian", "title": "قوه‌ قضائیه ایران می‌گوید علی‌سینا مصطفوی را «به جرم اقدام مسلحانه در حمایت از اسرائیل» اعدام کرده است", "link": "https://www.bbc.com/persian/articles/cm15jvj4lnx8o?at_medium=RSS&at_campaign=rss", "summary": "قوه قضائیه ایران می‌گوید علی‌سینا مصطفوی به اتهام انجام آنچه «عملیات مسلحانه در حمایت از رضا پهلوی و رژیم صهیونیستی» در جریان جنگ اخیر ایران با آمریکا و اسرائیل خوانده شده، اعدام شده است.", "date_str": "2026-10-14T16:15:50+00:00", "hash": "a6ce196b01ce796c", "title_fa": "قوه‌ قضائیه ایران می‌گوید علی‌سینا مصطفوی را «به جرم اقدام مسلحانه در حمایت از اسرائیل» اعدام کرده است", "summary_fa": "قوه قضائیه ایران می‌گوید علی‌سینا مصطفوی به اتهام انجام آنچه «عملیات مسلحانه در حمایت از رضا پهلوی و رژیم صهیونیستی» در جریان جنگ اخیر ایران با آمریکا و اسرائیل خوانده شده، اعدام شده است. میزان، خبرگزاری رسمی قوه قضائیه جمهوری اسلامی، می‌گوید آقای مصطفوی در چهارم فروردین‌ و اول اردیبهشت ۱۴۰۵ در کرمان اقدام به تیراندازی کرده بود که به مجروح شدن چند نفر منجر شده است. به گزارش میزان آقای مصطفوی در اعتراضات دی‌ماه هم «فعال» بوده است و «اقدام به ارسال فیلم و تصاویر برای شبکه‌های معاند» کرده بود. تصویربرداری و ارسال فیلم برای رسانه‌های خارجی از «محل‌های اصابت پرتابه‌های دشمن» در جریان جنگ از موارد اتهامی دیگر آقای مصطفوی اعلام شده است. میزان می‌گوید حکم اعدام آقای مصطفوی پس از تایید در دیوان عالی کشور صبح چهارشنبه اجرا شده است. گروه «دادبان» که جمعی از فعالان حقوق بشر و حقوقدانان آن را تشکیل داده‌اند، پیشتر نسبت به انتقال آقای مصطفوی به «بند انفرادی زندان شهاب کرمان» و احتمال اجرای حکم او هشدار داده بود. حساب دفتر شاهزاده رضا پهلوی، پیش از اعدام آقای مصطفوی، او را «جوانی میهن‌پرست» توصیف کرده و نوشته بود که او «کوهنورد و فاتح قله‌های متعدد» است. دفتر رضا پهلوی همچنین گفته بود که آقای مصطفوی «در پی اعترافات اجباری تحت شکنجه، در دادگاه نمایشی جمهوری اسلامی به اعدام محکوم شده است.» خبرگزاری میزان، وابسته به قوه زی عمدی شدید مجرم شناخت. هر دو متهم تبار افغانستانی دارند اما ساکن دانمارک بودند و بر اساس اعلام دادگاه، محرز شد که در آلمان برای شناسایی اهداف احتمالی شامل یوزف شوستر، رئیس شورای مرکزی یهودیان آلمان، و فولکر بک، رئیس انجمن آلمانی-اسرائیلی و نمایندهٔ پیشین پارلمان آلمان، فعالیت کرده‌اند. دادگاه همچنین اعلام کرد متهم اصلی مقدمات حملهٔ آتش‌زا به یک فروشگاه مواد غذایی کوشر در برلین را فراهم کرده بود. فروشگاه‌های کوشر مواد غذایی مطابق با قوانین مذهبی یهودیان عرضه می‌کنند. بر اساس اعلام دادستانی فدرال آلمان، متهم اصلی مأموریت‌های خود را مستقیماً از افسران نیروی قدس، شاخهٔ برون‌مرزی سپاه پاسداران، دریافت می‌کرد و مأمور جمع‌آوری اطلاعات دربارهٔ شخصیت‌های سرشناس یهودی و حامی اسرائیل در آلمان و همچنین مراکز تجاری متعلق به یهودیان بود. به‌گفتهٔ دادستانی، هدف از این فعالیت‌ها فراهم کردن مقدمات حملات احتمالی، از جمله ترور شخصیت‌های مورد نظر و آتش زدن مراکز تجاری یهودیان، بود. متهم اصلی سپس با مرد دیگر «تواب م» تماس گرفت و بر اساس گزارش خبرگزاری آلمان، تلاش کرد او را را برای ترور فولکر بک به خدمت"}, {"source": "Radio Farda", "title": "ترامپ: شاید بهتر بود رهبران ایران را نمی‌کشتیم؛ دیگر نمی‌دانم با چه کسی مذاکره کنم", "link": "https://www.radiofarda.com/a/trump-perhaps-it-would-have-been-better-if-iran-s-leaders-had-not-been-killed-unclear-who-to-negotiate-with/33877013.html", "summary": "این نخستین بار نیست رئیس‌جمهور آمریکا از پیامد حذف شمار بسیاری از مقامات و فرماندهان ارشد نظامی جمهوری اسلامی ایران سخن می‌گوید.", "date_str": "2026-10-15T08:03:02+00:00", "hash": "3abb8aaf4eccbd29", "title_fa": "ترامپ: شاید بهتر بود رهبران ایران را نمی‌کشتیم؛ دیگر نمی‌دانم با چه کسی مذاکره کنم", "summary_fa": "این نخستین بار نیست رئیس‌جمهور آمریکا از پیامد حذف شمار بسیاری از مقامات و فرماندهان ارشد نظامی جمهوری اسلامی ایران سخن می‌گوید. دونالد ترامپ، رئیس‌جمهور آمریکا، بار دیگر گفت شاید بهتر بود شماری از رهبران جمهوری اسلامی در حملات نظامی کشته نمی‌شدند، زیرا اکنون واشینگتن نمی‌داند برای مذاکره با ایران باید با چه کسی گفت‌وگو کند. ترامپ روز چهارشنبه ۲۲ مهر در یک گردهمایی انتخاباتی در ایالت مونتانا گفت: «شاید بهتر بود رهبران‌شان را باقی می‌گذاشتم، چون دیگر اصلاً نمی‌دانم با چه کسی داریم مذاکره می‌کنیم.» او بار دیگر با اشاره به کشته شدن شماری از مقام‌های ارشد جمهوری اسلامی در حملات آمریکا و اسرائیل گفت: «رهبران ردهٔ اول‌شان همگی از بین رفته‌اند. رهبران ردهٔ دوم‌شان همگی از بین رفته‌اند. نیمی از رهبران ردهٔ سوم‌شان هم از بین رفته‌اند.» رئیس‌جمهور آمریکا سپس افزود که مهم‌ترین درخواست کنونی مقام‌های جمهوری اسلامی در مذاکرات این است: «می‌شود لطفاً اجازه بدهید زنده بمانیم؟» ترامپ در این باره توضیح بیشتری نداد اما در یک گردهمایی انتخاباتی دیگر در ایالت آریزونا نیز به پیامدهای کشته شدن مقام‌های ارشد جمهوری اسلامی اشاره کرد و گفت: «این یکی از مشکلات است. شاید من زیاده‌روی کرده باشم. دیگر نمی‌دانم با چه کسی باید معامله کنم!» او در ادامه افزود: «آن‌ها از من قول گرفتند که دیگر کسی را از بین نبرم و من هم قول دادم. به آن‌ها قول دادم.» ترامپ در این‌جا هم توضیح نداد که این قول را به چه کسانی و در چه زمانی داده است. این نخستین بار نیست که او از پیامد حذف این تعداد از سران جمهوری اسلامی سخن می‌گوید. رئیس‌جمهور آمریکا پیشتر، ۲۰ مهرماه، نیز با لحنی کنایه‌آمیز از «زیاده‌روی» در کشتن مقام‌های ارشد جمهوری اسلامی سخن گفته بود. او در آن سخنرانی گفت: «راستش را بخواهید، برایمان سخت شده بفهمیم اصلاً باید با کدام لعنتی طرف شویم. فکر می‌کنم زیاده‌روی"}, {"source": "Radio Farda", "title": "افزایش قیمت انرژی و مواد غذایی ناشی از جنگ ۱۳۰ میلیون نفر دیگر را در معرض فقر قرار داده است", "link": "https://www.radiofarda.com/a/un-global-poverty-risk-iran-war-energy-prices/33877012.html", "summary": "این هشدار سازمان ملل در شرایطی است که افزایش بدهی‌ها و بحران‌های پیاپی، توانایی کشورهای فقیر برای حمایت از شهروندان خود را به‌شدت محدود کرده است.", "date_str": "2026-10-15T07:00:55+00:00", "hash": "cad5e02b346d8586", "title_fa": "افزایش قیمت انرژی و مواد غذایی ناشی از جنگ ۱۳۰ میلیون نفر دیگر را در معرض فقر قرار داده است", "summary_fa": "این هشدار سازمان ملل در شرایطی است که افزایش بدهی‌ها و بحران‌های پیاپی، توانایی کشورهای فقیر برای حمایت از شهروندان خود را به‌شدت محدود کرده است. برنامهٔ توسعهٔ سازمان ملل متحد هشدار داد که افزایش قیمت انرژی و مواد غذایی در پی جنگ خاورمیانه می‌تواند حدود ۱۳۰ میلیون نفر دیگر را در سال جاری میلادی به زیر خط فقر بکشاند. این هشدار در شرایطی است که افزایش بدهی‌ها و بحران‌های پیاپی، توانایی کشورهای فقیر برای حمایت از شهروندان خود را به‌شدت محدود کرده است. الکساندر دِ کرو، رئیس این نهاد وابسته به سازمان ملل، روز پنج‌شنبه ۲۳ مهر در گفت‌وگو با خبرگزاری فرانسه در بانکوک گفت که بسیاری از کشورهای در حال توسعه برای مقابله با افزایش قیمت انرژی به پرداخت یارانه‌های گسترده روی آورده‌اند، اما منابع مالی آن‌ها برای ادامهٔ این حمایت‌ها رو به پایان است. او که در حاشیهٔ نشست‌های سالانهٔ صندوق بین‌المللی پول و بانک جهانی سخن می‌گفت، وضعیت این کشورها را به خانه‌ای در حال سوختن تشبیه کرد که صاحب آن ناچار است هم‌زمان سقفش را نیز تعمیر کند. دِ کرو گفت دولت‌های کشورهای در حال توسعه هنوز فرصت نیافته‌اند پیامدهای بحران‌های پیشین، از جمله همه‌گیری کرونا و جنگ اوکراین را جبران کنند که با شوک اقتصادی تازه‌ای ناشی از جنگ خاورمیانه روبه‌رو شده‌اند. از زمان آغاز حملات آمریکا و اسرائیل به ایران در اسفند ۱۴۰۴، قیمت جهانی انرژی به‌شدت افزایش یافته و حملات تلافی‌جویانهٔ ایران به کشورهای منطقه و اختلال در صادرات نفت و گاز از خلیج فارس فشار بیشتری بر بازارهای جهانی وارد کرده است. بر اساس گزارش تازهٔ برنامهٔ توسعهٔ سازمان ملل که ۱۹ مهر منتشر شد، اگر دولت‌ها افزایش قیمت انرژی و مواد غذایی را بدون پرداخت یارانه و حمایت‌های جبرانی به‌طور کامل به مصرف‌کنندگان منتقل می‌کردند، حدود ۱۳۰ میلیون نفر دیگر در سال جاری میلادی به زیر خط فقر سقوط می‌کردند."}, {"source": "Radio Farda", "title": "صندوق بین‌المللی پول: ادامه جنگ می‌تواند شوک اقتصادی شدیدتری به خاورمیانه وارد کند", "link": "https://www.radiofarda.com/a/imf-middle-east-war-economic-risks-energy-disruptions/33876998.html", "summary": "جهاد ازعور: «جنگ شوک اقتصادی بسیار نامتوازنی به منطقه وارد کرده و کشورهایی که مستقیماً درگیر آن هستند، با فشارهای شدیدی روبه‌رو شده‌اند.»", "date_str": "2026-10-15T06:38:56+00:00", "hash": "d6b9b008f8e1c481", "title_fa": "صندوق بین‌المللی پول: ادامه جنگ می‌تواند شوک اقتصادی شدیدتری به خاورمیانه وارد کند", "summary_fa": "جهاد ازعور: «جنگ شوک اقتصادی بسیار نامتوازنی به منطقه وارد کرده و کشورهایی که مستقیماً درگیر آن هستند، با فشارهای شدیدی روبه‌رو شده‌اند.» صندوق بین‌المللی پول هشدار داد که طولانی شدن جنگ در خاورمیانه و بروز اختلال‌های تازه در تولید انرژی، مسیرهای کشتیرانی و زیرساخت‌های حیاتی، بزرگ‌ترین خطر پیش روی اقتصاد کشورهای منطقه است و ظرفیت آن‌ها برای مقابله با پیامدهای جنگ رو به کاهش است. جهاد ازعور، مدیر بخش خاورمیانه و آسیای مرکزی این نهاد، روز پنج‌شنبه ۲۳ مهر در نشستی خبری در بانکوک گفت که جنگ شوک اقتصادی بسیار نامتوازنی به منطقه وارد کرده و کشورهایی که مستقیماً درگیر آن هستند، با فشارهای شدیدی روبه‌رو شده‌اند. او که در حاشیهٔ اجلاس سالانهٔ صندوق بین‌المللی پول و بانک جهانی سخن می‌گفت، تأکید کرد که چشم‌انداز اقتصادی منطقه تا حد زیادی به سرعت بازگشت تولید انرژی و تجارت به شرایط عادی و توانایی دولت‌ها در حفظ ثبات اقتصادی بستگی دارد. به‌گفتهٔ این مقام صندوق بین‌المللی پول، کشورهای منطقه تاکنون توانسته‌اند با استفاده از ذخایر انرژی، مسیرهای جایگزین صادرات و حمل‌ونقل و تعدیل تقاضا، بخشی از پیامدهای اقتصادی جنگ آمریکا و اسرائیل با ایران و بسته شدن تنگهٔ هرمز را مهار کنند. با این حال، ازعور هشدار داد که این اقدامات تنها فرصتی موقت برای اقتصادهای منطقه فراهم کرده و ظرفیت آن‌ها نامحدود نیست. او گفت: «ذخایر کاهش یافته، ظرفیت مازاد تولید محدودتر شده و اختلال تازه می‌تواند به تغییرات بسیار شدیدتری در قیمت‌ها منجر شود.» این هشدار در شرایطی مطرح می‌شود که با گذشت بیش از هفت ماه از آغاز جنگ، صادرات انرژی از منطقه همچنان با محدودیت روبه‌روست و حملات به زیرساخت‌های نفتی و مسیرهای کشتیرانی ادامه دارد. صندوق بین‌المللی پول در تازه‌ترین ارزیابی خود پیش‌بینی کرده است که اقتصاد منطقهٔ خاورمیانه، شمال آفریقا و پاکستان، پس از رشد ۳.۳ درصدی در سال ۲۰۲۵، امسال ۱.۳ درصد کوچک شود."}, {"source": "Radio Farda", "title": "قالیباف بار دیگر از تفاهم‌نامه اسلام‌آباد دفاع کرد و گفت آمریکا باید «تنبیه» شود", "link": "https://www.radiofarda.com/a/iran-qalibaf-us-broken-promises-punishment-peace-talks/33876980.html", "summary": "محمدباقر قالیباف، رئیس مجلس شورای اسلامی و مسئول تی       tech: [{"source": "MIT AI", "title": "Q&A: The “collision” between AI, your brain, and society", "link": "https://news.mit.edu/2026/collision-between-ai-your-brain-and-society-eric-so-book-1015", "summary": "As artificial intelligence use becomes more widespread, scholars are working to understand its effects on the people who use it. MIT Professor Eric So offers one of the most complete syntheses yet, in his new book, “The Collision: What AI Does to Us,” published this month by W.W. Norton. Recognizing that AI offers opportunities to complete work faster, and in some cases has been turned into useful domain-specific tools, So nonetheless looks at the costs of relying on it too broadly. He contends that heavy use of AI can lead to a kind of cognitive atrophy, in which people fail to develop and retain essential thinking skills. In general, he says, evidence shows that our ability to learn gets dramatically better when we wrestle with material, work through initial failures, keep iterating, and in the process acquire better thinking skills while retaining more knowledge. These conclusions are drawn from recent research by So and others, in academia and industry, including analysis from AI firms themselves, such as an Anthropic study showing that about half of queries from college students were low-effort queries for simple answers. So also weaves personal reflections into his narrative — having long studied financial markets and behavior, he is familiar with analyzing how new tools and information affect our decisions. MIT News talked to So, who is the Sloan Distinguished Professor of Global Economics and Behavioral Science in the MIT Sloan School of Management, about the book. Q: What prompted you to write “The Collision”? A: I wrote this book in response to patterns I was seeing in myself and other individuals. I open the book with this story where I was instinctively reaching for AI to help me think through problems I normally would have handled myself. A colleague had reached out for assistance and I had essentially taken her question and written half a sentence, then said, “ChatGPT, help me finish this professionally.” I made a few light edits and sent it off. And I sat back and really felt incredibly concerned about how I had removed my own thinking from the process. I have found students are outsourcing their thinking to AI, rather than thinking through things themselves, turning to it to answer homework that would normally help them build mastery in a subject. We need to start understanding what this technology is doing to us and how it interacts with human cognition and our psychology, and give people some practical insights. Q: Part of that means unde", "date_str": "2026-10-15T04:00:00+00:00", "hash": "fdbaddf2a67d50b3", "title_fa": "پرسش و پاسخ: \"برخورد\" بین هوش مصنوعی، مغز شما و جامعه", "summary_fa": "همانطور که استفاده از هوش مصنوعی گسترده تر می شود، محققان در حال تلاش برای درک اثرات آن بر افرادی هستند که از آن استفاده می کنند. پروفسور MIT، اریک سو، در کتاب جدید خود با عنوان «برخورد: آنچه هوش مصنوعی با ما انجام می‌دهد» که در این ماه توسط W.W منتشر شد، یکی از کامل‌ترین ترکیب‌ها را ارائه می‌کند. نورتون. با توجه به اینکه هوش مصنوعی فرصت‌هایی را برای تکمیل سریع‌تر کار ارائه می‌کند و در برخی موارد به ابزارهای مفیدی برای دامنه تبدیل شده است، بنابراین به هزینه‌های تکیه بر آن بسیار گسترده نگاه می‌کند. او معتقد است که استفاده زیاد از هوش مصنوعی می‌تواند منجر به نوعی آتروفی شناختی شود که در آن افراد نمی‌توانند مهارت‌های اساسی تفکر را توسعه دهند و حفظ کنند. به‌طور کلی، او می‌گوید، شواهد نشان می‌دهند که توانایی ما برای یادگیری زمانی که با مطالب دست و پنجه نرم می‌کنیم، با شکست‌های اولیه کار می‌کنیم، به تکرار ادامه می‌دهیم و در این فرآیند مهارت‌های فکری بهتری را کسب می‌کنیم و دانش بیشتری را حفظ می‌کنیم، به طرز چشمگیری بهتر می‌شود. این نتیجه‌گیری‌ها از تحقیقات اخیر So و دیگران در دانشگاه و صنعت، از جمله تجزیه و تحلیل از خود شرکت‌های هوش مصنوعی، مانند یک مطالعه Anthropic که نشان می‌دهد حدود نیمی از پرسش‌های دانشجویان کالج، d forecasts for this range, which is already very useful for farmers and members of the energy industry trying to match supply with demand, but it also improves predictions of extreme weather events, whether it’s flooding or cold spells or something else,” co-author and MIT Research Scientist Judah Cohen says. “It’s really important to predict both, but extreme events might be the most impactful part of this for society.” Joining Cohen on the paper are lead authors Hannah Guan, a Harvard College undergraduate; Soukayna Mouatadid, a University of Toronto postdoc; Genevieve Flaspohler SM ’18, PhD ’22; Paulo Orenstein, an associate professor at Brazil’s National Institute for Pure and Applied Mathematics; Jeremy Berman of the data company DTN; Jakob Schloer and Joshua Talib, researchers with the European Center for Medium-Range Weather Forecasts; and Alex Lu, Haiyu Dong, Jonathan Weyn, Zekun Ni, and Lester Mackey, all researchers at Microsoft. Longer forecasts In the 1970s, longtime MIT Professor Edward Lorenz came up with the idea of chaos theory to describe how tiny changes in initial weather conditions lead to completely different outcomes. “He came up with this the", "date_str": "2026-10-14T15:00:00+00:00", "hash": "36396cffe71cd4ef", "title_fa": "محققان پیش بینی های آب و هوا را به مدت دو تا شش هفته بهبود می بخشند", "summary_fa": "در سال 2021، تگزاس پس از سه طوفان شدید زمستانی در ماه فوریه، با بدترین شکست زیرساخت های انرژی در تاریخ ایالت مواجه شد. حداقل 246 نفر در نتیجه این اختلالات کشته شدند که منجر به کمبود غذا، آب، گرما و برق شد. اگر مقامات انرژی زمان بیشتری برای آماده شدن برای طوفان‌ها داشتند، برای مثال با آوردن کامیون‌های گاز طبیعی بیشتر به مناطق مختل شده، آسیب‌های ناشی از این رویداد می‌توانست کاهش یابد. متأسفانه، پیش‌بینی‌های آب‌وهوای بیش از دو هفته به‌طور بدنام غیرقابل اعتماد هستند، و دریچه تنگ‌تر را برای اپراتورهای انرژی، کشاورزان و مقامات واکنش اضطراری در سراسر جهان ایجاد می‌کنند. یک تکنیک جدید توسط یک تیم از محققان MIT پیش بینی آب و هوا را بیش از دو هفته ezer خواهان راهی برای حذف موسیقی هوش مصنوعی از فیدهای خود هستند. Deezer ابزار تشخیص هوش مصنوعی را سال گذشته اضافه کرد و از آن زمان تاکنون تعداد آهنگ‌هایی را که در این پلتفرم آپلود می‌شوند گزارش می‌دهد. در آن زمان، آهنگ‌های تولید شده با هوش مصنوعی 10 درصد از آپلودهای روزانه را نشان می‌دادند. در ماه جولای، این شرکت اعلام کرد که بیش از 50 درصد از آپلودهای روزانه در پلتفرم خود، آهنگ های ایجاد شده توسط هوش مصنوعی بوده و به طور میانگین 90000 آهنگ در روز وجود دارد. سایر سرویس"}, {"source": "TechCrunch AI", "title": "Save 50% on your TechCrunch Disrupt 2026 ticket and join the last 2 days in San Francisco’s Moscone West", "link": "https://techcrunch.com/2026/10/14/save-50-on-your-techcrunch-disrupt-2026-ticket-and-join-the-last-two-days-in-san-francisco/", "summary": "Get a 50% discount on the last two days of TechCrunch Disrupt 2026, October 14-15, in San Francisco. Register now and join the rest of the startup ecosystem. Today, it's all about physical and software AI.", "date_str": "2026-10-14T15:13:24+00:00", "hash": "1d3f25ee1bfed966", "title_fa": "50٪ در بلیط TechCrunch Disrupt 2026 خود صرفه جویی کنید و به 2 روز گذشته در Moscone West سانفرانسیسکو بپیوندید", "summary_fa": "به عنوان مثال، در Disrupt Stage، ما هنوز سخنرانان ستاره‌ای مانند مارک والبرگ، بازیگر A-list، امجد مساد، مدیرعامل Replit، هر پنج شریک بنچمارک در یک ظاهر مشترک نادر، Panos Panay از آمازون، مدیرعامل و مدیر اجرایی Bluesky، تونی اشنایدر و رز وانگ داریم... این لیست ادامه دارد. به علاوه، دو مرحله شاخص هوش مصنوعی وجود دارد که شامل الکساندر امبیریکوس، رئیس محصولات سازمانی OpenAI است که در مورد راه‌اندازی نمایندگان Dots شرکت، همراه با رهبران Anthropic، Hugging Face، Clay و غیره صحبت خواهد کرد. این بالاتر از بیش از 320 غرفه‌دار است که استارت‌آپ‌های خود را در سالن مملو و بازسازی‌شده اکسپو به نمایش می‌گذارند، جلسات گسترده و میزگردهای تعاملی که می‌توانید به آنها بپیوندید، فرصت‌های شبکه‌ای و رویدادهای جانبی که در سراسر سانفرانسیسکو رخ می‌دهند. به علاوه، مسابقه Startup Battlefield 200 همچنان در مرحله Disrupt Stage به قوت خود ادامه دارد. با نصف قیمت، خط بلیط ما اکنون در این آدرس ارائه می شود: و برای تجربه بیشتر در سطح اولیه در Disrupt، ما سه گزینه دیگر داریم: اکنون زمان آن است که به این تماس لحظه آخری برای پیوستن به Disrupt اقدام کنیم. اگر مؤسسی هستید که روی حصار نشسته‌اید و می‌خواهید با سرمایه‌گذاری ملاقات کنید که می‌تواند بودجه مورد نیاز شما را تأمین کند، با یکی از بنیان‌گذاران احتمالی ارتباط برقرار کند، از کسانی که قبلاً ساخته‌اند بیاموزید یا فقط جامعه شما را گسترش دهد، این تخفیف 50 درصدی در اینجا موجود است. منتظر نباشید تا فقط یک روز برای پیوستن به هیجان باقی بماند! وقتی از طریق پیوندهای موجود در مقالات ما خرید می کنید، ممکن است کمیسیون کمی کسب کنیم. این بر استقلال تحریریه ما تأثیر نمی گذارد. رویدادهای TechCrunch مشاهده بیوگرافی 13 اکتبر 15 سانفرانسیسکو 50% تخفیف برای پاس دوم دریافت کنید تجربه Disrupt قرار است به اشتراک گذاشته شود. پاس خود را بگیرید"}, {"source": "TechCrunch AI", "title": "Zenzap raises $44M for its AI chat app that aims to replace WhatsApp in the workplace", "link": "https://techcrunch.com/2026/10/14/zenzap-raises-44m-for-its-ai-chat-app-that-aims-to-replace-whatsapp-in-the-workplace/", "summary": "Zenzap is used by organizations including Starbucks and Taco Bell.", "date_str": "2026-10-14T15:08:00+00:00", "hash": "64fa9f554ec4e905", "title_fa": "Zenzap 44 میلیون دلار برای برنامه چت هوش مصنوعی خود جمع آوری می کند که هدف آن جایگزینی WhatsApp در محل کار است.", "summary_fa": "Zenzap توسط سازمان هایی از جمله Starbucks و Taco Bell استفاده می شود. بسیاری از کسب‌وکارها در سراسر جهان از برنامه‌های چت مصرف‌کننده مانند WhatsApp، Telegram، Discord یا iMessage برای گفتگو و هماهنگی با کارکنان و تبادل اسناد یا داده‌ها استفاده می‌کنند. گای وایس در حال ساخت Zenzap است، یک پیام‌رسان خصوصی با هوش مصنوعی که می‌خواهد به شرکت‌ها کمک کند تا با کارکنان خود ارتباط برقرار کنند و آنها را در چارچوب سازمان خود مسلح کنند و در عین حال مطابق با قوانین فناوری اطلاعات و امنیت باشند. این شرکت ۴۴ میلیون دلار سرمایه از سرمایه‌گذارانی از جمله Bessemer، Lightspeed، و The Garage و همچنین سرمایه‌گذاران فردی، رئیس Wix، Nir Zohar و GM سابق EY، Yoram Tietz، جذب کرده است. جمع آوری کمک مالی جالب است زیرا ویس برای اولین بار در حرفه خود پول جمع آوری می کند. در سال 2012، او پلتفرم بازاریابی تجارت الکترونیک StuccoMedia را راه اندازی کرد و آن را در سال 2015 به گروه مارکت فروخت. پس از آن، او برای چند سال سرمایه گذار شد. در سال 2022، او زنزاپ را پس از آشنایی با شریک Bessemer، آدام فیشر و بررسی ایده های مختلف به همراه بنیانگذاران فعلی خود، نوام نویمان و جاناتان بین، تأسیس کرد. ویس گفت که ابتدا برنامه را بوت استرپ کرد و از دفتر بسمر کار کرد. من نمی خواستم سرمایه جذب کنم. تنها چیزی که باید از دست می‌دادم اسمم بود و خیلی می‌ترسیدم که دور دوم را به‌عنوان یک بنیان‌گذار انجام دهم و شکست بخورم، زیرا دور اول من بسیار موفق بود. من نیازی به کار برای پول نداشتم او به TechCrunch گفت، بنابراین، وقتی با آدام آشنا شدم، در واقع ایده خود را با سرمایه شخصی خودم شروع کردم. ویس گفت که فیشر او را متقاعد کرد که Zenzap باید یک کسب و کار با"}, {"source": "TechCrunch AI", "title": "Floqer’s AI agents research sales prospects so teams don’t have to", "link": "https://techcrunch.com/2026/10/14/floqers-ai-agents-help-b2b-revenue-teams-research-customers/", "summary": "The problem Floqer is trying to solve is familiar to anyone who has worked in sales or revenue operations.", "date_str": "2026-10-14T15:00:00+00:00", "hash": "1b41dd41d4134da1", "title_fa": "عوامل هوش مصنوعی Floqer در مورد چشم انداز فروش تحقیق می کنند تا تیم ها مجبور نباشند", "summary_fa": "مشکلی که فلقر سعی در حل آن دارد برای هر کسی که در عملیات فروش یا درآمد کار کرده است آشناست. Floqer یک پلت فرم دانش مشتری مستقل است که به تیم های فروش و بازاریابی کسب و کار به تجارت یک پایگاه داده مبتنی بر هوش مصنوعی را ارائه می دهد که برای جمع آوری، سازماندهی و به روز رسانی مداوم اطلاعات مورد استفاده برای درک مشتریان خود طراحی شده است. Floqer همچنین می‌گوید درآمد سالانه سالانه (ARR) از 1.2 میلیون دلار فراتر رفته است و درآمد کلی آن در سال گذشته تقریباً ده برابر شده است. این استارت‌آپ توسط شیوام ماهاجان، مدیرعامل و زاهده اسلام که در دانشگاه با هم آشنا شدند، تأسیس شد. قبل از Floqer، ماهاجان به عنوان مهندس نرم افزار در Kyndryl و اسلام به عنوان دانشمند ارشد داده در Axis Capital کار می کرد. اولین محصول Floqer هیچ شباهتی به محصول فعلی خود نداشت. ماهاجان در مصاحبه‌ای با TechCrunch در اوایل این ماه گفت: «ما با یک افزونه کروم شروع کردیم که «Super Chat» نام دارد. هر کسی می‌تواند برود و با حساب ChatGPT خود وارد شود و سپس [اطلاعات] را بفهمد و یادداشت برداری کند.» بنیانگذاران به زودی متوجه شدند که شرکت های سازمانی از برنامه افزودنی برای پاکسازی داده ها در سیستم های مدیریت ارتباط با مشتری (CRM) خود استفاده می کنند. مکالمات با آن شرکت‌ها نشان داد که تمیز نگه داشتن داده‌های CRM عمدتاً کار دستی بوده و فرآیندهای کمی برای به‌روز نگه‌داشتن سوابق مشتریان وجود دارد. ماهاجان گفت: «وقتی با آن‌ها صحبت کردیم، به ما گفتند که پاک کردن داده‌های CRM برای آنها فوق‌العاده دستی است و هیچ فرآیند ثابتی در این زمینه وجود ندارد. بنابراین این برای ما روشنگر بود و سپس از آنجا برای ساختن فلوقر چرخیدیم. هدف Floqer این است که بسیاری از این تحقیقات را خودکار"}, {"source": "NYT Tech", "title": "OpenAI Engineer, Who Is Charged With Planting Bug, Advised Saudis", "link": "https://www.nytimes.com/2026/10/14/technology/openai-engineer-hidden-device-saudi-government.html", "summary": "The employee, now fired, had said he advised government agencies in Saudi Arabia. He was also listed as a partner at a venture firm with a Saudi prince.", "date_str": "2026-10-15T02:27:53+00:00", "hash": "bfba6a1fcb5f4833", "title_fa": "مهندس OpenAI، که متهم به کاشت اشکال است، به سعودی ها توصیه کرد", "summary_fa": "این کارمند که اکنون اخراج شده است، گفته بود که به سازمان های دولتی در عربستان سعودی مشاوره می دهد. او همچنین به‌عنوان شریک در یک شرکت سرمایه‌گذاری با یک شاهزاده سعودی فهرست شده بود."}, {"source": "NYT Tech", "title": "Anthropic Says Revenue Jumped 45% to $16.8 Billion in Third Quarter", "link": "https://www.nytimes.com/2026/10/14/technology/anthropic-ipo-revenue-profit.html", "summary": "The company held an investor meeting on Wednesday as it plans a blockbuster ini ndizeza استفاده از هوش مصنوعی برای نوشتن داستان برنده جایزه را رد کرد.", "summary_fa": "مقاله ای در آتلانتیک ادعا می کند که جنگنده آبی به طور مصنوعی ساخته شده است، چند روز پس از بردن جایزه کین برای نویسندگان آفریقایی، نویسنده زیمبابوه ای Simbarashe Kundizeza استفاده از هوش مصنوعی را برای نوشتن داستان کوتاه برنده جایزه پس از اینکه مقاله ای در آتلانتیک اعلام کرد نرم افزار آن را تقریباً به طور کامل توسط هوش مصنوعی تولید کرده است، رد کرده است. داستان کوندیززا The Blue Fighter به عنوان برنده جایزه معتبر کین برای نویسندگان آفریقایی در 6 اکتبر اعلام شد. پنج روز بعد، آتلانتیک مقاله‌ای از نویسنده و روزنامه‌نگار واهنی وارا منتشر کرد با عنوان: «به نظر می‌رسد یک برنده جایزه ادبی دیگر هوش مصنوعی باشد». به خواندن ادامه دهید... وارا گفت که او داستان را از طریق نرم افزار تشخیص هوش مصنوعی Pangram اجرا کرده است که خود از هوش مصنوعی استفاده می کند و تصور می کند داستان تقریباً کاملاً مصنوعی است. او گفت که استثنا، کتیبه ای از شعر منتشر نشده نویسنده آفریقای جنوبی وانگیلی گانتو بود. وارا گفت که وقتی داستان را خواند، «از تکثیر زبانی که در نوشتارهای تولید شده با هوش مصنوعی رایج است شگفت زده شد: ساخت جمله نه x، بلکه y؛ فراوانی استعاره ها؛ کلمات قصار بیهوده». او گفت: \"سلیقه ذهنی است، اما به من اعتماد کنید، این داستان بد است - مادلین و پر از طناب های خسته.\" Kundizeza در بیانیه ای در X پاسخ داد: \"برای جلوگیری از شک، من \"The Blue Fighter\" را نوشتم. من برای نوشتن آن از هوش مصنوعی مولد استفاده نکردم. این کاملاً کار خودم است. \"من مشتاقانه منتظر ادامه همکاری با تیم جایزه کین هستم و این تقدیر را با افرادی که کمک کردند تا این داستان به دنیا بیاید جشن بگیرم. مهمتر از همه، به نوشتن ادامه خواهم داد.\""}, {"source": "The Guardian AI", "title": "Is your boss watching you? The rise of AI surveillance at work - video", "link": "https://www.theguardian.com/science/video/2026/oct/15/is-your-boss-watching-you-the-rise-of-ai-surveillance-at-work-video", "summary": "Workers have always been monitored by their bosses, first through output targets, and then via computer software labelled ‘bossware’. But AI is ا در همه جا بی ثبات می کند. کسب و کارها و مصرف کنندگان اثرات یک شوک انرژی جدی را احساس می کنند. افزایش تورم، تامین مالی بدهی های خود را برای دولت ها بسیار گران تر کرده است. چین و آمریکا بر سر تجارت با هم اختلاف دارند. با این حال، تا کنون، تاثیر آن اندک بوده است. اینکه وزرای دارایی و روسای بانک های مرکزی که برای نشست سالانه صندوق بین المللی پول (IMF) در بانکوک جمع شده بودند، چیزی شبیه به معجزه است که مجبور نیستند با یک بحران تمام عیار مقابله کنند. این مانند پاییز 2008 نیست، زمانی که جلسات در بدترین بحران بانکی جهانی برگزار شد. لری الیوت ستون نویس گاردین است به خواندن ادامه دهید... امسال هیچ چیز برای اقتصاد جهانی درست نبوده است و بسیاری از آنها اشتباه کرده اند. دو جنگ بزرگ منطقه ای قیمت ها و زنجیره تامین را در همه جا بی ثبات می کند. کسب و کارها و مصرف کنندگان اثرات یک شوک انرژی جدی را احساس می کنند. افزایش تورم، تامین مالی بدهی های خود را برای دولت ها بسیار گران تر کرده است. چین و آمریکا بر سر تجارت با هم اختلاف دارند. درست است که صندوق بین المللی پول می گوید کشورها در مواجهه با این همه باد مخالف، مقاومت نشان داده اند. می توانست بدتر باشد. خیلی بدتر حتی خبرهای خوبی برای بریتانیا وجود داشت، زیرا صندوق بین المللی پول پیش بینی رشد خود را برای سال جاری"}, {"source": "The Guardian AI", "title": "Eight states accuse OpenAI of coaching children to harm themselves in lawsuit", "link": "https://www.theguardian.com/technology/2026/oct/14/openai-child-self-harm-lawsuit", "summary": "US states sue ChatGPT maker and seek to force the company to change how its products work for young users Eight US states sued OpenAI Wednesday, alleging the ChatGPT maker is harming children en masse. Kansas, Arizona, Montana, Iowa and four others allege the company’s products carried out “willful, dangerous, reckless and unlawful conduct” by coaxing children into harming themselves. Continue reading...", "date_str": "2026-10-14T21:50:29+00:00", "hash": "b2211d292782e319", "title_fa": "هشت ایالت OpenAI را متهم می کنند که کودکان را برای آسیب رساندن به خود در دعوا راهنمایی می کند", "summary_fa": "ایالت های ایالات متحده از سازنده ChatGPT شکایت کردند و به دنبال وادار کردن شرکت به تغییر نحوه عملکرد محصولاتش برای کاربران جوان هستند هشت ایالت ایالات متحده روز چهارشنبه از OpenAI شکایت کردند و ادعا کردند که سازنده ChatGPT به طور دسته جمعی به کودکان آسیب می رساند. کانزاس، آریزونا، مونتانا، آیووا و چهار نفر دیگر ادعا می کنند که محصولات این شرکت \"عمدی، خطرناک، بی احتیاطی و غیرقانونی\" با تشویق کودکان به آسیب رساندن به خود انجام شده است. ادامه مطلب... برنا برد، دادستان کل آیووا در بیانیه ای گفت: OpenAI به بچه ها صدمه می زند و آنها به آیوواها دروغ می گویند. OpenAI ادعا می‌کند که ChatGPT ایمن است در حالی که توصیه‌های پزشکی خطرناکی ارائه می‌کند، مردم را تشویق می‌کند به دیگران صدمه بزنند، و مردم را به خودکشی راهنمایی می‌کند - همه اینها در حالی که وانمود می‌کنند دوست جعلی آنها هستند. هر هشت ایالت OpenAI را به نقض قوانین حمایت از مصرف کننده متهم می کنند و به دنبال وادار کردن شرکت به تغییر نحوه عملکرد محصولاتش برای کاربران جوان هستند. آنها علاوه بر این به دنبال خسارات مالی هستند و از دادگاه می‌خواهند که OpenAI را از توسعه مدل‌های هوش مصنوعی که می‌توانند خودشان را بهبود بخشند تا زمانی که شرکت نشان دهد این مدل‌ها با ارزش‌های انسانی مطابقت دارند، متوقف کند. این اولین بار است که چندین ایالت ایالات متحده در یک اقدام قانونی هماهنگ علیه یک شرکت هوش مصنوعی متحد می شوند. درو پوساتری، سخنگوی OpenAI، گفت که این شرکت «حفاظت‌های پیشرو در صنعت مربوط به سن را در محصول ما تعبیه کرده است که بسیاری از محصولات دیگر هوش مصنوعی فاقد آن هستند». پوساتری ادامه داد: \"در حالی که هیچ سیستمی نمی تواند بی نقص باشد، ما به کار با کارشناسان برای اطلاع رسانی در مورد کار خود و"}, {"source": "The Guardian AI", "title": "OpenAI accuses employee who left for Apple of leaking plans for unreleased device", "link": "https://www.theguardian.com/technology/2026/oct/14/openai-apple-employee-leak-lawsuit", "summary": "Hours before Apple and the ChatGPT maker were due to face off in court, a new allegation delayed the showdown An ⁠ OpenAI employee who left the ChatGPT maker for Apple sent more than 100 files about an unreleased product to a personal ⁠account and later ⁠made a presentation ​about the unreleased product to senior Apple leadership, a new filing in the lawsuit between OpenAI and Apple alleges. In the filing ⁠in US federal court in San Jose, California, OpenAI alleged that the presentation happened months ago and that Apple is now making ⁠AI products of its own, citing the release of Apple’s HomeView product this week. Continue reading...", "date_str": "2026-10-14T20:31:15+00:00", "hash": "aab2c619fb4a6d4f", "title_fa": "OpenAI کارمندی را که به اپل رفته است به افشای برنامه های دستگاه منتشرنشده متهم می کند", "summary_fa": "ساعاتی قبل از اینکه اپل و سازنده ChatGPT در دادگاه رو به رو شوند، یک ادعای جدید این مسابقه را به تعویق انداخت. یک کارمند OpenAI که سازنده ChatGPT را به مقصد اپل ترک کرد، بیش از 100 فایل در مورد یک محصول منتشرنشده به یک حساب شخصی ارسال کرد و بعداً در مورد این محصول ارائه‌ای را در مورد این محصول ارائه کرد، و در مورد محصول جدید منتشر نشده بود. OpenAI و اپل ادعا می کنند. در پرونده‌ای در دادگاه فدرال ایالات متحده در سن خوزه، کالیفرنیا، OpenAI ادعا کرد که این ارائه ماه‌ها پیش انجام شده است و اپل اکنون در حال تولید محصولات هوش مصنوعی خود با اشاره به انتشار محصول HomeView اپل در این هفته است. ادامه مطلب... OpenAI در پرونده خود گفت: \"OpenAI بسیار نگران است که اطلاعات محرمانه و محرمانه تجاری آن اکنون در داخل اپل در حال گردش است، جایی که مهندسان اپل می توانند محصولات آینده اپل را بر اساس کارهای محرمانه و نوآورانه OpenAI شکل دهند.\" این دو شرکت قرار بود روز چهارشنبه در دادگاه در یک دعوای اسرار تجاری در حال رویارویی قرار گیرند، اما ادعای جدید این رقابت را به تاخیر انداخت. OpenAI گفت که ممکن است بر اساس ادعای جدید دعوای متقابل ارائه کند. اپل گفت که سیاست‌ها و رویه‌هایی را برای اطمینان از عدم استفاده کارکنان جدید از اطلاعات محرمانه کارفرمایان قبلی در نظر گرفته است و هیچ مدرکی برای حمایت از ادعاهای OpenAI پیدا نکرده است. این سند که در روز سه‌شنبه ارائه شد، بخشی از یک مناقشه اسرار تجاری است که اپل در اوایل سال جاری علیه OpenAI تشکیل داده بود. سازنده آیفون ادعا کرد که ک ing to its CEO Garrett Langley, and reports security vulnerabilities to the company when he finds them. (As a side note: we have also invited Flock’s CEO on the show; Garrett if you’re listening, we would love to have you.) Benn says his outreach to the company is an olive branch he’s extended to Flock as part of his goal of working toward real, tangible solutions to surveillance overreach, rather than part of a crusade to tear one single company down. That’s a real theme throughout our conversation: that Flock and other high profile names in surveillance are just part of the problem — our real focus should be on the interlocking relationship between private industry, government,", "date_str": "2026-10-15T14:00:00+00:00", "hash": "bf9e1ab6316f5382", "title_fa": "بن جردن در مورد گله، حریم خصوصی، و واکنش های نظارتی جدید", "summary_fa": "امروز، من با بن جردن، موسیقی‌دان، یوتیوب‌بر، محقق و روزنامه‌نگار تحقیقی صحبت می‌کنم. ممکن است بنن را از آن دو عنوان اول بشناسید - او دیسکوگرافی پرباری از موسیقی تجربی دارد که قدمت چندین دهه قبل دارد. اما در چند سال گذشته، او به دلیل کارش در تحقیق Flock Safety، سازنده پلاک‌خوان‌های خودکار و نرم‌افزاری که به آنها قدرت می‌دهد، به چهره‌ای برجسته در فضاهای سازنده و رسانه تبدیل شده است. بن اخیراً در مقابل کنگره در جلسه استماع کمیته فرعی جنایت و ضد تروریسم کمیته قضایی سنا که به Flock و دیگر سیستم‌های ALPR برگزار شد، شهادت داد. این جلسه اوج ماه‌ها و ماه‌ها انتقاد فزاینده و واکنش‌های دو حزبی علیه Flock به نظر می‌رسید - که همگی در حال شکل‌گیری شبیه به عقب‌نشینی علیه مراکز داده هوش مصنوعی هستند. مشترکین همیشگی، فراموش نکنید که از هر جا که پادکست های خود را دریافت می کنید، به Decoder بدون آگهی دسترسی انحصاری دارید. به اینجا سر بزن مشترک نیستید؟ می توانید در اینجا ثبت نام کنید. این منجر به عواقب بزرگی برای Flock شده است. صدها شهر، شهرستان و سایر دولت‌های محلی لغو قراردادها را آغاز کرده‌اند، و Flock اکنون توسط جاش هاولی سناتور جمهوری‌خواه تحت تحقیق است. هفته گذشته رویترز گزارش داد که فلاک قصد دارد حدود 18 درصد از نیروی کار خود را کاهش دهد. بنابراین
