rge retailers that may have contracts with the surveillance tech company. In a letter sent Friday morning to the companies' executives, 56 content creators called on Lowe's and Home Depot to \"terminate all its contracts with Flock Safety\" and remove the company's automated license plate readers, or ALPRs, from their parking lots. The letter raised concerns that data gathered by the cameras could be accessed by federal or local law enforcement agencies to target immigrant day laborers and other shoppers. \"By participating in Flock's network, you are endangering the safety of customers, especially the immigrants and people of color who shop at your stores,\" an email that was sent to the executives and viewed by Business Insider said. Flock cameras collect license plate and vehicle data. A company spokesperson said Flock has more than 5,000 private sector clients, including retailers, healthcare institutions, small businesses, and places of worship. Lowe s and Home Depot have installed Flock cameras in their parking lots. Paul Weaver/SOPA Images/LightRocket via Getty Images Law enforcement officers have previously told Business Insider that Flock's technology has helped their agencies solve crimes. Flock says it helps businesses and communities prevent and investigate crime, including organized retail crime. Business Insider also has reported that Flock cameras can misread license plates , leading law enforcement to the wrong people. The company has become a flash point amid broader concerns over mass surveillance technology and privacy. Fight For The Future, a nonprofit digital rights advocacy group that organized the content creator-led campaign, has pointed to a May 2025 report from 404 Media that found local and state police agencies were running searches in Flock's nationwide ALPR network for", "date_str": "2026-09-12T17:24:41+00:00", "hash": "c02c13a99a923344", "title_fa": "اینفلوئنسرها از Home Depot و Lowe ترغیب می کنند که Flock را کنار بگذارند", "summary_fa": "از Home Depot و Lowe s، دو تا از بزرگ‌ترین خرده‌فروش‌های لوازم خانگی در ایالات متحده، خواسته شده است که قرارداد خود را با Flock لغو کنند. Marcin Golba/NurPhoto از طریق Getty Images Flock Safety، سازنده پلاک‌خوان‌های خودکار، بیش از 5000 مشتری بخش خصوصی دارد. برخی از مصرف کنندگان اکنون از شرکت ها می خواهند که قرارداد خود را با Flock لغو کنند. گروهی از سازندگان آنلاین کمپینی را راه اندازی کردند و خواستار پایان دادن به روابط هوم دیپو و لو با فلاک شدند. گروهی از سازندگان آنلاین با مجموع 46 میلیون دنبال کننده از Lowe's و Home Depot - دو تا از بزرگترین فروشگاه های لوازم خانگی در ایالات متحده - می خواهند که روابط خود را با Flock Safety در بحبوحه کمپین سراسری علیه خرده فروشان بزرگی که ممکن است با شرکت فناوری نظارت قرارداد داشته باشند، قطع کنند. در نامه‌ای که صبح جمعه به مدیران این شرکت‌ها ارسال شد، 56 سازنده محتوا از Lowe's و Home Depot خواستند تا \"تمام قراردادهای خود را با Flock Safety خاتمه دهند\" و پلاک‌خوان‌های خودکار این شرکت یا ALPR را از پارکینگ‌های خود حذف کنند. این نامه نگرانی هایی را ایجاد کرد که اطلاعات جمع آوری شده توسط دوربین ها می تواند توسط سازمان های مجری قانون فدرال یا محلی برای هدف قرار دادن کارگران روزمزد مهاجر و سایر خریداران قابل دسترسی باشد. در ایمیلی که برای مدیران ارسال شد و توسط Business Insider مشاهده شد، آمده است: \"با شرکت در شبکه Flock، امنیت مشتریان، به ویژه مهاجران و رنگین پوستانی که از فروشگاه های شما خرید می کنند، به خطر می اندازید.\" دوربین های گله اطلاعات پلاک و خودرو را جمع آوری می کنند. یکی از سخنگویان شرکت گفت که Flock بیش از 5000 مشتری بخش خصوصی از جمله خرده فروشان، مؤسسات مراقبت های بهداشتی، مشاغل کوچک و مکان"}, {"source": "Business Insider", "title": "AI leaders rally around calls to slow things down", "link": "https://www.businessinsider.com/ai-slow-down-dario-amodei-sam-altman-elon-musk-2026-9", "summary": "AI leaders are rallying around Anthropic CEO Dario Amodei s call for a coordinated slowdown and third-party safety evaluators. Ludovic MARIN / AFP via Getty Images AI leaders are rallying around calls for an AI slowdown. Dario Amodei said he had \"become convinced\" it was necessary. Sam Altman and Elon Musk agreed. The leaders of US AI labs are having a come-together moment. After Anthropic CEO Dario Amodei said on Saturday that he's \"become convinced\" AI needs to pace its development to avert disaster, other AI leaders quickly logged on to endorse the idea. Most notably, OpenAI CEO Sam Altman said on X, \"I agree with Dario that we need to pace the frontier.\" Altman said OpenAI would commit, as Anthropic had earlier, to embedding third-party safety evaluators within the company with employee-level access. SpaceXAI CEO Elon Musk, who rarely agrees with Altman, also backed Amodei's proposals on Saturday, writing in an X post, \"Dario is right.\" Other prominent industry leaders also chimed in. Hugging Face CEO Clement Delangue said on X that his company was launching an \"open alignment initiative\" and asked to be included in the labs employing third-party safety evaluators. Andrej Karpathy, an AI researcher and former OpenAI and Tesla executive, also endorsed Amodei's plan to better monitor AI's development and ensure its safety. \"I love this and really hope we can come together as an industry and make it happen,\" he said on X. Google DeepMind founder Demis Hassabis has yet to weigh in on Saturday. The AI leader, however, has previously called for more cooperation among AI leaders and governments. \"That calls for public policy that promotes innovation while also incentivizing responsibility and security, fosters international collaboration on key safety issues, and encourages careful consideration of how AI is deployed for the benefit of society,\" he wrote in a lengthy X post in July. This is a developing story and will be updated. Read the original article on Business Insider", "date_str": "2026-09-12T17:21:44+00:00", "hash": "8ed707cd1f6c7011", "title_fa": "رهبران هوش مصنوعی فراخوانی برای کاهش سرعت کارها جمع می کنند", "summary_fa": "رهبران هوش مصنوعی حول درخواست داریو آمودی، مدیر عامل آنتروپیک برای کاهش سرعت هماهنگ و ارزیاب‌های ایمنی شخص ثالث گرد هم می‌آیند. Ludovic MARIN / AFP از طریق Getty Images رهبران هوش مصنوعی در حال جمع آوری درخواست ها برای کاهش سرعت هوش مصنوعی هستند. داریو آمودی گفت که او \"متقاعد شده\" که لازم است. سم آلتمن و ایلان ماسک با این موضوع موافقت کردند. رهبران آزمایشگاه‌های هوش مصنوعی ایالات متحده در حال گذراندن لحظات دور هم هستند. پس از اینکه داریو آمودی، مدیر عامل آنتروپیک، روز شنبه گفت که متقاعد شده است که هوش مصنوعی باید سرعت توسعه خود را برای جلوگیری از فاجعه انجام دهد، دیگر رهبران هوش مصنوعی به سرعت وارد سیستم شدند تا این ایده را تایید کنند. مهمتر از همه، سام آلتمن، مدیر عامل OpenAI، در X گفت: \"من با داریو موافقم که ما باید از مرز عبور کنیم.\" آلتمن گفت OpenAI، همانطور که Anthropic قبلا انجام داده بود، متعهد به تعبیه ارزیاب های ایمنی شخص ثالث در داخل شرکت با دسترسی در سطح کارمند خواهد بود. ایلان ماسک، مدیرعامل SpaceXAI، که به ندرت با آلتمن موافق است، روز شنبه از پیشنهادات آمودی حمایت کرد و در پست ایکس نوشت: «داریو درست می‌گوید». کلمنت دلانگ، مدیر عامل Hugging Face در X گفت که شرکت او در حال راه اندازی یک \"ابتکار همسویی باز\" است و از او خواسته است که در آزمایشگاه هایی که از ارزیاب های ایمنی شخص ثالث استفاده می کنند، شرکت کند. آندری کارپاتی، محقق هوش مصنوعی و مدیر سابق OpenAI و Tesla نیز طرح Amodei برای نظارت بهتر بر توسعه هوش مصنوعی و اطمینان از ایمنی آن را تایید کرد. او در X گفت: \"من این را دوست دارم و واقعاً امیدوارم که بتوانیم به عنوان یک صنعت گرد هم بیاییم و آن را محقق کنیم.\" با این حال، رهبر هوش"}, {"source": "Business Insider", "title": "We spent 2 weeks in Portugal. It was great, but our trip would've been way better if we'd avoided these 6 mistakes.", "link": "https://www.businessinsider.com/mistakes-traveling-to-portugal-2-weeks-regrets-lisbon-2026-9", "summary": "Ultimately, our trip to Portugal could ve been much better if we d avoided a few mistakes with packing and planning. Timothy Moore We spent two weeks in Portugal and had a wonderful time, but we made some major mistakes. We stayed in some spots, like Lisbon, for too long, and others not nearly long enough. We also packed poorly and made some poor booking decisions, including a hotel without a front desk. My husband and I recently spent two weeks in Portugal. We had a great time, ate fantastic food, and drank a lot of wine, but it was also our least favorite European vacation to date. As outdoorsy travelers, we missed the hiking and adventure activities we usually prioritize. We also made some planning and packing mistakes that affected the trip. Arriving later in the day would've been better View from our balcony in the Algarve. Timothy Moore On past European trips, we always had a plan for our luggage after landing, whether that meant a rental car, late arrival, or early hotel check-in. Our Portugal flight got in at 9:45 a.m., and we were heading straight to Porto, no rental car. But we were renting an apartment with no front desk and no flexibility on check-in time. That meant we were stuck carrying our luggage for hours before the housekeepers could store it, and we couldn't nap until nearly dinner. We stayed in Lisbon too long We enjoyed spending time at the São Jorge Castle, but it didn t take us that long. Timothy Moore Usually, we spend a couple of nights in a city and use it as a home base to visit nearby wilderness areas and smaller towns. At the urging of our friends — who are big foodies and love getting lost in cities — we decided we'd try a more metropolitan-focused vacation in Portugal. We stayed in Lisbon for four nights. For us, that was two nights too many. The city has plenty to offer, but much of our sightseeing felt obligatory. We loved exploring São Jorge Castle and took an amazing food tour in the Alfama neighborhood, but otherwise, we found Lisbon's streets were packed with tourists shuffling from one landmark to another. Worse, in some crowded parts of town, we were regularly offered drugs by random strangers , often in front of families with kids. And unfortunately, during our visit, many of the museums were closed for restoration — important work, but unlucky timing. I wish we'd spent more time in the Douro Valley, the Algarve, and nearby small towns The Douro Valley is stunning. Timothy Moore The Douro Valley is the most beautifu", "date_str": "2026-09-12T16:16:01+00:00", "hash": "ff11e756b6f20bd7", "title_fa": "ما 2 هفته در پرتغال بودیم. عالی بود، اما اگر از این 6 اشتباه اجتناب می کردیم، سفر ما خیلی بهتر می شد.", "summary_fa": "در نهایت، سفر ما به پرتغال می‌توانست خیلی بهتر باشد، اگر از چند اشتباه در جمع‌بندی و برنامه‌ریزی اجتناب می‌کردیم. تیموتی مور ما دو هفته را در پرتغال گذراندیم و روزهای فوق العاده ای داشتیم، اما اشتباهات بزرگی مرتکب شدیم. ما در برخی نقاط، مانند لیسبون، بیش از حد طولانی ماندیم، و برخی دیگر تقریباً به اندازه کافی طولانی نبود. ما همچنین بسته بندی خوبی نداشتیم و تصمیمات ضعیفی برای رزرو گرفتیم، از جمله هتل بدون میز پذیرش. من و شوهرم اخیراً دو هفته را در پرتغال گذراندیم. ما خیلی خوش گذراندیم، غذای فوق‌العاده‌ای خوردیم، و مقدار زیادی شراب نوشیدیم، اما این تعطیلات اروپایی کمترین علاقه ما تا به امروز بود. به‌عنوان مسافرانی که در فضای باز هستند، فعالیت‌های پیاده‌روی و ماجراجویی را که معمولاً اولویت‌بندی می‌کنیم، از دست داده‌ایم. ما همچنین اشتباهاتی در برنامه ریزی و بسته بندی مرتکب شدیم که بر سفر تأثیر گذاشت. اگر دیرتر در روز به آنجا برسید، بهتر بود از بالکن ما در Algarve دیدن کنید. تیموتی مور در سفرهای اروپایی گذشته، ما همیشه برای چمدان‌هایمان پس از فرود برنامه‌ای داشتیم، خواه ماشین کرایه‌ای باشد، دیر رسیدن یا تحویل زودهنگام هتل. پرواز پرتغال ما در ساعت 9:45 صبح وارد شد و ما مستقیماً به سمت پورتو حرکت کردیم، بدون ماشین کرایه ای. اما ما آپارتمانی بدون میز جلو و بدون انعطاف در زمان تحویل گرفتن اجاره می کردیم. این بدان معنا بود که ساعت‌ها قبل از اینکه خانه‌دارها بتوانند چمدان‌هایمان را ذخیره کنند، گیر کرده بودیم و تا نزدیک شام نمی‌توانستیم چرت بزنیم. ما خیلی طولانی در لیسبون ماندیم ما از گذراندن وقت در قلعه سائو خورخه لذت بردیم، اما آنقدر طول نکشید. تیموتی مور معمولاً چند شب را در یک شهر می گذرانیم و از آن به عنوان پایگاه خانه برای بازدید از مناطق بیابانی نزدیک و شهرهای کوچکتر استفاده می کنیم. به"}, {"source": "Business Insider", "title": "My 3-year-old has been to more than a dozen big concerts. We don't worry about late bedtimes.", "link": "https://www.businessinsider.com/young-child-big-concerts-misses-bedtime-no-regrets-2026-9", "summary": "The author said she didn t want to stop going to concerts when she had a kid, so she brings her along. Courtesy of Jessica Pate Thibault. We've taken our freshly 3-year-old daughter to several big-name concerts, and we have no regrets. I'm not going to stop enjoying concerts and evening events just because I have a child. At times, it's been isolating to not have parent friends who want to join us. My partner and I have always enjoyed going to live events , festivals, and concerts. The city we live in has so many nearby events that it is basically impossible to be bored. Now that we have a child, we don't just seek out kid-focused events ; we still go see the bands and performers we enjoy — even if they happen in the evening. We often choose to keep our toddler out later than most other parents to enjoy these events. Some people may feel differently, but I have no regrets about bringing our daughter along to enjoy a fun night out with her parents. I've always been an extrovert I didn't suddenly stop enjoying concerts and evening events out of the house around fun people. I may even crave and appreciate them more now. Over the years, I've been told \"life is never boring around you,\" asked \"how do you always know what fun stuff is going on?\" and, most recently, jokingly crowned \"the queen of local events\" by a friend. I didn't think I was doing anything much differently than others for the first few years, but I have finally come to own these truths. There are so many vibrant activities to enjoy out in the community. It's hard to find other parents like us At times, it's been isolating to not have parent friends who like going out as much as we do, or much at all. I get why many don't want to go to a concert that starts at 8 p.m. because they don't want to miss their kid's bedtime or secure childcare. That's just not something we let hold us back. Do you have a hot take on a common parenting belief? Email Jennifer Beck Goldblatt at jgoldblatt@insider.com to share your experience with Business Insider. We're always open to company, but it's been hard to find. Rarely, some friends will also bring their kids to a fun late-evening event, but mostly we've just made peace with our toddler exploring the world with us in a nontraditional manner. Our toddler seems to like being out on the town At a year old, our daughter was a regular at our local art crawls and art museum's after-hours DJ parties and even got her first few autographs. She bops with joy (while wearin", "date_str": "2026-09-12T15:27:01+00:00", "hash": "78bfee9c5724267e", "title_fa": "فرزند 3 ساله من در بیش از دوازده کنسرت بزرگ شرکت کرده است. ما نگران دیر خوابیدن نیستیم.", "summary_fa": "نویسنده گفت وقتی بچه دار شد نمی خواست به کنسرت نرود، بنابراین او را همراهش می آورد. با حسن نیت از Jessica Pate Thibault. ما دختر 3 ساله خود را به چند کنسرت با نام های بزرگ برده ایم و هیچ پشیمانی نداریم. من از کنسرت ها و رویدادهای شبانه لذت نمی برم فقط به این دلیل که بچه دارم. گاهی اوقات، نداشتن دوستان والدینی که می خواهند به ما بپیوندند، منزوی شده است. من و شریکم همیشه از رفتن به رویدادهای زنده، جشنواره ها و کنسرت ها لذت برده ایم. شهری که ما در آن زندگی می کنیم رویدادهای نزدیک زیادی دارد که اساساً نمی توان حوصله کرد. اکنون که فرزند داریم، فقط به دنبال رویدادهای متمرکز بر کودک نیستیم. ما هنوز به دیدن گروه‌ها و اجراکنندگانی می‌رویم که از آنها لذت می‌بریم - حتی اگر در شب اتفاق بیفتند. ما اغلب تصمیم می‌گیریم که کودک نوپای خود را دیرتر از سایر والدین دور نگه داریم تا از این رویدادها لذت ببریم. ممکن است برخی افراد احساس متفاوتی داشته باشند، اما من از اینکه دخترمان را با خود آوردم تا از یک شب سرگرم کننده با والدینش لذت ببرم، پشیمان نیستم. من همیشه یک برون گرا بوده ام و به طور ناگهانی از لذت بردن از کنسرت ها و رویدادهای عصرانه بیرون از خانه در اطراف افراد سرگرم کننده دست نمی کشم. حتی ممکن است اکنون بیشتر هوس کنم و از آنها قدردانی کنم. در طول سال‌ها، به من گفته‌اند که \"زندگی در اطراف شما خسته کننده نیست\"، از من پرسیده شده است \"از کجا می‌دانی که چه چیزهای سرگرم‌کننده‌ای در جریان است؟\" و اخیراً توسط یکی از دوستانش به شوخی «ملکه رویدادهای محلی» را تاج گذاری کرد. فکر نمی‌کردم در چند سال اول کاری متفاوت از دیگران انجام دهم، اما بالاخره صاحب این حقایق شدم. فعالیت های پر"}],
      media: [{"source": "Billboard", "title": "My Chemical Romance Tease Possible New Album During Tour-Closing Show", "link": "https://www.billboard.com/music/music-news/my-chemical-romance-tease-possible-new-album-1236339172/", "summary": "My Chemical Romance frontman Gerard Way has hinted that the band hopes to make a new album — its first in more than 15 years — during the closing night of their Black Parade tour in San Antonio on Saturday (Sept. 12). Addressing the crowd at the Alamodome, Way framed the prospect as a hope rather than a firm plan. Just know that, like, we ve kind of really always wanted to make another record, so we hope that life allows us to do that, he said. Cause you guys, honestly, you guys kept us alive so long. You guys deserve another record. I don t know when it ll be. But it ll be awesome. The remarks stop well short of an official announcement — Way named no title, timeline or release date — but they represent the band s most direct public acknowledgment of a potential fifth studio album since its 2019 reunion. A new record would be My Chemical Romance s first full-length since 2010 s Danger Days: The True Lives of the Fabulous Killjoys . Since reforming, the band has released just one standalone single, 2022 s The Foundations of Decay, and has otherwise focused on touring, including the current run celebrating the 20th anniversary of The Black Parade . The comments came as the band capped a hugely successful anniversary campaign. My Chemical Romance have been performing their 2006 magnum opus in full throughout the tour, which has since been extended into a global stadium run billed as The Black Parade 2026, with dates across North America, the U.K. and Europe. Days before the San Antonio show, the band announced an expanded 20th-anniversary reissue of The Black Parade , due Oct. 23 via Reprise Records. The set pairs the original album with six bonus tracks — including three live recordings from a 200-capacity 2007 club gig in Hoboken, New Jersey, and the never-before-released B-side Someone Out There Loves You — and features three new pieces of art from original cover artist James Jean. Released in 2006, The Black Parade remains the band s commercial and cultural peak. The album was certified four-times platinum in the U.S. and topped Billboard s Top Rock Albums chart, while its lead single Welcome to the Black Parade — a No. 9 hit on the Billboard Hot 100 — has been certified five-times platinum and endures as one of the defining rock anthems of its era.", "date_str": "2026-09-13T06:25:07+00:00", "hash": "31c34017e941dbee", "title_fa": "آلبوم جدید My Chemical Romance Tease در طول نمایش پایانی تور", "summary_fa": "جرارد وی، خواننده My Chemical Romance اشاره کرده است که گروه امیدوار است آلبوم جدیدی - اولین آلبوم آن در بیش از 15 سال - در شب پایانی تور Black Parade خود در سن آنتونیو در روز شنبه (12 سپتامبر) بسازد. وی با خطاب به جمعیت در Alamodome، چشم‌انداز را به‌عنوان یک امید و نه یک برنامه محکم توصیف کرد. او گفت، فقط بدانید که ما واقعاً همیشه می خواستیم یک رکورد دیگر بسازیم، بنابراین امیدواریم زندگی به ما اجازه دهد که این کار را انجام دهیم. چون شما بچه ها، راستش را بخواهید، شما بچه ها ما را برای مدت طولانی زنده نگه داشتید. شما بچه ها شایسته یک رکورد دیگر هستید. نمیدونم کی میشه اما فوق العاده خواهد بود این اظهارات بسیار کمتر از یک اعلامیه رسمی است - وای بدون عنوان، جدول زمانی یا تاریخ انتشار - اما آنها نشان دهنده مستقیم ترین تصدیق عمومی گروه از پنجمین آلبوم استودیویی احتمالی از زمان اتحاد مجدد آن در سال 2019 است. یک رکورد جدید، اولین فیلم کامل My Chemical Romance از زمان Danger Days: The True Lives of the Fabulous Killjoys در سال 2010 خواهد بود. از زمان اصلاحات، گروه تنها یک تک‌آهنگ مستقل به نام The Foundations of Decay در سال 2022 منتشر کرده است، و در غیر این صورت بر روی تور، از جمله اجرای فعلی که بیستمین سالگرد The Black Parade را جشن می‌گیرد، تمرکز کرده است. این نظرات زمانی مطرح شد که گروه یک کمپین سالگرد بسیار موفق را به پایان رساند. My Chemical Romance در طول تور به طور کامل در حال اجرای نمایش بزرگ سال 2006 بوده است، که از آن زمان به یک استادیوم جهانی که تحت عنوان رژه سیاه 2026 اجرا می شود، با تاریخ هایی در سراسر آمریکای شمالی، بریتانیا و اروپا گسترش یافته است. چند روز قبل از"}, {"source": "Billboard", "title": "BIGBANG Celebrate 20 Years Together With MetLife Stadium Concert: 13 Best Moments", "link": "https://www.billboard.com/lists/bigbang-xx-cosmos-new-york-metlife-stadium-best-moments/", "summary": "BIGBANG brought its 20th anniversary run, the BIGBANG 2026-2027 World Tour XX : COSMOS, to MetLife Stadium for the only East Coast date on the entire trek — and for the trio s first show in the tri-state area since two nights at Newark s Prudential Center in October 2015. G-Dragon , Taeyang and Daesung are touring the world together for the first time since 2017, and for the first time as a three-piece, a fact the night never sidestepped but instead absorbed into the celebration. The set ran through 30 songs across roughly three hours with era-defining K-pop hits ( Fantastic Baby, Loser, Bang Bang Bang, Haru Haru, Lies ), solo showcases for each member (who shared their personal affinities for hip-hop, R B, ballads and even Korea s traditional trot music), and the live rollout of BIGBANG s first new single in four years, BiiiG, after its official release on Aug. 19 to mark 20 years to the day since the group s debut. Related The 25 Best K-Pop Albums of 2026 (So Far), Ranked: Staff Picks Behind all of it, YG Entertainment shared that the show came to life via a 23-ton mobile LED structure, a stage by Tony and Olivier Award–winning designer Es Devlin, direction from 2025 Super Bowl Halftime Show creative director Mike Carson, plus a live band led by Wow Jones, whose work spans Usher, Rihanna, Janelle Monáe and Sabrina Carpenter. From MetLife, XX : COSMOS heads across the Atlantic to Paris Stade de France and London s Tottenham Hotspur Stadium for shows on Sept. 19 and 26, respectively, before swinging through Asia and Oceania on the world tour s 36-show, 19-city run that stretches into February 2027. From an unhinged SOBER performance to the promise to keep going on and on, the K-pop legends made their MetLife debut count. Read on for Billboard s best moments.", "date_str": "2026-09-13T02:49:18+00:00", "hash": "fff7c2961e84fef3", "title_fa": "BIGBANG 20 سالگی را با کنسرت استادیوم MetLife جشن گرفت: 13 بهترین لحظه", "summary_fa": "BIGBANG بیستمین سالگرد اجرای خود را، BIGBANG 2026-2027 World Tour XX: COSMOS، به استادیوم MetLife برای تنها تاریخ ساحل شرقی در کل مسیر پیاده روی - و برای اولین نمایش این سه نفر در منطقه سه ایالتی از دو شب در مرکز محتاطانه نیوآرک در اکتبر 2015 و GDeyangragones world در حال برگزاری است. با هم برای اولین بار از سال 2017، و برای اولین بار به صورت سه تکه، واقعیتی که شب هرگز از آن کنار نرفت، بلکه در جشن جذب شد. این مجموعه شامل 30 آهنگ در طول تقریباً سه ساعت با آهنگ‌های کی‌پاپ تعیین‌کننده دوران (Fantastic Baby، Loser، Bang Bang Bang، Haru Haru، Lies)، نمایش‌های انفرادی برای هر عضو (که تمایلات شخصی خود را با هیپ‌هاپ، RB، تصنیف‌ها و حتی اولین آهنگ‌های زنده سنتی BIG در چهار سال موسیقی زنده سنتی BIG به اشتراک گذاشتند)، اجرا شد. BiiiG، پس از انتشار رسمی آن در 19 آگوست، به مناسبت 20 سال از اولین حضور گروه. مرتبط 25 بهترین آلبوم کی‌پاپ سال 2026 (تا کنون)، رتبه‌بندی: انتخاب کارکنان پس از همه این‌ها، YG Entertainment به اشتراک گذاشت که این نمایش از طریق یک ساختار LED موبایل 23 تنی، صحنه‌ای توسط طراح برنده جایزه تونی و اولیویه، Es Devlin، کارگردانی از 2025 Car Creative، کارگردانی از 2025، Bowlkeftime Super Show، به اشتراک گذاشته شد. توسط واو جونز، که آثارش آشر، ریحانا، ژانل مونا و سابرینا کارپنتر است. از MetLife، XX : COSMOS از سراسر اقیانوس اطلس به ورزشگاه پاریس استاددو فرانس و تاتنهام هاتسپر استادیوم لندن می رود تا به ترتیب در 19 و 26 سپتامبر نمایش دهد، قبل از اینکه در آسیا و اقیانوسیه در تور جهانی 36 نمایشی و 19 شهر حرکت کند. به طور مداوم، اسطوره های کی پاپ اولین حضور خود را در MetLife انجام دادند. بهترین لحظات بیلبورد را بخوانید."}, {"source": "Billboard", "title": "Céline Dion Cries Happy Tears in Paris: 9 Best Moments From Opening Night of Her Return to Stage", "link": "https://www.billboard.com/lists/celine-dion-paris-residency-opening-night-best-moments/", "summary": "The house went dark 47 minutes behind schedule, and 30,000 people went quiet. Céline Dion walked out in a black gown, crossed her hands over her face like a prayer, and began to sing the opening notes of On Ne Change Pas, accompanied only by pianist Scott Price and four violinists. She had been gone six years. Saturday night (Sept. 12) was the first of Dion s 26 Paris nights, a residency that runs into May 2027 at the Plenitude Arena in Nanterre, the largest indoor arena in Europe. More than nine million people had entered the lottery for a shot at purchasing a ticket to see her perform. Related Céline Dion s Paris 2026 Setlist: Every Song Played at the First Show Within a few minutes of walking on the stage in Paris, Dion, who hadn t put on a headlining concert since sharing her stiff-person syndrome diagnosis with the public, broke a promise she d made to herself: She cried. Moved by the emotion of the moment, she asked the audience if they could hear her heart beating. Among the tens of thousands in attendance were famous guests including Michelle Obama, Oprah Winfrey, Aya Nakamura and Thomas Pesquet. During the concert, Dion revealed how she s feeling and delivered ballads, blockbusters, and even a dancefloor section in her set. She also performed her 2026 single, the French-language song Dansons, live on stage for the very first time. Below are the nine best moments from the opening night of Dion s concert residency in Paris. (Plus, see the full 29-song, two-and-a-half hour setlist from the Sept. 12 show here .)", "date_str": "2026-09-13T01:54:25+00:00", "hash": "9ba48185f365ad6b", "title_fa": "سلین دیون در پاریس اشک های خوشحالی می گرید: 9 لحظه بهترین لحظه از شب افتتاحیه بازگشتش به صحنه", "summary_fa": "خانه با 47 دقیقه تاخیر تاریک شد و 30000 نفر ساکت شدند. سلین دیون با یک لباس مشکی بیرون رفت، دستانش را مانند دعا روی صورتش رد کرد و شروع به خواندن نت های آغازین On Ne Change Pas کرد، تنها با همراهی پیانیست اسکات پرایس و چهار نوازنده ویولن. او شش سال رفته بود. شنبه شب (12 سپتامبر) اولین شب از 26 شب دیون در پاریس بود، اقامتی که تا می 2027 در Plenitude Arena در نانتر، بزرگترین سالن سرپوشیده در اروپا ادامه دارد. بیش از نه میلیون نفر برای خرید بلیط برای دیدن اجرای او وارد لاتاری شده بودند. ست‌ست مربوط به Céline Dion's Paris 2026: هر آهنگی که در اولین نمایش پخش می‌شود در عرض چند دقیقه از راه رفتن روی صحنه در پاریس، دیون که از زمانی که تشخیص سندروم فرد سفت را با مردم به اشتراک گذاشته بود، کنسرت تیتراینی برگزار نکرده بود، قولی را که به خودش داده بود زیر پا گذاشت: گریه کرد. او که تحت تأثیر احساسات آن لحظه قرار گرفته بود، از حضار پرسید که آیا می توانند ضربان قلب او را بشنوند. در میان ده‌ها هزار نفری که در این مراسم حضور داشتند، میهمانان مشهوری از جمله میشل اوباما، اپرا وینفری، آیا ناکامورا و توماس پسکت حضور داشتند. در طول کنسرت، دیون نشان داد که چه احساسی دارد و تصنیف‌ها، فیلم‌های پرفروش و حتی بخش رقص را در مجموعه خود ارائه کرد. او همچنین آهنگ 2026 خود، آهنگ فرانسوی زبان Dansons را برای اولین بار به صورت زنده روی صحنه اجرا کرد. در زیر نه بهترین لحظه از شب افتتاحیه اقامتگاه کنسرت دیون در پاریس را مشاهده می کنید. (به علاوه، لیست کامل 29 آهنگ، دو ساعت و نیم از نمایش 12 سپتامبر را اینجا ببینید.)"}, {"source": "Billboard", "title": "Céline Dion’s Paris 2026 Setlist: Every Song Played at the First Show", "link": "https://www.billboard.com/lists/celine-dion-paris-setlist-2026-songs/", "summary": "Céline Dion returned to the stage on Saturday night (Sept. 12) after six years away, opening her 26-date Paris residency at the Plenitude Arena in Nanterre. The crowd of 30,000 was the first of more than 480,000 total across Dion s first 16 dates staged this autumn, with every ticket bought within hours of the sale. The access lottery drew more than nine million people. Dion hadn t headlined a concert since publicly sharing her diagnosis of stiff-person syndrome. On Saturday she leaned on the songs that made her a phenomenon in France, a good number of them pulled from D eux , the Jean-Jacques Goldman-written album that remains the best-selling French-language record ever made. The English blockbusters were there, too. The staging stayed spare on purpose: a large set, no pyrotechnics, everything built to keep the focus on her voice. Related Céline Dion Cries Happy Tears in Paris: 9 Best Moments From Opening Night of Her Return to Stage The show started 47 minutes late and ran to 11:14 p.m. local time, close to two and a half hours. She opened in tears on On Ne Change Pas, dropped into a mirror-ball disco stretch partway through, sang the opera aria La Wally under falling snow, and pulled a gospel choir around her before the Pour Que Tu M aimes Encore sing-along everyone was waiting for. She debuted Dansons, her 2026 Goldman-written comeback single, and took All by Myself a cappella. Michelle Obama, Oprah Winfrey, Aya Nakamura and Thomas Pesquet were among the guests in the room. The night s biggest gamble was the turn onto the dance floor. I Feel Love, Sweet Dreams and a reworked I m Alive showed a looser, more playful Dion than the balladeer many had come expecting. Thinking about catching the Paris residency? Here s Dion s full setlist from opening night.", "date_str": "2026-09-13T00:02:54+00:00", "hash": "cdc5ed927f90ecd5", "title_fa": "ست‌لیست سلین دیون در پاریس 2026: هر آهنگی که در اولین نمایش پخش شد", "summary_fa": "سلین دیون شنبه شب (12 سپتامبر) پس از شش سال دوری به صحنه بازگشت و اقامتگاه 26 روزه خود در پاریس را در Plenitude Arena در نانتر افتتاح کرد. جمعیت 30000 نفری اولین نفر از مجموع بیش از 480000 نفر در سراسر 16 تاریخ اول دیون بود که در پاییز امسال برگزار شد، با هر بلیط خریداری شده در چند ساعت پس از فروش. قرعه کشی دسترسی بیش از نه میلیون نفر را جذب کرد. دیون از زمانی که علناً تشخیص خود را مبنی بر سندرم فرد سفت به اشتراک گذاشت، تیتر یک کنسرت نبود. روز شنبه او به آهنگ هایی تکیه کرد که او را به یک پدیده در فرانسه تبدیل کردند، تعداد زیادی از آنها برگرفته از آلبوم D eux، آلبوم نوشته ژان ژاک گلدمن است که همچنان پرفروش ترین آلبوم فرانسوی زبان ساخته شده است. بلاک باسترهای انگلیسی هم آنجا بودند. صحنه پردازی عمداً بی بهره ماند: یک مجموعه بزرگ، بدون وسایل آتش نشانی، همه چیز برای حفظ تمرکز روی صدای او ساخته شده بود. موارد مرتبط: Céline Dion Cries Happy Tears in Paris: 9 بهترین لحظه از شب افتتاحیه بازگشت او به صحنه نمایش با 47 دقیقه تاخیر شروع شد و تا ساعت 23:14 ادامه یافت. به وقت محلی، نزدیک به دو ساعت و نیم. او با گریه در On Ne Change Pas باز شد، در قسمتی از دیسکوی آینه-توپ افتاد، آریا اپرا La Wally را زیر برف خواند و یک گروه کر انجیل را قبل از آهنگ Pour Que Tu M دور خود کشید. او اولین تک‌آهنگ کامبک سال ۲۰۲۶ خود توسط گلدمن، Dansons را شروع کرد و All by Myself a cappella گرفت. میشل اوباما، اپرا وینفری، آیا ناکامورا و توماس پسکت از جمله مهمانان حاضر در اتاق بودند. بزرگترین قمار شب، چرخش به میدان رقص بود. I Feel Love، Sweet Dreams و I"}, {"source": "Billboard", "title": "Pink Addresses Backlash Over Comments About Macklemore’s Pro-Palestine Stance: ‘Standing Up for My Own People’", "link": "https://www.billboard.com/music/music-news/pink-backlash-macklemore-pro-palestine-comments-1236338984/", "summary": "Pink is addressing the backlash over her reaction to Macklemore ’s onstage calls to “free Palestine.” During his opening sets for Ed Sheeran’s Loop Tour at New Jersey’s MetLife Stadium on Sept. 4 and 5, the “Thrift Shop” rapper made pro-Palestine remarks that drew criticism from the pop star. Related Macklemore Faces Petition to Leave Ed Sheeran Tour After Free Palestine Plea Macklemore Responds to Backlash Over Free Palestine Chant at Ed Sheeran Show: Wanting All Humans to be Treated Equal Should Never Be Controversial Macklemore Rakes Donald Trump Elon Musk Over the Coals in Scathing Protest Song F ked Up Shortly after the shows, Pink reshared a post on social media from StopAntisemitism criticizing Macklemore’s remarks and calling for him to be removed from Sheeran’s ongoing stadium tour. On Friday (Sept. 11), the “Just Give Me a Reason” hitmaker took to Instagram to explain why she shared the post and what concerned her about Macklemore’s onstage actions. “Last Sunday I reposted somebody else’s post about Macklemore’s set at Ed Sheeran’s show, Pink began her statement. It said things in words I didn’t write, and I wouldn’t have chosen all of them. Then the comments came, and I did what I do when I’m hurt, which is post snarky memes and act like I’m fine. That’s on me. A repost isn’t a statement, and a meme isn’t a spine. Social media makes all of us cheap and fast, and we all know it.” She continued, “I was born a Jew. I didn’t pick it, and I’ve never hidden it. And this week a whole lot of people decided what I believe without asking me, without checking a single thing I’ve ever said or done, because a repost and the word ‘Jew’ were apparently enough to fill in the rest.” Pink clarified that she has never spoken for “Israel, or for any government” and reiterated her belief that “Hamas is a terrorist organization. Palestinians deserve a future that honors their humanity and their aspirations. Protecting innocent life comes first, everywhere, and nobody should ever celebrate the death of a child. Anybody’s child.” The singer also pointed to her decade-long work as a UNICEF ambassador, saying she has advocated for children impacted by war regardless of where they were born. “I have grieved every one of them, on both sides of that fence,” she wrote. “I didn’t do it from behind a screen; I went to those children and held them. I’m not going to litigate a complex war in an Instagram caption, and I’m not going to recite anybody’s slogan to earn back a follow", "date_str": "2026-09-12T20:07:09+00:00", "hash": "9af8fe591573a782", "title_fa": "پینک به دلیل اظهار نظر درباره موضع طرفدار فلسطین مکلمور: \"ایستادن برای مردم خودم\" واکنش منفی نشان می دهد", "summary_fa": "پینک به واکنش‌های واکنش‌هایش به فراخوان‌های مکلمور برای «آزادی فلسطین» روی صحنه می‌پردازد. رپر «Thrift Shop» در طی مجموعه‌های افتتاحیه‌اش برای تور حلقه اد شیران در استادیوم MetLife نیوجرسی در 4 و 5 سپتامبر، اظهاراتی در حمایت از فلسطین بیان کرد که انتقاد ستاره پاپ را برانگیخت. مککلمور مرتبط با درخواست ترک تور اد شیران پس از درخواست فلسطین آزاد، مککلمور به واکنش شدید درباره شعار فلسطین آزاد در نمایش اد شیران پاسخ داد: مایل به رفتار برابر با همه انسان‌ها هرگز نباید جنجال‌برانگیز باشند. رسانه‌های StopAntisemitism از اظهارات مکلمور انتقاد کردند و خواستار حذف او از تور استادیوم شیران شدند. روز جمعه (11 سپتامبر)، هیت ساز «فقط به من دلیل بده» در اینستاگرام آمد تا توضیح دهد که چرا این پست را به اشتراک گذاشته است و آنچه او را در مورد اقدامات مکلمور روی صحنه نگران کرده است. \"یکشنبه گذشته من پست شخص دیگری را درباره مجموعه مکلمور در شوی اد شیران بازنشر کردم، پینک بیانیه خود را آغاز کرد. چیزهایی را با کلماتی که من ننوشته بودم می گفت، و من همه آنها را انتخاب نمی کردم. سپس نظرات آمدند، و من کاری را انجام دادم که وقتی آسیب می بینم، یعنی پست میم های بداخلاقی و رفتاری که با من خوب است. بازنشر یک بیانیه نیست، و میم یک ستون فقرات نیست. رسانه های اجتماعی همه ما را ارزان و سریع می کنند و همه ما این را می دانیم. او ادامه داد: «من یهودی به دنیا آمدم. من آن را انتخاب نکردم و هرگز آن را پنهان نکردم. و این هفته بسیاری از مردم بدون اینکه از من بپرسند، بدون بررسی یک چیز که تا به حال گفته یا انجام داده ام، تصمیم گرفتند که من چه اعتقادی دارم، زیرا ظاهراً یک بازپست و کلمه «یهودی» برای تکمیل بقیه کافی بود.» پینک تصریح کرد که"}, {"source": "Billboard", "title": "Drake Shares ‘Fear of Missing Out’ Teaser: ‘A Not So Short Film’", "link": "https://www.billboard.com/music/rb-hip-hop/drake-fear-of-missing-out-teaser-a-not-so-short-film-1236338978/", "summary": "Drake has shared another teaser for his mysterious new project, Fear of Missing Out . On Saturday (Sept. 12), the 39-year-old rap superstar took to social media to share a 25-second video captioned, “a not so short film.” Related Drake Teases Fear of Missing Out YouTube Stream Fans Have Theories About What s Coming Drake s ICEMAN Becomes His Longest-Leading No. 1 Album on R B/Hip-Hop Chart Here s Why Drake Fans Think New Music Could Be on the Way “Scored by the family,” the caption on Instagram continues, noting a Sept. 15 release date. In the clip, a neon green speedboat glides across the water with a cityscape in the distance, while Drake appears to be behind the wheel. “What if I told you there were two versions of your life? a female narrator says. In one, you avoid risk and withhold love. You feel like you’ve gone missing from yourself. You look for something you can’t find. In the other version of your life, you find it.” The trailer closes with a black-and-white poster for Fear of Missing Out . The 6 God first rolled out FOMO in early September, when he announced plans for a YouTube livestream scheduled for Sept. 15 at 9 p.m. ET. Following the initial tease, some fans speculated that the cryptic project could be new music, a video or possibly a tour. Drake made history in May with the release of ICEMAN , HABIBTI and MAID OF HONOUR , becoming the first artist to simultaneously hold the top three spots on the Billboard 200. “Janice STFU” became the 14th Billboard Hot 100 No. 1 hit of Drizzy’s career, breaking a tie with Michael Jackson and giving the Toronto MC the most No. 1 hits among male soloists. He also charted a record-high 42 songs on the chart in a single week. ICEMAN debuted at No. 1 on the Billboard 200, giving Drake his 15th chart-topping album and moving him past Jay-Z for the most No. 1 albums among rappers. The album has continued its strong run, spending a career-best 13 weeks at No. 1 on the Top Rap Albums chart. Check out Drake s latest Fear of Missing Out teaser on Instagram below. View this post on Instagram", "date_str": "2026-09-12T18:49:50+00:00", "hash": "43cc26e93e7b510f", "title_fa": "دریک تیزر «ترس از دست دادن» را به اشتراک می‌گذارد: «فیلم نه چندان کوتاه»", "summary_fa": "دریک تیزر دیگری از پروژه مرموز جدید خود، ترس از دست دادن، به اشتراک گذاشته است. روز شنبه (12 سپتامبر)، این سوپراستار رپ 39 ساله در رسانه های اجتماعی ویدئویی 25 ثانیه ای با عنوان \"فیلمی نه چندان کوتاه\" به اشتراک گذاشت. دریک مرتبط ترس از از دست دادن جریان یوتیوب را اذیت می‌کند. طرفداران استریم یوتیوب تئوری‌هایی درباره اتفاقات آینده دارند. 1 آلبوم در نمودار R B/Hip-Hop اینجاست که چرا طرفداران Drake فکر می کنند موسیقی جدید می تواند در راه باشد، عنوان در اینستاگرام ادامه می یابد و به تاریخ انتشار 15 سپتامبر اشاره می کند. در این کلیپ، یک قایق تندرو سبز نئون با منظره شهری در دوردست، در حالی که به نظر می رسد دریک پشت فرمان است، روی آب می چرخد. یک راوی زن می گوید: \"اگر به شما بگویم دو نسخه از زندگی شما وجود دارد چه می شود؟ در یکی از آنها از ریسک اجتناب می کنید و از عشق خودداری می کنید. احساس می کنید از خود غایب شده اید. شما به دنبال چیزی هستید که نمی توانید پیدا کنید. در نسخه دیگر زندگی خود، آن را پیدا می کنید.» تریلر با یک پوستر سیاه و سفید برای ترس از دست دادن به پایان می رسد. 6 خدا اولین بار FOMO را در اوایل سپتامبر منتشر کرد، زمانی که او برنامه‌هایی را برای پخش زنده YouTube اعلام کرد که برای 15 سپتامبر در ساعت 9 شب برنامه ریزی شده است. ET. پس از انتشار اولیه، برخی از طرفداران حدس زدند که این پروژه مرموز می تواند موسیقی جدید، یک ویدیو یا احتمالاً یک تور باشد. دریک در ماه مه با انتشار ICEMAN، HABIBTI و MAID OF HONOR تاریخ ساز شد و اولین هنرمندی شد که به طور همزمان سه جایگاه برتر بیلبورد 200 را به خود اختصاص داد. «جانیس STFU» چهاردهمین موفقیت"}, {"source": "Billboard", "title": "Carín León Returns to the Sphere With Pepe Aguilar and José Guadalupe Esparza as Guests", "link": "https://www.billboard.com/music/latin/carin-leon-sphere-pepe-aguilar-jose-guadalupe-esparza-recap-1236338962/", "summary": "The day after canceling a concert at the Sphere due to airplane issues, Carín León returned on Friday night (Sept. 11) to the impressive stage for the second weekend of his historic residency in Las Vegas. The Mexican music star did not address the cancellation during the show. Despite a flood of criticism on social media, an ecstatic crowd welcomed him with excitement. “¡Que viva México y que viva Hermosillo!” the 37-year-old musician exclaimed as he appeared promptly at 8:30 p.m. (local time), taking off his hat as a gesture of gratitude to the 20,000 fans who came to see him. León, the first Latino to headline a concert at the Sphere, then set out to deliver an unforgettable visual and cultural show, filled with tributes and big surprises. Dressed in an elegant black suit paired with matching boots and hat, he paid tribute to his hometown, Hermosillo, Sonora. On the Sphere s giant screens, stunning images of the desert, a cactus, the sounds of coyotes, Hermosillo s Cathedral, Cerro de la Campana, and other iconic symbols of the region and of Mexico were displayed, honoring his roots with the same pride he has always expressed when speaking about his homeland. View this post on Instagram One of the most moving moments of the night was when photographs of loved ones who are no longer with us were displayed in an altar-like setting with candles, during a section of the show titled “La Caverna Sagrada,” as he performed his hit “Cuando la vida sea trago.” The night’s surprises included the appearance of two major figures in Mexican music as special guests. The first was the legendary Pepe Aguilar , whom León introduced as “one of my greatest inspirations in music.” Together, they performed their emotional collaboration “Lamentablemente” and Aguilar’s iconic hit “Por mujeres como tú,” closing with a big embrace. “Cómo te quiero, cabr–n”, (How much I love you, man), León told him. The second guest was José Guadalupe Esparza , vocalist of the iconic group Bronco , and León couldn t hide his excitement about sharing the stage with one of his childhood idols. “My beautiful people, because at the same time I was learning to say ‘dad,’ I was also saying ‘Bronco.’ Long live Maestro Lupe Esparza, here with us tonight!” he said to welcome him. Together, they performed classics like “Si te vuelves a enamorar,” “Oro,” and “Libros tontos,” leaving the audience ecstatic. Throughout the concert, León not only sang and danced but also took the time to interact with his fans", "date_str": "2026-09-12T17:57:20+00:00", "hash": "1714902d18e6794e", "title_fa": "بازگشت کارین لئون به کره با پپه آگیلار و خوزه گوادالوپه اسپارزا به عنوان مهمان", "summary_fa": "یک روز پس از لغو کنسرت در Sphere به دلیل مشکلات هواپیما، کارین لئون جمعه شب (11 سپتامبر) برای دومین آخر هفته اقامت تاریخی خود در لاس وگاس به صحنه چشمگیر بازگشت. ستاره موسیقی مکزیکی در طول نمایش به لغو این برنامه اشاره نکرد. با وجود سیل انتقادات در شبکه های اجتماعی، جمعیتی سرخورده از او با هیجان استقبال کردند. \"Que viva México y que viva Hermosillo!\" این نوازنده 37 ساله در حالی که به سرعت در ساعت 8:30 شب ظاهر شد فریاد زد. (به وقت محلی)، کلاه خود را به نشانه قدردانی از 20000 هوادار که برای دیدن او آمده بودند، برداشت. لئون، اولین لاتین تبار که در یک کنسرت در Sphere تیتر زد، سپس تصمیم گرفت یک نمایش بصری و فرهنگی فراموش نشدنی را ارائه دهد، پر از ادای احترام و شگفتی های بزرگ. او با پوشیدن یک کت و شلوار مشکی زیبا همراه با چکمه و کلاه همسان، به زادگاهش، هرموسیلو، سونورا ادای احترام کرد. در صفحه‌های غول پیکر Sphere، تصاویر خیره‌کننده‌ای از صحرا، یک کاکتوس، صدای کایوت‌ها، کلیسای جامع Hermosillo، Cerro de la Campana و دیگر نمادهای نمادین منطقه و مکزیک به نمایش گذاشته شد و ریشه‌های خود را با همان غروری که همیشه هنگام صحبت در مورد وطنش ابراز می‌کرد، گرامی می‌داشت. این پست را در اینستاگرام مشاهده کنید یکی از تکان دهنده ترین لحظات شب زمانی بود که عکس های عزیزانی که دیگر در بین ما نیستند در قسمتی از نمایش با عنوان \"La Caverna Sagrada\" در محیطی شبیه به محراب با شمع نمایش داده شد و او آهنگ خود \"Cuando la vida sea trago\" را اجرا کرد. سورپرایزهای شب شامل حضور دو چهره اصلی موسیقی مکزیک به عنوان مهمانان ویژه بود. اولین نفر، پپه آگیلار افسانه ای بود که لئون او را به عنوان \"یکی از بزرگترین الهامات من در موسیقی\" معرفی کرد."}, {"source": "Billboard", "title": "Stray Kids Drives Fans Wild in Historic Rock in Rio Debut", "link": "https://www.billboard.com/music/music-news/stray-kids-rock-in-rio-brazil-debut-review-recap-1236338948/", "summary": "It took a while for Brazil s major festivals to give K-pop a space proportional to the strength the genre has already achieved worldwide. On Friday (Sept. 11), Rock in Rio changed that scenario by dedicating a night of the Palco Mundo (World Stage) to the genre for the first time. And it fell to Stray Kids to close out this historic chapter as headliner. Related Elton John Plays 24-Song Concert Settles His ‘Debt’ to Brazil at 2026 Rock in Rio System of a Down to Headline Massive ‘One Night Only’ Concert in Rio de Janeiro Billboard Brasil Unveils First-Ever Power Players List, Luiz Oscar Niemeyer Named Executive of the Year Bang Chan, Lee Know, Changbin, Hyunjin, Han, Felix, Seungmin, and I.N. were, without a doubt, the most anticipated artists of the day. From early on, STAYs took over the Cidade do Rock with custom lightsticks, group T-shirts, fans, and plenty of anticipation to see the eight members again in Brazil. The response matched the hype. Stray Kids closed out the Palco Mundo lineup with an explosive show, driven by intense choreography, hits from different eras of their career, and constant interaction with a crowd that barely stopped screaming. This reunion was exactly what the members had been waiting for. In an interview with Billboard Brasil before the festival, the group had already spoken about their eagerness to see Brazilian fans again. At Rock in Rio, one only had to look at the crowd to see the feeling was mutual. We ll make sure there s a lot of passion, they said. DOMINO and BOUNCE BACK kicked off a sequence that had already raised the energy sky-high within the first few minutes. Thunderous and MANIAC kept up the intensity, backed by precise choreography and the packed Cidade do Rock singing along. In this first segment, the members went with streetwear-inspired outfits, combining blue, black, and white in athletic pieces, jeans, tank tops, and accessories, keeping an individual identity for each member without losing the group s visual cohesion. Between songs, the lineup broke apart and reassembled quickly, with the members moving across different points of the stage and finding time to joke around and talk with fans. The performance took on a different aesthetic during DIVINE and God s Menu. The members swapped the sporty look from the start for predominantly white outfits with traditional Korean references, while the dancers reinforced that inspiration with black-and-white clothing, hats, and long fabric sashes woven into the cho", "date_str": "2026-09-12T17:19:04+00:00", "hash": "92d202b4f49bc9c0", "title_fa": "بازی Stray Kids در اولین راک تاریخی در ریو طرفداران را وحشی می کند", "summary_fa": "مدتی طول کشید تا جشنواره های بزرگ برزیل فضایی متناسب با قدرتی که این ژانر در سراسر جهان به دست آورده است به کی پاپ بدهد. روز جمعه (11 سپتامبر)، Rock in Rio با اختصاص یک شب از Palco Mundo (صحنه جهانی) به این ژانر برای اولین بار این سناریو را تغییر داد. و این بر عهده Stray Kids بود که این فصل تاریخی را به عنوان سرفصل پایان دهد. مرتبط با اجرای التون جان کنسرت 24 آهنگی \"بدهی\" خود به برزیل را در سال 2026 راک در ریو تسویه می کند. هیونجین، هان، فلیکس، سئونگمین و آی.ان. بدون شک مورد انتظارترین هنرمندان آن روز بودند. از همان ابتدا، STAYs Cidade do Rock را با چراغ‌های سفارشی، تی‌شرت‌های گروهی، طرفداران و انتظارات فراوان برای دیدن دوباره این هشت عضو در برزیل تصاحب کرد. پاسخ با هیاهو مطابقت داشت. Stray Kids با نمایشی انفجاری، که توسط رقص شدید، ضربات از دوره‌های مختلف حرفه‌شان، و تعامل مداوم با جمعیتی که به سختی فریادشان را متوقف می‌کردند، ترکیب Palco Mundo را به پایان رساندند. این اتحاد دقیقاً همان چیزی بود که اعضا منتظر آن بودند. در مصاحبه ای با Billboard Brasil قبل از جشنواره، این گروه قبلاً در مورد اشتیاق خود برای دیدن دوباره طرفداران برزیلی صحبت کرده بودند. در راک در ریو، فقط باید به جمعیت نگاه کرد تا احساس دو طرفه بود. آنها گفتند، ما مطمئن خواهیم شد که اشتیاق زیادی وجود دارد. DOMINO و BOUNCE BACK سکانسی را شروع کردند که قبلاً انرژی را در چند دقیقه اول به اوج خود 93 Cliffhanger با بازی لیلی جیمز و پیرس برازنان بود. در کمال تعجب، Vertical به عنوان ناجی عنوان شناخته شد و حقوق ایالات متحده را به خود اختصاص داد، زیرا سر و صدا در اطراف کن این بود که برچسب جدید Decal نئون در حال خرید فیلم اکشن ماجراجویی است. Vertical قصد دارد این عکس را در بهار 2027 اکران کند. این خبر در زمانی منتشر می‌شود که جیمز در یک عنوان جشنواره پرهیاهو، The Liberation، در کنار کری کون و بلا رمزی بازی می‌کند، که برای اولین بار در Telluride نمایش داده شد و در حال بازی کردن TIFF نیست. مستند Midnight Madness را در Deadline Related Stories تماشا کنید! برایان مولرونی در فیلم خانم ها و آقایان، نخست وزیر شنل پوش کانادایی - برایان مولرونی - نقدهای جشنواره فیلم تورنتو من بازی راکی را بازی می کنم نقد: فیلم زندگینامه پر شور پیتر فارلی از ساخت فیلم کلاسیک استالونه درست به اندازه فیلم اصلی الهام بخش است - جشنواره فیلم تورنتو قرارداد کلیف هنگر توسط Jaroweynyos و مدیر Jaroweysitions مذاکره شد. خرید ریچل وایت از طرف Vertical و CAA Media Finance به نمایندگی از فیلمسازان. Rocket Science دارای فروش بین المللی است. کلیف‌هنجر در بالای دولومیت‌های نفس‌گیر اما خائن قرار دارد، جایی که کوهنورد افسانه‌ای ری کوپر (پیرس برازنان) با دخترانش، نائومی (لیلی جیمز) و سیدنی (نل تایگر فری) یک کلبه مجلل منزوی را اداره می‌کند. هنگامی که پسر یک میلیاردر برای یک تعطیلات آخر هفته وارد می شود، یک باند بی رحم یک آدم ربایی جسورانه"}, {"source": "Deadline", "title": "‘Scooby-Doo: Origins’ Season 1 Production Has Rrrr-Wrapped", "link": "https://deadline.com/2026/09/scooby-doo-origins-season-1-production-wraps-1237099453/", "summary": "The cast, crew and star of Scooby-Doo: Origins can finally take a pawse, as production has wrapped on the first season of the upcoming Netflix live-action series. It s slated to premiere globally on the streamer in 2027. For the first time in Scooby-Doo franchise history, the title character is being portrayed by a real Great [ ]", "date_str": "2026-09-13T14:00:00+00:00", "hash": "de8d89051a6a9b4e", "title_fa": "تولید فصل اول «Scooby-Doo: Origins» Rrrr-Rrapped شده است", "summary_fa": "بازیگران، خدمه و ستاره Scooby-Doo: Origins بالاخره می‌توانند کمی عقب بنشینند، زیرا تولید فصل اول سریال لایو اکشن آینده نتفلیکس به پایان رسیده است. قرار است در سال 2027 به صورت جهانی روی استریمر پخش شود. برای اولین بار در تاریخ فرنچایز اسکوبی دو، شخصیت عنوان توسط یک سگ گریت دین واقعی به تصویر کشیده می شود. (عکس او را در بالا می بینید). Scooby-Doo: Origins بر اساس شخصیت‌هایی که توسط هانا-باربرا خلق شده‌اند، بازسازی مدرنی از گروه نمادین راز گشای نوجوانان و سگ بسیار خاصشان است. در آخرین تابستان خود در کمپ، دوستان قدیمی شگی (تانر هاگن) و دافنه (مکنا گریس) درگیر معمایی ترسناک پیرامون یک توله سگ تنها گمشده گریت دین می شوند که ممکن است شاهد یک قتل فراطبیعی بوده باشد. داستان‌های مرتبط بازی‌های ویدیویی نتفلیکس در حال توسعه اخبار سریال‌های متحرک Diablo SNL بریتانیا لمپون‌های سرد باز بازگشت هری مگان: به من نگویید که قبلاً تمام پول نتفلیکس خود را خرج کرده‌اید! همراه با شهرکی عملگرا و علمی، ولما (ابی رایدر فورتسون)، و بچه جدید عجیب و غریب، اما همیشه بسیار خوش تیپ، فردی (مکسول جنکینز)، آنها تصمیم گرفتند تا پرونده ای را حل کنند که هر یک از آنها را به کابوس وحشتناکی می کشاند که تهدید می کند همه رازهای آنها فاش شود. تماشا در ددلاین بازیگرانی که قبلا اعلام شده بود شامل پل والتر هاوزر، رستی شویمر، پیتر میکون، جونا شیائو، دنی دیت، الیس ای سانویل، الکس آیلز، اوری کریستن پول، پاملا میچل، راس کیمبال، سارا گیلبرت، وین اورت، ساوریان آندری ساپیتیکو، سوریان آندری کتیار مین، سارا گیلبرت، وین اورتی، ساوریان ساپیتی مینتا می‌شوند. ساخته شده توسط جو روبی و کن اسپیرز، Scooby-Doo! فرنچایز در سال 1969 با اولین انیمیشن دوتایی Scooby-Doo، Where Are You! برای آن زمان هانا-باربرا (بعدها در انیمیشن برادران وارنر جذب شد)."}, {"source": "Deadline", "title": "Midnight Madness! A Caped Canadian Prime Minister Stars In ‘Ladies And Gentlemen, Brian Mulroney’ – Toronto Film Festival", "link": "https://deadline.com/2026/09/ladies-and-gentlemen-brian-mulroney-toronto-film-festival-1237100505/", "summary": "Canada’s prime minister, Mark Carney, attended the opening of the Toronto Film Festival last year, د. در آخرین تیتراژ باقی بمانید و تنها صحنه ای در این حماسه که برای فیلم دوباره ساخته نشده است، پاداش خواهید گرفت. جانی کارسون با معرفی استالونه برای اولین بار در برنامه The Tonight Show برای تبلیغ راکی، کمی از پیشینه باورنکردنی این داستان می گوید که استالونه صدها هزار دلار را برای فیلمنامه خود رد کرد تا اصرار کند در فیلمی که برای خودش نوشته است بازی کند (حتی اگر در آن زمان کاملاً ناشناخته بود). کارسون به طور پیشگوئی گفت که اگر کسی واقعاً فیلمی درباره ساخت راکی ​​بسازد، هیچ کس آن را باور نمی کند. خب، یک نفر این کار را انجام داده است، و فیلمی که نتیجه اش از هر نظر برنده است، فیلمی که در واقع موفق می شود همان والای احساسی راکی ​​اصلی را تحمل کند و شامل اجرای آنتونی ایپولیتو است که آنقدر عجیب و غریب است که برای یک دقیقه فکر نمی کردم او کسی است جز استالونه واقعی. به نظر می رسد آنها فقط از فناوری پیری زدایی استفاده کرده اند تا استالونه بتواند نیم قرن جوان تر از خود نقش آفرینی کند. اما اشتباه نکنید، تصویر قدرتمند، تکان دهنده و الهام بخش ایپولیتو تقلید صرف نیست. این مرد از هر نظر ساکن استالونه است و یک پرتره معتبر ارائه می دهد که شما را شگفت زده می کند. فارلی گفته است که بدون موهبت استالونه فیلم را نمی‌ساخت، و او با ساختار و فیلمنامه‌ای زیبای پیتر گمبل، یکی از بهترین فیلم‌های"}, {"source": "Deadline", "title": "‘Misty Green’ Review: Rosalind Eleazar Is The Whole Show In Chris Rock’s Sizzling Hollywood Portrait Of A Down-And-Out Emmy Winner Whose Career Is On The Skids – Toronto Film Festival", "link": "https://deadline.com/2026/09/misty-green-review-rosalind-eleazar-chris-rock-hollywood-1237099694/", "summary": "I have to confess I am a sucker for down-on-your-luck Hollywood stories, especially movies about actresses who once had success and are now scraping the bottom. Of course there is the classic of classics, Sunset Boulevard, but there are many more. A personal favorite is The Star, which got Bette Davis an Academy Award nomination [ ]", "date_str": "2026-09-13T03:30:00+00:00", "hash": "7d903dfa4d8b707c", "title_fa": "نقد و بررسی «Misty Green»: Rosalind Eleazar کل نمای ed in on Saturday evening, accusing the Texas U.S. Senate candidate of orchestrating a hoax to drive up clicks and donations. Earlier this week, Kimmel told viewers that he would be sitting down with an interview with Talarico [ ]", "date_str": "2026-09-13T02:09:10+00:00", "hash": "dac1d6bf93e57799", "title_fa": "برندن کار، رئیس FCC، جیمز تالاریکو را متهم به اجرای یک \"فریب\" با جیمی کیمل در نشستن کرد. مصاحبه یوتیوب به 7 میلیون بازدید نزدیک شد", "summary_fa": "در حالی که مصاحبه جیمی کیمل با جیمز تالاریکو به 7 میلیون بازدید در یوتیوب نزدیک می شود، برندن کار، رئیس FCC، شامگاه شنبه، نامزد سنای تگزاس ایالات متحده را به سازماندهی فریبکاری برای افزایش کلیک ها و کمک های مالی متهم کرد. اوایل این هفته، کیمل به بینندگان گفت که با Talarico برای برنامه آخر شب خود در ABC مصاحبه خواهد کرد، اما به دلیل سرکوب قانون زمان برابر توسط FCC، این مصاحبه در یوتیوب پست خواهد شد و پخش نخواهد شد. در پستی در X، کار تالاریکو را متهم کرد که فقط همان حقه‌ای را که چند ماه پیش روی کولبرت انجام داد، به منظور دریافت کلیک‌ها و کمک‌های مالی که او به افرادی که قانون را نمی‌دانند یا به‌عنوان لمینگ‌های حزبی عمل می‌کنند، اجرا کرده است. اخبار مربوط به آخرین مهلت را تماشا کنید مدیر عامل آنتروپیک خواستار کاهش سرعت توسعه هوش مصنوعی است، هشدار می دهد که ازدحام اینترنت را در 6 تا 12 ماه اشغال می کند. لوئیس، کولبر/کیمل کمبو او همچنین قبل از اینکه کیمل چوبی را در پره‌ها بگذارد و به زمین بخورد، میم از تالاریکو در حال دوچرخه‌سواری در پشت کیمل منتشر کرد. باشه خوبه من وزن خواهم کرد. 1. قانون زمان برابر به چند دلیل برای GameDay اعمال نمی شود. برای اولین بار، زمانی که این اساسنامه تصویب شد، کنگره آن را برای پخش ایستگاه های تلویزیونی به کار برد، نه برنامه های کابلی مانند GameDay. برای دیگری، کنگره اعلام کرد که این اساسنامه فقط برای… https://t.co/r3KP7RvQL8 pic.twitter.com/m5IbEl8Ngr یک سخنگوی کمپین Talarico بلافاصله به درخواست برای اظهار نظر پاسخ نداد. مصاحبه کیمل تا عصر شنبه 6.8 میلیون بازدید داشت."}, {"source": "Deadline", "title": "‘The Surgeon’ Review: Michelle Yeoh Goes All John Wick Taking Her Scalpel To The Bad Guys – Toronto Film Festival", "link": "https://deadline.com/2026/09/the-surgeon-review-michelle-yeoh-toronto-film-festival-1237099602/", "summary": "After supporting roles in blockbusters like Wicked, Michelle Yeoh has her first all-out starring role since winning the Best Actress Oscar for Everything Everywhere All at Once three years ago. Considering her expertise in martial arts and kick-ass action (Crouching Tiger, Hidden Dragon for starters), her latest effort in the genre is a lot of [ ]", "date_str": "2026-09-13T02:05:00+00:00", "hash": "b0e132e61d808e70", "title_fa": "نقد و بررسی «جراح»: میشل یئو همه چیز را می‌برد جان ویک که اسکالپلش را به آدم‌های بد می‌برد - جشنواره فیلم تورنتو", "summary_fa": "پس از نقش‌های مکمل در فیلم‌های پرفروشی مانند Wicked، میشل یئو اولین نقش اصلی خود را پس از سه سال پیش برنده جایزه بهترین بازیگر زن اسکار برای فیلم همه‌جا همه‌جا همه‌جا در یکباره بازی کرد. با توجه به تخصص او در هنرهای رزمی و اکشن لگد زدن (ببر خیزان، اژدهای مخفی برای شروع)، آخرین تلاش او در این ژانر بسیار سرگرم کننده است، اما نه برای شکم ژولیده، زیرا The Surgeon باعث می شود که پیت شبیه PAW Patrol شود. این سواری هیجان‌انگیز پزشکی به‌عنوان سلاحی که حتی جان ویک هم به آن حسادت می‌کند، مانع از کشف آناتومی انسان نمی‌شود. شاید این یکی را جان مریض بنامیم؟ وقتی که شما فقط با بیرون کشیدن روده بزرگ و فشار دادن به مدت 30 ثانیه، مرگ فوری را به ارمغان می آورید، به اسلحه نیاز دارد. این فیلم از نویسنده و کارگردان دکتر روشن ستی (یک پسر سرخپوست خوب) راهنمای تبدیل افراد بد به معنای واقعی کلمه است. هیچ شکی وجود ندارد که چه چیزی Yeoh، یک ستاره اکشن عالی و همچنین بازیگر جدی، را به نقش الیزا، جراح مشهور جهانی که 40 سال از قوانین رهبانی پزشکی خود پیروی کرده و اکنون در حال بازنشستگی است، جذب کرد. اوایل تماس تلفنی از شرکت بیمه او همه چیز را می گوید: آیا باید به بیمه کردن دستان شما ادامه دهیم؟ و پاسخ نه، دیگر ضروری نیست. در Deadline تماشا کنید اما این برنامه‌ها برای آسان‌تر شدن همه چیز به طرز بی‌رحمانه‌ای قطع می‌شوند وقتی که او با اسلحه توسط تبهکاران ربوده می‌شود و به آنها دستور می‌دهند تا رهبرشان  اوپن آمریکا 2026 امروز یکشنبه 13 سپتامبر ساعت 2 بعد از ظهر برگزار می شود. ET / 11:00 PT، با پخش زنده مسابقه Shelton و Zverev از ABC. می‌توانید مسابقه تنیس را از طریق شبکه محلی ABC از طریق تلویزیون تماشا کنید. کابل ندارید؟ می توانید پخش زنده Shelton vs. Zverev آنلاین با استفاده از یک سرویس پخش زنده تلویزیونی مانند موارد زیر، که برخی از آنها راه هایی را برای تماشای آنلاین فینال مردان آزاد ایالات متحده به صورت رایگان ارائه می دهند. به‌عنوان یک طرفدار بزرگ تنیس، من شخصاً سال‌ها از Fubo برای تماشای زنده تنیس آنلاین از طریق کانال تنیس، ESPN و ABC استفاده می‌کنم. فید ABC پخش‌کننده به شما امکان می‌دهد بازی تنیس شلتون و زورف امروز را به‌صورت آنلاین و بدون نیاز به کابل تماشا کنید. Fubo همچنین دارای یک نسخه آزمایشی رایگان است که می توانید از اینجا به آن دسترسی داشته باشید. از نسخه آزمایشی رایگان برای پخش زنده ایالات متحده استفاده کنید. فینال مردانه رایگان آنلاین باز کنید. نسخه آزمایشی رایگان Fubo شامل DVR است، بنابراین اگر نمی‌توانید به صورت زنده تنظیم کنید (یا فقط می‌خواهید از پخش"}, {"source": "Rolling Stone", "title": "Celine Dion Returns to the Stage in Paris With Elegance and Emotion", "link": "https://www.rollingstone.com/music/music-live-reviews/celine-dion-returns-live-comeback-paris-review-1235625843/", "summary": "After more than six years away from performing, the singer makes a long-awaited comeback in Paris, in an operatic celebration of voice, movement and the extraordinary bond with her audience", "date_str": "2026-09-13T13:10:15+00:00", "hash": "d2497226d842ad85", "title_fa": "سلین دیون با ظرافت و احساسات به صحنه در پاریس بازگشت", "summary_fa": "ساعت 20 اعلام شد بدون هیچ افتتاحیه، سلین دیون در نهایت در ساعت 8:48 ظاهر شد، پس از انتظاری که تنها تب را در Plenitude Arena تشدید کرده بود. در آن زمان، شعارها یکی از مشهورترین خوانندگان جهان را به تنها نامی که پاریس به آن نیاز داشت کاهش داده بود: C line! خط C! خط C! روزها بود که شهر به همین زبان صحبت می کرد. یک ایستگاه حمل و نقل نزدیک به طور موقت به نام او تغییر نام داده است. کسب‌وکارها به آن ملحق شده بودند، گاهی اوقات es/movie-news/christopher-walken-back-in-black-film-tiff-2026-interview-1236693818/", "summary": "Jane Curtin and Ella Ballentine also feature in Ron Murphy's debut feature set for a world premiere at the Toronto Film Festival.", "date_str": "2026-09-13T13:15:00+00:00", "hash": "05f28892d23c5595", "title_fa": "کارگردان «بازگشت به سیاهی» در فیلم قاتل سریالی دوست‌داشتنی که «کارهای بد را به دلایل درست انجام می‌دهد» در کریستوفر واکن-استارر", "summary_fa": "بازگشت به سیاه، به عنوان یک درام جنایی تاریک خنده دار، اصلاً عجیب نیست. طنز ران مورفی در مورد یک تشییع جنازه در حال ورشکستگی، کریستوفر واکن را در نقش پدرسالار خانواده کلاید مورتیمر بازی می کند که به ورشکستگی خیره شده است. اما زمانی که سام، نوه آرام او با بازی الا بالنتاین، باعث افزایش مشکوک تعداد قتل‌ها در شهرهای کوچک می‌شود که باعث می‌شود پلیس محلی سرگردان شود و ردپایی از اجساد به آستان او می‌رسند، کسب‌وکار او از رونق ناگهانی برخوردار می‌شود. همه‌ی این‌ها این سوال را ایجاد می‌کنند: چه چیزی در قاتلان زنجیره‌ای خیرخواه وجود دارد که انتظار می‌رود تماشاگران جشنواره فیلم تورنتو سم را به عنوان یک ضدقهرمان تشویق کنند، در حالی که تعداد کشته‌های محلی شهرش افزایش می‌یابد؟ این کمی حقه است، اینطور نیست؟ اکثر افراد در غربالگری های آزمایشی که ما انجام داده ایم ریشه (Sam) دارند. و در همین حال، کاری که او انجام می‌دهد از نظر اخلاقی مذموم است، مورفی پیش از فیلم Back in Black، اولین فیلم سینمایی خود که اولین نمایش جهانی خود را در TIFF داشت، به هالیوود ریپورتر می‌گوید. داستان‌های مرتبط فیلم‌هایی که فینا استرازا در آن بازی می‌کند، درام عاشقانه را هر طور که می‌خواهید تولید می‌کند (انحصاری) فیلم‌ها تورنتو: IDDA ایرنه دیونیزیو در FilmClub Distribuzione برای ایتالیا فرود می‌آید (اختصاصی). مورتیمر و همسرش با بازی جین کرتین، بر سر مسائل مالی با هم دعوا می کنند و از بازنشستگی آبرومندانه محروم می شوند. مورفی درباره درام روان‌شناختی اخلاق‌گرایانه‌اش می‌افزاید، من از مخاطب می‌پرسم، حاضرید برای کسی که دوستش دارید تا کجا پیش بروید. نه اینکه شخصیت مورتیمر واکن، به دلیل ارادتش به خانواده‌اش و تجارت نسل‌های آن، خودش حیله‌گر و بی‌رحم نیست. مورفی به یاد می آورد که با رزومه کاری پربارش و نقش برنده اسکار در فیلم شکارچی گوزن در سال 1978، بلافاصله پس"}, {"source": "Hollywood Reporter", "title": "Fina Strazza to Star in, Produce Romantic Drama ‘Any Way You Want Me’ (Exclusive)", "link": "https://www.hollywoodreporter.com/movies/movie-news/fina-strazza-romantic-drama-any-way-you-want-me-toronto-1236699547/", "summary": "The ‘Fear Street: Prom Queen’ star has nabbed the lead in the indie, written and directed by her mother Rana Strazza, which is being shopped to international buyers at TIFF: The Market.", "date_str": "2026-09-13T13:05:03+00:00", "hash": "6afd721c11718169", "title_fa": "فینا استرازا برای ایفای نقش، تهیه کنندگی درام رمانتیک «هر جوری که بخواهی» (اختصاصی)", "summary_fa": "Fina Strazza، ستاره Fear Street: Prom Queen و Paper Girls، قرار است در درام عاشقانه Any Way You Want Me به کارگردانی Rana Strazza که مادر او نیز هست، تهیه کنندگی و بازی کند. استرازا نقش بیلی بلیک را بازی خواهد کرد که وقتی مادرش یک مغازه لباس فروشی در کنار معشوقه دبیرستانش کالوین ویلکس به ارث می برد، به خانه بازمی گردد. بر اساس خلاصه داستان تهیه‌کنندگان، بیلی که مجبور به رویارویی با کالوین می‌شود، باید با حقیقت و دروغ‌هایی که به داستان عاشقانه آن‌ها پایان داد، مبارزه کند. Strazza به گروهی از بازیگران شامل Cobie Smulders، Iris Apatow، Brian Altemus و Callan Potter می‌پیوندد. Anyway You Want Me، که در نیوانگلند دهه 1950 اتفاق می‌افتد و اکنون در تورنتو فیلم‌برداری می‌شود، این هفته نیز برای خریداران بین‌المللی در TIFF: The Market خرید می‌شود. داستان‌های مرتبط فیلم‌ها تورنتو: IDDA ایرنه دیونیزیو در FilmClub Distribuzione برای ایتالیا فرود می‌آید (انحصاری) فیلم‌ها واژه‌ها سلاح‌ها هستند: Michaël R. Roskam در مورد تبدیل شوخی روزنامه جعلی جنگ جهانی دوم به فیلم دزدی مادر من بزرگترین همکار من در تمام دوران حرفه ای من بوده است. او باهوش ترین و سخت کوش ترین زنی است که تا به حال دیده ام. افراد کمی هستند که برای خلق دنیایی به همان اندازه دلربا و دقیقی که او ساخته است مجهزتر باشند. فینا استرازا در بیانیه‌ای روز یکشنبه گفت که تهیه‌کنندگی در کنار او و به تصویر کشیدن بیلی بلیک زیبای ما در نامه عاشقانه‌اش به فیلم‌هایی که بر هنر او تأثیر گذاشته‌اند، شادی کاملی است. این فیلم توسط First Magnitude Films و Stagg Forrest Films تولید خواهد شد و مت استرازا، نویسنده/کارگردان Rana Strazza و Jeff Cryder به عنوان تهیه کنندگان اجرایی فعالیت خواهند کرد. Myrthin Stagg و Kate Forrest نیز در نقش تهیه کننده مشترک هستند. رانا استرازا در بیانیه خود اضافه کرد، در"}, {"source": "Hollywood Reporter", "title": "Toronto: Irene Dionisio’s ‘IDDA’ Lands at FilmClub Distribuzione for Italy (Exclusive)", "link": "https://www.hollywoodreporter.com/movies/movie-news/toronto-irene-dionisios-idda-1236699536/", "summary": "The Italian filmmaker’s second narrative feature had a world premiere at the Toronto Film Festival as part of the Platform competition.", "date_str": "2026-09-13T12:31:04+00:00", "hash": "f88de4853671dedd", "title_fa": "تورنتو: «IDDA» ایرنه دیونیزیو در FilmClub Distribuzione برای ایتالیا فرود آمد (انحصاری)", "summary_fa": "FilmClub Distribuzione پس از اولین نمایش جهانی در جشنواره فیلم تورنتو به عنوان بخشی از برنامه پلتفرم، درام IDDA Mount Etna از ایرن دیونیزیو را برای ایتالیا خریداری کرد. قرارداد با توزیع بین‌المللی سینما رای برای دومین فیلم روایی دیونیزیو است که تکلا اینسولیا و رومانا ماگیورا ورگانو در آن بازی می‌کنند و در TIFF: بازار تورنتو خرید می‌شود. IDDA دوستان دوران کودکی ادل و سوفیا را دنبال می کند که اکنون در 30 سالگی هستند و پیوند مادام العمر آنها در طول سفری در مناظر آتشفشانی کوه اتنا سیسیل به چالش کشیده می شود. داستان های مرتبط فیلم ها واژه ها سلاح هستند : Michaël R. Roskam در مورد تبدیل یک شوخی روزنامه جعلی جنگ جهانی دوم به یک فیلم دزدی در داخل نازا، افشای بمب در جنگ ارتش اسرائیل در غزه آندریا کورتی، مدیر عامل و رئیس شرکت FilmClub Distribuzione، یک شرکت Minerva Pictures، در بیانیه ای در روز یکشنبه گفت: ما بهترین فصل را برای افتخار به ارمغان آورده ایم. مخاطب ایتالیایی IDDA قبل از هر چیز یک سفر شگفت انگیز با افراد شگفت انگیز است: ایرنه دیونیزیو، جیووانی پومپیلی و کل تیم سازنده، و بازیگران شگفت انگیز با سه نفر از با استعدادترین     let currentTab = 'persian';
    let searchQuery = '';
    let readArticles = new Set(JSON.parse(localStorage.getItem('read_articles_registry') || '[]'));

    function toFaDigits(n) {
      const f = ['۰','۱','۲','۳','۴','۵','۶','۷','۸','۹'];
      return n.toString().replace(/\d/g, d => f[d]);
    }

    function toggleRead(hash) {
      if (readArticles.has(hash)) {
        readArticles.delete(hash);
      } else {
        readArticles.add(hash);
      }
      localStorage.setItem('read_articles_registry', JSON.stringify(Array.from(readArticles)));
      renderNews();
    }

    function renderNews() {
      const container = document.getElementById('newsContainer');
      const rawItems = data[currentTab] || [];
      
      const filtered = rawItems.filter(item => {
        if (!searchQuery) return true;
        const q = searchQuery.toLowerCase();
        const title = (item.title_fa || item.title || '').toLowerCase();
        const summary = (item.summary_fa || item.summary || '').toLowerCase();
        const source = (item.source || '').toLowerCase();
        return title.includes(q) || summary.includes(q) || source.includes(q);
      });

      const unreadList = [];
      const readList = [];

      filtered.forEach(item => {
        if (readArticles.has(item.hash)) {
          readList.push(item);
        } else {
          unreadList.push(item);
        }
      });

      const sortedItems = [...unreadList, ...readList];

      if (sortedItems.length === 0) {
        container.innerHTML = '<div style="text-align:center; padding: 40px; color: var(--text-muted);">هیچ خبری در این بخش در ۲۴ ساعت گذشته ثبت نشده است.</div>';
        return;

      container.innerHTML = sortedItems.map((item, idx) => {
        const title = item.title_fa || item.title || '';
        const summary = item.summary_fa || item.summary || '';
        const source = item.source || 'منبع خبر';
        const link = item.link || '#';
        const isRead = readArticles.has(item.hash);
        const num = toFaDigits(idx + 1);

        return `
          <article class="news-card ${isRead ? 'is-read' : ''}" id="card-${item.hash}">
            <div class="news-header">
              <span class="news-num">${isRead ? '✓' : num}</span>
              <h2 class="news-title">${title}</h2>

              </div>
            </div>
          </article>
        `;
      }).join('');

    function switchTab(tab, el) {

      updateThemeButton(next);

      if (theme === 'dark') {

        text.textContent = 'حالت روشن';
      } else {
        icon.textContent = '🌙';
        text.textContent = 'حالت تاریک';
      }
    }
