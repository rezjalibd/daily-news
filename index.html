sing-can-track-everything-you-do-through-your-router?utm_medium=RSS", "summary": "A simple wifi feature could let ISPs track your location and movement patterns within your home. \"Wifi motion sensing\" turns your ISP s router into a motion detector, letting providers know exactly how many people are in the house, where they are situated, individual movement patterns, and, in some cases, even body shapes that could approximate a person s identity. While the technology isn t universally implemented just yet and is typically opt-in only (smart home users might want the movement tracking feature for lights and heating), it presents quite a few privacy risks. So here s how wifi routers sense motion, what they can do with it, who has access to the data, and how you can disable it. What is wifi motion sensing? Wifi routers rely on radio signals to connect wirelessly to your devices and appliances. Those same radio signals are also absorbed and reflected by the human body as they travel in all directions from the router. With the right software, ISPs can track how those wifi signals travel around your room, which can be studied to detect presence and sense motion patterns. As long as your ISP s router model supports this feature natively, it doesn t require any additional hardware to be installed in your home. For example, Xfinity s version of the feature pairs your router with five other connected appliances in your room to create oval-shaped sensing zones that can track your presence and movement within those spaces. It isn t a new feature, either companies like Cognitive Systems and Origin Wireless that supply networking hardware to ISPs have been offering wifi motion sensing for years now, while early research prototypes from the MIT date back at least as far as 2015 . In 2025, IEEE updated its Wi-Fi 802.11 standard to include motion sensing and lay out the architectural guidelines for it, which makes it likely that even more routers will now ship with the feature. Wha rowned in 2012. David Becker/Getty Images The 2026 Miss Universe pageant will take place on November 24 in San Juan, Puerto Rico. Nine Miss USA titleholders have won Miss Universe in its 75-year history. R'Bonney Gabriel, who won in 2022, was the last Miss USA to take the Miss Universe crown. Beauty queens from around the world are getting ready for the biggest night in pageants. On November 24, over 100 women will compete in the 75th annual Miss Universe competition . This year, Justus Kelley will represent the United States at the pageant. She won the Miss USA 2026 title in August, becoming the first married woman and mother to take home the crown. In honor of the coming competition, let's take a look back at the nine Miss USAs who have won Miss Universe. 1954: Miriam Stevenson Christianne Martel, 1953 Miss Universe, crowns Miss Universe 1954 Miriam Stevenson Bettmann/Getty Images Stevenson was crowned Miss Universe in 1954, making her the first American to win the pageant. She initially tied with Miss Brazil Martha Rocha, but the judges ultimately decided to crown Stevenson because they thought she had a better physique, according to Telemundo . Stevenson grew up on a dairy farm and was a student at Lander College when she began competing in pageants, first representing South Carolina in the Miss USA pageant in 1954, according to the college , now called Lander University. After her reign ended, Stevenson — who is now 93 years old — finished her studies and became a TV host, Telemundo also reported. She met her husband, Donald Upton, through work, and they had two children. 1956: Carol Morris Miss USA 1956. Earl Leaf/Michael Ochs Archives/Getty Images Morris won Miss USA while representing Iowa before she went on to become Miss Universe. The then-20-year-old was studying elementary education at Drake University when she took home the crown. After her win, she left college behind to act, according to the Des Moines Register . Morris' last IMDb credit is for an \"I ان سلطنت، استیونسون - که اکنون 93 سال دارد - تحصیلات خود را به پایان رساند و مجری تلویزیون شد. او از طریق کار با همسرش دونالد آپتون آشنا شد و", "image_url": "https://i.insider.com/6aed1330c54bfafa65abf8c9?width=1200&format=jpeg", "category": "هوش مصنوعی مولد", "tags": ["سینما"], "datetime_fa": "۲ آذر • ۱۷:۳۳"}, {"source": "Business Insider", "title": "They left Goldman to found a VC firm — and just secured $320 million for their second fund", "link": "https://www.businessinsider.com/goldman-sachs-executives-key1-founders-venture-capital-fund-2026-11", "summary": "Sarel Eldor, Amit Pilowsky, and Danny Akerman spent years as executives at Goldman Sachs before founding Key1 Capital. Key1 Capital Three former Goldman Sachs executives, including the CEO of its Israel office, left to found a VC firm. They raised $320 million for their second fund, focusing on late-growth Israeli tech companies. The founders drew on their experience at — and relationships at — the bank for the raise. Three former Goldman Sachs executives have secured $320 million for their VC firm's second fund — and they've been using their relationships at the bank to help raise the capital. Sarel Eldor, Amit Pilowsky, and Danny Akerman founded Key1 Capital, a late-growth venture capital firm, in 2022, after spending years at Goldman in Israel. Key1 said most of the capital for its second fund comes from institutional investors and family offices, along with nearly 10 limited partners who are current or former Goldman executives . Former clients are also involved in the fund — among the 25 LPs who are current or former founders, 20 of them worked with the Key1 team during their time at the bank. Some of their old clients are mentors to the founders Key1 is now backing. The Tel Aviv-based firm invests in Israeli and Israeli-related tech companies, focusing on late-stage companies. Two of Key1's biggest exits from its first $300 million fund include gaming company Superplay's sale to entertainment company Playtika in 2024, and Dustphonics' sale to Credo Tech in the semiconductor industry earlier this year. Investors see a growing opportunity in the country's startup ecosystem, which has a high concentration of AI companies. Israeli tech companies raised around $4.1 billion in the third quarter of this year compared to $2.4 billion in the third quarter of last year, according to a report from the IVC Research Center. The founders told Business Insider they're particularly excited about the opportunities in AI infrastructure and cyber in Israel . \"The opportunity is as good, and probably even better, than we had in fund one,\" Pilowsky said. \"One, more founders want to build bigger businesses, and two, AI is such a massive propeller for every good founder.\" At Goldman, Key1's cofounders generally worked with well-established companies considering an M A deal or going public, which they say has informed their strategy today. \"Through essentially a tremendous amount of repetition, you know how to actually select those that you feel comfortable taking public, s", "date_str": "2026-11-23T14:00:01+00:00", "hash": "dedafe6a804123cb", "title_fa": "آنها گلدمن را ترک کردند تا یک شرکت VC تأسیس کنند - و فقط 320 میلیون دلار برای صندوق دوم خود تضمین کردند", "summary_fa": "سارل الدور، آمیت پیلوفسکی و دنی آکرمن قبل از تاسیس Key1 Capital سال‌ها را به عنوان مدیران در گلدمن ساکس سپری کردند. Key1 Capital سه نفر از مدیران سابق گلدمن ساکس، از جمله مدیرعامل دفتر اسرائیلی آن، برای تأسیس یک شرکت VC ترک کردند. آنها 320 میلیون دلار برای صندوق دوم خود با تمرکز بر شرکت های فناوری اسرائیلی که در اواخر رشد بودند، جمع آوری کردند. بنیانگذاران از تجربه و روابط خود در بانک برای افزایش حقوق استفاده کردند. سه مدیر سابق گلدمن ساکس 320 میلیون دلار برای صندوق دوم شرکت VC خود تضمین کرده اند - و آنها از روابط خود در بانک برای کمک به افزایش سرمایه استفاده می کنند. سارل الدور، آمیت پیلووسکی و دنی آکرمن پس از گذراندن سال‌ها در گلدمن در اسرائیل، Key1 Capital، یک شرکت سرمایه‌گذاری خطرپذیر با رشد دیرینه را در سال 2022 تأسیس کردند. Key1 گفت که بیشتر سرمایه برای صندوق دوم آن از سوی سرمایه گذاران نهادی و دفاتر خانوادگی، همراه با نزدیک به 10 شریک محدود که مدیران فعلی یا سابق گلدمن هستند، تامین می شود. مشتریان سابق نیز در این صندوق مشارکت دارند - در میان 25 LP که بنیانگذار فعلی یا سابق هستند، 20 نفر از آنها در طول مدتی که در بانک بودند با تیم Key1 کار می کردند. برخی از مشتریان قدیمی آنها مربیان بنیانگذارانی هستند که Key1 اکنون از آنها حمایت می کند. این شرکت مستقر در تل آویو در شرکت‌های فناوری اسرائیل و مرتبط با اسرائیل سرمایه‌گذاری می‌کند و بر شرکت‌های آخرین مرحله تمرکز دارد. دو مورد از بزرگترین خروجی های Key1 از اولین سرمایه 300 میلیون دلاری خود شامل فروش شرکت بازی Superplay به شرکت سرگرمی Playtika در سال 2024 و فروش Dustphonics به Credo Tech در صنعت نیمه هادی در اوایل سال جاری است. سرمایه گذاران فرصت رو به رشدی را", "image_url": "https://i.insider.com/6b00217f73f126f9eccb8afa?width=1200&format=jpeg", "category": "هوش مصنوعی مولد", "tags": ["هوش مصنوعی", "امنیت سایبری", "تراشه", "سرمایه‌گذاری"], "datetime_fa": "۲ آذر • ۱۷:۳۰"}, {"source": "Business Insider", "title": "The British Army brought in a battle-tested Ukrainian officer to prepare future officers for the brutal realities of modern war", "link": "https://www.businessinsider.com/ukrainian-officer-training-british-army-future-military-leaders-2026-11", "summary": "A Ukrainian officer is helping future British Army leaders get ready for future war, guiding their training and answering cadets and leaders questions. Sinéad Baker Britain's future army officers are training differently, drawing on lessons from Ukraine's war. Cadets are digging different trenches, moving faster, and training under drone threats. A Ukrainian officer with front-line experience is helping instructors make training more realistic. On England's Salisbury Plain, British Army officer cadets peppered a Ukrainian combat veteran with questions about the war. How many drones do Ukrainian soldiers face? How do they dig defensive positions without exposing themselves to attack? And how do they conceal themselves from the enemy? The cadets are \"eager to learn,\" said Capt. Will Kriehn, a British Army platoon commander. \"They're fighting for information all the time.\" The Ukrainian officer, known by his call sign Zero, has fought on the front lines and is now helping prepare Britain's next generation of military leaders, bringing firsthand lessons from a modern battlefield transformed by drones and other technologies. Zero is no stranger to the officer training at Sandhurst. He completed the British Army's officer training course there in 2022, before returning to the front . Now he's back helping instructors and cadets rethink how they ready officers for combat. \"It's just really useful having an individual who's been through Sandhurst, who's spent four years on the front line in Ukraine,\" Brigadier Nick Wight-Boycott, the commander of the Royal Military Academy Sandhurst, said, explaining that it's valuable to be able to ask, \"What from Sandhurst worked for you?\" The 44-week commissioning course at the Royal Military Academy Sandhurst, the home of British Army officer training, is making changes in response to the war in Ukraine . Cadets are learning to dig different trenches , move faster, and operate under the constant threat of enemy drones. Zero is spending several months advising instructors and cadets on what modern combat looks like and helping shape the training environment. Brigadier Nick Wight-Boycott, the commander of the Royal Military Academy Sandhurst, told Business Insider that \"the new scenario, I think, is more realistic than the one to which we've used in the past.\" Learning from a Ukrainian combat veteran Zero, who served as a platoon commander on Ukraine's front lines, is at Sandhurst as an advisor rather than a formal instructor. H", "date_str": "2026-11-23T13:53:33+00:00", "hash": "024ad14246c4e2fe", "title_fa": "ارتش بریتانیا یک افسر اوکراینی را که در نبرد آزمایش شده بود وارد کرد تا ا کلی در سونی", "summary_fa": "Shawn Levy s 21 Laps Entertainment یک قرارداد کلی فیلم با سونی پیکچرز امضا کرده است. 21 Laps پس از یک فرآیند رقابتی با استودیوهای متعدد در مناقصه برای وارد شدن به تجارت با فیلمساز پرفروش و شرکت تولید پرکارش، وارد سونی می شود. قرارداد غنی جدید که بر توسعه و تولید فیلم‌های بلند متمرکز است، در همه موارد گسترش می‌یابد [ ] این پیمان همچنین لوی را با رئیس و مدیر عامل شرکت سونی پیکچرز موشن پیکچرز، تام روتمن و رئیس گروه موشن پیکچر، سنفورد پانیچ، دوباره متحد می‌کند. رابطه این سه نفر به بیش از دو دهه قبل بازمی‌گردد و برخی از موفقیت‌های اولیه لوی به عنوان کارگردان و تهیه‌کننده، از جمله فیلم‌های «شب در موزه»، «ارزان‌تر از دوجین» و «شب قرار ملاقات» را به خود اختصاص داده است. روتمن در بیانیه ای که این خبر را اعلام کرد، گفت: \"من تمام راه را با شاون به عقب برمی گردم. قبل از اینکه او به موفقیت های بسیار بزرگتری دست پیدا کند، انبوهی از موفقیت ها را با هم انجام دادیم، که هیچکدام کوچکترین شگفت زده ام نکرد.\" روتمن ادامه داد: «استعداد او به‌عنوان یک تهیه‌کننده، کارگردان و رئیس جالب‌ترین شرکت خلاق در اطراف، تنها با اشتیاق بی‌نظیر او قابل رقابت است. \"من احساس خوشبختی می کنم که دوباره متحد شدم و برای همه در سونی هیجان زده هستم که آنچه را که مدت ها می دانستم کشف کنند - Shawn Levy معامله واقعی است.\" لوی که 21 Laps سال آینده بیست و یکمین سالگردش را جشن می گیرد، به همان اندازه مشتاق بود. لوی در بیانیه ای گفت: \"تام، سنفورد و من سابقه طولانی با هم داریم و برخی از سازنده ترین و ارزشمندترین تجربیات حرفه ای من در طول سال هایی که با هم در فاکس کار می کردیم به دست آمد.\" تام آینده شغلی من", "image_url": "https://variety.com/wp-content/uploads/2026/11/Shawn-Levy.jpg?crop=0px%2C238px%2C8688px%2C4887px&#038;resize=1000%2C563", "category": "هوش مصنوعی مولد", "tags": ["سینما"], "datetime_fa": "۲ آذر • ۲۱:۳۰"}, {"source": "Variety", "title": "‘The Secret Lives of Mormon Wives: Orange County’ Renewed for Season 2 at Hulu", "link": "https://variety.com/2026/tv/news/secret-lives-of-mormon-wives-orange-county-renewed-season-2-1236954749/", "summary": "Hulu is continuing the Secret Lives universe. The Secret Lives of Mormon Wives: Orange County has been renewed for a 20-episode second season after a quite successful first season. The debut season, which dropped on Nov. 12, drove 35 million hours globally in its first 11 days on Hulu and Disney+; the premiere landed 12% [ ]", "date_str": "2026-11-23T18:00:00+00:00", "hash": "2d5b4ca6d3b19b01", "title_fa": "«زندگی مخفی همسران مورمون: اورنج کانتی» برای فصل دوم در Hulu تمدید شد", "summary_fa": "Hulu در حال ادامه جهان Secret Lives است. The Secret Lives of Mormon Wives: Orange County پس از یک فصل اول کاملاً موفق، برای فصل دوم 20 قسمتی تمدید شد. فصل اول، که در 12 نوامبر پخش شد، در 11 روز اول پخش در Hulu و Disney+، 35 میلیون ساعت در سراسر جهان رانندگی کرد. اولین نمایش با 12% رسید [ ] فصل اول، شامل هشت قسمت، زندگی مادران جوان پویا در اورنج کانتی را دنبال می کرد. اسپین آفی از سریال زندگی مخفی همسران مورمون که در یوتا ساخته شده است، بازیگران این فصل شامل اشلی پیس، آسپین اوارد، جن افلک، بابی آلتوف، اوری وودز، سالومه آندریا، مک کال داپرون، جردن مک کلاناهان و مدیسون بونتمپو بودند. خواهر داپرون، مایسی نیلی، یکی از بازیگران سریال زندگی مخفی همسران مورمون است و در فصل 1 اسپین‌آف یک فیلم کوتاه ساخته است. افلک نیز یکی از بازیگران هر دو سریال است. در حالی که برخی از زنان - به ویژه داپرون و مک کلاناهان - اعضای فعلی کلیسای مورمون هستند، همه افراد در این گروه در مورد مذهب یکسان نیستند. از نظر فنی، من در کلیسای مورمون غسل تعمید داده ام. من خود را با مورمون بودن نمی شناسم، اما میلیون ها بار به کلیسای مورمون رفته ام. اوارد قبل از پخش فصل اول به ورایتی گفت: تأثیر مورمون‌ها در زندگی من بسیار زیاد است، حتی با ازدواج در 19 سالگی و بچه‌دار شدن - این فرهنگ به من خیلی شکل داده است، چه بخواهم چه نخواهم. من فکر می کنم که [بازیگران] می توانند از یکدیگر سود زیادی ببرند. منظورم این است که همه افراد بسیار متفاوت هستند، و به خصوص دخترانی که مورمون های فعال هستند، چیزهای زیادی وجود دارد که می توانند از ما دخترانی که بسیار مترقی و لیبرال هستیم، یاد بگیرند، حتی اگر من یک همسر", "image_url": "https://variety.com/wp-content/uploads/2026/11/182591_0593_V1.jpg?w=1000&#038;h=563&#038;crop=1", "category": "هوش مصنوعی مولد", "tags": ["سینما"], "datetime_fa": "۲ آذر • ۲۱:۳۰"}, {"source": "Billboard", "title": "Every Year Where All Grammy Record of the Year Nominees Were No. 1 Hits", "link": "https://www.billboard.com/lists/grammy-nominees-record-of-the-year-number-one-hits-hot-100/", "summary": "Six of the eight record of the year nominees for the 2027 Grammys are or were top 10 hits on the Billboard Hot 100. Two had long runs at No. 1: Ella Langley ’s “Choosin’ Texas” and Taylor Swift ’s “The Fate of Ophelia.” A third, Bruno Mars ’ “I Just Might,” spent one week at No. 1. Olivia Dean ’s “Man I Need” just missed the top spot, peaking at No. 2. “Dracula” by Tame Impala with Jennie has climbed as high as No. 3. Olivia Rodrigo ’s “The Cure” reached No. 5. Another nominee, RAYE ’s “Where Is My Husband!,” just missed the top 10, peaking at No. 11. The final nominee, “Berghain” by Rosalía , Björk and Yves Tumor has yet to crack the Hot 100. (It reached No. 3 on the Hot 100 s Bubbling Under chart.) Related 1985: The Only Year in Oscar History Where All 5 Best Original Song Nominees Were No. 1 Hot 100 Hits It’s typical for the record of the year nominees to range from big hits to occasional non-hits. In recent years, Brandi Carlile , Jon Batiste and ABBA have been nominated multiple times for songs that didn’t make the Hot 100. But four times in Grammy history, all five nominees for record of the year were No. 1 Hot 100 hits. These four years were back when there were only five nominees in the category, making it easier to achieve than it would be today, with eight nominees in the category. The artists involved included such megastars as Carole King , Neil Diamond , Michael Jackson , Lionel Richie and Whitney Houston . Let’s take a look back at the only four years in Grammy history were every nominee for record of the year was a No. 1 hit on the Billboard Hot 100.", "date_str": "2026-11-23T18:10:09+00:00", "hash": "b37edb904090df25", "title_fa": "هر سال که در آن همه نامزدهای رکورد گرمی سال رتبه اول را کسب کردند", "summary_fa": "شش رکورد از هشت نامزد سال جایزه گرمی 2027، 10 مورد برتر در بیلبورد 100 هستند. سومی، «I Just Might» برونو مارس، یک هفته را در شماره 1 گذراند. «مردی که نیاز دارم» از اولیویا دین به همین دلیل رتبه اول را از دست داد و در رتبه 2 قرار گرفت. «دراکولا» ساخته تام ایمپالا با جنی تا رتبه 3 صعود کرد. اولیویا رودریگو به رتبه 5 رسید. یکی دیگر از نامزدها، «شوهر من کجاست!» از RAYE، به‌تازگی از 10 تای برتر غافل شد و در رتبه 11 قرار گرفت. نامزد نهایی، «Berghain» ساخته روزالیا، بیورک و ایو تومور هنوز نتوانسته است در رده 100 داغ قرار گیرد. 1985: تنها سالی در تاریخ اسکار که در آن همه 5 نامزد بهترین آهنگ اصلی، شماره 1 بودند. در سال‌های اخیر، برندی کارلیل، جان باتیست و ABBA چندین بار برای آهنگ‌هایی نامزد شده‌اند که در ۱۰۰ آهنگ داغ قرار نگرفته‌اند. اما چهار بار در تاریخ گرمی، هر پنج نامزد رکورد سال، شماره ۱ آهنگ ۱۰۰ آهنگ داغ بودند. این چهار سال به زمانی بازگشته بود که تنها پنج نامزد در این رده وجود داشت، که دستیابی به آن را آسان‌تر از امروز می‌کرد، با هشت نامزد در این رده. هنرمندانی که در آن شرکت داشتند شامل ستاره هایی چون کارول کینگ، نیل دایموند، مایکل جکسون، لیونل ریچی و ویتنی هیوستون بودند. بیایید نگاهی به گذشته بیندازیم به تنها چهار سالی که در تاریخ گرمی هر نامزدی برای رکورد سال موفق به کسب رتبه اول در بیلبورد 100 شد.", "image_url": "https://www.billboard.com/wp-content/uploads/2026/01/1389405527-e1769886280970.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["موسیقی"], "datetime_fa": "۲ آذر • ۲۱:۴۰"}, {"source": "Deadline", "title": "Donald Trump Puts Himself At Center Of Jensen Huang’s Reinstatement, Downplays “Sex Sells” Scandal Amid National Security Concerns", "link": "https://deadline.com/2026/11/trump-jensen-huang-nvidia-scandal-1237231676/", "summary": "After a whirlwind of a morning of news coverage on the bombshell reinstatement of Jensen Huang as Nvidia CEO, Donald Trump posted a photo to his Truth Social account, replacing his image following the 20 ost Weekend Planetarium Experience بررسی کنید. مهمانی‌های یک ساعته و بدون دوربین، پخش آخر هفته گمشده را با یکی از دو همراهی بصری اصلی همراه می‌کند: یک نمایش گنبدی سفارشی، طراحی شده توسط عکاس آسمان شب، بابک تفرشی، یا یک نمایش لیزری همهجانبه طراحی شده توسط Laser Fantasy.", "image_url": "https://media.pitchfork.com/photos/6b0480a03d08ab0a4b79fc4a/16:9/w_1280,c_limit/phoebe-bridgers-planetariums.jpg", "category": "هوش مصنوعی مولد", "tags": ["رسانه", "هنر"], "datetime_fa": "۲ آذر • ۲۱:۳۷"}, {"source": "Hollywood Reporter", "title": "Steven Spielberg to Direct Paul Thomas Anderson-Penned ‘Heart in Winter,’ Set to Star Jessie Buckley, Cillian Murphy, Mark Rylance", "link": "https://www.hollywoodreporter.com/movies/movie-news/steven-spielberg-the-heart-in-winter-paul-thomas-anderson-1236761238/", "summary": "Focus Features is developing the feature that is based on author Kevin Barry's 2024 Western novel.", "date_str": "2026-11-23T18:05:47+00:00", "hash": "95e7492a36ddb4f4", "title_fa": "استیون اسپیلبرگ برای کارگردانی پل توماس اندرسون-پن، «قلب در زمستان»، بازیگرانی همچون جسی باکلی، کیلین مورفی، مارک رایلنس", "summary_fa": "Focus Features در حال توسعه این ویژگی است که بر اساس رمان وسترن 2024 نویسنده کوین بری ساخته شده است. استیون اسپیلبرگ و پل توماس اندرسون در حال همکاری برای یک وسترن هستند. اسپیلبرگ در حال ساخت یک اقتباس بلند بدون عنوان از رمان «قلب در زمستان» نوشته کوین بری در سال 2024 برای ویژگی های فوکوس است. اندرسون در حال نوشتن فیلمنامه پروژه ای است که به همراه اسپیلبرگ، کریستی ماکوسکو کریگر و سارا مورفی تولید خواهد کرد و اسپیلبرگ نیز کارگردانی آن را بر عهده خواهد داشت. جسی باکلی، کیلیان مورفی و مارک رایلنس سه نفر از برندگان اسکار هستند که قرار است در این فیلم که در انتظار اکران در سینماهای سال 2028 است بازی کنند. در اوایل امسال، اسپیلبرگ مراسم روز افشای جهانی را برگزار کرد. او همچنین فوکوس همنت را تهیه کرد که اواخر سال گذشته به سینماها رفت و برای باکلی جایزه اسکار گرفت. باکلی توسط CAA، United Agents و Johnson Shapiro نمایندگی می شود. مورفی توسط WME و Sloane Offer تکرا a Langley’s ‘Choosin’ Texas’ Leads Hot 100 for 29th Week, Holiday Hits Return to Top 10", "link": "https://www.billboard.com/lists/ella-langley-choosin-texas-hot-100-number-one-29th-week/", "summary": "Ella Langley ’s “Choosin’ Texas” tops the Billboard Hot 100 for a record-extending 29th week. The smash received a new boost during the tracking week thanks to the 60th Annual Country Music Association Awards (Nov. 18), as Langley won six trophies — the most in a single night, among other records that she set. She won the CMA’s top prize — entertainer of the year — as well as female vocalist; “Choosin’ Texas” took single, song and music video honors; and parent album Dandelion won for album of the year. Two days earlier, Langley received seven Grammy nominations , with “Choosin’ Texas” up for both record and song of the year. Related How Ella Langley Navigated The Whirlwind Success Of Choosin Texas — And Why She Thinks Women Are About To Take Over As “Choosin’ Texas” adds to its Hot 100 command, here’s an updated look at the longest-leading hits, ranked by most weeks spent at No. 1, since the chart began in August 1958: 29 weeks (to date), “Choosin’ Texas,” Ella Langley, 2026 22, “All I Want for Christmas Is You,” Mariah Carey, 2019-26 19, “A Bar Song (Tipsy),” Shaboozey, 2024 19, “Old Town Road,” Lil Nas X feat. Billy Ray Cyrus, 2019 16, “Last Night,” Morgan Wallen, 2023 16, “Despacito,” Luis Fonsi Daddy Yankee feat. Justin Bieber, 2017 16, “One Sweet Day,” Mariah Carey Boyz II Men, 1995-96 “Choosin’ Texas” first led the Hot 100 in February, on its way to setting multiple chart records . Meanwhile, Langley’s 29 weeks atop the Hot 100 in 2026 tie her with Drake for the most by an artist in a single year. Drake ran up his total via three No. 1s in 2018. Concurrently, “Choosin’ Texas” claims a 50th week at No. 1 on the multimetric Hot Country Songs chart — tying for the most in the list’s history. Also in the Hot 100’s top 10, Carey’s “All I Want for Christmas Is You” l ه حقوق رسانه، ادیسون دافی، و دیگران. اورن روزنبام، برمن و راینا پنچانسکی، سرپرستان و شرکای UTA Creators، می‌گویند: «هنگامی که سازندگان بنیان‌گذار، تولیدکننده و مالک شرکت‌های رسانه‌ای می‌شوند، نحوه ایجاد سرگرمی، نحوه اتصال مخاطبان و نحوه ایجاد کسب‌وکار را تغییر می‌دهند. «نمایندگی آنها به این معناست که به همان اندازه در مورد آنچه ممکن است فکر کنید. ما دو دهه را صرف کمک به شکل‌دهی این کسب‌وکار کرده‌ایم، و سرمایه‌گذاری در نسل بعدی نمایندگان، مدیران و رهبران سرگرمی بخش مهمی از آینده است. ایده‌ها و دیدگاه‌های آن‌ها به پیشبرد صنعت و ایجاد فرصت‌های جدید برای مشتریان ما و جامعه سازنده‌تر کمک می‌کند.»", "image_url": "https://www.hollywoodreporter.com/wp-content/uploads/2026/11/Blank-2000-x-1127-2.jpg?w=1440&#038;h=810&#038;crop=1", "category": "هوش مصنوعی مولد", "tags": ["عامل‌های هوشمند", "سرمایه‌گذاری"], "datetime_fa": "۲ آذر • ۲۱:۳۰"}, {"source": "Variety", "title": "American Film Institute Establishes First Full-Ride Scholarship for Production Design", "link": "https://variety.com/2026/artisans/news/american-film-institute-full-scholarship-production-design-1236955132/", "summary": "The American Film Institute established its first full-ride scholarship dedicated to production design. The AFI World Builder Scholarship for Production Design will be awarded to an admitted fall 2027 Production Design Fellow and cover tuition across the four-semester, full-time program. “The AFI Conservatory has championed visual storytellers and worldbuilders for nearly 60 years, empowering thousands [ ]", "date_str": "2026-11-23T18:00:00+00:00", "hash": "d53a72089712c443", "title_fa": "موسسه فیلم آمریکا اولین بورسیه تحصیلی کامل را برای طراحی تولید ایجاد می کند", "summary_fa": "موسسه فیلم آمریکا اولین بورسیه تحصیلی کامل خود را به طراحی تولید اختصاص داد. بورسیه AFI World Builder برای طراحی تولید به یک همکار طراحی تولید پاییز 2027 پذیرفته شده اعطا می شود و شهریه را در برنامه چهار ترم تمام وقت پوشش می دهد. سوزان راسکین، رئیس کنسرواتوار AFI گفت: «کنسرواتوار AFI نزدیک به 60 سال از داستان‌نویسان ب به سمت خود کند خوشحال است", "summary_fa": "قانونگذاران دموکرات این مداخله را به عنوان نمونه دیگری از فساد گسترده دولت محکوم کردند. هیئت مدیره انویدیا علیرغم تحقیقات در حال انجام در مورد چندین پرونده ادعایی - از جمله یکی با یک جاسوس چینی متهم و دو مورد با چینی که ادعا می کند چین زیردستانش را دور زده است - به بازگرداندن جنسن هوانگ به عنوان مدیر عامل شرکت توسعه سوپرتراشه رای داده است. دونالد ترامپ مدت کوتاهی پس از اعلام این تصمیم، اعتبار آن را پذیرفت. رئیس جمهور به CNBC گفت که شخصاً در جلسه هیئت مدیره انویدیا شرکت کرده و آن را متقاعد کرده است که به هوانگ، یکی از نزدیک ترین متحدان رئیس جمهور در فناوری، شغل خود را بازگرداند. ترامپ افزود که فکر نمی‌کند هوانگ در غیر این صورت به کار خود بازگردانده می‌شد. او گفت: \"من معتقدم مداخله من بسیار مهم بود.\" این تصمیم شوکه کننده پس از آن گرفته شد که هیئت مدیره انویدیا قبلاً کمپین های فشار عمومی برای بازگرداندن او را رد کرده بود. به نظر می‌رسید ترامپ در مصاحبه دیگری در اوایل صبح دوشنبه می‌دانست که این تصمیم گرفته می‌شود و قبل از اعلام این خبر به PBS گفت که هوانگ «به جایی که باید باشد بازگشته است». اندکی پس از گفتگوی ترامپ با PBS، هیئت مدیره انویدیا در بیانیه‌ای نوشت که «پس از یک سری گفتگوها و ملاقات‌ها با آقای. Huang، \"با توجه به صراحت و توانایی آقای هوانگ برای رهبری NVIDIA راضی بود.\" هوانگ در 12 نوامبر از سمت خود به عنوان مدیر عامل و عضو هیئت مدیره استعفا داد و با اذعان به روابط متعدد، از جمله با آلیس هوانگ، مدیر بازرگانی چینی (بدون رابطه)، که از سوی دولت ایالات متحده به عنوان دارایی عملیات اطلاعات خارجی چین ادعا شده است، استعفا داد.", "image_url": "https://www.rollingstone.com/wp-content/uploads/2026/11/Jensen_Huang_return.jpg?crop=0px%2C20px%2C1998px%2C1126px&#038;resize=1600%2C900", "category": "هوش مصنوعی مولد", "tags": ["Nvidia"], "datetime_fa": "۲ آذر • ۲۱:۱۳"}, {"source": "Variety", "title": "‘Gondhal’ Director Santosh Davakhar Talks Creating India’s 2027 Oscar Entry, the Films That Inspired Him and More", "link": "https://variety.com/2026/film/news/gondhal-director-santosh-davakhar-india-oscar-entry-1236955103/", "summary": "India s official selection for the 2027 Academy Awards is Gondhal, the debut feature film from director Santosh Davakhar. Following a screening of the film, Davakhar sat down with Variety s Jazz Tangcay to discuss creating his debut, the Oscar movies that inspired him and the Indian heritage he wants to share through the film. The film [ ]", "date_str": "2026-11-23T17:42:08+00:00", "hash": "4835b7e0d482a3c3", "title_fa": "سانتوش دواخار، کارگردان «گوندال» درباره ایجاد نامزدی اسکار 2027 هند، فیلم‌هایی که از او الهام گرفتند و بیشتر صحبت می‌کند.", "summary_fa": "منتخب رسمی هند برای جوایز اسکار 2027، فیلم Gondhal است، اولین فیلم بلند ساخته سانتوش دواخار. پس از نمایش فیلم، دواخار با Jazz Tangcay از Variety به گفتگو نشست و درباره ساخت اولین فیلم خود، فیلم‌های اسکار که الهام‌بخش او بودند و میراث هندی که می‌خواهد از طریق فیلم به اشتراک بگذارد، صحبت کرد. این فیلم [ ] نظرات انتخاب رسمی هند برای جوایز اسکار 2027 گوندال است، اولین فیلم بلند کارگردان سانتوش داواخار. پس از نمایش فیلم، دواخار با Jazz Tangcay از Variety به گفتگو نشست و درباره ساخت اولین فیلم خود، فیلم‌های اسکار که الهام‌بخش او بودند و میراث هندی که می‌خواهد از طریق فیلم به اشتراک بگذارد، صحبت کرد. دواخار گفت که این فیلم در سال 1960 اتفاق می‌افتد، دوران پسااستعماری که در آن بی سوادی رواج داشت و زنان حق نمایندگی نداشتند. او به طور هدفمند آن صحنه را انتخاب کرد و شخصیت سومان را بر اساس وضعیت او طراحی کرد. داستان‌های مرتبط در تعقیب تابستان کارگردان جوزفین دکر می‌گوید که «فیلم‌سازی تنهاتر از همیشه است»، پس وقت آن است که جامعه بسازیم «شما احساس خواهید کرد که او باهوش است، او دستکاری‌کننده است، او خودخواه است، اما او فقط یک دختر 17 ساله است، دواخر گفت. بنابراین او آشکارا با پدرسالاری به چالش نمی‌کشد، اما به آرامی انتخاب‌هایش را انجام می‌دهد.» نام فیلم \"گوندال\" است که به دلیل مراسم مذهبی سنتی شبانه که برای یک زوج تازه ازدواج کرده انجام می شود، نامگذاری شده است و داستان فیلم در طول این مراسم آشکار می شود. ابزار اصلی مورد استفاده در این مراسم در آستانه ناپدید شدن است زیرا وسایل الکتریکی جای آن را می گیرند.", "image_url": "https://variety.com/wp-content/uploads/2026/11/Thumbnail-02.jpg?w=1000&#038;h=563&#038;crop=1", "category": "هوش مصنوعی مولد", "tags": ["سینما"], "datetime_fa": "۲ آذر • ۲۱:۱۲"}, {"source": "Billboard", "title": "Watch Charli D’Amelio Nail KATSEYE’s ‘Gabriela’ Dance With Group During Concert: ‘I’m an EYEKON’", "link": "https://www.billboard.com/music/music-news/katseye-daniela-charli-damelio-gabriela-dance-show-video-1236387775/", "summary": "If KATSEYE ever needs another member, they know where to find Charli D Amelio. The TikToker proved her EYEKON status on Sunday (Nov. 22) by making a cameo at the girl group s concert in Los Angeles, nailing the Gabriela dance alongside Daniela. Related KATSEYE s Megan Is Back Performing on Her Feet a Day After Doing Show Sitting Due to Concussion KATSEYE s Megan Performs While Sitting Due to Concussion, Sparking Fan Concern: Are They Serious? A Full List of Current 2026/27 K-Pop Concerts (Updating) Introducing the nightly bit in which Daniela performs the Billboard Hot 100 No. 21 track s choreography with one audience member — oftentimes bringing up little kids — the pop performer told the crowd at Crypto.com Arena, We have a very special Gabriela tonight. The arena erupted in applause once D Amelio came out on stage. Charli has been a KATSEYE supporter literally since day one, Daniela said . I suppose you know the Gabriela dance, right? I m an EYEKON, of course! Charli replied. The TikToker — who rose to fame in the early days of the platform s popularity by posting dance videos — easily kept up with Daniela as the Gabriela chorus played. Yay! Oh my god! Daniela cheered afterward, wrapping Charli in a big hug. Sunday s show marked the second of two Wildworld Tour performances in L.A. The night prior also featured a star Gabriela guest, with Camila Cabello coming out to dance alongside Daniela. The pair of Crypto.com Arena performances was also notable as Megan appeared to be fully recovered from her recent concussion, which forced KATSEYE to cance l three shows in early November. When the group — which is already down two members, with Manon and Sophia both on hiatus — returned to the stage on Nov. 10 in Austin, Texas, Megan sported dark sunglasses and remained seated on a raised chair throughout the show. After that, Megan continued wearing the glasses while easing back into dances. As of the shows in L.A., she s back on her feet and no longer depending on the shades. KATSEYE currently has three more concerts scheduled for 2026, wrapping the North American leg of tour on Nov. 28 in Mexico City. The ladies will go back out on the road in Asia, Australia and New Zealand early next year. Watch Daniela and D Amelio dance to Gabriela below. View this post on Instagram", "date_str": "2026-11-23T17:34:07+00:00", "hash": "6559ba9c2f5d5d17", "title_fa": "رقص چارلی دی آملیو نایل کاتسی با گروه \"گابریلا\" را در طول کنسرت تماشا کنید: \"I'm an EYEKON\"", "summary_fa": "اگر KATSEYE به عضو دیگری نیاز داشته باشد، آنها می دانند که Charli D Amelio را کجا پیدا کنند. TikToker وضعیت EYEKON خود را در روز یکشنبه (22 نوامبر) با ساختن یک عکس کوتاه در کنسرت گروه دختر در لس آنجلس ثابت کرد و رقص گابریلا را در کنار دانیلا میخکوب کرد. مرتبط: مگان کاتسی یک روز پس از اجرای نمایش نشسته به دلیل ضربه مغزی دوباره روی پاهای خود اجرا می کند. فهرست کامل کنسرت‌های کنونی کی‌پاپ 2026/27 (در حال به‌روزرسانی) با معرفی قطعه‌های شبانه که در آن دانیلا رقص آهنگ 100 شماره 21 داغ بیلبورد را با یکی از مخاطبان اجرا می‌کند - که اغلب بچه‌های کوچک را بزرگ می‌کند - این نوازنده پاپ به جمعیت در Crypto.com Havenight Arena، Gabriela بسیار ویژه گفت. زمانی که دی آملیو روی صحنه آمد، عرصه با تشویق و تشویق به پا شد. دانیلا گفت که چارلی به معنای واقعی کلمه از روز اول حامی KATSEYE بوده است. فکر کنم رقص گابریلا رو بلدی، درسته؟ من یک EYEKON هستم، البته! چارلی پاسخ داد. TikToker - که در روزهای اولیه محبوبیت این پلتفرم با ارسال ویدیوهای رقص به شهرت رسید - به راحتی با دانیلا در حین نواختن گروه کر گابریلا همگام شد. آری اوه خدای من! دانیلا پس از آن تشویق کرد و چارلی را در آغوش بزرگی گرفت. نمایش یکشنبه دومین اجرا از دو اجرای تور دنیای وحشی در لس آنجلس بود. شب قبل نیز یک مهمان ستاره گابریلا حضور داشت که کامیلا کابلو برای رقص در کنار دانیلا بیرون آمد. جفت اجرای Crypto.com Arena نیز قابل توجه بود زیرا به نظر می رسید مگان از ضربه مغزی اخیر خود کاملاً بهبود یافته است، که باعث شد KATSEYE سه برنامه را در اوایل نوامبر لغو کند. هنگامی که گروه - که در حال حاضر دو عضوش را از دست داده اند،", "image_url": "https://www.billboard.com/wp-content/uploads/2026/11/charlie-damelio-november-2026-billboard-1800.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["موسیقی"], "datetime_fa": "۲ آذر • ۲۱:۰۴"}, {"source": "Deadline", "title": "Made By All Hires Ex-Spotter & Rolling Stone Exec Christina Tom", "link": "https://deadline.com/2026/11/made-by-all-hires-christina-tom-creator-economy-1237231690/", "summary": "EXCLUSIVE: Leanne Perice s indie creator management biz, Made By All, has a new senior exec in the ranks. Former Rolling Stone and Spotter Media exec Christina Tom has been appointed Executive Vice President and Head of Growth. She s got more than two decades of experience building revenues and developing partnerships in the media, entertainment and [ ]", "date_str": "2026-11-23T17:37:54+00:00", "hash": "fa1a5cbf42cde5f0", "title_fa": "ساخته شده توسط All Hires، مدیر سابق Spotter & Rolling Stone، کریستینا تام", "summary_fa": "انحصاری: حرفه مدیریت خالق مستقل Leanne Perice، Made By All، یک مدیر ارشد جدید در رتبه‌بندی دارد. کریستینا تام، مدیر اجرایی سابق Rolling Stone و Spotter Media به عنوان معاون اجرایی و رئیس بخش رشد منصوب شد. او بیش از دو دهه تجربه ایجاد درآمد و توسعه مشارکت در رسانه‌ها، سرگرمی‌ها و [ ] نقش تازه ایجاد شده‌اش باعث می‌شود تام یک استراتژی رشد در سطح شرکت ایجاد کند، به گسترش فهرست استعدادها و سازمان مدیریت کمک کند، و روابط با برندها و آژانس‌ها را تعمیق بخشد. او بر فرصت‌های تجاری برای Made By All و مشتریانش در مشارکت‌های دیجیتال، اجتماعی، سرگرمی و برند تمرکز خواهد کرد. اخبار مرتبط اخبار Endemol Shine Brasil Grupo Podpah Set مشارکت دیجیتالی به رهبری Temptation Island Casting Moby, Hannah Stocking Adam Rose Set for Microdrama Slate from TikTok Made By Us Studios Made By All نماینده سازندگان و استعدادهای سرگرمی از جمله Teyana Taylor، Adam Waheed, Madenah Péheed, Madelash, رودریگز، یک بسته مدیریت استعداد و توسعه استراتژیک کسب و کار را ارائه می دهد. پریس، مدیرعامل Made By All که شرکت را در سال 2017 تأسیس کرد، گفت: «کریستینا حرفه خود را صرف تبدیل روابط و ایده‌های خلاقانه به کسب‌وکار معنادار کرده است. او می‌داند که برندها به چه چیزهایی نیاز دارند و چگونه سازندگان می‌توانند آن را بدون از دست دادن آنچه که آنها را متمایز می‌کند ارائه دهند. با گسترش فهرست استعدادهایمان، تقویت تیم مدیریتی و ایجاد فرصت های جدید برای مشتریان، تجربه او بسیار ارزشمند خواهد بود.\" اخیراً، تام به عنوان مدیر ارشد، مشارکت در شرکت فناوری و صدور مجوز با تمرکز بر خالق، Spotter خدمت کرد، جایی که او مشارکت محتوای سازندگان را توسعه داد و تجارت با مشتریان سرگرمی از جمله A24، Amazon MGM Studios و Focus Features را تضمین کرد.", "image_url": "https://deadline.com/wp-content/uploads/2026/11/Christina-Tom-e1795455301179.jpeg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["رسانه", "هنر"], "datetime_fa": "۲ آذر • ۲۱:۰۷"}, {"source": "Rolling Stone", "title": "Previously Unseen Footage of Led Zeppelin at Madison Square Garden Surfaces After 49 Years", "link": "https://www.rollingstone.com/music/music-news/led-zeppelin-madison-square-garden-49-years-1235662709/", "summary": "A 17-year-old fan snuck a Super 8 camera into the New York arena in 1977 by stuffing it into his jacket, and Zeppelin fans worldwide owe him a debt of gratitude", "date_str": "2026-11-23T17:38:39+00:00", "hash": "c0a222c2c8227f2a", "title_fa": "فیلمی که قبلا دیده نشده بود از لد زپلین در مدیسون اسکوئر گاردن فیس پس از 49 سال", "summary_fa": "یک طرفدار 17 ساله در سال 1977 یک دوربین Super 8 را با فرو کردن آن در ژاکت خود به عرصه نیویورک دزدید، و طرفداران زپلین در سراسر جهان به او قدردانی می کنند. گاراژ برای چندین دهه این ویدئوی شش و نیم دقیقه‌ای شامل بخش‌هایی از آه د صنعتگران Variety، پانل Power Players: Leaders in Production را مدیریت خواهد کرد. سخنرانان عبارتند از کوری ادلسون، رئیس فیلم جاده شمالی. سیمون هریس، معاون تلویزیون، رسانه نزدیکی؛ جیمز لوپز، رئیس استودیو فیلم ماکرو؛ سوزان پریت، رئیس گیم شو، تلویزیون سونی پیکچرز. و کیمبرلی راچ، معاون اجرایی عملیات تولید، تلویزیون جهانی. جری نیومن، رئیس هیئت مدیره اتاق بازرگانی هالیوود به استعدادهای اعلام شده ملحق خواهد شد. ران فریرسون، رئیس هیئت مدیره، اتاق بازرگانی هالیوود؛ و دی لارنس، رئیس و ناشر ورایتی.", "image_url": "https://variety.com/wp-content/uploads/2026/11/HCOC-ea.jpg?w=1000&#038;h=563&#038;crop=1", "category": "هوش مصنوعی مولد", "tags": ["امنیت سایبری", "سینما"], "datetime_fa": "۲ آذر • ۲۱:۰۰"}, {"source": "Variety", "title": "Trump Posts Bizarre AI Meme of Jensen Huang, Holding Up a Bra and Riffing Off 2024 Assassination Attempt on President, After Nvidia Board Reinstates CEO", "link": "https://variety.com/2026/digital/news/trump-ai-meme-jensen-huang-bra-nvidia-reinstates-ceo-1236956004/", "summary": "After a head-spinning reversal by Nvidia s board to reinstate Jensen Huang as CEO, following revelations of the executive s multiple affairs including one with a reported Chinese spy, President Donald Trump is exulting in the decision and Trump posted a truly weird image to celebrate the turn of events. On Monday, Trump shared an AI-generated [ ]", "date_str": "2026-11-23T16:55:57+00:00", "hash": "15a79e18955801fe", "title_fa": "ترامپ پس از بازگرداندن مدیرعامل انویدیا، میم عجیب و غریب هوش مصنوعی جنسن هوانگ، در دست گرفتن سوتین و تلاش برای ترور رئیس جمهور در سال 2024 را منتشر کرد.", "summary_fa": "پس از تغییر سرسختانه هیئت مدیره انویدیا برای بازگرداندن جنسن هوانگ به عنوان مدیرعامل، پس از افشای روابط چندگانه این مدیر اجرایی از جمله یکی از جاسوسان چینی گزارش شده، رئیس جمهور دونالد ترامپ از این تصمیم خوشحال شد و ترامپ تصویری واقعاً عجیب را برای جشن گرفتن چرخش رویدادها منتشر کرد. روز دوشنبه، ترامپ یک تصویر تولید شده توسط هوش مصنوعی [ ] را در تصویر میم به اشتراک گذاشت، هوانگ پیروزمندانه یک سوتین قرمز رنگ با پرچم Nvidia در پس زمینه قرار داده است، در حالی که مدیر اجرایی توسط ماموران سرویس مخفی احاطه شده است. در تصویری که ترامپ به اشتراک گذاشت، هوانگ روی صورتش خون پاشیده است (همانطور که ترامپ پس از تیراندازی باتلر نیز ظاهراً چنین کرده است). به نظر می‌رسد تصویری که رئیس‌جمهور به اشتراک گذاشته است نشان می‌دهد که ترامپ معتقد است هوانگ به دلیل بی‌احتیاطی‌های جنسی خود در تلاش برای ترور مجازی شغل یکی از بنیانگذاران انویدیا مورد هدف قرار گرفته است، اما هوانگ مانند ترامپ خونین اما پیروز ظاهر شده است. به NVIDIA تبریک می‌گویم که تصمیمی کاملاً عالی گرفته است، آنچه من فکر می‌کنم. ترامپ پیشتر روز دوشنبه و قبل از اینکه رئیس جمهور تصویر هوانگ تولید شده توسط هوش مصنوعی را منتشر کند، نوشت. ترامپ خواستار بازگرداندن هوانگ در انویدیا شده بود، از جمله در یک پست Truth Social یکشنبه شب. اوایل دوشنبه، ترامپ در پلتفرم رسانه اجتماعی خود نوشت که هوانگ به عنوان مدیرعامل انویدیا \"موفقیت و شکوفایی نه تنها شرکت، بلکه اقتصاد آمریکا\" را تضمین می کند و تاد بلانچ، دادستان کل ایالات متحده تایید کرده است که دولت شواهدی مبنی بر ارتکاب جنایت هوآنگ در اختیار ندارد. هیئت مدیره انویدیا در بیانیه خود قبل از باز شدن بازار در 23 نوامبر، اعلام کرد که «به اتفاق آرا به بازگرداندن آقای هوانگ پس از یک سری گفتگوها", "image_url": "https://variety.com/wp-content/uploads/2026/11/Trump-Jensen-Huang-Nvidia-Bra-Butler-PA.png?w=609&#038;h=407&#038;crop=1", "category": "هوش مصنوعی مولد", "tags": ["هوش مصنوعی", "Nvidia", "عامل‌های هوشمند"], "datetime_fa": "۲ آذر • ۲۰:۲۵"}, {"source": "Billboard", "title": "Travis Scott, Slayyyter, Offset, Anitta & More Power ‘Grand Theft Auto VI: The Album’ Deluxe Edition: Stream It Now", "link": "https://www.billboard.com/music/music-news/gta-6-album-deluxe-offset-travis-scott-slayyyter-anitta-1236387752/", "summary": "Three days after releasing the 34-track Grand Theft Auto VI: The Album , there is now a deluxe edition. Released via Atlantic Records on Monday (Nov. 23), the deluxe arrives with 23 new original songs featuring Travis Scott, Slayyyter and more. Related Every Track From Grand Theft Auto VI: The Album Ranked ‘It’s Not Just a Song on the Radio’: How Music Became A Main Character In ‘Grand Theft Auto VI’ Rauw Alejandro Crashes Back Into Hot Latin Songs Top 10 With ‘GTA VI’ Track ‘Macacoa 2000’ Disc 2 also boasts a versatile lineup filled out by Offset, 21 Savage, Pooh Shiesty, The Dare, Anitta, Young Nudy, Quavo, Sofaygo, Sexyy Red with GTA duo Real Dimez, Latto, Kodak Black, Denzel Curry, Health, Overmono, Chris Stassy and Neil Frances. Fans who played the video game throughout the weekend might be familiar with some of the songs, as a portion can be heard on GTA s in-game radio stations. Others like Travis Scott s opener Burn This Shit Down soundtrack the explosive final mission of the video game s cinematic chapter one. Grand Theft Auto VI: The Album has become a blockbuster affair, with the original boasting a star-studded crew that included Dua Lipa, Playboi Carti, Cardi B, JENNIE, Tove Lo, Lana Del Rey, Young Thug and Kali Uchis. Between the original and now the deluxe, 57 songs make up the complete project, which will looks to become the first video game soundtrack to top the Billboard 200. Grand Theft Auto VI boasts more than a staggering 800 songs across 23 radio stations as part of the video game s expansive experience. There are even artist-hosted radio stations, which find Bad Bunny, Lana Del Rey, Morgan Wallen, Trina and Trick Daddy, PinkPantheress, Burna Boy and Robyn patrolling Leonida s airwaves. Music is part of the DNA of these games, said Rockstar vice president of music Ivan Pavlovich in Billboard s Grand Theft Auto VI digital cover story published on Monday. We’re probably licensing three times the amount of songs we end up using. If we’re getting 800-plus songs in the game, you can imagine the amount of time, love and effort that all these people put into clearing music. Stream the Grand Theft Auto VI: The Album (Deluxe Edition) below.", "date_str": "2026-11-23T17:10:43+00:00", "hash": "ab56edcbaffd63d0", "title_fa": "Travis Scott, Slayyyter, Offset, Anitta & More Power ‘Grand Theft Auto VI: The Album’ Edition Deluxe: اکنون آن را پخش کنید", "summary_fa": "سه روز پس از انتشار 34 آهنگ Grand Theft Auto VI: The Album، اکنون یک نسخه لوکس وجود دارد. این لوکس که از طریق آتلانتیک رکوردز در روز دوشنبه (23 نوامبر) منتشر شد، با 23 آهنگ اصلی جدید با تراویس اسکات، اسلایتر و غیره وارد بازار شد. مرتبط با هر تراک از Grand Theft Auto VI: آلبوم رتبه‌بندی شده «این فقط یک آهنگ در رادیو نیست»: چگونه موسیقی به شخصیت اصلی «Grand Theft Auto VI» تبدیل شد راو آلخاندرو دوباره به آهنگ‌های داغ لاتین بازمی‌گردد 10 آهنگ برتر با «GTA VI» قطعه «Macacoa 2000 پر شده توسط دیسک‌های 2000» افست، 21 Savage، Pooh Shiesty، The Dare، Anitta، Young Nudy، Quavo، Sofaygo، Sexyy Red با دو بازی GTA Real Dimez، Latto، Kodak Black، Denzel Curry، Health، Overmono، Chris Stassy و Neil Frances. طرفدارانی که این بازی ویدیویی را در آخر هفته بازی کردند ممکن است با برخی از آهنگ ها آشنا باشند، زیرا بخشی از آن را می توان در ایستگاه های رادیویی درون بازی GTA شنید. دیگران مانند فیلم بازکننده تراویس اسکات، Burn This Shit Down، موسیقی متن فیلم ماموریت انفجاری نهایی فصل اول بازی ویدیویی را می‌سازند. Grand Theft Auto VI: این آلبوم به یک ماجرای پرفروش تبدیل شده است، و آلبوم اصلی دارای یک گروه پر ستاره شامل Dua Lipa، Playboi Carti، Cardi B، JENNIE، Tove Lo، Lana Del Rey، Young Thug و Kali Uchis است. بین نسخه اصلی و اکنون لوکس، 57 آهنگ پروژه کامل را تشکیل می دهند که به نظر می رسد اولین موسیقی متن بازی ویدیویی باشد که در صدر بیلبورد 200 قرار می گیرد. Grand Theft Auto VI دارای بیش از 800 آهنگ خیره کننده در 23 ایستگاه رادیویی به عنوان بخشی از تجربه گسترده این بازی ویدیویی است. حتی ایستگاه‌های رادیویی با میزبانی هنرمند وجود دارند که Bad Bunny، Lana Del Rey،", "image_url": "https://www.billboard.com/wp-content/uploads/2026/11/gta-6-album-deluxe-press-billboard-1800.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["سینما", "موسیقی"], "datetime_fa": "۲ آذر • ۲۰:۴۰"}, {"source": "Deadline", "title": "Supriya Ganesh, Benito Skinner, Amy Landecker & Bradley Whitford Round Out Cast Of Mary Beth Barone Rom-Com ‘Still We Met’", "link": "https://deadline.com/2026/11/still-we-met-cast-adds-supriya-ganesh-benito-skinner-more-1237231669/", "summary": "EXCLUSIVE: Still We Met, the indie rom-com written by and starring comedian Mary Beth Barone, has wrapped production in New York with four major additions to the cast: The Pitt s Supriya Ganesh, plus Overcompensating s Benito Skinner, and the husband wife duo of Amy Landecker (Misty Green) and Bradley Whitford (The Diplomat). Character details are [ ]", "date_str": "2026-11-23T17:19:26+00:00", "hash": "4f67a08740b2e4a0", "title_fa": "سوپریا گانش، بنیتو اسکینر، امی لندکر و بردلی ویتفورد بازیگران مری بث بارون رام کام «هنوز ما ملاقات کردیم» را بازی کردند.", "summary_fa": "انحصاری: Still We Met، رام-کام مستقل نوشته و با بازی کمدین مری بث بارون، تولید خود را در نیویورک با چهار بازیگر اصلی به پایان رساند: سوپریا گانش از پیت، به علاوه بنیتو اسکینر بازیگر بیش از حد جبران، و زوج امی لندکر (میستی دبلیومت) و همسرش (برادلی گرین مات) جزئیات کاراکتر انحصاری است: Still We Met، رام-کام مستقل نوشته و با بازی کمدین مری بث بارون، تولیدات خود را در نیویورک با چهار بازیگر اصلی به پایان رساند: سوپریا گانش از پیت، به‌علاوه بنیتو اسکینر بیش از حد جبران‌کننده، و همسر آمی لندکری دویلو (امی لندکری دوکو) (دیپلمات). جزئیات کاراکتر در زیر پوشش قرار دارد. این فیلم درباره زن جوانی در یک چهارراه است که با یک غریبه جذاب بریتانیایی آشنا می شود و یک شب فراموش نشدنی را در نیویورک می گذراند و بیش از آنچه در نظر گرفته شده را فاش می کند. Still We Met اولین فیلمنامه نویسی و بازیگری بارون است. این فیلم توسط زاکری دراک کارگردانی می‌شود که اولین فیلم داستانی خود است. تماشای Deadline Related Stories بازیگران Emily Ratajkowski به Mary Beth Barone Joe Alwyn در Rom-Com پیوست. ، کورتون مور ( جبران بیش از حد ) و جانی سیبیلی ( هک ) . جک هلر و کیتلین دی لیسر-الن برای Assemble Media (مردی که دوستش دارم، اسکلت‌ها)، در کنار الکس باخ و دانیل پاول از Irony Point (من فکر می‌کنم باید با تیم رابینسون ترک کنی) تهیه‌کنندگی کردند. لنا دانهام و مایکل کوهن از مدیران اجرایی تحت عنوان Good Thing Going تولید می‌کردند و مدیسون وولک در Assemble Media در کنار Blake Mars برای Good Thing Going همکاری می‌کرد. ما این پروژه را در سپتامبر به پایان رساندیم.", "image_url": "https://deadline.com/wp-content/uploads/2026/11/2026-ELLE-Women-In-Hollywood-A-Few-Good-Men-Opening-Night-32nd-Annual-Actor-Awards-Arrivals-1000.jpg?w=1000", "category": "هوش مصنوعی مولد", "tags": ["امنیت سایبری", "سینما"], "datetime_fa": "۲ آذر • ۲۰:۴۹"}, {"source": "Deadline", "title": "‘3:30’ Filmmaker Shlok Choudhari & Producer Sunil Sadarangani On Making A Women’s Mental Health Awareness Noir In South Mumbai", "link": "https://deadline.com/2026/11/330-short-film-inteview-shlok-choudhari-sunil-sadarangani-1237231423/", "summary": "Sometimes all it takes is a little gusto and a cold pitch on LinkedIn to get a film rolling. At 23, Shlok Choudhari left college and followed his dream of filmmaking with his first short, 3:30. Starring Priyanka Zemse, the black-and-white psychological noir follows a woman navigating Mumbai during the titular dark hour as medication, [ ]", "date_str": "2026-11-23T17:15:00+00:00", "hash": "944baab959e7bde0", "title_fa": "فیلمساز «3:30» شلوک چوداری و تهیه کننده سونیل سادارانگانی در مورد ساختن یک نوآر آگاهی از سلامت روان زنان در بمبئی جنوبی", "summary_fa": "گاهی اوقات تنها چیزی که لازم است کمی ذوق و شوق در لینکدین است تا فیلمی به نمایش درآید. در 23 سالگی، شلوک چوداری کالج را ترک کرد و با اولین فیلم کوتاه خود، 3:30، رویای خود را دنبال کرد. با بازی پریانکا زمسه، نوآر روان‌شناختی سیاه و سفید زنی را دنبال می‌کند که در زمان تاریکی عنوانی در بمبئی به‌عنوان دارو حرکت می‌کند، [ ] پس از نمایش در جشنواره فیلم Tasveer واجد شرایط اسکار، فیلم به جشنواره بین‌المللی فیلم یلوستون در بمبئی می‌رود. در زیر، چودهری و سونیل سادرگانی تهیه کننده با ددلاین در مورد شجاعت در ساختن فیلم، توسعه مضامینی پیرامون آگاهی از سلامت روان و نگاه به آینده صحبت می کنند. اخبار مرتبط اخبار تیم فیلم کوتاه Aurora Angad Aulakh و Guy Kent در مورد ضربه زدن به وزن عاطفی مستند فضای خارج از خود جشنواره بین المللی فیلم یلوستون هند اعلام کرد مستند و LGBTQIA+ Slate مهلت: این اولین فیلم کوتاه شماست و شما 23 ساله هستید. شما باید در مدرسه باشید، فکر نمی کنید؟ چه چیزی شما را مجبور کرد که این کوتاه را بنویسید؟ تماشا کنید در ددلاین SHLOK CHOUDHARI: خوب، من این فیلم را در 22 سالگی ساختم. در سال دوم دانشگاه بودم و در رشته تبلیغات و روزنامه نگاری تحصیل می کردم. با تمام احترامی که برای روزنامه نگاری قائل هستم، و از کاری که همه شما انجام می دهید قدردانی می کنم، دیگر نمی خواستم آن را مطالعه کنم. من عاشق فیلم هستم. چودهاری: من با دیدن فیلم بزرگ شدم و هنوز هم حداقل روزی یک فیلم می بینم. بنابراین، من همیشه دوست داشتم فیلم بسازم، اما معمولاً این ایده را کنار می گذاشتم تا زمانی که در نهایت احساس کنم باید کاری انجام دهم. بنابراین، من ساعت 3:30 نوشتم و به لینکدین رفتم و با مردم سردمدار رفتم. سونیل", "image_url": "https://deadline.com/wp-content/uploads/2026/11/330_1.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["سینما"], "datetime_fa": "۲ آذر • ۲۰:۴۵"}, {"source": "Rolling Stone", "title": "D’Angelo’s ‘GTA VI’ Song ‘Kamikaze’ Released as Brother Teases Future Posthumous Songs", "link": "https://www.rollingstone.com/music/music-news/dangelos-gta-vi-kamikaze-brother-new-music-1235662740/", "summary": "\"We look forward to sharing more of my brother’s legacy with you,\" Luther Archer Jr. said", "date_str": "2026-11-23T17:14:37+00:00", "hash": "2761b3802c141928", "title_fa": "آهنگ \"Kamikaze\" از \"GTA VI\" D'Angelo در حالی منتشر شد که برادر آهنگ‌های بعد از مرگ آینده را تیز می‌کند.", "summary_fa": "لوتر آرچر جونیور گفت: «ما مشتاقانه منتظر به اشتراک گذاشتن میراث برادرم با شما هستیم. \"Kamikaze\" در هیچ یک از مطبوعات پیرامون موسیقی متن GTA VI در پیش از انتشار بازی ذکر نشده است. و تا زمانی که مردم واقعاً بازی را شروع کردند، این آهنگ در یکی از بسیاری از ایستگاه‌های رادیویی درون بازی، Worldwide FM شنیده شد. (یکی دیگر از کلاسیک های D'Angelo، \"Lady\" نیز در ایستگاه دیگری به نام Honey FM پخش می شود.) این آهنگ به طور رسمی در روز دوشنبه (23 نوامبر) با بیانیه ای از برادر D'Angelo، Luther Archer، Jr، به همراه ورود آن به پلتفرم های استریم منتشر شد. در آن، آرچر اطلاعات بیشتری در مورد \"Kamikaze\" از جمله تیتراژ کامل آن به اشتراک گذاشت و جزئیات جدیدی در مورد انتشارات بعدی D'Angelo پس از مرگش ارائه کرد. طبق گفته Archer، D'Angelo \"Kamikaze\" را \"به شکل فعلی\" برای انتشار در GTA VI در نوامبر 2024 تایید کرد. آرچر ادامه داد، D’Angelo یکی از تحسین‌کنندگان فوق‌العاده Rockstar Games و یکی از همکاران قبلی آن‌ها بود، و مشتاق بود (حداقل بگویم) که این رکورد در بازی گنجانده شود و به عنوان یک تک‌آهنگ برای مخاطبان گسترده منتشر شود. (در سال 2018، D'Angelo آهنگ جدیدی به نام \"Unshaken\" را به Rockstar's Red Dead Redemption 2 ارائه کرد.) D'Angelo خود \"Kamikaze\" را تهیه کرد و با همکارش Slingbaum (که بیانیه Archer را در استوری های اینستاگرام به اشتراک گذاشت) و مهندس بن کین همکاری کرد. D’Angelo و Slingbaum در کنار درامرهای Yussef Dayes و James Gadson بیشتر سازهای این آهنگ را نواختند.", "image_url": "https://www.rollingstone.com/wp-content/uploads/2026/11/GettyImages-1304768886.jpg?w=1600&#038;h=900&#038;crop=1", "category": "هوش مصنوعی مولد", "tags": ["موسیقی"], "datetime_fa": "۲ آذر • ۲۰:۴۴"}, {"source": "Variety", "title": "BAFTA Film Awards Losing Headline Sponsor EE After 30 Years", "link": "https://variety.com/2026/film/awards/bafta-film-awards-losing-headline-sponsor-ee-1236956014/", "summary": "The BAFTA Awards is losing its long-standing headline sponsor. Brit mobile and internet provider EE, which has sponsored the U.K. s biggest film event for almost 30 years, is ending its partnership with the awards following the next ceremony in February 2027. The decision was driven by EE s business strategy, according to the British Academy, which [ ]", "date_str": "2026-11-23T17:12:11+00:00", "hash": "5b1050a3a90f4cd5", "title_fa": "جوایز فیلم بفتا پس از 30 سال از دست دادن سرفصل حامی EE", "summary_fa": "جوایز بافتا در حال از دست دادن حامی مالی قدیمی خود است. ارائه‌دهنده تلفن همراه و اینترنت بریتانیایی EE، که تقریباً 30 سال است حامی بزرگ‌ترین رویداد سینمایی بریتانیا بوده است، به همکاری خود با جوایز پس از مراسم بعدی در فوریه 2027 پایان می‌دهد. طبق گفته آکادمی بریتانیا، این تصمیم بر اساس استراتژی تجاری EE اتخاذ شده است که [ ] «2027 سی امین سال جوایز فیلم EE BAFTA می‌گوید. پس از یک همکاری طولانی مدت، موفق و قابل اعتماد، EE بیش از یک سال پیش به ما توصیه کرد که حمایت خود از جوایز فیلم را پس از پایان قرارداد فعلی که تا پایان سال 2027 ادامه دارد، تمدید نخواهد کرد و تأیید کرد که این تصمیم کاملاً بر اساس استراتژی تجاری EE است. این سخنگو افزود: ما به دستاوردهایی که با هم در طول سه دهه به دست آورده‌ایم فوق‌العاده افتخار می‌کنیم و به طور کامل بر ارائه جوایز استثنایی فیلم EE BAFTA در ماه فوریه متمرکز هستیم، جایی که مشتاقانه منتظر جشن گرفتن بهترین فیلم‌ها با EE و تماشاگران در سراسر بریتانیا و سراسر جهان هستیم. EE برای اولین بار در سال 2013 حامی عنوان جوایز بفتا شد و از شرکت خواهر خود Orange که این رابطه را در سال 1998 آغاز کرد. علاوه بر اینکه اسپانسر اصلی این رویداد است، نام خود را به جایزه ستاره در حال ظهور EE اضافه می کند. در همین حال، P O Cruises اسپانسر اصلی جوایز تلویزیونی بفتا است. بفتا در حال حاضر در حال مذاکره با حامیان مالی احتمالی برای تصدی مراسم جوایز فیلم 2028 است.", "image_url": "https://variety.com/wp-content/uploads/2025/05/bafta-award-placeholder.jpg?w=1000&#038;h=563&#038;crop=1", "category": "هوش مصنوعی مولد", "tags": ["سینما"], "datetime_fa": "۲ آذر • ۲۰:۴۲"}, {"source": "Variety", "title": "‘God of War’ Live-Action Series: Deborah Ann Woll to Reprise Faye Role From Video Games", "link": "https://variety.com/2026/tv/news/god-of-war-tv-series-amazon-deborah-ann-woll-faye-1236955900/", "summary": "Deborah Ann Woll is set to play Faye in the God of War live-action TV series at Amazon Prime Video, Variety has learned. Woll previously played Faye in the video game God of War Ragnarok and will also lead the upcoming game God of War Laufey, which is due out in May 2027. She is [ ]", "date_str": "2026-11-23T17:00:00+00:00", "hash": "8340cba2302f8540", "title_fa": "سریال لایو اکشن «God of War»: دبورا آن وول نقش فی را از بازی‌های ویدیویی بازی می‌کند", "summary_fa": "ورایتی دریافته است که دبورا آن وول قرار است نقش فی را در مجموعه تلویزیونی لایو اکشن خدای جنگ در آمازون پرایم ویدیو بازی کند. وول قبلاً در بازی ویدیویی God of War Ragnarok نقش Faye را بازی کرده بود و همچنین رهبری بازی آینده God of War Laufey را نیز بر عهده خواهد داشت که قرار است در ماه می 2027 منتشر شود. او [ ] آخرین بازیگری است که به مجموعه بازیگران گسترده اضافه شده است، که همچنین شامل: دیو باتیستا در نقش کریتوس، کالوم وینسون در نقش آترئوس، مندی پتینکین در نقش اودین، اد اسکرین در نقش بالدور، مکس پارکر در نقش هایمدال، الافور دری الافسون در نقش ثور، ترزا پالمر در نقش ثور، ترزا پالمر در نقش ثور، ترزا پالمر در نقش آترئوس، دنی وودبرن در نقش بروک، سونیا والگر در نقش فریا، آیلند آستین در نقش ترود، بن چاپل در نقش مگنی، لوئیس کانینگهام در نقش مودی و ایولین میلر در نقش گنا. داستان‌های مرتبط Pink اعلام می‌کند 2027 Sphere Residency در لاس‌وگاس وول آخرین بازیگر بازی‌های God of War است که در این سریال با همان شخصیت بازی می‌کند. همانطور که قبلا اعلام شده بود، دانکن در نقش میمیر بازخواهد گشت. شخصیت Faye به عنوان همسر مرموز و مرموز کریتوس و مادر آترئوس توصیف می شود، عبور ناگهانی Faye وقایع God of War را به حرکت در می آورد. کریتوس و آترئوس در طول سفر خود رازهایی را در مورد فی کشف می‌کنند که باعث می‌شود به این فکر کنند که واقعاً چقدر او را می‌شناسند. این آخرین بازگشت وول به یک نقش نمادین در سال‌های اخیر است. او همچنین پس از ایفای نقش کارن پیج در سریال Daredevil: Born Again و The Punisher: One Last Kill در Disney+ پس از ایفای نقش این شخصیت در چندین نمایش مارول-نتفلیکس بین سال‌های 2015 و 2019", "image_url": "https://variety.com/wp-content/uploads/2026/11/god-of-war.jpg?w=1000&#038;h=563&#038;crop=1", "category": "هوش مصنوعی مولد", "tags": ["سینما", "نتفلیکس"], "datetime_fa": "۲ آذر • ۲۰:۳۰"}, {"source": "Billboard", "title": "‘Dang Me’! Roger Miller Posthumously Inducted Into Songwriters Hall of Fame", "link": "https://www.billboard.com/music/awards/roger-miller-inducted-songwriters-hall-of-fame-posthumous-1236387357/", "summary": "Roger Miller , the witty wordsmith who delivered hits as “Dang Me” and “King of the Road,” was posthumously inducted into the Songwriters Hall of Fame, it was announced on Monday (Nov. 23). Miller, who died in 1992 at age 56, was honored during an intimate ceremony held on Nov. 17 at BMI headquarters in Nashville, prior to the BMI Country Awards. Related 10 Country Artists Who Have Brought Their Talents to Musical Productions From Loretta Lynn to Shania Twain, All the ACM Awards Hosts Who Ever Won Entertainer of the Year Willie Nelson, Dolly Parton, Eric Church More Put Their Spin on Roger Miller s King of the Road SHOF board members Fletcher Foster (chairman of SHOF’s Nashville Committee), Mike O’Neill and Jon Platt made the induction to Miller’s widow, Mary Miller. We were ecstatic to learn that Roger was being inducted into the Songwriters Hall of Fame,” Mary Miller said in a statement. “Of all his many talents, he was most proud of his songwriting. This lifetime achievement would have meant a great deal to him, and we are honored to celebrate the recognition of his extraordinary body of work.” The annual SHOF Induction Awards Gala in New York City each June does not usually include posthumous inductions, but the organization has taken to hosting posthumous inductions at special events to recognize songwriters they missed during their lifetimes. In the past two years, Prince, Cindy Walker, Hugo Peretti Luigi Creatore, Bert Berns, Jerry Ragovoy and Donna Summer have been inducted into the SHOF posthumously in this way. Miller had 11 top 10 hits on Billboard ’s Hot Country Songs chart in the 1960s, all but one of which he wrote or co-wrote. He had long runs at No. 1 with “Dang Me” in 1964 and “King of the Road” in 1965. Both songs won Grammys for best country and western song, a term that was phased out in favor of country in 1969. Both of these songs also made the top 10 on the all-genre Billboard Hot 100 , as did three other Miller hits: “Chug-a-Lug,” “Engine Engine #9” and “England Swings.” King of the Road, which received Grammy nominations for both record and song of the year, is one of the most famous country songs from the 1960s. Miller won 11 Grammys in just two years (1965 and 1966). In 1966, he became the first artist from any genre to win six Grammys in one year. “Dang Me” and “King of the Road” have both been voted into the Grammy Hall of Fame. Miller received five awards from the Academy of Country Music Awards, including single record of the", "date_str": "2026-11-23T17:00:00+00:00", "hash": "45f442015c830464", "title_fa": "\"دانگ من\"! راجر میلر پس از مرگ به تالار مشاهیر آهنگسازان راه یافت", "summary_fa": "روز دوشنبه (23 نوامبر) اعلام شد راجر میلر، واژه‌ساز شوخ‌طبعی که آهنگ‌های «دانگ من» و «پادشاه جاده» را ارائه کرد، پس از مرگ به تالار مشاهیر ترانه‌سراها معرفی شد. میلر، که در سال 1992 در سن 56 سالگی درگذشت، طی مراسمی صمیمی در 17 نوامبر در مقر BMI در نشویل، قبل از جوایز کشور BMI برگزار شد. مرتبط 10 هنرمند کشوری که استعدادهای خود را به تولیدات موسیقی آورده اند، از لورتا لین گرفته تا شانیا تواین، همه میزبانان جوایز ACM که تا به حال برنده سرگرمی سال شده اند ویلی نلسون، دالی پارتون، اریک چرچ بیشتر به بازی Roger Miller's King of the Road SHOF (اعضای Roger Millers King of the Road SHOF) کمیته نشویل)، مایک اونیل و جان پلات، بیوه میلر، مری میلر را معرفی کردند. مری میلر در بیانیه‌ای گفت: «از همه استعدادهای او، او بیش از همه به ترانه‌سرایی‌اش افتخار می‌کرد. این دستاورد مادام العمر برای او ارزش زیادی داشت و ما مفتخریم که به رسمیت شناختن مجموعه کارهای خارق العاده او را جشن بگیریم. مراسم جشن سالانه جوایز SHOF Induction Awards در شهر نیویورک هر ماه ژوئن معمولاً شامل تعارفات پس از مرگ نمی‌شود، اما این سازمان میزبانی مراسم‌های پس از مرگ را در رویدادهای ویژه به منظور شناسایی ترانه‌سرایانی که در طول زندگی خود از دست داده‌اند، گرفته است. در دو سال گذشته، شاهزاده، سیندی واکر، هوگو پرتی لوئیجی کریاتوره، برت برنز، جری راگووی و دونا سامر پس از مرگ به این روش به SHOF راه یافتند. میلر در دهه 1960 11 آهنگ برتر 10 آهنگ برتر بیلبورد را در جدول آهنگ های کانتری داغ داشت که همه آنها به جز یکی از آنها را نوشته یا یکی از آنها نوشته است. او در سال 1964 با \"Dang Me\" و \"King of the Road\" در سال 1965 در رتبه اول قرار گرفت.", "image_url": "https://www.billboard.com/wp-content/uploads/2026/11/SHOF-Posthumous-Induction-Roger-Miller-Credit-Getty-Images-for-BMI-e1795377303187.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["موسیقی"], "datetime_fa": "۲ آذر • ۲۰:۳۰"}, {"source": "Billboard", "title": "It’s Dolly Parton Week on ‘The Voice’: See the Full List of Tribute Songs the Top 10 Will Perform", "link": "https://www.billboard.com/lists/dolly-parton-week-the-voice-song-list-top-10-perform/", "summary": "On Monday s (Nov. 23) live episode of The Voice , the top 10 singers will honor a late legend for the show s first-ever Dolly Parton Week and Billboard is exclusively unveiling the full song list below. Parton who died in August at age 80 had a frequent presence on the NBC singing competition, serving as a guest advisor to all four coaches in 2015, performing with her goddaughter (and then-coach) Miley Cyrus in 2016, and singing I Will Always Love You remotely on the season 23 finale in 2023 in honor of Blake Shelton s retirement from the show. Now, her presence will be felt again as the 10 remaining singers cover beloved songs from her deep catalog. Related Dolly Parton s Half-Century Hot 100 Legacy: 9 to 5, Islands in the Stream More Sister country duo Ferryn Brinkley who are on brand-new coach Riley Green s team have an especially close connection to Parton, having grown up in her Tennessee hometown and also performing at her Dollywood park and resort before auditioning for the show. There are so many reasons why she is such an influence on us, the Wright sisters tell Billboard . Many people don t know the thousands of songs she has written, because only a handful are mainstream, but she was an incredible songwriter! She never forgot where she was from, and her songs tell that story. We love that Dolly was always true to herself and didn’t try to fit into the standards of country music during her career. You either liked her or you didn’t, but she was one of the most kindhearted, genuine human beings (we think) on this planet. She did so much for our community, and still to this day her legacy continues. She is EVERYTHING in our town, they continued of their Sevierville birth place, and the fact that we are on this stage this week involved in a tribute for her fills our hearts. What an honor! The beautiful thing about music is that we can continue people s memories, even when they no longer walk this Earth with us! We will always love you Dolly! This week is for you. Below, find the full list of Dolly Parton tribute songs that will be performed on Monday night s episode, as well as more Billboard -exclusive quotes from the top 10.", "date_str": "2026-11-23T17:00:00+00:00", "hash": "a2f6f28717df36d6", "title_fa": "هفته دالی پارتون در «The Voice» است: فهرست کامل ترانه‌های ادای احترامی که 10 آهنگ برتر اجرا خواهند کرد را ببینید", "summary_fa": "در دوشنبه (23 نوامبر) قسمت زنده The Voice، 10 خواننده برتر از یک افسانه فقید برای اولین بار سریال Dolly Parton Week تقدیر می کنند و بیلبورد به طور انحصاری از لیست کامل آهنگ های زیر رونمایی می کند. پارتون که در آگوست در سن 80 سالگی درگذشت، حضور مکرری در مسابقات خوانندگی NBC داشت، به عنوان مشاور مهمان برای هر چهار مربی در سال 2015 خدمت کرد، در سال 2016 به همراه دخترخوانده خود (و مربی آن زمان) مایلی سایرس اجرا کرد و در فصل 23 پایانی فصل 23 او در پایان فصل 23 او در افتخاری از پایان فصل 202 در قسمت آخر Blaskeeton از راه دور آواز خواند. نشان می دهد. اکنون، حضور او دوباره احساس خواهد شد زیرا 10 خواننده باقیمانده آهنگ های مورد علاقه خود را از کاتالوگ عمیق او پوشش می دهند. میراث 100 داغ نیم قرنی دالی پارتون: 9 تا 5، جزایر در جریان. خواهران رایت به بیلبورد می گویند که دلایل زیادی وجود دارد که چرا او اینقدر بر ما تأثیر می گذارد. بسیاری از مردم هزاران آهنگی را که او نوشته است نمی دانند، زیرا تنها تعداد انگشت شماری از آنها جریان اصلی هستند، اما او یک ترانه سرای باورنکردنی بود! او هرگز فراموش نکرد که اهل کجاست و آهنگ هایش این داستان را روایت می کند. ما دوست داریم که دالی همیشه به خودش وفادار بوده و در طول دوران حرفه‌ای‌اش سعی نکرده با استانداردهای موسیقی کانتری مطابقت داشته باشد. شما یا او را دوست داشتید یا نه، اما او یکی از مهربان ترین و اصیل ترین انسان ها (به نظر ما) روی این سیاره بود. او کارهای زیادی برای جامعه ما انجام داد و هنوز هم میراث او همچنان ادامه دارد. او در شهر ما همه چیز است، آنها به محل تولد خود در سویرویل ادامه دادند، و این", "image_url": "https://www.billboard.com/wp-content/uploads/2026/11/GettyImages-500498582-e1795211510244.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["موسیقی"], "datetime_fa": "۲ آذر • ۲۰:۳۰"}, {"source": "Hollywood Reporter", "title": "Nominees for AARP Movies & TV for Grownups Awards Include Newly AARP-Eligible Andrew Scott and Keri Russell", "link": "https://www.hollywoodreporter.com/movies/movie-news/nominees-for-2027-aarp-movies-tv-for-grownups-awards-1236760553/", "summary": "Winners will be announced at a ceremony at the Beverly Wilshire in Beverly Hills on Jan. 9, 2027, which will be hosted by Jane Lynch and subsequently broadcast on PBS's Great Performances on Feb. 26.", "date_str": "2026-11-23T17:05:00+00:00", "hash": "9ea8bec793a51e42", "title_fa": "نامزدهای فیلم و تلویزیون AARP برای جوایز بزرگسالان شامل اندرو اسکات و کری راسل تازه واجد شرایط AARP هستند.", "summary_fa": "برندگان در مراسمی در بورلی ویلشایر در بورلی هیلز در 9 ژانویه 2027 اعلام خواهند شد که توسط جین لینچ میزبانی خواهد شد و متعاقباً در 26 فوریه از برنامه PBS پخش خواهد شد. جشن گرفتن کار توسط و در مورد افراد بالای 50 سال - سنی که در آن افراد واجد شرایط AARP می شوند. فیلم‌های چند نامزدی شامل The Odyssey، Wild Horse Nine و Tender Loving Care و برنامه‌های تلویزیونی چند نامزد شده عبارتند از Widows Bay، Hacks و DTF St. در همین حال، نامزدهای فردی عبارتند از: تام کروز، مریل استریپ، مت دیمون و ژان اسمارت - و اندرو اسکات و کری راسل که به تازگی واجد شرایط AARP هستند. داستان‌های مرتبط فیلم‌ها آدام سندلر قول می‌دهد قبل از مرگم 50 فیلم دیگر بسازد - و حداقل 25 فیلم از آن‌ها فیلم‌های خوبی خواهند بود. Minter-Jordan، مدیر عامل AARP در بیانیه ای گفت. از افسانه‌هایی مانند مریل استریپ و هلن میرن گرفته تا سازندگان تحسین‌شده‌ای مانند کریستوفر نولان و کریس راک، این هنرمندان برخی از بهترین کارهای حرفه‌ای خود را انجام می‌دهند و به مخاطبان و صنعت یادآوری می‌کنند که داستان‌های بزرگ محدودیت سنی ندارند.» بهترین فیلم برای بزرگسالان: Being Heumann، The Invite، The Odyssey، Tender Loving Care، و Wild Horse Nine بهترین بازیگر زن: ماریون بیلی (Tender Loving Care)، هلن میرن (استعدادی برای قتل)، جولیان مور (The Debut)، سوفی مریلوسارپ (Sophie Okonedaars) (سنت اوکوندارس)، و The St. 2) بهترین بازیگر مرد: تام کروز (دگر)، مت دیمون (اودیسه)، جان مالکوویچ (اسب وحشی نه)، اندرو اسکات (السینور) و جان تورتورو (تنها جیب بر زنده در نیویورک) بهترین بازیگر نقش مکمل زن: گلن کلوز (لابولا نگرا)، (الیویتز)، (الیویتز)، (الیویتز)، (الیویت) نیا لانگ (مایکل) و پارکر پوزی (اسب وحشی نه) بهترین بازیگر نقش مکمل مرد: آنتونیو باندراس (تونی)، کولمن دومینگو (مایکل)، پل جیاماتی (نخستین)، جان لگوئیزامو (اودیسه) و ادوارد نورتون", "image_url": "https://www.hollywoodreporter.com/wp-content/uploads/2026/11/andrew-keri.jpg?w=1296&#038;h=730&#038;crop=1", "category": "هوش مصنوعی مولد", "tags": ["سینما"], "datetime_fa": "۲ آذر • ۲۰:۳۵"}, {"source": "Hollywood Reporter", "title": "Deborah Ann Woll to Reprise ‘God of War’ Role in Prime Video Series", "link": "https://www.hollywoodreporter.com/tv/tv-news/deborah-ann-woll-to-reprise-god-of-war-role-in-prime-video-series-1236761123/", "summary": "She'll play Faye in the streamer's video game adaptation.", "date_str": "2026-11-23T17:00:00+00:00", "hash": "406d616c30df9a6c", "title_fa": "دبورا آن وول دوباره نقش «خدای جنگ» را در سریال پرایم ویدیو ایفا می‌کند", "summary_fa": "متن لوگو سریال God of War Prime Videos نقش Faye را با بازیگری انتخاب کرده است که برای افرادی که این بازی ویدیویی را بازی کرده اند آشنا خواهد بود. دبورا آن وول که صداپیشگی این شخصیت در God of War: Ragnarok را بر عهده داشت، در این سریال نقش Faye را بر عهده خواهد داشت. او آخرین بازیگری است که به رهبری دیو باتیستا، کالوم وینسون، مندی پتینکین و اد اسکرین به‌سر می‌برد. فی همسر مرموز و مرموز کریتوس (باوتیستا) و مادر آترئوس (وینسون) است. مرگ او وقایع سریال را به حرکت در می آورد، زیرا پدر و پسر رازهایی را در مورد فی کشف می کنند که آنها را به این فکر می کند که چقدر او را می شناسند. داستان‌های مرتبط تلویزیون ملانیا ترامپ بر تلاش‌های بشردوستانه در اولین نمایش شیک برای مجموعه دو قسمتی فیلم‌های مستند بعدی تأکید می‌کند. نقد دیوانه: نیکلاس کیج و کریستین بیل برای شکست در یک فیلم زندگی‌نامه کارتونی از دیوید او. پس از تغییر در مجریان سریال در سال 2024، تولید سریال اوایل سال جاری آغاز شد - پس از یک جراحت سر صحنه در ژوئیه که رایان هرست، که در ابتدا نقش کریتوس را انتخاب کرده بود، متوقف شد. Bautista در ماه آگوست انتخاب شد و این نمایش را در مسیر شروع مجدد تولید در ونکوور در پاییز قرار داد. مکس پارکر، الافور دری الافسون، ترزا پالمر، آلستر دانکن، جف گولکا، دنی وودبرن، سونیا والگر، جزیره آستین، بن چاپل، لوئیس کانینگهام و ایولین میلر نیز در این فیلم حضور دارند. Sony Pictures Television و Amazon MGM Studios God of War را با همکاری PlayStation Productions و Tall Ship Productions تولید می کنند. رونالد دی. مور (Outlander، Battlestar Galactica) با مریل دیویس، کوری بارلوگ، نارن شانکار، متیو گراهام، اسد قزلباش، جف کچام، هرمن هالست، روی لی، براد ون آراگون و لارنس", "image_url": "https://www.hollywoodreporter.com/wp-content/uploads/2026/11/GettyImages-2267621396-H-2026.jpg?w=1296&#038;h=730&#038;crop=1", "category": "هوش مصنوعی مولد", "tags": ["سینما"], "datetime_fa": "۲ آذر • ۲۰:۳۰"}, {"source": "Billboard", "title": "Randy Newman, Marvin Hamlisch, Earle Hagen & More to Be Honored by Society of Composers & Lyricists", "link": "https://www.billboard.com/music/awards/randy-newman-honored-society-of-composers-lyricists-1236387613/", "summary": "Randy Newman is set to receive the Society of Composers Lyricists 2026 Lifetime Achievement Award on Dec. 9 at the 37th Annual SCL Holiday Dinner in Los Angeles. The organization will also posthumously induct composers Marvin Hamlisch and Earle Hagen into its Hall of Fame. Related Ludwig Göransson, Golden More Win at 2026 Society of Composers Lyricists Awards: Full List Inside Toy Story 5 World Premiere: Taylor Swift Randy Newman s Friendly Duet More Magical Moments Marvin Hamlisch s Impact: From Ragtime to Broadway Riches Past SCL Lifetime Achievement Award honorees include Stephen Schwartz, Charles Fox, Giorgio Moroder, Quincy Jones, Danny Elfman, Bill Conti, Lalo Schifrin, Philip Glass, Alan Menken and Ginny Mancini. Newman’s many honors include seven Grammys, three Primetime Emmys and two Academy Awards. He was inducted into the Songwriters Hall of Fame in 2002 and the Rock Roll Hall of Fame in 2013. Hamlisch won three Oscars, four Grammys, four Primetime Emmys, a Tony and two Golden Globes. He shared the Pulitzer Prize for Drama for the 1975 Broadway smash A Chorus Line. He died in 2012 at age 68. Hagen composed the theme songs for dozens of TV shows, including The Andy Griffith Show, The Dick Van Dyke Show and That Girl. Hagen won a Primetime Emmy in 1968 for his work on I Spy . He was inducted into the Television Academy Hall of Fame in 2011, and died in 2008 at age 88. The 37th Annual SCL Holiday Dinner will be held at the Skirball Cultural Center in Los Angeles on Dec. 9 from 5:30 to 10 p.m. The SCL will present additional honors at its holiday parties in New York, Chicago and Nashville. Jon Batiste will receive the 2026 SCL Ambassador Award at the SCL New York City Holiday Party at The Cutting Room on Dec. 1 from 6:30 to 10:30 p.m. Sen. Dick Durbin (D-Ill.) will receive the SCL Excellence in Advocacy Award at the SCL Chicago Holiday Party at iO Theater – The Clybourn on Dec. 3 from 7 to 10 p.m. Composer and film director Brent McCorkle will receive 2026 SCL Trailblazer Award at the SCL Nashville Holiday Party at Ocean Way Studios on Dec. 5 from 6 to 9 p.m. The SCL Excellence in Advocacy Award recognizes leading advocates who champion the rights of music creators. Sen. Marsha Blackburn (R-Tenn.) received the award in 2025. The SCL Trailblazer Award was created to recognize and acknowledge a select group of composers and lyricists whose contributions have pioneered scoring for film, television and other visual media in Nashville. Past recipients in", "date_str": "2026-11-23T17:00:00+00:00", "hash": "cba6b836694750bb", "title_fa": "رندی نیومن، ماروین هملیش، ارل هاگن و دیگران توسط انجمن آهنگسازان و ترانه سرا تجلیل می شوند", "summary_fa": "رندی نیومن قرار است در 9 دسامبر در سی و هفتمین شام تعطیلات سالانه SCL در لس آنجلس، جایزه یک عمر دستاورد هنری انجمن آهنگسازان 2026 را دریافت کند. این سازمان همچنین پس از مرگ آهنگسازان ماروین هملیش و ارل هاگن را وارد تالار مشاهیر خود خواهد کرد. مرتبط لودویگ گورانسون، برنده طلایی بیشتر در سال 2026 انجمن آهنگسازان جوایز ترانه سرایان: فهرست کامل در داخل داستان اسباب بازی 5 اولین نمایش جهانی: تیلور سویفت دوئت دوستانه رندی نیومن لحظات جادویی تر تاثیر ماروین هملیش: از Ragtime تا Broadway Riches Scheeeeeeeeee SCL چارلز فاکس، جورجیو مورودر، کوئینسی جونز، دنی الفمن، بیل کونتی، لالو شیفرین، فیلیپ گلس، آلن منکن و جینی مانچینی. از افتخارات فراوان نیومن می توان به هفت جایزه گرمی، سه جایزه امی تایم و دو جایزه اسکار اشاره کرد. او در سال 2002 به تالار مشاهیر آهنگسازان و در سال 2013 به تالار مشاهیر راک رول راه یافت. هملیش برنده سه جایزه اسکار، چهار جایزه گرمی، چهار جایزه امی پرایم تایم، یک تونی و دو گلدن گلوب شد. او در سال 1975 جایزه پولیتزر درام را برای سریال A Chorus Line در برادوی به اشتراک گذاشت. او در سال 2012 در سن 68 سالگی درگذشت. هاگن برای ده‌ها برنامه تلویزیونی، از جمله نمایش اندی گریفیث، نمایش دیک ون دایک و آن دختر، آهنگ‌های تم را ساخت. هاگن در سال 1968 برنده جایزه امی پرایم تایم برای کارش در من جاسوس شد. او در سال 2011 وارد تالار مشاهیر آکادمی تلویزیون شد و در سال 2008 در سن 88 سالگی درگذشت. سی و هفتمین شام تعطیلات سالانه SCL در مرکز فرهنگی Skirball در لس آنجلس در 9 دسامبر از ساعت 5:30 تا 10 بعد از ظهر برگزار خواهد شد. SCL افتخارات بیشتری را در مهمانی های تعطیلات خود در نیویورک، شیکاگو و نشویل ارائه خواهد کرد. جان باتیست جایزه", "image_url": "https://www.billboard.com/wp-content/uploads/2026/11/1205160717-e1795388190884.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["سینما", "موسیقی"], "datetime_fa": "۲ آذر • ۲۰:۳۰"}, {"source": "Billboard", "title": "‘Michael’ Costars Nominated for AARP Movies & TV for Grownups Awards: Full List", "link": "https://www.billboard.com/music/awards/aarp-movies-tv-for-grownups-awards-nominations-list-1236387462/", "summary": "Colman Domingo and Nia Long, who played Michael Jackson ’s parents Joseph and Katherine Jackson in the hit film Michael , were on Monday (Nov. 23) both nominated for AARP Movies TV for Grownups Awards, the annual celebration honoring outstanding films and television programs that spotlight the voices, stories and talent of people age 50 and older. Related Colman Domingo Addresses Whether Michael Biopic Whitewashed Child Molestation Allegations Against Michael Jackson Soundtrack to Baz Luhrmann s EPiC: Elvis Presley in Concert Film to Feature Live Performance, Remixes and Medleys of Classics Rewinding the Charts: In 1962, The Crystals Scored a No. 1 in Name Only Jaafar Jackson, who played his uncle, the global pop icon, in the film, was not eligible in the best actor category. He’s only 30. Director Antoine Fuqua’s film set new box-office records as the top-grossing musician biopic (topping the Freddie Mercury biopic Bohemian Rhapsody ) and the top-grossing biopic of any subject (topping Oppenheimer , about theoretical physicist J. Robert Oppenheimer). Related Michael Pulls Further Ahead of Bohemian Rhapsody as Top-Grossing Music Biopic Worldwide: See the Top 25 Two music documentaries were nominated for best documentary: EPiC: Elvis Presley in Concert, director Baz Luhrmann ’s second look at rock legend Elvis Presley , following his 2022 feature film Elvis ; and Darlene Love: I Know Where I ve Been, director Barry Avrich’s iews/focker-in-law-review-ariana-grande-robert-de-niro-1236760021/", "summary": "Skyler Gisondo, Eduardo Franco and Beanie Feldstein join returning cast members Owen Wilson, Blythe Danner and Teri Polo for the latest film in the hit comedy franchise.", "date_str": "2026-11-23T17:00:00+00:00", "hash": "63814bb05967886f", "title_fa": "نقد و بررسی فیلم Focker In-Law: آریانا گرانده در چهارمین قسمت وحشتناک از رابرت دنیرو و بن استیلر برتری می‌یابد.", "summary_fa": "Skyler Gisondo، Eduardo Franco و Beanie Feldstein به بازیگران بازگشته Owen Wilson، Blythe Danner و Teri Polo برای جدیدترین فیلم در مجموعه کمدی موفق می‌پیوندند. فرنچایز Fockers مانند یک گردهمایی خانوادگی که هر کاری از آن اجتناب می‌کنید، ۱۶ سال پس از آخرین قسمت، با قسمت چهارم بازگشته است. این سریال قبلاً به نقطه‌ای از بازدهی کاهش یافته رسیده بود، با Meet the Fockers و Little Fockers که پس از نسخه اصلی Meet the Parents در سال 2000، روندی رو به نزولی داشتند. Focker In-Law، که آریانا گرانده را وارد ترکیب می‌کند، مانند نادری در سریالی است که همان جوک‌های خسته‌کننده را به شیوه‌ای فزاینده ناامیدانه بازیافت می‌کند. تماشای رابرت دنیرو، یکی از بهترین بازیگران ما، و بن استیلر، که توانایی خیلی بیشتر از اینها را دارد، در این نسخه که توسط جان هامبورگ که سه فیلم قبلی را با هم نویسندگی کرده بود، تکرار می کنند، کاملاً دردناک است. مجموعه‌های کمیک، که تعداد زیادی از آن‌ها وجود دارد، تقریباً همگی حول محور تحقیر می‌چرخند، و استیلر به‌طور دردناکی مراحل را طی می‌کند، زیرا شخصیت او کارهای احمقانه را یکی پس از دیگری انجام می‌دهد. داستان‌های مرتبط فیلم‌ها باب اودنکرک، الک بالدوین، ایسلا فیشر به عنوان موسیقی نسخه پرتغال جشنواره ترایبکا 2026، آریانا گرانده چهار نامزدی جایزه گرمی، از جمله آهنگ سال نود فاکر زن، The Bottom Line Focking افتضاح است. تاریخ اکران: چهارشنبه، 25 نوامبر بازیگران: رابرت دنیرو، بن استیلر، اوون ویلسون، تری پولو، بلیت دانر، اسکایلر گیسوندو، بینه فلدشتاین، ادواردو فرانکو، آریانا گراند کارگردان فیلمنامه نویس: جان هامبورگ دارای رتبه PG-13، 1 ساعت و 45 دقیقه", "image_url": "https://www.hollywoodreporter.com/wp-content/uploa
