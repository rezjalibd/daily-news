های وابسته به آن را رد کرده بود و اتهامات مطرح‌شده علیه خود را مرتبط با اعتقادات و فعالیت‌های مذهبی‌اش می‌دانست. نبیل پیشتر در شعبه یک دادگاه انقلاب رشت به اتهام جاسوسی برای عربستان سعودی به اعدام محکوم شده بود. مقام‌های قضایی جمهوری اسلامی تا زمان انتشار این گزارش، اجرای حکم او را به‌طور رسمی تأیید نکرده‌اند. در این بخش ایران وایر می‌توانید با مسوولان تماس بگیرید و کارزار خود را برای مشکلات مختلف راه‌اندازی کنید با ایران‌وایر همکاری کنید ویدیوها و مطالب خود را برای ما بفرستید"}, {"source": "IranWire", "title": "روایت حسین عبده تبریزی از سقوط معیشت طبقه متوسط", "link": "https://iranwire.com/fa/features/158926-%D8%B1%D9%88%D8%A7%DB%8C%D8%AA-%D8%AD%D8%B3%DB%8C%D9%86-%D8%B9%D8%A8%D8%AF%D9%87-%D8%AA%D8%A8%D8%B1%DB%8C%D8%B2%DB%8C-%D8%A7%D8%B2-%D8%B3%D9%82%D9%88%D8%B7-%D9%85%D8%B9%DB%8C%D8%B4%D8%AA-%D8%B7%D8%A8%D9%82%D9%87-%D9%85%D8%AA%D9%88%D8%B3%D8%B7/", "summary": "«حسین عبده‌تبریزی» اقتصاددان و از بنیان‌گذاران بانک اقتصاد نوین در گفت و گویی با «محمد فاضلی» جامعه‌شناس در برنامه «ایران‌تاک» به بررسی ...", "date_str": "2026-10-15T15:08:20+00:00", "hash": "30f0b945a0ea1d63", "title_fa": "روایت حسین عبده تبریزی از سقوط معیشت طبقه متوسط", "summary_fa": "«حسین عبده‌تبریزی» اقتصاددان و از بنیان‌گذاران بانک اقتصاد نوین در گفت و گویی با «محمد فاضلی» جامعه‌شناس در برنامه «ایران‌تاک» به بررسی ... او در بخشی از این مصاحبه به شرایط گروه‌های مختلف شاغل در کشور از جمله ماهیگیران و لنج‌دارانی پرداخته که در ماه‌های اخیر به دلیل وقوع جنگ در خلیج‌فارس و دریای عمان فعالیتشان متوقف شده و بازار کار خود را از دست داده‌اند. در ادامه خلاصه‌ای از مهمترین سرفصل‌های این گفت و گو را می‌خوانید: عبده‌تبریزی در مصاحبه با محمد فاضلی جامعه‌شناس، با تاکید بر «نبود بنگاه‌های بزرگ و متوسط» گفته‌است: « در ایران کل کسانی که در کارگاه‌های بالای ۱۰ نفر کار می‌کنند ۲ میلیون نفرند. یعنی فقط ۷ تا ۸ درصد جمعیت شاغل‌ در کارگاه‌های بالای ۱۰ نفر کار می‌کنند. این آمار نشان می‌دهد ما نتوانسته‌ایم بنگاه‌های بزرگ یا بنگاه‌های متوسط ایجاد کنیم؛ حتی بنگاه کوچک هم نتوانسته‌ایم ایجاد کنیم.» به گفته این اقتصاد‌دان، مغالطه نرخ بیکاری و غفلت از نرخ مشارکت یکی دیگر از نکاتی است که در بازار کار به آن توجهی نشده‌است. او در تشریح این وضعیت افزوده‌است: «باید به نرخ اشتغال توجه کنیم که چه درصدی است. از کل جمعیت در سن کار، فقط ۳۷.۵ درصد دارند کار می‌کنند. جمعیت فعالمان حدود ۴۰.۷ درصد و غیرفعال‌ نزدیک ۶۰ درصد است.» عبده‌تبریزی با اشاره به مفهومی تحت عنوان «ناامیدی از جست‌وجوی کار» تاکید کرده‌است: «خیلی‌ از مردم می‌گویند حقوقم ۳۰ میلیون‌تومان است اما اصلاً برای رفت‌وآمد هم جواب نمی‌دهد. این یعنی کم‌کم ناامید شده از اینکه کار بیشتری پیدا کند..» سیاست‌های حاکمیت در دهه‌های اخیر، ساختار اداری را به ابزاری برای پنهان‌سازی بحران بیکاری تبدیل کرده است. عبده تبریزی با اشاره به ریشه‌های این وضعیت و استخدام‌های بی‌ضابطه دولتی در این مصاحبه تاکید کرده است: «آقای احمدی‌نژاد بالای ۱ میلیون نفر را به دستگاه دولت برد؛ این یعنی یک اشتغال پوپولیستی را"}, {"source": "IranWire", "title": "ارتش جمهوری‌اسلامی از آتش‌سوزی یک نفتکش در محدوده تنگه هرمز خبر داد", "link": "https://iranwire.com/fa/news-1/158946-%D8%A7%D8%B1%D8%AA%D8%B4-%D8%AC%D9%85%D9%87%D9%88%D8%B1%DB%8C%D8%A7%D8%B3%D9%84%D8%A7%D9%85%DB%8C-%D8%A7%D8%B2-%D8%A2%D8%AA%D8%B4%D8%B3%D9%88%D8%B2%DB%8C-%DB%8C%DA%A9-%D9%86%D9%81%D8%AA%DA%A9%D8%B4-%D8%AF%D8%B1-%D9%85%D8%AD%D8%AF%D9%88%D8%AF%D9%87-%D8%AA%D9%86%DA%AF%D9%87-%D9%87%D8%B1%D9%85%D8%B2-%D8%AE%D8%A8%D8%B1-%D8%AF%D8%A7%D8%AF/", "summary": "روابط عمومی نیروی دریایی ارتش جمهوری اسلامی از شناسایی یک نفتکش آتش‌گرفته در محدوده‌ای خبر داد که آن را منطقه ممنوعه در آب‌های شرقی تنگه ...", "date_str": "2026-10-16T11:47:46+00:00", "hash": "2a7c487b90d2cc97", "title_fa": "ارتش جمهوری‌اسلامی از آتش‌سوزی یک نفتکش در محدوده تنگه هرمز خبر داد", "summary_fa": "روابط عمومی نیروی دریایی ارتش جمهوری اسلامی از شناسایی یک نفتکش آتش‌گرفته در محدوده‌ای خبر داد که آن را منطقه ممنوعه در آب‌های شرقی تنگه ... بر اساس این روایت، تیم‌های رصد نیروی دریایی ارتش هنگام گشت‌زنی و پایش منطقه، نفتکش آتش‌گرفته را شناسایی کردند. مقام‌های نظامی جمهوری اسلامی علت آتش‌سوزی را مشخص نکرده‌اند و اطلاعاتی درباره نام و پرچم کشتی، شرکت بهره‌بردار، وضعیت  "010956a3478ef571", "title_fa": "وزیر خزانه‌داری آمریکا: حلقه محاصره اقتصادی جمهوری اسلامی تنگ‌تر می‌شود", "summary_fa": "وزیر خزانه‌داری آمریکا، روز پنجشنبه ۲۳مهر۱۴۰۵ اعلام کرد: «حلقه محاصره اقتصاد جمهوری اسلامی تنگ‌تر می‌شود و حتی متحدان به‌اصطلاح این کشور ... به گفته «اسکات بسنت»، وزارت خزانه‌داری «تا زمانی که خزانه حکومت جمهوری اسلامی خالی شود و تمام مسیرهای مالی باقی‌مانده برای پشتیبانی از ماشین جنگی آن قطع شوند، عقب‌نشینی نخواهد کرد.» وزارت خزانه‌داری آمریکا می‌گوید در چارچوب عملیات «طرد اقتصادی»، تلاش‌های جمهوری اسلامی برای نفوذ به نظام مالی بین‌المللی از طریق یک بانک عراقی را مختل کرده است. گفته می‌شود این بانک عراقی از گروه‌های شبه‌نظامی نیابتی جمهوری اسلامی نیز حمایت می‌کند. وزارت خزانه‌داری آمریکا تاکید کرد که با برچیدن این نهادها، در حال قطع جریان‌های درآمدی حیاتی برای تامین مالی نیروهای نظامی و گروه‌های نیابتی جمهوری اسلامی است. این وزارت‌خانه اعلام کرد که شبکه مقابله با جرایم مالی این وزارتخانه در چارچوب عملیات طرد اقتصادی، درباره سوء استفاده احتمالی حکومت ایران از شبکه‌های خیریه مذهبی هشدار داده است. این نهاد از موسسات مالی خواست موارد مشکوک را گزارش دهند. اسکات بسنت، وزیر خزانه‌داری آمریکا، گفت: «وزارت خزانه‌داری تحت رهبری دونالد ترامپ اجازه نخواهد داد حکومت ایران به سابقه طولانی خود در سوءاستفاده از نهادهای مذهبی برای پر کردن جیب نخبگانش و تامین مالی تروریسم ادامه دهد.» اطلاعیه تازه وزارت خزانه‌داری ایالات متحده ۱۶ فرد و ۱۰ نهاد را در ارتباط با ایران به فهرست تحریم‌های اوفک اضافه کرد. افراد تحریم‌شده همگی ایرانی هستند و نهادهای هدف قرارگرفته شامل بانک‌ها، صرافی‌ها و شرکت‌هایی در ایران، عراق و هنگ‌کنگ هستند. در این بخش ایران وایر می‌توانید با مسوولان تماس بگیرید و کارزار خود را برای مشکلات مختلف راه‌اندازی کنید با ایران‌وایر همکاری کنید ویدیوها و مطالب خود را برای ما بفرستید"}, {"source": "IranWire", "title": "نسرین ستوده در روز تولد همسر دربندش: دلتنگ مهربانی‌ها و شوخی‌هایش هستم", "link": "https://iranwire.com/fa/news-1/158933-%D9%86%D8%B3%D8%B1%DB%8C%D9%86-%D8%B3%D8%AA%D9%88%D8%AF%D9%87-%D8%AF%D8%B1-%D8%B1%D9%88%D8%B2-%D8%AA%D9%88%D9%84%D8%AF-%D9%  اینترنتی، از جمله فیلترشکن‌ها، شبکه‌های غیرمتمرکز، ارتباطات همتابه‌همتا و فناوری اتصال مستقیم تلفن‌های همراه به ماهواره، در چارچوب این طرح بررسی خواهد شد. بخش دیگری از این طرح به گسترش آموزش‌های امنیت سایبری و تأمین ابزارهای ارتباطی امن برای روزنامه‌نگاران، مدافعان حقوق بشر و فعالان جامعه مدنی ایران اختصاص دارد. کلادیا تنی در توضیح ضرورت ارائه این طرح گفت جمهوری اسلامی دسترسی آزادانه شهروندان به اطلاعات را تهدیدی برای حفظ قدرت خود می‌داند و به همین دلیل از سانسور، نظارت و قطع اینترنت برای خاموش کردن صدای مخالفان استفاده می‌کند. او تأکید کرد مردم ایران باید بتوانند بدون محدودیت با یکدیگر و جهان خارج ارتباط برقرار کنند، به اطلاعات مستقل دسترسی داشته باشند و موارد نقض حقوق بشر را در معرض دید افکار عمومی جهانی قرار دهند. یاسمین انصاری نیز با اشاره به قطع و محدودسازی مکرر اینترنت از سوی جمهوری اسلامی گفت آزادی بیان و دسترسی بدون محدودیت به اطلاعات از حقوق بنیادین بشر است."}, {"source": "IranWire", "title": "تحریم بانک‌های وابسته به ملت و شهر و شبکه فروش نفت جمهوری‌اسلامی", "link": "https://iranwire.com/fa/news-1/158939-%D8%AA%D8%AD%D8%B1%DB%8C%D9%85-%D8%A8%D8%A7%D9%86%DA%A9%D9%87%D8%A7%DB%8C-%D9%88%D8%A7%D8%A8%D8%B3%D8%AA%D9%87-%D8%A8%D9%87-%D9%85%D9%84%D8%AA-%D9%88-%D8%B4%D9%87%D8%B1-%D9%88-%D8%B4%D8%A8%DA%A9%D9%87-%D9%81%D8%B1%D9%88%D8%B4-%D9%86%D9%81%D8%AA-%D8%AC%D9%85%D9%87%D9%88%D8%B1%DB%8C-%D8%A7%D8%B3%D9%84%D8%A7%D9%85%DB%8C/", "summary": "وزارت خزانه‌داری آمریکا در دور تازه‌ای از تحریم‌ها علیه جمهوری اسلامی، دو بانک فراساحلی وابسته به بانک‌های ملت و شهر، یک بانک عراقی و شب ...", "date_str": "2026-10-16T08:37:04+00:00", "hash": "68f70c444f9334f6", "title_fa": "تحریم بانک‌های وابسته به ملت و شهر و شبکه فروش نفت جمهوری‌اسلامی", "summary_fa": "وزارت خزانه‌داری آمریکا در دور تازه‌ای از تحریم‌ها علیه جمهوری اسلامی، دو بانک فراساحلی وابسته به بانک‌های ملت و شهر، یک بانک عراقی و شب ... این وزارتخانه روز پنج‌شنبه ۲۳ مهر ۱۴۰۵ اعلام کرد که تحریم‌های جدید در چارچوب عملیات موسوم به «طرد اقتصادی» (Operation Economic Outcast) اعمال شده و هدف آن قطع مسیرهای دسترسی جمهوری اسلامی _campaign=rss", "summary": "دادگاهی در بریتانیا یک نوجوان نروژی را به دلیل مشارکت در طرح قتلی مرتبط با جرایم سازمان‌یافته در سوئد و احتمالاً ایران، به ۲۰ سال زندان محکوم کرده است. یوهانس ناتلند، که اکنون ۱۹ سال دارد، پذیرفته بود در ازای دریافت حدود ۳۰ هزار دلار، فردی را که هویتش مشخص نشده بود، به قتل برساند.", "date_str": "2026-10-16T14:23:23+00:00", "hash": "0f05e2c9afb44b40", "title_fa": "محکومیت نوجوان نروژی به ۲۰ سال زندان در بریتانیا به جرم توطئه برای قتل", "summary_fa": "دادگاهی در بریتانیا یک نوجوان نروژی را به دلیل مشارکت در طرح قتلی مرتبط با جرایم سازمان‌یافته در سوئد و احتمالاً ایران، به ۲۰ سال زندان محکوم کرده است. یوهانس ناتلند، که اکنون ۱۹ سال دارد، پذیرفته بود در ازای دریافت حدود ۳۰ هزار دلار، فردی را که هویتش مشخص نشده بود، به قتل برساند. او سال گذشته از سوی شبکه تبهکاری سوئدی «فاکستروت» برای انجام این قتل به کار گرفته شده بود؛ شبکه‌ای که مقام‌های امنیتی غربی آن را به اجرای عملیات خشونت‌آمیز به نیابت از حکومت ایران متهم کرده‌اند. ناتلند به بریتانیا سفر کرد، اما دو روز پس از ورود بازداشت شد. پلیس می‌گوید که نتوانسته است هویت فردی را که قرار بود هدف این طرح قرار بگیرد، مشخص کند. پشت شیشه جایگاه تماشاگران دادگاه وولویچ لندن، زنی سفیدپوش نشسته بود که به محض ورود یوهانس ناتلند به جایگاه متهم، برایش بوسه می‌فرستاد و با دستانش علامت قلب نشان می‌داد. او مادر این جوان ۱۹ساله نروژی بود که در انتظار شنیدن حکم دادگاه نشسته بود. آقای ناتلند به سقف خیره شده بود و زیر لب کلماتی را زمزمه می‌کرد؛ گویی دعا می‌خواند. خانواده و دوستان آقای ناتلند، در کنار خبرنگاران و دادستان، در سکوت منتظر ورود قاضی بودند. لحظاتی بعد، قاضی چیما-گراب وارد شد، همه برخاستند و حکم جوانی که برای انجام یک قتل سفارشی به بریتانیا سفر کرده بود، اعلام شد. یوهانس ناتلند به جرم توطئه برای قتل و جرایم مرتبط با نگهداری دو قبضه سلاح گرم و مهمات، به ۲۰ سال حبس محکوم شد. او قرار بود در ازای دریافت ۲۵ هزار یورو، فردی را در بریتانیا به قتل برساند؛ فردی که هویت او حتی پس از پایان محاکمه نیز مشخص نشده است. اما داستان ناتلند تنها درباره یک قتل نافرجام نیست؛ پرونده او نشان می‌دهد که چگونه شبکه‌های تبهکاری با استفاده از شبکه‌های اجتماعی، نوجوانان"}, {"source": "BBC Persian", "title": "پیروز مجتهدزاده، پژوهشگر جغرافیای سیاسی ایران، درگذشت", "link": "https://www.bbc.com/persian/articles/cm9wz150dvvgo?at_medium=RSS&at_campaign=rss", "summary": "پیروز مجتهدزاده، استاد دانشگاه و پژوهشگر شناخته‌شده جغرافیای سیاسی، روز پنجشنبه ۲۳ مهر، پس از مدتی بیماری، در ۸۰سالگی در لندن درگذشت. او علاوه بر فعالیت‌های دانشگاهی، با اظهارنظرهای صریح و گاه بحث‌برانگیزش درباره تاریخ و سیاست ایران شناخته می‌شد.", "date_str": "2026-10-16T12:56:40+00:00", "hash": "f2b78f8ab4cf7cfa", "title_fa": "پیروز مجتهدزاده، پژوهشگر جغرافیای سیاسی ایران، درگذشت", "summary_fa": "پیروز مجتهدزاده، استاد دانشگاه و پژوهشگر شناخته‌شده جغرافیای سیاسی، روز پنجشنبه ۲۳ مهر، پس از مدتی بیماری، در ۸۰سالگی در لندن درگذشت. او علاوه بر فعالیت‌های دانشگاهی، با اظهارنظرهای صریح و گاه بحث‌برانگیزش درباره تاریخ و سیاست ایران شناخته می‌شد. افشین علا، شاعر و از بستگان مجتهدزاده، با اعلام خبر درگذشت او نوشت که این پژوهشگر روز پنجشنبه ۲۳ مهر، پس از مدتی بیماری، در خارج از ایران چشم از جهان فروبسته است. پیروز مجتهدزاده ۲۰ بهمن ۱۳۲۴ در شهر نور در استان مازندران به دنیا آمد. او تحصیلات دانشگاهی خود را در رشته جغرافیای انسانی و اقتصادی در دانشگاه تهران آغاز کرد و سپس برای ادامه تحصیل به بریتانیا رفت. مجتهدزاده در دانشگاه منچستر در رشته جغرافیای سیاسی تحصیل کرد و پس از آن پژوهش‌های خود را در دانشگاه‌های آکسفورد و لندن ادامه داد. او در خاطراتش نوشته است که سال ۱۳۵۵ برای دریافت دکترا به دانشگاه آکسفورد رفت، اما با قطع بورس تحصیلی‌اش پس از انقلاب سال ۱۳۵۷، تحصیل او متوقف شد. مجتهدزاده در سال ۱۳۶۵ به دانشگاه لندن بازگشت و در حالی که برای تأمین هزینه‌های زندگی و تحصیل کار می‌کرد، سرانجام در سال ۱۳۷۳ دوره دکترای خود را به پایان رساند. پیروز مجتهدزاده هنوز دانشجوی سال سوم دانشگاه تهران بود که نخستین کتاب خود را با عنوان «شیخ‌نشین‌های خلیج فارس» نوشت؛ کتابی که در سال ۱۳۴۹ از سوی انتشارات عطایی منتشر شد. او سال‌ها بعد در خاطرات خود با عنوان «افسانه زندگی» نوشت که انتشار این کتاب توجه علینقی عالیخانی، رئیس وقت دانشگاه تهران، و سیدحسین نصر، معاون آموزش       tech: [{"source": "MIT AI", "title": "State of Supply Chain Sustainability Report finds corporate commitment at record high, but governance lags behind", "link": "https://news.mit.edu/2026/state-of-supply-chain-sustainability-report-1015", "summary": "When corporate leaders discuss climate strategy, the message that still dominates is that, despite competing priorities and external pressures, sustainability matters. According to the 2026 State of Supply Chain Sustainability report from the MIT Sustainable Supply Chain Lab , which surveyed 1,810 supply chain professionals across 91 countries, 83 percent rate sustainability as important or very important to long-term business success, the highest level in the report's seven-year history. But commitment, the report reveals, is not the same as capacity. While 59 percent of respondents report becoming more committed to sustainability following recent U.S. policy shifts that deprioritize environmental concerns, the same organizations are being forced to compromise those commitments. Sixty-eight percent report that tariff uncertainty has compelled them to delay, scale back, or abandon sustainability strategies. Nearly one-third have seen tariff-related disruptions actually increase their operational emissions. \"Commitment is strong, measurement is expanding, and AI is accelerating,\" says Sreedevi Rajagopalan, director of the MIT Sustainable Supply Chain Lab and lead author of the report. \"What comes next is harder: converting commitment into accountability, operational integration into strategic decision-making, and incremental decarbonization into genuine transition.\" The result is a supply chain sustainability agenda stuck between conviction and constraint. Beyond tariffs, more than eight in 10 respondents across North America, Europe, and Asia agree that ongoing geopolitical conflict is reducing the effectiveness of their organization’s climate action. Organizations built decarbonization plans on assumptions of stable trade and relative peace, yet neither assumption is holding. The external disruption reveals an internal vulnerability. Among companies with publicly stated sustainability goals, only 51 percent have established a formal cross-functional sustainability team, which is the governance structure most strongly associated with embedding sustainability into daily decisions. In addition, only 33 percent place sustainability oversight at the board level. Public ambition, in other words, is vastly outrunning internal accountability infrastructure. Companies with formal cross-functional teams report sustainability is \"frequently or always\" built into decisions 57 percent of the time. Where responsibility sits in a single function, that drops to 13 percen", "date_str": "2026-10-15T21:00:00+00:00", "hash": "75aa64c126ae0fa5", "title_fa": "گزارش پایداری زنجیره تامین نشان می‌دهد که تعهد شرکتی در بالاترین حد خود قرار دارد، اما حاکمیت از آن عقب است", "summary_fa": "هنگامی که رهبران شرکت ها درباره استراتژی آب و هوا بحث می کنند، پیامی که همچنان غالب است این است که، علی رغم اولویت های رقابتی و فشارهای خارجی، پایداری اهمیت دارد. بر اساس گزارش وضعیت پایداری زنجیره تامین در سال 2026 از آزمایشگاه زنجیره تامین پایدار MIT، که 1810 متخصص زنجیره تامین را در 91 کشور مورد بررسی قرار داده است، 83 درصد پایداری را برای موفقیت بلندمدت تجاری مهم یا بسیار مهم ارزیابی می‌کند که بالاترین سطح در تاریخ هفت ساله گزارش است. اما این گزارش نشان می‌دهد که تعهد با ظرفیت یکسان نیست. در حالی که 59 درصد از پاسخ دهندگان گزارش می دهند که متعهدتر به پایداری در پی تغییر سیاست های اخیر ایالات متحده است که نگرانی های زیست محیطی را از اولویت خارج می کند، همان سازمان ها مجبور به به خطر انداختن این تعهدات هستند. شصت و هشت درصد گزارش می دهند که عدم قطعیت تعرفه ها آنها را وادار کرده است تا استراتژی های پایداری را به تعویق بیندازند، کاهش دهند یا کنار بگذارند. تقریباً یک سوم شاهد اختلالات مربوط به تعرفه بوده اند که در واقع باعث افزایش انتشار گازهای گلخانه ای آنها شده است. سریدوی راجاگوپالان، مدیر آزمایشگاه زنجیره تامین پایدار MIT و نویسنده اصلی گزارش می‌گوید: «تعهد قوی است، اندازه‌گیری در حال گسترش است، و هوش مصنوعی در حال شتاب است». آنچه در ادامه می آید سخت تر است: تبدیل تعهد به مسئولیت پذیری، ادغام عملیاتی به تصمیم گیری استراتژیک، و کربن زدایی تدریجی به انتقال واقعی. نتیجه یک دستور کار پایداری زنجیره تامین است که بین اعتقاد و محدودیت گیر کرده است. فراتر از تعرفه‌ها، بیش از هشت نفر از هر 10 پاسخ‌دهنده در سراسر آمریکای شمالی، اروپا و آسیا موافق هستند که درگیری‌های ژئوپلیتیکی مداوم، اثربخشی اقدامات اقلیمی سازمانشان را کاهش می‌دهد. سازمان‌ها برنامه‌های کربن‌زدایی را بر"}, {"source": "MIT AI", "title": "AI model decodes the language cells use to communicate", "link": "https://news.mit.edu/2026/ai-model-decodes-language-cells-use-communicate-1015", "summary": "As an embryo develops from a small cluster of stem cells, those once “blank slate” cells begin to take on more specialized roles like brain, liver, or muscle cells, and organize themselves into three-dimensional structures such as tissues and organs. The fate of each cell — what type of specialized cell it will become — depends on which genes are turned on or off in the cell. These patterns of gene activity shape the cell’s structure and function, enabling it to take on a specific role in the body. But this decision isn’t up to individual cells. They constantly send and receive chemical signals to and from neighboring cells, which help them understand where they are, what stage of development they are in, and what they should become. These messages spread through multi-step sequences called signaling pathways, which translate external signals into specific changes in gene activity in the cell. For researchers, being able to retrace the sequence of instructions a cell has received would offer a powerful way to understand how tissues develop and how these processes go awry in disease. But this has been difficult to achieve because scientists have long assumed that the effects of signaling pathways vary widely across cell types, meaning they would need to map each pathway separately in each cell type — an arduous and painstaking process. Now, in a new study led by MIT assistant professor of biology and Whitehead Institute for Biomedical Research member Pulin Li and graduate student Nicholas Hutchins, researchers have discovered that each signaling pathway leaves behind a unique “fingerprint” — a distinctive pattern of gene activity that reflects the particular signals the cell has encountered. Importantly, these fingerprints are consistent across different cell types for the same signaling pathway, which means that instead of mapping each cell type separately, scientists can reconstruct signaling histories across many cell types using these pathway-specific fingerprints. This discovery was made possible through a machine learning model called IRIS. This model can detect fingerprints of different signaling pathways and pinpoint which signals a cell received at different stages of development inside an embryo, even for cell types it hasn’t encountered before. This artificial intelligence-driven approach marks a major advance over traditional methods, which require researchers to experimentally test every pathway in every possible cell type, and opens up the pos", "date_str": "2026-10-15T20:50:00+00:00", "hash": "4670687ef269d3a0", "title_fa": "مدل هوش مصنوعی سلول های زبانی را که برای برقراری ارتباط استفاده می کنند رمزگشایی می کند", "summary_fa": "همانطور که یک جنین از یک خوشه کوچک از سلول‌های بنیادی رشد می‌کند، آن سلول‌هایی که زمانی «لوح خالی» بودند، شروع به ایفای نقش‌های تخصصی‌تر مانند سلول‌های مغز، کبد یا ماهیچه می‌کنند و خود را در ساختارهای سه‌بعدی مانند بافت‌ها و اندام‌ها سازماندهی می‌کنند. سرنوشت هر سلول - به چه نوع سلول تخصصی تبدیل خواهد شد - به این بستگی دارد که کدام ژن در سلول روشن یا خاموش شود. این الگوهای فعالیت ژنی ساختار و عملکرد سلول را شکل می‌دهند و آن را قادر می‌سازند نقش خاصی را در بدن به عهده بگیرند. اما این تصمیم به تک تک سلول ها بستگی ندارد. آنها دائماً سیگنال‌های شیمیایی  باشید، سفارشی کنید و مقیاس آن را داشته باشید در 16 اکتبر 2026 به روز رسانی در GitHub رای مثبت 7 +1 ben burtenshaw burtenshaw دنبال کنید مرو مرو را دنبال کنید Pedro Cuenca pcuenq را دنبال کنید :last-childing را دنبال کنید. صورت! این اولین مدل از آزمایشگاه جدید ایالات متحده، Reflection است، و باز است! این یک مدل ترکیبی از متخصصان (MoEs) با پارامترهای 501B (23B فعال در هر توکن)، از متن به عنوان ورودی پشتیبانی می کند، دارای یک پنجره زمینه از 1M توکن است و تحت مجوز Apache 2.0 منتشر شده است. Beam بر روی کدنویسی و موارد استفاده عامل متمرکز شده است. این برای تیم هایی است که می خواهند یک مدل در مقیاس مرزی روی سخت افزار، زیرساخت یا ابر خود داشته باشند و می خواهند آن را برای موارد استفاده خود سفارشی کنند. Beam با مهارهای مبتنی بر Rust منبع باز اختصاصی خود ارائه می شود که بهترین عملکرد را از مدل ارائه می دهد. Beam دارای یک پیاده سازی ترانسفورماتور بومی و همچنین کتابخانه های پایین دستی مانند vLLM و SGLang است. ما با تیم Reflection کار کرده‌ایم تا دستور العمل‌های استنتاج، SFT (تنظیم دقیق تحت نظارت) و RL (یادگیری تقویتی) را برای شما به ارمغان بیاوریم تا با این مدل برای نیازهای خود بسازید. علاوه بر پشتیبانی روز 0 در ترانسفورماتورها، SGLang و vLLM، این پست به شما نشان می دهد که چگونه آن را اجرا کنید، چگونه آن را آموزش دهید، و چه چیزی را با آن ساخته ایم. Build with Beam Reflection 10000 دلار اعتبار Hub را به بهترین پروژه هایی که از Beam استفاده می کنند اعطا می کند. تنها کاری که باید انجام دهید این است که چیزی بسازید و آن"}, {"source": "HuggingFace Blog", "title": "Granite Switch 4.1: Chat, Decisions, and Speech from One Endpoint", "link": "https://huggingface.co/blog/ibm-granite/granite-switch-4-1", "summary": "", "date_str": "2026-10-15T20:34:01+00:00", "hash": "f7cb24b3b219ab9b", "title_fa": "سوئیچ گرانیتی 4.1: چت، تصمیم گیری و گفتار از یک نقطه پایانی", "summary_fa": "بازگشت به مقالات a]:hidden\"> سوئیچ گرانیتی 4.1: چت، تصمیم‌گیری و سخنرانی از One Endpoint Enterprise مقاله منتشر شده در 15 اکتبر 2026 رای مثبت 26 +20 Kate Soule katesoule دنبال کنید ibm-granite Subhajit Chaudhury sub  سریع در"}, {"source": "TechCrunch Main", "title": "Tesla reveals SpaceX-powered Roadster that flies and falls with style", "link": "https://techcrunch.com/2026/10/15/tesla-reveals-spacex-powered-roadster-that-flies-and-falls-with-style/", "summary": "The new car used thrusters to leap over a Cybercab, Cybertruck, Tesla Semi, Model Y, and Model 3 at a demo in Texas.", "date_str": "2026-10-16T01:17:43+00:00", "hash": "bf26509652546f4d", "title_fa": "تسلا از رودستر اسپیس ایکس رونمایی کرد که با سبکی پرواز و سقوط می کند", "summary_fa": "خودروی جدید از پیشرانه‌ها برای جهش از روی سایبرکاب، سایبرتراک، تسلا نیمه، مدل Y و مدل 3 در تگزاس استفاده کرد. تسلا به تازگی از نسل دوم رودستر بازطراحی شده خود با پیشرانه های اسپیس ایکس رونمایی کرده است، ایلان ماسک، مدیر عامل خودرو، بهترین خودرو را در بین آخرین خودروهای انسان محور معرفی کرده است. ماسک ماشین را در رویدادی در خارج از Waco، تگزاس، با نمایشی به نمایش گذاشت که در آن خودرو از ترکیبی از فن‌ها و پیشرانه‌های پرقدرت برای بالا بردن سطح شیب‌دار معکوس، چرخش به اطراف، و فرود آمدن روی پیاده‌روی پایین استفاده کرد. این خودرو همچنین از پیشرانه‌ها برای بلند کردن خود بر روی یک سایبرکاب، سایبرتراک، تسلا نیمه، مدل Y و مدل 3 در حین حرکت استفاده کرد. ماسک در مورد خودرویی که تسلا شتاب 0 تا 60 مایل در ساعت را در یک ثانیه نشان داد، این خودروی واقعی در جاده ها خواهد بود. این به معنای واقعی کلمه خود را پف می کند، و اوه، و قادر به انجام این کار، این مانورها هر زمان که شما بخواهید. ماسک گفت تسلا در نهایت در سال 2028 خودروی با تاخیر طولانی را خواهد ساخت، اما قیمت آن را ذکر نکرد. تسلا آن را در سه تریم عرضه خواهد کرد. اولین مورد Performance است که تسلا آن را آماده جاده توصیف می کند. دو صندلی دارد، آیرودینامیک فعال دارد و دارای سیستم مکش چند حالته برای عملکرد سطح بعدی در داخل و خارج از پیست است. تریم دوم Thrust است که برای مسابقه آماده است و دارای دو صندلی است و دارای پیشرانه های گاز سرد در عقب است که شتاب 0 تا 60 مایل در ساعت زیر یک ثانیه را امکان پذیر می کند. سومین راکت است که برای هوا آماده است و یک صندلی دارد و دارای 10 رانشگر گاز سرد"}, {"source": "TechCrunch Main", "title": "And the winner of Startup Battlefield at Disrupt 2026 is: Intero Biosystems", "link": "https://techcrunch.com/2026/10/15/and-the-winner-of-startup-battlefield-at-disrupt-2026-is-intero-biosystems/", "summary": "Intero Biosystems beat out 199 other Startup Battlefield companies to take home the $100,000 grand prize at TechCrunch Disrupt 2026.", "date_str": "2026-10-15T23:33:45+00:00", "hash": "bd53f0e2059ad896", "title_fa": "و برنده Startup Battlefield در Disrupt 2026 این است: Intero Biosystems", "summary_fa": "این استارت‌آپ‌ها برای رقابت در Startup Battlefield انتخاب شدند و همه آن‌ها یک دمو زنده را در مقابل VCها و رهبران فناوری که به عنوان داور خدمت می‌کردند ارائه کردند. پس از ساعت‌ها بحث، ویراستاران TechCrunch به بررسی یادداشت‌های داوران پرداختند و فهرست را به پنج فینالیست کاهش دادند: Apate، Flox Intelligence، Intero Biosystems، Industrial Next و Satlyt. پنج نفر پایانی راهی فینال شدند تا نمایشی در مقابل هیئت داوران نهایی ما انجام دهند: Alexa von Tobel از Inspired Capital، Chi-Hua Chien از Goodwater Capital، Dayna Grayson از Construct Capital، Karl Alomar از M13، و Stacy Brown-Philpot از Cherryrock Capital. اکنون آماده اعلام برنده TechCrunch Startup Battlefield 2026 هستیم: Intero Biosystems یک استارت آپ مستقر در دنور است که توسط Charlie Childs و Madeline Eiken تأسیس شده و از دانشگاه میشیگان خارج شده است. این در حال توسعه ارگانوئیدهای 1 میلی متری روده انسان، بافت رشد یافته در آزمایشگاه است که از روده تقلید می کند، و روش دیگری برای مطالعه چگونگی تأثیر داروها و سایر ترکیبات بر بدن انسان قبل از آزمایش روی افراد ارائه می دهد. این استارت آپ محصول شاخص خود، GastroScreen را به شرکت های دارویی، بیوتکنولوژی، مواد غذایی و شیمیایی برای آزمایش داروها و سایر ترکیبات می فروشد. اطلاعات بیشتر در مورد Intero Biosystems را در پست جداگانه ما اینجا بخوانید. Apate یک استارت آپ استرالیایی است که توسط دالی کافر تأسیس شده است، که این ایده را در حین انجام تحقیقات در دانشگاه Macquarie در سیدنی استرالیا مطرح کرد. هزاران عامل هوش مصنوعی را مستقر می کند که به عنوان قربانیان بی گناه ظاهر می شوند، به تماس های کلاهبرداری پاسخ می دهند، به پیام ها و ایمیل های مخفی پاسخ می دهند، پیوندهای فیشینگ را دنبال می کنند و به گروه های رسانه های اجتماعی می پیوندند تا طعمه های کلاهبردار را طعمه"}, {"source": "TechCrunch Main", "title": "Amazon devices chief Panos Panay on the importance of failure and bouncing back from it", "link": "https://techcrunch.com/2026/10/15/amazon-devices-chief-panos-panay-on-the-importance-of-failure-and-bouncing-back-from-it/", "summary": "Panay said that it's possible to recover and learn from all sorts of failures, even catastrophic ones, when building products.", "date_str": "2026-10-15T20:38:13+00:00", "hash": "eae212e2ea8d78e8", "title_fa": "Panos Panay، رئیس دستگاه‌های آمازون در مورد اهمیت شکست و پس‌رفت از آن می‌گوید", "summary_fa": "پانای گفت که هنگام ساخت محصولات می توان از انواع شکست ها، حتی شکست های فاجعه بار، بازیابی کرد و از آنها درس گرفت. Panos Panay، مدیر اجرایی آمازون، پیامی برای بنیانگذاران استارت آپ دارد: شکست یک بخش اجتناب ناپذیر و ضروری در ساخت یک محصول موفق است. پانای، معاون آمازون، معاون دستگاه‌ها، الکسا و لئو، این توصیه‌ها را روی صحنه در TechCrunch Disrupt در سانفرانسیسکو با تکیه بر تجربیات خود در مایکروسافت، جایی که بیش از 19 سال در آنجا گذراند و یک شکست گران قیمت را پشت سر گذاشت، به اشتراک گذاشت. پانای گفت، شما باید مایل به شکست باشید، و در واقع، نه فقط مایل باشید، بلکه در واقع باید شکست بخورید. اگر شکست نخورده اید، احتمالاً از مرزها عبور نکرده اید. این به معنای واقعی کلمه در مورد برداشت درس هایی است که وقتی شکست می خورید. شما باید مایل به رویارویی با آن باشید و همانطور که با آن روبرو می شوید، از آن درس بگیرید. پانای گفت که می توان پس از انواع شکست ها، حتی شکست های فاجعه بار، بهبود یافت، و خاطرنشان کرد که او خودش در مایکروسافت یک مورد را تجربه کرده است. او راه اندازی Surface RT، اولین رایانه لوحی مایکروسافت را به عنوان یک شکست مهم در دوران تصدی خود در این شرکت توصیف کرد، شکستی که در نهایت منجر به کاهش حدود 1 میلیارد دلاری شد. پانای گفت: یادم می آید که روی جلد یک روزنامه بودم و فقط می گفت شکست. اما نکته اینجاست که اعتراف به شکست آسان بود. ترفند این بود و همیشه هست، آیا آموخته‌ها را برداشت کردید و فهمیدید چه اتفاقی افتاده است؟ بسیار خوب. چی یاد گرفتی؟ زیرا شکست در آن لحظه نبود. این تصمیماتی بود که دو سال قبل از آن به آن منجر شد، این که آیا نرم افزار کامل"}, {"source": "TechCrunch Main", "title": "Bluesky wants to make it easier to buy, sell, and fundraise on the network", "link": "https://techcrunch.com/2026/10/15/bluesky-wants-to-make-it-easier-to-buy-sell-and-fundraise-on-the-network/", "summary": "The executives argued that advertising isn’t the only path to monetization, and that there are alternative models that are feasible when it comes to monetization.", "date_str": "2026-10-15T19:29:05+00:00", "hash": "8f17de665e506d0d", "title_fa": "Bluesky می‌خواهد خرید، فروش و جذب سرمایه در شبکه را آسان‌تر کند", "summary_fa": "مدیران استدلال کردند که تبلیغات تنها راه کسب درآمد نیست، و مدل‌های جایگزینی وجود دارد که وقتی صحبت از کسب درآمد می‌شود، امکان‌پذیر است. Bluesky قصد دارد در ماه های آینده پرداخت را معرفی کند، اولین گام در استراتژی خود برای کسب درآمد بدون اتکا به تبلیغات. مدیرعامل تونی اشنایدر و مدیر عامل شرکت رز وانگ برنامه‌های خود را روز پنجشنبه در TechCrunch Disrupt تشریح کردند و توضیح دادند که چگونه این شرکت امیدوار است فعالیت‌های تجاری و جمع‌آوری سرمایه را که قبلاً در شبکه اجتماعی غیرمتمرکز خود انجام می‌داد، توسعه دهد. اشنایدر گفت که مردم در واقع چیزهایی را می فروشند، با موفقیت جمع آوری کمک مالی می کنند، از یکدیگر در شبکه حمایت می کنند. ما می‌خواهیم این کار را آسان‌تر کنیم، و راهی که می‌خواهیم این کار را انجام دهیم این است که اگر چیزی را در شبکه می‌بینید که دوست دارید و از آن پشتیبانی می‌کنید، می‌توانید آن را به صورت پولی پشتیبانی کنید، و ما می‌خواهیم این کار را به گونه‌ای انجام دهیم که برای Bluesky و برای همه برنامه‌های دیگر موجود در آنجا نیز کار کند، به طوری که در کل شبکه کار کند. اشنایدر، مدیرعامل سابق اتوماتتیک، در ماه مارس پس از کناره گیری جی گرابر، مدیرعامل قدیمی این شرکت، زمام امور را به دست گرفت. او در حالی که روی صحنه بود، گفت که از واکنش به انتصاب خود شگفت زده شده است و برخی از کاربران به شوخی می گویند که این آغاز پایانی برای پلتفرم است. این نظرات منعکس کننده ترس از تغییر رهبری تغییرات ناخواسته برای Bluesky بود. اشنایدر گفت که درک می‌کند که اگر شرکت ویژگی‌ها یا تغییراتی را که دوست ندارند، Bluesky را به پلتفرم دیگری ترک کنند، واقعیتی که به گفته او تیم رهبری را برای معرفی کسب درآمد در ماه‌های آینده پاسخگو نگه می‌دارد. وانگ"}, {"source": "TechCrunch Main", "title": "Volvo makes a bigger bet on Nvidia for hands-free automated driving", "link": "https://techcrunch.com/2026/10/15/volvo-makes-a-bigger-bet-on-nvidia/", "summary": "Volvo is leveling up its automated driving system through an expansion of its nearly decade-long partnership with Nvidia that will extend beyond its battery electric vehicles.", "date_str": "2026-10-15T17:34:40+00:00", "hash": "335264ae1aae3f40", "title_fa": "ولوو برای رانندگی خودکار هندزفری شرط بزرگ تری روی انویدیا می گذارد", "summary_fa": "ولوو در حال ارتقای سیستم رانندگی خودکار خود از طریق گسترش همکاری نزدیک به یک دهه خود با انویدیا است که فراتر از وسایل نقلیه الکتریکی باطری آن است. تحت این مشارکت گسترده، ولوو سیستم‌ها و مهندسی ایمنی خودرو خود را با حسگر و معماری محاسباتی Hyperion Nvidia، پشته نرم‌افزار رانندگی Alpamayo و لایه ارزیابی ایمنی Halos ترکیب خواهد کرد. به گفته علی کانی، رئیس بخش خودروسازی انویدیا، پشته Alpamayo اضافی و متنوع است. او گفت که Alpamayo، خانواده‌ای از مدل‌های هوش مصنوعی، مجموعه داده‌ها، و ابزارهای شبیه‌سازی و توسعه مورد استفاده برای ساختن نرم‌افزار رانندگی خودکار، با نرم‌افزار کلاسیک که از یادگیری ماشین و درک دوربین و رادار استفاده می‌کند، ترکیب می‌کند. کانی گفت، نکته این است که ما این دو پشته را به طور همزمان اجرا می کنیم و حسگرهای چندوجهی را در فلسفه خود داریم زیرا از این طریق محصول ایمن تر است، و افزود که نرم افزار منبع باز Alpamayo اکنون توسط بیش از 650000 توسعه دهنده دانلود شده است. ولوو ارزش این شراکت را فاش نکرد یا اینکه کدام مدل خودرو برای اولین بار از این مجموعه فناوری جدید انویدیا استفاده خواهد کرد. اما آلوین باکنز، رئیس توسعه نرم‌افزار ولوو، به مقیاس این معامله و چگونگی نشان‌دهنده تکامل خودروساز به سمت توسعه مجموعه‌ای با تکنولوژی کامل طراحی شده برای خودروهای الکتریکی و همچنین خودروهای هیبریدی پلاگین و خودروهای گازسوز آن اشاره کرد. خودروسازان قبلاً بسیار شبیه توسعه مبتنی بر خط خودرو و کار با تأمین کنندگان مختلف و غیره بودند. باکنز گفت و ما کاملاً تغییر کرده ایم و به یک شرکت فناوری کامل تبدیل شده ایم، باکنز گفت که ولوو این همکاری را با خودرویی کاملاً جدید که در آینده نه چندان نزدیک عرضه خواهد شد، آغاز خواهد کرد."}, {"source": "TechCrunch Main", "title": "SK Hynix bargains for chip equipment exports to its China facility in return for building a factory in US", "link": "https://techcrunch.com/2026/10/15/sk-hynix-bargains-for-chip-equipment-exports-to-its-china-facility-in-return-for-building-a-factory-in-us/", "summary": "SK Hynix’s Solidigm is reportedly seeking U.S. approval to send more chipmaking equipment to China as it weighs building a new NAND chip factory in America.", "date_str": "2026-10-15T16:45:37+00:00", "hash": "f67b1461bdfa4ce1", "title_fa": "SK Hynix برای صادرات تجهیزات تراشه به تاسیسات خود در چین در ازای ساخت کارخانه در ایالات متحده معامله می کند.", "summary_fa": "طبق گزارش‌ها، شرکت SK Hynix، Solidigm، به دنبال تاییدیه ایالات متحده برای ارسال تجهیزات تراشه‌سازی بیشتر به چین است، زیرا در حال بررسی ساخت یک کارخانه جدید تراشه‌های NAND در آمریکا است. به نظر می رسد SK Hynix در آب های متلاطم تولید تراشه ایالات متحده و چین حرکت می کند. رویترز به نقل از منابع ناشناس گزارش داد، واحد حافظه فلش این شرکت، Solidigm، به دنبال مجوز ایالات متحده برای ارسال تجهیزات ساخت تراشه آمریکایی به کارخانه خود در دالیان، چین، به عنوان شرط ادامه ساخت یک کارخانه نیمه هادی در ایالات متحده است. بنا بر گزارش‌ها، Solidigm در حال طرح برنامه‌های خود برای ساخت کارخانه تراشه‌های حافظه فلش NAND در ایالات متحده است و در حال در نظر گرفتن مناطق شمالی نیویورک به عنوان مکانی بالقوه برای این مرکز است. تراشه‌های فلش NAND عمدتاً در درایوهای ذخیره‌سازی حالت جامد استفاده می‌شوند که در همه چیز از لپ‌تاپ و تلفن‌های هوشمند گرفته تا مراکز داده هوش م
