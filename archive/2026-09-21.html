yle base that holds a 20-pound propane tank, and it comes in a variety of colors to match your decor. I tested the black model, which was surprisingly stylish with its contemporary matte finish", "date_str": "2026-09-21T12:00:01+00:00", "hash": "b71bfe7d87b4cc35", "title_fa": "بهترین بخاری های پاسیو در سال 2026", "summary_fa": "وقتی از طریق پیوندهای ما خرید می کنید، Business Insider ممکن است کمیسیون وابسته را دریافت کند. بیشتر بدانید بهترین بخاری های پاسیو به شما امکان می دهد در تمام طول سال از فضای باز لذت ببرید. آنها محکم، بادوام و موثر هستند. Camryn Rabideau/Business Insider فصل پاسیو را با بهترین بخاری های پاسیو تا پاییز و حتی زمستان تمدید کنید تا شما را گرم و برشته نگه دارد. این بخاری‌های قدرتمند در فضای باز، گرمای متمرکزی را ارائه می‌کنند که باعث می‌شود استراحت کردن راحت باشد، چه در حال صرف غذا در فضای باز یا تماشای یک بازی در تلویزیون اختصاصی در فضای باز. بعلاوه، برخلاف چاله‌های آتش‌سوزی سنتی، یکی دیگر از منابع عالی گرما، بخاری‌های پاسیو در عرض چند ثانیه راه‌اندازی می‌شوند و در حین کار دود یا شعله باز تولید نمی‌کنند و استفاده از آن‌ها را در هر فضای بیرونی آسان می‌کند. در حالی که برج‌های رستوران تجاری می‌توانند تا 500 دلار کار کنند، گرم ماندن در فضای باز نیازی به سرمایه‌گذاری هنگفت ندارد - بیش از نیمی از بهترین انتخاب‌های آزمایش‌شده ما کمتر از 200 دلار قیمت دارند و همچنان فهرست‌های ایمنی کامل CSA یا UL را دارند. پس از صحبت با کارشناسان و آزمایش 10 بخاری پاسیو برای خروجی گرما، ایمنی و سهولت استفاده، بهترین انتخاب کلی ما بخاری ایست اوک پاسیو است. این بخاری پروپان به سبک گنبدی فضاهای بزرگ را به سرعت و با قدرت گرم می کند. اگر به دنبال چیزی کوچک و قابل حمل هستید، هیتر مستر هیتر بادی پاسیو یک گزینه کوچک و در عین حال قدرتمند است که قیمت آن زیر 100 دلار است. درباره نحوه آزمایش و تحقیق درباره محصولات خانگی Business Insider Reviews بیشتر بیاموزید. انتخاب های برتر برای بخاری پاسیو بهترین بخاری کلی پاسیو: East Oak 50,000 BTU Heater Patio Out - در آمازون دومین بخاری"}, {"source": "Business Insider", "title": "News outlets Trump banned from White House announce lawsuit", "link": "https://www.businessinsider.com/politico-cnn-msnow-sue-trump-over-white-house-media-ban-2026-9", "summary": "Chip Somodevilla/Getty Images POLITICO, CNN, and MSNOW are suing Trump after their journalists were banned from the White House. The outlets are seeking to immediately restore White House access. They say the ban violates the First and Fifth Amendments. Three news organizations whose journalists were banned from the White House last week are suing President Donald Trump and three top advisers, calling the abrupt lockout a \"direct assault on the First Amendment.\" POLITICO, CNN and MSNOW said in a joint statement Monday that they are bringing the federal lawsuit in a bid to immediately restore access for their reporters, who were denied entry to the White House complex on Saturday and had their credentials confiscated by the Secret Service. \"This morning, we notified the government that we are filing a lawsuit today to protect our First Amendment rights and defend the principle that the government does not decide what the press reports or publishes,\" the news organizations said. \"Without notice or process, the White House revoked our journalists' credentials because it objected to our reporting. Left unchallenged, this threatens press freedom and the public's right to independent journalism free from government interference.\" The organizations are asking a judge on the U.S. District Court in Washington. to quickly rule Trump's ban unconstitutional and prevent his aides from enforcing it. White House and Department of Justice spokespeople did not immediately return requests seeking comment. The White House's exclusion of the journalists followed an announcement from Trump on Truth Social Friday that he was banning reporters for the three outlets \"effective immediately.\" Trump's post was vague about the reasons for the ban , beyond complaining about \"constant 'reporting'\" of what he called \"FAKE NEWS!\" as well as \"FICTION and LIES.\" During an Oval Office photo op Friday, Trump offered few specifics. \"It's really just cumulative stories over the last few years. You get sick of it,\" Trump said. \"They're smart people, but they purposely write negative news.\" The news organizations, represented by Theodore Boutros, Jr. of law firm Gibson Dunn, are filing suit against Trump, chief of staff Susie Wiles, White House Communications Director Steven Cheung and Secret Service Director Sean Curran. The news outlets argue that the president's ban violates the Constitution in multiple ways: The abrupt cancellation of White House access without notice violated the organizati", "date_str": "2026-09-21T11:40:14+00:00", "hash": "daa20eb69c104047", "title_fa": "خبرگزاری‌هایی که ترامپ از حضور در کاخ سفید منع شده‌اند، از شکایت خود خبر دادند", "summary_fa": "Chip Somodevilla/Getty Images POLITICO، CNN و MSNOW از ترامپ پس از محرومیت خبرنگاران خود از کاخ سفید شکایت کردند. این رسانه ها به دنبال بازگرداندن فوری دسترسی به کاخ سفید هستند. آنها می گویند این ممنوعیت متمم اول و پنجم را نقض می کند. سه سازمان خبری که هفته گذشته خبرنگاران آنها از ورود به کاخ سفید منع شدند، از دونالد ترامپ، رئیس جمهور آمریکا و سه مشاور ارشد شکایت کردند و این قفل ناگهانی را \"حمله مستقیم به متمم اول قانون اساسی\" خواندند. POLITICO، CNN و MSNOW روز دوشنبه در بیانیه مشترکی اعلام کردند که شکایت فدرال را در تلاش برای بازگرداندن فوری دسترسی به خبرنگاران خود، که روز شنبه از ورود به مجتمع کاخ سفید ممانعت به عمل آمد و اعتبار آنها توسط سرویس مخفی مصادره شد، مطرح می کنند. این سازمان‌های خبری اعلام کردند: «امروز صبح به دولت اطلاع دادیم که امروز برای حمایت از حقوق متمم اول قانون اساسی خود و دفاع از این اصل که دولت تصمیم نمی‌گیرد مطبوعات چه چیزی را گزارش یا منتشر می‌کنند، شکایت می‌کنیم». کاخ سفید بدون اطلاع قبلی یا روندی، اعتبار روزنامه‌نگاران ما را لغو کرد زیرا با گزارش‌های ما مخالفت کرد. این موضوع آزادی مطبوعات و حق مردم برای روزنامه‌نگاری مستقل و عاری از دخالت دولت را تهدید می‌کند.» این سازمان‌ها از قاضی دادگاه منطقه‌ای ایالات متحده در واشنگتن می‌خواهند تا سریعاً ممنوعیت ترامپ را مغایر قانون اساسی تشخیص دهد و از اجرای آن توسط دستیارانش جلوگیری کند. سخنگویان کاخ سفید و وزارت دادگستری بلافاصله به درخواست‌ها برای اظهار نظر پاسخ ندادند. حذف روزنامه‌نگاران توسط کاخ سفید به دنبال اعلامیه ترامپ در روز جمعه حقیقت اجتماعی مبنی بر ممنوعیت حضور خبرنگاران در این سه رسانه «فوراً مؤثر» صورت گرفت. پست ترامپ در مورد دلایل این ممنوعیت مبهم بود، فراتر از شکایت از «گزارش مداوم» آنچه که او آن را"}, {"source": "Business Insider", "title": "My husband joked, 'I'm going to go from med tech to mermaids?' Now he's the CEO of our daughter's company.", "link": "https://www.businessinsider.com/sydney-myers-glimmer-wish-shark-tank-beauty-brand-2026-9", "summary": "Tiffany Myers daughter made a deal on Shark Tank. Courtesy of Tiffany Myers Tiffany Myers's daughter, Sydney, created a cosmetics company when she was 10. Sydney is now 17, and the company did more than $1 million in sales last year. Sydney attends school remotely to focus on her business, and both her parents work for the company. This as-told-to essay is based on a conversation with Tiffany Myers and her daughter, Sydney Myers, founder of Glimmer Wish . It has been edited for length and clarity . When my daughters were younger, I was incredibly sick. I remember driving and feeling so short of breath that I was worried I would crash the car with my babies in the back. It was terrifying to feel like my body was failing. It took seven years to understand why: I had Lyme disease. After the diagnosis, I changed everything in our lives, from the food we ate to the cleaning products we used. My daughter Sydney was into beauty products and makeup, but I insisted she use only clean products. She hated that the options I offered smelled like tea tree oil or lavender. Those weren't fun for her at all. When Sydney was 10, she came up with the idea for a fun, whimsical beauty line that met my stringent safety standards. That was the start of Glimmer Wish. I learned about manufacturing and ingredients to support Sydney My husband, Byron, is an experienced entrepreneur. He founded a med tech company and grew it over 20 years. So, when Sydney came up with her idea, I encouraged her to talk with her dad. He told her that if she made a business plan, he would help make Glimmer Wish into a business. I started learning even more about product ingredients and manufacturing. Sydney drew the bottles that she wanted: a unicorn and a mermaid. The shapes weren't straightforward, and I had to do a lot of work to find a manufacturer that would create them. While Sydney spearheaded the creative side — like thinking about fragrances — we worked together on creating a list of safe, nontoxic ingredients . It was a combination of art and science. Remote school allows the whole family to be involved in the business In 2020, like lots of families, we moved to a more rural area. Sydney was in 6th grade at the time, and we enrolled her (and our younger daughter, Audrey) in the Laurel Springs School, which is fully online. At the time, I liked that the girls had access to high-quality education . As we've grown Glimmer Wish, having a flexible education has allowed Sydney to attend trade show", "date_str": "2026-09-21T10:37:01+00:00", "hash": "779928ec5b97e0a1", "title_fa": "شوهرم به شوخی گفت، \"من می خواهم از فناوری پزشکی به پری دریایی بروم؟\" حالا او مدیرعامل شرکت دخترمان است.", "summary_fa": "دختر تیفانی مایرز با کوسه تانک معامله کرد. با حسن نیت از تیفانی مایرز، دختر تیفانی مایرز، سیدنی، در 10 سالگی یک شرکت لوازم آرایشی ایجاد کرد. سیدنی اکنون 17 ساله است و این شرکت در سال گذشته بیش از 1 میلیون دلار فروش داشته است. سیدنی برای تمرکز بر کسب و کار خود از راه دور به مدرسه می رود و پدر و مادرش هر دو برای شرکت کار می کنند. این مقاله همانطور که گفته شد بر اساس گفتگو با تیفانی مایرز و دخترش سیدنی مایرز، بنیانگذار Glimmer Wish است. برای طول و وضوح ویرایش شده است. وقتی دخترانم کوچکتر بودند، من به طرز باورنکردنی بیمار بودم. یادم می‌آید رانندگی می‌کردم و احساس تنگی نفس می‌کردم که نگران بودم با ماشین در حالی که بچه‌هایم عقب هستند تصادف کنم. این وحشتناک بود که احساس کنم بدنم از کار افتاده است. هفت سال طول کشید تا بفهمم چرا: من به بیماری لایم مبتلا بودم. پس از تشخیص، همه چیز را در زندگی مان تغییر دادم، از غذایی که می خوردیم تا محصولات پاک کننده ای که استفاده می کردیم. دخترم سیدنی به محصولات زیبایی و آرایش علاقه داشت، اما من اصرار داشتم که او فقط از محصولات تمیز استفاده کند. او از این متنفر بود که گزینه های پیشنهادی من بوی روغن درخت چای یا اسطوخودوس بدهد. اینها اصلاً برای او جالب نبود. وقتی سیدنی 10 ساله بود، ایده یک خط زیبایی جالب و عجیب را به ذهنش رساند که استانداردهای ایمنی سختگیرانه من را برآورده می کرد. این شروع Glimmer Wish بود. من در مورد ساخت و مواد تشکیل دهنده برای حمایت از سیدنی یاد گرفتم شوهرم، بایرون، یک کارآفرین با تجربه است. او یک شرکت فناوری پزشکی تأسیس کرد و آن را بیش از 20 سال رشد داد. بنابراین، وقتی سیدنی ایده اش را مطرح کرد، او"}, {"source": "Business Insider", "title": "They planned their futures around America. The past 12 months have left them rethinking that dream.", "link": "https://www.businessinsider.com/h1b-fallout-foreign-workers-tech-leaving-united-states-relocation-2026-9", "summary": "Rob Dobi for BI Ananya Joshi loved her life in Chicago. After moving from India for a master's degree in biotechnology at Northwestern University, she landed a $75,000-a-year job as a scientist at a lab-grown meat startup in 2024. She was doing research, living in an affordable apartment in a suburb, and road-tripping with friends on weekends. But her life in the US had an expiration date. Joshi's company said it couldn't sponsor her for an H-1B visa . Her Optional Practical Training, or OPT — a work authorization for foreign students — was set to expire in July 2025. She had two choices: She could take a job in Germany and leave behind her partner and life in the US, or race to find a new sponsor. She took the offer and moved in January. \"Having gone through so much turbulence, I really needed the stability to calm down,\" Joshi, 26, told Business Insider. Ananya Joshi, a scientist, moved from the US to Germany after her H-1B plans fell through. Natalia Kepesz for BI Her decision reflects a broader uncertainty that international graduates and foreign workers are facing as they try to build careers in the US while navigating increasingly complex and turbulent immigration policies. The US has long been a magnet for highly skilled workers from around the world, and the H-1B visa has been a gateway to better career opportunities since its introduction in the Immigration Act of 1990. There are about 700,000 people living and working in the US on H-1B visas, according to an analysis by the National Foundation for American Policy. Securing one of these visas has never been easy. Demand far exceeds supply. The US issues 85,000 new H-1Bs each year. For fiscal year 2026, US Citizenship and Immigration Services received nearly 344,000 eligible registrations. There's been an additional layer of uncertainty in the process since the Trump administration began its crackdown on H-1B visas a year ago this month. Joshi is one of more than 20 international graduates and foreign workers Business Insider interviewed over the past year about whether — and how — to build careers in the US amid growing uncertainty over immigration policy. This is the first of weekly installments of \"H-1B Fallout: 1 Year Later,\" a series exploring how foreign workers are navigating the realities, challenges, and trade-offs of advancing their careers amid a rapidly changing US immigration landscape. The administration has said its changes are intended to curb misuse of the H-1B program and protect ", "date_str": "2026-09-21T09:51:01+00:00", "hash": "a0319232e158e9e0", "title_fa": "آنها آینده خود را در اطراف آمریکا برنامه ریزی کردند. 12 ماه گذشته آنها را مجبور به بازاندیشی در این رویا کرده است.", "summary_fa": "راب دوبی برای BI Ananya Joshi عاشق زندگی خود در شیکاگو بود. او پس از مهاجرت از هند برای مدرک کارشناسی ارشد بیوتکنولوژی در دانشگاه نورث وسترن، در سال 2024 به عنوان دانشمند در یک استارتاپ گوشت تولید شده در آزمایشگاه، شغلی با درآمد 75000 دلار در سال پیدا کرد. او در حال انجام تحقیقات بود، در یک آپارتمان مقرون به صرفه در حومه شهر زندگی می کرد و با دوستانش در تعطیلات آخر هفته سفر می کرد. اما زندگی او در آمریکا تاریخ انقضا داشت. شرکت جوشی گفت که نمی‌تواند او را برای ویزای H-1B حمایت کند. دوره آموزشی اختیاری عملی او یا OPT - مجوز کار برای دانشجویان خارجی - قرار بود در ژوئیه 2025 منقضی شود. او دو انتخاب داشت: او می توانست در آلمان شغلی بگیرد و شریک زندگی و زندگی خود را در ایالات متحده پشت سر بگذارد یا برای یافتن حامی جدید رقابت کند. او این پیشنهاد را پذیرفت و در ژانویه نقل مکان کرد. جوشی، 26 ساله، به بیزینس اینسایدر گفت: «با پشت سر گذاشتن این همه آشفتگی، واقعاً به ثبات نیاز داشتم تا آرام شوم. آنانیا جوشی، دانشمند، پس از شکست برنامه های H-1B او از ایالات متحده به آلمان نقل مکان کرد. ناتالیا کپسز برای BI تصمیم او نشان دهنده عدم اطمینان گسترده تری است که فارغ التحصیلان بین المللی و کارگران خارجی در تلاش برای ایجاد مشاغل در ایالات متحده در حالی که سیاست های مهاجرتی پیچیده و متلاطم فزاینده ای را دنبال می کنند، با آن مواجه هستند. ایالات متحده برای مدت طولانی مغناطیسی برای کارگران بسیار ماهر از سراسر جهان بوده است، و ویزای H-1B از زمان معرفی آن در قانون مهاجرت در سال 1990، دروازه‌ای برای فرصت‌های شغلی بهتر بوده است. طبق تحلیل بنیاد ملی سیاست آمریکا، حدود 700000 نفر در ایالات متحده با ویزای H-1B زندگی"}, {"source": "Business Insider", "title": "Kylian Mbappe’s Nike exit is a bad look — and a sign of deeper problems for the company", "link": "https://www.businessinsider.com/nike-stock-struggles-mbappe-on-exit-running-shoe-rivals-hoka-2026-9", "summary": "Alex Caparros/Getty Images Losing global soccer superstar Kylian Mbappe to rival On is just the latest in a line of issues for Nike. The company's turnaround under CEO Elliott Hill hasn't gone as planned, and investors are getting impatient. Sign up for First Trade , Business Insider's daily markets newsletter. If you followed the World Cup this past summer, chances are you saw a blur streak across your screen at least a few times. That was probably Kylian Mbappe, the fleet-footed French striker who buried 10 goals at the tournament, bringing his lifetime total to a record-setting 22. Oh, and did I mention he's still only 27? No stranger to high-profile transfer news, Mbappe shocked the sports world last Friday by switching his sponsorship allegiance from Nike to … On? Apparently the running-shoe company — which has already taken a bite out of Nike sales — is making a push into the World's Game. Let's be clear here: Mbappe didn't leave Nike because the company is struggling. On surely backed up the Brink's truck for him, offering him an irresistible amount of money and a shareholder stake to put his priceless feet in the care of their shoes. But the move still signals that On is ready to play with the big boys — and willing to shell out large sums in order to do so. It shows just how formidable the company has become as a competitor. Mbappe's exodus is merely the latest indignity suffered by Nike, which is being removed from the S P 100 today following a prolonged decline. The company has been a member of the index since 2008, and it's part of a quartet that's being replaced with stocks linked to the AI trade. There are also the longer-term issues that have plagued Nike during Elliott Hill's return as CEO. He was brought back to revitalize the company after an ill-advised foray into direct-to-consumer sales, but his renewed focus on athleticwear and running hasn't panned out. Beyond the rise of running-shoe competitors On and Hoka, Nike has had to contend with a slowdown in China. Shoppers are increasingly turning to local brands, sparking a sales contraction in one of the company's biggest markets. Guidance hasn't been pretty either. Back in April, the company predicted that sales would fall not just in the next quarter, but also for full-year 2026, prompting a wave of analyst-rating downgrades across Wall Street. Shares fell 16% that day to their lowest since 2014. Then, during second-quarter earnings, CFO Matt Friend said Nike is \"not expecting the envi", "date_str": "2026-09-21T09:50:01+00:00", "hash": "cc938418a2a5c0ea", "title_fa": "خروج کیلیان امباپه از نایک ظاهر بدی است - و نشانه ای از مشکلات عمیق تر برای شرکت است", "summary_fa": "الکس کاپاروس/ گتی ایماژ از دست دادن کیلیان امباپه، فوق ستاره جهانی فوتبال در مقابل رقیب آن، آخرین مورد از سری مشکلات نایک است. چرخش شرکت تحت مدیریت الیوت هیل، آنطور که برنامه ریزی شده بود پیش نرفته است و سرمایه گذاران بی تاب شده اند. برای اولین تجارت، خبرنامه بازارهای روزانه Business Insider ثبت نام کنید. اگر جام جهانی تابستان گذشته را دنبال کرده باشید، به احتمال زیاد حداقل چند بار یک رگه تاری در صفحه نمایش خود مشاهده کرده اید. این احتمالاً کیلیان امباپه، مهاجم فرانسوی پا به پای ناوگان بود که 10 گل را در این مسابقات به ثمر رساند و مجموع عمر خود را به رکورد 22 رساند. اوه، و آیا گفتم او هنوز فقط 27 سال دارد؟ امباپه با اخبار مهم نقل و انتقالات غریبه نیست، جمعه گذشته با تغییر وفاداری حمایت مالی خود از نایک به … روشن، دنیای ورزش را شوکه کرد؟ ظاهراً این شرکت تولید کفش های دویدن - که قبلاً از فروش نایک قدری کم کرده است - در حال ایجاد فشار برای ورود به بازی جهانی است. بیایید در اینجا واضح بگوییم: امباپه نایک را ترک نکرد زیرا شرکت در حال مبارزه است. او مطمئناً از کامیون برینک برای او حمایت کرد و به او مقداری غیرقابل مقاومت پول و یک سهام سهامدار پیشنهاد کرد تا پای بی‌ارزش خود را در مراقبت از کفش‌هایشان بگذارد. اما این حرکت همچنان نشان می‌دهد که On آماده است تا با پسران بزرگ بازی کند - و مایل است مبالغ زیادی را برای انجام این کار بپردازد. این نشان می دهد که چقدر شرکت به عنوان یک رقیب قدرتمند شده است. خروج امباپه صرفاً آخرین تحقیر نایکی است که امروز پس از کاهش طولانی مدت از S P 100 حذف شده است. این شرکت از سال 2008 عضو این شاخص بوده است و بخشی"}, {"source": "Business Insider", "title": "2 things you can do to get promoted, according to a PwC exec", "link": "https://www.businessinsider.com/pwc-executive-how-get-promoted-responsiveness-2026-9", "summary": "PwC s Dallas Dolen said responsiveness is critical if you want a promotion. Eternity in an Instant/Getty Images PwC's Dallas Dolen said there are two ways employees can improve their chances of a promotion. Dolen said responsiveness is key, and you have to be willing to \"jump on the plane\" at midnight. Getting face time, he said, is also \"really important.\" An immediate — and effective — response to your boss's Slack could help you land that promotion. PwC's Dallas Dolen has spent the better part of two decades conducting performance reviews and promotion meetings, and he said there are two things workers can do to improve their chances of getting ahead. Dallas Dolen has been at PwC for over two decades. PwC As the leader of the Big Four firm's US technology, media, and telecommunications practice. Dolen oversees a business of about 7,500 people and is based in San Jose. Promotions depend on several factors , he said, including whether colleagues recognize your contributions. Still, he said, employees can take two intentional steps to build a stronger case. The most important, Dolen told Business Insider, is responsiveness. That means answering the call when someone needs help and stepping in, whatever the assignment, Dolen said. He credits some of his own advancement in over 21 years at the firm to a willingness to get the job done, even when the timing was inconvenient. \"You have to be willing to, at midnight, jump on the plane,\" Dolen said. Enjoying the work and being passionate about it helps, he said. However, being responsive and available doesn't mean working all hours of the day and night. In fact, if an employee is too busy, especially in the AI era, where people can use technology to be more productive, it could be a red flag, Dolen said. \"Activity for the sake of activity is not right,\" said Dolen, who is also a PwC tax principal. Dolen said that face time is another critical factor. The executive said he tries to build a collaborative, rather than top-down, team culture and to give everyone an equal chance to spend time with him. He said he tries to make himself \"very accessible.\" If someone asks for 15 or 30 minutes, he always says \"yes,\" he said, and considers that time \"really important.\" While coffee and lunch with a boss can be useful, Dolen said employees can stand out by taking that time to make sure he's on board with a plan, or to explain an idea. \"It's not me making time for them,\" Dolen said. \"It's them making time for me.\" Read the ", "date_str": "2026-09-21T09:38:01+00:00", "hash": "c26df61e333fc481", "title_fa": "طبق گفته یکی از مدیران PwC، 2 کاری که می توانید برای ارتقاء رتبه انجام دهید", "summary_fa": "دالاس دولن، از PwC، گفت که اگر می‌خواهید ارتقاء پیدا کنید، پاسخگویی بسیار مهم است. ابدیت در یک لحظه/ گتی ایماژ دالاس دولن از PwC گفت دو راه وجود دارد که کارمندان می توانند شانس خود را برای ارتقاء ارتقا دهند. دولن گفت پاسخگویی کلیدی است، و شما باید مایل باشید که در نیمه شب \"در هواپیما بپرید\". او گفت که دریافت زمان چهره نیز «واقعاً مهم است». یک پاسخ فوری – و موثر – به Slack رئیستان می‌تواند به شما در رسیدن به این ارتقا کمک کند. دالاس دولن PwC بخش اعظم دو دهه را صرف بررسی عملکرد و جلسات ارتقاء داده است، و او گفت که کارگران می توانند برای بهبود شانس پیشرفت خود دو کار انجام دهند. دالاس دولن بیش از دو دهه در PwC بوده است. PwC به عنوان رهبر شرکت چهار بزرگ در ایالات متحده در زمینه فناوری، رسانه و ارتباطات راه دور. دولن بر تجارتی با حدود 7500 نفر نظارت دارد و در سن خوزه مستقر است. او گفت که ارتقاء به عوامل مختلفی بستگی دارد، از جمله اینکه آیا همکاران مشارکت شما را تشخیص می دهند یا خیر. با این حال، به گفته او، کارمندان می توانند دو گام عمدی برای ایجاد یک پرونده قوی تر بردارند. دولن به Business Insider گفت که مهمترین آن پاسخگویی است. دولن گفت، این به این معنی است که وقتی کسی نیاز به کمک دارد به تماس پاسخ داده و وارد عمل شود، هر تکلیفی که باشد. او برخی از پیشرفت های خود در بیش از 21 سال در شرکت را به دلیل تمایل به انجام کار، حتی زمانی که زمان نامناسب بود، می داند. دولن گفت: \"شما باید مایل باشید که در نیمه شب، در هواپیما بپرید.\" او گفت که لذت بردن از کار و اشتیاق به آن کمک می کند. با این حال، پاسخگو بودن"}, {"source": "Business Insider", "title": "This artist hacked a CitiBike to make NYC's affordability crisis harder to ignore", "link": "https://www.businessinsider.com/nyc-housing-costs-affordability-crisis-citibike-artist-project-justin-blinder-2026-9", "summary": "Justin Blinder riding a CitiBike. Blinder created a device that makes it more difficult to pedal in rent-burdened areas of New York City. Justin Blinder Justin Blinder created a device that makes it harder to pedal in rent-burdened areas of NYC. The device, called \"Ground Truth,\" has a custom map and attaches to any CitiBike in the city. Blinder's invention comes as NYC reckons with an affordability crisis. Justin Blinder was lugging Taco Bell burritos from neighborhood to neighborhood on his bike for his Uber Eats gig in 2020, watching as skyscrapers and modular apartment buildings gave way to brown-bricked housing projects and cracked streets. It made the Brooklyn-based artist and software developer think viscerally about affordability , and how abstracted the concept had become in modern discourse. \"We're sort of confronted with that via top-down maps, and it really doesn't touch upon the lived experience,\" Blinder told Business Insider. \"That was sort of like the seed of the project.\" \"The project,\" as Blinder describes it, is a 3D printed CitiBike attachment that adjusts pedal resistance depending on how rent-burdened the surrounding neighborhood is. With the device attached to a CitiBike, a rider can glide through parts of the Big Apple where renters give less of their paychecks to landlords. In areas where renters give more — many parts of the Bronx, for instance — the device applies the brakes. Blinder said the device is meant to physically tie riders to high rent prices in the city. He said that too often, real problems in the world become innocuous data points that are read online and forgotten about soon after. \"It's so easy to just reduce people to numbers and forget that each is somebody's sister or child, and these people have names and stories ,\" Blinder said. The device earned Blinder a $10,000 grant from Idle Hands, an artistic philanthropic organization, this year. It did not, however, impress CitiBike . A spokesperson for Lyft, which owns CitiBike, told Business Insider that CitiBike's terms of service prohibit modification of any bikes. \"You may not modify, dismantle, write on, or otherwise alter or deface a Bicycle or any part of a Bicycle in any way,\" the terms say. Affordability It's no secret that people struggle to pay rent in NYC. An NYU Furman report found that \"over half\" of renter households in NYC spent more than 30% of their yearly income on rent in 2024 — a benchmark the study's authors, as well as Blinder, classify as rent-", "date_str": "2026-09-21T09:31:01+00:00", "hash": "7174be9cac028408", "title_fa": "این هنرمند سیتی‌بایک را هک کرد تا نادیده گرفتن بحران مقرون‌به‌صرفه نیویورک را سخت‌تر کند.", "summary_fa": "جاستین بلایندر سوار بر سیتی بایک. بلیندر دستگاهی ساخت که پدال زدن در مناطق اجاره‌ای شهر نیویورک را دشوارتر می‌کند. جاستین بلیندر جاستین بلیندر دستگاهی ساخت که رکاب زدن را در مناطق اجاره‌ای نیویورک سخت‌تر می‌کند. این دستگاه که \"Ground Truth\" نام دارد دارای یک نقشه سفارشی است و به هر سیتی بایک در شهر متصل می شود. اختراع بلیندر در حالی صورت می‌گیرد که نیویورک با بحران مقرون‌به‌صرفه مواجه است. جاستین بلیندر برای کنسرت Uber Eats در سال 2020، از محله‌ای به محله دیگر با دوچرخه‌های تاکو بل بوریتو می‌برد و تماشا می‌کرد که آسمان‌خراش‌ها و ساختمان‌های آپارتمانی مدولار جای خود را به پروژه‌های مسکن با آجر قهوه‌ای و خیابان‌های ترک خورده می‌دادند. این باعث شد که هنرمند و توسعه‌دهنده نرم‌افزار مستقر در بروکلین به طور کلی درباره مقرون به صرفه بودن فکر کند و این مفهوم چقدر در گفتمان مدرن انتزاعی شده بود. بلیندر به Business Insider گفت: «ما به نوعی از طریق نقشه‌های بالا به پایین با آن مواجه می‌شویم، و این واقعاً به تجربه‌ای که زندگی می‌کنیم، تأثیری ندارد. \"این به نوعی شبیه بذر پروژه بود.\" همانطور که بلیندر توضیح می دهد، \"پروژه\" یک پیوست سیتی بایک چاپ شده سه بعدی است که مقاومت پدال را بسته به میزان بار اجاره ای محله اطراف تنظیم می کند. با دستگاه متصل به سیتی‌بایک، سوارکار می‌تواند از قسمت‌هایی از اپل بزرگ عبور کند، جایی که اجاره‌کنندگان چک‌های کمتری را به صاحبخانه می‌دهند. در مناطقی که اجاره‌کنندگان بیشتر می‌دهند - به عنوان مثال، بسیاری از بخش‌های برانکس - دستگاه ترمز می‌گیرد. بلایندر گفت که این دستگاه به منظور ارتباط فیزیکی سوارکاران با قیمت های بالای اجاره در شهر است. او گفت که اغلب، مشکلات واقعی در جهان به نقاط داده بی ضرر تبدیل می شوند که به صورت آنلاین خوانده می شوند و به زودی فراموش می شوند. بلایندر"}, {"source": "Business Insider", "title": "I'm a CEO who's rejected tons of AI applications. AI writing isn't an automatic disqualifier, but there's a line.", "link": "https://www.businessinsider.com/how-to-tell-job-application-written-by-ai-according-ceo-2026-9", "summary": "Matt Stauffer said there were a few dead giveaways for AI applications he recieved. Courtesy of Matt Stauffer CEO Matt Stauffer received over 700 applications for his open project manager job posting. He quickly noticed similarities between applications and realized many were AI. \"Signs of AI writing does not mean you won't get a job with us, but there is a line,\" he said. This as-told-to essay is based on conversations with Matt Stauffer, a 41-year-old CEO of Tighten, a programming company. He is based in Atlanta. His words have been edited for length and clarity. I'm the CEO of a small programming company. I recently did my first full round of hiring in the age of AI. Reading through applications and narrowing down the pile has always been a time-consuming process. This time, it was significantly harder. We always try to include some personal, fun questions in an application to get a sense of who someone is. This hiring round, I put it to a higher degree because we're trying to understand people's humanity a little more now with AI. How do they communicate, what are they passionate about, and how do they communicate about what they're passionate about? We had 703 applications for an open project manager role, and I read all of them. About 30 applications in, I could tell some of them were fully AI. Everybody has a different relationship with AI, and we're open to people at varying levels of engagement, as long as your brain is still involved and the final output is good. Having signs of AI writing does not mean you won't get a job with us, but there is a line. I tried to make the job application more personal this time On August 29, I went live with my project manager job posting. We're a remote company of around 15 full-time team members , and because we're fully remote, much of our interaction happens over Zoom or in writing. We wanted to suss out who's capable of doing those things at a professional level. We can't talk to over 700 people, but we want to really understand them as people as much as possible, while still trying to honor the time that applicants are taking out of their day. Especially right now, when the hiring world is miserable, and a lot of people are filling out thousands of applications. Some of the personal questions I included in the application were things like, \" How do you pronounce GIF?\" There's no right answer; it's just for fun to see how they engage with the question. Other questions include, \"What's your favorite movie?\" \"", "date_str": "2026-09-21T09:30:01+00:00", "hash": "0fd0f5f93c84aaf5", "title_fa": "من مدیر عاملی هستم که هزاران برنامه هوش مصنوعی را رد کرده ام. نوشتن هوش مصنوعی یک رد صلاحیت خودکار نیست، اما یک خط وجود دارد.", "summary_fa": "مت استافر گفت که چند هدایای مرده برای برنامه‌های هوش مصنوعی دریافت کرده است. مت استافر مدیر عامل شرکت مت استافر بیش از 700 درخواست برای پست شغلی مدیر پروژه باز خود دریافت کرد. او به سرعت متوجه شباهت های بین برنامه ها شد و متوجه شد که بسیاری از آنها هوش مصنوعی هستند. او گفت: \"علائم نوشتن هوش مصنوعی به این معنی نیست که شما با ما شغلی پیدا نمی کنید، اما یک خط وجود دارد.\" این مقاله گفته شده بر اساس گفتگو با مت استافر، مدیر عامل 41 ساله Tighten، یک شرکت برنامه نویسی است. او در آتلانتا مستقر است. کلمات او برای طولانی و وضوح ویرایش شده است. من مدیرعامل یک شرکت برنامه نویسی کوچک هستم. من اخیراً اولین دور کامل استخدامم را در عصر هوش مصنوعی انجام دادم. خواندن از طریق برنامه ها و محدود کردن انبوه همیشه یک فرآیند زمان بر بوده است. این بار به طور قابل توجهی سخت تر بود. ما همیشه سعی می‌کنیم سؤالات شخصی و سرگرم‌کننده را در یک برنامه قرار دهیم تا بفهمیم کسی چه کسی است. این دور استخدام، من آن را در درجه بالاتری قرار دادم، زیرا اکنون با هوش مصنوعی سعی می کنیم انسانیت مردم را کمی بیشتر درک کنیم. آنها چگونه ارتباط برقرار می کنند، به چه چیزی علاقه دارند، و چگونه در مورد چیزی که به آن علاقه دارند ارتباط برقرار می کنند؟ ما 703 درخواست برای نقش مدیر پروژه باز داشتیم و من همه آنها را خواندم. حدود 30 برنامه کاربردی، می توانم بگویم که برخی از آنها کاملاً هوش مصنوعی هستند. هرکسی رابطه متفاوتی با هوش مصنوعی دارد، و تا زمانی که مغز شما هنوز درگیر باشد و خروجی نهایی خوب باشد، ما پذیرای افراد در سطوح مختلف تعامل هستیم. داشتن نشانه هایی از نوشتن هوش مصنوعی به این معنی نیست که با"}, {"source": "Business Insider", "title": "A $750 million hedge fund manager shares the 4 things he’s watching as energy markets teeter", "link": "https://markets.businessinsider.com/news/commodities/commodities-fund-manager-oil-prices-iran-war-strategic-reserves-energy-2026-9", "summary": "Jeffrey Baird, Managing Partner of Merritt Point Partners Merritt Point Partners Oil markets have avoided catastrophe after six months of war, but the situation is becoming grim. An expert commodities trader explained the four things he's watching, and what's kept prices down. The situation going forward is even more uncertain, said Baird. Shortly after the US military's late February strike on Iran and the following Strait of Hormuz blockade, oil seemed poised to reach record heights if the war continued. Instead, the oil markets have settled at an expensive —but not catastrophic — $100-ish a barrel, much lower than what hedge fund manager Jeff Baird would have expected after six months of war. Baird has spent 25 years trading commodities and runs Merritt Point Partners, a $750 million hedge fund specializing in the asset class. Their general commodity strategy, which uses a range of long and short options across a variety of commodities, has returned over 16% in the last twelve months, according to a person familiar with the matter. That experience has taught Baird to \"adopt an attitude of humility when confronted with things that have never happened before,\" he said. Doubly so when the industry is facing huge amounts of uncertainty after becoming accustomed to real-time inventory data and satellite tracking of cargo in recent years. JPMorgan oil market analysts laid it plainly in a report this week, saying that for the first time since the conflict began, they \"don't have a baseline view.\" \"We simply don't know how to model the endgame,\" the Thursday report said. Baird agreed that \"we don't know what's going to happen.\" But that doesn't mean there aren't signals to watch. He identified three main price-moderating forces: heavy reliance on strategic petroleum reserves, a decrease in oil demand for some countries, and China stepping back from oil market purchases. Now, those same three factors will be important signals as to just how much longer oil can stay away from record prices. And while we may not know what China will do or whether oil demand will spike back up, we do know that time is running out for the US Strategic Petroleum Reserve. \"Can we continue to draw and rely on them for a couple of months? Probably,\" Baird said. \"But six more months? We're going to have to do something else,\" Baird said. \"We can't just rely on inventories at that point.\" Here are 4 things to watch: Strategic petroleum reserves Over the last five months, the US Strategic ", "date_str": "2026-09-21T09:00:01+00:00", "hash": "bdd2b814c8fff163", "title_fa": "یک مدیر صندوق تامینی 750 میلیون دلاری 4 چیزی را که در حال تماشای بازارهای انرژی است به اشتراک می گذارد", "summary_fa": "جفری بیرد، شریک مدیر شرکت Merritt Point Partners Merritt Point Partners بازارهای نفت پس از شش ماه جنگ از فاجعه اجتناب کردند، اما وضعیت در حال بدتر شدن است. یک تاجر کالاهای خبره چهار مورد را که در حال تماشای آن است و آنچه که قیمت ها را پایین نگه داشته است توضیح داد. بیرد گفت که وضعیت آینده حتی نامشخص تر است. اندکی پس از حمله نظامی آمریکا در اواخر فوریه به ایران و پس از آن، محاصره تنگه هرمز، به نظر می‌رسید که در صورت ادامه جنگ، نفت به بالاترین حد خود برسد. در عوض، بازارهای نفت به قیمت 100 دلار در هر بشکه گران - اما نه فاجعه بار - بسیار پایین تر از آن چیزی است که جف بیرد، مدیر صندوق تامینی پس از شش ماه جنگ، انتظار داشت. بیرد 25 سال را صرف تجارت کالاها کرده است و Merritt Point Partners را اداره می کند، یک صندوق تامینی 750 میلیون دلاری که متخصص در طبقه دارایی است. به گفته یک فرد آشنا، استراتژی کالای کلی آنها، که از طیف وسیعی از گزینه های بلند و کوتاه در کالاهای مختلف استفاده می کند، در دوازده ماه گذشته بیش از 16 درصد بازده داشته است. او گفت که این تجربه به بیرد آموخته است که \"در مواجهه با چیزهایی که قبلا هرگز اتفاق نیفتاده است، نگرش فروتنانه را اتخاذ کند.\" زمانی که صنعت پس از عادت کردن به داده‌های موجودی موجودی در زمان واقعی و ردیابی ماهواره‌ای محموله در سال‌های اخیر، با حجم عظیمی از عدم قطعیت مواجه است، دو برابر می‌شود. تحلیلگران بازار نفت جی پی مورگان در گزارشی که این هفته منتشر کردند به صراحت آن را بیان کردند و گفتند که برای اولین بار از زمان آغاز مناقشه، آنها «نگاه پایه ای ندارند». در گزارش پنجشنبه آمده است: «ما به سادگی نمی دانیم چگونه"}, {"source": "Business Insider", "title": "The rise of grandmaslop is tearing families apart", "link": "https://www.businessinsider.com/grandparents-ai-images-grandkids-privacy-parents-2026-9", "summary": "A Getty stock photograph of two children put through ChatGPT with the prompt Turn this image into Polar Express Christmas special. Getty Images; ChatGPT Alyssa Powell/BI When Ben Metcalfe recently visited his grandparents, he was greeted by an AI-generated caricature of one of their family photos hanging on the kitchen wall. \"I understand that there was good intention behind doing it,\" says Metcalfe, a Gen Zer who works in AI governance. \"At the same time, it's a major privacy concern.\" Jen, a 32-year-old mom, tells me that last Christmas her mom texted her a series of adorable images: Jen's two toddlers sitting in Santa's lap, then riding the Polar Express. Their cheeks were fuller than she knew them to be, their eyes glossier, the lighting pristine — all thanks to Grok, xAI's chatbot. \"It's so cute. And I want to love it,\" she tells me. But it was too unsettling to embrace. Jen, whose name has been changed to avoid sparking more family drama, says she's read news about Grok generating sexual abuse material , and worries about how the bot could use her children's faces in the future. It's not just her mom. For Mother's Day, a friend sent her a coloring sheet with her kids' faces, and her brother-in-law used AI to add one of her kids to a family photo who had been covered by a stroller, napping, when it was taken, she says. Everyone means well, Jen says, but they're walking blindly into a big risk, and the technology is so new, she isn't even sure what boundaries are best to set around how loved ones use her children's images with AI. \"We all aren't educated enough about what AI companies are doing with our content,\" she says. Welcome to the intergenerational slop fight. In one corner are growing ranks of lawmakers calling for kids to be booted from social media , and parents concerned about data privacy opting to share less with AI companies and social media platforms. Europe is considering regulations that would limit chatbot and AI companion access to those younger than 15. In the other corner are parents, grandparents, aunts, uncles, and friends who are uploading millions of images of kids into AI generators, delighting at the uncanny output, and sharing them far and wide. They use AI to make custom gags, generating portraits of the family, sending eCards and making toys, T-shirts, tchotchkes, and children's books through websites that encourage and profit from this very oversharing, making personalization a selling point. To some, it's endearing; to o", "date_str": "2026-09-21T08:11:01+00:00", "hash": "295b56994ce7e3c4", "title_fa": "ظهور grandmaslop خانواده ها را از هم می پاشد", "summary_fa": "یک عکس استوک گتی از دو کودک که در ChatGPT با اعلان قرار داده شده است. این تصویر را به ویژه کریسمس Polar Express تبدیل کنید. گتی ایماژ; ChatGPT آلیسا پاول/BI هنگامی که بن متکالف اخیراً به دیدار پدربزرگ و مادربزرگش رفت، با یک کاریکاتور ساخته شده توسط هوش مصنوعی از یکی از عکس های خانوادگی آنها که روی دیوار آشپزخانه آویزان شده بود، استقبال شد. متكالف، ژنرال زر كه در حوزه حاكميت هوش مصنوعي كار مي‌كند، مي‌گويد: «من مي‌دانم كه در پشت انجام آن نيت خوبي وجود داشت. \"در عین حال، این یک نگرانی بزرگ برای حفظ حریم خصوصی است.\" جن، یک مادر 32 ساله، به من می‌گوید که کریسمس گذشته مادرش یک سری تصاویر شایان ستایش برای او پیامک فرستاد: دو کودک نوپا جن در آغوش بابانوئل نشسته‌اند و سپس سوار قطار سریع السیر قطبی شدند. گونه‌های آن‌ها پرتر از آن چیزی بود که او می‌دانست، چشمانشان براق‌تر، نورپردازی بکر - همه اینها به لطف Grok، ربات چت xAI بود. او به من می گوید: \"خیلی بامزه است. و من می خواهم آن را دوست داشته باشم.\" اما برای در آغوش گرفتن خیلی ناراحت کننده بود. جن، که نامش برای جلوگیری از جرقه زدن درام خانوادگی بیشتر تغییر کرده است، می‌گوید اخبار مربوط به تولید مواد آزار جنسی توسط گروک را خوانده است و نگران این است که این ربات چگونه می‌تواند از چهره فرزندانش در آینده استفاده کند. فقط مادرش نیست. او می‌گوید برای روز مادر، یکی از دوستانش یک برگه رنگ‌آمیزی با صورت بچه‌هایش برای او فرستاد و برادر شوهرش از هوش مصنوعی استفاده کرد تا یکی از بچه‌هایش را به یک عکس خانوادگی اضافه کند که هنگام گرفتن آن توسط کالسکه پوشانده شده بود و چرت می‌زد. جن می‌گوید همه منظورشان خوب است، اما آنها کورکورانه وارد یک خطر بزرگ می‌شوند، و این فناوری آنقدر"}, {"source": "Business Insider", "title": "The US wants an AI-era 'red phone' with China", "link": "https://www.businessinsider.com/trump-xi-meeting-summit-us-china-ai-safety-risk-mechanism-2026-9", "summary": "Treasury Secretary Scott Bessent said a proposed US-China AI dialogue would focus on AI-related national security incidents. Eduardo Munoz Alvarez/Getty Images The US is pushing for a direct AI safety channel with China, even amid an intensifying rivalry. Washington wants a direct US-China channel for major AI-related national security incidents. The proposal comes as a growing AI safety debate puts catastrophic risks back in the spotlight. The US has proposed a direct channel with China to notify both governments of major AI-related national security incidents even as their AI rivalry intensifies. Treasury Secretary Scott Bessent said the proposal was made during talks in New York on Sunday with Chinese Vice Premier He Lifeng. Their discussion came ahead of President Donald Trump's summit with Chinese leader Xi Jinping in Washington on Thursday. \"The US has proposed that we have a notification mechanism between the two countries, and we want a shared vision of common goals and common threats,\" Bessent told reporters. He said the proposal would be part of a new \"US-China AI dialogue\" focused on national security incidents involving AI. \"We think that, just like with any cross-border activity, that moving from opaque to more transparency between the number one and the number two AI powers in the world is very important,\" Bessent said. The proposal comes amid a broader debate over AI safety. In recent weeks, prominent AI researchers, executives, and some lawmakers have renewed warnings about increasingly capable AI systems, arguing that governments should work together to reduce the risk of catastrophic misuse. China stopped short of publicly endorsing the proposal. State news agency Xinhua described the talks a ستیم. او گفت که این پیشنهاد بخشی از یک \"گفتگوی جدید هوش مصنوعی آمریکا و چین\" خواهد بود که بر حوادث امنیت ملی مرتبط با هوش مصنوعی متمرکز است. بسنت گفت: \"ما فکر می کنیم، درست مانند هر فعالیت فرامرزی، حرکت از مبهم به شفافیت بیشتر بین قدرت های شماره یک و شماره دو هوش مصنوعی در جهان بسیار مهم است.\" این پیشنهاد در بحبوحه بحث گسترده تر در مورد ایمنی هوش مصنوعی ارائه می شود. در هفته‌های اخیر، محققان برجسته هوش مصنوعی، مدیران اجرایی و برخی قانون‌گذاران"}, {"source": "Business Insider", "title": "Ukraine's answer to Russia's new jet-powered drones takes a Shahed-like form", "link": "https://www.businessinsider.com/ukrainian-answer-russias-jet-powered-drones-interceptor-shahed-form-2026-9", "summary": "An unnamed delta-wing interceptor drone prepares for launch via catapult. Screenshot via X/Security Service of Ukraine and Volodymyr Zelenskyy s office Ukraine's new interceptor drone for fighting Russia's latest Gerans almost looks like a Shahed. It comes as Kyiv has been calling for new drones to take down newer, turbojet Gerans that fly faster. Ukraine said this drone intercepted a Geran-5, which flies at speeds of up to 373 mph. Ukraine has revealed a new interceptor built to take down Russia's latest jet-powered drones, and it features a design that loosely resembles the Shaheds that Moscow uses extensively in the war. Ukrainian President Volodymyr Zelenskyy posted footage of the interceptor on Saturday, saying it was \"successfully deployed\" in an operation by the Security Service of Ukraine, or SBU. Video shows a delta-wing drone being launched from a rail catapult and whizzing over open fields. The uncrewed vehicle appears to have an exhaust outlet on its chassis, indicating it uses a turbojet engine to reach higher speeds. The delta-wing form and turbojet are a departure from the bullet-shaped quadcopters that have dominated Ukrainian interceptor designs — a sign of how Kyiv is looking to solutions further afield to deal with newer Russian drones. Thermal footage apparently captured by its camera shows the interceptor approaching a winged drone with a heat signature on its tail, indicating that the target is also propelled by a turbojet. Report from SSU Head Oleksandr Poklad. There is a good result from the Security Service’s military counterintelligence in defending against jet-powered “shaheds.” A new interceptor drone has been developed and has already been successfully deployed. Step by step, we are moving… pic.twitter.com/cIFp7mThwf — Volodymyr Zelenskyy / Володимир Зеленський (@ZelenskyyUa) September 19, 2026 The SBU identified the drone as a Geran-5, one of Russia's most advanced attack drones that Ukrainian intelligence said can fly at speeds of up to 373 mph with a 200-pound explosive warhead. On Sunday, it posted a clip of a separate takedown, saying it had successfully used the interceptor to destroy a second Geran-5. Zelenskyy said the new Ukrainian interceptor is designed for defending against \"jet-powered 'Shaheds.'\" The Geran-5 isn't modeled after the Shahed, the Iranian delta-wing drone, and is instead thought to be Russia's version of the Karrar attack drone. But \"Shahed\" has come to be a colloquial blanket term for any Russian lon", "date_str": "2026-09-21T05:37:06+00:00", "hash": "d1c109475c56fe03", "title_fa": "پاسخ اوکراین به پهپادهای جدید جت روسیه شکلی شبیه شاهد دارد", "summary_fa": "یک پهپاد رهگیر ناشناس با بال دلتا برای پرتاب از طریق منجنیق آماده می شود. اسکرین شات از طریق X/Security Service of Ukraine و دفتر ولودیمیر زلنسکی پهپاد رهگیر جدید اوکراین برای مبارزه با جدیدترین Gerans روسیه تقریباً شبیه یک شاهد است. این در حالی است که کیف خواستار هواپیماهای بدون سرنشین جدید برای سرنگونی هواپیماهای جدیدتر و توربوجت‌هایی است که سریع‌تر پرواز می‌کنند. اوکراین گفت این پهپاد یک Geran-5 را که با سرعت 373 مایل در ساعت پرواز می کند، رهگیری کرده است. اوکراین یک رهگیر جدید ساخته است که برای سرنگونی جدیدترین پهپادهای جت روسیه ساخته شده است و دارای طراحی است که شباهت زیادی به شاهدهایی دارد که مسکو به طور گسترده در blished Friday, came after the Federal Reserve raised interest rates last week and signaled another hike could come later this year. That has extended a selloff in Treasurys, sending long-term yields to their highest levels in more than two decades. However, higher rates haven't necessarily undermined the AI boom, Sehgal said. Instead, higher interest payments have put more money in the hands of savers, who have in turn financed AI infrastructure investment. Against that backdrop, Sehgal sees more upside in AI infrastructure than long-dated Treasurys. While bond yields could fall modestly from current levels, he said AI investments \"can go up multiplicatively.\" He also distinguished AI infrastructure from the broader market, saying tighter monetary policy could still weigh on equities outside the AI trade. \"I think long compute just makes a lot of sense to me here,\" he said. \"But does that mean that the broader equity complex should do very well? It's less clear.\" US debt fears are overblown Sehgal also argued investors have become too focused on Washington's fiscal deficits. He argued that a growing share of government spending reflects higher interest payments to investors rather than new spending flowing into the broader economy. \"That does not accrue to labor. That accrues to capital. That accrues to the top decile of wage earners,\" Sehgal said. He noted annual deficits have hovered around 6% to 7% of GDP, while nominal GDP has also grown by roughly 6% a year over the past four years, limiting the deterioration in the debt-to-GDP ratio. \"I don't think the sustainability issue is really that credible in the long run,\" Sehgal said. Read the original article on Bu", "date_str": "2026-09-21T05:28:42+00:00", "hash": "57921ac3c28039fc", "title_fa": "چرا گلدمن ساکس هنوز زیرساخت هوش مصنوعی را به 5 درصد اوراق خزانه ترجیح می دهد", "summary_fa": "آخرین افزایش نرخ بهره فدرال رزرو باعث افزایش فروش در اوراق خزانه با قدمت طولانی شد. تیموتی کلاری/ خبرگزاری فرانسه/ گتی ایماژ گلدمن ساکس همچنان زیرساخت های هوش مصنوعی را به خزانه های بلندمدت ترجیح می دهد. بازده اوراق قرضه بالاتر سرمایه بیشتری را به هوش مصنوعی هدایت می کند. نگرانی در مورد مسیر بدهی آمریکا بیش از حد است. به گفته یکی از مدیران گلدمن ساکس، بازدهی بلندمدت خزانه‌داری حدود 5 درصد، اوراق قرضه دولتی را دوباره جذاب کرده است، اما زیرساخت‌های هوش مصنوعی همچنان فرصت بهتری را ارائه می‌دهند. انشول سهگال، رئیس جهانی درآمد ثابت، ارزها و کالاهای گلدمن، گفت: «شخصاً، من فکر می‌کنم که بیان نامتقارن در حال محاسبه طولانی است. سهگل گفت که طرفدار شرکت‌های زیرساخت هوش مصنوعی، از جمله ارائه‌دهندگان نئوکلاد، که قدرت محاسباتی هوش مصنوعی را اجاره می‌کنند، و مراکز داده است. نظرات او در پادکست \"بازارها\" بانک که روز جمعه منتشر شد، پس از آن بود که فدرال رزرو هفته گذشته نرخ بهره را افزایش داد و نشان داد که ممکن است در اواخر سال جاری افزایش دیگری رخ دهد. این امر باعث افزایش فروش در خزانه داری ها شده و بازدهی بلندمدت را به بالاترین سطح خود در بیش از دو دهه اخیر رسانده است. سهگل گفت، با این حال، نرخ های بالاتر لزوماً رونق هوش مصنوعی را تضعیف نکرده است. در عوض، پرداخت‌های بهره بالاتر، پول بیشتری را در اختیار پس‌اندازکنندگان قرار داده است که به نوبه خود سرمایه‌گذاری زیرساخت‌های هوش مصنوعی را تأمین مالی کرده‌اند. در این زمینه، سهگل در زیرساخت‌های هوش مصنوعی پیشرفت بیشتری نسبت به Treasurys با قدمت طولانی دارد. در حالی که بازده اوراق قرضه ممکن است نسبت به سطوح فعلی کاهش پیدا کند، اما او گفت که سرمایه‌گذاری‌های هوش مصنوعی «می‌توانند به صورت چند برابری افزایش پیدا کنند». او همچنین زیرساخت‌های هوش مصنوعی را از بازار"}, {"source": "Business Insider", "title": "Serena Williams and Alexis Ohanian are letting their daughters chart their own paths — with one caveat", "link": "https://www.businessinsider.com/alexis-ohanian-serena-williams-one-rule-daughters-future-careers-2026-9", "summary": "Alexis Ohanian says he and Serena Williams aren t limiting what their daughters can pursue. Kate Green/Athlos/Getty Images Alexis Ohanian says he and Serena Williams are letting their daughters choose their career paths. But he says there's one thing they want their daughters to keep in mind. The Reddit cofounder also shared the lesson he hopes his daughters take from women's sports. Alexis Ohanian says he and Serena Williams have one rule for letting their daughters chart their own paths. \"The one rule in the house is we don't care what you want to do when you grow up, as long as you do your best at it and you're doing something useful,\" Ohanian told E! News on Saturday at Athlos LDN26, the inaugural London edition of the women's professional track-and-field series he founded. Ohanian said he was on \"dad duty\" supervising their eldest daughter, Olympia, who was \"working the event.\" \"We've got her interviewing a few of the ladies who are on their way in,\" the Reddit cofounder and venture capitalist said. On the other hand, he said Williams \"drew the short straw\" and was watching over their youngest daughter, Adira. Ohanian said the couple also tries to keep their daughters grounded as they grow up around elite athletes and attend high-profile events. \"We both go out of our way to normalize a lot of this stuff,\" Ohanian said. That same idea shapes how Ohanian thinks about women's sports and the example he wants to set for his daughters. While he sees women athletes as inspirational role models, he said that shouldn't be the reason they are celebrated. \"In a way, sort of ironically, if the only thing that I focus on and talk about is the sort of normalcy of celebrating greatness, and they just happen to be women, I feel like it actually helps us get a little closer to the end goal that we all want,\" he said. Ohanian has previously spoken about giving his daughters room to explore their interests. In a July 2023 interview with People , he said he and Williams enjoyed watching Olympia try different hobbies. \"Like any parent, we just want her to have fun, and we're fortunate enough to be able to expose her to anything she could be interested in. It's already been an interesting journey, seeing the stuff she's into. We don't want to limit that,\" he said. Williams has also spoken about how she has no interest in grooming her daughter to be a tennis star. \"I would hate her to have to deal with comparisons or expectations. It's so much work, and I've given up so mu", "date_str": "2026-09-21T04:36:19+00:00", "hash": "ed347bfcda5ab073", "title_fa": "سرنا ویلیامز و الکسیس اوهانیان به دخترانشان اجازه می دهند مسیرهای خود را ترسیم کنند - با یک اخطار", "summary_fa": "الکسیس اوهانیان می گوید که او و سرنا ویلیامز چیزی را که دخترانشان می توانند دنبال کنند محدود نمی کنند. کیت گرین/آتلوس/گتی ایماژ الکسیس اوهانیان می گوید او و سرنا ویلیامز به دخترانشان اجازه می دهند مسیرهای شغلی خود را انتخاب کنند. اما او می گوید که آنها می خواهند دخترانشان یک چیز را در نظر داشته باشند. بنیانگذار Reddit همچنین درسی را که امیدوار است دخترانش از ورزش زنان بگیرند، به اشتراک گذاشت. الکسیس اوهانیان می گوید که او و سرنا ویلیامز یک قانون برای اجازه دادن به دخترانشان برای ترسیم مسیرهای خود دارند. اوهانیان به E گفت: «یک قانون در خانه این است که وقتی بزرگ می‌شوید، ما به کاری که می‌خواهید بکنید اهمیتی نمی‌دهیم، تا زمانی که تمام تلاش خود را در آن انجام دهید و کار مفیدی انجام دهید. اخبار روز شنبه در Athlos LDN26، اولین نسخه لندن از مجموعه دوومیدانی حرفه ای زنان که او پایه گذاری کرد. اوهانیان گفت که او در \"وظیفه پدر\" بر دختر بزرگ آنها، المپیا، که \"در این رویداد کار می کرد\" نظارت می کرد. بنیانگذار Reddit و سرمایه گذار خطرپذیر گفت: \"ما او را مجبور کردیم که با چند خانمی که در راه هستند مصاحبه کند.\" از سوی دیگر، او گفت ویلیامز \"نی کوتاه را کشید\" و مراقب کوچکترین دخترشان، آدیرا بود. اوهانیان گفت که این زوج همچنین سعی می کنند دخترانشان را در کنار ورزشکاران نخبه بزرگ نگه دارند و در رویدادهای برجسته شرکت می کنند. اوهانیان گفت: \"ما هر دوی ما برای عادی سازی بسیاری از این موارد تلاش می کنیم.\" همین ایده، طرز تفکر اوهانیان را در مورد ورزش زنان و الگویی که می‌خواهد برای دخترانش ایجاد کند، شکل می‌دهد. در حالی که او زنان ورزشکار را الگوهای الهام بخش می داند، گفت که این نباید دلیلی برای تجلیل از آنها باشد. او می‌گوید: «به نوعی،"}, {"source": "Business Insider", "title": "I fell for my surf instructor in Morocco. We got married and turned an abandoned riad into a hotel.", "link": "https://www.businessinsider.com/couple-restored-abandoned-riad-rabat-morocco-opened-surf-school-hotel-2026-9", "summary": "Nina Ottevanger and her husband Ilyass bought an abandoned home in Morocco and opened a surf hotel. Provided by Nina Ottevanger Nina Ottevanger met her now-husband during a surfing lesson on vacation in Morocco. After a year and a half of living apart, they decided to split their time between two countries. Last year, they stopped splitting their time between two places and renovated a traditional Moroccan house into a hotel and surf school. This interview is based on a conversation with Nina Ottevanger, 31, a surf instructor and co-owner of Ilyana Surfhouse , a small business in Rabat, Morocco. It has been edited for length and clarity. Eleven years ago, I was traveling in Morocco with two friends. While in Rabat, we wanted to surf and found a place online. We were greeted by a man named Ilyass. The main group had already left, but he offered us a private lesson. Something clicked between us. He shared his number in case we wanted to go out that evening, but we chose an early night so we could continue traveling the next morning. I texted to say I hoped our paths crossed again, and we kept chatting. He suggested I finish my trip with a return visit to Rabat , which I did, and we hit it off. I'd just finished my second year studying international tourism and leisure management at a university in the Netherlands, where I'm from, so starting a long-distance relationship had to feel right. Thankfully, it did. I saw Ilyass in Rabat every few months during study breaks. In 2016, he took a job managing a surf camp on Morocco's Atlantic coast. I found a six-month internship at another nearby surf camp . Sharing an apartment gave us a taste of normal life together. But I still had one year left in school, part of which I spent in Bali, writing my thesis and doing market research for a retreat. The couple started a long-distance relationship between the Netherlands and Morocco while she finished university. Provided by Nina Ottevanger One foot in the surf, one foot in Western Europe Ilyass had worked at his uncle's hostel and surf school in Rabat, where he's from, for years, but always wanted his own business. I'd been looking for a way to swap the Netherlands for somewhere I could be outside year-round. Running a B B had always appealed to me, so we dreamt up a surf concept. But we had neither the money nor enough experience to build it. The following year, I graduated and got a job at a travel agency in The Hague, and Ilyass moved to the Netherlands . We got marr", "date_str": "2026-09-21T04:10:34+00:00", "hash": "f8758145b5721c22", "title_fa": "من عاشق مربی موج سواری ام در مراکش شدم. ما ازدواج کردیم و یک ریاد متروکه را تبدیل به هتل کردیم.", "summary_fa": "نینا اوتوانگر و همسرش ایلیاس خانه متروکه ای در مراکش خریدند و یک هتل موج سواری افتتاح کردند. ارائه شده توسط Nina Ottevanger Nina Ottevanger با همسر خود در طول یک کلاس موج سواری در تعطیلات در مراکش ملاقات کرد. آنها پس از یک سال و نیم زندگی جدا از هم تصمیم گرفتند زمان خود را بین دو کشور تقسیم کنند. سال گذشته، آنها وقت خود را بین دو مکان تقسیم نکردند و یک خانه سنتی مراکشی را به یک هتل و مدرسه موج سواری بازسازی کردند. این مصاحبه بر اساس گفتگو با نینا اوتوانگر، 31 ساله، مربی موج سواری و یکی از مالکان Ilyana Surfhouse، یک تجارت کوچک در رباط، مراکش است. برای طول و وضوح ویرایش شده است. یازده سال پیش با دو دوست به مراکش سفر می کردم. زمانی که در رباط بودیم، می خواستیم گشت و گذار کنیم و مکانی آنلاین پیدا کردیم. مردی به نام الیاس از ما استقبال کرد. گروه اصلی قبلاً رفته بودند، اما او به ما آموزش خصوصی داد. چیزی بین ما کلید خورد. او شماره اش را به اشتراک گذاشت تا اگر بخواهیم آن شب بیرون برویم، اما شب زود را انتخاب کردیم تا بتوانیم صبح روز بعد به سفر ادامه دهیم. من پیام دادم تا بگویم امیدوارم مسیرهایمان دوباره به هم برسند و به چت کردن ادامه دادیم. او به من پیشنهاد کرد که سفرم را با یک دیدار برگشت به رباط تمام کنم، که این کار را انجام دادم و به نتیجه رسیدیم. من تازه سال دوم تحصیل در رشته گردشگری بین المللی و مدیریت اوقات فراغت را در دانشگاهی در هلند، جایی که اهل آن هستم، به پایان رسانده بودم، بنابراین شروع یک رابطه از راه دور باید احساس درستی داشته باشد. خوشبختانه انجام شد. من هر چند ماه یک بار در تعطیلات تحصیلی الیاس را در رباط"}, {"source": "Business Insider", "title": "I felt confident in my appearance and how I dressed. Then, I moved to Japan.", "link": "https://www.businessinsider.com/moving-to-japan-feel-out-of-place-dislike-appearance-body-2026-9", "summary": "I didn t realize how much moving to Japan would change how I view my body and make me so critical of how I dress. Kerri King Moving to Japan made me more self-conscious about my appearance than I've ever been before. Being noticeably different from those around me made me critical of my body and how I dress. On the bright side, living here pushed me to explore beauty, style, and self-expression in new ways. Moving to a new country comes with plenty of adjustments, from language to social rules, but I didn't expect to feel out of place in my own body. Before moving to Japan from New Zealand, I was mostly content with how I looked, having already survived the body-image hurdles of early motherhood. Despite being a plus-size woman , I considered myself to be confident and rarely cared what others thought of my appearance. After three years here, the visibility that comes with being a foreigner has brought along a level of self-consciousness I have never grappled with before. I couldn't stop comparing myself to everyone around me Wherever I went, I felt like I was being judged even if I wasn t. IronHeart/Getty Images Being visibly non-Japanese meant I often felt more conspicuous than I ever had, and that made me hyper-aware of how I looked. I often felt like people were staring at me, making me wonder what they were noticing, and before long, I found I was scrutinizing parts of myself I hadn't thought about before. The hair on my arms used to feel as normal as having eyebrows, but after noticing how uncommon visible body hair seemed to be among locals, I became convinced I must look like a yeti in comparison, and soon found myself reaching for a razor. Still, I always thought a bit of body hair never hurt anyone until an older woman, who had been openly staring at my legs, scoffed as she walked past and shook her head. Afterward, I found myself questioning whether it was my slightly unshaven legs or the large tattoo on my calf that had prompted such a reaction. Tattoos in Japan can feel taboo, as they carry a long-standing association with the country's organized crime groups. Many bathhouses, swimming pools, gyms, and other public facilities still restrict access for people with tattoos. Whatever the reason, I spent the rest of the day acutely aware of my body and still think about that moment whenever I put on a pair of shorts. It can be tough to get used to the style and trends in a new place. KAZUHIRO NOGI/AFP via Getty Images Shopping for clothes here has", "date_str": "2026-09-20T22:42:01+00:00", "hash": "10a8ef9783daef10", "title_fa": "به ظاهرم و نحوه لباس پوشیدنم اطمینان داشتم. سپس به ژاپن نقل مکان کردم.", "summary_fa": "نمی‌دانستم که رفتن به ژاپن چقدر دیدگاه من را به بدنم تغییر می‌دهد و من را نسبت به نحوه لباس پوشیدنم انتقاد می‌کند. نقل مکان کری کینگ به ژاپن باعث شد نسبت به قبل نسبت به ظاهرم خودآگاه تر باشم. تفاوت محسوسی با اطرافیانم باعث شد نسبت به بدنم و نحوه لباس پوشیدنم انتقاد کنم. از طرف دیگر، زندگی در اینجا مرا به کشف زیبایی، سبک و بیان خود به روش‌های جدید سوق داد. نقل مکان به یک کشور جدید با تغییرات زیادی همراه است، از زبان گرفته تا قوانین اجتماعی، اما من انتظار نداشتم که در بدنم احساس بی‌قراری کنم. قبل از اینکه از نیوزلند به ژاپن نقل مکان کنم، بیشتر از ظاهرم راضی بودم، زیرا قبلاً از موانع تصویر بدنی دوران اولیه مادری جان سالم به در ": "My 13-year-old refused to share his location with me. I was annoyed — until I realized he had a point.", "link": "https://www.businessinsider.com/teen-refused-location-tracking-gps-parenting-independence-2026-9", "summary": "The author (not pictured) didn t think she was a helicopter mom until her son pushed back on tracking. Carol Yepes/Getty Images I let my 13-year-old spend time with friends without constant supervision. When I asked to track his location, he argued that he'd earned my trust. I stopped routinely tracking him and now rely mostly on communication. I don't think of myself as an overprotective parent . I began letting my kids stay home alone for short stints when they were around 10. I let them wander our neighborhood alone starting when they were 11 or 12. I don't heavily monitor their social lives or phone usage, nor do I check their grades constantly or make them give me access to their Google Classroom to monitor their schoolwork. But I don't do things the same way that my generation's parents did things. I'm Generation X , and in my generation, there were no \"playdates.\" Parents didn't track your grades, and they definitely didn't track your location. You'd be walking around the neighborhood alone at 6 or 7 years old, often for hours. Usually your parents had no idea where you were. The hope was that you'd come home sometime before dark. I didn't realize I was a helicopter parent When my youngest son turned 13, he started going out with friends on his own. Sometimes he'd take a friend's school bus home with them, and hang out for a few hours. Other times, he'd walk over to a friend's house, and then walk around town. I supported this — it reminded me of the freedom I experienced as a teenager and I know how important that was for my own development. My son is super responsible, and doesn't make social plans without letting me know. That's why I didn't think it would be such a big deal when I asked him to share his location with me on his phone. The author asked her teenage son to track his location. Courtesy of the author I didn't think of tracking as an invasion of my son's privacy. It just felt normal, the same way that I can see his grades as they come in on the school portal if I choose to. Or the way that I ask my son to text me about his social plans as they unfold, rather than just sending him out and expecting him to come back by nightfall. But my son was adamant about me not tracking his location . My first reaction was, \"I'm giving you freedom to do whatever you want, so I should be able to see where you are!\" But as he made his case to me — that he is responsible and will update me, but doesn't like the idea of me tracking his every movement — I", "date_str": "2026-09-20T18:55:01+00:00", "hash": "d7a59533cd0d5631", "title_fa": "پسر 13 ساله من حاضر نشد مکان خود را با من به اشتراک بگذارد. من اذیت شدم - تا زمانی که متوجه شدم او نکته ای دارد.", "summary_fa": "نویسنده (تصویر نیست) فکر نمی کرد که او یک مادر هلیکوپتر است تا زمانی که پسرش ردیابی را متوقف کرد. کارول یپس/ گتی ایماژ به فرزند 13 ساله ام اجازه دادم بدون نظارت دائمی با دوستانم وقت بگذراند. وقتی از من خواستم مکان او را ردیابی کنم، او استدلال کرد که اعتماد من را به دست آورده است. من به طور معمول او را ردیابی نکردم و اکنون بیشتر به ارتباطات متکی هستم. من خودم را پدر و مادری بیش از حد محافظ نمی دانم. در حدود 10 سالگی شروع کردم به اجازه دادن به بچه هایم برای مدت کوتاهی در خانه تنها بمانند. از زمانی که 11 یا 12 ساله بودند به آنها اجازه می‌دهم به تنهایی در محله ما بگردند. من زندگی اجتماعی یا استفاده از تلفن آنها را به شدت تحت نظر نمی‌گیرم، همچنین نمرات آنها را دائماً بررسی نمی‌کنم یا آنها را مجبور می‌کنم برای نظارت بر تکالیف مدرسه‌شان به Google Classroom خود دسترسی داشته باشم. اما من کارها را به همان روشی که والدین نسل من انجام می دادند، انجام نمی دهم. من نسل X هستم و در نسل من هیچ \"تاریخ بازی\" وجود نداشت. والدین نمرات شما را ردیابی نکردند و قطعاً مکان شما را ردیابی نکردند. شما در 6 یا 7 سالگی به تنهایی در اطراف محله قدم می زنید، اغلب ساعت ts of tools in its toolkit to deal with these issues when they come up, and we've used them in the past.\" Ever since OpenAI launched ChatGPT in 2022, tech companies across the globe have become locked in a race to develop the most capable model. Doing so could mean dominating the market and securing steady profits, a huge win for whichever company comes out on top. OpenAI, Anthropic, xAI, Google, Meta, and Microsoft are among the industry leaders. Many Americans have expressed concerns that those tech companies are moving too fast and, in doing so, putting public safety at risk. A Pew Research Center survey published in August said over half of the respondents were more concerned than excited about using AI more in their daily lives. Potential job loss was among the top concerns associated with AI. Critics have also pointed toward privacy and cybersecurity risks. In July, OpenAI agents breached its training parameters and hacked Hugging Face , another AI company. This month, a cybersecurity startup used Anthropic's Claude to hack OpenAI's codebase . On Friday, The Wall Street Journal reported that Google's Gemini had ", "date_str": "2026-09-20T17:47:57+00:00", "hash": "83880986e7c5fcfa", "title_fa": "مشاور فناوری ترامپ به شرکت‌های هوش مصنوعی که نگران ساخت مدل‌های ناامن هستند توصیه می‌کند: «فقط بس کن»", "summary_fa": "مایکل کراتسیوس، مدیر دفتر سیاست علم و فناوری کاخ سفید. اندرو هارنیک/ رهبران فناوری گتی ایماژ می گویند که سرعت توسعه هوش مصنوعی باید کاهش یابد و از دولت خواستند وارد عمل شود. با این حال، مشاور فناوری ترامپ می گوید که شرکت ها برای انجام این کار به مجوز دولت نیاز ندارند. دولت ترامپ به طور گسترده از توسعه و تسریع زیرساخت های هوش مصنوعی حمایت کرده است. یک راه‌حل ساده برای شرکت‌های هوش مصنوعی وجود دارد که احساس می‌کنند مدل‌هایشان با سرعتی ترسناک در حال توسعه هستند: ترمز را فشار دهید. این توصیه‌ای است که مایکل کرتسیوس، مدیر دفتر سیاست‌گذاری علم و فناوری کاخ سفید در مصاحبه‌ای با فاکس نیوز ساندی ارائه کرد. کراتسیوس گفت: «خیلی جالب است که آنها در مورد این مسائل صحبت می کنند، در مورد اینکه چقدر از آینده بالقوه می ترسند، و شاید می خواهند مکث کنند. موضع ما این است که اگر باور دارید که در حال توسعه فناوری ناامن هستید یا نمی‌خواهید آن را در جهان منتشر کنید، می‌توانید آن را متوقف کنید. وی افزود: \"شما نیازی به کسی ندارید که شما را مجبور به انجام این کار کند.\" کراتسیوس با این تصور مخالفت کرد که دولت ایالات متحده باید اقدامی صریح انجام دهد تا شرکت های فناوری نفس بکشند. کراتسیوس گفت: «اگر احساس کنند که باید این کار را انجام دهند، فقط باید سرعت خود را کاهش دهند. من فکر می‌کنم نکته کلیدی که همیشه باید به خاطر بسپارید این است که دولت ایالات متحده ابزارهای زیادی را در جعبه ابزار خود برای مقابله با این مسائل در صورت بروز دارند، و ما در گذشته از آنها استفاده کرده‌ایم.» از زمانی که OpenAI ChatGPT را در سال 2022 راه‌اندازی کرد، شرکت‌های فناوری در سراسر جهان درگیر رقابت برای توسعه توانمندترین مدل شده‌اند. انجام این کار می تواند به معنای تسلط"}, {"source": "Business Insider", "title": "Meta’s Muse TV ad is the latest sign that AI agents are going mainstream", "link": "https://www.businessinsider.com/meta-muse-personal-ai-agent-mainstream-instinct-2026-9", "summary": "Alexandr Wang, Meta s chief AI officer, has been trumpeting Muse. Bloomberg/Getty Images Meta released a TV ad for Muse, its personal AI agent, as it pushes AI agents into the mainstream. Muse can act on a user's behalf, sending emails, purchasing things online, and handling other tasks. Fears about AI agents going rogue haven't dissuaded hype about the new tech. The next shiny new AI thing has arrived: The personal AI agent . Once mostly the domain of Silicon Valley coders who used them to amp up their efficiency at work (and anxiety levels ), the AI agent is now being welcomed into the home. And with the release of Meta's new personal AI agent, Muse, the do-it-for-you tech is rocketing into the mainstream. \"It feels like magic,\" investor Sheel Mohnot said on X in reference to Instinct, another trendy new personal AI agent . \"Contrary to what some people have said, I don't think the appeal is limited to Silicon Valley types.\" These agents often live on common messaging apps. Users send messages, asking them to handle tasks like sending emails, purchasing things online, posting to social media, tracking prices, managing calendars, among many other things. In Meta's first television spot, released this weekend, for the Muse AI agent , a woman prepares for a dinner party — chopping lettuce, mixing drinks — while her AI agent autonomously sorts emails, arranges her schedule, and purchases back-to-school items online. \"Muse is going NATIONWIDE to a television near you,\" Alexandr Wang, Meta's chief AI officer, said on X on Saturday. muse is going NATIONWIDE to a television near you this is our first @muse ad ever, going live this weekend! we hope you like it while watching the big game(s)! big ups to @joshginsberg , denise, and the whole meta marketing team ❤️ pic.twitter.com/1zMUVgdKna — Alexandr Wang (@alexandr_wang) September 20, 2026 The appeal of autonomous agents is plain. While the famous chatbots from Anthropic and OpenAI that are changing the world are designed to answer questions, personal AI agents can act on a user's behalf, run entirely in the background, handle whole processes online, and ping you with progress updates. It likely won't be long until AI agents are all over the internet. If you really want to take full advantage of their potential, however, Muse and other AI agents require the keys to your kingdom, including your email, your credit card information, your bank accounts, and an array of passwords. \"A mistake or manipulation could have", "date_str": "2026-09-20T17:11:09+00:00", "hash": "b067c2c69cc129f3", "title_fa": "تبلیغ تلویزیونی Meta’s Muse آخرین نشانه ای است که نشان می دهد عوامل هوش مصنوعی به جریان اصلی تبدیل می شوند", "summary_fa": "الکساندر وانگ، افسر ارشد هوش مصنوعی متا، میوز را بوق می‌زند. بلومبرگ/گتی ایمیجز متا یک تبلیغ تلویزیونی برای Muse، عامل هوش مصنوعی شخصی خود منتشر کرد، زیرا عوامل هوش مصنوعی را وارد جریان اصلی می کند. Muse می تواند از طرف یک کاربر عمل کند، ایمیل ارسال کند، چیزهایی را به صورت آنلاین خریداری کند و کارهای دیگر را انجام دهد. ترس از سرکشی عوامل هوش مصنوعی، تبلیغات تبلیغاتی در مورد فناوری جدید را منصرف نکرده است. چیز جدید هوش مصنوعی درخشان بعدی از راه رسید: عامل هوش مصنوعی شخصی. زمانی که بیشتر حوزه کدنویسان دره سیلیکون بود که از آنها برای افزایش کارایی خود در محل کار (و سطوح اضطراب) استفاده می کردند، عامل هوش مصنوعی اکنون در خانه مورد استقبال قرار می گیرد. و با انتشار عامل هوش مصنوعی شخصی جدید متا، Muse، فناوری انجام کار برای شما به جریان اصلی تبدیل شده است. Sheel Mohnot، سرمایه‌گذار در X با اشاره به Instinct، یکی دیگر از عوامل جدید و مد روز هوش مصنوعی شخصی، گفت: «احساس جادویی است. برخلاف آنچه برخی افراد گفته‌اند، فکر نمی‌کنم جذابیت به انواع دره سیلیکون محدود شود. این عوامل اغلب در برنامه های پیام رسانی رایج زندگی می کنند. کاربران پیام هایی ارسال می کنند و از آنها می خواهند کارهایی مانند ارسال ایمیل، خرید آنلاین چیزها، پست کردن در رسانه های اجتماعی، ردیابی قیمت ها، مدیریت تقویم و بسیاری موارد دیگر را انجام دهند. در اولین اسپات تلویزیونی متا که این آخر هفته برای مامور هوش مصنوعی Muse منتشر شد، زنی برای یک مهمانی شام آماده می‌شود - خرد کردن کاهو، مخلوط کردن نوشیدنی - در حالی که عامل هوش مصنوعی او به طور مستقل ایمیل‌ها را مرتب می‌کند، برنامه او را تنظیم می‌کند و اقلام مدرسه را به صورت آنلاین خریداری می‌کند. الکساندر وانگ، افسر ارشد هوش مصنوعی متا در روز"}, {"source": "Business Insider", "title": "Best 85-inch TVs of 2026", "link": "https://www.businessinsider.com/guides/tech/best-85-inch-tv", "summary": "When you buy through our links, Business Insider may earn an affiliate commission. Learn more The TCL X11L is one of the most advanced 85-inch TVs we ve tested. Steven Cohen/Business Insider If you want your living room to feel like a home theater, screen size matters a lot. The best 85-inch TVs deliver a scale that smaller sets just can't match. Movies look more cinematic, and video games feel more immersive. This size is also perfect for gameday
