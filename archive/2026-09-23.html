ending over $14 billion to acqui-hire Wang from Scale AI. \"you might say we're… outpacing the frontier,\" he wrote in response to a news story that Muse recently had more daily active users in the US and Canada than ChatGPT did over the same period. In the days after Muse's launch, many of Wang's posts promoted other tech figures' positive messages about trying the agent: \"your hottest friend is already on muse,\" Wang wrote while resharing a post from Stripe CEO Patrick Collison. Another of Wang's go-to posts is hyping everyday users who share how Muse has saved them money or helped them with admin. (Don't just take Wang's word for it: Business Insider's Katie Notopoulos found it helpful, but it failed on some tasks. ) And this week, Wang has promoted a flurry of partnerships with Shopify, PayPal, Expedia, and Instacart that connect their services to Muse — a move that could spark the next App Store-style boom . another one!! instacart 🤝 muse this integration will make it really easy to get all your groceries using muse, and ensure you and your family are always prepared 🥕 https://t.co/wHSqZ4QxKS — Alexandr Wang (@al", "date_str": "2026-09-23T13:23:51+00:00", "hash": "c6a2083a0e0bc755", "title_fa": "«توییت توپ» بی امان الکساندر وانگ، سلاح نه چندان محرمانه متا در جنگ تبلیغاتی هوش مصنوعی است.", "summary_fa": "الکساندر وانگ استراتژی رسانه های اجتماعی زبان به گونه ای دارد. بلومبرگ/گتی ایماژ الکساندر وانگ در مورد میوز پست می گذارد. خیلی از زمانی که متا مامور شخصی را راه اندازی کرد، او صدها پست X را منتشر کرد. پست ها بی امان، پر از هیاهو، و گاهی اوقات گستاخانه هستند – که یک متخصص ارتباطات آن را استراتژی «ضد روابط عمومی» نامید. پوشش خود را بگیرید: الکساندر وانگ در حال بارگذاری مجدد \"توییت توپ\" است. افسر ارشد هوش مصنوعی متا از زمانی که این شرکت Muse، عامل هوش مصنوعی شخصی خود را در 8 سپتامبر راه اندازی کرد، بیش از 300 پست را در X از کار انداخته است. بسیاری از آنها حاوی میم هستند. برخی به رقبای هوش مصنوعی حمله می کنند. تقریباً همه در مورد Muse هستند. \"میوز اولین Ai برای شکاکان هوش مصنوعی است!\" یک پست را می خواند شاید حق با وانگ باشد. این نماینده، که می تواند به طور مستقل وظایفی مانند رزرو پرواز، خرید و ارسال ایمیل را انجام دهد، اخیراً به بالای نمودارهای اپ استور صعود کرده و نقدهای مثبتی را به دست آورده است. در طول آن دوره، وانگ بمباران دیجیتال را افزایش داد و بیش از 100 بار در طول پنج روز در X پست گذاشت، که هر پست معمولاً حداقل ده‌ها هزار بازدید داشت. محبوب‌ترین دوست شما از قبل در حال حاضر است https://t.co/LhHAeQyePA — الکساندر وانگ (@alexandr_wang) سپتامبر 8، 2026 اغلب، با وجود افزایش ده‌ها میلیارد دلاری و صرف بیش از 14 میلیارد دلار هزینه سرمایه‌ای و صرف بیش از 14 میلیارد دلار سرمایه، پس از عقب افتادن متا در رقابت برای ساخت قوی‌ترین مدل هوش مصنوعی، آنها مانند یک دور پیروزی می‌خوانند. او در پاسخ به یک خبر نوشت که اخیراً Muse در ایالات متحده و کانادا کاربران فعال روزانه بیشتری نسبت به ChatGPT در همان دوره"}, {"source": "Business Insider", "title": "What to know about the Horowitz Andreessen Academy, Silicon Valley's $42 million AI-era college alternative", "link": "https://www.businessinsider.com/horowitz-andreessen-academy-key-facts-teachers-costs-classes-ai-2026-9", "summary": "Silicon Valley is famous for its college dropouts, but now it wants to educate a new generation. Horowitz Andreessen Academy The Horowitz Andreessen Academy is a new $42 million alternative to college. Its first 50 students will study in San Francisco tuition-free from fall 2027. The school offers courses and tech company placements, but no accredited degree programs. Silicon Valley has long celebrated the college dropout . Now some of its biggest names are backing an educational institution of their own. The Horowitz Andreessen Academy has raised $42 million and recruited prominent tech figures as instructors, guest speakers, and mentors. Venture-capital firm Andreessen Horowitz, better known as A16z , is backing the Horowitz Andreessen Academy, a new for-profit school for young people interested in building companies, products, and emerging technologies. Its network includes executives and founders from OpenAI, Nvidia, Microsoft, Meta, and Stripe. The San Francisco academy will trade degrees, traditional grades, and lecture-heavy coursework for independent projects, short classes, and work placements at technology companies. Its tuition-free founding class is due to arrive in 2027, but the school's longer-term plan is to charge fees comparable to an elite private university. What is it and where is it? The academy is a full-time, in-person, for-profit educational program in San Francisco aimed primarily at recent high-school graduates. Its first offering, the Founding Class Fellowship, is a one-year program scheduled to begin in September 2027 with about 50 students. The academy won't initially award degrees or grant college credit and isn't accredited, making it a college alternative rather than a university. The program is organized around courses, co-ops, or structured work placements at participating technology companies, and \"pursuits,\" its term for self-directed projects. Students will spend September through April at the San Francisco campus, travel abroad in May, and complete co-ops from June through August, according to the academy's website. San Francisco is at the heart of the global tech scene, and is a natural spot for the academy, its founder said. Smith Collection/Gado/Getty Images The school has not disclosed the precise location of its campus. Its founders say San Francisco itself is part of the appeal, pointing to its concentration of technology companies, investors, research labs, and startup founders. Gagan Biyani, a cofounder of the ", "date_str": "2026-09-23T12:35:29+00:00", "hash": "8501c427d546c051", "title_fa": "درباره آکادمی Horowitz Andreessen، جایگزین 42 میلیون دلاری کالج هوش مصنوعی در سیلیکون ولی چه باید بدانید", "summary_fa": "سیلیکون ولی به خاطر ترک تحصیل از دانشگاه معروف است، اما اکنون می خواهد نسل جدیدی را آموزش دهد. آکادمی Horowitz Andreessen آکادمی Horowitz Andreessen یک جایگزین جدید 42 میلیون دلاری برای کالج است. 50 دانش‌آموز اول آن از پاییز 2027 بدون شهریه در سانفرانسیسکو تحصیل خواهند کرد. این مدرسه دوره‌ها و شرکت‌های فناوری را ارائه می‌دهد، اما برنامه‌های مدرک معتبری ندارد. سیلیکون ولی مدتهاست که ترک تحصیل را جشن گرفته است. اکنون برخی از بزرگ‌ترین نام‌های آن از یک موسسه آموزشی حمایت می‌کنند. آکادمی Horowitz Andreessen 42 میلیون دلار جمع آوری کرده و چهره های برجسته فناوری را به عنوان مدرس، سخنران مهمان و مربی جذب کرده است. شرکت سرمایه گذاری خطرپذیر Andreessen Horowitz که بیشتر با نام A16z شناخته می شود، از آکادمی Horowitz Andreessen، یک مدرسه انتفاعی جدید برای جوانان علاقه مند به ساخت شرکت ها، محصولات و فناوری های نوظهور حمایت می کند. شبکه آن شامل مدیران و بنیانگذاران OpenAI، Nvidia، Microsoft، Meta و Stripe است. آکادمی سانفرانسیسکو مدارک، نمرات سنتی و درس های سنگین سخنرانی را برای پروژه های مستقل، کلاس های کوتاه مدت و موقعیت های کاری در شرکت های فناوری مبادله می کند. کلاس موسس بدون شهریه آن قرار است در سال 2027 وارد شود، اما برنامه بلندمدت مدرسه این است که هزینه هایی را در مقایسه با یک دانشگاه خصوصی نخبه دریافت کند. چیست و کجاست؟ این آکادمی یک برنامه آموزشی تمام وقت، حضوری و انتفاعی در سانفرانسیسکو است که عمدتاً فارغ‌التحصیلان اخیر دبیرستان را هدف قرار می‌دهد. اولین پیشنهاد آن، بورسیه کلاس پایه، یک برنامه یک ساله است که قرار است در سپتامبر 2027 با حدود 50 دانشجو آغاز شود. آکادمی در ابتدا مدرک اعطا نمی کند یا اعتبار کالج را اعطا نمی کند و معتبر نیست، و آن را به جای دانشگاه، جایگزین کالج می کند. این برنامه حول محور"}, {"source": "Business Insider", "title": "Citi is jumping into the ad business and entering a fast-growing and competitive market", "link": "https://www.businessinsider.com/citi-is-jumping-into-the-advertising-business-2026-9", "summary": "Abhinav Anand, head of value cards, lending, and commerce at Citi, wants to connect advertisers with Citi s customers. Citi Citi is jumping into the advertising business. The bank is letting brands target ads to its more than 70 million customers based on their spending habits. It's the latest example of financial companies using their customer data to sell ads. Citi is the latest company outside Madison Avenue to launch an advertising business . The bank exclusively told CMO Insider that it's creating a new unit called Citi Commerce Media, which will let brands advertise to its more than 70 million customers based on their spending. Citi will target ads to people on its own app and website, as well as on other properties, based on their spending histories. So a customer scrolling on Facebook could see a 10% off ad from a travel company, for instance. Part of Citi's pitch is that it can link its ads to measurable business impacts. It said it ran a pilot ad with retail, payments, technology, and health and beauty brands. Two campaigns produced an average 15% lift in spending compared to people who weren't shown ads. Citi said its platform would be informed by intel from 6.5 billion annual transactions across more than 700 spending categories. \"We are focusing primarily based on your spending pattern, and that's what the advertisers care the most about,\" said Abhinav Anand, head of value cards, lending, and commerce at Citi. A growing number of non-advertising companies have leveraged their customers' data to build ad businesses. Citi is an example of the fast-growing field of financial media networks, in which firms use first-party customer data to enable advertisers to target audiences across the digital ecosystem. As financial institutions, they have a fuller picture of their customers' spending than typical retail media networks, where retailers — often grocers or big-box stores like Walmart — run ads based on data about how people browse and spend within their ecosystems. Anand said he sees an opportunity to take spending share from retail media networks that have more limited data. EMARKETER, a Business Insider sister company, forecast that financial media networks would pass $1 billion in US ad spend by 2026 and grow at a compound annual growth rate of over 66% through 2027. Other financial institutions have already built such networks. JPMorgan Chase and PayPal launched ads businesses in 2024. Mastercard and American Express followed with similar mov", "date_str": "2026-09-23T12:30:01+00:00", "hash": "d7fd6e2522868a7f", "title_fa": "سیتی در حال ورود به تجارت تبلیغاتی و ورود به بازاری با رشد سریع و رقابتی است", "summary_fa": "آبهیناو آناند، رئیس کارت‌های ارزش، وام‌دهی و بازرگانی در سیتی، می‌خواهد تبلیغ‌کنندگان را با مشتریان سیتی مرتبط کند. سیتی سیتی در حال ورود به تجارت تبلیغاتی است. این بانک به برندها اجازه می دهد تبلیغات را برای بیش از 70 میلیون مشتری خود بر اساس عادات خرج کردنشان هدف قرار دهند. این آخرین نمونه از شرکت های مالی است که از داده های مشتریان خود برای فروش تبلیغات استفاده می کنند. سیتی آخرین شرکتی است که در خارج از خیابان مدیسون فعالیت تبلیغاتی راه اندازی کرده است. این بانک به طور انحصاری به CMO Insider گفت که در حال ایجاد واحد جدیدی به نام Citi Commerce Media است که به برندها اجازه می‌دهد تا بر اساس هزینه‌هایشان برای بیش از 70 میلیون مشتری خود تبلیغ کنند. Citi بر اساس تاریخچه هزینه‌هایشان، تبلیغات را برای افراد در برنامه و وب‌سایت خود و همچنین سایر دارایی‌ها هدف قرار می‌دهد. بنابراین، یک مشتری که در فیس‌بوک اسکرول می‌کند، می‌تواند به عنوان مثال، یک آگهی تخفیف ۱۰ درصدی از یک شرکت مسافرتی ببیند. بخشی از هدف سیتی این است که می تواند تبلیغات خود را به تأثیرات تجاری قابل اندازه گیری پیوند دهد. این شرکت اعلام کرد که یک تبلیغ آزمایشی با برندهای خرده فروشی، پرداخت، فناوری و بهداشت و زیبایی منتشر کرده است. دو کمپین در مقایسه با افرادی که تبلیغاتی به آنها نشان داده نمی شد، به طور متوسط ​​15 درصد افزایش هزینه ایجاد کرد. سیتی گفت که پلتفرم آن توسط اینتل از 6.5 میلیارد تراکنش سالانه در بیش از 700 دسته هزینه مطلع خواهد شد. آبهیناو آناند، رئیس بخش کارت‌های ارزش، وام‌دهی و بازرگانی در سیتی، گفت: «ما اساساً بر اساس الگوی هزینه‌های شما تمرکز می‌کنیم، و این چیزی است که تبلیغ‌کنندگان بیشتر به آن اهمیت می‌دهند. تعداد فزاینده ای از شرکت های غیر تبلیغاتی از داده های مشتریان خود برای"}, {"source": "Business Insider", "title": "Reddit is ramping up its war on marketing slop", "link": "https://www.businessinsider.com/reddit-ramping-up-war-on-marketing-slop-2026-9", "summary": "Adam Collins, Reddit s chief communications officer, wants to preserve the platform s human qualities. Reddit Reddit is ramping up its crackdown on marketing slop. It'll limit the distribution of suspected spam so it doesn't appear in the home feed. Reddit also found a big network that violated its rules requiring disclosure of marketing activity. Reddit is ratcheting up its war on marketing slop. The company exclusively told CMO Insider that it's taking new steps to combat spam and keep human conversations at the center of its platform. First, it'll prevent suspected spam from appearing in the main home feed while it's under review. Reddit said in testing, this approach cut spam in the home feed by 28%, user reports of spam in the feed by 11%, and push notifications with spam by 7%. It plans to test this approach in search results next. Reddit is also taking a few other steps: It plans to start explaining to users why it suspects certain content is spam, rather than just showing \"Removed by Reddit\" It won't recommend posts or comments from accounts that have been asked to verify they're human or register their automation, but haven't yet done so \"What's made Reddit really unique over the last 21 years, and special, is the humanity that you see on Reddit every day,\" said Adam Collins, Reddit's chief communications officer. \"Our goal is to preserve that for the future as well. That's really what these efforts are about.\" Reddit said it had uncovered a coordinated network of 485 accounts that created more than 44,000 pieces of content across the platform, often about work and productivity. These accounts presented themselves as regular users but were, in fact, connected to businesses, violating Reddit's rules requiring marketing activity to be disclosed. Reddit said it reversed the potential benefit of the coordinated behavior by removing karma and votes that resulted from the manipulation. Karma is a score on Reddit that measures a user's reputation. The spam problem is a particular threat to Reddit, which considers its human-moderated communities to be its greatest advantage over other social platforms. Reddit vs. AI After going public in 2024, Reddit increased advertising on its forums and entered into partnerships with OpenAI and Google. Marketers took note and have been racing to create content for Reddit. Brands particularly hope their efforts will help them show up in AI search , where Reddit is highly cited. The problem: Self-promotional content from", "date_str": "2026-09-23T12:00:02+00:00", "hash": "517635603663f33d", "title_fa": "Reddit در حال تشدید جنگ خود با شیب بازاریابی است", "summary_fa": "آدام کالینز، مدیر ارشد ارتباطات Reddit، می‌خواهد ویژگی‌های انسانی پلتفرم را حفظ کند. Reddit Reddit در حال تشدید سرکوب خود در شیب بازاریابی است. توزیع هرزنامه مشکوک را محدود می کند تا در فید اصلی ظاهر نشود. Reddit همچنین یک شبکه بزرگ را پیدا کرد که قوانین آن را نقض می کرد که نیازمند افشای فعالیت های بازاریابی است. Reddit در حال تشدید جنگ خود با شیب بازاریابی است. این شرکت به طور انحصاری به CMO Insider گفت که در حال برداشتن گام‌های جدیدی برای مبارزه با هرزنامه‌ها و حفظ مکالمات انسانی در مرکز پلتفرم خود است. اول، از نمایش هرزنامه مشکوک در فید اصلی خانه تا زمانی که در حال بررسی است جلوگیری می کند. Reddit در آزمایش گفت، این رویکرد اسپم را در فید خانگی تا 28 درصد، گزارش‌های کاربر از هرزنامه در فید را تا 11 درصد کاهش می‌دهد و اعلان‌های حاوی هرزنامه را تا 7 درصد کاهش می‌دهد. این شرکت قصد دارد در ادامه این رویکرد را در نتایج جستجو آزمایش کند. Reddit همچنین در حال انجام چند مرحله دیگر است: این شرکت قصد دارد به کاربران توضیح دهد که چرا محتوای خاصی را هرزنامه می‌داند، به جای اینکه صرفاً «حذف شده توسط Reddit» را نشان دهد. پست‌ها یا نظراتی را از حساب‌هایی که از آنها خواسته شده است که انسان بودن یا ثبت خودکار آنها را تأیید کنند، توصیه نمی‌کند، اما هنوز این کار را انجام نداده است. آدام کالینز، مدیر ارشد ارتباطات Reddit. هدف ما حفظ آن برای آینده نیز است. Reddit گفت که یک شبکه هماهنگ از 485 حساب کاربری را کشف کرده است که بیش از 44000 قطعه محتوا را در سراسر این پلتفرم ایجاد می کند که اغلب در مورد کار و بهره وری است. این حساب‌ها خود را به‌عنوان کاربران عادی معرفی می‌کردند، اما در واقع به مشاغل مرتبط بودند"}, {"source": "Business Insider", "title": "Adtech vet Brian O'Kelley's startup is pivoting to AI agents and rebranding with a new name", "link": "https://www.businessinsider.com/brian-okelley-scope3-rebrand-apostra-agentic-ai-ad-buying-2026-9", "summary": "Apostra cofounders Brian O Kelley and Anne Coghlan Franco Vogt Pivot! Adtech veteran Brian O'Kelley's Scope3 startup is rebranding. Apostra wants to become a leader in agentic AI advertising. The startup acts as an \"orchestration layer\" connecting advertiser agents with publisher agents. Adtech veteran Brian O'Kelley , once described as the \"master of the hard pivot,\" is pushing the reset button again. O'Kelley and his cofounder, Anne Coghlan, exclusively told CMO Insider that they are renaming their company from Scope3 to Apostra as they aim to make the startup a leader in agentic AI advertising. They describe Apostra as a platform that connects advertisers' AI agents with AI agents representing media sellers, so that marketers don't have to build separate integrations with potentially thousands of publishers, platforms, and other media providers. O'Kelley told CMO Insider that advertising has been constrained by a fragmented media infrastructure, manual processes, and a programmatic advertising landscape organized around real-time bidding but not optimized for the most highly valued ad placements. \"You can't buy anything that's not a rectangle with a cookie,\" O'Kelley said. Apostra is designed to let AI agents handle the work of negotiating and managing ad campaigns across various publishers, including online placements, linear TV, and in-store audio, and to connect brands with creators and clippers. The advertiser agent makes the media owner's agent aware of the marketer's goals, while the media owner's agent can bring forward details about the publisher's audience and potential ad opportunities. Apostra uses AdCP, a protocol created last year by a consortium of adtech companies, including Scope3, that provides a common language for agents to interact. Apostra said this makes it easier for marketers to place ads in channels such as \"walled garden\" social platforms , podcasts, or out-of-home advertising, which are traditionally harder to reach through programmatic ad buying. Unlike traditional programmatic advertising , this doesn't involve software bidding on individual ad impressions in real time. Instead, the agents can automate parts of the slower process of discovering, negotiating, approving, and executing media deals. The company says it's working with 40 media partners and has built AdCP adapters for major ad platforms, including Google, Meta, Amazon, Reddit, and ChatGPT Ads. Apostra said it is already running seven-figure campaigns through the s", "date_str": "2026-09-23T12:00:01+00:00", "hash": "0182e1c5b63ebc84", "title_fa": "استارت‌آپ برایان اوکلی، دامپزشک Adtech، به عوامل هوش مصنوعی می‌پردازد و با نامی جدید برند خود را تغییر می‌دهد.", "summary_fa": "بنیانگذاران آپوسترا برایان او کلی و آن کوگلان فرانکو فوگت پیوت! استارت‌آپ Scope3 کهنه کار Adtech برایان اوکلی در حال تغییر نام تجاری است. آپوسترا می خواهد در تبلیغات هوش مصنوعی عاملی تبدیل شود. این استارتاپ به عنوان یک «لایه هماهنگ‌سازی» عمل می‌کند که عاملان تبلیغ‌کننده را با نمایندگان ناشر مرتبط می‌کند. برایان اوکلی، کهنه کار Adtech، که زمانی به عنوان \"ارباب محور سخت\" توصیف می شد، دوباره دکمه تنظیم مجدد را فشار می دهد. O'Kelley و بنیانگذارش، Anne Coghlan، به طور انحصاری به CMO Insider گفتند که نام شرکت خود را از Scope3 به Apostra تغییر می‌دهند، زیرا قصد دارند این استارتاپ را به یک رهبر در تبلیغات هوش مصنوعی تبدیل کنند. آنها آپوسترا را به عنوان پلتفرمی توصیف می‌کنند که عوامل هوش مصنوعی تبلیغ‌کنندگان را با عوامل هوش مصنوعی که فروشنده‌های رسانه‌ای را نمایندگی می‌کنند، به هم متصل می‌کند، به طوری که بازاریابان مجبور به ایجاد ادغام جداگانه با هزاران ناشر، پلتفرم، و سایر ارائه‌دهندگان رسانه‌ای نیستند. O'Kelley به CMO Insider گفت که تبلیغات توسط زیرساخت های رسانه ای پراکنده، فرآیندهای دستی، و یک چشم انداز تبلیغاتی برنامه ای سازماندهی شده حول مناقصه زمان واقعی محدود شده است، اما برای مکان های تبلیغاتی با ارزش بالا بهینه نشده است. اوکلی گفت: \"شما نمی توانید چیزی را که مستطیل نباشد با یک کوکی بخرید.\" Apostra طوری طراحی شده است که به عوامل هوش مصنوعی اجازه می دهد کار مذاکره و مدیریت کمپین های تبلیغاتی را در ناشران مختلف انجام دهند، از جمله مکان های آنلاین، تلویزیون خطی، و صدای داخل فروشگاه، و برای ارتباط برندها با سازندگان و برش دهندگان. عامل تبلیغ کننده، نماینده مالک رسانه را از اهداف بازاریاب آگاه می کند، در حالی که نماینده مالک رسانه می تواند جزئیاتی در مورد مخاطبان ناشر و فرصت های تبلیغاتی بالقوه ارائه دهد. Apostra از AdCP استفاده می کند،"}, {"source": "Business Insider", "title": "Legal AI startup Spellbook hired a new CMO — and she has strong opinions on avoiding 'creepy' AI marketing", "link": "https://www.businessinsider.com/legal-ai-startup-spellbook-appoints-meltem-kuran-berkowitz-cmo-2026-9", "summary": "Meltem Kuran-Berkowitz has joined Spellbook as its chief marketing officer. Meltem Kuran Berkowitz Legal AI startup Spellbook has appointed Meltem Kuran-Berkowitz as its CMO. Kuran-Berkowitz wants Spellbook's marketing to help it hit the $100 million mark. Spellbook is embracing AI, but she draws the line at using it to impersonate human communication. The new CMO of a legal tech startup has a message for marketers: Stop using AI to pretend to be human. Spellbook, which offers AI tools for drafting and analyzing legal contracts, exclusively told CMO Insider that it had appointed Meltem Kuran-Berkowitz as its chief marketing officer. She is taking the top marketing role full time after a brief stint freelancing for the company. Kuran-Berkowitz previously spent five and a half years as head of growth at the payroll and workforce platform Deel, overseeing the company's growth to $1 billion in annual recurring revenue. Kuran-Berkowitz joins Spellbook as it, too, is leveling up. In October 2025, the company raised $50 million in Series B funding at a $350 million valuation, led by Khosla Ventures. In March, the company secured a $40 million debt facility, which it said it would put toward acquiring rival generative AI companies. The legal tech space is booming. Investors poured $2 billion into startups building for the legal sector in the first half of this year, per the market research firm Crunchbase, as AI has transformed one of Silicon Valley's sleepier corners into one of its hottest. Legal AI specialists like Harvey and Legora are competing alongside tech giants like OpenAI as law firms and corporate legal teams race to adopt tools that promise to automate grunt work. Kuran-Berkowitz said an early measure of her success will be helping the company hit $100 million in revenue by the end of this year. Getting there, she said, means making far more potential customers aware of the company. She doesn't plan to flood them with AI-generated marketing, though. \"If we're going to get somebody's eyeballs, whether it's in an email or an Instagram post, we're going to be honest with you about it: it's going to be made from another human, and we're not going to waste your time,\" Kuran-Berkowitz said. There are places where Kuran-Berkowitz thinks AI can be useful in marketing, from mining sales calls for insights to building internal presentation decks . She draws the line when it starts to impersonate human interaction. \"My inbox has blown out with cold emails becaus", "date_str": "2026-09-23T12:00:01+00:00", "hash": "c8648549f426c873", "title_fa": "استارت‌آپ قانونی هوش مصنوعی Spellbook یک مدیر ارشد اجرایی جدید استخدام کرد – و او نظرات محکمی در مورد اجتناب از بازاریابی هوش مصنوعی «وحشتناک» دارد.", "summary_fa": "Meltem Kuran-Berkowitz به عنوان مدیر ارشد بازاریابی به Spellbook پیوست. استارتاپ Meltem Kuran Berkowitz Legal AI Spellbook، Meltem Kuran-Berkowitz را به عنوان مدیر اجرایی خود منصوب کرده است. Kuran-Berkowitz می خواهد که بازاریابی Spellbook به آن کمک کند تا به مرز 100 میلیون دلار برسد. اسپل بوک هوش مصنوعی را در آغوش می کشد، اما با استفاده از آن برای جعل هویت ارتباط انسانی، خط و نشان می دهد. مدیر عامل جدید یک استارت آپ حقوقی فناوری پیامی برای بازاریابان دارد: استفاده از هوش مصنوعی را برای تظاهر به انسان بودن متوقف کنید. Spellbook که ابزارهای هوش مصنوعی را برای تهیه و تجزیه و تحلیل قراردادهای قانونی ارائه می دهد، به طور انحصاری به CMO Insider گفت که Meltem Kuran-Berkowitz را به عنوان مدیر ارشد بازاریابی خود منصوب کرده است. او پس از مدت کوتاهی به عنوان فریلنسری برای شرکت، نقش برتر بازاریابی را تمام وقت بر عهده می گیرد. کوران-برکوویتز قبلاً پنج سال و نیم به عنوان رئیس رشد در پلتفرم حقوق و دستمزد و نیروی کار Deel گذرانده بود و بر رشد شرکت تا یک میلیارد دلار درآمد مکرر سالانه نظارت داشت. Kuran-Berkowitz به Spellbook ملحق می شود زیرا آن نیز در حال ارتقاء سطح است. در اکتبر 2025، این شرکت 50 میلیون دلار سرمایه سری B را با ارزش 350 میلیون دلار به رهبری Khosla Ventures جذب کرد. در ماه مارس، این شرکت یک تسهیلات بدهی 40 میلیون دلاری را تضمین کرد که گفت آن را برای خرید شرکت‌های رقیب هوش مصنوعی مولد اختصاص خواهد داد. فضای فناوری حقوقی در حال رونق است. به گفته شرکت تحقیقات بازار Crunchbase، سرمایه‌گذاران در نیمه اول سال جاری 2 میلیارد دلار برای ساخت استارت‌آپ‌ها برای بخش حقوقی سرمایه‌گذاری کردند، زیرا هوش مصنوعی یکی از گوشه‌های خواب‌آلود سیلیکون ولی را به یکی از داغ‌ترین نقاط آن تبدیل کرده است. متخصصان حقوقی"}, {"source": "Business Insider", "title": "I’m a travel influencer who works every day while building my own business. Here are 4 ways I avoid burnout.", "link": "https://www.businessinsider.com/here-are-ways-avoid-work-burnout-as-influencer-2026-9", "summary": "The offers and details on this page may have updated or changed since the time of publication. See our article on Business Insider for current information. Rhiannon Wood, 26, started her journey as a solo-traveler and micro influencer by first taking odd jobs around the world. Courtesy of Rhiannon Wood Rhiannon Wood, 26, is a travel influencer with about 60,000 Instagram followers. She works without an agent, preferring the freedom that comes with managing her own content. Here are the ways she avoids burnout from the extra workload an agent would normally absorb. This as-told-to essay is based on a conversation with Rhiannon Wood , a 26-year-old travel micro influencer who runs a social media business and leads group tours around the world. It has been edited for length and clarity. I built my social media following from the ground up as a postgrad student working odd jobs around the world. Today, my work as a travel influencer continues to grow by the day, both in my following and in the number of brand deals I secure. I also partner with tourism companies to earn money leading adventure group trips around the world, though I'm building my own travel agency to launch next year. I take pride in doing everything myself, but there's a downside to taking on all the work: it sometimes feels like I'm skirting on the edge of burnout. I work almost every day negotiating deals, planning trips, scheduling posts, and engaging with my audience. While some influencers hire a social media agent to reduce their workload, I choose to work without one. Earlier this year, several agencies offered to take 25% to 30% of my earnings in exchange for potentially securing more brand deals — and income — for me. Ultimately, I declined. It's unclear whether working without an agent earns me more or less money, but, for now, I prefer the freedom and control of handling the work myself. I can post and interact with my followers exactly when and how I want. I also have a highly engaged account , which I've used to build trust with the online and offline communities I've cultivated over the years. One bad interaction could jeopardize that trust. Still, I've had to learn that working every day isn't sustainable. I've gotten better at stepping away from my work and making time to rest, rather than feeling like I always need to be doing something. Here's how I stay on top of my work while ensuring I have a life outside it. Learn how to say no to plans Rhiannon Wood is a social media inf", "date_str": "2026-09-23T11:47:16+00:00", "hash": "bf10c718ac26639e", "title_fa": "من یک تأثیرگذار سفر هستم که هر روز در حین ساختن کسب و کار خودم کار می کنم. در اینجا 4 راه برای جلوگیری از فرسودگی وجود دارد.", "summary_fa": "پیشنهادها و جزئیات موجود در این صفحه ممکن است از زمان انتشار به روز شده یا تغییر کرده باشند. برای اطلاعات فعلی به مقاله ما در Business Insider مراجعه کنید. ریانون وود، 26 ساله، سفر خود را به عنوان یک مسافر انفرادی و میکرو اینفلوئنسر با شروع مشاغل عجیب و غریب در سراسر جهان آغاز کرد. با حسن نیت از Rhiannon Wood Rhiannon Wood، 26 ساله، یک تأثیرگذار در سفر با حدود 60000 فالوور اینستاگرام است. او بدون نماینده کار می کند و آزادی مدیریت محتوای خودش را ترجیح می دهد. در اینجا روش هایی است که او از فرسودگی ناشی از بار کاری اضافی که یک نماینده معمولاً جذب می کند جلوگیری می کند. این مقاله گفته شده بر اساس گفتگو با ریانون وود، یک میکرو اینفلوئنسر 26 ساله در سفر است که یک تجارت رسانه های اجتماعی را اداره می کند و تورهای گروهی را در سراسر جهان هدایت می کند. برای طول و وضوح ویرایش شده است. من به عنوان یک دانشجوی فوق لیسانس که در سرتاسر جهان کارهای عجیب و غریب انجام می‌دادم، دنبال‌کنندگان رسانه‌های اجتماعی‌ام را از ابتدا ایجاد کردم. امروزه، کار من به‌عنوان یک تأثیرگذار سفر، هم از نظر فالوورهای من و هم در تعداد معاملات برندی که تضمین می‌کنم، روز به روز در حال رشد است. من همچنین با شرکت‌های گردشگری همکاری می‌کنم تا از سفرهای گروهی ماجراجویانه در سراسر جهان درآمد کسب کنم، اگرچه در حال ساخت آژانس مسافرتی خود هستم که سال آینده راه‌اندازی شود. من افتخار می کنم که همه کارها را خودم انجام می دهم، اما انجام همه کارها یک جنبه منفی دارد: گاهی اوقات احساس می شود که در لبه فرسودگی شغلی هستم. من تقریباً هر روز برای مذاکره در مورد معاملات، برنامه ریزی سفرها، برنامه ریزی پست ها و تعامل با مخاطبانم کار می کنم. در حالی"}, {"source": "Business Insider", "title": "I bought cardigans from Old Navy, Gap, and Banana Republic. They were all nice, but I'll be wearing one all season long.", "link": "https://www.businessinsider.com/review-trying-on-cardigans-old-navy-gap-banana-republic-2026-9", "summary": "I ordered similar cardigans from Old Navy, Gap, and Banana Republic. Karen Santos for BI On crisp fall mornings when I don't have the energy to put together an outfit, I reach for my favorite cardigan. This versatile sweater is easy to style with a T-shirt and jeans for a casual day, or layer over a dress when I want something a little more polished. However, I wanted to find a new go-to cardigan I'd actually reach for on repeat, so I tested similar styles from three brands I already shop regularly — Old Navy, Gap, and Banana Republic . A good cardigan is a fall-fashion staple. Karen Santos for BI I bought one from each store, then wore them for a variety of occasions. I compared the cardigans based on comfort, material, design, fit, and quality. Although I loved them all, there's one I know I'll be wearing consistently this season. The option from Old Navy was the most classic. Karen Santos for BI I'm a fan of Old Navy for its range of wardrobe basics within a reasonable price range, so I knew I'd find a decent cardigan there. I ordered the SoSoft cotton crew-neck cardigan in a chocolate brown colorway, and was drawn to the rich, fall-ready hue and traditional knit design. Once I put it on, I loved these features even more. The material felt comfortable and soft on my skin. When I checked the tag, I was pleasantly surprised to see that it was crafted from 100% cotton. This cardigan cost me $43, which is slightly higher than Old Navy's usual pricing, but worth it for such a soft feel. Karen Santos for BI However, the fit made me feel a bit frumpy when it was buttoned up, and the fabric sagged a bit loosely around my waist and shoulders. So, I wore this sweater unbuttoned and layered over a tank for a night out to dinner and drinks with friends. I paired it with capris and kitten heels , which looked elevated and on-trend. Once the weather cools down more, this cardigan would be a stylish layering piece with a scarf or overcoat. Next, I tested the Gap cardigan, which offered a more relaxed and versatile look. Karen Santos for BI Gap is one of my tried-and-true retailers for clothing essentials , and its website offers a wide variety of cardigan styles to choose from. I went with the modern crewneck cardigan , also in a warm-brown shade. After taking it out of the package, I noticed that the material — made of 58% cotton, 38% modal, and 4% elastane — was more similar to that of a T-shirt than a sweater. I didn't mind it, though. I actually think it makes thi", "date_str": "2026-09-23T11:37:01+00:00", "hash": "5035e41ad53813fe", "title_fa": "ژاکت‌های پشمی از Old Navy، Gap و Banana Republic خریدم. همه آنها خوب بودند، اما من در تمام فصل یکی را می پوشم.", "summary_fa": "من ژاکت های پشمی مشابه را از Old Navy، Gap و Banana Republic سفارش دادم. کارن سانتوس برای BI در صبح‌های تند پاییزی که انرژی لازم برای چیدن یک لباس را ندارم، به سراغ ژاکت کش باف پشمی مورد علاقه‌ام می‌روم. این ژاکت همه کاره را به راحتی می توان با یک تی شرت و شلوار جین برای یک روز معمولی مدل داد، یا زمانی که می خواهم چیزی کمی براق تر داشته باشم، روی یک لباس قرار می گیرد. با این حال، من می‌خواستم یک ژاکت کش باف پشمی جدید پیدا کنم که در واقع می‌توانستم آن را تکرار کنم، بنابراین سبک‌های مشابه را از سه برندی که قبلاً به طور مرتب خرید می‌کردم، آزمایش کردم - Old Navy، Gap، و Banana Republic. یک ژاکت کش باف پشمی خوب یکی از لوازم اصلی مد پاییزی است. کارن سانتوس برای BI من از هر فروشگاه یکی خریدم، سپس آنها را برای موارد مختلف پوشیدم. من ژاکت‌ها را بر اساس راحتی، جنس، طراحی، تناسب و کیفیت مقایسه کردم. اگرچه من همه آنها را دوست داشتم، اما می دانم یکی از آنها را به طور مداوم در این فصل می پوشم. گزینه Old Navy کلاسیک ترین بود. کارن سانتوس برای BI من از طرفداران Old Navy به دلیل طیف اولیه کمد لباس آن در محدوده قیمت مناسب هستم، بنابراین می دانستم که یک ژاکت کش باف پشمی مناسب را در آنجا پیدا می کنم. من ژاکت کش باف پشمی یقه نخی SoSoft را با رنگ قهوه ای شکلاتی سفارش دادم و به رنگ غنی و آماده برای پاییز و طرح بافتنی سنتی جذب شدم. وقتی آن را گذاشتم، این ویژگی ها را بیشتر دوست داشتم. این مواد روی پوست من راحت و نرم بود. وقتی برچسب را بررسی کردم، با تعجب دیدم که از 100٪ پنبه ساخته شده است. این ژاکت کش"}, {"source": "Business Insider", "title": "OpenAI is enlisting an influencer army to make it look 'good for the world'", "link": "https://www.businessinsider.com/inside-open-ai-influencer-marketing-strategy-chatgpt-ads-sponsorships-instagram-2026-9", "summary": "OpenAI; Getty Images; Alyssa Powell/BI OpenAI is ramping up its influencer strategy as AI hate spikes. It's asking creators to share how ChatGPT is improving their lives and is \"good for the world.\" Not on the messaging agenda: killer robots or noisy data centers. AI's reputation is in hot water. Can influencers save it? OpenAI has been ramping up its creator marketing efforts as AI safety concerns take center stage. The company isn't asking influencers to assuage fears that a rogue AI could destroy humanity . Instead, it's prompting them to showcase why ChatGPT is \"cool , \" per one influencer talent manager , or how it can support work that's \"good for the world,\" according to one campaign pitch viewed by Business Insider. OpenAI doubled the number of sponsored Instagram posts promoting ChatGPT from 61 in June to 122 in July, and then increased it further to 141 in August, according to data compiled by the influencer marketing platform HypeAuditor. Business Insider reviewed dozens of sponsored posts for OpenAI's ChatGPT product, and spoke with six managers and creators who had worked with the company. The company is casting a wide net, reaching out to parenting and fitness influencers as well as tech-savvy creators to broaden its user base and grow its advertising business. The message: ChatGPT can help you parent, run a business, create content, plan a workout, and be a good person. OpenAI's influencer strategy can be split into two buckets: getting businesses to pay for enterprise tools and keeping millions of consumers coming back to ChatGPT. Working with OpenAI can be risky for creators. Some influencers who post sponsored content for AI companies are getting dragged by their audiences. A small group of creators who attended an OpenAI brand trip in August were told their content was \"morally bankrupt\" and \"dystopian\" in their comments sections. That hasn't stopped companies like OpenAI, Anthropic, and Higgsfield AI from pitching influencers. \"In the five inboxes that I manage alone, every single day, I would say at least 15 emails are from an AI company or some AI feature,\" Amanda Acevedo, a talent manager at G B Digital Management, told Business Insider. Creator Natasha Badger, who makes content about marketing and tech, said it was a \"big war\" between AI companies over \"who can get the most market share and work with the most influencers.\" Influencers are painting OpenAI's portrait Creators are a crucial part of OpenAI's public relations. They're \"h", "date_str": "2026-09-23T11:30:01+00:00", "hash": "404aaed17aa4a3bf", "title_fa": "OpenAI در حال استخدام ارتش اینفلوئنسر است تا آن را برای جهان خوب جلوه دهد.", "summary_fa": "OpenAI؛ گتی ایماژ; Alyssa Powell/BI OpenAI در حال افزایش استراتژی اینفلوئنسر خود با افزایش نفرت هوش مصنوعی است. از سازندگان می‌خواهد به اشتراک بگذارند که چگونه ChatGPT زندگی آنها را بهبود می‌بخشد و \"برای جهان خوب است\". در دستور کار پیام رسانی نیست: روبات های قاتل یا مراکز داده پر سر و صدا. شهرت هوش مصنوعی در آب گرم است. آیا اینفلوئنسرها می توانند آن را نجات دهند؟ OpenAI تلاش‌های بازاریابی خالق خود را افزایش داده است زیرا نگرانی‌های ایمنی هوش مصنوعی در کانون توجه قرار گرفته است. این شرکت از اینفلوئنسرها نمی‌خواهد که ترس از اینکه یک هوش مصنوعی سرکش می‌تواند بشریت را نابود کند، کاهش دهند. در عوض، آن‌ها را بر آن می‌دارد تا نشان دهند چرا ChatGPT برای هر مدیر استعداد تأثیرگذار «باحال» است، یا چگونه می‌تواند از کارهایی که «برای جهان خوب است» پشتیبانی کند، طبق یک پیشنهاد کمپین که توسط Business Insider مشاهده شده است. بر اساس داده‌های جمع‌آوری‌شده توسط پلتفرم بازاریابی اینفلوئنسر HypeAuditor، OpenAI تعداد پست‌های حمایت‌شده اینستاگرامی را که ChatGPT را تبلیغ می‌کنند از ۶۱ در ژوئن به ۱۲۲ در ماه جولای دو برابر کرد و سپس آن را به ۱۴۱ در آگوست افزایش داد. Business Insider ده ها پست حمایت شده برای محصول ChatGPT OpenAI را بررسی کرد و با شش مدیر و خالقانی که با این شرکت کار کرده بودند صحبت کرد. این شرکت شبکه گسترده‌ای ایجاد کرده است و با تأثیرگذاران والدین و تناسب اندام و همچنین سازندگان متبحر در فناوری ارتباط برقرار می‌کند تا پایگاه کاربران خود را گسترش دهد و تجارت تبلیغاتی خود را توسعه دهد. پیام: ChatGPT می تواند به شما کمک کند والدین، راه اندازی یک کسب و کار، ایجاد محتوا، برنامه ریزی برای تمرین، و فرد خوبی باشید. استراتژی اینفلوئنسر OpenAI را می توان به دو سطل تقسیم کرد: واداشتن کسب و کارها به پرداخت"}, {"source": "Business Insider", "title": "Mozilla is plastering New York with posters mocking tech billionaires as part of a new marketing campaign", "link": "https://www.businessinsider.com/mozillas-new-ad-campaign-features-posters-criticizing-big-tech-execs-2026-9", "summary": "The Mozilla Foundation is putting up posters in New York calling out Big Tech execs as part of a new marketing campaign promoting its fellowship program. Courtesy of the Mozilla Foundation. The Mozilla Foundation is coming after Big Tech in a new ad campaign launching Wednesday. The ads criticize execs like Mark Zuckerberg and Elon Musk and praise Mozilla's own tech fellows. The campaign features a series of posters hung near the United Nations and tech-worker hot spots. The Mozilla Foundation isn't holding back its disdain for Big Tech leaders. This week, it's hanging up posters around New York calling out tech executives like Mark Zuckerberg and Elon Musk and hyping up its own class of technology fellows as part of a new ad campaign. The campaign is meant to juxtapose the work of Musk, Zuckerberg, and Jeff Bezos with lesser-known projects from technologists like Rose Njeri Tunguru, a member of Mozilla's fellowship program who is building infrastructure to help Kenyans independently verify election results. \"What we really wanted to do was poke a hole in the mythology that tech innovation happens in one particular way,\" said Ziyaad Bhorat, Mozilla's vice president of imagination and strategic growth. Society is \"hyper-focused on one idea of tech genius\" and \"a lot of people are working on better things and alternatives,\" he said. The goal is to build awareness of the work of Mozilla's fellow class and, hopefully, drive additional online attention as passersby spot the posters and share them on social media. The Mozilla Foundation is a nonprofit that owns Mozilla Corporation, a for-profit subsidiary that makes the web browser Firefox and other products. It works with techies, researchers, and others to fund projects that support an open internet, ethical data practices, and trustworthy AI tools. Mozilla doesn't pull its punches in the ads when attacking tech's billionaire class. Its poster of Zuckerberg, for example, references troubles his company, Meta, has run into with its camera glasses, which some wearers have used to harass strangers and prank store workers . \"Mark gets into eyewear\" and \"makes creepers, peepers,\" it reads. Meta executives have acknowledged bad behavior tied to their glasses, with Instagram's CEO, Adam Mosseri, writing in July that the company would take down footage if users were \"surreptitiously taking videos of other people and harassing them and then posting them on our platform.\" A Meta spokesperson said the company disables th", "date_str": "2026-09-23T11:00:01+00:00", "hash": "dbf9f2aa22844d31", "title_fa": "موزیلا به عنوان بخشی از یک کمپین بازاریابی جدید، نیویورک را با پوسترهایی که میلیاردرهای فناوری را تمسخر می کند، پوشانده است.", "summary_fa": "بنیاد موزیلا به عنوان بخشی از یک کمپین بازاریابی جدید که برنامه مشارکت خود را تبلیغ می کند، پوسترهایی را در نیویورک نصب می کند که در آن مدیران فناوری بزرگ را فرا می خواند. با حسن نیت از بنیاد موزیلا. بنیاد موزیلا در کمپین تبلیغاتی جدیدی که چهارشنبه راه اندازی می شود، پس از Big Tech آمده است. این تبلیغات مدیرانی مانند مارک زاکربرگ و ایلان ماسک را مورد انتقاد قرار می دهند و همکاران فنی خود موزیلا را ستایش می کنند. این کمپین دارای یک سری پوستر است که در نزدیکی سازمان ملل متحد و نقاط داغ کارکنان فناوری آویزان شده است. بنیاد موزیلا از تحقیر رهبران فناوری بزرگ جلوگیری نمی کند. این هفته، پوسترهایی را در گوشه و کنار نیویورک آویزان می کند که در آن از مدیران فناوری مانند مارک زاکربرگ و ایلان ماسک فراخوانی می کند و به عنوان بخشی از یک کمپین تبلیغاتی جدید، کلاس خود را از همکاران فناوری تبلیغ می کند. این کمپین قرار است کارهای ماسک، زاکربرگ و جف بزوس را با پروژه‌های کمتر شناخته‌شده‌ای از فن‌آورانی مانند رز نجری تونگورو، یکی از اعضای برنامه مشارکت موزیلا که در حال ایجاد زیرساخت‌ها برای کمک به کنیایی‌ها برای تأیید مستقل نتایج انتخابات است، در کنار هم قرار دهد. Ziyaad Bhorat، معاون تخیل و رشد استراتژیک موزیلا گفت: «آنچه ما واقعاً می‌خواستیم انجام دهیم این بود که در اسطوره‌شناسی حفره‌ای ایجاد کنیم که نوآوری در فناوری به یک روش خاص اتفاق می‌افتد. او گفت که جامعه \"بیش از حد بر یک ایده از نبوغ فناوری متمرکز شده است\" و \"بسیاری از مردم روی چیزها و جایگزین های بهتر کار می کنند.\" هدف افزایش آگاهی از کار همکلاسی های موزیلا است و امیدواریم با دیدن پوسترها و به اشتراک گذاری آنها در رسانه های اجتماعی، توجه آنلاین بیشتری را جلب کنیم. بنیاد موزیلا یک"}, {"source": "Business Insider", "title": "The AI trade found a new Muse. Now the market's pecking order is getting reshuffled.", "link": "https://www.businessinsider.com/meta-muse-ai-agent-reshuffles-stock-market-winners-losers-brokers-2026-9", "summary": "Meta CEO Mark Zuckerberg. Bloomberg/Getty Images Meta's annual developer conference kicks off today as the company leads a wave of interest in agentic AI. The smash debut of its Muse personal agent has roiled the AI trade, minting new winners and losers. Sign up for First Trade , Business Insider's daily markets newsletter. When are we going to stop counting out Mark Zuckerberg ? As concerns over AI mounted over the summer, Meta was one of the companies hit hardest . Investors were particularly skeptical about the firm's massive capex-spending plans, especially since Meta was seen as more concentrated on AI than fellow hyperscalers like Microsoft. But the roaring success of Muse , Meta's new personal AI agent , has ignited a whole new discussion about AI use cases (\"musecases,\" anyone?) It's also shed light on which parts of the market could win or lose in an era of agentic growth. Let's start with Meta itself. The company's stock is at its highest level since last October, up 19% since Muse launched on Sept. 8. Much of that came Monday, when it soared 11% after Muse hit No. 1 on Apple's App Store over the weekend. Meta's more zoomed-out stock chart is remarkably choppy. It seems that no matter how many times shares get knocked down, Zuck always has another ace up his sleeve. But it's important to note that the success of Muse so far has been based on rapid consumer adoption. Turning that into revenue is another story. At this point, investors are betting Meta can turn its enormous user base and app ecosystem into a lucrative new business. The trust question Muse's breakout comes as Meta Connect — the company's annual developer conference — begins today, giving the company a chance to address the fervor and tease what comes next. Meta's goal is to turn Muse into a new revenue stream beyond advertising. The basic version is free, but the company already offers $20- and $100-a-month tiers for heavier users. Its next challenge will be convincing people to hand over the reins of their lives — and pay for the privilege. After all, Muse doesn't just collect data . It can enter apps and websites to handle tasks like shopping, making travel plans, and writing emails. It could end up being a tough sell for Meta, which is such a lightning rod that its controversies become Hollywood movies. A shuffling of winners and losers This is far from just a Meta story. Chipmakers have been pulled along for the ride this week, with the Philadelphia Semiconductor Index up more t", "date_str": "2026-09-23T09:50:01+00:00", "hash": "2c99ae87bf87505f", "title_fa": "تجارت هوش مصنوعی یک Muse جدید پیدا کرد. اکنون نظم نوک زننده بازار در حال تغییر است.", "summary_fa": "مارک زاکربرگ مدیر عامل متا. کنفرانس سالانه توسعه دهندگان بلومبرگ/گتی ایماژ متا امروز آغاز می شود زیرا این شرکت موجی از علاقه را به هوش مصنوعی رهبری می کند. اولین بازی بزرگ نماینده شخصی Muse آن تجارت هوش مصنوعی را متلاطم کرده است و برندگان و بازندگان جدیدی را ایجاد می کند. برای اولین تجارت، خبرنامه بازارهای روزانه Business Insider ثبت نام کنید. چه زمانی قرار است از شمارش مارک زاکربرگ دست برداریم؟ از آنجایی که نگرانی ها در مورد هوش مصنوعی در تابستان افزایش یافت، متا یکی از شرکت هایی بود که بیشترین آسیب را دید. سرمایه‌گذاران به‌ویژه در مورد برنامه‌های مخارج کلان شرکت با شک و تردید بودند، به‌ویژه از آنجایی که متا در مقایسه با ابرمقیاس‌سازان دیگر مانند مایکروسافت بیشتر بر هوش مصنوعی متمرکز بود. اما موفقیت خروشان Muse، عامل هوش مصنوعی شخصی جدید متا، بحث کاملا جدیدی را در مورد موارد استفاده از هوش مصنوعی (\"مجوزهای موزه\"، هر کسی؟) برانگیخته است. بیایید با خود متا شروع کنیم. سهام این شرکت در بالاترین سطح خود از اکتبر گذشته قرار دارد، یعنی 19 درصد از زمان راه اندازی Muse در 8 سپتامبر. بیشتر آن روز دوشنبه بود، زمانی که پس از اینکه Muse در آخر هفته به رتبه 1 اپ استور اپل رسید، 11 درصد افزایش یافت. نمودار سهام کوچک‌تر متا به‌طور قابل‌توجهی متلاطم است. به نظر می‌رسد مهم نیست که چند بار سهام خراب می‌شوند، زاک همیشه یک آس دیگر در آستین خود دارد. اما ذکر این نکته مهم است که موفقیت Muse تاکنون بر پایه پذیرش سریع مصرف کنندگان بوده است. تبدیل آن به درآمد داستان دیگری است. در این مرحله، سرمایه‌گذاران شرط می‌بندند متا می‌تواند پایگاه کاربری عظیم و اکوسیستم اپلیکیشن خود را به یک تجارت جدید و سودآور تبدیل کند. سوال اعتماد فراگیر Muse در حالی مطرح می شود که Meta Connect - کنفرانس"}, {"source": "Business Insider", "title": "I wanted to live in the US, then had a game-changing visit to Europe. Here's why I chose Germany.", "link": "https://www.businessinsider.com/worked-us-europe-why-chose-germany-live-study-2026-9", "summary": "Ishansh Gupta, an Indian national, works at BMW and lives in Munich. Courtesy of Aditya Sharma Ishansh Gupta dreamed of studying in the US — until he heard about free education in Europe. Drawn by Germany's manufacturing strengths, he did his master's degree there instead of the US. Gupta now works at BMW. He's glad he didn't take the risk on an expensive US education. This as-told-to essay is based on a conversation with Ishansh Gupta, 29, who lives in Munich. The following has been edited for length and clarity. Growing up in India , I knew I wanted to live in the US one day. I had relatives who'd moved there, and the way Bollywood movies portrayed the American dream resonated with me. I was interested in technology, and some of the biggest opportunities were there. While completing my bachelor's degree in computer science and engineering in India, I applied for internships around the world to increase my chances of getting accepted by a US university for a master's degree. I interned in Poland for two six-week stints in 2017 and 2018. After spending time in Europe, instead of applying to US colleges, I went to university in Germany and now work at BMW. I got a taste of life in America in 2022, when I did an assignment in South Carolina. I left feeling glad that I built my life in Germany and didn't pay for an expensive US education . Learning that international students could get free tuition in Germany was game-changing During a trip to Berlin, I met a group of Indian people in a restaurant, who told me it was possible for international students to get free tuition at public universities in Germany. It was a game-changing moment for me. Even attending a private university in Germany felt more affordable than studying in the US, where I expected to pay around $100,000 for a master's degree , including tuition and living costs. While interning in Poland and visiting Germany, I had a really positive experience with European people and culture, and I was excited to explore different European countries . I was also impressed by Germany's manufacturing and engineering strengths, and the level of technical knowledge people had. In 2019, I started a master's degree in data engineering at a private institution in Germany. A partial scholarship meant tuition cost me 8,000 euros ($9,000) instead of 20,000 euros. I learned very basic German in India, but it was a very international, English-speaking university, so I didn't really struggle with a language barrier. ", "date_str": "2026-09-23T09:48:11+00:00", "hash": "76ff52f16a99443b", "title_fa": "من می خواستم در ایالات متحده زندگی کنم، سپس یک دیدار تغییر دهنده بازی از اروپا داشتم. به همین دلیل آلمان را انتخاب کردم.", "summary_fa": "ایشانش گوپتا، یک تبعه هندی، در BMW کار می کند و در مونیخ زندگی می کند. با حسن نیت از آدیتیا شارما ایشانش گوپتا آرزوی تحصیل در ایالات متحده را داشت - تا زمانی که در مورد تحصیل رایگان در اروپا شنید. او با توجه به نقاط قوت تولید آلمان، مدرک کارشناسی ارشد خود را به جای آمریکا در آنجا گذراند. گوپتا اکنون در BMW کار می کند. او خوشحال است که خطر تحصیل گران آمریکا را نپذیرفته است. این مقاله گفته شده بر اساس گفتگو با ایشانش گوپتا، 29 ساله، ساکن مونیخ است. موارد زیر برای طول و وضوح ویرایش شده است. وقتی در هند بزرگ شدم، می دانستم که می خواهم روزی در ایالات متحده زندگی کنم. من بستگانی داشتم که به آنجا نقل مکان کرده بودند، و شیوه ای که فیلم های بالیوود رویای آمریکایی را به تصویر می کشیدند در من طنین انداز شد. من به فناوری علاقه مند بودم و برخی از بزرگترین فرصت ها در آنجا بود. در حین گذراندن دوره لیسانس خود در رشته علوم و مهندسی کامپیوتر در هند، برای دوره های کارآموزی در سراسر جهان درخواست دادم تا شانس خود را برای پذیرش در دانشگاه های آمریکا برای مقطع کارشناسی ارشد افزایش دهم. من در سال های 2017 و 2018 برای دو دوره شش هفته ای در لهستان کارآموزی کردم. پس از گذراندن مدتی در اروپا، به جای درخواست برای کالج های ایالات متحده، به دانشگاه آلمان رفتم و اکنون در BMW کار می کنم. من طعم زندگی در آمریکا را در سال 2022، زمانی که در کارولینای جنوبی انجام وظیفه کردم، چشیدم. من از آنجا خوشحال شدم که زندگی خود را در آلمان ساختم و برای تحصیل گران در ایالات متحده هزینه ای پرداخت نکردم. یادگیری این که دانشجویان بین المللی می توانند در آلمان شهریه رایگان دریافت کنند، بازی"}, {"source": "Business Insider", "title": "Tune out geopolitics because Q3 earnings are going to be stellar, Deutsche's US stock chief says", "link": "https://www.businessinsider.com/stock-market-q3-earnings-outlook-trump-xi-china-geopolitical-risks-2026-9", "summary": "Bloomberg/Getty Images Investors are focused on the Trump-Xi summit, but Deutsche Bank says Q3 earnings matter most. Binky Chadha sees strong Q3 earnings driving a market rally amid recent volatility. Deutsche Bank expects S P 500 earnings to grow 28% in 2026. Investors will be eagerly watching President Trump's summit with Chinese leader Xi Jinping this week as the two sides try to iron out a trade deal, but Deutsche Bank's top US equity strategist says not to sweat the results too much. The market hopes the meeting between the two global superpowers will lead to a cooling of trade tensions and a reduction in the steep tariffs in place. The US tariffs Chinese tech products, automobiles, steel, rare earth minerals, and more. Meanwhile, China has taxed American agricultural products and has restricted the export of critical metals. But no matter if a deal ultimately gets done this week or not, investors can probably tune the meeting out, says Binky Chadha, the chief US equity strategist at Deutsche Bank . That's thanks to the ongoing strength of the stock market's biggest driver: earnings. Third-quarter earnings season will be in full swing around mid-October, and Chadha expects the results will be stellar, especially relative to where stock prices sit today, setting up the market for a rally, spurring the bull market. When asked during an interview with CNBC on Tuesday whether the Trump-Xi meeting would have a market-moving impact, Chadha said that \"the potential for making some diplomatic progress is there, but other than that, no. I would say the biggest issue for the market really now is Q3 earnings.\" Earnings have been impressive so far in 2026, and expectations continue to rise. According to FactSet, consensus estimates are for 28.9% earnings growth for the S P 500 year-over-year in Q3. That would mark the third consecutive year quarter of annual earnings growth above 25%, FactSet said. In August, Deutsche Bank said it expects S P 500 earnings to grow by 28% in 2026. Chadha told CNBC that one indicator of upcoming earnings strength is the ongoing surge in manufacturing activity, which has been expanding since this past winter. Stocks are coming out of a rough patch stretching bak to the start of June. While a slew of strong Q2 earnings reports send the market soaring at the end of July into early August, the S P 500 was down by 75 basis points from June 2 as of September 16. Rising oil prices and higher Treasury yields have weighed on stock prices as ", "date_str": "2026-09-23T09:30:01+00:00", "hash": "374e83a1b665578d", "title_fa": "رئیس سهام ایالات متحده دویچه می گوید: ژئوپلیتیک را تنظیم کنید زیرا درآمدهای سه ماهه سوم بسیار عالی خواهد بود.", "summary_fa": "بلومبرگ/گتی ایماژ سرمایه گذاران روی نشست ترامپ و شی متمرکز هستند، اما دویچه بانک می گوید درآمد سه ماهه سوم بیشترین اهمیت را دارد. Binky Chadha شاهد درآمدهای قوی در سه ماهه سوم در میان نوسانات اخیر است. دویچه بانک انتظار دارد درآمد S P 500 در سال 2026 رشد 28 درصدی داشته باشد. سرمایه گذاران مشتاقانه شاهد نشست پرزیدنت ترامپ با شی جین پینگ، رهبر چین در این هفته خواهند بود، زیرا دو طرف تلاش می کنند تا یک معامله تجاری را به سرانجام برسانند، اما استراتژیست ارشد سهام ایالات متحده دویچه بانک می گوید که نباید زیاد به نتایج عرق کرد. بازار امیدوار است که دیدار دو ابرقدرت جهانی منجر به کاهش تنش‌های تجاری و کاهش تعرفه‌های سنگین شود. ایالات متحده بر محصولات فناوری چین، خودروها، فولاد، مواد معدنی خاکی کمیاب و غیره تعرفه می گذارد. در همین حال، چین از محصولات کشاورزی آمریکا مالیات گرفته و صادرات فلزات حیاتی را محدود کرده است. بینکی چادا، استراتژیست ارشد سهام ایالات متحده در دویچه بانک، می‌گوید، مهم نیست که یک معامله در این هفته انجام شود یا خیر، سرمایه‌گذاران احتمالاً می‌توانند جلسه را تنظیم کنند. این به لطف قدرت مداوم بزرگترین محرک بازار سهام: سود است. فصل سود سه ماهه سوم در اواسط اکتبر در نوسان کامل خواهد بود، و چادا انتظار دارد که نتایج فوق العاده باشد، به خصوص نسبت به جایی که قیمت سهام امروز در آن قرار دارد، بازار را برای صعود آماده می کند و بازار صعودی را تحریک می کند. هنگامی که در مصاحبه ای با CNBC در روز سه شنبه از چادا پرسیده شد که آیا دیدار ترامپ و شی تأثیری بر حرکت بازار خواهد داشت، چادا گفت که \"پتانسیل برای دستیابی به پیشرفت دیپلماتیک وجود دارد، اما غیر از این، خیر. من می گویم که بزرگترین مشکل بازار واقعاً در حال حاضر"}, {"source": "Business Insider", "title": "Bobbi Brown and other founders share their advice for starting your own company", "link": "https://www.businessinsider.com/founders-share-advice-launching-company-2026-9", "summary": "Kirill Bigai, CEO of Preply; Bobbi Brown, founder of Bobbi Brown Cosmetics and Jones Road Beauty; and Ben Goodwin, founder of Olipop. Preply/ANGELA WEISS/AFP/Olipop Americans filed over 3 million business applications in the first six months of the year. AI tools are making it easier for some entrepreneurs to build brands of their own. Business Insider spoke with five founders, including makeup mogul Bobbi Brown, about starting a business. Now might be the perfect time to launch that business you've been dreaming about. Americans filed more than 3 million applications to start businesses in the first
