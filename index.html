<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مجله خبری روزانه — ۱۹ آبان ۱۴۰۵</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root[data-theme="dark"] {
      --bg: #0b0f19;
      --header-bg: linear-gradient(135deg, #1e293b, #0f172a);
      --card-bg: #151d30;
      --card-border: #232f48;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --primary: #38bdf8;
      --primary-hover: #0284c7;
      --badge-bg: rgba(56, 189, 248, 0.15);
      --tab-bg: #151d30;
      --tab-border: #232f48;
      --tab-text: #94a3b8;
      --tab-active-bg: #38bdf8;
      --tab-active-text: #0f172a;
      --search-bg: #151d30;
      --search-border: #232f48;
      --toggle-bg: #1e293b;
      --toggle-border: #334155;
      --modal-bg: #151d30;
      --modal-border: #334155;
      --read-bg: #0d1322;
      --read-border: #1e293b;
      --success: #10b981;
    }
    :root[data-theme="light"] {
      --bg: #f8fafc;
      --header-bg: linear-gradient(135deg, #ffffff, #f1f5f9);
      --card-bg: #ffffff;
      --card-border: #e2e8f0;
      --text: #0f172a;
      --text-muted: #64748b;
      --primary: #0284c7;
      --primary-hover: #0369a1;
      --badge-bg: rgba(2, 132, 199, 0.1);
      --tab-bg: #ffffff;
      --tab-border: #e2e8f0;
      --tab-text: #64748b;
      --tab-active-bg: #0284c7;
      --tab-active-text: #ffffff;
      --search-bg: #ffffff;
      --search-border: #cbd5e1;
      --toggle-bg: #f1f5f9;
      --toggle-border: #cbd5e1;
      --modal-bg: #ffffff;
      --modal-border: #cbd5e1;
      --read-bg: #f1f5f9;
      --read-border: #e2e8f0;
      --success: #059669;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Vazirmatn', -apple-system, BlinkMacSystemFont, Tahoma, sans-serif;
    }
    body {
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.8;
      padding: 20px 12px;
      direction: rtl;
      transition: background-color 0.3s ease, color 0.3s ease;
    }
    .container {
      max-width: 880px;
      margin: 0 auto;
    }
    header {
      background: var(--header-bg);
      border: 1px solid var(--card-border);
      border-radius: 18px;
      padding: 22px 20px;
      margin-bottom: 20px;
      position: relative;
      text-align: center;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
      transition: all 0.3s ease;
    }
    .header-actions {
      position: absolute;
      top: 18px;
      left: 18px;
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .btn-action {
      background: var(--toggle-bg);
      border: 1px solid var(--toggle-border);
      color: var(--text);
      padding: 7px 12px;
      border-radius: 12px;
      cursor: pointer;
      font-size: 0.85rem;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-weight: 600;
      transition: all 0.2s ease;
    }
    .btn-action:hover {
      border-color: var(--primary);
    }
    h1 {
      font-size: 1.7rem;
      font-weight: 800;
      margin-bottom: 6px;
    }
    .meta-bar {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin-top: 12px;
      font-size: 0.85rem;
      color: var(--text-muted);
    }
    .meta-tag {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      padding: 4px 12px;
      border-radius: 9999px;
    }
    .search-box {
      margin-bottom: 18px;
    }
    .search-input {
      width: 100%;
      padding: 13px 18px;
      border-radius: 12px;
      background: var(--search-bg);
      border: 1px solid var(--search-border);
      color: var(--text);
      font-size: 0.95rem;
      outline: none;
      transition: all 0.2s ease;
    }
    .search-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2);
    }
    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      padding-bottom: 4px;
    }
    .tabs::-webkit-scrollbar {
      display: none;
    }
    .tab-btn {
      flex: 1;
      white-space: nowrap;
      padding: 12px 14px;
      border-radius: 12px;
      background: var(--tab-bg);
      border: 1px solid var(--tab-border);
      color: var(--tab-text);
      font-size: 0.92rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s ease;
      flex-shrink: 0;
    }
    .tab-btn.active {
      background: var(--tab-active-bg);
      color: var(--tab-active-text);
      border-color: var(--tab-active-bg);
    }
    .badge {
      background: rgba(0, 0, 0, 0.15);
      padding: 2px 7px;
      border-radius: 9999px;
      font-size: 0.8rem;
    }
    .news-grid {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .news-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 20px;
      transition: all 0.25s ease;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.03);
      position: relative;
    }
    .news-card:hover {
      border-color: var(--primary);
      transform: translateY(-2px);
    }
    .news-card.is-read {
      background: var(--read-bg);
      border-color: var(--read-border);
      opacity: 0.7;
    }
    .news-card.is-read:hover {
      opacity: 0.95;
    }
    .news-header {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 12px;
    }
    .news-num {
      background: var(--badge-bg);
      color: var(--primary);
      font-weight: 700;
      font-size: 0.85rem;
      min-width: 30px;
      height: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      margin-top: 2px;
      flex-shrink: 0;
    }
    .news-card.is-read .news-num {
      background: rgba(16, 185, 129, 0.15);
      color: var(--success);
    }
    .news-title {
      font-size: 1.1rem;
      font-weight: 700;
      line-height: 1.6;
      flex: 1;
    }
    .news-summary {
      font-size: 0.94rem;
      color: var(--text-muted);
      margin-bottom: 14px;
      text-align: justify;
      line-height: 1.75;
    }
    .news-footer {
      display: flex;
      flex-direction: column;
      gap: 10px;
      border-top: 1px solid rgba(128, 128, 128, 0.12);
      padding-top: 12px;
      font-size: 0.85rem;
    }
    .footer-top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
    }
    .meta-group {
      display: inline-flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      font-size: 0.82rem;
    }
    .news-source {
      color: var(--text-muted);
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .news-datetime {
      color: var(--text-muted);
      font-size: 0.78rem;
      background: rgba(148, 163, 184, 0.08);
      padding: 2px 7px;
      border-radius: 6px;
      border: 1px solid rgba(148, 163, 184, 0.15);
    }
    .news-category-badge {
      display: inline-flex;
      align-items: center;
      background: var(--badge-bg);
      color: var(--primary);
      border: 1px solid rgba(56, 189, 248, 0.25);
      border-radius: 6px;
      padding: 2px 8px;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .news-category-badge:hover {
      background: var(--primary);
      color: #0f172a;
      transform: translateY(-1px);
    }
    .footer-tags-row {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
    }
    .news-tag-chip {
      display: inline-flex;
      align-items: center;
      font-size: 0.75rem;
      color: var(--text-muted);
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--card-border);
      padding: 1px 7px;
      border-radius: 5px;
      cursor: pointer;
      transition: all 0.2s ease;
      font-weight: 500;
    }
    .news-tag-chip:hover {
      color: var(--primary);
      border-color: var(--primary);
      background: var(--badge-bg);
      transform: translateY(-1px);
    }
    .footer-bottom-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      border-top: 1px dashed rgba(128, 128, 128, 0.12);
      padding-top: 10px;
      margin-top: 4px;
    }
    .footer-actions-right {
      display: flex;
      align-items: center;
    }
    .footer-actions-left {
      display: flex;
      align-items: center;
      margin-right: auto;
    }
    .btn-mark-read {
      background: transparent;
      border: 1px solid var(--toggle-border);
      color: var(--text-muted);
      padding: 4px 10px;
      border-radius: 8px;
      font-size: 0.8rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-weight: 600;
      transition: all 0.2s ease;
    }
    .btn-mark-read:hover {
      border-color: var(--success);
      color: var(--success);
    }
    .news-card.is-read .btn-mark-read {
      background: rgba(16, 185, 129, 0.15);
      border-color: var(--success);
      color: var(--success);
    }
    .news-link {
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
      transition: color 0.2s ease;
    }
    .news-link:hover {
      text-decoration: underline;
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 16px;
    }
    .modal-overlay.active {
      display: flex;
    }
    .modal-card {
      background: var(--modal-bg);
      border: 1px solid var(--modal-border);
      border-radius: 18px;
      width: 100%;
      max-width: 520px;
      max-height: 80vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
      animation: modalFadeIn 0.2s ease;
    }
    @keyframes modalFadeIn {
      from { transform: scale(0.95); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
    .modal-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--card-border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .modal-title {
      font-size: 1.15rem;
      font-weight: 700;
    }
    .btn-close {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 1.4rem;
      cursor: pointer;
      line-height: 1;
      padding: 4px;
    }
    .btn-close:hover {
      color: var(--text);
    }
    .modal-body {
      padding: 16px 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .archive-item {
      background: var(--bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      text-decoration: none;
      color: var(--text);
      transition: all 0.2s ease;
    }
    .archive-item:hover {
      border-color: var(--primary);
      transform: translateX(-4px);
    }
    .archive-date-fa {
      font-weight: 700;
      font-size: 0.95rem;
    }
    .archive-date-g {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 2px;
    }
    .archive-arrow {
      color: var(--primary);
      font-size: 1.1rem;
    }

    @media (max-width: 640px) {
      header { padding: 18px 14px; padding-top: 56px; }
      .header-actions { top: 12px; left: 12px; width: calc(100% - 24px); justify-content: space-between; }
      .btn-action { font-size: 0.78rem; padding: 6px 9px; }
      h1 { font-size: 1.35rem; }
      .tabs { gap: 6px; }
      .tab-btn { padding: 10px 10px; font-size: 0.84rem; gap: 6px; }
      .badge { padding: 1px 5px; font-size: 0.75rem; }
      .news-card { padding: 16px; }
      .news-title { font-size: 0.98rem; }
      .news-summary { font-size: 0.88rem; }
      .news-footer { flex-direction: column; align-items: stretch; gap: 10px; }
      .footer-bottom-row { width: 100%; display: flex; justify-content: space-between; align-items: center; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="header-actions">
        <button class="btn-action" id="themeBtn" onclick="toggleTheme()">
          <span id="themeIcon">☀️</span>
          <span id="themeText">حالت روشن</span>
        </button>
        <button class="btn-action" onclick="toggleArchiveModal(true)">
          <span>📚</span>
          <span>آرشیو شماره‌ها</span>
        </button>
      </div>

      <h1>📰 مجله خبری روزانه</h1>
      <div class="meta-bar">
        <span class="meta-tag">📅 ۱۹ آبان ۱۴۰۵</span>
        <span class="meta-tag">🌍 ۱۰ November ۲۰۲۶</span>
        <span class="meta-tag">⏰ ساعت انتشار: ۲۰:۳۰</span>
      </div>
    </header>

    <div class="search-box">
      <input type="text" id="searchInput" class="search-input" placeholder="🔍 جست‌وجو در تمام اخبار امروز...">
    </div>

    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab('persian', this)">
        🇮🇷 عمومی
        <span class="badge" id="badge-persian">۲۷</span>
      </button>
      <button class="tab-btn" onclick="switchTab('tech', this)">
        🤖 تکنولوژی
        <span class="badge" id="badge-tech">۶۱</span>
      </button>
      <button class="tab-btn" onclick="switchTab('media', this)">
        🎬 مدیا
        <span class="badge" id="badge-media">۶۴</span>
      </button>
    </div>

    <main id="newsContainer" class="news-grid"></main>
  </div>

  <div class="modal-overlay" id="archiveModal" onclick="if(event.target===this) toggleArchiveModal(false)">
    <div class="modal-card">
      <div class="modal-header">
        <div class="modal-title">📚 آرشیو شماره‌های قبلی مجله</div>
        <button class="btn-close" onclick="toggleArchiveModal(false)">&times;</button>
      </div>
      <div class="modal-body" id="archiveListContainer"></div>
    </div>
  </div>

  <script>

 as a spy for China. Huang revealed the affair in an internal message to employees on Sunday that was obtained by the FT. “I owe my family and all of you an apology,” Huang said in the message. “I was unfaithful to my wife. My actions hurt her and our children. There is no excuse for what I did. I am deeply sorry.” Read full article Comments", "date_str": "2026-11-09T15:23:20+00:00", "hash": "0ad556b1b036ee70", "title_fa": "رابطه مدیر عامل Nvidia به یک مشکل امنیت ملی تبدیل می شود", "summary_fa": "جنسن هوانگ، مدیر اجرایی انویدیا، دو روز پس از آن که FT گزارش داد رابطه عاشقانه او با زنی که جامعه اطلاعاتی ایالات متحده معتقد است به عنوان جاسوس برای چین کار می کرد، به داشتن رابطه نامشروع اعتراف کرد. هوانگ این ماجرا را در یک پیام داخلی به کارمندان روز یکشنبه که توسط FT به دست آمد فاش کرد. هوانگ در این پیام گفت: \"من به خانواده ام و همه شما یک عذرخواهی بدهکارم.\" من به همسرم خیانت کردم. کارهای من به او و فرزندانمان آسیب زد. هیچ بهانه ای برای کاری که انجام دادم وجود ندارد. من عمیقا متاسفم.» خواندن مقاله کامل نظرات تنظیمات متن متن داستان اندازه کوچک استاندارد پهنای بزرگ * پیوندهای استاندارد گسترده نارنجی استاندارد * فقط مشترکین بیشتر بدانید برای پیمایش به حداقل برسانید جنسن هوانگ، مدیر اجرایی انویدیا، دو روز پس از گزارش FT که ادعای رابطه عاشقانه خود با زنی را که جامعه اطلاعاتی ایالات متحده معتقد است برای چین کار می کرد، اعتراف کرد که رابطه عاشقانه داشته است. در بیانیه‌ای جداگانه، انویدیا اعلام کرد که هیئت‌مدیره آن تحقیقات مستقلی را با توجه به گزارش‌های اخیر مبنی بر اینکه جنسن هوانگ، بنیانگذار و مدیر عامل شرکت، هدف یک تلاش اطلاعاتی خارجی بوده است، آغاز خواهد کرد. هوانگ گفت که به طور کامل همکاری خواهد کرد. او گفت: \"مسئولیت من خدمت به شما و شایسته اعتماد شماست.\" من از این مسئولیت کوتاهی کرده ام. من کاملاً به انویدیا متعهد هستم و برای بازگرداندن اعتماد شما تلاش خواهم کرد.\" FT روز جمعه گزارش داد که ایالات متحده معتقد است هوانگ با یک زن چینی که برای جاسوسی برای آژانس اطلاعات وزارت امنیت دولتی چین استخدام شده بود، رابطه عاشقانه داشته است. به گفته افراد آشنا با این سند، مقامات آمریکایی امسال یادداشتی بر اساس اطلاعات اطلاعاتی ایالات متحده نوشتند که در آن گفته", "image_url": "https://cdn.arstechnica.net/wp-content/uploads/2026/03/huang-1152x648.jpg", "category": "هوش مصنوعی مولد", "tags": ["Nvidia", "امنیت سایبری"], "datetime_fa": "۱۸ آبان • ۱۸:۵۳"}, {"source": "Ars Technica", "title": "F1 in Brazil: You’ve got to keep your tires alive", "link": "https://arstechnica.com/cars/2026/11/f1-in-brazil-drivers-at-their-very-best-in-tricky-conditions/", "summary": "In sports, a “ dead rubber ” is a match that takes place after the outcome of the series or championship has already been decided. The people in charge hate this*—if you wrap up a title two-thirds of the way through a season, the viewers evaporate, as there’s nothing left at stake. But anyone who decided to skip this year’s Brazilian Grand Prix this past weekend missed one of the year’s most entertaining races, as a combination of a mixed-up starting order, some very fast drivers at the back, and a wet track that dried and then saw rain again resulted in action aplenty. A peculiarity of F1 is that even if you manage to win a championship, there’s no guarantee you’ll be in a position to defend it. Take McLaren’s Lando Norris, who took the crown in 2025 after a nail-biting fight with his teammate Oscar Piastri and Red Bull’s Max Verstappen. Sadly for Lando, McLaren did not start this year in a position to win races, and even with several upgrades, the team has produced a car that is still very tricky to drive. But this weekend in Brazil, Norris demonstrated the form that earned him the number 1. Rain on Saturday during qualifying helped jumble the usual running order. It was heavy enough that drivers used the wet weather tire with deep treads, which usually generates so much spray that visibility disappears and running has to be suspended. But with fewer cars on track in the later knockout qualifying sessions, this was not a problem for once. More disruption came from grid penalties for Verstappen and Ferrari’s Lewis Hamilton, both of whom needed to use extra power unit components outside of the season’s allowance. Read full article Comments", "date_str": "2026-11-09T15:16:31+00:00", "hash": "e76e906942d07e03", "title_fa": "فرمول یک در برزیل: شما باید لاستیک های خود را زنده نگه دارید", "summary_fa": "در ورزش، \"لاستیک مرده\" مسابقه ای است که پس از قطعی شدن نتیجه سری یا قهرمانی انجام می شود. افراد مسئول از این متنفرند*—اگر عنوانی را در دو سوم فصل به پایان برسانید، بینندگان از بین می‌روند، زیرا چیزی در خطر نیست. اما هرکسی که تصمیم گرفت جایزه بزرگ برزیل امسال را در آخر هفته گذشته رد کند، یکی از سرگرم‌کننده‌ترین مسابقات سال را از دست داد، زیرا ترکیبی از نظم شروع مختلط، راننده‌های بسیار سریع در عقب، و پیست مرطوبی که خشک می‌شد و دوباره باران می‌بارید، منجر به اکشن فراوان شد. ویژگی F1 این است که حتی اگر موفق به کسب یک قهرمانی شوید، هیچ تضمینی وجود ندارد که در موقعیت دفاع از آن باشید. لاندو نوریس از مک لارن را در نظر بگیرید که در سال 2025 پس از یک مبارزه میخکوب کننده با هم تیمی خود اسکار پیاستری و مکس ورشتاپن از ردبول، تاج را از آن خود کرد. متأسفانه برای لاندو، مک لارن امسال را در موقعیتی شروع نکرد که بتواند در مسابقات پیروز شود و حتی با چندین ارتقاء، این تیم خودرویی تولید کرده است که هنوز رانندگی با آن بسیار دشوار است. اما این آخر هفته در برزیل، نوریس فرمی را نشان داد که او را به شماره 1 رساند. باران روز شنبه در طول مسابقات مقدماتی به درهم ریختن نظم معمولی دویدن کمک کرد. به قدری سنگین بود که رانندگان از لاستیک هوای مرطوب با آج‌های عمیق استفاده می‌کردند، که معمولاً آنقدر اسپری تولید می‌کند که دید از بین می‌رود و دویدن باید به حالت تعلیق درآید. اما با خودروهای کمتری در پیست در جلسات مقدماتی حذفی بعدی، این مشکل برای یک بار هم نبود. اختلال بیشتر ناشی از جریمه‌های شبکه برای ورشتاپن و لوئیس همیلتون از فراری بود، که هر دو باید از اجزای واحد نیرو اضافی خارج از امتیاز فصل", "image_url": "https://cdn.arstechnica.net/wp-content/uploads/2026/11/GettyImages-2304145044-1152x648.jpg", "category": "هوش مصنوعی مولد", "tags": ["فناوری", "نوآوری"], "datetime_fa": "۱۸ آبان • ۱۸:۴ 649511.jpg", "category": "هوش مصنوعی مولد", "tags": ["Google"], "datetime_fa": "۱۸ آبان • ۲۰:۱۵"}, {"source": "Engadget", "title": "NHTSA investigates if Waymo robotaxis are still running school bus stop signs", "link": "https://www.engadget.com/2310872/nhtsa-investigates-if-waymo-robotaxis-are-still-running-school-bus-stop-signs/", "summary": "The latest probe questions the effectiveness of Waymo's software recall from 2025.", "date_str": "2026-11-09T16:16:46+00:00", "hash": "873c2718961581e0", "title_fa": "NHTSA بررسی می کند که آیا رباتاکسی Waymo هنوز تابلوهای ایستگاه اتوبوس مدرسه را اجرا می کند یا خیر", "summary_fa": "آخرین کاوشگر اثربخشی فراخوان نرم افزار Waymo از سال 2025 را زیر سوال می برد. فراخوان نرم افزار 2025 Waymo ممکن است کمتر از آنچه در ابتدا تصور می شد مؤثر باشد. Robin Marchant/Getty Images افزودن انگجت به Google: منبع ترجیحی Google Discover چندین ماه پس از اینکه Waymo یک فراخوان داوطلبانه نرم‌افزاری را برای روباتاکسی خود برای روشن کردن چراغ‌های قرمز و علائم توقف اتوبوس‌های مدرسه‌ای متوقف کرد، اداره ملی ایمنی ترافیک بزرگراه‌ها تحقیقاتی را درباره اثربخشی این فراخوان آغاز کرد. درخواست فراخوان از روز جمعه برای تعیین اینکه آیا به روز رسانی Waymo کار می کند یا خیر، آغاز شد، زیرا \"اکثر حوادث پس از ... تاریخ اصلاح رخ داده اند.\" آخرین تحقیقات دفتر تحقیقات نقص NHTSA به فراخوان نرم افزار Waymo در اواخر سال 2025 اشاره کرد که خود به دنبال تحقیقات آژانس در مورد مشکل اصلی بود. اولین کاوش NHTSA نشان داد که ربات‌اکسی‌های Waymo از کنار اتوبوس‌های مدرسه متوقف شده با چراغ‌های قرمز چشمک‌زن و بازوهای علامت توقف در آتلانتا، جورجیا و آستین، تگزاس عبور می‌کنند. در حالی که فراخوان نرم افزار در سراسر ناوگان روباتاکسی نصب شده بود و در نوامبر 2025 تکمیل شد، جدیدترین تحقیقات NHTSA مشخص خواهد کرد که آیا به روز رسانی واقعاً مشکل را برطرف کرده است و \"علل شرایط منتهی به گزارش های پس از درمان را شناسایی می کند.\" ما برای اظهار نظر با Waymo تماس گرفتیم و پس از شنیدن خبر، داستان را به‌روزرسانی خواهیم کرد.", "image_url": "https://www.engadget.com/img/gallery/nhtsa-investigates-if-waymo ی با هم هستند. این شراکت به دیزنی «دسترسی زودهنگام» به فناوری هوش مصنوعی برای استراحتگاه‌ها، خط سفر، گرافیک ESPN و موارد دیگر می‌دهد. Jess Weatherbed 9 نوامبر 2026، ساعت 3:38 بعد از ظهر / Jess Weatherbed: نویسنده اخبار بر صنایع خلاق، محاسبات و فرهنگ اینترنت متمرکز شده است. جس کار خود را در TechRadar با پوشش اخبار و بررسی های سخت افزاری آغاز کرد. شرکت والت دیزنی با Adobe همکاری کرده است تا مدل‌های اختصاصی هوش مصنوعی «به رهبری هنرمند» را برای پشتیبانی از خط لوله تولید دیزنی توسعه دهد. این همکاری چند ساله امروز در کنفرانس MAX Adobe اعلام شد و باعث می‌شود که Adobe دسترسی زودهنگام به آخرین فناوری‌های خود را برای همه چیز از پارک‌های موضوعی دیزنی و خط سفر تا محتوای ESPN فراهم کند. طبق بیانیه مطبوعاتی ادوبی، دیزنی و ادوبی همچنین \"برای کشف فناوری های نوظهور، از جمله هوش مصنوعی توسعه یافته مسئولانه\" همکاری خواهند کرد:", "image_url": "https://platform.theverge.com/wp-content/uploads/sites/2/2026/11/Disney-Adobe-AI-partnership.jpg?quality=90&strip=all&crop=0%2C10.732984293194%2C100%2C78.534031413613&w=1200", "category": "هوش مصنوعی مولد", "tags": ["هوش مصنوعی"], "datetime_fa": "۱۸ آبان • ۱۹:۰۸"}, {"source": "The Verge", "title": "Hold up — I had a great time talking to the RIAA guy", "link": "https://www.theverge.com/podcast/1029684/riaa-mitch-glazier-napster-ai-labels-music", "summary": "Today, I’m talking with Mitch Glazier, who is CEO and chairman of the RIAA. This conversation was a real full-circle moment for me: I was in college when Napster hit, and the RIAA became everyone’s villain for suing kids for downloading music. That was when I decided to go be a copyright lawyer, which set the rest of my career in motion — and Mitch was in the background as a young lawyer at the RIAA working on those cases. So part of me was very deeply, very genuinely surprised to discover just how much fun I had talking to Mitch. That’s because here in 2026, Mitch, the RIAA, the record labels, the artists, and ordinary people are all pretty unhappy with the big AI companies in the same way, for training on everyone’s work without permission and flooding our feeds with slop. Verge subscribers, don t forget you get exclusive access to ad-free Decoder wherever you get your podcasts. Head here . Not a subscriber? You can sign up here . Everyone is mad about it! And since the RIAA is both the group that lobbies for changes to the law and also the group that files lawsuits about things that affect record labels and distributors, Mitch is a pretty busy guy these days. We got deep into the legal complexity of things like AI deepfakes, how banning them might affect other kinds of expression, and how the AI detection and labeling systems that we all seem to want might actually work in practice — especially if big platforms like Spotify and YouTube don’t get on board. I just want to get right into it. This conversation is a real ride through how AI, the law, art, and commerce might all intersect. I think you’re going to be able to tell, Mitch and I had a lot of fun talking about it. Before we get going, do me a favor and subscribe to Decoder on YouTube , where we put out new episodes every Monday and Thursday. Okay: RIAA CEO Mitch Glazier. Here we go. This interview has been lightly edited for length and clarity. Mitch Glazier, you re the chairman and CEO of the Recording Industry Association of America, which people know as the RIAA. Welcome to Decoder . Thank you. Thank you, Nilay. I m excited to be here. I am very excited to talk to you. I have to tell you, this is a very full-circle moment for me. My entire career got on track when I was in college. Napster came out, my university banned Napster from the school network, and I decided right then I was going to go be a copyright lawyer. And then I was a copyright lawyer, and I defended kids who got sued for using ", "date_str": "2026-11-09T15:30:00+00:00", "hash": "d8d88fda3d650f4c", "title_fa": "دست نگه دار - با صحبت کردن با مرد RIAA خوش گذشت", "summary_fa": "پادکست‌ها AI Entertainment صبر کنید - با صحبت کردن  . Each can help you track deals at various retailers — including Amazon, Walmart, Best Buy, and Target — but they each do so differently and come with their own set of advantages / disadvantages. All of them are free to use, and once you’ve added the products you’re interested in keeping an eye on, you can rest easy knowing that you don’t need to take any action until it comes time to make a purchase. Just make sure you keep your email notifications on so you see the alerts as they come in. CamelCamelCamel CamelCamelCamel is arguably the most popular price-tracking tool at The Verge , and for good reason: it’s incredibly useful since it tracks the price of every product sold on Amazon and can send you alerts when an item falls to a customizable price threshold. Once a product reaches the desired price you’ve set (or lower), you’ll get an email about it. You can use the extension’s price graph to determine what price is likely to happen based on historical data, but it’s always a shot in the dark. To track prices and get alerts via email, you’ll need to create a free CamelCamelCamel account. Additionally, we suggest installing the site’s browser extension , The Camelizer, which works with Go", "date_str": "2026-11-09T15:00:00+00:00", "hash": "9476857e4fff7f7c", "title_fa": "چگونه مانند یک حرفه ای در جمعه سیاه و دوشنبه سایبری خرید کنیم", "summary_fa": "علیرغم اینکه آمازون و سایر خرده فروشان ماه های تابستان و پاییز را با فروش بیشتری نسبت به قبل پر می کنند، جمعه سیاه و دوشنبه سایبری بزرگترین روزهای خرید سال هستند. و در سال‌های اخیر، دوره‌های فروش زودتر شروع شده است و به شما فرصت بیشتری برای استفاده از معاملات می‌دهد. ما در حال حاضر سخت در تلاش هستیم تا بهترین قیمت‌ها را برای تلفن‌ها، لوازم جانبی، تلویزیون‌های 4K، هدفون‌های کاهش‌دهنده نویز، تجهیزات بازی و سایر فناوری‌ها در طول هفته‌های پرمعامله که به رویدادهای بزرگ ختم می‌شود، پیدا کنیم، چه قصد خرید حضوری یا آنلاین را داشته باشید. شما همیشه می توانید روی ما حساب کنید که صرف نظر از فصل، فقط بهترین معاملاتی را که باید در elow are the price-matching policies for several major retailers. A few things to note: First, each retailer has its own set of rules and restrictions. We’ve summarized some of them here, but we recommend visiting the provided links and reading the policies carefully. Second, most retailers that serve as marketplaces for other sellers, including wholesale retailers like Costco, don’t offer protections, and many traditional stores won’t match their prices. Lastly, there are always exceptions to the rules. If you’re looking for a deal on a product and you know it’s available for a lower price elsewhere (or it was previously offered at the same retailer), it never hurts to call or chat with a customer service rep and ask if they’ll match the price. You have nothing to lose but time, and there’s always a chance they may find a loophole or make a special exception. Amazon Amazon doesn’t offer price matching. Full stop. You can contact customer support, but even if you’re an Amazon Prime customer, they likely won’t help. That said, the online retailer does offer a liberal return policy , meaning you can often return an item you purchased from Amazon if it’s available for less elsewhere (or at Amazon). Then, you can just repurchase the product wherever it’s cheapest. Target Target used to let shoppers price match identical items sold by select retailers, including Amazon, but no longer does so. Under its current policy, shoppers can only request a price adjustment if they find an identical qualifying item for less than they paid on Target.com, at their local Target store, or through an eligible Target Circle deal. Target will also price match Target Plus Partner (the retailer’s name for third-party sellers) items if the same Target Plus Partner on Target.com has it for less, or with a Target Circle deal. Price matches can be requested at the time of purchase or within 14 days after purchase. For the 2026 holiday season, Target has extended the aforementioned price-match wi", "date_str": "2026-11-09T15:00:00+00:00", "hash": "2fb3b7089b83e268", "title_fa": "در اینجا خط‌مشی‌های تطبیق قیمت برای Best Buy، Walmart و موارد دیگر آمده است", "summary_fa": "هیچ چیز ناامید کننده تر از خرید یک جفت هدفون جدید یا یک تلویزیون OLED نیست، فقط برای اینکه متوجه شوید چند روز یا چند هفته بعد می توانستید آن را در جای دیگری ارزان تر تهیه کنید. به همین دلیل است که برای راضی نگه داشتن مشتریان و جلوگیری از خرید آن‌ها از جای دیگر، برخی از خرده‌فروشان سیاست‌های تطبیق قیمت را ارائه می‌کنند که قول می‌دهند با قیمت پایین‌تری مطابقت داشته باشند. این نوع اطلاعات در تمام طول سال مفید است، اما به ویژه در هفته های معاملات منتهی به جمعه سیاه و دوشنبه سایبری مفید است. در زیر سیاست‌های تطبیق قیمت برای چندین خرده‌فروش بزرگ آورده شده است. چند نکته قابل توجه: اولاً، هر خرده فروش مجموعه ای از قوانین و محدودیت های خاص خود را دارد. ما برخی از آنها را در اینجا خلاصه کرده ایم، اما توصیه می کنیم از پیوندهای ارائه شده بازدید کنید و خط مشی ها را با دقت بخوانید. دوم، بیشتر خرده‌فروش‌هایی که به عنوان بازار برای فروشندگان دیگر، از جمله خرده‌فروش‌های عمده‌فروشی مانند Costco، خدمات حفاظتی ارائه نمی‌کنند، و بسیاری از فروشگاه‌های سنتی با قیمت‌هایشان مطابقت ندارند. در نهایت، همیشه استثناهایی از قوانین وجود دارد. اگر به دنبال یک معامله برای یک محصول هستید و می‌دانید که در جای دیگری با قیمت پایین‌تری در دسترس است (یا قبلاً در همان خرده‌فروش ارائه شده است)، تماس یا چت با یک نماینده خدمات مشتری و پرسیدن اینکه آیا با قیمت مطابقت دارد یا خیر، ضرری ندارد. شما چیزی برای از دست دادن ندارید جز زمان، و همیشه این احتمال وجود دارد که آنها یک راه گریز پیدا کنند یا استثناء خاصی ایجاد کنند. آمازون تطبیق قیمت را ارائه نمی دهد. توقف کامل می توانید با پشتیبانی مشتری تماس بگیرید، اما حتی اگر مشتری آمازون پرایم باشید، احتمالا کمکی نخواهند کرد. با این", "image_url": "https://platform.theverge.com/wp-content/uploads/sites/2/2025/11/258010_Black_friday_cyber_monday_CVirginia_BF3.jpg?quality=90&strip=all&crop=0%2C10.732984293194%2C100%2C78.534031413613&w=1200", "category": "هوش مصنوعی مولد", "tags": ["امنیت سایبری"], "datetime_fa": "۱۸ آبان • ۱۸:۳۰"}, {"source": "The Verge", "title": "Here’s when the Black Friday sales start at Walmart, Target, and other retailers", "link": "https://www.theverge.com/21569881/black-friday-deals-start-time-hours-cyber-monday-stores", "summary": "Black Friday officially kicks off on November 27th, but if you plan to make that the only day you buy gifts this holiday season, you’re missing out. Several prominent retailers, including Best Buy and Walmart, are preparing to roll out their holiday discounts both in-store and online. Best Buy is even offering price protection through the holiday shopping season on select goods, so if you buy early and the same item drops in price, you can get the better deal retroactively. That being said, it’s important to know how every major retailer is handling the shopping event this year, whether you plan to take advantage of the slew of early holiday deals or hold off until the day after Thanksgiving. If you plan to spend some cash, here are the schedules and expectations for Amazon, Walmart, Best Buy, and all the major retailers we know of. Amazon Amazon has yet to announce its full Black Friday playbook, but the online retailer has dropped a few early deals in its so-called Holiday Shop , including steep discounts on Sony’s WH-1000XM6 headphones, the Google Pixel 11 Pro XL , and fitness trackers like the Fitbit Inspire 3 . Just be aware that Amazon does not offer price matching, so price “protection” for many Amazon shoppers means buying the item at the lower price point and returning the original — which, unfortunately, is pretty wasteful. Walmart Like in previous years, Walmart plans to roll out its Black Friday deals in three distinct waves. The first runs from November 12th through November 15th, starting online at 12:01AM ET and in stores at 6AM local time. Walmart Plus members will also get early access to some deals beginning at 12:01AM ET on November 12th, with the sale opening up to everyone at 12:01AM ET on November 13th. Walmart’s official Black Friday sale then kicks off at 12:01AM on Monday, November 23rd, with Walmart Plus members once again getting early access to select deals online. Whatever “hot Deal drops” remain will then be available to non-members at 12:01AM ET on November 24th. Walmart’s in-store Black Friday sale will then kick off at 6AM local time on November 27th. The retailer’s Cyber Monday sale, meanwhile, will kick off online at 12:01AM ET on November 30th and run through December 2nd. The retailer hasn’t shared many deal specifics yet, but did offer a sneak peek in a recent press release promising discounts across a range of categories, including toys, fashion, beauty, and home goods. Best Buy Best Buy officially kicked off its Blac", "date_str": "2026-11-09T15:00:00+00:00", "hash": "8c3391a092db85a1", "title_fa": "در اینجا زمانی است که فروش جمعه سیاه در Walmart، Target و سایر خرده فروشان شروع می شود", "summary_fa": "بلک فرایدی رسماً در 27 نوامبر آغاز می شود، اما اگر قصد دارید این تنها روزی باشد که در این فصل تعطیلات هدیه می خرید، فرصت را از دست می دهید. چندین خرده فروش برجسته، از جمله Best Buy و Walmart، در حال آماده شدن برای ارائه تخفیف های تعطیلات خود در فروشگاه و آنلاین هستند. Best Buy حتی در طول فصل خرید تعطیلات برای کالاهای منتخب محافظت از قیمت را ارائه می‌کند، بنابراین اگر زودتر خرید کنید و همان کالا کاهش یافت، می‌توانید معامله بهتری را به ماسبق دریافت کنید. همانطور که گفته شد، مهم است که بدانید هر خرده‌فروش بزرگ امسال رویداد خرید را چگونه مدیریت می‌کند، چه قصد دارید از انبوه معاملات اولیه تعطیلات استفاده کنید یا تا روز بعد از روز شکرگزاری متوقف شوید. اگر قصد دارید مقداری پول نقد خرج کنید، در اینجا برنامه‌ها و انتظارات برای آمازون، والمارت، بهترین خرید و همه خرده‌فروش‌های بزرگی که می‌شناسیم آمده است. آمازون هنوز کتاب جمعه سیاه کامل خود را اعلام نکرده است، اما این خرده‌فروش آنلاین چند پیشنهاد اولیه را در فروشگاه تعطیلات خود حذف کرده است، از جمله تخفیف‌های شدید روی هدفون‌های WH-1000XM6 سونی، Google Pixel 11 Pro XL و ردیاب‌های تناسب اندام مانند Fitbit Inspire 3. فقط توجه داشته باشید که آمازون تطبیق قیمت را ارائه نمی دهد، بنابراین \"محافظت\" از قیمت برای بسیاری از خریداران آمازون به معنای خرید کالا با قیمت پایین تر و برگرداندن اصل است - که متأسفانه بسیار ضایع کننده است. Walmart مانند سال های گذشته، والمارت قصد دارد معاملات جمعه سیاه خود را در سه موج مجزا عرضه کند. اولین دوره از 12 نوامبر تا 15 نوامبر اجرا می شود، به صورت آنلاین از ساعت 12:01 صبح به وقت شرقی و در فروشگاه ها در ساعت 6 صبح به وقت محلی شروع می شود. اعضای Walmart Plus همچنین دسترسی", "image_url": "https://platform.theverge.com/wp-content/uploads/sites/2/2025/10/258010_Black_friday_cyber_monday_CVirginia_BF2.jpg?quality=90&strip=all&crop=0%2C10.732984293194%2C100%2C78.534031413613&w=1200", "category": "هوش مصنوعی مولد", "tags": ["Google", "امنیت سایبری"], "datetime_fa": "۱۸ آبان • ۱۸:۳۰"}, {"source": "The Verge", "title": "Here are the shipping and return policies for all the big-name retailers", "link": "https://www.theverge.com/21570161/holiday-shipping-return-policy-apple-google-microsoft-amazon", "summary": "With the holidays quickly appro aching, everyone will soon be on the hunt for gifts and the fastest way to get them. Thankfully, many retailers offer generous shipping policies, with some even providing free two-day shipping or same-day delivery if you’re willing to pay a little extra. And just in case the gift you choose isn’t quite right, many retailers offer extended return policies so your giftee can get something more to their liking. For your convenience, we’ve compiled the current shipping and return policies for all the big-name retailers, from Amazon to Walmart. A few already have holiday policies in place, but we’ll be keeping tabs on them and updating our list accordingly. Hopefully, knowing more about how much leeway you have to make a return will help lessen that inevitable holiday angst (fingers crossed). Amazon Shipping : Same-day delivery is not available on Thanksgiving, Christmas, or New Year’s (it’s also limited یفت در راه است", "summary_fa": "ای‌اس‌تی اسپیس‌موبایل برای پایان‌دادن به وابستگی پرتاب ماهواره‌های خود، موشک چندبارمصرف بلک‌لیفت را با بودجه‌ی ۱٫۳ میلیارد دلاری می‌سازد. تبلیغات شرکت AST SpaceMobile که از رقبای مستقیم سامانه‌ی ماهواره‌ای استارلینک به شمار می‌رود، اعلام کرد پروژه‌ی ساخت یک موشک اختصاصی به نام بلک‌لیفت را با تکیه بر پیشرانه‌های ساخت فایرفلای ایرواسپیس آغاز کرده است. فایرفلای قرار است طی قراردادی به ارزش ۱٫۳ میلیارد دلار، ۳۶ موتور موشک در اختیار این مجموعه‌ی ماهواره‌ای قرار دهد تا پروازهای فضایی بلک‌لیفت از سال ۲۰۲۸ میلادی آغاز شود. مالکیت پرتابگر اختصاصی، مزیتی راهبردی محسوب می‌شود که اسپیس‌ایکس سال‌هاست با تکیه بر ناوگان Falcon 9 از آن دارد و توانسته بیش از ۱۱ هزار ماهواره را در مدار مستقر کند. اسکات ویشنفسکی ، مدیر ارشد ای‌اس‌تی اسپیس‌موبایل، گفت: «موتور Miranda به ما امکان می‌دهد هنگام ساخت بلک‌لیفت، چرخه‌ی توسعه‌ی سنتی پنج تا ۱۰ ساله را پشت سر بگذاریم. با این توانمندی داخلی، می‌توانیم به مشتریان تجاری و دولتی خود در بازاری گسترده‌تر، فراتر از ارتباط مستقیم با دستگاه‌ها، خدمات بهتری ارائه دهیم.» طبق توافق صورت‌گرفته، ۲۷ موتور از نوع میراندا که برای پرتابگر جدید اکلیپس فایرفلای توسعه می‌یابند، به همراه ۹ موتور خلاء Vira به این پروژه اختصاص پیدا می‌کنند. ای‌اس‌تی اسپیس‌موبایل که پیش‌تر محموله‌های خود را با موشک‌های هندی، اسپیس‌ایکس و راکت نیو گلن متعلق به بلو اوریجین پرتاب می‌کرد، پس از بروز خطای مداری در پرتاب نیو گلن و همچنین توقف پذیرش سفارش‌های تجاری فالکون ۹ پس از سال ۲۰۲۸، تصمیم گرفت زنجیره‌ی تامین و پرتاب ماهواره‌هایش را به‌طور مستقل مدیریت کند. لایک نظرت چیه؟ ارسال نظر بوکمارک اشتراک‌گذاری امیر عبدالملکی دنبال کردن به محتوای این مطلب چه امتیازی میدی؟ نظر شما برامون مهمه و به بهتر شدن کیفیت مطالب کمک می‌کنه.", "image_url": "https://api2.zoomit.ir/media/blacklift-rocket-launch-spacecraft-6af020ce354e588119e484c2?w=1920&q=75", "category": "موسیقی و هنر", "tags": ["فناوری", "نوآوری"], "datetime_fa": "۱۸ آبان • ۱۸:۴۵"}, {"source": "Business Insider", "title": "I've been to all 64 US national parks and ranked them from my least favorite to my top pick for travelers", "link": "https://www.businessinsider.com/every-major-us-national-park-ranked-traveler-who-visited-all-2026-11", "summary": "I visited and ranked all 64 US national parks. Emily Hart I've been to all 64 US national parks and ranked them from my least favorite to my top pick. I think parks like Congaree, Petrified Forest, and Channel Islands are best suited for a day trip. Visiting Badlands, White Sands, and Olympic national parks feels like stepping onto another planet. Ranking all 64 major US national parks feels like an impossible task because each one offers something uniquely beautiful. However, as a solo traveler who's visited them all, I've learned that not all parks leave the same impression. Some are grand and awe-inspiring, embodying the vision of what a national park likely looks like in your mind. Others, although still worth visiting, don't quite reach that same iconic standard. That said, all of the major national parks are undoubtedly some of the most scenic and unique places in the US , so even a bottom spot on my ranking is not a dig. Here's how I'd rank all the US national parks based on personal preference and things like scenic beauty, accessibility, and crowd sizes. 64. Hot Springs National Park in Arkansas schristinephoto/Shutterstock In the grand scheme of things, coming in last on a list of what I consider to be the most beautiful places in the US is not too shabby — and I had to pick one. That said, I don't dislike Hot Springs National Park at all — in fact, I'd love to visit again. However, it's last on this list because it doesn't have the same natural scenic beauty and outdoor opportunities as the other parks. Hot Springs is in the middle of a town, where the main attraction is Bathhouse Row — eight historic bathhouses built between 1892 and 1923. Although it's a fun and interesting place, I think it would be better suited as a national historic park. 63. Gateway Arch National Park in Missouri Jonathan_Densford/Shutterstock Gateway Arch National Park in St. Louis is another place I love visiting. I just don't think it makes sense as a \"national park.\" Once known as the Jefferson National Expansion Memorial, this spot was designated a national park and renamed in 2018. It's also the smallest of the 64 national parks. Like Hot Springs, I ranked it lower because the main attraction, the 630-foot-tall Gateway Arch, is man-made. In my opinion, the park would be better designated as a National Monument. 62. Mammoth Cave National Park in Kentucky Emily Hart I'm not a fan of caves, so national parks primarily focused on cave tours are not for me. However, if y", "date_str": "2026-11-09T15:21:12+00:00", "hash": "55c800e0834387bf", "title_fa": "من به تمام 64 پارک ملی ایالات متحده رفته ام و آنها را از کمترین علاقه تا بهترین انتخاب برای مسافران رتبه بندی کرده ام.", "summary_fa": "من از تمام 64 پارک ملی ایالات متحده بازدید و رتبه بندی کردم. امیلی هارت من در تمام 64 پارک ملی ایالات متحده بوده ام و آنها را از کمترین علاقه تا انتخاب برتر خود رتبه بندی کرده ام. فکر می‌کنم پارک‌هایی مانند Congaree، جنگل سنگ‌شده، و جزایر کانال برای یک سفر یک روزه مناسب‌تر هستند. بازدید از Badlands، White Sands و پارک های ملی المپیک مانند قدم گذاشتن به سیاره ای دیگر است. رتبه بندی تمام 64 پارک ملی بزرگ ایالات متحده امری غیرممکن به نظر می رسد زیرا هر یک چیز منحصر به فرد زیبایی ارائه می دهد. با این حال، به عنوان یک مسافر انفرادی که همه آنها را بازدید کرده ام، آموخته ام که همه پارک ها یک تصور را به جا نمی گذارند. برخی از آنها بزرگ و الهام‌بخش هستند و این تصور را که احتمالاً یک پارک ملی در ذهن شما به نظر می‌رسد، تجسم می‌دهند. برخی دیگر، اگرچه هنوز ارزش بازدید دارند، اما به همان استاندارد نمادین نمی رسند. با این اوصاف، همه پارک‌های ملی بزرگ بدون شک برخی از دیدنی‌ترین و منحصربه‌فردترین مکان‌های ایالات متحده هستند، بنابراین حتی یک رتبه پایین در رتبه‌بندی من حفاری نیست. در اینجا نحوه رتبه‌بندی همه پارک‌های ملی ایالات متحده بر اساس ترجیحات شخصی و مواردی مانند زیبایی منظره، دسترسی، و تعداد جمعیت آمده است. 64. پارک ملی هات اسپرینگز در آرکانزاس schristinephoto/Shutterstock در طرح بزرگ همه چیز، جایگاه آخر در فهرست مکان‌هایی که به نظر من زیباترین مکان‌های ایالات متحده هستند، خیلی کثیف نیست - و مجبور شدم یکی را انتخاب کنم. با این حال، من اصلاً از پارک ملی هات اسپرینگز متنفر نیستم - در واقع، دوست دارم دوباره از آن دیدن کنم. با این حال، آخرین رتبه در این لیست است زیرا مانند سایر پارک ها زیبایی منظره طبیعی و فرصت های فضای باز", "image_url": "https://i.insider.com/6af1e48e80d4b24f183478ba?width=1200&format=jpeg", "category": "هوش مصنوعی مولد", "tags": ["فناوری", "نوآوری"], "datetime_fa": "۱۸ آبان • ۱۸:۵۱"}, {"source": "Business Insider", "title": "I'm an interior designer who works with wealthy clients. Here are 10 things I rarely see in their living rooms.", "link": "https://www.businessinsider.com/what-rich-people-never-have-living-rooms-interior-designer-luxury-2026-11", "summary": "I ve found that wealthy, high-profile clients tend to avoid a few mistakes when designing and decorating their living rooms. Getty Images; BI In my years as an interior designer, I've worked with many wealthy, high-profile clients. Their living rooms typically don't have too-small rugs, visible TVs, or a single overhead light. It's also rare to find mass-produced artwork, matching furniture sets, and cluttered surfaces. As an interior designer who's worked with high-profile clients for over a decade, I've learned that a luxurious living room is rarely defined by how much money has been spent putting it together. Rather, some of the nicest high-end spaces I've worked on are thoughtfully designed and curated for the people living in them. Although everyone's personal style is different, I've noticed a few common design choices that my wealthier clients tend to avoid. Here are 10 things that I rarely see in their living rooms. Matching furniture sets are rarely a part of the design. sheilasay/Getty Images When designing a high-end living room , I never purchase an entire matching furniture collection from one place. Instead, I mix different silhouettes, materials, and eras so the room feels more special, as if the furniture has been carefully collected and put together over time. After all, a sofa, an accent chair, and a loveseat in the same fabric and style can create a generic feel, as if they were all pulled directly from a furniture showroom. A rug that s too small can cheapen the entire living room. Sometimes, no rug is better than one that s too small for a space. RapidEye/Getty Images When in doubt, it's better to go bigger for rugs. Rugs that are too small can make even the most expensive furniture look cheap and create a space that feels disconnected or incomplete. In my clients' homes, I typically select oversized rugs that anchor the seating arrangement. At the very least, I want the front legs of all major seating pieces to rest on the rug. A correctly sized rug makes a room feel more substantial, cohesive, and well-designed. Generic, mass-produced artwork is usually nowhere to be found. When decorating, prioritize finding unique artwork that s meaningful to you. Curly_photo/Getty Images Artwork is one of the biggest opportunities to give a space personality . So, I rarely see wealthy clients displaying generic, mass-produced canvas prints that could be found in thousands of other homes. Instead, many invest in original paintings, limited-edition ", "date_str": "2026-11-09T15:03:01+00:00", "hash": "1498e37fd7bc5566", "title_fa": "من یک طراح داخلی هستم که با مشتریان ثروتمند کار می کنم. در اینجا 10 چیزی است که من به ندرت در اتاق نشیمن آنها می بینم.", "summary_fa": "من متوجه شده ام که مشتریان ثروتمند و پرمخاطب هنگام طراحی و تزئین اتاق نشیمن خود از چند اشتباه اجتناب می کنند. گتی ایماژ; BI در سال‌هایی که به عنوان طراح داخلی کار می‌کردم، با بسیاری از مشتریان ثروتمند و با مشخصات بالا کار کرده‌ام. اتاق‌های نشیمن آنها معمولاً فرش‌های خیلی کوچک، تلویزیون‌های قابل مشاهده یا یک چراغ سقفی ندارند. همچنین به ندرت می‌توان آثار هنری تولید انبوه، مجموعه‌های مبلمان همسان و سطوح به هم ریخته را پیدا کرد. به عنوان یک طراح داخلی که بیش از یک دهه با مشتریان برجسته کار کرده است، آموخته ام که یک اتاق نشیمن مجلل به ندرت با مقدار پولی که برای جمع آوری آن هزینه شده است تعریف می شود. در عوض، برخی از زیباترین فضاهای سطح بالا که من روی آنها کار کرده‌ام، برای افرادی که در آنها زندگی می‌کنند، طراحی و مدیریت شده‌اند. اگرچه سبک شخصی هر کس متفاوت است، من متوجه چند انتخاب رایج طراحی شده ام که مشتریان ثروتمندتر من تمایل دارند از آنها اجتناب کنند. در اینجا 10 چیز وجود دارد که من به ندرت در اتاق نشیمن آنها می بینم. ست مبلمان همسان به ندرت بخشی از طراحی است. sheilasay/Getty Images هنگام طراحی یک اتاق نشیمن سطح بالا، من هرگز کل مجموعه مبلمان را از یک مکان خریداری نمی کنم. در عوض، من شبح‌ها، مواد و دوره‌های مختلف را با هم ترکیب می‌کنم تا اتاق خاص‌تر به نظر برسد، گویی که مبلمان با دقت جمع‌آوری شده و در طول زمان کنار هم قرار گرفته‌اند. به هر حال، یک مبل، یک صندلی تاکیدی، و یک صندلی عاشقانه در همان پارچه و سبک می‌توانند حسی کلی ایجاد کنند، گویی که همه آنها مستقیماً از یک نمایشگاه مبلمان بیرون کشیده شده‌اند. یک فرش خیلی کوچک می تواند کل اتاق نشیمن را ارزان کند. گاهی اوقات، هیچ فرشی بهتر از", "image_url": "https://i.insider.com/6ad0da49adb77227909a5e7d?width=1200&format=jpeg", "category": "هوش مصنوعی مولد", "tags": ["سرمایه‌گذاری"], "datetime_fa": "۱۸ آبان • ۱۸:۳۳"}, {"source": "Business Insider", "title": "Meet the legal startup generating $150 million in revenue without chasing Big Law", "link": "https://www.businessinsider.com/evenup-hits-150-million-recurring-revenue-legal-ai-2026-11", "summary": "EvenUp cofounder and CEO Rami Karabibar. EvenUp EvenUp, a quiet giant of the legal tech space, has reached $150 million in contracted revenue. The company sells AI software to personal injury law firms. It's expanding into new products and reaching new customers as it also faces increased competition. While Harvey and Legora battle for Big Law, another legal tech startup is carving out a sizable business in Small Law. EvenUp, a seven-year-old company that sells AI software to plaintiff-side law firms, has grown to $150 million in recurring revenue under contract, Rami Karabibar, EvenUp's cofounder and chief executive, told Business Insider. The milestone is a reminder that some of the biggest opportunities in legal AI lie beyond the white-shoe firms now adopting it. For traditional law firms that bill by the hour, AI presents a dilemma. Software that makes lawyers more efficient could also eat into their revenue. But personal injury firms typically work on contingency, taking a cut of what their clients win. The faster they can move cases along, the sooner they get paid. For much of its existence, EvenUp was something of a one-trick pony. The company got its start automating demand letters, the detailed documents personal injury lawyers send to insurers making the case for a financial settlement. It's a valuable business, but one that competitors can imitate. Over the past 18 months, EvenUp has expanded into AI software that helps lawyers manage cases from start to finish. Its newest offering goes a step further, combining AI agents with human case managers to handle much of the work that happens before a lawsuit is filed. The expansion has transformed EvenUp's business. In early 2025, demand letters accounted for more than 90% of revenue, Karabibar said. Today, revenue is spread more evenly across its products, and demand letters represent less than a quarter of the business. EvenUp now serves more than 2,000 personal injury firms and supports 20,000 cases each week. Law firms pay a fixed price per case and sign annual contracts committing to a certain volume of cases. EvenUp may have barely scratched the surface. Most law firms still use only one of its products, Karabibar said. The company sees an opportunity to land customers with one offering, then expand into other parts of their business. To make that happen, EvenUp has hired Stevie Case, the former chief revenue officer of Vanta , as president of field operations. She will oversee sales, marketing,", "date_str": "2026-11-09T14:50:01+00:00", "hash": "8166788a41125798", "title_fa": "با استارتاپ قانونی آشنا شوید که 150 میلیون دلار درآمد ایجاد می کند بدون اینکه قانون بزرگ را دنبال کنید", "summary_fa": "رامی کارابیبار، بنیانگذار و مدیرعامل EvenUp. EvenUp EvenUp، غول آرام در فضای فناوری قانونی، به درآمد قراردادی ۱۵۰ میلیون دلاری رسیده است. این شرکت نرم افزار هوش مصنوعی را به شرکت های حقوقی آسیب های شخصی می فروشد. در حال گسترش به محصولات جدید و دستیابی به مشتریان جدید است زیرا با افزایش رقابت نیز مواجه است. در حالی که هاروی و لگورا برای قانون بزرگ مبارزه می کنند، یک استارتاپ حقوقی دیگر در زمینه فناوری در حال ایجاد یک تجارت قابل توجه در Small Law است. رامی کارابیبار، بنیانگذار و مدیر اجرایی EvenUp، به Business Insider گفت که EvenUp، یک شرکت هفت ساله که نرم‌افزار هوش مصنوعی را به شرکت‌های حقوقی طرف شاکی می‌فروشد، درآمد مداوم طبق قرارداد به 150 میلیون دلار رسیده است. این نقطه عطف یادآوری است که برخی از بزرگترین فرصت‌ها در هوش مصنوعی قانونی فراتر از شرکت‌های کفش سفید است که اکنون آن را اتخاذ می‌کنند. برای شرکت‌های حقوقی سنتی که هر ساعت صورت‌حساب می‌دهند، هوش مصنوعی یک معضل ایجاد می‌کند. نرم‌افزاری که وکلا را کارآمدتر می‌کند، می‌تواند به درآمد آنها نیز کمک کند. اما شرکت‌های آسیب‌های شخصی معمولاً روی موارد احتمالی کار می‌کنند و از آنچه مشتریانشان برنده می‌شوند، کوتاهی می‌کنند. هرچه سریع‌تر پرونده‌ها را جابه‌جا کنند، زودتر حقوق دریافت می‌کنند. EvenUp در بیشتر زمان وجود خود چیزی شبیه به یک تسویه حساب بود. این شرکت شروع به خودکارسازی نامه‌های تقاضا کرد، اسناد مفصلی که وکلای آسیب‌های شخصی برای بیمه‌گران ارسال می‌کنند تا برای تسویه حساب مالی اقدام کنند. این یک تجارت ارزشمند است، اما کسب و کاری که رقبا می توانند از آن تقلید کنند. در طول 18 ماه گذشته، EvenUp به نرم افزار هوش مصنوعی گسترش یافته است که به وکلا در مدیریت پرونده ها از ابتدا تا انتها کمک می کند. جدیدترین پیشنهاد آن یک قدم فراتر می رود و عوامل", "image_url": "https://i.insider.com/6aee2e5eeaa5e46dca227c22?width=1200&format=jpeg", "category": "هوش مصنوعی مولد", "tags": ["هوش مصنوعی", "عامل‌های هوشمند"], "datetime_fa": "۱۸ آبان • ۱۸:۲۰"}, {"source": "Business Insider", "title": "Before I moved abroad, I built an affordable, detailed care plan for my 78-year-old mom in the US", "link": "https://www.businessinsider.com/built-care-plan-for-mom-in-us-before-moving-abroad-2026-11", "summary": "Relocating outside the US had been my dream for a long time, but I wanted to make sure my mom had a solid plan in place before I left. Ivy Ge Before I relocated abroad, I set up a care plan for my aging mother, who'd be staying in California. We spent years securing affordable housing that met her needs, and we planned my visits and calls. I also made her a wallet-sized emergency card with her medications and other crucial info. For a long time, I'd wanted to retire early from my career as a pharmacist in California and move abroad to Mexico. However, I worried about leaving behind my aging mom, who was in her late 70s. As the child who lived close by, I considered it my responsibility to take care of her. Determined to find a solution that would let me leave with confidence that my mom would be well cared for, I began building a long-distance care plan before I moved to Mexico at age 50 in 2023. The plan included three essential parts: secure, affordable housing; a remote caregiving system ; and a way to stay connected from abroad. It took us years to secure affordable housing that fit my mother's needs I first started researching senior housing options in 2016. My mom wanted to live independently in a rental near public transportation without leaving San Francisco, where her friends lived. I initially looked at private-pay, independent-living senior apartments , but the monthly costs were well beyond her budget. Depending on the unit size and services provided, these options often started at several thousand dollars a month. Frustrated, I began looking into income-based senior housing . I researched nonprofit housing providers in the city, scanned affordable housing listings, د دورتر پرواز کنند. این تاکتیکی است که در اوکراین اهمیت فزاینده ای پیدا کرده است. هوهنفلز، آلمان - یک پهپاد فقط تا جایی می تواند پرواز کند که خلبانش بتواند ارتباط را حفظ کند. در مرکز اصلی آموزش رزمی خارج از کشور ارتش ایالات متحده، این پیوند حیاتی می تواند در سمت دور تپه های غلتان و جنگل های انبوه ناپدید شود که زمین را به ویژه برای بازی های جنگی مفید می کند. ارتش به دنبال پاسخ به این مشکل به آسمان است. این سرویس می‌خواهد از هواپیماهای بدون سرنشین به عنوان رله‌های ارتباطی هوابرد استفاده کند که می‌تواند به خلبانان کمک کند تا کنترل هواپیمای بدون خدمه را که خارج از دسترس سیگنال مستقیم خط دید هستند، حفظ کنند. اوکراین که در جنگ هواپیماهای بدون سرنشین با روسیه قفل شده است، قبلاً در میدان نبرد به این رویکرد روی آورده است و از پهپادهای رله برای گسترش ارتباط بین خلبان و پهپاد مأموریتی استفاده می کند. مشابه نحوه کار اکستندرهای وای‌فای، این تکرارکننده‌های سیگنال هوابرد معمولاً کوادکوپترهای کوچکی هستند که می‌توانند بالاتر از آنتن‌های زمینی پرواز کنند و به پهپاد مأموریت اجازه پرواز دورتر را می‌دهند. تقریباً 50 سرباز اوکراینی در Combined Resolve، یک رزمایش مکرر در مقیاس بزرگ ارتش ایالات متحده که ماه گذشته در مرکز مشترک آمادگی چندملیتی در باواریا، در شمال مونیخ برگزار شد، شرکت کردند. Business Insider دو روز را صرف مشاهده تمرینات آموزشی کرد، نوعی تست استرس برای ارتش زیرا این سرویس پهپادها،", "image_url": "https://i.insider.com/6aec6f17308912814ed71263?width=1200&format=jpeg", "category": "هوش مصنوعی مولد", "tags": ["فناوری", "نوآوری"], "datetime_fa": "۱۸ آبان • ۱۷:۴۴"}, {"source": "Business Insider", "title": "They quit Cohere to go into law. They say their new firm can avoid Weil's fate.", "link": "https://www.businessinsider.com/startup-law-firm-blackletter-raises-6-million-from-lerer-hippeau-2026-11", "summary": "Blackletter founders Avi Brudner, David Stewart, and Jonathan Rosenbluth. Blackletter Blackletter is the latest startup law firm trying to take clients away from Big Law. The Canadian neofirm has raised a $6 million seed round led by Lerer Hippeau. The founders think it can avoid Weil's fate by building a system that learns from past work. Artificial intelligence has forced Big Law to rethink how legal work gets done and how clients pay for it. The collapse of law firm Weil Gotshal shows how quickly the traditional model can come apart. The founders of Blackletter, a new Canadian neofirm, say artificial intelligence offers a way to build something sturdier. Blackletter has raised a $6 million seed round led by Lerer Hippeau, its cofounder and chief executive, Jonathan Rosenbluth, told Business Insider. The firm combines technology and lawyers to offer businesses legal services for flat fees. The investment marks Lerer Hippeau's first check in legal, a firm spokesperson said. Other Blackletter backers include Seven Stars, Maple VC, Garage Ventures, and Ripple Ventures, as well as Cohere's founders, Aidan Gomez, Nick Frosst, and Ivan Zhang. Rosenbluth saw Weil as a reminder of the existential risk facing legacy firms. Rainmakers can walk at any time. Clients can follow. And a partnership can collapse with the speed of a bank run. Blackletter is betting its clients will come back not because of the relationship with one partner, but because Blackletter understands their business and does the work well. Its lawyers use software built on large language models to draft and negotiate routine corporate contracts and guide transactions from term sheet through diligence and signing. The firm says it has more than 75 clients, including Fanatics, TwelveLabs, and Ada, which has just agreed to merge with fellow customer service agent company Dialpad in a $600 million deal. The lessons from each matter Blackletter works on are meant to inform the next, Rosenbluth said. Lawyers refine how they use the tools, while engineers adapt the technology to help them get better results. Rosenbluth spent a summer during law school at Skadden , where he watched associates a decade his senior grind through menial work. He felt drawn to the legal industry, he said, but the experience convinced him that traditional practice was not the career for him. Before starting Blackletter, he rose through the ranks at Cohere , the fast-growing artificial intelligence model maker, where he led par", "date_str": "2026-11-09T14:00:01+00:00", "hash": "ded9a384c0211f91", "title_fa": "آنها از Cohere خارج شدند تا وارد قانون شوند. آنها می گویند که شرکت جدیدشان می تواند از سرنوشت ویل جلوگیری کند.", "summary_fa": "بنیانگذاران Blackletter، آوی برودنر، دیوید استوارت و جاناتان روزنبلوت. Blackletter Blackletter جدیدترین شرکت حقوقی استارتاپی است که سعی دارد مشتریان را از قانون بزرگ دور کند. شرکت نئوفیرمای کانادایی مبلغ 6 میلیون دلاری را به رهبری لرر هیپو جمع آوری کرده است. بنیانگذاران فکر می کنند که می تواند با ساختن سیستمی که از کارهای گذشته درس می گیرد، از سرنوشت ویل جلوگیری کند. هوش مصنوعی بیگ لاو را وادار کرده است تا درباره نحوه انجام کارهای قانونی و نحوه پرداخت هزینه های مشتریان تجدیدنظر کند. فروپاشی شرکت حقوقی ویل گوتشال نشان می دهد که مدل سنتی چقدر سریع می تواند از هم پاشیده شود. بنیان‌گذاران Blackletter، یک شرکت جدید کانادایی، می‌گویند هوش مصنوعی راهی برای ساختن چیزی قوی‌تر ارائه می‌کند. جاناتان روزن‌بلوت، بنیانگذار و مدیر اجرایی بلک‌لتتر، سرمایه‌گذاری 6 میلیون دلاری به رهبری لرر هیپو، به بیزینس اینسایدر گفت. این شرکت فناوری و وکلا را برای ارائه خدمات حقوقی به مشاغل با هزینه های ثابت ترکیب می کند. سخنگوی این شرکت گفت که این سرمایه گذاری اولین بررسی قانونی لرر هیپو است. سایر حامیان Blackletter عبارتند از Seven Stars، Maple VC، Garage Ventures و Ripple Ventures و همچنین بنیانگذاران Cohere، آیدان گومز، نیک فراست و ایوان ژانگ. روزن بلوث ویل را یادآور خطر وجودی پیش روی شرکت های قدیمی می دانست. باران‌سازان می‌توانند در هر زمانی راه بروند. مشتریان می توانند دنبال کنند. و یک مشارکت می تواند با سرعت یک بانک از بین برود. بلک‌لتتر شرط می‌بندد که مشتریانش نه به خاطر رابطه با یک شریک، بلکه به این دلیل که بلک‌لت کسب‌وکار آنها را درک می‌کند و کار را به خوبی انجام می‌دهد. وکلای آن از نرم‌افزار ساخته شده بر روی مدل‌های زبان بزرگ برای پیش‌نویس و مذاکره قراردادهای معمول شرکتی و هدایت معاملات از برگه‌های مدت از طریق دقت و امضا استفاده می‌کنند. این شرکت می‌گوید", "image_url": "https://i.insider.com/6aecdba5c54bfafa65abf6d1?width=1024&format=jpeg", "category": "هوش مصنوعی مولد", "tags": ["هوش مصنوعی", "عامل‌های هوشمند", "سرمایه‌گذاری"], "datetime_fa": "۱۸ آبان • ۱۷:۳۰"}, {"source": "Business Insider", "title": "I spent 6 months visiting friends all over the country. It was a good reminder not to let distance get in the way.", "link": "https://www.businessinsider.com/traveled-country-visit-friends-distance-friendship-2026-11", "summary": "The author, right, visited friends in NYC. Courtesy of Asha Dore I spent months traveling the country to see friends just as I was turning 40. I enjoyed my time alone while traveling, as well as time with friends. Even a short visit made me feel closer to friends. For the last 10 years, I've celebrated my birthday with small family meals, but as I was turning 40, I changed it up. After getting a taste of solo travel last year during the holidays, I wanted more. My closest friends were spread out across the country, so I decided to visit as many as I could, and spent about six months traveling. What I had imagined as a fun, sweet time became so much more. I deepened friendships I'd made through writing I started my travels a few months before my birthday when two fellow journalists invited me to a girls' weekend at one of their homes in Chicago in the middle of winter. There, I fell in love with deep-dish pizza and glazed duck wings, and felt a somewhat professional relationship deepen into true friendship. It only took minutes of hanging out in real life for me to realize how much I trusted these two women — and how easy it would be for me to help them with whatever they needed, whenever they asked. A few weeks later, we teamed up again with three more friends in New York City to attend a book launch party at our teacher's house. This group is intergenerational — from mid-20s to 60s. We all met in an online writing class two years ago, and we've been meeting weekly on Zoom to talk about our work ever since. Our NYC trip marked the first chance we'd had to meet in person, and it felt like we'd known each other far longer than we had. We are all from different regions of the country, working day jobs in totally different fields, but we share a profound creative optimism. Online, those vibes helped us become friends. In real life, the energy was electric. The author visited a friend in Florida. Courtesy of Asha Dore I saw my high school BFF twice On my actual birthday in March, I met my high school BFF in Sonoma for a long weekend. She came from Florida, and I flew in from my home in Seattle. Since 2021, we have been meeting in different cities once a year to explore the town, chill, and talk about our lives. Complete with a wine tour , a lot of walks through the quiet streets, and evenings at the hotel hot tub, our trip was a vacation in the truest sense — and a necessary annual recharge of our 25-year friendship. I saw her again a few weeks later in Central", "date_str": "2026-11-09T13:15:01+00:00", "hash": "820cea1dfe8335bc", "title_fa": "من 6 ماه را صرف دیدار دوستان در سراسر کشور کردم. یادآوری خوبی بود که نگذارید فاصله مانع شود.", "summary_fa": "درست است که نویسنده از دوستانش در نیویورک دیدن کرده است. با حسن نیت از Asha Dore من ماه ها را صرف سفر به کشور کردم تا دوستانم را ببینم درست زمانی که 40 ساله شدم. از زمان تنهایی خود در سفر و همچنین از زمان با دوستان لذت بردم. حتی یک دیدار کوتاه باعث شد احساس نزدیکی به دوستان کنم. در 10 سال گذشته، من تولدم را با وعده های غذایی کوچک خانوادگی جشن می گرفتم، اما وقتی 40 ساله شدم، آن را تغییر دادم. بعد از چشیدن طعم سفر انفرادی سال گذشته در تعطیلات، بیشتر می خواستم. نزدیکترین دوستان من در سراسر کشور پراکنده بودند، بنابراین تصمیم گرفتم تا جایی که می توانم به دیدن آنها بروم و حدود شش ماه را صرف سفر کردم. آنچه من به عنوان یک زمان سرگرم کننده و شیرین تصور می کردم بسیار بیشتر شد. دوستی‌هایی را که از طریق نوشتن ایجاد کرده
