      tech: [{"source": "TechCrunch AI", "title": "ElevenLabs’ new app combines meeting note-taking and dictation for teams", "link": "https://techcrunch.com/2026/11/13/elevenlabs-new-app-combines-meeting-note-taking-and-dictation-for-teams/", "summary": "ElevenAI is a new meeting notetaker and dictation app aimed at teams and enterprises.", "date_str": "2026-11-13T14:44:48+00:00", "hash": "fed403e0ff6da7da", "title_fa": "برنامه جدید ElevenLabs یادداشت برداری جلسات و دیکته را برای تیم ها ترکیب می کند", "summary_fa": "ElevenAI یک برنامه یادداشت و دیکته جلسات جدید است که هدف آن تیم ها و شرکت ها است. در چند ماه گذشته، Fireflies، Wispr Flow و Granola همگی قابلیت‌های رقابتی را در فضای یادداشت‌برداری و دیکته کردن ارائه کرده‌اند. جدیدترین شرکت کننده در این رده غول هوش مصنوعی صوتی ElevenLabs است که این هفته یک برنامه آزمایشی به نام ElevenAI منتشر کرد که یادداشت برداری جلسات، دیکته و ادغام عامل را ترکیب می کند. ElevenAI تمام ویژگی‌هایی را که معمولاً در سایر برنامه‌های این دسته یافت می‌شود، بسته‌بندی می‌کند. می‌تواند در جلسات شما یادداشت‌برداری کند و به سایر شرکت‌کنندگان اطلاع دهد که مکالمه در حال ضبط است. کاربران می‌توانند داده‌ها را در جلسات پرس‌وجو کنند و در حین چت از کمک مستقیم دریافت کنند و به آنها کمک کند تا جزئیات کلیدی مکالمات قدیمی‌تر را به خاطر بیاورند. ElevenLabs همچنین به شرکت ها اجازه می دهد تا ElevenAgent را ادغام کنند و اقدامات بعدی مانند نوشتن پیش نویس ایمیل بر اساس یادداشت های جلسه را انجام دهند. به علاوه، یک ویژگی دیکته وجود دارد که به کاربران امکان می دهد گفتار را به متن پاک شده در هر برنامه با پشتیبانی از بیش از 90 زبان تبدیل کنند. این شرکت گفت که این برنامه قادر به درک اصطلاحات خاص صنعت در سراسر دیکته و رونویسی جلسات است. ElevenAI به شرکت اجازه می دهد تا از مدل خود به عنوان ویترین استفاده کند و همچنین از پلتفرم های عامل خود برای قیف سازی بافت بهتر استفاده کند. موقعیت استارت‌آپ ممکن است رقابت مستقیم در بازار بهره‌وری نباشد، بلکه به تیم‌های سازمانی این امکان را می‌دهد که مجوزها را برای یک یادداشت‌کننده خریداری نکنند و به جای آن از راه‌حل آن استفاده کنند. همه ابزارهای مرتبط با جلسات در حال تبدیل شدن به قطب های دانش مرکزی برای شرکت ها هستند در", "image_url": "https://techcrunch.com/wp-content/uploads/2026/11/Screenshot-2026-11-13-at-7.19.18-PM.jpg?resize=1200,774", "category": "هوش مصنوعی مولد", "tags": ["هوش مصنوعی", "عامل‌های هوشمند"], "datetime_fa": "۲۲ آبان • ۱۸:۱۴"}, {"source": "HuggingFace Blog", "title": "llama.cpp v1.0.0 : A stronger foundation for the local AI ecosystem", "link": "https://huggingface.co/blog/ggml-org/llama-cpp-v1", "summary": "", "date_str": "2026-11-13T14:05:22+00:00", "hash": "dd3b693b07358fb2", "title_fa": "llama.cpp نسخه 1.0.0: پایه ای قوی تر برای اکوسیستم هوش مصنوعی محلی", "summary_fa": "بازگشت به مقالات a]:hidden\"> llama.cpp v1.0.0 : پایه قوی تری برای تیم اکوسیستم هوش مصنوعی محلی مقاله منتشر شده در 13 نوامبر 2026 رأی مثبت 36 +30 Daniel Bevenius danbev ggml-org را دنبال کنید گئورگی گرگانوف ggerganov را دنبال کنید ggml-org ggvemer را دنبال کنید :last-child]:mb-0\"> llama.cpp اجرای LLM های چندوجهی را در طیف وسیعی از سخت افزارها امکان پذیر می کند - از ماشین های محلی درجه مصرف کننده تا سرورهای سازمانی پیشرفته. از طریق کوانتیزاسیون، بک‌اندهای بهینه‌سازی شده، و پیاده‌سازی C/C++ قابل حمل، استنتاج هوش مصنوعی را در هر سطحی از پشته نرم‌افزار قابل دسترس می‌کنیم. ما معتقدیم که این سبک‌ترین، همه‌کاره‌ترین و معقول‌ترین پلتفرم برای ساخت محصولات هوش مصنوعی بین پلتفرمی و خصوصی است. در طول 3.5 سال از شروع آن، این پروژه بسیار رشد کرده است و بسیاری از برنامه های کاربردی پایین دستی در حال حاضر به کار ما بستگی دارند. ما انتظار داریم که این روند ادامه یابد زیرا هوش مصنوعی محلی و حریم خصوصی به طور فزاینده ای در زندگی روزمره ما اهمیت پیدا می کند. هر ادغام جدید به معنای توسعه دهندگان بیشتر بسته به رابط های کتابخانه ما است و بنابراین داشتن یک API انعطاف پذیر اما پایدار بسیار مهم است. امروز کتابخانه ها نسخه 1.0.0 را منتشر می کنیم و مسئولیت خود را در قبال آن توسعه دهندگان برجسته می کنیم. با حرکت رو به جلو، هم llama.cpp و هم ggml ناسازگاری های API و ABI را با برآمدگی های نسخه اصلی منعکس می کنند. با افزایش پذیرش، ما در مورد قابل مشاهده کردن این مرزها برای مصرف کنندگان پایین دستی سختگیرتر خواهیم بود. انتشار سرصفحه(های) عمومی کتابخانه انتشار llama.cpp v1.0.0 - استنتاج LLM در C/C++ libllama llama.cpp/include/ ggml v1.0.0 - کتابخانه تانسور برای یادگیری ماشین libggml ggml/include/ قوانین به روز رسانی نسخه معنایی قوانین زیر برای همه نسخه های", "image_url": "https://cdn-uploads.huggingface.co/production/uploads/63148d3b996c52bf0142cdbe/2PgU1GxpJX_LVORaP2RRy.png", "category": "هوش مصنوعی مولد", "tags": ["هوش مصنوعی", "Meta"], "datetime_fa": "۲۲ آبان • ۱۷:۳۵"}, {"source": "The Verge", "title": "What s really at stake in the Jensen Huang saga", "link": "https://www.theverge.com/podcast/1032866/jensen-huang-nvidia-china-trump-vergecast", "summary": "One part of the saga surrounding Nvidia CEO Jensen Huang ended on Thursday, when Huang resigned from his position at the top of AI's most important company. But in the coming weeks and months, a much bigger story may be about to unfold. A story about Nvidia's dealings in China, about the US government's willingness to turn a lot of blind eyes to protect a powerful ally, and about the very stability of the AI industry as a whole. It's a lot. On this episode of The Vergecast , David and Nilay start by trying to unpack the many parts of the story. We're all going to learn a lot more about Megaspeed than we ever planned or wanted, and we're goin … Read the full story at The Verge.", "date_str": "2026-11-13T14:47:16+00:00", "hash": "00c0a0d3795a182b", "title_fa": "آنچه واقعاً در حماسه جنسن هوانگ در خطر است", "summary_fa": "بخشی از حماسه پیرامون جنسن هوانگ، مدیرعامل انویدیا، روز پنجشنبه با استعفای هوانگ از سمت خود در رأس مهمترین شرکت هوش مصنوعی، پایان یافت. اما در هفته‌ها و ماه‌های آینده، داستان بسیار بزرگ‌تری ممکن است در شرف آشکار شدن باشد. داستانی در مورد معاملات Nvidia در چین، در مورد تمایل دولت ایالات متحده برای بستن چشمان زیادی برای محافظت از یک متحد قدرتمند، و در مورد ثبات صنعت هوش مصنوعی در کل. خیلی زیاد است. در این قسمت از The Vergecast، دیوید وری این شرکت به سرقت رفته است. در اعلامیه‌هایی که این هفته با چندین ایالات متحده ارسال شد. دادستان های کل، از جمله کالیفرنیا، غول سواری-تگرگ گفت که در 9 اکتبر توسط ارائه دهنده اطلاع داده شده است که هکرها اطلاعات داخلی را که برای دسترسی به داده های اوبر مورد استفاده قرار می گرفت، نفوذ کرده و سرقت کرده اند. این شرکت گفت که متعاقباً شروع به اطلاع رسانی به رانندگان آسیب دیده مبنی بر ذخیره اطلاعات شخصی آنها در ارائه دهنده کرد. TechCrunch دریافته است که ارائه‌دهنده آن Fireworks AI است که به توسعه‌دهندگان امکان دسترسی و استفاده از مدل‌های هوش مصنوعی باز را می‌دهد. Fireworks در ماه گذشته گزارش داده بود که در آن هکرها اطلاعات مشتریانش از جمله داده های صورتحساب و برخی از مجموعه داده های هوش مصنوعی خصوصی را به سرقت بردند. استارت‌آپ بهره‌وری آنلاین Notion تایید کرد که داده‌های آن نیز در هک Fireworks به سرقت رفته است. سخنگوی اوبر به TechCrunch گفت: «اعلامیه‌ها به رانندگان مربوط به یک حادثه امنیتی است که بر یکی از فروشندگان شخص ثالث ما، Fireworks.ai، که به برخی از داده‌های Uber دسترسی داشت، تأثیر گذاشته است، و سؤالات ما را به Fireworks موکول کرد. اوبر نگفت که چند مشتری تحت تأثیر این نقض قرار گرفته اند و همچنین چند راننده را در مورد این رخداد مطلع نکرده است. سخنگوی Fireworks به سوالات در مورد این حادثه پاسخ نداد. بر اساس اعلامیه‌های نقض داده‌ها که توسط TechCrunch مشاهده شده است، داده‌های سرقت شده شامل گواهینامه‌های رانندگی 2567", "image_url": "https://techcrunch.com/wp-content/uploads/2024/07/GettyImages-2043993878-e1722276196662.jpg?resize=1200,676", "category": "هوش مصنوعی مولد", "tags": ["هوش مصنوعی", "امنیت سایبری"], "datetime_fa": "۲۲ آبان • ۱۸:۲۷"}, {"source": "Ars Technica", "title": "Screenless GPS: Slate Auto says, \"Remember the road atlas\"", "link": "https://arstechnica.com/culture/2026/11/screenless-gps-slate-auto-says-remember-the-road-atlas/", "summary": "Whether it's nostalgia or a sense that technology has gotten a bit too pervasive, there’s no denying that Slate Auto appears to be tuned into the particular moment. The startup has a simple pitch : an affordable el       media: [{"source": "Billboard", "title": "Queen Latifah’s Full-Circle Moment: How the Rock Hall Honoree Is Giving Back to New Jersey", "link": "https://www.billboard.com/music/rb-hip-hop/queen-latifah-rock-hall-you-can-go-home-doc-interview-1236378188/", "summary": "“First of all, let me teach you how to walk through Newark. Don t say ‘New-work,’” quips Queen Latifah, playfully schooling me on the proper pronunciation of her hometown. “It s just one syllable. Never get caught saying ‘New-work.’” The spirited polymath remains as sly and quick-witted as ever, nearly four decades after bursting onto the hip-hop scene in the late 1980s. More than three decades after delivering her seminal rallying cry, “U.N.I.T.Y.,” Latifah is channeling that same spirit of empowerment into giving back to the city that raised her. In her upcoming BET documentary, You Can Go Home Again — set to premiere Nov. 27 — the rap pioneer is in restoration mode, helping provide affordable housing for families in her hometown of Newark, New Jersey. “I grew up in a very busy place where I got to experience jazz, gospel and rock and roll. I got to see hip-hop being born. I experienced love for the first time, death for the first time, danger and excitement in every possible way,” she recalls. For Latifah, her commitment to uplifting her community comes at a crowning moment in her storied career. On Saturday (Nov. 14), she ll be inducted into the Rock Roll Hall of Fame as a recipient of the Early Influence Award. She joins a star-studded class of musical luminaries, including Phil Collins, Celia Cruz, Sade, Oasis and Fela Kuti, alongside fellow hip-hop trailblazers Wu-Tang Clan and MC Lyte. “There are so many people I carry in my heart and on my back,” she says. “The KRS-Ones of the world, the Public Enemys of the world — I m not me without them. They showed us how to do it. They took us little baby acts on tour and taught us how to do things. I really appreciate them.” Billboard spoke with Queen Latifah about the meaning of home, her upcoming documentary, and earning her place in the Rock Roll Hall of Fame. You ve built an incredible legacy in entertainment, but now you re helping families in Newark find a place to call home. When you think about everything you ve accomplished, what makes this chapter of your life, particularly giving back, so meaningful to you? I ve always loved real estate and interior design. It s always been something I m into. So, to be able to see something go from an idea to actual brick and mortar, with people living there, is incredible. To see it come to fruition and know there are people who will be living in these apartments, getting up and going to work, who may work for BET or may be the next executive who gives me a job ", "date_str": "2026-11-13T15:00:00+00:00", "hash": "dff5c53de07b47ea", "title_fa": "لحظه کامل ملکه لطیفه: چگونه افتخاری راک هال به نیوجرسی برمی گردد", "summary_fa": "ملکه لطیفه با شوخی به من آموزش می دهد که چگونه در نیوآرک قدم بزنید. \"این فقط یک هجا است. هرگز با گفتن \"کار جدید\" گرفتار نشوید.\" این پلیماث با روحیه مانند همیشه حیله گر و تیزبین است، تقریباً چهار دهه پس از ورود به صحنه هیپ هاپ در اواخر دهه 1980. لطیفه بیش از سه دهه پس از ایراد فریاد تجمع کننده خود، «U.N.I.T.Y.»، همان روحیه توانمندی خود را برای پس دادن به شهری که او را بزرگ کرده است، هدایت می کند. در مستند آینده او BET، You Can Go Home Again - که قرار است در 27 نوامبر اکران شود - پیشگام رپ در حالت بازسازی است و به ارائه مسکن مقرون به صرفه برای خانواده ها در زادگاهش نیوآرک، نیوجرسی کمک می کند. من در مکانی بسیار شلوغ بزرگ شدم که جاز، گاسپل و راک اند رول را تجربه کردم. تولد هیپ هاپ را دیدم. من برای اولین بار عشق را تجربه کردم، برای اولین بار مرگ، خطر و هیجان را به هر طریق ممکن تجربه کردم.» برای لطیفه، تعهد او به ارتقای جامعه اش در نقطه پایانی از زندگی حرفه ای او رخ می دهد. در روز شنبه (14 نوامبر)، او به عنوان دریافت کننده جایزه Eward به تالار مشاهیر راک رول معرفی خواهد شد. او به کلاس ستاره‌ای از مشاهیر موسیقی، از جمله فیل کالینز، سلیا کروز، ساد، اوسیس و فلا کوتی، در کنار وو تانگ کلن و ام‌سی لایت، پیشگامان هیپ‌هاپ می‌پیوندد. او می‌گوید: «مردم زیادی هستند که من در قلب و پشتم حمل می‌کنم. \"KRS-Ones جهان، دشمنان عمومی جهان - من بدون آنها من نیستم. آنها به ما نشان دادند که چگونه این کار را انجام دهیم. آنها به ما بازیگران کودک کوچک را به تور بردند و به ما یاد دادند که چگونه کارها را انجام دهیم. من واقعاً از آنها", "image_url": "https://www.billboard.com/wp-content/uploads/2026/11/P108EAHP-e1794519407886.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["موسیقی"], "datetime_fa": "۲۲ آبان • ۱۸:۳۰"}, {"source": "Billboard", "title": "Taylor Swift to Perform at CMA Awards for First Time in 13 Years", "link": "https://www.billboard.com/music/awards/taylor-swift-perform-cma-awards-2026-1236381663/", "summary": "Taylor Swift is returning to the CMA Awards stage for her first performance at the ceremony in 13 years, the CMAs and ABC announced on Friday (Nov. 13). The 60th Annual CMA Awards will air live from Nashville Wednesday, Nov. 18, on ABC and Disney+ (and available the following day on Hulu). Related Taylor Swift to Receive 2026 Sherry Lansing Leadership Award From Greta Gerwig at Women in Entertainment Gala Travis Kelce Plans to Consult Taylor Swift on This Business Venture: I ll See What My Wife Can Cook Up Taylor Swift Celebrates Her 2026 CMA Award Nomination: I Haven t Yee d My Last Haw Swift, who has won CMA entertainer of the year winner twice, is nominated for a CMA Award this year for single of the year for I Knew It, I Knew You, which marks her 26th career CMA nomination. The pop superstar wrote and recorded I Knew It, I Knew You which topped the Billboard Hot 100 for two weeks for the animated movie Toy Story 5 , which released earlier this year. Swift also co-produced the track with Jack Antonoff. Swift has earned nine total CMA Awards wins to date. The singer-songwriter, who was just inducted into the Nashville Songwriters Hall of Fame during a Music City ceremony a few weeks ago, has never won a CMA in the single of the year category, though she was previously nominated in the category in 2013, for her work on Highway Don t Care, recorded with Tim McGraw and Keith Urban. The 14-time Grammy winner first attended the CMAs in 2006, and picked up her first win the following year with the horizon award. In 2009, she became the youngest CMA entertainer of the year winner in history. The 2013 CMA Awards saw Swift earn the pinnacle award, which had previously been awarded to artists including Tim McGraw, George Strait, Faith Hill, Keith Urban, Brad Paisley and Rascal Flatts. That year, she also performed her hit Red with Vince Gill and Alison Krauss, marking her most recent performance on the CMA Awards stage. The 60th Annual CMA Awards is a production of the Country Music Association, with Robert Deaton serving as executive producer, Alan Carter serving as director, and Jon Macks serving as head writer. Ella Langley leads this year s CMA Awards with nine nominations, followed by Miranda Lambert with five. Lainey Wilson will host the CMAs for a third consecutive year.", "date_str": "2026-11-13T14:38:19+00:00", "hash": "9357f26027bcfac7", "title_fa": "تیلور سویفت برای اولین بار پس از 13 سال در جوایز CMA اجرا می کند", "summary_fa": "CMA و ABC در روز جمعه (13 نوامبر) اعلام کردند که تیلور سوئیفت برای اولین اجرای خود در مراسم پس از 13 سال به صحنه جوایز CMA بازمی گردد. شصتمین جوایز سالانه CMA به طور زنده از نشویل چهارشنبه، 18 نوامبر، در ABC و Disney+ پخش خواهد شد (و روز بعد در Hulu در دسترس است). تیلور سویفت مرتبط برای دریافت جایزه رهبری شری لنسینگ 2026 از گرتا گرویگ در جشن زنان در سرگرمی تراویس کلس قصد دارد با تیلور سویفت در مورد این سرمایه گذاری تجاری مشورت کند: خواهم دید که همسرم چه چیزی می تواند بپزد تیلور سوئیفت جشن سال 2026 خود را جشن می گیرد. سوئیفت که دو بار برنده جایزه بهترین سرگرمی سال CMA شده است، امسال برای تک آهنگ سال برای I Knew It, I Knew You نامزد دریافت جایزه CMA شده است که بیست و ششمین نامزدی حرفه ای او در CMA است. سوپراستار پاپ نوشت و ضبط I Knew It, I Knew You را ضبط کرد که به مدت دو هفته برای انیمیشن Toy Story 5 که اوایل امسال منتشر شد، در صدر 100 بیلبورد داغ قرار گرفت. سویفت همچنین با جک آنتونوف این آهنگ را تولید کرد. سوئیفت تا به امروز 9 بار برنده جایزه CMA شده است. این خواننده و ترانه سرا، که چند هفته پیش در طی مراسمی در شهر موسیقی به تالار مشاهیر نشویل راه یافت، هرگز موفق به دریافت جایزه CMA در بخش بهترین تک آهنگ سال نشده بود، اگرچه قبلاً در سال 2013 برای کارش در Highway Don t Care که با تیم مک گراو و کیت اوربان ضبط شده بود، نامزد این بخش شده بود. برنده 14 گرمی اولین بار در سال 2006 در CMA شرکت کرد و سال بعد با جایزه horizon اولین برد خود را به دست آورد. در سال 2009، او جوان‌ترین برنده", "image_url": "https://www.billboard.com/wp-content/uploads/2026/11/Taylor-Swift-CR-Kevin-Mazur-billboard-1800.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["سینما", "موسیقی"], "datetime_fa": "۲۲ آبان • ۱۸:۰۸"}, {"source": "Billboard", "title": "Gerry Griffith, Whitney Houston Discoverer, Dead at 87", "link": "https://www.billboard.com/pro/gerry-griffith-dead-at-87/", "summary": "Gerry Griffith , the former vp of A R at Arista Records who discovered Whitney Houston and worked with other prominent artists, has died. Griffith passed away Nov. 5 in Brooklyn, New York, after a five-year battle with dementia. He was 87 years old. Houston was 16 years old and performing with her mother, Cissy Houston, when label executive Griffith first heard the teenager’s undeniable vocal talent in 1979. He was even more captivated in 1983 when he saw Houston singing with her mother again. Amid rumors that another label was close to signing the newcomer, Griffith persuaded then-Arista chief Clive Davis to attend a showcase. The global superstar-to-be signed with Arista that same year. Related Clive Davis: All His No. 1 Hits on the Billboard Hot 100, From Whitney Houston to Simon Garfunkel CL Signs With THEBLACKLABEL, Reuniting With Longtime Producer Teddy For Full Circle Moment Severe Weather, Radius Clauses and Finding the Next Generation o     function toFaDigits(n) {
      const f = ['۰','۱','۲','۳','۴','۵','۶','۷','۸','۹'];
      return n.toString().replace(/\d/g, d => f[d]);
    }

    function toggleRead(hash) {
      if (readArticles.has(hash)) {
        readArticles.delete(hash);
      } else {
        readArticles.add(hash);
      }
      localStorage.setItem('read_articles_registry', JSON.stringify(Array.from(readArticles)));
      renderNews();
    }

    function renderNews() {
      const container = document.getElementById('newsContainer');
      const rawItems = data[currentTab] || [];
      
      const filtered = rawItems.filter(item => {
        if (!searchQuery) return true;
        const q = searchQuery.toLowerCase();
        const title = (item.title_fa || item.title || '').toLowerCase();
        const summary = (item.summary_fa || item.summary || '').toLowerCase();
        const source = (item.source || '').toLowerCase();
        const category = (item.category || '').toLowerCase();
        const tags = (item.tags || []).join(' ').toLowerCase();
        return title.includes(q) || summary.includes(q) || source.includes(q) || category.includes(q) || tags.includes(q);
      });

      const unreadList = [];
      const readList = [];

      filtered.forEach(item => {
        if (readArticles.has(item.hash)) {
          readList.push(item);
        } else {
          unreadList.push(item);
        }
      });

      const sortedItems = [...unreadList, ...readList];

      if (sortedItems.length === 0) {
        container.innerHTML = '<div style="text-align:center; padding: 40px; color: var(--text-muted);">هیچ خبری در این بخش در ۲۴ ساعت گذشته ثبت نشده است.</div>';
        return;
      }

      container.innerHTML = sortedItems.map((item, idx) => {
        const title = item.title_fa || item.title || '';
        const summary = item.summary_fa || item.summary || '';
        const source = item.source || 'منبع خبر';
        const link = item.link || '#';
        const isRead = readArticles.has(item.hash);
        const num = toFaDigits(idx + 1);
        const category = item.category || '';
        const tags = item.tags || [];
        const datetimeFa = item.datetime_fa || '';

        return `
          <article class="news-card ${isRead ? 'is-read' : ''}" id="card-${item.hash}">
            <div class="news-header">
              <span class="news-num">${isRead ? '✓' : num}</span>
              <h2 class="news-title">${title}</h2>
            </div>
            ${summary ? `<p class="news-summary">${summary}</p>` : ''}
            <div class="news-footer">
              <div class="footer-top-row">
                <div class="meta-group">
                  <span class="news-source">📌 ${source}</span>
                  ${datetimeFa ? `<span class="news-datetime">🕒 ${datetimeFa}</span>` : ''}
                  ${category ? `<span class="news-category-badge" onclick="filterByTag('${category}')">📂 ${category}</span>` : ''}
                </div>
              </div>
              ${tags && tags.length > 0 ? `
                <div class="footer-tags-row">
                  ${tags.map(t => `<span class="news-tag-chip" onclick="filterByTag('${t}')">#${t}</span>`).join('')}
                </div>
              ` : ''}
              <div class="footer-bottom-row">
                <div class="footer-actions-right">
                  <button class="btn-mark-read" onclick="toggleRead('${item.hash}')">
                    ${isRead ? '✓ خوانده شد' : '○ علامت خوانده‌شده'}
                  </button>
                </div>
                <div class="footer-actions-left">
                  ${link && link.startsWith('http') ? `<a href="${link}" target="_blank" rel="noopener noreferrer" class="news-link">مطالعه اصل خبر ↗</a>` : ''}
                </div>
              </div>
            </div>
          </article>
        `;
      }).join('');
    }

    function filterByTag(val) {
      const searchInput = document.getElementById('searchInput');

        window.scrollTo({ top: 0, behavior: 'smooth' });
      }

    function switchTab(tab, el) {
      currentTab = tab;

      if (el) el.classList.add('active');
      renderNews();
    }

    function toggleTheme() {
      const html = document.documentElement;
      const current = html.getAttribute('data-theme') || 'dark';
      const next = current === 'dark' ? 'light' : 'dark';
      html.setAttribute('data-theme', next);
      localStorage.setItem('theme', next);
      updateThemeButton(next);
    }

    function updateThemeButton(theme) {
      const icon = document.getElementById('themeIcon');
      const text = document.getElementById('themeText');
      if (theme === 'dark') {
        icon.textContent = '☀️';
        text.textContent = 'حالت روشن';
      } else {
        icon.textContent = '🌙';
        text.textContent = 'حالت تاریک';
      }

    const savedTheme = localStorage.getItem('theme') || 'dark';
    document.documentElement.setAttribute('data-theme', savedTheme);
    updateThemeButton(savedTheme);

    document.getElementById('searchInput').addEventListener('input', (e) => {
      searchQuery = e.target.value.trim();
      renderNews();
    });

    renderNews();
  </script>
</body>
</html>
