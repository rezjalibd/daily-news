ft Pinch [ ]", "date_str": "2026-10-28T19:44:51+00:00", "hash": "2f90f6a4b98ac28d", "title_fa": "سلنا گومز و دمی لواتو لحظات \"برنامه محافظت از شاهزاده خانم\" را در کمپین جدید زیبایی نادر بازسازی کردند", "summary_fa": "سلنا گومز و دمی لواتو «دلنا» را برمی‌گردانند. ستارگان سابق کانال دیزنی برای کمپین جدیدی برای برند زیبایی گومز، Rare Beauty، دوباره گرد هم آمده‌اند و لحظاتی از فیلم سال 2009 خود «برنامه محافظت از شاهزاده خانم» و ویدیوهای اولیه‌شان در یوتیوب را بازسازی می‌کنند. این کمپین با عنوان «هنوز همدیگر را سرخ می‌کنیم»، نسخه محدود «دلنا» را معرفی می‌کند [ ] با عنوان «هنوز همدیگر را سرخ می‌کنیم»، این کمپین مجموعه‌ای از رژگونه‌های مایع را با نسخه محدود «دلنا» معرفی می‌کند که از نام مستعار طرفداران برای دوستان دوران کودکی نام‌گذاری شده است. این مجموعه 50 دلاری دارای دو رنگ رژگونه مایع پرفروش Rare Beauty است: Hope، رنگ ارغوانی برهنه مورد علاقه گومز، و Virtue، هلویی بژ انتخاب شده توسط Lovato. داستان‌های مرتبط پیت و همه تقصیرهایش در میان برندگان افتتاحیه جوایز فرهنگ هنرهای ناتوانی ایسترسیال، نوح وایل به‌عنوان جذاب‌ترین مرد جهان در سال 2026 انتخاب شد، که شامل یک برس رژگونه ملایم است و منحصراً در وب‌سایت Rare Beauty در دسترس است. اما می‌توانید محصولات دیگری را که در کمپین ارائه می‌شوند به طور جداگانه در خرده‌فروش‌هایی مانند Ulta و Sephora خریداری کنید. این کمپین به چند لحظه از سال های کانال دیزنی این زوج اشاره می کند. در یک تصویر، گومز و لواتو پوستر «برنامه حفاظت از شاهزاده خانم» را با نسخه‌های به‌روز لباس‌های آبی و زردی که شخصیت‌های کارتر میسون و پرنسس روزالیندا پوشیده بودند، بازسازی کردند. در ویدئویی که در کانال یوتیوب گومز ارسال شده است، این زوج به سری یوتیوب سال 2008 خود، «نمایش دمی و سلنا»، با پاسخ دادن به سؤالات، بحث در مورد علاقه‌های دوران کودکی و همگام‌سازی با «یک و یکسان»، دوتایی‌شان از فیلم، سری می‌زنند.", "image_url": "https://variety.com/wp-content/uploads/2026/10/DIGITAL_ONLINE_ONLY_sRGB_3378_IMAGINE_SW_RARE_BEAUTY_111598_SWI_RareBeauty_019_14_F1.jpg?w=1000&#038;h=563&#038;crop=1", "category": "هوش مصنوعی مولد", "tags": ["سینما"], "datetime_fa": "۶ آبان • ۲۳:۱۴"}, {"source": "Variety", "title": "Cynthia Erivo Calls Out Public’s ‘Annoyance’ Over Ariana Grande Friendship: ‘Why Are They Showing Emotion? How Dare They Cry!’", "link": "https://variety.com/2026/film/news/cynthia-erivo-annoyance-ariana-grande-friendship-wicked-1236933585/", "summary": "Cynthia Erivo is reflecting on the attention her friendship with “Wicked” co-star Ariana Grande received while on the press tour for the movie musical and its sequel. The theater star and singer has rocketed to greater heights of fame following Jon M. Chu’s adaptation of “Wicked,” which stars Erivo as the wicked witch Elphaba opposite [ ]", "date_str": "2026-10-28T19:33:04+00:00", "hash": "7cd61bdab43d0cbf", "title_fa": "سینتیا اریوو از \"آزار\" عمومی به خاطر دوستی آریانا گراند می گوید: \"چرا آنها احساسات نشان می دهند؟\" چقدر جرات گریه کردن دارند!", "summary_fa": "سینتیا اریوو در حال انعکاس توجهی است که دوستی اش با آریانا گرانده، همبازی اش در «شرور» در جریان تور مطبوعاتی برای فیلم موزیکال و دنباله آن به دست آورد. این ستاره و خواننده تئاتر به دنبال جان ام. اقتباس چو از «شرور»، که اریوو در آن نقش جادوگر شرور الفابا را در مقابل [ ] بازی می‌کند: «جالب بود که افراد زیادی بودند که از روی کاناپه‌هایشان روان‌شناس شده بودند،» اریو در مصاحبه‌ای برای درام دادگاه آینده‌اش «Prima Facie» به گاردین گفت. \"این نوع عجیب و غریب وجود داشت، کلمه ای که من به دنبال چیست ... آزاردهنده ... از این واقعیت است که دو زن واقعاً می توانند دوست باشند. مثلاً، چرا آنها با هم دوست هستند؟ چرا به هم متصل هستند؟ حتماً مشکلی در آنها وجود دارد.» بسیاری از لحظات ویروسی شامل در آغوش گرفتن، گریه کردن و - شاید بدترین - \"فضا نگه داشتن\" با فشردن انگشتان اشاره‌گر یکدیگر بود. \"چرا آنها احساسات خود را نشان می دهند؟ چطور جرات می کنند گریه کنند؟ و چگونه جرات می کنند بخندند؟ و چگونه جرأت می کنند که احساساتی و زنده باشند؟» اریو پرسید. او افزود: «این یک شمشیر دو لبه است. «چون اگر پشت چشم مرده بودیم و هیچ احساسی نشان نمی‌دادیم، چیز دیگری می‌توانست در مورد آن بگویم. ای کاش کسی بود که می‌توانست اینطور بگوید، «درسته، این تعادل احساسی است که باید نشان دهید. این را نشان نده. آن را نشان نده. فقط این مقدار.» یکی از به یاد ماندنی‌ترین لحظات زمانی اتفاق افتاد که اریوو بعد از یک مرد بزرگ در حال پریدن روی ماشین قرمز به بازی رفت. اریوو آن لحظه را وحشتناک توصیف کرد و گفت که واکنش او فقط این بود: \"این مرد را اکنون از ما دور کن.\"", "image_url": "https://variety.com/wp-content/uploads/2025/11/GettyImages-2246093922.jpg?crop=0px%2C4px%2C4306px%2C2425px&#038;resize=1000%2C563", "category": "هوش مصنوعی مولد", "tags": ["سینما"], "datetime_fa": "۶ آبان • ۲۳:۰۳"}, {"source": "Billboard", "title": "Which Halloween Songs Are Leading the Early Streaming Race This Year?", "link": "https://www.billboard.com/music/chart-beat/halloween-songs-leading-streaming-michael-jackson-thriller-1236369597/", "summary": "Welcome to Billboard Pro’s Trending Up newsletter, where we take a closer look at the songs, artists, curiosities and trends that have caught the music industry’s attention. Some have come out of nowhere, others have taken months to catch on, and all of them could become ubiquitous in the blink of a TikTok clip. This week: The Halloween rush begins with a number of heavy hitters and one new favorite, while a Megan Thee Stallion freestyle begins to pop and Glee ks rejoice over news of a revival. Michael Jackson, Tame Impala, Rockwell Lead Halloween Streaming Race a Week Before the Holiday There should be more eyeballs than ever on this year s Halloween-week chart race, as two seasonal songs — one old, and one new(-ish) — could be in the hunt for the Billboard Hot 100 s No. 1 spot for the first time ever. And unsurprisingly, they re also the two songs that are leading the early race among all scary songs on streaming: Michael Jackson s Thriller and Tame Impala s Dracula. Traditionally, the Saturday before Halloween serves as something of a warm-up for the actual day, as spooky-season enthusiasts engage in trial runs for their costumes and/or theme parties, and the usual appropriate soundtrack songs have their best streaming days of the year so far. Such was the case with Thriller, which led all related songs on Saturday (Oct. 24) with nearly 1.7 million official on-demand U.S. streams, its highest daily total since amassing 2.7 streams Nov. 1 (the Saturday after last year s Halloween). Dracula pulled in the second-highest total among Halloween songs, with over 1.1 million streams on Saturday. That didn t mark its best streaming day of the year — given that the late-2025-released song has been one of the biggest streaming hits of 2026, particularly after being boosted by a JENNIE-featuring remix in February — but it was its best day in over two months (since Aug. 21), as well as both a 12% gain on its performance the previous Saturday (Oct. 18), and an 8% gain on its total the Saturday before last Halloween (Oct. 24, 2025). Dracula narrowly leads a number of other, longer-established Halloween favorites, including Rockwell s Somebody s Watching Me (also co-written by Michael Jackson) and Ray Parker Jr. s Ghostbusters, both of which were just under 1.1 million streams for that Saturday. Just behind those landed Citizens of Halloween s This Is Halloween, Bobby Boris Pickett The Crypt-Kickers Monster Mash and Andrew Gold s Spooky Scary Skeletons, all of which we", "date_str": "2026-10-28T18:58:08+00:00", "hash": "7756af384cadb5f8", "title_fa": "کدام آهنگ‌های هالووین امسال در مسابقه استریم اولیه پیشرو هستند؟", "summary_fa": "این هفته: عجله هالووین با تعدادی از بازیکنان سنگین و یک مورد علاقه جدید آغاز می شود، در حالی که سبک آزاد مگان تی استالیون شروع به پاپ می کند و Glee ks از اخبار احیا خوشحال می شود. Foo Fighters مرتبط، انفجاری از گذشته را در کیمل ارائه می‌کند: مامما میا ABBA را تماشا کنید! پارتی به استرالیا می‌آید تماشای اجرای سرود ملی NE-YO در بازی 4 سری جهانی 2026 در خلیج تامپا. مسابقه چارت هفته هالووین امسال باید بیش از هر زمان دیگری مورد توجه قرار گیرد، زیرا دو آهنگ فصلی - یکی قدیمی و دیگری جدید (-ish) - می‌توانند برای اولین بار در بیلبورد رتبه 10 را پیدا کنند. و جای تعجب نیست، آنها همچنین دو آهنگی هستند که در بین تمام آهنگ‌های ترسناک در جریان، در رقابت اولیه پیشرو هستند: Thriller مایکل جکسون و Tame Impalas Dracula. به طور سنتی، شنبه قبل از هالووین به عنوان چیزی شبیه گرم کردن برای روز واقعی عمل می کند، زیرا علاقه مندان به فصل شبح وار برای لباس ها و/یا مهمانی های موضوعی خود در برنامه های آزمایشی شرکت می کنند، و آهنگ های موسیقی متن مناسب معمول بهترین روزهای پخش خود را تا کنون در سال داشته اند. چنین موردی در مورد Thriller بود، که همه آهنگ‌های مرتبط را در روز شنبه (24 اکتبر) با نزدیک به 1.7 میلیون استریم رسمی درخواستی ایالات متحده رهبری کرد که بالاترین میزان روزانه آن از زمان جمع آوری 2.7 استریم در 1 نوامبر (شنبه بعد از هالووین سال گذشته) است. دراکولا با بیش از 1.1 میلیون استریم در روز شنبه در رتبه دوم در میان آهنگ های هالووین قرار گرفت. این بهترین روز پخش سال خود را نشان نداد - با توجه به اینکه آهنگ منتشر شده در اواخر سال 2025 یکی از بزرگ‌ترین آهنگ‌های پخش جریانی سال 2026 بوده است،", "image_url": "https://www.billboard.com/wp-content/uploads/2026/05/michael-jackson-nyc-1984-billboard-1800.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["موسیقی"], "datetime_fa": "۶ آبان • ۲۲:۲۸"}, {"source": "Billboard", "title": "Here’s When ‘Alan Jackson: The Last Show’ Is Coming to TV Screens & Streaming", "link": "https://www.billboard.com/music/country/alan-jackson-the-last-show-airdate-streaming-1236369714/", "summary": "On June 27, Country Music Hall of Famer Alan Jackson sold out Nashville s Nissan Stadium, as tens of thousands of fans filled the venue and thousands more gathered on Broadway downtown to watch livestreams of Jackson s final concert as he celebrated his decades of influence on country music. He had previously retired from the road, following a diagnosis of Charcot Marie Tooth Disease, but celebrated with that one final show at Nashville s Nissan Stadium in June. On Dec. 8, fans who didn t get to see the show will be able to take in the special event, when NBC airs Alan Jackson: The Last Show from 8 to 10 p.m. ET/PT. The special will also stream the following day on Peacock . Related Alan Jackson’s ‘Last Call’ Concert to Air as an NBC Special Raj Kapoor — Executive Producer of 2026 Grammys, Oscars, Tonys ACM Awards — on His Hot Streak: I m One of the Luckiest People on the Planet Alan Jackson s Finale Concert Was a Celebration of a Country Music Icon The concert features Jackson offering a headlining set that includes his classic hits such as Chattahoochee, Remember When and It s Five O Clock Somewhere. Jackson will also be joined by fellow country stars including Luke Bryan, Eric Church, Luke Combs, Riley Green, Cody Johnson, Miranda Lambert, Little Big Town, Jake Owen, Jon Pardi, Thomas Rhett, Carrie Underwood, Lainey Wilson, Lee Ann Womack and Adam Wright. The upcoming concert telecast will also feature Jackson in a special collaboration with George Strait; during that June show, Strait had joined Jackson for performances of Designated Drinker and Murder on Music Row. Throughout that evening, the country music community and fans joined to celebrate Jackson s nearly 40 years of making country music hits. “If anybody’s living a really good dream … I’m living it,” Jackson said during that show. “I just want to thank everybody, especially all of you fans … y’all have been so supportive of my music all of these years … y’all always treated me nice and respected the music.” The concert s music will also be featured on Jackson s upcoming live album, The Last Show: One More for the Road The Finale (Live From Nashville ), which will release via MCA just before the broadcast. Alan Jackson: The Last Show is produced by Joan of Arc StudioWorks and EverWonder Studio, and directed by Sam Wrench.", "date_str": "2026-10-28T18:26:34+00:00", "hash": "eab6abb6669bbcc5", "title_fa": "اینجا زمانی است که «آلن جکسون: آخرین نمایش» روی صفحه‌های تلویزیون و پخش می‌شود", "summary_fa": "در 27 ژوئن، آلن جکسون، سالن مشاهیر موسیقی کانتری، استادیوم نیسان نشویل را فروخت، زیرا ده‌ها هزار طرفدار سالن را پر کردند و هزاران نفر دیگر در مرکز شهر برادوی برای تماشای پخش زنده آخرین کنسرت جکسون جمع شدند و دهه‌ها تأثیر خود را بر موسیقی کانتری جشن گرفت. او پیش از این پس از تشخیص بیماری شارکو ماری دندان از جاده بازنشسته شده بود، اما با آن آخرین نمایش در استادیوم نیسان نشویل در ماه ژوئن جشن گرفت. در دسامبر در 8، طرفدارانی که موفق به دیدن این برنامه نشدند، می‌توانند در این رویداد ویژه شرکت کنند، زمانی که NBC از ساعت 8 تا 10 شب، Alan Jackson: The Last Show را پخش می‌کند. ET/PT. این ویژه همچنین روز بعد در Peacock پخش خواهد شد. کنسرت مربوط به «آخرین تماس» آلن جکسون برای پخش به عنوان یک برنامه ویژه NBC راج کاپور - تهیه‌کننده اجرایی جوایز گرمی، اسکار، جوایز ACM 2026 - در جریان داغ او: من یکی از خوش‌شانس‌ترین افراد روی سیاره‌ام آلن جکسون هستم. که شامل آهنگ های کلاسیک او مانند Chattahoochee، Remember When و Its Five O Clock Somewhere است. جکسون همچنین ستارگان دیگر کشوری از جمله لوک برایان، اریک چرچ، لوک کامبز، رایلی گرین، کودی جانسون، میراندا لمبرت، لیتل بیگ تاون، جیک اوون، جان پردی، توماس رت، کری آندروود، لینی ویلسون، لی آن ووماک و آدام رایت را همراهی خواهند کرد. در پخش تلویزیونی کنسرت آتی نیز جکسون در همکاری ویژه با جورج استریت حضور خواهد داشت. در طول آن نمایش ژوئن، استریت برای اجرای برنامه‌های Designated Drinker و Murder on Music Row به جکسون پیوست. در سراسر آن شب، جامعه موسیقی کانتری و طرفداران به جشن نزدیک به 40 سال ساخت موسیقی کانتری توسط جکسون پیوستند. جکسون در آن برنامه گفت: \"اگر کسی رویای واقعاً خوبی دارد... من در حال زندگی آن هستم.\"", "image_url": "https://www.billboard.com/wp-content/uploads/2026/10/Alan-Jackson-Last-Show-CR-NBCUniversal-Billboard-1800.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["موسیقی"], "datetime_fa": "۶ آبان • ۲۱:۵۶"}, {"source": "Billboard", "title": "The 10 Best Songs to Celebrate Día de Muertos 2026: Chavela Vargas, Carlos Rivera & More", "link": "https://www.billboard.com/lists/dia-de-muertos-2026-best-songs-celebrate-day-of-the-dead/", "summary": "Music is an essential part of the Día de Muertos (Day of the Dead) celebration, a Mexican tradition that blends Indigenous roots with Christian customs from the Spanish colonial era and, according to historians, has evolved over time. It is one of the most beloved commemorations both within and beyond Mexico. Decorations like tissue paper with cut-out shapes, marigold flowers, sugar skulls, pan de muerto (Day of the Dead bread), water, candles and the favorite food and drinks of departed loved ones fill altars in homes and public spaces to honor and welcome them back for a few hours to the world of the living. According to this tradition, every Nov. 1st and 2nd — dedicated to children and adults, respectively —the living and the dead reunite as the latter return from Mictlán, the name given by ancient Mexicans to the underworld. In this celebration, death does not represent an absence but a living presence: a symbol of life that materializes in the altar, offered to those who are no longer with us. It is a colorful occasion with significant popular resonance, encompassing a wide range of meanings, from philosophical to material. From cumbia to rock, rancheras, huapango and pop, artists like Chavela Vargas, Natalia Lafourcade, Carlos Rivera, Vicente Fernández, Luis Ángel “El Flaco, Roco Pachukote, Silvana Estrada, Son Rompepera, Pehuenche and Renee Mooi have recorded songs exploring themes like absence, memories, love and hope, all of which deeply resonate with this popular celebration. Here are 10 of the best songs, both old and new, to celebrate this Día de Muertos with.", "date_str": "2026-10-28T18:16:54+00:00", "hash": "4c5909c2b265afdf", "title_fa": "10 بهترین آهنگ برای جشن گرفتن روز مردگان 2026: چاولا وارگاس، کارلوس ریورا و غیره", "summary_fa": "موسیقی بخش مهمی از جشن Día de Muertos (روز مردگان) است، یک سنت مکزیکی که ریشه های بومی را با آداب و رسوم مسیحی دوران استعمار اسپانیا در می آمیزد و به گفته مورخان، در طول زمان تکامل یافته است. این یکی از محبوب ترین یادبودها در داخل و خارج از مکزیک است. تزییناتی مانند دستمال کاغذی با اشکال بریده شده، گل همیشه بهار، جمجمه قندی، pan de muerto (روز مردگان)، آب، شمع ها و غذاها و نوشیدنی های مورد علاقه عزیزان درگذشته محراب خانه ها و فضاهای عمومی را پر می کند تا آنها را برای چند ساعت به دنیای زنده ها گرامی بدارند و از آنها استقبال کنند. طبق این سنت، هر نوامبر 1 و 2 - به ترتیب به کودکان و بزرگسالان اختصاص داده شده است - زنده ها و مرده ها با بازگشت دومی از Mictlán، نامی که مکزیکی های باستان به دنیای زیرین داده بودند، دوباره به هم می پیوندند. در این جشن، مرگ نشان‌دهنده یک غیبت نیست، بلکه یک حضور زنده است: نمادی از زندگی که در محراب تجلی می‌یابد، تقدیم به کسانی که دیگر با ما نیستند. این یک مناسبت رنگارنگ با طنین مردمی قابل توجه است که طیف گسترده ای از معانی، از فلسفی تا مادی را در بر می گیرد. از کامبیا گرفته تا راک، رانچراس، هواپانگو و پاپ، هنرمندانی مانند چاولا وارگاس، ناتالیا لافورکاد، کارلوس ریورا، ویسنته فرناندز، لوئیس آنجل «ال فلاکو، روکو پاچوکوته، سیلوانا استرادا، سون رومپپرا، پهونچه و رنه‌مو و غیبت‌های من را ضبط کرده‌اند. امید، که همه آنها عمیقاً با این جشن محبوب طنین انداز می شوند در اینجا 10 تا از بهترین آهنگ ها، اعم از قدیمی و جدید، برای جشن گرفتن این Día de Muertos آورده شده است. یکی از شناخته شده ترین آهنگ های رپرتوار سنتی مکزیک، این آهنگ از منطقه تنگه Tehuantepec در", "image_url": "https://www.billboard.com/wp-content/uploads/2026/10/dia-de-muertos-2025-billboard-1800.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["موسیقی"], "datetime_fa": "۶ آبان • ۲۱:۴۶"}, {"source": "Billboard", "title": "Drake Gets Surprise 40th Birthday Roast From Jeff Ross in Houston: ‘The F–king General’", "link": "https://www.billboard.com/music/rb-hip-hop/drake-birthday-jeff-ross-surprise-roast-1236369613/", "summary": "All Drake wanted for his 40th birthday was to be roasted by Jim Carrey, but he got the Roastmaster General, Jeff Ross, instead. Related Drake s Birthday Gifts Included a Signed Sade Poster Drake Reveals the Only Gift He Wants for His Upcoming 40th Birthday Drake Sings ‘I Want It That Way’ With Backstreet Boys at 40th Birthday Bash Drizzy spent the weekend celebrating his birthday in New York City, and he continued the party in Houston on Tuesday (Oct. 27), which included a surprise birthday roast courtesy of the New Jersey-bred comic. “Drake enjoying his surprise birthday roast in Houston tonight,” Ross captioned a selfie with the 6 God in an Instagram Story Wednesday, which he soundtracked with ICEMAN s National Treasures. The 6 God reposted the photo with Ross to his own Instagram Story, calling him The F king General. Clips from the roast king ribbing Drizzy haven t yet surfaced on social media. In September, Ross was put on the other side of his signature roasts as Jim Carrey ripped the comedian for his 61st birthday. “Canadian mountain man Jim Carrey sent me this for my birthday,” Ross wrote. “It made me so happy I had to share it with roast fans everywhere! EVERYONE PLEASE KEEP ROASTING ME IN THE COMMENTS BELOW ! ROASTING IS LOVE !” Drake saw the clip of Carrey jabbing Ross about how his mom had to sign an NDA when he was born because he was so ugly, and the rapper attempted to manifest having the legendary actor roast him for his own birthday. “Wow this is now all I want for my birthday,” Drizzy commented on IG at the time. While he didn t get Carrey, Ross made sure that the OVO rapper was properly roasted to kick off his 40s. Drake s birthday celebration began in Toronto and continued throughout the weekend in NYC . Drizzy rang in 40 with about 400 guests at Casa Cipriani in Manhattan, which included a surprise performance from the Backstreet Boys, as Drake joined the boy band on stage for its 1999 smash “ I Want It That Way .” “Tonight isn’t about a tour, an album release, or a bunch of videos we shot,” Drake told the room. “It’s about being alive, staying alive.” Many guests didn t leave empty-handed either, as designer gifts and cash prizes were raffled off. Drake has been busy throughout 2026, which included the release of his trifecta of albums in May. The 6 God made history as the first artist to occupy the top three slots of the Billboard 200 with ICEMAN , HABIBTI and MAID OF HONOUR simultaneously holding the No. 1, No. 2 and No. 3 spots on ", "date_str": "2026-10-28T18:14:47+00:00", "hash": "5bd291800c2b0179", "title_fa": "دریک کباب سورپرایز چهلمین تولد از جف راس در هیوستون دریافت می کند: «ژنرال اف کینگ»", "summary_fa": "تمام چیزی که دریک برای تولد 40 سالگی اش می خواست این بود که توسط جیم کری برشته شود، اما او به جای آن رئیس Roastmaster General، جف راس را دریافت کرد. هدایای مربوط به تولد دریک شامل یک پوستر ساد امضا شده است. دریک تنها هدیه ای را که برای تولد 40 سالگی خود می خواهد نشان می دهد. 27)، که شامل یک کباب تولد غافلگیرکننده از کمیک نیوجرسی بود. راس در یک استوری اینستاگرامی در چهارشنبه سوری عکس سلفی خود را با خدای ششم که موسیقی متن آن را با گنجینه ملی ICEMAN پخش کرد، نوشت: «دریک امشب در حال لذت بردن از کباب تولد غافلگیرکننده‌اش در هیوستون است. خدای 6 عکس را با راس در استوری اینستاگرام خودش بازنشر کرد و او را The F king General نامید. کلیپ هایی از شاه کباب در حال دنده های Drizzy هنوز در رسانه های اجتماعی ظاهر نشده است. در ماه سپتامبر، زمانی که جیم کری برای تولد 61 سالگی کمدین را پاره کرد، راس را در طرف دیگر کباب های امضای خود قرار دادند. راس نوشت: «جیم کری مرد کوهستانی کانادایی این را برای تولدم برایم فرستاد. \"این من را بسیار خوشحال کرد که مجبور شدم آن را با طرفداران کباب در همه جا به اشتراک بگذارم! لطفاً همه مرا در نظرات زیر کباب کنند! کباب کردن عشق است!» دریک این کلیپ را دید که کری به راس بداخلاق می‌زند و می‌گوید که چگونه مادرش هنگام تولد او مجبور به امضای NDA شد، زیرا او بسیار زشت بود، و رپر سعی کرد نشان دهد که بازیگر افسانه‌ای او را برای تولد خودش کباب کرده است. دریزی در آن زمان در IG اظهار نظر کرد: \"وای این تمام چیزی است که برای تولدم می خواهم.\" در حالی که او کری را دریافت نکرد، راس مطمئن شد که رپر OVO به", "image_url": "https://www.billboard.com/wp-content/uploads/2026/02/2089852875-e1770920504696.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["موسیقی"], "datetime_fa": "۶ آبان • ۲۱:۴۴"}, {"source": "Billboard", "title": "Camila Ramón, ANASOF, Kakush & More Emerging Latin Artists on Our Radar", "link": "https://www.billboard.com/music/latin/on-the-radar-emerging-artists-october-2026-latin-music-week-1236368988/", "summary": "Every month, Billboard Latin and Billboard Español editors spotlight a group of rising artists whose music we love. Think “diamantes en bruto,” or “diamonds in the rough.” These are newcomers who have yet to impact the mainstream — but whose music excites us, and who we believe our readers should make a point to discover. Our latest edition of On the Radar Latin includes a wave of emerging artists that we came across at the 2026 Billboard Latin Music Week in Miami, which took place Oct. 19-22 at the Faena Forum in Miami Beach. See our recommendations this month below: Name: ANASOF Country: Mexico Why They Should Be on Your Radar: This young singer-songwriter and multi-instrumentalist, born in Oaxaca, southern Mexico, stands out as one of the freshest and most innovative voices in the current Mexican pop scene. Her songs blend a diverse range of genres — including urban, pop, regional Mexican, alternative rock and even bolero — with lyrics that span from existential themes to tracks filled with humor and unexpected imagery. She is also an accomplished songwriter, having penned tracks for artists such as Adriel Favela, Camila Fernández and Mar Lucas. In 2025, she released Preciosa , her second studio album via Universal Music México, solidifying a sound that oscillates between delicacy and strength. Her hits include “Las Fotos de la Playa” and “SOY,” from her 2024 album TODO (y nada) . This year, she garnered international attention with her Spanish-language cover of “Dreams” — originally by the iconic Irish band The Cranberries — which was featured on a deluxe edition of their album Everybody Else Is Doing It, So Why Can’t We? Following the release of the romantic pop anthem “Tú, mi bb,” she dropped “Palomitas en la muela” earlier this month — a track that explores the chaos and profound unpredictability of being alive. She also performed at the Latin Billboard Music Week showcases, presented by peermusic at the Faena Theater, alongside ISADORA and Pututi Nesty. — NATALIA CANO Song for Your Playlist: Palomitas en la muela Name: Agustina TINNA Bruenner Country: Argentina Why They Should Be on Your Radar: You probably recognize Bruenner from Grupo Firme and Ricardo Arjona s Amor Fortuna music video, where she serves as the lead model. The video’s story revolves around her captivating blue-eyed gaze, her distinctive blonde hair, and a beauty that doesn’t go unnoticed, making her the center of attention. But she doesn’t just shine in front of the cameras: This ", "date_str": "2026-10-28T18:05:31+00:00", "hash": "2ca69e1b3e42b0e2", "title_fa": "Camila Ramón، ANASOF، Kakush و هنرمندان لاتین در حال ظهور بیشتر در رادار ما", "summary_fa": "هر ماه، ویراستاران Billboard Latin و Billboard Español گروهی از هنرمندان در حال ظهور را که موسیقی آنها را دوست داریم، مورد توجه قرار می دهند. به \"Diamantes en Bruto\" یا \"الماسهای درشت\" فکر کنید. اینها تازه واردانی هستند که هنوز بر جریان اصلی تأثیرگذار نبوده اند - اما موسیقی آنها ما را هیجان زده می کند و ما معتقدیم که خوانندگان ما باید به کشف آنها اشاره کنند. آخرین نسخه On the Radar Latin ما شامل موجی از هنرمندان نوظهور است که در هفته موسیقی لاتین بیلبورد 2026 در میامی، که در اکتبر برگزار شد، با آنها برخورد کردیم. 19-22 در انجمن Faena در ساحل میامی. توصیه‌های ما را در این ماه در زیر ببینید: نام: ANASOF کشور: مکزیک چرا باید در رادار شما باشند: این خواننده، ترانه‌سرا و نوازنده جوان، متولد اواکساکا، جنوب مکزیک، به عنوان یکی از تازه‌ترین و مبتکرترین صداها در صحنه کنونی پاپ مکزیک برجسته است. آهنگ‌های او طیف متنوعی از ژانرها - از جمله شهری، پاپ، منطقه‌ای مکزیکی، آلترناتیو راک و حتی بولرو - را با اشعاری که از مضامین وجودی گرفته تا آهنگ‌هایی پر از طنز و تصاویر غیرمنتظره را در بر می‌گیرد، ترکیب می‌کند. او همچنین یک ترانه سرای ماهر است و آهنگ هایی را برای هنرمندانی مانند آدریل فاولا، کامیلا فرناندز و مار لوکاس نوشته است. در سال 2025، او Preciosa، دومین آلبوم e pact was negotiated before the close of PTVS parent Paramount s merger with Warner [ ]", "date_str": "2026-10-28T18:30:43+00:00", "hash": "6a775b9ffff0d06a", "title_fa": "«Fear Not» و «How To Survive Without Me’s Bash Doran Inks Overall deal with Paramount Television Studios", "summary_fa": "اختصاصی: استودیوی تلویزیونی پارامونت یک قرارداد کلی انحصاری با نویسنده و نمایشنامه‌نویس تلویزیون، بش دوران (Fear Not, Beef) امضا کرده است تا از طریق Pete’s Uncle، شرکت او با شریک تهیه‌کننده Mallory Baysek، مجموعه‌های فیلم‌نامه‌ای اصلی را برای استودیو ایجاد، توسعه و تولید کند. این قرارداد قبل از پایان ادغام پارامونت مادر PTVS با وارنر انجام شد. انحصاری: استودیوی تلویزیونی پارامونت قرارداد کلی انحصاری را با نویسنده و نمایشنامه نویس تلویزیون، بش دوران ( Fear Not, Beef ) امضا کرده است تا از طریق شریک Petelo's Bay, Unsek، مجموعه فیلمنامه‌نویسی اصلی را برای استودیو ساخته، توسعه و تولید کند. مت تونل، رئیس استودیوی تلویزیونی پارامونت گفت: «بش یک داستان‌سرای چیره دست است که کارش جسورانه، جسورانه و منحصر به فرد است. او یک نیروی طبیعت است و ما مفتخریم که باش PTVS را به عنوان خانه خلاق خود انتخاب کرده است. ما نمی توانیم صبر کنیم تا با او بسازیم.\" در ددلاین تماشا کنید در یک بازار تلویزیون قراردادی، دوران طی یک سال گذشته سه چراغ سبز دریافت کرد، یک سفارش شش قسمتی مستقیم به سریال برای Fear Not at Paramount+ و پیکاپ‌های آزمایشی برای How To Survive Without Me در HBO Max و Foster Dade در Hulu. از دو خلبان که هر دو با همکاری برلانتی چگونه بدون من زنده بمانیم، به سریالی با سفارش 15 قسمتی رفتند. برلانتی با تهیه کنندگی اجرایی دوران در حال اجراست. دوران بریتانیایی‌الاصل همچنین Traitors را برای Channel 4 و Netflix ساخته و تهیه‌کننده اجرایی کرد، یکی از تهیه‌کنندگان اجرایی Hulu’s The Looming Tower، یک تهیه‌کننده مشاور در Netflixs Beef و نویسنده-تهیه‌کننده در NBCs Smash، Showtimes Masters of Sex و HBO Boardwalk Empire بود.", "image_url": "https://deadline.com/wp-content/uploads/2026/10/BashDoran.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["سینما", "نتفلیکس"], "datetime_fa": "۶ آبان • ۲۲:۰۰"}, {  Stone", "title": "The Beach Boys Canceled Another Show. A John Stamos Spinoff Group Is Taking Their Spot", "link": "https://www.rollingstone.com/music/music-news/beach-boys-pull-out-john-stamos-california-sound-1235649359/", "summary": "A new entity billing themselves as John Stamos and the California Sound have been formed to take the place of the Beach Boys at Disney World on November 11 and 12", "date_str": "2026-10-28T18:50:41+00:00", "hash": "03fc72743baabf35", "title_fa": "The Beach Boys یک نمایش دیگر را لغو کرد. یک گروه اسپین آف جان استاموس در جایگاه خود قرار دارد", "summary_fa": "یک نهاد جدید با نام جان استاموس و کالیفرنیا ساند تشکیل شده است تا در 11 و 12 نوامبر جای بیچ بویز را در دنیای دیزنی بگیرد. تنها کنسرت‌های باقی‌مانده آن‌ها در سال 2026 قرار بود در 11 و 12 نوامبر در Epcot Center در اورلاندو، فلوریدا، و 13 نوامبر در هتل و کازینو Hard Rock در بریستول، ویرجینیا برگزار شود. نمایش هارد راک فعلاً همچنان در دست انتشار است، اما مرکز اپکوت، بیچ بویز را با یک موجودیت جدید بدون موضوع صورتحساب به نام جان استاموس و صدای کالیفرنیا جایگزین کرده است. کالیفرنیا ساوند احتمالاً گروه بیچ بویز در حال تور منهای لاو هستند، اما تایید نشده است. یکی از سخنگویان بیچ بویز بلافاصله به درخواست اظهار نظر پاسخ نداد. قبل از نمایش نشویل، استاموس ادای احترامی احساسی به عشق در اینستاگرام منتشر کرد. او نوشت: مایک یک مبارز است. علیرغم اینکه پزشکان، خانواده و دوستان از او می خواهند تا روی سلامتی خود تمرکز کند، او اصرار دارد که روی صحنه باشد. او می‌گوید که به گروهش، تماشاگران، دوستانش و نوازنده‌اش که او را احاطه کرده‌اند، نیاز دارد تا او را بالا ببرند... امشب، در رایمن، که صحنه را با مایک به اشتراک می‌گذارم، می‌خواهم کاملاً حضور داشته باشم. هر هماهنگی، جوک آشنا و تشویق را بشنو..می خواهم هر ثانیه را بدون اینکه احساس کنم آن ثانیه ها از دست می روند، گرامی بدارم. این چیزی است که من به او می دهم. نمی دانیم فردا چه می آورد. اما امشب فرصت داریم جزئیات بیماری لاو علنی نشده است. اما او هفته گذشته پیامی خوش بینانه برای نیویورک تایمز فرستاد. او نوشت که تمام انرژی خود را صرف توانبخشی می کنم تا بتوانم ب ند. ناخاتار سینگ چاندی، رئیس جشنواره گفت: «الیویا وایلد با «دعوت» فیلمی ساخته است که هم کمدی و هم عمیقاً انسانی است. او علاوه بر کارگردانی، در کنار سه بازیگر جذاب امروزی بازی می‌کند: ست روگن، پنه‌لوپه کروز، و ادوارد نورتون. هر کدام از آنها چیزی غیرقابل جایگزین به این داستان می آورند و با هم چیزی را خلق کرده اند که مدت ها پس از پخش تیتراژ در بین مخاطبان باقی مانده است. ما خوشحالیم که این تیم باورنکردنی را با جایزه ونگارد امسال ارج می نهیم.\" «دعوت» با فیلمنامه‌ای از ویل مک کورمک و رشیدا جونز و اقتباس از فیلم اسپانیایی 2020 «مردم بالا»، وایلد و روگن را در نقش یک زوج متاهل ناکارآمد بازی می‌کند که همسایه‌های خود را با بازی کروز و نورتون برای شام دعوت می‌کنند. مارپیچ عصر به عنوان تنش روابط در آپارتمان سان فرانسیسکو آشکار می شود. دریافت کنندگان جایزه پیشتاز پیشین عبارتند از: «کتاب سبز»، «شکل آب»، «بلفاست»، «امیلیا پرز»، «همنت»، «قاتلان ماه گل»، «لا لا لند»، «خانم کوچک آفتاب»، «افسانه‌ها» و «محاکمه شیکاگو 7».", "image_url": "https://variety.com/wp-content/uploads/2026/01/The_Invite-Still_1.jpg?crop=0px%2C30px%2C1200px%2C675px&#038;resize=1000%2C563", "category": "هوش مصنوعی مولد", "tags": ["سینما"], "datetime_fa": "۶ آبان • ۲۰:۳۰"}, {"source": "Billboard", "title": "Cardi B Says Constant Jealousy From People in Her Inner Circle Is Making Her ‘Colder & Meaner’", "link": "https://www.billboard.com/music/music-news/cardi-b-jealousy-people-inner-circle-1236369644/", "summary": "Cardi B is reaching her limit with people in her circle trying to bring her down while she s up. The rapper did an Instagram Live on Tuesday (Oct. 27), according to Complex , and went off about how jealousy has caused tension around her. It s because I m at a new level in life, she said in a screen recording of the livestream. [But] I m still just me. Related Cardi B Says She s Done Beefing With Rap B hes : It s Kinda Boring Cardi B Attends KATSEYE’s New York Concert With Daughters Cardi B Reveals Her Pick for the Greatest Album of All Time That Every Woman Should Listen To Being successful, it is so scary, the rapper continued. Not even because you just don t know who s genuine anymore. You just don t know who got that secret animosity for you. And it s so crazy, because you could be cheering for somebody, you could be loving on somebody, and they don t want that. Cardi noted that she feels like she can t even discuss her accolades or business deals with certain individuals in her life for fear of stirring up resentment. It is so sad that b hes that you so f king close with will go out of their way to humble you, she said And it s so crazy because I don t feel depressed. I don t feel sad. I don t feel nothing, she added. I m starting to feel like I m becoming an evil villain. I feel like I m getting colder and meaner. This is what it means when they say it s lonely at the top I don t want to see a therapist. I want these motherf kers to die. The Grammy winner didn t get any more specific than that, but she did make sure to clarify that the negativity she s facing is coming from people she knows personally rather than the public. That said, Cardi did recently clap back at haters online who accused her of shortchanging other artists in her New York Times Style Magazine interview, in which she shouted out only a select few people when asked about her biggest inspirations. “I don’t even give a f k about these b hes anymore, said in an Oct. 21 chat on X Spaces. “To be honest with you, it’s like, I don’t even like beefing with rap b hes anymore, because it’s kinda boring … I feel like I’m outgrowing a lot of s t. Fans will have to wait and see if Cardi elaborates on either subject in future music releases, as the hip-hop star is just over a year out from the release of her Billboard 200 -topping sophomore album, Am I the Drama? Her most recent singles are AH HA, which arrived in August, and Don t Chart, which she dropped for Grand Theft Auto VI earlier in Octob", "date_str": "2026-10-28T17:54:55+00:00", "hash": "d1c33ecd01b078b3", "title_fa": "کاردی بی می‌گوید حسادت مداوم افراد در دایره درونی‌اش او را «سردتر و پست‌تر» می‌کند", "summary_fa": "کاردی بی با افرادی که در حلقه او هستند سعی می کنند او را در حالی که او بلند است پایین بیاورند، به حد مجاز خود می رسد. به گزارش Complex، این خواننده رپ روز سه‌شنبه (27 اکتبر) یک لایو اینستاگرامی انجام داد و درباره اینکه حسادت چگونه باعث ایجاد تنش در اطراف او شده است صحبت کرد. او در پخش زنده پخش زنده گفت، به این دلیل است که من در سطح جدیدی از زندگی هستم. [اما] من هنوز فقط من هستم. کاردی بی می گوید که با رپ B hes کارش را تمام کرده است: کاردی بی در کنسرت KATSEYE در نیویورک با دختران شرکت می کند کاردی بی انتخاب خود را برای بهترین آلبوم تمام دوران که هر زنی باید به موفقیت گوش دهد، بسیار ترسناک است، این خواننده رپ ادامه داد. حتی به این دلیل که دیگر نمی دانید چه کسی واقعی است. شما فقط نمی دانید چه کسی آن خصومت پنهانی را با شما داشته است. و این خیلی دیوانه است، زیرا شما می توانید برای کسی تشویق کنید، می توانید کسی را دوست داشته باشید، و آنها این را نمی خواهند. کاردی خاطرنشان کرد که احساس می کند از ترس برانگیختن خشم، حتی نمی تواند در مورد تمجیدها یا معاملات تجاری خود با افراد خاصی در زندگی خود صحبت کند. او گفت: خیلی غم انگیز است که این پادشاه نزدیک شما برای تحقیر شما تلاش می کنند و این بسیار دیوانه است زیرا من احساس افسردگی نمی کنم. من غمگین نیستم او اضافه کرد که من چیزی احساس نمی کنم. من دارم احساس می کنم دارم تبدیل به یک شرور شیطانی می شوم. احساس می کنم دارم سردتر و بدجنس تر می شوم. این همان معنایی است که می گویند در اوج تنهایی است من نمی خواهم به یک درمانگر مراجعه کنم. من می", "image_url": "https://www.billboard.com/wp-content/uploads/2026/10/P1186I3O-e1793205482563.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["موسیقی"], "datetime_fa": "۶ آبان • ۲۱:۲۴"}, {"source": "Billboard", "title": "Nick Jonas, Samara Joy, Rufus Wainwright & More Pay Tribute to Former Disney CEO Bob Iger at PAC NYC Icons of Culture Gala", "link": "https://www.billboard.com/pro/bob-iger-former-disney-ceo-honored-pac-nyc-icons-of-culture/", "summary": "“Bob believed in us in a way that we probably didn’t believe in ourselves,” Nick Jonas said of Bob Iger , former chairman and CEO of the Walt Disney Company, as Iger was named the 2026 PAC NYC Icon of Culture on Tuesday (Oct. 27) at the Perelman Performing Arts Center in New York City. Speaking on behalf of Joe and Kevin, his brothers and partners in the Jonas Brothers , Jonas praised Iger as “one of the finest cultivators of talent the industry has ever seen.” Music played a big part in the event, which began with six-time Grammy-winning recording artist Samara Joy ’s performances of “Stardust” and “Just in Time.” Rufus Wainwright closed the event with the iconic “When You Wish Upon a Star” from Disney’s Pinocchio , featuring Jiminy Cricket, before welcoming everyone back on stage for a final toast to Iger and PAC NYC. Related Miley Cyrus, Hilary Duff Demi Lovato Are Helping Disney Dominate 2026: This Class Is Just Unique In Music History Kenny MacPherson, Veteran Music Publisher and Big Deal Music Co-Founder, Dies at 71 Diddy Moved From New Jersey Prison to Similar Facility in Pennsylvania Reprising their roles of Alexander Hamilton and George Washington from the blockbuster Broadway musical Hamilton , Austin Scott and Isaiah Johnson performed “One Last Time,” which is also the title of Iger’s forthcoming memoir. A medley of performances of hits from the Disney vault included Bradley Gibson performing “Seize the Day” from Newsies , Anastascia McCleskey performing “This is Me” from The Greatest Showman , Adam Jacobs performing “Proud of Your Boy” from Aladdin and Charissa Hogeland performing “Let it Go” from Frozen . Mickey Mouse conducted the orchestra through a sweeping rendition of “Fantasmic!” while visuals celebrated Disney’s marquee franchises. Introducing Iger, Michael R. Bloomberg, chair of the board, PAC NYC, said, “As CEO of Disney, Bob took the company to new heights, with new ventures and expansions — and a historic run of global box office hits. … It’s fair to say: Few people have done more than Bob to shape American culture over the past 25 years — both here at home, and in the eyes of people all around the world.” Bloomberg was mayor of New York City from 2002-13. The show also included appearances and performances by Oscar winner Ariana DeBose , EGOT recipients Benj Pasek Justin Paul , ABC News heavyweights David Muir and Robin Roberts, and Josh D’Amaro, who succeeded Igor as CEO of the Walt Disney Company. Reflecting on his decades-long c", "date_str": "2026-10-28T17:21:11+00:00", "hash": "246307bb7b8a650f", "title_fa": "نیک جوناس، سامارا جوی، روفوس واینرایت و سایرین به باب ایگر، مدیرعامل سابق دیزنی در مراسم PAC NYC Icons of Culture Gala ادای احترام کردند.", "summary_fa": "نیک جوناس در مورد باب ایگر، رئیس و مدیر عامل سابق شرکت والت دیزنی، گفت: «باب به گونه‌ای به ما اعتقاد داشت که ما احتمالاً به خودمان اعتقاد نداشتیم. جوناس به نمایندگی از جو و کوین، برادران و شرکای او در برادران جوناس، ایگر را به عنوان \"یکی از بهترین پرورش دهندگان استعداد که صنعت تا به حال دیده است\" ستایش کرد. موسیقی نقش مهمی در این رویداد ایفا کرد، که با اجراهای «استارداست» و «درست به وقت»، خواننده برنده شش جایزه گرمی، سامارا جوی آغاز شد. روفوس وین رایت این رویداد را با نمایش نمادین \"When You Wish Upon a Star\" از پینوکیو از دیزنی، با حضور جیمینی کریکت، به پایان رساند، قبل از اینکه همه را به روی صحنه برگرداند تا آخرین نان تست برای ایگر و PAC NYC داشته باشد. مایلی سایرس، هیلاری داف دمی لواتو به تسلط دیزنی کمک می کنند 2026: این کلاس در تاریخ موسیقی منحصر به فرد است، کنی مک فرسون، ناشر کهنه کار موسیقی و یکی از بنیانگذاران Big Deal Music، در 71 سالگی درگذشت. موزیکال پرفروش برادوی همیلتون، آستین اسکات و آیزایا جانسون \"یک بار آخر\" را اجرا کردند که عنوان خاطرات آتی ایگر نیز هست. ترکیبی از اجراهای موفقیت آمیز طاق دیزنی شامل اجرای برادلی گیبسون با اجرای «روز را بگیر» از Newsies، آناستاسیا مک‌کلسکی اجرای «این من هستم» از فیلم The Greatest Showman، آدام جیکوبز اجرای «مفتخر به پسرت» از علاالدین و چاریسا هوگلند با اجرای «Let it Go» از Fro. میکی موس رهبری ارکستر را از طریق اجرای فراگیر \"Fantasmic!\" در حالی که جلوه‌های بصری فرنچایزهای خیمه شب بازی دیزنی را جشن می‌گرفتند. معرفی ایگر، مایکل آر. بلومبرگ، رئیس هیئت مدیره PAC NYC، گفت: \"باب به عنوان مدیرعامل دیزنی، شرکت را با سرمایه‌گذاری‌ها و توسعه‌های جدید - و موفقیت‌های تاریخی در باکس آفیس جهانی - به ارتفاعات جدیدی", "image_url": "https://www.billboard.com/wp-content/uploads/2026/10/KM_11707_wBiSyia2-e1793205384809.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["سینما", "موسیقی", "سرمایه‌گذاری"], "datetime_fa": "۶ آبان • ۲۰:۵۱"}, {"source": "Billboard", "title": "Unseen Letter From Brian Jones Inviting Charlie Watts to Join The Rolling Stones Up for Auction: ‘Our Current Drummer Is Atrocious!’", "link": "https://www.billboard.com/music/rock/brian-jones-letter-inviting-watts-join-rolling-stones-auction-1236369608/", "summary": "A previously unseen handwritten letter from late Rolling Stones guitarist and co-founder Brian Jones inviting drummer Charlie Watts to join the legendary group is up for auction. Addressed to Mr. C. Watts at his childhood home in Wembley, England, the letter was written in June 1962 and sent before the band formally adopted their name, just weeks before their first performance that July. “Few documents bring us as close to the formation of a legendary band as this letter, said auction house Sotheby s music and pop culture specialist Craig Inciardi in a press release announcing the sale. Written just weeks before The Rolling Stones first performance and months before Charlie Watts officially joined the group, it captures the excitement and ambition of a band on the cusp of history. It is an extraordinary first-hand record of Brian Jones s determination to recruit the drummer whose distinctive sound would help define The Rolling Stones for nearly six decades.” The letter provided by Watt s sister was in the family s possession for more than 60 years and it, along with the original envelope, will make their auction debut at Sotheby s New York s Rock Pop sale on Dec. 15 with an initial estimate between $70,000-$80,000. The friendly, cheeky missive from Jones — who was initially a creative engine of the band before drug and alcohol issues caused his firing in 1969 — opens with the friendly greeting, Dear Charlie, if you consider this letter rather impertinent, please excuse me According to Sotheby s, Jones then asks about Watts s work with Alexis Korner s Blues Incorporated band, which was one of the leading R B acts on the London scene at the time. He then makes his pitch. We are looking for a good drummer. Already we consider our band far better than Alex’s – we are getting a very tightly-knit sound, he wrote of the budding group, which at that point consisted of two guitars, harmonica, piano and drums, with plans to add a bassist, as well as a clear-eyed measure of their then-current timekeeper. Our current drummer is atrocious! Jones wrote to Watts, whose background was primarily in jazz, but who would go on to be the Stones drummer until his death in 2021 at age 80. Guitarist Keith Richards described the hard sell the band gave Watts in his 2010 autobiography, Life , in which he said he and his bandmates cut back on their eating to afford their preferred drummer. We starved ourselves to pay for him ! Literally. We went shoplifting to get Charlie Watts. We ", "date_str": "2026-10-28T17:18:07+00:00", "hash": "08ddb43c576593be", "title_fa": "نامه دیده نشده برایان جونز که از چارلی واتس برای پیوستن به رولینگ استونز برای حراج دعوت می کند: «درامر فعلی ما بی رحم است!»", "summary_fa": "نامه دست‌نویسی که قبلاً دیده نشده بود از گیتاریست و یکی از بنیانگذاران فقید رولینگ استونز برایان جونز که از چارلی واتس درامر دعوت می‌کرد تا به گروه افسانه‌ای بپیوندد، به حراج گذاشته شده است. این نامه خطاب به آقای سی واتس در خانه دوران کودکی اش در ومبلی، انگلستان، در ژوئن 1962 نوشته شد و قبل از اینکه گروه به طور رسمی نام خود را بپذیرد، ارسال شد، درست چند هفته قبل از اولین اجرای آنها در جولای. کریگ اینچیاردی، متخصص موسیقی و فرهنگ پاپ خانه حراج ساتبی در بیانیه‌ای مطبوعاتی که فروش آن را اعلام کرد، گفت: اسناد کمی ما را به شکل‌گیری یک گروه افسانه‌ای نزدیک می‌کند. این یک رکورد دست اول خارق العاده از عزم برایان جونز برای به خدمت گرفتن درامری است که صدای متمایزش می تواند به تعریف رولینگ استونز برای نزدیک به شش دهه کمک کند. نامه ارائه شده توسط خواهر وات برای بیش از 60 سال در اختیار خانواده بود و همراه با پاکت اصلی، اولین حراج خود را در حراج راک پاپ ساثبی نیویورک در 15 دسامبر با برآورد اولیه بین 70000 تا 80000 دلار انجام خواهد داد. پیام دوستانه و گستاخانه جونز - که در ابتدا موتور خلاق گروه بود قبل از اینکه مسائل مربوط به مواد مخدر و الکل باعث اخراج او در سال 1969 شود - با سلام دوستانه آغاز می شود، چارلی عزیز، اگر این نامه را تا حدی گستاخانه می دانی، لطفاً مرا ببخش. B در صحنه لندن در آن زمان بازی می کند. سپس زمین خود را می سازد. ما به دنبال یک درامر خوب هستیم. در حال حاضر ما گروه خود را بسیار بهتر از الکس می‌دانیم - او در مورد گروه نوظهور نوشت که در آن زمان از دو گیتار، سازدهنی، پیانو و درام تشکیل شده بود، با برنامه‌هایی برای اضافه کردن یک", "image_url": "https://www.billboard.com/wp-content/uploads/2026/10/1328931941-e1793204454448.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["موسیقی"], "datetime_fa": "۶ آبان • ۲۰:۴۸"}, {"source": "Billboard", "title": "U.K. Music Industry Praises Government’s Tax Relief for Venues, But Wants It to ‘Go Further’ With Extra Support", "link": "https://www.billboard.com/pro/uk-music-industry-autumn-budget-statement/", "summary": "The U.K. music industry has responded to the British government’s Autumn Budget statement, and called for it “to go further” with tax reliefs and implementation. Presented by John Healey, Chancellor of the Exchequer, on Wednesday (Oct. 28), the biannual statement sets out the government’s spending intentions and monetary planning over the coming months. Healey assumed the role of chancellor in August, following the ascension of Andy Burnham to prime minister in July. Healey was preceded in the role by Rachel Reeves, who held the title under the leadership of Sir Keir Starmer. Related Andy Burnham is the U.K. s New Prime Minister — Here s What the Music Industry Needs From Him Kenny MacPherson, Veteran Music Publisher and Big Deal Music Co-Founder, Dies at 71 Diddy Moved From New Jersey Prison to Similar Facility in Pennsylvania The statement was delivered in the Houses of Parliament and saw Healey unveil a raft of measures to ease the U.K.’s cost of living crisis and shield consumers from the rising price of gas and oil following President Donald Trump’s ongoing war in Iran. Earlier this year, Burnham announced that there would be a 20% cut in business rates for pubs, clubs and music venues, a move that could save premises £1,000 ($1,300) every year. The initiative was welcomed by industry figures, but many reported that costs and business rates have risen far higher than that number. The non-domestic and commercial properties tax in the U.K. bases its amount on the value of the property, and is payable to local councils. In his statement , Healey announced that the reduction had increased to 35% and would be made eligible to all venues under a rateable value of £1 million (£1.33 million). Elsewhere, businesses underneath the rateable value of £18,000 ($23,591) will not pay any business rates with Healey saying that “70,000 retail, hospitality and leisure (RHL) businesses pay no business rates at all” as a result. In a statement to Billboard U.K. , the Music Venue Trust’s campaigns and communications manager Toni-Coe Brooker , said these were “positive steps toward easing the financial pressure on grassroots music venues.” Related U.K. Government Announces Expansive Music Growth Package With $60M Promised to Help ‘Strengthen’ Sector She added, “Every pound saved on business rates is a pound that can help keep a venue open, support jobs and sustain opportunities for artists and audiences. The details of implementation will be crucial. Grassroots music venue", "date_str": "2026-10-28T17:04:03+00:00", "hash": "e83af278f6847bfd", "title_fa": "صنعت موسیقی بریتانیا از تخفیف مالیاتی دولت برای سالن‌ها ستایش می‌کند، اما می‌خواهد با حمایت بیشتر «به پیش برود»", "summary_fa": "صنعت موسیقی بریتانیا به بیانیه بودجه پاییز دولت بریتانیا پاسخ داده است و از آن خواسته است تا با تخفیف های مالیاتی و اجرای آن \"بیشتر پیش برود\". بیانیه دوسالانه که توسط جان هیلی، وزیر دارایی، در روز چهارشنبه (28 اکتبر) ارائه شد، اهداف هزینه و برنامه‌ریزی پولی دولت در ماه‌های آینده را مشخص می‌کند. هیلی در ماه اوت و پس از صعود اندی برنهام به نخست وزیری در ماه ژوئیه، سمت صدراعظم را بر عهده گرفت. پیش از هیلی، ریچل ریوز، که این عنوان را تحت رهبری سر کیر استارمر به عهده داشت، این نقش را ایفا کرد. مرتبط اندی برنهام بریتانیا است. نخست‌وزیر جدید — اینجا چیزی است که صنعت موسیقی از او نیاز دارد، کنی مک‌فرسون، ناشر کهنه‌کار موسیقی و یکی از بنیان‌گذاران Big Deal Music، در ۷۱ سالگی درگذشت. و از مصرف کنندگان در برابر افزایش قیمت گاز و نفت پس از جنگ مداوم دونالد ترامپ در ایران محافظت می کند. اوایل امسال، برنهام اعلام کرد که نرخ‌های تجاری برای میخانه‌ها، کلوپ‌ها و مکان‌های موسیقی 20 درصد کاهش می‌یابد، اقدامی که می‌تواند سالانه 1000 پوند (1300 دلار) در محل صرفه‌جویی کند. این ابتکار مورد استقبال چهره‌های صنعت قرار گرفت، اما بسیاری گزارش دادند که هزینه‌ها و نرخ‌های تجاری بسیار بیشتر از این رقم افزایش یافته است. مالیات بر املاک غیر خانگی و تجاری در بریتانیا بر اساس ارزش ملک است و به شوراهای محلی قابل پرداخت است. هیلی در بیانیه خود اعلام کرد که این کاهش به 35 درصد افزایش یافته است و برای همه مکان ها با ارزش قابل نرخ 1 میلیون پوند (1.33 میلیون پوند) واجد شرایط خواهد بود. در جاهای دیگر، کسب‌وکارهای زیر ارزش نرخ‌پذیر 18000 پوند (23591 دلار) هیچ نرخ تجاری نمی‌پردازند و هیلی می‌گوید که «70000 کسب‌وکار خرده‌فروشی، مهمان‌نوازی و اوقات فراغت (RHL) اصلاً نرخ تجاری نمی‌پردازند». در بیانیه ای برای", "image_url": "https://www.billboard.com/wp-content/uploads/2026/10/john-healy-2026-billboard-1800.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["موسیقی"], "datetime_fa": "۶ آبان • ۲۰:۳۴"}, {"source": "Deadline", "title": "85 South Media Inks Tubi Distribution Deal, Including Curated Collection Of ‘The Best Of The 85 South Show’", "link": "https://deadline.com/2026/10/85-south-tubi-distribution-deal-1237207194/", "summary": "EXCLUSIVE: 85 South Media, the Atlanta-native independent media and entertainment company responsible for The 85 South Show, is deepening its business with Tubi. As the media brand looks to scale its creator-led content business, it has inked a distribution deal with the platform. A curated collection of 10 episodes of The 85 South Show will [ ]", "date_str": "2026-10-28T18:00:00+00:00", "hash": "c1dc7293052b62ce", "title_fa": "قرارداد توزیع 85 جوهر رسانه جنوبی توبی، شامل مجموعه انتخاب شده «بهترین نمایش 85 جنوبی»", "summary_fa": "انحصاری: 85 South Media، شرکت رسانه ای و سرگرمی مستقل بومی آتلانتا که مسئول The 85 South Show است، در حال تعمیق تجارت خود با Tubi است. از آنجایی که این برند رسانه ای به دنبال توسعه کسب و کار محتوای تحت رهبری سازنده خود است، یک قرارداد توزیع با این پلتفرم امضا کرده است. مجموعه‌ای از 10 قسمت از نمایش 85 جنوبی [ ] که حول سه گانه بالا ساخته شده است، نمایش 85 جنوبی از یک پادکست کمدی مستقل به یک فرنچایز تبدیل شده است. تا به امروز، این سریال بیش از 750 میلیون بازدید در یوتیوب به دست آورده است و بیش از 2.56 میلیون مخاطب ایجاد کرده است. Chad Oubre، مدیرعامل و یکی از بنیانگذاران 85 South Media، در بیانیه‌ای به ددلاین گفت: «85 South با یک تیم کوچک، چند میکروفون و یک باور مشترک که می‌توانیم چیزی از خودمان بسازیم شروع شد. این بیانیه ادامه می‌دهد: «بزرگ شدن آن به یک تجارت رسانه‌ای کامل که شامل برنامه‌نویسی، تور، استعداد و توزیع اصلی است، چیزی است که ما به آن افتخار می‌کنیم. هدف همیشه رشد آنچه ساخته‌ایم و در عین حال ایجاد فرصت‌های واقعی برای صداها و ایده‌های جدید بوده است. گسترش توزیع ما با Tubi گام دیگری در این سفر است که به ما امکان می‌دهد به مخاطبان جدیدی دست یابیم و در عین حال به ساختن مستقل و در کنار شرکایی که به آنچه ما می‌سازیم اعتقاد دارند ادامه دهیم.» آخرین راه اندازی Tubi نشان دهنده گسترش روابط موجود بین 85 South و استریمر است. در اکتبر 2025، توبی یک فهرست محتوای انحصاری را با بازوی تولید کوین هارت، Hartbeat، ک mmary": "Following its theatrical release, film and soundtrack versions of Back to the Beginning will be available on DVD, Blu-ray, CD, and vinyl with special bonus material", "date_str": "2026-10-28T16:52:33+00:00", "hash": "ec721311e5e13c08", "title_fa": "کنسرت Last Black Sabbath آزی آزبورن در وینیل در دسترس خواهد بود", "summary_fa": "پس از اکران در سینما، نسخه‌های فیلم و موسیقی متن بازگشت به آغاز به صورت دی‌وی‌دی، بلوری، سی‌دی، و وینیل همراه با مواد جایزه ویژه در دسترس خواهد بود. هنگامی که آزی آزبورن در ۲۲ ژوئیه ۲۰۲۵ درگذشت، دنیای موسیقی در غم از دست دادن یک هنرمند تعیین‌کننده نسل و پیشگام تعیین‌کننده هوی متال سوگوار شد. اما 17 روز قبل از آن، طرفداران، عزیزان و بزرگترین همکاران آزبورن برای یک کنسرت خداحافظی پر ستاره و بسیار احساسی ملاقات کردند. بیش از 44000 هوادار در زادگاه آزبورن، بیرمنگام، انگلستان، جمع شدند و گروه هایی مانند متالیکا، ماستودون، قاتل، و گانز ان رزز را تماشا کردند که در استادیوم ویلا پارک با آزبورن وداع کردند. همچنین آخرین اجرای آزبورن، یک لحظه انفرادی تلخ و شیرین و اتحاد مجدد ترکیب اصلی Black Sabbath بود که برای اولین بار پس از 20 سال با هم بازی کردند. این رویداد 10 ساعته تبدیل به کنسرت دو ساعته Ozzy Osbourne Black Sabbath: Back to the Beginning شد که امروز در سینماها اکران شد. آنهایی که بلیت ندارند - یا طرفدارانی که ناامید هستند که دوباره کنسرت را زنده کنند - لازم نیست نگران باشند. استودیوی مرکوری روز چهارشنبه اعلام کرد که نسخه کامل فیلم و موسیقی متن بازگشت به آغاز به صورت دیجیتالی و فیزیکی در 11 دسامبر در دسترس خواهد بود، از جمله 4K Ultra HD، Blu-ray، CD و وینیل. نسخه‌های فیزیکی فیلم شامل تصاویر پشت صحنه رویداد و ادای احترام ویدیویی از دالی پارتون و AC/DC خواهد بود. می‌توانید نسخه‌ها را از اینجا پیش‌سفارش کنید. داستان‌های پرطرفدار چگونه ملانی سی یاد گرفت که از ادویه‌های ورزشی تاریخی برایان جونز استقبال کند. نامه دعوت از چارلی واتس برای پیوستن به رولینگ استونز در سال 1962، آنیکا نیلز را در سفر عجله‌اش در سرفیس‌ها نشان می‌دهد: «من خودمی ندارم، بنابراین آنچه را که لازم است بازی", "image_url": "https://www.rollingstone.com/wp-content/uploads/2026/  و آنها را با نمادهایی مانند تاج جورجیا G و OutKast تزئین کنند. جان تیتز، مدیر خلاقیت Class Trip، در نسخه‌ای می‌گوید: «ما می‌خواستیم چیزی به اندازه موسیقی آنها بی‌انتها خلق کنیم. \"به ویدیوی رز فکر کنید. آندره و بیگ بوی، دو خدمه، دو سبک کاملاً متفاوت، یک مدرسه. یین و یانگ. هر قطعه باید احساس می کرد که درست از آن راهرو بیرون می", "image_url": "https://www.rollingstone.com/wp-content/uploads/2026/10/outkast-u-collection-1.jpg?w=1600&#038;h=900&#038;crop=1", "category": "هوش مصنوعی مولد", "tags": ["موسیقی"], "datetime_fa": "۶ آبان • ۲۰:۱۴"}, {"source": "Rolling Stone", "title": "‘Sunrise on the Reaping’ Reunites Jennifer Lawrence With Woody Harrelson: ‘So Emotional’", "link": "https://www.rollingstone.com/tv-movies/tv-movie-news/jennifer-lawrence-reunion-josh-hutcherson-woody-harrelson-1235649193/", "summary": "For the first time in over a decade, Lawrence fell back into step alongside Josh Hutcherson and Harrelson on the set of new Hunger Games movie", "date_str": "2026-10-28T16:21:35+00:00", "hash": "c0bf0db09cf4b14b", "title_fa": "«طلوع خورشید در درو» جنیفر لارنس را با وودی هارلسون دوباره متحد می‌کند: «خیلی احساسی»", "summary_fa": "برای اولین بار در بیش از یک دهه، لارنس در کنار جاش هاچرسون و هارلسون در سر صحنه فیلم جدید بازی‌های گرسنگی بازگشت به صحنه در نقش کتنیس اوردین برای بازی‌های گرسنگی: طلوع آفتاب در درو با موجی از نوستالژی جنیفر لارنس را تحت تاثیر قرار داد. برای اولین بار در بیش از یک دهه، لارنس در کنار جاش هاچرسون و وودی هارلسون، بازیگر زن در جریان حضور اخیر در پادکست باباش را صدا کن. \"این خیلی دیوانه کننده بود. همان خدمه بود. لارنس گفت، این همان AD بود که میلیون ها بار با او کار کردم زیرا او را دوست دارم. و با جاش و وودی... خیلی احساسی بود. من و جاش بدون اینکه دستان همدیگر را گرفته بودیم به سمت حمام نرفتیم. خیلی زیبا بود سال گذشته، به طور گسترده گزارش شد که لارنس دوباره نقش خود را برای Sunrise on the Reaping، ششمین فیلم از سری بازی‌های Hunger بازی خواهد کرد که قرار است در 20 نوامبر اکران شود و هاچرسون نیز در نقش Peeta Mellark بازخواهد گشت. با این حال، چیزی که در آن زمان مورد توجه قرار نگرفت، مشارکت هارلسون در این فیلم بود که بر داستان اصلی شخصیت او، هایمیچ آبرناتی تمرکز دارد. لارنس گفت و واضح است که وودی بدون دعوت از پنجره اتاق هتل من وارد شد. اگر او به مرزها گوش می داد یا از در استفاده می کرد، یکسان نمی شد.\" صدای هارلسون در یک تیزر اولیه برای Sunrise on the Reaping ظاهر شد که در آن لوگوی رسمی فیلم فاش شد. او در پیش نمایش گفت، فکر می کنم این بازی ها متفاوت خواهند بود. طرفداران حدس می زدند که این بازیگر ممکن است به عنوان راوی فیلم بازگردد. جوزف زادا بازیگر ۲۱ ساله در نقش آبرناتی در کنار مککنا گریس که نقش میسیلی دانر را بازی می‌کند، Sunrise", "image_url": "https://www.rollingstone.com/wp-content/uploads/2026/10/woody-jlaw.jpg?crop=0px%2C14px%2C1800px%2C1014px&#038;resize=1600%2C900", "category": "هوش مصنوعی مولد", "tags": ["سینما"], "datetime_fa": "۶ آبان • ۱۹:۵۱"}, {"source": "Hollywood Reporter", "title": "‘The Invite’ to Receive Vanguard Award at Palm Springs International Film Festival", "link": "https://www.hollywoodreporter.com/movies/movie-news/invite-vanguard-award-palm-springs-film-festival-1236741160/", "summary": "Confirmed to attend the ceremony are Olivia Wilde, Seth Rogen, Edward Norton and Penélope Cruz.", "date_str": "2026-10-28T17:00:00+00:00", "hash": "cd910f48a9d68195", "title_fa": "«دعوت» برای دریافت جایزه پیشتاز در جشنواره بین‌المللی فیلم پالم اسپرینگز", "summary_fa": "حضور اولیویا وایلد، ست روگن، ادوارد نورتون و پنه لوپه کروز تایید شده است. جوایز بین‌المللی فیلم پالم اسپرینگز روز چهارشنبه اعلام کرد، The Invite ساخته اولیویا وایلد جایزه پیشتاز جشنواره بین‌المللی فیلم پالم اسپرینگز را دریافت خواهد کرد. به گفته این سازمان، جایزه پیشتاز یک افتخار گروهی است که بازیگران و کارگردان یک فیلم را به خاطر کار جمعی آنها در یک پروژه سینمایی استثنایی متمایز می کند. برای دریافت جایزه، حضور کارگردان و بازیگر وایلد و بازیگران ست روگن، پنه لوپه کروز و ادوارد نورتون تایید شده است. جوایز فیلم در 7 ژانویه 2027 در مرکز همایش پالم اسپرینگز برگزار می شود و جشنواره از 7 تا 18 ژانویه برگزار می شود. داستان‌های مرتبط فیلم‌ها اری، اعضای خدمه که زمانی که من برهنگی انجام می دادم تایید نشده بودند، [آنها] سر صحنه فیلمبرداری بودند. و من به سختی به این موضوع توجه کردم، زیرا اگر ما آن نوع اصول را در سطحی که در حال حاضر انجامش می‌دهیم تنظیم نکنیم، پس برای یک نوجوان ناشناس 18 ساله چه اتفاقی می‌افتد؟ داستان‌های مرتبط کسب و کار جنیفر لارنس به اینستاگرام می‌پیوندد، اگر طرفداران چیزی منفی بگویند، تهدید می‌کند که از آن خارج می‌شود. یا اجازه می دهم این افرادی که با آنها راحت نیستم مرا برهنه ببینند؟ لارنس نتیجه گرفت: بنابراین برای من مهم بود که به مردم توضیح بدهم که چرا خوب نیست. حکایت لارنس شبیه وضعیتی است که اسمه بیانکو بازیگر سریال Game of Thrones در حین فیلمبرداری فصل اول سریال با آن مواجه شد. او در کتاب آتش نمی تواند اژدها را بکشد به یاد می آورد که قرار بود این مجموعه بسته باشد. به پشت سرم نگاه می‌کنم و سه نفر هستند که همگی یک پرچم را روی چراغ نگه داشته‌اند. من برهنه ام بیانکو گفت که او نیز به همین ترتیب برای خودش گیر کرده است. [گفتم]، یک ثانیه صبر کن. از چه زمانی باید سه نفر آن را نگه دارند؟ آنها باید ترک کنند!", "image_url": "https://www.hollywoodreporter.com/wp-content/uploads/2025/11/GettyImages-2244551096-1.jpg?w=1296&#038;h=730&#038;crop=1", "category": "هوش مصنوعی مولد", "tags": ["Apple", "سینما"], "datetime_fa": "۶ آبان • ۲۰:۰۵"}, {"source": "Hollywood Reporter", "title": "Emma Corrin, Jack Lowden and Olivia Colman Star in Trailer for Netflix’s ‘Pride and Prejudice’ Adaptation", "link": "https://www.hollywoodreporter.com/tv/tv-news/netlix-pride-and-prejudice-trailer-emma-corrin-jack-lowden-1236741806/", "summary": "Based on the Jane Austen classic, the streamer's take on the well-adapted story is written and executive produced by Dolly Alderton.", "date_str": "2026-10-28T16:18:54+00:00", "hash": "e341661688bfbee0", "title_fa": "اما کورین، جک لودن و اولیویا کولمن در تریلر اقتباسی «غرور و تعصب» نتفلیکس بازی می‌کنند.", "summary_fa": "بر اساس داستان کلاسیک جین آستن، برداشت پخش کننده از داستان اقتباس شده توسط دالی آلدرتون نوشته و تهیه کننده اجرایی است. الیزابت بنت و آقای دارسی در تریلر رسمی اقتب کت Warner Bros. Discovery انجام دادند تشکر کرد و گفت که کار شما برای انجام این معامله ضروری است. او همچنین به برادران وارنر قدیمی فریاد زد. تیم مالی Discovery، نوشت که شما عملکرد کسب و کار را در مدت طولانی بدون اطلاع از پایان آن حفظ کردید. این امر مستلزم نظم و انضباط است و مورد توجه قرار نگرفت. او ادامه داد، همانطور که دیوید [الیسون] می گوید، هدف ما تبدیل شدن به نسل بعدی شرکت رسانه ای و سرگرمی است. ما تنها در صورتی به آن خواهیم رسید که امور مالی در بالاترین سطح کار کند و به پیشبرد کسب و کار کمک کند. هر تصمیم چراغ سبز، سرمایه گذاری در فناوری،", "image_url": "", "category": "هوش مصنوعی مولد", "tags": ["رسانه", "هنر"], "datetime_fa": "۶ آبان • ۲۰:۱۳"}, {"source": "Variety", "title": "Kathleen Kennedy to Lead LA Olympics Opening and Closing Ceremonies After ‘Star Wars’ Exit, Replacing Peter Rice", "link": "https://variety.com/2026/film/news/kathleen-kennedy-la-olympics-ceremonies-peter-rice-1236933433/", "summary": "Kathleen Kennedy, the former head of Lucasfilm, has been tapped as head of ceremonies and content for the 2028 Los Angeles Olympics. She s replacing Peter Rice, who was hired as Netflix s chief content officer earlier this week and took over for Bela Bajaria. He will remain involved with the LA28 Games as executive producer, as [ ]", "date_str": "2026-10-28T16:18:56+00:00", "hash": "5e2982a5959300de", "title_fa": "کاتلین کندی پس از خروج از «جنگ ستارگان» به جای پیتر رایس، مراسم افتتاحیه و اختتامیه المپیک لس آنجلس را رهبری خواهد کرد.", "summary_fa": "کاتلین کندی، رئیس سابق لوکاس فیلم، به عنوان مسئول تشریفات و محتوای المپیک 2028 لس آنجلس انتخاب شد. او جایگزین پیتر رایس می شود که اوایل این هفته به عنوان مدیر محتوای نتفلیکس استخدام شد و مسئولیت بلا باجاریا را بر عهده گرفت. او همچنان با بازی‌های LA28 به عنوان تهیه‌کننده اجرایی درگیر خواهد بود، زیرا [] کاتلین کندی، رئیس سابق لوکاس‌فیلم، به‌عنوان مسئول تشریفات و محتوا برای المپیک 2028 لس‌آنجلس انتخاب شده است. کندی در نقش خود تحویل هر چهار مراسم از جمله افتتاحیه المپیک در 14 جولای 2028 و بسته شدن در 30 جولای و همچنین افتتاحیه پارالمپیک در 15 آگوست و بسته شدن در 27 اوت را هدایت خواهد کرد. داستان‌های مرتبط شیرین کاری‌های Zero-G رایان گاسلینگ در پروژه «Hil Mary» توسط ناظران VFX Space Epic شکسته شد. مجموعه‌های نوت بوک موزیکال وست اند اجرا می‌شود که به تازگی تغییر نام داده شده است. او گفت، وقتی ستاره‌ها برای جلب توجه جهان به لس‌آنجلس برای بازی‌های المپیک و پارالمپیک 2028 هماهنگ می‌شوند، نمی‌توانم کسی را بهتر از کاتلین برای تجسم جادوی هالیوود به ذهنم بیاورم. کندی المپیک را به عنوان یک سنگ محک در زندگی من توصیف کرد و از بازی ها به عنوان یکی از تجربیات متحد کننده بزرگی که ما به اشتراک می گذاریم یاد کرد. کندی گفت که کیسی واسرمن دیدگاه جسورانه ای در مورد معنای این بازی ها برای لس آنجلس و جهان دارد و من بسیار هیجان زده هستم که او از من خواسته است تا به آن کمک کنم تا آن را زنده کنم. من و همسرم، فرانک مارشال، تقریباً در هر بازی از زمان لس آنجلس در سال 1984 شرکت کرده‌ایم، و ورزش یکی از بهترین تجربیات متحد کننده ماست. پیتر رایس پایه و اساس فوق‌العاده‌ای گذاشته است و من نمی‌توانم صبر کنم تا با بن وینستون، مدیر خلاق ما", "image_url": "https://variety.com/wp-content/uploads/2017/11/kathleen-kennedy1.jpg?w=1000&#038;h=563&#038;crop=1", "category": "هوش مصنوعی مولد", "tags": ["سینما", "نتفلیکس"], "datetime_fa": "۶ آبان • ۱۹:۴۸"}, {"source": "Variety", "title": "John Carpenter to Receive Filmmaker of the Year at ACE Eddie Awards", "link": "https://variety.com/2026/awards/news/john-carpenter-ace-eddie-awards-filmmaker-of-the-year-1236932593/", "summary": "Filmmaker, screenwriter, producer and composer John Carpenter will receive the American Cinema Editors (ACE) Golden Eddie Filmmaker of the Year award at the 77th annual ACE Eddie Awards. Editors Bonnie Koehler and Christopher Nelson will also receive ACE Career Achievement awards during the ceremony, which recognizes the best film editing achievements of the year across [ ]", "date_str": "2026-10-28T16:00:00+00:00", "hash": "61b76058723ceea0", "title_fa": "جان کارپنتر بهترین فیلمساز سال در جوایز ACE Eddie را دریافت کرد", "summary_fa": "جان کارپنتر، فیلم‌ساز، فیلم‌نامه‌نویس، تهیه‌کننده و آهنگ‌ساز، جایزه بهترین فیلم‌ساز سال طلایی ادی سردبیران سینمای آمریکا (ACE) را در هفتاد و هفتمین دوره جوایز سالانه ACE Eddie دریافت خواهد کرد. تدوینگران بانی کوهلر و کریستوفر نلسون نیز در طول این مراسم جوایز دستاورد شغلی ACE را دریافت خواهند کرد که بهترین دستاوردهای تدوین فیلم در سال را به رسمیت می‌شناسد [ ] کارپنتر تا حد زیادی در سال 1978 با «هالووین» به مخاطبان معرفی شد و از آن زمان به شکل‌گیری ژانر ترسناک مدرن که شامل «محوطه‌های کارگردانی» می‌شود، ادامه داد. از نیویورک و آنها زندگی می کنند. او \"موضوعات گمشده\" را در سال 2014 و همچنین \"کلیسای جامع\" را در اوایل امسال آهنگسازی کرد. سابرینا پلیسکو، رئیس ACE، گفت: جان کارپنتر فیلم هایی می سازد که زیر پوست شما فرو می روند و در آنجا می مانند. «هالووین»، «چیز»، «فرار از نیویورک» - این فیلم‌ها باعث ترس، هیجان و شکل‌دهی نسل‌های مخاطبان و فیلم‌سازان شده‌اند. تعداد کمی از کارگردانان ریتم، تنش و خویشتن داری را به شیوه او درک می کنند و او همیشه به سردبیرانش اعتماد کرده است تا به او کمک کنند تا آن را پیدا کند. این همکاری دقیقاً همان چیزی است که این افتخار جشن می گیرد. کارپنتر به جمع برندگان سابق می پیوندد که شامل جان ام چو، جان واترز، اسپایک لی، کوئنتین تارانتینو، کریستوفر نولان، لورن شولر دانر، گیرمو دل تورو، استیون اسپیلبرگ، وینس گیلیگان، جی.جی. آبرامز، نانسی مایرز، مارتین اسکورسیزی، جورج لوکاس و موسسه ساندنس. کولر در طول بیش از 40 سال فعالیت حرفه ای خود، 15 فیلم بلند، 9 سریال تلویزیونی پربیننده و هشت فیلم هفته را تدوین کرد. از آثار او می توان به «یک پرواز بر فراز آشیانه فاخته»، «امپراتوری پاسخ می دهد»، «بازگشت جدی»، «پلترگیست»، «نظام قانون: واحد قربانیان ویژه» و «ال. قانون.”", "image_url": "https://variety.com/wp-content/uploads/2023/01/John-Carpenter-Variety-Ferature-Story-16x9-2.jpg?w=1000&#038;h=563&#038;crop=1", "category": "هوش مصنوعی مولد", "tags": ["سینما", "موسیقی"], "datetime_fa": "۶ آبان • ۱۹:۳۰"}, {"source": "Billboard", "title": "NFL Boss Roger Goodell Says ‘It Was Clear’ Jay-Z Wanted Super Bowl Halftime Show: ‘He’s Already Got His Vision’", "link": "https://www.billboard.com/music/rb-hip-hop/roger-goodell-jay-z-wanted-super-bowl-halftime-show-1236369541/", "summary": "Jay-Z was announced as the official Super Bowl LXI Halftime Show headlining performer earlier this week, but NFL commissioner Roger Goodell has long believed that Hov s day on the Super Bowl stage would come. Related The Dream Guest Lineup for Jay-Z s Super Bowl LXI Halftime Show Jay-Z s Super Bowl LXI Halftime Show: Our Dream Setlist Jason Kelce Is Fired Up For Jay-Z s Super Bowl LXI Halftime Show: He is the GOAT Goodell joined Apple Music s The Ebro Show for an interview with Ebro Darden and Eddie Francis on Tuesday (Oct. 27), during which he shed some light on the timing being right for Jay-Z to be the halftime show choice for February 2027 in Los Angeles. We’ve always wanted this to happen at some point. It was something I asked him about at the time when we first started this, and he said, Yeah, we’ll see. Let’s see what happens. But it was clear he wanted it to happen, Goodell explained. We’ve talked about it a couple of times. The commissioner continued: I think the fact that he’s in his 30th anniversary year of his first album, he just finished his tour, it’s L.A., he’s at that point as the GOAT that he’s ready for it. He was pretty clear: I wanna do it this year. I guess I was more excited than anything, maybe a little surprised, because he keeps putting it off a little bit. Hov and Roc Nation have served as the league s live music entertainment strategist since 2019. They re-upped in 2024 to extend their partnership, which has brought the likes of Rihanna , The Weeknd, Kendrick Lamar, Usher , Bad Bunny, Dr. Dre and Snoop Dogg to the Super Bowl stage. But I think he’s already got his vision; he already understands what he wants to do, Goodell added of Jay s plan. He’s been so remarkable in helping us elevate the whole Super Bowl Halftime Show. He’s a genius, and not just a creative genius in a musical sense. His business sense, his sense of timing, his sense
