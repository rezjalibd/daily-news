      media: [{"source": "Billboard", "title": "Nicki Minaj Calls NY Gov. Kathy Hochul ‘Evil Woman’ Who ‘Will Not Escape God’s Wrath’ — See Hochul’s Response", "link": "https://www.billboard.com/music/music-news/nicki-minaj-ny-gov-kathy-hochul-evil-woman-hochul-responds-1236370253/", "summary": "Nicki Minaj is facing backlash for her comments about New York s Gov. Kathy Hochul, whom she called evil in a rant on X on Wednesday night (Oct. 28). Related Donald Trump Praises Nicki Minaj s Beautiful A at Michigan Rally: That s Hard to Miss Nicki Minaj Enjoys Air Force One Trip After Trump Staffer Suggests She Take Over Press Secretary Role Nicki Minaj Says She s Not Going Anywhere After Donald Trump Calls Her His Favorite : She s Been With Me a Long Time The rapper began with a characteristically blunt post weighing in on her home state s fast-approaching gubernatorial race, writing , Kathy Hochul is an evil woman and advising that the Democratic Party should forfeit her seat because even if she wins, she will be of great consequence to them. Downward spiral for her, Minaj continued. She will not escape God’s wrath. She did not denounce evil when she had the chance. The hip-hop star who was born in Trinidad and Tobago but grew up in Queens, N.Y., from the age of 5 followed up with an all-caps response to a video she reposted of Hochul s controversial 2024 remark that there were Black kids growing up in the Bronx who don’t even know what the word ‘computer’ is, something she apologized for that same day. “I misspoke and I regret it,” the politician said at the time. HOW MUCH MORE DO YOU NEED TO SEE HEAR FROM THEM?!! Minaj wrote of the two-year-old incident. HOW DARE YOU AS BLACK PEOPLE VOTE FOR THIS VILE WICKED CURSE OF A WOMAN? HOW DARE YOU AS CHRISTIANS?! SHE STAYS SILENT ON HARM BEING CAUSED TO THE INNOCENT THIS IS WHAT SHE THINKS OF YOUR CHILDREN! Minaj also reposted a video of Hochul addressing Black congregants at True Bethel Baptist Church in 2025 about her inflation rebate initiative, joking : Don t stop by the liquor store, OK? Buy something for the kids — buy them some food. Sometimes I have to stop by the liquor store, too. I understand. So not only does she keep horrible company laugh at the demonic things her friends do behind the scenes to people who aren’t as politically powerful…Dear God, help us, the hitmaker wrote of the remark, which the church s bishop defended at the time as being in [the] context of his sermon that day. The posts come as Minaj has been helping Donald Trump rally for Republican candidates in this year s midterm elections. In addition to urging followers to vote for Bruce Blakeman in his race against Hochul, she recently appeared at the president s rally in Michigan, where he invited her to stand up for the crowd and", "date_str": "2026-10-29T15:58:24+00:00", "hash": "820fc410cd693800", "title_fa": "نیکی میناژ، فرماندار نیویورک، کتی هوچول را \"زن شیطانی\" می خواند که \"از خشم خدا در امان نخواهد ماند\" - به پاسخ هوچول مراجعه کنید", "summary_fa": "نیکی میناژ به خاطر نظراتش در مورد کتی هوچول، فرماندار نیویورک، که چهارشنبه شب (28 اکتبر) در روز چهارشنبه (28 اکتبر) در یک فحاشی در روز X او را شیطان نامید، با واکنش های منفی مواجه شد. موارد مرتبط: دونالد ترامپ از A زیبای نیکی میناژ در رالی میشیگان تمجید می کند: پس از اینکه کارمندان ترامپ به او پیشنهاد دادند که نقش سخنگوی مطبوعاتی را به عهده بگیرد نیکی میناژ می گوید که جایی نمی رود پس از اینکه دونالد ترامپ او را به عنوان شخصیت مورد علاقه خود می خواند، دوست داشتن آن سخت است. کتی هوچول پس از وزن کشی بر رقابت انتخاباتی فرمانداری ایالت خود که به سرعت نزدیک می شود، می نویسد، کتی هوچول یک زن شرور است و توصیه می کند که حزب دمکرات باید کرسی خود را از دست بدهد، زیرا حتی اگر او پیروز شود، عواقب بزرگی برای آنها خواهد داشت. میناژ ادامه داد: مارپیچ رو به پایین برای او. او از خشم خدا در امان نخواهد ماند. وقتی این فرصت را داشت، شر را تقبیح نکرد. این ستاره هیپ هاپ که در ترینیداد و توباگو به دنیا آمد اما در کوئینز، نیویورک بزرگ شد، از سن 5 سالگی به ویدئویی که او در مورد اظهارات جنجالی هوچول در سال 2024 بازنشر داد، پاسخ داد که در آن بچه‌های سیاه پوستی در برانکس بزرگ شده‌اند که حتی نمی‌دانند کلمه «کامپیوتر» همان روز عذرخواهی کرده است. این سیاستمدار در آن زمان گفت: «من اشتباه گفتم و پشیمانم. چقدر بیشتر نیاز دارید تا از آنها بشنوید؟!! میناژ از این حادثه دو ساله نوشت. شما به عنوان سیاه پوستان چگونه جرات دارید به این نفرین شریرانه زننده رای دهید؟ شما به عنوان یک مسیحی چقدر جرات دارید؟! او در مورد آسیبی که به افراد بیگناه وارد می شود سکوت می کند. این چیزی است که", "image_url": "https://www.billboard.com/wp-content/uploads/2026/10/2301977707-e1793029181229.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["رسانه", "هنر"], "datetime_fa": "۷ آبان • ۱۹:۲۸"}, {"source": "Billboard", "title": "LISA Talks Vegas Residency Jitters, Why ‘SaWaDiKa’ Was the Perfect Solo Single & Her Labubu Obsession: ‘I Have No Space to Walk’", "link": "https://www.billboard.com/music/pop/lisa-blackpink-vegas-residency-sawadika-labubu-therapuss-1236370270/", "summary": "As she gears up to kick off her VIVA LA LISA residency at the Colosseum at Caesars Palace in Las Vegas on Nov. 12, BLACKPINK s LISA sat down with Jake Shane on his Therapuss podcast on Thursday (Oct. 29) to talk first night jitters, working with Rosalía and how she went from never hearing of Labubu dolls to helping to launch a worldwide phenomenon and being fully overwhelmed by the adorably ugly collectible plushies. Coming off of her 2026 MTV VMA win for best pop for Dream from her debut solo album, last year s Alter Ego , LISA said the boost she got from snagging her own Moon Person and debuting her single SaWaDiKa at the show amped her up for the Sin City run. Now I m like, OK, I m looking forward to my residency, she said, confessing that she was having butterflies about the residency before her VMA performance. I was so nervous, she said as she s gearing up for intense rehearsals for the six-show run that kicks off next month. SaWaDiKa, which debuted at No. 69 on the Billboard Hot 100, appears on LISA s recently released six-track Press Play EP. The singer said it made perfect sense as the first single from the EP because the phrase is the first thing you say when you say hi to people in Thailand and it fits with the influence of her home country on the album. The 29-year-old singer/actress said she spent six or seven months in Thailand reconnecting to her roots — enjoying the food, friends, family and weather — after living in Korea since she was 14. It feels so good to be back home. Home there. Real home, she said. So, when we re doing this EP, we re just like, ‘OK. I have so many, inspiration from my hometown.' That included putting one of the nation s ubiquitous three-wheeled tuk-tuk motorized rickshaw s in the SaWaDiKa video and filling her mood board with so many Thai-inspired ideas. And then we re always talking oh, what if we put a Thai sound and mix with a pop sound?,' she added about the EP s closing track, the Britney Spears-like burner Sweat, which features a mix of sultry beats and Thai guitar. Speaking of Spears, LISA said she was obsessed with the Gimme More singer as a kid thanks to a cousin who was a huge Brit booster. She listed off Toxic as one of her favorite Britney songs, as well as the 2008 Circus album, which featured the title track single, as well as Womanizer, If U Seek Amy and Radar. LISA revealed the origin of another obsession to Shane as well, one she stumbled on by accident, but which has since become a bit of a problem", "date_str": "2026-10-29T15:53:51+00:00", "hash": "68b892e1b13a966a", "title_fa": "LISA درباره محل اقامت وگاس نگران است، چرا «SaWaDiKa» تک‌نفره عالی بود و وسواس لابوبو او: «من فضایی برای راه رفتن ندارم»", "summary_fa": "در حالی که آماده می شود تا اقامتگاه VIVA LA LISA خود را در کولوسئوم در کاخ سزار در لاس وگاس در 12 نوامبر آغاز کند، لیزای BLACKPINK با جیک شین در پادکست Therapuss خود در روز پنج شنبه (29 اکتبر) به گفتگو نشست و با او صحبت کرد و صحبت کرد که چگونه با او کار می کرد که چگونه از روزالیا شروع به کار کرد و چگونه با او کار می کرد که چگونه از روزالیا کمک می کند. پدیده ای در سراسر جهان و غرق شدن کامل توسط مخمل های مخملی زشت و دوست داشتنی. لیزا پس از برنده شدن در MTV VMA در سال 2026 برای بهترین پاپ برای Dream از اولین آلبوم انفرادی خود، سال گذشته Alter Ego، گفت که تقویتی که از گیر دادن Moon Person خودش به دست آورد و اولین تک آهنگ SaWaDiKa خود را در این برنامه اجرا کرد، او را برای اجرای Sin City تقویت کرد. او گفت: \"حالا خوبم، من مشتاقانه منتظر اقامت خود هستم، او اعتراف کرد که قبل از اجرای VMA خود در مورد رزیدنسی پروانه هایی داشت. من خیلی عصبی بودم، او گفت در حالی که برای تمرین های شدید برای اجرای شش نمایشی که ماه آینده شروع می شود، آماده می شود. SaWaDiKa که در رتبه 69 بیلبورد Hot 100 قرار گرفت، در LISA که اخیراً منتشر شده است، در EP 6 آهنگ Press Play ظاهر می شود. این خواننده گفت که به عنوان اولین تک آهنگ از EP کاملاً منطقی است زیرا این عبارت اولین چیزی است که هنگام سلام کردن به مردم تایلند می گویید و با تأثیر کشور خود در آلبوم مطابقت دارد. این خواننده/بازیگر 29 ساله گفت که پس از زندگی در کره از 14 سالگی، شش یا هفت ماه را در تایلند گذراند تا دوباره به ریشه های خود متصل", "image_url": "https://www.billboard.com/wp-content/uploads/2026/10/2297466352-e1793284153452.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["موسیقی"], "datetime_fa": "۷ آبان • ۱۹:۲۳"}, {"source": "Billboard", "title": "Tate McRae’s ‘Housewife’ Debuts at No. 1 on Streaming Songs Chart", "link": "https://www.billboard.com/pro/tate-mcrae-housewife-number-1-streaming-songs-chart/", "summary": "Tate McRae reaches No. 1 on Billboard ’s Streaming Songs chart for the first time as a lead act, bowing atop the Oct. 31-dated tally with “Housewife.” In the week ending Oct. 22, the song earned 22.9 million chart-eligible streams in the United States, according to Luminate. McRae led Streaming Songs once before, as the featured act on Morgan Wallen ’s “What I Want.” The tune reigned for six weeks in 2025. McRae’s previous best as a lead act was “Tit for Tat,” which peaked at No. 2 in 2025. She first reached the survey in 2020 when “You Broke Me First” peaked at No. 29, while her first top 10 followed in 2023 via “Greedy” (No. 6). “Greedy” takes over the No. 1 spot on Streaming Songs from Ella Langley ’s “Choosin’ Texas,” which equaled Mariah Carey ’s “All I Want for Christmas Is You” mark for the most weeks at No. 1 on the chart in its 13-year history on the Oct. 24 ranking, logging its 26th week atop the list. “Choosin’ Texas” appears at No. 4 on the latest chart via 20 million streams, up 1%. Concurrently, as previously reported , “Housewife” debuts at No. 2 on the multimetric Billboard Hot 100 , her highest charting song as a lead act, surpassing the No. 3 peaks of “Greedy” and “Tit for Tat.” She boasts one No. 1, a one-frame rule by Wallen’s “What I Want.” “Housewife” is expected to be the lead single from McRae’s fourth studio album, which does not yet have a release date. Its predecessor, So Close to What , debuted at No. 1 on the Billboard 200 dated March 8, 2025, and has earned 2.8 million equivalent album units to date.", "date_str": "2026-10-29T15:45:16+00:00", "hash": "ad07b50701c4bcb9", "title_fa": "اولین آهنگ «خانه دار» از تیت مک ری در رتبه اول جدول ترانه های استریمینگ قرار گرفت.", "summary_fa": "تیت مک‌ری برای اولین بار به عنوان بازیگر اصلی به رتبه ۱ جدول آهنگ‌های استریم بیلبورد رسید و با «خانم‌دار» در صدر جدول تاریخ ۳۱ اکتبر قرار گرفت. طبق گزارش Luminate، در هفته منتهی به 22 اکتبر، این آهنگ 22.9 میلیون استریم واجد شرایط چارت در ایالات متحده را به دست آورد. مک‌ری پیش از این یک بار رهبری استریمینگ آهنگز را به‌عنوان نقش برجسته در آهنگ «آنچه می‌خواهم» مورگان والن بر عهده داشت. این آهنگ در سال 2025 به مدت شش هفته حکمفرما شد. بهترین آهنگ قبلی مک‌ری در نقش اصلی «Tit for Tat» بود که در سال 2025 به رتبه دوم رسید. او اولین بار در سال 2020 به این نظرسنجی رسید که «اول تو مرا شکستی» در رتبه 29 قرار گرفت، در حالی که اولین 10 رتبه برتر او در سال 2023 از طریق «Greedy» (شماره 6) دنبال شد. \"Greedy\" جایگاه اول را در Streaming Songs از \"Choosin' Texas\" به کارگردانی الا لنگلی می گیرد، که با رکورد \"All I Want for Christmas Is You\" اثر ماریا کری برای بیشترین هفته ها در رتبه اول جدول در تاریخ 13 ساله خود در 24 اکتبر قرار گرفت و در رده بندی 24 اکتبر قرار گرفت. \"Choosin' Texas\" در شماره شماره ظاهر می شود. رتبه 4 در آخرین نمودار از طریق 20 میلیون استریم، 1٪ افزایش یافته است. به طور همزمان، همانطور که قبلاً گزارش شده بود، \"Housewife\" اولین بار در رتبه 2 بیلبورد Hot 100 قرار گرفت که بالاترین آهنگ نمودار او به عنوان بازیگر اصلی است، و از قله های شماره 3 \"Greedy\" و \"Tit for Tat\" پیشی گرفت. او دارای یک شماره 1 است، قانون تک فریمی توسط والن «آنچه می خواهم». انتظار می‌رود که \"Housewife\" تک آهنگ اصلی چهارمین آلبوم استودیویی مک‌ری باشد که هنوز تاریخ انتشار آن مشخص نیست. نسخه قبلی آن، So Close", "image_url": "https://www.billboard.com/wp-content/uploads/2026/10/P108QT61-e1792423413481.jpg?w=1024", "category": "سینما و سریال", "tags": ["موسیقی"], "datetime_fa": "۷ آبان • ۱۹:۱۵"}, {"source": "Billboard", "title": "Neon Coast Names Nikki Boon Chief Creative Officer", "link": "https://www.billboard.com/pro/neon-coast-nikki-boon-chief-creative-officer/", "summary": "Artist management and entertainment company Neon Coast has named Nikki Boon as chief creative officer, expanding her role to lead creative oversight and direction, as well as international strategy, spanning Neon Coast s full management roster. Neon Coast s roster includes Kane Brown , Nightly, Randall King , Restless Road and Julia Cole. Related Merck Mercuriadis New Hipgnosis Is Rolling Eight Management Companies Into a ‘Juggernaut’ Kenny MacPherson, Veteran Music Publisher and Big Deal Music Co-Founder, Dies at 71 Diddy Moved From New Jersey Prison to Similar Facility in Pennsylvania Boon has been with the company for a decade, working with country music hitmaker Brown and indie alt-pop group Nightly. To date, Brown has earned 12 No. 1 songs on Billboard s Country Airplay chart and has earned RIAA Diamond certification for the songs Heaven and What Ifs. Boon has also been instrumental in propelling the Neon Coast roster globally. Nightly will tour Asia and Australia in January 2027, including stops in China, Japan, Singapore, Sydney and Brisbane. Boon was highlighted as one of five Executives on the Rise in Billboard s 2026 Country Power Players issue. Nikki’s creative thinking is second to none. She has a passion for our artists that you can feel in every conversation she has, Martha Earls , founder and owner of Neon Coast, said in a statement. Nikki dreams bigger than anyone I know and has the rare ability to take an idea beyond the unexpected and see possibilities others can’t imagine. Bringing that vision, creativity, and unique perspective to every artist on our roster is one of the greatest ways we can invest in their success. “I’m so grateful to Kane, who showed me from his earliest days on the road how powerful a real connection with fans can be, to Nightly, who taught me every angle of what it takes to be an independent artist today, and to Martha Earls, who has always encouraged me and our whole team to dream big, chase ideas and go after our own big wins,” Boon added. “In this new role, I’m excited to support each artist’s manager, building on what they’ve already created and finding new ways to connect with fans at home and around the world.”", "date_str": "2026-10-29T15:45:04+00:00", "hash": "d7f4146ead5818bf", "title_fa": "ساحل نئون نیکی بون، مدیر ارشد خلاقیت را معرفی کرد", "summary_fa": "شرکت مدیریت هنرمندان و سرگرمی نئون کوست، نیکی بون را به عنوان مدیر ارشد خلاقیت منصوب کرد و نقش او را به رهبری نظارت و هدایت خلاقیت و همچنین استراتژی بین‌المللی گسترش داد که شامل فهرست کامل مدیریت نئون کوست می‌شود. فهرست مدیران نئون کوست شامل کین براون، نایتلی، رندال کینگ، جاده بی‌قرار و جولیا کول می‌شود. مرتبط با Merck Mercuriadis Hipgnosis جدید هشت شرکت مدیریتی را تبدیل به یک «جاگرنوت» کرده است. گروه آلت پاپ نایتلی. تا به امروز، براون رتبه 12 را کسب کرده است. 1 آهنگ در جدول کانتری پخش بیلبورد و گواهی RIAA Diamond را برای آهنگ‌های Heaven و What Ifs دریافت کرده است. بون همچنین در پیشبرد فهرست نئون کوست در سطح جهانی نقش مهمی ایفا کرده است. نایتلی در ژانویه 2027 به آسیا و استرالیا سفر خواهد کرد، از جمله در چین، ژاپن، سنگاپور، سیدنی و بریزبن. بون به عنوان یکی از پنج مدیر در حال ظهور در شماره ۲۰۲۶ Country Power Players بیلبورد برجسته شد. تفکر خلاق نیکی در رتبه دوم قرار ندارد. مارتا ارلز، موسس و مالک Neon Coast، در بیانیه‌ای گفت: او علاقه‌ای به هنرمندان ما دارد که می‌توانید در هر مکالمه‌ای که انجام می‌دهد احساس کنید. نیکی از هر کسی که من می‌شناسم، رویاهای بزرگ‌تری می‌بیند و توانایی نادری دارد که ایده‌ای را فراتر از غیرمنتظره‌ها بگیرد و امکاناتی را که دیگران تصور نمی‌کنند ببیند. آوردن این دیدگاه، خلاقیت و دیدگاه منحصر به فرد برای هر هنرمند در فهرست ما، یکی از بهترین راه هایی است که ما می توانیم برای موفقیت آنها سرمایه گذاری کنیم. از کین، که از همان روزهای ابتدایی‌اش در جاده به من نشان داد که ارتباط واقعی با طرفداران چقدر می‌تواند قدرتمند باشد، از نایتلی، که تمام جنبه‌های لازم را برای یک هنرمند مستقل بودن امروز به من آموخت، و از مارتا ارلز، که همیشه", "image_url": "https://www.billboard.com/wp-content/uploads/2026/10/Nikki-Boon-Headshot-CR-Ryan-Carcia-billboard.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["موسیقی", "سرمایه‌گذاری"], "datetime_fa": "۷ آبان • ۱۹:۱۵"}, {"source": "Billboard", "title": "SiriusXM Stock Rises on Subscriber Gains", "link": "https://www.billboard.com/pro/siriusxm-stock-rises-q3-2026/", "summary": "SiriusXM Holdings stock rose by around 4% on Thursday (Oct. 29) following financial results that showed its growing mix of affordable and add-on audio entertainment plans netted it 5,000 new subscribers in the third quarter. With more subscribers tuning into the satellite radio giant’s sports stations in the quarter and advertising revenue holding stable at $465 million, SiriusXM raised its full-year forecast for revenue, adjusted EBITDA and free cash flow the second straight quarter. The company now expects 2026 revenue of $8.55 billion, $2.65 billion in adjusted earnings before interest, tax, depreciation and amortization (EBITDA) and $1.4 billion in free cash flow. For the quarter, the company reported revenue of $2.153 billion was down slightly due to lower equipment revenue, while net income rose 6.7% to $317 million or $0.94 earnings per share. Free cash flow rose 14% to $293 million, and the company reiterated it is on track to generate $1.5 billion in total free cash flow for the year in 2027. Related Deezer s Subscriber Growth at Home in France Helps Drive Quarterly Revenue Increase Kenny MacPherson, Veteran Music Publisher and Big Deal Music Co-Founder, Dies at 71 Diddy Moved From New Jersey Prison to Similar Facility in Pennsylvania SiriusXM executives said they kept a lid on expenses and are closing in on their goal of realizing $100 million in cost savings by the end of the year. Advertising revenue from podcasts rose 20%, helping to offset softness in music ad revenue and supporting Sirius in signing a four-year exclusive deal for the comedy podcast Giggly Squad, hosted by Hannah Berner and Paige DeSorbo. Our third-quarter performance reflects the progress we re making in building a stronger, more durable SiriusXM, says Jennifer Witz , Sirius XM CEO. We re stabilizing our subscriber base, deepening engagement through differentiated content and experiences and expanding the reach and capabilities of our advertising platform. This momentum gives us the confidence to raise our full-year financial guidance and reinforces our conviction in SiriusXM s long-term value creation. Adjusted earnings before interest, tax, depreciation and amortization (EBITDA) rose 2.7% to $694 million, with adjusted EBITDA margin expanding to 32.2% from 31.3% a year ago. Sirius’s gross profit margin also increased slightly to 52.8% from 52.2% on higher gross profit of $1.136 billion in the quarter. Total cost of services ticked down to $1.017 billion, while total operat", "date_str": "2026-10-29T15:25:54+00:00", "hash": "453414e2563f31a0", "title_fa": "سهام SiriusXM با افزایش سود مشترک افزایش یافت", "summary_fa": "سهام SiriusXM Holdings در روز پنجشنبه (29 اکتبر) به دنبال نتایج مالی که نشان می‌دهد ترکیب رو به رشد برنامه‌های سرگرمی صوتی مقرون‌به‌صرفه و افزودنی آن، 5000 مشترک جدید را در سه ماهه سوم به دست آورده است، حدود 4 درصد افزایش یافت. با افزایش تعداد مشترکینی که در ایستگاه‌های ورزشی غول رادیویی ماهواره‌ای در سه‌ماهه اخیر به کار گرفته شده‌اند و درآمد تبلیغاتی آن در 465 میلیون دلار ثابت مانده است، SiriusXM پیش‌بینی درآمد سالانه خود را افزایش داد، EBITDA و جریان نقدی رایگان را در دومین سه ماهه متوالی تنظیم کرد. این شرکت اکنون انتظار دارد در سال 2026 درآمد 8.55 میلیارد دلاری، 2.65 میلیارد دلار درآمد تعدیل شده قبل از بهره، مالیات، استهلاک و استهلاک (EBITDA) و 1.4 میلیارد دلار جریان نقدی آزاد داشته باشد. برای سه ماهه، شرکت گزارش داد که درآمد 2.153 میلیارد دلاری به دلیل درآمد کمتر از تجهیزات، اندکی کاهش یافته است، در حالی که درآمد خالص 6.7 درصد افزایش یافته و به 317 میلیون دلار یا 0.94 دلار درآمد به ازای هر سهم رسیده است. جریان نقدی آزاد 14 درصد افزایش یافت و به 293 میلیون دلار رسید و این شرکت مجدداً تأکید کرد که در مسیر تولید 1.5 میلیارد دلار در کل جریان نقدی آزاد برای سال 2027 است. رشد مشترکین Deezer در خانه در فرانسه به افزایش درآمد سه ماهه کمک می کند. کنی مک فرسون، ناشر کهنه کار موسیقی و یکی از بنیانگذاران Big Deal Music، در سن 71 سالگی درگذشت. 100 میلیون دلار صرفه جویی در هزینه ها تا پایان سال. درآمد تبلیغات از پادکست ها 20 درصد افزایش یافت و به کاهش نرمی درآمد تبلیغات موسیقی کمک کرد و از سیریوس در امضای قرارداد انحصاری چهار ساله برای پادکست کمدی Giggly Squad، به میزبانی هانا برنر و پیج دسوربو حمایت کرد. جنیفر ویتز، مدیر عامل Sirius XM", "image_url": "https://www.billboard.com/wp-content/uploads/2026/10/2298969741-e1793286550551.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["موسیقی", "بورس و طلا"], "datetime_fa": "۷ آبان • ۱۸:۵۵"}, {"source": "Billboard", "title": "Usher & Chris Brown Bring R&B to No. 1 on Monthly Boxscore Report", "link": "https://www.billboard.com/pro/usher-chris-brown-top-monthly-boxscore-report/", "summary": "Since Billboard launched the monthly Boxscore charts in 2019, all types of acts have been No. 1 on the Top Tours chart. Men ( Elton John was first in February 2019), women ( P!nk followed the next month) and mixed-gender groups ( RBD in November 2023); stars of pop, rock, R B, country, Latin, rap, K-pop, and more. Solo artists and collectives – vocal groups like BTS and Spice Girls , bands like The Rolling Stones and Coldplay , and institutional touring ensembles like Trans-Siberian Orchestra . But in its 75th edition, ranking the biggest touring acts of September 2026, for the first time, co-headliners top the chart. According to figures reported to Billboard Boxscore, Usher and Chris Brown ’s The R B Tour grossed $77.4 million and sold 423,000 tickets across 10 shows in September, making it the highest-grossing and best-selling tour of the month. They are the first pair of artists to share the No. 1 spot on the chart. Usher and Brown came close earlier this summer, landing at No. 3 in July and August, blocked by BTS and The Weeknd in both months. And in the last seven years, other co-headline duos have come even closer. Def Leppard and Motley Crue ’s double-bill was No. 2 in Aug. 2022, held back by Bad Bunny . Red Hot Chili Peppers and Post Malone were runners-up in Jan. and Feb. 2023, stopped short by Elton John and Ed Sheeran , respectively. And last year, Kendrick Lamar and SZA scored silver in April and May 2025, bested by Coldplay and then by Beyoncé . September marks Usher’s first month at No. 1, having previously climbed as high as No. 3 as a soloist in Sept. and Oct. 2024. Brown returns to the top exactly one year after last reigning. He scored a record-tying trifecta with three straight months from July-Sept. 2025. Only Bad Bunny and Beyoncé have also been No. 1 for as many consecutive months. Usher and Brown’s monthly gross and attendance decline from their July and August takes, despite peaking in monthly rank. In July, The R B Tour earned $98.4 million and sold 538,000 tickets and in August, it brought in $91.8 million and sold 465,000. At $77.4 million and 423,000 for September, they are the first No. 1 since April to gross less than $100 million as the summer stadium season winds down in North America. The R B Tour began the month at Levi’s Stadium in Santa Clara, Calif. on Sept. 1 and ended in Glendale, Ariz.’s State Farm Stadium on the 29th. In between, they hit Las Vegas, Arlington, Texas (Dallas-area) and Inglewood, Calif. (Los Angeles)", "date_str": "2026-10-29T15:01:44+00:00", "hash": "04eda5b91aec1ff7", "title_fa": "آشر و کریس براون R&B را به شماره 1 در گزارش ماهانه Boxscore می آورند", "summary_fa": "از زمانی که Billboard نمودارهای ماهانه Boxscore را در سال 2019 راه اندازی کرد، همه انواع کنش ها در جدول Top Tours شماره 1 بودند. مردان (التون جان اولین بار در فوریه 2019 بود)، زنان (P!nk در ماه بعد) و گروه‌های جنسی مختلط (RBD در نوامبر 2023)؛ ستارگان پاپ، راک، آر بی، کانتری، لاتین، رپ، کی پاپ و غیره. هنرمندان و گروه‌های انفرادی – گروه‌های آوازی مانند بی‌تی‌اس و اسپایس گرلز، گروه‌هایی مانند رولینگ استونز و کلدپلی، و گروه‌های تور سازمانی مانند ارکستر ترانس سیبری. اما در هفتاد و پنجمین نسخه آن، با رتبه‌بندی بزرگ‌ترین تورهای سپتامبر 2026، برای اولین بار، همتایان در صدر جدول قرار گرفتند. بر اساس ارقام گزارش شده به Billboard Boxscore، تور The R B از Usher و Chris Brown در ماه سپتامبر 77.4 میلیون دلار فروش داشته و 423000 بلیت در 10 برنامه فروخته است که آن را به پردرآمدترین و پرفروش ترین تور ماه تبدیل کرده است. آنها اولین جفت هنرمندی هستند که رتبه اول جدول را به اشتراک می گذارند. آشر و براون در اوایل تابستان امسال به هم نزدیک شدند و به شماره شماره رسیدند. 3 در جولای و آگوست، توسط BTS و The Weeknd در هر دو ماه مسدود شده است. و در هفت سال گذشته، دیگر دوتاهای هم‌تیتر حتی نزدیک‌تر شده‌اند. اسکناس دوبل دف لپارد و موتلی کرو در آگوست 2022 شماره 2 بود که توسط Bad Bunny متوقف شد. Red Hot Chili Peppers و Post Malone در ژانویه و فوریه 2023 نایب قهرمان شدند و به ترتیب توسط Elton John و Ed Sheeran متوقف شدن ژه، تولید کننده رویدادهای اجرایی اخیر می‌گوید: «من فکر می‌کنم آنچه قرار نیست ایجاد شود سروصدای زیادی است. تمام نظرات و تفسیرها و سران سخنگو که دور یک میز نشسته اند و نکات صحبت خود را بیان می کنند، ما می خواهیم آن را حذف کنیم. مدیران این شبکه امیدوارند پوشش آنها به برخی از بینندگان یادآور \"NFL RedZone\" باشد، قالبی که بینندگان را به لحظات مهمی می برد. این شبکه، مانند پوشش اخیر انتخابات، بر Decision Desk HQ تکیه دارد، جدول‌بندی داده‌های رأی‌گیری که از سابقه خوبی به عنوان دعوت‌کننده اولیه رقابت‌های کلیدی برخوردار است. داده‌کاوی‌های آن شرکت در یک «اتاق جنگ» در دانشگاه جورج‌تاون حضور خواهند داشت و نگاه‌هایی از پشت صحنه در مورد چگونگی تجزیه و تحلیل آمارهای دریافتی توسط تیم و بیان اظهارات خود ارائه خواهند داد. کریس استایروالت، سردبیر سیاسی NewsNation می گوید: «شفافیت بیشتر بهتر است. ما در عصر داده‌ها زندگی می‌کنیم. ما در عصر بازارهای پیش‌بینی زندگی می‌کنیم. مردم انتظار دارند چه چیزی به دست بیاورند و چه زمانی به آن دست پیدا کنند. ما می‌توانیم این کار را انجام دهیم. NewsNation سه شنبه شب با تعداد فزاینده ای از رسانه ها که انتخابات را نیز پوشش خواهند داد، برای جلب توجه رقابت خواهد کرد. برخی رقبای بزرگتری مانند CNN یا NBC News هستند. برخی دیگر، استارت‌آپ‌های زیرک هستند که توسط «خلقین» دیجیتال رهبری می‌شوند، که برخی از آنها زمانی در رسانه‌های سنتی کار می‌کردند.", "image_url": "https://variety.com/wp-content/uploads/2026/10/Decision-Desk-2026.jpg?w=800&#038;h=450&#038;crop=1", "category": "هوش مصنوعی مولد", "tags": ["رسانه", "هنر"], "datetime_fa": "۷ آبان • ۱۸:۴۰"}, {"source": "Billboard", "title": "Celine Dion Makes Record-Breaking $125 Million Comeback in Paris", "link": "https://www.billboard.com/pro/celine-dion-record-breaking-comeback-paris-shows/", "summary": "The last time Celine Dion was on tour, she and her fans alike were unaware that concert venues (and the rest of the world) were about to close completely for more than a year. The Courage World Tour kicked off in September 2019 and generated more than $100 million before hitting pause in March 2020. On the other side of the COVID-19 shutdown, Dion delayed her return several times before officially canceling the remainder of the tour in 2023 due to her diagnosis with stiff-person syndrome. But don’t fret: Three years later, Dion is back and bigger than ever with record-breaking Boxscore figures. Related Céline Dion s Paris 2026 Setlist: Every Song Played at the First Show Céline Dion Cries Happy Tears in Paris: 9 Best Moments From Opening Night of Her Return to Stage Céline Dion s Comeback: 5 Takeaways From Night Two Of Her Paris Residency According to figures reported to Billboard Boxscore, the first leg of her residency, titled Celine Dion Paris, wrapped with $125.5 million and 539,000 tickets sold across 16 shows in September and October. Her comeback residency is anchored at Plenitude Arena in Paris (fka La Defense Arena). A single-venue residency is known territory for Dion. A New Day… (2003-07) and Celine (2011-19), both staged at The Colosseum at Caesars Palace in Las Vegas, are the two highest grossing residencies in Boxscore history. The former grossed $385.1 million in 714 shows, and the latter brought in $296.2 million in 427 dates. While Celine Dion Paris has yet to crack the top 10 of the highest grossing residencies, its 16 shows highlight how impressive the nine-figure gross is. On a per-night basis, her 2026 dates averaged $7.8 million — more than 10 times the nightly take from either of her Vegas stints. That surpasses U2 ’s Sphere residency, which grossed $6.1 million per show to become the fastest grossing residency ever. (Residencies are defined as 10 or more shows at a single venue. Extended stays within a larger tour such as Harry Styles at Madison Square Garden during Together Together or Shakira in Madrid during the Las Mujeres Ya No Lloran World Tour do not count). Further, Dion’s average crowd of 33,700 is close to double the next best per-show attendance for any residency in the Boxscore archives. ( Billy Joel paced 18,600 tickets during his tenure at Madison Square Garden.) When she claimed her throne in Vegas in the 2000s and 2010s, the most competitive residency venues were The Colosseum at Caesars Palace and MGM’s Dolby Live, ", "date_str": "2026-10-29T14:25:57+00:00", "hash": "498cf5343f2fbbc7", "title_fa": "بازگشت سلین دیون به رکورد 125 میلیون دلاری در پاریس", "summary_fa": "آخرین باری که سلین دیون در تور بود، او و طرفدارانش به طور یکسان از اینکه مکان‌های کنسرت (و سایر نقاط جهان) برای بیش از یک سال در شرف تعطیلی کامل بودند، بی‌اطلاع بودند. تور جهانی شجاعت در سپتامبر 2019 آغاز شد و قبل از توقف در مارس 2020 بیش از 100 میلیون دلار درآمد داشت. در طرف دیگر تعطیلی COVID-19، دیون چندین بار بازگشت خود را به تعویق انداخت تا اینکه در سال 2023 باقیمانده تور را به دلیل تشخیص سندرم فرد سفت به طور رسمی لغو کرد. اما نگران نباشید: سه سال بعد، دیون بازگشته و بزرگتر از همیشه با ارقام رکوردشکنی Boxscore. مجموعه‌های مرتبط Céline Dion s Paris 2026: هر آهنگی که در اولین نمایش پخش شده است Céline Dion Cryes Happy Tears in Paris: 9 بهترین لحظه از شب افتتاحیه بازگشت او به صحنه بازگشت سلین دیون: 5 غذای مهم از شب دوم از اقامتگاهش در پاریس بر اساس ارقامی که برای اولین بار از Celine Dion به بیلبورد گزارش شده است. دیون پاریس با 125.5 میلیون دلار و فروش 539000 بلیت در 16 نمایش در ماه های سپتامبر و اکتبر به پایان رسید. محل اقامت بازگشت او در Plenitude Arena در پاریس (fka La Defense Arena) لنگر انداخته است. اقامتگاه تک محله ای منطقه شناخته شده برای دیون است. یک روز جدید… (2003-07) و سلین (2011-19) که هر دو در کولوسئوم در کاخ سزار در لاس وگاس به روی صحنه رفتند، دو اقامتگاه پردرآمد در تاریخ Boxscore هستند. اولی در 714 نمایش 385.1 میلیون دلار فروش داشت و دومی در 427 تاریخ 296.2 میلیون دلار به دست آورد. در حالی که سلین دیون پاریس هنوز نتوانسته است در بین 10 اقامتگاه پردرآمد قرار گیرد، 16 نمایش آن نشان می دهد که درآمد 9 رقمی چقدر چشمگیر است. بر اساس هر شب، قرارهای او در سال", "image_url": "https://www.billboard.com/wp-content/uploads/2026/10/celine-dion-plentitude-arena-2026-billboard-1800.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["ر s", "link": "https://www.hollywoodreporter.com/movies/movie-news/amc-dune-sandworm-popcorn-part-three-1236742572/", "summary": "The chain has revealed two buckets for the upcoming film similar to the one that was mocked on 'SNL' and sparked the popcorn bucket wars.", "date_str": "2026-10-29T14:07:15+00:00", "hash": "511ced70b9f5d276", "title_fa": "سطل پاپ کورن کرم شنی بدنام «Dune» AMC برای «قسمت سوم» با طرح‌های جدید بازگشته است.", "summary_fa": "این زنجیره دو سطل برای فیلم آینده نشان داده است شبیه به همان چیزی که در SNL مورد تمسخر قرار گرفت و جرقه جنگ سطل پاپ کورن را برانگیخت. متن لوگو سطل ذرت بو داده کرم شنی بازگشته است و این بار دو تا از آنها وجود دارد. AMC Theaters دنباله‌ای از بدنام‌ترین محصول مرتبط با فیلم Dune: Part Three را منتشر کرده است. چنین محصولاتی می توانند درآمد تئاتر را به میزان قابل توجهی افزایش دهند، زیرا سطل های کلکسیونی اغلب با قیمت 25 تا 50 دلار به فروش می رسند. سطل The Dune: Part Two با برانگیختن جنون فروش سطل پاپ کورن اعتبار داشت، به طوری که رگال سال گذشته یک سطل را برای فیلم The Fantastic Four: First Steps به قیمت 80 دلار فروخت. داستان‌های مرتبط Business AMC Global Media مدیر ارتباطات جورجیا جوولیس اواخر امسال فیلم‌ها Dune: قسمت سوم رکورد پیش‌فروش Odyssey در BFI IMAX لندن را شکست. تئاترهای AMC \"از لحظه ای که ما برنامه ریزی کلکسیون های Dune: Part Three را شروع کردیم، هدف ما فراتر از انتظارات طرفداران بود. کلکسیون های Sandworm Thumper و Double Sandworm تجربه را با طراحی های مستقیم از فیلم به سطح بالاتری می برد. هر دو سطل با پاپ کورن بزرگ عرضه می شوند و در مکان های AMC در ایالات متحده و Odeon Cinemas در سراسر اروپا در دسترس خواهند بود. AMC همچنین مجموعه‌های دیگری از Dune: Part Three را ارائه می‌کند، از جمله ظروف نوشیدنی، جاکلیدی مرموز، و Sandworm. قیمت سطل نزدیکتر به تاریخ اکران فیلم در 18 دسامبر اعلام خواهد شد.", "image_url": "https://www.hollywoodreporter.com/wp-content/uploads/2026/10/Dune-Worm-Cup-Collectibles-Duo.png?crop=0px%2C10px%2C1661px%2C929px&#038;resize=1440%2C810", "category": "هوش مصنوعی مولد", "tags": ["سینما"], "datetime_fa": "۷ آبان • ۱۷:۳۷"}, {"source": "Hollywood Reporter", "title": "‘The Diplomat’ Renewed for Season 5 at Netflix", "link": "https://www.hollywoodreporter.com/tv/tv-news/the-diplomat-renewed-season-5-netflix-1236742375/", "summary": "The Keri Russell-led political thriller's fourth season, which wrapped with a dramatic moment at the G7 summit, dropped on Oct. 15.", "date_str": "2026-10-29T13:30:00+00:00", "hash": "5d8866be76533139", "title_fa": "«The Diplomat» برای فصل پنجم در نتفلیکس تمدید شد", "summary_fa": "فصل چهارم تریلر سیاسی به رهبری کری راسل، که با لحظاتی دراماتیک در اجلاس G7 به پایان رسید، در 15 اکتبر پخش شد. متن لوگوی The Diplomat برای فصل پنجم در نتفلیکس تمدید شد. این خبر که پنجشنبه اعلام شد، پس از پایان فصل چهارم با صحنه‌ای دراماتیک در اجلاس G7 منتشر شد که سوالاتی را در مورد شغل تعدادی از کارمندان بلندمدت این سریال ایجاد کرد. در لحظات پایانی فصل پایانی، هال وایلر، معاون روفوس سیول، آماده می‌شود تا با گروهی از خبرنگاران صحبت کند و قبل از اینکه صحنه سیاه شود، صبح بخیر گفت. ستاره‌های سیول، آلیسون جنی و کری راسل در گفتگو با هالیوود ریپورتر که مربوط به فصل چهارم سریال دیپلمات است، امیدوار بودند که بفهمند چه اتفاقی برای شخصیت‌هایشان می‌افتد. داستان‌های مرتبط فراتر از آی‌پی رایگان کتاب و چشم‌های تازه: چگونه هالیوود، خالق پیوند تلویزیون‌های کلاسیک را دوباره اختراع می‌کند، جوزف کی توافق کلی را در نتفلیکس تنظیم می‌کند: «اوج این رفتار چیست و او چه می‌کند؟»، جانی با صدای بلند از گریس پن، رئیس‌جمهورش، که در چهارچوب سیاست خارجی تهاجمی فصلی انجام می‌دهد تعجب کرد. \"آیا او استعفا می دهد؟ چه کار می کند؟ اگر به فصل دیگری برسیم چه اتفاقی می افتد؟» پنج فصل یک دوره نسبتا طولانی در دوران استریم است، اما دبورا کان، خالق و مجری سریال The Diplomat اخیراً به THR گفت که او هنوز به پایان این داستان نزدیک نشده است. آلوم West Wing و Gray s Anatomy گفت: \"من در تلویزیون پخش بزرگ شدم، جایی که یک فصل آن 22، گاهی اوقات 25 قسمت بود، بنابراین به نظر می رسد که ما تازه شروع کرده ایم.\" برای من احساس نمی‌کنم که در فصل چهارم هستیم. این احساس به نظر می‌رسد که در میانه راه هستیم.»", "image_url": "https با بازی میکی رورک برنده شیر طلایی جشنواره فیلم ونیز شد، در حالی که \"قوی سیاه\" در سال 2010 با بازی ناتالی پورتمن پنج نامزدی جایزه اسکار از جمله بهترین فیلم و بهترین کارگردانی را به خود اختصاص داد. پورتمن برای بازی خود برنده اسکار بهترین بازیگر زن شد. از دیگر فیلم‌های کارگردانی آرونوفسکی می‌توان به «چشمه»، «نوح» و «مادر» اشاره کرد. درام او در سال 2022 به نام \"نهنگ\" بازگشت برندان فریزر به نقش اصلی فیلم را رقم زد و اولین جایزه اسکار را برای این بازیگر به ارمغان آورد. اخیراً، آرونوفسکی فیلم جنایی «دزدی گرفتار» را در سال 2025 با بازی آستین باتلر، زوئه کراویتز و رجینا کینگ کارگردانی کرد.", "image_url": "https://variety.com/wp-content/uploads/2025/12/VARIETY-SIZING-52.png?w=1000&#038;h=563&#038;crop=1", "category": "هوش مصنوعی مولد", "tags": ["سینما"], "datetime_fa": "۷ آبان • ۱۸:۰۵"}, {"source": "Variety", "title": "Joey King, LaKeith Stanfield to Star in Provocative Alien Romance Comedy ‘Safe Space,’ Lucky Number, CAA Media Finance and WME Independent Launching Sales at AFM (EXCLUSIVE)", "link": "https://variety.com/2026/film/global/joey-king-lakeith-stanfield-alien-romance-comedy-safe-space-1236934141/", "summary": "Joey King (“Bullet Train,” “The Act”) and Oscar-nominated LaKeith Stanfield (“Judas and the Black Messiah”) are set to star in “Safe Space,” a provocative sci-fi comedy about toxic relationships from Independent Spirit Award-nominated filmmaker Gillian Wallace Horvat (“I Blame Society”). French sales outfit Lucky Number is launching sales on the project at the American Film [ ]", "date_str": "2026-10-29T14:35:20+00:00", "hash": "dae0c9e84f2a3d02", "title_fa": "جوی کینگ، لیکیت استنفیلد برای ایفای نقش در کمدی عاشقانه بیگانه تحریک آمیز «فضای امن»، شماره خوش شانس، CAA Media Finance و فروش مستقل WME در AFM (اختصاصی)", "summary_fa": "جوی کینگ («قطار گلوله»، «قطع») و لاکیث استنفیلد («یهودا و مسیح سیاه») نامزد اسکار قرار است در «فضای امن»، یک کمدی علمی تخیلی تحریک‌آمیز درباره روابط سمی از فیلمساز نامزد جایزه Independent Spirit، Gillian Blaace Horvat Society (»»)  ]", "date_str": "2026-10-29T14:34:41+00:00", "hash": "c74562fc1a07f1ca", "title_fa": "نقد و بررسی «کریسمس در کرینگل»: فصلی کپر ترکیبی از کمدی و ترسناک، از دست دادن علامت هر دو", "summary_fa": "تنها چیزی که در کانون ترسناک کمتر از یک فیلم تعطیلات خوب است، یک کمدی خوب است. «کریسمس در کرینگلز» با وحشتناک بودن از هر دو جنبه، همپوشانی را در نمودار ون از دست می‌دهد: عمیقاً بدبینانه در مورد فصل یولتید اما همچنین کاملاً خنده‌دار. این شکست با توجه به [ ] گیج کننده تر شد. لیوینگستون («فلش») نقش مارک سورسون، یک تاجر سهام معتاد به کار را بازی می‌کند که به همراه همسرش جولی (بیلسون) و پسرش بابی (جک جوکس) به شهر کوچکی نقل مکان می‌کنند تا خانواده را از هم پاشیده نکنند. مارک که یک هفته قبل از کریسمس می رسد، با نیمه دل سعی می کند جشنی برای بابی ترتیب دهد، اما وقتی سورسون ها با خانواده کرینگل، خانواده ای که تعطیلات را در تمام سال جشن می گیرند، ملاقات می کنند، سرنوشت دخالت می کند. وقتی نیک کرینگل (لنون) آنها را برای شام در شب کریسمس دعوت می کند، مارک به درخواست جولی از بدبینی خود در شهر بزرگ چشم پوشی می کند - و در کمال تعجب او، آنها در واقع سرگرم می شوند. دو ماه بعد، مارک حتی بیشتر از هر زمان دیگری در کار غوطه ور است و این امر باعث ناامیدی جولی شد که امیدوار بود جشن مناسب روز ولنتاین را برگزار کند. وقتی همسر نیک، کارول (میرین) جولی و بابی را برای شام دعوت می کند، مارک ابتدا هیجان زده می شود، اما وقتی از همسایه شان، داریل (فیسون) هشداری دریافت می کند که کرینگل ها آن چیزی که به نظر می رسد نیستند، با عجله می رود تا آنها را بررسی کند. وقتی متوجه می شود که او قفل شده است، او و داریل به یک مرکز خرید بابانوئل (ریگل) می رسند که بخشی از شبکه ای از همنوعان شادی آور است. آنها با هم، کرینگل ها را به عنوان", "image_url": "https://variety.com/wp-content/uploads/2026/10/MCDCHAT_EC050.jpg?w=1000&#038;h=563&#038;crop=1", "category": "هوش مصنوعی مولد", "tags": ["سینما", "بورس و طلا"], "datetime_fa": "۷ آبان • ۱۸:۰۴"}, {"source": "Variety", "title": "Prince Estate to Release ‘3121’ Expanded Edition, With Concert Video and Multiple Unreleased Tracks", "link": "https://variety.com/2026/music/news/prince-3 ": "https://rezjalibd.github.io/daily-news/archive/2026-09-07.html"}];

    let currentTab = 'persian';
    let searchQuery = '';
    let readArticles = new Set(JSON.parse(localStorage.getItem('read_articles_registry') || '[]'));

    function toFaDigits(n) {
      const f = ['۰','۱','۲','۳','۴','۵','۶','۷','۸','۹'];
      return n.toString().replace(/\d/g, d => f[d]);
    }

    function toggleRead(hash) {
      if (readArticles.has(hash)) {
        readArticles.delete(hash);
      } else {
        readArticles.add(hash);
      }
      localStorage.setItem('read_articles_registry', JSON.stringify(Array.from(readArticles)));
      renderNews();
    }

    function renderNews() {
      const container = document.getElementById('newsContainer');
      const rawItems = data[currentTab] || [];
      
      const filtered = rawItems.filter(item => {
        if (!searchQuery) return true;
        const q = searchQuery.toLowerCase();
        const title = (item.title_fa || item.title || '').toLowerCase();
        const summary = (item.summary_fa || item.summary || '').toLowerCase();
        const source = (item.source || '').toLowerCase();
        const category = (item.category || '').toLowerCase();
        const tags = (item.tags || []).join(' ').toLowerCase();
        return title.includes(q) || summary.includes(q) || source.includes(q) || category.includes(q) || tags.includes(q);
      });

      const unreadList = [];
      const readList = [];

      filtered.forEach(item => {
        if (readArticles.has(item.hash)) {
          readList.push(item);
        } else {
          unreadList.push(item);
        }
      });

      const sortedItems = [...unreadList, ...readList];

      if (sortedItems.length === 0) {
        container.innerHTML = '<div style="text-align:center; padding: 40px; color: var(--text-muted);">هیچ خبری در این بخش در ۲۴ ساعت گذشته ثبت نشده است.</div>';
        return;
      }

      container.innerHTML = sortedItems.map((item, idx) => {
        const title = item.title_fa || item.title || '';
        const summary = item.summary_fa || item.summary || '';
        const source = item.source || 'منبع خبر';
        const link = item.link || '#';
        const isRead = readArticles.has(item.hash);
        const num = toFaDigits(idx + 1);
        const category = item.category || '';
        const tags = item.tags || [];
        const datetimeFa = item.datetime_fa || '';

        return `
          <article class="news-card ${isRead ? 'is-read' : ''}" id="card-${item.hash}">
            <div class="news-header">
              <span class="news-num">${isRead ? '✓' : num}</span>
              <h2 class="news-title">${title}</h2>
            </div>
            ${summary ? `<p class="news-summary">${summary}</p>` : ''}
            <div class="news-footer">
              <div class="footer-top-row">
                <div class="meta-group">
                  <span class="news-source">📌 ${source}</span>
                  ${datetimeFa ? `<span class="news-datetime">🕒 ${datetimeFa}</span>` : ''}
                  ${category ? `<span class="news-category-badge" onclick="filterByTag('${category}')">📂 ${category}</span>` : ''}
                </div>
              </div>
              ${tags && tags.length > 0 ? `
                <div class="footer-tags-row">
                  ${tags.map(t => `<span class="news-tag-chip" onclick="filterByTag('${t}')">#${t}</span>`).join('')}
                </div>
              ` : ''}
              <div class="footer-bottom-row">
                <div class="footer-actions-right">
                  <button class="btn-mark-read" onclick="toggleRead('${item.hash}')">
                    ${isRead ? '✓ خوانده شد' : '○ علامت خوانده‌شده'}
                  </button>
                </div>
                <div class="footer-actions-left">
                  ${link && link.startsWith('http') ? `<a href="${link}" target="_blank" rel="noopener noreferrer" class="news-link">مطالعه اصل خبر ↗</a>` : ''}
                </div>
              </div>
            </div>
          </article>
        `;
      }).join('');
    }

    function filterByTag(val) {
      const searchInput = document.getElementById('searchInput');
      if (searchInput) {
        searchInput.value = val;
        searchQuery = val;
        renderNews();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    }

    function switchTab(tab, el) {
      currentTab = tab;
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      if (el) el.classList.add('active');
      renderNews();
    }

    function toggleTheme() {
      const html = document.documentElement;
      const current = html.getAttribute('data-theme') || 'dark';
      const next = current === 'dark' ? 'light' : 'dark';
      html.setAttribute('data-theme', next);
      localStorage.setItem('theme', next);
      updateThemeButton(next);
    }

    function updateThemeButton(theme) {
      const icon = document.getElementById('themeIcon');
      const text = document.getElementById('themeText');
      if (theme === 'dark') {
        icon.textContent = '☀️';
        text.textContent = 'حالت روشن';
      } else {
        icon.textContent = '🌙';
        text.textContent = 'حالت تاریک';
      }
    }

    function toggleArchiveModal(show) {
      const modal = document.getElementById('archiveModal');
      if (show) {
        renderArchiveList();
        modal.classList.add('active');
      } else {
        modal.classList.remove('active');
      }
    }

    function renderArchiveList() {
      const listContainer = document.getElementById('archiveListContainer');
      if (!archiveManifest || archiveManifest.length === 0) {
        listContainer.innerHTML = '<div style="text-align:center; padding: 20px; color: var(--text-muted);">هنوز شماره قبلی ثبت نشده است.</div>';
        return;
      }

      listContainer.innerHTML = archiveManifest.map(item => `
        <a href="${item.url}" class="archive-item">
          <div>
            <div class="archive-date-fa">📰 شماره ${item.p_date}</div>
            <div class="archive-date-g">🌍 ${item.g_date}</div>
          </div>
          <span class="archive-arrow">←</span>
        </a>
      `).join('');
    }

    const savedTheme = localStorage.getItem('theme') || 'dark';
    document.documentElement.setAttribute('data-theme', savedTheme);
    updateThemeButton(savedTheme);

    document.getElementById('searchInput').addEventListener('input', (e) => {
      searchQuery = e.target.value.trim();
      renderNews();
    });

    renderNews();
  </script>
