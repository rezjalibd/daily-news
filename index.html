-commentary/trump-mens-bodies-midterm-rallies-1235646285/", "summary": "Donald Trump has spent his midterm campaign stops talking about hot male bodies. It only gets weirder from there", "date_str": "2026-10-22T13:00:00+00:00", "hash": "2630bc584c21c527", "title_fa": "آخرین تور برای ما شاخدار، پادشاه دیوانه", "summary_fa": "دونالد ترامپ کمپین میان دوره ای خود را صرف صحبت در مورد بدن های داغ مردانه کرده است. از آنجا عجیب‌تر می‌شود که دونالد ترامپ از شما می‌خواهد بدانید که او مجذوب مردان نیست. ترامپ در یک سخنرانی در هیئت صلح در ماه فوریه، در حالی که از سانتیاگو پنیا، رئیس جمهور پاناما قدردانی کرد، گفت: «من مردان جوان و خوش تیپ را دوست ندارم. «زنان... من دوست دارم. مردان، من هیچ علاقه ای ندارم.» و با این حال، اگر تقریباً هر یک از گردهمایی‌های انتخابات میان دوره‌ای دونالد ترامپ را تماشا کنید، به راحتی می‌توانید ایده اشتباهی را دریافت کنید. ترامپ در یک تظاهرات در دورانت، اوکلاهاما، در اول اکتبر گفت: «دو مردی که به اینجا آمدند، افرادی که من امروز تماشا کردم... شما می‌خواستید آنها را ببوسید. من اصلاً از نظر جسمی جذب آنها نمی شوم، اگرچه آنها افراد بسیار خوش تیپی هستند - آنها دو پسر خوش تیپ هستند. ترامپ درباره سناتور اوهایو، جان هاستد، بازیکن سابق فوتبال کالج، در جریان گردهمایی 12 اکتبر گفت: «من این کار را اغلب با مردان انجام نمی دهم. من شروع به معاینه بدن او کردم زیرا نمی دانستم که او یک ورزشکار بزرگ است. و من نگاه کردم - به بالا و پایین نگاه کردم، به الاغش نگاه کردم و به کل نگاه کردم...» ترامپ چند روز بعد در مورد هاستد در کنتاکی اضافه کرد: «من الاغ او را بررسی کردم. و سپس به شانه هایش نگاه کردم، به پاهایش نگاه کردم و سپس به خط فک او نگاه کردم - در حال مطالعه. روی شانه اش زدم و مثل یک تکه فولاد بود.»"}, {"source": "Rolling Stone", "title": "Watch Carrie Underwood Close Dolly Parton Tribute Concert With ‘I Will Always Love You’", "link": "https://www.rollingstone.com/music/music-country/carrie-underwood-sings-i-will-always-love-you-dolly-tribute-1235646179/", "summary": "The country star was joined by some of the Nashville tribute concert’s other performers to sing the soaring ballad", "date_str": "2026-10-22T06:11:24+00:00", "hash": "7df4e212a72bff67", "title_fa": "کنسرت ادای احترام دالی پارتون نزدیک کری آندروود را با \"من همیشه دوستت خواهم داشت\" تماشا کنید", "summary_fa": "این ستاره کانتری به همراه برخی از دیگر اجراکنندگان کنسرت ادای احترام در نشویل برای خواندن تصنیف سربه فلک کشیده، کری آندروود عنوان آهنگ ویژه تلویزیونی زنده چهارشنبه شب CM A Presents I Will Always Love You: A Celebration of Dolly Parton را ارائه کرد. این ستاره موسیقی کانتری پخش ABC را با اجرای سر به فلک کشیده تصنیف پارتون در سال 1974 به پایان رساند که در پایان برخی از دیگر اجراکنندگان شب نیز به آن پیوستند. این خواننده با یک لباس سفید روان روی صحنه ظاهر شد تا ادای عاطفی و پایانی شب را بخواند. از جمله هنرمندانی که در طول نمایش از پارتون تجلیل کردند، زک براون، که با پارتون با استفاده از آوازهای از پیش ضبط شده‌اش از باترفلای، دونوازی خواند، و الا لنگلی، که برداشت خود را از آهنگ 1974 «جولین . \"I Will Always Love You\" که در آلبوم جولین پارتون منتشر شد، در اصل برای خداحافظی با پورتر واگنر نوشته شده بود که پارتون را استخدام کرد تا مرتباً در مجموعه تلویزیونی خود ظاهر شود. واگونر، یک خواننده کانتری که به خاطر کت و شلوارهای بدلیجاتش شهرت دارد، یک آهنگساز کهنه کار بود که با انتخاب بازیگران پارتون در برنامه اش، به او افتخار بزرگی داد. این زوج مکرراً شریک دوئت شدند و 13 آلبوم دوئت منتشر کردند. آنها سه بار جایزه انجمن موسیقی کانتری را برای دو آواز سال دریافت کردند. با این حال، در نهایت، پارتون از نمایش پیشی گرفت (و شروع به درخشش بیشتر از واگونر کرد) و او در سال 1974 ترک کرد و او را با یکی از احساسی ترین تصنیف های موسیقی به یادگار گذاشت. او دوباره در سال 2007 آن را به افتخار پنجاهمین سال عضویت واگنر به عنوان عضو Grand Ole Opry برای او خواند. پارتون سپس گفت: \"اگر پورتر نبود، این آهنگ را نمی"}, {"source": "Rolling Stone", "title": "Zac Brown Delivers Emotional ‘Duet’ With Dolly Parton During Tribute Ceremony", "link": "https://www.rollingstone.com/music/music-country/zac-brown-dolly-parton-duet-butterfly-tribute-concert-1235646266/", "summary": "The country music icon, who died in August, originally recorded \"Butterfly\" for Brown's 2025 album Love Fear", "date_str": "2026-10-22T05:47:50+00:00", "hash": "c94d1fcb9230707c", "title_fa": "زک براون \"دوئت\" احساسی با دالی پارتون در مراسم ادای احترام", "summary_fa": "نماد موسیقی کانتری که در ماه اوت درگذشت، در ابتدا «پروانه» را برای آلبوم براون Love Fear در سال 2025 ضبط کرد. صدای دالی پارتون، روز چهارشنبه مرکز فیشر دانشگاه بلمونت برای هنرهای نمایشی را پر کرد، جایی که تماشاگرانی مملو برای یک کنسرت ادای احترام به افسانه کشور جمع شده بودند. در طول اجرای زک براون به افتخار پارتون، این خواننده پروانه را اجرا کرد. این آهنگ، یک تصنیف الهام‌بخش برای راهنمایی فرزندان براون در طول زندگی، به عنوان یک دونفره با پارتون در آلبوم ۲۰۲۵ او Love Fear نمایش داده شد. همانطور که براون این آهنگ را در طول CMA Presents I Will Always Love You: A Celebration of Dolly Parton در نشویل تکرار کرد، آوازهای از پیش ضبط شده پارتون به او و گروه پیوستند و او گروه کر را خواند: پروانه، خواهی دید/تو خیلی قوی تر از آن چیزی هستی که فکر می کنی/فقط باید باور کنی. این اجرا روی صحنه ای برگزار شد که با این موجود بالدار تزئین شده بود، از گل آرایی عظیم گرفته تا پروانه هایی که مشرف به تماشاگران بودند. در اوایل شب، الا لنگلی به او پیشنهاد کرد که آهنگ 1974 \"Jolene\" را دریافت کند، که این ستاره اولین بار در کنسرت خود در آبورن، آلاباما، اندکی پس از مرگ پارتون اجرا کرد. داستان‌های پرطرفدار جان اندرسون، تالار مشاهیر موسیقی کانتری با صدایی بی‌گمان، مرده در 71 املاک آرون کارتر به تسویه حساب با Walgreens بیش از نسخه‌های Xanax می‌رسد زک براون دونفری احساسی با دالی پارتون در طول مراسم ادای احترام اللانگلی برای اولین بار به دالی براون ادای احترام می‌کند. آهنگ را زنده پخش کرد تنها چند روز پس از مرگ پارتون در ماه آگوست، براون و گروه همنامش اولین کنسرت \"Butterfly\" را در طی یک جفت نمایش در استادیوم Forest Hills در کوئینز، نیویورک برگزار کردند. براون"}, {"source": "Rolling Stone", "title": "Tim McGraw, Blake Shelton, Riley Green Mourn John Anderson: ‘This One Really Hurts’", "link": "https://www.rollingstone.com/music/music-country/john-anderson-tributes-tim-mcgraw-blake-shelton-riley-green-1235646417/", "summary": "Country Music Hall of Famer died on Wednesday at 71", "date_str": "2026-10-22T04:47:16+00:00", "hash": "49e500fc0cff9976", "title_fa": "تیم مک گرو، بلیک شلتون، رایلی گرین مورن جان اندرسون: «این یکی واقعاً دردناک است»", "summary_fa": "جان اندرسون، هیت‌ساز محبوب که به‌خاطر جنگ‌های کانتری عمیق‌اش شهرت داشت، روز چهارشنبه در سن ۷۱ سالگی درگذشت. این بزرگ کانتری بیش از 20 آلبوم استودیویی به نام خود داشت و در طول زندگی حرفه‌ای‌اش تعداد زیادی آلبوم کانتری از جمله Wild and Blue، Swingin و Straight Tequila Night منتشر کرد. بسیاری از هنرمندانی که اندرسون در طول زندگی حرفه ای پربار خود تحت تأثیر قرار داد، پس از خبر مرگ او در رسانه های اجتماعی منتشر شدند. تیم مک‌گرو، بلیک شلتون، رایلی گرین و دیگر افراد اندرسون را عزادار کردند و استعداد نسلی اعضای تالار مشاهیر موسیقی کشور را گرامی داشتند. مک‌گرو نوشت که من از درگذشت او کاملاً دلشکسته هستم، او گفت که او به تازگی با اندرسون در مراسم تالار مشاهیر موسیقی کشور یکشنبه گذشته در نشویل صحبت کرده است. هیچ‌وقت یک سبک در موسیقی وجود نخواهد داشت، هیچ موسیقی که به اندازه او تعیین کننده باشد. فقط ویرانگر است تمام عشق ما به خانواده او و جامعه موسیقی کشور است. او یکی از صداهای تعیین کننده در موسیقی کانتری بوده و هست. شلتون در خاطره ای به زمان خود با اندرسون نگاه کرد و گفت، من مرد بسیار خوش شانسی هستم. او ادامه داد، من این فرصت را پیدا کردم که بفهمم قهرمان من فقط آن مردی نیست که امیدوارم باشد. او خیلی بیشتر از این بود. جان دوست من بود. یکشنبه گذشته او را دیدم و حتی نمی دانم چرا اما به او گفتم که دوستش دارم. این چیزی است که در این لحظه قلب من را پر می کند. عشق و دعای من برای خانواده جان است. این یکی واقعا درد داره جان ریچ اندرسون را هنرمند کانتری مورد علاقه خود در تمام دوران نامید. او در ادای احترامی که در اینستاگرام به اشتراک گذاشته شد، نوشت: مردی که در 20 سال گذشته عمو"}, {"source": "Rolling Stone", "title": "Ella Langley Pays Tribute to Dolly Parton With Smoldering Version of ‘Jolene’", "link": "https://www.rollingstone.com/music/music-country/ella-langley-performs-jolene-dolly-parton-tribute-concert-1235646106/", "summary": "The \"Choosin' Texas\" star offered a fiery rendition of the country legend's 1974 hit during the CMA's I Will Always Love You tribute", "date_str": "2026-10-22T01:56:26+00:00", "hash": "8ab93af7d6fd826a", "title_fa": "الا لنگلی با نسخه داغ جولین به دالی پارتون ادای احترام کرد", "summary_fa": "ستاره «Choosin' Texas» اجرای آتشین آهنگ 1974 افسانه کانتری را در ادای احترام به شما همیشه دوست دارم CMA ارائه داد. این کار را به رکورددار فعلی کشور واگذار کنید تا یکی از معروف ترین (و اغلب پوشش داده شده) آهنگ های دالی پارتون را انجام دهد. در جریان برنامه چهارشنبه شب CMA Presents I Will Always Love You: A Celebration of Dolly Parton، الا لنگلی به او پیشنهاد کرد که آهنگ 1974 \"Jolene\" را انتخاب کند که این ستاره اولین بار در کنسرت Auburn، آلاباما، کمی پس از مرگ پارتون اجرا کرد. پس از مقدمه‌ای از کیتی پری (که پارتون را طرح اولیه نامید)، لنگلی نسخه‌ای از کلاسیک را ارائه کرد که ادای احترامی به تنظیم اصلی پارتون داشت. این یک آهنگ مناسب برای لنگلی است، که رکورد بیلبورد هات 100 را با آهنگ Choosin’ Texas شکست، آهنگی که در مورد از دست دادن مردش به نیرنگ های دیگری بود – نه چندان بی شباهت به فرضیه «جولین»، که پارتون وقتی دید همسرش، کارل دین، با یک زن جذاب در بانک تعامل داشت، نوشت. پارتون در سال 2008 به NPR گفت که او عاشق شوهر من شد. و او فقط عاشق رفتن به بانک بود، زیرا او به او توجه زیادی داشت. مثل یک شوخی بین ما بود - وقتی می‌گفتم، جهنم، شما زمان زیادی را در بانک می‌گذرانید. من باور نمی کنم که ما چنین پولی داشته باشیم. بنابراین واقعاً یک آهنگ بی گناه در اطراف است، اما مانند یک آهنگ وحشتناک به نظر می رسد. داستان‌های پرطرفدار جان اندرسون، تالار مشاهیر موسیقی کانتری با صدایی بی‌گمان، مرده در 71 املاک آرون کارتر با نسخه‌های زاناکس با Walgreens به توافق رسید زک براون دونفری احساسی با دالی پارتون در طول مراسم ادای احترام اللانگلی به دالی پارتون ادای احترام کرد."}, {"source": "Hollywood Reporter", "title": "Chuck Lorre Talks David Ellison Optimism, Scientology and the Perks (Really!) of Working for Roseanne Barr", "link": "https://www.hollywoodreporter.c upt به عنوان یک شرکت کانادایی سابقه ای در تولیدات مشترک بین المللی، تامین مالی تولید و بهره برداری از مشوق های مالیاتی و سایر یارانه های پول نرم برای ساخت مستندهای خود دارد."}, {"source": "Hollywood Reporter", "title": "A Search for His Biological Father Led to a Top Podcast — and an Endorsement From Ira Glass", "link": "https://www.hollywoodreporter.com/business/digital/sayre-quevedo-podcast-reaching-out-ira-glass-1236737522/", "summary": "In 'Reaching Out,' Sayre Quevedo has \"invented something completely new,\" according to Glass.", "date_str": "2026-10-22T13:31:25+00:00", "hash": "d0052019ba586313", "title_fa": "جستجوی پدر بیولوژیکی او منجر به یک پادکست برتر شد - و تاییدی از Ira Glass", "summary_fa": "به گفته گلس، Sayre Quevedo در «Reaching Out» «چیزی کاملاً جدید اختراع کرده است. همانطور که آخرین پادکست Sayre Quevedo برای اولین بار پخش شد، او تاییدیه زنگی از Ira Glass دریافت کرد که برخی از برنامه را در This American Life بازی کرد و گفت که Quevedo \"چیزی کاملاً جدید اختراع کرده است.\" پادکست با عنوان Reaching Out با فرضیه کوودو و برادر دوقلویش شروع می شود که سعی می کنند پدر بیولوژیکی خود را که هرگز ندیده بودند و اطلاعات کمی در مورد او داشتند، پیدا کنند. این جست‌وجو با تفسیرهای روزانه‌مانند کوودو در مورد احساس او نسبت به یافتن پدرش و همچنین زندگی‌اش در آستانه 30 سالگی، و گفتگوهای صمیمی با برادر و مادرش در هم آمیخته است که نشان می‌دهد برادران واقعاً چه احساسی نسبت به یکدیگر دارند و چگونه مسیرهایشان از هم جدا شده است. این واقعیت که او اکثر مکالمات زندگی خود را از اواسط 20 سالگی خود ضبط کرده است، در این روند به کوودو کمک می کند، از جمله در طول فرآیند چهار ساله یافتن پدر تولدش. در پایان، این گفتگوها و تامل های خود او در مورد هویت و خانواده و همچنین حذف های روایی و انگیزه های ذکر شده او در بیان داستان، به محور اصلی پادکست تبدیل می شود. گلس در توضیح این برنامه گفت: «نمی‌دانم پادکست دیگری شنیده‌ام که سعی می‌کند زندگی یک فرد را به همان اندازه کامل به تصویر بکشد، و دقیقاً چه احساسی دارد زنده بودن در حال حاضر». این مجموعه شش قسمتی در 16 سپتامبر از استودیوی Futuro با مشارکت KCRW آغاز شد و قبلاً جایزه خاطرات صوتی جشنواره فیلم ترایبکا را دریافت کرده است."}, {"source": "Hollywood Reporter", "title": "Italy’s Movie and TV Spending Drops Amid Tax Incentive Uncertainty", "link": "https://www.hollywoodreporter.com/business/business-news/italian-content-investment-2025-1236738051/", "summary": "The country’s audiovisual sector saw its first inwards investment drop since 2018, the 8th annual APA report revealed at the MIA Market in Rome.", "date_str": "2026-10-22T13:21:47+00:00", "hash": "05171ec75de3555a", "title_fa": "کاهش هزینه های فیلم و تلویزیون ایتالیا در میان عدم قطعیت مشوق های مالیاتی", "summary_fa": "هشتمین گزارش سالانه APA در بازار MIA در رم نشان داد که بخش سمعی و بصری این کشور اولین کاهش سرمایه گذاری داخلی خود از سال 2018 را تجربه کرد. گزارش سالانه APA که در بازار MIA در رم منتشر شد، نشان داد که سرمایه‌گذاری محتوای داخلی سینما، تلویزیون و ویدیو بر اساس تقاضا در ایتالیا در سال 2025 برای اولین بار از سال 2018 کاهش یافت. طبق گزارش APA، انجمن تولیدکنندگان سمعی و بصری ایتالیا، سرمایه‌گذاری کلی محتوای سمعی و بصری در سال گذشته در مقایسه با آمار سال 2024، 7.4 درصد کاهش یافت و به 2 میلیارد یورو (2.24 میلیارد دلار) رسید. این کاهش در بحبوحه تغییرات اساسی دولت در سیستم اعتبار مالیاتی ایتالیا برای تولیدکنندگان مستقل و مخاطبان محلی رخ داد که از پخش‌کننده‌های تلویزیونی خطی سنتی به پلتفرم‌های پخش نوظهور تغییر مسیر دادند. آخرین گزارش APA همچنین در برابر پس‌زمینه صنعت ایتالیایی ارائه می‌شود که با صفحه‌نمایش‌هایی در هر اندازه و ارزش جدیدی که روی IP اصلی قرار می‌گیرد، سر و کار دارد، زیرا داستان‌نویسان پلتفرم‌های جدیدی را برای دستیابی به مخاطبان پیدا می‌کنند. بر اساس گزارش APA، تولیدات فیلمنامه ای ایتالیایی برای پلتفرم های تلویزیون و VOD شاهد کاهش سرمایه گذاری داخلی خود به 122 میلیون یورو (137 میلیون دلار) بودند، در حالی که تولید داستانی سال گذشته به 740 میلیون یورو (830 میلیون دلار) کاهش یافت. عامل اصلی مؤثر بر انعطاف‌پذیری بخش، عدم اطمینان پیرامون چارچوب بودجه عمومی، از میزان منابع موجود گرفته تا معیارهای واجد شرایط بودن و زمان‌بندی درخواست است. این وضعیت توانایی تولیدکنندگان را برای برنامه‌ریزی از پیش مختل می‌کند، هزینه‌های تامین مالی را افزایش می‌دهد و حاشیه‌ها را کاهش می‌دهد، فشار بر همه شرکت‌ها، به‌ویژه کسب‌وکارهای کوچک‌تر، با پیامدهای نقدینگی و ظرفیت سرمایه‌گذاری که با گزارش APA نشان می‌دهد."}, {"source": "Hollywood Reporter", "title": "Yes, ‘Heated Rivalry’ Is Really Headed to Movie Theaters", "link": "https://www.hollywoodreporter.com/tv/tv-news/heated-rivalry-theatrical-release-regal-amc-cinemark-1236737798/", "summary": "The hit hockey romance series will have special marathon screenings at cinemas around the world including Regal, AMC and Cinemark in the U.S.", "date_str": "2026-10-22T13:00:00+00:00", "hash": "dad9d82c562a8df3", "title_fa": "بله، «رقابت داغ» واقعاً به سینماها می رود", "summary_fa": "سریال عاشقانه هاکی موفق نمایش های ماراتن ویژه ای در سینماهای سراسر جهان از جمله Regal، AMC و Cinemark در ایالات متحده خواهد داشت. آیا امیدوار بودید شین هالندر و ایلیا روزانوف را روی پرده بزرگ ببینید؟ شما خوش شانس هستید - پخش کننده Sphere Abacus صبح پنجشنبه اعلام کرد Heated Rivalry، سریال عاشقانه هاکی کانادایی موفق، رسماً برای نمایش محدود ماراتن نامزدی راهی سینماها می شود. سریال اصلی Crave که از HBO Max در ایالات متحده پخش می‌شود، سالگرد یک سالگی خود را کمی زودتر جشن می‌گیرد و نمایش تمام شش قسمت از فصل اول در 6 نوامبر آغاز می‌شود. Sphere Abacus، شرکت Bell Media که به ارائه بین‌المللی نمایش کمک کرد، برای اکران با Regal Cinemas در ایالات متحده همکاری کرد. اطلاعیه روز پنجشنبه پس از گمانه زنی ها در شبکه های اجتماعی در طول هفته منتشر شد. داستان‌های مرتبط رقابت شدید سبک زندگی در رسانه‌های فیزیکی شامل نسخه ویژه بلو-ری و دی‌وی‌دی بررسی یاگا: کری آن ماس و هادسون ویلیامز در برنامه جذاب اما پخته نشده جنایات مدرن و فولکلور باستانی AMC+ از 6 نوامبر تا نوامبر. در 30، طرفداران سریال می‌توانند این سریال را در سه قسمت نمایش‌های زوجی ببینند: قسمت‌های یک و دو (بازیکنان و المپیک)، قسمت‌های سوم و چهارم (شکارچی و رز) و قسمت‌های پنجم و ششم (من به هر چیزی باور خواهم کرد و کلبه). قیمت بلیط برای هر نمایش 9.99 دلار خواهد بود. Regal ای 2\"، \"Andaz Apna Apna 2\" را در جشنواره فیلم سنگاپور به اشتراک می گذارد.", "summary_fa": "عامر خان روز پنج‌شنبه در جشنواره بین‌المللی فیلم سنگاپور روی صحنه از کار افتاد، زیرا به یاد می‌آورد که در دوران قرنطینه کووید-19 متوجه شده بود که سه دهه کار بی‌وقفه سال‌ها برای او در کنار خانواده‌اش هزینه داشته است. سوپراستار بالیوود، که توسط کارگردان هنگ کنگی، پیتر چان هو سان، جایزه آیکون صفحه جشنواره را به او اعطا کرد، همچنین روشن کرد [ ] لحظه احساسی اواخر عصر فرا رسید، زمانی که از خان در مورد ضعیف ترین نقطه سفرش سوال شد. او خود را به عنوان یک معتاد مادام العمر توصیف کرد که می خورد، می خوابید و فیلم می دید و می گفت که خانواده اش همیشه آنقدر درک داشته اند که او را تنها بگذارند. محبوب در Variety وقتی در کووید نشسته بودم و داشتم فکر می کردم، گفتم، می دانید، حدود 30 سال از زندگی من می گذرد. و اشکالی ندارد که مثل یک دیوانه کار کنید، یک سال، دو سال، پنج سال کاملاً وسواس کاری که انجام می دهید. اما اگر 30 سال ادامه داشته باشد، منظورم این است که شما روابط خود را از دست داده اید. بچه های شما بزرگ شده اند، آنها اکنون بالغ شده اند. خان گفت، بنابراین احساس فقدان عمیقی کردم. او مکث کرد، شکست خورد، عذرخواهی کرد و خودش را جمع کرد در حالی که حضار تشویق شدند. یکی از حضار یک جعبه دستمال کاغذی به او داد. خان در حالی که اشک‌هایش را پاک می‌کرد، گفت که این تجربه او را مجبور به ایجاد یک تغییر اساسی کرد و در چهار سال گذشته او عمداً برای خانواده و دوستان نزدیکش وقت گذاشته است. او گفت: خیلی خوشحالم که این فکر در 56 سالگی به ذهنم خطور کرد و نه در 86 سالگی، زمانی که واقعاً برای انجام کاری دیر شده بود. در یک یادداشت سبک تر، از"}, {"source": "Variety", "title": "Comcast Plans Major Layoffs as It Preps for NBCU Spin-Off, Sees $1 Billion-Plus Restructuring Charge in Q4", "link": "https://variety.com/2026/tv/news/comcast-layoffs-nbcuniversal-spin-off-1-billion-restructuring-charge-1236920356/", "summary": "Comcast is gearing up for significant job cuts in its cable and telecom business in the coming weeks, as the media conglomerate restructures ahead the expected spin-off of NBCUniversal in 2027. On the company s third-quarter 2026 earning call, CFO Jason Armstrong said Comcast expects to take a restructuring charge of more than $1 billion in [ ]", "date_str": "2026-10-22T14:10:13+00:00", "hash": "ff17e78e8841d734", "title_fa": "Comcast در حالی که برای اسپین آف NBCU آماده می شود، اخراج های عمده ای را برنامه ریزی می کند و هزینه بازسازی به اضافه 1 میلیارد دلار را در سه ماهه چهارم می بیند.", "summary_fa": "Comcast در حال آماده شدن برای کاهش مشاغل قابل توجه در تجارت کابلی و مخابراتی خود در هفته های آتی است، زیرا این شرکت رسانه ای در آستانه انتشار مورد انتظار NBCUniversal در سال 2027 بازسازی می شود. جیسون آرمسترانگ، مدیر مالی شرکت، در تماس با کسب درآمد سه ماهه سوم 2026 گفت که Comcast انتظار دارد هزینه بازسازی بیش از 1 میلیارد دلار را در [] بپذیرد. داستان‌های مرتبط مایکل جکسون در مستند Super Bowl که به Hulu و ESPN می‌آید، به گفته دو منبع آگاه، دامنه اخراج‌های Comcast هنوز مشخص نشده است و تیم‌های فردی در حال ارزیابی تأثیر آن هستند. در حال حاضر، انتظار می‌رود که اخراج‌ها بر بخش کابل Comcast تأثیر بگذارد، نه بخش‌های NBCU. محبوب در ورایتی آرمسترانگ گفت که تجدید ساختار برای جلوتر از اقدامات هزینه ای است که به نوعی شروع سریع در سال 2027 را تسهیل می کند و با هدف تقویت موقعیت رقابتی ما انجام می شود. وی ادامه داد: ما به آن به عنوان یک اقدام کاهش هزینه نگاه نمی کنیم. این توانایی ساده‌سازی برای حرکت سریع‌تر، چابک‌تر بودن در تصمیم‌گیری است، و فکر می‌کنم واقعاً ظرفیت ایجاد می‌کند، می‌دانید، برای سرمایه‌گذاری برای رشد. بخشی از ابتکارات رشد Comcast شامل افزایش فشار آن به سمت خدمات بی سیم و خدمات تجاری است. برای سه ماهه سوم، درآمد کسب و کار اتصالات و پلتفرم های Comcast با 2.7 درصد کاهش به 19.66 میلیارد دلار رسید، زیرا شاهد تداوم ضرر خالص مشترکان تلویزیون کابلی و پهنای باند بود. درآمد حاصل از عملیات تلویزیون، فیلم و پارک های موضوعی NBCU با 6.5 درصد افزایش به 10.54 میلیارد دلار رسید."}, {"source": "Variety", "title": "Lego Unveils Daft Punk Set Based on 2007 ‘Alive’ Tour, Short Film Collab Set to ‘Human After All’", "link": "https://variety.com/2026/music/global/daft-punk-lego-set-alive-tour-1236918620/", "summary": "Fans of both Daft Punk and Lego are about to get lucky. The electronic music duo and the toy brick brand have partnered for a new multi-platform collaboration spanning product, content and brand experiences. The partnership includes a Lego set based on the stage design from Daft Punk’s 2007 “Alive” tour, submitted on the toy [ ]", "date_str": "2026-10-22T14:00:00+00:00", "hash": "08f06a03efbeba1a", "title_fa": "لگو از مجموعه دافت پانک بر اساس تور «زنده» سال 2007 رونمایی کرد، گروه فیلم کوتاه مجموعه «بعد از همه انسان»", "summary_fa": "طرفداران دافت پانک و لگو در آستانه خوش شانسی هستند. دوتایی موسیقی الکترونیک و نام تجاری آجر اسباب‌بازی برای همکاری چند پلتفرمی جدید شامل محصولات، محتوا و تجربیات برند شریک شده‌اند. این مشارکت شامل یک مجموعه لگو بر اساس طراحی صحنه از تور «آلایو» دافت پانک در سال 2007 است که در اسباب‌بازی ارسال شده است [ ] اگر محصول یا خدماتی را که به‌طور مستقل بررسی شده را از طریق پیوندی در وب‌سایت ما خریداری کنید، Variety ممکن است کمیسیون وابسته دریافت کند. «کنسرت دافت پانک» که توسط دو پدر و پسری از بلژیک ایجاد شد، برای اولین بار در سال 2020 وارد مسابقه ای با موضوع موسیقی لگو شد و در آنجا برنده جایزه بزرگ شد. از آن زمان تاکنون به 10000 پشتیبانی در Lego Ideas رسیده است، به این معنی که به مرحله بعدی توسعه خواهد رفت. محبوب در Variety این مجموعه بر اساس صحنه هرمی از تور این دو در سال 2007 ساخته شده است. سدریک هروت، مدیر خلاق دفت پانک، گفت: «استیج هرمی یکی از قابل تشخیص‌ترین بیان‌های دنیای بصری دفت پانک است، بنابراین به نظر می‌رسد که این طراحی که توسط طرفداران خلق شده، مرکز این مشارکت باشد. طرفداران همیشه نقش مهمی در داستان دفت پانک داشته‌اند و ما از دیدن این خلاقیت در دنیای لگو هیجان‌زده هستیم. برای راه اندازی این همکاری، لگو و دفت پانک همچنین در یک فیلم 48 ثانیه ای با یکدیگر همکاری کرده اند که در آن این دو در قالب Lego Minifigure با کلاه ایمنی کامل ظاهر می شوند، زیرا آجر قرمز هولوگرافیک را در یک منظره بیابانی مرموز دنبال می کنند. این موسیقی متن بر اساس ادای احترامی به خط بیس از آلبوم 2001 گروه \"Discovery\" و همچنین آهنگ عنوان آلبوم سال 2005 آنها \"Human After All\" است."}, {"source": "Variety", "title": "Egyptian Screenwriter Mariam Naoum on the Struggle for Arab Series to Find Buyers: ‘We’re Suffocating Inside’", "link": "https://variety.com/2026/tv/global/el-gouna-cinegouna-series-arab-tv-mariam-naoum-1236919614/", "summary": "Seasoned Egyptian screenwriter and producer Mariam Naoum sees no shortage of creative talent in Arab television. The harder question is how to give that talent the time, development and routes to market it needs to thrive and build lasting careers. As head of the newly launched CineGouna Series, El Gouna Film Festival’s first development program [ ]", "date_str": "2026-10-22T13:40:00+00:00", "hash": "33cd75ed024a2a10", "title_fa": "مریم نعوم، فیلمنامه‌نویس مصری درباره مبارزه برای سریال‌های عربی برای یافتن خریداران: «ما در داخل خفه می‌شویم»", "summary_fa": "مریم نعوم، فیلمنامه نویس و تهیه کننده باتجربه مصری، استعداد خلاق را در تلویزیون عرب کم نمی بیند. سوال سخت‌تر این است که چگونه به آن استعداد زمان، توسعه و مسیرهایی را که برای شکوفایی و ایجاد مشاغل پایدار به بازار نیاز دارد، اختصاص دهیم. به عنوان رئیس مجموعه تازه راه اندازی شده CineGouna، اولین برنامه توسعه جشنواره فیلم ال گونا [ ] رئیس سری CineGouna به دنبال رفع موانعی است که مانع استعداد نویسندگی در جهان عرب می شود، این حرکت نشان دهنده اولین گسترش رسمی ال گونا به مجموعه است و تلویزیون را به CineGouna، بازوی صنعتی جشنواره وارد می کند. آزمایشگاه افتتاحیه شش هفته‌ای آن، که پیش از جشنواره برگزار شد، شش پروژه را با نویسندگانی که قبل از ارائه آثارشان در جشنواره برای پخش‌کنندگان، تهیه‌کنندگان و کارگردانان، یک مجموعه کتاب مقدس و آزمایشی را توسعه دادند، آغاز کرد. محبوب در تنوع گروه افتتاحیه شامل «ارسال شده از بالا» نوشته دارین شمس‌الدین لبنانی، پروژه‌های مصری «بازاریابی برای مبتدیان»، اثر شیما گوهر، «تا لبه» نوشته ممدوح صلاح و محمد عبد الستار، «ویریم‌رونگهر»، «ویریم‌رونگهر، برخی» است. ساعت» نوشته محمد السید طاها و همچنین رعنا وائل مطر نویسنده سعودی «چرا سواد؟» برای Naoum، سریال‌ها به فرآیند توسعه متفاوتی از فیلم‌ها نیاز دارند، از جریان کار گرفته تا اینکه چگونه پروژه‌ها در نهایت به دست خریداران می‌رسند. پخش جریانی فرصت های جدیدی را برای تلویزیون عربی باز کرده است، اما او خریداران بسیار کمی برای پروژه های در حال توسعه می بیند. او می‌گوید: «شما در جهان عرب، شاید سه یا چهار پلتفرم دارید. آنها نمی‌توانند کل بازار را تامین کنند، بنابراین شما پروژه‌های بیشتری از توان خرید آنها دارید."}, {"source": "Variety", "title": "‘Heated Rivalry’ to Release in Movie Theaters, Two Episodes at a Time", "link": "https://variety.com/2026/tv/columns/heated-rivalry-released-movie-theaters-1236916996/", "summary": "Forget about going to the cottage. “Heated Rivalry” fans will be going to movie theaters in November. Almost a year after the queer hockey romance series premiered in the U.S., Regal will release all six episodes in more than 650 theaters nationwide for a limited run Nov. 6-30. “When a series connects with audiences the [ ]", "date_str": "2026-10-22T13:00:00+00:00", "hash": "11a3568d5c0b0ff8", "title_fa": "«رقابت شدید» برای اکران در سینماها، دو قسمت در یک زمان", "summary_fa": "رفتن به کلبه را فراموش کنید. طرفداران «رقابت داغ» در ماه نوامبر به سینماها خواهند رفت. تقریباً یک سال پس از نمایش سریال عاشقانه هاکی عجیب و غریب در ایالات متحده، Regal هر شش قسمت را در بیش از 650 سینما در سراسر کشور به مدت محدود از 6 تا 30 نوامبر اکران خواهد کرد. هنگامی که یک سریال با مخاطبان ارتباط برقرار می کند، [ ] Regal در بیش از 650 سالن سینمای ایالات متحده، اکران محدود را هدایت می کند. Brooks LeBoeuf، معاون ارشد محتوای ایالات متحده در Regal، پنجشنبه در بیانیه‌ای گفت: «وقتی یک سریال با مخاطبان مانند «رقابت داغ» ارتباط برقرار می‌کند، ما به دنبال راه‌هایی هستیم که آن را به صفحه نمایش بزرگ بیاوریم و به طرفداران دلیلی بدهیم تا با هم آن را تجربه کنند. «نزدیک به یک سال پس از نمایش آن، ما مفتخریم که با شرکای خود کار می کنیم تا فصلی را که طرفداران بارها و بارها تماشا کرده اند به یک رویداد واقعی تئاتر تبدیل کنیم. این فرصتی برای تجلیل از داستان، سازندگان و اجرای آن قبل از ورود فصل 2 در سال 2027 است.\" داستان‌های مرتبط مایکل جکسون در مستند Super Bowl که به Hulu و ESPN می‌آید، بر اساس رمان‌های پرفروش ریچل رید، «رقابت داغ» به دنبال بازیکنان رقیب هاکی شین هلندر (هادسون ویلیامز) و ایلیا روزانوف (کانر استوری) است که مخفیانه عاشق یکدیگر می‌شوند. این سریال به سرعت به یک موفقیت جهانی تبدیل شد و ویلیامز و استوری به دو بازیگر محبوب هالیوود تبدیل شدند. «رقابت داغ» به نویسندگی و کارگردانی ژاکوب تیرنی، که هم اکنون در حال تولید فصل دوم است، فرانسوا آرنو، رابی جی.کی. کریستینا چانگ، کسنیا دانیلا خرلاموا، سوفی نلیس و دیلان والش. محبوب در Variety"}, {"source": "Variety", "title": "JJ Watt Named CBS Sports’ New Lead NFL Analyst in Multiyear Deal", "link": "https://variety.com/2026/tv/news/jj-watt-cbs-sports-lead-nfl-analyst-multi-year-deal-1236919639/", "summary": "Skydance is handing a pretty big NFL ball to JJ Watt. The former defensive end will take on one of the biggest on-air roles in sports after officially being named the new lead NFL analyst for CBS Sports. He is taking the post on a regular basis following the exit of his predecessor, Tony Romo. [ ]", "date_str": "2026-10-22T12:41:50+00:00", "hash": "eb777eecb6673df4", "title_fa": "جی جی وات در قرارداد چند ساله به عنوان تحلیلگر ارشد جدید CBS Sports NFL معرفی شد", "summary_fa": "Skydance توپ NFL بسیار بزرگی را به جی جی وات می دهد. پس از اینکه رسماً به عنوان تحلیلگر اصلی NFL برای CBS Sports معرفی شد، تیم دفاعی سابق یکی از بزرگترین نقش های روی هوا در ورزش را بر عهده خواهد گرفت. او پس از کناره گیری سلف خود، تونی رومو، به طور منظم این پست را بر عهده می گیرد. [ ] وات همچنان بازی های برتر CBS را در کنار جیم نانتز و تریسی ولفسون از جمله فصل آینده که شبکه Super Bowl LXII از آتلانتا را پخش می کند، ادامه خواهد داد. داستان‌های مرتبط مایکل جکسون در فیلم مستند Super Bowl که به Hulu و ESPN می‌آید، دیوید برسون، رئیس گروه ورزشی جهانی در Skydate، CBS در بیانیه‌ای گفت: «من در ردیف اول رشد جی‌جی به‌عنوان یک پخش‌کننده رده‌بالا بودم و او را تماشا کردم که این نقش را درست مثل دوران بازیگری‌اش انجام داد.» او بصیر، سرگرم کننده، پرشور، در آماده سازی دقیق و هم تیمی نهایی است. او ت  سالانه Edinburgh Fringe را دلیل موفقیت جشنواره عنوان می‌کنند. این تصمیم توسط The TV Foundation، یک موسسه خیریه که جشنواره را برگزار می کند، گرفته شده است، که معتقدند این حرکت باعث می شود این رویداد برای جامعه تلویزیونی قابل دسترس تر شود. در استودیو ورسا منچستر - که قبلاً محل استودیوهای نمادین گرانادا و استودیو آویوا بود، که محل برگزاری جشنواره بین‌المللی منچستر و کارخانه بین‌المللی است، برگزار می‌شود. این منطقه میزبان برخی از معروف ترین برنامه های تلویزیونی بریتانیا از جمله «خیابان تاج گذاری»، «چالش دانشگاه» و «خانواده رویل» بوده است. مدیر اجرایی جشنواره، کمبل گلنی، گفت: «با منچستر بزرگ به عنوان خانه جدید ما، ما آماده رشد و تحقق پتانسیل کامل جشنواره در طول سال‌های آینده هستیم، خواه این برنامه را به جلسات عصرانه، مشارکت‌های خلاقانه جدید یا باز کردن درها به روی رویدادها یا نمایش‌های عمومی باز کنیم». ما این پتانسیل را داریم که جشنی در سطح شهر از تلویزیون و صنایع خلاق گسترده‌تر برای نسل آینده ایجاد کنیم.»"}, {"source": "Variety", "title": "Julia Stiles Asked Michelle Williams for Permission to Do Heath Ledger ‘DWTS’ Tribute; David Krumholtz Explains Why He Missed Reunion", "link": "https://variety.com/2026/tv/news/julia-stiles-michelle-williams-heath-ledger-dwts-tribute-1236919624/", "summary": "Ahead of her emotional Dancing With the Stars tribute, Julia Stiles reached out to Heath Ledger s former partner Michelle Williams. Speaking to Extra after the performance — which saw Stiles dance to Frankie Valli s I Can t Take My Eyes Off of You in a sweet homage to her and Ledger s 1999 classic 10 Things I [ ]", "date_str": "2026-10-22T12:33:56+00:00", "hash": "9f95f65e3dbc8ff6", "title_fa": "جولیا استایلز از میشل ویلیامز اجازه خواست تا مراسم ادای احترام هیث لجر «DWTS» را انجام دهد. دیوید کرومهولتز توضیح می دهد که چرا دیدار مجدد را از دست داده است", "summary_fa": "جولیا استایلز قبل از ادای احترام احساسی خود در Dancing With the Stars با شریک سابق هیث لجر میشل ویلیامز تماس گرفت. صحبت کردن با Extra پس از اجرا - که شاهد رقصیدن استایلز با آهنگ I Can t Take My Eyes Off of You از ف     let currentTab = 'persian';
    let searchQuery = '';
    let readArticles = new Set(JSON.parse(localStorage.getItem('read_articles_registry') || '[]'));

    function toFaDigits(n) {
      const f = ['۰','۱','۲','۳','۴','۵','۶','۷','۸','۹'];
      return n.toString().replace(/\d/g, d => f[d]);
    }

    function toggleRead(hash) {
      if (readArticles.has(hash)) {
        readArticles.delete(hash);
      } else {
        readArticles.add(hash);
      }
      localStorage.setItem('read_articles_registry', JSON.stringify(Array.from(readArticles)));
      renderNews();
    }

    function renderNews() {
      const container = document.getElementById('newsContainer');
      const rawItems = data[currentTab] || [];
      
      const filtered = rawItems.filter(item => {
        if (!searchQuery) return true;
        const q = searchQuery.toLowerCase();
        const title = (item.title_fa || item.title || '').toLowerCase();
        const summary = (item.summary_fa || item.summary || '').toLowerCase();
        const source = (item.source || '').toLowerCase();
        return title.includes(q) || summary.includes(q) || source.includes(q);
      });

      const unreadList = [];
      const readList = [];

      filtered.forEach(item => {
        if (readArticles.has(item.hash)) {
          readList.push(item);
        } else {
          unreadList.push(item);
        }
      });

      const sortedItems = [...unreadList, ...readList];

      if (sortedItems.length === 0) {
        container.innerHTML = '<div style="text-align:center; padding: 40px; color: var(--text-muted);">هیچ خبری در این بخش در ۲۴ ساعت گذشته ثبت نشده است.</div>';
        return;
      }

      container.innerHTML = sortedItems.map((item, idx) => {
        const title = item.title_fa || item.title || '';
        const summary = item.summary_fa || item.summary || '';
        const source = item.source || 'منبع خبر';
        const link = item.link || '#';
        const isRead = readArticles.has(item.hash);
        const num = toFaDigits(idx + 1);

        return `
          <article class="news-card ${isRead ? 'is-read' : ''}" id="card-${item.hash}">
            <div class="news-header">
              <span class="news-num">${isRead ? '✓' : num}</span>
              <h2 class="news-title">${title}</h2>
            </div>
            ${summary ? `<p class="news-summary">${summary}</p>` : ''}
            <div class="news-footer">
              <span class="news-source">📌 منبع: ${source}</span>
              <div class="footer-right">
                <button class="btn-mark-read" onclick="toggleRead('${item.hash}')">
                  ${isRead ? '✓ خوانده شد' : '○ علامت خوانده‌شده'}
                </button>
                ${link && link.startsWith('http') ? `<a href="${link}" target="_blank" rel="noopener noreferrer" class="news-link">مطالعه اصل خبر ↗</a>` : ''}
              </div>
            </div>
          </article>
        `;
      }).join('');
    }

    function switchTab(tab, el) {
      currentTab = tab;
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      if (el) el.classList.add('active');
      renderNews();
    }

    function toggleTheme() {
      const html = document.documentElement;
      const current = html.getAttribute('data-theme') || 'dark';
      const next = current === 'dark' ? 'light' : 'dark';
      html.setAttribute('data-theme', next);
      localStorage.setItem('theme', next);
      updateThemeButton(next);
    }

    function updateThemeButton(theme) {
      const icon = document.getElementById('themeIcon');
      const text = document.getElementById('themeText');
      if (theme === 'dark') {
        icon.textContent = '☀️';
        text.textContent = 'حالت روشن';
      } else {
        icon.textContent = '🌙';
        text.textContent = 'حالت تاریک';
      }
    }

    function toggleArchiveModal(show) {
      const modal = document.getElementById('archiveModal');
      if (show) {
        renderArchiveList();
        modal.classList.add('active');
      } else {
        modal.classList.remove('active');
      }
    }

    function renderArchiveList() {
      const listContainer = document.getElementById('archiveListContainer');
      if (!archiveManifest || archiveManifest.length === 0) {
        listContainer.innerHTML = '<div style="text-align:center; padding: 20px; color: var(--text-muted);">هنوز شماره قبلی ثبت نشده است.</div>';
        return;
      }

      listContainer.innerHTML = archiveManifest.map(item => `
        <a href="${item.url}" class="archive-item">
          <div>
            <div class="archive-date-fa">📰 شماره ${item.p_date}</div>
            <div class="archive-date-g">🌍 ${item.g_date}</div>
          </div>
          <span class="archive-arrow">←</span>
        </a>
      `).join('');
    }

    const savedTheme = localStorage.getItem('theme') || 'dark';
    document.documentElement.setAttribute('data-theme', savedTheme);
    updateThemeButton(savedTheme);

    document.getElementById('searchInput').addEventListener('input', (e) => {
      searchQuery = e.target.value.trim();
      renderNews();
    });

    renderNews();
  </script>
