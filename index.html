ا مشاهده کنید اگر نمی‌توانید به پارک متروپولیتن زیلکر در تگزاس بروید، Austin City Limits برای پخش زنده در دیزنی+ و Hulu در سراسر جشنواره سه روزه موسیقی که از جمعه (2 اکتبر) شروع می‌شود، در دسترس است. برنامه پخش زنده را اینجا ببینید. مرتبط فهرست کامل کنسرت های کی پاپ جاری 2026 (در حال به روز رسانی) پنج شنبه شب فوتبال 2026: کجا پخش زنده پیتسبورگ استیلرز در مقابل. بازی آنلاین کلیولند براونز آنلاین رایگان الکس وارن ماشین دود را برای اجرای Cry Wolf در Fallon : تماشا کنید دریافت Disney+ و طرح های Hulu از 12.99 دلار در ماه شروع می شود. برنامه های Disney+ از 12.49 دلار در ماه برای طرح پشتیبانی شده از آگهی شروع می شود، در حالی که می توانید با پرداخت 21.49 دلار در ماه بدون آگهی بروید. برای محتوای بیشتر، Disney+ یک بسته نرم افزاری با Hulu ارائه می دهد که از 12.99 دلار در ماه شروع می شود (فقط 50 سنت بیشتر برای اضافه کردن Hulu). می‌توانید ESPN Unlimited را به Disney+ و Hulu اضافه کنید که از 35.99 دلار در ماه شروع می‌شود. در همین حال، اگر به ESPN Unlimited نیستید، می‌توانید HBO Max را با قیمت‌هایی که از 21.99 دلار در ماه شروع می‌شود، به Disney+"}, {"source": "Billboard", "title": "Becky G to Join 2026 Billboard Latin Music Week for Exclusive Superstar Q&A", "link": "https://www.billboard.com/music/latin/becky-g-2026-latin-music-week-superstar-q-and-a-1236352524/", "summary": "Becky G has officially joined the lineup for 2026 Billboard Latin Music Week for an exclusive Superstar Q A, Billboard announced Friday (Oct. 2). Following the release of her fifth studio album Baraja Bendita , which debuted at No. 2 on Billboard s Top Latin Pop Albums chart, and her 2026 Latin Grammy nomination for song of the year as the songwriter of Santana’s “Mi Gran Amor,” Becky will take center stage at Billboard Latin Music Week, which returns to the iconic Faena Forum in Miami Beach from Oct. 19-22. Related Billboard Latin Music Week 2026 Press Conference: Best Photos Grupo Frontera, Santos Bravos, Mau y Ricky, Anuel AA More to Join Billboard Latin Music Week 2026: See the Full Program Maluma, Quevedo, Bebeshito More Set for Billboard Latin Music Week 2026 The Mexican-American superstar joins a star-studded lineup that includes Anuel AA, Greeicy, Jay Wheeler, Jessi Uribe, Kany García, Lola Índigo, Maluma, Mau y Ricky, Paola Jara, Pitbull, Quevedo, RaiNao, Rawayana, Ryan Castro, Trueno, Zhamira and many more. Since her music breakthrough in the mid-2010s, Becky G has solidified her position as one of the most prominent voices in Latin pop, captivating a global audience across languages, genres and cultures. The multiplatinum singer, songwriter, entrepreneur and activist has amassed over 28 billion global streams and earned six Latin Grammy nominations, an Oscar nomination, a Billboard Music Award, and accolades from the American Music Awards, Latin American Music Awards and E! People’s Choice Awards. In 2025, she was included in TIME100 Next, which recognizes emerging leaders shaping the future across multiple industries. Becky has evolved as an artist while staying deeply connected to her Mexican-American roots. Her 2023 album ESQUINAS debuted at No. 3 on Billboard s Top Regional Mexican Albums chart and earned her a Latin Grammy nomination for the track “Por El Contrario.” Her follow-up set, ENCUENTROS , debuted at No. 7 on the Top Latin Albums chart, while her most recent release, Baraja Bendita , debuted at No. 2 on Top Latin Pop Albums in August of this year. The 17-track album — which features singles like “EPA,” “Marathon” and “Patrona” — bridges Becky G (the artist) and Rebbeca (her real name) as a musical symbol of duality, ownership and the freedom to exist fully without contradiction. “It’s about trusting myself enough to stop choosing between different parts of who I am,” she said in a statement then. “For so long, people wanted to defi", "date_str": "2026-10-02T13:00:00+00:00", "hash": "4115e57bd8278846", "title_fa": "Becky G برای پیوستن به هفته موسیقی لاتین بیلبورد 2026 برای پرسش و پاسخ انحصاری سوپراستار", "summary_fa": "بیلبورد روز جمعه (2 اکتبر) اعلام کرد که Becky G رسما به صفوف هفته موسیقی لاتین Billboard 2026 برای یک Superstar Q A انحصاری پیوسته است. پس از انتشار پنجمین آلبوم استودیویی او Baraja Bendita، که در شماره شماره بکی در رتبه دوم جدول برترین آلبوم‌های پاپ لاتین بیلبورد و نامزدی گرمی لاتین ۲۰۲۶ او برای آهنگ سال به‌عنوان ترانه‌سرا «Mi Gran Amor» از سانتانا، در هفته موسیقی لاتین بیلبورد که از ۱۹ تا ۲۲ اکتبر به انجمن نمادین Faena در ساحل میامی بازمی‌گردد، در مرکز صحنه خواهد بود. کنفرانس مطبوعاتی مرتبط با هفته موسیقی لاتین بیلبورد 2026: بهترین عکس‌ها، گروه موسیقی لاتین، سانتوس براووس، مائو وی ریکی، آنوئل AA موارد بیشتری برای پیوستن به هفته موسیقی لاتین بیلبورد 2026: برنامه کامل Maluma، Quevedo، Bebeshito را ببینید مجموعه بیشتر برای Billboard Music Week 2026 ترکیبی که شامل Anuel AA، Greeicy، Jay Wheeler، Jessi Uribe، Kany García، Lola Índigo، Maluma، Mau y Ricky، Paola Jara، Pitbull، Quevedo، RaiNao، Rawayana، Ryan Castro، Trueno، Zhamira و بسیاری دیگر می شود. از زمان پیشرفت موسیقی خود در اواسط دهه 2010، بکی جی جایگاه خود را به عنوان یکی از برجسته ترین صداهای پاپ لاتین تثبیت کرد و مخاطبان جهانی را در زبان ها، ژانرها و فرهنگ ها مجذوب خود کرد. این خواننده، ترانه سرا، کارآفرین و فعال مولتی پلاتین، بیش از 28 میلیارد استریم جهانی را جمع آوری کرده و شش نامزدی گرمی لاتین، یک نامزدی اسکار، یک جایزه موسیقی بیلبورد و تمجید از جوایز موسیقی آمریکا، جوایز موسیقی آمریکای لاتین و E! جوایز انتخاب مردم در سال 2025، او در TIME100 Next گنجانده شد که رهبران نوظهوری را که آینده را در صنایع مختلف شکل می‌دهند، شناسایی می‌کند. بکی به عنوان یک هنرمند تکامل یافته است و در عین حال عمیقاً با ریشه های مکزیکی-آمریکایی خود ارتباط دارد. آلبوم ESQUINAS او در سال"}, {"source": "Billboard", "title": "Sienna Spiro Breaks Down Her ’60s Glam Inspiration, Insecurity & Finding Confidence | Billboard News Special", "link": "https://www.billboard.com/video/sienna-spiro-billboard-news-special/", "summary": "Sienna Spiro gets real about insecurity, confidence, and building an “elevated” version of herself to step onstage. In this Billboard interview, Sienna Spiro talks glam, songwriting, and protecting her voice while gearing up for tour. Sienna shares how her love of ’60s glamour helped shape her look, why she prefers writing songs that capture a universal feeling (instead of “spilling the tea”), and what it’s like having a mostly young female fanbase that makes her feel seen. She also opens up about having vocal nodules, going on vocal rest, and the routines (tea, honey, sprays, warming up) that help her take care of her voice. Plus, she breaks down the meaning behind her lyric “I wish I was real” from “Pure,” and explains why being recognized as a songwriter matters just as much as compliments about her voice. Sienna Spiro So I ve always been really insecure and, like, self-conscious, and struggled with the way I looked, and this was before I even, you know, was doing this. I had this since a really young age. Hannah Dailey Hi, I m Hannah Dailey with Billboard, and we re here today with Sienna Spiro. Hello. Um, you look gorgeous. Sienna Spiro Thank you. You look gorgeous. Hannah Dailey Thank you. Um, that honestly is a great transition into my first question. Sienna Spiro Oh, tell me. Hannah Dailey We talked a little bit about your look. Sienna Spiro Mm-hmm. Hannah Dailey And it s very high glam. Can you tell me again about how you enjoy having this enhanced version of yourself to step into, how it gives you confidence? And also, you mentioned that you like that it sort of separates work, professional life, versus just personal life. Sienna Spiro You know, sh happens in your life, and sometimes you can t always help the way you feel. You know, I m a 20-year-old girl. Stuff goes on. And having something that feels very much like myself, but just elevated and enhanced that I can put on, just allows me to just get on stage, feel confident, feel I guess feeling confident is really the thing. If I wasn t confident, I wouldn t be able to do my job. But I love it. You know, I ve loved the 60s for my whole life, and the moment I found how I wanted to be and be presented and I wanted to look, I just, it just, yeah, I loved it. Watch the full video above!", "date_str": "2026-10-02T13:00:00+00:00", "hash": "767a3b1d2e83a134", "title_fa": "سینا اسپیرو الهام، ناامنی و یافتن اعتماد به نفس دهه 60 خود را شکست می دهد | ویژه اخبار بیلبورد", "summary_fa": "سینا اسپیرو در مورد ناامنی، اعتماد به نفس، و ساختن یک نسخه «بالا» از خود برای پا گذاشتن روی صحنه واقعی می‌شود. در این مصاحبه بیلبورد، سینا اسپیرو در حالی که برای تور آماده می‌شود، از گلم، ترانه سرایی و محافظت از صدای خود صحبت می‌کند. سینا به اشتراک می‌گذارد که چگونه عشقش به زرق و برق دهه 60 به شکل‌گیری ظاهرش کمک کرد، چرا ترجیح می‌دهد آهنگ‌هایی بنویسد که حسی جهانی را به تصویر بکشد (به‌جای «ریختن چای»)، و اینکه داشتن یک طرفداران بیشتر زن جوان که باعث می‌شود او احساس دیده شدن کند، چگونه است. او همچنین درباره داشتن ندول‌های صوتی، استراحت صوتی و روتین‌هایی (چای، عسل، اسپری‌ها، گرم کردن بدن) صحبت می‌کند که به او کمک می‌کند از صدایش مراقبت کند. بعلاوه، او معنای پشت ترانه اش «کاش من واقعی بودم» را از «پاور» تجزیه می کند و توضیح می دهد که چرا شناخته شدن به عنوان یک ترانه سرا به اندازه تعریف و تمجید از صدایش اهمیت دارد. Sienna Spiro بنابراین من همیشه واقعاً ناامن و مانند خودم هوشیار بوده‌ام و با ظاهرم دست و پنجه نرم می‌کردم، و این قبل از انجام این کار بود. من این را از سنین جوانی داشتم. هانا دیلی سلام، من هانا دیلی با بیلبورد هستم و امروز با سینا اسپیرو اینجا هستیم. سلام. اوم، شما زیبا به نظر می رسید. سینا اسپیرو متشکرم. تو زرق و برق دار به نظر میرسی هانا دیلی ممنون اوم، صادقانه بگویم که این یک انتقال عالی به سوال اول من است. سینا اسپیرو اوه، به من بگو. هانا دیلی ما کمی در مورد ظاهر شما صحبت کردیم. سینا اسپیرو مم-هوم. هانا دیلی و بسیار جذاب است. آیا می‌توانید دوباره به من بگویید که چگونه از داشتن این نسخه پیشرفته از خودتان برای قدم گذاشتن در آن لذت می‌برید، چگونه به شما اعتماد به"}, {"source": "Billboard", "title": "Heartbreakers Drummer Stan Lynch Remembers His ‘North Star’ Tom Petty on ‘High Flying Bird’", "link": "https://www.billboard.com/music/rock/heartbreakers-stan-lynch-tom-petty-song-high-flying-bird-1236352723/", "summary": "As the Tom Petty and the Heartbreakers 50th anniversary commemoration gets into gear, original drummer Stan Lynch is adding his own tribute with High Flying Bird, a sentimental song and video dedicated to his late musical cohort. The song is something Lynch started years ago, while the video is comprised of photos and home movies he unearthed about a year ago and had an archivist catalog. I didn t really think about the whole 50th kerfuffle, Lynch, 71 who left the Heartbreakers after their Bridge School Benefit performance during October of 1994 in Mountain View, Calif. tells Billboard via Zoom from his home studio near Gainesville, Fla., where he grew up. I was just kind of condensing things hundreds of Polaroids, lots of movies just from that era that I d never seen before. At the time I had this song I had started years ago that was evoking my feelings towards Tom, but that s such a touchy, personal thing. I wasn t sure I would ever want to put out a song with that kind of through-line. But then when I saw all the (archival material), I kind of went, Hey .' Coincidentally, Lynch was contacted around the same time by Petty s eldest daughter Adria, who oversees her father s legacy and archives and was in the process of putting together the upcoming Origins 1971-1978 box set (out Nov. 6). She invited Lynch to participate in the project and others she had planned. I love that Adria has become my friend, he says, because when I was in the band she was a little girl. I re-meet her and she s a woman and she s doing all of this to keep (Heartbreakers) things together and keep finding music. And having her as a filter has been great. I showed her the video, Hey, would you like to see this?, and she immediately pinged me back and said, It s cool. When I got that, really, I was already done. Mission accomplished. In the poetic, melodic High Flying Bird recorded with members of Speaker Wars, one of his current bands Lynch converses with Petty, asking What do you see from way up there/What s it like in that soft clean air? And he certainly pulls some heartstrings later in the song when he sings, I know you re out there flying round/Hiding in the broken clouds/Will you be singing when it s my turn? This is cleaning, Lynch explains. I was writing it for me. I wanted to hear myself, how do I feel about a brother I lost? It came off my skin organically. At this point in my life I follow my joy and my creativity, and I follow friendship. It was important for me to do som", "date_str": "2026-10-02T13:00:00+00:00", "hash": "bd5749441c7886b3", "title_fa": "استن لینچ، درامر Heartbreakers، «ستاره شمالی» خود را تام پتی در «پرنده بلند پرواز» به یاد می آورد.", "summary_fa": "در حالی که مراسم بزرگداشت پنجاهمین سالگرد تام پتی و Heartbreakers شروع می شود، استن لینچ، درامر اصلی، ادای احترام خود را با High Flying Bird، یک آهنگ و ویدیوی احساسی که به گروه موسیقی درگذشته او اختصاص داده شده است، اضافه می کند. این آهنگ چیزی است که لینچ سال‌ها پیش شروع کرده است، در حالی که ویدیو شامل عکس‌ها و فیلم‌های خانگی است که او حدود یک سال پیش کشف کرده و یک کاتالوگ بایگانی دارد. من واقعاً به کل 50مین بازی فکر نمی‌کردم، لینچ، 71 ساله که پس از اجرای بریج مدرسه بنفیت در اکتبر 1994 در Mountain View، کالیفرنیا، گروه Heartbreakers را ترک کرد. من فقط داشتم صدها پولاروید را متراکم می‌کردم، فیلم‌های زیادی از آن دوران که قبلاً هرگز ندیده بودم. در آن زمان که این آهنگ را داشتم سالها پیش شروع کرده بودم که احساسات من را نسبت به تام برانگیخت، اما این یک چیز حساس و شخصی است. مطمئن نبودم که هرگز بخواهم آهنگی با چنین خطی منتشر کنم. اما وقتی همه (مواد آرشیوی) را دیدم، به نوعی رفتم، هی . به طور تصادفی، در همان زمان، آدریا، دختر بزرگ پتی، که بر میراث و آرشیو پدرش نظارت می‌کرد و در حال جمع‌آوری مجموعه جعبه‌های آتی Origins 1971-1978 (از 6 نوامبر) بود، با لینچ تماس گرفت. او از لینچ دعوت کرد تا در پروژه و دیگرانی که برنامه ریزی کرده بود شرکت کند. او می گوید من دوست دارم که آدریا دوست من شده است، زیرا زمانی که من در گروه بودم او یک دختر کوچک بود. من دوباره او را ملاقات می کنم و او یک زن است و او همه این کارها را انجام می دهد تا چیزهای (Heartbreakers) را کنار هم نگه دارد و به یافتن موسیقی ادامه دهد. و داشتن او به عنوان یک فیلتر عالی بوده است. من"}, {"source": "Billboard", "title": "Kid Rock Searching For Salvation on Upcoming ‘Halfway to Jesus’ Christian Rock Album Featuring Eminem Collab", "link": "https://www.billboard.com/music/rock/kid-rock-halfway-to-jesus-christian-album-eminem-collab-1236352874/", "summary": "Kid Rock has seen the light and is ready to proclaim Jesus Is King. The rapper-turned-rocker-turned-country-now-Christian singer begs for forgiveness for all his blasphemy on the collection s Bob Seger-coded gospel rock first single James 1:17 (Jesus Is King), the first salvo from the singer s upcoming Christian music album, Halfway to Jesus . Related Kid Rock Brags About Regularly Drunk-Dialing Donald Trump, Having a Front Row Seat to the Greatest S t Show on Earth A Timeline of Kid Rock s Controversies MAGA Festival Featuring Kid Rock Canceled After Just 6 VIP Tickets Sold: Rich People, as a Whole, Suck Rock announced the 17-track album on Thursday (Oct. 1), revealing that it features a collaboration with fellow Detroit MC Eminem on 7 Sins, as well as help from Rascal Flatts Gary LeVox and Jimmie Allen on the title track. The collection, due out on Oct. 17, appears to find Rock fully embracing his religious side on songs titled Why Don t You Look Into Jesus, Water Into Wine, Me and Jesus, God Is Good, High Road and what appears to be a cover of Lee Greenwood s God Bless the USA to close the set. The cover leaves little to interpret, as it depicts Rock (born Robert James Ritchie) literally halfway up a mountain on his journey to reach a glowing crucifix, with the devil hot on his heels. In an X video promoting the album , Rock solemnly recited the gospel rock single s lyrics about redemption and salvation, intoning, I have wandered through the ages/ 418", "link": "https://deadline.com/2026/10/room418-microdrama-app-night-of-the-living-dead-1237145205/", "summary": "EXCLUSIVE: A newly-established microdrama business geared towards horror is adapting genre classic Night of the Living Dead ahead of its full launch. L.A.-based Room418 is positioning itself as a studio and platform that puts vertical-first originals at the center of a dedicated destination for horror fans, alongside curated programming in vertical, horizontal and mixed formats. [ ]", "date_str": "2026-10-02T13:00:00+00:00", "hash": "6376957991de0b28", "title_fa": "میکرودرام عمودی «Night Of The Living Dead» برای App Room418 با محوریت وحشت آماده شده است", "summary_fa": "انحصاری: یک تجارت میکرودرام تازه تاسیس که به سمت ترس طراحی شده است، ژانر کلاسیک Night of the Living Dead را قبل از راه اندازی کامل خود اقتباس می کند. Room418 مستقر در لس آنجلس، خود را به عنوان یک استودیو و پلتفرم قرار می دهد که نسخه های اصلی عمودی را در مرکز یک مقصد اختصاصی برای طرفداران ترسناک، در کنار برنامه های مدیریت شده در فرمت های عمودی، افقی و ترکیبی قرار می دهد. [ ] دیلن پست نیکوف، مدیر اجرایی سابق Blink49 Studios، CBC و Shaftesbury به عنوان یکی از بنیانگذاران و مدیرعامل اتاق 418 را رهبری می کند. Postnikoff، متخصص ارتباطات و بازاریابی که به شکل دهی پروفایل های بین المللی Schitt s Creek و Anne With an E کمک کرد، از ژوئن سال گذشته در سازنده Wild Cards Blink49 کار می کند. با ترس از سازندگان نوظهور در حال حاضر یکی از داستان های سال در فیلم و تلویزیون از طریق موفقیت های Curry Barker's Obsession و Kane Parsons Backrooms، Room418 به دنبال این است که به این جذابیت دست یابد. به این ترتیب، در حال برنامه ریزی برای کار با خلاقانی است که در Wattpad و پلتفرم های دیجیتال موفق شده اند. تماشا در آخرین مهلت یک نسخه بتای برنامه Room418 فقط با دعوتنامه در پاییز امسال و پیش از راه اندازی تجاری راه اندازی می شود و دارای فهرستی از محتوای ترسناک دارای مجوز است. ده پروژه اصلی و اقتباس شده انتخاب شده اند و همچنین در حال توسعه هستند. به طور قابل‌توجهی در لوح توسعه، تصویری دوباره از فیلم ترسناک «شب مردگان ن، مدیر ارشد بی‌بی‌سی، زمانی که اعتراف کرد که یک قسمت کاملاً ساخته‌شده توسط هوش مصنوعی از Doctor Who برای او فرستاده شده است، برای اینکه از تیتر خبر خارج نشود، ابروها را بالا برد. حکم او بسیار خوب بود و باعث شد کمیسرهای بی‌بی‌سی در میان جمعیت، قهوه صبح خود را خفه کنند. واقعیت این است که فناوری اینجا باقی مانده است و کارشناسان مسئول به وضوح می خواهند در مورد مزایای آن واقع بین باشند. ممکن است خلاقیت ها"}, {"source": "Deadline", "title": "Penelope Ann Miller, Otmara Marrero Film ‘Made Clean’ First Project For Nashville-Based Cinema Country", "link": "https://deadline.com/2026/10/penelope-ann-miller-otmara-marrero-made-clean-film-1237145272/", "summary": "EXCLUSIVE: Filmmaker Seth Christian, whose previous producer credits include the 2020 crime drama Echo Boomers starring Patrick Schwarzenegger and Michael Shannon, has launched Cinema Country. The Nashville-based independent production company is dedicated to human-centered storytelling and socially impactful filmmaking under its Films For Impact label. The company’s initial slate of features will explore addiction, obesity, [ ]", "date_str": "2026-10-02T10:27:45+00:00", "hash": "878c1377e737b22f", "title_fa": "پنه لوپه آن میلر، اوتمارا ماررو فیلم «پاک ساخته شده» اولین پروژه برای سینمای کشور مستقر در نشویل", "summary_fa": "انحصاری: ست کریستین، فیلمساز، که عنوان تهیه کننده قبلی او شامل درام جنایی Echo Boomers 2020 با بازی پاتریک شوارتزنگر و مایکل شانون است، سینما کشور را راه اندازی کرده است. شرکت تولید مستقل مستقر در نشویل تحت عنوان Films For Impact خود به داستان سرایی انسان محور و فیلمسازی تأثیرگذار اجتماعی اختصاص دارد. فهرست اولیه ویژگی های شرکت اعتیاد، چاقی را بررسی می کند، [ ] فهرست اولیه ویژگی های شرکت اعتیاد، چاقی و رسانه های اجتماعی را بررسی می کند. کریستین گفت که Cinema Country متعهد به ساخت فیلم‌های Films For Impact است که سرگرم‌کننده، الهام‌بخش مکالمات معنادار و ارائه ارزش به فرهنگ و بشریت است. ما دنبال روندها نیستیم یا صرفاً به دنبال آنچه محبوب است نیستیم. ما به دنبال داستان های منحصر به فرد و تازه ای هستیم ن، «فصل پایانی» طولانی حاملگی حماسه کلاسیک زامبی جورج آ. رومرو به پایان رسیده است. کیت بکینسیل، ستاره دنیای زیرزمینی، در کنار بتی گابریل (برو بیرون)، تازه وارد ابیگیل لندن و جان دی هیکمن (بکی) در این ژانر بازی می کند. فیلمبرداری در کنتاکی انجام شد و ماه گذشته به پایان رسید. گرگ نیکوترو، پیاده‌روی افسانه‌ای [ ] انحصاری: فیلم‌برداری در گرگ و میش مردگان، آخرین فصل طولانی حاملگی جورج آ به پایان رسید. حماسه زامبی کلاسیک رومرو. این پروژه ترسناک، که از املاک رومرو خرید می‌کند، در زمینی از بین رفته که آخرین بقایای بشریت بین جناح‌های متخاصم و تهدیدی در حال تکامل به دام افتاده است. اخبار مربوط به Deadline را تماشا کنید کیت بکینسیل برای بازی در فیلم Twilight Of The Dead; معامله آمریکای شمالی -- اخبار بازار کن ستاره رزیدنت ایول میلا جووویچ به نبرد با مردگان در کنار بتی گابریل در جورج آ. Romero's Twilight Of The Dead; Fortitude برای AFM Ahead of 2025 راه اندازی می شود Shoot The Paz Brothers، Doron و Yoav Paz، که فیلم هایشان شامل The Golem و Plan A به کارگردانی است. بدلکاری، دامپزشک هو سونگ پاک (قطار گلوله) کارگردانی سکانس‌های اکشن و بدلکاری است. همانطور که فاش کردیم، استودیوی Magenta Light باب یاری دارای حقوق آمریکای شمالی است و قرار است فیلم را در سینماهای سراسر ایالات متحده و کانادا توزیع کند. سندیکا فروش بین المللی را انجام می دهد. رومرو، نماد ترسناک، قبل از اینکه در سال 2017 بگذرد، برای این فیلم درمانی نوشته بود و گرگ و میش مردگان را به عنوان پایان حماسه حماسی خود، که شامل شش فیلم و اسپین‌آف‌ها و بازسازی‌های مختلف است، می‌دانست. آخرین فیلم این فرنچایز در سال 2009 اکران شد. گرگ و میش مردگان برای اولین بار در سال 2021 رونمایی شد. سازندگان قبلاً به"}, {"source": "Netflix NL", "title": "‘Explosieve’ nieuwe afleveringen The Night Agent op Netflix", "link": "https://www.netflix-nederland.nl/explosieve-nieuwe-afleveringen-the-night-agent-op-netflix/", "summary": "The Night Agent maakt zich op voor zijn last dance op Netflix, zijn zwanenzang. Er wordt namelijk nog maar één seizoen gereleaset, het vierde om precies te zijn, en volgens hoofdrolspeler Gabriel Basso wordt dat explosief . Nieuwe afleveringen The Night Agent zijn explosief De opnames van The Night Agent seizoen 4 zijn inmiddels achter de rug en Basso (die de rol van Peter Sutherland speelt) reageert: Dit is het vierde en laatste seizoen van The Night Agent. Peter heeft een aantal nieuwe vrienden. Peter heeft ook nieuwe vijanden. Aan iedereen die de serie heeft gekeken: bedankt. We hebben ontzettend hard gewerkt om van deze seriefinale een explosief slot te maken. The Night Agent seizoen 4 wordt dus het vierde én laatste seizoen van deze Netflix-thriller. Peter Sutherland keert daarin terug voor zijn allerlaatste missie als Night Agent. Over het precieze verhaal houdt Netflix voorlopig nog veel geheim. Wel is duidelijk dat seizoen 4 verdergaat na Peters gevaarlijke internationale missie uit seizoen 3. Daarin raakte hij opnieuw verwikkeld in een omvangrijk complot rond gestolen financiële inlichtingen en moest hij omgaan met de gevolgen van zijn eerdere beslissingen. Het vierde seizoen moet Peters verhaal definitief afronden met een laatste grote missie. Nieuwe personages Tot de nieuwe personages in het vierde seizoen van deze serie behoren Cahlin (Abigail Breslin), Holland (Annabeth Gish) en Ford (David Denman). Ook Titus Welliver speelt mee als Duval, Li Jun Li als Min, Trevante Rhodes als Dom en Elizabeth Lail als Zoe. Welke van deze personages Peter helpen en welke juist tegenover hem komen te staan, heeft Netflix nog niet volledig bekendgemaakt. Je merkt het al: veel geheimen, veel vragen, weinig antwoorden. Maar één ding weten we zeker: de zwanenzang van The Night Agent komt in 2027 uit op Netflix, dat heeft de streamingdienst ons nog maar eens beloofd. Wil jij nou niets missen over Netflix, films en series? Volg dan Netflix Facebookgroep! The post Explosieve nieuwe afleveringen The Night Agent op Netflix appeared first on Netflix Nederland - Films en Series on demand .", "date_str": "2026-10-02T12:11:38+00:00", "hash": "176f6a8b25c70fa7", "title_fa": "اپیزودهای جدید «انفجاری» م lix-komt-met-nu-al-zeer-omstreden-serie/", "summary": "Netflix is anno 2026 van alle markten thuis en brengt ook geregeld realityseries uit. Maar die vallen niet allemaal in de smaak. Binnenkort komt de streamingdienst met iets nieuws, en dat nieuws is nu al omstreden! The New Stanford Prison Experiment The New Stanford Prison Experiment, de serie waar het hier om gaat, is een nieuwe realityserie van Netflix waarin het beruchte Stanford Prison Experiment uit 1971 op een moderne manier opnieuw wordt onderzocht. Dertig vrijwilligers gaan voor maximaal twee weken een echte gevangenis binnen. Vervolgens worden ze willekeurig verdeeld in twee groepen: de ene groep wordt bewaker, de andere gevangene. Vanaf dat moment ontstaat er bewust een omgeving waarin hiërarchie en controle een grote rol spelen. De bewakers krijgen gezag over de gevangenen, terwijl de gevangenen zich aan regels moeten houden. De makers willen daarmee onderzoeken wat er gebeurt wanneer gewone mensen plotseling veel macht krijgen of juist vrijwel alle controle verliezen. Blijven deelnemers trouw aan hun eigen normen en waarden, of gaan ze zich steeds sterker gedragen naar de rol die hun is toegewezen? Het programma is geïnspireerd op het experiment dat psycholoog Philip Zimbardo in 1971 aan Stanford University uitvoerde. Destijds werden mannelijke studenten in een nagebouwde gevangenis eveneens verdeeld in bewakers en gevangenen. Het onderzoek zou één tot twee weken duren, maar werd al na zes dagen stopgezet. Het experiment werd later bovendien zwaar bekritiseerd vanwege zowel de ethiek als de wetenschappelijke opzet. Veel verontwaardiging Dat betekent meteen ook dat The New Stanford Prison Experiment van Netflix behoorlijk omstreden is. Waarom zou je namelijk iets opnieuw uitvoeren dat juist bekendstaat als voorbeeld van hoe psychologisch onderzoek níét moet worden uitgevoerd? Op sociale media verschenen bij de aankondiging reacties in de trant van: hebben we dan niets geleerd van de eerste keer? De makers zeggen dat ze die kritiek hadden verwacht. Producent Jane Lipsitz reageert: Toen het programma voor het eerst werd aangekondigd, was er veel verontwaardiging over het feit dat iemand überhaupt zou proberen om het Stanford Prison Experiment opnieuw uit te voeren. Gezien wat er bij het oorspronkelijke experiment is gebeurd, begrijp ik die reactie volledig. Als we simpelweg het oorspronkelijke experiment opnieuw zouden uitvoeren, zou dat onverantwoord zijn. Maar dit is een andere tijd, met andere deelnemers, andere veiligheidsmaatregelen en uitein", "date_str": "2026-10-01T18:04:48+00:00", "hash": "0621bd2370516bab", "title_fa": "نتفلیکس در حال راه اندازی یک سریال بسیار بحث برانگیز است", "summary_fa": "در سال 2026، نتفلیکس در همه بازارها حضور دارد و همچنین به طور مرتب سریال های واقعیت را منتشر می کند. اما همه آنها محبوب نیستند. سرویس استریم به زودی چیز جدیدی را منتشر خواهد کرد و این خبر در حال حاضر بحث برانگیز است! The New Stanford Prison Experiment The New Stanford Prison Experiment، سریال مورد بحث، یک سریال واقعیت جدید از نتفلیکس است که در آن آزمایش بدنام زندان استانفورد از سال 1971 به روشی مدرن مورد بررسی مجدد قرار گرفته است. سی داوطلب حداکثر برای دو هفته وارد یک زندان واقعی می شوند. سپس به طور تصادفی به دو گروه تقسیم می شوند: یک گروه نگهبان می شود و گروه دیگر زندانی. از آن لحظه به بعد، محیطی آگاهانه ایجاد می شود که در آن سلسله مراتب و کنترل نقش اصلی را ایفا می کند. به نگهبانان بر زندانیان اختیار داده می شود، در حالی که زندانیان باید قوانین را رعایت کنند. سازندگان می خواهند بررسی کنند که وقتی مردم عادی ناگهان قدرت زیادی به دست می آورند یا تقریباً تمام کنترل خود را از دست می دهند چه اتفاقی می افتد. آیا شرکت کنندگان به هنجارها و ارزش های خود وفادار می مانند یا به طور فزاینده ای مطابق با نقشی که به آنها محول شده است رفتار می کنند؟ این برنامه از آزمایشی الهام گرفته شده است که فیلیپ زیمباردو روانشناس در دانشگاه استنفورد در سال 1971 انجام داد. در آن زمان، دانش آموزان پسر در یک زندان بازسازی شده نیز به دو دسته نگهبان و زندانی تقسیم می شدند. این مطالعه قرار بود یک تا د Pitchfork", "title": "Yung Miami Launches Debut Solo Album With New Songs “F U” and “2008”", "link": "https://pitchfork.com/story/yung-miami-announces-debut-solo-album-watch-dis-features/", "summary": "The long-awaited Watch Dis features Quavo, G Herbo, Lil Baby, Kodak Black, Shenseea, Vybez Kartel, and more", "date_str": "2026-10-01T17:59:43+00:00", "hash": "2d225ca28ee454ec", "title_fa": "یونگ میامی اولین آلبوم انفرادی خود را با آهنگ های جدید \"F U\" و \"2008\" راه اندازی کرد.", "summary_fa": "Watch Dis که مدتها در انتظارش بود شامل Quavo، G Herbo، Lil Baby، Kodak Black، Shenseea، Vybez Kartel، و موارد دیگر Loader Save Story ذخیره این داستان Comment Loader Save Story ذخیره این داستان دو سال پس از جدایی رسمی City Girls برای تمرکز بر حرفه انفرادی مربوطه خود، یونگ میامی بالاخره ورود آلبوم Debut خود را اعلام کرد. او آلبوم را با دو تک آهنگ جدید رهبری می کند: \"F U\" و \"2008\". اگرچه بقیه فهرست آهنگ TBA باقی می‌ماند، می‌توانید آن‌ها را بررسی کنید - و «Spend Dat» را در زیر اجرا کنید، چرا که نه؟ روز پنجشنبه، خواننده رپ یک تریلر مناسب و دراماتیک از LP که مدت ها مورد آزار و اذیت قرار گرفته بود را به اشتراک گذاشت. این کلیپ با انتقادات عمومی جو بودن همراه با آکادمیکز آغاز می شود - که اظهار می کند: \"تو در همه چیز در زندگی شکست خوردی، موسیقی که ساختی عجیب است\" - قبل از اینکه میامی پاسخ دهد: \"نمی دانم چگونه بعضی روزها جرات رفتن به استودیو حتی برای ضبط را پیدا کردم. اما یادم می‌آید که تمام احساساتم، تمام آن انرژی و هر آنچه را که احساس می‌کردم، در این آلبوم گذاشتم.» Pitchfork می تواند به طور انحصاری نشان دهد که Watch Dis در 23 اکتبر پخش می شود، شامل 20 آهنگ می شود و شامل ویژگی هایی از Quavo، G Herbo، Lil Baby، Kodak Black، Shenseea، Vybez Kartel و غیره است. ما همچنین در حال معرفی کاور آرت هستیم که می توانید آن را در زیر بررسی کنید. «می‌توانستم با یک آهنگ برگردم و آن را سالم پخش کنم، اما چرا؟» میامی در بیانیه ای به Pitchfork گفت. \"من به آنچه ساخته ام اطمینان دارم. من برگشته ام تا همه چیز را به نمایش بگذارم و می خواهم همه دیس را تماشا کنند.\" یونگ میامی"}, {"source": "Pitchfork", "title": "Alexander Skarsgård Moves Like Jagger in New Rolling Stones Video", "link": "https://pitchfork.com/story/alexander-skarsgard-moves-like-jagger-in-new-rolling-stones-video/", "summary": "Or at least he tries to", "date_str": "2026-10-01T16:35:22+00:00", "hash": "83ac3be95a72eb8d", "title_fa": "الکساندر اسکارسگارد مانند جگر در ویدیوی جدید رولینگ استونز حرکت می کند", "summary_fa": "Loader Save Story ذخیره این داستان Comment Loader Save Story ذخیره این داستان رولینگ استونز از فناوری پیری برای آخرین موزیک ویدیو خود صرف نظر می کند، اما به سنت دیرینه گروه برای استخدام یک بازیگر بسیار خوش قیافه برای ایفای نقش می پردازد. کلیپ «آقای افسون» به کارگردانی هنری شولفیلد، الکساندر اسکارسگارد را در حواشی دنبال می‌کند، در حالی که جگر در یک غذاخوری در جنگل‌های پشت‌نشین راه می‌رود. این تریلر Wicker نیست اما سرگرم کننده است. آن را در زیر تماشا کنید. آخرین آلبوم رولینگ استونز، زبان های خارجی، در ماه جولای منتشر شد و در آن چارلی واتس، درامر فقید، همراه با مشارکت هایی از پل مک کارتنی، رابرت اسمیت، برونو مارس، و استیو وینوود حضور داشت. ۸ آهنگی را که ثابت می‌کنند چارلی واتس باحال‌ترین رولینگ استون بود، دوباره مرور کنید."}, {"source": "Pitchfork", "title": "Lil Nas X Returns With New Song “World’s Greatest”", "link": "https://pitchfork.com/story/lil-nas-x-returns-with-new-song-worlds-greatest/", "summary": "Shot in his hometown of Atlanta, the accompanying video is dedicated to the singer’s late mother", "date_str": "2026-10-01T16:17:46+00:00", "hash": "140886dfa022bb42", "title_fa": "بازگشت لیل ناس ایکس با آهنگ جدید \"World's Greatest\"", "summary_fa": "ویدیوی همراهش که در زادگاهش آتلانتا فیلمبرداری شده است، به مادر مرحوم خواننده تقدیم شده است. Loader Save Story Save this Story Loader Save Story Save this Story Lil Nas X با اولین آهنگ جدید خود در سال بازگشته است. \"The World's Greatest\" پس از EP Days Before Dreamboy 2025، و نشان‌دهنده آخرین گام در بازگشت به موسیقی پس از دستگیری و بستری شدن او در سال 2025 پس از متهم شدن به افسران پلیس در لس‌آنجلس است. او دیروز در توضیح پست اینستاگرامی خود نوشت: «با ایمان راه برو، نه با دید» عبارت مورد علاقه مادرم برای گفتن بود. \"هرچه در زندگی پیش می روم، این موضوع بیشتر در من طنین انداز می شود.\" ویدیوی شش دقیقه‌ای «بزرگترین جهان» به کارگردانی فیلیپ یومانز در شهر زادگاه لیل ناس در آتلانتا فیلمبرداری شد. در یک استودیوی رقص، جایی که خواننده \"جاده شهر قدیمی\" در حال تمرین رقص صحنه است، افتتاح می شود. مربی رقصش به او می گوید: «تو به همین کار ادامه می دهی. می دانید مشکل چیست؛ شما فقط آن را درست نمی کنید.» از آنجا، فیلم‌های امروزی بیشتری با صحنه‌های دراماتیزه‌شده از دوران کودکی لیل ناس تلاقی می‌کنند. این ویدئو با تقدیم به مادر مرحومش تامیکیا هیل به پایان می رسد. آن را در زیر تماشا کنید. سال گذشته، لیل ناس نسبت به سه فقره جراحت به یک افسر پلیس و یک جرم جنایت مقاومت در برابر یک افسر اجرایی بی گناه بود و با پنج سال زندان مواجه شد. در ماه آوریل، یک قاضی حکم داد که در صورت موافقت با یک برنامه درمانی اجباری دو ساله، اتهامات او را رد کند. قاضی خاطرنشان کرد که تصمیم به اخراج تحت تأثیر تشخیص اختلال دوقطبی لیل ناس بوده است."}, {"source": "Pitchfork", "title": "Carly Rae Jepsen to Tour Day and Night in 2027", "link": "https://pitchfork.com/story/carly-rae-jepsen-to-tour-day-and-night-in-2027/", "summary": "The North American run behind her new double album kicks off in April", "date_str": "2026-10-01T15:20:37+00:00", "hash": "ffe2ee2aed5abdb0", "title_fa": "کارلی رائه جپسن در تورهای شبانه روزی در سال 2027", "summary_fa": "دویدن در آمریکای شمالی پشت آلبوم دوگانه جدیدش در آوریل آغاز می‌شود. Loader Save Story ذخیره این داستان Comment Loader Save Story Save this Story Carly Rae Jepsen در پشت آلبوم دوگانه جدید خود، Day and Night، سفری در آمریکای شمالی ترتیب داده است. مسابقات 2027 در زادگاه او کانادا آغاز می شود و به پایان می رسد. در این بین، جپسن 24 نمایش دیگر را در ماه های آوریل و مه اجرا خواهد کرد، از جمله یک شب در مدیسون اسکوئر گاردن و رد راکس. برنامه سفر او را در زیر بررسی کنید. جپسن ماه گذشته روز و شب را به همراه موزیک ویدیوی \"ورسای\" به اشتراک گذاشت. LP 24 ترکی توسط تک‌آهنگ‌های «On Wires»، «After همه»، «مرا در پیست رقص موعه ای از فراز و نشیب های پوچ بوده است، به دوران او به عنوان گیتاریست بنیانگذار در گروه راک فولک-راک دهه شصت، گرس روتس، در سال های ناب در دهه های هشتاد و نود، زمانی که او نقش های کوچکی در فیلم هایی مانند ماسک و جفت وحشی ایفا کرد، و با کارهای کترینگ و سایر امور زندگی اش را تامین کرد. همه چیز در سال 2005 تغییر کرد، زمانی که او نقشی ناگفته و پس زمینه را در اقتباس ایالات متحده از The Office دریافت کرد. براتون از طریق نیروی محض اراده و زمان بندی کمدی درخشانش، در فصل دوم به یکی از بازیگران تبدیل شد. تنها نقطه ضعف این است که برخی از افراد در صنعت او را به عنوان یک چهره کاملاً کمیک می بینند. خوشبختانه، لنس اوپنهایم کارگردان Primetime یکی از آنها نیست. او اخیراً به GQ گفت: یکی از لحظات مورد علاقه من در فیلم و لحظات مورد علاقه"}, {"source": "Rolling Stone", "title": "Watch Sienna Spiro Bring ‘Die on This Hill’ to ‘Austin City Limits’", "link": "https://www.rollingstone.com/music/music-news/sienna-spiro-die-on-this-hill-austin-city-limits-1235634762/", "summary": "The 21-year-old singer-songwriter performed an hour-long set including songs from her debut album, Visitor , that have shaped her breakout year", "date_str": "2026-10-02T13:55:22+00:00", "hash": "415d6562818d1fd2", "title_fa": "تماشای Sienna Spiro در حال آوردن «Die on This Hill» به «Austin City Limits»", "summary_fa": "این خواننده و ترانه سرای 21 ساله مجموعه‌ای یک ساعته شامل آهنگ‌هایی از اولین آلبوم خود به نام بازدیدکننده را اجرا کرد که در سال شکست او شکل گرفت، سینا اسپیرو تنها چند روز پس از انتشار اولین آلبوم خود در جولای، اولین آلبوم اوستین سیتی را شروع کرد. این خواننده و ترانه سرا یک ساعت آهنگ را برای ویژه به روی صحنه آورد که اولین نمایش آن در 3 اکتبر ساعت 9 شب است. EST در صفحه یوتیوب PBS و ACL، از جمله تک آهنگ او، Die on This Hill که به طور انحصاری در Rolling Stone نمایش داده می‌شود. اسپیرو قبل از شروع به کار در تصنیف پرشور گفت که این واقعاً نمایش خاصی بوده است. من تمام شب اینجا خواهم بود / من اینجا خواهم بود زیرا می توانم / می دانم که برایت مهم نیست، او آواز خواند. میدونم هیچی نمیتونه مهم باشه/خدایا کاش چیزی بر ن قرارداد خود با استودیوی قدیمی است. یک منبع آگاه به هالیوود ریپورتر می گوید که مایکل دی لوکا و پاملا عبدی در برادران وارنر حضور دارند. خبر خروج قریب‌الوقوع روسای فیلم در حالی منتشر می‌شود که پارامونت اسکای‌دنس برای ادغام 111 میلیارد دلاری خود با برادران وارنر آماده می‌شود. سوپر استودیوی ترکیبی متعلق به دیوید الیسون اکنون به سادگی Skydance نامیده می‌شود و انتظار می‌رود ادغام در 6 اکتبر نهایی شود. انتظار می رود دانا گلدبرگ و جاش گرینشتاین، مدیران فیلم پارامونت، بر هر دو استودیو فیلم نظارت کنند. گفته می شود عبدی و دی لوکا به همکاران خود گفته اند که در حال مذاکره برای اجرای احتمالی بعدی در نتفلیکس بوده اند. دوران تصدی د لوکا و عبدی به عنوان سرپرست گروه فیلم سینمایی برادران وارنر در سال 2022 آغاز شد و با اوج و فرودهایی همراه بوده است. اوج‌ها شامل موفقیت‌های باکس آفیس مانند فیلم Minecraft (960 میلیون دلار، در سطح جهانی) و Ryan Coogler's Sinners (370 میلیون دلار) در سطح جهانی، همراه با دستاوردهای مهم مانند برنده بهترین فیلم سال گذشته برای یکی از نبردهای یکی پس از دیگری ساخته پل توماس اندرسون و سایر بردها برای گناهکاران است. اشتباهات شامل تاب های گران قیمتی مانند The Bride از مگی جیلنهال است! و Digger بازیگر نقش تام کروز، که در حال اکران در این آخر هفته با قیمت تاسف بار 8 تا 15 میلیون دلار است. در اوایل این هفته، سیندی هالند از سمت خود به عنوان مدیر استریم پارامونت اسکای دنس کنار رفت و انتظار می‌رود کیسی بلویز، رئیس HBO، تمام تلاش‌های استریم را در استودیوهای ترکیبی رهبری کند. همچنین در این هفته، اعلام شد که ینون کریز، مدیرعامل متل، به عنوان مدیر عامل مشترک با الیسون وارد کار"}, {"source": "Hollywood Reporter", "title": "Guillermo del Toro Defends Tom Cruise’s ‘Digger,’ Rips “Petty” Headline", "link": "https://www.hollywoodreporter.com/movies/movie-news/guillermo-del-toro-tom-cruise-digger-review-1236720821/", "summary": "The director took to X to advocate for the polarizing film, calling it \"daring, bold and cinematically complex.\"", "date_str": "2026-10-02T13:28:51+00:00", "hash": "845684ea8d913e42", "title_fa": "گیلرمو دل تورو از «حفار» تام کروز دفاع می کند و تیتر «پتی» را می ریزد", "summary_fa": "کارگردان از X برای دفاع از فیلم قطبی کننده استفاده کرد و آن را \"جسورانه، جسورانه و از نظر سینمایی پیچیده\" خواند. دیگر یک مدافع بزرگ در گیرمو دل تورو پیدا کرده است. کارگردان برنده اسکار فرانکشتاین و The Shape of Water طی 24 ساعت گذشته چند بار از فیلم محاصره شده آلخاندرو جی. من حمایت کرد که نقدهای قطبی (بعضی تند و تند) را به همراه داشت. اولین پیام کارگردان در مورد این موضوع واکنش به پستی از سایت خبری سرگرمی IGN بود که نوشته بود، تجربه تئاتر نظر شما را در مورد Digger تغییر نخواهد داد، و خنده هایی که هنوز وجود دارد، زمانی که HBO Max پخش می شود، خواهد بود. داستان‌های مرتبط فیلم‌ها چرا حفار تام کروز با چنین جاده‌ای پر دست‌انداز باکس آفیس روبرو است؟ فیلم‌هایی که حفار تام کروز در ابتدا با عنوان Blah, Blah, Blah, Inárritu نشان می‌دهد دل تورو به عقب برگشته بود: تیتر کاملاً کوچک. دوست داشته باشید یا نه. و، بله، من انجام می دهم. این فیلم در مقیاس، جاه‌طلبی و رسیدن به سطح نمایشگر نمایش داده می‌شود. جسور، جسور و پیچیده سینمایی. قطعا یک تجربه تئاتری. سپس، دل تورو، در واکنش به پستی درباره فیلم جنجالی کن راسل در سال 1971، شیاطین نوشت، من بچه بودم و به یاد دارم که این فیلم منتشر شده توسط [برادران وارنر] بیش از حد، بیش از حد و غیره بود و در کشور من، مکزیک، به ما گفته شد که کلیسا صراحتاً آن را توهین آمیز می‌دانست. و اینجا هستیم، من آن را بیشتر از هر زمان دیگری دوست دارم، زیرا در مورد مالکیت نیست، بلکه آنچه روایت سیاسی با آن انجام می دهد است. خوشحالم که WB حتی اکنون هم ریسک می کند. کارگردان، اکنون مستقیماً به Digger اشاره می کند: BTW یک فیلم تغییر آب و هوا در حال اکران"}, {"source": "Hollywood Reporter", "title": "It’s Skydance: David Ellison Brands Combined Paramount-Warner Bros. With His Studio’s Title", "link": "https://www.hollywoodreporter.com/business/business-news/david-ellison-paramount-warner-bros-name-scalled-kydance-1236720826/", "summary": "Paramount and Warner Bros. will exist as sub-brands in the larger corporate brand.", "date_str": "2026-10-02T13:11:06+00:00", "hash": "c4a5c71bb56da07a", "title_fa": "It's Skydance: David Ellison Brands برادران پارامونت-وارنر را با عنوان استودیو خود ترکیب کرد", "summary_fa": "پارامونت و برادران وارنر به عنوان برندهای فرعی در برند شرکت بزرگتر وجود خواهند داشت. جدیدترین مجموعه تجاری سرگرمی نامی دارد: Skydance. دیوید الیسون در روز جمعه در X به اشتراک گذاشت که هنگامی که پارامونت و برادران وارنر دیسکاوری با هم ترکیب شوند، نام تجاری جدید شرکتی نام استودیویی را که او 20 سال پیش تأسیس کرده بود، خواهد گرفت. اما در حالی که این نام شرکت خواهد بود، پارامونت و برادران وارنر به عنوان برندهای فرعی خدمت خواهند کرد. الیسون نوشت که هر دو دارای هویت‌های متمایز، میراث‌های خارق‌العاده و برندهایی هستند که برای نسل‌ها در بین مخاطبان طنین‌انداز بوده است. ما نامی می‌خواستیم که به شرکت ترکیبی هویتی خاص بدهد و در عین حال به پارامونت و برادران وارنر و همه برندهای خارق‌العاده ما در کانون توجه باقی بمانند. این نام به یکی از سوالات بی‌پاسخ بزرگ‌تر در مورد شرکت جدید پاسخ می‌دهد، که در کنار شرکت والت دیزنی و نتفلیکس، قطعاً در میان بزرگ‌ترین شرکت‌ها قرار خواهد گرفت. در تجارت سرگرمی، حقیقت این است که برند شرکتی همیشه مهم نیست. این کار برای دیزنی، که مترادف با نوع خاصی از محتوای مناسب خانواده است، و برای نتفلیکس، که مترادف با استریم است، انجام می شود، اما صنعت گذشته و حال پر از مالکانی است که نام هایی مانند Comcast، Viacom، News Corp.، Versant، Capital Cities و غیره دارند. برای اکثر شرکت‌های عمومی، نام شرکت فقط یک نام شرکتی است، خانه‌ای از برندها برای نگه‌داشتن برندهای رو به مصرف‌کننده، حتی اگر نام یک استودیوی فیلم را به اشتراک بگذارند. الیسون استودیوی فیلم Skydance را در سال 2006 تأسیس کرد و از آن به عنوان وسیله‌ای برای خرید پارامونت در سال گذشته استفاده کرد و مدت کوتاهی پس از آن به شرکت برادران وارنر دیسکاوری تبدیل شد."}, {"source": "Hollywood Reporter", "title": "‘Concrete Turned to Sand’ Dives Into Oyster Farms, With Otherworldly Imagery From the ‘Backrooms’ DP (Exclusive Clip)", "link": "https://www.hollywoodreporter.com/movies/movie-news/concrete-turned-to-sand-film-clip-backrooms-dp-oyster-farms-1236718131/", "summary": "The film from directors Jessica Johnson and Ryan Ermacora, getting its international premiere at the BFI London Film Festival, asks us \"to reconsider how we look at the state of the environment\" and more.", "date_str": "2026-10-02T12:45:00+00:00", "hash": "4df7f343f543143b", "title_fa": "«بتن تبدیل به شن» به مزرعه‌های صدف شیرجه می‌رود، با تصاویری از دنیای دیگر از DP «Backrooms» (کلیپ اختصاصی)", "summary_fa": "این فیلم از کارگردان‌های جسیکا جانسون و رایان ارماکورا که اولین نمایش بین‌المللی خود را در جشنواره فیلم BFI لندن دریافت می‌کند، از ما می‌خواهد \"در نحوه نگاه خود به وضعیت محیط زیست تجدید نظر کنیم\" و موارد دیگر. اگر فضای حاشیه‌ای در Backrooms، که توسط فیلمبرداری جرمی کاکس تقویت شده است، به شما احساس ترس می‌دهد، کار دوربین او در Concrete Turned to Sand شما را به مزارع صدف فضایی بسیار متفاوت در بریتیش کلمبیا، کانادا می‌برد. بله، مزارع صدف! اما باز هم، بهتر است برای یک تجربه سینمایی حسی همهجانبه آماده شوید که شما را در دنیایی پر از تصاویر ماورایی، تقریباً علمی تخیلی و انواع احساسات و احساسات مختلف فرو می برد. این فیلم از جسیکا جانسون و رایان ارماکورا کارگردانان ساکن ونکوور، از 11 اکتبر در برنامه مسابقه مستند جشنواره فیلم لندن (LFF) BFI نمایش داده خواهد شد، اما این مستند معمولی شما نیست. در واقع، یادداشت‌هایی درباره این فیلم که با ضخامت 35 میلی‌متری فیلمبرداری شده است، آن را رد رادیکال روایت مستند متعارف توصیف می‌کند. داستان‌های مرتبط Business MIA Market برنامه سال 2026 را رونمایی کرد، ترکیبی برای تلویزیون عصر دیجیتال خداحافظی کامل دانیل ازرا با همه آمریکایی‌ها فیلم از Slag Pile Films اولین نمایش جهانی خود را در جشنواره بین‌المللی مستند کانادایی Hot Docs در تورنتو دریافت کرد و اکنون اولین نمایش بین‌المللی خود را در لندن جشن خواهد گرفت. مخاطبان می توانند انتظار داشته باشند که غنای طبیعی، مانند تصاویر زیر آب از صدف های درخشان، با ترس زیست محیطی مواجه شوند. به هر حال، صدف‌های ساحل جزایر دیسکاوری که در فیلم به نمایش در می‌آیند سال‌ها طول می‌کشد تا به بلوغ برسند، اما در اطراف آن‌ها، سرعت تغییرات محیطی در حال افزایش است. و از دریچه کاکس، طبیعت ماورایی به نظر می رسد و تقریباً احساس می کند. منظره صوتی فیلم"}, {"source": "Hollywood Reporter", "title": "What Mattered to Hollywood at This Year’s Iberseries & Platino Industria", "link": "https://www.hollywoodreporter.com/business/business-news/woody-allen-madrid-film-iberseries-platino-industria-wrap-1236714367/", "summary": "The sixth edition of the industry gathering, which has featured debates about hot-button industry topics in Madrid, is coming to an end Friday.", "date_str": "2026-10-02T08:30:00+00:00", "hash": "cf1478ebaad7fe13", "title_fa": "آنچه برای هالیوود در نمایشگاه Iberseries و Platino Industria امسال اهمیت داشت", "summary_fa": "ششمین دوره گردهمایی صنعت، که بحث هایی در مورد موضوعات داغ صنعت در مادرید برگزار می کند، روز جمعه به پایان می رسد. ششمین نسخه از Iberseries Platino Industria در مادرید، پایتخت اسپانیا، افراد صنعت را از سراسر جهان دوباره برای مناظره ها، سخنرانی ها، سایر مشاغل و شبکه گرد هم آورد. ظهور هوش مصنوعی و درام‌های کوچک یکی از موضوعات نسخه امسال رویدادی بود که به عنوان بزرگترین رویداد تجاری بین‌المللی برای متخصصان محتوای سمعی و بصری اسپانیایی و پرتغالی زبان تبلیغ می‌شود. اما پیشنهادات و نظرات دیگری نیز وجود داشت که باعث سر و صدا در سراسر مادرید ماتادرو شد، محل یک کشتارگاه سابق که به مکانی فرهنگی و رویدادی تبدیل شده است که Iberseries در آن برگزار می شود. در اینجا برخی از پیشنهادات THR از Iberseries Platino Industria 2026 آورده شده است. این واقعیت که محتوای عمودی، به‌ویژه درام‌های کوچک، همچنان در حال افزایش است، چیزی بود که در تمام سالن‌های Iberseries در تمام هفته منعکس شد. Marcela Kartaszewicz، رئیس ارتباطات در DramaBox، طی پانلی با عنوان Viral Vertical: The Rise of Microdrama از فشار هالیوود به سمت قالب عمودی استقبال کرد. او گفت که بسیاری از استودیوها به فضای عمودی می پرند و پیشنهاد می کند که این کار همه قایق ها را بلند می کند. هر چه بیشتر، بهتر است. اما او همچنین خاطرنشان کرد که افزایش تقاضای مخاطبان برای درام‌های کوچک یک قانون اساسی صنعت سرگرمی را تغییر نمی‌دهد. مجری تاکید کرد که محتوا پادشاه است. بوده است. هست. همیشه خواهد بود. در میان محبوب‌ترین ژانرها تا کنون می‌توان به داستان‌های LGBTQ+، داستان‌های عشقی با فاصله سنی جوان، فقط انواع مختلف داستان‌های عاشقانه در اشکال و اشکال مختلف اشاره کرد، Kartaszewicz به اشتراک گذاشت: من فکر می‌کنم لحظه‌ای برای فیلم‌های هیجان‌انگیز وجود خواهد داشت. می‌توانیم ببینیم که در فیلم‌نامه‌هایمان از داستان‌های هیجان‌انگیز استفاده"}, {"source": "Hollywood Reporter", "title": "‘American Horror Story: 13’ Jeffrey Dahmer Actor on That ‘Coven’ Cliffhanger and Sharing the Serial Killer With Co-Star Evan Peters", "link": "https://www.hollywoodreporter.com/tv/tv-features/ahs-13-jeffrey-dahmer-return-seth-gabel-cliffhanger-1236717562/", "summary": "Seth Gabel returns as the notorious Dahmer in the new season of Ryan Murphy's horror franchise, reuniting him with Peters, who took on the role in the first season of 'Monster.'", "date_str": "2026-10-02T05:31:00+00:00", "hash": "3635e11edfd37cd5", "title_fa": "«داستان ترسناک آمریکایی: 13» جفری دامر بازیگر سریال «آن کاون» کلیف هنجر و به اشتراک گذاری قاتل سریالی با همبازی اش ایوان پیترز", "summary_fa": "ست گابل در فصل جدید سریال ترسناک رایان مورفی در نقش داهمر بدنام بازمی گردد و او را با پیترز که در فصل اول «هیولا» ایفای نقش کرده بود، پیوند می دهد. متن لوگو [این داستان حاوی اسپویل های اصلی از قسمت ششم داستان ترسناک آمریکایی، بازگشت شب شیطان است. ] طرفداران داستان ترسناک آمریکایی می دانستند که اتفاق بزرگی با قسمت ششم فصل سیزدهم همه ستاره در راه است. انگار برای دیدن نمادهایی از این فرنچایز که چندین نقش را در سه قسمت اول قسمت متقاطع سریال ترسناک موفق رایان مورفی و برد فالچوک در هفته اول تکرار می‌کنند کافی نبود، عنوان اپیزود سومین اپیزود هفته دوم یک اشاره بزرگ داشت: بازگشت شب شیطان. داستان‌های مرتبط داستان ترسناک آمریکایی تلویزیونی: 13 امتیاز بهترین پخش جریانی سریال تا به حال تلویزیون داستان ترسناک آمریکایی با 13 بازگشت: در اینجا چگونه همه فصل‌ها به هم متصل می‌شوند (تاکنون) شب شیطان قسمت حماسی فصل پنجم AHS، هتل بود که یک مهمانی شام با بدنام‌ترین قاتل‌های واقعی جیمز در مارس برگزار کرد. وورنوس (با بازی لیلی راب)، جان وین گیسی (با بازی جان کارول لینچ)، ریچارد رامیرز (با بازی آنتونی رویویوار)، قاتل زودیاک (با صورت پوشیده شده) و جفری دامر (با بازی ست گابل). بازگشت اپیزود ششم به شب شیطان، ریچارد رامیرز، قاتل زودیاک و داهمر را بازگرداند، زیرا مارس یک بار دیگر دوستان بدنام خود را برای ضرب و شتم فراخواند. این بار، هدف او جادوگران فصل سوم AHS، Coven، به رهبری کوردلیا گود، با بازی سارا پالسون بود. این اپیزود در یک صخره بزرگ به پایان رسید، زیرا کوردلیا با تبر به جمجمه اش که در ماه مارس پرتاب می شود، پایین می رود، و گروه قاتلان زنجیره ای شروع به حمله به عهد می کنند، که شامل جادوگران بازگشته با بازی اما رابرتز، گابوری سیدیبه و بیلی لورد نیز می"}, {"source": "Hollywood Reporter", "title": "Kelly Clarkson Loves AI, But Says AI Artists Shouldn’t Be “Competing With Humans” on Music Charts", "link": "https://www.hollywoodreporter.com/music/music-news/kelly-clarkson-ai-artists-shouldnt-be-music-charts-humans-1236720709/", "summary": "\"We can’t lose human. We can’t lose what that is. But there could be an appetite for both,\" she said of the controversial technology.", "date_str": "2026-10-02T04:22:28+00:00", "hash": "f4ded0d2f1afde74", "title_fa": "کلی کلارکسون عاشق هوش مصنوعی است، اما می‌گوید هنرمندان هوش مصنوعی نباید در نمودارهای موسیقی «با انسان‌ها رقابت کنند»", "summary_fa": "او درباره این فناوری بحث‌برانگیز گفت: \"ما نمی‌توانیم انسان را از دست بدهیم. ما نمی‌توانیم آنچه را که هست از دست بدهیم. اما ممکن است برای هر دو اشتها وجود داشته باشد.\" کلی کلارکسون در مورد آنچه که او افکار جنجالی خود را در مورد هوش مصنوعی می نامد، صادق است. برنده گرمی در حالی که با مت راجرز و بوون یانگ در قسمت اخیر پادکست Las Culturistas چت می‌کرد، توضیح داد که اگرچه عاشق این فناوری است، اما احساس نمی‌کند هنرمندان هوش مصنوعی باید در چارت‌های موسیقی با انسان‌ها رقابت کنند. او اعتراف کرد که من عاشق هوش مصنوعی هستم. چیزهای بسیار شگفت انگیزی در هوش مصنوعی وجود دارد که من به آنها وسواس دارم. اما همچنین، و من از لحاظ هنری نیز بسیار به آن علاقه دارم، مانند بقیه با آن سرگرم می شوم. اما وقتی هنرمندان هوش مصنوعی را می بینید که بر روی نمودار با انسان ها رقابت می کنند، من یک مشکل دارم. من فکر می کنم باید یک نمودار جداگانه وجود داشته باشد. داستان‌های مرتبط فیلم‌ها بن افلک رویکرد خود را برای استفاده اخلاقی از هوش مصنوعی در حیوانات فیلم جدید توضیح می‌دهد: این موضوع به ساختن افراد جعلی یا جایگزینی کسی نیست، همیشه فیلم‌هایی که بن افلک از هوش مصنوعی برای چیزهای زیادی در فیلم‌های جدید نتفلیکس خود برای حیوانات استفاده می‌کرد، به میز خوش آمدید. من فکر می‌کنم آنچه که می‌خواهیم با هوش مصنوعی از نظر موسیقی خلق کنیم، بسیار جالب و خلاقانه است، و افرادی که شاید نتوانند کارهای خاصی را انجام دهند، اکنون می‌توانند آن را انجام دهند. کلارکسون ادامه داد: فکر می‌کنم بازی کردن در آن زمین سرگرم‌کننده‌ای است، اما فکر نمی‌کنم آنها باید با انسان‌ها رقابت کنند. اساساً مثل برگزاری المپیک است و بعد از آن می خواهید ربات ها با انسان ها به رقابت بپردازند، خوب چه"}, {"source": "Hollywood Reporter", "title": "Ben Affleck Explains His Approach to Using AI Ethically on New Movie ‘Animals’: “It’s Not About Making Fake People or Replacing Anybody, Ever”", "link": "https://www.hollywoodreporter.com/movies/movie-news/ben-affleck-approach-ai-ethically-animals-replacing-1236720613/", "summary": "\"I wouldn't use something that trains on or has learned from any work that is copywritten, or that is an intelligence created by a peer of mine or somebody that I look up to,\" the actor-director emphasized.", "date_str": "2026-10-02T03:35:09+00:00", "hash": "9db52f1a4dfdc490", "title_fa": "بن افلک رویکرد خود را برای استفاده اخلاقی از هوش مصنوعی در فیلم جدید «حیوانات» توضیح می‌دهد: «این در مورد ساختن افراد قلابی یا جایگزین کردن کسی نیست.»", "summary_fa": "این بازیگر-کارگردان تاکید کرد: من از چیزی استفاده نمی‌کنم که در مورد هیچ اثری که کپی‌نویسی شده است آموزش ببینم یا از آن یاد گرفته باشم یا هوشی است که توسط همتای من یا کسی که به او نگاه می‌کنم ایجاد شده است. بعد از اینکه بن افلک این هفته در مورد استفاده از هوش مصنوعی در فیلم جدید خود یعنی حیوانات صحبت کرد و اکنون در رویکرد خود برای استفاده مسئولانه از این فناوری صحبت می کند. افلک اولین بار در روز چهارشنبه در رویداد بلومبرگ Screentime در مورد استفاده حیوانات از هوش مصنوعی صحبت کرد و گفت، من از [AI] برای چیزهای زیادی در آن فیلم استفاده کردم. من کمی مردد هستم که به آنها اشاره کنم یا حتی در مورد آن صحبت کنم زیرا در تجارت من سعی می کنیم توهم واقعیت را تقویت کنیم، درست است؟ او اضافه کرد، اما بله، ما از آن استفاده کردیم، و در واقع، من فکر می‌کردم که این یک مثال خوب (در مورد نحوه استفاده اخلاقی از هوش مصنوعی) است، زیرا فیلمی بسیار انسانی است. داستان‌های مرتبط فیلم‌ها کریس پرت از کوین فایگی برای بازیگری در MCU تشکر می‌کند وقتی او تا حدی چاق بود: هیچ‌کس فکر نمی‌کرد، حالا فیلم‌های ستاره اکشن وجود دارد بن افلک از هوش مصنوعی برای چیزهای زیادی در فیلم جدیدش در نتفلیکس استفاده کرد حیوانات در فیلم نت‌فلیکس، در اولین اکران فیلم نت‌فلیکس، من به اولین اکران فیلم نتفلیکس گفت که رویکرد او در پنج‌شنبه است. از چیزی استفاده نمی‌کنم که بر روی هر اثری که کپی‌نویسی شده است آموزش ببیند یا از آن یاد گرفته باشد، یا هوشی است که توسط یکی از همتایان من یا کسی که من به او نگاه می‌کنم ایجاد شده است. به همین دلیل بود که ما یک مجموعه داده اختصاصی ایجاد کردیم تا نیازی به استخراج نداشته باشد."}, {"source": "Variety", "title": "IDF Slams ‘NAZA,’ Saying It Presents a ‘Distorted, Misleading and Disingenuous Picture’", "link": "https://variety.com/2026/film/global/idf-slams-naza-documentary-1236897499/", "summary": "The Israeli Defense Forces has slammed the documentary “NAZA,” calling it “manipulative,” “misleading and “based on substantial factual errors.” The film premiered at Venice Film Festival last month, where it received a 24.5-minute standing ovation. It has since screened at the San Sebastián and New York film festivals, and will open in U.S. theaters next [ ]", "date_str": "2026-10-02T14:24:23+00:00", "hash": "f3607767698eaa18", "title_fa": "ارتش اسرائیل «نازا» را محکوم کرد و گفت که «تصویر تحریف‌شده، گمراه‌کننده و نادرست» ارائه می‌کند.", "summary_fa": "نیروهای دفاعی اسرائیل مستند «نازا» را به شدت محکوم کرده و آن را «دستکاری‌کننده»، «گمراه‌کننده و «بر اساس اشتباهات واقعی» خوانده‌اند. این فیلم ماه گذشته در جشنواره فیلم ونیز به نمایش درآمد که در آن 24.5 دقیقه مورد تشویق ایستاده قرار گرفت. از آن زمان این فیلم در جشنواره های فیلم سن سباستین و نیویورک به نمایش درآمد و در ایالات متحده افتتاح خواهد شد. theaters next [ ] در بیانیه خود، ارتش اسرائیل اعلام کرد که فرصتی برای مشاهده این مستند قبل از نمایش اولیه آن نداشته و مدعی است که کارگردانان این فیلم را قبل از انتشار به ارتش اسرائیل مطرح نکرده اند. ارتش اسرائیل اکنون به ادعاهای متعدد در این فیلم که عنوان آن را از عبارت خسارت جانبی در زبان عبری (نژک آگاوی) گرفته است، پاسخ داده است. محبوب در تنوع از جمله نکات دیگر، ارتش اسرائیل گفت که تحت دستورالعمل های الزام آور عمل می کند که به صراحت بین عاملان نظامی و شهروندان غیر درگیر تمایز قائل می شود. همانطور که یکی از مشارکت کنندگان ناشناس در فیلم ادعا می کند، هرگز حمله ای در غزه که در آن 500 غیرنظامی کشته شدند، برنامه ریزی یا انجام نداده است. و هرگز از هوش مصنوعی برای انتخاب اهداف برای حمله استفاده نکرده است، گفت که اینها فقط توسط متخصصان مربوطه برنامه ریزی شده است. همه 24 مشارکت کننده در NAZA ناشناس هستند و در مقابل افق شبانه در تل آویو فیلمبرداری شده اند. ارتش اسرائیل در بیانیه خود گفت آشکار است که در موارد مختلف مصاحبه شوندگان گمانه زنی و فرضیات را بدون مبنای واقعی مطرح می کنند. آنها افزودند که سازندگان فیلم همچنین زمینه‌های حیاتی مانند نشان دادن زنجیره کامل فرماندهی را که به گفته آنها شامل نقش‌هایی است که به کاهش آسیب غیرنظامی اختصاص داده شده است را کنار گذاشته‌اند و در ماه"}, {"source": "Variety", "title": "‘God of War Laufey’ Sets Release Date, Preorders Open (Gaming News Roundup)", "link": "https://variety.com/2026/gaming/news/gaming-news-roundup-september-28-1236877473/", "summary": "“God of War Laufey” will release Feb. 16, 2027 from PlayStation s Santa Monica Studios. Pre-orders go live on Sept. 29. The prequel game in the action-adventure franchise centers on Laufey, also known as Faye. “God of War Laufey” follows the legendary warrior beyond death through the Everywhen, the afterlife of the gods. Fans who pre-order [ ]", "date_str": "2026-10-02T13:52:00+00:00", "hash": "cb0dfed015423db0", "title_fa": "«God of War Laufey» تاریخ انتشار را تعیین می‌کند، پیش‌سفارش باز می‌شود (خلاصه اخبار بازی)", "summary_fa": "«God of War Laufey» در 16 فوریه 2027 از استودیوی سانتا مونیکا پلی استیشن منتشر خواهد شد. پیش‌سفارش‌ها در 29 سپتامبر آغاز می‌شوند. بازی پیش درآمد در مجموعه اکشن-ماجراجویی روی Laufey متمرکز است که به نام Faye نیز شناخته می‌شود. «God of War Laufey» جنگجوی افسانه‌ای را فراتر از مرگ از طریق Everywhen، زندگی پس از مرگ خدایان دنبال می‌کند. طرفدارانی که [ ] God of War Laufey را پیش خرید کنند، در تاریخ 16 فوریه 2027 از استودیوی سانتا مونیکا پلی استیشن منتشر خواهند شد. پیش‌سفارش‌ها در 29 سپتامبر فعال می‌شوند. طرفدارانی که بازی را پیش‌سفارش کنند، یک مجموعه زره ویژه، ظاهر آرایشی و بسته منابع درون بازی دریافت خواهند کرد. داستان های مرتبط ستاره خاطرات شاهزاده خانم هدر ماتارازو فاش می کند که اگر به زودی دوباره کار نکند ممکن است بیمه سلامت خود را از دست بدهد: بازیگران زیادی در یک قایق هستند بازی همچنین دارای یک سلاح جدید برای Faye در Everywhen است. کمان مسحور با شکل مار در حال تغییر به بازیکنان یک سلاح قدرتمند در نبردهای نزدیک و دور می دهد. پرطرفدار در Variety اخبار بازی های بیشتر هفته را در خلاصه زیر مشاهده کنید. Discord در حال راه‌اندازی Discord Ads Manager و Video Quests است که به تبلیغ‌کنندگان این امکان را می‌دهد تا دسترسی خود را گسترش دهند. Discord Ads Manager که اکنون در دسترس است، اولین پلتفرم مدیریت کمپین پلتفرم است و دسترسی مستقل آن به تبلیغات Discord امکان می دهد به استودیوهای کوچکتر و بازاریابان دسترسی پیدا کند. همچنین یک تحویل مبتنی بر حراج و یک مدل هزینه پویا ارائه می‌دهد که در آن تبلیغ‌کنندگان می‌توانند پیشنهادات خود را در زمان واقعی تنظیم کنند. دسترسی کامل خود-سرویس برای اوایل سال 2027 تنظیم شده است. Video Quests از طریق Discord Ads Manager در دسترس است و به عنوان یک قالب تبلیغاتی ویدیویی"}, {"source": "Variety", "title": "CBS News Taps Steven Baker, Former ‘Nightline’ Producer, to Boost ‘Mornings,’ ‘Evening News’", "link": "https://variety.com/2026/tv/news/cbs-news-steven-baker-nightline-producer-tv-mornings-1236897203/", "summary": "CBS News is tapping another ABC News veteran to lend a hand with the ambitious task of trying to move its morning- and evening-news programs out of third place. Steven Baker, a former executive producer at ABC News Nightline, joined CBS News as a consultant earlier this week, according to two people familiar with the [ ]", "date_str": "2026-10-02T13:50:00+00:00", "hash": "b440c5d046de842b", "title_fa": "CBS News از استیون بیکر، تهیه‌کننده سابق «Nightline» برای تقویت «Mornings»، «Evening News» استفاده می‌کند.", "summary_fa": "CBS News یکی دیگر از پیشکسوتان ABC News را به خدمت می گیرد تا با این وظیفه بلندپروازانه تلاش کند تا برنامه های خبری صبح و عصر خود را از رتبه سوم خارج کند. به گفته دو نفر از آشنایان با [ ] استیون بیکر، تهیه کننده اجرایی سابق ABC News Nightline، اوایل این هفته به عنوان مشاور به CBS News ملحق شد. بیکر در طول تصدی خود در ABC News به عنوان فردی که مایل به آزمایش و آزمایش چیزهای جدید بود، شهرت پیدا کرد. برای مثال، بیکر بر تلاشی نظارت کرد تا برنامه‌نویسی Nightline را در مکان‌هایی غیر از جایگاه پس از جیمی کیمل در ABC قرار دهد. به عنوان مثال، نایت لاین تحت حمایت او یک برنامه ویژه یک ساعته برای شبکه کابلی Freeform ایجاد کرد که بینندگان جوان را هدف قرار می داد. در سال 2020، او به سازماندهی تصاحب Timeslot Nightline توسط Turning Point کمک کرد، نگاهی یک ماهه به وضعیت روابط نژادی در داستان‌های مرتبط ایالات متحده، Alan Cumming Sheds His Traitors Kilt for Tip Toe. که داستان می گوید، مهم نیست کجا دیده می شود. CBS News از در دسترس قرار دادن مدیران برای اظهار نظر خودداری کرد. به گفته شخصی که در جلسه اخیر حضور داشت، تام سیبروسکی، رئیس CBS News، به گروهی از کارکنان گفت که در Variety محبوب استیو قرار است مستقیماً با من به عنوان مشاور و مشاور در برنامه های خبری روزانه ما کار کند. سیبروسکی با اشاره به جان تاور و کیم هاروی که به ترتیب بر CBS Mornings و CBS Evening News نظارت می کنند، اضافه کرد که استیو انرژی و ایده های زیادی به ارمغان خواهد آورد، و او شریک بزرگی برای رهبران برنامه خواهد بود. سیبروسکی گفت که امیدوار است بیکر انرژی و ایده های جدیدی را به برنامه ها تزریق کند."}, {"source": "Variety", "title": "Luca Guadagnino Is ‘Not Afraid’ of Sam Altman Backlash     }

    function toggleRead(hash) {
      if (readArticles.has(hash)) {
        readArticles.delete(hash);
      } else {
        readArticles.add(hash);
      }
      localStorage.setItem('read_articles_registry', JSON.stringify(Array.from(readArticles)));
      renderNews();
    }

    function renderNews() {
      const container = document.getElementById('newsContainer');
      const rawItems = data[currentTab] || [];
      
      const filtered = rawItems.filter(item => {
        if (!searchQuery) return true;
        const q = searchQuery.toLowerCase();
        const title = (item.title_fa || item.title || '').toLowerCase();
        const summary = (item.summary_fa || item.summary || '').toLowerCase();
        const source = (item.source || '').toLowerCase();
        return title.includes(q) || summary.includes(q) || source.includes(q);
      });

      const unreadList = [];
      const readList = [];

      filtered.forEach(item => {
        if (readArticles.has(item.hash)) {
          readList.push(item);
        } else {
          unreadList.push(item);
        }
      });

      const sortedItems = [...unreadList, ...readList];

      if (sortedItems.length === 0) {
        container.innerHTML = '<div style="text-align:center; padding: 40px; color: var(--text-muted);">هیچ خبری در این بخش در ۲۴ ساعت گذشته ثبت نشده است.</div>';
        return;
      }

      container.innerHTML = sortedItems.map((item, idx) => {
        const title = item.title_fa || item.title || '';
        const summary = item.summary_fa || item.summary || '';
        const source = item.source || 'منبع خبر';
        const link = item.link || '#';
        const isRead = readArticles.has(item.hash);
        const num = toFaDigits(idx + 1);

        return `
          <article class="news-card ${isRead ? 'is-read' : ''}" id="card-${item.hash}">
            <div class="news-header">
              <span class="news-num">${isRead ? '✓' : num}</span>
              <h2 class="news-title">${title}</h2>
            </div>
            ${summary ? `<p class="news-summary">${summary}</p>` : ''}
            <div class="news-footer">
              <span class="news-source">📌 منبع: ${source}</span>
              <div class="footer-right">
                <button class="btn-mark-read" onclick="toggleRead('${item.hash}')">
                  ${isRead ? '✓ خوانده شد' : '○ علامت خوانده‌شده'}
                </button>
                ${link && link.startsWith('http') ? `<a href="${link}" target="_blank" rel="noopener noreferrer" class="news-link">مطالعه اصل خبر ↗</a>` : ''}
              </div>
            </div>
          </article>
        `;
      }).join('');
    }

    function switchTab(tab, el) {
      currentTab = tab;
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      if (el) el.classList.add('active');
      renderNews();
    }

    function toggleTheme() {
      const html = document.documentElement;
      const current = html.getAttribute('data-theme') || 'dark';
      const next = current === 'dark' ? 'light' : 'dark';
      html.setAttribute('data-theme', next);
      localStorage.setItem('theme', next);
      updateThemeButton(next);
    }

    function updateThemeButton(theme) {
      const icon = document.getElementById('themeIcon');
      const text = document.getElementById('themeText');
      if (theme === 'dark') {
        icon.textContent = '☀️';
        text.textContent = 'حالت روشن';
      } else {
        icon.textContent = '🌙';
        text.textContent = 'حالت تاریک';
      }
    }

    function toggleArchiveModal(show) {
      const modal = document.getElementById('archiveModal');
      if (show) {
        renderArchiveList();
        modal.classList.add('active');
      } else {
        modal.classList.remove('active');
      }
    }

    function renderArchiveList() {
      const listContainer = document.getElementById('archiveListContainer');
      if (!archiveManifest || archiveManifest.length === 0) {
        listContainer.innerHTML = '<div style="text-align:center; padding: 20px; color: var(--text-muted);">هنوز شماره قبلی ثبت نشده است.</div>';
        return;
      }

      listContainer.innerHTML = archiveManifest.map(item => `
        <a href="${item.url}" class="archive-item">
          <div>
            <div class="archive-date-fa">📰 شماره ${item.p_date}</div>
            <div class="archive-date-g">🌍 ${item.g_date}</div>
          </div>
          <span class="archive-arrow">←</span>
        </a>
      `).join('');
    }

    const savedTheme = localStorage.getItem('theme') || 'dark';
    document.documentElement.setAttribute('data-theme', savedTheme);
    updateThemeButton(savedTheme);

    document.getElementById('searchInput').addEventListener('input', (e) => {
      searchQuery = e.target.value.trim();
      renderNews();
    });

    renderNews();
  </script>
</body>
</html>
