<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مجله خبری روزانه — ۲ آبان ۱۴۰۵</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root[data-theme="dark"] {
      --bg: #0b0f19;
      --header-bg: linear-gradient(135deg, #1e293b, #0f172a);
      --card-bg: #151d30;
      --card-border: #232f48;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --primary: #38bdf8;
      --primary-hover: #0284c7;
      --badge-bg: rgba(56, 189, 248, 0.15);
      --tab-bg: #151d30;
      --tab-border: #232f48;
      --tab-text: #94a3b8;
      --tab-active-bg: #38bdf8;
      --tab-active-text: #0f172a;
      --search-bg: #151d30;
      --search-border: #232f48;
      --toggle-bg: #1e293b;
      --toggle-border: #334155;
      --modal-bg: #151d30;
      --modal-border: #334155;
      --read-bg: #0d1322;
      --read-border: #1e293b;
      --success: #10b981;
    }
    :root[data-theme="light"] {
      --bg: #f8fafc;
      --header-bg: linear-gradient(135deg, #ffffff, #f1f5f9);
      --card-bg: #ffffff;
      --card-border: #e2e8f0;
      --text: #0f172a;
      --text-muted: #64748b;
      --primary: #0284c7;
      --primary-hover: #0369a1;
      --badge-bg: rgba(2, 132, 199, 0.1);
      --tab-bg: #ffffff;
      --tab-border: #e2e8f0;
      --tab-text: #64748b;
      --tab-active-bg: #0284c7;
      --tab-active-text: #ffffff;
      --search-bg: #ffffff;
      --search-border: #cbd5e1;
      --toggle-bg: #f1f5f9;
      --toggle-border: #cbd5e1;
      --modal-bg: #ffffff;
      --modal-border: #cbd5e1;
      --read-bg: #f1f5f9;
      --read-border: #e2e8f0;
      --success: #059669;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Vazirmatn', -apple-system, BlinkMacSystemFont, Tahoma, sans-serif;
    }
    body {
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.8;
      padding: 20px 12px;
      direction: rtl;
      transition: background-color 0.3s ease, color 0.3s ease;
    }
    .container {
      max-width: 880px;
      margin: 0 auto;
    }
    header {
      background: var(--header-bg);
      border: 1px solid var(--card-border);
      border-radius: 18px;
      padding: 22px 20px;
      margin-bottom: 20px;
      position: relative;
      text-align: center;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
      transition: all 0.3s ease;
    }
    .header-actions {
      position: absolute;
      top: 18px;
      left: 18px;
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .btn-action {
      background: var(--toggle-bg);
      border: 1px solid var(--toggle-border);
      color: var(--text);
      padding: 7px 12px;
      border-radius: 12px;
      cursor: pointer;
      font-size: 0.85rem;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-weight: 600;
      transition: all 0.2s ease;
    }
    .btn-action:hover {
      border-color: var(--primary);
    }
    h1 {
      font-size: 1.7rem;
      font-weight: 800;
      margin-bottom: 6px;
    }
    .meta-bar {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin-top: 12px;
      font-size: 0.85rem;
      color: var(--text-muted);
    }
    .meta-tag {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      padding: 4px 12px;
      border-radius: 9999px;
    }
    .search-box {
      margin-bottom: 18px;
    }
    .search-input {
      width: 100%;
      padding: 13px 18px;
      border-radius: 12px;
      background: var(--search-bg);
      border: 1px solid var(--search-border);
      color: var(--text);
      font-size: 0.95rem;
      outline: none;
      transition: all 0.2s ease;
    }
    .search-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2);
    }
    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      padding-bottom: 4px;
    }
    .tabs::-webkit-scrollbar {
      display: none;
    }
    .tab-btn {
      flex: 1;
      white-space: nowrap;
      padding: 12px 14px;
      border-radius: 12px;
      background: var(--tab-bg);
      border: 1px solid var(--tab-border);
      color: var(--tab-text);
      font-size: 0.92rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s ease;
      flex-shrink: 0;
    }
    .tab-btn.active {
      background: var(--tab-active-bg);
      color: var(--tab-active-text);
      border-color: var(--tab-active-bg);
    }
    .badge {
      background: rgba(0, 0, 0, 0.15);
      padding: 2px 7px;
      border-radius: 9999px;
      font-size: 0.8rem;
    }
    .news-grid {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .news-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 20px;
      transition: all 0.25s ease;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.03);
      position: relative;
    }
    .news-card:hover {
      border-color: var(--primary);
      transform: translateY(-2px);
    }
    .news-card.is-read {
      background: var(--read-bg);
      border-color: var(--read-border);
      opacity: 0.7;
    }
    .news-card.is-read:hover {
      opacity: 0.95;
    }
    .news-header {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 12px;
    }
    .news-num {
      background: var(--badge-bg);
      color: var(--primary);
      font-weight: 700;
      font-size: 0.85rem;
      min-width: 30px;
      height: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      margin-top: 2px;
      flex-shrink: 0;
    }
    .news-card.is-read .news-num {
      background: rgba(16, 185, 129, 0.15);
      color: var(--success);
    }
    .news-title {
      font-size: 1.1rem;
      font-weight: 700;
      line-height: 1.6;
      flex: 1;
    }
    .news-summary {
      font-size: 0.94rem;
      color: var(--text-muted);
      margin-bottom: 14px;
      text-align: justify;
      line-height: 1.75;
    }
    .news-footer {
      display: flex;
      flex-direction: column;
      gap: 10px;
      border-top: 1px solid rgba(128, 128, 128, 0.12);
      padding-top: 12px;
      font-size: 0.85rem;
    }
    .footer-top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
    }
    .meta-group {
      display: inline-flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      font-size: 0.82rem;
    }
    .news-source {
      color: var(--text-muted);
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .news-datetime {
      color: var(--text-muted);
      font-size: 0.78rem;
      background: rgba(148, 163, 184, 0.08);
      padding: 2px 7px;
      border-radius: 6px;
      border: 1px solid rgba(148, 163, 184, 0.15);
    }
    .news-category-badge {
      display: inline-flex;
      align-items: center;
      background: var(--badge-bg);
      color: var(--primary);
      border: 1px solid rgba(56, 189, 248, 0.25);
      border-radius: 6px;
      padding: 2px 8px;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .news-category-badge:hover {
      background: var(--primary);
      color: #0f172a;
      transform: translateY(-1px);
    }
    .footer-tags-row {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
    }
    .news-tag-chip {
      display: inline-flex;
      align-items: center;
      font-size: 0.75rem;
      color: var(--text-muted);
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--card-border);
      padding: 1px 7px;
      border-radius: 5px;
      cursor: pointer;
      transition: all 0.2s ease;
      font-weight: 500;
    }
    .news-tag-chip:hover {
      color: var(--primary);
      border-color: var(--primary);
      background: var(--badge-bg);
      transform: translateY(-1px);
    }
    .footer-bottom-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      border-top: 1px dashed rgba(128, 128, 128, 0.12);
      padding-top: 10px;
      margin-top: 4px;
    }
    .footer-actions-right {
      display: flex;
      align-items: center;
    }
    .footer-actions-left {
      display: flex;
      align-items: center;
      margin-right: auto;
    }
    .btn-mark-read {
      background: transparent;
      border: 1px solid var(--toggle-border);
      color: var(--text-muted);
      padding: 4px 10px;
      border-radius: 8px;
      font-size: 0.8rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-weight: 600;
      transition: all 0.2s ease;
    }
    .btn-mark-read:hover {
      border-color: var(--success);
      color: var(--success);
    }
    .news-card.is-read .btn-mark-read {
      background: rgba(16, 185, 129, 0.15);
      border-color: var(--success);
      color: var(--success);
    }
    .news-link {
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
      transition: color 0.2s ease;
    }
    .news-link:hover {
      text-decoration: underline;
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 16px;
    }
    .modal-overlay.active {
      display: flex;
    }
    .modal-card {
      background: var(--modal-bg);
      border: 1px solid var(--modal-border);
      border-radius: 18px;
      width: 100%;
      max-width: 520px;
      max-height: 80vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
      animation: modalFadeIn 0.2s ease;
    }
    @keyframes modalFadeIn {
      from { transform: scale(0.95); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
    .modal-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--card-border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .modal-title {
      font-size: 1.15rem;
      font-weight: 700;
    }
    .btn-close {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 1.4rem;
      cursor: pointer;
      line-height: 1;
      padding: 4px;
    }
    .btn-close:hover {
      color: var(--text);
    }
    .modal-body {
      padding: 16px 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .archive-item {
      background: var(--bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      text-decoration: none;
      color: var(--text);
      transition: all 0.2s ease;
    }
    .archive-item:hover {
      border-color: var(--primary);
      transform: translateX(-4px);
    }
    .archive-date-fa {
      font-weight: 700;
      font-size: 0.95rem;
    }
    .archive-date-g {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 2px;
    }
    .archive-arrow {
      color: var(--primary);
      font-size: 1.1rem;
    }

    @media (max-width: 640px) {
      header { padding: 18px 14px; padding-top: 56px; }
      .header-actions { top: 12px; left: 12px; width: calc(100% - 24px); justify-content: space-between; }
      .btn-action { font-size: 0.78rem; padding: 6px 9px; }
      h1 { font-size: 1.35rem; }
      .tabs { gap: 6px; }
      .tab-btn { padding: 10px 10px; font-size: 0.84rem; gap: 6px; }
      .badge { padding: 1px 5px; font-size: 0.75rem; }
      .news-card { padding: 16px; }
      .news-title { font-size: 0.98rem; }
      .news-summary { font-size: 0.88rem; }
      .news-footer { flex-direction: column; align-items: stretch; gap: 10px; }
      .footer-bottom-row { width: 100%; display: flex; justify-content: space-between; align-items: center; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="header-actions">
        <button class="btn-action" id="themeBtn" onclick="toggleTheme()">
          <span id="themeIcon">☀️</span>
          <span id="themeText">حالت روشن</span>
        </button>
        <button class="btn-action" onclick="toggleArchiveModal(true)">
          <span>📚</span>
          <span>آرشیو شماره‌ها</span>
        </button>
      </div>

      <h1>📰 مجله خبری روزانه</h1>
      <div class="meta-bar">
        <span class="meta-tag">📅 ۲ آبان ۱۴۰۵</span>
        <span class="meta-tag">🌍 ۲۴ October ۲۰۲۶</span>
        <span class="meta-tag">⏰ ساعت انتشار: ۱۹:۳۰</span>
      </div>
    </header>

    <div class="search-box">
      <input type="text" id="searchInput" class="search-input" placeholder="🔍 جست‌وجو در تمام اخبار امروز...">
    </div>

    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab('persian', this)">
        🇮🇷 عمومی
        <span class="badge" id="badge-persian">۷</span>
      </button>
      <button class="tab-btn" onclick="switchTab('tech', this)">
        🤖 تکنولوژی
        <span class="badge" id="badge-tech">۱۶</span>
      </button>
      <button class="tab-btn" onclick="switchTab('media', this)">
        🎬 مدیا
        <span class="badge" id="badge-media">۳۲</span>
      </button>
    </div>

    <main id="newsContainer" class="news-grid"></main>
  </div>

  <div class="modal-overlay" id="archiveModal" onclick="if(event.target===this) toggleArchiveModal(false)">
    <div class="modal-card">
      <div class="modal-header">
        <div class="modal-title">📚 آرشیو شماره‌های قبلی مجله</div>
        <button class="btn-close" onclick="toggleArchiveModal(false)">&times;</button>
      </div>
      <div class="modal-body" id="archiveListContainer"></div>
    </div>
  </div>

  <script>

,c_limit/Business_How%20Many%20Billions%20Would%20It%20Take%20to%20Hold%20Meta%20Accountable_v1.jpg", "category": "هوش مصنوعی مولد", "tags": ["Meta"], "datetime_fa": "۱ آبان • ۱۸:۳۰"}, {"source": "Zoomit", "title": "نبرد خاموش TSMC با انحصار چین بر عناصر خاکی کمیاب", "link": "https://www.zoomit.ir/tech/469625-tsmc-seeks-rare-earth-alternatives/", "summary": "تی‌اس‌ام‌سی در حال بررسی جایگزین‌های عناصر خاکی کمیاب در تجهیزات کارخانه‌ای برای کاهش خطرات ناشی از محدودیت‌های صادراتی چین است.", "date_str": "2026-10-23T15:15:00+00:00", "hash": "7628a225e1f803dd", "title_fa": "نبرد خاموش TSMC با انحصار چین بر عناصر خاکی کمیاب", "summary_fa": "تی‌اس‌ام‌سی در حال بررسی جایگزین‌های عناصر خاکی کمیاب در تجهیزات کارخانه‌ای برای کاهش خطرات ناشی از محدودیت‌های صادراتی چین است. تبلیغات بزرگ‌ترین سازنده‌ی قراردادی تراشه در جهان، بررسی گزینه‌های جایگزین برای قطعات حاوی عناصر خاکی کمیاب در تجهیزات کارخانه‌ای را آغاز کرده است. سه منبع آگاه به رویترز اعلام کرده‌اند هدف از اقدام مذکور، کاهش ریسک اختلال در تولید پیشرفته‌ترین ریزتراشه‌های جهان در پی محدودیت‌های صادراتی چین به شمار می‌رود. تسلط چین بر عناصر خاکی کمیاب پس از وضع تحریم‌ها روی برخی مواد، آهن‌رباها و فناوری‌های پردازش، به نقطه‌ی آسیبی برای صنعت تراشه تبدیل شده است. آهن‌رباهای خاکی کمیاب معمولا در موتورهایی به کار می‌روند که قطعات متحرک تجهیزات صنعتی از جمله ماشین‌آلات اتوماسیون کارخانه‌ها را به حرکت درمی‌آورند. کمبود چنین قطعات تخصصی خط تولید تراشه‌های مربوط به گوشی، سرورهای هوش مصنوعی، دیتاسنترها و زنجیره‌های تامین دفاعی را با چالش روبه‌رو می‌کند. مدیران صنعتی آگاه گزارش داده‌اند که TSMC امکان‌سنجی استفاده از موتورهای فاقد عناصر خاکی کمیاب را با تامین‌کنندگان مطرح کرده است. گفت‌وگوها در مراحل آغازین قرار دارد و هنوز به مرحله‌ی پیاده‌سازی گسترده در خطوط تولید نرسیده است. مدیران این مرکز صنعتی حاضر به ارائه‌ی توضیحات بیشتر درباره‌ی برنامه‌های جاری نشدند. ریموند گرین ، مدیر مؤسسه‌ی آمریکایی در تایوان، گفت: «ایالات متحده در همکاری با تایوان و شرکای دیگر در حال توسعه‌ی منابع تامین جایگزین، گسترش ظرفیت پردازش و ساخت زنجیره‌های تامین ان e , \"A Christmas Carol,\" and \"Dune Messiah.\" There are also some new classics set to be adapted this year, including \"Klara and the Sun\" and \"Sunrise on the Reaping.\" We've compiled a list of 13 must-read books that you should crack open before they're adapted this year. Whalefall Whalefall. MTV Books Release date: October 16 in theaters Daniel Kraus published \"Whalefall\" in 2023. It's a pretty self-contained, if wild, story: What would happen if you got swallowed by a whale? And not in a biblical, Jonah sense — in a literal, swallowed-while-scuba-diving sense. The film stars Austin Abrams as Jay (get it? J as in Jonah?) and Josh Brolin as Mitt, Jay's deceased father, from whom he was estranged. That's the whole reason he dives in the first place; he's diving to find his father's remains. Wildwood Wildwood. Storytide Release date: October 23 in theaters Stop-motion studio LAIKA's latest film, \"Wildwood,\" is based on the 2011 novel of the same name, written by Colin Meloy and illustrated by Carson Ellis. Both the film and the book follow Prue, a teenager, whose baby brother, Mac, is stolen by a pack of birds and taken into a mystical forest. She, along with her classmate Curtis, ventures into the woods to rescue Mac and perhaps save this magical land. Prue is voiced by Peyton Elizabeth Lee and Curtis is voiced by Jacob Tremblay. Carey Mulligan, Mahershala Ali, Awkwafina, Jake Johnson, Angela Bassett, Charlie Day, and Amandla Stenberg also star. Klara and the Sun Klara and the Sun. Alfred A. Knopf Release date: October 23 in theaters Kazuo Ishiguro's 2021 novel \"Klara and the Sun\" was longlisted for the Booker Prize upon its publication. The book takes place in a not-too-distant dystopian future where rich children can be gifted \"Artificial Friends\" to help them socialize, since now all schooling is done at home, online. Klara, the narrator, is purchased for a sick girl named Josie. I", "date_str": "2026-10-23T14:45:53+00:00", "hash": "1107c9bce8b381a8 biggest mistakes I see couples make.", "link": "https://www.businessinsider.com/mistakes-couples-make-wedding-photographer-advice-how-to-avoid-2026-10", "summary": "I ve seen all kinds of weddings over the past decade, but many couples make the same mistakes. Courtesy of Cameron Dever I've worked as a wedding photographer for years, and I've seen couples make the same mistakes. Too many people schedule the day to the minute and don't get the chance to enjoy their wedding. Not budgeting for the right photographer and videographer can lead to disappointing results. I've been photographing weddings for over a decade, so I've witnessed countless ceremonies and receptions — some disastrous, others impeccable. Throughout the years, I've also watched couples make the same mistakes over and over. Here are a few I wish they'd avoid. Filling the day-of schedule with way too much Couples have to find time for the ceremony, photos, eating and drinking, dancing, talking to the people they invited, and connecting with each other. When you try to fit too many things into the day, no one — especially the married couple — has time to breathe and relish the moments. The day can feel rushed and more focused on activities than the celebration of love. A packed schedule often leaves couples stressed, with no time to eat because they've been pushed from one 15-minute window to the next. However, your wedding day shouldn't be a blur. You should have time to soak in every moment. When you map out your day, prioritize traditions you love and estimate how long each will take … then add buffers. I also recommend working with a wedding planner or coordinator to plan your timeline, or consulting with your photographer and other vendors when arranging your schedule. They've experienced countless weddings and know firsthand how much time each activity usually takes. Letting small mishaps and issues ruin the whole day Learning how to laugh off the small mishaps is absolutely key. Courtesy of Cameron Dever One of the things I always tell my couples right before their wedding day is that something will go wrong. I don't say this to scare them or make them worry, but mostly to adjust their expectations. No matter how much planning you do, people are imperfect, the weather can be unpredictable, and life happens. By the time the day comes, couples have done all they can to make sure it's how they pictured it. All that matters after that is that they enjoy their wedding. Missing flowers or a cake that's the wrong flavor can throw off your day — but these unexpected mishaps shouldn't be so consuming that they're all you remember from your wedding. I don't ", "date_str": "2026-10-23T14:44:18+00:00", "hash": "3960dfd8a44e6acd", "title_fa": "بیش از یک دهه است که از عروسی عکاسی کرده ام. در اینجا 4 تا از بزرگترین اشتباهاتی که می بینم زوج ها مرتکب می شوند آورده شده است.", "summary_fa": "من در دهه گذشته انواع عروسی ها را دیده ام، اما بسیاری از زوج ها اشتباهات مشابهی را انجام می دهند. با حسن نیت از Cameron Dever من سال ها به عنوان عکاس عروسی کار کرده ام و زوج ها را دیده ام که اشتباهات مشابهی انجام می دهند. بسیاری از مردم هر روز برنامه ریزی می کنند و فرصت لذت بردن از عروسی خود را ندارند. عدم تخصیص بودجه برای عکاس و فیلمبردار مناسب می تواند به نتایج ناامیدکننده ای منجر شود. من بیش از یک دهه است که از عروسی ها عکاسی می کنم، بنابراین شاهد مراسم و پذیرایی های بی شماری بوده ام - برخی فاجعه بار، برخی دیگر بی عیب و نقص. در طول سال‌ها، من زوج‌ها را بارها و بارها مشاهده کرده‌ام که اشتباهات مشابهی انجام می‌دهند. در اینجا چند مورد است که ای کاش آنها از آنها اجتناب می کردند. پر کردن برنامه روزانه با بیش از حد زیاد زوج ها باید برای مراسم، عکس، خوردن و آشامیدن، رقصیدن، صحبت کردن با افرادی که دعوت کرده اند و ارتباط با یکدیگر وقت پیدا کنند. وقتی سعی می کنید چیزهای زیادی را در روز بگنجانید، هیچ کس - به خصوص زوج متاهل - وقت برای نفس کشیدن و لذت بردن از لحظات ندارند. این روز ممکن است عجله داشته باشد و بیشتر بر فعالیت‌ها متمرکز باشد تا جشن عشق. یک برنامه فشرده اغلب زوج ها را تحت فشار قرار می د de by a combination of ending consultant contracts, natural attrition, and targeted employee exit packages. China is not Volvo's only problem. The company also said that US tariffs and the loss of Washington's consumer incentives for electrified cars squeezed margins. Volvo previously bet heavily on a rapid consumer transition to electric vehicles, aiming for an all-electric portfolio by 2030 . It's since walked back that goal to include plug-in hybrid vehicles. The automaker also said that Polestar — its EV offshoot that is exiting the US market — also posted losses. Volvo's answer is to get more local: the automaker said it would introduce two fresh cars tailored specifically for the Chinese market by the middle of next year. Those cars will be developed in close collaboration with Geely and will include a Chinese tech stack and advanced driver-assist technologies \"to make them fully competitive in China.\" Read the original article on Business Insider", "date_str": "2026-10-23T14:40:10+00:00", "hash": "4392be7c42a001df", "title_fa": "ولوو قصد دارد 2500 شغل خود را به دلیل جنگ قیمت گذاری کبود در چین اخراج کند", "summary_fa": "خودروسازان قدیمی برای رقابت در چین با مشکل مواجه هستند. بلومبرگ/گتی ایماژ خودروسازان قدیمی همچنان از کاهش فروش خود در چین خبر می دهند. ولوو جدیدترین است. در حال برنامه ریزی برای 2500 کاهش شغل جهانی برای صرفه جویی در حدود 530 میلیون دلار است. آمریکا هم مشکل دارد. تعرفه‌ها، مشوق‌های کاهش‌یافته خودروهای برقی و خروج Polestar نیز صدمه دیده است. بازار خودروهای بی‌رحم چین در حال لقمه‌ای از ولوو است. روز جمعه، این خودروساز لوکس سوئدی اعلام کرد که درآمد چین در سال گذشته تقریباً 50 درصد کاهش یافته است. این شرکت گفت، مانند بسیاری از خودروسازان ممتاز قدیمی، با افزایش \"فوق العاده رقابت\" از سوی رقبای چینی مواجه است. ولوو اعلام کرد که قصد دارد در پاسخ به این اقدام 2500 شغل در سطح جهان از جمله حدود 2000 شغل در سوئد را تعدیل کند. این بخشی از تلاش برای کاهش حدود 530 میلیون دلاری هزینه ها است. هاکان ساموئلسون، مدیرعامل این شرکت در بیانیه‌ای گفت: «ما در یک محی ate 2022. The next few years were spent grappling with his illness and, eventually, his death. I quickly felt the whole ecosystem of my life fall apart. I was struggling at work, and I didn't know how to ask for help. I tried my best to carry on as normal and try to convince myself that the work I was doing — and, by extension, myself — was important. As I edged toward my 30th birthday in early 2025, against a backdrop of grief and burnout, the need for change felt urgent and existential. I made a drastic change I decided to go back to school in a new country. Sarah Catherine Cowie It was shortly after this, in the spring, that I decided a move abroad was exactly what I needed. I quit my job and spent the next few months sending applications to schools across Europe, hoping to pursue a master's degree in my field and embark on a fresh start. When an offer came from a university in Budapest, I knew that was where I would be going. I had visited for the first time about a decade prior, and fallen in love. I remember thinking, \"I could see myself living here one day,\" not thinking that that \"one day\" would ever actually come. In September, I packed up my life, started renting out my Edinburgh flat, and made the move. The first few months brought a mix of excitement, fear, and disbelief. There was a lot of bureaucracy to navigate — forms to fill out, applications to be processed — and I couldn't relax until everything was completed. I was also pretty lonely in the beginning. When I first moved, I didn't know a single person in Budapest and had to build a completely new social circle from scratch. I also sometimes felt like an imposter: I was a lot older than the fresh-faced students in their", "date_str": "2026-10-23T14:40:01+00:00", "hash": "58ce9fce011b104c", "title_fa": "من سالها صرف ساختن یک زندگی «پایدار» و بالا رفتن از نردبان کار کردم. سپس کارم را رها کردم و به مجارستان رفتم.", "summary_fa": "من همیشه بوداپست را دوست داشتم، اما هرگز فکر نمی کردم واقعا بتوانم ب       media: [{"source": "Billboard", "title": "Paris Hilton Is a ‘Slave 4 U’ in 4th Annual Britney Spears Halloween Costume: ‘Such a Legendary Moment in Pop Music’ (Exclusive Photos)", "link": "https://www.billboard.com/photos/paris-hilton-britney-spears-halloween-costume-2026-photos-1236366397/", "summary": "What is Paris Hilton s costume for Halloween 2026? It s Britney, b h (again)! In photos exclusively shared with Billboard on Friday (Oct. 23), the mogul debuts her spooky-season tribute to longtime friend and pop icon Britney Spears , specifically channeling her performance of I m a Slave 4 U at the MTV Video Music Awards in 2001. In the snaps by Brian Ziff, Hilton models a re-creation of the Princess of Pop s green bandeau and bejeweled shorts and yes, she even topped it off with an albino Burmese python resembling the one Spears famously carried on her shoulders on the awards show stage 25 years ago. “Britney is one of the most iconic artists of our generation, and ‘I’m a Slave 4 U’ will always be such a legendary moment in pop music, Hilton tells Billboard exclusively. The song, the choreography, the fashion it was everything. I’ve loved re-creating her different looks over the years because each one represents such a special moment in music history. She added: Britney is not only an icon, but also a dear friend, and I’ll always love celebrating her and the incredible impact she’s had on all of us.” This isn t the first year Hilton has transformed into Spears for Halloween. In 2025, the DJ sported a shiny red jumpsuit and a teased ponytail to emulate the Oops! I Did It Again music video, and the year before that, she re-created Spears schoolgirl look in the Baby One More Time visual. In 2023, she celebrated Hallow s Eve in a blue flight attendant getup à la Brit in the 2003 Toxic music video. At this point, it s clear that Hilton is one of Spears biggest fans and the love goes both ways. The singer wrote in her The Woman in Me memoir that the Simple Life alum was “one of the people who was kindest to me when I really needed kindness. “I was crying when I read that, Hilton later said of the passage on The Kelly Clarkson Show . That really touched me. She’s just so strong. I love her so much, and I’m just so proud of her. See photos of Hilton as Spears circa 2001 below, and revisit the full VMAs performance.", "date_str": "2026-10-23T16:00:04+00:00", "hash": "0e740e1e42bdd7cf", "title_fa": "پاریس هیلتون یک «برده 4 یو» در چهارمین لباس هالووین بریتنی اسپیرز است: «لحظه‌ای افسانه‌ای در موسیقی پاپ» (عکس‌های اختصاصی)", "summary_fa": "لباس پاریس هیلتون برای هالووین 2026 چیست؟ این بریتنی است، b h (دوباره)! در عکس‌هایی که به طور انحصاری در روز جمعه (23 اکتبر) با بیلبورد به اشتراک گذاشته شد، این غول اولین ادای احترام فصل ترسناک خود را به دوست دیرینه و نماد پاپ بریتنی اسپیرز ارائه می‌کند، و به طور خاص اجرای خود را از Im a Slave 4 U در جوایز موسیقی ویدیوی MTV در سال 2001 کانالیزه می‌کند. در عکس‌های برایان زیف، هیلتون مدلی از بند سبز شاهزاده پاپ و شورت‌های نگین‌دار را بازآفرینی می‌کند و بله، او حتی با یک مار پیتون آلبینو برمه‌ای شبیه به مار پیتونی که اسپیرز ۲۵ سال پیش روی شانه‌های خود روی صحنه نمایش جوایز حمل می‌کرد، به نمایش درآمد. هیلتون به طور انحصاری به بیلبورد می گوید: «بریتنی یکی از نمادین ترین هنرمندان نسل ما است و «من یک برده 4 یو هستم» همیشه یک لحظه افسانه ای در موسیقی پاپ خواهد بود. آهنگ، رقص، مد همه چیز بود. من در طول سال‌ها دوست داشتم که ظاهر متفاوت او را دوباره خلق کنم، زیرا هر کدام نشان‌دهنده یک لحظه خاص در تاریخ موسیقی است. او افزود: بریتنی نه تنها یک نماد، بلکه یک دوست عزیز است و من همیشه دوست دارم از او و تأثیر باورنکردنی او بر همه ما تجلیل کنم. این اولین سالی نیست که هیلتون برای هالووین به Spears تبدیل شده است. در سال 2025، دی جی یک لباس سرهنگ قرمز براق و یک دم اسبی تمسخرآمیز برای تقلید از اوپس به تن کرد! موزیک ویدیو I Did It Again، و سال قبل از آن، او ظاهر دختر دانش آموزی Spears را در تصویری Baby One More Time بازسازی کرد. در سال 2023، او در موزیک ویدیوی Toxic در سال 2003، جشن حلو را با مهماندار آبی رنگ در بریتانیا جشن گرفت. در این مرحله، واضح", "image_url": "https://www.billboard.com/wp-content/uploads/2026/10/paris-hilton-britney-spears-2008-billboard-1800.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["موسیقی"], "datetime_fa": "۱ آبان • ۱۹:۳۰"}, {"source": "Billboard", "title": "Ariana Grande Shows Off New Bob That Has Boyfriend Ricky Alvarez Falling in Love All Over Again", "link": "https://www.billboard.com/music/music-news/ariana-grande-debuts-new-hairstyle-boyfriend-ricky-alvarez-1236367155/", "summary": "You like my hair? Gee, thanks, just chopped it. Ariana Grande is now rocking a bob, which she showed off for the first time in a Friday (Oct. 23) post on Instagram and boyfriend Ricky Alvarez is all for it. Related Ariana Grande Mourns Coco, Her Beloved Dog of 17 Years: I Will Miss You Every Day Pete Davidson Slams Online Criticism of Ex-Fiancée Ariana Grande s Appearance: I Think It’s F ked Up Ariana Grande Makes Heartfelt Tweak to Thank U, Next Lyric Dedicated to Ricky Alvarez in Final Eternal Sunshine Show The pop superstar shared a string of selfies in her post, holding the camera sideways and gazing into the lens. But instead of pulled into her signature ponytail or swept up in the chic bun Grande s been wearing lately, her hair stops short a few inches above her shoulders, the ends flipping upward in a peppy swoop. Grande let the new look speak for herself, captioning the photos with a simple heart and tagging hairstylist Brandon Pietsch. The comments quickly filled up with famous friends complimenting the Grammy winner s makeover, with Gigi Hadid writing, rlly cute !!!!!!!!! and Victorious costar Daniella Monet typing, Natural cutie. But Alvarez s comment was definitely the most forward. i wanna ask you out, the photographer wrote. Grande and Alvarez first dated back in 2015, meeting when he worked as the the singer s backup dancer. They split sometime in 2016, but rekindled their romance a decade later, with fans spotting them together throughout summer 2026 amid the Wicked actress Eternal Sunshine Tour and Petal album rollout. “Wrote some songs about Ricky/ I’m tryna make him my last,” Grande sang at her final show of the trek, meaningfully tweaking a lyric in her 2018 seven-week Billboard Hot 100 -topper, Thank U, Next to declare her reignited love for Alvarez. Petal arrived on the last day of July and debuted atop the Billboard 200 . It spawned Grande s 10th Hot 100 No. 1, Hate That I Made You Love Me. After the music video for the album s title track dropped, however, an outpour of comments on her body and appearance flooded the internet. Her rep revealed that she d be taking a step back from the spotlight shortly afterward, citing endless, ongoing public scrutiny. The break has involved dropping out of the West End revival of Sunday in the Park With George which would-be costar Jonathan Bailey has also since pulled out of and scaling back public appearances. She will, however, participate in Focker-in-Law promo as the film s Nov. 25 premiere d", "date_str": "2026-10-23T15:26:17+00:00", "hash": "70d4ef421ddcafc5", "title_fa": "آریانا گرانده باب جدیدی را نشان می دهد که دوست پسرش ریکی آلوارز دوباره عاشق شده است", "summary_fa": "موهای من را دوست داری؟ مرسی، همین الان خردش کردم. آریانا گرانده اکنون در حال تکان دادن باب است که برای اولین بار در یک پست جمعه (23 اکتبر) در اینستاگرام خود را نشان داد و دوست پسر ریکی آلوارز همه چیز را برای این کار دوست دارد. مرتبط آریانا گراند عزادار کوکو، سگ محبوبش در 17 سال است: من هر روز دلم برایت تنگ خواهد شد پیت دیویدسون انتقاد آنلاین از نامزد سابق آریانا گرانده ظاهر آریانا گرانده را به باد انتقاد می‌گیرد: من فکر می‌کنم این کار انجام می‌شود آریانا گرانده به‌خوبی توییتی را انجام می‌دهد. نمایش سوپراستار پاپ یک رشته سلفی در پست خود به اشتراک گذاشت که دوربین را به پهلو گرفته و به لنز خیره شده است. اما به جای اینکه دم اسبی مشخص خود را بکشد یا با مدل موی شیکی که اخیراً گرانده پوشیده است، موهایش چند اینچ بالاتر از شانه‌هایش کوتاه می‌شود، و انتهای آن به شکلی سرحال به سمت بالا می‌چرخد. گرانده اجازه داد ظاهر جدید خودش صحبت کند، عکس‌ها را با یک قلب ساده شرح می‌دهد و آرایشگر براندون پیچ را تگ می‌کند. نظرات به سرعت مملو از دوستان مشهوری شد که از تغییر چهره برنده گرمی تعریف می کردند، با نوشتن جیجی حدید، بسیار زیبا!!!!!!!!! و بازیگر پیروز دانیلا مونه در حال تایپ کردن، عیار طبیعی. اما نظر آلوارز قطعاً جلوگیرترین بود. عکاس نوشت: می خواهم از شما درخواست کنم. گرانده و آلوارز برای اولین بار در سال 2015 با هم قرار گرفتند و زمانی که او به عنوان رقصنده پشتیبان خواننده کار می کرد با هم ملاقات کردند. آنها زمانی در سال 2016 از هم جدا شدند، اما یک دهه بعد دوباره عاشقانه خود را احیا کردند، و طرفداران آنها را در طول تابستان 2026 در کنار هم در میان تور Eternal Sunshine Tour و آلبوم گلبرگ بازیگر", "image_url": "https://www.billboard.com/wp-content/uploads/2026/01/P103MHHX-e1786379508733.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["سینما", "موسیقی"], "datetime_fa": "۱ آبان • ۱۸:۵۶"}, {"source": "Billboard", "title": "After a Turbulent Year, BNXN Is ‘Back Outside’ & Taking Charge of His Career: Find His Track-by-Track Guide to New EP", "link": "https://www.billboard.com/lists/bnxn-still-in-charge-back-outside-interview/", "summary": "After a heated split with his former management team in 2025, BNXN finds himself in redemption mode. The Nigerian hitmaker, who dropped out of college after catching Burna Boy s attention in the early 2020s, is looking to recapture his momentum, one song at a time. “A whole lot has changed,” BNXN reflects shortly after releasing his new EP, Still in Charge . “After I dropped the Captain album, I toured, reshuffled my team, and took a lot of time off to prepare the music that was coming next. Came back in May and dropped a little project with Sarz called The Game Needs Us. One of the songs went really crazy, Back Outside. I m really excited I got to put that out because it showed people that [ Captain ] wasn t a joke. He really knows what he s doing.” With Still in Charge , released earlier this month, the Afrobeats star sounds rejuvenated and eager to turn the page. Whether he s joining forces with Asake on the opener “Eja Meja” or wrestling with his past on “Deliberate Work,” BNXN (pronounced Benson) moves with purpose and intention. The six-track offering also radiates a warm, festive energy as he looks to shed the remnants of his turbulent past and embrace a fresh start. On “Shamaya,” BNXN trades his frustrations for celebration, revealing a lighter, more carefree side of the twenty-something singer-songwriter. Billboard caught up with BNXN for his explanation of each of the six tracks on Still in Charge , the surprising amount he paid Qing Madi for her background vocals on “16,” and how he bounced back from his highly publicized online crashout.", "date_str": "2026-10-23T15:16:31+00:00", "hash": "a5427531d34fb879", "title_fa": "پس از یک سال پرتلاطم، BNXN \"بازگشت به بیرون\" است و مسئولیت حرفه خود را بر عهده می گیرد: راهنمای آهنگ به تراک او را برای EP جدید پیدا کنید", "summary_fa": "پس از جدایی شدید با تیم مدیریت سابق خود در سال 2025، BNXN خود را در حالت رستگاری می بیند. هیت ساز نیجریه ای که پس از جلب توجه Burna Boy در اوایل دهه 2020، کالج را رها کرد، به دنبال این است که شتاب خود را دوباره به دست آورد، یک آهنگ. BNXN مدت کوتاهی پس از انتشار EP جدید خود، Still in Charge، منعکس می کند: «خیلی چیزها تغییر کرده است. «بعد از اینکه آلبوم کاپیتان را رها کردم، به تور رفتم، تیمم را تغییر دادم و زمان زیادی را برای آماده کردن موسیقی که در راه بود، گرفتم. در ماه می برگشتم و پروژه کوچکی را با Sarz به نام The Game Needs Us منتشر کردم. یکی از آهنگ ها واقعا دیوانه شد، Back Outside. من واقعاً هیجان‌زده‌ام که مجبور شدم آن را بیان کنم، زیرا به مردم نشان داد که [کاپیتان] شوخی نبود. او واقعاً می داند که دارد چه کار می کند.» با Still in Charge که در اوایل این ماه منتشر شد، ستاره Afrobeats جوان شده و مشتاق به تغییر صفحه به نظر می رسد. چه او در حال پیوستن به نیروهای Asake در بازکننده \"Eja Meja\" یا کشتی با گذشته خود در \"Deliberate Work\" باشد، BNXN (تلفظ بنسون) با هدف و نیت حرکت می کند. پیشنهاد شش آهنگی همچنین انرژی گ inst the Haitian resident of Springfield. Legend s support for Acton comes as Ramaswamy s campaign has come under fierce bipartisan pushback for a campaign ad in which Acton s long-estranged mother repeatedly calls her daughter a liar while insinuating that Acton s claims that she was sexually abused by her stepdad, and that the family was homeless and lived in a tent for a period, are untrue. “It’s not easy for a mother to say this, but Amy has a serious problem,” Donna Arthur says in the ad. “She lies about her past. She says she grew up living in a tent. None of that is true. She’s lied her entire life. Acton, 60, has said she hasn t spoken to her mother since she was 12-years-old, when officials removed her from her mother s custody. Police arrested Acton s stepfather in July 1978 on rape charges , with a grand jury later indicting Arthur for engaging in sexual conduct with Acton when she was under the age of 13. Arthur, who pleaded not guilty to the charges initially, did not appear in court and later fled, along with her mother, and became a fugitive. 13ABC also reported that documents provided by Acton s campaign include police and court records and a 1982 sheriff s report in which a park manager confirmed that Acton s stepfather, Cledith Arthur, lived at the campground years earlier. The ad, which many political pundits have called the most disturbing of a very heated political season, has gotten pu", "date_str": "2026-10-23T15:16:30+00:00", "hash": "fe8e12699023103d", "title_fa": "جان لجند با امی اکتون، نامزد دموکرات فرماندار اوهایو در میان واکنش‌های شدید علیه تبلیغ «عمقاً نگران‌کننده» مخالف ظاهر می‌شود.", "summary_fa": "جان لجند روز دوشنبه (26 اکتبر)، زمانی که قرار است همراه با مدیر سابق وزارت بهداشت اوهایو در یک گردهمایی در دیتون ظاهر شود، کلاه خود را برای کاندیدای فرمانداری اوهایو، دکتر امی، به رینگ خواهد انداخت. Legend تنها یکی از نام‌های جسورانه‌ای است که اکتون در انتخابات میان‌دوره‌ای 3 نوامبر با او در جاده‌ها به میدان می‌آورد و در آن با غول فناوری و -choice-1237171609/", "summary": "Abramorama has acquired North American theatrical distribution rights to John David Coles documentary The Choice and set a Jan 15 release date at the Quad in NYC followed by a national rollout. Winner of the Brizzolara Family Foundation Award for Films of Conflict Resolution at the 2026 Hamptons International Film Festival, The Choice is [ ]", "date_str": "2026-10-23T15:00:00+00:00", "hash": "9e76b4bd393d5097", "title_fa": "آبراموراما حقوق آمریکای شمالی را می گیرد و فیلم «انتخاب» را برای جان دیوید کولز منتشر می کند", "summary_fa": "آبراموراما حقوق پخش تئاتر در آمریکای شمالی را برای مستند جان دیوید کولز The Choice به دست آورده است و تاریخ اکران ۱۵ ژانویه را در Quad در نیویورک و پس از آن یک پخش ملی تعیین کرده است. برنده جایزه بنیاد خانواده بریزولارا برای فیلم‌های حل تعارض در جشنواره بین‌المللی فیلم همپتونز 2026، فیلم انتخاب [ ] فیلم دیوار سخنگو/ تصاویر غول‌پیکر است که توسط کولز، جیسون اورانز، پاملا رایان و تامار یوفه تهیه شده است، این مستند داستان‌های سه زن در طول نسل‌ها را در هم می‌پیوندد: «تلفات جنگی، هر یک از دست‌رفته‌ها، جنگ‌افزارها و هریک از آنها مشخص شده است». ایگر، روانشناس مشهور، بازمانده هولوکاست و نویسنده کتاب پرفروش سال 2017 انتخاب: امکان را در آغوش بگیرید. آیریس حییم، یک مادر اسرائیلی که پسرش یوتم در جریان حملات 7 اکتبر گروگان گرفته شد. و ساپیر کوهن که 55 روز به عنوان گروگان در غزه جان سالم به در برد. این سند با فیلم‌های آرشیوی، مصاحبه‌ها، حضورهای عمومی، ضبط‌های صوتی و نوشته‌های شخصی بین گذشته و حال حرکت می‌کند. داستان‌های مرتبط کارگردان مستند روری کندی در مورد محاکمه الک بالدوین و اینکه چرا Russt Star در ابتدا به فیلم او واکنش منفی نشان داد. اسکورسیزی Exec-Produces; تریلر اگر در ماه مه گذشته در سال 98 درگذشت را تماشا کنید. ستون اصلی زندگی و کار او این است که در حالی که نمی توانیم آنچه را که برایمان اتفاق افتاده تغییر دهیم، می توانیم انتخاب کنیم که اکنون چگونه زندگی کنیم. ایگر پس از جان سالم به در بردن از آشویتس، زندگی خود را وقف کمک به کهنه سربازان ویتنام و دیگران برای مقابله با تروما، گناه و اندوه کرد. در ددلاین «Dr. ادی     let currentTab = 'persian';
    let searchQuery = '';
    let readArticles = new Set(JSON.parse(localStorage.getItem('read_articles_registry') || '[]'));

    function toFaDigits(n) {
      const f = ['۰','۱','۲','۳','۴','۵','۶','۷','۸','۹'];
      return n.toString().replace(/\d/g, d => f[d]);
    }

    function toggleRead(hash) {
      if (readArticles.has(hash)) {
        readArticles.delete(hash);
      } else {
        readArticles.add(hash);
      }
      localStorage.setItem('read_articles_registry', JSON.stringify(Array.from(readArticles)));
      renderNews();
    }

    function renderNews() {
      const container = document.getElementById('newsContainer');
      const rawItems = data[currentTab] || [];
      
      const filtered = rawItems.filter(item => {
        if (!searchQuery) return true;
        const q = searchQuery.toLowerCase();
        const title = (item.title_fa || item.title || '').toLowerCase();
        const summary = (item.summary_fa || item.summary || '').toLowerCase();
        const source = (item.source || '').toLowerCase();
        const category = (item.category || '').toLowerCase();
        const tags = (item.tags || []).join(' ').toLowerCase();
        return title.includes(q) || summary.includes(q) || source.includes(q) || category.includes(q) || tags.includes(q);
      });

      const unreadList = [];
      const readList = [];

      filtered.forEach(item => {
        if (readArticles.has(item.hash)) {
          readList.push(item);
        } else {
          unreadList.push(item);
        }
      });

      const sortedItems = [...unreadList, ...readList];

      if (sortedItems.length === 0) {
        container.innerHTML = '<div style="text-align:center; padding: 40px; color: var(--text-muted);">هیچ خبری در این بخش در ۲۴ ساعت گذشته ثبت نشده است.</div>';
        return;
      }

      container.innerHTML = sortedItems.map((item, idx) => {
        const title = item.title_fa || item.title || '';
        const summary = item.summary_fa || item.summary || '';
        const source = item.source || 'منبع خبر';
        const link = item.link || '#';
        const isRead = readArticles.has(item.hash);
        const num = toFaDigits(idx + 1);
        const category = item.category || '';
        const tags = item.tags || [];
        const datetimeFa = item.datetime_fa || '';

        return `
          <article class="news-card ${isRead ? 'is-read' : ''}" id="card-${item.hash}">
            <div class="news-header">
              <span class="news-num">${isRead ? '✓' : num}</span>
              <h2 class="news-title">${title}</h2>
            </div>
            ${summary ? `<p class="news-summary">${summary}</p>` : ''}
            <div class="news-footer">
              <div class="footer-top-row">
                <div class="meta-group">
                  <span class="news-source">📌 ${source}</span>
                  ${datetimeFa ? `<span class="news-datetime">🕒 ${datetimeFa}</span>` : ''}
                  ${category ? `<span class="news-category-badge" onclick="filterByTag('${category}')">📂 ${category}</span>` : ''}
                </div>
              </div>
              ${tags && tags.length > 0 ? `
                <div class="footer-tags-row">
                  ${tags.map(t => `<span class="news-tag-chip" onclick="filterByTag('${t}')">#${t}</span>`).join('')}
                </div>
              ` : ''}
              <div class="footer-bottom-row">
                <div class="footer-actions-right">
                  <button class="btn-mark-read" onclick="toggleRead('${item.hash}')">
                    ${isRead ? '✓ خوانده شد' : '○ علامت خوانده‌شده'}
                  </button>
                </div>
                <div class="footer-actions-left">
                  ${link && link.startsWith('http') ? `<a href="${link}" target="_blank" rel="noopener noreferrer" class="news-link">مطالعه اصل خبر ↗</a>` : ''}
                </div>
              </div>
            </div>
          </article>
        `;
      }).join('');
    }

    function filterByTag(val) {
      const searchInput = document.getElementById('searchInput');
      if (searchInput) {
        searchInput.value = val;
        searchQuery = val;
        renderNews();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    }

    function switchTab(tab, el) {
      currentTab = tab;
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      if (el) el.classList.add('active');
      renderNews();
    }

    function toggleTheme() {
      const html = document.documentElement;
      const current = html.getAttribute('data-theme') || 'dark';
      const next = current === 'dark' ? 'light' : 'dark';
      html.setAttribute('data-theme', next);
      localStorage.setItem('theme', next);
      updateThemeButton(next);
    }

    function updateThemeButton(theme) {
      const icon = document.getElementById('themeIcon');
      const text = document.getElementById('themeText');
      if (theme === 'dark') {
        icon.textContent = '☀️';
        text.textContent = 'حالت روشن';
      } else {
        icon.textContent = '🌙';
        text.textContent = 'حالت تاریک';
      }
    }

    function toggleArchiveModal(show) {
      const modal = document.getElementById('archiveModal');
      if (show) {
        renderArchiveList();
        modal.classList.add('active');
      } else {
        modal.classList.remove('active');
      }
    }

    function renderArchiveList() {
      const listContainer = document.getElementById('archiveListContainer');
      if (!archiveManifest || archiveManifest.length === 0) {
        listContainer.innerHTML = '<div style="text-align:center; padding: 20px; color: var(--text-muted);">هنوز شماره قبلی ثبت نشده است.</div>';
        return;
      }

      listContainer.innerHTML = archiveManifest.map(item => `
        <a href="${item.url}" class="archive-item">
          <div>
            <div class="archive-date-fa">📰 شماره ${item.p_date}</div>
            <div class="archive-date-g">🌍 ${item.g_date}</div>
          </div>
          <span class="archive-arrow">←</span>
        </a>
      `).join('');
    }

    const savedTheme = localStorage.getItem('theme') || 'dark';
    document.documentElement.setAttribute('data-theme', savedTheme);
    updateThemeButton(savedTheme);

    document.getElementById('searchInput').addEventListener('input', (e) => {
      searchQuery = e.target.value.trim();
      renderNews();
    });

    renderNews();
  </script>
