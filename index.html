<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مجله خبری روزانه — ۲۳ آبان ۱۴۰۵</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root[data-theme="dark"] {
      --bg: #0b0f19;
      --header-bg: linear-gradient(135deg, #1e293b, #0f172a);
      --card-bg: #151d30;
      --card-border: #232f48;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --primary: #38bdf8;
      --primary-hover: #0284c7;
      --badge-bg: rgba(56, 189, 248, 0.15);
      --tab-bg: #151d30;
      --tab-border: #232f48;
      --tab-text: #94a3b8;
      --tab-active-bg: #38bdf8;
      --tab-active-text: #0f172a;
      --search-bg: #151d30;
      --search-border: #232f48;
      --toggle-bg: #1e293b;
      --toggle-border: #334155;
      --modal-bg: #151d30;
      --modal-border: #334155;
      --read-bg: #0d1322;
      --read-border: #1e293b;
      --success: #10b981;
    }
    :root[data-theme="light"] {
      --bg: #f8fafc;
      --header-bg: linear-gradient(135deg, #ffffff, #f1f5f9);
      --card-bg: #ffffff;
      --card-border: #e2e8f0;
      --text: #0f172a;
      --text-muted: #64748b;
      --primary: #0284c7;
      --primary-hover: #0369a1;
      --badge-bg: rgba(2, 132, 199, 0.1);
      --tab-bg: #ffffff;
      --tab-border: #e2e8f0;
      --tab-text: #64748b;
      --tab-active-bg: #0284c7;
      --tab-active-text: #ffffff;
      --search-bg: #ffffff;
      --search-border: #cbd5e1;
      --toggle-bg: #f1f5f9;
      --toggle-border: #cbd5e1;
      --modal-bg: #ffffff;
      --modal-border: #cbd5e1;
      --read-bg: #f1f5f9;
      --read-border: #e2e8f0;
      --success: #059669;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Vazirmatn', -apple-system, BlinkMacSystemFont, Tahoma, sans-serif;
    }
    body {
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.8;
      padding: 20px 12px;
      direction: rtl;
      transition: background-color 0.3s ease, color 0.3s ease;
    }
    .container {
      max-width: 880px;
      margin: 0 auto;
    }
    header {
      background: var(--header-bg);
      border: 1px solid var(--card-border);
      border-radius: 18px;
      padding: 22px 20px;
      margin-bottom: 20px;
      position: relative;
      text-align: center;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
      transition: all 0.3s ease;
    }
    .header-actions {
      position: absolute;
      top: 18px;
      left: 18px;
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .btn-action {
      background: var(--toggle-bg);
      border: 1px solid var(--toggle-border);
      color: var(--text);
      padding: 7px 12px;
      border-radius: 12px;
      cursor: pointer;
      font-size: 0.85rem;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-weight: 600;
      transition: all 0.2s ease;
    }
    .btn-action:hover {
      border-color: var(--primary);
    }
    h1 {
      font-size: 1.7rem;
      font-weight: 800;
      margin-bottom: 6px;
    }
    .meta-bar {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin-top: 12px;
      font-size: 0.85rem;
      color: var(--text-muted);
    }
    .meta-tag {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      padding: 4px 12px;
      border-radius: 9999px;
    }
    .search-box {
      margin-bottom: 18px;
    }
    .search-input {
      width: 100%;
      padding: 13px 18px;
      border-radius: 12px;
      background: var(--search-bg);
      border: 1px solid var(--search-border);
      color: var(--text);
      font-size: 0.95rem;
      outline: none;
      transition: all 0.2s ease;
    }
    .search-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2);
    }
    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      padding-bottom: 4px;
    }
    .tabs::-webkit-scrollbar {
      display: none;
    }
    .tab-btn {
      flex: 1;
      white-space: nowrap;
      padding: 12px 14px;
      border-radius: 12px;
      background: var(--tab-bg);
      border: 1px solid var(--tab-border);
      color: var(--tab-text);
      font-size: 0.92rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s ease;
      flex-shrink: 0;
    }
    .tab-btn.active {
      background: var(--tab-active-bg);
      color: var(--tab-active-text);
      border-color: var(--tab-active-bg);
    }
    .badge {
      background: rgba(0, 0, 0, 0.15);
      padding: 2px 7px;
      border-radius: 9999px;
      font-size: 0.8rem;
    }
    .news-grid {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .news-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 20px;
      transition: all 0.25s ease;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.03);
      position: relative;
    }
    .news-card:hover {
      border-color: var(--primary);
      transform: translateY(-2px);
    }
    .news-card.is-read {
      background: var(--read-bg);
      border-color: var(--read-border);
      opacity: 0.7;
    }
    .news-card.is-read:hover {
      opacity: 0.95;
    }
    .news-header {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 12px;
    }
    .news-num {
      background: var(--badge-bg);
      color: var(--primary);
      font-weight: 700;
      font-size: 0.85rem;
      min-width: 30px;
      height: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      margin-top: 2px;
      flex-shrink: 0;
    }
    .news-card.is-read .news-num {
      background: rgba(16, 185, 129, 0.15);
      color: var(--success);
    }
    .news-title {
      font-size: 1.1rem;
      font-weight: 700;
      line-height: 1.6;
      flex: 1;
    }
    .news-summary {
      font-size: 0.94rem;
      color: var(--text-muted);
      margin-bottom: 14px;
      text-align: justify;
      line-height: 1.75;
    }
    .news-footer {
      display: flex;
      flex-direction: column;
      gap: 10px;
      border-top: 1px solid rgba(128, 128, 128, 0.12);
      padding-top: 12px;
      font-size: 0.85rem;
    }
    .footer-top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
    }
    .meta-group {
      display: inline-flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      font-size: 0.82rem;
    }
    .news-source {
      color: var(--text-muted);
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .news-datetime {
      color: var(--text-muted);
      font-size: 0.78rem;
      background: rgba(148, 163, 184, 0.08);
      padding: 2px 7px;
      border-radius: 6px;
      border: 1px solid rgba(148, 163, 184, 0.15);
    }
    .news-category-badge {
      display: inline-flex;
      align-items: center;
      background: var(--badge-bg);
      color: var(--primary);
      border: 1px solid rgba(56, 189, 248, 0.25);
      border-radius: 6px;
      padding: 2px 8px;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .news-category-badge:hover {
      background: var(--primary);
      color: #0f172a;
      transform: translateY(-1px);
    }
    .footer-tags-row {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
    }
    .news-tag-chip {
      display: inline-flex;
      align-items: center;
      font-size: 0.75rem;
      color: var(--text-muted);
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--card-border);
      padding: 1px 7px;
      border-radius: 5px;
      cursor: pointer;
      transition: all 0.2s ease;
      font-weight: 500;
    }
    .news-tag-chip:hover {
      color: var(--primary);
      border-color: var(--primary);
      background: var(--badge-bg);
      transform: translateY(-1px);
    }
    .footer-bottom-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      border-top: 1px dashed rgba(128, 128, 128, 0.12);
      padding-top: 10px;
      margin-top: 4px;
    }
    .footer-actions-right {
      display: flex;
      align-items: center;
    }
    .footer-actions-left {
      display: flex;
      align-items: center;
      margin-right: auto;
    }
    .btn-mark-read {
      background: transparent;
      border: 1px solid var(--toggle-border);
      color: var(--text-muted);
      padding: 4px 10px;
      border-radius: 8px;
      font-size: 0.8rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-weight: 600;
      transition: all 0.2s ease;
    }
    .btn-mark-read:hover {
      border-color: var(--success);
      color: var(--success);
    }
    .news-card.is-read .btn-mark-read {
      background: rgba(16, 185, 129, 0.15);
      border-color: var(--success);
      color: var(--success);
    }
    .news-link {
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
      transition: color 0.2s ease;
    }
    .news-link:hover {
      text-decoration: underline;
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 16px;
    }
    .modal-overlay.active {
      display: flex;
    }
    .modal-card {
      background: var(--modal-bg);
      border: 1px solid var(--modal-border);
      border-radius: 18px;
      width: 100%;
      max-width: 520px;
      max-height: 80vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
      animation: modalFadeIn 0.2s ease;
    }
    @keyframes modalFadeIn {
      from { transform: scale(0.95); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
    .modal-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--card-border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .modal-title {
      font-size: 1.15rem;
      font-weight: 700;
    }
    .btn-close {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 1.4rem;
      cursor: pointer;
      line-height: 1;
      padding: 4px;
    }
    .btn-close:hover {
      color: var(--text);
    }
    .modal-body {
      padding: 16px 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .archive-item {
      background: var(--bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      text-decoration: none;
      color: var(--text);
      transition: all 0.2s ease;
    }
    .archive-item:hover {
      border-color: var(--primary);
      transform: translateX(-4px);
    }
    .archive-date-fa {
      font-weight: 700;
      font-size: 0.95rem;
    }
    .archive-date-g {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 2px;
    }
    .archive-arrow {
      color: var(--primary);
      font-size: 1.1rem;
    }

    @media (max-width: 640px) {
      header { padding: 18px 14px; padding-top: 56px; }
      .header-actions { top: 12px; left: 12px; width: calc(100% - 24px); justify-content: space-between; }
      .btn-action { font-size: 0.78rem; padding: 6px 9px; }
      h1 { font-size: 1.35rem; }
      .tabs { gap: 6px; }
      .tab-btn { padding: 10px 10px; font-size: 0.84rem; gap: 6px; }
      .badge { padding: 1px 5px; font-size: 0.75rem; }
      .news-card { padding: 16px; }
      .news-title { font-size: 0.98rem; }
      .news-summary { font-size: 0.88rem; }
      .news-footer { flex-direction: column; align-items: stretch; gap: 10px; }
      .footer-bottom-row { width: 100%; display: flex; justify-content: space-between; align-items: center; }
    }
  </style>
</head>

  <div class="container">
    <header>
      <div class="header-actions">
        <button class="btn-action" id="themeBtn" onclick="toggleTheme()">
          <span id="themeIcon">☀️</span>
          <span id="themeText">حالت روشن</span>
        </button>
        <button class="btn-action" onclick="toggleArchiveModal(true)">
          <span>📚</span>
          <span>آرشیو شماره‌ها</span>
        </button>
      </div>

      <h1>📰 مجله خبری روزانه</h1>
      <div class="meta-bar">
        <span class="meta-tag">📅 ۲۳ آبان ۱۴۰۵</span>
        <span class="meta-tag">🌍 ۱۴ November ۲۰۲۶</span>
        <span class="meta-tag">⏰ ساعت انتشار: ۲۰:۳۰</span>

    <div class="search-box">
      <input type="text" id="searchInput" class="search-input" placeholder="🔍 جست‌وجو در تمام اخبار امروز...">
    </div>

    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab('persian', this)">

        <span class="badge" id="badge-persian">۲۴</span>
      </button>
      <button class="tab-btn" onclick="switchTab('tech', this)">
        🤖 تکنولوژی
        <span class="badge" id="badge-tech">۵۰</span>
      </button>
      <button class="tab-btn" onclick="switchTab('media', this)">
        🎬 مدیا
        <span class="badge" id="badge-media">۶۹</span>
      </button>
    </div>

    <main id="newsContainer" class="news-grid"></main>
  </div>

  <div class="modal-overlay" id="archiveModal" onclick="if(event.target===this) toggleArchiveModal(false)">
    <div class="modal-card">
      <div class="modal-header">
        <div class="modal-title">📚 آرشیو شماره‌های قبلی مجله</div>
        <button class="btn-close" onclick="toggleArchiveModal(false)">&times;</button>
      </div>
      <div class="modal-body" id="archiveListContainer"></div>
    </div>
  </div>

d_persian/9e0d/live/8816c5f0-df69-11f1-a8af-15d7a25dc0d1.png", "category": "موسیقی و هنر", "tags": ["رویداد", "گزارش"], "datetime_fa": "۲۲ آبان • ۱۸:۲۹"}, {"source": "Iran International", "title": "بسنت: ایران فرصت توافق را از دست داد، ترامپ دیگر نیازی به توافق نمی‌بیند", "link": "https://www.iranintl.com/202611133679", "summary": "اسکات بسنت، وزیر خزانه‌داری آمریکا، گفت جمهوری اسلامی احتمالا می‌توانست پیش از انتخابات میان‌دوره‌ای به توافق بهتری برسد، اما اکنون دونالد ترامپ معتقد است آمریکا به توافق نیازی ندارد. او گفت فشار اقتصادی بر تهران ادامه می‌یابد و حکومت در نهایت خواهان توافق خواهد شد.", "date_str": "2026-11-13T15:06:25+00:00", "hash": "ad2c3eeea0be2ea4", "title_fa": "بسنت: ایران فرصت توافق را از دست داد، ترامپ دیگر نیازی به توافق نمی‌بیند", "summary_fa": "اسکات بسنت، وزیر خزانه‌داری آمریکا، گفت جمهوری اسلامی احتمالا می‌توانست پیش از انتخابات میان‌دوره‌ای به توافق بهتری برسد، اما اکنون دونالد ترامپ معتقد است آمریکا به توافق نیازی ندارد. او گفت فشار اقتصادی بر تهران ادامه می‌یابد و حکومت در نهایت خواهان توافق خواهد شد.", "image_url": "https://i.iranintl.com/images/rdk9umy0/production/bf3da6c93be1c6496626dc48682e17bc6b4f6929-640x427.jpg?rect=0,46,640,336&w=1200&h=630&q=66&fit=max&auto=format", "category": "اقتصاد و بازرگانی", "tags": ["رویداد", "گزارش"], "datetime_fa": "۲۲ آبان • ۱۸:۳۶"}, {"source": "Iran International", "title": "وزیر خزانه‌داری آمریکا: زمستانی طولانی و سرد در انتظار ایرانیان است", "link": "https://www.iranintl.com/202611137418", "summary": "اسکات بسنت، وزیر خزانه‌داری آمریکا، جمعه ۲۲ آبان با تاکید بر اینکه واشینگتن به فشارهای اقتصادی علیه جمهوری اسلامی ادامه خواهد داد و دونالد ترامپ دیگر ضرورتی برای دستیابی به توافق با حکومت ایران نمی‌بیند، گفت زمستانی طولانی و سرد در انتظار ایرانیان خواهد بود.", "date_str": "2026-11-13T15:04:27+00:00", "hash": "ab769a01e7e0c272", "title_fa": "وزیر خزانه‌داری آمریکا: زمستانی طولانی و سرد در انتظار ایرانیان است", "summary_fa": "اسکات بسنت، وزیر خزانه‌داری آمریکا، جمعه ۲۲ آبان با تاکید بر اینکه واشینگتن به فشا  تغییر دهیم، کدام‌یک از تأسیسات را باید تعطیل کنیم.» شیبه در عین حال هشدار داد که این احتمال وجود دارد که «محصولات جدید ما فقط در خارج از کشور تولید شوند». اتحادیه قدرتمند کارگری ای‌گِ متال (IG Metall) در مذاکرات جاری با شرکت مرسدس بنز، خواستار افزایش پنج‌درصدی دستمزدها شده است. بریتا زیگر، دیگر عضو هیئت‌مدیره مرسدس بنز، در همان سند منتشرشده در روز پنج‌شنبه، این درخواست اتحادیه را «کاملاً زیاده‌خواهانه» توصیف کرد. او گفت: «چنین افزایشی هزینه‌های نیروی کار را که هم‌اکنون در آلمان بالاست، باز هم بیشتر خواهد کرد؛ درحالی‌که این هزینه‌ها در مقایسه بین‌المللی از پیش بسیار بالاتر از حد قابل‌قبول هستند.»", "image_url": "https://gdb.rferl.org/18dfe3e2-2c9a-4de2-a0e2-c246771c5cf2_cx0_cy3_cw0_w1200_h630.jpg", "category": "استارتاپ و سرمایه‌گذاری", "tags": ["عامل‌های هوشمند", "سرمایه‌گذاری", "روابط بین‌الملل"], "datetime_fa": "۲۲ آبان • ۱۹:۱۴"}, {"source": "Radio Farda", "title": "از خمیرِ نان در گلستان تا هشدار قطع گاز؛ ایران چگونه به استقبال زمستان می‌رود؟", "link": "https://www.radiofarda.com/a/iran-shortage-gas-war-consequences/33898122.html", "summary": ".", "date_str": "2026-11-13T15:24:10+00:00", "hash": "56146c3108174d27", "title_fa": "از خمیرِ نان در گلستان تا هشدار قطع گاز؛ ایران چگونه به استقبال زمستان می‌رود؟", "summary_fa": "در روستای قولاق‌بورته، در استان گلستان، اهالی می‌گویند از نانوایی نان نمی‌برند، خمیر می‌برند. پول نان را همان‌جا می‌دهند و پختنش می‌ماند برای خانه. یک رسانهٔ محلی در گنبدکاووس، به نقل از اهالی گزارش داد که نانوایی روستا حدود دو ماه نتوانسته است نان بپزد. در آن گزارش روشن نیست که چه سوختی به نانوایی نرسیده و آیا پخت نان از سر گرفته شده است. دشواری تأمین سوخت در روزهای سرد سال سابقه دارد. حدود ده سال پیش، رسانه‌های ایران از دانش‌آموزانی نوشتند که برای گرم ماندن با پتو به مدرسه می‌رفتند. حدود پنج سال پیش هم، در شهریار، یکی از اهالی که گاز مایع پیدا نمی‌کرد، می‌گفت نمی‌داند غذای چند روز آینده‌اش را چطور بپزد. امسال، هنوز زمستان نرسیده، فاطمه مهاجرانی، سخنگوی دولت مسعود پزشکیان، هشدار داده است که اگر مصرف بالا بماند، احتمال قطع گاز در سراسر کشور، از ع به ۱۲سال و شش ماه و یک روز حبس تعزیری محکوم کرد. بر اساس ... عبدالرضا امانی‌فر و اصغر حاجب از رقیه تراب‌پور تصویری در دست نیست دادگاه انقلاب بوشهر، سه عضو هیات مدیره کانون صنفی معلمان این استان را در مجموع به ۱۲سال و شش ماه و یک روز حبس تعزیری محکوم کرد. بر اساس گزارش‌ شورای هماهنگی تشکل‌های صنفی فرهنگیان ایران، «عبدالرضا امانی‌فر»، «اصغر حاجب» و «رقیه تراب‌پور،» همچنین به‌عنوان مجازات تکمیلی به انفصال دایم از خدمات دولتی و عمومی و ضبط وسایل الکترونیکی محکوم شده‌اند. بر اساس حکم صادر شده، عبدالرضا امانی‌فر که همزمان بازرس شورای هماهنگی تشکل‌های صنفی فرهنگیان ایران است به ۱۰ سال و یک روز حبس، «اصغر حاجب» به دو سال و رقیه تراب‌پور به شش ماه حبس محکوم شده‌اند. دادگاه انقلاب بوشهر اتهامات این فعالان صنفی را «همکاری در انجام فعالیت‌های سیاسی، فرهنگی و تبلیغی برخلاف امنیت ملی» اعلام کرده اما متن دادنامه، تاریخ دقیق صدور و ابلاغ احکام و وضعیت تجدیدنظرخواهی هنوز در دسترس نیست. کانون صنفی فرهنگیان استان بوشهر پیش‌تر خبر داده بود جلسه رسیدگی به پرونده این سه نفر روز ۱۰ شهریور ۱۴۰۵ در دادگاه انقلاب بوشهر به ریاست قاضی «عباس فقیه» برگزار شده است. «پیمان رحیمی قره‌میرشم‌لو» در این پرونده وکالت این کنشگران صنفی را بر عهده داشت. عبدالرضا امانی‌فر به‌دنبال مشکلات جسمی پیش آمده در زندان از فروردین‌ماه ۱۴۰۵ با قرار وثیقه و به‌دلیل مراقبت پزشکی از زندان آزاد شده است. در این بخش ایران وایر می‌توانید با مسوولان تماس بگیرید و کارزار خود را برای مشکلات مختلف راه‌اندازی کنید با ایران‌وایر همکاری کنید ویدیوها و مطالب خود را برای ما بفرستید", "image_url": "https://static.prod.iranwire.com/_versions_jpeg/articleslide/%D8%B9%D8%A8%D8%AF%D8%A7%D9%84%D8%B1%D8%B6%D8%A7-%D8%A7%D9%85%D8%A7%D9%86%DB%8C_%D9%81%D8%B1-%D8%A7%D8%B5%D8%BA%D8%B1-%D8%AD%D8%A7%D8%AC%D8%A8_zlrI__v1024x512__box_0%2C0%2C1280%2C673.jpeg", "category": "امنیت سایبری و شبکه", "tags": ["امنیت سایبری"], "datetime_fa": "۲۲ آبان • ۱۷:۵۲"}, {"source": "Euronews Persian", "title": "کریسمس در باغ‌های کیو ۲۰۲۶ با رونمایی از مسیر نورپردازی تماشایی در لندن آغاز شد", "link": "https://parsi.euronews.com/video/2026/11/13/uk-christmas-at-kew-       tech: [{"source": "NYT Tech", "title": "Silicon Valley Start-Ups Face a Future Without Jensen Huang’s Money", "link": "https://www.nytimes.com/2026/11/13/technology/jensen-huang-silicon-valley-start-ups.html", "summary": "Mr. Huang championed start-ups, with Nvidia holding $48 billion worth of stakes in 229 private companies, including OpenAI and Anthropic, at the end of July.", "date_str": "2026-11-13T16:36:28+00:00", "hash": "9a99dec702e1bc71", "title_fa": "استارت آپ های سیلیکون ولی بدون پول جنسن هوانگ با آینده ای روبرو هستند", "summary_fa": "آقای هوانگ از استارت‌آپ‌ها دفاع می‌کرد و انویدیا در پایان ژوئیه ۴۸ میلیارد دلار سهام در ۲۲۹ شرکت خصوصی از جمله OpenAI و Anthropic داشت. برای سال‌ها، جنسن هوانگ در رویدادهای استارت‌آپ سیلیکون ولی، شبکه‌سازی با بنیان‌گذاران، داوری مسابقات زمینی و حضور در روزهای نمایشی حضور داشت. مدیر اجرایی انویدیا به شخصیتی خداپسند در اکوسیستم استارت‌آپ تبدیل شد، نه تنها به این دلیل که صنعت او را به عنوان یکی از موفق‌ترین کارآفرینان جهان معرفی می‌کرد. آقای هوانگ 63 ساله همچنین ماموریت خود را برای کمک به استارت‌آپ‌ها برای به دست آوردن جایگاهی در برابر بزرگ‌ترین و قدرتمندترین شرکت‌های فناوری صنعت، تامین بودجه و قدرت محاسباتی، تعیین کرد. او در پادکست Acquired در سال 2023 گفت: «به اندازه ایده‌های خوب ما، شما همه ایده‌های خوب دنیا را ندارید.» بنابراین استعفای ناگهانی آقای هوانگ از Nvidia در روز پنجشنبه سرمایه‌گذاران و بنیان‌گذاران استارت‌آپ را نگران از دست دادن یک متحد قدرتمند کرد. انویدیا بانک مرکزی A.I است. و ناگهان، رئیس فدرال رزرو خارج شد. لطفاً جاوا اسکریپت را در تنظیمات مرورگر خود فعال کنید. از شکیبایی شما تا زمانی که ما دسترسی را تأیید می کنیم، سپاسگزاریم. اگر در حالت Reader هستید، لطفاً از حساب Times خود خارج شده و وارد شوید یا برای همه The Times مشترک شوید.", "image_url": "https://static01.nyt.com/images/2026/11/13/multimedia/13biz-nvidia-startups-2-mfvc/13biz-nvidia-startups-2-mfvc-videoSixteenByNine3000.jpg", "category": "هوش مصنوعی مولد", "tags": ["OpenAI", "Anthropic", "Nvidia", "سرمایه‌گذاری"], "datetime_fa": "۲۲ آبان • ۲۰:۰۶"}, {"source": "The Guardian AI", "title": "‘Ahead of his time’: AI helps unlock discoveries hidden in notebooks of man who transformed maths", "link": "https://www.theguardian.com/science/2026/nov/13/kurt-godel-notebooks-ai-helps-unlock-hidden-discoveries-man-who-transformed-maths", "summary": "Kurt Gödel left 1,009 pages of densely written text – much of it in an obsolete shorthand – which is now said to contain hundreds of proved theorems The Austrian logician Kurt Gödel was one of the most original thinkers of the 20th century. His two incompleteness theorems , published in 1931, transformed mathematics and paved the way for the digital age. After his seminal results of the 1930s, Gödel published only a few papers. His unpublished work, however, runs to tens of thousands of pages, and is of great interest to historians of science. Continue reading...", "date_str": "2026-11-13T16:38:27+00:00", "hash": "26126460e72344b2", "title_fa": "\"پیش از زمان خود\": هوش مصنوعی به کشف اکتشافات پنهان در دفترچه های انسانی کمک می کند که ریاضیات را متحول کرده است.", "summary_fa": "کورت گودل 1009 صفحه متن متراکم نوشت – که بیشتر آن به صورت مختصر منسوخ است – که اکنون گفته می شود حاوی صدها قضیه اثبات شده است. کورت گودل منطق دان اتریشی یکی از اصیل ترین متفکران قرن بیستم بود. دو قضیه ناقص بودن او که در سال 1931 منتشر شد، ریاضیات را متحول کرد و راه را برای عصر دیجیتال هموار کرد. پس از نتایج مهم خود در دهه 1930، گودل تنها چند مقاله منتشر کرد. با این حال، اثر منتشر نشده او ده ها هزار صفحه دارد و مورد توجه مورخان علم است. به خواندن ادامه دهید... از سال 2017، یان فون پلاتو، منطق دان فنلاندی، پروژه ای را در دانشگاه هلسینکی برای درک محتوای 16 دفترچه ای که گودل در اوایل دهه 1940 نوشت، رهبری کرده است. این ماده - \"کتابهای کار\" - 1009 صفحه متن فشرده در مورد ریاضیات و منطق است. بخش اعظم آن به صورت مختصر آلمانی به نام Gabelsberger نوشته شده است که حتی زمانی که گودل از آن استفاده می کرد منسوخ بود. پیشرفت در درک ریاضی متن به طرز دردناکی آهسته بود - حدود یک صفحه در هفته - تا سپتامبر، زمانی که فون افلاط ندوز صفر را حذف کرده است. روز سه‌شنبه، Nightmare Eclipse SignDrop را فاش کرد، آسیب‌پذیری که به کاربران محلی حقوق کامل سیستم را در برخی از نسخه‌های ویندوز می‌دهد. این آسیب‌پذیری در Common Log File System قرار دارد، که مایکروسافت آن را به‌عنوان «سرویس گزارش‌گیری همه‌منظوره مورد استفاده توسط کلاینت‌های نرم‌افزاری که در حالت کاربر یا حالت هسته اجرا می‌شوند» توصیف می‌کند. با وادار کردن یک فرآیند ممتاز مانند Windows Defender برای باز کردن یک کانتینر دستکاری شده CLFS، یک مهاجم با حقوق کاربر معمولی می تواند از ایجاد فایل ممتاز برای ارتقای امتیازات به سیستم سوء استفاده کند. تبدیل یک سیستم دفاعی ویندوز در برابر خود این حمله از تعامل CLFS، Windows Defender و مجوزهای فایل ویندوز سوء استفاده می کند. این اکسپلویت از Windows Defender برای باز کردن یک فایل گزارش ایجاد شده توسط یک کاربر استاندارد با فراخوانی ServerMpUpdateEngineSignature، یک تابع قانونی Defender برای پردازش به‌روزرسانی‌های امضای آنتی ویروس استفاده می‌کند. مقاله کامل را بخوانید نظرات تنظیمات متن متن داستان اندازه کوچک استاندارد پهنای بزرگ * پیوندهای عریض استاندارد استاندارد نارنجی * فقط مشترکین بیشتر بیاموزید Nightmare Eclipse، نام مستعار محققی که در حال انجام و بسیار عمومی با مایکروسافت است، یک روز دیگر ویندوز صفر را کاهش داده است. با دستکاری پیوندهای نمادین Windows Object Manager، مهاجم باعث می شود که Defender کانتینر CLFS را در زمینه امنیتی موتور ضد بدافزار باز کند. اگر یک فایل احراز هویت مرتبط وجود نداشته باشد، CLFS آن را با استفاده از امتیازات سیستم Defender ایجاد می کند. از آنجایی که CLFS فایل جدید ایجاد شده را به لیست کنترل دسترسی اختیاری فایل اصلی اختصاص می دهد، مهاجم ممکن است به فایلی که با امتیازات سیستم ایجاد شده است دسترسی پیدا کند و اجازه می", "image_url": "https://cdn.arstechnica.net/wp-content/uploads/2026/07/GettyImages-1237693734-1152x648-1783631068.jpg", "category": "هوش مصنوعی مولد", "tags": ["Microsoft", "امنیت سایبری"], "datetime_fa": "۲۲ آبان • ۱۹:۵۶"}, {"source": "Engadget", "title": "Microsoft services are returning after an outage took down Outlook, Teams and more", "link": "https://www.engadget.com/2316029/microsoft-services-are-returning-after-an-outage-took-down-outlook-teams-and-more/", "summary": "The House of Representatives, health care providers, schools and many other organizations were affected.", "date_str": "2026-11-13T16:35:36+00:00", "hash": "85aa4ed7a15d69ad", "title_fa": "خدمات مایکروسافت پس از یک قطعی که Outlook، Teams و موارد دیگر را از بین برد، باز می گردند", "summary_fa": "مجلس نمایندگان، ارائه دهندگان مراقبت های بهداشتی، مدارس و بسیاری از سازمان های دیگر تحت تاثیر قرار گرفتند. PJ McDonnell/Shutterstock افزودن Engadget به Google: منبع ترجیحی Google Discover سرویس‌های مایکروسافت که در میان قطعی گسترده از کار افتاده بودند، به تدریج آنلاین می‌شوند. مشکلی که مایکروسافت 365 را در بعدازظهر پنجشنبه تحت تاثیر قرار داد خدماتی مانند Outlook، Teams و Copilot 365 را از بین برد و کسب و کارها و سازمان ها را در سراسر جهان مختل کرد. این شرکت یک شبه برای بازگرداندن خدمات تلاش کرد. حوالی ساعت 22:00 به وقت ET روز پنجشنبه، اعلام کرد که برخی از تلاش‌ها برای «بهبود قابلیت سرویس‌دهی» آن‌طور که انتظار می‌رفت کارساز نبود. با این حال، تا ساعت 2:45 صبح روز بعد، \"نتایج مثبت برای پایداری سرویس و افزایش ظرفیت در نتیجه آخرین اقدامات بهینه سازی ترافیک ما مشاهده شد.\" حدود ساعت 8:30 صبح، این شرکت گزارش داد \"پیشرفت ادامه بازیابی در مناطق آسیب‌دیده، با پیشرفت‌های گسترده‌تر در آمریکای شمالی، بهبود پایدار در بسیاری از اروپا و سیگنال‌های تشویقی بهبود در آسیا و اقیانوسیه.\" 45 دقیقه بعد، مایکروسافت در یک به‌روزرسانی گفت که اگرچه برخی از افراد ممکن است با تاخیر در تحویل ایمیل در Outlook یا اتصال نقطه‌ای مواجه شوند، اما شاهد «پیشرفت‌های پایدار» در دسترسی به سرویس‌های آسیب‌دیده است. این شرکت در به روز رسانی در ساعت 10:39 صبح گفت: \"ما شاهد پیشرفت تشویق کننده بازیابی هستیم، با در دسترس بودن خدمات و عملکرد تحویل ایمیل در بخش رو به رشدی از زیرساخت های آسیب دیده بهبود می یابد.\" ما می دانیم که مشتریان ما برای انجام کارهای مهم هر روز به خدمات ما تکیه می کنند و از تأثیری که این قطعی ها بر کسانی که به ما وابسته هستند متأسفیم.»", "image_url": "https://www.engadget.com/img/gallery/ his morning, Microsoft is still scrambling to restore service following yesterday's global outage, with millions of users unable to access Outlook and other vital tools. It's not the end of the world, but it does seem fitting that this should happen on the day a physicist predicted would be the end of humanity: November 13, 2026. And it falls on a Friday, too. The physicist in question is Heinz von Foerster, who published a 1960 paper in the journal Science predicting that by today, overpopulation would reach the breaking point. It's not a new fear. English economist Thomas Malthus —one of the early pioneers in modeling population dynamics—made a similar prediction in 1798, claiming that a rapidly growing population would eventually exhaust the available food supply, and humanity would starve to death. His model rested on the assumption of exponential growth, but the equation is only applicable under specific conditions, such as scientists growing bacteria in a lab in a perfectly controlled environment. Even then, while growth occurs exponentially for a time, it does not continue forever. Population dynamics are notoriously tricky to calculate because there are so many variables to consider and so much unpredictability in the system. In his 1960 analysis, Von Foerster accurately measured past trends in population growth, but like Malthus, he assumed those trends would carry into the future largely unchanged. So he projected that human population growth would march inexorably toward infinity. We wouldn't starve to death; von Foerster thought we would be ingenious enough to solve the food supply problem. Instead, \"they will be squeezed to death,\" he wrote. Read full article Comments", "date_str": "2026-11-13T15:09:39+00:00", "hash": "10050be0643ae536", "title_fa": "طبق پیش بینی یک فیزیکدان در سال 1960، این پایان جهان است که ما می شناسیم", "summary_fa": "از صبح امروز، مایکروسافت همچنان در تلاش است تا خدمات را پس از قطعی جهانی دیروز بازیابی کند، زیرا میلیون‌ها کاربر ق ؛‌ ارتباطات اجتماعی فیل‌ها در شرایط قحطی از هم می‌پاشد", "summary_fa": "پژوهشی چند ساله روی فیل‌های آسیایی نشان می‌دهد که کاهش منابع غذایی ممکن است در فروپاشی روابط اجتماعی آن‌ها نقش داشته باشد. تبلیغات دوستی و ارتباطات اجتماعی در دنیای فیل‌ها اهمیت زیادی دارد. این جانوران برای پیدا‌کردن غذا، مراقبت از فرزندان و کسب اطلاعات درباره محیط اطرافشان به یکدیگر وابسته‌اند. اما وقتی منابع غذایی محدود و شرایط زندگی دشوارتر می‌شود، حتی پیوندهای اجتماعی قدیمی نیز ممکن است دوام نیاورند. پژوهشی تازه نشان می‌دهد که در یکی از جمعیت‌های فیل آسیایی، گروه‌های بزرگ و به‌هم‌پیوسته به اجتماعات کوچک‌تر و منزوی‌تری تبدیل شده‌اند؛ تغییری نگران‌کننده که احتمالاً با کمبود غذا و فشارهای محیطی ارتباط دارد. به‌گزارش ساینس ، پژوهشگران دانشگاه کالیفرنیا سن‌دیگو با بررسی بیش از ۴۴۰ فیل آسیایی ماده در پارک ملی اوداوالاوه سریلانکا، تغییرات روابط اجتماعی آن‌ها را در دوره‌ای ۱۲ساله مطالعه کردند. نتایج نشان داد که کاهش تدریجی جمعیت با دگرگونی چشمگیری در ساختار گروه‌های اجتماعی همراه بوده است. پژوهشگران دریافتند که از دست رفتن اعضای جمعیت و کاهش ورود فیل‌های جدید، شبکه‌های اجتماعی را به‌تدریج ضعیف کرده است. درنهایت، این تغییرات از آستانه‌ای بحرانی عبور کرده‌اند و ساختار اجتماعی فیل‌ها به‌شکلی نسبتاً ناگهانی دگرگون شده است. کپی لینک کمبود غذا چگونه می‌تواند روابط اجتماعی فیل‌ها را تغییر دهد؟ فیل‌های آسیایی جانورانی اجتماعی هستند که زندگی گروهی به آن‌ها در یافتن منابع غذایی و مراقبت از بچه‌ها کمک می‌کند. اعضای گروه با یکدیگر ارتباط برقرار می‌کنند و از تجربه و اطلاعات دیگر فیل‌ها برای زندگی در محیط استفاده می‌کنند. بااین‌حال، زندگی گروهی به منابع کافی نیاز دارد. هنگامی که غذا در محیط محدود می‌شود، رقابت برای دسترسی به منابع می‌تواند افزایش پیدا کند. در چنین شرایطی، حفظ گروه‌های بزرگ ممکن است دشوارتر شود و فیل‌ها ناچار شوند الگوهای رفتاری و ارتباطات اجتماعی خود را تغییر دهند.", "image_url": "https://api2.zoomit.ir/media/elephants-interaction-in-wild-6af675ab1e22a6ae5bd3f242?w=1920&q=75", "category": "اقتصاد و بازرگانی", "tags": ["فناوری", "نوآوری"], "datetime_fa": "۲۲ آبان • ۱۹:۰۰"}, {"source": "Zoomit", "title": "در اوج اخراج کارمندان فناوری، متخصصان هوش مصنوعی پاداش‌های هنگفت می‌گیرند", "link": "https://www.zoomit.ir/business/471004-ai-talent-war-salary-boom/", "summary": "رونق هوش مصنوعی بازار کار فناوری، ساخت‌وساز و تولید را متحول کرده و جهش‌های مالی بزرگی برای متخصصان جدید رقم زده است.", "date_str": "2026-11-13T15:15:00+00:00", "hash": "69e2fd253d077268", "title_fa": "در اوج اخراج کارمندان فناوری، متخصصان هوش مصنوعی پاداش‌های هنگفت می‌گیرند", "summary_fa": "رونق هوش مصنوعی بازار کار فناوری، ساخت‌وساز و تولید را متحول کرده و جهش‌های مالی بزرگی برای متخصصان جدید رقم زده است. تبلیغات استارتاپ Serval برای جذب ۱۰۰ مهندس در پاییز جاری، بسته‌های تشویقی متفاوتی در نظر گرفت. مدیران مجموعه علاوه بر پاداش استخدام ۳۰ هزار دلاری، برای هر کارمند فعلی که نیروی جدیدی معرفی کند پاداش ۳۰ هزار دلاری پرداخت می‌کنند. کارفرمایان همچنین یک سفر تفریحی به ارزش ۱۰ هزار دلار نیز روی این پیشنهاد قرار دادند. کارلوس لزاما ، مدیر جذب استعداد در Serval، گفت: «ما به مهندسان نرم‌افزار و متخصصان راهبردی استقرار سیستم نیاز داریم. انتروپیک و OpenAI در حال جذب بخش بزرگی از استعدادها هستند.» به روایت وال‌استریت ژورنال ، صنعت فناوری با وجود تعدیل نیروهای اخیر، در بخش‌های تخصصی با رقابت سنگینی روبه‌رو است. نلا ریچاردسون ، اقتصاددان ارشد مؤسسه ADP، گفت: «ما شاهد افزایش حقوق و اشتغال در تخصصی‌ترین بخش‌های حوزه فناوری بوده‌ایم.» شکاف حقوق میان افرادی که در موقعیت قبلی می‌مانند و کسانی که شغل خود را تغییر می‌دهند، روندی صعودی دارد. گزارش پلتفرم Payscale نشان می‌دهد ۵۶ درصد کارکنان معتقدند باید برای توسعه مهارت‌های مرتبط با هوش مصنوعی دستمزد بیشتری دریافت کنند، اما تنها ۱۶ درصد شاهد افزایش واقعی حقوق ناشی از یادگیری این مهارت‌ها بوده‌اند. مهندسان نیازی به ساخت مدل‌های پیشرفته برای کسب درآمدهای کلان ندارند و تسلط بر ابزارهای کاربردی کافی خواهد بود. مدیرعامل پلتفرم مصاحبه Karat، می‌گوید: «من فقط درباره یک مهندس نرم‌افزار خوب با مهارت‌های پایه‌ای صحبت می‌کنم که بداند چگونه از هوش مصنوعی به‌طور موثر استفاده کند. این افراد می‌دانند که بازار ارزش بسیار بالایی برای آن‌ها قائل است.» پروژه‌های ساخت دیتاسنترها و پردازنده‌ها، دستمزد شاغلان حوزه‌های ساخت‌وساز و تولید را به ترتیب حدود ۱۱ و ۵٫۵ درصد ارتقا داد. برق‌کاران صنعتی در مناطق ساخت دیتاسنترها ویرجینیا، ساعتی ۷۰ دلار دستمزد دریافت می‌کنند که از نرخ پایه", "image_url": "https://api2.zoomit.ir/media/chatgpt-jobs-63e2397a872a1039e038e32c?w=1920&q=75", "category": "هوش مصنوعی مولد", "tags": ["هوش مصنوعی", "OpenAI", "تراشه"], "datetime_fa": "۲۲ آبان • ۱۸:۴۵"}, {"source": "Business Insider", "title": "I moved to Seattle from India for my husband's job. The loneliness, cost of living, and toll on my body shocked me.", "link": "https://www.businessinsider.com/moved-india-seattle-changed-health-career-2026-11", "summary": "Neha Shah. Diaspora Nutrition After moving from India to Seattle, Neha Shah was most shocked by the immediate toll on her body. Instead of looking for another engineering job, she pivoted and founded a nutrition business. She said one of the most unexpected parts of moving was the urban loneliness she experienced. This as-told-to essay is based on a conversation with Neha Shah, the 38-year-old founder of Ayurvedic Intelligence , who is based in the Seattle metropolitan area. It's been edited for length and clarity. I expected my transition of moving from India to the US to revolve around adjusting to the weather, learning a new corporate culture, and building a routine. Instead, I ended up rebuilding my entire identity, starting with my health. When my family and I were living in India , I saw the move to Seattle for my husband's job as an exciting next step. My plan was straightforward: settle into our new home, navigate the job market, and pick back up with my software engineering career in one of America's biggest tech hubs. The biggest shock after arriving in the US wasn't cultural; it was physical. Within months of moving, my body began reacting intensely to my environment. I developed chronic bloating, persistent fatigue, systemic inflammation, and stubborn weight gain. What made it so baffling was that my diet hadn't changed: I was still cooking the same traditional meals from scratch that I'd eaten every day in India. This derailed my return to software engineering and sparked the foundation for Ayurvedic Intelligence, my business as an integrative nutrition and health coach. As an engineer, I couldn't accept vague answers to my health issues I started digging into the biological reality of migration and discovered dietary acculturation: how shifting to a new food environment alters the microbiome, and how differences in agricultural processing, soil quality, water, and food infrastructure in the West affect the human body. That's when I saw a massive, unaddressed gap in the wellness industry. Realizing that many South Asian immigrants might've been silently suffering from the exact same \"environmental bug\" without a culturally intelligent framework to fix it, I knew I had to build the solution myself. I worked as an engineer in India from 2010 to 2012 and then took a five-year break to immerse myself in motherhood and family life. After I moved to the US and experienced health challenges, I became a Certified Holistic Health Coach through the Inst", "date_str": "2026-11-13T15:40:16+00:00", "hash": "a63d1f95c9ac964a", "title_fa": "من برای کار شوهرم از هند به سیاتل نقل مکان کردم. تنهایی، هزینه های زندگی و عوارضی که بر بدنم وارد شده بود مرا شوکه کرد.", "summary_fa": "نها شاه. تغذیه دیاسپورا پس از نقل مکان از هند به سیاتل، نها شاه از تلفات فوری بدنش بسیار شوکه شد. او به جای اینکه به دنبال شغل مهندسی دیگری باشد، یک تجارت تغذیه را راه اندازی کرد. او می‌گوید یکی از غیرمنتظره‌ترین قسمت‌های جابجایی، تنهایی شهری بود که تجربه کرد. این مقاله گفته شده بر اساس گفتگو با نها شاه، بنیانگذار 38 ساله هوش آیورودا، که در منطقه شهری سیاتل مستقر است، است. برای طول و وضوح ویرایش شده است. انتظار داشتم که انتقال من از هند به ایالات متحده حول محور سازگاری با آب و هوا، یادگیری یک فرهنگ جدید شرکتی و ایجاد یک روال باشد. در عوض، من تمام هویت خود را بازسازی کردم، از سلامتی‌ام شروع شد. زمانی که من و خانواده‌ام در هند زندگی می‌کردیم، نقل مکان به سیاتل برای شغل شوهرم را به‌عنوان گام بعدی هیجان‌انگیز دیدم. برنامه من ساده بود: در خانه جدیدمان مستقر شوم، در بازار کار بگردیم و حرفه مهندسی نرم افزار خود را در یکی از بزرگترین مراکز فناوری آمریکا ادامه دهم. بزرگترین شوک پس از ورود به ایالات متحده، فرهنگی نبود. فیزیکی بود در عرض چند ماه پس از حرکت، بدنم به شدت نسبت به محیط اطرافم واکنش نشان داد. من دچار نفخ مزمن، خستگی مداوم، التهاب سیستمیک و افزایش وزن شدید شدم. چیزی که آن را بسیار گیج کننده کرد این بود که رژیم غذایی من تغییر نکرده بود: من هنوز همان غذاهای سنتی را از ابتدا می پختم که هر روز در هند می خوردم. این امر بازگشت من به مهندسی نرم افزار را از مسیر خارج کرد و پایه و اساس هوش آیورودا را ایجاد کرد، تجارت من به عنوان یک مربی تغذیه و سلامت یکپارچه. به‌عنوان یک مهندس، نمی‌توانستم پاسخ‌های مبهم برای مسائل سلامتی‌ام را بپذیرم، شروع به کندوکاو در واقعیت زیست‌شناختی مهاجرت کردم و", "image_url": "https://i.insider.com/6ae23f34e793e129714265a1?width=1200&format=jpeg", "category": "هوش مصنوعی مولد", "tags": ["فناوری", "نوآوری"], "datetime_fa": "۲۲ آبان • ۱۹:۱۰"}, {"source": "Business Insider", "title": "Microsoft's outage is showing signs of recovery after causing chaos for businesses", "link": "https://www.businessinsider.com/microsoft-365-outage-outlook-teams-down-claude-what-we-know-2026-11", "summary": "Microsoft 365 is suffering an outage affecting services including Outlook and Teams. Illustration by Thomas Fuller/SOPA Images/LightRocket via Getty Images Microsoft's 365 outage entered a second day, affecting services like Teams and Outlook. Microsoft says it's starting to recover. The outage is disrupting governments, businesses, airlines, and some AI tools. Microsoft's global Outlook outage has dragged into a second day, leaving some users unable to access email and disrupting Teams, Copilot, and other Microsoft 365 tools. It has also affected AI tools . Anthropic and OpenAI said in status update pages that their connectors to Microsoft 365 tools had been disrupted. Anthropic said it was seeing some recovery at 9:36 a.m. ET on Friday, but that some services remained \"degraded,\" including Claude Code connectors. Here's what we know so far about the Microsoft outage that's causing chaos for businesses. What's the latest? Microsoft said in a 10 a.m. ET update that it was seeing \"sustained improvements\" as affected Microsoft 365 services gradually recovered. But some users may still have trouble connecting to services or find that emails are taking longer than usual to arrive. The company said it was now focused on fixing the remaining problems and checking that the recovery holds across the different ways people connect to its services. In a statement sent to Business Insider, Charles Lamanna, Microsoft's EVP of Copilot, Agents and Platform, said the company was seeing \"encouraging recovery progress\" and regretted the disruption for customers. He added that Microsoft was reviewing what happened and how it could prevent similar problems in the future. In a 7:58 a.m. ET update, Microsoft said it was seeing \"sustained improvements\" in Europe. Asia Pacific was seeing \"encouraging recovery signals,\" it added, and North America was also improving. The company has not provided a timeline for a full recovery. What happened? Microsoft first flagged the outage on Thursday around midday ET, writing in an X post that users in the Americas were having trouble accessing Exchange Online mailboxes. It later said in a follow-up post that the issue could affect users \"in any region.\" By Friday morning, Microsoft's public service status page was still showing \"service degradation\" for both Microsoft 365 business customers and consumer products. Microsoft said in a later X update on Thursday that some of its infrastructure was under elevated load across multiple regions. It ", "date_str": "2026-11-13T15:26:40+00:00", "hash": "a7fa0975f872b992", "title_fa": "خاموشی مایکروسافت پس از ایجاد هرج و مرج برای مشاغل، نشانه هایی از بهبود را نشان می دهد", "summary_fa": "مایکروسافت 365 از یک قطعی رنج می برد که بر خدماتی از جمله Outlook و Teams تأثیر می گذارد. تصویر توسط توماس فولر/SOPA Images/LightRocket از طریق Getty Images قطع شدن 365 مایکروسافت وارد دومین روز شد و سرویس هایی مانند Teams و Outlook را تحت تاثیر قرار داد. مایکروسافت می گوید شروع به بازیابی کرده است. این قطعی باعث اختلال در دولت ها، مشاغل، خطوط هوایی و برخی ابزارهای هوش مصنوعی می شود. قطعی جهانی Outlook مایکروسافت به دومین روز کشیده شده است و برخی از کاربران را قادر به دسترسی به ایمیل و اختلال در Teams، Copilot و دیگر ابزارهای Microsoft 365 کرده است. همچنین بر ابزارهای هوش مصنوعی تأثیر گذاشته است. Anthropic و OpenAI در صفحات به روز رسانی وضعیت گفتند که اتصالات آنها به ابزارهای مایکروسافت 365 مختل شده است. آنتروپیک گفت که در ساعت 9:36 صبح روز جمعه شاهد بهبودی است، اما برخی از سرویس‌ها از جمله کانکتورهای Claude Code «تخریب‌شده» باقی مانده‌اند. در اینجا چیزی است که ما تاکنون در مورد قطعی مایکروسافت که باعث هرج و مرج برای مشاغل می شود، می دانیم. آخرین خبر چیست؟ مایکروسافت در یک به‌روزرسانی ساعت 10 صبح به وقت محلی اعلام کرد که با بهبود تدریجی سرویس‌های مایکروسافت 365، شاهد «پیشرفت‌های پایدار» است. اما برخی از کاربران ممکن است هنوز در اتصال به سرویس‌ها مشکل داشته باشند یا دریافتند ایمیل‌ها بیش از حد معمول طول می‌کشد. این شرکت گفت که اکنون بر رفع مشکلات باقی مانده و بررسی اینکه آیا بازیابی از طریق راه های مختلف اتصال افراد به خدمات آن برقرار است، متمرکز شده است. در بیانیه‌ای که به Business Insider ارسال شد، چارلز لامانا، EVP مایکروسافت از Copilot، Agents و Platform، گفت که این شرکت شاهد «پیشرفت تشویق‌کننده بازیابی» بوده و از این اختلال برای مشتریان متأسف است. او افزود که مایکروسافت در حال بررسی اتفاقاتی", "image_url": "https://i.insider.com/6af6f3e7cbe2120470735177?width=1200&format=jpeg", "category": "هوش مصنوعی مولد", "tags": ["هوش مصنوعی", "OpenAI", "Anthropic", "Microsoft"], "datetime_fa": "۲۲ آبان • ۱۸:۵۶"}, {"source": "Business Insider", "title": "Walmart's Black Friday deals include a $69 Nespresso and 10 more finds under $100", "link": "https://www.businessinsider.com/guides/deals/walmart-black-friday-deals-under-100-dollars-2026-11-13", "summary": "When you buy through our links, Business Insider may earn an affiliate commission. Learn more Nespresso;Business Insider Walmart has launched its first batch of Black Friday deals, and even as a skeptical deal hunter, I found several enticing deals as I scroll through the season's hundreds of early Black Friday deals . For starters, there is a Nespresso machine for the bargain price of $69, which is undoubtedly the best early Black Friday kitchen deal I've spotted, while I'm also eyeing discounts of up to 65% off headphones on older yet still respectable models from Apple and Beats. Shop all Walmart Black Friday Deals The Walmart Black Friday deal I'm most excited about Vertuo Pop for $69 (was $118) Nespresso/Business Insider This is by far the cheapest Nespresso machine you'll find. It's the lowest I've ever seen on this beloved coffee brand. As the smallest and most affordable model in the Nespresso lineup , the Vertuo Pop proves that good things come in small packages. Small, yet mighty. The Pop edition has a smaller footprint, just 5.3 inches wide, and has an 18.9-ounce removable rear water tank. It can brew velvety coffee and espresso with cafe-quality crema at the touch of a button with Vertuo pods, including over-ice functionality. What you get: The starter kit includes the coffee machine, 12 Vertuo capsules, and a $10 voucher to use at Nespresso. This version does not come with a milk frother, which is available separately. However, I did spot another unbelievable deal on a Vertuo Next bundle that includes a milk frother for $95 at Bloomingdale's . For reference, the Vertuo Next occasionally drops to that price point on its own, but I haven't seen it with the milk frother before. More Walmart Black Friday deals What is Walmart's Black Friday sale? Walmart's Black Friday Sale occurs in three waves. The first batch started November 12 at 12 a.m. ET on ده بود، طی یک حادثه امنیتی به سرقت رفت. اوبر به هزاران راننده اطلاع می دهد که اطلاعات شخصی و گواهینامه رانندگی آنها در جریان نقض اطلاعات اکتبر در یکی از ارائه دهندگان فناوری این شرکت به سرقت رفته است. در اعلامیه‌هایی که این هفته با چندین ایالات متحده ارسال شد. دادستان های کل، از جمله کالیفرنیا، غول سواری-تگرگ گفت که در 9 اکتبر توسط ارائه دهنده اطلاع داده شده است که هکرها اطلاعات داخلی را که برای دسترسی به داده های اوبر مورد استفاده قرار می گرفت، نفوذ کرده و سرقت کرده اند. این شرکت گفت که متعاقباً شروع به اطلاع رسانی به رانندگان آسیب دیده مبنی بر ذخیره اطلاعات شخصی آنها در ارائه دهنده کرد. TechCrunch دریافته است که ارائه‌دهنده آن Fireworks AI است که به توسعه‌دهندگان امکان دسترسی و استفاده از مدل‌های هوش مصنوعی باز را می‌دهد. Fireworks در ماه گذشته گزارش داده بود که در آن هکرها اطلاعات مشتریانش از جمله داده های صورتحساب و برخی از مجموعه داده های هوش مصنوعی خصوصی را به سرقت بردند. استارت‌آپ بهره‌وری آنلاین Notion تایید کرد که داده‌های آن نیز در هک Fireworks به سرقت رفته است. سخنگوی اوبر به TechCrunch گفت: «اعلامیه‌ها به رانندگان مربوط به یک حادثه امنیتی است که بر یکی از فروشندگان شخص ثالث ما، Fireworks.ai، که به برخی از داده‌های Uber دسترسی داشت، تأثیر گذاشته است، و سؤالات ما را به Fireworks موکول کرد. اوبر نگفت که چند مشتری تحت تأثیر این نقض قرار گرفته اند و همچنین چند راننده را در مورد این رخداد مطلع نکرده است. سخنگوی Fireworks به سوالات در مورد این حادثه پاسخ نداد. بر اساس اعلامیه‌های نقض داده‌ها که توسط TechCrunch مشاهده شده است، داده‌های سرقت شده شامل گواهینامه‌های رانندگی 2567", "image_url": "https://techcrunch.com/wp-content/uploads/2024/07/GettyImages-2043993878-e1722276196662.jpg?resize=1200,676", "category": "هوش مصنوعی مولد", "tags": ["هوش مصنوعی", "امنیت سایبری"], "datetime_fa": "۲۲ آبان • ۱۸:۲۷"}, {"source": "Ars Technica", "title": "Screenless GPS: Slate Auto says, \"Remember the road atlas\"", "link": "https://arstechnica.com/culture/2026/11/screenless-gps-slate-auto-says-remember-the-road-atlas/", "summary": "Whether it's nostalgia or a sense that technology has gotten a bit too pervasive, there’s no denying that Slate Auto appears to be tuned into the particular moment. The startup has a simple pitch : an affordable electric truck with just the basics , leaving owners to DIY and BYOD for everything else, all for a sub-$25,000 starting price. Among the things Slate does without is an embedded infotainment system. The small digital display on the dashboard that shows your speed and range is also where the backup camera appears if you engage reverse, and there are two USB-C ports that provide power but not connectivity, and that’s that. But there is a solution to getting lost, and it's called “Screenless GPS.” Even though we don’t have a Slate truck to test it with, the OEM sent us a unit to review. That’s right, it’s a good old spiral-bound road atlas! “We believe you should use the devices you know and love,” Slate says, and it reckons that maps worked just fine for past generations, so they should still work now. Read full article Comments", "date_str": "2026-11-13T14:45:04+00:00", "hash": "3b55f570af5a6794", "title_fa": "GPS بدون صفحه: Slate Auto می گوید: \"اطلس جاده را به خاطر بسپار\"", "summary_fa": "چه نوستالژی باشد و چه احساس این که فناوری کمی بیش از حد فراگیر شده است، نمی توان انکار کرد که Slate Auto به نظر می رسد در لحظه خاصی تنظیم شده است. این استارت‌آپ طرح ساده‌ای دارد: یک کامیون برقی مقرون‌به‌صرفه با اصول اولیه، که مالکان را برای هر چیز دیگری به DIY و BYOD واگذار می‌کند، همه با قیمت اولیه زیر 25000 دلار. یکی از کارهایی که Slate بدون آن انجام می دهد، یک سیستم اطلاعات سرگرمی تعبیه شده است. صفحه نمایش دیجیتال کوچک روی داشبورد که سرعت و برد شما را نشان می دهد نیز جایی است که دوربین پشتیبان در صورت حرکت معکوس ظاهر می شود، و دو پورت USB-C وجود دارد که برق را ارائه می دهند اما اتصال را ارائه نمی دهند، و بس. اما راه حلی برای گم شدن وجود دارد و آن را \"GPS بدون صفحه\" می نامند. اگرچه ما کامیون Slate نداریم که آن را با آن آزمایش کنیم، OEM یک واحد را برای بررسی به ما فرستاد. درست است، این یک اطلس جاده مارپیچ قدیمی nd 2045. After another decade of global climate summits, warming is now projected to cross that benchmark as soon as 2029, according to Copernicus. Read full article Comments", "date_str": "2026-11-13T14:29:15+00:00", "hash": "3444e5c416b61373", "title_fa": "دانشمندان هشدار می دهند که آستانه تغییر آب و هوا ممکن است تا سال 2029 به 1.5 درجه سانتیگراد برسد", "summary_fa": "آنتالیا، ترکیه – در میان مذاکرات و اعلامیه‌های خوش‌بینانه در زمینه فناوری سبز در کنفرانس سالانه تغییرات اقلیمی COP31 سازمان ملل در روز پنجشنبه، دو گزارش جدید یادآوری روشنی از فاصله‌ی دور جهان از مهار گرمایش جهانی ارائه کردند. Climate Action Tracker، یک گروه غیرانتفاعی که سیاست‌های آب و هوایی را تجزیه و تحلیل می‌کند، دریافت که این سیاره هنوز در مسیر گرمایش نزدیک به 5 درجه فارنهایت تا سال 2100 است، افزایشی که می‌تواند صخره‌های مرجانی را ویران کند، کشاورزی و جنگل‌ها را مختل کند و بیشتر یخ‌های جهان را آب کند. در یک بولتن جداگانه، سرویس تغییرات آب و هوایی کوپرنیک اتحادیه اروپا گزارش داد که گرمایش جهانی از زمان توافقنامه آب و هوایی پاریس در سال 2015 به طور قابل توجهی شتاب گرفته است. زمانی که توافق پاریس به تصویب رسید، پیش‌بینی می‌شد که میانگین دمای کره زمین از آستانه بلندمدت این پیمان 2.7 درجه فارنهایت بالاتر از میانگین پیش‌صنعتی در حدود سال 2045 فراتر رود. طبق گزارش کوپرنیک، پس از یک دهه دیگر از اجلاس‌های جهانی آب و هوا، اکنون پیش‌بینی می‌شود که گرمایش زمین تا سال 2029 از این معیار عبور کند. مقاله کامل را بخوانید نظرات تنظیمات متن متن داستان اندازه کوچک استاندارد پهنای بزرگ * پیوندهای عریض استاندارد استاندارد نارنجی * فقط مشترکین بیشتر بیاموزید برای پیمایش در آنتالیا، ترکیه - در بحبوحه گفتگوها و اطلاعیه های خوشبینانه در زمینه فناوری سبز در کنفرانس سالانه تغییرات اقلیمی COP31 سازمان ملل در روز پنجشنبه، دو گزارش جدید حاوی یک یادآوری بسیار گرم از جهان است. دانشمندان اتحادیه اروپا نوشتند: \"این تغییر چشمگیر نشان می دهد که گرمایش جهانی در سال های اخیر شتاب گرفته است.\" حتی بدون درک هر جنبه ای از افزایش سریع دمای جهانی اخیر، \"روشن است که غلظت روزافزون گازهای گلخانه ای ساطع شده توسط فعالیت های انسانی در جو عامل , but Outlook is still unavailable. The outage is disrupting governments, airlines, and some AI tools, but Microsoft said it's starting to recover. Microsoft's global Outlook outage has dragged into a second day, leaving some users unable to access email and disrupting Teams, Copilot, and other Microsoft 365 tools. It has also affected AI tools . Anthropic and OpenAI said in status update pages that their connectors to Microsoft 365 tools had been disrupted. Anthropic said the issues were fixed by 6:58 a.m. ET on Friday. Here's what we know so far about the Microsoft outage that's causing chaos for businesses. What's the latest? Microsoft said in a 9 a.m. ET update that more people were able to use its services again, and that the backlog of delayed emails had shrunk \"significantly.\" But the recovery is not complete: Some users may still have trouble accessing Microsoft's services or find that emails are taking longer than usual to arrive, the company said. In a 7:58 a.m. ET update, Microsoft said it was seeing \"sustained improvements\" in Europe. Asia Pacific was seeing \"encouraging recovery signals,\" it added, and North America was also improving. It then warned that some users could still face intermittent problems. The company has not provided a timeline for a full recovery. What happened? Microsoft first flagged the outage on Thursday around midday ET, writing in an X post that users in the Americas were having trouble accessing Exchange Online mailboxes. It later said in a follow-up post that the issue could affect users \"in any region.\" By Friday morning, Microsoft's public service status page was still showing \"service degradation\" for both Microsoft 365 business customers and consumer products. Microsoft said in a later X update on Thursday that some of its infrastructure was under elevated load across multiple regions. It said the strain was not caused by an increase in customer traffic, but because a number of servers had unexpectedly become unavailable. Microsoft also said in that 3:34 a.m. update that it had \"no indication\" the disruption was caused by malicious activity. In further X updates on Thursday, it said it had taken steps including restarting ser", "date_str": "2026-11-13T14:27:37+00:00", "hash": "004de4015a625535", "title_fa": "قطعی مایکروسافت در دومین روز خود است و باعث هرج و مرج برای کسب و کارها شده است. این چیزی است که ما می دانیم.", "summary_fa": "مایکروسافت 365 از یک قطعی رنج می برد که بر خدماتی از جمله Outlook و Teams تأثیر می گذارد. تصویر توسط توماس فولر/SOPA Images/LightRocket از طریق Getty Images قطع شدن Outlook مایکروسافت وارد دومین روز می شود که تلاش های بازیابی جهانی ادامه دارد. مایکروسافت می‌گوید که یک تعمیر، سرورهایش را پایدارتر می‌کند، اما Outlook هنوز در دسترس نیست. این قطعی باعث اختلال در دولت‌ها، خطوط هوایی و برخی ابزارهای هوش مصنوعی می‌شود، اما مایکروسافت اعلام کرد که در حال بهبود است. قطعی جهانی Outlook مایکروسافت به دومین روز کشیده شده است و برخی از کاربران را قادر به دسترسی به ایمیل و اختلال در Teams، Copilot و دیگر ابزارهای Microsoft 365 کرده است. همچنین بر ابزارهای هوش مصنوعی تأثیر گذاشته است. Anthropic و OpenAI در صفحات به روز رسانی وضعیت گفتند که اتصالات آنها به ابزارهای مایکروسافت 365 مختل شده است. آنتروپیک گفت که این مشکلات تا ساعت 6:58 صبح جمعه به وقت شرقی برطرف شده است. در اینجا چیزی است که ما تاکنون در مورد قطعی مایکروسافت که باعث هرج و مرج برای مشاغل می شود، می دانیم. آخرین خبر چیست؟ مایکروسافت در یک به‌روزرسانی در ساعت 9 صبح به وقت محلی اعلام کرد که افراد بیشتری می‌توانند دوباره از خدمات آن استفاده کنند و تعداد ایمیل‌های عقب افتاده به میزان قابل توجهی کاهش یافته است. اما این بازیابی کامل نیست: برخی از کاربران ممکن است هنوز برای دسترسی به خدمات مایکروسافت مشکل داشته باشند یا متوجه شوند که دریافت ایمیل‌ها بیش از حد معمول طول می‌کشد. مایکروسافت در یک به‌روزرسانی در ساعت ۷:۵۸ صبح به وقت محلی، گفت که شاهد «پیشرفت‌های پایدار» در اروپا است. آسیا و اقیانوسیه شاهد \"سیگنال های بازیابی تشویق کننده\" بود و آمریکای شمالی نیز در حال بهبود بود. سپس هشدار داد که برخی از کاربران همچنان ممکن است با مشکلات متناوب مواجه", "image_url": "https://i.insider.com/6af6f3e7cbe2120470735177?width=1200&format=jpeg", "category": "هوش مصنوعی مولد", "tags": ["هوش مصنوعی", "OpenAI", "Anthropic", "Microsoft"], "datetime_fa": "۲۲ آبان • ۱۷:۵۷"}, {"source": "Business Insider", "title": "My husband started working from home after years of commuting. I didn't expect it to change our marriage so much.", "link": "https://www.businessinsider.com/husband-became-coworker-working-from-home-marriage-2026-11", "summary": "Courtesy of the author I'd worked from home for years while my husband spent several nights a week traveling. When he began working remotely, I became his only daily companion outside video calls. We had to create boundaries between our professional lives and our marriage. In the tenuous months after COVID, my husband, Mark, got laid off when a larger corporation bought out his company. He found another job quickly — hours away, in Northern New Jersey — and rather than move, he commuted, spending two or three nights a week in hotels and working from home on Fridays. As an artist and writer, I was already working from home full-time, and I liked the new rhythm of his workweek. While Mark was away, I took over every surface of the house: the dining room table for painting, a second craft table when I had multiple pieces going. The author took over the dining table with her art. Courtesy of the author On Thursdays I'd clear my projects off the table and cook something better than the salads I had been eating in his absence — chili or a tray of baked penne — while the dogs waited at the door for the sound of his car in the driveway. On his Fridays, when Mark worked from home, I'd take my laptop to the coffee shop to write proposals and plan my social media posts, giving him the run of our small house. Then, at the end of last year, his latest company was bought out, too. Bracing for the worst, we waited to see what this sale would mean for us. Would the new company keep the guy who'd racked up all those hotel bills? Mark updated his résumé and waited. A couple of months in, word came back: no more commuting . He could work from home full-time. We celebrated with a bottle of Barolo. We were empty nesters The timing felt advantageous: our son had just moved out. Mark moved his desk out of our bedroom and into the now spare room of our little two-bedroom Cape Cod. It afforded him a door he could close behind him. Then reality set in. Plenty of couples have had to figure out working from home together, but most get some warning, or at least a slow slide into it. We got neither. One week Mark was commuting and living out of hotels ; the next he was working out of our small house full-time. And I was no longer just his wife. I was his coworker, his only lunch companion, and his only witness to a bad day, often in real time. The author s husband started working from home and she needed to keep the dogs quiet. Courtesy of the author What had seemed like a windfall tur", "date_str": "2026-11-13T14:16:01+00:00", "hash": "a5ae1045b694eeb9", "title_fa": "شوهرم بعد از سال ها رفت و آمد از خانه شروع به کار کرد. انتظار نداشتم اینقدر ازدواج ما را تغییر دهد.", "summary_fa": "با حسن نیت نویسنده من سال ها در خانه کار کرده بودم در حالی که شوهرم چندین شب در هفته را به مسافرت می گذراند. وقتی او شروع به کار از راه دور کرد، من تنها همراه روزانه او در خارج از تماس های ویدیویی شدم. ما باید بین زندگی حرفه ای و ازدواجمان مرزهایی ایجاد می کردیم. در ماه‌های سخت پس از کووید، شوهرم، مارک، زمانی که یک شرکت بزرگ‌تر شرکت او را خرید، اخراج شد. او به سرعت شغل دیگری پیدا کرد - ساعت ها دورتر، در شمال نیوجرسی - و به جای جابجایی، رفت و آمد می کرد، دو یا سه شب در هفته را در هتل ها می گذراند و جمعه ها از خانه کار می کرد. به‌عنوان یک هنرمند و نویسنده، از قبل تمام وقت از خانه کار می‌کردم و ریتم جدید هفته کاری او را دوست داشتم. زمانی که مارک دور بود، تمام سطوح خانه را تصاحب کردم: میز ناهارخوری برای نقاشی، میز دوم صنایع دستی که چند قطعه را در دست داشتم. نویسند ang استفاده می کنند. خوشبختانه برای سازندگان میم، تراشه های Nvidia به اندازه کافی برای تولید آنها وجود دارد. سقوط جنسن هوانگ با فناوری فروخته شده توسط او به دنیا همراه است. هوانگ روز پنجشنبه به دنبال رسوایی در مورد روابط خارج از ازدواج و تحقیقات هیئت مدیره در مورد نگرانی هایی که ممکن است موضوع یک تلاش اطلاعاتی خارجی باشد، از سمت مدیرعاملی انویدیا استعفا داد. در پاسخ، دستگاه میم اضافه‌کاری برای ارائه برخی از دوزی‌ها انجام داده است و گزارش نیویورک تایمز را نشان می‌دهد که زنی جنسن هوانگ با نامزدی رابطه داشته است - آلیس هوانگ - احتمالاً اطلاعاتی را به پکن می‌فرستد. چین گفته است که اتهامات جاسوسی اثبات نشده است. بسیاری از میم‌های ویدیویی واقع‌گرایانه که Huang را به نمایش می‌گذارند با استفاده از هوش مصنوعی مولد ایجاد شده‌اند - فناوری که عمدتاً بر روی تراشه‌های Nvidia ساخته و اجرا می‌شود. یک دیپ فیک که بیش از 7.5 میلیون بازدید دارد، صحنه ای از \"ماتریکس\" را به تصویر می کشد، اما شخصیت های نئو را با جنسن هوانگ و مورفیوس را با دونالد ترامپ عوض می کند. و - خوب، شما فقط باید بقیه را تماشا کنید. منتظر سورپرایز ایلان ماسک باشید. جنسن هوانگ در ماتریکس، یاد می‌گیرد که چگونه جاسوس‌های چینی کار می‌کنند تا آخر صبر کنید 👀 pic.twitter.com/RPpXKDunLh — ΛRMIN (@Arminn_Ai) 12 نوامبر 2026 یکی دیگر از ویدیوهای خوش ساخت، جنسن هوانگ را وارد موزیک ویدیوی «It Wasn't Me» شگی می‌کند. این یک راه برای توجیه ساخت مرکز داده عظیم هوش مصنوعی است. It wasn’t me by", "image_url": "https://i.insider.com/6af6eccdcbe212047073516c?width=1200&format=jpeg", "category": "هوش مصنوعی مولد", "tags": ["هوش مصنوعی", "Nvidia", "تراشه", "موسیقی"], "datetime_fa": "۲۲ آبان • ۱۷:۴۵"}, {"source": "Business Insider", "title": "Russia plans to launch hundreds more satellites for its Starlink alternative in 2027, Ukraine says", "link": "https://www.businessinsider.com/russia-accelerating-launch-of-starlink-alternative-satellites-ukraine-says-2026-11", "summary": "Russia plans to launch hundreds of satellites into orbit for its Rassvet system. Roscosmos/via REUTERS Ukrainian intel says Russia plans to launch hundreds of satellites for its Starlink alternative this year and next. Kyiv said on Friday that Russia is pressing ahead with its Rassvet constellation despite setbacks. Meanwhile, Ukraine continues to face disruption to its Starlink services. Russia plans to launch nearly 20 additional satellites this year and hundreds more next year as it accelerates the deployment of its Starlink alternative, Rassvet, Ukraine's military intelligence agency said Friday. The new assessment comes as Ukraine continues to face restrictions on its Starlink services , which it says are disrupting its drone operations. Russia has already launched 30 satellites this year for Rassvet, a low-Earth-orbit satellite internet constellation that it has billed as comparable to SpaceX's Starlink, which is widely used by Ukrainian forces. Rassvet's deployment has faced setbacks , including difficulties with launch and dependencies on foreign components, Ukraine's GUR military intelligence agency said in a statement. Two of the 30 Russian satellites launched this year have already \"deorbited,\" and while 26 have reached a stable position at an altitude of roughly 320 miles, none have reached the planned 500-mile altitude — though they are maneuvering toward it, the GUR said. Russia plans to expand the constellation to up to 48 satellites by the end of the year and launch another 240 next year to cover 94% of Russian territory with speeds of up to 150 Mbps, the GUR said. Moscow plans to bring the constellation up to 408 satellites by 2031 and 924 by 2035. The Rassvet satellites, each weighing little more than 600 pounds, rely on laser communication instead of ground stations to transfer data. Russia uses the Soyuz-2.1b three-stage rocket to launch its satellites into orbit. Ukraine has attacked production facilities that manufacture this family of rockets in an attempt to disrupt Moscow's space industry. Ukrainian forces are facing another round of Starlink service disruptions this week. Stringer/REUTERS Rassvet's m 08 و تا سال 2035 به 924 ماهواره برساند. روسیه از موشک سه مرحله ای Soyuz-2.1b", "image_url": "https://i.insider.com/6af70f2fcbe21204707351e2?width=1200&format=jpeg", "category": "هوش مصنوعی مولد", "tags": ["فناوری", "نوآوری"], "datetime_fa": "۲۲ آبان • ۱۷:۳۶"}, {"source": "Business Insider", "title": "I binged 100 TikToks in an hour at a movie theater — and had some surprisingly deep feelings about it", "link": "https://www.businessinsider.com/creator-max-zavidow-screening-hundreds-tiktok-videos-nyc-movie-theater-2026-11", "summary": "Content creator Max Zavidow screened over 300 of his TikToks on the big screen at Cherry Lane Theatre. Michelle Paradis I spent my Wednesday afternoon bingeing one creator's TikToks in a movie theater. Max Zavidow, a New York-based comedian and content creator, screened over 300 of his TikToks. Zavidow wanted people \"to feel the agony\" of re-watching all his videos — and see his career arc. One hour, 100 TikToks, one big screen. That's how I spent my lunch break on Wednesday. Max Zavidow , a New York-based content creator with 1.4 million TikTok followers, booked the historic Cherry Lane Theatre to screen more than 300 of his TikToks. Perched in the front row with a camera livestreaming his reactions, Zavidow watched (almost) every single video he's made in the past five years flash before his eyes. He cringed, laughed, and reflected on his career. Zavidow s live reactions to his own TikToks: cringing and laughing. Max Zavidow \"It is hard to watch your old work,\" he told me. The screening was, in part, a parody of Shia LaBeouf's \"#ALLMYMOVIES,\" in which the actor livestreamed himself for 72 hours watching his films in 2015. Zavidow, who started posting TikToks at the end of 2021, wanted the screening to \"paint a complete picture\" of what it means to have a career as a content creator and \"evolve on the internet.\" \"I wanted people to feel the agony of me having to look back,\" he said. The whole ordeal took four hours. I staye       media: [{"source": "Billboard", "title": "Ye Lawsuit: Musician Says He Was Locked in Wyoming HS to Write ‘Nebuchadnezzar’ Opera", "link": "https://www.billboard.com/pro/kanye-west-opera-lawsuit-musician-alleges-locked-wyoming-hs/", "summary": "Ye (the artist formerly known as Kanye West ) is facing a new lawsuit that claims an opera musician was locked inside a Wyoming high school band room to create his biblical opera Nebuchadnezzar . In a case filed Wednesday (Nov. 11) in federal court, Chase Taylor claims that the controversial rapper hired him to perform in the show, but later revealed that he would need to compose the entire opera from scratch. Related Ye Ty Dolla $ign Stole Vultures 1 Sample From Longtime Friend, Lawsuit Claims CL Signs With THEBLACKLABEL, Reuniting With Longtime Producer Teddy For Full Circle Moment Severe Weather, Radius Clauses and Finding the Next Generation of Festival Headliners: It s a Year-by-Year Fight to Stay Alive In a strange twist, Taylor alleges the star flew him to a Wyoming high school and that he was not allowed to leave: “Defendants locked the door and ordered Taylor to work until the opera was done.” “Taylor objected to the abusive conditions and asked defendants (through [a staffer]) to unlock the band room doors, provide sufficient food and water, and provide appropriate time off for the musicians to sleep,” Taylor’s lawyers write in the court filings, obtained by Billboard . “Defendants ignored these requests.” A spokesman for Ye did not immediately return a request for comment from Billboard on Friday (Nov. 13). The case is a civil lawsuit and the rapper has not been accused of any criminal wrongdoing. Nebuchadnezzar , based on the based on the biblical story of that ancient king, premiered in November 2019 at the Hollywood Bowl in Los Angeles. The opera, which ran just 45 minutes, was met with negative reviews (the Los Angeles Times called it a Nebuchadsnoozer ) and was performed only once. In his lawsuit, Taylor سبی را برای خواب نوازندگان فراهم کنند. متهمان این درخواست ها را نادیده گرفتند. سخنگوی Ye فوراً در روز جمعه (13 نوامبر) درخواستی برای اظهار نظر از بیلبورد نداد. این پرونده یک دعوی مدنی است و خواننده رپ به هیچ تخلف کیفری متهم نشده است. Nebuchadnezzar، بر اساس داستان کتاب مقدس آن پادشاه باستانی، در نوامبر 2019 در هالیوود بول در لس آنجلس به نمایش درآمد. این اپرا که فقط 45 دقیقه اجرا شد، با نقدهای منفی مواجه شد (لس آنجلس تایمز آن را", "image_url": "https://www.billboard.com/wp-content/uploads/2026/11/2303590348-e1794586174885.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["موسیقی"], "datetime_fa": "۲۲ آبان • ۲۰:۱۴"}, {"source": "Billboard", "title": "Bono Says Dolly Parton ‘Sang Herself to Some Other Place’ on the New U2 Song ‘Torn’: ‘It Feels Like a Prayer … For America’", "link": "https://www.billboard.com/music/rock/bono-dolly-parton-u2-torn-prayer-america-kimmel-watch-1236381702/", "summary": "In life, Dolly Parton always looked for ways to bring people together. In death, it seems, her work carries on. The members of U2 sat on the Jimmy Kimmel Live! couch on Thursday night (Nov. 12) to discuss their new album , Carnaval de Luz , whose final track, Torn , features the last-ever vocals recorded by Parton, who died at 80 on Aug. 25 after a brief battle with cancer. Is there anyone else that the whole world is going to agree upon other than Dolly?, Bono said about the universal outpouring of love and devotion that followed Parton s passing earlier this year. Dolly Parton is a mythical figure who actually existed recently, he continued. And our hearts are broken by this, but we are also blessed to be given her last vocal. Bono said the group very much wanted to work with Parton and they pitched her a few ideas, including a kind of folky thing called Lifelong that he described as a dizzy, drunken marriage song. Dipping into his best/worst Tennessee accent, Bono said Parton told the group that it was perhaps, a little too Irish for me if that s okay.' Instead, Parton said she had a song she d started and was happy to let U2 tinker, adding that she was excited to see where they d take it. The implication here, of course, is, if I don t like where you take it, it will never see the light of day,' Bono said of Parton s thrown gauntlet. Guitarist The Edge said it was a real shock that Parton was willing to put her musical destiny in their hands because they were aiming for something kind of sci-fi country and she was really game to play along. In the end, Bono called the experience a master class, recalling being blown away by Parton s range as she sang herself to some other place on the tune. We are told that she did not know that she was that ill. But it s her last prayer in a way was this song, Bono said. It feels like a prayer, and I think it s for America, but I think it s for anywhere where there s a divided politics. The meditative track opens with Parton s plaintive vocals as she wonders, What am I supposed to do?/ And how am I supposed to choose?/ I love them both and I just feel so torn. The lines are prophetic, Bono said, predicting that there will be plenty of loud conversations and possible shouting matches at the Thanksgiving table this year after a bitter midterm campaign season. He noted that Parton has a line in the song that goes, Nothing hurts a mother more than a family at war, which perfectly sums up the anxiety of the times we re liv", "date_str": "2026-11-13T16:22:41+00:00", "hash": "19b9e272f9a6bc70", "title_fa": "بونو می‌گوید دالی پارتون «خودش را به جای دیگری خواند» در آهنگ جدید U2 «Torn»: «این احساس می‌کند یک دعا… برای آمریکا»", "summary_fa": "دالی پارتون در زندگی همیشه به دنبال راه هایی برای گرد هم آوردن مردم بود. در مرگ، به نظر می رسد، کار او ادامه دارد. اعضای U2 در برنامه زنده جیمی کیمل نشستند! پنج شنبه شب (12 نوامبر) برای بحث در مورد آلبوم جدید خود، Carnaval de Luz، که آخرین آهنگ آن، Torn، آخرین آواز ضبط شده توسط پارتون، که در 80 سالگی در 25 آگوست پس از یک مبارزه کوتاه با سرطان درگذشت، را در خود جای داده است. بونو در مورد هجوم جهانی عشق و فداکاری که پس از مرگ پارتون در اوایل سال جاری رخ داد، گفت: آیا کس دیگری وجود دارد که تمام دنیا با او موافق باشند؟ او ادامه داد: دالی پارتون یک شخصیت افسانه‌ای است که اخیراً وجود داشته است. و قلب ما از این بابت شکسته است، اما از اینکه آخرین آواز او به ما داده می شود، خوشبختیم. بونو گفت که گروه خیلی می‌خواستند با پارتون کار کنند و ایده‌هایی را برای او مطرح کردند، از جمله نوعی چیز عامیانه به نام مادام العمر که او آن را به عنوان آهنگ ازدواج سرگیجه‌آور و مستی توصیف کرد. بونو با فرو بردن بهترین/بدترین لهجه تنسی خود، گفت که پارتون به گروه گفت که شاید برای من کمی ایرلندی باشد. در عوض، پارتون گفت که آهنگی دارد که خودش شروع کرده است و خوشحال است که به U2 اجازه داده است که سرهم کند، و اضافه کرد که از اینکه ببیند آن را به کجا می برند هیجان زده است. بونو در مورد دستکش پرتاب شده توسط پارتون گفت، البته مفهوم اینجا این است که اگر من آن را دوست نداشته باشم، هرگز روشنایی روز را نخواهد دید. گیتاریست The Edge گفت که این یک شوک واقعی بود که پارتون مایل بود سرنوشت موسیقایی خود را در دستان آنها بگذارد، زیرا آنها به دنبال", "image_url": "https://www.billboard.com/wp-content/uploads/2026/11/u2-jimmy-kimmel-carnaval-de-luz-billboard-1800.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["موسیقی"], "datetime_fa": "۲۲ آبان • ۱۹:۵۲"}, {"source": "Billboard", "title": "Robyn Slams Eurovision: ‘It’s So Embarrassing’", "link": "https://www.billboard.com/music/music-news/robyn-slams-eurovision-so-embarrassing-1236381695/", "summary": "Robyn definitely doesn t get any dopamine from Eurovision . Related Every Eurovision Song to Chart on the Billboard Hot 100: ABBA, Rosa Linn More Dara s Bangaranga Wins Eurovision 2026 for Bulgaria Eurovision Song Contest Launching Asian Edition in 2026 While speaking to Amy Poehler on the latest episode of the comedian s Good Hang podcast, which dropped Nov. 10, the Swedish pop star did not hold back when asked for her thoughts on the 70-year-old international song competition. Oof, Robyn began. I mean, we don’t have ABBA anymore, so I don’t really watch Eurovision , she continued, informing Poehler that the Swedish quartet indeed won Eurovision in 1974 with Billboard Hot 100 No. 6 smash Waterloo. Hard to beat. Then we had Carola [Häggkvist], both me and Zara [Larsson] grew up listening to her — amazing artist, Robyn continued. Now it’s just s t It’s so embarrassing. It really is embarrassing.” She added, After watching it, I feel overstimulated in a bad way. Billboard has reached out to Eurovision for comment. The interview came shortly before the Coachella 2027 lineup was announced . The annual music festival features Robyn on a bill headlined by SZA, Dua Lipa and Tame Impala. She ll play on both Saturdays of the two-weekend festival, as will Phoebe Bridgers, Weezer, ADÉLA, Role Model and — funnily enough — Måneskin, which won Eurovision in 2021 with Zitti e Buoni. Though the Dancing on My Own singer didn t get into specifics on what she doesn t like about Eurovision , she s far from the first to criticize the televised European Broadcast Union competition in recent years. Multiple countries withdrew from this year s iteration after Eurovision announced that Israel would be permitted to compete, despite the country s war on Hamas killing tens of thousands of Palestinians over the last three years in what the United Nations has characterized as a genocide, which Israel denies. Robyn s most recent album, Sexistentialism , dropped in March, peaking at No. 7 on the Billboard T op Dance Albums chart. Watch Robyn s full conversation with Poehler above.", "date_str": "2026-11-13T16:11:46+00:00", "hash": "72f3b8525b2ceb9c", "title_fa": "رابین به یوروویژن انتقاد می کند: \"خیلی شرم آور است\"", "summary_fa": "رابین قطعا هیچ دوپامینی از یوروویژن دریافت نمی کند. مرتبط با هر آهنگ یوروویژن به نمودار در بیلبورد Hot 100: ABBA، Rosa Linn بیشتر Dara s Bangaranga برنده یوروویژن 2026 برای بلغارستان شد. افکار او در مورد مسابقه بین المللی آهنگ 70 ساله. اوف، رابین شروع کرد. منظورم این است که ما دیگر ABBA ندار
